id: LESSON.ONE_STEP
skill_id: MATH.ALG.LIN1.SOLVE_ONE_STEP
title:
  en: One step to find x
source_ref: NOTE.LIN1.ONE_STEP
status: draft
beats:
- kind: predict
  prompt:
    en: The balance is level. How heavy is one box?
  figure:
    left_boxes: 1
    left_weights: 5
    right_boxes: 0
    right_weights: 9
    box_weight: 4
  choices:
  - value: '3'
    text:
      en: 3 kg
  - value: '4'
    text:
      en: 4 kg
  - value: '5'
    text:
      en: 5 kg
  - value: '9'
    text:
      en: 9 kg
  reveal:
    en: Keep that guess in mind. Now you will check it.
- kind: explore
  title:
    en: Try it on the balance
  widget:
    type: balance_scale
    widget_id: W.ONE_STEP.BALANCE
    prompt:
      en: 'Tap weights to take them off. Keep it level. Goal: the box alone on the
        left.'
    success:
      en: The box balances 4 weights, so x = 4.
    hint:
      en: Take the same number of weights off both sides.
    params:
      left_boxes: 1
      left_weights: 5
      right_boxes: 0
      right_weights: 9
      box_weight: 4
- kind: explain_scene
  title:
    en: Watch it worked out
  scene:
    canvas:
      width: 340
      height: 290
    steps:
    - caption:
        en: 'One box and 5 weights balance 9 weights. In maths: x + 5 = 9.'
      actions:
      - kind: write_text
        x: 170
        y: 52
        size: 36
        text: x + 5 = 9
    - caption:
        en: Take 5 weights off both sides, so it stays level.
      actions:
      - kind: write_text
        x: 152
        y: 112
        size: 22
        text: − 5
        color: red
      - kind: write_text
        x: 244
        y: 112
        size: 22
        text: − 5
        color: red
    - caption:
        en: Yes. The box balances 4 weights.
      actions:
      - kind: pause_and_ask
        question:
          en: After taking 5 off both sides, what is left on the right?
        options:
        - text:
            en: '4'
          correct: true
        - text:
            en: '14'
          correct: false
          feedback:
            en: 'We took 5 away, so we subtract: 9 − 5.'
        - text:
            en: '5'
          correct: false
          feedback:
            en: That is what we took off, not what is left.
      - kind: write_text
        x: 170
        y: 170
        size: 36
        text: x = 4
      - kind: highlight
        x: 116
        y: 136
        w: 108
        h: 44
    - caption:
        en: 'Check: put 4 back in. 4 + 5 = 9. It balances.'
      actions:
      - kind: write_text
        x: 170
        y: 250
        size: 17
        text: 'check: 4 + 5 = 9 ✓'
        color: green
    id: SCENE.ONE_STEP.EXPLAIN
    skill_id: MATH.ALG.LIN1.SOLVE_ONE_STEP
    source_ref: NOTE.LIN1.ONE_STEP
    alt:
      en: Whiteboard showing x + 5 = 9 solved in one step
  final_caption:
    en: 'One step: undo the + 5 by taking 5 off both sides.'
- kind: worked_example
  title:
    en: Another one
  problem:
    en: Solve x − 7 = 3.
  steps:
  - en: 'Add 7 to both sides to undo the − 7: x = 10.'
  - en: 'Check: 10 − 7 = 3. It balances.'
- kind: check
  prompt:
    en: Now solve one yourself.
