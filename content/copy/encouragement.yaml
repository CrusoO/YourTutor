# Encouragement shown only on a trigger (hard success, recovery after a failure, session end).
# Process praise only: name the strategy or effort, never the person, never after an easy item.
# Every text must stay within the smallest grade-band word limit (config/grade_bands.yaml).
# English is authored; other languages are filled by a reviewer and fall back to English.
variants:
  - id: checked_the_answer
    trigger: hard_success
    status: draft
    text:
      en: That was a hard one, and you checked your answer. That is a strong habit.
      ne: <Nepali — to be filled by reviewer>
      as: <Assamese — to be filled by reviewer>
  - id: worked_step_by_step
    trigger: hard_success
    status: draft
    text:
      en: You worked through that step by step. That is how hard questions get solved.
      ne: <Nepali — to be filled by reviewer>
      as: <Assamese — to be filled by reviewer>
  - id: kept_trying
    trigger: recovery
    status: draft
    text:
      en: You kept going after a tough one, and it paid off.
      ne: <Nepali — to be filled by reviewer>
      as: <Assamese — to be filled by reviewer>
  - id: tried_a_new_way
    trigger: recovery
    status: draft
    text:
      en: You tried again a different way. That is how you get unstuck.
      ne: <Nepali — to be filled by reviewer>
      as: <Assamese — to be filled by reviewer>
  - id: steady_work
    trigger: session_end
    status: draft
    text:
      en: Nice steady work today. Every question you tried moved you forward.
      ne: <Nepali — to be filled by reviewer>
      as: <Assamese — to be filled by reviewer>
  - id: come_back_anytime
    trigger: session_end
    status: draft
    text:
      en: That is a good place to stop. Come back whenever you are ready.
      ne: <Nepali — to be filled by reviewer>
      as: <Assamese — to be filled by reviewer>
