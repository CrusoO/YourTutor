difficulty: 0.6
pool: practice
role: apply
stem:
  en: At a synapse a chemical messenger carries the signal across the narrow gap to the next neuron. What is this messenger called?
hints:
- level: 1
  en: Think about the name that combines transmit with a chemical root.
- level: 2
  en: Consider which messenger works across a very small gap.
- level: 3
  en: The messenger is released by the nerve, not by the blood.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
