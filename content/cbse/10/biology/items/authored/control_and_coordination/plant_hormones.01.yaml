difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which plant hormone is mainly responsible for promoting cell elongation and for bending shoots towards light?
hints:
- level: 1
  en: Think about the hormone produced at the growing tip of a shoot.
- level: 2
  en: Consider which hormone responds to light and causes shoot bending.
- level: 3
  en: It is not the hormone that mainly promotes cell division.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
