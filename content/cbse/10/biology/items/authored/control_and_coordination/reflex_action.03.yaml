id: A.10.biology.control_and_coordination.reflex_action.03
skill_ids:
- SK.A.10.biology.reflex_action
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does a knee-jerk reflex happen without the brain directly deciding the response?
hints:
- level: 1
  en: Think about where the reflex arc turns the impulse around.
- level: 2
  en: Consider which organ is the first point of processing in a reflex.
- level: 3
  en: Reflexes do not need the sight of the stimulus.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The stimulus is processed by the eye before it reaches the leg
- id: b
  en: The hormone adrenaline triggers the leg movement
- id: c
  en: The muscle is stimulated directly by the brain through a separate pathway
- id: d
  en: The reflex arc passes through the spinal cord, so the response is initiated there
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.9C4A91006813
  when_answer_equals:
  - a
- id: MC.A.AA399FB448AC
  when_answer_equals:
  - c
- id: MC.A.CE4786B0408D
  when_answer_equals:
  - b
solution_steps:
- en: In a knee-jerk reflex, the sensory neuron synapses in the spinal cord with a motor neuron, so the response is initiated without going to the brain.
- en: The brain is informed afterwards.
- en: The correct option is d.
tier: C
diagram_note: 'Draw a reflex arc for the knee-jerk: a receptor in the tendon below the kneecap, a sensory neuron going up to the spinal cord, a relay or direct synapse in the cord, a motor neuron to the thigh muscle, with arrows showing the direction of the impulse.'
