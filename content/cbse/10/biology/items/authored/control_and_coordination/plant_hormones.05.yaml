difficulty: 0.9
pool: practice
role: apply
stem:
  en: When the growing tip of a plant shoot is removed, side buds start to grow. Which hormone is most directly reduced by this removal?
hints:
- level: 1
  en: The growing tip is the main source of this hormone.
- level: 2
  en: Think about the hormone that suppresses lateral buds.
- level: 3
  en: Consider which hormone was linked to bending and elongation in earlier questions.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
