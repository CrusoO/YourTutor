stem:
  en: A signal travels a total path of 2.5 m along nerve fibres in 0.05 s during a reflex. What is the average speed of the signal in metres per second?
hints:
- level: 1
  en: Average speed is distance divided by time.
- level: 2
  en: Check the units of the distance and time given.
- level: 3
  en: Divide 2.5 by 0.05.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
