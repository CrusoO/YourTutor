stem:
  en: A nerve impulse travels 2.0 m along an axon in 0.004 s. What is the speed of the impulse in metres per second?
hints:
- level: 1
  en: Speed is distance travelled divided by time taken.
- level: 2
  en: Write down the distance and the time with their units.
- level: 3
  en: Divide the distance by the time.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '500'
  accept: []
solution_steps:
- en: Speed is distance divided by time, so 2.0 m divided by 0.004 s gives 500 m/s.
- en: This is a simple illustrative figure, not a measured value for a particular nerve.
- en: The unit of the answer is m/s.
- en: Answer = 500
