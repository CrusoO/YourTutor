difficulty: 0.6
pool: practice
role: apply
stem:
  en: Seeds of a plant remain dormant during dry conditions. Which plant hormone most likely maintains this dormancy?
hints:
- level: 1
  en: Think about the plant hormone that acts as a growth inhibitor.
- level: 2
  en: Consider which hormone rises during stress such as drought.
- level: 3
  en: The hormone you want acts against germination.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
