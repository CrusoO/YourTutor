id: A.10.biology.control_and_coordination.nervous_system.03
skill_ids:
- SK.A.10.biology.nervous_system
difficulty: 0.6
pool: practice
role: explain
stem:
  en: What is the role of the myelin sheath around an axon?
hints:
- level: 1
  en: Think about why a wire is covered with an insulating material.
- level: 2
  en: Consider what the gaps in the sheath allow the impulse to do.
- level: 3
  en: The sheath affects speed, not the chemical release.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It joins two neurons together to form a synapse
- id: b
  en: It insulates the axon and speeds up the conduction of impulses
- id: c
  en: It produces the chemical messenger that crosses the synapse
- id: d
  en: It stops impulses from leaving the cell
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.034228DB93EE
  when_answer_equals:
  - c
- id: MC.A.6094A6D5AADF
  when_answer_equals:
  - d
- id: MC.A.DECF6DB94B22
  when_answer_equals:
  - a
solution_steps:
- en: Myelin is a fatty insulating layer formed by Schwann cells in the peripheral nervous system.
- en: It makes the impulse jump between the gaps called nodes of Ranvier, which speeds conduction.
- en: The correct option is b.
tier: C
diagram_note: Draw a neuron showing dendrites, the cell body with its nucleus, a long axon with myelin sheath segments and the nodes of Ranvier between them, and the axon terminals at the end.
