id: A.10.biology.control_and_coordination.reflex_action.01
skill_ids:
- SK.A.10.biology.reflex_action
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is a reflex action?
hints:
- level: 1
  en: Think about a response you do before you realise it.
- level: 2
  en: Consider whether the response is voluntary or automatic.
- level: 3
  en: Reflexes are fast because they bypass deliberate thought.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A slow response carried by hormones in the blood
- id: b
  en: A rapid, automatic response to a stimulus that does not need conscious thought
- id: c
  en: A response that is planned after careful thought about the stimulus
- id: d
  en: A response that happens only in plants
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.6660A47F9344
  when_answer_equals:
  - c
- id: MC.A.28E63A1B6B38
  when_answer_equals:
  - a
- id: MC.A.74C2E88055F0
  when_answer_equals:
  - d
solution_steps:
- en: A reflex is a quick, involuntary response that protects the body, such as withdrawing a hand from a hot object.
- en: It is carried out along a reflex arc without waiting for conscious processing.
- en: The correct option is b.
tier: C
