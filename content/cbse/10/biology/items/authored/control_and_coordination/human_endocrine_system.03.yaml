solution_steps:
- en: Thyroxine contains iodine, so a shortage of iodine in the diet can lead to a swollen thyroid, called goitre.
- en: Iron is needed for haemoglobin, not thyroxine.
- en: The correct option is d.
tier: C
diagram_note: 'Draw an outline of the human body with the main endocrine glands labelled: the pituitary below the brain, the thyroid at the front of the neck, the adrenal glands above the kidneys, the pancreas near the stomach, and the ovaries or testes in the pelvis or scrotum.'
