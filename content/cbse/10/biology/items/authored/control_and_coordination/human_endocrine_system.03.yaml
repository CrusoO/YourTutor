difficulty: 0.6
pool: practice
role: explain
stem:
  en: Which element must be present in the diet for the thyroid gland to make its hormone thyroxine?
hints:
- level: 1
  en: Think about the element that is added to salt to prevent a goitre.
- level: 2
  en: Consider which element forms part of the thyroid hormone.
- level: 3
  en: The element is a halogen used in diets to prevent goitre.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
