id: A.10.biology.control_and_coordination.reflex_action.04
skill_ids:
- SK.A.10.biology.reflex_action
difficulty: 0.6
pool: practice
role: apply
stem:
  en: When a hand touches a hot object and is withdrawn, which part of the reflex arc is the effector?
hints:
- level: 1
  en: Ask what actually moves the arm.
- level: 2
  en: The effector is the last link in the arc.
- level: 3
  en: The receptor detects, it does not respond.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The receptor in the skin
- id: b
  en: The sensory neuron
- id: c
  en: The relay neuron in the spinal cord
- id: d
  en: The muscle of the arm
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.BDB1879430DE
  when_answer_equals:
  - a
- id: MC.A.920CB5488FA6
  when_answer_equals:
  - c
- id: MC.A.84DC65981C53
  when_answer_equals:
  - b
solution_steps:
- en: The effector is the organ that carries out the response, here the muscle that pulls the arm away.
- en: The skin receptor detects the stimulus and the neurons transmit the signal.
- en: The correct option is d.
tier: C
