stem:
  en: Which hormone produced by the pancreas lowers the level of glucose in the blood?
hints:
- level: 1
  en: This hormone is secreted by the beta cells of the pancreas.
- level: 2
  en: Think about the hormone that helps cells take in sugar.
- level: 3
  en: The hormone is the one that reduces blood sugar, not raises it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
