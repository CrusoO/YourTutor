id: A.10.biology.control_and_coordination.reflex_action.02
skill_ids:
- SK.A.10.biology.reflex_action
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which option gives the correct order of components in a reflex arc?
hints:
- level: 1
  en: Start with the part that detects the stimulus.
- level: 2
  en: Remember that the sensory neuron carries impulses towards the spinal cord.
- level: 3
  en: The effector is the last component in the arc.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Receptor, motor neuron, relay neuron, sensory neuron, effector
- id: b
  en: Receptor, sensory neuron, relay neuron in the spinal cord, motor neuron, effector
- id: c
  en: Effector, motor neuron, relay neuron, sensory neuron, receptor
- id: d
  en: Receptor, sensory neuron, brain, motor neuron, effector
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.2838E28782D3
  when_answer_equals:
  - c
- id: MC.A.1FD79C9926DA
  when_answer_equals:
  - a
- id: MC.A.16FF77799BFE
  when_answer_equals:
  - d
solution_steps:
- en: The stimulus is detected by a receptor, carried by a sensory neuron to the spinal cord, passed through a relay neuron, and then sent by a motor neuron to an effector that responds.
- en: The correct option is b.
tier: C
