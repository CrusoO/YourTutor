id: A.10.biology.control_and_coordination.reflex_action.05
skill_ids:
- SK.A.10.biology.reflex_action
difficulty: 0.9
pool: practice
role: explain
stem:
  en: Why is a reflex action faster than a response that goes through the brain?
hints:
- level: 1
  en: Think about how many neurons and junctions the impulse passes through.
- level: 2
  en: Consider whether the impulse waits for a decision.
- level: 3
  en: Compare the length of the two pathways.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Reflexes travel through the blood, which is quicker than nerves
- id: b
  en: Muscles respond faster when they receive no hormones
- id: c
  en: It uses a short path with few synapses and does not wait for conscious processing
- id: d
  en: Impulses travel faster in the brain than in the spinal cord
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.6E954CC99544
  when_answer_equals:
  - a
- id: MC.A.D89CDB5A59C0
  when_answer_equals:
  - d
- id: MC.A.2999532B3D17
  when_answer_equals:
  - b
solution_steps:
- en: A reflex arc passes through the spinal cord with only a few neurons and synapses, so the impulse is processed quickly.
- en: A response routed through the brain adds more synapses and conscious processing.
- en: The correct option is c.
tier: C
diagram_note: 'Draw two pathways side by side: a short reflex arc with three neurons through the spinal cord, and a longer pathway going up to the brain and back down, with the synapses marked.'
