difficulty: 0.6
pool: practice
role: explain
stem:
  en: How does an amoeba take in its food?
hints:
- level: 1
  en: Think about how the amoeba changes its shape.
- level: 2
  en: Consider whether the food particle is small enough to diffuse.
- level: 3
  en: Think about where the digestion happens once the food is inside.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It uses chloroplasts in the cytoplasm to capture light for food
- id: b
  en: It absorbs large food particles directly through the cell membrane by diffusion
- id: c
  en: It pumps food through the nucleus into the cell
- id: d
  en: It engulfs food with pseudopodia and forms a food vacuole around it
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.4D0E01B035B5
  when_answer_equals:
  - b
- id: MC.A.8E7DB9DE84C2
  when_answer_equals:
