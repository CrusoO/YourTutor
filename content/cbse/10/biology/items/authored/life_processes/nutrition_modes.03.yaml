stem:
  en: A fungus grows on a slice of bread, releases digestive enzymes onto it, and then absorbs the digested food. Which mode of nutrition does this fungus show?
hints:
- level: 1
  en: Is the food source alive or dead?
- level: 2
  en: Notice that the enzymes are released before the food is taken in.
- level: 3
  en: Think about organisms that break down dead material in the environment.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
