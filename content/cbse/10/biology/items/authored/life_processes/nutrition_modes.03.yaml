  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Saprotrophic nutrition
- id: b
  en: Parasitic nutrition
- id: c
  en: Holozoic nutrition
- id: d
  en: Autotrophic nutrition
answer:
  sympy: a
  accept: []
