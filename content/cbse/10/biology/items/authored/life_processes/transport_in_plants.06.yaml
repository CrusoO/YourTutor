id: A.10.biology.life_processes.transport_in_plants.06
skill_ids:
- SK.A.10.biology.transport_in_plants
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A potted plant takes in 500 mL of water from its soil in a day and loses 420 mL as water vapour from its leaves. Ignore the small amount used in photosynthesis. How many millilitres of water are retained by the plant that day?
hints:
- level: 1
  en: Decide which quantity is water coming in and which is water going out.
- level: 2
  en: The question asks for what stays in the plant.
- level: 3
  en: Subtract the amount lost from the amount absorbed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '80'
  accept: []
solution_steps:
- en: The water retained is the water absorbed minus the water lost, so 500 mL minus 420 mL gives 80 mL.
- en: The question tells us to ignore water used in photosynthesis.
- en: The unit of the answer is mL.
- en: Answer = 80
tier: C
