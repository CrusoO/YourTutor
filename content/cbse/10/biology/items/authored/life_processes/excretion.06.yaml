stem:
  en: The kidneys filter 180 L of fluid per day and produce 1.5 L of urine. Using only these two values, how many litres of the filtered fluid are reabsorbed in a day?
hints:
- level: 1
  en: Reabsorbed fluid is what was filtered but did not leave as urine.
- level: 2
  en: Identify the filtered volume and the urine volume.
- level: 3
  en: Subtract the urine volume from the filtered volume.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '178.5'
  accept: []
solution_steps:
- en: The reabsorbed volume is the filtered volume minus the urine volume, so 180 L minus 1.5 L gives 178.5 L.
- en: The real figures vary, so this uses the values given.
- en: The unit of the answer is L.
- en: Answer = 178.5
tier: C
