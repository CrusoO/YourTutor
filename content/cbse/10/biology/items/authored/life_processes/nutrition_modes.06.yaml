id: A.10.biology.life_processes.nutrition_modes.06
skill_ids:
- SK.A.10.biology.nutrition_modes
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: In one day a plant makes 180 g of glucose by photosynthesis and uses 60 g of glucose in respiration. What is its net gain of glucose in grams for that day?
hints:
- level: 1
  en: Net means what is left after subtracting one quantity from another.
- level: 2
  en: Identify which value is glucose made and which is glucose used.
- level: 3
  en: Subtract the smaller value from the larger one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '120'
  accept: []
solution_steps:
- en: Net gain is the glucose made minus the glucose used, so 180 g minus 60 g gives 120 g.
- en: This assumes the 60 g is all the respiration glucose used that day.
- en: The unit of the answer is g.
- en: Answer = 120
tier: C
