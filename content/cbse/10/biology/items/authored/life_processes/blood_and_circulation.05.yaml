id: A.10.biology.life_processes.blood_and_circulation.05
skill_ids:
- SK.A.10.biology.blood_and_circulation
difficulty: 0.9
pool: practice
role: explain
stem:
  en: The pulmonary vein carries oxygen-rich blood, yet it is still called a vein. What is the correct reason?
hints:
- level: 1
  en: Consider what defines a vein in terms of direction, not content.
- level: 2
  en: Think about which chamber the pulmonary vein enters.
- level: 3
  en: Ask which direction the blood flows along that vessel.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It carries blood away from the heart, like an artery
- id: b
  en: It carries lymph rather than blood
- id: c
  en: A vein is defined by carrying blood towards the heart, and the pulmonary vein does this
- id: d
  en: Veins always carry deoxygenated blood, so the label must be wrong
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.5C623D97041A
  when_answer_equals:
  - d
- id: MC.A.810489E093C5
  when_answer_equals:
  - a
- id: MC.A.296512CF28D6
  when_answer_equals:
  - b
solution_steps:
- en: Veins are classified by the direction of blood flow towards the heart, not by the oxygen content.
- en: The pulmonary vein is an exception to the usual oxygen pattern, not to the definition.
- en: The correct option is c.
tier: C
diagram_note: Draw the heart with the pulmonary veins entering the left atrium from the lungs, and the pulmonary artery leaving the right ventricle to the lungs, with arrows showing the direction of blood flow.
