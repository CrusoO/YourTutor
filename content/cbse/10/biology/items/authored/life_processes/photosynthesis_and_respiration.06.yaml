stem:
  en: A leaf makes 24 mg of glucose in 1 hour of photosynthesis in bright light. If the rate stays constant, how many milligrams of glucose does the leaf make in 2.5 hours?
hints:
- level: 1
  en: Find out how much glucose is made in one hour first.
- level: 2
  en: Decide whether the total is a multiple or a fraction of the hourly amount.
- level: 3
  en: Multiply the hourly amount by the number of hours.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
