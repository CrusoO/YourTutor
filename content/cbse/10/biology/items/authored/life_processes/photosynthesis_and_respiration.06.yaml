  author: model-draft
type: numeric
answer:
  sympy: '60'
  accept: []
solution_steps:
- en: At a constant rate, the amount made is the rate multiplied by the time, so 24 mg per hour times 2.5 hours gives 60 mg.
- en: The unit of the answer is mg.
- en: Answer = 60
