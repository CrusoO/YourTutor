  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Autotrophic nutrition
- id: b
  en: Heterotrophic nutrition
- id: c
  en: Mineral absorption only
- id: d
  en: Photosynthetic nutrition only
answer:
  sympy: b
  accept: []
