stem:
  en: Which term describes a mode of nutrition in which an organism takes in ready-made organic food and digests it?
hints:
- level: 1
  en: Compare this mode with the one in which an organism makes its own food.
- level: 2
  en: Think about where the energy-rich food comes from.
- level: 3
  en: The term starts with the prefix that means 'other'.
prediction_prompt:
