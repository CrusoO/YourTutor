id: A.10.biology.life_processes.photosynthesis_and_respiration.04
skill_ids:
- SK.A.10.biology.photosynthesis_and_respiration
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does a plant need respiration even though it makes its food by photosynthesis?
hints:
- level: 1
  en: Think about what cells need energy to do.
- level: 2
  en: Ask where the energy stored in glucose is released.
- level: 3
  en: Consider whether respiration makes glucose or uses it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: To convert sunlight directly into stored starch
- id: b
  en: To make the glucose needed for photosynthesis
- id: c
  en: To release energy from glucose for growth and other cell activities
- id: d
  en: To store the oxygen made during photosynthesis
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.CB99D94C88AB
  when_answer_equals:
  - b
- id: MC.A.C42B72375578
  when_answer_equals:
  - d
- id: MC.A.36D4766767CA
  when_answer_equals:
  - a
solution_steps:
- en: Respiration releases the energy stored in glucose so the cell can carry out growth, transport and repair.
- en: Photosynthesis is what makes the glucose in the first place.
- en: The correct option is c.
tier: C
