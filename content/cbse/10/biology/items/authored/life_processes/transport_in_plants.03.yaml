id: A.10.biology.life_processes.transport_in_plants.03
skill_ids:
- SK.A.10.biology.transport_in_plants
difficulty: 0.6
pool: practice
role: explain
stem:
  en: What is the main force that pulls water up the xylem of a tall tree?
hints:
- level: 1
  en: Think about what happens at the surface of the leaf.
- level: 2
  en: Consider the process that loses water as vapour from the leaves.
- level: 3
  en: Water is pulled, not pushed, in the xylem.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Active pumping of water by living root cells all the way up the trunk
- id: b
  en: Osmotic pressure in the phloem sending water to the leaves
- id: c
  en: Gravity pulling water down, so the roots push it upward
- id: d
  en: Transpiration pull created by water evaporating from the leaves
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.07B1D6A09857
  when_answer_equals:
  - a
- id: MC.A.8B8114E1AF4D
  when_answer_equals:
  - c
- id: MC.A.B01926E5D7F2
  when_answer_equals:
  - b
solution_steps:
- en: Water evaporates from the leaves through stomata, creating a pull that draws a continuous column of water up the xylem.
- en: Root pressure contributes only a little in tall trees.
- en: The correct option is d.
tier: C
diagram_note: Draw a leaf with open stomata showing water vapour leaving, and a continuous xylem tube running from the root tip up to the leaf with arrows pointing upward. Label the stomata, the xylem and the root hair zone.
