stem:
  en: In which blood vessels does the exchange of oxygen and carbon dioxide between blood and body cells take place most directly?
hints:
- level: 1
  en: Think about the smallest vessels in the body.
- level: 2
  en: Consider which vessel wall is thinnest.
- level: 3
  en: The exchange happens where blood moves slowly and walls are very thin.
