id: A.10.biology.life_processes.blood_and_circulation.03
skill_ids:
- SK.A.10.biology.blood_and_circulation
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why is the wall of the left ventricle thicker than the wall of the right ventricle?
hints:
- level: 1
  en: Compare how far the blood must travel from each ventricle.
- level: 2
  en: Think about which ventricle supplies the largest circuit.
- level: 3
  en: Thicker muscle is needed to generate higher pressure.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It pumps blood only to the lungs, so it needs more muscle
- id: b
  en: It stores extra blood between heartbeats
- id: c
  en: It pumps blood through the whole body, which needs a higher pressure
- id: d
  en: It generates the heartbeat for the whole heart
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.63950562E314
  when_answer_equals:
  - a
- id: MC.A.08B0A19F6FE5
  when_answer_equals:
  - b
- id: MC.A.E7EA8C5712D1
  when_answer_equals:
  - d
solution_steps:
- en: The left ventricle sends oxygenated blood to the whole body, which requires higher pressure than the short trip to the lungs.
- en: This is why its muscular wall is thicker.
- en: The correct option is c.
tier: C
diagram_note: Draw a labelled cross section of the human heart showing four chambers, the aorta leaving the left ventricle and the pulmonary artery leaving the right ventricle, with the wall of each ventricle marked.
