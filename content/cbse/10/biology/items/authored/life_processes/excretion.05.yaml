id: A.10.biology.life_processes.excretion.05
skill_ids:
- SK.A.10.biology.excretion
difficulty: 0.9
pool: practice
role: explain
stem:
  en: Which pair of vessels correctly describes the blood supply of a glomerulus?
hints:
- level: 1
  en: Recall which arteriole enters the capsule and which leaves.
- level: 2
  en: Think about how blood flows into the glomerulus from the renal artery.
- level: 3
  en: The glomerulus is a ball of capillaries between two arterioles.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A capillary network brings blood in and a lymph vessel takes it out
- id: b
  en: An afferent arteriole brings blood in and an efferent arteriole takes blood out
- id: c
  en: Two veins bring blood in and one artery takes blood out
- id: d
  en: A renal vein brings blood in and a renal artery takes blood out
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.47D82F6C2D8D
  when_answer_equals:
  - d
- id: MC.A.6D12EBB666AD
  when_answer_equals:
  - c
- id: MC.A.79A1E548AC08
  when_answer_equals:
  - a
solution_steps:
- en: Blood enters the glomerulus through the wider afferent arteriole and leaves through the narrower efferent arteriole, which helps build the pressure needed for filtration.
- en: The correct option is b.
tier: C
diagram_note: Draw the glomerulus inside Bowman's capsule with the afferent and efferent arterioles labelled, and arrows showing blood flowing in and out.
