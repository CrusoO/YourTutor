id: A.10.biology.life_processes.transport_in_plants.04
skill_ids:
- SK.A.10.biology.transport_in_plants
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A complete ring of bark, including the phloem, is removed from around a woody stem. Which change will be seen first?
hints:
- level: 1
  en: Identify which vascular tissue lies just under the bark.
- level: 2
  en: Think about where the sugars made in the leaves travel to.
- level: 3
  en: Consider what a blockage of the food pathway would cause above it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The roots receive more food from the leaves
- id: b
  en: Sugars build up above the ring and the tissue just above it swells
- id: c
  en: The plant loses all its xylem immediately
- id: d
  en: Water stops reaching the leaves at once
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.06FBDF9260A4
  when_answer_equals:
  - d
- id: MC.A.19643D674A6F
  when_answer_equals:
  - a
- id: MC.A.6228EA8BC5F1
  when_answer_equals:
  - c
solution_steps:
- en: Removing the phloem interrupts the downward movement of sugars, so they accumulate above the cut.
- en: The xylem lies inside the ring and keeps carrying water for some time.
- en: The correct option is b.
tier: C
