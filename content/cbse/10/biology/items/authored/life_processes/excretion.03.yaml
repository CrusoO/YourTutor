role: explain
stem:
  en: In which part of the nephron does most reabsorption of useful substances like glucose and water take place?
hints:
- level: 1
  en: Find the part of the nephron that comes directly after Bowman's capsule.
- level: 2
  en: Think about where most of the filtrate is processed.
- level: 3
  en: Reabsorption happens after filtration, not during it.
