stem:
  en: A person's heart beats 72 times per minute and each beat pumps 70 mL of blood out of the left ventricle. How many litres of blood does the heart pump in one minute?
hints:
- level: 1
  en: Multiply the number of beats by the volume pumped per beat.
- level: 2
  en: The answer will be in millilitres first.
- level: 3
  en: Convert millilitres to litres by dividing by 1000.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5.04'
  accept: []
solution_steps:
- en: Blood pumped per minute is beats per minute multiplied by the volume per beat, so 72 times 70 mL gives 5040 mL.
- en: Dividing by 1000 gives 5.04 L.
- en: The unit of the answer is L.
- en: Answer = 5.04
tier: C
