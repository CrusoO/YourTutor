id: A.10.biology.our_environment.food_chains_and_webs.05
skill_ids:
- SK.A.10.biology.food_chains_and_webs
difficulty: 0.9
pool: practice
role: explain
stem:
  en: In a pond food web containing algae, small fish, large fish and herons, pesticide levels are rising. Which organism is likely to have the highest concentration of the pesticide?
hints:
- level: 1
  en: Think about which organism eats the most other organisms over time.
- level: 2
  en: Consider the level of the chain at which the pesticide is stored.
- level: 3
  en: The top predator is the one you should consider.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Small fish
- id: b
  en: Large fish
- id: c
  en: Heron
- id: d
  en: Algae
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.997643B170A0
  when_answer_equals:
  - d
- id: MC.A.F0FEB8271192
  when_answer_equals:
  - a
- id: MC.A.E027868B7617
  when_answer_equals:
  - b
solution_steps:
- en: Persistent pesticides accumulate along the food chain, so the organism at the top, the heron, usually has the highest concentration.
- en: Algae hold the lowest concentration because they are at the bottom of the chain.
- en: The correct option is c.
tier: C
diagram_note: Draw a pond food web with algae at the base, small fish and large fish in the middle, and herons at the top, with arrows showing energy flow and a column beside showing rising pesticide concentration at each level.
