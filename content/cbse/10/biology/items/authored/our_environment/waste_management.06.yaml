id: A.10.biology.our_environment.waste_management.06
skill_ids:
- SK.A.10.biology.waste_management
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: 'Which step is the most preferred in the hierarchy of waste management: reduce, reuse, recycle and dispose?'
hints:
- level: 1
  en: Think about the step that prevents waste being created.
- level: 2
  en: Consider which step is the top of the hierarchy.
- level: 3
  en: The best option avoids the problem instead of solving it later.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Burn all waste first to produce energy
- id: b
  en: Dispose in a landfill as the first step
- id: c
  en: Reduce, by avoiding the generation of waste in the first place
- id: d
  en: Recycle everything before reducing anything
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.A6004DD9CB86
  when_answer_equals:
  - b
- id: MC.A.9D4037B9C781
  when_answer_equals:
  - d
- id: MC.A.28D91FC26136
  when_answer_equals:
  - a
solution_steps:
- en: Reducing waste at the source saves the most resources and energy, because nothing needs to be processed or disposed of.
- en: Reuse and recycling come next, and disposal is the least preferred option.
- en: The correct option is c.
tier: C
