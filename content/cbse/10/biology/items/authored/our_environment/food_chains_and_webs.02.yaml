id: A.10.biology.our_environment.food_chains_and_webs.02
skill_ids:
- SK.A.10.biology.food_chains_and_webs
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In a food chain diagram, which way does the arrow point?
hints:
- level: 1
  en: Think about the direction in which the food energy travels.
- level: 2
  en: Consider which organism receives the energy.
- level: 3
  en: The arrow shows the flow of energy, not the hunting direction.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: From the predator to its prey
- id: b
  en: From the organism being eaten to the organism that eats it
- id: c
  en: Between organisms of the same trophic level
- id: d
  en: From the decomposer to the producer
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.CB4F00015FEF
  when_answer_equals:
  - a
- id: MC.A.AE9B75BF7D1C
  when_answer_equals:
  - d
- id: MC.A.1FDFC6087230
  when_answer_equals:
  - c
solution_steps:
- en: Arrows show the flow of energy and matter, so they point from the food to the consumer.
- en: This means the arrow points in the direction energy moves.
- en: The correct option is b.
tier: C
