id: A.10.biology.our_environment.ecosystem_components.05
skill_ids:
- SK.A.10.biology.ecosystem_components
difficulty: 0.9
pool: practice
role: explain
stem:
  en: Which statement correctly relates the biotic and abiotic components of a pond?
hints:
- level: 1
  en: Think about conditions that affect every living thing in the pond.
- level: 2
  en: Consider whether organisms change their surroundings.
- level: 3
  en: All organisms depend on some abiotic factors, not only plants.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Abiotic factors are unaffected by the organisms living in the pond
- id: b
  en: Biotic components do not need abiotic factors to survive
- id: c
  en: Only producers depend on abiotic factors
- id: d
  en: Abiotic factors such as temperature and oxygen limit which organisms can survive in the pond
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.7020DF39707B
  when_answer_equals:
  - a
- id: MC.A.31A7EC40C387
  when_answer_equals:
  - b
- id: MC.A.D6FC775206BA
  when_answer_equals:
  - c
solution_steps:
- en: Abiotic factors set the conditions that determine which species can live in an ecosystem.
- en: Organisms also influence abiotic factors, for example by using oxygen and producing waste.
- en: The correct option is d.
tier: C
