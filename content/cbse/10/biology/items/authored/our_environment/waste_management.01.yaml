stem:
  en: Which of the three Rs means using an item again without first processing it?
hints:
- level: 1
  en: Think about using a bottle again for water.
- level: 2
  en: The word refers to the same item being used a second time.
- level: 3
  en: Recycling involves processing, so it is not this option.
