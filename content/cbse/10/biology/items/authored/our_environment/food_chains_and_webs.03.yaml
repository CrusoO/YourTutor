id: A.10.biology.our_environment.food_chains_and_webs.03
skill_ids:
- SK.A.10.biology.food_chains_and_webs
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why is a food web more stable than a single food chain?
hints:
- level: 1
  en: Think about what happens when one food source becomes scarce.
- level: 2
  en: Consider how many links connect the organisms in a web.
- level: 3
  en: A web has more routes than a chain.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It makes every organism eat the same food
- id: b
  en: It removes the need for producers in the ecosystem
- id: c
  en: If one species declines, other feeding links can supply alternative food
- id: d
  en: It has only one path of energy flow, which is safer
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.6B819A54C367
  when_answer_equals:
  - d
- id: MC.A.BE7C62510D3C
  when_answer_equals:
  - b
- id: MC.A.8F2390A81AE3
  when_answer_equals:
  - a
solution_steps:
- en: A food web has many interconnected feeding links, so a consumer can switch to other prey if one species declines.
- en: This makes the community more resistant to change than a single chain.
- en: The correct option is c.
tier: C
diagram_note: Draw a food web with at least five organisms, for example grass, rabbit, deer, fox and snake, with arrows from each food to its consumer and multiple arrows leaving some organisms.
