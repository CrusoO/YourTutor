stem:
  en: Which of these items is non-biodegradable and must be managed by recycling or safe disposal?
hints:
- level: 1
  en: Think about which material is made from synthetic polymers.
- level: 2
  en: Consider which item microbes cannot easily digest.
- level: 3
  en: The answer is man-made rather than natural.
