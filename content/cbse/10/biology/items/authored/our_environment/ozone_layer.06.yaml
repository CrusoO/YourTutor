id: A.10.biology.our_environment.ozone_layer.06
skill_ids:
- SK.A.10.biology.ozone_layer
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which statement about ozone depletion by chlorine is correct?
hints:
- level: 1
  en: Think about whether chlorine is consumed in each reaction.
- level: 2
  en: Consider what a catalyst does in a chemical reaction.
- level: 3
  en: Ask whether the chlorine atom comes back out of the cycle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: CFCs add ozone to the stratosphere, which thickens the layer
- id: b
  en: Chlorine is used up in each ozone molecule it destroys
- id: c
  en: A single chlorine atom can destroy many ozone molecules before it is removed
- id: d
  en: Ozone is destroyed only by sunlight and not by chlorine
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.8B954F2E8798
  when_answer_equals:
  - b
- id: MC.A.69206D549425
  when_answer_equals:
  - d
- id: MC.A.23285AB40901
  when_answer_equals:
  - a
solution_steps:
- en: Chlorine acts as a catalyst, so one atom can break down many thousands of ozone molecules in a repeating cycle.
- en: It is removed only slowly by other reactions.
- en: The correct option is c.
tier: C
