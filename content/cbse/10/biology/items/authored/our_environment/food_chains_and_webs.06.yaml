solution_steps:
- en: When two species use the same limited resource, they compete for it and each may be harmed by the other's use.
- en: Mutualism benefits both species, parasitism benefits one at the expense of the other, and predation involves killing and eating prey.
- en: The correct option is d.
tier: C
