difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Two species in the same food web eat the same food source. What is this relationship called?
hints:
- level: 1
  en: Think about what happens when a resource is limited and shared.
- level: 2
  en: Ask whether either species gains from the other.
- level: 3
  en: The relationship is about a shared resource, not a predator and prey.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Mutualism
- id: b
  en: Parasitism
- id: c
  en: Predation
- id: d
  en: Competition
answer:
  sympy: d
  accept: []
misconception_rules:
