difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why are there usually fewer top predators than herbivores in an ecosystem?
hints:
- level: 1
  en: Think about how much energy is passed to each level.
- level: 2
  en: Consider what a higher level can support given less energy.
- level: 3
  en: The pattern is about energy, not about body size.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Top predators reproduce less often than producers
- id: b
  en: Only a small fraction of energy reaches the higher levels to support large numbers
- id: c
  en: Top predators are always smaller than herbivores
- id: d
  en: Herbivores eat the predators in the food chain
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.267C336232BE
  when_answer_equals:
  - a
- id: MC.A.C492347FD044
  when_answer_equals:
