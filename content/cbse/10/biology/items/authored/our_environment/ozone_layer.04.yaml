solution_steps:
- en: The Montreal Protocol, agreed in 1987, set schedules for phasing out CFCs and other ozone-depleting chemicals.
- en: The Kyoto and Paris agreements deal with greenhouse gases and climate change, and the Ramsar Convention deals with wetlands.
- en: The correct option is c.
