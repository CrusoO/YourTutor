stem:
  en: Which international agreement was made to phase out the production of ozone-depleting substances?
hints:
- level: 1
  en: Think about the agreement signed in the Canadian city after which it is named.
- level: 2
  en: Consider which agreement focuses on the protection of the ozone layer.
- level: 3
  en: Do not confuse climate agreements with the ozone agreement.
