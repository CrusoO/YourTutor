id: A.10.biology.our_environment.energy_flow_and_biomagnification.03
skill_ids:
- SK.A.10.biology.energy_flow_and_biomagnification
difficulty: 0.6
pool: practice
role: apply
stem:
  en: In a grassland food chain, the producers capture 10000 kJ of energy. Assuming the usual 10 percent transfer at each step, how much energy is available to the primary consumers?
hints:
- level: 1
  en: Work out what 10 percent of the producer energy is.
- level: 2
  en: Only one transfer step is needed to reach the primary consumers.
- level: 3
  en: Multiply 10000 by 0.1.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 5000 kJ
- id: b
  en: 1000 kJ
- id: c
  en: 100 kJ
- id: d
  en: 10000 kJ
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.23E0533C7803
  when_answer_equals:
  - a
- id: MC.A.723213237DE9
  when_answer_equals:
  - c
- id: MC.A.758248182369
  when_answer_equals:
  - d
solution_steps:
- en: Ten percent of 10000 kJ is 1000 kJ, which is the energy available to the primary consumers.
- en: The remaining energy is lost as heat or used in life processes.
- en: The correct option is b.
tier: C
diagram_note: Draw an energy pyramid with four levels labelled producers, primary consumers, secondary consumers and tertiary consumers, with the width decreasing towards the top and the values 10000, 1000, 100 and 10 kJ written on the levels.
