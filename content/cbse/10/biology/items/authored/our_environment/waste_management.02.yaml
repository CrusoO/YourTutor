role: recall
stem:
  en: What is the main purpose of composting biodegradable kitchen waste?
hints:
- level: 1
  en: Think about what microbes do to the organic matter.
- level: 2
  en: Consider the product that improves soil.
- level: 3
  en: Decay is the process that you want, not one you want to stop.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: To seal it in airtight plastic so that decay stops
- id: b
  en: To burn it so that it produces plastic
- id: c
  en: To mix it with heavy metals to make it durable
- id: d
  en: To turn it into nutrient-rich soil conditioner through decomposition
answer:
  sympy: d
  accept: []
