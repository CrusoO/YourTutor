role: recall
stem:
  en: Which group of chemicals is mainly responsible for the depletion of the ozone layer?
hints:
- level: 1
  en: Think about man-made chemicals used in refrigeration and aerosols.
- level: 2
  en: Consider which chemicals release chlorine in the upper atmosphere.
- level: 3
  en: The answer is a group of human-made compounds that contain fluorine.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
