solution_steps:
- en: CFCs were used in refrigerants, aerosols and foams.
- en: When they reach the stratosphere, they release chlorine that breaks down ozone.
- en: Oxygen is the element that forms ozone and is not the cause of depletion.
- en: The correct option is c.
