stem:
  en: In the food chain grass, grasshopper, frog, snake, which organism is the primary consumer?
hints:
- level: 1
  en: Count the steps from the producer.
- level: 2
  en: The first organism that eats the producer is the one you want.
- level: 3
  en: Herbivores are the primary consumers.
