stem:
  en: In a food chain the producers store 50000 kJ of energy. Assuming 10 percent is passed on at each step, how many kJ reach the tertiary consumers?
hints:
- level: 1
  en: Count how many transfer steps lie between producers and tertiary consumers.
- level: 2
  en: Apply 10 percent at each step, one step at a time.
- level: 3
  en: Three steps of multiplying by 0.1 are needed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '50'
  accept: []
solution_steps:
- en: The energy passes from producers to primary consumers (5000 kJ), then to secondary consumers (500 kJ), then to tertiary consumers (50 kJ).
- en: That is three transfer steps of 10 percent each.
- en: The unit of the answer is kJ.
- en: Answer = 50
tier: C
