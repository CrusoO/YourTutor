id: A.10.biology.our_environment.ecosystem_components.06
skill_ids:
- SK.A.10.biology.ecosystem_components
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: All living organisms are removed from a patch of soil. Which component remains unaffected by this removal?
hints:
- level: 1
  en: Sort each option into living or non-living.
- level: 2
  en: Ask which option is not an organism.
- level: 3
  en: Consider which option stays after the living things are removed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Earthworms
- id: b
  en: Bacteria
- id: c
  en: Soil water
- id: d
  en: Fungi
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.BE0094048C91
  when_answer_equals:
  - a
- id: MC.A.35C199E7354F
  when_answer_equals:
  - b
- id: MC.A.3D90723FB8DF
  when_answer_equals:
  - d
solution_steps:
- en: Earthworms, bacteria and fungi are all living, so they are removed with the organisms.
- en: Soil water is a non-living abiotic component and stays after the organisms are removed.
- en: The correct option is c.
tier: C
