id: A.10.biology.our_environment.waste_management.04
skill_ids:
- SK.A.10.biology.waste_management
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why is segregating household waste at the source useful?
hints:
- level: 1
  en: Think about what happens to recyclables that are mixed with food waste.
- level: 2
  en: Consider which waste should be sent for composting.
- level: 3
  en: Ask whether segregation changes the amount of waste or only how it is handled.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It helps recover recyclables and makes safe composting and treatment easier
- id: b
  en: It allows all waste to be burned without any treatment
- id: c
  en: It increases the total amount of waste generated
- id: d
  en: It removes the need for any waste disposal site
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.A3D53A38C740
  when_answer_equals:
  - c
- id: MC.A.5975CE5FC926
  when_answer_equals:
  - b
- id: MC.A.E74FFE36A5D9
  when_answer_equals:
  - d
solution_steps:
- en: Separating wet, dry and hazardous waste at home allows recyclable material to be recovered and organic waste to be composted.
- en: It makes the whole management system cleaner and cheaper to run.
- en: The correct option is a.
tier: C
