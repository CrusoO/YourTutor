stem:
  en: About what percentage of energy is passed from one trophic level to the next in a food chain?
hints:
- level: 1
  en: Think about how much energy is lost as heat at each step.
- level: 2
  en: Consider the small fraction that is stored in the body.
- level: 3
  en: The rule is a tenth, not a half.
