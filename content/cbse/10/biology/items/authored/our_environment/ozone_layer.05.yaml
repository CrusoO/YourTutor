id: A.10.biology.our_environment.ozone_layer.05
skill_ids:
- SK.A.10.biology.ozone_layer
difficulty: 0.9
pool: practice
role: explain
stem:
  en: Why is the ozone hole most visible over Antarctica in spring?
hints:
- level: 1
  en: Think about the conditions that form in very cold stratospheric air.
- level: 2
  en: Consider what happens when sunlight returns after the polar night.
- level: 3
  en: The cause is chemical and seasonal, not a matter of local factories.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The ozone layer is naturally thinnest at the equator
- id: b
  en: Antarctica has the most CFC factories in the world
- id: c
  en: Ozone is produced only in winter over Antarctica
- id: d
  en: Polar stratospheric clouds and returning sunlight speed up ozone destruction by chlorine
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.453E1E51DCB2
  when_answer_equals:
  - b
- id: MC.A.37637A11ECE4
  when_answer_equals:
  - c
- id: MC.A.B9F36ABEF154
  when_answer_equals:
  - a
solution_steps:
- en: Very cold conditions form polar stratospheric clouds that convert chlorine compounds into reactive forms.
- en: When sunlight returns in spring, these forms destroy ozone quickly, creating the Antarctic ozone hole.
- en: The correct option is d.
tier: C
