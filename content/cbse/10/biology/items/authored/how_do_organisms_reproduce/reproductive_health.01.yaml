stem:
  en: Which contraceptive is a barrier method that also helps protect against sexually transmitted infections?
hints:
- level: 1
  en: Think about a barrier worn over a body part during intercourse.
- level: 2
  en: Consider which method covers the penis.
- level: 3
  en: The method is not hormonal or surgical.
