stem:
  en: Which statement correctly contrasts the flowers of wind-pollinated and insect-pollinated plants?
hints:
- level: 1
  en: Consider how pollen moves between flowers in each case.
- level: 2
  en: Think about what features help catch or attract the pollen carrier.
- level: 3
  en: The pollen of wind-pollinated flowers must be light enough to float.
