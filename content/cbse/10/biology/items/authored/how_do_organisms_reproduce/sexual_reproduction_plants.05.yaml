solution_steps:
- en: Wind pollination needs large, exposed anthers and feathery stigmas to catch air-borne pollen, and the pollen is light and produced in large amounts.
- en: Insect-pollinated flowers rely on petals, scent and nectar to attract insects.
- en: The correct option is a.
tier: C
diagram_note: 'Draw two flowers side by side: one wind-pollinated with large feathery stigmas and dangling anthers, and one insect-pollinated with bright petals and a nectar guide. Label the stigma, anther, petal and nectar.'
