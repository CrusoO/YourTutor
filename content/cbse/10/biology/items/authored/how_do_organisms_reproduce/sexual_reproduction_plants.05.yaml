options:
- id: a
  en: Wind-pollinated flowers have large feathery stigmas and light pollen, while insect-pollinated flowers have bright petals and nectar
- id: b
  en: Insect-pollinated flowers produce large amounts of light, dry pollen
- id: c
  en: Wind-pollinated flowers have brightly coloured petals to attract the wind
- id: d
  en: Wind-pollinated flowers have no stamens at all
