id: A.10.biology.how_do_organisms_reproduce.asexual_reproduction.04
skill_ids:
- SK.A.10.biology.asexual_reproduction
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why are offspring produced by asexual reproduction usually genetically identical to the parent?
hints:
- level: 1
  en: Count how many parents contribute genetic material.
- level: 2
  en: Think about whether any gametes are involved.
- level: 3
  en: Consider what happens to the DNA before the cell divides.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Two gametes fuse, so the offspring copies both parents
- id: b
  en: Random mixing of chromosomes produces identical twins
- id: c
  en: Mutations occur in every offspring so they all match
- id: d
  en: Only one parent contributes genetic material and the DNA is copied directly
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.3F568B83BD09
  when_answer_equals:
  - a
- id: MC.A.E7529F6CF37B
  when_answer_equals:
  - b
- id: MC.A.2509097BAABA
  when_answer_equals:
  - c
solution_steps:
- en: Asexual reproduction involves only one parent, so there is no mixing of genetic material from two individuals.
- en: The offspring are therefore clones of the parent, apart from rare mutations.
- en: The correct option is d.
tier: C
