options:
- id: a
  en: It makes every contraceptive method permanent
- id: b
  en: It eliminates all sexually transmitted infections
- id: c
  en: It increases the number of children in each family
- id: d
  en: Spacing births improves maternal health and reduces child mortality
answer:
