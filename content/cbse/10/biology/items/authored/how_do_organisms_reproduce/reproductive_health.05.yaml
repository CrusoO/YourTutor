role: explain
stem:
  en: Why does family planning focus on spacing and limiting births as a public health measure?
hints:
- level: 1
  en: Think about the health of both mother and child between pregnancies.
- level: 2
  en: Consider what the spacing of births allows the mother to recover from.
- level: 3
  en: Family planning gives choice, not a cure for disease.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
