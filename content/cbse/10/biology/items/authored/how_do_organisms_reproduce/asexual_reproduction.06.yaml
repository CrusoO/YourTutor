difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A single bacterium divides by binary fission every 20 minutes. If no cells die, how many bacteria are present after 2 hours, starting from one cell?
hints:
- level: 1
  en: Work out how many 20-minute periods fit into 2 hours.
- level: 2
  en: Each division doubles the number of cells.
- level: 3
  en: Multiply 2 by itself once for each division.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '64'
  accept: []
solution_steps:
- en: Two hours is 120 minutes, which gives 6 divisions of 20 minutes each.
- en: The population doubles each time, so 2 raised to the power 6 gives 64 bacteria.
- en: Answer = 64
tier: C
