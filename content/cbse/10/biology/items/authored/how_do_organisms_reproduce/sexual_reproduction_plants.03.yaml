difficulty: 0.6
pool: practice
role: explain
stem:
  en: After a pollen grain lands on a compatible stigma, what happens to it?
hints:
- level: 1
  en: Think about how the male gametes must reach the ovule.
- level: 2
  en: Consider the structure that runs from the stigma to the ovary.
- level: 3
  en: The pollen grain must form a structure to travel down.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It grows a pollen tube down the style that carries the male gametes to the ovule
- id: b
  en: It moves into the ovary through a petal
- id: c
  en: It is absorbed directly by the wall of the ovule
- id: d
  en: It divides into a new flower
answer:
