solution_steps:
- en: The pollen grain germinates on the stigma and grows a pollen tube through the style.
- en: The tube delivers two male gametes to the ovule, where one fertilises the egg.
- en: The correct option is a.
tier: C
diagram_note: Draw a flower in section showing the stamen with the anther on the filament, the stigma, the style, and the ovary containing ovules. Add an arrow showing a pollen tube growing from the stigma down the style to an ovule.
