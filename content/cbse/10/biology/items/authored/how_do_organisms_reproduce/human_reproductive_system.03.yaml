id: A.10.biology.how_do_organisms_reproduce.human_reproductive_system.03
skill_ids:
- SK.A.10.biology.human_reproductive_system
difficulty: 0.6
pool: practice
role: explain
stem:
  en: What is the main function of the placenta during pregnancy?
hints:
- level: 1
  en: Think about how the fetus receives food and oxygen.
- level: 2
  en: Consider how the umbilical cord connects the fetus to the placenta.
- level: 3
  en: Notice that the blood of mother and fetus is kept apart.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It produces the egg cells that are fertilised
- id: b
  en: It exchanges nutrients, oxygen and wastes between mother and fetus without mixing their blood
- id: c
  en: It mixes maternal and fetal blood so that they share immunity
- id: d
  en: It stores urine from the fetus
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.8C40D891DF60
  when_answer_equals:
  - a
- id: MC.A.E9912EF0BD02
  when_answer_equals:
  - d
- id: MC.A.1AB43B44F4D3
  when_answer_equals:
  - c
solution_steps:
- en: The placenta lies in the uterine wall and allows diffusion of oxygen, glucose and other nutrients from the mother to the fetus, while carbon dioxide and wastes pass the other way.
- en: The two blood supplies stay separate.
- en: The correct option is b.
tier: C
diagram_note: Draw the uterus with an embryo attached to the placenta by the umbilical cord, with arrows showing nutrients and oxygen going from mother to fetus and carbon dioxide and wastes going back.
