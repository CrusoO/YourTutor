id: A.10.biology.how_do_organisms_reproduce.human_reproductive_system.05
skill_ids:
- SK.A.10.biology.human_reproductive_system
difficulty: 0.9
pool: practice
role: explain
stem:
  en: A man has a vasectomy in which the vas deferens is cut and tied. Why does this prevent pregnancy?
hints:
- level: 1
  en: Identify the tube that carries sperms from the testes.
- level: 2
  en: Think about what the surgery stops from being released.
- level: 3
  en: The procedure is performed on the male, not the female.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Sperms cannot pass from the testes to the urethra, so no sperms are released in semen
- id: b
  en: Eggs are blocked from entering the uterus
- id: c
  en: Testosterone production stops, which prevents ovulation in his partner
- id: d
  en: The prostate stops producing fluid so sperms cannot survive
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.1B798FCD8460
  when_answer_equals:
  - c
- id: MC.A.19E77DCC02BA
  when_answer_equals:
  - b
- id: MC.A.8D2A20908931
  when_answer_equals:
  - d
solution_steps:
- en: The vas deferens carries sperms from the epididymis towards the urethra, so cutting it stops sperms from being mixed into semen.
- en: The testes still make sperms, which are reabsorbed by the body.
- en: The correct option is a.
tier: C
diagram_note: Draw the male reproductive tract showing the testis, epididymis, vas deferens, urethra and the bladder, with the vas deferens marked as cut and tied.
