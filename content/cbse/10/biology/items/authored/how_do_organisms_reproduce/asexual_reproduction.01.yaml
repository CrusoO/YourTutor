stem:
  en: Which method of asexual reproduction is seen in yeast?
hints:
- level: 1
  en: Think about a small outgrowth that forms on the parent cell.
- level: 2
  en: Consider the method in which one body part grows into a new individual while still attached.
- level: 3
  en: The method does not involve two organisms exchanging material.
