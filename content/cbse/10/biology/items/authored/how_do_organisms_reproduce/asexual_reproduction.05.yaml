id: A.10.biology.how_do_organisms_reproduce.asexual_reproduction.05
skill_ids:
- SK.A.10.biology.asexual_reproduction
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which advantage of asexual reproduction is most useful when the environment stays stable for a long time?
hints:
- level: 1
  en: Think about what is gained when the environment does not change much.
- level: 2
  en: Consider whether finding a partner costs time and energy.
- level: 3
  en: The best-adapted type of organism is the one you want to keep copying.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It needs rare gametes, so offspring are few and well cared for
- id: b
  en: It mixes genes from two parents to create new combinations
- id: c
  en: It produces high variation that helps the population adapt quickly
- id: d
  en: Well-suited genotypes are copied quickly without needing a mate
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.50E66DB617F6
  when_answer_equals:
  - c
- id: MC.A.618FF86DF4FF
  when_answer_equals:
  - b
- id: MC.A.34BAEF06497F
  when_answer_equals:
  - a
solution_steps:
- en: In a stable environment a well-adapted individual can produce many identical copies quickly and without the time and energy spent finding a mate.
- en: Variation matters mainly when conditions change.
- en: The correct option is d.
tier: C
