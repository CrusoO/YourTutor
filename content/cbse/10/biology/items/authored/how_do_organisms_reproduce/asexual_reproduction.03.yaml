id: A.10.biology.how_do_organisms_reproduce.asexual_reproduction.03
skill_ids:
- SK.A.10.biology.asexual_reproduction
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A filament of an alga breaks into several pieces, and each piece grows into a new filament. What is this type of asexual reproduction called?
hints:
- level: 1
  en: Notice that the parent body breaks apart.
- level: 2
  en: Consider whether the pieces are formed by splitting or by outgrowth.
- level: 3
  en: Each piece must grow into a whole organism.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Spore formation
- id: b
  en: Fragmentation
- id: c
  en: Binary fission
- id: d
  en: Budding
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.B7D17164E77C
  when_answer_equals:
  - d
- id: MC.A.D55880F29304
  when_answer_equals:
