difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why are oral contraceptive pills effective in preventing pregnancy?
hints:
- level: 1
  en: Think about what the egg needs in order to be fertilised.
- level: 2
  en: Consider which step of the cycle the hormones suppress.
- level: 3
  en: The hormones act inside the body, not by blocking a path.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They kill sperms in the vagina
- id: b
  en: They make the uterus lining thicker so the egg cannot leave
- id: c
  en: They contain hormones that stop ovulation
- id: d
  en: They block the fallopian tube physically
answer:
  sympy: c
  accept: []
misconception_rules:
