id: A.10.biology.heredity_and_evolution.evolution_and_speciation.06
skill_ids:
- SK.A.10.biology.evolution_and_speciation
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Two bird populations are separated by a mountain range for many generations. When they are reunited, they can no longer interbreed. What is the best explanation?
hints:
- level: 1
  en: Think about how long the populations were separated.
- level: 2
  en: Consider whether the mountains change the genes directly.
- level: 3
  en: Ask whether speciation usually happens in one generation.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Reproductive isolation developed through accumulated genetic differences
- id: b
  en: The mountain range changed the birds' genes directly
- id: c
  en: The birds lost their ability to fly, which made them different species
- id: d
  en: Each population mutated into a different species in a single generation
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.BD5C70F558AC
  when_answer_equals:
  - d
- id: MC.A.E15BAAAEF13E
  when_answer_equals:
  - b
- id: MC.A.FC3D32E4B1E7
  when_answer_equals:
  - c
solution_steps:
- en: Over many generations, the separated populations accumulate genetic differences that prevent successful interbreeding.
- en: Speciation is usually gradual rather than a single event.
- en: The correct option is a.
tier: C
