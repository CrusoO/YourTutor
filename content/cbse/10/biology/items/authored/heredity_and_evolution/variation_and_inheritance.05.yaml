id: A.10.biology.heredity_and_evolution.variation_and_inheritance.05
skill_ids:
- SK.A.10.biology.variation_and_inheritance
difficulty: 0.9
pool: practice
role: explain
stem:
  en: Why are characteristics acquired during a person's life, such as muscle built by exercise, not passed on to the next generation?
hints:
- level: 1
  en: Consider which cells the genetic information must pass through.
- level: 2
  en: Ask whether a change in a muscle cell alters the egg or sperm.
- level: 3
  en: Think about the difference between body cells and reproductive cells.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Acquired characteristics only occur in animals, not in humans
- id: b
  en: Only changes in the DNA of the gametes can be inherited
- id: c
  en: Changes in body cells are copied into the sex cells
- id: d
  en: Acquired characteristics are removed by the body before reproduction
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.1C83B7B5F7C7
  when_answer_equals:
  - d
- id: MC.A.E87F6F44BECA
  when_answer_equals:
  - c
- id: MC.A.E7E849F2607F
  when_answer_equals:
  - a
solution_steps:
- en: Inheritance depends on the genetic material passed in gametes.
- en: Changes in body cells, such as muscle growth, do not alter the DNA of the sperm or egg, so they are not inherited.
- en: The correct option is b.
tier: C
