id: A.10.biology.heredity_and_evolution.fossils_and_evidence.06
skill_ids:
- SK.A.10.biology.fossils_and_evidence
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which statement correctly describes the evidence from embryos for evolution?
hints:
- level: 1
  en: Think about what the embryos of different vertebrates have in common early on.
- level: 2
  en: Consider what the similarity suggests about the ancestors of the adults.
- level: 3
  en: The evidence concerns early development, not the adult function.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Embryos of different animals are identical in function at birth
- id: b
  en: Early embryos of different vertebrates look similar, which suggests shared ancestry
- id: c
  en: Embryos show no relation to the ancestry of the adult animal
- id: d
  en: Embryos show only the adaptations that the adult will later need
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.4B6AFE6B38E0
  when_answer_equals:
  - a
- id: MC.A.EEC8F355DD13
  when_answer_equals:
  - c
- id: MC.A.196C18CB7878
  when_answer_equals:
  - d
solution_steps:
- en: Vertebrate embryos share features such as gill-like structures and a tail at early stages, which points to a common ancestry.
- en: Similarity in early development is evidence that the groups are related.
- en: The correct option is b.
tier: C
