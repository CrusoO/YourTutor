stem:
  en: Why are fossils in deeper rock layers usually older than fossils in the layers above them?
hints:
- level: 1
  en: Think about how sediment builds up over time.
- level: 2
  en: Consider which layer must have been deposited first.
- level: 3
  en: The order is about deposition, not movement.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Sediments settle in layers, so the lower layers were deposited earlier
- id: b
  en: The deeper layers were formed after the upper layers
- id: c
  en: Pressure makes deeper fossils younger
- id: d
  en: Fossils move downwards through the rock over time
answer:
  sympy: a
  accept: []
