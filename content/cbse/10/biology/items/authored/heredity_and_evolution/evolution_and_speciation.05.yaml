id: A.10.biology.heredity_and_evolution.evolution_and_speciation.05
skill_ids:
- SK.A.10.biology.evolution_and_speciation
difficulty: 0.9
pool: practice
role: explain
stem:
  en: Which statement best contrasts Lamarck's idea of evolution with Darwin's?
hints:
- level: 1
  en: Think about how each scientist explained the origin of new traits.
- level: 2
  en: Consider which idea involves the environment selecting from existing differences.
- level: 3
  en: Notice which scientist proposed inheritance of traits gained during life.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Lamarck proposed that traits acquired during life are inherited, while Darwin proposed that heritable variations are selected by the environment
- id: b
  en: Darwin proposed that acquired traits are inherited, while Lamarck proposed natural selection
- id: c
  en: Both proposed that species do not change over time
- id: d
  en: Both proposed that traits arise only through use or disuse of organs
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.153A088FF23D
  when_answer_equals:
  - b
- id: MC.A.ACF9D06282CE
  when_answer_equals:
  - d
- id: MC.A.2E1B3D96597A
  when_answer_equals:
  - c
solution_steps:
- en: Lamarck suggested that use and disuse of organs during life are passed to offspring.
- en: Darwin proposed that individuals differ in heritable traits and that the environment selects those best suited to survive and reproduce.
- en: The correct option is a.
tier: C
