id: A.10.biology.heredity_and_evolution.evolution_and_speciation.04
skill_ids:
- SK.A.10.biology.evolution_and_speciation
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A predator eats the most visible beetles in a population, and the beetles vary in colour. Which outcome is most likely over many generations?
hints:
- level: 1
  en: Ask which beetles are more likely to be eaten.
- level: 2
  en: Think about which colour variant will leave more offspring.
- level: 3
  en: Consider whether any individual can change its inherited colour.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The frequency of camouflaged beetles increases
- id: b
  en: All beetles become visible because predation is random
- id: c
  en: Visible beetles evolve camouflage within their own lifetime
- id: d
  en: The beetle population stops changing because selection ends
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.C1E1F09CA12E
  when_answer_equals:
  - c
- id: MC.A.F92CF4CB619F
  when_answer_equals:
  - b
- id: MC.A.DE195E815E72
  when_answer_equals:
  - d
solution_steps:
- en: Camouflaged beetles survive better and reproduce more, so their alleles become more common.
- en: Individuals do not change colour in their lifetime, and selection continues as long as the predation pressure lasts.
- en: The correct option is a.
tier: C
