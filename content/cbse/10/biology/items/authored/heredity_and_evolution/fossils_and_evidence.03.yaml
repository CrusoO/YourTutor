id: A.10.biology.heredity_and_evolution.fossils_and_evidence.03
skill_ids:
- SK.A.10.biology.fossils_and_evidence
difficulty: 0.6
pool: practice
role: explain
stem:
  en: The forelimbs of a whale, a bat and a human have a similar bone arrangement, although they are used for different purposes. What does this best suggest?
hints:
- level: 1
  en: Notice that the function of the limbs is different in the three animals.
- level: 2
  en: Think about why the arrangement of bones would be similar.
- level: 3
  en: Consider what kind of evidence shared anatomy provides.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The three animals use their forelimbs for the same function
- id: b
  en: The forelimb structure is the result of the environment alone
- id: c
  en: The three share a common ancestor from which the bone arrangement was inherited
- id: d
  en: The bones developed independently in each species for the same purpose
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.1A461801069E
  when_answer_equals:
  - a
- id: MC.A.B73EBB81B67A
  when_answer_equals:
  - b
- id: MC.A.442ACE186F52
  when_answer_equals:
  - d
solution_steps:
- en: Similar bone arrangements in different species that use the limbs for different purposes point to a common ancestor.
- en: This is evidence for evolution by descent with modification.
- en: The correct option is c.
tier: C
