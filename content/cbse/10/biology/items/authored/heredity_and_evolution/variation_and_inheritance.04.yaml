id: A.10.biology.heredity_and_evolution.variation_and_inheritance.04
skill_ids:
- SK.A.10.biology.variation_and_inheritance
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which of these is an example of an inherited variation in humans?
hints:
- level: 1
  en: Ask whether the trait is determined by genes passed from parents.
- level: 2
  en: Think about which feature a child is born with.
- level: 3
  en: Each wrong option is a change that happens after birth.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Weight gained from a change in diet
- id: b
  en: A suntan from long hours in sunlight
- id: c
  en: Blood group
- id: d
  en: A scar from a cut
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.58D60EC8243A
  when_answer_equals:
  - d
- id: MC.A.7FE3296E1E4B
  when_answer_equals:
  - b
- id: MC.A.0D00B97435B6
  when_answer_equals:
  - a
solution_steps:
- en: Blood group is determined by alleles passed from parents to children.
- en: A scar, a suntan and weight gain are changes caused by the environment or by injury and are not inherited.
- en: The correct option is c.
tier: C
