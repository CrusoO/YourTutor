id: A.10.biology.heredity_and_evolution.variation_and_inheritance.03
skill_ids:
- SK.A.10.biology.variation_and_inheritance
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why do offspring of the same parents often show different traits?
hints:
- level: 1
  en: Think about how the gametes of one parent are formed.
- level: 2
  en: Consider what happens when a sperm and an egg combine.
- level: 3
  en: Recall that genes can exist in more than one form.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Offspring always inherit the same allele from each parent
- id: b
  en: The environment alone creates all differences between siblings
- id: c
  en: Each parent gives gametes with different combinations of alleles, and fertilisation mixes them at random
- id: d
  en: Mutations occur in every offspring, so each one differs from its parents
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.E1CA0BE8FB37
  when_answer_equals:
  - b
- id: MC.A.D9F82F9B1E72
  when_answer_equals:
  - a
- id: MC.A.8CA0D4E1BFA2
  when_answer_equals:
  - d
solution_steps:
- en: Sexual reproduction produces gametes that carry different mixtures of alleles, due to independent assortment and crossing over during meiosis.
- en: Random fertilisation then combines them, so siblings differ.
- en: The correct option is c.
tier: C
