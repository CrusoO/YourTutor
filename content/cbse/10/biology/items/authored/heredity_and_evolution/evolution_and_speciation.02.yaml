id: A.10.biology.heredity_and_evolution.evolution_and_speciation.02
skill_ids:
- SK.A.10.biology.evolution_and_speciation
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is formed when two populations become reproductively isolated and can no longer produce fertile offspring together?
hints:
- level: 1
  en: Think about the group of organisms that can breed with each other.
- level: 2
  en: Consider what has changed about the ability to interbreed.
- level: 3
  en: The answer is a biological group, not a feature of the environment.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A new ecosystem
- id: b
  en: An identical gene pool in both populations
- id: c
  en: A new species
- id: d
  en: A new food chain
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.7A6F57E3C1E5
  when_answer_equals:
  - a
- id: MC.A.B3EF2AAB162D
  when_answer_equals:
  - d
- id: MC.A.54302C6FD7BD
  when_answer_equals:
  - b
solution_steps:
- en: When populations can no longer interbreed to produce fertile offspring, they are separate species.
- en: Ecosystem and food chain changes are not the defining result of speciation.
- en: The correct option is c.
tier: C
