id: A.10.biology.heredity_and_evolution.evolution_and_speciation.03
skill_ids:
- SK.A.10.biology.evolution_and_speciation
difficulty: 0.6
pool: practice
role: explain
stem:
  en: How can geographic isolation contribute to the formation of a new species?
hints:
- level: 1
  en: Think about what happens to gene flow when populations are separated.
- level: 2
  en: Consider how different environments affect which variants survive.
- level: 3
  en: Separation tends to increase differences between populations.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Isolation makes all members of both populations identical
- id: b
  en: Isolated populations always become identical to the ancestral population
- id: c
  en: Isolated populations stop all mutations in their genes
- id: d
  en: Separated populations accumulate different variations, and selection may act differently in each
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.F73AAF5C51CB
  when_answer_equals:
  - c
- id: MC.A.12CE2ED92768
  when_answer_equals:
  - a
- id: MC.A.7050722BD1CE
  when_answer_equals:
  - b
solution_steps:
- en: When populations are separated, gene flow stops, so their gene pools drift apart through mutation, drift and different selection pressures.
- en: Over time they may become unable to interbreed.
- en: The correct option is d.
tier: C
