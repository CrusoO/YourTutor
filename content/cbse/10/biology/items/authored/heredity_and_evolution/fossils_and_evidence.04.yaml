id: A.10.biology.heredity_and_evolution.fossils_and_evidence.04
skill_ids:
- SK.A.10.biology.fossils_and_evidence
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which fossil evidence best shows a transition between an ancient form and a modern form?
hints:
- level: 1
  en: Look for fossils that show a mixture of characteristics.
- level: 2
  en: Think about what a half-way form would look like.
- level: 3
  en: The best evidence compares features, not only dates or depths.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Fossils with features identical to modern animals
- id: b
  en: Transitional fossils with features intermediate between the two groups
- id: c
  en: Recent fossils found close to the surface
- id: d
  en: Living animals with no fossil record at all
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.4DF08F462B54
  when_answer_equals:
  - a
- id: MC.A.9C89BE9ACCE9
  when_answer_equals:
  - c
- id: MC.A.654F602E000B
  when_answer_equals:
  - d
solution_steps:
- en: Transitional fossils display a mix of features from an ancestral and a descendant group, which shows change over time.
- en: Identical or very recent fossils do not show a transition.
- en: The correct option is b.
tier: C
