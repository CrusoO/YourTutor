stem:
  en: In a certain animal species, the allele S for spotted coats is dominant over
    the allele s for plain coats, and the allele E for curly tails is dominant over
    the allele e for straight tails. The two genes are on different chromosomes and
    are inherited independently. An animal with genotype SsEe is crossed with an animal
    with genotype ssee. A Punnett square has one row for each different gamete type
    of the first parent and one column for each different gamete type of the second
    parent. How many boxes does it have?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Count
    the different gamete types of each parent first. A type that repeats counts once.
- level: 2
  en: Each row is paired with each column, so combine the two counts by multiplying.
- level: 3
  en: The first parent makes the gametes SE, Se, sE and se, and the second parent
    makes the gametes se.
prediction_prompt:
  en: Before you count, should the answer be a small number or a large one?
