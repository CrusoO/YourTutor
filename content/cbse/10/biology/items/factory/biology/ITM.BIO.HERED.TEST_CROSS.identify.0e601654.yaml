stem:
  en: In a certain animal species, the allele B for black coats is dominant over the
    allele b for brown coats, and the allele L for long hair is dominant over the
    allele l for short hair. The two genes are on different chromosomes and are inherited
    independently. An animal with black coats and long hair is test-crossed with an
    animal with brown coats and short hair. The result of the test cross is that all
    of the offspring have black coats and long hair. What is the genotype of the animal
    that was tested?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. The
    parent used for the test cross passes on only recessive alleles, so each offspring
    shows which allele the tested parent passed on.
- level: 2
  en: Count how many different groups of offspring appear. Each heterozygous gene
    of the tested parent doubles that number.
- level: 3
  en: Check a candidate by writing its gametes and pairing them with the gametes of
    the other parent in a Punnett square.
prediction_prompt:
  en: Before you decide, how many different gamete types must the tested parent make?
