role: procedure
stem:
  en: A gamete has half the number of chromosomes of a body cell. A zygote forms when
    a sperm and an egg join. A cell made by mitosis has the same number of chromosomes
    as the cell that divided. In a certain flowering plant species, each gamete has
    4 chromosomes. The zygote divides by mitosis 4 times, so that all the cells divide
    together each time. How many chromosomes are there in total, counting all the
    cells of the embryo?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. First find the number
    of chromosomes in the zygote, then the number of cells after the divisions.
- level: 2
  en: All the cells have the same number of chromosomes, so multiply the number of
    chromosomes in one cell by the number of cells.
- level: 3
  en: If all the cells divide together, the number of cells doubles four times.
prediction_prompt:
  en: Before you calculate, will the number be larger or smaller than the number given?
