solution_steps:
- en: The zygote has 4 + 4 = 8 chromosomes, and every cell made by mitosis keeps that
    number.
- en: After 4 rounds there are 2 to the power 4 = 16 cells.
- en: The total is 16 x 8 = 128 chromosomes.
- en: The correct option is c.
