stem:
  en: In a certain plant species, the allele W for smooth leaves is dominant over
    the allele w for hairy leaves. A plant with genotype Ww is crossed with a plant
    with genotype Ww. What is the probability that one offspring, picked at random,
    has the genotype WW? Give the answer as a fraction.
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Find
    the gametes each parent can make, then combine them in a Punnett square.
- level: 2
  en: A probability is the number of boxes that show the outcome asked for, divided
    by the number of all the boxes.
- level: 3
  en: The first parent makes the gametes W and w, and the second parent makes the
    gametes W and w.
prediction_prompt:
  en: Before you calculate, is the outcome asked for more likely or less likely than
    the other?
