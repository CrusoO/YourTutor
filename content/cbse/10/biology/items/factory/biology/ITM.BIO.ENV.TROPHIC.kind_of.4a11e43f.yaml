stem:
  en: A producer is at trophic level 1. A primary consumer eats the producer, a secondary
    consumer eats a primary consumer, a tertiary consumer eats a secondary consumer,
    and so on. In the food chain leaves → caterpillar → small bird → hawk, the caterpillar
    is which of the following? Each organism in the chain is eaten by the next one.
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Find
    the organism in the chain and count how many places it is after the producer.
- level: 2
  en: The organism right after the producer is the first kind of consumer, the next
    one is the second kind, and so on.
- level: 3
  en: The producer itself is not a consumer.
prediction_prompt:
  en: Before you count, which end of the chain is the producer?
