role: apply
stem:
  en: In the food chain grass → grasshopper → frog → snake → hawk, the grass captures
    2000 J of energy. Assume that only 10 percent of the energy at one trophic level
    passes to the next level. How much energy is lost in total before energy reaches
    the frog?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. The
    energy lost is the energy captured at the start minus the energy that reaches
    the organism.
- level: 2
  en: First find the energy that reaches the organism, by taking one tenth for each
    step.
- level: 3
  en: Going from the first level to level three takes two steps.
prediction_prompt:
  en: Before you calculate, will most of the energy be lost or passed on?
