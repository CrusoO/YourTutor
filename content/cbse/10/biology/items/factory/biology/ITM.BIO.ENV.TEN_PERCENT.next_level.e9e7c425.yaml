stem:
  en: In the food chain phytoplankton → zooplankton → small fish → large fish → seabird,
    the large fish holds 5000 J of energy. Assume that only 10 percent of the energy
    at one trophic level passes to the next level. How much energy passes to the seabird?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Only
    one tenth of the energy of a level passes to the next level.
- level: 2
  en: Find one tenth of the energy held by the organism, and you have the energy that
    passes on.
- level: 3
  en: One tenth of a number is the number divided by 10.
prediction_prompt:
  en: Before you calculate, should the answer be larger or smaller than the energy
    given?
