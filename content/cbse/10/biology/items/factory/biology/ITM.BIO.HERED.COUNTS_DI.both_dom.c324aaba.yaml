stem:
  en: In a certain animal species, the allele L for long hair is dominant over the
    allele l for short hair, and the allele E for curly tails is dominant over the
    allele e for straight tails. The two genes are on different chromosomes and are
    inherited independently. An animal with genotype LlEe is crossed with an animal
    with genotype LLEe. The cross produces 64 offspring. How many of them are expected
    to show long hair and curly tails?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. First find the share of
    the offspring that show the outcome, using a Punnett square.
- level: 2
  en: Then multiply that share by the total number of offspring to get the expected
    number.
- level: 3
  en: The first parent makes the gametes LE, Le, lE and le, and the second parent
    makes the gametes LE and Le.
prediction_prompt:
  en: Before you calculate, should the answer be more or less than half of the offspring?
