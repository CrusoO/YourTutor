stem:
  en: In a certain animal species, the allele E for curly tails is dominant over the
    allele e for straight tails. An animal with genotype Ee is crossed with an animal
    with genotype ee. What is the ratio of offspring with curly tails to offspring
    with straight tails?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Find
    the gametes each parent can make, then combine them in a Punnett square.
- level: 2
  en: Count how many boxes of the square show each phenotype, then write the counts
    as a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes E and e, and the second parent makes the
    gametes e.
prediction_prompt:
  en: Before you draw the square, which outcome do you expect to be the most common?
