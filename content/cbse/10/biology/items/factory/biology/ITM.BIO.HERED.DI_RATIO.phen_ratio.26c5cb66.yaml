role: procedure
stem:
  en: In a certain animal species, the allele S for spotted coats is dominant over
    the allele s for plain coats, and the allele E for curly tails is dominant over
    the allele e for straight tails. The two genes are on different chromosomes and
    are inherited independently. An animal with genotype SsEe is crossed with an animal
    with genotype Ssee. What is the ratio of offspring in the groups spotted coats
    and curly tails; spotted coats and straight tails; plain coats and curly tails;
    plain coats and straight tails, in that order?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Find
    the gametes each parent can make, then combine them in a Punnett square.
- level: 2
  en: Count the boxes that show each group of offspring, then write the counts as
    a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes SE, Se, sE and se, and the second parent
    makes the gametes Se and se.
prediction_prompt:
  en: Before you draw the square, how many boxes will it have?
