solution_steps:
- en: The first parent SsEe makes the gametes SE, Se, sE and se; the second parent
    Ssee makes the gametes Se and se.
- en: Pair every gamete of the first parent with every gamete of the second in a Punnett
    square.
- en: 'Out of 16 boxes, spotted coats and curly tails: 6; spotted coats and straight
    tails: 6; plain coats and curly tails: 2; plain coats and straight tails: 2.'
- en: 'Write the counts in the order asked, in the lowest terms: 3 : 3 : 1 : 1.'
