stem:
  en: In the food chain grass → deer → tiger, the deer receives 100000 kJ of energy.
    Assume that only 10 percent of the energy at one trophic level passes to the next
    level. How much energy did the grass capture?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Going
    up the chain, each level holds one tenth of the level before it, so going back
    down the chain each level holds ten times more.
- level: 2
  en: Count the steps between the first level and the organism named, then undo one
    tenth for each step.
- level: 3
  en: The deer is one step above the grass.
prediction_prompt:
  en: Before you calculate, should the answer be larger or smaller than the energy
    given?
