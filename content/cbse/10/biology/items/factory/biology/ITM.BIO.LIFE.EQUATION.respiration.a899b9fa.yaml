solution_steps:
- en: In the equation, the number in front of oxygen is 6 and the number in front
    of water is 6.
- en: The ratio of water to oxygen is 6 to 6.
- en: 'Scale up: 20 x 6 divided by 6 = 20 molecules.'
- en: The correct option is c.
