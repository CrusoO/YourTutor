stem:
  en: In a certain plant species, the allele T for tall stems is dominant over the
    allele t for short stems, and the allele Y for yellow seeds is dominant over the
    allele y for green seeds. The two genes are on different chromosomes and are inherited
    independently. A plant with genotype TTYy is crossed with a plant with genotype
    ttyy. The cross produces 320 offspring. How many of them are expected to show
    tall stems and yellow seeds?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. First find the share of
    the offspring that show the outcome, using a Punnett square.
- level: 2
  en: Then multiply that share by the total number of offspring to get the expected
    number.
- level: 3
  en: The first parent makes the gametes TY and Ty, and the second parent makes the
    gametes ty.
prediction_prompt:
  en: Before you calculate, should the answer be more or less than half of the offspring?
