stem:
  en: 'In a certain plant species, the allele W for smooth leaves is dominant over
    the allele w for hairy leaves. A plant with genotype Ww is crossed with a plant
    with genotype ww. What is the ratio of the offspring genotypes Ww : ww?'
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Find
    the gametes each parent can make, then combine them in a Punnett square.
- level: 2
  en: Count how many boxes of the square show each genotype, then write the counts
    as a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes W and w, and the second parent makes the
    gametes w.
prediction_prompt:
  en: Before you draw the square, which outcome do you expect to be the most common?
