stem:
  en: In a certain plant species, the allele Y for yellow seeds is dominant over the
    allele y for green seeds. How many different types of gametes can a plant with
    genotype Yy produce?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. A
    gamete carries one allele from each gene. Different gametes differ in the alleles
    they carry.
- level: 2
  en: A gene whose two alleles are the same gives only one choice. A gene whose alleles
    differ gives two choices.
- level: 3
  en: Write the choices for each gene, then combine the choices of the different genes
    by multiplying them.
prediction_prompt:
  en: Before you count, should the answer be a small number or a large one?
