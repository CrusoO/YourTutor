stem:
  en: A couple already has 2 children and all of them are girls. Assume each child
    is equally likely to be a boy or a girl, whatever the earlier children were. What
    is the probability that their next child is a boy? Give the answer as a fraction.
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Ask whether the earlier
    births change the chance for the next birth.
- level: 2
  en: Each birth is independent of the earlier ones.
- level: 3
  en: Only the next child matters, and the earlier children play no part.
prediction_prompt:
  en: Before you calculate, is the outcome likely or unlikely?
