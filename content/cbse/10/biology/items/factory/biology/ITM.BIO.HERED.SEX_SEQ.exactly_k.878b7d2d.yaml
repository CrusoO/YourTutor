stem:
  en: A couple has 5 children. Assume each child is equally likely to be a boy or
    a girl, whatever the earlier children were. What is the probability that exactly
    1 of the 5 children are boys? Give the answer as a fraction.
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Each
    child is a boy or a girl with the same chance, so list the equally likely sequences
    of births.
- level: 2
  en: Count the sequences that have exactly the number of boys asked for, then divide
    by the number of all the sequences.
- level: 3
  en: The number of sequences is 2 multiplied by itself once for each child.
prediction_prompt:
  en: Before you calculate, is the outcome likely or unlikely?
