stem:
  en: In a certain animal species, the allele L for long hair is dominant over the
    allele l for short hair. An animal with genotype Ll is crossed with an animal
    with genotype Ll. What is the probability that one offspring, picked at random,
    has short hair? Give the answer as a fraction.
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Find the gametes each
    parent can make, then combine them in a Punnett square.
- level: 2
  en: A probability is the number of boxes that show the outcome asked for, divided
    by the number of all the boxes.
- level: 3
  en: The first parent makes the gametes L and l, and the second parent makes the
    gametes L and l.
prediction_prompt:
  en: Before you calculate, is the outcome asked for more likely or less likely than
    the other?
