stem:
  en: A chemical that organisms cannot break down is passed along a food chain. At
    each step up the chain, its concentration in the body becomes 3 times as large.
    In the food chain leaves → caterpillar → small bird → hawk, the leaves contains
    1 ppm of the chemical. What is the concentration in the caterpillar?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. The
    concentration is multiplied by the same factor at every step up the chain.
- level: 2
  en: Count the steps from the first organism to the organism asked about, then multiply
    by the factor once for each step.
- level: 3
  en: The caterpillar is one step above the leaves.
prediction_prompt:
  en: Before you calculate, will the concentration be larger or smaller than the one
    given?
