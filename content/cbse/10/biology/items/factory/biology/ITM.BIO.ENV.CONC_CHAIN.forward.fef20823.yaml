stem:
  en: A chemical that organisms cannot break down is passed along a food chain. At
    each step up the chain, its concentration in the body becomes 5 times as large.
    In the food chain grass → grasshopper → frog → snake → hawk, the grass contains
    3 ppm of the chemical. What is the concentration in the hawk?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. The concentration is multiplied
    by the same factor at every step up the chain.
- level: 2
  en: Count the steps from the first organism to the organism asked about, then multiply
    by the factor once for each step.
- level: 3
  en: The hawk is four steps above the grass.
prediction_prompt:
  en: Before you calculate, will the concentration be larger or smaller than the one
    given?
