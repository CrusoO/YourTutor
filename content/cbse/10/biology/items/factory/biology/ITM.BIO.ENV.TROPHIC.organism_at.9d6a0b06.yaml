stem:
  en: A producer is at trophic level 1. A primary consumer eats the producer, a secondary
    consumer eats a primary consumer, a tertiary consumer eats a secondary consumer,
    and so on. In the food chain grass → grasshopper → frog → snake → hawk, which
    organism is the tertiary consumer? Each organism in the chain is eaten by the
    next one.
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. A
    consumer order counts from the first animal that eats the producer, not from the
    producer itself.
- level: 2
  en: The primary consumer is the organism right after the producer, the secondary
    consumer is the one after that, and so on.
- level: 3
  en: Count the consumers along the chain, leaving the producer out of the count.
prediction_prompt:
  en: Before you count, which end of the chain is the producer?
