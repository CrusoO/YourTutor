role: apply
stem:
  en: In the food chain phytoplankton → zooplankton → small fish → large fish → seabird,
    the phytoplankton captures 1000000 J of energy. Assume that only 10 percent of
    the energy at one trophic level passes to the next level. How much energy is lost
    in total before energy reaches the seabird?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. The
    energy lost is the energy captured at the start minus the energy that reaches
    the organism.
- level: 2
  en: First find the energy that reaches the organism, by taking one tenth for each
    step.
- level: 3
  en: Going from the first level to level five takes four steps.
prediction_prompt:
  en: Before you calculate, will most of the energy be lost or passed on?
