solution_steps:
- en: In the equation, the number in front of carbon dioxide is 6 and the number in
    front of oxygen is 6.
- en: The ratio of oxygen to carbon dioxide is 6 to 6.
- en: 'Scale up: 10 x 6 divided by 6 = 10 molecules.'
- en: The correct option is d.
