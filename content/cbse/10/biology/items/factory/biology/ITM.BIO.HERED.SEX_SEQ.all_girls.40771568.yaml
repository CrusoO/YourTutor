stem:
  en: A couple has 5 children. Assume each child is equally likely to be a boy or
    a girl, whatever the earlier children were. What is the probability that all 5
    children are girls? Give the answer as a fraction.
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Each birth is independent
    of the others, so the chance of a run of births is found by combining the chances
    of the single births.
- level: 2
  en: Combine the chances of the single births by multiplying them.
- level: 3
  en: The chance for one child being a girl is one half.
