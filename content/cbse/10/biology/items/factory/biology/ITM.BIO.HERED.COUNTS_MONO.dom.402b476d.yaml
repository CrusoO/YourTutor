stem:
  en: In a certain animal species, the allele L for long hair is dominant over the
    allele l for short hair. An animal with genotype Ll is crossed with an animal
    with genotype Ll. The cross produces 800 offspring. How many of them are expected
    to have long hair?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. First find the share of
    the offspring that show the outcome, using a Punnett square.
- level: 2
  en: Then multiply that share by the total number of offspring to get the expected
    number.
- level: 3
  en: The first parent makes the gametes L and l, and the second parent makes the
    gametes L and l.
prediction_prompt:
  en: Before you calculate, should the answer be more or less than half of the offspring?
