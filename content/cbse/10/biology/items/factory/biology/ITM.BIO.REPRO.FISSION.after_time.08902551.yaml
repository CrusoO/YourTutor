stem:
  en: A culture of single-celled organisms starts with 3 cells. Assume that every
    cell divides into two cells in each round of division, that all the cells divide
    together, and that no cell dies. One round of division takes 60 minutes. How many
    cells are there after 300 minutes?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. First
    find how many rounds of division fit into the time.
- level: 2
  en: Divide the total time by the time one round takes, then multiply the cells by
    2 once for each round.
- level: 3
  en: Each round takes 60 minutes.
prediction_prompt:
  en: Before you calculate, will the answer be a little more or a lot more than the
    starting number?
