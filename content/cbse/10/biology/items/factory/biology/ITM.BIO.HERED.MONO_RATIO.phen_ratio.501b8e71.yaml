stem:
  en: In a certain plant species, the allele T for tall stems is dominant over the
    allele t for short stems. A plant with genotype Tt is crossed with a plant with
    genotype Tt. What is the ratio of offspring with tall stems to offspring with
    short stems?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Find the gametes each
    parent can make, then combine them in a Punnett square.
- level: 2
  en: Count how many boxes of the square show each phenotype, then write the counts
    as a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes T and t, and the second parent makes the
    gametes T and t.
prediction_prompt:
  en: Before you draw the square, which outcome do you expect to be the most common?
