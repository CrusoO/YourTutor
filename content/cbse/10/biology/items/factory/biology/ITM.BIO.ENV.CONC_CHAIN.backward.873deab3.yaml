stem:
  en: A chemical that organisms cannot break down is passed along a food chain. At
    each step up the chain, its concentration in the body becomes 2 times as large.
    In the food chain grass → grasshopper → frog → snake → hawk, the hawk contains
    64 ppm of the chemical. What is the concentration in the grass?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Going
    back down the chain undoes the multiplying, so divide by the factor for each step.
- level: 2
  en: Count the steps between the two organisms, then divide by the factor once for
    each step.
- level: 3
  en: The hawk is four steps above the grass.
prediction_prompt:
  en: Before you calculate, will the concentration be larger or smaller than the one
    given?
