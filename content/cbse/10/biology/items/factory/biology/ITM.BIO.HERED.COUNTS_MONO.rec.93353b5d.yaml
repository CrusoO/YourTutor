solution_steps:
- en: The first parent Ss makes the gametes S and s; the second parent ss makes the
    gametes s.
- en: 'Out of 4 boxes, spotted coats: 2; plain coats: 2.'
- en: The share of offspring wanted is 1/2.
- en: 'Multiply the share by the total: 1/2 x 800 = 400.'
- en: The correct option is d.
