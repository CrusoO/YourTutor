solution_steps:
- en: The first parent BbLl makes the gametes BL, Bl, bL and bl; the second parent
    bbll makes the gametes bl.
- en: 'Out of 16 boxes, black coats and long hair: 4; black coats and short hair:
    4; brown coats and long hair: 4; brown coats and short hair: 4.'
- en: The share of offspring wanted is 1/4.
- en: 'Multiply the share by the total: 1/4 x 64 = 16.'
- en: The correct option is c.
