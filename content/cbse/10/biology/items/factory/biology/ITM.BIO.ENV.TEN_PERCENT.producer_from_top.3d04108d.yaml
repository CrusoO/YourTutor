stem:
  en: In the food chain algae → water snail → small fish → heron, the small fish receives
    200 kJ of energy. Assume that only 10 percent of the energy at one trophic level
    passes to the next level. How much energy did the algae capture?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Going
    up the chain, each level holds one tenth of the level before it, so going back
    down the chain each level holds ten times more.
- level: 2
  en: Count the steps between the first level and the organism named, then undo one
    tenth for each step.
- level: 3
  en: The small fish is two steps above the algae.
prediction_prompt:
  en: Before you calculate, should the answer be larger or smaller than the energy
    given?
