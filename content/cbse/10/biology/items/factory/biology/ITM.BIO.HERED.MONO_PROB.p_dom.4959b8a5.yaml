stem:
  en: In a certain plant species, the allele R for round seeds is dominant over the
    allele r for wrinkled seeds. A plant with genotype Rr is crossed with a plant
    with genotype Rr. What is the probability that one offspring, picked at random,
    has round seeds? Give the answer as a fraction.
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Find
    the gametes each parent can make, then combine them in a Punnett square.
- level: 2
  en: A probability is the number of boxes that show the outcome asked for, divided
    by the number of all the boxes.
- level: 3
  en: The first parent makes the gametes R and r, and the second parent makes the
    gametes R and r.
prediction_prompt:
  en: Before you calculate, is the outcome asked for more likely or less likely than
    the other?
