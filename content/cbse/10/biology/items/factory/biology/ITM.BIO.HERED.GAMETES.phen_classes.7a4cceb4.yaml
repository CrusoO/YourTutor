stem:
  en: In a certain plant species, the allele P for purple flowers is dominant over
    the allele p for white flowers, and the allele Y for yellow seeds is dominant
    over the allele y for green seeds. The two genes are on different chromosomes
    and are inherited independently. A plant with genotype PpYy is crossed with a
    plant with genotype ppyy. How many different appearances can the offspring have?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Fill in the Punnett square
    and look at which outcomes actually appear.
- level: 2
  en: Count each different outcome once, however many boxes show it. An outcome that
    no box shows does not count.
- level: 3
  en: The first parent makes the gametes PY, Py, pY and py, and the second parent
    makes the gametes py.
prediction_prompt:
  en: Before you count, should the answer be a small number or a large one?
