role: procedure
stem:
  en: A flatworm is cut into 10 pieces. Assume that every piece grows into a complete
    new organism. Later, every one of these new organisms is cut into 5 pieces in
    the same way. How many organisms can grow from the second round of cutting?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. After the first round,
    there are several organisms, and every one of them is cut again.
- level: 2
  en: Each organism gives the same number of pieces, so combine the two counts by
    multiplying them.
- level: 3
  en: Count the organisms after the first round, then count the pieces that each of
    them makes.
prediction_prompt:
  en: Before you count, will there be more pieces than cuts, or fewer?
