stem:
  en: In a certain plant species, the allele D for broad leaves is dominant over the
    allele d for narrow leaves. A plant with genotype Dd is crossed with a plant with
    genotype dd. The cross produces 200 offspring. How many of them are expected to
    have broad leaves?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. First
    find the share of the offspring that show the outcome, using a Punnett square.
- level: 2
  en: Then multiply that share by the total number of offspring to get the expected
    number.
- level: 3
  en: The first parent makes the gametes D and d, and the second parent makes the
    gametes d.
prediction_prompt:
  en: Before you calculate, should the answer be more or less than half of the offspring?
