solution_steps:
- en: The first parent Dd makes the gametes D and d; the second parent dd makes the
    gametes d.
- en: 'Out of 4 boxes, broad leaves: 2; narrow leaves: 2.'
- en: The share of offspring wanted is 1/2.
- en: 'Multiply the share by the total: 1/2 x 200 = 100.'
- en: The correct option is d.
