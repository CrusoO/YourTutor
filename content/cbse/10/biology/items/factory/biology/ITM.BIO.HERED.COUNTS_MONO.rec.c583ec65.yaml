stem:
  en: In a certain plant species, the allele R for round seeds is dominant over the
    allele r for wrinkled seeds. A plant with genotype Rr is crossed with a plant
    with genotype Rr. The cross produces 160 offspring. How many of them are expected
    to have wrinkled seeds?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. First find the share of
    the offspring that show the outcome, using a Punnett square.
- level: 2
  en: Then multiply that share by the total number of offspring to get the expected
    number.
- level: 3
  en: The first parent makes the gametes R and r, and the second parent makes the
    gametes R and r.
prediction_prompt:
  en: Before you calculate, should the answer be more or less than half of the offspring?
