- en: The first parent Rr makes the gametes R and r; the second parent Rr makes the
    gametes R and r.
- en: 'Out of 4 boxes, round seeds: 3; wrinkled seeds: 1.'
- en: The share of offspring wanted is 1/4.
- en: 'Multiply the share by the total: 1/4 x 160 = 40.'
