solution_steps:
- en: The zygote has 30 + 30 = 60 chromosomes, and every cell made by mitosis keeps
    that number.
- en: After 3 rounds there are 2 to the power 3 = 8 cells.
- en: The total is 8 x 60 = 480 chromosomes.
- en: The correct option is c.
