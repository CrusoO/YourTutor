stem:
  en: In the food chain grass → grasshopper → frog → snake → hawk, the grass captures
    1000000 kJ of energy. Assume that only 10 percent of the energy at one trophic
    level passes to the next level. How much energy reaches the snake?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Each
    step along the food chain keeps one tenth of the energy of the level before it.
- level: 2
  en: Count the steps from the first level to the level asked about, then apply the
    one tenth for every step.
- level: 3
  en: Going from the first level to level four takes three steps.
prediction_prompt:
  en: Before you calculate, should the answer be larger or smaller than the energy
    given?
