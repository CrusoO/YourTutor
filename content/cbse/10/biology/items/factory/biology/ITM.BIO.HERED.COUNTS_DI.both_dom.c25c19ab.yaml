stem:
  en: In a certain plant species, the allele P for purple flowers is dominant over
    the allele p for white flowers, and the allele Y for yellow seeds is dominant
    over the allele y for green seeds. The two genes are on different chromosomes
    and are inherited independently. A plant with genotype PpYy is crossed with a
    plant with genotype ppYy. The cross produces 1600 offspring. How many of them
    are expected to show purple flowers and yellow seeds?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. First find the share of
    the offspring that show the outcome, using a Punnett square.
- level: 2
  en: Then multiply that share by the total number of offspring to get the expected
    number.
- level: 3
  en: The first parent makes the gametes PY, Py, pY and py, and the second parent
    makes the gametes pY and py.
prediction_prompt:
  en: Before you calculate, should the answer be more or less than half of the offspring?
