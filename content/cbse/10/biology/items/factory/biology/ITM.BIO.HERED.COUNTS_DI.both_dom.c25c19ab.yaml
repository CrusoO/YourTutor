solution_steps:
- en: The first parent PpYy makes the gametes PY, Py, pY and py; the second parent
    ppYy makes the gametes pY and py.
- en: 'Out of 16 boxes, purple flowers and yellow seeds: 6; purple flowers and green
    seeds: 2; white flowers and yellow seeds: 6; white flowers and green seeds: 2.'
- en: The share of offspring wanted is 3/8.
- en: 'Multiply the share by the total: 3/8 x 1600 = 600.'
- en: The correct option is a.
