stem:
  en: In the food chain leaves → caterpillar → small bird → hawk, the caterpillar
    holds 50000 kJ of energy. Assume that only 10 percent of the energy at one trophic
    level passes to the next level. How much energy reaches the small bird?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Each
    step along the food chain keeps one tenth of the energy of the level before it.
- level: 2
  en: Count the steps from the organism that holds the energy to the organism that
    receives it.
- level: 3
  en: From the caterpillar to the small bird takes one step.
prediction_prompt:
  en: Before you calculate, should the answer be larger or smaller than the energy
    given?
