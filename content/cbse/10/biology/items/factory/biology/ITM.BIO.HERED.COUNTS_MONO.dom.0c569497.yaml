stem:
  en: In a certain animal species, the allele S for spotted coats is dominant over
    the allele s for plain coats. An animal with genotype Ss is crossed with an animal
    with genotype ss. The cross produces 80 offspring. How many of them are expected
    to have spotted coats?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. First
    find the share of the offspring that show the outcome, using a Punnett square.
- level: 2
  en: Then multiply that share by the total number of offspring to get the expected
    number.
- level: 3
  en: The first parent makes the gametes S and s, and the second parent makes the
    gametes s.
prediction_prompt:
  en: Before you calculate, should the answer be more or less than half of the offspring?
