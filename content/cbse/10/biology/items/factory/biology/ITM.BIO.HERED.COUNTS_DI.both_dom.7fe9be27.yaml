solution_steps:
- en: The first parent BbLl makes the gametes BL, Bl, bL and bl; the second parent
    bbLl makes the gametes bL and bl.
- en: 'Out of 16 boxes, black coats and long hair: 6; black coats and short hair:
    2; brown coats and long hair: 6; brown coats and short hair: 2.'
- en: The share of offspring wanted is 3/8.
- en: 'Multiply the share by the total: 3/8 x 64 = 24.'
- en: The correct option is d.
