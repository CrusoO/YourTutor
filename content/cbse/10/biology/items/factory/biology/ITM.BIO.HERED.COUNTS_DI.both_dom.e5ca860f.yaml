solution_steps:
- en: The first parent TTRr makes the gametes TR and Tr; the second parent ttrr makes
    the gametes tr.
- en: 'Out of 16 boxes, tall stems and round seeds: 8; tall stems and wrinkled seeds:
    8.'
- en: The share of offspring wanted is 1/2.
- en: 'Multiply the share by the total: 1/2 x 160 = 80.'
- en: The correct option is b.
