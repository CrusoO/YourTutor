stem:
  en: In a certain animal species, the allele E for curly tails is dominant over the
    allele e for straight tails. An animal with genotype EE is crossed with an animal
    with genotype Ee. A Punnett square has one row for each different gamete type
    of the first parent and one column for each different gamete type of the second
    parent. How many boxes does it have?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Count
    the different gamete types of each parent first. A type that repeats counts once.
- level: 2
  en: Each row is paired with each column, so combine the two counts by multiplying.
- level: 3
  en: The first parent makes the gametes E, and the second parent makes the gametes
    E and e.
prediction_prompt:
  en: Before you count, should the answer be a small number or a large one?
