solution_steps:
- en: The first parent SSEe makes the gametes SE and Se; the second parent ssee makes
    the gametes se.
- en: 'Out of 16 boxes, spotted coats and curly tails: 8; spotted coats and straight
    tails: 8.'
- en: The share of offspring wanted is 1/2.
- en: 'Multiply the share by the total: 1/2 x 640 = 320.'
- en: The correct option is a.
