solution_steps:
- en: The zygote has 20 + 20 = 40 chromosomes, and every cell made by mitosis keeps
    that number.
- en: After 4 rounds there are 2 to the power 4 = 16 cells.
- en: The total is 16 x 40 = 640 chromosomes.
- en: The correct option is d.
