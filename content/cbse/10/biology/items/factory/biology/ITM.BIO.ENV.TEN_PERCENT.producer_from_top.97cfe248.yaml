stem:
  en: In the food chain grass → grasshopper → frog → snake → hawk, the snake receives
    20 kJ of energy. Assume that only 10 percent of the energy at one trophic level
    passes to the next level. How much energy did the grass capture?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Going up the chain, each
    level holds one tenth of the level before it, so going back down the chain each
    level holds ten times more.
- level: 2
  en: Count the steps between the first level and the organism named, then undo one
    tenth for each step.
- level: 3
  en: The snake is three steps above the grass.
prediction_prompt:
  en: Before you calculate, should the answer be larger or smaller than the energy
    given?
