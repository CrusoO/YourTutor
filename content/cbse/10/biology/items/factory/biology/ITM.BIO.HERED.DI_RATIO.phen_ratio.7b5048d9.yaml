role: procedure
stem:
  en: In a certain animal species, the allele B for black coats is dominant over the
    allele b for brown coats, and the allele L for long hair is dominant over the
    allele l for short hair. The two genes are on different chromosomes and are inherited
    independently. An animal with genotype Bbll is crossed with an animal with genotype
    bbLl. What is the ratio of offspring in the groups black coats and long hair;
    black coats and short hair; brown coats and long hair; brown coats and short hair,
    in that order?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Find
    the gametes each parent can make, then combine them in a Punnett square.
- level: 2
  en: Count the boxes that show each group of offspring, then write the counts as
    a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes Bl and bl, and the second parent makes the
    gametes bL and bl.
prediction_prompt:
  en: Before you draw the square, how many boxes will it have?
