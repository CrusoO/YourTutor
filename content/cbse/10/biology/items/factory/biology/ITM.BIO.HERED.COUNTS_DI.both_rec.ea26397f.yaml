solution_steps:
- en: The first parent Ppyy makes the gametes Py and py; the second parent ppYy makes
    the gametes pY and py.
- en: 'Out of 16 boxes, purple flowers and yellow seeds: 4; purple flowers and green
    seeds: 4; white flowers and yellow seeds: 4; white flowers and green seeds: 4.'
- en: The share of offspring wanted is 1/4.
- en: 'Multiply the share by the total: 1/4 x 320 = 80.'
- en: The correct option is b.
