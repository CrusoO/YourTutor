stem:
  en: In the food chain phytoplankton → zooplankton → small fish → large fish → seabird,
    the zooplankton holds 5000 kJ of energy. Assume that only 10 percent of the energy
    at one trophic level passes to the next level. How much energy is lost when energy
    passes from the zooplankton to the small fish?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. The
    energy that passes on is one tenth, so the rest is lost.
- level: 2
  en: Take the energy that passes on away from the energy the organism holds, or find
    nine tenths of it directly.
- level: 3
  en: Nine tenths of a number is the number divided by 10 and then multiplied by 9.
prediction_prompt:
  en: Before you calculate, will most of the energy be lost or passed on?
