solution_steps:
- en: In the equation, the number in front of glucose is 1 and the number in front
    of carbon dioxide is 6.
- en: The ratio of carbon dioxide to glucose is 6 to 1.
- en: 'Scale up: 2 x 6 divided by 1 = 12 molecules.'
- en: The correct option is a.
