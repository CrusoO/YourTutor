stem:
  en: Photosynthesis can be written as 6 CO2 + 6 H2O → C6H12O6 + 6 O2. In one experiment,
    4 molecules of carbon dioxide are used up. How many molecules of oxygen are made
    in the same experiment?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. The numbers written in
    front of the formulas show how many molecules take part, in proportion.
- level: 2
  en: Find the number in front of each of the two substances in the question, and
    use their ratio to scale the number of molecules given.
- level: 3
  en: Write the number of molecules wanted as the number given multiplied by the ratio
    of the two numbers in front of the formulas.
prediction_prompt:
  en: Before you calculate, will there be more or fewer molecules of the second substance
    than of the first?
