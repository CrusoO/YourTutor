stem:
  en: 'In a certain plant species, the allele R for round seeds is dominant over the
    allele r for wrinkled seeds. A plant with genotype Rr is crossed with a plant
    with genotype Rr. What is the ratio of the offspring genotypes RR : Rr : rr?'
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Find the gametes each
    parent can make, then combine them in a Punnett square.
- level: 2
  en: Count how many boxes of the square show each genotype, then write the counts
    as a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes R and r, and the second parent makes the
    gametes R and r.
prediction_prompt:
  en: Before you draw the square, which outcome do you expect to be the most common?
