stem:
  en: A gamete has half the number of chromosomes of a body cell. A zygote forms when
    a sperm and an egg join. A cell made by mitosis has the same number of chromosomes
    as the cell that divided. In a certain insect species, each gamete has 14 chromosomes.
    How many chromosomes does the zygote have?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. The zygote gets the chromosomes
    of the sperm and of the egg.
- level: 2
  en: Add the chromosomes that come from the sperm and from the egg.
- level: 3
  en: Both gametes have the same number of chromosomes.
prediction_prompt:
  en: Before you calculate, will the number be larger or smaller than the number given?
