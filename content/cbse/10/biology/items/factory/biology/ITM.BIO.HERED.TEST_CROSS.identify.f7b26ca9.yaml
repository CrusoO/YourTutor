stem:
  en: In a certain plant species, the allele T for tall stems is dominant over the
    allele t for short stems, and the allele R for round seeds is dominant over the
    allele r for wrinkled seeds. The two genes are on different chromosomes and are
    inherited independently. A plant with tall stems and round seeds is test-crossed
    with a plant with short stems and wrinkled seeds. The result of the test cross
    is that the offspring fall into four equal groups, namely tall stems and round
    seeds; tall stems and wrinkled seeds; short stems and round seeds; short stems
    and wrinkled seeds. What is the genotype of the plant that was tested?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. The
    parent used for the test cross passes on only recessive alleles, so each offspring
    shows which allele the tested parent passed on.
- level: 2
  en: Count how many different groups of offspring appear. Each heterozygous gene
    of the tested parent doubles that number.
- level: 3
  en: Check a candidate by writing its gametes and pairing them with the gametes of
    the other parent in a Punnett square.
prediction_prompt:
  en: Before you decide, how many different gamete types must the tested parent make?
