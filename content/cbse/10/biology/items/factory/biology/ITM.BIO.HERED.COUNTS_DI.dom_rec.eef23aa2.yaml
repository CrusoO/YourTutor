solution_steps:
- en: The first parent SsEe makes the gametes SE, Se, sE and se; the second parent
    ssee makes the gametes se.
- en: 'Out of 16 boxes, spotted coats and curly tails: 4; spotted coats and straight
    tails: 4; plain coats and curly tails: 4; plain coats and straight tails: 4.'
- en: The share of offspring wanted is 1/4.
- en: 'Multiply the share by the total: 1/4 x 160 = 40.'
- en: The correct option is d.
