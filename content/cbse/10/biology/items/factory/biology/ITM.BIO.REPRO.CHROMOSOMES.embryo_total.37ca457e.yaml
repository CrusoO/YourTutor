solution_steps:
- en: The zygote has 6 + 6 = 12 chromosomes, and every cell made by mitosis keeps
    that number.
- en: After 3 rounds there are 2 to the power 3 = 8 cells.
- en: The total is 8 x 12 = 96 chromosomes.
- en: The correct option is a.
