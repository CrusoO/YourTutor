stem:
  en: In a certain animal species, the allele L for long hair is dominant over the
    allele l for short hair, and the allele E for curly tails is dominant over the
    allele e for straight tails. The two genes are on different chromosomes and are
    inherited independently. An animal with genotype LlEe is crossed with an animal
    with genotype LlEE. What is the ratio of offspring in the groups long hair and
    curly tails; short hair and curly tails, in that order?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Find
    the gametes each parent can make, then combine them in a Punnett square.
- level: 2
  en: Count the boxes that show each group of offspring, then write the counts as
    a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes LE, Le, lE and le, and the second parent
    makes the gametes LE and lE.
prediction_prompt:
  en: Before you draw the square, how many boxes will it have?
