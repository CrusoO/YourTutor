stem:
  en: An amoeba culture starts with 1 cell. Assume that every cell divides into two
    cells in each round of division, that all the cells divide together, and that
    no cell dies. After some rounds there are 8 cells. How many rounds of division
    took place?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Find
    how many times larger the culture has become than at the start.
- level: 2
  en: Ask how many times 2 must be multiplied by itself to give that number.
- level: 3
  en: Keep halving the factor until you reach 1, and count the halvings.
prediction_prompt:
  en: Before you calculate, will the answer be a little more or a lot more than the
    starting number?
