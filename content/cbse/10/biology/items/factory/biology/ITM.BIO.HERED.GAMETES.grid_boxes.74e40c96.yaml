stem:
  en: In a certain animal species, the allele B for black coats is dominant over the
    allele b for brown coats, and the allele L for long hair is dominant over the
    allele l for short hair. The two genes are on different chromosomes and are inherited
    independently. An animal with genotype BBLl is crossed with an animal with genotype
    bbll. A Punnett square has one row for each different gamete type of the first
    parent and one column for each different gamete type of the second parent. How
    many boxes does it have?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Count the different gamete
    types of each parent first. A type that repeats counts once.
- level: 2
  en: Each row is paired with each column, so combine the two counts by multiplying.
- level: 3
  en: The first parent makes the gametes BL and Bl, and the second parent makes the
    gametes bl.
prediction_prompt:
  en: Before you count, should the answer be a small number or a large one?
