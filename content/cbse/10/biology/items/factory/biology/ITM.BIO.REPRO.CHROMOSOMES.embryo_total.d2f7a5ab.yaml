solution_steps:
- en: The zygote has 6 + 6 = 12 chromosomes, and every cell made by mitosis keeps
    that number.
- en: After 2 rounds there are 2 to the power 2 = 4 cells.
- en: The total is 4 x 12 = 48 chromosomes.
- en: The correct option is b.
