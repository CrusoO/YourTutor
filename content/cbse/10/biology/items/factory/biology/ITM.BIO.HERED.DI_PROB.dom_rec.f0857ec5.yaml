stem:
  en: In a certain animal species, the allele B for black coats is dominant over the
    allele b for brown coats, and the allele L for long hair is dominant over the
    allele l for short hair. The two genes are on different chromosomes and are inherited
    independently. An animal with genotype BbLl is crossed with an animal with genotype
    bbll. What is the probability that one offspring, picked at random, shows black
    coats and short hair? Give the answer as a fraction.
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. The
    two genes are inherited independently, so each gene can be worked out on its own.
- level: 2
  en: Find the chance of the wanted outcome for the first gene, then for the second
    gene, then combine the two chances by multiplying.
- level: 3
  en: The first parent makes the gametes BL, Bl, bL and bl, and the second parent
    makes the gametes bl.
prediction_prompt:
  en: Before you calculate, is the outcome common or rare among the offspring?
