stem:
  en: In a certain plant species, the allele D for broad leaves is dominant over the
    allele d for narrow leaves. A plant with genotype Dd is crossed with a plant with
    genotype dd. How many different genotypes can the offspring have?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Fill in the Punnett square
    and look at which outcomes actually appear.
- level: 2
  en: Count each different outcome once, however many boxes show it. An outcome that
    no box shows does not count.
- level: 3
  en: The first parent makes the gametes D and d, and the second parent makes the
    gametes d.
