solution_steps:
- en: The first parent Tt makes the gametes T and t; the second parent tt makes the
    gametes t.
- en: 'Out of 4 boxes, tall stems: 2; short stems: 2.'
- en: The share of offspring wanted is 1/2.
- en: 'Multiply the share by the total: 1/2 x 200 = 100.'
- en: The correct option is c.
