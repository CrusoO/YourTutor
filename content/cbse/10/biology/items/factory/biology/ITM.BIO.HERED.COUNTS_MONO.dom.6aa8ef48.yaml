solution_steps:
- en: The first parent Ee makes the gametes E and e; the second parent ee makes the
    gametes e.
- en: 'Out of 4 boxes, curly tails: 2; straight tails: 2.'
- en: The share of offspring wanted is 1/2.
- en: 'Multiply the share by the total: 1/2 x 800 = 400.'
- en: The correct option is c.
