stem:
  en: In a certain animal species, the allele E for curly tails is dominant over the
    allele e for straight tails. An animal with genotype Ee is crossed with an animal
    with genotype ee. The cross produces 800 offspring. How many of them are expected
    to have curly tails?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. First
    find the share of the offspring that show the outcome, using a Punnett square.
- level: 2
  en: Then multiply that share by the total number of offspring to get the expected
    number.
- level: 3
  en: The first parent makes the gametes E and e, and the second parent makes the
    gametes e.
prediction_prompt:
  en: Before you calculate, should the answer be more or less than half of the offspring?
