solution_steps:
- en: In the equation, the number in front of glucose is 1 and the number in front
    of oxygen is 6.
- en: The ratio of oxygen to glucose is 6 to 1.
- en: 'Scale up: 4 x 6 divided by 1 = 24 molecules.'
- en: The correct option is d.
