role: procedure
stem:
  en: In a certain plant species, the allele T for tall stems is dominant over the
    allele t for short stems, and the allele Y for yellow seeds is dominant over the
    allele y for green seeds. The two genes are on different chromosomes and are inherited
    independently. A plant with genotype TtYy is crossed with a plant with genotype
    Ttyy. What is the ratio of offspring in the groups tall stems and yellow seeds;
    tall stems and green seeds; short stems and yellow seeds; short stems and green
    seeds, in that order?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Find
    the gametes each parent can make, then combine them in a Punnett square.
- level: 2
  en: Count the boxes that show each group of offspring, then write the counts as
    a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes TY, Ty, tY and ty, and the second parent
    makes the gametes Ty and ty.
prediction_prompt:
  en: Before you draw the square, how many boxes will it have?
