solution_steps:
- en: The first parent SsEe makes the gametes SE, Se, sE and se; the second parent
    SSEe makes the gametes SE and Se.
- en: 'Out of 16 boxes, spotted coats and curly tails: 12; spotted coats and straight
    tails: 4.'
- en: The share of offspring wanted is 3/4.
- en: 'Multiply the share by the total: 3/4 x 320 = 240.'
- en: The correct option is b.
