stem:
  en: In a certain plant species, the allele P for purple flowers is dominant over
    the allele p for white flowers, and the allele Y for yellow seeds is dominant
    over the allele y for green seeds. The two genes are on different chromosomes
    and are inherited independently. A plant with genotype PPYy is crossed with a
    plant with genotype ppyy. What is the ratio of offspring in the groups purple
    flowers and yellow seeds; purple flowers and green seeds, in that order?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Find
    the gametes each parent can make, then combine them in a Punnett square.
- level: 2
  en: Count the boxes that show each group of offspring, then write the counts as
    a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes PY and Py, and the second parent makes the
    gametes py.
prediction_prompt:
  en: Before you draw the square, how many boxes will it have?
