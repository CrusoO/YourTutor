stem:
  en: A couple has 5 children. Assume each child is equally likely to be a boy or
    a girl, whatever the earlier children were. What is the probability that at least
    one of the 5 children is a boy? Give the answer as a fraction.
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Think
    about the one outcome that does not count, then use the fact that all the outcomes
    together have probability 1.
- level: 2
  en: Find the probability that there is no boy at all, and take it away from 1.
- level: 3
  en: No boy at all means every child is a girl.
prediction_prompt:
  en: Before you calculate, is the outcome likely or unlikely?
