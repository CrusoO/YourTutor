stem:
  en: A chemical that organisms cannot break down is passed along a food chain. At
    each step up the chain, its concentration in the body becomes 2 times as large.
    In the food chain phytoplankton → zooplankton → small fish → large fish → seabird,
    the zooplankton contains 2 ppm of the chemical. What is the concentration in the
    phytoplankton?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Going back down the chain
    undoes the multiplying, so divide by the factor for each step.
- level: 2
  en: Count the steps between the two organisms, then divide by the factor once for
    each step.
- level: 3
  en: The zooplankton is one step above the phytoplankton.
prediction_prompt:
  en: Before you calculate, will the concentration be larger or smaller than the one
    given?
