stem:
  en: In a certain plant species, the allele T for tall stems is dominant over the
    allele t for short stems, and the allele W for smooth leaves is dominant over
    the allele w for hairy leaves. The two genes are on different chromosomes and
    are inherited independently. A plant with genotype TtWw is crossed with a plant
    with genotype ttWw. A Punnett square has one row for each different gamete type
    of the first parent and one column for each different gamete type of the second
    parent. How many boxes does it have?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Count the different gamete
    types of each parent first. A type that repeats counts once.
- level: 2
  en: Each row is paired with each column, so combine the two counts by multiplying.
- level: 3
  en: The first parent makes the gametes TW, Tw, tW and tw, and the second parent
    makes the gametes tW and tw.
prediction_prompt:
  en: Before you count, should the answer be a small number or a large one?
