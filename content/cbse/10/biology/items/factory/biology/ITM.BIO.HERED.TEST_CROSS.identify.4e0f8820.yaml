stem:
  en: In a certain plant species, the allele P for purple flowers is dominant over
    the allele p for white flowers, and the allele T for tall stems is dominant over
    the allele t for short stems. The two genes are on different chromosomes and are
    inherited independently. A plant with purple flowers and tall stems is test-crossed
    with a plant with white flowers and short stems. The result of the test cross
    is that half of the offspring have purple flowers and tall stems, while the other
    half have purple flowers and short stems. What is the genotype of the plant that
    was tested?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. The
    parent used for the test cross passes on only recessive alleles, so each offspring
    shows which allele the tested parent passed on.
- level: 2
  en: Count how many different groups of offspring appear. Each heterozygous gene
    of the tested parent doubles that number.
- level: 3
  en: Check a candidate by writing its gametes and pairing them with the gametes of
    the other parent in a Punnett square.
prediction_prompt:
  en: Before you decide, how many different gamete types must the tested parent make?
