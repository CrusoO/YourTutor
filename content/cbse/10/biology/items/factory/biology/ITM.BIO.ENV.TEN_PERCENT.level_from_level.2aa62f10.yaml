stem:
  en: In the food chain grass → grasshopper → frog → snake → hawk, the grasshopper
    holds 100000 kJ of energy. Assume that only 10 percent of the energy at one trophic
    level passes to the next level. How much energy reaches the hawk?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Each
    step along the food chain keeps one tenth of the energy of the level before it.
- level: 2
  en: Count the steps from the organism that holds the energy to the organism that
    receives it.
- level: 3
  en: From the grasshopper to the hawk takes three steps.
prediction_prompt:
  en: Before you calculate, should the answer be larger or smaller than the energy
    given?
