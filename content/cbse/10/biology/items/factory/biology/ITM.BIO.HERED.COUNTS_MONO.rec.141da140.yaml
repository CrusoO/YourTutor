- en: The first parent Yy makes the gametes Y and y; the second parent Yy makes the
    gametes Y and y.
- en: 'Out of 4 boxes, yellow seeds: 3; green seeds: 1.'
- en: The share of offspring wanted is 1/4.
- en: 'Multiply the share by the total: 1/4 x 800 = 200.'
- en: The correct option is b.
