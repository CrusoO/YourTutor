solution_steps:
- en: The first parent Ssee makes the gametes Se and se; the second parent ssEe makes
    the gametes sE and se.
- en: 'Out of 16 boxes, spotted coats and curly tails: 4; spotted coats and straight
    tails: 4; plain coats and curly tails: 4; plain coats and straight tails: 4.'
- en: The share of offspring wanted is 1/4.
- en: 'Multiply the share by the total: 1/4 x 1600 = 400.'
- en: The correct option is a.
