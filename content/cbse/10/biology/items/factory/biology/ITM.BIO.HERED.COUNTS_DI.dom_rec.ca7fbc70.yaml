solution_steps:
- en: The first parent BbLl makes the gametes BL, Bl, bL and bl; the second parent
    BbLl makes the gametes BL, Bl, bL and bl.
- en: 'Out of 16 boxes, black coats and long hair: 9; black coats and short hair:
    3; brown coats and long hair: 3; brown coats and short hair: 1.'
- en: The share of offspring wanted is 3/16.
- en: 'Multiply the share by the total: 3/16 x 1600 = 300.'
- en: The correct option is c.
