stem:
  en: In a certain animal species, the allele B for black coats is dominant over the
    allele b for brown coats, and the allele L for long hair is dominant over the
    allele l for short hair. The two genes are on different chromosomes and are inherited
    independently. An animal with genotype BbLl is crossed with an animal with genotype
    BbLl. The cross produces 1600 offspring. How many of them are expected to show
    black coats and short hair?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. First find the share of
    the offspring that show the outcome, using a Punnett square.
- level: 2
  en: Then multiply that share by the total number of offspring to get the expected
    number.
- level: 3
  en: The first parent makes the gametes BL, Bl, bL and bl, and the second parent
    makes the gametes BL, Bl, bL and bl.
prediction_prompt:
  en: Before you calculate, should the answer be more or less than half of the offspring?
