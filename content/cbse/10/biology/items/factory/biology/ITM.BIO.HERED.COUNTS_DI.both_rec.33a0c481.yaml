solution_steps:
- en: The first parent Pprr makes the gametes Pr and pr; the second parent ppRr makes
    the gametes pR and pr.
- en: 'Out of 16 boxes, purple flowers and round seeds: 4; purple flowers and wrinkled
    seeds: 4; white flowers and round seeds: 4; white flowers and wrinkled seeds:
    4.'
- en: The share of offspring wanted is 1/4.
- en: 'Multiply the share by the total: 1/4 x 320 = 80.'
- en: The correct option is b.
