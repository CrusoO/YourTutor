stem:
  en: In a certain plant species, the allele P for purple flowers is dominant over
    the allele p for white flowers, and the allele R for round seeds is dominant over
    the allele r for wrinkled seeds. The two genes are on different chromosomes and
    are inherited independently. A plant with genotype Pprr is crossed with a plant
    with genotype ppRr. The cross produces 320 offspring. How many of them are expected
    to show white flowers and wrinkled seeds?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. First find the share of
    the offspring that show the outcome, using a Punnett square.
- level: 2
  en: Then multiply that share by the total number of offspring to get the expected
    number.
- level: 3
  en: The first parent makes the gametes Pr and pr, and the second parent makes the
    gametes pR and pr.
prediction_prompt:
  en: Before you calculate, should the answer be more or less than half of the offspring?
