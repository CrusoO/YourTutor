solution_steps:
- en: A test cross uses a plant with short stems and hairy leaves, which can pass
    on only recessive alleles. Every dominant or recessive form in the offspring therefore
    shows what the tested plant passed on.
- en: The offspring show 4 different groups, so the tested plant makes 4 different
    gamete types.
- en: Try each candidate genotype in a Punnett square with ttww; only TtWw gives the
    groups seen.
- en: The correct option is a.
