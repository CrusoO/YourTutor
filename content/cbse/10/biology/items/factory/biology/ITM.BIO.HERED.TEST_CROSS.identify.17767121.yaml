solution_steps:
- en: A test cross uses a plant with white flowers and green seeds, which can pass
    on only recessive alleles. Every dominant or recessive form in the offspring therefore
    shows what the tested plant passed on.
- en: The offspring show 2 different groups, so the tested plant makes 2 different
    gamete types.
- en: Try each candidate genotype in a Punnett square with ppyy; only PPYy gives the
    groups seen.
- en: The correct option is b.
