stem:
  en: An amoeba culture starts with 3 cells. Assume that in each round every cell
    splits into 4 daughter cells at once, that all the cells split together, and that
    no cell dies. How many cells are there after 2 rounds of division?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Each
    round multiplies the number of cells by the same number.
- level: 2
  en: Multiply the starting number of cells by that number once for each round of
    division.
- level: 3
  en: There are two rounds of division, so the multiplying is done two times.
