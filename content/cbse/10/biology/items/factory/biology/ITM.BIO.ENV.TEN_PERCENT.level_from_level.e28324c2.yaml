stem:
  en: In the food chain leaves → caterpillar → small bird → hawk, the caterpillar
    holds 1000000 kJ of energy. Assume that only 10 percent of the energy at one trophic
    level passes to the next level. How much energy reaches the hawk?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Each step along the food
    chain keeps one tenth of the energy of the level before it.
- level: 2
  en: Count the steps from the organism that holds the energy to the organism that
    receives it.
- level: 3
  en: From the caterpillar to the hawk takes two steps.
prediction_prompt:
  en: Before you calculate, should the answer be larger or smaller than the energy
    given?
