- en: The first parent TtRr makes the gametes TR, Tr, tR and tr; the second parent
    Ttrr makes the gametes Tr and tr.
- en: 'Out of 16 boxes, tall stems and round seeds: 6; tall stems and wrinkled seeds:
    6; short stems and round seeds: 2; short stems and wrinkled seeds: 2.'
- en: The share of offspring wanted is 3/8.
- en: 'Multiply the share by the total: 3/8 x 320 = 120.'
- en: The correct option is a.
