stem:
  en: In a certain plant species, the allele P for purple flowers is dominant over
    the allele p for white flowers, and the allele R for round seeds is dominant over
    the allele r for wrinkled seeds. The two genes are on different chromosomes and
    are inherited independently. A plant with genotype PpRr is crossed with a plant
    with genotype PPRr. What is the probability that one offspring, picked at random,
    has the genotype PpRr? Give the answer as a fraction.
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. The
    two genes are inherited independently, so each gene can be worked out on its own.
- level: 2
  en: Find the chance of the wanted outcome for the first gene, then for the second
    gene, then combine the two chances by multiplying.
- level: 3
  en: The first parent makes the gametes PR, Pr, pR and pr, and the second parent
    makes the gametes PR and Pr.
prediction_prompt:
  en: Before you calculate, is the outcome common or rare among the offspring?
