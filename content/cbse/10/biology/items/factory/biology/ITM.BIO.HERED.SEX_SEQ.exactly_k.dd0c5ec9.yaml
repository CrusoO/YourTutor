solution_steps:
- en: There are 2 equally likely outcomes for each child, so there are 16 equally
    likely birth sequences.
- en: 'The number of sequences with exactly 3 boys is the number of ways to choose
    which 3 of the 4 children are boys: 4.'
- en: 'The probability is 4 out of 16: 1/4.'
- en: The correct option is b.
