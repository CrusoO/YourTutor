stem:
  en: A couple has 3 children. Assume each child is equally likely to be a boy or
    a girl, whatever the earlier children were. What is the probability that there
    is at least one boy and at least one girl among the 3 children? Give the answer
    as a fraction.
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Find
    the outcomes that fail the condition, then take their probability away from 1.
- level: 2
  en: The condition fails when all the children are of the same sex, which can happen
    in two ways.
- level: 3
  en: Each of those two ways has the same probability, found by multiplying the single-birth
    chances.
prediction_prompt:
  en: Before you calculate, is the outcome likely or unlikely?
