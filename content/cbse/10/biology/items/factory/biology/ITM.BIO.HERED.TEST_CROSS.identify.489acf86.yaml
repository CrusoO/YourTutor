solution_steps:
- en: A test cross uses an animal with plain coats and straight tails, which can pass
    on only recessive alleles. Every dominant or recessive form in the offspring therefore
    shows what the tested animal passed on.
- en: The offspring show 4 different groups, so the tested animal makes 4 different
    gamete types.
- en: Try each candidate genotype in a Punnett square with ssee; only SsEe gives the
    groups seen.
- en: The correct option is b.
