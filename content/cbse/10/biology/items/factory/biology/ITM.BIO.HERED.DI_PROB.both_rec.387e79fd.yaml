stem:
  en: In a certain animal species, the allele L for long hair is dominant over the
    allele l for short hair, and the allele E for curly tails is dominant over the
    allele e for straight tails. The two genes are on different chromosomes and are
    inherited independently. An animal with genotype LlEe is crossed with an animal
    with genotype llEe. What is the probability that one offspring, picked at random,
    shows short hair and straight tails? Give the answer as a fraction.
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. The
    two genes are inherited independently, so each gene can be worked out on its own.
- level: 2
  en: Find the chance of the wanted outcome for the first gene, then for the second
    gene, then combine the two chances by multiplying.
- level: 3
  en: The first parent makes the gametes LE, Le, lE and le, and the second parent
    makes the gametes lE and le.
prediction_prompt:
  en: Before you calculate, is the outcome common or rare among the offspring?
