stem:
  en: In a certain plant species, the allele P for purple flowers is dominant over
    the allele p for white flowers, and the allele T for tall stems is dominant over
    the allele t for short stems. The two genes are on different chromosomes and are
    inherited independently. A plant with genotype PpTt is crossed with a plant with
    genotype Pptt. What is the probability that one offspring, picked at random, shows
    white flowers and short stems? Give the answer as a fraction.
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. The
    two genes are inherited independently, so each gene can be worked out on its own.
- level: 2
  en: Find the chance of the wanted outcome for the first gene, then for the second
    gene, then combine the two chances by multiplying.
- level: 3
  en: The first parent makes the gametes PT, Pt, pT and pt, and the second parent
    makes the gametes Pt and pt.
prediction_prompt:
  en: Before you calculate, is the outcome common or rare among the offspring?
