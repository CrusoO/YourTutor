stem:
  en: In a certain plant species, the allele Y for yellow seeds is dominant over the
    allele y for green seeds. A plant with genotype Yy is crossed with a plant with
    genotype Yy. What is the probability that one offspring, picked at random, has
    the genotype YY? Give the answer as a fraction.
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Find the gametes each
    parent can make, then combine them in a Punnett square.
- level: 2
  en: A probability is the number of boxes that show the outcome asked for, divided
    by the number of all the boxes.
- level: 3
  en: The first parent makes the gametes Y and y, and the second parent makes the
    gametes Y and y.
prediction_prompt:
  en: Before you calculate, is the outcome asked for more likely or less likely than
    the other?
