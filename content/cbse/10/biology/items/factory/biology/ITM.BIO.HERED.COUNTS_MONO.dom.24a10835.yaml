stem:
  en: In a certain plant species, the allele W for smooth leaves is dominant over
    the allele w for hairy leaves. A plant with genotype Ww is crossed with a plant
    with genotype Ww. The cross produces 200 offspring. How many of them are expected
    to have smooth leaves?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. First
    find the share of the offspring that show the outcome, using a Punnett square.
- level: 2
  en: Then multiply that share by the total number of offspring to get the expected
    number.
- level: 3
  en: The first parent makes the gametes W and w, and the second parent makes the
    gametes W and w.
prediction_prompt:
  en: Before you calculate, should the answer be more or less than half of the offspring?
