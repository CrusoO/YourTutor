stem:
  en: In the food chain phytoplankton → zooplankton → small fish → large fish → seabird,
    the zooplankton holds 200 J of energy. Assume that only 10 percent of the energy
    at one trophic level passes to the next level. How much energy reaches the large
    fish?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Each step along the food
    chain keeps one tenth of the energy of the level before it.
- level: 2
  en: Count the steps from the organism that holds the energy to the organism that
    receives it.
- level: 3
  en: From the zooplankton to the large fish takes two steps.
prediction_prompt:
  en: Before you calculate, should the answer be larger or smaller than the energy
    given?
