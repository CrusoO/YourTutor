stem:
  en: In a certain plant species, the allele P for purple flowers is dominant over
    the allele p for white flowers, and the allele T for tall stems is dominant over
    the allele t for short stems. The two genes are on different chromosomes and are
    inherited independently. How many different types of gametes can a plant with
    genotype PpTT produce?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. A gamete
    carries one allele from each gene. Different gametes differ in the alleles they
    carry.
- level: 2
  en: A gene whose two alleles are the same gives only one choice. A gene whose alleles
    differ gives two choices.
- level: 3
  en: Write the choices for each gene, then combine the choices of the different genes
    by multiplying them.
prediction_prompt:
  en: Before you count, should the answer be a small number or a large one?
