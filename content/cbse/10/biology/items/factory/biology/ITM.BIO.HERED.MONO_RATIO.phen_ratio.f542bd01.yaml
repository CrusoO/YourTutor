stem:
  en: In a certain plant species, the allele D for broad leaves is dominant over the
    allele d for narrow leaves. A plant with genotype Dd is crossed with a plant with
    genotype dd. What is the ratio of offspring with broad leaves to offspring with
    narrow leaves?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Find
    the gametes each parent can make, then combine them in a Punnett square.
- level: 2
  en: Count how many boxes of the square show each phenotype, then write the counts
    as a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes D and d, and the second parent makes the
    gametes d.
prediction_prompt:
  en: Before you draw the square, which outcome do you expect to be the most common?
