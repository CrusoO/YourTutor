- en: There are 2 equally likely outcomes for each child, so there are 8 equally likely
    birth sequences.
- en: 'The number of sequences with exactly 1 boys is the number of ways to choose
    which 1 of the 3 children are boys: 3.'
- en: 'The probability is 3 out of 8: 3/8.'
