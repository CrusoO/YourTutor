stem:
  en: In a certain plant species, the allele P for purple flowers is dominant over
    the allele p for white flowers, and the allele T for tall stems is dominant over
    the allele t for short stems. The two genes are on different chromosomes and are
    inherited independently. A plant with genotype PpTT is crossed with a plant with
    genotype pptt. What is the ratio of offspring in the groups purple flowers and
    tall stems; white flowers and tall stems, in that order?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Find
    the gametes each parent can make, then combine them in a Punnett square.
- level: 2
  en: Count the boxes that show each group of offspring, then write the counts as
    a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes PT and pT, and the second parent makes the
    gametes pt.
prediction_prompt:
  en: Before you draw the square, how many boxes will it have?
