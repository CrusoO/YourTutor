stem:
  en: A thin green water plant is cut straight across at several places along its
    length, and this makes 5 pieces. Assume that every piece grows into a complete
    new organism. How many cuts were made?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Think about how many pieces
    one cut makes, and how a second cut changes the number of pieces.
- level: 2
  en: Each cut adds one piece, and with no cuts there is one piece.
- level: 3
  en: The number of cuts is one less than the number of pieces.
prediction_prompt:
  en: Before you count, will there be more pieces than cuts, or fewer?
