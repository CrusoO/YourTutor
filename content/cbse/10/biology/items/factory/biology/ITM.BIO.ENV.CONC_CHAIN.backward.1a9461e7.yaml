stem:
  en: A chemical that organisms cannot break down is passed along a food chain. At
    each step up the chain, its concentration in the body becomes 3 times as large.
    In the food chain wheat → mouse → snake → eagle, the mouse contains 12 ppm of
    the chemical. What is the concentration in the wheat?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Going
    back down the chain undoes the multiplying, so divide by the factor for each step.
- level: 2
  en: Count the steps between the two organisms, then divide by the factor once for
    each step.
- level: 3
  en: The mouse is one step above the wheat.
prediction_prompt:
  en: Before you calculate, will the concentration be larger or smaller than the one
    given?
