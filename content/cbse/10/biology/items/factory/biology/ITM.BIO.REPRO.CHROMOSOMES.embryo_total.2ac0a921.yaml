solution_steps:
- en: The zygote has 16 + 16 = 32 chromosomes, and every cell made by mitosis keeps
    that number.
- en: After 2 rounds there are 2 to the power 2 = 4 cells.
- en: The total is 4 x 32 = 128 chromosomes.
- en: The correct option is c.
