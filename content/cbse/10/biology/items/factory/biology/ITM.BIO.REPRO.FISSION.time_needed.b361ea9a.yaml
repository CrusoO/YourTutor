stem:
  en: A culture of single-celled organisms starts with 1 cell. Assume that every cell
    divides into two cells in each round of division, that all the cells divide together,
    and that no cell dies. One round of division takes 30 minutes. How many minutes
    does it take for the culture to reach 4 cells?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. First
    find how many rounds of division are needed to reach that number of cells.
- level: 2
  en: Then multiply the number of rounds by the time one round takes.
- level: 3
  en: Each round takes 30 minutes.
prediction_prompt:
  en: Before you calculate, will the answer be a little more or a lot more than the
    starting number?
