solution_steps:
- en: The first parent PpYY makes the gametes PY and pY; the second parent ppyy makes
    the gametes py.
- en: 'Out of 16 boxes, purple flowers and yellow seeds: 8; white flowers and yellow
    seeds: 8.'
- en: The share of offspring wanted is 1/2.
- en: 'Multiply the share by the total: 1/2 x 640 = 320.'
- en: The correct option is d.
