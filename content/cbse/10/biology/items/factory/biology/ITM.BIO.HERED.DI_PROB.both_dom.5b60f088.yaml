solution_steps:
- en: The first parent Ssee makes the gametes Se and se; the second parent ssEe makes
    the gametes sE and se.
- en: 'Treat each gene on its own: find the chance of the outcome wanted for the first
    gene and for the second gene.'
- en: 'The genes are independent, so multiply the two chances: 1/2 x 1/2 = 1/4.'
