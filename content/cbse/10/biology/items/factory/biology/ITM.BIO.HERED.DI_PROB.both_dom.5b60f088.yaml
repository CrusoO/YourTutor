stem:
  en: In a certain animal species, the allele S for spotted coats is dominant over
    the allele s for plain coats, and the allele E for curly tails is dominant over
    the allele e for straight tails. The two genes are on different chromosomes and
    are inherited independently. An animal with genotype Ssee is crossed with an animal
    with genotype ssEe. What is the probability that one offspring, picked at random,
    shows spotted coats and curly tails? Give the answer as a fraction.
hints:
- level: 1
  en: Begin by separating what is given from what is asked. The two genes are inherited
    independently, so each gene can be worked out on its own.
- level: 2
  en: Find the chance of the wanted outcome for the first gene, then for the second
    gene, then combine the two chances by multiplying.
- level: 3
  en: The first parent makes the gametes Se and se, and the second parent makes the
    gametes sE and se.
prediction_prompt:
  en: Before you calculate, is the outcome common or rare among the offspring?
