stem:
  en: In the food chain leaves → caterpillar → small bird → hawk, assume that only
    10 percent of the energy at one trophic level passes to the next level. What percentage
    of the energy captured by the leaves reaches the hawk?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. A
    percentage is a share out of 100, so start from 100 percent at the first level.
- level: 2
  en: Take one tenth of the share for each step along the chain.
- level: 3
  en: Going from the first level to level four takes three steps.
prediction_prompt:
  en: Before you calculate, will most of the energy be lost or passed on?
