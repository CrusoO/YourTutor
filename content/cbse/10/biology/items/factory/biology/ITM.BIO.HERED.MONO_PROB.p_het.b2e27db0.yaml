stem:
  en: In a certain plant species, the allele T for tall stems is dominant over the
    allele t for short stems. A plant with genotype Tt is crossed with a plant with
    genotype Tt. What is the probability that one offspring, picked at random, has
    the genotype Tt? Give the answer as a fraction.
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Find
    the gametes each parent can make, then combine them in a Punnett square.
- level: 2
  en: A probability is the number of boxes that show the outcome asked for, divided
    by the number of all the boxes.
- level: 3
  en: The first parent makes the gametes T and t, and the second parent makes the
    gametes T and t.
prediction_prompt:
  en: Before you calculate, is the outcome asked for more likely or less likely than
    the other?
