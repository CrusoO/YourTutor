stem:
  en: A gamete has half the number of chromosomes of a body cell. A zygote forms when
    a sperm and an egg join. A cell made by mitosis has the same number of chromosomes
    as the cell that divided. In a certain fish species, a body cell has 20 chromosomes
    and divides by mitosis. How many chromosomes does each new cell have?
