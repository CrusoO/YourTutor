stem:
  en: A producer is at trophic level 1. A primary consumer eats the producer, a secondary
    consumer eats a primary consumer, a tertiary consumer eats a secondary consumer,
    and so on. Look at the food chain leaves → caterpillar → small bird → hawk. How
    many trophic levels does this chain have? Each organism in the chain is eaten
    by the next one.
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. List
    the organisms in the chain from the producer onwards.
- level: 2
  en: Decide which of the organisms count for what the question asks, and which do
    not.
- level: 3
  en: The producer is the first organism and every other organism is a consumer.
prediction_prompt:
  en: Before you count, which end of the chain is the producer?
