stem:
  en: In a certain plant species, the allele T for tall stems is dominant over the
    allele t for short stems, and the allele Y for yellow seeds is dominant over the
    allele y for green seeds. The two genes are on different chromosomes and are inherited
    independently. A plant with genotype TtYY is crossed with a plant with genotype
    ttyy. How many different appearances can the offspring have?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Fill
    in the Punnett square and look at which outcomes actually appear.
- level: 2
  en: Count each different outcome once, however many boxes show it. An outcome that
    no box shows does not count.
- level: 3
  en: The first parent makes the gametes TY and tY, and the second parent makes the
    gametes ty.
prediction_prompt:
  en: Before you count, should the answer be a small number or a large one?
