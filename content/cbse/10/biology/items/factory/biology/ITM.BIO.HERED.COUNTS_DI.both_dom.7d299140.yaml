stem:
  en: In a certain plant species, the allele T for tall stems is dominant over the
    allele t for short stems, and the allele R for round seeds is dominant over the
    allele r for wrinkled seeds. The two genes are on different chromosomes and are
    inherited independently. A plant with genotype TtRr is crossed with a plant with
    genotype TtRR. The cross produces 1600 offspring. How many of them are expected
    to show tall stems and round seeds?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. First
    find the share of the offspring that show the outcome, using a Punnett square.
- level: 2
  en: Then multiply that share by the total number of offspring to get the expected
    number.
- level: 3
  en: The first parent makes the gametes TR, Tr, tR and tr, and the second parent
    makes the gametes TR and tR.
prediction_prompt:
  en: Before you calculate, should the answer be more or less than half of the offspring?
