solution_steps:
- en: The first parent PpTt makes the gametes PT, Pt, pT and pt; the second parent
    pptt makes the gametes pt.
- en: Pair every gamete of the first parent with every gamete of the second in a Punnett
    square.
- en: 'Out of 16 boxes, purple flowers and tall stems: 4; purple flowers and short
    stems: 4; white flowers and tall stems: 4; white flowers and short stems: 4.'
- en: 'Write the counts in the order asked, in the lowest terms: 1 : 1 : 1 : 1.'
