stem:
  en: In a certain animal species, the allele B for black coats is dominant over the
    allele b for brown coats. An animal with genotype Bb is crossed with an animal
    with genotype bb. What is the ratio of offspring with black coats to offspring
    with brown coats?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. Find
    the gametes each parent can make, then combine them in a Punnett square.
- level: 2
  en: Count how many boxes of the square show each phenotype, then write the counts
    as a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes B and b, and the second parent makes the
    gametes b.
prediction_prompt:
  en: Before you draw the square, which outcome do you expect to be the most common?
