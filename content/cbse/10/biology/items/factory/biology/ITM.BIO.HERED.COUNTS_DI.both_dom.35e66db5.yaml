solution_steps:
- en: The first parent LlEe makes the gametes LE, Le, lE and le; the second parent
    LlEe makes the gametes LE, Le, lE and le.
- en: 'Out of 16 boxes, long hair and curly tails: 9; long hair and straight tails:
    3; short hair and curly tails: 3; short hair and straight tails: 1.'
- en: The share of offspring wanted is 9/16.
- en: 'Multiply the share by the total: 9/16 x 320 = 180.'
- en: The correct option is b.
