stem:
  en: In a certain plant species, the allele Y for yellow seeds is dominant over the
    allele y for green seeds. A plant with genotype Yy is crossed with a plant with
    genotype yy. The cross produces 400 offspring. How many of them are expected to
    have green seeds?
hints:
- level: 1
  en: Before you start, name what the question tells you and what you must find. First
    find the share of the offspring that show the outcome, using a Punnett square.
- level: 2
  en: Then multiply that share by the total number of offspring to get the expected
    number.
- level: 3
  en: The first parent makes the gametes Y and y, and the second parent makes the
    gametes y.
prediction_prompt:
  en: Before you calculate, should the answer be more or less than half of the offspring?
