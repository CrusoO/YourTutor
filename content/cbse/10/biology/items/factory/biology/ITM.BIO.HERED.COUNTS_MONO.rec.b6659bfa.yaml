solution_steps:
- en: The first parent Yy makes the gametes Y and y; the second parent yy makes the
    gametes y.
- en: 'Out of 4 boxes, yellow seeds: 2; green seeds: 2.'
- en: The share of offspring wanted is 1/2.
- en: 'Multiply the share by the total: 1/2 x 400 = 200.'
- en: The correct option is c.
