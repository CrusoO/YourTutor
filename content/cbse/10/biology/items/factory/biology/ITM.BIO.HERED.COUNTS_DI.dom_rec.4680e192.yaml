- en: The first parent TtWw makes the gametes TW, Tw, tW and tw; the second parent
    TTWw makes the gametes TW and Tw.
- en: 'Out of 16 boxes, tall stems and smooth leaves: 12; tall stems and hairy leaves:
    4.'
- en: The share of offspring wanted is 1/4.
- en: 'Multiply the share by the total: 1/4 x 1600 = 400.'
- en: The correct option is a.
