solution_steps:
- en: There are 2 equally likely outcomes for each child, so there are 32 equally
    likely birth sequences.
- en: 'The number of sequences with exactly 4 boys is the number of ways to choose
    which 4 of the 5 children are boys: 5.'
- en: 'The probability is 5 out of 32: 5/32.'
- en: The correct option is d.
