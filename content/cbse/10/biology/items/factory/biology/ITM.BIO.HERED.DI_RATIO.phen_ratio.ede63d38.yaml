stem:
  en: In a certain plant species, the allele P for purple flowers is dominant over
    the allele p for white flowers, and the allele R for round seeds is dominant over
    the allele r for wrinkled seeds. The two genes are on different chromosomes and
    are inherited independently. A plant with genotype PpRr is crossed with a plant
    with genotype ppRr. What is the ratio of offspring in the groups purple flowers
    and round seeds; purple flowers and wrinkled seeds; white flowers and round seeds;
    white flowers and wrinkled seeds, in that order?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Find the gametes each
    parent can make, then combine them in a Punnett square.
- level: 2
  en: Count the boxes that show each group of offspring, then write the counts as
    a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes PR, Pr, pR and pr, and the second parent
    makes the gametes pR and pr.
prediction_prompt:
  en: Before you draw the square, how many boxes will it have?
