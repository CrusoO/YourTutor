- en: The first parent PpRr makes the gametes PR, Pr, pR and pr; the second parent
    ppRr makes the gametes pR and pr.
- en: Pair every gamete of the first parent with every gamete of the second in a Punnett
    square.
- en: 'Out of 16 boxes, purple flowers and round seeds: 6; purple flowers and wrinkled
    seeds: 2; white flowers and round seeds: 6; white flowers and wrinkled seeds:
    2.'
- en: 'Write the counts in the order asked, in the lowest terms: 3 : 1 : 3 : 1.'
