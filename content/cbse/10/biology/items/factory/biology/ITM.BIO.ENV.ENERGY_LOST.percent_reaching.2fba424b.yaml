stem:
  en: In the food chain grass → grasshopper → frog → snake → hawk, assume that only
    10 percent of the energy at one trophic level passes to the next level. What percentage
    of the energy captured by the grass reaches the frog?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. A percentage is a share
    out of 100, so start from 100 percent at the first level.
- level: 2
  en: Take one tenth of the share for each step along the chain.
- level: 3
  en: Going from the first level to level three takes two steps.
prediction_prompt:
  en: Before you calculate, will most of the energy be lost or passed on?
