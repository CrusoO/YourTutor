solution_steps:
- en: A test cross uses an animal with brown coats and short hair, which can pass
    on only recessive alleles. Every dominant or recessive form in the offspring therefore
    shows what the tested animal passed on.
- en: The offspring show 2 different groups, so the tested animal makes 2 different
    gamete types.
- en: Try each candidate genotype in a Punnett square with bbll; only BbLL gives the
    groups seen.
- en: The correct option is c.
