solution_steps:
- en: The first parent PpRR makes the gametes PR and pR; the second parent pprr makes
    the gametes pr.
- en: 'Out of 16 boxes, purple flowers and round seeds: 8; white flowers and round
    seeds: 8.'
- en: The share of offspring wanted is 1/2.
- en: 'Multiply the share by the total: 1/2 x 320 = 160.'
- en: The correct option is a.
