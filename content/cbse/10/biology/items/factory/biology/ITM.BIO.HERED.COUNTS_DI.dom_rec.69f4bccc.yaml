stem:
  en: In a certain animal species, the allele S for spotted coats is dominant over
    the allele s for plain coats, and the allele E for curly tails is dominant over
    the allele e for straight tails. The two genes are on different chromosomes and
    are inherited independently. An animal with genotype SsEe is crossed with an animal
    with genotype ssee. The cross produces 320 offspring. How many of them are expected
    to show spotted coats and straight tails?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. First
    find the share of the offspring that show the outcome, using a Punnett square.
- level: 2
  en: Then multiply that share by the total number of offspring to get the expected
    number.
- level: 3
  en: The first parent makes the gametes SE, Se, sE and se, and the second parent
    makes the gametes se.
prediction_prompt:
  en: Before you calculate, should the answer be more or less than half of the offspring?
