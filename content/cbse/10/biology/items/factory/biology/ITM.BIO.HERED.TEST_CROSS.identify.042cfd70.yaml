solution_steps:
- en: A test cross uses a plant with white flowers and wrinkled seeds, which can pass
    on only recessive alleles. Every dominant or recessive form in the offspring therefore
    shows what the tested plant passed on.
- en: The offspring show 1 different group, so the tested plant makes 1 different
    gamete type.
- en: Try each candidate genotype in a Punnett square with pprr; only PPRR gives the
    groups seen.
- en: The correct option is c.
