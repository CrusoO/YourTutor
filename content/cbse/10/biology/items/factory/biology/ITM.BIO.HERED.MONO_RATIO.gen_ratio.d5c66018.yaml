stem:
  en: 'In a certain plant species, the allele Y for yellow seeds is dominant over
    the allele y for green seeds. A plant with genotype YY is crossed with a plant
    with genotype Yy. What is the ratio of the offspring genotypes YY : Yy?'
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Find
    the gametes each parent can make, then combine them in a Punnett square.
- level: 2
  en: Count how many boxes of the square show each genotype, then write the counts
    as a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes Y, and the second parent makes the gametes
    Y and y.
prediction_prompt:
  en: Before you draw the square, which outcome do you expect to be the most common?
