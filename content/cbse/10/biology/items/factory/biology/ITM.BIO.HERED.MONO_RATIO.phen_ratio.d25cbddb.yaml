role: procedure
stem:
  en: In a certain plant species, the allele P for purple flowers is dominant over
    the allele p for white flowers. A plant with genotype Pp is crossed with a plant
    with genotype pp. What is the ratio of offspring with purple flowers to offspring
    with white flowers?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Find the gametes each
    parent can make, then combine them in a Punnett square.
- level: 2
  en: Count how many boxes of the square show each phenotype, then write the counts
    as a ratio in the order the question gives, in the lowest terms.
- level: 3
  en: The first parent makes the gametes P and p, and the second parent makes the
    gametes p.
prediction_prompt:
  en: Before you draw the square, which outcome do you expect to be the most common?
