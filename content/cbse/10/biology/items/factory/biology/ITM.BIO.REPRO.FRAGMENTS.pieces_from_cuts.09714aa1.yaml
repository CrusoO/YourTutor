difficulty: 0.3
pool: practice
role: procedure
stem:
  en: A thin green water plant is cut straight across at 8 different places along
    its length. Assume that every piece grows into a complete new organism. How many
    new organisms can grow?
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Think
    about how many pieces one cut makes, and how a second cut changes the number of
    pieces.
- level: 2
  en: Each new cut divides one piece into two, so it adds one piece to the number
    you had.
- level: 3
  en: With no cuts there is one piece, the whole organism.
prediction_prompt:
  en: Before you count, will there be more pieces than cuts, or fewer?
