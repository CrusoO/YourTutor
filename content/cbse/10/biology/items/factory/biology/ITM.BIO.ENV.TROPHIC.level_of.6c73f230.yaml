stem:
  en: A producer is at trophic level 1. A primary consumer eats the producer, a secondary
    consumer eats a primary consumer, a tertiary consumer eats a secondary consumer,
    and so on. In the food chain grass → grasshopper → frog → snake → hawk, at which
    trophic level is the snake? Each organism in the chain is eaten by the next one.
hints:
- level: 1
  en: Read the question once more and mark what it gives and what it asks for. Number
    the organisms in the chain starting from the producer, which is level 1.
- level: 2
  en: Each organism in the chain is eaten by the next one, so the level goes up by
    one at each step along the chain.
- level: 3
  en: Count along the chain until you reach the organism named in the question.
prediction_prompt:
  en: Before you count, which end of the chain is the producer?
