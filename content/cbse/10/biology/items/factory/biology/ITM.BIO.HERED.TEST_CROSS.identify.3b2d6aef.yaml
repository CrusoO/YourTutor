stem:
  en: In a certain animal species, the allele L for long hair is dominant over the
    allele l for short hair, and the allele E for curly tails is dominant over the
    allele e for straight tails. The two genes are on different chromosomes and are
    inherited independently. An animal with long hair and curly tails is test-crossed
    with an animal with short hair and straight tails. The result of the test cross
    is that half of the offspring have long hair and curly tails, while the other
    half have short hair and curly tails. What is the genotype of the animal that
    was tested?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. The parent used for the
    test cross passes on only recessive alleles, so each offspring shows which allele
    the tested parent passed on.
- level: 2
  en: Count how many different groups of offspring appear. Each heterozygous gene
    of the tested parent doubles that number.
- level: 3
  en: Check a candidate by writing its gametes and pairing them with the gametes of
    the other parent in a Punnett square.
prediction_prompt:
  en: Before you decide, how many different gamete types must the tested parent make?
