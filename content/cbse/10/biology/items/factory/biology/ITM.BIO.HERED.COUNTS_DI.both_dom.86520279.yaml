- en: The first parent TtWw makes the gametes TW, Tw, tW and tw; the second parent
    TtWW makes the gametes TW and tW.
- en: 'Out of 16 boxes, tall stems and smooth leaves: 12; short stems and smooth leaves:
    4.'
- en: The share of offspring wanted is 3/4.
- en: 'Multiply the share by the total: 3/4 x 320 = 240.'
- en: The correct option is b.
