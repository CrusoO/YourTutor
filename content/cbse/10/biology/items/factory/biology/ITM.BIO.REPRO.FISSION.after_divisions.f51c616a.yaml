stem:
  en: A culture of single-celled organisms starts with 2 cells. Assume that every
    cell divides into two cells in each round of division, that all the cells divide
    together, and that no cell dies. How many cells are there after 4 rounds of division?
hints:
- level: 1
  en: Begin by separating what is given from what is asked. Each round multiplies
    the number of cells by the same number.
- level: 2
  en: Multiply the starting number of cells by that number once for each round of
    division.
- level: 3
  en: There are four rounds of division, so the multiplying is done four times.
prediction_prompt:
  en: Before you calculate, will the answer be a little more or a lot more than the
    starting number?
