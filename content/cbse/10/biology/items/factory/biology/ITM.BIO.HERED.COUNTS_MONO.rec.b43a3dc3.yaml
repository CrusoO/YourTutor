solution_steps:
- en: The first parent Pp makes the gametes P and p; the second parent pp makes the
    gametes p.
- en: 'Out of 4 boxes, purple flowers: 2; white flowers: 2.'
- en: The share of offspring wanted is 1/2.
- en: 'Multiply the share by the total: 1/2 x 200 = 100.'
- en: The correct option is b.
