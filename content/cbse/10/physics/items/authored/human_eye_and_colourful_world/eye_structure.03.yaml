id: A.10.physics.human_eye_and_colourful_world.eye_structure.03
skill_ids:
- SK.A.10.physics.eye_structure
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Light from a distant object enters a normal eye and reaches the retina. Which statement describes the image formed on the retina?
hints:
- level: 1
  en: Think about what kind of lens the eye lens behaves like.
- level: 2
  en: Ask whether the rays meet on the retina or only appear to come from a point.
- level: 3
  en: Consider the orientation of the image that the lens produces before the brain corrects it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Real, inverted and smaller than the object
- id: b
  en: Virtual, erect and magnified
- id: c
  en: Virtual and inverted
- id: d
  en: Real and erect
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.3CFE14A95DC8
  when_answer_equals:
  - b
- id: MC.A.2F4B24DE5AC1
  when_answer_equals:
  - d
- id: MC.A.B9AD1608105C
  when_answer_equals:
  - c
solution_steps:
- en: The eye lens is a converging lens, so it forms a real, inverted and smaller image on the retina.
- en: The brain interprets the image as upright, so we see objects the right way up.
- en: The image is real because the rays actually meet on the retina.
- en: The correct option is a.
tier: C
diagram_note: Schematic side view of the eye with the cornea, pupil, eye lens, retina and optic nerve labelled. Draw a ray from the top of a distant object entering the cornea, converging through the eye lens, and meeting the retina below the axis. Label the point on the retina as the image.
