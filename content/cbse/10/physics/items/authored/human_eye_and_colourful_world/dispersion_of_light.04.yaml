id: A.10.physics.human_eye_and_colourful_world.dispersion_of_light.04
skill_ids:
- SK.A.10.physics.dispersion_of_light
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A glass prism separates white light into colours. Which quantity differs from one colour to another inside the glass?
hints:
- level: 1
  en: Ask whether the speed of light in vacuum depends on its colour.
- level: 2
  en: Think about which property of the glass depends on the colour of light.
- level: 3
  en: Consider what stays the same when light enters a different medium.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The refractive index of the glass
- id: b
  en: The speed of the colour in vacuum after leaving the prism
- id: c
  en: The speed of the colour in vacuum
- id: d
  en: The frequency of the colour inside the prism
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.5148BE065B86
  when_answer_equals:
  - c
- id: MC.A.AC3EBACF35D8
  when_answer_equals:
