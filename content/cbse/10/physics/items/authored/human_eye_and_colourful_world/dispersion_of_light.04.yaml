solution_steps:
- en: The refractive index of glass depends on the colour of the light.
- en: Light of every colour has the same speed in vacuum, and its frequency does not change when it enters glass.
- en: It is the change in speed inside the glass that makes the colours bend differently.
- en: The correct option is a.
tier: C
