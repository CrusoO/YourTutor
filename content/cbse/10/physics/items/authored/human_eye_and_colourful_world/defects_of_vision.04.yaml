id: A.10.physics.human_eye_and_colourful_world.defects_of_vision.04
skill_ids:
- SK.A.10.physics.defects_of_vision
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A diverging lens is used to correct myopia. What does the lens do to the light from a distant object?
hints:
- level: 1
  en: Ask whether the lens needs to converge or diverge the rays to move the image backwards.
- level: 2
  en: Think about the direction in which the image needs to move.
- level: 3
  en: Compare the effect of the lens with the natural focusing of the eye.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It makes the eyeball longer
- id: b
  en: It spreads the rays out so that the image moves back onto the retina
- id: c
  en: It absorbs part of the light so the image is less bright
- id: d
  en: It converges the rays so that the image moves forward
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.5E723984A312
  when_answer_equals:
  - d
- id: MC.A.EF9B9E660EED
  when_answer_equals:
  - a
- id: MC.A.FA3633A37C47
  when_answer_equals:
  - c
solution_steps:
- en: A diverging lens makes the rays from a distant object spread out a little before they enter the eye.
- en: The eye then focuses them further back, so the image lands on the retina.
- en: This corrects the short-sighted eye.
- en: The correct option is b.
tier: C
