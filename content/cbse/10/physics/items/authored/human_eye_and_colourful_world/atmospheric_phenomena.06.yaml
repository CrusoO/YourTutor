id: A.10.physics.human_eye_and_colourful_world.atmospheric_phenomena.06
skill_ids:
- SK.A.10.physics.atmospheric_phenomena
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Which factor increases the amount of blue light scattered by air molecules?
hints:
- level: 1
  en: Compare the size of air molecules with the wavelength of visible light.
- level: 2
  en: Ask how the scattered intensity changes when the wavelength gets shorter.
- level: 3
  en: Consider whether large droplets show the same colour dependence as air molecules.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Scattering particles much smaller than the wavelength of the light, since shorter wavelengths are then scattered most
- id: b
  en: Using a longer wavelength of light
- id: c
  en: Lower density of the air
- id: d
  en: Larger droplets, such as those in clouds
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.16DBB1ED4B4C
  when_answer_equals:
  - d
- id: MC.A.CA2297AD6579
  when_answer_equals:
  - c
- id: MC.A.FCCE0F7E23AC
  when_answer_equals:
  - b
solution_steps:
- en: Scattering by small particles is strongest when the particle size is much smaller than the wavelength of light.
- en: The scattered intensity rises steeply as the wavelength gets shorter, which is why blue is scattered more than red.
- en: Large droplets do not show this strong colour dependence.
- en: The correct option is a.
tier: C
