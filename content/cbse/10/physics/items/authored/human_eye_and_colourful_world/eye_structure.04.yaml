  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Unchanged, with a fixed focal length
- id: b
  en: Thicker, with a shorter focal length
- id: c
  en: Thicker, with a longer focal length
- id: d
  en: Thinner, with a longer focal length
answer:
