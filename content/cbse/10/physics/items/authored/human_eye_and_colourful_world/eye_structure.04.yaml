difficulty: 0.6
pool: practice
role: apply
stem:
  en: 'The ciliary muscles relax as the eye looks at a distant object. As a result, the eye lens becomes:'
hints:
- level: 1
  en: Think about what the ciliary muscles do when they relax.
- level: 2
  en: Ask how a thin lens bends light compared with a thick one.
- level: 3
  en: Consider which of the two states suits a faraway object.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
