id: A.10.physics.human_eye_and_colourful_world.eye_structure.06
skill_ids:
- SK.A.10.physics.eye_structure
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Which sequence correctly lists the parts that light passes through, in order, from outside the eye to the retina?
hints:
- level: 1
  en: Start from the outermost transparent surface of the eye.
- level: 2
  en: Then find the opening that the light goes through before the lens.
- level: 3
  en: Finish with the light-sensitive layer at the back of the eyeball.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Cornea, eye lens, pupil, retina, vitreous humour
- id: b
  en: Retina, eye lens, cornea, pupil, vitreous humour
- id: c
  en: Cornea, pupil, eye lens, vitreous humour, retina
- id: d
  en: Pupil, cornea, eye lens, retina, vitreous humour
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.60764AA7298E
  when_answer_equals:
  - d
- id: MC.A.2136F6159DB3
  when_answer_equals:
