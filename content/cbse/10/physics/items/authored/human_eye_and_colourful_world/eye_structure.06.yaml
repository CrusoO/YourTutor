- id: MC.A.0704CC878D76
  when_answer_equals:
  - b
solution_steps:
- en: Light enters through the cornea, passes through the pupil, is focused by the eye lens and then travels through the vitreous humour, a clear jelly-like fluid.
- en: It finally reaches the retina at the back of the eye.
- en: The correct option is c.
tier: C
diagram_note: Side view of the eye with the cornea, pupil, eye lens, vitreous humour and retina labelled in the eye. Draw a dotted arrow showing light entering from the front and travelling to the retina.
