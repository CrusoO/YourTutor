id: A.10.physics.human_eye_and_colourful_world.defects_of_vision.06
skill_ids:
- SK.A.10.physics.defects_of_vision
difficulty: 0.9
pool: practice
role: explain
stem:
  en: Which statement correctly compares myopia and hypermetropia?
hints:
- level: 1
  en: Think about which objects each defect makes blurred.
- level: 2
  en: For each defect, ask whether the image lies before or after the retina.
- level: 3
  en: Recall which kind of lens corrects each defect.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Both are corrected with converging lenses
- id: b
  en: Both defects are caused by the eye lens being too thin
- id: c
  en: In myopia the image of a distant object forms in front of the retina, while in hypermetropia the image of a near object forms behind it
- id: d
  en: In myopia the image forms behind the retina, and in hypermetropia it forms in front
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.3AF2BA19404E
  when_answer_equals:
  - b
- id: MC.A.F6720E1B5E99
  when_answer_equals:
  - d
- id: MC.A.6BF50C02EB68
  when_answer_equals:
  - a
solution_steps:
- en: Myopia makes distant objects blurred, because their images form in front of the retina.
- en: Hypermetropia makes near objects blurred, because their images form behind the retina.
- en: Myopia is corrected by a diverging lens and hypermetropia by a converging lens.
- en: The correct option is c.
tier: C
