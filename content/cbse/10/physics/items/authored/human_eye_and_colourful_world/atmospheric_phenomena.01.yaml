solution_steps:
- en: Sunlight contains all colours, and air molecules scatter the shorter wavelengths more strongly.
- en: Blue light is scattered in all directions and reaches our eyes from every part of the sky.
- en: This scattering is why the sky looks blue.
- en: The correct option is d.
