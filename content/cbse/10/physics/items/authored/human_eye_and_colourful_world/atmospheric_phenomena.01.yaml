difficulty: 0.2
pool: practice
role: recall
stem:
  en: Why is the clear daytime sky blue?
hints:
- level: 1
  en: Think about which wavelengths are scattered most by small particles.
- level: 2
  en: Consider why scattered light reaches your eye from all parts of the sky.
- level: 3
  en: Ask whether the sky is reflecting something or scattering light.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The sky reflects the blue colour of the ocean
- id: b
  en: Air absorbs red light and gives out blue light
- id: c
  en: Blue is the most intense colour in sunlight
- id: d
  en: Air molecules scatter the shorter wavelengths, such as blue, much more strongly than the longer ones
answer:
  sympy: d
  accept: []
