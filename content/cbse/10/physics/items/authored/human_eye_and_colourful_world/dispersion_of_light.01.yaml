difficulty: 0.2
pool: practice
role: recall
stem:
  en: A narrow beam of white light passes through a glass prism and emerges as a spectrum. Which colour is deviated the most?
hints:
- level: 1
  en: Think about which end of the spectrum bends more strongly.
- level: 2
  en: Consider the refractive index of glass for each colour.
- level: 3
  en: Ask which colour lies on the side of the spectrum that bends more.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Yellow
- id: b
  en: Violet
- id: c
  en: Green
- id: d
  en: Red
answer:
  sympy: b
  accept: []
misconception_rules:
