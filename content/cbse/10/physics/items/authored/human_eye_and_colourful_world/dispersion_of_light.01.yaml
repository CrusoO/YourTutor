solution_steps:
- en: Violet light has the highest refractive index in glass, so it is bent the most at each face of the prism.
- en: Red is bent the least, and the other colours lie between them.
- en: The order of the colours in the spectrum follows this deviation.
- en: The correct option is b.
tier: C
diagram_note: Triangular glass prism with a white light ray entering one face and emerging as a fan of colours. Label the red end of the spectrum as the least deviated and the violet end as the most deviated.
