id: A.10.physics.human_eye_and_colourful_world.atmospheric_phenomena.02
skill_ids:
- SK.A.10.physics.atmospheric_phenomena
difficulty: 0.2
pool: practice
role: recall
stem:
  en: The sun is seen slightly above the horizon a few minutes before it actually rises. What is the main reason?
hints:
- level: 1
  en: Think about whether light travels in a straight line through the atmosphere.
- level: 2
  en: Ask what happens to light that passes from thinner to denser air.
- level: 3
  en: Consider whether the sun appears higher or lower than its true position.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The sun moves faster across the sky in the morning
- id: b
  en: The earth's rotation delays the light from the sun
- id: c
  en: Light always travels in a straight line, so the sun is seen before it rises
- id: d
  en: Atmospheric refraction bends the sunlight downwards towards the observer
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.820F4ACE1437
  when_answer_equals:
  - a
- id: MC.A.62E4429521E1
  when_answer_equals:
  - c
- id: MC.A.F5E29BB53B00
  when_answer_equals:
  - b
solution_steps:
- en: Light from the sun is refracted as it passes through the atmosphere, which gets denser towards the earth.
- en: The light bends downwards, so the sun appears higher than it really is.
- en: This makes the sun visible slightly before it has actually risen above the horizon.
- en: The correct option is d.
tier: C
