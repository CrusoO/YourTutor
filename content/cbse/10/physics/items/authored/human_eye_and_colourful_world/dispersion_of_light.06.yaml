id: A.10.physics.human_eye_and_colourful_world.dispersion_of_light.06
skill_ids:
- SK.A.10.physics.dispersion_of_light
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Which statement correctly explains why violet light is deviated more than red light by a prism?
hints:
- level: 1
  en: Think about which property of the glass changes with colour.
- level: 2
  en: Ask whether a higher refractive index bends light more or less.
- level: 3
  en: Consider whether the prism itself is different for each colour.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Violet carries more energy, so the glass pushes it more strongly
- id: b
  en: Glass has a higher refractive index for violet than for red, so violet bends more at each face
- id: c
  en: Red has a higher refractive index, so it bends more
- id: d
  en: The angle of the prism is different for each colour
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.F91976E3EBF9
  when_answer_equals:
  - a
- id: MC.A.1BB0805CAB27
  when_answer_equals:
  - c
- id: MC.A.BC41A0193600
  when_answer_equals:
  - d
solution_steps:
- en: The refractive index of glass is larger for violet than for red.
- en: A larger index means a larger change of direction at each face, so violet is deviated more.
- en: The prism angle is the same for every colour, so it does not cause the difference.
- en: The correct option is b.
tier: C
