id: A.10.physics.human_eye_and_colourful_world.eye_structure.05
skill_ids:
- SK.A.10.physics.eye_structure
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: The eye lens must change its shape for objects at different distances. Why is this change needed?
hints:
- level: 1
  en: Consider where the image would fall if the lens did not change for a near object.
- level: 2
  en: Ask what is fixed in the eye and what must change to keep the image sharp.
- level: 3
  en: The retina does not move, so decide which part of the eye must adjust instead.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: To control how much light enters the eye
- id: b
  en: To vary the focal length so that objects at different distances are focused on the retina
- id: c
  en: To keep the image the right way up on the retina
- id: d
  en: To convert light into nerve signals
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.9012FCE2CA30
  when_answer_equals:
  - c
- id: MC.A.FF7D22033B14
  when_answer_equals:
  - a
- id: MC.A.DDF23FD5355E
  when_answer_equals:
  - d
solution_steps:
- en: The distance of an object changes where the rays would meet if the eye lens did not adjust.
- en: By changing its focal length, the eye lens keeps the image sharply on the fixed retina.
- en: This is why the lens must change shape.
- en: The correct option is b.
tier: C
