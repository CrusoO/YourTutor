id: A.10.physics.human_eye_and_colourful_world.dispersion_of_light.03
skill_ids:
- SK.A.10.physics.dispersion_of_light
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A narrow beam of white light enters a glass prism through one face. Which statement describes the emergent light?
hints:
- level: 1
  en: Ask whether the emergent colours travel in the same direction.
- level: 2
  en: Think about which colour has the higher refractive index in glass.
- level: 3
  en: Compare the emergent beam with the incident white beam.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It spreads into colours, with violet deviated more than red
- id: b
  en: It emerges as a single lighter colour
- id: c
  en: Red is deviated more than violet
- id: d
  en: All colours emerge parallel and the beam stays white
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.67D42BFB3B07
  when_answer_equals:
  - d
- id: MC.A.AE0709600704
  when_answer_equals:
  - c
- id: MC.A.D73A6131B017
  when_answer_equals:
  - b
solution_steps:
- en: Each colour of the incident white light bends by a different amount at the faces of the prism.
- en: Violet bends the most and red the least, so the emergent light is spread into a spectrum.
- en: This is the same result as dispersion.
- en: The correct option is a.
tier: C
diagram_note: Triangular glass prism with the incident white ray labelled on one face. Show the emergent rays fanning out with red at the top and violet at the bottom, each labelled with its colour.
