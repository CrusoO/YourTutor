stem:
  en: Which lens is used to correct hypermetropia?
hints:
- level: 1
  en: Consider which way the lens must bend the light.
- level: 2
  en: Ask where the image forms in hypermetropia, before or after the retina.
- level: 3
  en: Compare this with the lens used for the opposite defect.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
