id: A.10.physics.human_eye_and_colourful_world.defects_of_vision.05
skill_ids:
- SK.A.10.physics.defects_of_vision
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A person cannot see nearby objects clearly, though distant objects are seen well. A converging lens is prescribed. Why does this lens work?
hints:
- level: 1
  en: Ask where the image of a near object forms in this defect.
- level: 2
  en: Think about whether the lens must bend the rays inward or outward.
- level: 3
  en: Compare the effect of the lens with what the eye needs for a near object.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It removes the need for the eye lens to change shape
- id: b
  en: It spreads the rays so that near objects appear farther away
- id: c
  en: It adds convergence so that the rays from a near object meet on the retina
- id: d
  en: It corrects an uneven cornea so the image is sharper
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.2C67D0FA248F
  when_answer_equals:
  - b
- id: MC.A.CFC5654CC6B7
  when_answer_equals:
  - a
- id: MC.A.DD3844A27AD5
  when_answer_equals:
  - d
solution_steps:
- en: A person who cannot see near objects clearly has a hypermetropic eye, where the image of a near object forms behind the retina.
- en: A converging lens bends the rays inward before they enter the eye.
- en: The rays then meet on the retina for near objects.
- en: The correct option is c.
tier: C
diagram_note: Side view of an eye with the retina drawn at the back. Rays from a nearby book enter the eye and would meet behind the retina. Mark the retina, the point behind it where the rays meet, and a converging lens placed in front of the eye with an arrow showing the rays bending inward.
