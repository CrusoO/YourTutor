stem:
  en: 'A person can see nearby objects clearly but cannot see distant objects clearly. This defect of vision is called:'
hints:
- level: 1
  en: Think about which objects are seen clearly, near or far.
- level: 2
  en: Ask where the image forms when the eye cannot focus a distant object on the retina.
- level: 3
  en: Consider the common name for this defect.
