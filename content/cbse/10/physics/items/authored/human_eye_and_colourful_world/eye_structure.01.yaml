id: A.10.physics.human_eye_and_colourful_world.eye_structure.01
skill_ids:
- SK.A.10.physics.eye_structure
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which part of the eye changes its focal length so that both near and distant objects are focused on the retina?
hints:
- level: 1
  en: Think about which part of the eye is flexible and transparent.
- level: 2
  en: Ask which structure is attached to muscles that control focusing.
- level: 3
  en: The iris controls something different; decide what that is first.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The eye lens, whose curvature is changed by the ciliary muscles
- id: b
  en: The retina, which moves forward and back
- id: c
  en: The cornea, which is pushed in and out by the iris
- id: d
  en: The iris, which widens and narrows the lens
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.B6D471D53CD9
  when_answer_equals:
  - c
- id: MC.A.5AA862E60F59
  when_answer_equals:
  - b
- id: MC.A.9E2CCDA7254A
  when_answer_equals:
  - d
solution_steps:
- en: The eye lens is flexible, and the ciliary muscles change its curvature.
- en: A thicker lens gives a shorter focal length for near objects, and a thinner lens gives a longer focal length for distant ones.
- en: This adjustment is called accommodation.
- en: The correct option is a.
tier: C
diagram_note: Side view of the human eye with the cornea, pupil, eye lens, ciliary muscles, retina and optic nerve labelled. Draw a short arrow from the ciliary muscle to the eye lens to show the muscle changing its shape.
