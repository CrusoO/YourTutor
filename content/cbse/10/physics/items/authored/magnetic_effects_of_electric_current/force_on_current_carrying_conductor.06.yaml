solution_steps:
- en: The force on a conductor is F = BIL sin(theta), where theta is the angle between the conductor and the field.
- en: Since sin(theta) is largest at 90 degrees, the force is greatest when the conductor is perpendicular to the field.
- en: The force falls to zero when the conductor is parallel to the field.
- en: The correct option is a.
tier: C
