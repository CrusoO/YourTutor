stem:
  en: A straight conductor carries a current in a uniform magnetic field. For which angle between the conductor and the field is the force largest?
hints:
- level: 1
  en: Recall the trigonometric factor in the force formula.
- level: 2
  en: Ask which angle makes that factor equal to its largest value.
- level: 3
  en: Consider what happens to the force when the conductor lies along the field.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
