id: A.10.physics.magnetic_effects_of_electric_current.electromagnetic_induction.02
skill_ids:
- SK.A.10.physics.electromagnetic_induction
difficulty: 0.2
pool: practice
role: recall
stem:
  en: The direction of an induced current in a moving conductor is found by which rule?
hints:
- level: 1
  en: Recall which hand is used for generators and which for motors.
- level: 2
  en: 'Think about the three quantities involved: motion, field and induced current.'
- level: 3
  en: Ask which of the two hands is used when the conductor moves rather than carries current.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The right-hand thumb rule for the field around a wire
- id: b
  en: The left-hand rule for the motor effect
- id: c
  en: The rule that like poles repel
- id: d
  en: The right-hand rule, with the thumb showing the motion, the forefinger the field and the middle finger the induced current
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.BB32DE2672C4
  when_answer_equals:
  - b
- id: MC.A.C0719FA78E50
  when_answer_equals:
  - a
- id: MC.A.A615C9321BAB
  when_answer_equals:
  - c
solution_steps:
- en: For a conductor moving in a magnetic field, the right-hand rule gives the direction of the induced current.
- en: The thumb points along the motion, the forefinger along the field, and the middle finger along the induced current.
- en: This is the generator counterpart of the left-hand motor rule.
- en: The correct option is d.
tier: C
