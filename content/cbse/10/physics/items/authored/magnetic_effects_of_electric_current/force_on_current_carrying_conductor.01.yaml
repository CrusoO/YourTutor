difficulty: 0.2
pool: practice
role: recall
stem:
  en: In the left-hand rule for a current-carrying conductor in a magnetic field, the forefinger shows the field and the middle finger shows the current. What does the thumb show?
hints:
- level: 1
  en: Recall which quantity the force depends on, field and current.
- level: 2
  en: Think about which hand is used for the motor effect and which for generation.
- level: 3
  en: Ask what the three fingers stand for in the motor effect.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The direction of the induced current in a coil
- id: b
  en: The speed of the conductor
- id: c
  en: The direction of the magnetic field around the wire
- id: d
  en: The direction of the force on the conductor
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.E2FC0614C610
  when_answer_equals:
  - a
- id: MC.A.7A6718133136
