  - b
solution_steps:
- en: In the left-hand rule for a motor, the forefinger points along the field, the middle finger points along the conventional current, and the thumb points along the force on the conductor.
- en: The rule works for a conductor that is at right angles to the field.
- en: The correct option is d.
tier: C
