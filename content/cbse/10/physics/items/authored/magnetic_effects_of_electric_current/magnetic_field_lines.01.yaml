solution_steps:
- en: By convention, magnetic field lines point from the north pole to the south pole outside a bar magnet.
- en: They form closed loops, continuing from the south pole back to the north pole inside the magnet.
- en: The direction is the direction a free north pole would move.
- en: The correct option is d.
tier: C
diagram_note: 'Bar magnet drawn in the middle of the page with N and S labelled. Several closed loops are drawn: outside the magnet they run from N to S, and inside the magnet they return from S to N. Add arrowheads on every line to show the direction.'
