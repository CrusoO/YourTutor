id: A.10.physics.magnetic_effects_of_electric_current.magnetic_field_lines.01
skill_ids:
- SK.A.10.physics.magnetic_field_lines
difficulty: 0.2
pool: practice
role: recall
stem:
  en: 'Outside a bar magnet, the magnetic field lines run:'
hints:
- level: 1
  en: Recall the direction in which a compass needle points near a magnet.
- level: 2
  en: Ask whether the field lines are closed loops or open lines.
- level: 3
  en: Think about which pole a field line leaves from when it comes out of the magnet.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Outward from the centre of the magnet
- id: b
  en: From the south pole to the north pole
- id: c
  en: In circles around the magnet
- id: d
  en: From the north pole to the south pole
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.B040433CC9D9
  when_answer_equals:
  - b
- id: MC.A.3854B9C46844
  when_answer_equals:
  - c
- id: MC.A.1CE5324C48CA
  when_answer_equals:
