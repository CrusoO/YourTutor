solution_steps:
- en: The split-ring commutator changes the connection of the coil to the battery every half turn.
- en: This reverses the current in the coil at the right moment, so the torque keeps turning the coil in the same direction.
- en: Without it, the coil would swing back and forth.
- en: The correct option is a.
tier: C
