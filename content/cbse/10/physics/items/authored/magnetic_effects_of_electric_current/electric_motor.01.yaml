stem:
  en: What is the function of the commutator in a simple DC motor?
hints:
- level: 1
  en: Think about what would happen to the coil if the current never reversed.
- level: 2
  en: Ask at what point in the rotation the current must change direction.
- level: 3
  en: Consider which part of the motor touches the brushes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: To reverse the direction of the current in the coil every half turn, so the coil keeps rotating in the same direction
- id: b
  en: To increase the strength of the magnetic field
- id: c
  en: To store energy for a sudden start
- id: d
  en: To supply the current to the magnet
answer:
  sympy: a
  accept: []
