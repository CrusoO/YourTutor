id: A.10.physics.magnetic_effects_of_electric_current.domestic_electric_circuits.02
skill_ids:
- SK.A.10.physics.domestic_electric_circuits
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In a three-pin plug, the earth wire is connected to which part of the appliance?
hints:
- level: 1
  en: Think about which part of the appliance a person might touch.
- level: 2
  en: Ask what the earth wire protects the user from.
- level: 3
  en: Consider which wire has no connection to the metal casing in normal use.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The fuse
- id: b
  en: The metal casing of the appliance
- id: c
  en: The live wire
- id: d
  en: The neutral wire
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.1343AF856532
  when_answer_equals:
  - d
- id: MC.A.4564F649883F
  when_answer_equals:
  - c
- id: MC.A.47C62707A6A6
  when_answer_equals:
  - a
solution_steps:
- en: The earth wire is connected to the metal body of the appliance.
- en: If a live wire touches the casing, the fault current passes safely to earth and blows the fuse.
- en: This prevents the metal casing from becoming live and giving a shock.
- en: The correct option is b.
tier: C
