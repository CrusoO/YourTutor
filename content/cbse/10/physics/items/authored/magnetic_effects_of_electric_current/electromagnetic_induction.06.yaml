difficulty: 0.9
pool: practice
role: apply
stem:
  en: 'A straight conductor moves at right angles to a uniform magnetic field and produces an induced emf. If its speed is doubled and everything else is kept the same, the induced emf:'
hints:
- level: 1
  en: Recall how the induced emf in a moving conductor depends on its speed.
- level: 2
  en: Ask whether the speed appears as a simple multiplier or in some other form.
- level: 3
  en: Think about whether the field or the length of the conductor has changed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Doubles
- id: b
  en: Quadruples
- id: c
  en: Is unchanged
- id: d
  en: Halves
answer:
  sympy: a
  accept: []
