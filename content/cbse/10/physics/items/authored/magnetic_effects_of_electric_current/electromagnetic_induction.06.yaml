solution_steps:
- en: For a conductor of length L moving at speed v perpendicular to a field B, the induced emf is BLv.
- en: The emf is directly proportional to the speed, so doubling the speed doubles the emf.
- en: The correct option is a.
tier: C
diagram_note: Conductor drawn as a horizontal rod sliding across two parallel rails in the page plane. Magnetic field into the page marked with crosses. An arrow shows the direction of motion of the rod along the rails.
