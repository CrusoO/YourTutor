id: A.10.physics.magnetic_effects_of_electric_current.magnetic_field_lines.03
skill_ids:
- SK.A.10.physics.magnetic_field_lines
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A long straight wire carries current upward through the page, perpendicular to the page. Which pattern do the magnetic field lines form around the wire?
hints:
- level: 1
  en: Consider the plane in which the field lines lie relative to the wire.
- level: 2
  en: Think about how the field changes around the wire rather than along it.
- level: 3
  en: Use the right-hand thumb rule to decide the shape and direction of the lines.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A single loop enclosing the wire on one side only
- id: b
  en: Concentric circles around the wire, in a plane perpendicular to the wire
- id: c
  en: Straight lines parallel to the wire
- id: d
  en: Radial lines pointing outwards from the wire
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.FBB2619CE0F0
  when_answer_equals:
  - c
- id: MC.A.00032A777D02
  when_answer_equals:
  - d
- id: MC.A.C47CAD72E78F
  when_answer_equals:
  - a
solution_steps:
- en: A straight current-carrying wire produces a magnetic field whose lines are concentric circles in a plane perpendicular to the wire.
- en: The direction of the circles is given by the right-hand thumb rule.
- en: The field gets weaker as the distance from the wire increases.
- en: The correct option is b.
tier: C
diagram_note: Top view of a straight wire drawn as a dot, with the current coming out of the page towards the reader. Draw several concentric circles around the dot with arrowheads showing the counterclockwise direction.
