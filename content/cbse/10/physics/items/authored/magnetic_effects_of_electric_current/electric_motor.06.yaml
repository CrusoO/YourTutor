id: A.10.physics.magnetic_effects_of_electric_current.electric_motor.06
skill_ids:
- SK.A.10.physics.electric_motor
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Why does a motor with a soft iron core in the coil give a larger turning effect?
hints:
- level: 1
  en: Think about what the force on the coil depends on besides the current and the number of turns.
- level: 2
  en: Ask what happens to the magnetic field lines when a soft iron core is placed inside the coil.
- level: 3
  en: Consider whether the iron changes the resistance or the energy supply.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The iron core concentrates the magnetic field lines and strengthens the field through the coil
- id: b
  en: The iron stops the current from reversing
- id: c
  en: The iron core supplies extra energy to the coil
- id: d
  en: The iron reduces the resistance of the coil, so more current flows
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.93A8C44DB2DF
  when_answer_equals:
  - c
- id: MC.A.A0F938F37DEC
  when_answer_equals:
  - b
- id: MC.A.082BADD096FA
  when_answer_equals:
  - d
solution_steps:
- en: Soft iron is easily magnetised, and placed inside the coil it strengthens the magnetic field through the coil.
- en: A stronger field gives a larger force on each turn, and so a larger turning effect.
- en: The iron itself does not supply energy or change the current.
- en: The correct option is a.
tier: C
diagram_note: 'Side view of a simple DC motor: a rectangular coil wound around a soft iron core, placed between the N and S poles of a magnet. Label the core, the coil, the poles and the field lines that pass through the core, and mark the direction of the current in the two long sides of the coil.'
