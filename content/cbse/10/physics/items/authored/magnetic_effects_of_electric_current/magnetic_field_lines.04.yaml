id: A.10.physics.magnetic_effects_of_electric_current.magnetic_field_lines.04
skill_ids:
- SK.A.10.physics.magnetic_field_lines
difficulty: 0.6
pool: practice
role: apply
stem:
  en: 'A wire carries a current going into the page. A point is directly above the wire on the page. Using the right-hand thumb rule, the magnetic field at this point points:'
hints:
- level: 1
  en: Imagine your thumb pointing into the page along the wire.
- level: 2
  en: Ask which way your fingers curl around the wire when you look at the point above it.
- level: 3
  en: Think about whether the field is parallel or perpendicular to the wire.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Out of the page
- id: b
  en: To the left of the page
- id: c
  en: To the right of the page
- id: d
  en: Into the page
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.235202C458A7
  when_answer_equals:
  - b
- id: MC.A.E198098E31DF
  when_answer_equals:
  - d
- id: MC.A.9A3B30E2933F
  when_answer_equals:
  - a
solution_steps:
- en: With the thumb pointing in the direction of the current, into the page, the fingers curl around the wire in a clockwise sense as seen from the front.
- en: At the point directly above the wire, the field therefore points to the right.
- en: Reversing the current would reverse this direction.
- en: The correct option is c.
tier: C
diagram_note: Front view of a wire drawn as a dot with a cross inside it to show the current going into the page. A point is marked directly above the dot. Draw a short arrow at that point showing the direction of the magnetic field.
