id: A.10.physics.magnetic_effects_of_electric_current.magnetic_field_lines.02
skill_ids:
- SK.A.10.physics.magnetic_field_lines
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which statement about magnetic field lines is FALSE?
hints:
- level: 1
  en: Consider what a single point in space can have for the direction of the field.
- level: 2
  en: Think about what closeness of the lines tells you about the strength of the field.
- level: 3
  en: Ask whether field lines are closed curves or open ones.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Field lines are closer together where the field is stronger
- id: b
  en: Field lines start at the north pole and end at the south pole only inside the magnet
- id: c
  en: Field lines form closed loops around a magnet
- id: d
  en: Two field lines can cross each other at a point where the field is strong
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.49D81149E327
  when_answer_equals:
  - c
- id: MC.A.C28F3EC43B60
  when_answer_equals:
  - a
- id: MC.A.8F4CA239B3EC
  when_answer_equals:
  - b
solution_steps:
- en: Magnetic field lines never cross each other, because at any point the field has a single direction.
- en: They form closed loops and are closer together where the field is stronger.
- en: Field lines do not end at the poles of a magnet, so the statement about crossing is the false one.
- en: The correct option is d.
tier: C
