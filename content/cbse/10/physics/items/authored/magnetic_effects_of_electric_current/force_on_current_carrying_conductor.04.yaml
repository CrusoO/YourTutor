stem:
  en: 'A wire in a fixed magnetic field carries a current. If the current is doubled and nothing else changes, the force on the wire becomes:'
hints:
- level: 1
  en: Recall how the force formula depends on the current.
- level: 2
  en: Ask whether the current appears as a square or as a simple multiplier in the formula.
- level: 3
  en: Think about whether a change in current changes the force at all.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
