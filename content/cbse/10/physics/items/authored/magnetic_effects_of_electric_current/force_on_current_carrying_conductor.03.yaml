id: A.10.physics.magnetic_effects_of_electric_current.force_on_current_carrying_conductor.03
skill_ids:
- SK.A.10.physics.force_on_current_carrying_conductor
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A horizontal wire carries current from left to right in the plane of the page. The magnetic field points into the page. In which direction is the force on the wire?
hints:
- level: 1
  en: Set your forefinger in the direction of the field and your middle finger in the direction of the current.
- level: 2
  en: Ask which direction your thumb points when the other two fingers are set this way.
- level: 3
  en: Remember that the force is perpendicular to both the field and the current.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Out of the page
- id: b
  en: Downwards, in the plane of the page
- id: c
  en: Into the page
- id: d
  en: Upwards, in the plane of the page
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.2F106F71F89B
  when_answer_equals:
  - b
- id: MC.A.28D38B04FB9C
  when_answer_equals:
  - a
- id: MC.A.A3DFB318B4F5
  when_answer_equals:
  - c
solution_steps:
- en: Using the left-hand rule, the forefinger points into the page along the field, and the middle finger points to the right along the current.
- en: The thumb then points upwards, which is the direction of the force on the wire.
- en: The correct option is d.
tier: C
diagram_note: Horizontal wire drawn in the plane of the page with an arrow to the right showing the current direction. Crosses drawn around the wire to show that the magnetic field points into the page. Label the force direction to be found as the question asks.
