solution_steps:
- en: For a concave mirror, an object at the centre of curvature forms a real, inverted image of the same size, located at the centre of curvature on the other side.
- en: Objects beyond the centre give smaller images, and objects between the centre and the focus give larger ones.
- en: So the same-size case pins the object at C.
- en: The correct option is c.
tier: C
