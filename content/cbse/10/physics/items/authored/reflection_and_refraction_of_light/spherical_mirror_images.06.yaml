id: A.10.physics.reflection_and_refraction_of_light.spherical_mirror_images.06
skill_ids:
- SK.A.10.physics.spherical_mirror_images
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A concave mirror forms a real image of an object that is the same size as the object and inverted. Where is the object?
hints:
- level: 1
  en: Consider the magnification of an image formed when the object and image are equidistant from the mirror.
- level: 2
  en: Compare how far the object lies from the mirror with the radius of curvature.
- level: 3
  en: Ask which special point on the axis gives an image of the same size and the same distance.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Between the focus and the pole
- id: b
  en: At the focus
- id: c
  en: At the centre of curvature
- id: d
  en: Beyond the centre of curvature
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.4367B944C2AD
  when_answer_equals:
  - b
- id: MC.A.8C59BEB371B6
  when_answer_equals:
