id: A.10.physics.reflection_and_refraction_of_light.lens_image_formation.03
skill_ids:
- SK.A.10.physics.lens_image_formation
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A converging lens forms an image of an object placed beyond twice its focal length. Where is the image formed and what is its nature?
hints:
- level: 1
  en: Draw the two principal rays and see where they cross on the far side.
- level: 2
  en: Compare the image distance with the focal length and with twice the focal length.
- level: 3
  en: Ask whether the image can be caught on a screen placed on the far side.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: At the focus on the opposite side, virtual
- id: b
  en: On the same side as the object, virtual
- id: c
  en: Between F and 2F on the opposite side, real and inverted
- id: d
  en: Beyond 2F on the opposite side, real and inverted
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.59B60C740AED
  when_answer_equals:
  - d
- id: MC.A.4B9B7BADB6F4
  when_answer_equals:
  - a
- id: MC.A.9D887E4C2A97
  when_answer_equals:
  - b
solution_steps:
- en: For a converging lens with the object beyond 2F, the image forms between F and 2F on the opposite side.
- en: The image is real, inverted and smaller than the object.
- en: Because the rays really meet, a screen can catch it.
- en: The correct option is c.
tier: C
diagram_note: Converging lens drawn as a vertical double-headed arrow with the optical centre O at the middle. Mark the focal points F and the points 2F at equal distances on both sides. Place an object arrow on the left beyond 2F. Draw a ray from its tip parallel to the axis that refracts through F on the right, and a ray through O that goes straight. Show the image where they cross.
