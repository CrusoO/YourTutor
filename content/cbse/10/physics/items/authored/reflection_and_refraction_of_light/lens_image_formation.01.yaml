id: A.10.physics.reflection_and_refraction_of_light.lens_image_formation.01
skill_ids:
- SK.A.10.physics.lens_image_formation
difficulty: 0.2
pool: practice
role: recall
stem:
  en: 'A converging lens is used as a magnifying glass. The object is placed between the optical centre and the focus. The image is:'
hints:
- level: 1
  en: Ask whether the refracted rays actually meet on the far side of the lens.
- level: 2
  en: Think about the position of the object relative to the focus.
- level: 3
  en: A magnifying glass lets you look through it at an enlarged, upright picture.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Virtual, inverted and diminished
- id: b
  en: Real, inverted and magnified, on the far side of the lens
- id: c
  en: Virtual, erect and magnified, on the same side as the object
- id: d
  en: Real, erect and diminished
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.169BF9F8BFC7
  when_answer_equals:
  - b
- id: MC.A.4474F78833CC
  when_answer_equals:
  - a
- id: MC.A.EA7BA9DBF596
  when_answer_equals:
  - d
solution_steps:
- en: A converging lens with the object inside its focal length forms a virtual, erect and magnified image on the same side as the object.
- en: This is the working principle of a magnifying glass.
- en: The image cannot be caught on a screen.
- en: The correct option is c.
tier: C
