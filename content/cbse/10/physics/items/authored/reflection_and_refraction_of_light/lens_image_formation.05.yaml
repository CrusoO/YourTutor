id: A.10.physics.reflection_and_refraction_of_light.lens_image_formation.05
skill_ids:
- SK.A.10.physics.lens_image_formation
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A converging lens forms a real image of an object that is the same size as the object and inverted. Where is the object placed?
hints:
- level: 1
  en: Recall how the image distance and object distance are related for a converging lens.
- level: 2
  en: Consider the case where the object and image are symmetric about the lens.
- level: 3
  en: Ask at which special distance the magnification is exactly one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: At twice the focal length (2F) from the lens
- id: b
  en: Between the focus and the lens
- id: c
  en: At the focus of the lens
- id: d
  en: At the optical centre of the lens
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.E8AADD7A5507
  when_answer_equals:
  - c
- id: MC.A.3D9DA096EB89
  when_answer_equals:
  - d
- id: MC.A.D24EDBF00231
  when_answer_equals:
  - b
solution_steps:
- en: When the object is at 2F, the real image is also formed at 2F on the other side, and the image is the same size as the object.
- en: For a converging lens this is the only position that gives a same-size inverted real image.
- en: Moving the object closer gives a larger image, and moving it farther gives a smaller one.
- en: The correct option is a.
tier: C
diagram_note: Converging lens with the optical centre O, focal points F and the points 2F marked on both sides at equal distances. Place an object arrow exactly on the 2F mark on the left. Draw two rays from its tip to the lens, and show where the refracted rays meet on the right as the image.
