solution_steps:
- en: The optical centre of a thin lens is a point where the two faces act like a thin slab with parallel surfaces, so a ray through it emerges without any net deviation.
- en: This ray is one of the principal rays used to locate an image.
- en: The correct option is c.
tier: C
