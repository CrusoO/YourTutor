id: A.10.physics.reflection_and_refraction_of_light.lens_image_formation.04
skill_ids:
- SK.A.10.physics.lens_image_formation
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A ray of light passes through the optical centre of a thin lens. What happens to this ray?
hints:
- level: 1
  en: Think about the thin slab at the middle of the lens.
- level: 2
  en: Ask what happens to a ray that goes through the centre of a glass slab with parallel faces.
- level: 3
  en: Compare this with the rays that travel parallel to the axis.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is reflected straight back along its path
- id: b
  en: It bends away from the principal axis
- id: c
  en: It goes through without bending
- id: d
  en: It bends towards the principal axis
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.29993C737757
  when_answer_equals:
  - d
- id: MC.A.8779AC310D17
  when_answer_equals:
