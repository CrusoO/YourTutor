id: A.10.physics.reflection_and_refraction_of_light.spherical_mirror_images.01
skill_ids:
- SK.A.10.physics.spherical_mirror_images
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A concave mirror forms an image of an object placed beyond its centre of curvature. Which statement describes this image?
hints:
- level: 1
  en: Think about where the reflected rays actually meet, not where they appear to come from.
- level: 2
  en: Compare the object's distance with the focus and with the centre of curvature.
- level: 3
  en: Ask whether a screen placed in front of the mirror could catch this image.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Virtual, erect and magnified, behind the mirror
- id: b
  en: Virtual, inverted and the same size as the object
- id: c
  en: Real, inverted and smaller than the object, lying between the focus and the centre of curvature
- id: d
  en: Real, inverted and larger than the object
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.DADBDC448FA3
  when_answer_equals:
  - a
- id: MC.A.3721AFC5CFB2
  when_answer_equals:
  - d
- id: MC.A.D94F892B7AB0
  when_answer_equals:
  - b
solution_steps:
- en: An object placed beyond the centre of curvature of a concave mirror forms a real image.
- en: The image is inverted, smaller than the object, and lies between the focus and the centre of curvature.
- en: Real images can be caught on a screen placed in front of the mirror.
- en: The correct option is c.
tier: C
diagram_note: 'Concave mirror drawn with its principal axis horizontal. Mark the pole P, focus F and centre of curvature C. Place an object arrow beyond C and draw two rays from its tip: one parallel to the axis that reflects through F, and one through F that reflects parallel to the axis. Show where the reflected rays cross.'
