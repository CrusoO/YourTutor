id: A.10.physics.reflection_and_refraction_of_light.lens_image_formation.02
skill_ids:
- SK.A.10.physics.lens_image_formation
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A diverging lens forms the image of a real object. Which statement describes the image in every case?
hints:
- level: 1
  en: Ask whether the refracted rays converge or spread out after the lens.
- level: 2
  en: Think about which side of the lens the image appears on.
- level: 3
  en: Compare the size of the image with that of the object for a diverging lens.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Real, inverted and diminished
- id: b
  en: Real, inverted and magnified
- id: c
  en: Virtual, erect and diminished
- id: d
  en: Virtual, erect and magnified
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.4C4FE197CA04
  when_answer_equals:
  - b
- id: MC.A.452654FBD8AE
  when_answer_equals:
  - d
- id: MC.A.5767BE076E08
  when_answer_equals:
  - a
solution_steps:
- en: A diverging lens spreads out the refracted rays, so their backward extensions meet on the same side as the object.
- en: The image is therefore virtual and erect, and it is always smaller than the object.
- en: This holds wherever the object is placed.
- en: The correct option is c.
tier: C
