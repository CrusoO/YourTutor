difficulty: 0.2
pool: practice
role: recall
stem:
  en: A convex mirror is used as a rear-view mirror. Which statement describes the image of a real object it forms?
hints:
- level: 1
  en: Consider whether the reflected rays spread out or come together.
- level: 2
  en: Think about which side of the mirror the image appears on.
- level: 3
  en: A wide field of view is one reason this mirror is chosen for vehicles.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Real, inverted and magnified
- id: b
  en: Virtual, erect and diminished
- id: c
  en: Real, erect and diminished
- id: d
  en: Virtual, erect and magnified
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.557621E1BEC9
  when_answer_equals:
