solution_steps:
- en: A convex mirror bulges outwards, so the reflected rays diverge.
- en: Their backward extensions meet behind the mirror, which makes the image virtual.
- en: The image is erect and smaller than the object, which is why it gives a wide field of view.
- en: The correct option is b.
tier: C
