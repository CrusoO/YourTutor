id: A.10.physics.reflection_and_refraction_of_light.lens_image_formation.06
skill_ids:
- SK.A.10.physics.lens_image_formation
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Light from a very distant star is focused by a converging lens onto a screen. Which statement describes the image on the screen?
hints:
- level: 1
  en: Consider the direction of the rays coming from a very distant object.
- level: 2
  en: Ask where parallel rays meet after passing through a converging lens.
- level: 3
  en: Think about why the screen must be moved to a particular position.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is virtual, erect and formed at the lens itself
- id: b
  en: It is real, magnified and formed at twice the focal length
- id: c
  en: It is real, inverted and point-like, formed at the focal point
- id: d
  en: It is formed at the optical centre of the lens
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.A097B010849E
  when_answer_equals:
  - a
- id: MC.A.72E84D0A119B
  when_answer_equals:
  - b
- id: MC.A.E0A64A331E22
  when_answer_equals:
  - d
solution_steps:
- en: A distant object sends almost parallel rays to the lens.
- en: These converge to the focal point on the far side, forming a real, inverted, point-like image.
- en: The screen must be placed at the focus to catch it sharply.
- en: The correct option is c.
tier: C
