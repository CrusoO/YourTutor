stem:
  en: 'A narrow beam of light parallel to the principal axis strikes a concave mirror. After reflection, the beam:'
hints:
- level: 1
  en: Recall which point on the axis the reflected rays converge to.
- level: 2
  en: Remember that the focal length is half the radius of curvature.
- level: 3
  en: Think about the path of a ray that meets the mirror at a slant versus parallel to the axis.
