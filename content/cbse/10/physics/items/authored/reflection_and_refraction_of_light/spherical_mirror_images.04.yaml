solution_steps:
- en: A ray parallel to the principal axis reflects from a concave mirror and passes through the principal focus F.
- en: The focus lies halfway between the pole and the centre of curvature.
- en: This is the basis of the focal length of a spherical mirror.
- en: The correct option is d.
