id: A.10.physics.reflection_and_refraction_of_light.spherical_mirror_images.03
skill_ids:
- SK.A.10.physics.spherical_mirror_images
difficulty: 0.6
pool: practice
role: explain
stem:
  en: An object is placed between the pole and the focus of a concave mirror. Which statement describes the image?
hints:
- level: 1
  en: Start by asking whether the reflected rays converge or diverge.
- level: 2
  en: Trace the two rays backwards behind the mirror to find where they seem to start.
- level: 3
  en: Compare the object's distance from the mirror with the focal length.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Real, inverted and magnified, in front of the mirror
- id: b
  en: Virtual, inverted and diminished, behind the mirror
- id: c
  en: Real, erect and diminished, between the focus and the pole
- id: d
  en: Virtual, erect and magnified, located behind the mirror
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.CEEDFE3D9CC1
  when_answer_equals:
  - a
- id: MC.A.2509EBE94B4A
  when_answer_equals:
  - c
- id: MC.A.613640867CE3
  when_answer_equals:
  - b
solution_steps:
- en: When the object is inside the focus of a concave mirror, the reflected rays diverge.
- en: Extending them backwards behind the mirror gives a virtual image that is erect and larger than the object.
- en: This is the principle of a shaving or make-up mirror.
- en: The correct option is d.
tier: C
diagram_note: Concave mirror with pole P and focus F marked on the principal axis. Place an object arrow between P and F. Draw a ray from its tip parallel to the axis that reflects through F, and a second ray that reflects off the mirror surface near P. Extend both reflected rays backwards with dashed lines behind the mirror and mark where they meet as the image.
