id: A.10.physics.sources_of_energy.energy_sustainability.02
skill_ids:
- SK.A.10.physics.energy_sustainability
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which of these is a simple way of conserving energy at home?
hints:
- level: 1
  en: Think about whether a device uses energy when it is not in use.
- level: 2
  en: Ask what happens to the energy used by a light when no one is in the room.
- level: 3
  en: Consider which action reduces energy waste rather than adding to it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Switching off lights and fans when leaving a room
- id: b
  en: Running the washing machine with only a few clothes
- id: c
  en: Keeping the refrigerator door open while deciding what to take
- id: d
  en: Leaving the television on standby overnight
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.D464482E1534
  when_answer_equals:
  - d
- id: MC.A.B9B5352EA912
  when_answer_equals:
  - b
- id: MC.A.D0E99D67EBC1
  when_answer_equals:
  - c
solution_steps:
- en: Switching off devices that are not needed saves the energy they would otherwise use.
- en: Standby power, washing machines run for small loads and open refrigerator doors all waste energy, so they are the opposite of conservation.
- en: The correct option is a.
tier: C
