id: A.10.physics.sources_of_energy.conventional_sources.03
skill_ids:
- SK.A.10.physics.conventional_sources
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Which statement about a hydroelectric power plant is most accurate?
hints:
- level: 1
  en: Think about what drives the turbines in a hydroelectric plant.
- level: 2
  en: Ask what the construction of a large dam does to the land around it.
- level: 3
  en: Compare the emissions of running this plant with those of a fossil fuel plant.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It needs no water source to run
- id: b
  en: It produces radioactive waste
- id: c
  en: It produces large amounts of carbon dioxide during operation
- id: d
  en: It uses the flow of water and has low running emissions, but building the dam can submerge land and disturb habitats
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.E8667883FCA3
  when_answer_equals:
  - c
- id: MC.A.F5558B1DA7CC
  when_answer_equals:
  - a
- id: MC.A.354632AD001A
  when_answer_equals:
  - b
solution_steps:
- en: A hydroelectric plant uses falling water to turn turbines, so it produces little carbon dioxide while it runs.
- en: The dam can flood large areas of land, displacing people and affecting wildlife and river ecosystems.
- en: Both points are needed for a fair assessment.
- en: The correct option is d.
tier: C
