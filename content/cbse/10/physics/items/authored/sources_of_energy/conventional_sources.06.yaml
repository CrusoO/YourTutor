id: A.10.physics.sources_of_energy.conventional_sources.06
skill_ids:
- SK.A.10.physics.conventional_sources
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Fossil fuels are called non-renewable. Why?
hints:
- level: 1
  en: Think about how long it took for the fuel to form.
- level: 2
  en: Ask whether the rate of formation is comparable with the rate of use.
- level: 3
  en: Consider whether the word renewable refers to the fuel itself or to the oxygen it needs.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They can be made in a laboratory in a few days
- id: b
  en: They are always present in the air around us
- id: c
  en: They cannot be burned in an engine
- id: d
  en: They form over millions of years, far more slowly than they are being consumed
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.5BB468C5CD5F
  when_answer_equals:
  - c
- id: MC.A.3AD6BE5ABC09
  when_answer_equals:
  - b
- id: MC.A.48E0D61B22E2
  when_answer_equals:
  - a
solution_steps:
- en: Fossil fuels formed from buried plant and animal remains over geological time.
- en: Human use takes place on a timescale of decades or centuries, so the stock cannot be replaced fast enough.
- en: This is why they are called non-renewable.
- en: The correct option is d.
tier: C
