id: A.10.physics.sources_of_energy.energy_sustainability.05
skill_ids:
- SK.A.10.physics.energy_sustainability
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which statement about making sustainable energy choices is most defensible?
hints:
- level: 1
  en: Think about how many different factors affect the impact of a power source.
- level: 2
  en: Ask whether a single factor can settle the choice in every location.
- level: 3
  en: Consider whether energy use can be avoided altogether.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The source with the lowest upfront cost should always be chosen
- id: b
  en: No energy source should be used, to protect the environment
- id: c
  en: The source that uses the most land should be chosen to save energy
- id: d
  en: The best choice weighs local land use, emissions and reliability, rather than one factor alone
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.6770B5D798B4
  when_answer_equals:
  - a
- id: MC.A.D4EDF535CD72
  when_answer_equals:
  - c
- id: MC.A.27BE730003BC
  when_answer_equals:
  - b
solution_steps:
- en: A sustainable choice looks at several factors together, including the land affected, the emissions produced, the reliability of supply and the lifetime cost.
- en: Relying on one factor alone can lead to a poor decision in a particular place.
- en: The correct option is d.
tier: C
