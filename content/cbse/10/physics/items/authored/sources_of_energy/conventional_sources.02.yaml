solution_steps:
- en: Burning fossil fuels releases carbon dioxide, which adds to global warming, along with oxides of sulphur and nitrogen and particulate matter.
- en: Fossil fuels are also limited in supply, since they take millions of years to form.
- en: The correct option is b.
tier: C
