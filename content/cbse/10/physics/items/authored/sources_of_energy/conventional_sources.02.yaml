difficulty: 0.2
pool: practice
role: recall
stem:
  en: 'A major drawback of burning fossil fuels for power is:'
hints:
- level: 1
  en: Think about what is produced when a fuel is burned.
- level: 2
  en: Ask whether fossil fuels can be replaced at the rate they are used.
- level: 3
  en: Consider the steps needed to get the fuel to a power station.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They are unlimited and regenerate quickly
- id: b
  en: The release of carbon dioxide and other pollutants into the atmosphere
- id: c
  en: They need no mining or transport
- id: d
  en: They produce no waste at all
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.344ADBDF7591
  when_answer_equals:
  - d
- id: MC.A.903197D47FDA
  when_answer_equals:
