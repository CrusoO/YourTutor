id: A.10.physics.sources_of_energy.energy_sustainability.04
skill_ids:
- SK.A.10.physics.energy_sustainability
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A town wants to reduce air pollution from its electricity supply. Which change would help most?
hints:
- level: 1
  en: Think about which source of electricity gives the most pollution.
- level: 2
  en: Ask whether moving a polluting plant reduces the total emissions.
- level: 3
  en: Consider which option replaces a fuel that is burned with an energy source that is not.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Building coal plants farther away from the town
- id: b
  en: Replacing some coal-fired generation with solar and wind power
- id: c
  en: Burning more wood in homes
- id: d
  en: Adding more diesel generators
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.8EC3EBFA254D
  when_answer_equals:
  - d
- id: MC.A.1AE36F77C241
  when_answer_equals:
  - c
- id: MC.A.8A149B9A4FC4
  when_answer_equals:
  - a
solution_steps:
- en: Coal-fired generation is a major source of air pollution and greenhouse gases.
- en: Replacing part of it with solar and wind generation reduces both emissions.
- en: Moving the plant or adding diesel generation does not reduce the total pollution.
- en: The correct option is b.
tier: C
