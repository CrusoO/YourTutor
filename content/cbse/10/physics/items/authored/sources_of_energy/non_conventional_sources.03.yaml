id: A.10.physics.sources_of_energy.non_conventional_sources.03
skill_ids:
- SK.A.10.physics.non_conventional_sources
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A tidal barrage is built across the mouth of an estuary. Why does it produce electrical energy?
hints:
- level: 1
  en: Think about what changes across the barrage as the tide rises and falls.
- level: 2
  en: Ask what makes the water move through the turbines.
- level: 3
  en: Consider whether the sea level is steady or changing over a day.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Waves heat the water, and the steam turns a generator
- id: b
  en: The moon emits energy that is collected directly
- id: c
  en: The sea level stays constant, so the turbines run continuously
- id: d
  en: Water flows in and out as the tide rises and falls, and the flow turns turbines as it passes through them
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.772935356310
  when_answer_equals:
  - a
- id: MC.A.79CA2343C8BB
  when_answer_equals:
  - b
- id: MC.A.C428B466FDBF
  when_answer_equals:
  - c
solution_steps:
- en: The rise and fall of the tide creates a difference in water level across the barrage.
- en: Water flowing through the barrage turns turbines connected to generators.
- en: The energy comes from the gravitational pull that produces the tides.
- en: The correct option is d.
tier: C
