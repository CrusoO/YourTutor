id: A.10.physics.sources_of_energy.energy_sustainability.06
skill_ids:
- SK.A.10.physics.energy_sustainability
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Why is energy efficiency counted as a sustainable measure?
hints:
- level: 1
  en: Think about whether efficiency changes the amount of energy available or the amount used.
- level: 2
  en: Ask what happens to the need for generation if less energy is used for the same task.
- level: 3
  en: Consider whether efficiency creates any new energy.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It guarantees that fuel supplies will never run out
- id: b
  en: It moves all demand from the day to the night
- id: c
  en: It creates extra energy from nothing
- id: d
  en: It does the same task with less energy, which reduces the need for generation and its impacts
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.3EF6B6520B91
  when_answer_equals:
  - c
- id: MC.A.6547B1543A34
  when_answer_equals:
  - b
- id: MC.A.847D5F7A1A75
  when_answer_equals:
  - a
solution_steps:
- en: Energy efficiency means using less energy for the same service.
- en: This reduces the amount of energy that must be generated, and so reduces the fuel burned and the impacts of generation.
- en: It is one of the most direct ways to use energy sustainably.
- en: The correct option is d.
tier: C
