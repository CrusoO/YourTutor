id: A.10.physics.sources_of_energy.energy_sustainability.03
skill_ids:
- SK.A.10.physics.energy_sustainability
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why are renewable sources generally considered better for the environment?
hints:
- level: 1
  en: Think about what is released while the plant is running.
- level: 2
  en: Ask whether the energy source can be replaced by natural processes.
- level: 3
  en: Consider whether any energy source is free of all environmental effects.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They release little or no greenhouse gas while operating and are replenished naturally
- id: b
  en: They need no land at all
- id: c
  en: They never affect wildlife or ecosystems
- id: d
  en: They have no installation cost
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.808E07B5D78B
  when_answer_equals:
  - d
- id: MC.A.60B19A75F2B6
  when_answer_equals:
  - b
- id: MC.A.E5F78B33BF6A
  when_answer_equals:
  - c
solution_steps:
- en: Renewable sources such as solar, wind and hydro release little or no greenhouse gas during operation, and their supply is replenished naturally.
- en: They still have impacts on land, wildlife and manufacture, so the comparison should consider all of these.
- en: The correct option is a.
tier: C
