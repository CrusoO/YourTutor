stem:
  en: Which of these is a fossil fuel?
hints:
- level: 1
  en: Think about what the fuel was made from and how long ago.
- level: 2
  en: Ask whether the source is a fuel that is burned or an energy flow such as wind or water.
- level: 3
  en: Consider which of these is a material mined from the earth's crust.
