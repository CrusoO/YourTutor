difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Compared with a coal-fired power station, what is the main environmental advantage of a wind farm during its operation?
hints:
- level: 1
  en: Think about what is burned or released in each type of station during operation.
- level: 2
  en: Ask what the wind farm uses as its energy input.
- level: 3
  en: Consider which of the two options deals with emissions during operation.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It stores its energy for use later
- id: b
  en: It needs no land at all
- id: c
  en: It emits no carbon dioxide while generating electricity
- id: d
  en: It never needs any maintenance
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.B891AD48970F
  when_answer_equals:
  - b
- id: MC.A.038FE0822E25
  when_answer_equals:
  - d
- id: MC.A.7A29236CD2DC
