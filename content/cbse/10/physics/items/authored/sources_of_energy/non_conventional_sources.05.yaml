solution_steps:
- en: Wind turbines produce electricity from moving air without burning anything, so they emit no carbon dioxide while operating.
- en: They still use land and can affect birds and nearby communities, and they need maintenance.
- en: These points are separate from the emissions advantage.
- en: The correct option is c.
tier: C
