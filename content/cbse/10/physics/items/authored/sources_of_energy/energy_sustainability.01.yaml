id: A.10.physics.sources_of_energy.energy_sustainability.01
skill_ids:
- SK.A.10.physics.energy_sustainability
difficulty: 0.2
pool: practice
role: recall
stem:
  en: 'Sustainable use of energy means:'
hints:
- level: 1
  en: Think about what would happen to resources if they are used up quickly.
- level: 2
  en: Ask whether sustainability means stopping energy use or using it wisely.
- level: 3
  en: Consider whether the energy source can be replaced over time.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Switching off all power plants to save resources
- id: b
  en: Using as much energy as is available today
- id: c
  en: Meeting present needs without reducing the options available to future generations
- id: d
  en: Using only fossil fuels, because they are plentiful
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.F4A659B523F7
  when_answer_equals:
  - b
- id: MC.A.CCC0ABB20EC5
  when_answer_equals:
  - d
- id: MC.A.0A8AFC18B628
  when_answer_equals:
  - a
solution_steps:
- en: Sustainable use of energy meets the needs of today without damaging the environment or depleting resources needed in the future.
- en: It favours efficient use and renewable sources, which can be replaced naturally.
- en: The correct option is c.
tier: C
