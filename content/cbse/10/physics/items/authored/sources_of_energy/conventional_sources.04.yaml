id: A.10.physics.sources_of_energy.conventional_sources.04
skill_ids:
- SK.A.10.physics.conventional_sources
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which statement correctly describes the main advantage and the main drawback of nuclear power?
hints:
- level: 1
  en: Think about whether nuclear power involves burning a fuel.
- level: 2
  en: Ask what remains after the fuel has been used in a reactor.
- level: 3
  en: Consider which of the two points, emissions or waste, is the major drawback.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It burns uranium and releases a large amount of carbon dioxide
- id: b
  en: It produces no waste at all
- id: c
  en: It emits little carbon dioxide while operating, but the radioactive waste must be stored safely for a long time
- id: d
  en: It depends on sunlight to produce its power
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.4AE332004912
  when_answer_equals:
  - a
- id: MC.A.CACA7ECBDEFD
  when_answer_equals:
  - b
- id: MC.A.9F6EB5323B55
  when_answer_equals:
  - d
solution_steps:
- en: Nuclear power releases very little carbon dioxide during operation, since it uses fission rather than burning.
- en: Its spent fuel stays radioactive for a very long time and must be stored and handled with great care.
- en: These are the central advantage and the central drawback.
- en: The correct option is c.
tier: C
