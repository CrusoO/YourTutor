stem:
  en: Among the common fossil fuels, which releases the most carbon dioxide for each unit of energy it supplies?
hints:
- level: 1
  en: Think about how much carbon each fuel carries per unit of heat it gives.
- level: 2
  en: Ask which fuel is the most solid of the three fossil fuels.
- level: 3
  en: Consider which of these sources is a fuel that is burned.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
