solution_steps:
- en: Coal has the highest carbon content per unit of energy among the common fossil fuels, so it releases the most carbon dioxide when burned.
- en: Natural gas releases less.
- en: Uranium and stored water do not produce carbon dioxide in operation.
- en: The correct option is a.
