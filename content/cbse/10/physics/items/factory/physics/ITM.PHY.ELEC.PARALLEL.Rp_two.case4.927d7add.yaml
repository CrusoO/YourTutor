stem:
  en: 'Case: a student investigates resistors joined in parallel and records the following.
    The first resistor, R1, is 10 Ω and the second resistor, R2, is 15 Ω. Find the
    combined resistance.'
options:
- id: a
  en: 6 Ω
- id: b
  en: 0.167 Ω
- id: c
  en: 12.5 Ω
- id: d
  en: 25 Ω
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: in parallel the reciprocals add: 1/Rp = 1/R1 + 1/R2.'
- en: 'Substitute: Rp = 10 x 15 / (10 + 15).'
- en: 'Calculate: Rp = 6 Ω.'
- en: So the total resistance is 6 Ω.
- en: The correct option is a.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: in parallel the reciprocals add: 1/Rp = 1/R1 + 1/R2.'
- level: 2
  en: The relation already gives the total resistance directly, so decide what to
    substitute.
- level: 3
  en: 'First step: write Rp = R1 x R2 / (R1 + R2), where Rp is the total resistance,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the total resistance have, and roughly
    how large is it?
