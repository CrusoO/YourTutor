stem:
  en: A student is studying the magnification of a spherical mirror. The object, u,
    is 60 cm from the convex mirror and the magnification, m, is 0.2. Find the image
    distance, with its sign.
options:
- id: a
  en: 300 cm
- id: b
  en: -300 cm
- id: c
  en: -12 cm
- id: d
  en: 12 cm
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: magnification of a mirror m = -v / u.'
- en: 'Put each quantity in SI units with its sign: u = -0.6 m.'
- en: 'Get the image distance alone: multiply each side of m = -v / u by u, then change
    the sign of each side.'
- en: 'Substitute: v = -0.2 x (-0.6).'
- en: 'Calculate: v = 0.12 m.'
- en: 'Give it in cm: 12 cm.'
- en: So the image distance is 12 cm.
- en: The correct option is d.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: magnification of a mirror m = -v / u.'
- level: 2
  en: 'Get the image distance on its own before you put numbers in: multiply each
    side of m = -v / u by u, then change the sign of each side. Do the same operation
    to each side of the formula. Change every quantity to SI units first, and change
    back at the end if asked. Give each distance its sign by the Cartesian convention
    before you substitute.'
- level: 3
  en: 'First step: Write 60 cm as -0.6 m, then write v = -m x u, where v is the image
    distance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the image distance have, and roughly
    how large is it?
