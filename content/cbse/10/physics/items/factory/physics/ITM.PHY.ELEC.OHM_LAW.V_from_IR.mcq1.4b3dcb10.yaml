stem:
  en: The current through it, I, is 5 mA and its resistance, R, is 5 kΩ. Find the
    potential difference across the resistor.
options:
- id: a
  en: 5000.005 V
- id: b
  en: 1 x 10^6 V
- id: c
  en: 25 V
- id: d
  en: 1 x 10^-6 V
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: V = I x R.'
- en: 'Put each quantity in SI units: 5 mA = 0.005 A; 5 kΩ = 5000 Ω.'
- en: 'Substitute: V = 0.005 x 5000.'
- en: 'Calculate: V = 25 V.'
- en: So the potential difference is 25 V.
- en: The correct option is c.
