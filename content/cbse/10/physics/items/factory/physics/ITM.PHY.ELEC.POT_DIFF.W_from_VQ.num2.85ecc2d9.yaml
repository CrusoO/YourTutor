stem:
  en: This question is about work done in moving charge. The potential difference,
    V, is 3 V and the charge moved, Q, is 0.5 C. How much work is done?
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: V = W / Q, so W = V x Q.'
- level: 2
  en: 'Get the work done on its own before you put numbers in: multiply each side
    of V = W / Q by Q. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write W = V x Q, where W is the work done, with the values in place,
    one quantity at a time.'
