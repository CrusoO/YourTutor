solution_steps:
- en: 'Write the relation: find v from the lens formula, then m = v / u; a positive
    v is a real image on the far side, a negative m is inverted, |m| above 1 is magnified.'
- en: 'Put each quantity in SI units with its sign: u = -0.4 m; f = -0.1 m.'
- en: 'Substitute: v = (-0.4) x (-0.1) / ((-0.4) + (-0.1)).'
- en: 'Calculate: v = -0.08 m.'
- en: 'Give it in cm: -8 cm.'
- en: 'Read the sign of v and of m = v / u: the image is virtual, erect, diminished.'
- en: So the image is virtual, erect, diminished.
- en: The correct option is b.
