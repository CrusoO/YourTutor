solution_steps:
- en: 'Write the relation: the radius of curvature is twice the focal length: R =
    2f, with signs from the convention.'
- en: 'Put each quantity in SI units with its sign: f = -0.15 m.'
- en: 'Substitute: R = 2 x (-0.15).'
- en: 'Calculate: R = -0.3 m.'
- en: 'Give it in cm: -30 cm.'
- en: So the radius of curvature is -30 cm.
