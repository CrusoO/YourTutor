solution_steps:
- en: 'Write the relation: m = -v / u and m = image height / object height.'
- en: 'Put each quantity in SI units with its sign: u = -0.6 m; v = 0.15 m; h = 0.04
    m.'
- en: 'Get the image height alone: multiply each side of m = hi / h by h.'
- en: 'Substitute: hi = -0.15 x 0.04 / (-0.6).'
- en: 'Calculate: hi = 0.01 m.'
- en: 'Give it in cm: 1 cm.'
- en: So the image height is 1 cm.
- en: The correct option is b.
