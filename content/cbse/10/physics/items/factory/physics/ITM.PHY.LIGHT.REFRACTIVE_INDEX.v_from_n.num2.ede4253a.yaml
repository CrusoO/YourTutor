stem:
  en: This question is about light travelling in a transparent medium. The refractive
    index of the medium, n, is 1.25 and the speed of light in vacuum is 3 x 10^8 m/s.
    Find the speed of light in the medium.
options:
- id: a
  en: 3.75 x 10^8 m/s
- id: b
  en: 2.4 x 10^9 m/s
- id: c
  en: 2.4 x 10^8 m/s
- id: d
  en: 2.9999999875 x 10^8 m/s
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: refractive index n = speed of light in vacuum / speed in
    the medium.'
- en: 'Get the speed of light in the medium alone: multiply each side of n = c / v
    by v, then divide each side by n.'
- en: 'Substitute: v = (3 x 10^8) / 1.25.'
- en: 'Calculate: v = 2.4 x 10^8 m/s.'
- en: So the speed of light in the medium is 2.4 x 10^8 m/s.
- en: The correct option is c.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: refractive index n = speed of light in vacuum / speed in the
    medium.'
- level: 2
  en: 'Get the speed of light in the medium on its own before you put numbers in:
    multiply each side of n = c / v by v, then divide each side by n. Do the same
    operation to each side of the formula.'
- level: 3
  en: 'First step: write v = c / n, where v is the speed of light in the medium, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the speed of light in the medium have,
    and roughly how large is it?
