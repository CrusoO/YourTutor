stem:
  en: A student is studying light travelling in a transparent medium. Light travels
    in the medium at 2.5 x 10^8 m/s and the speed of light in vacuum is 3 x 10^8 m/s.
    Find the refractive index of the medium.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: refractive index n = speed of light in vacuum / speed in the
    medium.'
- level: 2
  en: 'Get the refractive index on its own before you put numbers in: multiply each
    side of n = c / v by v, then divide each side by n. Do the same operation to each
    side of the formula.'
- level: 3
  en: 'First step: write n = c / v, where n is the refractive index, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the refractive index be?
