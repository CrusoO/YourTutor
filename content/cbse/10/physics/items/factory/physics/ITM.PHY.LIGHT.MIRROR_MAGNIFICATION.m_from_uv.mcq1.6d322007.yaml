role: procedure
stem:
  en: The object, u, is 15 cm from the concave mirror and the image, which is virtual,
    is 30 cm from the concave mirror. Find the magnification, with its sign.
options:
- id: a
  en: '0.5'
- id: b
  en: '-0.5'
- id: c
  en: '2'
- id: d
  en: '-2'
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: magnification of a mirror m = -v / u.'
- en: 'Put each quantity in SI units with its sign: u = -0.15 m; v = 0.3 m.'
- en: 'Substitute: m = -0.3 / (-0.15).'
- en: 'Calculate: m = 2.'
- en: So the magnification is 2.
- en: The correct option is c.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: magnification of a mirror m = -v / u.'
- level: 2
  en: The relation already gives the magnification directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
    Give each distance its sign by the Cartesian convention before you substitute.
- level: 3
  en: 'First step: Write 15 cm as -0.15 m and 30 cm as 0.3 m, then write m = -v /
    u, where m is the magnification, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the magnification be?
