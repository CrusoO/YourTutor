stem:
  en: This question is about charge flowing in a wire. The charge, Q, is 10 C and
    the time, t, is 2 s. What is the current?
options:
- id: a
  en: 0.2 A
- id: b
  en: 5 A
- id: c
  en: 8 A
- id: d
  en: 20 A
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: charge Q = current I x time t.'
- en: 'Get the current alone: divide each side of Q = I x t by t.'
- en: 'Substitute: I = 10 / 2.'
- en: 'Calculate: I = 5 A.'
- en: So the current is 5 A.
- en: The correct option is b.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: charge Q = current I x time t.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of Q
    = I x t by t. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write I = Q / t, where I is the current, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
