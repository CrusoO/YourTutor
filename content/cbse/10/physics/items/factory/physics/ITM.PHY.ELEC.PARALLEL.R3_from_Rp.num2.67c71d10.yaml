stem:
  en: This question is about resistors joined in parallel. The first resistor, R1,
    is 12 Ω, the second resistor, R2, is 6 Ω and the combined resistance, Rp, is 2
    Ω. Find the third resistance.
options:
- id: a
  en: 0.25 Ω
- id: b
  en: 144 Ω
- id: c
  en: 20 Ω
- id: d
  en: 4 Ω
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: 1/Rp = 1/R1 + 1/R2 + 1/R3.'
- en: 'Get the third resistance alone: subtract 1/R1 and 1/R2 from each side of 1/Rp
    = 1/R1 + 1/R2 + 1/R3, then take the reciprocal of each side.'
- en: 'Substitute: R3 = 1 / (1 / 2 - 1 / 12 - 1 / 6).'
- en: 'Calculate: R3 = 4 Ω.'
- en: So the third resistance is 4 Ω.
- en: The correct option is d.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: 1/Rp = 1/R1 + 1/R2 + 1/R3.'
- level: 2
  en: 'Get the third resistance on its own before you put numbers in: subtract 1/R1
    and 1/R2 from each side of 1/Rp = 1/R1 + 1/R2 + 1/R3, then take the reciprocal
    of each side. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write R3 = 1 / (1 / Rp - 1 / R1 - 1 / R2), where R3 is the third
    resistance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the third resistance have, and roughly
    how large is it?
