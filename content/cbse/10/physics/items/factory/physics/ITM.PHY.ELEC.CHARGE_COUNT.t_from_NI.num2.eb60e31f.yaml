solution_steps:
- en: 'Write the relation: charge Q = N x e, and Q = I x t, so t = N x e / I.'
- en: 'Get the time alone: divide each side of I x t = N x e by I.'
- en: 'Substitute: t = (7.5 x 10^19) x (1.6 x 10^-19) / 2.4.'
- en: 'Calculate: t = 5 s.'
- en: So the time is 5 s.
- en: The correct option is a.
