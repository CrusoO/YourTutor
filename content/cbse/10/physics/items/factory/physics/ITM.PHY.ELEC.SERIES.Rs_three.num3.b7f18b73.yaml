stem:
  en: A student is studying resistors joined in series. The first resistor, R1, is
    12 Ω, the second resistor, R2, is 6 Ω and the third resistor, R3, is 4 Ω. Find
    the total resistance.
options:
- id: a
  en: 288 Ω
- id: b
  en: 2 Ω
- id: c
  en: 22 Ω
- id: d
  en: 0.5 Ω
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: in series the resistances add: Rs = R1 + R2 + R3.'
- en: 'Substitute: Rs = 12 + 6 + 4.'
- en: 'Calculate: Rs = 22 Ω.'
- en: So the total resistance is 22 Ω.
- en: The correct option is c.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: in series the resistances add: Rs = R1 + R2 + R3.'
- level: 2
  en: The relation already gives the total resistance directly, so decide what to
    substitute.
- level: 3
  en: 'First step: write Rs = R1 + R2 + R3, where Rs is the total resistance, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the total resistance have, and roughly
    how large is it?
