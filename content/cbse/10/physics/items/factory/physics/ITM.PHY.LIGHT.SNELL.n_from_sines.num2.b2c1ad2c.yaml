solution_steps:
- en: 'Write the relation: from air into a medium, n = sine of the angle of incidence
    / sine of the angle of refraction.'
- en: 'Get the refractive index alone: divide each side of sin i = n x sin r by sin
    r.'
- en: 'Substitute: n = 0.75 / 0.375.'
- en: 'Calculate: n = 2.'
- en: So the refractive index is 2.
