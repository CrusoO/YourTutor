solution_steps:
- en: 'Write the relation: the focal length is half the radius of curvature: f = R
    / 2, with signs from the convention.'
- en: 'Put each quantity in SI units with its sign: R = 0.6 m.'
- en: 'Get the focal length alone: divide each side of R = 2f by 2.'
- en: 'Substitute: f = 0.6 / 2.'
- en: 'Calculate: f = 0.3 m.'
- en: 'Give it in cm: 30 cm.'
- en: So the focal length is 30 cm.
