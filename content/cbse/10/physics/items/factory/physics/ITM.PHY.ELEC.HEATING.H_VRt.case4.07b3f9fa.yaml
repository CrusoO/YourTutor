stem:
  en: 'Case: a student investigates the heat produced by a current and records the
    following. The voltage, V, is 50 V, the resistance, R, is 10 Ω and the time, t,
    is 2 s. How much heat is produced?'
options:
- id: a
  en: 500 J
- id: b
  en: 250 J
- id: c
  en: 0.008 J
- id: d
  en: 10 J
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: heat H = V x V x t / R.'
- en: 'Substitute: H = 50 x 50 x 2 / 10.'
- en: 'Calculate: H = 500 J.'
- en: So the heat produced is 500 J.
- en: The correct option is a.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: heat H = V x V x t / R.'
- level: 2
  en: The relation already gives the heat produced directly, so decide what to substitute.
- level: 3
  en: 'First step: write H = V x V x t / R, where H is the heat produced, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the heat produced have, and roughly how
    large is it?
