stem:
  en: A student is studying the nature of the image from the mirror and lens formulas.
    The object, u, is 60 cm from the convex lens and the focal length of the convex
    lens, f, is 20 cm. What is the nature of the image?
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: find v from the lens formula, then m = v / u; a positive v is
    a real image on the far side, a negative m is inverted, |m| above 1 is magnified.'
- level: 2
  en: Work out v first, then m, and only then read what their signs say. Change every
    quantity to SI units first, and change back at the end if asked. Give each distance
    its sign by the Cartesian convention before you substitute.
- level: 3
  en: 'First step: Write 60 cm as -0.6 m and 20 cm as 0.2 m, then write v = u x f
    / (u + f), where v is the image distance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: 'Think first: which quantities does the answer depend on, and does it grow or
    shrink?'
