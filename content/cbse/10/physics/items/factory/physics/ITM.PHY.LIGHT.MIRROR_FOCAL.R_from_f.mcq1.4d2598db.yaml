stem:
  en: The focal length of the concave mirror, f, is 15 cm. Find the radius of curvature,
    with its sign.
options:
- id: a
  en: -15 cm
- id: b
  en: -30 cm
- id: c
  en: 30 cm
- id: d
  en: -3000 cm
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: the radius of curvature is twice the focal length: R =
    2f, with signs from the convention.'
- en: 'Put each quantity in SI units with its sign: f = -0.15 m.'
- en: 'Substitute: R = 2 x (-0.15).'
- en: 'Calculate: R = -0.3 m.'
- en: 'Give it in cm: -30 cm.'
- en: So the radius of curvature is -30 cm.
- en: The correct option is b.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: the radius of curvature is twice the focal length: R = 2f, with
    signs from the convention.'
- level: 2
  en: The relation already gives the radius of curvature directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked. Give each distance its sign by the Cartesian convention before you
    substitute.
- level: 3
  en: 'First step: Write 15 cm as -0.15 m, then write R = 2 x f, where R is the radius
    of curvature, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the radius of curvature have, and roughly
    how large is it?
