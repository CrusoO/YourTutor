stem:
  en: 'Case: a student investigates image formation by a spherical mirror and records
    the following. The object, u, is 60 cm from the concave mirror and the image,
    which is real, is 60 cm from the concave mirror. Using the Cartesian sign convention,
    find the focal length f.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: mirror formula 1/v + 1/u = 1/f, with u and v signed by the convention.'
- level: 2
  en: 'Get the focal length on its own before you put numbers in: add 1/v and 1/u,
    then take the reciprocal of each side of 1/f = 1/v + 1/u. Do the same operation
    to each side of the formula. Change every quantity to SI units first, and change
    back at the end if asked. Give each distance its sign by the Cartesian convention
    before you substitute.'
- level: 3
  en: 'First step: Write 60 cm as -0.6 m, then write f = u x v / (u + v), where f
    is the focal length, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the focal length have, and roughly how
    large is it?
