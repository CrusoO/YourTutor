solution_steps:
- en: 'Write the relation: heat H = I x I x R x t: it changes with the square of I
    and directly with t.'
- en: 'Combine the numbers: 4^2 x 2 = 32.'
- en: So the number the heat is multiplied by is 32.
- en: The correct option is c.
