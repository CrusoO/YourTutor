stem:
  en: A student is studying how power changes when a quantity changes. The current
    through a fixed resistor is multiplied by 4 and the time it flows is doubled.
    By what number is the heat produced multiplied?
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: heat H = I x I x R x t: it changes with the square of I and directly
    with t.'
- level: 2
  en: The relation already gives the number the heat is multiplied by directly, so
    decide what to substitute.
- level: 3
  en: 'First step: write down the number each quantity is multiplied by, using 2 for
    doubled and 1/2 for halved, then combine them using the relation.'
prediction_prompt:
  en: 'Think first: which quantities does the answer depend on, and does it grow or
    shrink?'
