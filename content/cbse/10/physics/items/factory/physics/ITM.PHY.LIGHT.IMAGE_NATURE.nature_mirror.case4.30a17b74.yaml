- PHY.LIGHT.IMAGE_NATURE
difficulty: 0.8
type: mcq
pool: practice
role: explain
stem:
  en: 'Case: a student investigates the nature of the image from the mirror and lens
    formulas and records the following. The object, u, is 30 cm from the concave mirror
    and the focal length of the concave mirror, f, is 10 cm. What is the nature of
    the image?'
options:
- id: a
  en: real, inverted, diminished
- id: b
  en: real, erect, diminished
- id: c
  en: real, inverted, magnified
- id: d
  en: virtual, inverted, diminished
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: find v from the mirror formula, then m = -v / u; a negative
    v is a real image in front of the mirror, a negative m is inverted, |m| above
    1 is magnified.'
- en: 'Put each quantity in SI units with its sign: u = -0.3 m; f = -0.1 m.'
- en: 'Substitute: v = (-0.3) x (-0.1) / ((-0.3) - (-0.1)).'
- en: 'Calculate: v = -0.15 m.'
- en: 'Give it in cm: -15 cm.'
- en: 'Read the sign of v and of m = -v / u: the image is real, inverted, diminished.'
- en: So the image is real, inverted, diminished.
- en: The correct option is a.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: find v from the mirror formula, then m = -v / u; a negative v
    is a real image in front of the mirror, a negative m is inverted, |m| above 1
    is magnified.'
- level: 2
  en: Work out v first, then m, and only then read what their signs say. Change every
    quantity to SI units first, and change back at the end if asked. Give each distance
    its sign by the Cartesian convention before you substitute.
- level: 3
  en: 'First step: Write 30 cm as -0.3 m and 10 cm as -0.1 m, then write v = u x f
    / (u - f), where v is the image distance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: 'Think first: which quantities does the answer depend on, and does it grow or
    shrink?'
