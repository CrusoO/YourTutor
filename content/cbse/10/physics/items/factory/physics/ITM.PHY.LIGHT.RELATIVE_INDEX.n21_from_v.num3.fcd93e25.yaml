- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: n21 = n2 / n1 and each n = c / v, so n21 = v1 / v2.'
- level: 2
  en: The relation already gives the refractive index of the second medium relative
    to the first directly, so decide what to substitute.
- level: 3
  en: 'First step: write n21 = v1 / v2, where n21 is the refractive index of the second
    medium relative to the first, with the values in place, one quantity at a time.'
prediction_prompt:
