stem:
  en: 'Case: a student investigates a uniform wire and records the following. Its
    resistance, R, is 1 Ω, the resistivity of its material, rho, is 1 x 10^-7 Ω m
    and its cross-section area, A, is 2 mm². Find the length of the wire.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: R = resistivity x length / area.'
- level: 2
  en: 'Get the length on its own before you put numbers in: multiply each side of
    R = resistivity x L / A by A, then divide each side by the resistivity. Do the
    same operation to each side of the formula. Change every quantity to SI units
    first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 2 mm² as 2 x 10^-6 m², then write L = R x A / rho, where
    L is the length, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the length have, and roughly how large
    is it?
