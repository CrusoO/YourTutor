role: apply
stem:
  en: A student is studying the magnification of a spherical mirror. The object, u,
    is 60 cm from the concave mirror, the image, which is real, is 12 cm from the
    concave mirror and the object, h, is 2 cm tall. Find the height of the image,
    with its sign.
options:
- id: a
  en: 10 cm
- id: b
  en: 0.4 cm
- id: c
  en: -0.4 cm
- id: d
  en: -10 cm
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: m = -v / u and m = image height / object height.'
- en: 'Put each quantity in SI units with its sign: u = -0.6 m; v = -0.12 m; h = 0.02
    m.'
- en: 'Get the image height alone: multiply each side of m = hi / h by h.'
- en: 'Substitute: hi = -(-0.12) x 0.02 / (-0.6).'
- en: 'Calculate: hi = -0.004 m.'
- en: 'Give it in cm: -0.4 cm.'
- en: So the image height is -0.4 cm.
- en: The correct option is c.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: m = -v / u and m = image height / object height.'
- level: 2
  en: 'Get the image height on its own before you put numbers in: multiply each side
    of m = hi / h by h. Do the same operation to each side of the formula. Change
    every quantity to SI units first, and change back at the end if asked. Give each
    distance its sign by the Cartesian convention before you substitute.'
- level: 3
  en: 'First step: Write 60 cm as -0.6 m, 12 cm as -0.12 m and 2 cm as 0.02 m, then
    write hi = -v x h / u, where hi is the image height, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the image height have, and roughly how
    large is it?
