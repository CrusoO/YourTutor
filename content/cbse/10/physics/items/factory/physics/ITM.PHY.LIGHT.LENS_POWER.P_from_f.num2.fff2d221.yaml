- en: 'Write the relation: power P = 1 / f, with f in metres and its sign from the
    convention.'
- en: 'Put each quantity in SI units with its sign: f = -2 m.'
- en: 'Substitute: P = 1 / (-2).'
- en: 'Calculate: P = -0.5 D.'
- en: So the power is -0.5 D.
