stem:
  en: This question is about charge flowing in a wire. The charge, Q, is 0.01 C and
    the time, t, is 5 s. What is the current?
options:
- id: a
  en: 2000 mA
- id: b
  en: 2 mA
- id: c
  en: 500000 mA
- id: d
  en: 50 mA
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: charge Q = current I x time t.'
- en: 'Get the current alone: divide each side of Q = I x t by t.'
- en: 'Substitute: I = 0.01 / 5.'
- en: 'Calculate: I = 0.002 A.'
- en: 'Give it in mA: 2 mA.'
- en: So the current is 2 mA.
- en: The correct option is b.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: charge Q = current I x time t.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of Q
    = I x t by t. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: write I = Q / t, where I is the current, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
