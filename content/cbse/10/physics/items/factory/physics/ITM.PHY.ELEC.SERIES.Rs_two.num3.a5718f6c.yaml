stem:
  en: A student is studying resistors joined in series. The first resistor, R1, is
    10 Ω and the second resistor, R2, is 20 Ω. Find the total resistance.
options:
- id: a
  en: 200 Ω
- id: b
  en: 30 Ω
- id: c
  en: 0.15 Ω
- id: d
  en: 6.67 Ω
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: in series the resistances add: Rs = R1 + R2.'
- en: 'Substitute: Rs = 10 + 20.'
- en: 'Calculate: Rs = 30 Ω.'
- en: So the total resistance is 30 Ω.
- en: The correct option is b.
