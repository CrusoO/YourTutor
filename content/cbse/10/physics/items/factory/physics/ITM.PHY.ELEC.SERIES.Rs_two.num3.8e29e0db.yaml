stem:
  en: A student is studying resistors joined in series. The first resistor, R1, is
    9 Ω and the second resistor, R2, is 18 Ω. Find the total resistance.
options:
- id: a
  en: 6 Ω
- id: b
  en: 0.167 Ω
- id: c
  en: 27 Ω
- id: d
  en: 162 Ω
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: in series the resistances add: Rs = R1 + R2.'
- en: 'Substitute: Rs = 9 + 18.'
- en: 'Calculate: Rs = 27 Ω.'
- en: So the total resistance is 27 Ω.
- en: The correct option is c.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: in series the resistances add: Rs = R1 + R2.'
- level: 2
  en: The relation already gives the total resistance directly, so decide what to
    substitute.
- level: 3
  en: 'First step: write Rs = R1 + R2, where Rs is the total resistance, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the total resistance have, and roughly
    how large is it?
