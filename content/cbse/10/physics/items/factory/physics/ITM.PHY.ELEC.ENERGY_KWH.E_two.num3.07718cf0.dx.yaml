solution_steps:
- en: 'Plan: add the energy of each appliance for one day, power times time, then
    multiply by the days.'
- en: 'Substitute: E2 = (100 x 28800 + 40 x 7200) x 30.'
- en: 'Calculate: E2 = 9.504 x 10^7 J.'
- en: 'Give it in kWh: 26.4 kWh.'
- en: So the energy is 26.4 kWh.
- en: The correct option is b.
