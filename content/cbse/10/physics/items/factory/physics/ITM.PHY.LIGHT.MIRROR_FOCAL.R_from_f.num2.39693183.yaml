solution_steps:
- en: 'Write the relation: the radius of curvature is twice the focal length: R =
    2f, with signs from the convention.'
- en: 'Put each quantity in SI units with its sign: f = -0.25 m.'
- en: 'Substitute: R = 2 x (-0.25).'
- en: 'Calculate: R = -0.5 m.'
- en: 'Give it in cm: -50 cm.'
- en: So the radius of curvature is -50 cm.
