solution_steps:
- en: 'Write the relation: the branches share one voltage, so the larger resistor
    takes the smaller current: I1 x R1 = I2 x R2 and I1 + I2 = total.'
- en: 'Substitute: I2 = 4 x 12 / (12 + 4).'
- en: 'Calculate: I2 = 3 A.'
- en: So the current in the second resistor is 3 A.
- en: The correct option is d.
