difficulty: 0.6
type: mcq
pool: practice
role: apply
stem:
  en: A student is studying a battery connected to resistors in parallel. The total
    current from the battery, It, is 4 A, the first resistor, R1, is 12 Ω and the
    second resistor, R2, is 4 Ω. Find the current in the second resistor.
options:
- id: a
  en: 1 A
- id: b
  en: 2 A
- id: c
  en: 4 A
- id: d
  en: 3 A
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: the branches share one voltage, so the larger resistor
    takes the smaller current: I1 x R1 = I2 x R2 and I1 + I2 = total.'
- en: 'Substitute: I2 = 4 x 12 / (12 + 4).'
- en: 'Calculate: I2 = 3 A.'
- en: So the current in the second resistor is 3 A.
- en: The correct option is d.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: the branches share one voltage, so the larger resistor takes
    the smaller current: I1 x R1 = I2 x R2 and I1 + I2 = total.'
- level: 2
  en: The relation already gives the current in the second resistor directly, so decide
    what to substitute.
- level: 3
  en: 'First step: write I2 = It x R1 / (R1 + R2), where I2 is the current in the
    second resistor, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current in the second resistor have,
    and roughly how large is it?
