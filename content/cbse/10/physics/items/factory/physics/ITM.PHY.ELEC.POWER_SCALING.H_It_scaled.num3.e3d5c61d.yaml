solution_steps:
- en: 'Write the relation: heat H = I x I x R x t: it changes with the square of I
    and directly with t.'
- en: 'Combine the numbers: 2^2 x 5 = 20.'
- en: So the number the heat is multiplied by is 20.
- en: The correct option is b.
