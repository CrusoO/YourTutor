stem:
  en: A student is studying light entering a transparent medium from air. The refractive
    index of the medium, n, is 1.5 and the sine of the angle of refraction is 0.5.
    Find the sine of the angle of incidence.
options:
- id: a
  en: '1'
- id: b
  en: '0.75'
- id: c
  en: '0.333'
- id: d
  en: '3'
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: from air into a medium, sin i = n x sin r.'
- en: 'Substitute: si = 1.5 x 0.5.'
- en: 'Calculate: si = 0.75.'
- en: So the sine of the angle of incidence is 0.75.
- en: The correct option is b.
hints:
- level: 1
