stem:
  en: A student is studying how a wire's resistance changes. The diameter of a uniform
    wire is multiplied by 4; its length and material stay the same. By what number
    is the resistance multiplied?
options:
- id: a
  en: '1'
- id: b
  en: '16'
- id: c
  en: '0.0625'
- id: d
  en: '0.25'
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Plan: R is proportional to length and inversely proportional to area, so the
    new resistance divided by the old one equals the length factor divided by the
    area factor.'
- en: 'Combine the numbers: 1 / 16 = 0.0625.'
- en: So the number the resistance is multiplied by is 0.0625.
- en: The correct option is c.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Plan the steps: R is proportional
    to length and inversely proportional to area, so the new resistance divided by
    the old one equals the length factor divided by the area factor.'
- level: 2
  en: Work through the plan one step at a time.
- level: 3
  en: 'First step: write down the number each quantity is multiplied by, using 2 for
    doubled and 1/2 for halved, then combine them using the relation.'
prediction_prompt:
  en: 'Think first: which quantities does the answer depend on, and does it grow or
    shrink?'
