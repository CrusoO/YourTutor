stem:
  en: 'Case: a student investigates a resistor in a circuit and records the following.
    The current through it, I, is 50 mA and its resistance, R, is 2 kΩ. Find the potential
    difference across the resistor.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: V = I x R.'
- level: 2
  en: The relation already gives the potential difference directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 50 mA as 0.05 A and 2 kΩ as 2000 Ω, then write V = I x R,
    where V is the potential difference, with the values in place, one quantity at
    a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference have, and roughly
    how large is it?
