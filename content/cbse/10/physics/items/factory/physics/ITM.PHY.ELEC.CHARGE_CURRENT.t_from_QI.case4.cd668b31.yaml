stem:
  en: 'Case: a student investigates charge flowing in a wire and records the following.
    The charge, Q, is 50 C and the current, I, is 5 A. For how long does the current
    flow?'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: charge Q = current I x time t.'
- level: 2
  en: 'Get the time on its own before you put numbers in: divide each side of Q =
    I x t by I. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write t = Q / I, where t is the time, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the time have, and roughly how large
    is it?
