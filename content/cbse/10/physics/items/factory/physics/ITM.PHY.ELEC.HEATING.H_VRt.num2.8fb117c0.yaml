solution_steps:
- en: 'Write the relation: heat H = V x V x t / R.'
- en: 'Put each quantity in SI units: 10 min = 600 s.'
- en: 'Substitute: H = 5 x 5 x 600 / 10.'
- en: 'Calculate: H = 1500 J.'
- en: So the heat produced is 1500 J.
