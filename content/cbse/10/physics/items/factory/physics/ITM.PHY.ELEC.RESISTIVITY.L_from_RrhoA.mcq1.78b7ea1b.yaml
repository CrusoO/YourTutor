role: procedure
stem:
  en: Its resistance, R, is 0.025 Ω, the resistivity of its material, rho, is 5 x
    10^-7 Ω m and its cross-section area, A, is 1 mm². Find the length of the wire.
options:
- id: a
  en: 5 x 10^6 cm
- id: b
  en: 1.25 cm
- id: c
  en: 1.25 x 10^-12 cm
- id: d
  en: 5 cm
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: R = resistivity x length / area.'
- en: 'Put each quantity in SI units: 1 mm² = 1 x 10^-6 m².'
- en: 'Get the length alone: multiply each side of R = resistivity x L / A by A, then
    divide each side by the resistivity.'
- en: 'Substitute: L = 0.025 x (1 x 10^-6) / (5 x 10^-7).'
- en: 'Calculate: L = 0.05 m.'
- en: 'Give it in cm: 5 cm.'
- en: So the length is 5 cm.
- en: The correct option is d.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: R = resistivity x length / area.'
- level: 2
  en: 'Get the length on its own before you put numbers in: multiply each side of
    R = resistivity x L / A by A, then divide each side by the resistivity. Do the
    same operation to each side of the formula. Change every quantity to SI units
    first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 1 mm² as 1 x 10^-6 m², then write L = R x A / rho, where
    L is the length, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the length have, and roughly how large
    is it?
