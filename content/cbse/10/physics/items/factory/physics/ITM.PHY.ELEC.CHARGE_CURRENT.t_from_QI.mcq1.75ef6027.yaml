stem:
  en: The charge, Q, is 1.2 C and the current, I, is 2 mA. For how long does the current
    flow?
options:
- id: a
  en: 4 x 10^-5 min
- id: b
  en: 10 min
- id: c
  en: 2.78e-05 min
- id: d
  en: 0.01 min
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: charge Q = current I x time t.'
- en: 'Put each quantity in SI units: 2 mA = 0.002 A.'
- en: 'Get the time alone: divide each side of Q = I x t by I.'
- en: 'Substitute: t = 1.2 / 0.002.'
- en: 'Calculate: t = 600 s.'
- en: 'Give it in min: 10 min.'
- en: So the time is 10 min.
- en: The correct option is b.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: charge Q = current I x time t.'
- level: 2
  en: 'Get the time on its own before you put numbers in: divide each side of Q =
    I x t by I. Do the same operation to each side of the formula. Change every quantity
    to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 2 mA as 0.002 A, then write t = Q / I, where t is the time,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the time have, and roughly how large
    is it?
