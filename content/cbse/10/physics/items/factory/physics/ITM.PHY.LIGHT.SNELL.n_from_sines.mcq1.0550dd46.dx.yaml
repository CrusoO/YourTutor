stem:
  en: The sine of the angle of incidence is 0.6 and the sine of the angle of refraction
    is 0.5. Find the refractive index of the medium.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: from air into a medium, n = sine of the angle of incidence / sine
    of the angle of refraction.'
- level: 2
  en: 'Get the refractive index on its own before you put numbers in: divide each
    side of sin i = n x sin r by sin r. Do the same operation to each side of the
    formula.'
- level: 3
  en: 'First step: write n = si / sr, where n is the refractive index, with the values
    in place, one quantity at a time.'
