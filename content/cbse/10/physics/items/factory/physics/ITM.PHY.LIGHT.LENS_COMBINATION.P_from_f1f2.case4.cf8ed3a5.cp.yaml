solution_steps:
- en: 'Write the relation: for thin lenses in contact the powers add: P = 1/f1 + 1/f2
    (f in metres, with signs).'
- en: 'Put each quantity in SI units with its sign: f1 = -0.2 m; f2 = 1 m.'
- en: 'Substitute: P = 1 / (-0.2) + 1 / 1.'
- en: 'Calculate: P = -4 D.'
- en: So the combined power is -4 D.
- en: The correct option is d.
