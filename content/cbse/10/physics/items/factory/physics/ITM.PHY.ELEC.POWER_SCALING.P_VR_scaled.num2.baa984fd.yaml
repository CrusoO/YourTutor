role: explain
stem:
  en: This question is about how power changes when a quantity changes. The potential
    difference across a resistor is tripled and its resistance is multiplied by 4.
    By what number is the power multiplied?
options:
- id: a
  en: '0.444'
- id: b
  en: '12'
- id: c
  en: '0.75'
- id: d
  en: '2.25'
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: P = V x V / R, so combine the effect of V, which is squared,
    with the effect of R, which is inverse.'
- en: 'Combine the numbers: 3^2 / 4 = 2.25.'
- en: So the number the power is multiplied by is 2.25.
- en: The correct option is d.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: P = V x V / R, so combine the effect of V, which is squared,
    with the effect of R, which is inverse.'
- level: 2
  en: The relation already gives the number the power is multiplied by directly, so
    decide what to substitute.
- level: 3
  en: 'First step: write down the number each quantity is multiplied by, using 2 for
    doubled and 1/2 for halved, then combine them using the relation.'
prediction_prompt:
  en: 'Think first: which quantities does the answer depend on, and does it grow or
    shrink?'
