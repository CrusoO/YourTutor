solution_steps:
- en: 'Write the relation: n21 = n2 / n1.'
- en: 'Get the refractive index of the second medium alone: multiply each side of
    n21 = n2 / n1 by n1.'
- en: 'Substitute: n2 = 0.625 x 2.'
- en: 'Calculate: n2 = 1.25.'
- en: So the refractive index of the second medium is 1.25.
