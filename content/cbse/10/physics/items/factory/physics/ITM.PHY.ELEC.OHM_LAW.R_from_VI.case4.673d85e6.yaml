solution_steps:
- en: 'Write the relation: V = I x R.'
- en: 'Put each quantity in SI units: 5 mA = 0.005 A.'
- en: 'Get the resistance alone: divide each side of V = I x R by I.'
- en: 'Substitute: R = 50 / 0.005.'
- en: 'Calculate: R = 10000 Ω.'
- en: 'Give it in kΩ: 10 kΩ.'
- en: So the resistance is 10 kΩ.
- en: The correct option is d.
