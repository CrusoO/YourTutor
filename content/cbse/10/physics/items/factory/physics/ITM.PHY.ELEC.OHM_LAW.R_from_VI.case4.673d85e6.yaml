stem:
  en: 'Case: a student investigates a resistor in a circuit and records the following.
    The potential difference across it, V, is 50 V and the current through it, I,
    is 5 mA. Find the resistance of the resistor.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: V = I x R.'
- level: 2
  en: 'Get the resistance on its own before you put numbers in: divide each side of
    V = I x R by I. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 5 mA as 0.005 A, then write R = V / I, where R is the resistance,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the resistance have, and roughly how
    large is it?
