stem:
  en: This question is about how a wire's resistance changes. A uniform wire is stretched
    evenly to 2 times its original length, so its volume stays the same. By what number
    is the resistance multiplied?
options:
- id: a
  en: '0.25'
- id: b
  en: '2'
- id: c
  en: '4'
- id: d
  en: '1'
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Plan: R is proportional to length and inversely proportional to area, so the
    new resistance divided by the old one equals the length factor divided by the
    area factor.'
- en: 'Combine the numbers: 2 / 0.5 = 4.'
- en: So the number the resistance is multiplied by is 4.
- en: The correct option is c.
