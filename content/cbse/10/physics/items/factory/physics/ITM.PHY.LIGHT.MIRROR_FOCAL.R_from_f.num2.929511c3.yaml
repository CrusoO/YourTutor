stem:
  en: This question is about radius of curvature and focal length of a spherical mirror.
    The focal length of the convex mirror, f, is 20 cm. Find the radius of curvature,
    with its sign.
options:
- id: a
  en: 40 cm
- id: b
  en: 4000 cm
- id: c
  en: 20 cm
- id: d
  en: -40 cm
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: the radius of curvature is twice the focal length: R =
    2f, with signs from the convention.'
- en: 'Put each quantity in SI units with its sign: f = 0.2 m.'
- en: 'Substitute: R = 2 x 0.2.'
- en: 'Calculate: R = 0.4 m.'
- en: 'Give it in cm: 40 cm.'
- en: So the radius of curvature is 40 cm.
- en: The correct option is a.
