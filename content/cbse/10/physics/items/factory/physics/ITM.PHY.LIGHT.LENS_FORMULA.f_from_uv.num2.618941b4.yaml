stem:
  en: This question is about image formation by a thin lens. The object, u, is 20
    cm from the convex lens and the image, which is real, is 60 cm from the convex
    lens. Using the Cartesian sign convention, find the focal length f.
options:
- id: a
  en: 667 cm
- id: b
  en: -30 cm
- id: c
  en: -15 cm
- id: d
  en: 15 cm
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: lens formula 1/v - 1/u = 1/f, with u and v signed by the
    convention.'
- en: 'Put each quantity in SI units with its sign: u = -0.2 m; v = 0.6 m.'
- en: 'Get the focal length alone: subtract 1/u from 1/v, then take the reciprocal
    of each side of 1/f = 1/v - 1/u.'
- en: 'Substitute: f = (-0.2) x 0.6 / ((-0.2) - 0.6).'
- en: 'Calculate: f = 0.15 m.'
- en: 'Give it in cm: 15 cm.'
- en: So the focal length is 15 cm.
- en: The correct option is d.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: lens formula 1/v - 1/u = 1/f, with u and v signed by the convention.'
- level: 2
  en: 'Get the focal length on its own before you put numbers in: subtract 1/u from
    1/v, then take the reciprocal of each side of 1/f = 1/v - 1/u. Do the same operation
    to each side of the formula. Change every quantity to SI units first, and change
    back at the end if asked. Give each distance its sign by the Cartesian convention
    before you substitute.'
- level: 3
  en: 'First step: Write 20 cm as -0.2 m and 60 cm as 0.6 m, then write f = u x v
    / (u - v), where f is the focal length, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the focal length have, and roughly how
    large is it?
