solution_steps:
- en: 'Write the relation: heat H = I x I x R x t.'
- en: 'Put each quantity in SI units: 10 min = 600 s.'
- en: 'Substitute: H = 0.5 x 0.5 x 100 x 600.'
- en: 'Calculate: H = 15000 J.'
- en: So the heat produced is 15000 J.
- en: The correct option is c.
