role: apply
stem:
  en: This question is about a battery connected to resistors in parallel. The battery
    gives 24 V, the first resistor, R1, is 4 Ω and the second resistor, R2, is 4 Ω.
    Find the total current drawn from the battery.
options:
- id: a
  en: 3 A
- id: b
  en: 12 A
- id: c
  en: 192 A
- id: d
  en: 6 A
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: each branch has the full battery voltage: I = V / R for
    each, and the branch currents add.'
- en: 'Substitute: It = 24 / 4 + 24 / 4.'
- en: 'Calculate: It = 12 A.'
- en: So the total current is 12 A.
- en: The correct option is b.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: each branch has the full battery voltage: I = V / R for each,
    and the branch currents add.'
- level: 2
  en: The relation already gives the total current directly, so decide what to substitute.
- level: 3
  en: 'First step: write It = V / R1 + V / R2, where It is the total current, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the total current have, and roughly how
    large is it?
