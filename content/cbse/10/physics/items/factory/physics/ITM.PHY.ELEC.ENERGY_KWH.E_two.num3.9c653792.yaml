solution_steps:
- en: 'Plan: add the energy of each appliance for one day, power times time, then
    multiply by the days.'
- en: 'Substitute: E2 = (1000 x 18000 + 100 x 10800) x 10.'
- en: 'Calculate: E2 = 1.908 x 10^8 J.'
- en: 'Give it in kWh: 53 kWh.'
- en: So the energy is 53 kWh.
- en: The correct option is b.
