stem:
  en: A student is studying the heat produced by a current. The current, I, is 0.5
    A, the resistance, R, is 10 Ω and the time, t, is 2 min. How much heat is produced?
options:
- id: a
  en: 300 J
- id: b
  en: 600 J
- id: c
  en: 5 J
- id: d
  en: 2.5 J
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: heat H = I x I x R x t.'
- en: 'Put each quantity in SI units: 2 min = 120 s.'
- en: 'Substitute: H = 0.5 x 0.5 x 10 x 120.'
- en: 'Calculate: H = 300 J.'
- en: So the heat produced is 300 J.
- en: The correct option is a.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: heat H = I x I x R x t.'
- level: 2
  en: The relation already gives the heat produced directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 2 min as 120 s, then write H = I x I x R x t, where H is
    the heat produced, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the heat produced have, and roughly how
    large is it?
