stem:
  en: A student is studying light passing from one medium into another. The second
    medium relative to the first has refractive index 1.5 and the first medium has
    refractive index 2. Find the refractive index of the second medium.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: n21 = n2 / n1.'
- level: 2
  en: 'Get the refractive index of the second medium on its own before you put numbers
    in: multiply each side of n21 = n2 / n1 by n1. Do the same operation to each side
    of the formula.'
- level: 3
  en: 'First step: write n2 = n21 x n1, where n2 is the refractive index of the second
    medium, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the refractive index of the second
    medium be?
