role: transfer
stem:
  en: 'Case: a student investigates a resistor in series with two resistors in parallel
    and records the following. The battery gives 7 V, the resistor in series with
    the pair, R1, is 2 Ω, one resistor of the parallel pair, R2, is 30 Ω and the other
    resistor of the pair, R3, is 20 Ω. Find the potential difference across the parallel
    pair.'
options:
- id: a
  en: 3.5 V
- id: b
  en: 6 V
- id: c
  en: 7 V
- id: d
  en: 1 V
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: find the battery current, then use V = I x R on the parallel
    pair alone.'
- en: 'Substitute: Vp = 7 x 30 x 20 / (2 x (30 + 20) + 30 x 20).'
- en: 'Calculate: Vp = 6 V.'
- en: So the potential difference across the pair is 6 V.
- en: The correct option is b.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: find the battery current, then use V = I x R on the parallel
    pair alone.'
- level: 2
  en: The relation already gives the potential difference across the pair directly,
    so decide what to substitute.
- level: 3
  en: 'First step: write Vp = V x R2 x R3 / (R1 x (R2 + R3) + R2 x R3), where Vp is
    the potential difference across the pair, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference across the pair
    have, and roughly how large is it?
