stem:
  en: This question is about an electrical appliance. The voltage across it, V, is
    50 V and the current through it, I, is 5 A. Find the power.
options:
- id: a
  en: 55 W
- id: b
  en: 250 W
- id: c
  en: 10 W
- id: d
  en: 0.1 W
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: P = V x I.'
- en: 'Substitute: P = 50 x 5.'
- en: 'Calculate: P = 250 W.'
- en: So the power is 250 W.
- en: The correct option is b.
