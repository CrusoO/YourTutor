stem:
  en: A student is studying the power of a lens. The power of the lens, P, is 2 D.
    Find the focal length in cm, with its sign.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: power P = 1 / f, so f = 1 / P in metres.'
- level: 2
  en: 'Get the focal length on its own before you put numbers in: multiply each side
    of P = 1 / f by f, then divide each side by P. Do the same operation to each side
    of the formula. Change every quantity to SI units first, and change back at the
    end if asked. Give each distance its sign by the Cartesian convention before you
    substitute.'
- level: 3
  en: 'First step: write f = 1 / P, where f is the focal length, with the values in
    place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the focal length have, and roughly how
    large is it?
