solution_steps:
- en: 'Write the relation: magnification of a lens m = v / u.'
- en: 'Put each quantity in SI units with its sign: u = -0.15 m; v = -0.6 m.'
- en: 'Substitute: m = (-0.6) / (-0.15).'
- en: 'Calculate: m = 4.'
- en: So the magnification is 4.
- en: The correct option is a.
