stem:
  en: This question is about the heat produced by a current. The voltage, V, is 50
    V, the current, I, is 5 A and the time, t, is 10 min. How much heat is produced?
options:
- id: a
  en: 2500 J
- id: b
  en: 6000 J
- id: c
  en: 150000 J
- id: d
  en: 250 J
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: heat H = V x I x t.'
- en: 'Put each quantity in SI units: 10 min = 600 s.'
- en: 'Substitute: H = 50 x 5 x 600.'
- en: 'Calculate: H = 150000 J.'
- en: So the heat produced is 150000 J.
- en: The correct option is c.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: heat H = V x I x t.'
- level: 2
  en: The relation already gives the heat produced directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 10 min as 600 s, then write H = V x I x t, where H is the
    heat produced, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the heat produced have, and roughly how
    large is it?
