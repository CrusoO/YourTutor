solution_steps:
- en: 'Write the relation: the focal length is half the radius of curvature: f = R
    / 2, with signs from the convention.'
- en: 'Put each quantity in SI units with its sign: R = -0.2 m.'
- en: 'Get the focal length alone: divide each side of R = 2f by 2.'
- en: 'Substitute: f = (-0.2) / 2.'
- en: 'Calculate: f = -0.1 m.'
- en: 'Give it in cm: -10 cm.'
- en: So the focal length is -10 cm.
- en: The correct option is a.
