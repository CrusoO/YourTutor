stem:
  en: This question is about radius of curvature and focal length of a spherical mirror.
    The radius of curvature of the concave mirror, R, is 20 cm. Find the focal length,
    with its sign.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: the focal length is half the radius of curvature: f = R / 2, with
    signs from the convention.'
- level: 2
  en: 'Get the focal length on its own before you put numbers in: divide each side
    of R = 2f by 2. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked. Give each distance
    its sign by the Cartesian convention before you substitute.'
- level: 3
  en: 'First step: Write 20 cm as -0.2 m, then write f = R / 2, where f is the focal
    length, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the focal length have, and roughly how
    large is it?
