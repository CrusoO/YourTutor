solution_steps:
- en: 'Write the relation: heat H = I x I x R x t.'
- en: 'Put each quantity in SI units: 10 min = 600 s.'
- en: 'Get the current alone: divide each side of H = I x I x R x t by R x t, then
    take the square root of each side.'
- en: 'Substitute: I = sqrt(24000 / 10 / 600).'
- en: 'Calculate: I = 2 A.'
- en: So the current is 2 A.
- en: The correct option is c.
