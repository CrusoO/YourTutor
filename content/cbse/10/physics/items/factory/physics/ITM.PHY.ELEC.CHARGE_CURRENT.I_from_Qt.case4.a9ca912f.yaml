solution_steps:
- en: 'Write the relation: charge Q = current I x time t.'
- en: 'Put each quantity in SI units: 5 min = 300 s.'
- en: 'Get the current alone: divide each side of Q = I x t by t.'
- en: 'Substitute: I = 0.6 / 300.'
- en: 'Calculate: I = 0.002 A.'
- en: 'Give it in mA: 2 mA.'
- en: So the current is 2 mA.
- en: The correct option is c.
