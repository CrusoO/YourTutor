difficulty: 0.6
type: mcq
pool: practice
role: apply
stem:
  en: A student is studying charge flowing in a wire. The charge, Q, is 40 C and the
    current, I, is 20 A. For how long does the current flow?
options:
- id: a
  en: 0.5 s
- id: b
  en: 20 s
- id: c
  en: 2 s
- id: d
  en: 800 s
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: charge Q = current I x time t.'
- en: 'Get the time alone: divide each side of Q = I x t by I.'
- en: 'Substitute: t = 40 / 20.'
- en: 'Calculate: t = 2 s.'
- en: So the time is 2 s.
- en: The correct option is c.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: charge Q = current I x time t.'
- level: 2
  en: 'Get the time on its own before you put numbers in: divide each side of Q =
    I x t by I. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write t = Q / I, where t is the time, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the time have, and roughly how large
    is it?
