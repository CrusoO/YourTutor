solution_steps:
- en: 'Write the relation: R = resistivity x length / area.'
- en: 'Put each quantity in SI units: 0.25 mm² = 2.5 x 10^-7 m².'
- en: 'Get the length alone: multiply each side of R = resistivity x L / A by A, then
    divide each side by the resistivity.'
- en: 'Substitute: L = 2 x (2.5 x 10^-7) / (1 x 10^-7).'
- en: 'Calculate: L = 5 m.'
- en: So the length is 5 m.
- en: The correct option is a.
