stem:
  en: This question is about electrons passing a point in a wire. The current, I,
    is 0.8 A, the time, t, is 5 s and the charge of one electron is 1.6 x 10^-19 C.
    How many electrons pass a point of the wire in this time?
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: charge Q = I x t, and Q = N x e, so N = I x t / e.'
- level: 2
  en: 'Get the number of electrons on its own before you put numbers in: divide each
    side of Q = N x e by e. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write N = I x t / e, where N is the number of electrons, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the number of electrons be?
