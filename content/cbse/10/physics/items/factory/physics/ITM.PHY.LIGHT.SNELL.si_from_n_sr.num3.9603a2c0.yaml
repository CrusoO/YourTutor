stem:
  en: A student is studying light entering a transparent medium from air. The refractive
    index of the medium, n, is 1.6 and the sine of the angle of refraction is 0.5.
    Find the sine of the angle of incidence.
options:
- id: a
  en: '3.2'
- id: b
  en: '0.3125'
- id: c
  en: '1.1'
- id: d
  en: '0.8'
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: from air into a medium, sin i = n x sin r.'
- en: 'Substitute: si = 1.6 x 0.5.'
- en: 'Calculate: si = 0.8.'
- en: So the sine of the angle of incidence is 0.8.
- en: The correct option is d.
hints:
