stem:
  en: 'Case: a student investigates resistors joined in parallel and records the following.
    The first resistor, R1, is 30 Ω and the combined resistance, Rp, is 12 Ω. Find
    the second resistance.'
options:
- id: a
  en: 360 Ω
- id: b
  en: 0.05 Ω
- id: c
  en: 42 Ω
- id: d
  en: 20 Ω
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: 1/Rp = 1/R1 + 1/R2.'
- en: 'Get the second resistance alone: subtract 1/R1 from each side of 1/Rp = 1/R1
    + 1/R2, then take the reciprocal of each side.'
- en: 'Substitute: R2 = 1 / (1 / 12 - 1 / 30).'
- en: 'Calculate: R2 = 20 Ω.'
- en: So the second resistance is 20 Ω.
- en: The correct option is d.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: 1/Rp = 1/R1 + 1/R2.'
- level: 2
  en: 'Get the second resistance on its own before you put numbers in: subtract 1/R1
    from each side of 1/Rp = 1/R1 + 1/R2, then take the reciprocal of each side. Do
    the same operation to each side of the formula.'
- level: 3
  en: 'First step: write R2 = 1 / (1 / Rp - 1 / R1), where R2 is the second resistance,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the second resistance have, and roughly
    how large is it?
