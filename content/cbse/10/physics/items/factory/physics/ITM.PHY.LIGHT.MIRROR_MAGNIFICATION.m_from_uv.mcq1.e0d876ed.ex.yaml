solution_steps:
- en: 'Write the relation: magnification of a mirror m = -v / u.'
- en: 'Put each quantity in SI units with its sign: u = -0.15 m; v = 0.06 m.'
- en: 'Substitute: m = -0.06 / (-0.15).'
- en: 'Calculate: m = 0.4.'
- en: So the magnification is 0.4.
- en: The correct option is c.
