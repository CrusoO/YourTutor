stem:
  en: This question is about light passing from one medium into another. Light travels
    in the first medium at 2.4 x 10^8 m/s and light travels in the second medium at
    1.25 x 10^8 m/s. Find the refractive index of the second medium relative to the
    first.
options:
- id: a
  en: '0.333'
- id: b
  en: '0.383'
- id: c
  en: '0.521'
- id: d
  en: '1.92'
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: n21 = n2 / n1 and each n = c / v, so n21 = v1 / v2.'
- en: 'Substitute: n21 = (2.4 x 10^8) / (1.25 x 10^8).'
- en: 'Calculate: n21 = 1.92.'
- en: So the refractive index of the second medium relative to the first is 1.92.
- en: The correct option is d.
