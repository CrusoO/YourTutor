stem:
  en: 'Case: a student investigates a battery connected to resistors in series and
    records the following. The battery gives 20 V, the first resistor, R1, is 4 Ω
    and the second resistor, R2, is 6 Ω. Find the potential difference across the
    second resistor.'
options:
- id: a
  en: 12 V
- id: b
  en: 20 V
- id: c
  en: 8 V
- id: d
  en: 10 V
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: find the current from the whole circuit, then use V = I
    x R on one resistor.'
- en: 'Substitute: V2 = 20 x 6 / (4 + 6).'
- en: 'Calculate: V2 = 12 V.'
- en: So the potential difference across the second resistor is 12 V.
- en: The correct option is a.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: find the current from the whole circuit, then use V = I x R on one
    resistor.'
- level: 2
  en: The relation already gives the potential difference across the second resistor
    directly, so decide what to substitute.
- level: 3
  en: 'First step: write V2 = V x R2 / (R1 + R2), where V2 is the potential difference
    across the second resistor, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference across the second
    resistor have, and roughly how large is it?
