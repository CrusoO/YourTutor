stem:
  en: 'Case: a student investigates a resistor in series with two resistors in parallel
    and records the following. The battery gives 39 V, the resistor in series with
    the pair, R1, is 10 Ω, one resistor of the parallel pair, R2, is 12 Ω and the
    other resistor of the pair, R3, is 4 Ω. Find the current in the first resistor
    of the pair.'
options:
- id: a
  en: 0.75 A
- id: b
  en: 1.5 A
- id: c
  en: 3.25 A
- id: d
  en: 3 A
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Plan: find the voltage across the pair, then divide by the resistor of interest.'
- en: 'Substitute: I2 = 39 x 4 / (10 x (12 + 4) + 12 x 4).'
- en: 'Calculate: I2 = 0.75 A.'
- en: So the current in the first parallel resistor is 0.75 A.
- en: The correct option is a.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Plan the steps: find
    the voltage across the pair, then divide by the resistor of interest.'
- level: 2
  en: Work through the plan one step at a time.
- level: 3
  en: 'First step: write I2 = V x R3 / (R1 x (R2 + R3) + R2 x R3), where I2 is the
    current in the first parallel resistor, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current in the first parallel resistor
    have, and roughly how large is it?
