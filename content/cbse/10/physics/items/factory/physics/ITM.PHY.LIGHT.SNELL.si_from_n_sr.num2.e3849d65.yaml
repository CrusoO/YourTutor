stem:
  en: This question is about light entering a transparent medium from air. The refractive
    index of the medium, n, is 1.25 and the sine of the angle of refraction is 0.64.
    Find the sine of the angle of incidence.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: from air into a medium, sin i = n x sin r.'
- level: 2
  en: The relation already gives the sine of the angle of incidence directly, so decide
    what to substitute.
- level: 3
  en: 'First step: write si = n x sr, where si is the sine of the angle of incidence,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the sine of the angle of incidence
    be?
