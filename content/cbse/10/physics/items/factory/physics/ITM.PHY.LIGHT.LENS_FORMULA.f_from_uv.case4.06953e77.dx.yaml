solution_steps:
- en: 'Write the relation: lens formula 1/v - 1/u = 1/f, with u and v signed by the
    convention.'
- en: 'Put each quantity in SI units with its sign: u = -0.6 m; v = 0.6 m.'
- en: 'Get the focal length alone: subtract 1/u from 1/v, then take the reciprocal
    of each side of 1/f = 1/v - 1/u.'
- en: 'Substitute: f = (-0.6) x 0.6 / ((-0.6) - 0.6).'
- en: 'Calculate: f = 0.3 m.'
- en: 'Give it in cm: 30 cm.'
- en: So the focal length is 30 cm.
- en: The correct option is b.
