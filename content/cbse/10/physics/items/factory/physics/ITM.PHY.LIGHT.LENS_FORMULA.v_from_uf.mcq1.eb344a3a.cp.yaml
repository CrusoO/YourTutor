solution_steps:
- en: 'Write the relation: lens formula 1/v - 1/u = 1/f, with u and f signed by the
    convention.'
- en: 'Put each quantity in SI units with its sign: u = -0.6 m; f = 0.1 m.'
- en: 'Get the image distance alone: add 1/u to each side of 1/v - 1/u = 1/f, then
    take the reciprocal of each side.'
- en: 'Substitute: v = (-0.6) x 0.1 / ((-0.6) + 0.1).'
- en: 'Calculate: v = 0.12 m.'
- en: 'Give it in cm: 12 cm.'
- en: So the image distance is 12 cm.
