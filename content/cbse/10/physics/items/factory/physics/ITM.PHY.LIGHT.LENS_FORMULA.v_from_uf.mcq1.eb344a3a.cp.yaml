stem:
  en: The object, u, is 60 cm from the convex lens and the focal length of the convex
    lens, f, is 10 cm. Using the Cartesian sign convention, find the image distance
    v.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: lens formula 1/v - 1/u = 1/f, with u and f signed by the convention.'
- level: 2
  en: 'Get the image distance on its own before you put numbers in: add 1/u to each
    side of 1/v - 1/u = 1/f, then take the reciprocal of each side. Do the same operation
    to each side of the formula. Change every quantity to SI units first, and change
    back at the end if asked. Give each distance its sign by the Cartesian convention
    before you substitute.'
- level: 3
  en: 'First step: Write 60 cm as -0.6 m and 10 cm as 0.1 m, then write v = u x f
    / (u + f), where v is the image distance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the image distance have, and roughly
    how large is it?
