difficulty: 0.5
type: mcq
pool: practice
role: apply
stem:
  en: This question is about the electrical energy an appliance uses. The energy used,
    E1, is 0.4 kWh and the power rating of the first appliance, P1, is 100 W. For
    how many hours can it run?
options:
- id: a
  en: 40 h
- id: b
  en: 0.25 h
- id: c
  en: 4 h
- id: d
  en: 400 h
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: energy E = power P x time t.'
- en: 'Put each quantity in SI units: 0.4 kWh = 1.44 x 10^6 J.'
- en: 'Get the time alone: divide each side of E = P x t by P.'
- en: 'Substitute: t1 = (1.44 x 10^6) / 100.'
- en: 'Calculate: t1 = 14400 h.'
- en: 'Give it in h: 4 h.'
- en: So the time is 4 h.
- en: The correct option is c.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: energy E = power P x time t.'
- level: 2
  en: 'Get the time on its own before you put numbers in: divide each side of E =
    P x t by P. Do the same operation to each side of the formula. Change every quantity
    to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 0.4 kWh as 1.44 x 10^6 J, then write t1 = E1 / P1, where
    t1 is the time, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the time have, and roughly how large
    is it?
