- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: from air into a medium, sin i = n x sin r.'
- level: 2
  en: The relation already gives the sine of the angle of incidence directly, so decide
    what to substitute.
- level: 3
  en: 'First step: write si = n x sr, where si is the sine of the angle of incidence,
    with the values in place, one quantity at a time.'
