stem:
  en: The charge, Q, is 0.05 C and the time, t, is 10 s. What is the current? A classmate
    says the answer is 500 mA. Work it out yourself and choose the correct answer.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: charge Q = current I x time t.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of Q
    = I x t by t. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: write I = Q / t, where I is the current, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
