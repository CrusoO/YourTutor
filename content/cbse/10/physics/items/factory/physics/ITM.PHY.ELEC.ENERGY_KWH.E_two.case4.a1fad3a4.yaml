solution_steps:
- en: 'Plan: add the energy of each appliance for one day, power times time, then
    multiply by the days.'
- en: 'Substitute: E2 = (40 x 7200 + 40 x 10800) x 30.'
- en: 'Calculate: E2 = 2.16 x 10^7 J.'
- en: 'Give it in kWh: 6 kWh.'
- en: So the energy is 6 kWh.
- en: The correct option is b.
