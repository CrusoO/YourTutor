stem:
  en: 'Case: a student investigates the electrical energy an appliance uses and records
    the following. The power rating of the first appliance, P1, is 40 W, the time
    it is used each day, t1, is 2 h, the power rating of the second appliance, P2,
    is 40 W, the time the second one is used each day, t2, is 3 h and the number of
    days, d, is 30. How much electrical energy is used in all, in kWh?'
options:
- id: a
  en: 0.2 kWh
- id: b
  en: 6 kWh
- id: c
  en: 230 kWh
- id: d
  en: 2.4 kWh
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Plan: add the energy of each appliance for one day, power times time, then
    multiply by the days.'
- en: 'Substitute: E2 = (40 x 7200 + 40 x 10800) x 30.'
- en: 'Calculate: E2 = 2.16 x 10^7 J.'
- en: 'Give it in kWh: 6 kWh.'
- en: So the energy is 6 kWh.
- en: The correct option is b.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Plan the steps: add the
    energy of each appliance for one day, power times time, then multiply by the days.'
- level: 2
  en: Work through the plan one step at a time. Change every quantity to SI units
    first, and change back at the end if asked.
- level: 3
  en: 'First step: write E2 = (P1 x t1 + P2 x t2) x d, where E2 is the energy, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the energy have, and roughly how large
    is it?
