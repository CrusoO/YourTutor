stem:
  en: The radius of curvature of the convex mirror, R, is 40 cm. Find the focal length,
    with its sign.
options:
- id: a
  en: 40 cm
- id: b
  en: 2000 cm
- id: c
  en: 20 cm
- id: d
  en: -20 cm
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: the focal length is half the radius of curvature: f = R
    / 2, with signs from the convention.'
- en: 'Put each quantity in SI units with its sign: R = 0.4 m.'
- en: 'Get the focal length alone: divide each side of R = 2f by 2.'
- en: 'Substitute: f = 0.4 / 2.'
- en: 'Calculate: f = 0.2 m.'
- en: 'Give it in cm: 20 cm.'
- en: So the focal length is 20 cm.
- en: The correct option is c.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: the focal length is half the radius of curvature: f = R / 2, with
    signs from the convention.'
- level: 2
  en: 'Get the focal length on its own before you put numbers in: divide each side
    of R = 2f by 2. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked. Give each distance
    its sign by the Cartesian convention before you substitute.'
- level: 3
  en: 'First step: Write 40 cm as 0.4 m, then write f = R / 2, where f is the focal
    length, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the focal length have, and roughly how
    large is it?
