stem:
  en: The potential difference across it, V, is 5 V and the current through it, I,
    is 50 mA. Find the resistance of the resistor.
options:
- id: a
  en: 100 Ω
- id: b
  en: 0.1 Ω
- id: c
  en: 0.25 Ω
- id: d
  en: 0.01 Ω
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: V = I x R.'
- en: 'Put each quantity in SI units: 50 mA = 0.05 A.'
- en: 'Get the resistance alone: divide each side of V = I x R by I.'
- en: 'Substitute: R = 5 / 0.05.'
- en: 'Calculate: R = 100 Ω.'
- en: So the resistance is 100 Ω.
- en: The correct option is a.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: V = I x R.'
- level: 2
  en: 'Get the resistance on its own before you put numbers in: divide each side of
    V = I x R by I. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 50 mA as 0.05 A, then write R = V / I, where R is the resistance,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the resistance have, and roughly how
    large is it?
