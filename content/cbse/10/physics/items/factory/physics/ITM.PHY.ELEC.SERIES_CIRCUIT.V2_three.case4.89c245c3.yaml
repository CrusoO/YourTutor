stem:
  en: 'Case: a student investigates a battery connected to resistors in series and
    records the following. The battery gives 12 V, the first resistor, R1, is 10 Ω,
    the second resistor, R2, is 20 Ω and the third resistor, R3, is 30 Ω. Find the
    potential difference across the second resistor.'
options:
- id: a
  en: 4 V
- id: b
  en: 2 V
- id: c
  en: 10 V
- id: d
  en: 12 V
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: find the current from the whole circuit, then use V = I
    x R on one resistor.'
- en: 'Substitute: V2 = 12 x 20 / (10 + 20 + 30).'
- en: 'Calculate: V2 = 4 V.'
- en: So the potential difference across the second resistor is 4 V.
- en: The correct option is a.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: find the current from the whole circuit, then use V = I x R on
    one resistor.'
- level: 2
  en: The relation already gives the potential difference across the second resistor
    directly, so decide what to substitute.
- level: 3
  en: 'First step: write V2 = V x R2 / (R1 + R2 + R3), where V2 is the potential difference
    across the second resistor, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference across the second
    resistor have, and roughly how large is it?
