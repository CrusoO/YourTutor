solution_steps:
- en: 'Write the relation: find the current from the whole circuit, then use V = I
    x R on one resistor.'
- en: 'Substitute: V2 = 5 x 6 / (4 + 6).'
- en: 'Calculate: V2 = 3 V.'
- en: So the potential difference across the second resistor is 3 V.
- en: The correct option is b.
