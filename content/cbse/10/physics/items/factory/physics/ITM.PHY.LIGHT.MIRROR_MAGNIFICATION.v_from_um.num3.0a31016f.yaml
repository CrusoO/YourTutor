solution_steps:
- en: 'Write the relation: magnification of a mirror m = -v / u.'
- en: 'Put each quantity in SI units with its sign: u = -0.15 m.'
- en: 'Get the image distance alone: multiply each side of m = -v / u by u, then change
    the sign of each side.'
- en: 'Substitute: v = -0.4 x (-0.15).'
- en: 'Calculate: v = 0.06 m.'
- en: 'Give it in cm: 6 cm.'
- en: So the image distance is 6 cm.
- en: The correct option is b.
