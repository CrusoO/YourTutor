stem:
  en: The first resistor, R1, is 2 Ω, the second resistor, R2, is 3 Ω and the third
    resistor, R3, is 5 Ω. Find the total resistance.
options:
- id: a
  en: 0.968 Ω
- id: b
  en: 1.03 Ω
- id: c
  en: 30 Ω
- id: d
  en: 10 Ω
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: in series the resistances add: Rs = R1 + R2 + R3.'
- en: 'Substitute: Rs = 2 + 3 + 5.'
- en: 'Calculate: Rs = 10 Ω.'
- en: So the total resistance is 10 Ω.
- en: The correct option is d.
