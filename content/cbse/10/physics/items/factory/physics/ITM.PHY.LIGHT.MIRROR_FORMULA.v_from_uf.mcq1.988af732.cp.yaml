stem:
  en: The object, u, is 60 cm from the concave mirror and the focal length of the
    concave mirror, f, is 30 cm. Using the Cartesian sign convention, find the image
    distance v.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: mirror formula 1/v + 1/u = 1/f, with u and f signed by the convention.'
- level: 2
  en: 'Get the image distance on its own before you put numbers in: subtract 1/u from
    each side of 1/v + 1/u = 1/f, then take the reciprocal of each side. Do the same
    operation to each side of the formula. Change every quantity to SI units first,
    and change back at the end if asked. Give each distance its sign by the Cartesian
    convention before you substitute.'
- level: 3
  en: 'First step: Write 60 cm as -0.6 m and 30 cm as -0.3 m, then write v = u x f
    / (u - f), where v is the image distance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the image distance have, and roughly
    how large is it?
