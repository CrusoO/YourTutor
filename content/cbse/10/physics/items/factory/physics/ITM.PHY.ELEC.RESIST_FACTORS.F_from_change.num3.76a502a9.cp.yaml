stem:
  en: A student is studying how a wire's resistance changes. The diameter of a uniform
    wire is doubled; its length and material stay the same. By what number is the
    resistance multiplied?
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Plan the steps: R
    is proportional to length and inversely proportional to area, so the new resistance
    divided by the old one equals the length factor divided by the area factor.'
- level: 2
  en: Work through the plan one step at a time.
- level: 3
  en: 'First step: write down the number each quantity is multiplied by, using 2 for
    doubled and 1/2 for halved, then combine them using the relation.'
