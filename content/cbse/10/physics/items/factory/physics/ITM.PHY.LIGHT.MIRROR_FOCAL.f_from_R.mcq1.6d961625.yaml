stem:
  en: The radius of curvature of the concave mirror, R, is 24 cm. Find the focal length,
    with its sign.
options:
- id: a
  en: -24 cm
- id: b
  en: -1200 cm
- id: c
  en: -12 cm
- id: d
  en: 12 cm
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: the focal length is half the radius of curvature: f = R
    / 2, with signs from the convention.'
- en: 'Put each quantity in SI units with its sign: R = -0.24 m.'
- en: 'Get the focal length alone: divide each side of R = 2f by 2.'
- en: 'Substitute: f = (-0.24) / 2.'
- en: 'Calculate: f = -0.12 m.'
- en: 'Give it in cm: -12 cm.'
- en: So the focal length is -12 cm.
- en: The correct option is c.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: the focal length is half the radius of curvature: f = R / 2,
    with signs from the convention.'
- level: 2
  en: 'Get the focal length on its own before you put numbers in: divide each side
    of R = 2f by 2. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked. Give each distance
    its sign by the Cartesian convention before you substitute.'
- level: 3
  en: 'First step: Write 24 cm as -0.24 m, then write f = R / 2, where f is the focal
    length, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the focal length have, and roughly how
    large is it?
