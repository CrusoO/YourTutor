stem:
  en: This question is about electrons passing a point in a wire. The current, I,
    is 0.4 A, the time, t, is 5 s and the charge of one electron is 1.6 x 10^-19 C.
    How many electrons pass a point of the wire in this time?
options:
- id: a
  en: 1.25 x 10^19
- id: b
  en: '2'
- id: c
  en: 1.25 x 10^20
- id: d
  en: 3.2 x 10^-19
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: charge Q = I x t, and Q = N x e, so N = I x t / e.'
- en: 'Get the number of electrons alone: divide each side of Q = N x e by e.'
- en: 'Substitute: N = 0.4 x 5 / (1.6 x 10^-19).'
- en: 'Calculate: N = 1.25 x 10^19.'
- en: So the number of electrons is 1.25 x 10^19.
- en: The correct option is a.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: charge Q = I x t, and Q = N x e, so N = I x t / e.'
- level: 2
  en: 'Get the number of electrons on its own before you put numbers in: divide each
    side of Q = N x e by e. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write N = I x t / e, where N is the number of electrons, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the number of electrons be?
