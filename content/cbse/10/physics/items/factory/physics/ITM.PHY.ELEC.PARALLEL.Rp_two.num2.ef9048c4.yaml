stem:
  en: This question is about resistors joined in parallel. The first resistor, R1,
    is 60 Ω and the second resistor, R2, is 20 Ω. Find the combined resistance.
options:
- id: a
  en: 15 Ω
- id: b
  en: 80 Ω
- id: c
  en: 0.0667 Ω
- id: d
  en: 40 Ω
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: in parallel the reciprocals add: 1/Rp = 1/R1 + 1/R2.'
- en: 'Substitute: Rp = 60 x 20 / (60 + 20).'
- en: 'Calculate: Rp = 15 Ω.'
- en: So the total resistance is 15 Ω.
- en: The correct option is a.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: in parallel the reciprocals add: 1/Rp = 1/R1 + 1/R2.'
- level: 2
  en: The relation already gives the total resistance directly, so decide what to
    substitute.
- level: 3
  en: 'First step: write Rp = R1 x R2 / (R1 + R2), where Rp is the total resistance,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the total resistance have, and roughly
    how large is it?
