stem:
  en: 'Case: a student investigates a resistor in series with two resistors in parallel
    and records the following. The battery gives 15 V, the resistor in series with
    the pair, R1, is 6 Ω, one resistor of the parallel pair, R2, is 20 Ω and the other
    resistor of the pair, R3, is 5 Ω. Find the current in the first resistor of the
    pair.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Plan the steps: find
    the voltage across the pair, then divide by the resistor of interest.'
- level: 2
  en: Work through the plan one step at a time.
- level: 3
  en: 'First step: write I2 = V x R3 / (R1 x (R2 + R3) + R2 x R3), where I2 is the
    current in the first parallel resistor, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current in the first parallel resistor
    have, and roughly how large is it?
