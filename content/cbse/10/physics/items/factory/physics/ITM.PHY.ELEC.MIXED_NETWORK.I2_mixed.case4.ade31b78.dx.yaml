solution_steps:
- en: 'Plan: find the voltage across the pair, then divide by the resistor of interest.'
- en: 'Substitute: I2 = 15 x 5 / (6 x (20 + 5) + 20 x 5).'
- en: 'Calculate: I2 = 0.3 A.'
- en: So the current in the first parallel resistor is 0.3 A.
