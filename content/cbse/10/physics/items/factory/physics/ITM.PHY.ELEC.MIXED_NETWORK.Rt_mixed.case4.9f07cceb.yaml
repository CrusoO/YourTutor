solution_steps:
- en: 'Write the relation: combine the parallel pair first (1/Rp = 1/R2 + 1/R3), then
    add the series resistor.'
- en: 'Substitute: Rt = 2 + 6 x 3 / (6 + 3).'
- en: 'Calculate: Rt = 4 Ω.'
- en: So the total resistance is 4 Ω.
- en: The correct option is d.
