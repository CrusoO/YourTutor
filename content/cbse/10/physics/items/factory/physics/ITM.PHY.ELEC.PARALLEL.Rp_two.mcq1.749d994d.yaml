solution_steps:
- en: 'Write the relation: in parallel the reciprocals add: 1/Rp = 1/R1 + 1/R2.'
- en: 'Substitute: Rp = 12 x 4 / (12 + 4).'
- en: 'Calculate: Rp = 3 Ω.'
- en: So the total resistance is 3 Ω.
