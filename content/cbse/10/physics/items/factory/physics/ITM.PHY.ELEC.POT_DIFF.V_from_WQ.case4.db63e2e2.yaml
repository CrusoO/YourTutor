stem:
  en: 'Case: a student investigates work done in moving charge and records the following.
    The work done, W, is 15 J and the charge moved, Q, is 10 C. Find the potential
    difference.'
options:
- id: a
  en: 150 V
- id: b
  en: 1.5 V
- id: c
  en: 0.667 V
- id: d
  en: 25 V
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: potential difference V = work done W / charge Q.'
- en: 'Substitute: V = 15 / 10.'
- en: 'Calculate: V = 1.5 V.'
- en: So the potential difference is 1.5 V.
- en: The correct option is b.
hints:
