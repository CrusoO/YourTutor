stem:
  en: A student is studying work done in moving charge. The work done, W, is 6 J and
    the potential difference, V, is 3 V. How much charge is moved?
options:
- id: a
  en: 9 C
- id: b
  en: 18 C
- id: c
  en: 0.5 C
- id: d
  en: 2 C
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: V = W / Q, so Q = W / V.'
- en: 'Get the charge alone: multiply each side of V = W / Q by Q, then divide each
    side by V.'
- en: 'Substitute: Q = 6 / 3.'
- en: 'Calculate: Q = 2 C.'
- en: So the charge is 2 C.
- en: The correct option is d.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: V = W / Q, so Q = W / V.'
- level: 2
  en: 'Get the charge on its own before you put numbers in: multiply each side of
    V = W / Q by Q, then divide each side by V. Do the same operation to each side
    of the formula.'
- level: 3
  en: 'First step: write Q = W / V, where Q is the charge, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the charge have, and roughly how large
    is it?
