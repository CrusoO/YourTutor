stem:
  en: 'Case: a student investigates two thin lenses in contact and records the following.
    The first lens is a convex lens with power of magnitude 1 D and the second lens
    is a concave lens with power of magnitude 5 D. Find the focal length of the combination
    in cm, with its sign.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: the powers add, then f = 1 / P, in metres.'
- level: 2
  en: 'Get the combined focal length on its own before you put numbers in: add the
    powers, then take the reciprocal of each side of P = 1 / f. Do the same operation
    to each side of the formula. Change every quantity to SI units first, and change
    back at the end if asked. Give each distance its sign by the Cartesian convention
    before you substitute.'
- level: 3
  en: 'First step: write f = 1 / (P1 + P2), where f is the combined focal length,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the combined focal length have, and roughly
    how large is it?
