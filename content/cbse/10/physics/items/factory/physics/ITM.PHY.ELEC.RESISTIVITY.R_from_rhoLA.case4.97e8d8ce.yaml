stem:
  en: 'Case: a student investigates a uniform wire and records the following. The
    resistivity of its material, rho, is 5 x 10^-7 Ω m, its length, L, is 5 m and
    its cross-section area, A, is 2 mm². Find the resistance of the wire.'
options:
- id: a
  en: 2 x 10^-13 Ω
- id: b
  en: 5 x 10^-12 Ω
- id: c
  en: 1.25 Ω
- id: d
  en: 1.25 x 10^-6 Ω
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: R = resistivity x length / area.'
- en: 'Put each quantity in SI units: 2 mm² = 2 x 10^-6 m².'
- en: 'Substitute: R = (5 x 10^-7) x 5 / (2 x 10^-6).'
- en: 'Calculate: R = 1.25 Ω.'
- en: So the resistance is 1.25 Ω.
- en: The correct option is c.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: R = resistivity x length / area.'
- level: 2
  en: The relation already gives the resistance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 2 mm² as 2 x 10^-6 m², then write R = rho x L / A, where
    R is the resistance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the resistance have, and roughly how
    large is it?
