stem:
  en: The charge, Q, is 0.1 C and the current, I, is 50 mA. For how long does the
    current flow?
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: charge Q = current I x time t.'
- level: 2
