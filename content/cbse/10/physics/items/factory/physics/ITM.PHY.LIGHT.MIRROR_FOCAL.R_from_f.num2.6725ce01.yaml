solution_steps:
- en: 'Write the relation: the radius of curvature is twice the focal length: R =
    2f, with signs from the convention.'
- en: 'Put each quantity in SI units with its sign: f = 0.05 m.'
- en: 'Substitute: R = 2 x 0.05.'
- en: 'Calculate: R = 0.1 m.'
- en: 'Give it in cm: 10 cm.'
- en: So the radius of curvature is 10 cm.
- en: The correct option is b.
