stem:
  en: A student is studying work done in moving charge. The work done, W, is 7.5 J
    and the charge moved, Q, is 5 C. Find the potential difference.
options:
- id: a
  en: 1.5 V
- id: b
  en: 12.5 V
- id: c
  en: 0.667 V
- id: d
  en: 37.5 V
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: potential difference V = work done W / charge Q.'
- en: 'Substitute: V = 7.5 / 5.'
- en: 'Calculate: V = 1.5 V.'
- en: So the potential difference is 1.5 V.
- en: The correct option is a.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: potential difference V = work done W / charge Q.'
- level: 2
  en: The relation already gives the potential difference directly, so decide what
    to substitute.
- level: 3
  en: 'First step: write V = W / Q, where V is the potential difference, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference have, and roughly
    how large is it?
