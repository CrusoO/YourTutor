solution_steps:
- en: 'Write the relation: find v from the mirror formula, then m = -v / u; a negative
    v is a real image in front of the mirror, a negative m is inverted, |m| above
    1 is magnified.'
- en: 'Put each quantity in SI units with its sign: u = -0.6 m; f = -0.1 m.'
- en: 'Substitute: v = (-0.6) x (-0.1) / ((-0.6) - (-0.1)).'
- en: 'Calculate: v = -0.12 m.'
- en: 'Give it in cm: -12 cm.'
- en: 'Read the sign of v and of m = -v / u: the image is real, inverted, diminished.'
- en: So the image is real, inverted, diminished.
- en: The correct option is a.
