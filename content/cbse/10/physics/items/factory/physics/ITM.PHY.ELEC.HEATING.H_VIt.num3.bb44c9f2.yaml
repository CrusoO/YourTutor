stem:
  en: A student is studying the heat produced by a current. The voltage, V, is 250
    V, the current, I, is 5 A and the time, t, is 2 min. How much heat is produced?
options:
- id: a
  en: 150000 J
- id: b
  en: 2500 J
- id: c
  en: 1250 J
- id: d
  en: 6000 J
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: heat H = V x I x t.'
- en: 'Put each quantity in SI units: 2 min = 120 s.'
- en: 'Substitute: H = 250 x 5 x 120.'
- en: 'Calculate: H = 150000 J.'
- en: So the heat produced is 150000 J.
- en: The correct option is a.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: heat H = V x I x t.'
- level: 2
  en: The relation already gives the heat produced directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 2 min as 120 s, then write H = V x I x t, where H is the
    heat produced, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the heat produced have, and roughly how
    large is it?
