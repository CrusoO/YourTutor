solution_steps:
- en: 'Write the relation: R = resistivity x length / area.'
- en: 'Put each quantity in SI units: 20 cm = 0.2 m; 2 mm² = 2 x 10^-6 m².'
- en: 'Substitute: R = (1 x 10^-6) x 0.2 / (2 x 10^-6).'
- en: 'Calculate: R = 0.1 Ω.'
- en: So the resistance is 0.1 Ω.
