role: apply
stem:
  en: A student is studying a resistor in series with two resistors in parallel. The
    resistor in series with the pair, R1, is 6 Ω, one resistor of the parallel pair,
    R2, is 30 Ω and the other resistor of the pair, R3, is 20 Ω. Find the total resistance
    of the network.
options:
- id: a
  en: 4 Ω
- id: b
  en: 56 Ω
- id: c
  en: 18 Ω
- id: d
  en: 6.08 Ω
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: combine the parallel pair first (1/Rp = 1/R2 + 1/R3), then
    add the series resistor.'
- en: 'Substitute: Rt = 6 + 30 x 20 / (30 + 20).'
- en: 'Calculate: Rt = 18 Ω.'
- en: So the total resistance is 18 Ω.
- en: The correct option is c.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: combine the parallel pair first (1/Rp = 1/R2 + 1/R3), then add
    the series resistor.'
- level: 2
  en: The relation already gives the total resistance directly, so decide what to
    substitute.
- level: 3
  en: 'First step: write Rt = R1 + R2 x R3 / (R2 + R3), where Rt is the total resistance,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the total resistance have, and roughly
    how large is it?
