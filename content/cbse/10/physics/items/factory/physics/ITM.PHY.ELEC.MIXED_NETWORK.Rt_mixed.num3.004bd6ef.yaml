solution_steps:
- en: 'Write the relation: combine the parallel pair first (1/Rp = 1/R2 + 1/R3), then
    add the series resistor.'
- en: 'Substitute: Rt = 6 + 30 x 20 / (30 + 20).'
- en: 'Calculate: Rt = 18 Ω.'
- en: So the total resistance is 18 Ω.
- en: The correct option is c.
