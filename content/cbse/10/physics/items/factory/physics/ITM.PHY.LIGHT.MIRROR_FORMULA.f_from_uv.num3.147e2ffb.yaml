stem:
  en: A student is studying image formation by a spherical mirror. The object, u,
    is 60 cm from the concave mirror and the image, which is real, is 20 cm from the
    concave mirror. Using the Cartesian sign convention, find the focal length f.
options:
- id: a
  en: -667 cm
- id: b
  en: 15 cm
- id: c
  en: -30 cm
- id: d
  en: -15 cm
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: mirror formula 1/v + 1/u = 1/f, with u and v signed by
    the convention.'
- en: 'Put each quantity in SI units with its sign: u = -0.6 m; v = -0.2 m.'
- en: 'Get the focal length alone: add 1/v and 1/u, then take the reciprocal of each
    side of 1/f = 1/v + 1/u.'
- en: 'Substitute: f = (-0.6) x (-0.2) / ((-0.6) + (-0.2)).'
- en: 'Calculate: f = -0.15 m.'
- en: 'Give it in cm: -15 cm.'
- en: So the focal length is -15 cm.
- en: The correct option is d.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: mirror formula 1/v + 1/u = 1/f, with u and v signed by the convention.'
- level: 2
  en: 'Get the focal length on its own before you put numbers in: add 1/v and 1/u,
    then take the reciprocal of each side of 1/f = 1/v + 1/u. Do the same operation
    to each side of the formula. Change every quantity to SI units first, and change
    back at the end if asked. Give each distance its sign by the Cartesian convention
    before you substitute.'
- level: 3
  en: 'First step: Write 60 cm as -0.6 m and 20 cm as -0.2 m, then write f = u x v
    / (u + v), where f is the focal length, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the focal length have, and roughly how
    large is it?
