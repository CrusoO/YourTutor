solution_steps:
- en: 'Write the relation: magnification of a mirror m = -v / u.'
- en: 'Put each quantity in SI units with its sign: u = -0.3 m.'
- en: 'Get the image distance alone: multiply each side of m = -v / u by u, then change
    the sign of each side.'
- en: 'Substitute: v = -0.5 x (-0.3).'
- en: 'Calculate: v = 0.15 m.'
- en: 'Give it in cm: 15 cm.'
- en: So the image distance is 15 cm.
- en: The correct option is d.
