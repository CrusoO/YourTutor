solution_steps:
- en: 'Write the relation: R = resistivity x length / area.'
- en: 'Put each quantity in SI units: 0.25 mm² = 2.5 x 10^-7 m².'
- en: 'Substitute: R = (1 x 10^-6) x 2 / (2.5 x 10^-7).'
- en: 'Calculate: R = 8 Ω.'
- en: So the resistance is 8 Ω.
- en: The correct option is d.
