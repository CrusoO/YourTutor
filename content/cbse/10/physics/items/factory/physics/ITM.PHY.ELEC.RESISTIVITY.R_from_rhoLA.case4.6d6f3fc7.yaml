stem:
  en: 'Case: a student investigates a uniform wire and records the following. The
    resistivity of its material, rho, is 1 x 10^-6 Ω m, its length, L, is 2 m and
    its cross-section area, A, is 0.25 mm². Find the resistance of the wire.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: R = resistivity x length / area.'
- level: 2
  en: The relation already gives the resistance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 0.25 mm² as 2.5 x 10^-7 m², then write R = rho x L / A, where
    R is the resistance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the resistance have, and roughly how
    large is it?
