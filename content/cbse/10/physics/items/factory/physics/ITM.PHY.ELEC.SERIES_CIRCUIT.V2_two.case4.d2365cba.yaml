solution_steps:
- en: 'Write the relation: find the current from the whole circuit, then use V = I
    x R on one resistor.'
- en: 'Substitute: V2 = 12.5 x 15 / (10 + 15).'
- en: 'Calculate: V2 = 7.5 V.'
- en: So the potential difference across the second resistor is 7.5 V.
- en: The correct option is c.
