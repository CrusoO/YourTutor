stem:
  en: 'Case: a student investigates the electrical energy an appliance uses and records
    the following. The power rating of the first appliance, P1, is 1000 W, the time
    it is used each day, t1, is 2 h, the power rating of the second appliance, P2,
    is 40 W, the time the second one is used each day, t2, is 2 h and the number of
    days, d, is 10. How much electrical energy is used in all, in kWh?'
options:
- id: a
  en: 2.08 kWh
- id: b
  en: 20.8 kWh
- id: c
  en: 10.4 kWh
- id: d
  en: 20 kWh
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Plan: add the energy of each appliance for one day, power times time, then
    multiply by the days.'
- en: 'Substitute: E2 = (1000 x 7200 + 40 x 7200) x 10.'
- en: 'Calculate: E2 = 7.488 x 10^7 J.'
- en: 'Give it in kWh: 20.8 kWh.'
- en: So the energy is 20.8 kWh.
- en: The correct option is b.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Plan the steps: add
    the energy of each appliance for one day, power times time, then multiply by the
    days.'
- level: 2
  en: Work through the plan one step at a time. Change every quantity to SI units
    first, and change back at the end if asked.
- level: 3
  en: 'First step: write E2 = (P1 x t1 + P2 x t2) x d, where E2 is the energy, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the energy have, and roughly how large
    is it?
