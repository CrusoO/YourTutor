solution_steps:
- en: 'Write the relation: R = resistivity x length / area.'
- en: 'Put each quantity in SI units: 2 cm = 0.02 m; 1 mm² = 1 x 10^-6 m².'
- en: 'Substitute: R = (1 x 10^-7) x 0.02 / (1 x 10^-6).'
- en: 'Calculate: R = 0.002 Ω.'
- en: So the resistance is 0.002 Ω.
- en: The correct option is a.
