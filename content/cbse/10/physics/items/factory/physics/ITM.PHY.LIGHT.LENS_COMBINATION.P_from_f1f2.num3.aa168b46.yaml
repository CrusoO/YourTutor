stem:
  en: A student is studying two thin lenses in contact. The first lens is a concave
    lens with focal length of magnitude 100 cm and the second lens is a concave lens
    with focal length of magnitude 50 cm. Find the power of the combination in dioptres,
    with its sign.
options:
- id: a
  en: 3 D
- id: b
  en: -0.667 D
- id: c
  en: 2 D
- id: d
  en: -3 D
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: for thin lenses in contact the powers add: P = 1/f1 + 1/f2
    (f in metres, with signs).'
- en: 'Put each quantity in SI units with its sign: f1 = -1 m; f2 = -0.5 m.'
- en: 'Substitute: P = 1 / (-1) + 1 / (-0.5).'
- en: 'Calculate: P = -3 D.'
- en: So the combined power is -3 D.
- en: The correct option is d.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: for thin lenses in contact the powers add: P = 1/f1 + 1/f2 (f in metres,
    with signs).'
- level: 2
  en: The relation already gives the combined power directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
    Give each distance its sign by the Cartesian convention before you substitute.
- level: 3
  en: 'First step: Write 100 cm as -1 m and 50 cm as -0.5 m, then write P = 1 / f1
    + 1 / f2, where P is the combined power, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the combined power have, and roughly
    how large is it?
