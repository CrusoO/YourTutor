stem:
  en: 'Case: a student investigates resistors joined in series and records the following.
    The first resistor, R1, is 10 Ω, the second resistor, R2, is 20 Ω and the total
    resistance, Rs, is 60 Ω. Find the third resistance.'
options:
- id: a
  en: 2 Ω
- id: b
  en: 90 Ω
- id: c
  en: 30 Ω
- id: d
  en: 12000 Ω
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: in series Rs = R1 + R2 + R3.'
- en: 'Get the third resistance alone: subtract R1 and R2 from each side of Rs = R1
    + R2 + R3.'
- en: 'Substitute: R3 = 60 - 10 - 20.'
- en: 'Calculate: R3 = 30 Ω.'
- en: So the third resistance is 30 Ω.
- en: The correct option is c.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: in series Rs = R1 + R2 + R3.'
- level: 2
  en: 'Get the third resistance on its own before you put numbers in: subtract R1
    and R2 from each side of Rs = R1 + R2 + R3. Do the same operation to each side
    of the formula.'
- level: 3
  en: 'First step: write R3 = Rs - R1 - R2, where R3 is the third resistance, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the third resistance have, and roughly
    how large is it?
