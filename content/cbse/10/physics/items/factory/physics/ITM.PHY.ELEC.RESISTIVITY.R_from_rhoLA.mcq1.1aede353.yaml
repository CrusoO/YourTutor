pool: practice
role: procedure
stem:
  en: The resistivity of its material, rho, is 1 x 10^-7 Ω m, its length, L, is 5
    cm and its cross-section area, A, is 0.5 mm². Find the resistance of the wire.
options:
- id: a
  en: 2.5 x 10^-15 Ω
- id: b
  en: 0.01 Ω
- id: c
  en: 1 x 10^-8 Ω
- id: d
  en: 1 x 10^-12 Ω
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: R = resistivity x length / area.'
- en: 'Put each quantity in SI units: 5 cm = 0.05 m; 0.5 mm² = 5 x 10^-7 m².'
- en: 'Substitute: R = (1 x 10^-7) x 0.05 / (5 x 10^-7).'
- en: 'Calculate: R = 0.01 Ω.'
- en: So the resistance is 0.01 Ω.
- en: The correct option is b.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: R = resistivity x length / area.'
- level: 2
  en: The relation already gives the resistance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 5 cm as 0.05 m and 0.5 mm² as 5 x 10^-7 m², then write R
    = rho x L / A, where R is the resistance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the resistance have, and roughly how
    large is it?
