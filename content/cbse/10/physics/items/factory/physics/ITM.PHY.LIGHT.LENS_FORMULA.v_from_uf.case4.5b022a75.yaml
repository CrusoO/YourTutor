stem:
  en: 'Case: a student investigates image formation by a thin lens and records the
    following. The object, u, is 15 cm from the convex lens and the focal length of
    the convex lens, f, is 10 cm. Using the Cartesian sign convention, find the image
    distance v.'
options:
- id: a
  en: 6 cm
- id: b
  en: 333 cm
- id: c
  en: -6 cm
- id: d
  en: 30 cm
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: lens formula 1/v - 1/u = 1/f, with u and f signed by the
    convention.'
- en: 'Put each quantity in SI units with its sign: u = -0.15 m; f = 0.1 m.'
- en: 'Get the image distance alone: add 1/u to each side of 1/v - 1/u = 1/f, then
    take the reciprocal of each side.'
- en: 'Substitute: v = (-0.15) x 0.1 / ((-0.15) + 0.1).'
- en: 'Calculate: v = 0.3 m.'
- en: 'Give it in cm: 30 cm.'
- en: So the image distance is 30 cm.
- en: The correct option is d.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: lens formula 1/v - 1/u = 1/f, with u and f signed by the convention.'
- level: 2
  en: 'Get the image distance on its own before you put numbers in: add 1/u to each
    side of 1/v - 1/u = 1/f, then take the reciprocal of each side. Do the same operation
    to each side of the formula. Change every quantity to SI units first, and change
    back at the end if asked. Give each distance its sign by the Cartesian convention
    before you substitute.'
- level: 3
  en: 'First step: Write 15 cm as -0.15 m and 10 cm as 0.1 m, then write v = u x f
    / (u + f), where v is the image distance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the image distance have, and roughly
    how large is it?
