stem:
  en: The first resistor, R1, is 6 Ω and the total resistance, Rs, is 9 Ω. Find the
    second resistance.
options:
- id: a
  en: 3 Ω
- id: b
  en: 1.5 Ω
- id: c
  en: 54 Ω
- id: d
  en: 15 Ω
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: in series Rs = R1 + R2.'
- en: 'Get the second resistance alone: subtract R1 from each side of Rs = R1 + R2.'
- en: 'Substitute: R2 = 9 - 6.'
- en: 'Calculate: R2 = 3 Ω.'
- en: So the second resistance is 3 Ω.
- en: The correct option is a.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: in series Rs = R1 + R2.'
- level: 2
  en: 'Get the second resistance on its own before you put numbers in: subtract R1
    from each side of Rs = R1 + R2. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write R2 = Rs - R1, where R2 is the second resistance, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the second resistance have, and roughly
    how large is it?
