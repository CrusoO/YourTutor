solution_steps:
- en: 'Write the relation: lens formula 1/v - 1/u = 1/f, with u and v signed by the
    convention.'
- en: 'Put each quantity in SI units with its sign: u = -0.15 m; v = 0.3 m.'
- en: 'Get the focal length alone: subtract 1/u from 1/v, then take the reciprocal
    of each side of 1/f = 1/v - 1/u.'
- en: 'Substitute: f = (-0.15) x 0.3 / ((-0.15) - 0.3).'
- en: 'Calculate: f = 0.1 m.'
- en: 'Give it in cm: 10 cm.'
- en: So the focal length is 10 cm.
- en: The correct option is a.
