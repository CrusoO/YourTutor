    that links them: in series the resistances add: Rs = R1 + R2.'
- level: 2
  en: The relation already gives the total resistance directly, so decide what to
    substitute.
- level: 3
  en: 'First step: write Rs = R1 + R2, where Rs is the total resistance, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the total resistance have, and roughly
    how large is it?
