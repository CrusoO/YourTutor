stem:
  en: This question is about resistors joined in series. The first resistor, R1, is
    2 Ω and the second resistor, R2, is 4 Ω. Find the total resistance.
options:
- id: a
  en: 0.75 Ω
- id: b
  en: 1.33 Ω
- id: c
  en: 8 Ω
- id: d
  en: 6 Ω
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: in series the resistances add: Rs = R1 + R2.'
- en: 'Substitute: Rs = 2 + 4.'
- en: 'Calculate: Rs = 6 Ω.'
- en: So the total resistance is 6 Ω.
- en: The correct option is d.
