id: ITM.PHY.ELEC.POWER.I_from_PV.num3.b5413e44
skill_ids:
- PHY.ELEC.POWER
difficulty: 0.6
type: mcq
pool: practice
role: apply
stem:
  en: A student is studying an electrical appliance. Its power, P, is 250 W and the
    voltage across it, V, is 50 V. Find the current drawn.
options:
- id: a
  en: 0.2 A
- id: b
  en: 5 A
- id: c
  en: 12500 A
- id: d
  en: 0.1 A
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: P = V x I.'
- en: 'Get the current alone: divide each side of P = V x I by V.'
- en: 'Substitute: I = 250 / 50.'
- en: 'Calculate: I = 5 A.'
- en: So the current is 5 A.
- en: The correct option is b.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: P = V x I.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of P
    = V x I by V. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write I = P / V, where I is the current, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
