solution_steps:
- en: 'Write the relation: charge Q = current I x time t.'
- en: 'Put each quantity in SI units: 5 mA = 0.005 A.'
- en: 'Get the time alone: divide each side of Q = I x t by I.'
- en: 'Substitute: t = 0.15 / 0.005.'
- en: 'Calculate: t = 30 s.'
- en: So the time is 30 s.
