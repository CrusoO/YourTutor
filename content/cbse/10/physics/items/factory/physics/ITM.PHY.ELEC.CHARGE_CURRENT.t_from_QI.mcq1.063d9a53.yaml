stem:
  en: The charge, Q, is 0.15 C and the current, I, is 5 mA. For how long does the
    current flow?
options:
- id: a
  en: 7.5 x 10^-4 s
- id: b
  en: 0.0333 s
- id: c
  en: 0.03 s
- id: d
  en: 30 s
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: charge Q = current I x time t.'
- en: 'Put each quantity in SI units: 5 mA = 0.005 A.'
- en: 'Get the time alone: divide each side of Q = I x t by I.'
- en: 'Substitute: t = 0.15 / 0.005.'
- en: 'Calculate: t = 30 s.'
- en: So the time is 30 s.
- en: The correct option is d.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: charge Q = current I x time t.'
- level: 2
  en: 'Get the time on its own before you put numbers in: divide each side of Q =
    I x t by I. Do the same operation to each side of the formula. Change every quantity
    to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 5 mA as 0.005 A, then write t = Q / I, where t is the time,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the time have, and roughly how large
    is it?
