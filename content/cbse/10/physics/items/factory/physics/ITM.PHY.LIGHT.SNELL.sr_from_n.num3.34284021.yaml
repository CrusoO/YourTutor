stem:
  en: A student is studying light entering a transparent medium from air. The refractive
    index of the medium, n, is 2 and the sine of the angle of incidence is 0.9. Find
    the sine of the angle of refraction.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: from air into a medium, sin i = n x sin r.'
- level: 2
  en: 'Get the sine of the angle of refraction on its own before you put numbers in:
    divide each side of sin i = n x sin r by n. Do the same operation to each side
    of the formula.'
- level: 3
  en: 'First step: write sr = si / n, where sr is the sine of the angle of refraction,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the sine of the angle of refraction
    be?
