solution_steps:
- en: 'Write the relation: find the current from the whole circuit, then use V = I
    x R on one resistor.'
- en: 'Substitute: V2 = 30 x 10 / (5 + 10).'
- en: 'Calculate: V2 = 20 V.'
- en: So the potential difference across the second resistor is 20 V.
- en: The correct option is b.
