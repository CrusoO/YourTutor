stem:
  en: 'Case: a student investigates a battery connected to resistors in series and
    records the following. The battery gives 30 V, the first resistor, R1, is 5 Ω
    and the second resistor, R2, is 10 Ω. Find the potential difference across the
    second resistor.'
options:
- id: a
  en: 10 V
- id: b
  en: 20 V
- id: c
  en: 30 V
- id: d
  en: 15 V
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: find the current from the whole circuit, then use V = I
    x R on one resistor.'
- en: 'Substitute: V2 = 30 x 10 / (5 + 10).'
- en: 'Calculate: V2 = 20 V.'
- en: So the potential difference across the second resistor is 20 V.
- en: The correct option is b.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: find the current from the whole circuit, then use V = I x R on
    one resistor.'
- level: 2
  en: The relation already gives the potential difference across the second resistor
    directly, so decide what to substitute.
- level: 3
  en: 'First step: write V2 = V x R2 / (R1 + R2), where V2 is the potential difference
    across the second resistor, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference across the second
    resistor have, and roughly how large is it?
