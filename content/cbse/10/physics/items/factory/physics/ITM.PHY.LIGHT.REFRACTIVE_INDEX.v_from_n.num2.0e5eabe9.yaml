solution_steps:
- en: 'Write the relation: refractive index n = speed of light in vacuum / speed in
    the medium.'
- en: 'Get the speed of light in the medium alone: multiply each side of n = c / v
    by v, then divide each side by n.'
- en: 'Substitute: v = (3 x 10^8) / 1.2.'
- en: 'Calculate: v = 2.5 x 10^8 m/s.'
- en: So the speed of light in the medium is 2.5 x 10^8 m/s.
- en: The correct option is d.
