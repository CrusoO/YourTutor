pool: practice
role: explain
stem:
  en: 'Case: a student investigates the nature of the image from the mirror and lens
    formulas and records the following. The object, u, is 30 cm from the convex lens
    and the focal length of the convex lens, f, is 20 cm. What is the nature of the
    image?'
options:
- id: a
  en: real, inverted, magnified
- id: b
  en: real, erect, magnified
- id: c
  en: virtual, inverted, magnified
- id: d
  en: real, inverted, diminished
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: find v from the lens formula, then m = v / u; a positive
    v is a real image on the far side, a negative m is inverted, |m| above 1 is magnified.'
- en: 'Put each quantity in SI units with its sign: u = -0.3 m; f = 0.2 m.'
- en: 'Substitute: v = (-0.3) x 0.2 / ((-0.3) + 0.2).'
- en: 'Calculate: v = 0.6 m.'
- en: 'Give it in cm: 60 cm.'
- en: 'Read the sign of v and of m = v / u: the image is real, inverted, magnified.'
- en: So the image is real, inverted, magnified.
- en: The correct option is a.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: find v from the lens formula, then m = v / u; a positive v is a real
    image on the far side, a negative m is inverted, |m| above 1 is magnified.'
- level: 2
  en: Work out v first, then m, and only then read what their signs say. Change every
    quantity to SI units first, and change back at the end if asked. Give each distance
    its sign by the Cartesian convention before you substitute.
- level: 3
  en: 'First step: Write 30 cm as -0.3 m and 20 cm as 0.2 m, then write v = u x f
    / (u + f), where v is the image distance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: 'Think first: which quantities does the answer depend on, and does it grow or
    shrink?'
