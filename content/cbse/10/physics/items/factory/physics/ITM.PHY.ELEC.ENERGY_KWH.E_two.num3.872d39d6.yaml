solution_steps:
- en: 'Plan: add the energy of each appliance for one day, power times time, then
    multiply by the days.'
- en: 'Substitute: E2 = (40 x 18000 + 100 x 7200) x 30.'
- en: 'Calculate: E2 = 4.32 x 10^7 J.'
- en: 'Give it in kWh: 12 kWh.'
- en: So the energy is 12 kWh.
- en: The correct option is a.
