stem:
  en: The potential difference across it, V, is 10 V and its resistance, R, is 5 kΩ.
    Find the current through the resistor. A classmate says the answer is 5 x 10^7
    mA. Work it out yourself and choose the correct answer.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: V = I x R.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of V
    = I x R by R. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 5 kΩ as 5000 Ω, then write I = V / R, where I is the current,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
