solution_steps:
- en: 'Write the relation: power P = 1 / f, so f = 1 / P in metres.'
- en: 'Put each quantity in SI units with its sign: P = -2 D.'
- en: 'Get the focal length alone: multiply each side of P = 1 / f by f, then divide
    each side by P.'
- en: 'Substitute: f = 1 / (-2).'
- en: 'Calculate: f = -0.5 m.'
- en: 'Give it in cm: -50 cm.'
- en: So the focal length is -50 cm.
- en: The correct option is b.
