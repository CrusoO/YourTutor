stem:
  en: This question is about a resistor in a circuit. The potential difference across
    it, V, is 200 V and the current through it, I, is 2 A. Find the resistance of
    the resistor.
options:
- id: a
  en: 100 Ω
- id: b
  en: 0.01 Ω
- id: c
  en: 400 Ω
- id: d
  en: 198 Ω
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: V = I x R.'
- en: 'Get the resistance alone: divide each side of V = I x R by I.'
- en: 'Substitute: R = 200 / 2.'
- en: 'Calculate: R = 100 Ω.'
- en: So the resistance is 100 Ω.
- en: The correct option is a.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: V = I x R.'
- level: 2
  en: 'Get the resistance on its own before you put numbers in: divide each side of
    V = I x R by I. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write R = V / I, where R is the resistance, with the values in
    place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the resistance have, and roughly how
    large is it?
