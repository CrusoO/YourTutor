stem:
  en: A student is studying image formation by a thin lens. The image, which is real,
    is 30 cm from the convex lens and the focal length of the convex lens, f, is 10
    cm. Using the Cartesian sign convention, find the object distance u.
options:
- id: a
  en: 7.5 cm
- id: b
  en: -15 cm
- id: c
  en: -7.5 cm
- id: d
  en: 15 cm
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: lens formula 1/v - 1/u = 1/f, with v and f signed by the
    convention.'
- en: 'Put each quantity in SI units with its sign: v = 0.3 m; f = 0.1 m.'
- en: 'Get the object distance alone: subtract 1/f from each side of 1/v - 1/u = 1/f,
    then rearrange for 1/u and take the reciprocal.'
- en: 'Substitute: u = 0.3 x 0.1 / (0.1 - 0.3).'
- en: 'Calculate: u = -0.15 m.'
- en: 'Give it in cm: -15 cm.'
- en: So the object distance is -15 cm.
- en: The correct option is b.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: lens formula 1/v - 1/u = 1/f, with v and f signed by the convention.'
- level: 2
  en: 'Get the object distance on its own before you put numbers in: subtract 1/f
    from each side of 1/v - 1/u = 1/f, then rearrange for 1/u and take the reciprocal.
    Do the same operation to each side of the formula. Change every quantity to SI
    units first, and change back at the end if asked. Give each distance its sign
    by the Cartesian convention before you substitute.'
- level: 3
  en: 'First step: Write 30 cm as 0.3 m and 10 cm as 0.1 m, then write u = v x f /
    (f - v), where u is the object distance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the object distance have, and roughly
    how large is it?
