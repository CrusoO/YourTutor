stem:
  en: 'Case: a student investigates a battery connected to resistors in parallel and
    records the following. The battery gives 30 V, the first resistor, R1, is 6 Ω
    and the second resistor, R2, is 3 Ω. Find the total current drawn from the battery.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: each branch has the full battery voltage: I = V / R for each, and
    the branch currents add.'
- level: 2
  en: The relation already gives the total current directly, so decide what to substitute.
- level: 3
  en: 'First step: write It = V / R1 + V / R2, where It is the total current, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the total current have, and roughly how
    large is it?
