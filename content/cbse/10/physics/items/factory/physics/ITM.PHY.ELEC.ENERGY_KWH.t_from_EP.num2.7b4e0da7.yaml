solution_steps:
- en: 'Write the relation: energy E = power P x time t.'
- en: 'Put each quantity in SI units: 0.32 kWh = 1.152 x 10^6 J.'
- en: 'Get the time alone: divide each side of E = P x t by P.'
- en: 'Substitute: t1 = (1.152 x 10^6) / 40.'
- en: 'Calculate: t1 = 28800 h.'
- en: 'Give it in h: 8 h.'
- en: So the time is 8 h.
- en: The correct option is b.
