stem:
  en: This question is about the electrical energy an appliance uses. The energy used,
    E1, is 0.32 kWh and the power rating of the first appliance, P1, is 40 W. For
    how many hours can it run?
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: energy E = power P x time t.'
- level: 2
  en: 'Get the time on its own before you put numbers in: divide each side of E =
    P x t by P. Do the same operation to each side of the formula. Change every quantity
    to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 0.32 kWh as 1.152 x 10^6 J, then write t1 = E1 / P1, where
    t1 is the time, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the time have, and roughly how large
    is it?
