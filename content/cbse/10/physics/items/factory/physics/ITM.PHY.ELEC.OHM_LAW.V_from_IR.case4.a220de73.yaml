    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 20 mA as 0.02 A and 2 kΩ as 2000 Ω, then write V = I x R,
    where V is the potential difference, with the values in place, one quantity at
    a time.'
