stem:
  en: 'Case: a student investigates a resistor in a circuit and records the following.
    The current through it, I, is 20 mA and its resistance, R, is 2 kΩ. Find the potential
    difference across the resistor.'
options:
- id: a
  en: 40 V
- id: b
  en: 100000 V
- id: c
  en: 2000.02 V
- id: d
  en: 1 x 10^-5 V
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: V = I x R.'
- en: 'Put each quantity in SI units: 20 mA = 0.02 A; 2 kΩ = 2000 Ω.'
- en: 'Substitute: V = 0.02 x 2000.'
- en: 'Calculate: V = 40 V.'
- en: So the potential difference is 40 V.
- en: The correct option is a.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: V = I x R.'
- level: 2
  en: The relation already gives the potential difference directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 20 mA as 0.02 A and 2 kΩ as 2000 Ω, then write V = I x R,
    where V is the potential difference, with the values in place, one quantity at
    a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference have, and roughly
    how large is it?
