stem:
  en: 'Case: a student investigates two thin lenses in contact and records the following.
    The first lens is a concave lens with focal length of magnitude 100 cm and the
    second lens is a convex lens with focal length of magnitude 20 cm. Find the power
    of the combination in dioptres, with its sign.'
options:
- id: a
  en: -5 D
- id: b
  en: -1.25 D
- id: c
  en: 4 D
- id: d
  en: 6 D
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: for thin lenses in contact the powers add: P = 1/f1 + 1/f2
    (f in metres, with signs).'
- en: 'Put each quantity in SI units with its sign: f1 = -1 m; f2 = 0.2 m.'
- en: 'Substitute: P = 1 / (-1) + 1 / 0.2.'
- en: 'Calculate: P = 4 D.'
- en: So the combined power is 4 D.
- en: The correct option is c.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: for thin lenses in contact the powers add: P = 1/f1 + 1/f2 (f in metres,
    with signs).'
- level: 2
  en: The relation already gives the combined power directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
    Give each distance its sign by the Cartesian convention before you substitute.
- level: 3
  en: 'First step: Write 100 cm as -1 m and 20 cm as 0.2 m, then write P = 1 / f1
    + 1 / f2, where P is the combined power, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the combined power have, and roughly
    how large is it?
