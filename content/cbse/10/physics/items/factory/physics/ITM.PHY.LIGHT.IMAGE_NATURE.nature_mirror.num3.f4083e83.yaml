solution_steps:
- en: 'Write the relation: find v from the mirror formula, then m = -v / u; a negative
    v is a real image in front of the mirror, a negative m is inverted, |m| above
    1 is magnified.'
- en: 'Put each quantity in SI units with its sign: u = -0.15 m; f = -0.2 m.'
- en: 'Substitute: v = (-0.15) x (-0.2) / ((-0.15) - (-0.2)).'
- en: 'Calculate: v = 0.6 m.'
- en: 'Give it in cm: 60 cm.'
- en: 'Read the sign of v and of m = -v / u: the image is virtual, erect, magnified.'
- en: So the image is virtual, erect, magnified.
- en: The correct option is a.
