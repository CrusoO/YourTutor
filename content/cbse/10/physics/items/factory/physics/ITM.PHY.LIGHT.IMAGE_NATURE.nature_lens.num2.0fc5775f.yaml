stem:
  en: This question is about the nature of the image from the mirror and lens formulas.
    The object, u, is 20 cm from the concave lens and the focal length of the concave
    lens, f, is 30 cm. What is the nature of the image?
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: find v from the lens formula, then m = v / u; a positive v is a real
    image on the far side, a negative m is inverted, |m| above 1 is magnified.'
- level: 2
  en: Work out v first, then m, and only then read what their signs say. Change every
    quantity to SI units first, and change back at the end if asked. Give each distance
    its sign by the Cartesian convention before you substitute.
- level: 3
  en: 'First step: Write 20 cm as -0.2 m and 30 cm as -0.3 m, then write v = u x f
    / (u + f), where v is the image distance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: 'Think first: which quantities does the answer depend on, and does it grow or
    shrink?'
