stem:
  en: This question is about the power of a lens. The power of the lens, P, is 2.5
    D. Find the focal length in cm, with its sign.
options:
- id: a
  en: -0.4 cm
- id: b
  en: 40 cm
- id: c
  en: 2.5 cm
- id: d
  en: -40 cm
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: power P = 1 / f, so f = 1 / P in metres.'
- en: 'Put each quantity in SI units with its sign: P = -2.5 D.'
- en: 'Get the focal length alone: multiply each side of P = 1 / f by f, then divide
    each side by P.'
- en: 'Substitute: f = 1 / (-2.5).'
- en: 'Calculate: f = -0.4 m.'
- en: 'Give it in cm: -40 cm.'
- en: So the focal length is -40 cm.
- en: The correct option is d.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: power P = 1 / f, so f = 1 / P in metres.'
- level: 2
  en: 'Get the focal length on its own before you put numbers in: multiply each side
    of P = 1 / f by f, then divide each side by P. Do the same operation to each side
    of the formula. Change every quantity to SI units first, and change back at the
    end if asked. Give each distance its sign by the Cartesian convention before you
    substitute.'
- level: 3
  en: 'First step: write f = 1 / P, where f is the focal length, with the values in
    place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the focal length have, and roughly how
    large is it?
