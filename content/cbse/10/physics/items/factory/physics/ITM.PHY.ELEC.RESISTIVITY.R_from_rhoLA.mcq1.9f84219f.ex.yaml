solution_steps:
- en: 'Write the relation: R = resistivity x length / area.'
- en: 'Put each quantity in SI units: 5 cm = 0.05 m; 1 mm² = 1 x 10^-6 m².'
- en: 'Substitute: R = (1 x 10^-7) x 0.05 / (1 x 10^-6).'
- en: 'Calculate: R = 0.005 Ω.'
- en: So the resistance is 0.005 Ω.
- en: The correct option is c.
