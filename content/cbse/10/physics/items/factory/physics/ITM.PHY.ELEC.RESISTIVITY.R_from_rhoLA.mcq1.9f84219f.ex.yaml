stem:
  en: The resistivity of its material, rho, is 1 x 10^-7 Ω m, its length, L, is 5
    cm and its cross-section area, A, is 1 mm². Find the resistance of the wire. A
    classmate says the answer is 2 x 10^-12 Ω. Work it out yourself and choose the
    correct answer.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: R = resistivity x length / area.'
- level: 2
  en: The relation already gives the resistance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 5 cm as 0.05 m and 1 mm² as 1 x 10^-6 m², then write R =
    rho x L / A, where R is the resistance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the resistance have, and roughly how
    large is it?
