stem:
  en: The work done, W, is 120 J and the potential difference, V, is 6 V. How much
    charge is moved?
options:
- id: a
  en: 20 C
- id: b
  en: 126 C
- id: c
  en: 720 C
- id: d
  en: 0.05 C
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: V = W / Q, so Q = W / V.'
- en: 'Get the charge alone: multiply each side of V = W / Q by Q, then divide each
    side by V.'
- en: 'Substitute: Q = 120 / 6.'
- en: 'Calculate: Q = 20 C.'
- en: So the charge is 20 C.
- en: The correct option is a.
