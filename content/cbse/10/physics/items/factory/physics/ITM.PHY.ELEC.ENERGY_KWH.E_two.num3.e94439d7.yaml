solution_steps:
- en: 'Plan: add the energy of each appliance for one day, power times time, then
    multiply by the days.'
- en: 'Substitute: E2 = (100 x 28800 + 40 x 10800) x 10.'
- en: 'Calculate: E2 = 3.312 x 10^7 J.'
- en: 'Give it in kWh: 9.2 kWh.'
- en: So the energy is 9.2 kWh.
- en: The correct option is d.
