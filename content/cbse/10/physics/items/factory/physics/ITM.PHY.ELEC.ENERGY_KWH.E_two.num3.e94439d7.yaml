stem:
  en: A student is studying the electrical energy an appliance uses. The power rating
    of the first appliance, P1, is 100 W, the time it is used each day, t1, is 8 h,
    the power rating of the second appliance, P2, is 40 W, the time the second one
    is used each day, t2, is 3 h and the number of days, d, is 10. How much electrical
    energy is used in all, in kWh?
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Plan the steps: add
    the energy of each appliance for one day, power times time, then multiply by the
    days.'
- level: 2
  en: Work through the plan one step at a time. Change every quantity to SI units
    first, and change back at the end if asked.
- level: 3
  en: 'First step: write E2 = (P1 x t1 + P2 x t2) x d, where E2 is the energy, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the energy have, and roughly how large
    is it?
