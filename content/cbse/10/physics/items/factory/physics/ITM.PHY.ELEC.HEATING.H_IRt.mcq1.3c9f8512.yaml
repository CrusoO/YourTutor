stem:
  en: The current, I, is 2 A, the resistance, R, is 100 Ω and the time, t, is 10 min.
    How much heat is produced?
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: heat H = I x I x R x t.'
- level: 2
  en: The relation already gives the heat produced directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 10 min as 600 s, then write H = I x I x R x t, where H is
    the heat produced, with the values in place, one quantity at a time.'
