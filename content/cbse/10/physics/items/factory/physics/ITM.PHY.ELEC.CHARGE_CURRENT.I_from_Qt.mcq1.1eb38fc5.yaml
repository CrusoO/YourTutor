stem:
  en: The charge, Q, is 30 C and the time, t, is 10 min. What is the current?
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: charge Q = current I x time t.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of Q
    = I x t by t. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 10 min as 600 s, then write I = Q / t, where I is the current,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
