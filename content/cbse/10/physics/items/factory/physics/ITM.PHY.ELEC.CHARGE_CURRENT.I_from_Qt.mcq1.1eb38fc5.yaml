solution_steps:
- en: 'Write the relation: charge Q = current I x time t.'
- en: 'Put each quantity in SI units: 10 min = 600 s.'
- en: 'Get the current alone: divide each side of Q = I x t by t.'
- en: 'Substitute: I = 30 / 600.'
- en: 'Calculate: I = 0.05 A.'
- en: 'Give it in mA: 50 mA.'
- en: So the current is 50 mA.
- en: The correct option is c.
