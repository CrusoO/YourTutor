stem:
  en: A student is studying the nature of the image from the mirror and lens formulas.
    The object, u, is 15 cm from the convex mirror and the focal length of the convex
    mirror, f, is 15 cm. What is the nature of the image?
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: find v from the mirror formula, then m = -v / u; a negative v
    is a real image in front of the mirror, a negative m is inverted, |m| above 1
    is magnified.'
- level: 2
  en: Work out v first, then m, and only then read what their signs say. Change every
    quantity to SI units first, and change back at the end if asked. Give each distance
    its sign by the Cartesian convention before you substitute.
- level: 3
  en: 'First step: Write 15 cm as -0.15 m and 15 cm as 0.15 m, then write v = u x
    f / (u - f), where v is the image distance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: 'Think first: which quantities does the answer depend on, and does it grow or
    shrink?'
