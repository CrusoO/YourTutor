solution_steps:
- en: 'Write the relation: find v from the mirror formula, then m = -v / u; a negative
    v is a real image in front of the mirror, a negative m is inverted, |m| above
    1 is magnified.'
- en: 'Put each quantity in SI units with its sign: u = -0.15 m; f = 0.15 m.'
- en: 'Substitute: v = (-0.15) x 0.15 / ((-0.15) - 0.15).'
- en: 'Calculate: v = 0.075 m.'
- en: 'Give it in cm: 7.5 cm.'
- en: 'Read the sign of v and of m = -v / u: the image is virtual, erect, diminished.'
- en: So the image is virtual, erect, diminished.
- en: The correct option is c.
