stem:
  en: This question is about light passing from one medium into another. The first
    medium has refractive index 1.25 and the second medium has refractive index 2.4.
    Find the refractive index of the second medium relative to the first.
options:
- id: a
  en: '1.15'
- id: b
  en: '3'
- id: c
  en: '0.521'
- id: d
  en: '1.92'
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: relative refractive index of medium 2 with respect to medium
    1: n21 = n2 / n1.'
- en: 'Substitute: n21 = 2.4 / 1.25.'
- en: 'Calculate: n21 = 1.92.'
- en: So the refractive index of the second medium relative to the first is 1.92.
- en: The correct option is d.
