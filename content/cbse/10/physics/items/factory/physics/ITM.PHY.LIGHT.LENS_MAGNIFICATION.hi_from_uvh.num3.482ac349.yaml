solution_steps:
- en: 'Write the relation: m = v / u and m = image height / object height.'
- en: 'Put each quantity in SI units with its sign: u = -0.6 m; v = 0.6 m; h = 0.02
    m.'
- en: 'Get the image height alone: multiply each side of m = hi / h by h.'
- en: 'Substitute: hi = 0.6 x 0.02 / (-0.6).'
- en: 'Calculate: hi = -0.02 m.'
- en: 'Give it in cm: -2 cm.'
- en: So the image height is -2 cm.
- en: The correct option is a.
