stem:
  en: 'Case: a student investigates image formation by a spherical mirror and records
    the following. The object, u, is 20 cm from the convex mirror and the focal length
    of the convex mirror, f, is 20 cm. Using the Cartesian sign convention, find the
    image distance v.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: mirror formula 1/v + 1/u = 1/f, with u and f signed by the convention.'
- level: 2
  en: 'Get the image distance on its own before you put numbers in: subtract 1/u from
    each side of 1/v + 1/u = 1/f, then take the reciprocal of each side. Do the same
    operation to each side of the formula. Change every quantity to SI units first,
    and change back at the end if asked. Give each distance its sign by the Cartesian
    convention before you substitute.'
- level: 3
  en: 'First step: Write 20 cm as -0.2 m and 20 cm as 0.2 m, then write v = u x f
    / (u - f), where v is the image distance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the image distance have, and roughly
    how large is it?
