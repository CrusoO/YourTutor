solution_steps:
- en: 'Write the relation: P = V x V / R, so combine the effect of V, which is squared,
    with the effect of R, which is inverse.'
- en: 'Combine the numbers: 4^2 / 5 = 3.2.'
- en: So the number the power is multiplied by is 3.2.
- en: The correct option is b.
