stem:
  en: A student is studying how power changes when a quantity changes. The potential
    difference across a resistor is multiplied by 4 and its resistance is multiplied
    by 5. By what number is the power multiplied?
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: P = V x V / R, so combine the effect of V, which is squared, with
    the effect of R, which is inverse.'
- level: 2
  en: The relation already gives the number the power is multiplied by directly, so
    decide what to substitute.
- level: 3
  en: 'First step: write down the number each quantity is multiplied by, using 2 for
    doubled and 1/2 for halved, then combine them using the relation.'
prediction_prompt:
  en: 'Think first: which quantities does the answer depend on, and does it grow or
    shrink?'
