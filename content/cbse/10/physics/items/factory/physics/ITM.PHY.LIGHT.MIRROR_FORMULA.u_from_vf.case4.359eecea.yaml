stem:
  en: 'Case: a student investigates image formation by a spherical mirror and records
    the following. The image, which is virtual, is 6 cm from the convex mirror and
    the focal length of the convex mirror, f, is 15 cm. Using the Cartesian sign convention,
    find the object distance u.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: mirror formula 1/v + 1/u = 1/f, with v and f signed by the convention.'
- level: 2
  en: 'Get the object distance on its own before you put numbers in: subtract 1/v
    from each side of 1/v + 1/u = 1/f, then take the reciprocal of each side. Do the
    same operation to each side of the formula. Change every quantity to SI units
    first, and change back at the end if asked. Give each distance its sign by the
    Cartesian convention before you substitute.'
- level: 3
  en: 'First step: Write 6 cm as 0.06 m and 15 cm as 0.15 m, then write u = v x f
    / (v - f), where u is the object distance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the object distance have, and roughly
    how large is it?
