solution_steps:
- en: 'Write the relation: mirror formula 1/v + 1/u = 1/f, with v and f signed by
    the convention.'
- en: 'Put each quantity in SI units with its sign: v = 0.06 m; f = 0.15 m.'
- en: 'Get the object distance alone: subtract 1/v from each side of 1/v + 1/u = 1/f,
    then take the reciprocal of each side.'
- en: 'Substitute: u = 0.06 x 0.15 / (0.06 - 0.15).'
- en: 'Calculate: u = -0.1 m.'
- en: 'Give it in cm: -10 cm.'
- en: So the object distance is -10 cm.
- en: The correct option is b.
