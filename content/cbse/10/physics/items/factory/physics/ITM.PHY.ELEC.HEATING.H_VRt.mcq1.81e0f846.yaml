solution_steps:
- en: 'Write the relation: heat H = V x V x t / R.'
- en: 'Put each quantity in SI units: 10 min = 600 s.'
- en: 'Substitute: H = 200 x 200 x 600 / 50.'
- en: 'Calculate: H = 480000 J.'
- en: So the heat produced is 480000 J.
