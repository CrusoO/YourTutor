stem:
  en: The voltage, V, is 200 V, the resistance, R, is 50 Ω and the time, t, is 10
    min. How much heat is produced?
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: heat H = V x V x t / R.'
- level: 2
  en: The relation already gives the heat produced directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 10 min as 600 s, then write H = V x V x t / R, where H is
    the heat produced, with the values in place, one quantity at a time.'
