stem:
  en: A student is studying a battery connected to resistors in series. The battery
    gives 1 V, the first resistor, R1, is 2 Ω and the second resistor, R2, is 3 Ω.
    Find the potential difference across the second resistor.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: find the current from the whole circuit, then use V = I x R on
    one resistor.'
- level: 2
  en: The relation already gives the potential difference across the second resistor
    directly, so decide what to substitute.
- level: 3
  en: 'First step: write V2 = V x R2 / (R1 + R2), where V2 is the potential difference
    across the second resistor, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference across the second
    resistor have, and roughly how large is it?
