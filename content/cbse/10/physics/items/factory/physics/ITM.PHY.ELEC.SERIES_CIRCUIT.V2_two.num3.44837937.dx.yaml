solution_steps:
- en: 'Write the relation: find the current from the whole circuit, then use V = I
    x R on one resistor.'
- en: 'Substitute: V2 = 1 x 3 / (2 + 3).'
- en: 'Calculate: V2 = 0.6 V.'
- en: So the potential difference across the second resistor is 0.6 V.
