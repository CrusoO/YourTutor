solution_steps:
- en: 'Write the relation: magnification of a lens m = v / u.'
- en: 'Put each quantity in SI units with its sign: u = -0.6 m; v = 0.12 m.'
- en: 'Substitute: m = 0.12 / (-0.6).'
- en: 'Calculate: m = -0.2.'
- en: So the magnification is -0.2.
- en: The correct option is c.
