stem:
  en: A student is studying the magnification of a thin lens. The object, u, is 15
    cm from the concave lens and the magnification, m, is 0.4. Find the image distance,
    with its sign.
options:
- id: a
  en: -6 cm
- id: b
  en: 37.5 cm
- id: c
  en: 6 cm
- id: d
  en: -37.5 cm
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: magnification of a lens m = v / u.'
- en: 'Put each quantity in SI units with its sign: u = -0.15 m.'
- en: 'Get the image distance alone: multiply each side of m = v / u by u.'
- en: 'Substitute: v = 0.4 x (-0.15).'
- en: 'Calculate: v = -0.06 m.'
- en: 'Give it in cm: -6 cm.'
- en: So the image distance is -6 cm.
- en: The correct option is a.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: magnification of a lens m = v / u.'
- level: 2
  en: 'Get the image distance on its own before you put numbers in: multiply each
    side of m = v / u by u. Do the same operation to each side of the formula. Change
    every quantity to SI units first, and change back at the end if asked. Give each
    distance its sign by the Cartesian convention before you substitute.'
- level: 3
  en: 'First step: Write 15 cm as -0.15 m, then write v = m x u, where v is the image
    distance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the image distance have, and roughly
    how large is it?
