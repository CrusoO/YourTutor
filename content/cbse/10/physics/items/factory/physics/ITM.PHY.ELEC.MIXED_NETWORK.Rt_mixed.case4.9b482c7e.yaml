stem:
  en: 'Case: a student investigates a resistor in series with two resistors in parallel
    and records the following. The resistor in series with the pair, R1, is 10 Ω,
    one resistor of the parallel pair, R2, is 9 Ω and the other resistor of the pair,
    R3, is 18 Ω. Find the total resistance of the network.'
options:
- id: a
  en: 16 Ω
- id: b
  en: 10.2 Ω
- id: c
  en: 3.75 Ω
- id: d
  en: 37 Ω
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: combine the parallel pair first (1/Rp = 1/R2 + 1/R3), then
    add the series resistor.'
- en: 'Substitute: Rt = 10 + 9 x 18 / (9 + 18).'
- en: 'Calculate: Rt = 16 Ω.'
- en: So the total resistance is 16 Ω.
- en: The correct option is a.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: combine the parallel pair first (1/Rp = 1/R2 + 1/R3), then add
    the series resistor.'
- level: 2
  en: The relation already gives the total resistance directly, so decide what to
    substitute.
- level: 3
  en: 'First step: write Rt = R1 + R2 x R3 / (R2 + R3), where Rt is the total resistance,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the total resistance have, and roughly
    how large is it?
