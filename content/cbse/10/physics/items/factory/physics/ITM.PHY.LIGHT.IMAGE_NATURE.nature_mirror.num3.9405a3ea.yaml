difficulty: 0.65
type: mcq
pool: practice
role: explain
stem:
  en: A student is studying the nature of the image from the mirror and lens formulas.
    The object, u, is 20 cm from the convex mirror and the focal length of the convex
    mirror, f, is 20 cm. What is the nature of the image?
options:
- id: a
  en: virtual, erect, diminished
- id: b
  en: virtual, inverted, diminished
- id: c
  en: virtual, erect, magnified
- id: d
  en: real, erect, diminished
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: find v from the mirror formula, then m = -v / u; a negative
    v is a real image in front of the mirror, a negative m is inverted, |m| above
    1 is magnified.'
- en: 'Put each quantity in SI units with its sign: u = -0.2 m; f = 0.2 m.'
- en: 'Substitute: v = (-0.2) x 0.2 / ((-0.2) - 0.2).'
- en: 'Calculate: v = 0.1 m.'
- en: 'Give it in cm: 10 cm.'
- en: 'Read the sign of v and of m = -v / u: the image is virtual, erect, diminished.'
- en: So the image is virtual, erect, diminished.
- en: The correct option is a.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: find v from the mirror formula, then m = -v / u; a negative v
    is a real image in front of the mirror, a negative m is inverted, |m| above 1
    is magnified.'
- level: 2
  en: Work out v first, then m, and only then read what their signs say. Change every
    quantity to SI units first, and change back at the end if asked. Give each distance
    its sign by the Cartesian convention before you substitute.
- level: 3
  en: 'First step: Write 20 cm as -0.2 m and 20 cm as 0.2 m, then write v = u x f
    / (u - f), where v is the image distance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: 'Think first: which quantities does the answer depend on, and does it grow or
    shrink?'
