stem:
  en: A student is studying an electrical appliance. The voltage across it, V, is
    60 V and its power, P, is 300 W. Find the resistance of the appliance.
options:
- id: a
  en: 0.2 Ω
- id: b
  en: 0.0833 Ω
- id: c
  en: 1.08 x 10^6 Ω
- id: d
  en: 12 Ω
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: P = V x V / R.'
- en: 'Get the resistance alone: multiply each side of P = V x V / R by R, then divide
    each side by P.'
- en: 'Substitute: R = 60 x 60 / 300.'
- en: 'Calculate: R = 12 Ω.'
- en: So the resistance is 12 Ω.
- en: The correct option is d.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: P = V x V / R.'
- level: 2
  en: 'Get the resistance on its own before you put numbers in: multiply each side
    of P = V x V / R by R, then divide each side by P. Do the same operation to each
    side of the formula.'
- level: 3
  en: 'First step: write R = V x V / P, where R is the resistance, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the resistance have, and roughly how
    large is it?
