stem:
  en: 'Case: a student investigates a battery connected to resistors in parallel and
    records the following. The total current from the battery, It, is 2.5 A, the first
    resistor, R1, is 30 Ω and the second resistor, R2, is 20 Ω. Find the current in
    the second resistor.'
options:
- id: a
  en: 1.5 A
- id: b
  en: 2.5 A
- id: c
  en: 1 A
- id: d
  en: 1.25 A
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: the branches share one voltage, so the larger resistor
    takes the smaller current: I1 x R1 = I2 x R2 and I1 + I2 = total.'
- en: 'Substitute: I2 = 2.5 x 30 / (30 + 20).'
- en: 'Calculate: I2 = 1.5 A.'
- en: So the current in the second resistor is 1.5 A.
- en: The correct option is a.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: the branches share one voltage, so the larger resistor takes the smaller
    current: I1 x R1 = I2 x R2 and I1 + I2 = total.'
- level: 2
  en: The relation already gives the current in the second resistor directly, so decide
    what to substitute.
- level: 3
  en: 'First step: write I2 = It x R1 / (R1 + R2), where I2 is the current in the
    second resistor, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current in the second resistor have,
    and roughly how large is it?
