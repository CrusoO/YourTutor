solution_steps:
- en: 'Write the relation: find the battery current, then use V = I x R on the parallel
    pair alone.'
- en: 'Substitute: Vp = 2.5 x 12 x 4 / (2 x (12 + 4) + 12 x 4).'
- en: 'Calculate: Vp = 1.5 V.'
- en: So the potential difference across the pair is 1.5 V.
- en: The correct option is d.
