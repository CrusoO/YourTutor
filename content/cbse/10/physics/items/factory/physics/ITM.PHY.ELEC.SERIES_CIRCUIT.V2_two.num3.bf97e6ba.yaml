stem:
  en: A student is studying a battery connected to resistors in series. The battery
    gives 2.5 V, the first resistor, R1, is 2 Ω and the second resistor, R2, is 3
    Ω. Find the potential difference across the second resistor.
options:
- id: a
  en: 2.5 V
- id: b
  en: 1.25 V
- id: c
  en: 1 V
- id: d
  en: 1.5 V
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: find the current from the whole circuit, then use V = I
    x R on one resistor.'
- en: 'Substitute: V2 = 2.5 x 3 / (2 + 3).'
- en: 'Calculate: V2 = 1.5 V.'
- en: So the potential difference across the second resistor is 1.5 V.
- en: The correct option is d.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: find the current from the whole circuit, then use V = I x R on one
    resistor.'
- level: 2
  en: The relation already gives the potential difference across the second resistor
    directly, so decide what to substitute.
- level: 3
  en: 'First step: write V2 = V x R2 / (R1 + R2), where V2 is the potential difference
    across the second resistor, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference across the second
    resistor have, and roughly how large is it?
