stem:
  en: The focal length of the concave lens, f, is 40 cm. Find the power of the lens
    in dioptres, with its sign.
options:
- id: a
  en: 2.5 D
- id: b
  en: -0.025 D
- id: c
  en: -2.5 D
- id: d
  en: -0.4 D
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: power P = 1 / f, with f in metres and its sign from the
    convention.'
- en: 'Put each quantity in SI units with its sign: f = -0.4 m.'
- en: 'Substitute: P = 1 / (-0.4).'
- en: 'Calculate: P = -2.5 D.'
- en: So the power is -2.5 D.
- en: The correct option is c.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: power P = 1 / f, with f in metres and its sign from the convention.'
- level: 2
  en: The relation already gives the power directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
    Give each distance its sign by the Cartesian convention before you substitute.
- level: 3
  en: 'First step: Write 40 cm as -0.4 m, then write P = 1 / f, where P is the power,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the power have, and roughly how large
    is it?
