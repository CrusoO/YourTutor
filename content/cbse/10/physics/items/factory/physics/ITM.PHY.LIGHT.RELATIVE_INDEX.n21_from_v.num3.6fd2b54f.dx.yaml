stem:
  en: A student is studying light passing from one medium into another. Light travels
    in the first medium at 1.25 x 10^8 m/s and light travels in the second medium
    at 1 x 10^8 m/s. Find the refractive index of the second medium relative to the
    first.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: n21 = n2 / n1 and each n = c / v, so n21 = v1 / v2.'
- level: 2
  en: The relation already gives the refractive index of the second medium relative
    to the first directly, so decide what to substitute.
- level: 3
  en: 'First step: write n21 = v1 / v2, where n21 is the refractive index of the second
    medium relative to the first, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the refractive index of the second
    medium relative to the first be?
