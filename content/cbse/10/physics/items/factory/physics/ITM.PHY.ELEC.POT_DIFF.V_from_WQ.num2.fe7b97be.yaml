stem:
  en: This question is about work done in moving charge. The work done, W, is 60 J
    and the charge moved, Q, is 20 C. Find the potential difference.
options:
- id: a
  en: 1200 V
- id: b
  en: 3 V
- id: c
  en: 0.333 V
- id: d
  en: 80 V
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: potential difference V = work done W / charge Q.'
- en: 'Substitute: V = 60 / 20.'
- en: 'Calculate: V = 3 V.'
- en: So the potential difference is 3 V.
- en: The correct option is b.
hints:
