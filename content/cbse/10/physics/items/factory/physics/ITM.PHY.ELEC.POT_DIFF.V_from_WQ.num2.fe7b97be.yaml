    links them: potential difference V = work done W / charge Q.'
- level: 2
  en: The relation already gives the potential difference directly, so decide what
    to substitute.
- level: 3
  en: 'First step: write V = W / Q, where V is the potential difference, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference have, and roughly
    how large is it?
