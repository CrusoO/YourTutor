stem:
  en: The diameter of a uniform wire is halved; its length and material stay the same.
    By what number is the resistance multiplied?
options:
- id: a
  en: '2'
- id: b
  en: '1'
- id: c
  en: '4'
- id: d
  en: '0.25'
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Plan: R is proportional to length and inversely proportional to area, so the
    new resistance divided by the old one equals the length factor divided by the
    area factor.'
- en: 'Combine the numbers: 1 / 0.25 = 4.'
- en: So the number the resistance is multiplied by is 4.
- en: The correct option is c.
hints:
