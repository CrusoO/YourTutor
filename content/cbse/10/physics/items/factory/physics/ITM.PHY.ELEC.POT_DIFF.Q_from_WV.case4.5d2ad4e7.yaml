stem:
  en: 'Case: a student investigates work done in moving charge and records the following.
    The work done, W, is 120 J and the potential difference, V, is 24 V. How much
    charge is moved?'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: V = W / Q, so Q = W / V.'
- level: 2
  en: 'Get the charge on its own before you put numbers in: multiply each side of
    V = W / Q by Q, then divide each side by V. Do the same operation to each side
    of the formula.'
- level: 3
  en: 'First step: write Q = W / V, where Q is the charge, with the values in place,
    one quantity at a time.'
