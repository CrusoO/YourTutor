stem:
  en: This question is about the magnification of a spherical mirror. The object,
    u, is 15 cm from the concave mirror, the image, which is virtual, is 60 cm from
    the concave mirror and the object, h, is 2 cm tall. Find the height of the image,
    with its sign.
options:
- id: a
  en: 8 cm
- id: b
  en: -8 cm
- id: c
  en: 0.5 cm
- id: d
  en: -0.5 cm
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: m = -v / u and m = image height / object height.'
- en: 'Put each quantity in SI units with its sign: u = -0.15 m; v = 0.6 m; h = 0.02
    m.'
- en: 'Get the image height alone: multiply each side of m = hi / h by h.'
- en: 'Substitute: hi = -0.6 x 0.02 / (-0.15).'
- en: 'Calculate: hi = 0.08 m.'
- en: 'Give it in cm: 8 cm.'
- en: So the image height is 8 cm.
- en: The correct option is a.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: m = -v / u and m = image height / object height.'
- level: 2
  en: 'Get the image height on its own before you put numbers in: multiply each side
    of m = hi / h by h. Do the same operation to each side of the formula. Change
    every quantity to SI units first, and change back at the end if asked. Give each
    distance its sign by the Cartesian convention before you substitute.'
- level: 3
  en: 'First step: Write 15 cm as -0.15 m, 60 cm as 0.6 m and 2 cm as 0.02 m, then
    write hi = -v x h / u, where hi is the image height, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the image height have, and roughly how
    large is it?
