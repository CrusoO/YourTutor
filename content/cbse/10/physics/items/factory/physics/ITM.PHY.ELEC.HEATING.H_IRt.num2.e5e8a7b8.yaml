role: apply
stem:
  en: This question is about the heat produced by a current. The current, I, is 0.5
    A, the resistance, R, is 10 Ω and the time, t, is 5 min. How much heat is produced?
options:
- id: a
  en: 12.5 J
- id: b
  en: 750 J
- id: c
  en: 1500 J
- id: d
  en: 2.5 J
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: heat H = I x I x R x t.'
- en: 'Put each quantity in SI units: 5 min = 300 s.'
- en: 'Substitute: H = 0.5 x 0.5 x 10 x 300.'
- en: 'Calculate: H = 750 J.'
- en: So the heat produced is 750 J.
- en: The correct option is b.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: heat H = I x I x R x t.'
- level: 2
  en: The relation already gives the heat produced directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 5 min as 300 s, then write H = I x I x R x t, where H is
    the heat produced, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the heat produced have, and roughly how
    large is it?
