solution_steps:
- en: 'Write the relation: energy E = power P x time t; 1 kWh = 1000 W for 1 hour.'
- en: 'Substitute: E1 = 1500 x 28800.'
- en: 'Calculate: E1 = 4.32 x 10^7 J.'
- en: 'Give it in kWh: 12 kWh.'
- en: So the energy is 12 kWh.
