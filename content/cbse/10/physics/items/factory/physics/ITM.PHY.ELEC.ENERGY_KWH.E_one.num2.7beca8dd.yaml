stem:
  en: This question is about the electrical energy an appliance uses. The power rating
    of the first appliance, P1, is 1500 W and the time it is used each day, t1, is
    8 h. How much electrical energy is used, in kWh?
options:
- id: a
  en: 1.5 kWh
- id: b
  en: 12 kWh
- id: c
  en: 1.508 kWh
- id: d
  en: 0.1875 kWh
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: energy E = power P x time t; 1 kWh = 1000 W for 1 hour.'
- en: 'Substitute: E1 = 1500 x 28800.'
- en: 'Calculate: E1 = 4.32 x 10^7 J.'
- en: 'Give it in kWh: 12 kWh.'
- en: So the energy is 12 kWh.
- en: The correct option is b.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: energy E = power P x time t; 1 kWh = 1000 W for 1 hour.'
- level: 2
  en: The relation already gives the energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: write E1 = P1 x t1, where E1 is the energy, with the values in
    place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the energy have, and roughly how large
    is it?
