solution_steps:
- en: 'Write the relation: mirror formula 1/v + 1/u = 1/f, with u and v signed by
    the convention.'
- en: 'Put each quantity in SI units with its sign: u = -0.1 m; v = 0.06 m.'
- en: 'Get the focal length alone: add 1/v and 1/u, then take the reciprocal of each
    side of 1/f = 1/v + 1/u.'
- en: 'Substitute: f = (-0.1) x 0.06 / ((-0.1) + 0.06).'
- en: 'Calculate: f = 0.15 m.'
- en: 'Give it in cm: 15 cm.'
- en: So the focal length is 15 cm.
- en: The correct option is d.
