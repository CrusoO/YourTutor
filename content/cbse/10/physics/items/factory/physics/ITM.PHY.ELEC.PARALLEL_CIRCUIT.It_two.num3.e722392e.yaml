stem:
  en: A student is studying a battery connected to resistors in parallel. The battery
    gives 30 V, the first resistor, R1, is 12 Ω and the second resistor, R2, is 4
    Ω. Find the total current drawn from the battery.
options:
- id: a
  en: 10 A
- id: b
  en: 2.5 A
- id: c
  en: 1.875 A
- id: d
  en: 480 A
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: each branch has the full battery voltage: I = V / R for
    each, and the branch currents add.'
- en: 'Substitute: It = 30 / 12 + 30 / 4.'
- en: 'Calculate: It = 10 A.'
- en: So the total current is 10 A.
- en: The correct option is a.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: each branch has the full battery voltage: I = V / R for each,
    and the branch currents add.'
- level: 2
  en: The relation already gives the total current directly, so decide what to substitute.
- level: 3
  en: 'First step: write It = V / R1 + V / R2, where It is the total current, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the total current have, and roughly how
    large is it?
