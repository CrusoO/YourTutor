stem:
  en: 'Case: a student investigates a battery connected to resistors in series and
    records the following. The battery gives 10 V, the first resistor, R1, is 4 Ω,
    the second resistor, R2, is 6 Ω and the third resistor, R3, is 10 Ω. Find the
    current in the circuit.'
options:
- id: a
  en: 200 A
- id: b
  en: 5.17 A
- id: c
  en: 0.5 A
- id: d
  en: 2.5 A
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Plan: the same current flows through every resistor in series.'
- en: 'Get the current alone: divide each side of V = I x (R1 + R2 + R3) by (R1 +
    R2 + R3).'
- en: 'Substitute: I = 10 / (4 + 6 + 10).'
- en: 'Calculate: I = 0.5 A.'
- en: So the current is 0.5 A.
- en: The correct option is c.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Plan the steps: the
    same current flows through every resistor in series.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of V
    = I x (R1 + R2 + R3) by (R1 + R2 + R3). Do the same operation to each side of
    the formula.'
- level: 3
  en: 'First step: write I = V / (R1 + R2 + R3), where I is the current, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
