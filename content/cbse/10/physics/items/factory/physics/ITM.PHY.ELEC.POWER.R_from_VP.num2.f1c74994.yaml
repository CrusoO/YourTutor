role: apply
stem:
  en: This question is about an electrical appliance. The voltage across it, V, is
    200 V and its power, P, is 100 W. Find the resistance of the appliance.
options:
- id: a
  en: 4 x 10^6 Ω
- id: b
  en: 400 Ω
- id: c
  en: 2 Ω
- id: d
  en: 0.0025 Ω
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: P = V x V / R.'
- en: 'Get the resistance alone: multiply each side of P = V x V / R by R, then divide
    each side by P.'
- en: 'Substitute: R = 200 x 200 / 100.'
- en: 'Calculate: R = 400 Ω.'
- en: So the resistance is 400 Ω.
- en: The correct option is b.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: P = V x V / R.'
- level: 2
  en: 'Get the resistance on its own before you put numbers in: multiply each side
    of P = V x V / R by R, then divide each side by P. Do the same operation to each
    side of the formula.'
- level: 3
  en: 'First step: write R = V x V / P, where R is the resistance, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the resistance have, and roughly how
    large is it?
