- en: 'Write the relation: the radius of curvature is twice the focal length: R =
    2f, with signs from the convention.'
- en: 'Put each quantity in SI units with its sign: f = 0.3 m.'
- en: 'Substitute: R = 2 x 0.3.'
- en: 'Calculate: R = 0.6 m.'
- en: 'Give it in cm: 60 cm.'
- en: So the radius of curvature is 60 cm.
