stem:
  en: This question is about the sign convention for mirrors and lenses. A concave
    lens has a focal length of magnitude 12 cm. Using the Cartesian sign convention,
    what is the value of f in cm?
hints:
- level: 1
  en: 'Plan the steps: decide which side of the pole or centre the quantity is on,
    then give the magnitude the matching sign.'
- level: 2
  en: Distances measured against the direction of the incident light are negative,
    and those along it are positive. Focal length follows the type of mirror or lens.
- level: 3
  en: 'First step: say whether this quantity is on the side the light comes from or
    on the other side, or what type of mirror or lens it is.'
