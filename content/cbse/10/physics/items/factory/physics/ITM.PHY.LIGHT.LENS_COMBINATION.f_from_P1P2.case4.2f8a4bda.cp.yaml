solution_steps:
- en: 'Write the relation: the powers add, then f = 1 / P, in metres.'
- en: 'Put each quantity in SI units with its sign: P1 = -5 D; P2 = -5 D.'
- en: 'Get the combined focal length alone: add the powers, then take the reciprocal
    of each side of P = 1 / f.'
- en: 'Substitute: f = 1 / ((-5) + (-5)).'
- en: 'Calculate: f = -0.1 m.'
- en: 'Give it in cm: -10 cm.'
- en: So the combined focal length is -10 cm.
- en: The correct option is a.
