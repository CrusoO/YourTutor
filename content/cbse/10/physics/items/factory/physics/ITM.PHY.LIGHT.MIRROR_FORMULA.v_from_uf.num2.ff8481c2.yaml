stem:
  en: This question is about image formation by a spherical mirror. The object, u,
    is 30 cm from the concave mirror and the focal length of the concave mirror, f,
    is 10 cm. Using the Cartesian sign convention, find the image distance v.
options:
- id: a
  en: -15 cm
- id: b
  en: -7.5 cm
- id: c
  en: 7.5 cm
- id: d
  en: -667 cm
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: mirror formula 1/v + 1/u = 1/f, with u and f signed by
    the convention.'
- en: 'Put each quantity in SI units with its sign: u = -0.3 m; f = -0.1 m.'
- en: 'Get the image distance alone: subtract 1/u from each side of 1/v + 1/u = 1/f,
    then take the reciprocal of each side.'
- en: 'Substitute: v = (-0.3) x (-0.1) / ((-0.3) - (-0.1)).'
- en: 'Calculate: v = -0.15 m.'
- en: 'Give it in cm: -15 cm.'
- en: So the image distance is -15 cm.
- en: The correct option is a.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: mirror formula 1/v + 1/u = 1/f, with u and f signed by the convention.'
- level: 2
  en: 'Get the image distance on its own before you put numbers in: subtract 1/u from
    each side of 1/v + 1/u = 1/f, then take the reciprocal of each side. Do the same
    operation to each side of the formula. Change every quantity to SI units first,
    and change back at the end if asked. Give each distance its sign by the Cartesian
    convention before you substitute.'
- level: 3
  en: 'First step: Write 30 cm as -0.3 m and 10 cm as -0.1 m, then write v = u x f
    / (u - f), where v is the image distance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the image distance have, and roughly
    how large is it?
