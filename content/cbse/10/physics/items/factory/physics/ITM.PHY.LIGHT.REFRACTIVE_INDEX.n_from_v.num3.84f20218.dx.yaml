solution_steps:
- en: 'Write the relation: refractive index n = speed of light in vacuum / speed in
    the medium.'
- en: 'Get the refractive index alone: multiply each side of n = c / v by v, then
    divide each side by n.'
- en: 'Substitute: n = (3 x 10^8) / (1.5 x 10^8).'
- en: 'Calculate: n = 2.'
- en: So the refractive index is 2.
- en: The correct option is a.
