stem:
  en: 'Case: a student investigates the heat produced by a current and records the
    following. The heat produced, H, is 25000 J, the resistance, R, is 100 Ω and the
    time, t, is 10 s. Find the current.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: heat H = I x I x R x t.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of H
    = I x I x R x t by R x t, then take the square root of each side. Do the same
    operation to each side of the formula.'
- level: 3
  en: 'First step: write I = sqrt(H / R / t), where I is the current, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
