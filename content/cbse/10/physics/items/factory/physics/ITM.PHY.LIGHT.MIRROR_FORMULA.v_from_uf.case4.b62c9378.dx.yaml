solution_steps:
- en: 'Write the relation: mirror formula 1/v + 1/u = 1/f, with u and f signed by
    the convention.'
- en: 'Put each quantity in SI units with its sign: u = -0.1 m; f = 0.3 m.'
- en: 'Get the image distance alone: subtract 1/u from each side of 1/v + 1/u = 1/f,
    then take the reciprocal of each side.'
- en: 'Substitute: v = (-0.1) x 0.3 / ((-0.1) - 0.3).'
- en: 'Calculate: v = 0.075 m.'
- en: 'Give it in cm: 7.5 cm.'
- en: So the image distance is 7.5 cm.
- en: The correct option is b.
