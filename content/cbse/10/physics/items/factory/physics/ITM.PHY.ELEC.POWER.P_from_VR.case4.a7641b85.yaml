stem:
  en: 'Case: a student investigates an electrical appliance and records the following.
    The voltage across it, V, is 20 V and its resistance, R, is 40 Ω. Find the power.'
options:
- id: a
  en: 0.1 W
- id: b
  en: 800 W
- id: c
  en: 0.5 W
- id: d
  en: 10 W
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: P = V x V / R (from P = V x I and I = V / R).'
- en: 'Substitute: P = 20 x 20 / 40.'
- en: 'Calculate: P = 10 W.'
- en: So the power is 10 W.
- en: The correct option is d.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: P = V x V / R (from P = V x I and I = V / R).'
- level: 2
  en: The relation already gives the power directly, so decide what to substitute.
- level: 3
  en: 'First step: write P = V x V / R, where P is the power, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the power have, and roughly how large
    is it?
