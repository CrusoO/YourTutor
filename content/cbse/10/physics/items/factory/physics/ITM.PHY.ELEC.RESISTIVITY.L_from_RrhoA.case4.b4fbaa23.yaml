role: transfer
stem:
  en: 'Case: a student investigates a uniform wire and records the following. Its
    resistance, R, is 0.4 Ω, the resistivity of its material, rho, is 5 x 10^-7 Ω
    m and its cross-section area, A, is 0.25 mm². Find the length of the wire.'
options:
- id: a
  en: 2 x 10^7 cm
- id: b
  en: 20 cm
- id: c
  en: 80 cm
- id: d
  en: 5 x 10^-12 cm
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: R = resistivity x length / area.'
- en: 'Put each quantity in SI units: 0.25 mm² = 2.5 x 10^-7 m².'
- en: 'Get the length alone: multiply each side of R = resistivity x L / A by A, then
    divide each side by the resistivity.'
- en: 'Substitute: L = 0.4 x (2.5 x 10^-7) / (5 x 10^-7).'
- en: 'Calculate: L = 0.2 m.'
- en: 'Give it in cm: 20 cm.'
- en: So the length is 20 cm.
- en: The correct option is b.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: R = resistivity x length / area.'
- level: 2
  en: 'Get the length on its own before you put numbers in: multiply each side of
    R = resistivity x L / A by A, then divide each side by the resistivity. Do the
    same operation to each side of the formula. Change every quantity to SI units
    first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 0.25 mm² as 2.5 x 10^-7 m², then write L = R x A / rho, where
    L is the length, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the length have, and roughly how large
    is it?
