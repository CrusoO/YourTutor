stem:
  en: This question is about light travelling in a transparent medium. Light travels
    in the medium at 1.5 x 10^8 m/s and the speed of light in vacuum is 3 x 10^8 m/s.
    Find the refractive index of the medium.
options:
- id: a
  en: '2'
- id: b
  en: '0.2'
- id: c
  en: '0.5'
- id: d
  en: '20'
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: refractive index n = speed of light in vacuum / speed in
    the medium.'
- en: 'Get the refractive index alone: multiply each side of n = c / v by v, then
    divide each side by n.'
- en: 'Substitute: n = (3 x 10^8) / (1.5 x 10^8).'
- en: 'Calculate: n = 2.'
- en: So the refractive index is 2.
- en: The correct option is a.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: refractive index n = speed of light in vacuum / speed in the medium.'
- level: 2
  en: 'Get the refractive index on its own before you put numbers in: multiply each
    side of n = c / v by v, then divide each side by n. Do the same operation to each
    side of the formula.'
- level: 3
  en: 'First step: write n = c / v, where n is the refractive index, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the refractive index be?
