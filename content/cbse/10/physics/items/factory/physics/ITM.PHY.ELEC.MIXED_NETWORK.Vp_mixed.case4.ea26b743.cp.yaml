solution_steps:
- en: 'Write the relation: find the battery current, then use V = I x R on the parallel
    pair alone.'
- en: 'Substitute: Vp = 26 x 12 x 4 / (10 x (12 + 4) + 12 x 4).'
- en: 'Calculate: Vp = 6 V.'
- en: So the potential difference across the pair is 6 V.
- en: The correct option is b.
