stem:
  en: A uniform wire is stretched evenly to 3 times its original length, so its volume
    stays the same. By what number is the resistance multiplied?
options:
- id: a
  en: '9'
- id: b
  en: '0.111'
- id: c
  en: '1'
- id: d
  en: '3'
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Plan: R is proportional to length and inversely proportional to area, so the
    new resistance divided by the old one equals the length factor divided by the
    area factor.'
- en: 'Combine the numbers: 3 / 0.333 = 9.'
- en: So the number the resistance is multiplied by is 9.
- en: The correct option is a.
