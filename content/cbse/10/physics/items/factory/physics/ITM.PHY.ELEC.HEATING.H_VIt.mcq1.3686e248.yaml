stem:
  en: The voltage, V, is 20 V, the current, I, is 2 A and the time, t, is 5 min. How
    much heat is produced?
options:
- id: a
  en: 200 J
- id: b
  en: 40 J
- id: c
  en: 12000 J
- id: d
  en: 3000 J
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: heat H = V x I x t.'
- en: 'Put each quantity in SI units: 5 min = 300 s.'
- en: 'Substitute: H = 20 x 2 x 300.'
- en: 'Calculate: H = 12000 J.'
- en: So the heat produced is 12000 J.
- en: The correct option is c.
