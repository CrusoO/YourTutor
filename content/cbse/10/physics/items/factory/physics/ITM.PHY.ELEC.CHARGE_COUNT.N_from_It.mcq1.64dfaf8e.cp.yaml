solution_steps:
- en: 'Write the relation: charge Q = I x t, and Q = N x e, so N = I x t / e.'
- en: 'Get the number of electrons alone: divide each side of Q = N x e by e.'
- en: 'Substitute: N = 3.2 x 1 / (1.6 x 10^-19).'
- en: 'Calculate: N = 2 x 10^19.'
- en: So the number of electrons is 2 x 10^19.
- en: The correct option is b.
