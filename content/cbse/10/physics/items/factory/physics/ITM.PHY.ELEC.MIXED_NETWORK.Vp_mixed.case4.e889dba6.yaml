stem:
  en: 'Case: a student investigates a resistor in series with two resistors in parallel
    and records the following. The battery gives 21 V, the resistor in series with
    the pair, R1, is 4 Ω, one resistor of the parallel pair, R2, is 12 Ω and the other
    resistor of the pair, R3, is 4 Ω. Find the potential difference across the parallel
    pair.'
options:
- id: a
  en: 12 V
- id: b
  en: 9 V
- id: c
  en: 21 V
- id: d
  en: 10.5 V
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: find the battery current, then use V = I x R on the parallel
    pair alone.'
- en: 'Substitute: Vp = 21 x 12 x 4 / (4 x (12 + 4) + 12 x 4).'
- en: 'Calculate: Vp = 9 V.'
- en: So the potential difference across the pair is 9 V.
- en: The correct option is b.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: find the battery current, then use V = I x R on the parallel pair
    alone.'
- level: 2
  en: The relation already gives the potential difference across the pair directly,
    so decide what to substitute.
- level: 3
  en: 'First step: write Vp = V x R2 x R3 / (R1 x (R2 + R3) + R2 x R3), where Vp is
    the potential difference across the pair, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference across the pair
    have, and roughly how large is it?
