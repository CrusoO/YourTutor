solution_steps:
- en: 'Write the relation: in parallel the reciprocals add: 1/Rp = 1/R1 + 1/R2 + 1/R3.'
- en: 'Substitute: Rp = 1 / (1 / 60 + 1 / 30 + 1 / 20).'
- en: 'Calculate: Rp = 10 Ω.'
- en: So the total resistance is 10 Ω.
- en: The correct option is d.
