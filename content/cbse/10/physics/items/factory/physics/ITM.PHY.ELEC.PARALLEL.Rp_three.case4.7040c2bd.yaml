stem:
  en: 'Case: a student investigates resistors joined in parallel and records the following.
    The first resistor, R1, is 60 Ω, the second resistor, R2, is 30 Ω and the third
    resistor, R3, is 20 Ω. Find the combined resistance.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: in parallel the reciprocals add: 1/Rp = 1/R1 + 1/R2 + 1/R3.'
- level: 2
  en: The relation already gives the total resistance directly, so decide what to
    substitute.
- level: 3
  en: 'First step: write Rp = 1 / (1 / R1 + 1 / R2 + 1 / R3), where Rp is the total
    resistance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the total resistance have, and roughly
    how large is it?
