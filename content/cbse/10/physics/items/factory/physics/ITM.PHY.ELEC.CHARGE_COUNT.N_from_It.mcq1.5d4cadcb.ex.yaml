solution_steps:
- en: 'Write the relation: charge Q = I x t, and Q = N x e, so N = I x t / e.'
- en: 'Get the number of electrons alone: divide each side of Q = N x e by e.'
- en: 'Substitute: N = 1.6 x 10 / (1.6 x 10^-19).'
- en: 'Calculate: N = 1 x 10^20.'
- en: So the number of electrons is 1 x 10^20.
- en: The correct option is d.
