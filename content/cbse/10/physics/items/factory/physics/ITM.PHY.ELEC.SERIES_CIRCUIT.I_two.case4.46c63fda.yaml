stem:
  en: 'Case: a student investigates a battery connected to resistors in series and
    records the following. The battery gives 2.5 V, the first resistor, R1, is 2 Ω
    and the second resistor, R2, is 3 Ω. Find the current in the circuit.'
options:
- id: a
  en: 2.08 A
- id: b
  en: 1.25 A
- id: c
  en: 12.5 A
- id: d
  en: 0.5 A
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: the same current flows through every resistor in series:
    I = V / (R1 + R2).'
- en: 'Get the current alone: divide each side of V = I x (R1 + R2) by (R1 + R2).'
- en: 'Substitute: I = 2.5 / (2 + 3).'
- en: 'Calculate: I = 0.5 A.'
- en: So the current is 0.5 A.
- en: The correct option is d.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: the same current flows through every resistor in series: I = V / (R1
    + R2).'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of V
    = I x (R1 + R2) by (R1 + R2). Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write I = V / (R1 + R2), where I is the current, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
