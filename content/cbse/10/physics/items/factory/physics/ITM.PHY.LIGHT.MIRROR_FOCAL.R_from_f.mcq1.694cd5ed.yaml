stem:
  en: The focal length of the convex mirror, f, is 12 cm. Find the radius of curvature,
    with its sign.
options:
- id: a
  en: -24 cm
- id: b
  en: 12 cm
- id: c
  en: 2400 cm
- id: d
  en: 24 cm
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: the radius of curvature is twice the focal length: R =
    2f, with signs from the convention.'
- en: 'Put each quantity in SI units with its sign: f = 0.12 m.'
- en: 'Substitute: R = 2 x 0.12.'
- en: 'Calculate: R = 0.24 m.'
- en: 'Give it in cm: 24 cm.'
- en: So the radius of curvature is 24 cm.
- en: The correct option is d.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: the radius of curvature is twice the focal length: R = 2f, with signs
    from the convention.'
- level: 2
  en: The relation already gives the radius of curvature directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked. Give each distance its sign by the Cartesian convention before you
    substitute.
- level: 3
  en: 'First step: Write 12 cm as 0.12 m, then write R = 2 x f, where R is the radius
    of curvature, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the radius of curvature have, and roughly
    how large is it?
