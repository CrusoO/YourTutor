solution_steps:
- en: 'Write the relation: charge Q = I x t, and Q = N x e, so N = I x t / e.'
- en: 'Get the number of electrons alone: divide each side of Q = N x e by e.'
- en: 'Substitute: N = 0.4 x 2 / (1.6 x 10^-19).'
- en: 'Calculate: N = 5 x 10^18.'
- en: So the number of electrons is 5 x 10^18.
- en: The correct option is a.
