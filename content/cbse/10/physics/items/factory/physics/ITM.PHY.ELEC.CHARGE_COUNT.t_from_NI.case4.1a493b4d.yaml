difficulty: 0.75
type: mcq
pool: practice
role: transfer
stem:
  en: 'Case: a student investigates electrons passing a point in a wire and records
    the following. The number of electrons, N, is 1 x 10^19, the current, I, is 0.8
    A and the charge of one electron is 1.6 x 10^-19 C. How long does this many electrons
    take to pass?'
options:
- id: a
  en: 7.8125 x 10^37 s
- id: b
  en: 2 s
- id: c
  en: 0.5 s
- id: d
  en: 1.25 x 10^19 s
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: charge Q = N x e, and Q = I x t, so t = N x e / I.'
- en: 'Get the time alone: divide each side of I x t = N x e by I.'
- en: 'Substitute: t = (1 x 10^19) x (1.6 x 10^-19) / 0.8.'
- en: 'Calculate: t = 2 s.'
- en: So the time is 2 s.
- en: The correct option is b.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: charge Q = N x e, and Q = I x t, so t = N x e / I.'
- level: 2
  en: 'Get the time on its own before you put numbers in: divide each side of I x
    t = N x e by I. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write t = N x e / I, where t is the time, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the time have, and roughly how large
    is it?
