solution_steps:
- en: 'Write the relation: energy E = power P x time t.'
- en: 'Put each quantity in SI units: 0.3 kWh = 1.08 x 10^6 J.'
- en: 'Get the time alone: divide each side of E = P x t by P.'
- en: 'Substitute: t1 = (1.08 x 10^6) / 60.'
- en: 'Calculate: t1 = 18000 h.'
- en: 'Give it in h: 5 h.'
- en: So the time is 5 h.
- en: The correct option is d.
