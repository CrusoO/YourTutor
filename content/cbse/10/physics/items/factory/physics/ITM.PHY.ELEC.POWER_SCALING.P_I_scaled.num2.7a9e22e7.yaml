role: explain
stem:
  en: This question is about how power changes when a quantity changes. The current
    through a fixed resistor is halved. By what number is the power multiplied?
options:
- id: a
  en: '4'
- id: b
  en: '1'
- id: c
  en: '0.5'
- id: d
  en: '0.25'
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: for a fixed resistor P = I x I x R, so P changes with the
    square of I.'
- en: 'Combine the numbers: 0.5^2 = 0.25.'
- en: So the number the power is multiplied by is 0.25.
- en: The correct option is d.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: for a fixed resistor P = I x I x R, so P changes with the square
    of I.'
- level: 2
  en: The relation already gives the number the power is multiplied by directly, so
    decide what to substitute.
- level: 3
  en: 'First step: write down the number each quantity is multiplied by, using 2 for
    doubled and 1/2 for halved, then combine them using the relation.'
prediction_prompt:
  en: 'Think first: which quantities does the answer depend on, and does it grow or
    shrink?'
