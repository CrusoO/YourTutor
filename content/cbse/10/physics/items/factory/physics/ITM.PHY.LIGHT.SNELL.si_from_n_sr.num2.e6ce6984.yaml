stem:
  en: This question is about light entering a transparent medium from air. The refractive
    index of the medium, n, is 1.6 and the sine of the angle of refraction is 0.375.
    Find the sine of the angle of incidence.
options:
- id: a
  en: '4.27'
- id: b
  en: '0.234375'
- id: c
  en: '0.6'
- id: d
  en: '1.225'
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: from air into a medium, sin i = n x sin r.'
- en: 'Substitute: si = 1.6 x 0.375.'
- en: 'Calculate: si = 0.6.'
- en: So the sine of the angle of incidence is 0.6.
- en: The correct option is c.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: from air into a medium, sin i = n x sin r.'
- level: 2
  en: The relation already gives the sine of the angle of incidence directly, so decide
    what to substitute.
- level: 3
  en: 'First step: write si = n x sr, where si is the sine of the angle of incidence,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the sine of the angle of incidence
    be?
