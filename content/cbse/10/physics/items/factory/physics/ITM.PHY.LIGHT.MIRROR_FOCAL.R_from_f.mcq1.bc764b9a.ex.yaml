solution_steps:
- en: 'Write the relation: the radius of curvature is twice the focal length: R =
    2f, with signs from the convention.'
- en: 'Put each quantity in SI units with its sign: f = -0.12 m.'
- en: 'Substitute: R = 2 x (-0.12).'
- en: 'Calculate: R = -0.24 m.'
- en: 'Give it in cm: -24 cm.'
- en: So the radius of curvature is -24 cm.
- en: The correct option is a.
