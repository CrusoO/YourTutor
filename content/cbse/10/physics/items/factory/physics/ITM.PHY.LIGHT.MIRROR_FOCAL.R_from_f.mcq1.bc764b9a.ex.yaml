role: explain
stem:
  en: The focal length of the concave mirror, f, is 12 cm. Find the radius of curvature,
    with its sign. A classmate says the answer is 24 cm. Work it out yourself and
    choose the correct answer.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: the radius of curvature is twice the focal length: R = 2f, with
    signs from the convention.'
- level: 2
  en: The relation already gives the radius of curvature directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked. Give each distance its sign by the Cartesian convention before you
    substitute.
- level: 3
  en: 'First step: Write 12 cm as -0.12 m, then write R = 2 x f, where R is the radius
    of curvature, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the radius of curvature have, and roughly
    how large is it?
