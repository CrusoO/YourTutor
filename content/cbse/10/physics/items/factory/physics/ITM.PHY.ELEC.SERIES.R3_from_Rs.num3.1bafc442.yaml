stem:
  en: A student is studying resistors joined in series. The first resistor, R1, is
    5 Ω, the second resistor, R2, is 5 Ω and the total resistance, Rs, is 20 Ω. Find
    the third resistance.
options:
- id: a
  en: 30 Ω
- id: b
  en: 2 Ω
- id: c
  en: 500 Ω
- id: d
  en: 10 Ω
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: in series Rs = R1 + R2 + R3.'
- en: 'Get the third resistance alone: subtract R1 and R2 from each side of Rs = R1
    + R2 + R3.'
- en: 'Substitute: R3 = 20 - 5 - 5.'
- en: 'Calculate: R3 = 10 Ω.'
- en: So the third resistance is 10 Ω.
- en: The correct option is d.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: in series Rs = R1 + R2 + R3.'
- level: 2
  en: 'Get the third resistance on its own before you put numbers in: subtract R1
    and R2 from each side of Rs = R1 + R2 + R3. Do the same operation to each side
    of the formula.'
- level: 3
  en: 'First step: write R3 = Rs - R1 - R2, where R3 is the third resistance, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the third resistance have, and roughly
    how large is it?
