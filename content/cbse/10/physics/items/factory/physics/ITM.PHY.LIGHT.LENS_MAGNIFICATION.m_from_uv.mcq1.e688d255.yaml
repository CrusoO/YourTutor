role: procedure
stem:
  en: The object, u, is 40 cm from the convex lens and the image, which is real, is
    24 cm from the convex lens. Find the magnification, with its sign.
options:
- id: a
  en: '-1.67'
- id: b
  en: '1.67'
- id: c
  en: '-0.6'
- id: d
  en: '0.6'
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: magnification of a lens m = v / u.'
- en: 'Put each quantity in SI units with its sign: u = -0.4 m; v = 0.24 m.'
- en: 'Substitute: m = 0.24 / (-0.4).'
- en: 'Calculate: m = -0.6.'
- en: So the magnification is -0.6.
- en: The correct option is c.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: magnification of a lens m = v / u.'
- level: 2
  en: The relation already gives the magnification directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
    Give each distance its sign by the Cartesian convention before you substitute.
- level: 3
  en: 'First step: Write 40 cm as -0.4 m and 24 cm as 0.24 m, then write m = v / u,
    where m is the magnification, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the magnification be?
