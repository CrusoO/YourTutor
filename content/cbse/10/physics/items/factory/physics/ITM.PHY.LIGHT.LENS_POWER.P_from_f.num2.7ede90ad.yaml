solution_steps:
- en: 'Write the relation: power P = 1 / f, with f in metres and its sign from the
    convention.'
- en: 'Put each quantity in SI units with its sign: f = -0.125 m.'
- en: 'Substitute: P = 1 / (-0.125).'
- en: 'Calculate: P = -8 D.'
- en: So the power is -8 D.
