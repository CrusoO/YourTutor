- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: charge Q = current I x time t.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of Q
    = I x t by t. Do the same operation to each side of the formula.'
- level: 3
