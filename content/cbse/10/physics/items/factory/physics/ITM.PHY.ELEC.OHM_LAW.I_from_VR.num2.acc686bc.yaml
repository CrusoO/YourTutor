stem:
  en: This question is about a resistor in a circuit. The potential difference across
    it, V, is 0.5 V and its resistance, R, is 10 Ω. Find the current through the resistor.
options:
- id: a
  en: 5000 mA
- id: b
  en: 20000 mA
- id: c
  en: 50 mA
- id: d
  en: 50000 mA
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: V = I x R.'
- en: 'Get the current alone: divide each side of V = I x R by R.'
- en: 'Substitute: I = 0.5 / 10.'
- en: 'Calculate: I = 0.05 A.'
- en: 'Give it in mA: 50 mA.'
- en: So the current is 50 mA.
- en: The correct option is c.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: V = I x R.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of V
    = I x R by R. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: write I = V / R, where I is the current, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
