solution_steps:
- en: 'Write the relation: V = I x R.'
- en: 'Put each quantity in SI units: 0.25 mA = 2.5 x 10^-4 A.'
- en: 'Get the resistance alone: divide each side of V = I x R by I.'
- en: 'Substitute: R = 6.25 / (2.5 x 10^-4).'
- en: 'Calculate: R = 25000 Ω.'
- en: 'Give it in kΩ: 25 kΩ.'
- en: So the resistance is 25 kΩ.
- en: The correct option is b.
