stem:
  en: The potential difference across it, V, is 6.25 V and the current through it,
    I, is 0.25 mA. Find the resistance of the resistor.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: V = I x R.'
- level: 2
  en: 'Get the resistance on its own before you put numbers in: divide each side of
    V = I x R by I. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 0.25 mA as 2.5 x 10^-4 A, then write R = V / I, where R is
    the resistance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the resistance have, and roughly how
    large is it?
