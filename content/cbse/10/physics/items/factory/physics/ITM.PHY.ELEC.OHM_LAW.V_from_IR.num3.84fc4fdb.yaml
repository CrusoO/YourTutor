stem:
  en: A student is studying a resistor in a circuit. The current through it, I, is
    50 mA and its resistance, R, is 5 Ω. Find the potential difference across the
    resistor.
options:
- id: a
  en: 5.05 V
- id: b
  en: 250 V
- id: c
  en: 0.25 V
- id: d
  en: 0.01 V
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: V = I x R.'
- en: 'Put each quantity in SI units: 50 mA = 0.05 A.'
- en: 'Substitute: V = 0.05 x 5.'
- en: 'Calculate: V = 0.25 V.'
- en: So the potential difference is 0.25 V.
- en: The correct option is c.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: V = I x R.'
- level: 2
  en: The relation already gives the potential difference directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 50 mA as 0.05 A, then write V = I x R, where V is the potential
    difference, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference have, and roughly
    how large is it?
