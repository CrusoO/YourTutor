role: transfer
stem:
  en: 'Case: a student investigates the magnification of a thin lens and records the
    following. The object, u, is 15 cm from the convex lens, the image, which is virtual,
    is 30 cm from the convex lens and the object, h, is 2 cm tall. Find the height
    of the image, with its sign.'
options:
- id: a
  en: 1 cm
- id: b
  en: -1 cm
- id: c
  en: -4 cm
- id: d
  en: 4 cm
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: m = v / u and m = image height / object height.'
- en: 'Put each quantity in SI units with its sign: u = -0.15 m; v = -0.3 m; h = 0.02
    m.'
- en: 'Get the image height alone: multiply each side of m = hi / h by h.'
- en: 'Substitute: hi = (-0.3) x 0.02 / (-0.15).'
- en: 'Calculate: hi = 0.04 m.'
- en: 'Give it in cm: 4 cm.'
- en: So the image height is 4 cm.
- en: The correct option is d.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: m = v / u and m = image height / object height.'
- level: 2
  en: 'Get the image height on its own before you put numbers in: multiply each side
    of m = hi / h by h. Do the same operation to each side of the formula. Change
    every quantity to SI units first, and change back at the end if asked. Give each
    distance its sign by the Cartesian convention before you substitute.'
- level: 3
  en: 'First step: Write 15 cm as -0.15 m, 30 cm as -0.3 m and 2 cm as 0.02 m, then
    write hi = v x h / u, where hi is the image height, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the image height have, and roughly how
    large is it?
