solution_steps:
- en: 'Write the relation: heat H = I x I x R x t.'
- en: 'Put each quantity in SI units: 2 min = 120 s.'
- en: 'Get the current alone: divide each side of H = I x I x R x t by R x t, then
    take the square root of each side.'
- en: 'Substitute: I = sqrt(300000 / 100 / 120).'
- en: 'Calculate: I = 5 A.'
- en: So the current is 5 A.
