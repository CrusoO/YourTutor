stem:
  en: 'Case: a student investigates the heat produced by a current and records the
    following. The heat produced, H, is 300000 J, the resistance, R, is 100 Ω and
    the time, t, is 2 min. Find the current.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: heat H = I x I x R x t.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of H
    = I x I x R x t by R x t, then take the square root of each side. Do the same
    operation to each side of the formula. Change every quantity to SI units first,
    and change back at the end if asked.'
- level: 3
  en: 'First step: Write 2 min as 120 s, then write I = sqrt(H / R / t), where I is
    the current, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
