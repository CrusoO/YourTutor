stem:
  en: The potential difference across a fixed resistor is tripled. By what number
    is the power multiplied? A classmate says the answer is 3. Work it out yourself
    and choose the correct answer.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: for a fixed resistor P = V x V / R, so P changes with the square of
    V.'
- level: 2
  en: The relation already gives the number the power is multiplied by directly, so
    decide what to substitute.
- level: 3
  en: 'First step: write down the number each quantity is multiplied by, using 2 for
    doubled and 1/2 for halved, then combine them using the relation.'
prediction_prompt:
  en: 'Think first: which quantities does the answer depend on, and does it grow or
    shrink?'
