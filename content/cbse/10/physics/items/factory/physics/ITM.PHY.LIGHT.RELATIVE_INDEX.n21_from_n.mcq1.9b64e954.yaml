stem:
  en: The first medium has refractive index 1.25 and the second medium has refractive
    index 1.5. Find the refractive index of the second medium relative to the first.
options:
- id: a
  en: '0.25'
- id: b
  en: '1.875'
- id: c
  en: '1.2'
- id: d
  en: '0.833'
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Write the relation: relative refractive index of medium 2 with respect to medium
    1: n21 = n2 / n1.'
- en: 'Substitute: n21 = 1.5 / 1.25.'
- en: 'Calculate: n21 = 1.2.'
- en: So the refractive index of the second medium relative to the first is 1.2.
- en: The correct option is c.
hints:
