stem:
  en: This question is about a resistor in a circuit. The current through it, I, is
    0.25 mA and its resistance, R, is 100 kΩ. Find the potential difference across
    the resistor.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: V = I x R.'
- level: 2
  en: The relation already gives the potential difference directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 0.25 mA as 2.5 x 10^-4 A and 100 kΩ as 100000 Ω, then write
    V = I x R, where V is the potential difference, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference have, and roughly
    how large is it?
