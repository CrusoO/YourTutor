solution_steps:
- en: 'Write the relation: V = I x R.'
- en: 'Put each quantity in SI units: 0.25 mA = 2.5 x 10^-4 A; 100 kΩ = 100000 Ω.'
- en: 'Substitute: V = (2.5 x 10^-4) x 100000.'
- en: 'Calculate: V = 25 V.'
- en: So the potential difference is 25 V.
