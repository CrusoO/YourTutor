solution_steps:
- en: 'Write the relation: from air into a medium, sin i = n x sin r.'
- en: 'Get the sine of the angle of refraction alone: divide each side of sin i =
    n x sin r by n.'
- en: 'Substitute: sr = 0.8 / 2.'
- en: 'Calculate: sr = 0.4.'
- en: So the sine of the angle of refraction is 0.4.
