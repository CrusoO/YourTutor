stem:
  en: The potential difference across it, V, is 20 V and its resistance, R, is 4 Ω.
    Find the current through the resistor.
options:
- id: a
  en: 80 A
- id: b
  en: 16 A
- id: c
  en: 0.2 A
- id: d
  en: 5 A
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: V = I x R.'
- en: 'Get the current alone: divide each side of V = I x R by R.'
- en: 'Substitute: I = 20 / 4.'
- en: 'Calculate: I = 5 A.'
- en: So the current is 5 A.
- en: The correct option is d.
