solution_steps:
- en: 'Write the relation: energy E = power P x time t; 1 kWh = 1000 W for 1 hour.'
- en: 'Substitute: E1 = 40 x 28800.'
- en: 'Calculate: E1 = 1.152 x 10^6 J.'
- en: 'Give it in kWh: 0.32 kWh.'
- en: So the energy is 0.32 kWh.
- en: The correct option is c.
