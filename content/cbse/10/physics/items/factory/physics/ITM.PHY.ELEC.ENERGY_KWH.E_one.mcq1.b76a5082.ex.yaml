stem:
  en: The power rating of the first appliance, P1, is 40 W and the time it is used
    each day, t1, is 8 h. How much electrical energy is used, in kWh? A classmate
    says the answer is 0.04 kWh. Work it out yourself and choose the correct answer.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: energy E = power P x time t; 1 kWh = 1000 W for 1 hour.'
- level: 2
  en: The relation already gives the energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: write E1 = P1 x t1, where E1 is the energy, with the values in
    place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the energy have, and roughly how large
    is it?
