stem:
  en: This question is about electrons passing a point in a wire. The number of electrons,
    N, is 1.5 x 10^19, the current, I, is 2.4 A and the charge of one electron is
    1.6 x 10^-19 C. How long does this many electrons take to pass?
options:
- id: a
  en: 6.25 x 10^18 s
- id: b
  en: 1 s
- id: c
  en: 10 s
- id: d
  en: 3.90625 x 10^37 s
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: charge Q = N x e, and Q = I x t, so t = N x e / I.'
- en: 'Get the time alone: divide each side of I x t = N x e by I.'
- en: 'Substitute: t = (1.5 x 10^19) x (1.6 x 10^-19) / 2.4.'
- en: 'Calculate: t = 1 s.'
- en: So the time is 1 s.
- en: The correct option is b.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: charge Q = N x e, and Q = I x t, so t = N x e / I.'
- level: 2
  en: 'Get the time on its own before you put numbers in: divide each side of I x
    t = N x e by I. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write t = N x e / I, where t is the time, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the time have, and roughly how large
    is it?
