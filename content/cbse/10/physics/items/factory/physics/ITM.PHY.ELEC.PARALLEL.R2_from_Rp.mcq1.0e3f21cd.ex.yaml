solution_steps:
- en: 'Write the relation: 1/Rp = 1/R1 + 1/R2.'
- en: 'Get the second resistance alone: subtract 1/R1 from each side of 1/Rp = 1/R1
    + 1/R2, then take the reciprocal of each side.'
- en: 'Substitute: R2 = 1 / (1 / 6 - 1 / 9).'
- en: 'Calculate: R2 = 18 Ω.'
