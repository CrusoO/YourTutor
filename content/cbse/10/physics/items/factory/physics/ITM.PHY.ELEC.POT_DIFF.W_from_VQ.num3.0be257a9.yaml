difficulty: 0.6
type: mcq
pool: practice
role: apply
stem:
  en: A student is studying work done in moving charge. The potential difference,
    V, is 6 V and the charge moved, Q, is 2 C. How much work is done?
options:
- id: a
  en: 8 J
- id: b
  en: 12 J
- id: c
  en: 3 J
- id: d
  en: 0.333 J
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Write the relation: V = W / Q, so W = V x Q.'
- en: 'Get the work done alone: multiply each side of V = W / Q by Q.'
- en: 'Substitute: W = 6 x 2.'
- en: 'Calculate: W = 12 J.'
- en: So the work done is 12 J.
- en: The correct option is b.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: V = W / Q, so W = V x Q.'
- level: 2
  en: 'Get the work done on its own before you put numbers in: multiply each side
    of V = W / Q by Q. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write W = V x Q, where W is the work done, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the work done have, and roughly how large
    is it?
