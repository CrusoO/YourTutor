stem:
  en: This question is about light passing from one medium into another. The second
    medium relative to the first has refractive index 0.625 and the first medium has
    refractive index 2.4. Find the refractive index of the second medium.
options:
- id: a
  en: '3.025'
- id: b
  en: '3.84'
- id: c
  en: '0.26'
- id: d
  en: '1.5'
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: n21 = n2 / n1.'
- en: 'Get the refractive index of the second medium alone: multiply each side of
    n21 = n2 / n1 by n1.'
- en: 'Substitute: n2 = 0.625 x 2.4.'
- en: 'Calculate: n2 = 1.5.'
- en: So the refractive index of the second medium is 1.5.
- en: The correct option is d.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: n21 = n2 / n1.'
- level: 2
  en: 'Get the refractive index of the second medium on its own before you put numbers
    in: multiply each side of n21 = n2 / n1 by n1. Do the same operation to each side
    of the formula.'
- level: 3
  en: 'First step: write n2 = n21 x n1, where n2 is the refractive index of the second
    medium, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the refractive index of the second
    medium be?
