solution_steps:
- en: 'Write the relation: in parallel the reciprocals add: 1/Rp = 1/R1 + 1/R2.'
- en: 'Substitute: Rp = 30 x 20 / (30 + 20).'
- en: 'Calculate: Rp = 12 Ω.'
- en: So the total resistance is 12 Ω.
