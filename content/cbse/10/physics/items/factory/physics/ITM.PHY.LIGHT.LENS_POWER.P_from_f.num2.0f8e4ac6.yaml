stem:
  en: This question is about the power of a lens. The focal length of the convex lens,
    f, is 12.5 cm. Find the power of the lens in dioptres, with its sign.
options:
- id: a
  en: 0.08 D
- id: b
  en: -8 D
- id: c
  en: 0.125 D
- id: d
  en: 8 D
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Write the relation: power P = 1 / f, with f in metres and its sign from the
    convention.'
- en: 'Put each quantity in SI units with its sign: f = 0.125 m.'
- en: 'Substitute: P = 1 / 0.125.'
- en: 'Calculate: P = 8 D.'
- en: So the power is 8 D.
- en: The correct option is d.
hints:
