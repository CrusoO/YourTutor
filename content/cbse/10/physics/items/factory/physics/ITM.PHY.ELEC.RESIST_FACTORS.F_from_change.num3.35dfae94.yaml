stem:
  en: A student is studying how a wire's resistance changes. A uniform wire is stretched
    evenly to 4 times its original length, so its volume stays the same. By what number
    is the resistance multiplied?
options:
- id: a
  en: '0.0625'
- id: b
  en: '2'
- id: c
  en: '16'
- id: d
  en: '4'
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Plan: R is proportional to length and inversely proportional to area, so the
    new resistance divided by the old one equals the length factor divided by the
    area factor.'
- en: 'Combine the numbers: 4 / 0.25 = 16.'
- en: So the number the resistance is multiplied by is 16.
- en: The correct option is c.
hints:
- level: 1
