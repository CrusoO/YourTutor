solution_steps:
- en: 'Write the relation: mirror formula 1/v + 1/u = 1/f, with v and f signed by
    the convention.'
- en: 'Put each quantity in SI units with its sign: v = 0.08 m; f = 0.12 m.'
- en: 'Get the object distance alone: subtract 1/v from each side of 1/v + 1/u = 1/f,
    then take the reciprocal of each side.'
- en: 'Substitute: u = 0.08 x 0.12 / (0.08 - 0.12).'
- en: 'Calculate: u = -0.24 m.'
- en: 'Give it in cm: -24 cm.'
- en: So the object distance is -24 cm.
- en: The correct option is d.
