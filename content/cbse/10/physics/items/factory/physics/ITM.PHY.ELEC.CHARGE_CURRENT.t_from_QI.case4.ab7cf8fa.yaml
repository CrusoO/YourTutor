stem:
  en: 'Case: a student investigates charge flowing in a wire and records the following.
    The charge, Q, is 20 C and the current, I, is 2 A. For how long does the current
    flow?'
options:
- id: a
  en: 10 s
- id: b
  en: 18 s
- id: c
  en: 40 s
- id: d
  en: 0.1 s
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: charge Q = current I x time t.'
- en: 'Get the time alone: divide each side of Q = I x t by I.'
- en: 'Substitute: t = 20 / 2.'
- en: 'Calculate: t = 10 s.'
- en: So the time is 10 s.
- en: The correct option is a.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: charge Q = current I x time t.'
- level: 2
  en: 'Get the time on its own before you put numbers in: divide each side of Q =
    I x t by I. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write t = Q / I, where t is the time, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the time have, and roughly how large
    is it?
