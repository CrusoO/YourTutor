solution_steps:
- en: 'Write the relation: V = I x R.'
- en: 'Get the current alone: divide each side of V = I x R by R.'
- en: 'Substitute: I = 200 / 100.'
- en: 'Calculate: I = 2 A.'
- en: So the current is 2 A.
- en: The correct option is b.
