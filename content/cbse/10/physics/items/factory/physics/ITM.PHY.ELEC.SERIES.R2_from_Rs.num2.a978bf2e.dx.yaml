stem:
  en: This question is about resistors joined in series. The first resistor, R1, is
    2 Ω and the total resistance, Rs, is 5 Ω. Find the second resistance.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: in series Rs = R1 + R2.'
- level: 2
  en: 'Get the second resistance on its own before you put numbers in: subtract R1
    from each side of Rs = R1 + R2. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write R2 = Rs - R1, where R2 is the second resistance, with the
    values in place, one quantity at a time.'
