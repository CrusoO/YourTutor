stem:
  en: A student is studying light entering a transparent medium from air. The refractive
    index of the medium, n, is 1.25 and the sine of the angle of refraction is 0.4.
    Find the sine of the angle of incidence.
options:
- id: a
  en: '0.5'
- id: b
  en: '3.125'
- id: c
  en: '0.32'
- id: d
  en: '0.85'
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Write the relation: from air into a medium, sin i = n x sin r.'
- en: 'Substitute: si = 1.25 x 0.4.'
- en: 'Calculate: si = 0.5.'
- en: So the sine of the angle of incidence is 0.5.
- en: The correct option is a.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: from air into a medium, sin i = n x sin r.'
- level: 2
  en: The relation already gives the sine of the angle of incidence directly, so decide
    what to substitute.
- level: 3
  en: 'First step: write si = n x sr, where si is the sine of the angle of incidence,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the sine of the angle of incidence
    be?
