solution_steps:
- en: 'Write the relation: P = I x I x R.'
- en: 'Get the current alone: divide each side of P = I x I x R by R, then take the
    square root of each side.'
- en: 'Substitute: I = sqrt(3 / 12).'
- en: 'Calculate: I = 0.5 A.'
- en: So the current is 0.5 A.
