stem:
  en: A student is studying an electrical appliance. Its power, P, is 3 W and its
    resistance, R, is 12 Ω. Find the current.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: P = I x I x R.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of P
    = I x I x R by R, then take the square root of each side. Do the same operation
    to each side of the formula.'
- level: 3
  en: 'First step: write I = sqrt(P / R), where I is the current, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
