solution_steps:
- en: 'Write the relation: magnification of a mirror m = -v / u.'
- en: 'Put each quantity in SI units with its sign: u = -0.4 m; v = -0.24 m.'
- en: 'Substitute: m = -(-0.24) / (-0.4).'
- en: 'Calculate: m = -0.6.'
- en: So the magnification is -0.6.
