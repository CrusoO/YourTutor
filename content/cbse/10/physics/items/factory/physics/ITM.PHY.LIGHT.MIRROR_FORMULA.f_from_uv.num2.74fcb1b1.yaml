solution_steps:
- en: 'Write the relation: mirror formula 1/v + 1/u = 1/f, with u and v signed by
    the convention.'
- en: 'Put each quantity in SI units with its sign: u = -0.3 m; v = -1.5 m.'
- en: 'Get the focal length alone: add 1/v and 1/u, then take the reciprocal of each
    side of 1/f = 1/v + 1/u.'
- en: 'Substitute: f = (-0.3) x (-1.5) / ((-0.3) + (-1.5)).'
- en: 'Calculate: f = -0.25 m.'
- en: 'Give it in cm: -25 cm.'
- en: So the focal length is -25 cm.
- en: The correct option is d.
