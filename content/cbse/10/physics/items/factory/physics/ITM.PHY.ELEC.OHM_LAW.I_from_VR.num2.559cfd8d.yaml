solution_steps:
- en: 'Write the relation: V = I x R.'
- en: 'Put each quantity in SI units: 100 kΩ = 100000 Ω.'
- en: 'Get the current alone: divide each side of V = I x R by R.'
- en: 'Substitute: I = 200 / 100000.'
- en: 'Calculate: I = 0.002 A.'
- en: 'Give it in mA: 2 mA.'
- en: So the current is 2 mA.
- en: The correct option is a.
