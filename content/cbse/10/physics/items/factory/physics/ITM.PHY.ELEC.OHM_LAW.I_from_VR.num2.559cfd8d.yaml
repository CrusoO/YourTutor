stem:
  en: This question is about a resistor in a circuit. The potential difference across
    it, V, is 200 V and its resistance, R, is 100 kΩ. Find the current through the
    resistor.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: V = I x R.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of V
    = I x R by R. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 100 kΩ as 100000 Ω, then write I = V / R, where I is the
    current, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
