stem:
  en: A student is studying a battery connected to resistors in series. The battery
    gives 2 V, the first resistor, R1, is 2 Ω, the second resistor, R2, is 3 Ω and
    the third resistor, R3, is 5 Ω. Find the current in the circuit.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Plan the steps: the
    same current flows through every resistor in series.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of V
    = I x (R1 + R2 + R3) by (R1 + R2 + R3). Do the same operation to each side of
    the formula.'
- level: 3
  en: 'First step: write I = V / (R1 + R2 + R3), where I is the current, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
