solution_steps:
- en: 'Plan: the same current flows through every resistor in series.'
- en: 'Get the current alone: divide each side of V = I x (R1 + R2 + R3) by (R1 +
    R2 + R3).'
- en: 'Substitute: I = 2 / (2 + 3 + 5).'
- en: 'Calculate: I = 0.2 A.'
- en: So the current is 0.2 A.
- en: The correct option is b.
