stem:
  en: The focal length of the concave lens, f, is 20 cm. Find the power of the lens
    in dioptres, with its sign.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: power P = 1 / f, with f in metres and its sign from the convention.'
- level: 2
  en: The relation already gives the power directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
    Give each distance its sign by the Cartesian convention before you substitute.
- level: 3
  en: 'First step: Write 20 cm as -0.2 m, then write P = 1 / f, where P is the power,
    with the values in place, one quantity at a time.'
