solution_steps:
- en: 'Write the relation: V = I x R.'
- en: 'Put each quantity in SI units: 2 kΩ = 2000 Ω.'
- en: 'Get the current alone: divide each side of V = I x R by R.'
- en: 'Substitute: I = 10 / 2000.'
- en: 'Calculate: I = 0.005 A.'
- en: 'Give it in mA: 5 mA.'
- en: So the current is 5 mA.
- en: The correct option is b.
