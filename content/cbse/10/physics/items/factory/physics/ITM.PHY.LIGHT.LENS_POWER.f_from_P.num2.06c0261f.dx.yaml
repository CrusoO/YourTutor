solution_steps:
- en: 'Write the relation: power P = 1 / f, so f = 1 / P in metres.'
- en: 'Put each quantity in SI units with its sign: P = 5 D.'
- en: 'Get the focal length alone: multiply each side of P = 1 / f by f, then divide
    each side by P.'
- en: 'Substitute: f = 1 / 5.'
- en: 'Calculate: f = 0.2 m.'
- en: 'Give it in cm: 20 cm.'
- en: So the focal length is 20 cm.
- en: The correct option is a.
