stem:
  en: Look at the balanced equation Zn + 2 AgNO3 → Zn(NO3)2 + 2 Ag. Which type of
    reaction is this?
hints:
- level: 1
  en: Count how many substances are on the left of the arrow and how many are on the
    right.
- level: 2
  en: Check whether each substance is a single element or a compound made of more
    than one element.
- level: 3
  en: 'Ask what happens to the partners: do substances join, split, or does one element
    replace another?'
prediction_prompt:
  en: Before you decide, how many substances join or split in this reaction?
