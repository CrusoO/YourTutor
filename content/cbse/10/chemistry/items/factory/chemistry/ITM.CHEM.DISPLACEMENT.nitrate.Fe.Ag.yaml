difficulty: 0.41
pool: practice
role: apply
stem:
  en: Iron metal is added to silver nitrate solution. Which statement is correct?
hints:
- level: 1
  en: A more reactive metal can push a less reactive metal out of its salt solution.
    Look at the order of reactivity.
- level: 2
  en: Find the metal that is added and the metal that is already in the solution,
    and compare their places in the reactivity series.
- level: 3
  en: The metal that is added must be higher in the series than the metal in the solution
    for a reaction to happen.
prediction_prompt:
  en: Before you decide, which of the two metals do you think is more reactive?
