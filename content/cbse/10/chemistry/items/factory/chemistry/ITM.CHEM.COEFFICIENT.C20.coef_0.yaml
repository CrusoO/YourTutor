stem:
  en: When Al + Cl2 → AlCl3 is balanced with the smallest whole-number coefficients,
    what is the coefficient of Al?
hints:
- level: 1
  en: Balance the whole reaction first by counting the atoms of every element on the
    left and on the right.
- level: 2
  en: Only the numbers in front of formulas may change. The small numbers inside a
    formula stay as they are.
- level: 3
  en: After balancing, read the number written in front of Al. A formula with no number
    in front has coefficient 1.
prediction_prompt:
  en: Before you balance it, is the number you want more likely to be 1 or bigger
    than 1?
