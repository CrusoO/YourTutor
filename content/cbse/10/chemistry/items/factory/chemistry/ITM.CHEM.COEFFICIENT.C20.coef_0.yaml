solution_steps:
- en: 'Count atoms in Al + Cl2 → AlCl3: for Cl there are 2 on the left and 3 on the
    right, so it needs balancing.'
- en: Choose whole-number coefficients that give every element the same count on both
    sides, using the smallest numbers possible.
- en: The balanced equation is 2 Al + 3 Cl2 → 2 AlCl3.
- en: Read the coefficient of Al.
- en: The correct option is c.
