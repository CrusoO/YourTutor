difficulty: 0.36
pool: practice
role: procedure
stem:
  en: The hydrogen ion concentration of a solution is 1 x 10^-4 mol/L. What is the
    pH of the solution?
hints:
- level: 1
  en: pH is found from the power of ten of the hydrogen ion concentration. Look at
    the small raised number only.
- level: 2
  en: The pH is a positive number for these solutions, so think about what the minus
    sign in the power does.
- level: 3
  en: Write the concentration as 1 x 10 to a power. Ignore the minus sign of the power
    to get the pH.
prediction_prompt:
  en: Before you work it out, is the answer a small or a large number, and is it positive
    or negative?
