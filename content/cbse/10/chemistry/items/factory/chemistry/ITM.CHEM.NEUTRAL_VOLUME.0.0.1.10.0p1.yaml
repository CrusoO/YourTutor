solution_steps:
- en: Moles of hydrochloric acid = 1 x 10/1000 mol; each unit gives 1 hydrogen ion(s).
- en: Each unit of sodium hydroxide gives 1 hydroxide ion(s).
- en: 1 x 1 x 10 = 1 x 0.1 x V, so V = 100 mL.
- en: The correct option is a.
