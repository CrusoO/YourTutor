stem:
  en: What is the correct formula of calcium oxide?
hints:
- level: 1
  en: An ionic compound has no overall charge, so the positive and negative charges
    must cancel.
- level: 2
  en: Write the charge of each ion. Use as many of each ion as it takes for the total
    positive charge to equal the total negative charge.
- level: 3
  en: Swap the charge numbers to find the counts, then divide both by their common
    factor. Use a bracket round a group of atoms that appears more than once.
prediction_prompt:
  en: Before you write it, will the formula need a subscript on either ion?
