solution_steps:
- en: The left side has 2 substance(s) and the right side has 2.
- en: Look at whether each formula is one element or a compound, and at how the elements
    are rearranged.
- en: Here two compounds swap partners to make two new compounds, so it is a double
    displacement reaction.
- en: The correct option is a.
