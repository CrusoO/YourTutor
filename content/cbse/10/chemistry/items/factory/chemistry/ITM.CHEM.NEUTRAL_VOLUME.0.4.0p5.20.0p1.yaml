solution_steps:
- en: Moles of hydrochloric acid = 0.5 x 20/1000 mol; each unit gives 1 hydrogen ion(s).
- en: Each unit of barium hydroxide gives 2 hydroxide ion(s).
- en: 1 x 0.5 x 20 = 2 x 0.1 x V, so V = 50 mL.
- en: The correct option is b.
