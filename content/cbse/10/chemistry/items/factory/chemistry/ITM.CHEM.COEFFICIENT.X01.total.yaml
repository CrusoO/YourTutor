solution_steps:
- en: 'Count atoms in Na2SO4 + BaCl2 → BaSO4 + NaCl: for Cl there are 2 on the left
    and 1 on the right, so it needs balancing.'
- en: Choose whole-number coefficients that give every element the same count on both
    sides, using the smallest numbers possible.
- en: The balanced equation is Na2SO4 + BaCl2 → BaSO4 + 2 NaCl.
- en: Read the sum of all coefficients.
- en: The correct option is b.
