solution_steps:
- en: The positive ion comes from the base (magnesium, charge 2+) and the negative
    ion from the acid (sulphate, charge 2-).
- en: 'Swap the charge numbers and reduce: 1 of the positive ion and 1 of the negative
    ion.'
- en: The salt is MgSO4, and the balanced equation is H2SO4 + Mg(OH)2 → MgSO4 + 2
    H2O.
- en: The correct option is b.
