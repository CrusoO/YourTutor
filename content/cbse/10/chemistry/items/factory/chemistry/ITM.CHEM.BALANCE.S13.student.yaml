solution_steps:
- en: 'Count the atoms of each element in Br2 + KI → KBr + I2: for Br there are 2
    on the left and 1 on the right, so the equation is not balanced.'
- en: Choose whole-number coefficients (the numbers written in front of the formulas)
    so that every element has the same count on both sides. Do not change the small
    numbers inside a formula.
- en: Check each element again with the balanced equation Br2 + 2 KI → 2 KBr + I2.
- en: The correct option is d.
