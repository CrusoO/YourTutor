stem:
  en: A solution has pH 5. What is its hydroxide ion concentration at room temperature?
hints:
- level: 1
  en: First find the pOH from the pH, then turn the pOH into a power of ten.
- level: 2
  en: pH and pOH add up to a fixed number at room temperature. The hydroxide concentration
    is 1 x 10 to minus pOH.
- level: 3
  en: Subtract the pH from the fixed total to get the pOH, then write the concentration
    with that power.
prediction_prompt:
  en: Before you work it out, is the answer a small or a large number, and is it positive
    or negative?
