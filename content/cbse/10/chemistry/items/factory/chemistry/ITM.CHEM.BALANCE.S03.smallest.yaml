  author: app.factory
type: mcq
options:
- id: a
  en: Zn + 2 HCl → ZnCl2 + H2
- id: b
  en: Zn + 2 HCl → 2 ZnCl2 + H2
- id: c
  en: 2 Zn + 4 HCl → 2 ZnCl2 + 2 H2
- id: d
  en: Zn + 2 HCl → ZnCl2 + 2 H2
answer:
  sympy: a
  accept: []
misconception_rules:
- id: CHEM.MC.BAL.ONE_COEFFICIENT_OFF
  when_answer_equals:
  - b
  - d
- id: CHEM.MC.BAL.NOT_SMALLEST
  when_answer_equals:
  - c
solution_steps:
- en: 'Count the atoms of each element in Zn + HCl → ZnCl2 + H2: for Cl there are
    1 on the left and 2 on the right, so the equation is not balanced.'
- en: Choose whole-number coefficients (the numbers written in front of the formulas)
    so that every element has the same count on both sides. Do not change the small
    numbers inside a formula.
- en: Check each element again with the balanced equation Zn + 2 HCl → ZnCl2 + H2.
- en: The correct option is a.
