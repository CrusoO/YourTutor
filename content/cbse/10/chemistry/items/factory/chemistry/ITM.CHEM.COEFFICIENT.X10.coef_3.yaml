solution_steps:
- en: 'Count atoms in BaCl2 + H2SO4 → BaSO4 + HCl: for Cl there are 2 on the left
    and 1 on the right, so it needs balancing.'
- en: Choose whole-number coefficients that give every element the same count on both
    sides, using the smallest numbers possible.
- en: The balanced equation is BaCl2 + H2SO4 → BaSO4 + 2 HCl.
- en: Read the coefficient of HCl.
