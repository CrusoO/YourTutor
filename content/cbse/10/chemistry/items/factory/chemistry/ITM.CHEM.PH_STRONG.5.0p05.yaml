solution_steps:
- en: One unit of calcium hydroxide gives 2 hydroxide ion(s), so the hydroxide ion
    concentration is 0.05 x 2 = 1/10 mol/L.
- en: That is 1 x 10^-1 mol/L, so the pOH is 1.
- en: pH = 14 - 1 = 13.
- en: The correct option is b.
