solution_steps:
- en: The two pH values differ by 7 - 2 = 5.
- en: Each pH unit is a factor of 10 in concentration, so the factor is 10^5 = 100000.
- en: The solution with the smaller pH has the larger hydrogen ion concentration.
- en: The correct option is c.
