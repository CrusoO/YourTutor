solution_steps:
- en: Moles of nitric acid = 1 x 25/1000 mol; each unit gives 1 hydrogen ion(s).
- en: Each unit of magnesium hydroxide gives 2 hydroxide ion(s).
- en: 1 x 1 x 25 = 2 x 0.1 x V, so V = 125 mL.
- en: The correct option is c.
