stem:
  en: 25 mL of 1 mol/L nitric acid is exactly neutralised by a solution of magnesium
    hydroxide of concentration 0.1 mol/L. What volume of the magnesium hydroxide solution
    is needed?
hints:
- level: 1
  en: At the point of exact neutralisation, the number of moles of hydrogen ions equals
    the number of moles of hydroxide ions.
- level: 2
  en: Moles of a substance = concentration x volume. Count how many hydrogen ions
    one acid unit gives and how many hydroxide ions one base unit gives.
- level: 3
  en: 'Write: hydrogen ions per acid unit times acid moles equals hydroxide ions per
    base unit times base moles, then solve for the base volume.'
prediction_prompt:
  en: Before you calculate, will you need more or less base solution than the volume
    of acid?
