options:
- id: a
  en: 4 Al + 6 CuSO4 → 2 Al2(SO4)3 + 6 Cu
- id: b
  en: 2 Al + 3 CuSO4 → 2 Al2(SO4)3 + 3 Cu
- id: c
  en: 2 Al + 3 CuSO4 → Al2(SO4)3 + 4 Cu
- id: d
  en: 2 Al + 3 CuSO4 → Al2(SO4)3 + 3 Cu
answer:
  sympy: d
  accept: []
misconception_rules:
- id: CHEM.MC.BAL.NOT_SMALLEST
  when_answer_equals:
  - a
- id: CHEM.MC.BAL.ONE_COEFFICIENT_OFF
  when_answer_equals:
  - b
  - c
solution_steps:
- en: 'Count the atoms of each element in Al + CuSO4 → Al2(SO4)3 + Cu: for Al there
    are 1 on the left and 2 on the right, so the equation is not balanced.'
- en: Choose whole-number coefficients (the numbers written in front of the formulas)
    so that every element has the same count on both sides. Do not change the small
    numbers inside a formula.
- en: Check each element again with the balanced equation 2 Al + 3 CuSO4 → Al2(SO4)3
    + 3 Cu.
- en: The correct option is d.
