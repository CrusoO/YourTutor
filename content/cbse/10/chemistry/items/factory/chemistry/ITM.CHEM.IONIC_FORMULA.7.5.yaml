solution_steps:
- en: The copper(2+) ion has charge 2+ and the hydroxide ion has charge 1-.
- en: 'To cancel the charges, take 1 of the first ion and 2 of the second: 1 x 2 =
    2 x 1.'
- en: The formula is Cu(OH)2.
- en: The correct option is b.
