options:
- id: a
  en: 2 NaHCO3 → Na2CO3 + H2O + 2 CO2
- id: b
  en: 4 NaHCO3 → 2 Na2CO3 + 2 H2O + 2 CO2
- id: c
  en: 2 NaHCO3 → Na2CO3 + 2 H2O + CO2
- id: d
  en: 2 NaHCO3 → Na2CO3 + H2O + CO2
answer:
