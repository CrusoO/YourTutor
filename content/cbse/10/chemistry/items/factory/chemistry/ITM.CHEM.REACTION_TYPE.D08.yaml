solution_steps:
- en: The left side has 1 substance(s) and the right side has 3.
- en: Look at whether each formula is one element or a compound, and at how the elements
    are rearranged.
- en: Here one substance breaks into two or more simpler substances, so it is a decomposition
    reaction.
- en: The correct option is b.
