solution_steps:
- en: The positive ion comes from the base (sodium, charge 1+) and the negative ion
    from the acid (nitrate, charge 1-).
- en: 'Swap the charge numbers and reduce: 1 of the positive ion and 1 of the negative
    ion.'
- en: The salt is NaNO3, and the balanced equation is HNO3 + NaOH → NaNO3 + H2O.
- en: The correct option is b.
