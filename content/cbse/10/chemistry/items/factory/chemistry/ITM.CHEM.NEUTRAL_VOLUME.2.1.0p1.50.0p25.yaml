solution_steps:
- en: Moles of sulphuric acid = 0.1 x 50/1000 mol; each unit gives 2 hydrogen ion(s).
- en: Each unit of potassium hydroxide gives 1 hydroxide ion(s).
- en: 2 x 0.1 x 50 = 1 x 0.25 x V, so V = 40 mL.
- en: The correct option is d.
