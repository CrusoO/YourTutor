solution_steps:
- en: Moles of nitric acid = 0.1 x 25/1000 mol; each unit gives 1 hydrogen ion(s).
- en: Each unit of sodium hydroxide gives 1 hydroxide ion(s).
- en: 1 x 0.1 x 25 = 1 x 0.5 x V, so V = 5 mL.
- en: The correct option is a.
