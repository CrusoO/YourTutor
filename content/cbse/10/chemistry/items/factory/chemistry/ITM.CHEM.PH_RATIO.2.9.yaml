solution_steps:
- en: The two pH values differ by 9 - 2 = 7.
- en: Each pH unit is a factor of 10 in concentration, so the factor is 10^7 = 10000000.
- en: The solution with the smaller pH has the larger hydrogen ion concentration.
- en: The correct option is c.
