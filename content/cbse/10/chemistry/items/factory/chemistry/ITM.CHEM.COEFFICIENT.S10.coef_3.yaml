solution_steps:
- en: 'Count atoms in Al + CuSO4 → Al2(SO4)3 + Cu: for Al there are 1 on the left
    and 2 on the right, so it needs balancing.'
- en: Choose whole-number coefficients that give every element the same count on both
    sides, using the smallest numbers possible.
- en: The balanced equation is 2 Al + 3 CuSO4 → Al2(SO4)3 + 3 Cu.
- en: Read the coefficient of Cu.
- en: The correct option is c.
