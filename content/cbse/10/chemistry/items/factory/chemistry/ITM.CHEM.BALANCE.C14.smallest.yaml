  - c
  - d
solution_steps:
- en: 'Count the atoms of each element in H2 + Cl2 → HCl: for Cl there are 2 on the
    left and 1 on the right, so the equation is not balanced.'
- en: Choose whole-number coefficients (the numbers written in front of the formulas)
    so that every element has the same count on both sides. Do not change the small
    numbers inside a formula.
- en: Check each element again with the balanced equation H2 + Cl2 → 2 HCl.
- en: The correct option is b.
