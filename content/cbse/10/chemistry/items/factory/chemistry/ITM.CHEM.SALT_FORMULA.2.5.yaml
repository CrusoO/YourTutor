solution_steps:
- en: The positive ion comes from the base (aluminium, charge 3+) and the negative
    ion from the acid (sulphate, charge 2-).
- en: 'Swap the charge numbers and reduce: 2 of the positive ion and 3 of the negative
    ion.'
- en: The salt is Al2(SO4)3, and the balanced equation is 3 H2SO4 + 2 Al(OH)3 → Al2(SO4)3
    + 6 H2O.
- en: The correct option is b.
