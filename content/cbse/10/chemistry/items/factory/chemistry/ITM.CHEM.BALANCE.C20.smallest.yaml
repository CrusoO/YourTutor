options:
- id: a
  en: 4 Al + 6 Cl2 → 4 AlCl3
- id: b
  en: Al + Cl3 → AlCl3
- id: c
  en: 2 Al + 3 Cl2 → 3 AlCl3
- id: d
  en: 2 Al + 3 Cl2 → 2 AlCl3
answer:
  sympy: d
  accept: []
misconception_rules:
- id: CHEM.MC.BAL.NOT_SMALLEST
  when_answer_equals:
  - a
- id: CHEM.MC.BAL.SUBSCRIPT_CHANGED
  when_answer_equals:
  - b
- id: CHEM.MC.BAL.ONE_COEFFICIENT_OFF
  when_answer_equals:
  - c
solution_steps:
- en: 'Count the atoms of each element in Al + Cl2 → AlCl3: for Cl there are 2 on
    the left and 3 on the right, so the equation is not balanced.'
- en: Choose whole-number coefficients (the numbers written in front of the formulas)
    so that every element has the same count on both sides. Do not change the small
    numbers inside a formula.
- en: Check each element again with the balanced equation 2 Al + 3 Cl2 → 2 AlCl3.
- en: The correct option is d.
