solution_steps:
- en: 'Count atoms in FeSO4 → Fe2O3 + SO2 + SO3: for Fe there are 1 on the left and
    2 on the right, so it needs balancing.'
- en: Choose whole-number coefficients that give every element the same count on both
    sides, using the smallest numbers possible.
- en: The balanced equation is 2 FeSO4 → Fe2O3 + SO2 + SO3.
- en: Read the sum of all coefficients.
- en: The correct option is a.
