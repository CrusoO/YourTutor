solution_steps:
- en: The left side has 2 substance(s) and the right side has 1.
- en: Look at whether each formula is one element or a compound, and at how the elements
    are rearranged.
- en: Here two or more substances join to make one product, so it is a combination
    reaction.
- en: The correct option is a.
