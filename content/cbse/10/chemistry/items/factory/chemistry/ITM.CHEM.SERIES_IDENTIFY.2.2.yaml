difficulty: 0.33
pool: practice
role: recall
stem:
  en: A hydrocarbon has the molecular formula C2H2. Which general formula, with n
    carbon atoms, does it follow?
hints:
- level: 1
  en: Compare the number of hydrogen atoms with twice the number of carbon atoms.
- level: 2
  en: Find how many more or fewer hydrogen atoms there are than twice the carbon atoms.
- level: 3
  en: A difference of plus two, zero or minus two matches one of the three general
    formulas.
prediction_prompt:
  en: Before you decide, will there be more hydrogen atoms than twice the carbon atoms?
