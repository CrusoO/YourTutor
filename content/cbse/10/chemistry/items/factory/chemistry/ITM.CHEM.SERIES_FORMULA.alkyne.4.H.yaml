stem:
  en: A molecule of a straight-chain alkyne with one triple bond has 4 carbon atoms.
    How many hydrogen atoms does it have?
hints:
- level: 1
  en: Each carbon atom forms four bonds in total. In a chain, some of those bonds
    join carbon to carbon.
- level: 2
  en: A family of compounds follows one general formula for the number of hydrogen
    atoms in terms of the number of carbon atoms.
- level: 3
  en: Use the general formula of the alkyne series with n equal to the number of carbon
    atoms.
prediction_prompt:
  en: Before you calculate, will the number be larger or smaller than the number of
    carbon atoms?
