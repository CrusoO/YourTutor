stem:
  en: A molecule from the alkene series has 16 hydrogen atoms. How many carbon atoms
    does it have?
hints:
- level: 1
  en: Use the general formula of the series, which links the number of hydrogen atoms
    to the number of carbon atoms.
- level: 2
  en: Write the general formula with the known number of hydrogen atoms on one side,
    then find n by doing the same operation to each side.
- level: 3
  en: 'The general formula of the alkene series is CnH2n: put the hydrogen number
    in and solve for n.'
