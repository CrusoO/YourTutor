solution_steps:
- en: 'Write the straight chain of all the carbon atoms: that is one isomer.'
- en: Shorten the main chain by one carbon and attach that carbon as a branch at each
    different position; then shorten again and so on, never counting a copy of one
    already found.
- en: Counting every different carbon skeleton gives 18 isomers.
- en: The correct option is c.
