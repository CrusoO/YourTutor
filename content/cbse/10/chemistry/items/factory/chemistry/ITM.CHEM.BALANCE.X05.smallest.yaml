options:
- id: a
  en: Pb(NO3)2 + 2 KI → PbI2 + 3 KNO3
- id: b
  en: 2 Pb(NO3)2 + 4 KI → 2 PbI2 + 4 KNO3
- id: c
  en: Pb(NO3)2 + 2 KI → 2 PbI2 + 2 KNO3
- id: d
  en: Pb(NO3)2 + 2 KI → PbI2 + 2 KNO3
answer:
