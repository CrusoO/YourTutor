stem:
  en: A 0.0001 mol/L solution of sodium hydroxide, NaOH, is fully ionised in water.
    What is its pH at room temperature?
hints:
- level: 1
  en: Find the concentration of hydroxide ions first. Count how many hydroxide ions
    one unit of the substance gives.
- level: 2
  en: Multiply the stated concentration by the number of hydroxide ions per unit to
    get the hydroxide ion concentration.
- level: 3
  en: Turn that concentration into a power of ten. For a base, find the pOH first
    and then use the fixed total of pH and pOH.
prediction_prompt:
  en: Before you calculate, should the pH be below 7 or above 7?
