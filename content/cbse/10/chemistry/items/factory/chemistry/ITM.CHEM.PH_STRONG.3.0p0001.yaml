solution_steps:
- en: One unit of sodium hydroxide gives 1 hydroxide ion(s), so the hydroxide ion
    concentration is 0.0001 x 1 = 1/10000 mol/L.
- en: That is 1 x 10^-4 mol/L, so the pOH is 4.
- en: pH = 14 - 4 = 10.
- en: The correct option is a.
