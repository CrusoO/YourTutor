stem:
  en: A solution has a hydroxide ion concentration of 1 x 10^-3 mol/L. Which description
    fits it?
hints:
- level: 1
  en: On the pH scale one particular number separates the two kinds of solution. Which
    number is it?
- level: 2
  en: 'Compare the hydrogen ion concentration with the hydroxide ion concentration:
    whichever is larger decides the character.'
- level: 3
  en: Find the pH if it is not given directly, then compare it with the neutral point.
