options:
- id: a
  en: Copper displaces aluminium, and aluminium metal is formed
- id: b
  en: No reaction takes place
- id: c
  en: Aluminium displaces copper, and copper metal is formed
- id: d
  en: Hydrogen gas is released
answer:
  sympy: c
