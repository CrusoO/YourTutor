solution_steps:
- en: 'Count atoms in Ca + O2 → CaO: for O there are 2 on the left and 1 on the right,
    so it needs balancing.'
- en: Choose whole-number coefficients that give every element the same count on both
    sides, using the smallest numbers possible.
- en: The balanced equation is 2 Ca + O2 → 2 CaO.
- en: Read the coefficient of CaO.
- en: The correct option is c.
