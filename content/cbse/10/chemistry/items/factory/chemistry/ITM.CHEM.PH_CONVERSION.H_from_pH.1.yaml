id: ITM.CHEM.PH_CONVERSION.H_from_pH.1
skill_ids:
- CHEM.ACID.PH_CONVERSION
difficulty: 0.33
pool: practice
role: procedure
stem:
  en: A solution has pH 1. What is its hydrogen ion concentration?
hints:
- level: 1
  en: The hydrogen ion concentration is a power of ten, and the pH tells you which
    power.
- level: 2
  en: A larger pH means fewer hydrogen ions, so the concentration is a small number.
    Think about the sign of the power.
- level: 3
  en: Write 1 x 10 to a power, where the power is the pH with its sign changed.
prediction_prompt:
  en: Before you work it out, is the answer a small or a large number, and is it positive
    or negative?
