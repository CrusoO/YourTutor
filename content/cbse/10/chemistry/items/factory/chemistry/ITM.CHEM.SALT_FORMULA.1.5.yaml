solution_steps:
- en: The positive ion comes from the base (aluminium, charge 3+) and the negative
    ion from the acid (nitrate, charge 1-).
- en: 'Swap the charge numbers and reduce: 1 of the positive ion and 3 of the negative
    ion.'
- en: The salt is Al(NO3)3, and the balanced equation is 3 HNO3 + Al(OH)3 → Al(NO3)3
    + 3 H2O.
- en: The correct option is d.
