stem:
  en: 'C3H4, an alkyne, burns completely in oxygen: C3H4 + O2 → CO2 + H2O. After balancing
    with the smallest whole numbers, what is the sum of all the coefficients?'
hints:
- level: 1
  en: Burning a hydrocarbon in plenty of oxygen gives carbon dioxide and water. Count
    carbon atoms first.
- level: 2
  en: Balance carbon, then hydrogen, and leave oxygen for last because oxygen gas
    appears on one side only.
- level: 3
  en: Balance carbon first, then hydrogen, then oxygen last. Then add all four numbers
    in front of the formulas.
prediction_prompt:
  en: Before you balance it, which substance needs the largest coefficient?
