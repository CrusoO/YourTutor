type: mcq
options:
- id: a
  en: 6 Mg + 2 N2 → 2 Mg3N2
- id: b
  en: 3 Mg + N2 → Mg3N2
- id: c
  en: Mg3 + N2 → Mg3N2
- id: d
  en: 3 Mg + N2 → 2 Mg3N2
answer:
  sympy: b
  accept: []
misconception_rules:
- id: CHEM.MC.BAL.NOT_SMALLEST
  when_answer_equals:
  - a
- id: CHEM.MC.BAL.SUBSCRIPT_CHANGED
  when_answer_equals:
  - c
- id: CHEM.MC.BAL.ONE_COEFFICIENT_OFF
  when_answer_equals:
  - d
solution_steps:
- en: 'Count the atoms of each element in Mg + N2 → Mg3N2: for Mg there are 1 on the
    left and 3 on the right, so the equation is not balanced.'
- en: Choose whole-number coefficients (the numbers written in front of the formulas)
    so that every element has the same count on both sides. Do not change the small
    numbers inside a formula.
- en: Check each element again with the balanced equation 3 Mg + N2 → Mg3N2.
- en: The correct option is b.
