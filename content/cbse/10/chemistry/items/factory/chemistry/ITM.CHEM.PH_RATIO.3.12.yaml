solution_steps:
- en: The two pH values differ by 12 - 3 = 9.
- en: Each pH unit is a factor of 10 in concentration, so the factor is 10^9 = 1000000000.
- en: The solution with the smaller pH has the larger hydrogen ion concentration.
- en: The correct option is b.
