solution_steps:
- en: Moles of nitric acid = 0.2 x 25/1000 mol; each unit gives 1 hydrogen ion(s).
- en: Each unit of calcium hydroxide gives 2 hydroxide ion(s).
- en: 1 x 0.2 x 25 = 2 x 0.25 x V, so V = 10 mL.
- en: The correct option is a.
