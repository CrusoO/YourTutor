solution_steps:
- en: One unit of calcium hydroxide gives 2 hydroxide ion(s), so the hydroxide ion
    concentration is 0.0005 x 2 = 1/1000 mol/L.
- en: That is 1 x 10^-3 mol/L, so the pOH is 3.
- en: pH = 14 - 3 = 11.
- en: The correct option is d.
