solution_steps:
- en: The silver ion has charge 1+ and the sulphide ion has charge 2-.
- en: 'To cancel the charges, take 2 of the first ion and 1 of the second: 2 x 1 =
    1 x 2.'
- en: The formula is Ag2S.
- en: The correct option is a.
