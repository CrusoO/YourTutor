stem:
  en: 'C7H16, an alkane, burns completely in oxygen: C7H16 + O2 → CO2 + H2O. After
    balancing with the smallest whole numbers, what is the coefficient of H2O?'
hints:
- level: 1
  en: Burning a hydrocarbon in plenty of oxygen gives carbon dioxide and water. Count
    carbon atoms first.
- level: 2
  en: Balance carbon, then hydrogen, and leave oxygen for last because oxygen gas
    appears on one side only.
- level: 3
  en: Balance carbon first, then hydrogen, then oxygen last. Then read the number
    in front of H2O.
prediction_prompt:
  en: Before you balance it, which substance needs the largest coefficient?
