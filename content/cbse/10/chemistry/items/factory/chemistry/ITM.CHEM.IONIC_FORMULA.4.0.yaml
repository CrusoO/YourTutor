solution_steps:
- en: The barium ion has charge 2+ and the chloride ion has charge 1-.
- en: 'To cancel the charges, take 1 of the first ion and 2 of the second: 1 x 2 =
    2 x 1.'
- en: The formula is BaCl2.
- en: The correct option is d.
