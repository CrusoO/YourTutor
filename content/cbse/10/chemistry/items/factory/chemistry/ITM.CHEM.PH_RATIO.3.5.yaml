stem:
  en: Two solutions are tested. X reads pH 3 and Y reads pH 5. By what factor is the
    hydrogen ion concentration of X greater than that of Y?
hints:
- level: 1
  en: 'The pH scale is a logarithm scale: each step of one pH unit changes the ion
    concentration by the same factor.'
- level: 2
  en: Find the difference between the two pH values, then ask what factor that many
    steps make.
- level: 3
  en: A difference of one pH unit is a factor of 10. A bigger difference multiplies
    that factor again for each unit.
prediction_prompt:
  en: Before you calculate, will the answer be small like 5 or very large?
