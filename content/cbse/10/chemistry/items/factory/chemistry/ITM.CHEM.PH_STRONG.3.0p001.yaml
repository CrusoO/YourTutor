solution_steps:
- en: One unit of sodium hydroxide gives 1 hydroxide ion(s), so the hydroxide ion
    concentration is 0.001 x 1 = 1/1000 mol/L.
- en: That is 1 x 10^-3 mol/L, so the pOH is 3.
- en: pH = 14 - 3 = 11.
- en: The correct option is d.
