solution_steps:
- en: The positive ion comes from the base (potassium, charge 1+) and the negative
    ion from the acid (nitrate, charge 1-).
- en: 'Swap the charge numbers and reduce: 1 of the positive ion and 1 of the negative
    ion.'
- en: The salt is KNO3, and the balanced equation is HNO3 + KOH → KNO3 + H2O.
- en: The correct option is d.
