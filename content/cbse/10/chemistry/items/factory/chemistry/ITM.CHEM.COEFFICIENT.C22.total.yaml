solution_steps:
- en: 'Count atoms in Li + N2 → Li3N: for Li there are 1 on the left and 3 on the
    right, so it needs balancing.'
- en: Choose whole-number coefficients that give every element the same count on both
    sides, using the smallest numbers possible.
- en: The balanced equation is 6 Li + N2 → 2 Li3N.
- en: Read the sum of all coefficients.
- en: The correct option is d.
