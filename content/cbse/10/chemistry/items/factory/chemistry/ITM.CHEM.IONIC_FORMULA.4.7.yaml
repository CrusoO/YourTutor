solution_steps:
- en: The barium ion has charge 2+ and the sulphate ion has charge 2-.
- en: 'To cancel the charges, take 1 of the first ion and 1 of the second: 1 x 2 =
    1 x 2.'
- en: The formula is BaSO4.
- en: The correct option is c.
