stem:
  en: A 0.001 mol/L solution of hydrochloric acid, HCl, is fully ionised in water.
    What is its pH at room temperature?
hints:
- level: 1
  en: Find the concentration of hydrogen ions first. Count how many hydrogen ions
    one unit of the substance gives.
- level: 2
  en: Multiply the stated concentration by the number of hydrogen ions per unit to
    get the hydrogen ion concentration.
- level: 3
  en: Turn that concentration into a power of ten. For a base, find the pOH first
    and then use the fixed total of pH and pOH.
prediction_prompt:
  en: Before you calculate, should the pH be below 7 or above 7?
