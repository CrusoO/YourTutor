solution_steps:
- en: One unit of hydrochloric acid gives 1 hydrogen ion(s), so the hydrogen ion concentration
    is 0.001 x 1 = 1/1000 mol/L.
- en: That is 1 x 10^-3 mol/L, so the pH is 3.
- en: So pH = 3.
- en: The correct option is d.
