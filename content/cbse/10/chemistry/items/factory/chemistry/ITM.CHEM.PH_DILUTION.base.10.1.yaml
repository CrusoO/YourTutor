difficulty: 0.56
pool: practice
role: apply
stem:
  en: A solution of a strong base has pH 10. Pure water is added until its volume
    is 10 times larger. What is the new pH? (Assume the water itself adds no ions.)
hints:
- level: 1
  en: Diluting a solution lowers the concentration of the ions that make it acidic
    or basic. Which way does that push the pH?
- level: 2
  en: Each time the volume becomes ten times larger, the concentration of ions becomes
    ten times smaller, and the pH moves by one unit.
- level: 3
  en: Work out how many times the volume is multiplied by ten, then move the pH by
    that many units in the right direction.
prediction_prompt:
  en: Before you calculate, will the pH go up or down, and will it cross 7?
