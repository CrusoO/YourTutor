solution_steps:
- en: The volume is 10 times larger, so the ion concentration is 10 times smaller.
- en: A change by a factor of 10 moves the pH by 1 unit(s).
- en: A diluted base has its pH move towards 7, so the new pH is 9.
- en: The correct option is c.
