stem:
  en: How many covalent bonds are there in one molecule of C5H10, a straight-chain
    alkene with one double bond? Count a double bond as two bonds and a triple bond
    as three.
hints:
- level: 1
  en: Count the bonds between carbon atoms and the bonds between carbon and hydrogen
    atoms separately, then add them.
- level: 2
  en: Every hydrogen atom makes exactly one bond. A double bond counts as two and
    a triple bond counts as three.
- level: 3
  en: Find the number of hydrogen atoms from the general formula, then add the carbon-carbon
    bonds along the chain.
prediction_prompt:
  en: Before you calculate, will the number be larger or smaller than the number of
    carbon atoms?
