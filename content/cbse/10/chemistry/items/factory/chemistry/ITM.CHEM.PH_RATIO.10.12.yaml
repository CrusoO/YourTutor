solution_steps:
- en: The two pH values differ by 12 - 10 = 2.
- en: Each pH unit is a factor of 10 in concentration, so the factor is 10^2 = 100.
- en: The solution with the smaller pH has the larger hydrogen ion concentration.
- en: The correct option is a.
