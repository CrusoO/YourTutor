type: mcq
options:
- id: a
  en: 4 H2O → 4 H2 + 2 O2
- id: b
  en: H2O2 → H2 + O2
- id: c
  en: 2 H2O → 2 H2 + 2 O2
- id: d
  en: 2 H2O → 2 H2 + O2
answer:
  sympy: d
  accept: []
misconception_rules:
- id: CHEM.MC.BAL.NOT_SMALLEST
  when_answer_equals:
  - a
- id: CHEM.MC.BAL.SUBSCRIPT_CHANGED
  when_answer_equals:
  - b
- id: CHEM.MC.BAL.ONE_COEFFICIENT_OFF
  when_answer_equals:
  - c
solution_steps:
- en: 'Count the atoms of each element in H2O → H2 + O2: for O there are 1 on the
    left and 2 on the right, so the equation is not balanced.'
- en: Choose whole-number coefficients (the numbers written in front of the formulas)
    so that every element has the same count on both sides. Do not change the small
    numbers inside a formula.
- en: Check each element again with the balanced equation 2 H2O → 2 H2 + O2.
- en: The correct option is d.
