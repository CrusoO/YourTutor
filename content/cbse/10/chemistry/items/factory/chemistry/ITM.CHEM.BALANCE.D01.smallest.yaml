id: ITM.CHEM.BALANCE.D01.smallest
skill_ids:
- CHEM.RXN.BALANCE
difficulty: 0.39
pool: practice
role: procedure
stem:
  en: Balance the chemical equation H2O → H2 + O2. Which option gives the smallest
    whole-number coefficients?
hints:
- level: 1
  en: Count the atoms of every element on the left side and on the right side. Which
    element has a different count on the two sides?
- level: 2
  en: Only the numbers written in front of the formulas may change. The small numbers
    inside a formula stay as they are.
- level: 3
  en: 'Start with O: it is 1 on the left and 2 on the right in the unbalanced skeleton.
    Choose a front number that makes them equal, then recount the other elements.'
prediction_prompt:
  en: Before you balance it, which element do you expect to be out of balance first?
status: draft
template_id: TPL.CHEM.BALANCE
