solution_steps:
- en: Place both metals in the reactivity series.
- en: A displacement reaction happens only if the metal added is more reactive than
    the metal in the salt solution.
- en: 'So the correct statement is: Magnesium displaces aluminium, and aluminium metal
    is formed.'
- en: The correct option is d.
