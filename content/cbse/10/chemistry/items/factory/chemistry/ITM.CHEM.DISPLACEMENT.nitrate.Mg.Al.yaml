options:
- id: a
  en: No reaction takes place
- id: b
  en: Aluminium displaces magnesium, and magnesium metal is formed
- id: c
  en: Hydrogen gas is released
- id: d
  en: Magnesium displaces aluminium, and aluminium metal is formed
answer:
