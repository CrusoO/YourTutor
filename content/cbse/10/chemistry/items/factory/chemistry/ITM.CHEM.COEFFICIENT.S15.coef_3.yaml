solution_steps:
- en: 'Count atoms in Al + HCl → AlCl3 + H2: for Cl there are 1 on the left and 3
    on the right, so it needs balancing.'
- en: Choose whole-number coefficients that give every element the same count on both
    sides, using the smallest numbers possible.
- en: The balanced equation is 2 Al + 6 HCl → 2 AlCl3 + 3 H2.
- en: Read the coefficient of H2.
- en: The correct option is b.
