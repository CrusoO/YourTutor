solution_steps:
- en: The positive ion comes from the base (sodium, charge 1+) and the negative ion
    from the acid (sulphate, charge 2-).
- en: 'Swap the charge numbers and reduce: 2 of the positive ion and 1 of the negative
    ion.'
- en: The salt is Na2SO4, and the balanced equation is H2SO4 + 2 NaOH → Na2SO4 + 2
    H2O.
- en: The correct option is b.
