solution_steps:
- en: One unit of sodium hydroxide gives 1 hydroxide ion(s), so the hydroxide ion
    concentration is 0.01 x 1 = 1/100 mol/L.
- en: That is 1 x 10^-2 mol/L, so the pOH is 2.
- en: pH = 14 - 2 = 12.
- en: The correct option is c.
