solution_steps:
- en: Moles of nitric acid = 0.1 x 20/1000 mol; each unit gives 1 hydrogen ion(s).
- en: Each unit of potassium hydroxide gives 1 hydroxide ion(s).
- en: 1 x 0.1 x 20 = 1 x 0.2 x V, so V = 10 mL.
- en: The correct option is b.
