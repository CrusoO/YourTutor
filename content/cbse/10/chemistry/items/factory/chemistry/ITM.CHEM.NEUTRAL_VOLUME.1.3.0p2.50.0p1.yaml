solution_steps:
- en: Moles of nitric acid = 0.2 x 50/1000 mol; each unit gives 1 hydrogen ion(s).
- en: Each unit of magnesium hydroxide gives 2 hydroxide ion(s).
- en: 1 x 0.2 x 50 = 2 x 0.1 x V, so V = 50 mL.
- en: The correct option is c.
