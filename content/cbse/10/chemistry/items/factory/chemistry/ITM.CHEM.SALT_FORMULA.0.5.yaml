solution_steps:
- en: The positive ion comes from the base (aluminium, charge 3+) and the negative
    ion from the acid (chloride, charge 1-).
- en: 'Swap the charge numbers and reduce: 1 of the positive ion and 3 of the negative
    ion.'
- en: The salt is AlCl3, and the balanced equation is 3 HCl + Al(OH)3 → AlCl3 + 3
    H2O.
- en: The correct option is b.
