stem:
  en: Aluminium hydroxide reacts completely with hydrochloric acid to form a salt
    and water. Which formula is the formula of the salt?
hints:
- level: 1
  en: A salt is made from the positive ion of the base and the negative ion of the
    acid. Name both ions.
- level: 2
  en: Write the charge of each ion. The compound must have zero total charge, so use
    as many of each ion as needed to cancel.
- level: 3
  en: Use the smallest numbers of each ion that make the charges cancel, and write
    a bracket round a group of atoms if it appears more than once.
prediction_prompt:
  en: Before you write it, which ion comes from the acid and which from the base?
