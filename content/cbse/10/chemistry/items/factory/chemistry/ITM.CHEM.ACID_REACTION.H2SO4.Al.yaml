difficulty: 0.33
pool: practice
role: recall
stem:
  en: Aluminium metal is added to dilute sulphuric acid. Which statement is correct?
hints:
- level: 1
  en: A dilute acid contains hydrogen ions. A metal can push hydrogen out of the acid
    only if it is more reactive than hydrogen.
- level: 2
  en: Find where hydrogen sits in the reactivity series and compare it with the place
    of the metal.
- level: 3
  en: Metals above hydrogen in the series release hydrogen gas from a dilute acid.
    Metals below hydrogen do not.
prediction_prompt:
  en: Before you decide, is this metal near the top of the reactivity series or near
    the bottom?
