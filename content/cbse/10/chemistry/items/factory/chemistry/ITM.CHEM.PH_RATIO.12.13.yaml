solution_steps:
- en: The two pH values differ by 13 - 12 = 1.
- en: Each pH unit is a factor of 10 in concentration, so the factor is 10^1 = 10.
- en: The solution with the smaller pH has the larger hydrogen ion concentration.
- en: The correct option is c.
