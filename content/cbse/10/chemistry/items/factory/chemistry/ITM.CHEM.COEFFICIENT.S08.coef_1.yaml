solution_steps:
- en: 'Count atoms in Fe + HCl → FeCl2 + H2: for Cl there are 1 on the left and 2
    on the right, so it needs balancing.'
- en: Choose whole-number coefficients that give every element the same count on both
    sides, using the smallest numbers possible.
- en: The balanced equation is Fe + 2 HCl → FeCl2 + H2.
- en: Read the coefficient of HCl.
- en: The correct option is d.
