stem:
  en: What is the IUPAC name of the compound with the condensed formula CH3-CH=CH-CH3?
hints:
- level: 1
  en: Count the carbon atoms in the unbroken chain to find the parent name, then look
    at the bond between carbon atoms that is not single.
- level: 2
  en: A double bond changes the ending to -ene and a triple bond changes it to -yne.
- level: 3
  en: Number the chain from the end nearest the multiple bond, and write the number
    of its first carbon before the ending when more than one position is possible.
prediction_prompt:
  en: Before you name it, does the ending change from -ane?
