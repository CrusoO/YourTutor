options:
- id: a
  en: Mg + 2 HCl → 2 MgCl2 + H2
- id: b
  en: 2 Mg + 4 HCl → 2 MgCl2 + 2 H2
- id: c
  en: Mg + 2 HCl → MgCl2 + H2
- id: d
  en: Mg + 2 HCl → MgCl2 + 2 H2
answer:
  sympy: c
  accept: []
misconception_rules:
- id: CHEM.MC.BAL.ONE_COEFFICIENT_OFF
  when_answer_equals:
  - a
  - d
- id: CHEM.MC.BAL.NOT_SMALLEST
  when_answer_equals:
  - b
solution_steps:
- en: 'Count the atoms of each element in Mg + HCl → MgCl2 + H2: for Cl there are
    1 on the left and 2 on the right, so the equation is not balanced.'
- en: Choose whole-number coefficients (the numbers written in front of the formulas)
    so that every element has the same count on both sides. Do not change the small
    numbers inside a formula.
- en: Check each element again with the balanced equation Mg + 2 HCl → MgCl2 + H2.
- en: The correct option is c.
