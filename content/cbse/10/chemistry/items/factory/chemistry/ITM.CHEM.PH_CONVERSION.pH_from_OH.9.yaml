difficulty: 0.36
pool: practice
role: procedure
stem:
  en: The hydroxide ion concentration of a solution is 1 x 10^-9 mol/L. What is the
    pH of the solution?
hints:
- level: 1
  en: A hydroxide ion concentration gives pOH first, and only then the pH.
- level: 2
  en: Find the pOH from the power of ten, then use the fixed total of pH and pOH at
    room temperature.
- level: 3
  en: pOH comes from the power with its minus sign ignored. Subtract it from the fixed
    total.
prediction_prompt:
  en: Before you work it out, is the answer a small or a large number, and is it positive
    or negative?
