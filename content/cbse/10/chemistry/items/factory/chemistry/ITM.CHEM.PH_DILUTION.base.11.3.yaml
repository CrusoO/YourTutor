solution_steps:
- en: The volume is 1000 times larger, so the ion concentration is 1000 times smaller.
- en: A change by a factor of 1000 moves the pH by 3 unit(s).
- en: A diluted base has its pH move towards 7, so the new pH is 8.
- en: The correct option is c.
