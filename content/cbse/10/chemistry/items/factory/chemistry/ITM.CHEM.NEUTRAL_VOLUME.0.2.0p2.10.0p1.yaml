solution_steps:
- en: Moles of hydrochloric acid = 0.2 x 10/1000 mol; each unit gives 1 hydrogen ion(s).
- en: Each unit of calcium hydroxide gives 2 hydroxide ion(s).
- en: 1 x 0.2 x 10 = 2 x 0.1 x V, so V = 10 mL.
- en: The correct option is a.
