solution_steps:
- en: The positive ion comes from the base (magnesium, charge 2+) and the negative
    ion from the acid (nitrate, charge 1-).
- en: 'Swap the charge numbers and reduce: 1 of the positive ion and 2 of the negative
    ion.'
- en: The salt is Mg(NO3)2, and the balanced equation is 2 HNO3 + Mg(OH)2 → Mg(NO3)2
    + 2 H2O.
- en: The correct option is d.
