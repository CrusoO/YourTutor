role: procedure
stem:
  en: The equation N2 + H2 → NH3 is balanced using the smallest whole-number coefficients.
    What is the sum of all the coefficients?
hints:
- level: 1
  en: Balance the whole reaction first by counting the atoms of every element on the
    left and on the right.
- level: 2
  en: Only the numbers in front of formulas may change. The small numbers inside a
    formula stay as they are.
- level: 3
  en: Balance the reaction first, then add the numbers in front of every formula.
    A formula with no number in front counts as 1.
prediction_prompt:
  en: Before you balance it, is the number you want more likely to be 1 or bigger
    than 1?
