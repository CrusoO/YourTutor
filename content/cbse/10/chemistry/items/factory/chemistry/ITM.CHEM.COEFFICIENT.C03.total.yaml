solution_steps:
- en: 'Count atoms in N2 + H2 → NH3: for H there are 2 on the left and 3 on the right,
    so it needs balancing.'
- en: Choose whole-number coefficients that give every element the same count on both
    sides, using the smallest numbers possible.
- en: The balanced equation is N2 + 3 H2 → 2 NH3.
- en: Read the sum of all coefficients.
- en: The correct option is d.
