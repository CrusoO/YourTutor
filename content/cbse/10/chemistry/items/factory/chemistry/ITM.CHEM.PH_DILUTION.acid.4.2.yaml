solution_steps:
- en: The volume is 100 times larger, so the ion concentration is 100 times smaller.
- en: A change by a factor of 100 moves the pH by 2 unit(s).
- en: A diluted acid has its pH move towards 7, so the new pH is 6.
- en: The correct option is c.
