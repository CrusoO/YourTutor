role: procedure
stem:
  en: What is the IUPAC name of the compound with the condensed formula CH3-CH2-CH(CH3)-CH3?
hints:
- level: 1
  en: Find the longest unbroken chain of carbon atoms. Its length gives the name of
    the parent alkane.
- level: 2
  en: Anything attached to the longest chain is a side group. Number the chain from
    the end that gives the side groups the lowest numbers.
- level: 3
  en: Write the side group numbers and names in front of the parent name, using di,
    tri when a group appears more than once.
prediction_prompt:
  en: Before you name it, how many carbon atoms are in the longest chain?
