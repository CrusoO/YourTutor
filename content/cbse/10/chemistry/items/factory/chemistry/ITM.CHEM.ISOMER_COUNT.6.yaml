id: ITM.CHEM.ISOMER_COUNT.6
skill_ids:
- CHEM.CARBON.ISOMER_COUNT
difficulty: 0.7
pool: practice
role: apply
stem:
  en: How many different structural isomers (different arrangements of the carbon
    atoms, with single bonds only) does C6H14 have?
hints:
- level: 1
  en: Isomers have the same molecular formula but the carbon atoms are joined in a
    different order.
- level: 2
  en: Start with the longest straight chain, then shorten the main chain by one carbon
    and place that carbon as a branch in every different position.
- level: 3
  en: A branch at the very end of the chain only lengthens the chain, so it does not
    give a new isomer. Check that you do not count the same structure twice.
prediction_prompt:
  en: Before you count, will there be more or fewer isomers than carbon atoms?
