options:
- id: a
  en: Zinc displaces magnesium, and magnesium metal is formed
- id: b
  en: Hydrogen gas is released
- id: c
  en: No reaction takes place
- id: d
  en: Magnesium displaces zinc, and zinc metal is formed
answer:
  sympy: d
  accept: []
