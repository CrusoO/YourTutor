solution_steps:
- en: The lead(2+) ion has charge 2+ and the phosphate ion has charge 3-.
- en: 'To cancel the charges, take 3 of the first ion and 2 of the second: 3 x 2 =
    2 x 3.'
- en: The formula is Pb3(PO4)2.
- en: The correct option is b.
