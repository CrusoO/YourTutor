solution_steps:
- en: 'Balance carbon first: C3H8 has 3 carbon atom(s), so CO2 gets the matching number
    in front.'
- en: Balance hydrogen next using H2O, then count all the oxygen atoms on the right
    to find the number of O2.
- en: If a half-number is needed, double every coefficient so that all are whole numbers.
- en: The balanced equation is C3H8 + 5 O2 → 3 CO2 + 4 H2O.
- en: The correct option is a.
