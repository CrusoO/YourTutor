  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The ionic end, which is the water-loving head
- id: b
  en: Both ends equally, so the whole molecule dissolves fully
- id: c
  en: The long hydrocarbon tail, which is water-loving
- id: d
  en: The sodium ion, which carries no charge
