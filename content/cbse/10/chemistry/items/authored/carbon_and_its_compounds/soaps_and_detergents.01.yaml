stem:
  en: In a soap molecule, which end is attracted to water?
hints:
- level: 1
  en: Think about which end carries a charge.
- level: 2
  en: Recall that water is a polar liquid.
- level: 3
  en: Consider which end is the water-loving part, since hydro means water.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
