id: A.10.chemistry.carbon_and_its_compounds.soaps_and_detergents.05
skill_ids:
- SK.A.10.chemistry.soaps_and_detergents
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: In water, soap molecules gather into small spherical clusters called micelles. Why do they form this structure?
hints:
- level: 1
  en: Think about which parts of the molecule water attracts.
- level: 2
  en: Consider which part water pushes away.
- level: 3
  en: Ask where the grease-attracted tails would be placed in water.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Their water-loving heads face the water while their water-hating tails cluster inward
- id: b
  en: The molecules are fully ionic all the way along
- id: c
  en: The tails bond covalently with water molecules
- id: d
  en: Both ends are equally attracted to water
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.12F8A8665728
  when_answer_equals:
  - d
- id: MC.A.E1D72A14B9D4
  when_answer_equals:
  - c
- id: MC.A.5944C83E96CD
  when_answer_equals:
  - b
solution_steps:
- en: Heads are attracted to water and tails are repelled, so the molecules arrange with their tails inside the cluster.
- en: The clusters can trap grease in the middle.
- en: The correct option is a.
tier: C
diagram_note: Draw a spherical cluster in water, with soap molecules arranged so that their heads are on the outside and their tails point into the centre. Label the cluster micelle.
