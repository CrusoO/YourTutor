difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does carbon form covalent rather than ionic bonds?
hints:
- level: 1
  en: Count how many electrons carbon would need to gain or lose.
- level: 2
  en: Think about how the energy cost compares with sharing.
- level: 3
  en: Ask what carbon does with its electrons when they are shared.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It has no valence electrons in its outer shell
- id: b
  en: It has too few electrons to form any bonds
- id: c
  en: It loses all four valence electrons easily
- id: d
  en: It has four valence electrons, so gaining or losing four electrons to form ions is difficult
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.BB53E9D53054
  when_answer_equals:
  - b
- id: MC.A.0B71D02A503C
  when_answer_equals:
