stem:
  en: Why do the boiling points of successive alkanes rise steadily?
hints:
- level: 1
  en: Consider what changes in size from one member to the next.
- level: 2
  en: Think about the forces between larger molecules.
- level: 3
  en: Ask what determines how much energy is needed to boil a liquid.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
