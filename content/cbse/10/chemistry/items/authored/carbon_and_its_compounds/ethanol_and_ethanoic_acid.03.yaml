id: A.10.chemistry.carbon_and_its_compounds.ethanol_and_ethanoic_acid.03
skill_ids:
- SK.A.10.chemistry.ethanol_and_ethanoic_acid
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Ethanol and ethanoic acid are heated together with a few drops of concentrated sulphuric acid. What is the main product?
hints:
- level: 1
  en: Recall what kind of product an acid and an alcohol form together.
- level: 2
  en: Think about which small molecule is lost when two molecules join.
- level: 3
  en: Consider what the sulphuric acid is doing to the reaction.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Ethane and carbon dioxide
- id: b
  en: Sodium ethanoate and hydrogen
- id: c
  en: Ethyl ethanoate only, with no water
- id: d
  en: Ethyl ethanoate, a sweet-smelling ester, together with water
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.C164D338305B
  when_answer_equals:
  - c
- id: MC.A.5EA4AD55F72B
  when_answer_equals:
  - b
- id: MC.A.7A97E849BBF2
  when_answer_equals:
  - a
solution_steps:
- en: The acid and alcohol combine to form an ester and water.
- en: The concentrated sulphuric acid acts as a catalyst and absorbs the water.
- en: The correct option is d.
tier: C
