stem:
  en: Ethanol and dimethyl ether both have the molecular formula C2H6O, yet they have different properties. Why?
hints:
- level: 1
  en: Count the atoms in each formula to check that they match.
- level: 2
  en: Think about whether the arrangement of atoms can change properties.
- level: 3
  en: Consider where the oxygen sits in each molecule.
