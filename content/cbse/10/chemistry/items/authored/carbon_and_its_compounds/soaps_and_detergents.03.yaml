id: A.10.chemistry.carbon_and_its_compounds.soaps_and_detergents.03
skill_ids:
- SK.A.10.chemistry.soaps_and_detergents
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A soap molecule removes grease from a dirty plate. What is the role of its hydrocarbon tail?
hints:
- level: 1
  en: Think about which end of the soap molecule is attracted to grease.
- level: 2
  en: Consider how a grease droplet surrounded by soap behaves in water.
- level: 3
  en: Recall which end of the molecule is water-repelling.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It dissolves in water and carries the grease along
- id: b
  en: It dissolves into the grease, trapping it so that the grease can be lifted away into water
- id: c
  en: It reacts with the grease to form a soluble salt
- id: d
  en: It evaporates the grease from the surface
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.084D5D1DBE40
  when_answer_equals:
  - c
- id: MC.A.20E4A6D848F6
  when_answer_equals:
  - d
- id: MC.A.74D34DACE9BF
  when_answer_equals:
  - a
solution_steps:
- en: The tail dissolves in the grease while the heads point outward into the water.
- en: The grease droplets are surrounded and lifted off the surface.
- en: The correct option is b.
tier: C
diagram_note: Draw a grease droplet on a plate with soap molecules around it. Show the hydrocarbon tails pointing into the grease and the heads pointing outward into the water.
