stem:
  en: Soap is made by heating a fat with sodium hydroxide solution. What is the main soap product?
hints:
- level: 1
  en: Think about what the alkali does to the fat molecule.
- level: 2
  en: Recall that the fat is broken into two kinds of products.
- level: 3
  en: Consider which metal ion comes from the sodium hydroxide.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Sodium chloride, formed from the fat and salt
- id: b
  en: The calcium salt of the fatty acid
- id: c
  en: Glycerol alone, with no salt
- id: d
  en: The sodium salt of a long-chain fatty acid
answer:
  sympy: d
  accept: []
