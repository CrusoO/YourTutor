  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Non-metals conduct heat better than metals in general
- id: b
  en: Metals and non-metals conduct heat equally well
- id: c
  en: Most metals are good conductors of heat, while most non-metals are poor conductors
- id: d
  en: Metals never conduct heat, only electricity
answer:
  sympy: c
  accept: []
