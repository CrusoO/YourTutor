stem:
  en: Which statement about the conduction of heat is correct?
hints:
- level: 1
  en: Think about the role of free electrons in conduction.
- level: 2
  en: Recall which material is used for the base of cooking pans.
- level: 3
  en: Ask whether heat and electricity are carried by the same particles.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
