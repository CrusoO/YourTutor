stem:
  en: Calcium reacts with oxygen in air to form calcium oxide. Which statement correctly describes the calcium?
hints:
- level: 1
  en: Recall which process is the gain of oxygen.
- level: 2
  en: Ask what happens to calcium when it combines with another element.
- level: 3
  en: Think about whether the calcium changes chemically.
