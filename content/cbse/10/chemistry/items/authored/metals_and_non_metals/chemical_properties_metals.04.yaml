options:
- id: a
  en: It is reduced, because it gains oxygen
- id: b
  en: It is oxidised, because it gains oxygen
- id: c
  en: It is unchanged, because oxygen only acts as a catalyst
- id: d
  en: It is neutralised by the oxygen
