difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Aluminium is extracted by electrolysis of molten alumina rather than by heating its oxide with carbon. What is the main reason?
hints:
- level: 1
  en: Compare the reactivity of aluminium with the reactivity of carbon.
- level: 2
  en: Think about what electricity can do that carbon cannot.
- level: 3
  en: Ask whether carbon can take oxygen away from aluminium oxide.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Alumina is liquid at room temperature
- id: b
  en: Alumina dissolves in water, so electrolysis is easier
- id: c
  en: Aluminium is more reactive than carbon, so carbon cannot reduce its oxide
- id: d
  en: Aluminium reacts with carbon to make a gas
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.515606840FA8
  when_answer_equals:
  - a
- id: MC.A.320577EB1CED
  when_answer_equals:
  - d
- id: MC.A.5194157A0F90
  when_answer_equals:
  - b
solution_steps:
- en: Carbon is less reactive than aluminium, so it cannot remove oxygen from alumina.
- en: Electrolysis uses electricity to break the compound apart instead.
- en: The correct option is c.
tier: C
