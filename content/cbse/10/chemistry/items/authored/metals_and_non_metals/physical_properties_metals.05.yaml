id: A.10.chemistry.metals_and_non_metals.physical_properties_metals.05
skill_ids:
- SK.A.10.chemistry.physical_properties_metals
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Graphite is a non-metal, yet it conducts electricity. Which explanation fits this?
hints:
- level: 1
  en: Consider how many bonds each carbon atom makes in graphite.
- level: 2
  en: Think about whether any electrons are left free.
- level: 3
  en: Ask which part of the structure allows the movement of charge.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Its shiny surface shows that it is a metal
- id: b
  en: Its layers contain electrons that are delocalised and can move
- id: c
  en: Its atoms carry free ions that move through it
- id: d
  en: It is an ionic compound with a lattice of ions
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.730D48BA113F
  when_answer_equals:
  - a
- id: MC.A.3812720C784E
  when_answer_equals:
  - c
- id: MC.A.5D38308276F5
  when_answer_equals:
  - d
solution_steps:
- en: In graphite each carbon bonds to three others in a layer, leaving one electron per atom free to move along the layer.
- en: This is why graphite conducts.
- en: The correct option is b.
tier: C
