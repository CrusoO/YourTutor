id: A.10.chemistry.metals_and_non_metals.ionic_bonding.05
skill_ids:
- SK.A.10.chemistry.ionic_bonding
difficulty: 0.9
pool: practice
role: explain
stem:
  en: Solid sodium chloride does not conduct electricity, but molten sodium chloride does. What is the reason?
hints:
- level: 1
  en: Consider whether the particles in the solid are able to move.
- level: 2
  en: Think about what changes when a solid melts.
- level: 3
  en: Recall what carries charge in a molten ionic substance.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Molten sodium chloride contains no ions
- id: b
  en: The ions are fixed in a lattice in the solid but can move freely when molten
- id: c
  en: Solid sodium chloride contains delocalised electrons
- id: d
  en: Electrons are free only in the solid, not in the melt
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.3FC0EE1EB0BA
  when_answer_equals:
  - d
- id: MC.A.C2FE8033457E
  when_answer_equals:
  - a
- id: MC.A.1B9E76F41691
  when_answer_equals:
  - c
solution_steps:
- en: In the solid, Na+ and Cl- ions are held in fixed positions.
- en: Melting frees them to move, so they carry charge through the liquid.
- en: The correct option is b.
tier: C
