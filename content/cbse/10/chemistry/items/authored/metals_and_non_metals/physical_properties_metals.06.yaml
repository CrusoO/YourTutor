difficulty: 0.9
pool: practice
role: explain
stem:
  en: Why are most non-metal solids brittle rather than malleable?
hints:
- level: 1
  en: Consider how the atoms are bonded to their neighbours.
- level: 2
  en: Think about what happens when a metal layer slides compared with a covalent solid.
- level: 3
  en: Ask what kind of bonding gives direction and rigidity.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They are heavier than metals
- id: b
  en: They have too many electrons to move
- id: c
  en: Their atoms are held in fixed covalent arrangements that break along planes rather than sliding
- id: d
  en: Their atoms are too small to be arranged in layers
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.C587829911BD
  when_answer_equals:
  - d
- id: MC.A.6E3DB4257CCA
  when_answer_equals:
