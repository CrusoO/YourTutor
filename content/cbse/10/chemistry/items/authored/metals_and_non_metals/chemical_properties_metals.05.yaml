id: A.10.chemistry.metals_and_non_metals.chemical_properties_metals.05
skill_ids:
- SK.A.10.chemistry.chemical_properties_metals
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Aluminium is a fairly reactive metal, yet it does not corrode quickly in air. What is the reason?
hints:
- level: 1
  en: Consider what happens at the surface when aluminium meets air.
- level: 2
  en: Ask whether the surface layer is removed easily by water.
- level: 3
  en: Think about whether the reaction stops once a layer has formed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Aluminium forms a soluble coating that washes away
- id: b
  en: A thin, tough layer of aluminium oxide forms on its surface and protects the metal
- id: c
  en: Aluminium does not react with oxygen at all
- id: d
  en: Aluminium is a non-metal and so resists air
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.22340438DC5A
  when_answer_equals:
  - c
- id: MC.A.965138FCD80F
  when_answer_equals:
  - a
- id: MC.A.957ADD5B2C80
  when_answer_equals:
  - d
solution_steps:
- en: Aluminium reacts with oxygen to form a very thin oxide layer that sticks firmly to the metal and stops further reaction.
- en: This is why it resists corrosion.
- en: The correct option is b.
tier: C
