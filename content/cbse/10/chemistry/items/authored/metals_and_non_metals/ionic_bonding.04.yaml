solution_steps:
- en: A magnesium ion carries 2+ and each chloride ion carries 1-, so two chloride ions give a neutral compound.
- en: The correct option is a.
tier: C
diagram_note: Draw one magnesium ion labelled 2+ in the centre, with two chloride ions labelled 1- around it. Write the formula MgCl2 beneath the drawing.
