difficulty: 0.6
pool: practice
role: apply
stem:
  en: In magnesium chloride, MgCl2, how many chloride ions are needed to balance one magnesium ion?
hints:
- level: 1
  en: Compare the charge on magnesium with the charge on chloride.
- level: 2
  en: Think about the total charge that must add up to zero.
- level: 3
  en: Consider how many 1- charges are needed to cancel one 2+ charge.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Two
- id: b
  en: Four
- id: c
  en: One
- id: d
  en: Three
answer:
  sympy: a
  accept: []
