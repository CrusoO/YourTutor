stem:
  en: A student says, 'Rusting needs only oxygen, so a sealed tin of dry air will rust.' What is the correct idea?
hints:
- level: 1
  en: Consider how many substances iron needs in order to rust.
- level: 2
  en: Think about whether the sealed tin contains any moisture.
- level: 3
  en: Recall the two requirements for rusting.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Rusting needs water only, not oxygen
- id: b
  en: Rusting needs carbon dioxide and oxygen
- id: c
  en: Rusting needs heat and salt but not water
- id: d
  en: Rusting needs both oxygen and water, so dry air alone does not rust iron
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.F4A006C852DD
  when_answer_equals:
  - a
- id: MC.A.7A563D2F6A9A
  when_answer_equals:
