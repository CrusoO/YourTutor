id: A.10.chemistry.metals_and_non_metals.ionic_bonding.01
skill_ids:
- SK.A.10.chemistry.ionic_bonding
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Sodium, with electronic configuration 2, 8, 1, reacts with chlorine, with configuration 2, 8, 7. What happens to the outer electron of sodium when the ionic compound forms?
hints:
- level: 1
  en: Consider which atom needs one electron to complete its outer shell.
- level: 2
  en: Think about whether sodium gains or loses electrons.
- level: 3
  en: Ask which particles attract each other in an ionic compound.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It moves into the nucleus of the chlorine atom
- id: b
  en: It is lost into the air and no bond forms
- id: c
  en: It is transferred to chlorine, giving Na+ and Cl- ions
- id: d
  en: It is shared equally with chlorine to form a covalent bond
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.CA25B8C5D307
  when_answer_equals:
  - d
- id: MC.A.6B4E11DE2D4D
  when_answer_equals:
  - b
- id: MC.A.A2E09B5470C2
  when_answer_equals:
  - a
solution_steps:
- en: Sodium loses its outer electron to form Na+, and chlorine gains it to form Cl-.
- en: The opposite charges attract, forming an ionic bond.
- en: The correct option is c.
tier: C
diagram_note: Draw sodium as a circle with one dot in its outer shell and chlorine as a circle with seven dots in its outer shell. Show an arrow moving one dot from sodium to chlorine, and label the resulting ions with their charges.
