stem:
  en: Blocks of magnesium are bolted to the steel hull of a ship to slow its corrosion. Why does this protect the steel?
hints:
- level: 1
  en: Compare how easily magnesium and iron react.
- level: 2
  en: Think about which metal in contact with the steel will corrode first.
- level: 3
  en: Ask which metal is being sacrificed to protect the other.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
