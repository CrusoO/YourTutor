  author: model-draft
type: mcq
options:
- id: a
  en: Magnesium makes the steel stronger, so it resists rust
- id: b
  en: Magnesium is more reactive and corrodes first, while the iron stays intact
- id: c
  en: Magnesium is unreactive and resists corrosion better than iron
- id: d
  en: Magnesium repels water away from the hull
