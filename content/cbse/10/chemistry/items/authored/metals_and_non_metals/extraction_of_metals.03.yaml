type: mcq
options:
- id: a
  en: It removes sulphur as sulphur dioxide
- id: b
  en: It melts the ore so the metal can be separated
- id: c
  en: It adds carbon dioxide to make the metal
- id: d
  en: It heats the ore in limited air to decompose the carbonate into an oxide
answer:
  sympy: d
  accept: []
