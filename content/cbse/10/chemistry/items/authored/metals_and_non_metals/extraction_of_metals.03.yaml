stem:
  en: Why is calcination used for a carbonate ore?
hints:
- level: 1
  en: Think about what gas is released from carbonates on heating.
- level: 2
  en: Consider the difference between roasting and calcination.
- level: 3
  en: Ask what the ore becomes after it is heated.
