  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Zinc is more reactive, so it corrodes in preference to the iron
- id: b
  en: Zinc is harder than iron, so scratches cannot form
- id: c
  en: Zinc forms a soluble layer that removes oxygen from the air
- id: d
  en: Zinc makes the iron lighter, so it resists rusting
answer:
