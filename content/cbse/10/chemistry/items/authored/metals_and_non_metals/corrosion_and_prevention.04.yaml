stem:
  en: Why does a zinc coating continue to protect iron even when the coating is scratched?
hints:
- level: 1
  en: Consider which of the two metals reacts more easily.
- level: 2
  en: Think about what happens at a scratch when both metals are exposed.
- level: 3
  en: Ask which metal gets used up first.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
