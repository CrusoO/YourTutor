stem:
  en: Sodium is stored under kerosene in the laboratory. What is the main reason?
hints:
- level: 1
  en: Consider which substances in air can react with sodium.
- level: 2
  en: Think about the purpose of a barrier liquid.
- level: 3
  en: Ask what the kerosene keeps away from the metal.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Kerosene hardens the metal so it is easier to handle
- id: b
  en: Sodium melts in air and must be kept in a liquid
- id: c
  en: Kerosene makes sodium more reactive, so it must be kept apart
- id: d
  en: Sodium reacts vigorously with moisture and oxygen in air
answer:
  sympy: d
  accept: []
misconception_rules:
