id: A.10.chemistry.periodic_classification_of_elements.modern_periodic_table.04
skill_ids:
- SK.A.10.chemistry.modern_periodic_table
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why do elements in the same group of the modern table show similar chemical properties?
hints:
- level: 1
  en: Think about which electrons take part in chemical reactions.
- level: 2
  en: Consider what is shared across an entire column of the table.
- level: 3
  en: Ask which particles determine how atoms bond.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They have the same number of neutrons
- id: b
  en: They have the same number of valence electrons
- id: c
  en: They have the same atomic mass
- id: d
  en: All the elements in every group are metals or all are non-metals
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.E675F29525A1
  when_answer_equals:
  - c
- id: MC.A.68C1E80DB961
  when_answer_equals:
  - a
- id: MC.A.F4ADB2A64F0D
  when_answer_equals:
  - d
solution_steps:
- en: Chemical behaviour depends mainly on the outer electrons, so elements with the same number of valence electrons react in similar ways.
- en: The correct option is b.
tier: C
