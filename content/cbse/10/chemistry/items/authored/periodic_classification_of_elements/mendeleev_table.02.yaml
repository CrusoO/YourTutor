id: A.10.chemistry.periodic_classification_of_elements.mendeleev_table.02
skill_ids:
- SK.A.10.chemistry.mendeleev_table
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What did Mendeleev do about the gaps in his table where no known element fitted?
hints:
- level: 1
  en: Think about what a gap in a pattern suggests.
- level: 2
  en: Recall what Mendeleev's table was useful for.
- level: 3
  en: Consider whether a gap reflects missing knowledge.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: He left the gaps and predicted the properties of the missing elements
- id: b
  en: He ignored the gaps because they could not be explained
- id: c
  en: He filled each gap with an element that was already placed
- id: d
  en: He removed the gaps by moving elements into different groups at random
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.09FC21AD6812
  when_answer_equals:
  - c
- id: MC.A.CED27E07C5DD
  when_answer_equals:
  - d
- id: MC.A.BD9863FC1EA8
  when_answer_equals:
  - b
solution_steps:
- en: Mendeleev predicted that undiscovered elements would fill the gaps, and estimated their properties from their neighbours in the table.
- en: The correct option is a.
tier: C
