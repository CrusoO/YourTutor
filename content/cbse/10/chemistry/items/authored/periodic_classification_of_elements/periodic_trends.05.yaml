id: A.10.chemistry.periodic_classification_of_elements.periodic_trends.05
skill_ids:
- SK.A.10.chemistry.periodic_trends
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Among sodium, magnesium and aluminium in period 3, which has the largest atomic radius, and why?
hints:
- level: 1
  en: Compare the number of protons in each atom.
- level: 2
  en: Think about the trend in size across a period.
- level: 3
  en: Consider how the nucleus affects the outer electrons.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Aluminium, because it has the most electrons
- id: b
  en: Magnesium, because it has an extra shell
- id: c
  en: Sodium, because it has the fewest protons and so the weakest pull on its outer electrons
- id: d
  en: All three are equal, because they share a period
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.5F247C2E93DE
  when_answer_equals:
  - a
- id: MC.A.544552E3741C
  when_answer_equals:
  - b
- id: MC.A.FBC1F8D9F547
  when_answer_equals:
  - d
solution_steps:
- en: Across period 3 the nuclear charge increases from sodium to aluminium, pulling the electrons closer.
- en: Sodium is therefore the largest of the three.
- en: The correct option is c.
tier: C
diagram_note: Draw three atoms in a row labelled sodium, magnesium and aluminium, each with three shells. The circles should get smaller from left to right.
