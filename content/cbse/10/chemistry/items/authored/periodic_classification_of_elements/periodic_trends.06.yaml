id: A.10.chemistry.periodic_classification_of_elements.periodic_trends.06
skill_ids:
- SK.A.10.chemistry.periodic_trends
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Element A lies directly below element B in the same group. Which statement is correct?
hints:
- level: 1
  en: Think about how many shells the element below has.
- level: 2
  en: Consider how far the outer electrons are from the nucleus.
- level: 3
  en: Ask how easily the outer electrons are lost going down a group.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A has a smaller atomic size and is less metallic than B
- id: b
  en: A has fewer shells than B and is less metallic
- id: c
  en: A has a larger atomic size and is more metallic than B
- id: d
  en: A has the same size as B and is equally metallic
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.6C37D45B7326
  when_answer_equals:
  - a
- id: MC.A.DFB1538636D3
  when_answer_equals:
  - d
- id: MC.A.DA43CE2F7910
  when_answer_equals:
  - b
solution_steps:
- en: Moving down a group adds a shell, so the atom is larger.
- en: Its outer electrons are lost more easily, so metallic character increases.
- en: The correct option is c.
tier: C
