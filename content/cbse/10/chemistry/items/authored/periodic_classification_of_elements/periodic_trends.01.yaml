id: A.10.chemistry.periodic_classification_of_elements.periodic_trends.01
skill_ids:
- SK.A.10.chemistry.periodic_trends
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Moving down a group of the periodic table, how does atomic size change?
hints:
- level: 1
  en: Think about how many shells an atom has when you go down a column.
- level: 2
  en: Consider how far the outer electrons are from the nucleus.
- level: 3
  en: Ask whether each step adds a new layer of electrons.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It increases and then decreases
- id: b
  en: It decreases, because the nuclear charge increases
- id: c
  en: It stays the same, because the number of valence electrons is constant
- id: d
  en: It increases, because each step down adds a new shell
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.139E3A015B94
  when_answer_equals:
  - b
- id: MC.A.B7E45F26FC85
  when_answer_equals:
  - c
- id: MC.A.D48B48818B87
  when_answer_equals:
  - a
solution_steps:
- en: Going down a group, each element adds an electron shell, which moves the outer electrons further from the nucleus.
- en: The correct option is d.
tier: C
diagram_note: Draw three atoms stacked vertically, each with its electron shells drawn as rings. The outer ring of each atom should lie further from the nucleus than the ring of the atom above it.
