stem:
  en: Why are isotopes of the same element placed in the same position in the modern periodic table?
hints:
- level: 1
  en: Think about what changes between isotopes and what stays the same.
- level: 2
  en: Recall what determines the identity of an element.
- level: 3
  en: Consider which particle differs between isotopes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Isotopes have different numbers of protons
- id: b
  en: Isotopes have the same atomic number, so they have the same chemical behaviour
- id: c
  en: Isotopes are placed in separate groups by their mass
- id: d
  en: Isotopes have the same mass number
answer:
  sympy: b
  accept: []
