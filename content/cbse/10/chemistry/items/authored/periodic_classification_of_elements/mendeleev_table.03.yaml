id: A.10.chemistry.periodic_classification_of_elements.mendeleev_table.03
skill_ids:
- SK.A.10.chemistry.mendeleev_table
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Mendeleev placed tellurium before iodine in his table, even though tellurium has the higher atomic mass. Why?
hints:
- level: 1
  en: Think about the rule Mendeleev used when mass and properties disagreed.
- level: 2
  en: Consider which property was most important for grouping elements.
- level: 3
  en: Ask whether his table was based on mass alone.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Tellurium is a metal, and metals always come first
- id: b
  en: Iodine had no known chemical properties
- id: c
  en: Tellurium's chemical properties matched its group better, so properties were given priority over mass
- id: d
  en: The atomic mass of iodine was measured incorrectly and so was not used
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.3A863921C525
  when_answer_equals:
  - a
- id: MC.A.93D7C252751E
  when_answer_equals:
  - d
- id: MC.A.421984BE15AF
  when_answer_equals:
  - b
solution_steps:
- en: Mendeleev gave priority to chemical properties where the order by mass conflicted with the pattern of the groups.
- en: This is why tellurium was placed before iodine.
- en: The correct option is c.
tier: C
