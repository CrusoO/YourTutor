id: A.10.chemistry.periodic_classification_of_elements.periodic_trends.03
skill_ids:
- SK.A.10.chemistry.periodic_trends
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Across period 3, from sodium to chlorine, how does atomic size change, and why?
hints:
- level: 1
  en: Think about how many protons are added across the period.
- level: 2
  en: Consider whether new shells are added across a period.
- level: 3
  en: Ask how the nucleus affects the outer electrons.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It stays the same, because all these atoms have three shells
- id: b
  en: It decreases, because the nuclear charge rises while the electrons stay in the same shell
- id: c
  en: It increases, because more electrons are added
- id: d
  en: It increases and then decreases
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.4B140F3C9AAE
  when_answer_equals:
  - c
- id: MC.A.3012F3511818
  when_answer_equals:
  - a
- id: MC.A.161C93059261
  when_answer_equals:
  - d
solution_steps:
- en: Atoms across a period fill the same shell, but each step adds a proton.
- en: The stronger pull of the nucleus draws the electrons in, so the atom gets smaller.
- en: The correct option is b.
tier: C
diagram_note: Draw a row of atoms from sodium to chlorine, labelled with their symbols, with circles whose size shrinks from left to right.
