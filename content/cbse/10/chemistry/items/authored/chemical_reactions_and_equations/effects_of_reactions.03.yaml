stem:
  en: Chips packets are often filled with nitrogen gas before they are sealed. What is the main purpose?
hints:
- level: 1
  en: Consider which gas in air causes oxidation.
- level: 2
  en: Think about why an unreactive gas would be chosen.
- level: 3
  en: Look for the reaction that spoils fatty food.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: To speed up the ripening of the chips
- id: b
  en: To keep oxygen away so the fats in the food do not become rancid
- id: c
  en: To make the packet feel lighter in the hand
- id: d
  en: To cool the food before the packet is sealed
answer:
  sympy: b
  accept: []
