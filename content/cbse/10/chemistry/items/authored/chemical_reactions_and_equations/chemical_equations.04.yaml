id: A.10.chemistry.chemical_reactions_and_equations.chemical_equations.04
skill_ids:
- SK.A.10.chemistry.chemical_equations
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Calcium carbonate is heated strongly and breaks down into calcium oxide and carbon dioxide. Which word equation represents this?
hints:
- level: 1
  en: Identify the single substance the reaction starts with.
- level: 2
  en: Write down the substances that the heating produces.
- level: 3
  en: Keep the arrow pointing in the direction the reaction goes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: calcium carbonate + carbon dioxide -> calcium oxide
- id: b
  en: calcium oxide + carbon dioxide -> calcium carbonate
- id: c
  en: calcium -> calcium oxide + carbon dioxide
- id: d
  en: calcium carbonate -> calcium oxide + carbon dioxide
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.441282F40576
  when_answer_equals:
  - b
- id: MC.A.BAD6671E029F
  when_answer_equals:
  - c
- id: MC.A.24F6CD491867
  when_answer_equals:
  - a
solution_steps:
- en: Heating splits one reactant into two products, so calcium carbonate goes before the arrow and the two products go after it.
- en: The correct option is d.
tier: C
