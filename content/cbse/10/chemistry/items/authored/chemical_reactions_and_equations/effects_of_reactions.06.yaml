id: A.10.chemistry.chemical_reactions_and_equations.effects_of_reactions.06
skill_ids:
- SK.A.10.chemistry.effects_of_reactions
difficulty: 0.9
pool: practice
role: explain
stem:
  en: An iron gate is painted rather than left bare. Which explanation is correct?
hints:
- level: 1
  en: Recall what rusting needs from the air.
- level: 2
  en: Think about what a painted layer does to the surface.
- level: 3
  en: Ask which two things must reach the iron for it to rust.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Paint warms the iron so that water cannot form on it
- id: b
  en: Paint reacts with rust and turns it back into iron
- id: c
  en: Paint chemically bonds to the iron and makes it stronger
- id: d
  en: The paint keeps oxygen and water away from the iron, so rusting is slowed
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.107D11D4BFC4
  when_answer_equals:
  - c
- id: MC.A.892404B2284C
  when_answer_equals:
  - b
- id: MC.A.329AF5054A92
  when_answer_equals:
  - a
solution_steps:
- en: Rusting needs both oxygen and water.
- en: A layer of paint blocks contact with both, so the iron is protected.
- en: The correct option is d.
tier: C
