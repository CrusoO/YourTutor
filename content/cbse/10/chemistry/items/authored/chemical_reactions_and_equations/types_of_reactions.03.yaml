difficulty: 0.6
pool: practice
role: apply
stem:
  en: 'Silver nitrate solution reacts with sodium chloride solution to give a white precipitate of silver chloride and sodium nitrate solution: AgNO3(aq) + NaCl(aq) -> AgCl(s) + NaNO3(aq). Which type of reaction is this?'
hints:
- level: 1
  en: Note how many compounds are on each side of the arrow.
- level: 2
  en: Check whether the ions exchange partners.
- level: 3
  en: Notice which pairs of ions end up together in the products.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Combination
- id: b
  en: Decomposition
- id: c
  en: Displacement
- id: d
  en: Double displacement
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.DC8872EDB5B9
  when_answer_equals:
  - a
- id: MC.A.C1007C0976A4
  when_answer_equals:
