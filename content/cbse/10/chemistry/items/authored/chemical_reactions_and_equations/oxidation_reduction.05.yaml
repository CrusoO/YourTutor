difficulty: 0.9
pool: practice
role: transfer
stem:
  en: In the reaction ZnO + C -> Zn + CO, which statement is correct?
hints:
- level: 1
  en: Track which substance loses oxygen.
- level: 2
  en: Track which substance gains oxygen.
- level: 3
  en: Check each reactant separately.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Neither substance takes part in oxidation or reduction
- id: b
  en: Both ZnO and C are reduced
- id: c
  en: ZnO is oxidised and C is reduced
- id: d
  en: ZnO is reduced and C is oxidised
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.6411411273C0
  when_answer_equals:
  - c
- id: MC.A.6DC3B3DFA3B2
  when_answer_equals:
  - b
- id: MC.A.C60B236CE64F
  when_answer_equals:
  - a
solution_steps:
- en: ZnO loses oxygen to become Zn, so it is reduced.
- en: Carbon gains oxygen to become CO, so it is oxidised.
- en: The correct option is d.
tier: C
