stem:
  en: Lead nitrate solution is added to potassium iodide solution, and a yellow solid of lead iodide forms. Which type of reaction is this?
hints:
- level: 1
  en: Count the compounds on each side of the equation.
- level: 2
  en: Track which ions move from one compound into another.
- level: 3
  en: Check whether any single element is set free.
prediction_prompt:
