id: A.10.chemistry.chemical_reactions_and_equations.chemical_equations.03
skill_ids:
- SK.A.10.chemistry.chemical_equations
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Which statement about a skeletal chemical equation is correct?
hints:
- level: 1
  en: Think about what the word skeletal suggests.
- level: 2
  en: Ask whether the counts of atoms are shown or checked.
- level: 3
  en: Compare it with a word equation and with a balanced equation.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It shows the energy change written as a number
- id: b
  en: It shows the formulas of the reactants and products but does not yet show the number of atoms of each element on both sides
- id: c
  en: It names the substances in words instead of formulas
- id: d
  en: It always has equal numbers of each atom on both sides
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.81BD36F67C1B
  when_answer_equals:
  - d
- id: MC.A.D019C2C2F4F4
  when_answer_equals:
  - c
- id: MC.A.FE73D5634ABC
  when_answer_equals:
  - a
solution_steps:
- en: A skeletal equation gives the formulas only.
- en: Balancing it, so that each element has the same count on both sides, is a separate step.
- en: The correct option is b.
tier: C
