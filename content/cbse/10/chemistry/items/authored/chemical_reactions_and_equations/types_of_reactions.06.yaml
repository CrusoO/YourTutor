id: A.10.chemistry.chemical_reactions_and_equations.types_of_reactions.06
skill_ids:
- SK.A.10.chemistry.types_of_reactions
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Calcium carbonate absorbs heat as it breaks into calcium oxide and carbon dioxide. Which feature identifies this as a decomposition reaction?
hints:
- level: 1
  en: Count the reactants and the products.
- level: 2
  en: Separate the question of heat from the question of how many substances take part.
- level: 3
  en: Focus on the number of substances on each side.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A more reactive element takes the place of another in a compound
- id: b
  en: Two elements combine into one compound
- id: c
  en: Heat is released to the surroundings
- id: d
  en: One reactant gives two or more simpler products
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.D43F4FA6372A
  when_answer_equals:
  - b
- id: MC.A.FF5DDE2D3A23
  when_answer_equals:
  - a
- id: MC.A.BE96C1D9328B
  when_answer_equals:
  - c
solution_steps:
- en: The single reactant breaks into two simpler products, which makes it decomposition even though heat is absorbed.
- en: Heat change is a separate way of describing a reaction.
- en: The correct option is d.
tier: C
