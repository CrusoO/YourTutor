id: A.10.chemistry.chemical_reactions_and_equations.chemical_equations.06
skill_ids:
- SK.A.10.chemistry.chemical_equations
difficulty: 0.9
pool: practice
role: explain
stem:
  en: In the equation Zn(s) + 2HCl(aq) -> ZnCl2(aq) + H2(g), what does the symbol (aq) tell you about the zinc chloride?
hints:
- level: 1
  en: Look up what the letters aq stand for.
- level: 2
  en: Compare with the other state symbols in the equation.
- level: 3
  en: Think about the medium in which the reaction takes place.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is the acid that was used up completely
- id: b
  en: It is a solid that settles out of the mixture
- id: c
  en: It is a gas given off during the reaction
- id: d
  en: It is dissolved in water
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.00A7289158D7
  when_answer_equals:
  - c
- id: MC.A.001A8798F072
  when_answer_equals:
  - b
- id: MC.A.10D3DB5D9792
  when_answer_equals:
  - a
solution_steps:
- en: The state symbol (aq) means aqueous, that is dissolved in water.
- en: The symbols (s), (l) and (g) mean solid, liquid and gas.
- en: The correct option is d.
tier: C
