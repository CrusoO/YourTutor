solution_steps:
- en: Magnesium forms Mg2+ and nitride forms N3-, so three magnesium ions balance two nitride ions, giving Mg3N2.
- en: Nitrogen gas is the diatomic molecule N2.
- en: The correct option is a.
tier: C
