id: A.10.chemistry.chemical_reactions_and_equations.chemical_equations.02
skill_ids:
- SK.A.10.chemistry.chemical_equations
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which skeletal equation correctly represents hydrogen gas reacting with oxygen gas to form water?
hints:
- level: 1
  en: Recall the diatomic form of each gas.
- level: 2
  en: Check the formula of water.
- level: 3
  en: Make sure the reactants are on the left of the arrow.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: H2 + O2 -> HO2
- id: b
  en: H2O -> H2 + O2
- id: c
  en: H2 + O2 -> H2O
- id: d
  en: H + O -> H2O
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.DBC9B01E1B27
  when_answer_equals:
  - d
- id: MC.A.692DF51029D8
  when_answer_equals:
  - a
- id: MC.A.BAC72A9D6CC9
  when_answer_equals:
