id: A.10.chemistry.chemical_reactions_and_equations.oxidation_reduction.06
skill_ids:
- SK.A.10.chemistry.oxidation_reduction
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A student says, 'Oxidation and reduction always happen separately, so in a reaction only one substance is either oxidised or reduced.' Which statement corrects this?
hints:
- level: 1
  en: Consider where the oxygen goes in a reaction.
- level: 2
  en: Think about what one substance gives to the other.
- level: 3
  en: Check the definitions you have learned for both processes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Only metals can be oxidised
- id: b
  en: Reduction only involves gain of oxygen, never hydrogen
- id: c
  en: Oxidation can happen alone, without any reduction, in any reaction
- id: d
  en: Oxidation and reduction always occur together, so whenever one substance is oxidised another is reduced
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.DAC5CC673015
  when_answer_equals:
  - c
- id: MC.A.2744F6E2B682
  when_answer_equals:
  - a
- id: MC.A.5336E21E322F
  when_answer_equals:
  - b
solution_steps:
- en: Oxygen given by one substance is taken by another, so the two processes happen together.
- en: This is why the term redox covers both.
- en: The correct option is d.
tier: C
