id: A.10.chemistry.chemical_reactions_and_equations.types_of_reactions.04
skill_ids:
- SK.A.10.chemistry.types_of_reactions
difficulty: 0.6
pool: practice
role: explain
stem:
  en: 'Iron nails placed in copper sulphate solution gradually become coated with reddish copper: Fe + CuSO4 -> FeSO4 + Cu. Why is this called a displacement reaction?'
hints:
- level: 1
  en: Look at which element ends up on its own in the products.
- level: 2
  en: Track which element leaves the compound.
- level: 3
  en: Think about how the two metals compare in reactivity.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Iron takes the place of copper in the compound, which is set free as the element
- id: b
  en: Copper and iron combine to make a single compound
- id: c
  en: Both reactants split into simpler substances
- id: d
  en: Heat must be supplied before the reaction can start
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.7CABD544CBC2
  when_answer_equals:
  - b
- id: MC.A.0359F25EBAD5
  when_answer_equals:
  - d
- id: MC.A.727CD777DE49
  when_answer_equals:
  - c
solution_steps:
- en: A more reactive metal displaces a less reactive metal from its compound.
- en: Iron is more reactive than copper, so copper is set free as the element.
- en: The correct option is a.
tier: C
