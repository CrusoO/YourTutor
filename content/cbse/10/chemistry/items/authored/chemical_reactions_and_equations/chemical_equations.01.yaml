id: A.10.chemistry.chemical_reactions_and_equations.chemical_equations.01
skill_ids:
- SK.A.10.chemistry.chemical_equations
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In a word equation, what do the names written after the arrow stand for?
hints:
- level: 1
  en: Look at which side of the arrow the starting substances are written on.
- level: 2
  en: Think about the direction the arrow points.
- level: 3
  en: Recall what a catalyst does and whether it is used up.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The solvents the reaction is carried out in
- id: b
  en: The reactants used up in the reaction
- id: c
  en: The products formed in the reaction
- id: d
  en: The catalysts that speed up the reaction
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.118F002F8B93
  when_answer_equals:
  - b
- id: MC.A.CEDD566562FA
  when_answer_equals:
  - d
- id: MC.A.4F11BD938891
  when_answer_equals:
  - a
solution_steps:
- en: The arrow points from reactants to products.
- en: Substances written after the arrow are the products that are formed.
- en: The correct option is c.
tier: C
