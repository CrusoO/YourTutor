stem:
  en: Bleaching powder is used to disinfect drinking water. Which explanation best describes how it works?
hints:
- level: 1
  en: Consider which element is released from the compound during the reaction.
- level: 2
  en: Think about what kills microbes in water.
- level: 3
  en: Ask whether the process changes the salt content or the microbes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
