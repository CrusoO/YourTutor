  author: model-draft
type: mcq
options:
- id: a
  en: It removes dissolved salts from the water
- id: b
  en: It releases chlorine when it reacts with water or acid, and the chlorine kills microbes
- id: c
  en: It releases oxygen, which is the only disinfecting agent
- id: d
  en: It changes the pH of the water to neutral and nothing more
