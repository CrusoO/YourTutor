difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A solution turns green when universal indicator is added. What can be concluded about its pH?
hints:
- level: 1
  en: Recall the range of colours on the universal indicator chart.
- level: 2
  en: Think about where green sits between red and purple.
- level: 3
  en: Ask what a strongly acidic or strongly basic reading would look like.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It contains a metal, which turns the indicator green
- id: b
  en: It is close to pH 7, so it is nearly neutral
- id: c
  en: It is strongly acidic, around pH 1
- id: d
  en: It is strongly basic, around pH 13
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.E6B087B9D462
