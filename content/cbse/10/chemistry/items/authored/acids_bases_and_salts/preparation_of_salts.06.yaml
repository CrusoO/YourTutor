difficulty: 0.9
pool: practice
role: explain
stem:
  en: Plaster of Paris hardens when it is mixed with water. Which statement best describes what happens?
hints:
- level: 1
  en: Consider whether water is added or removed during setting.
- level: 2
  en: Think about the reverse of the heating step.
- level: 3
  en: Ask what kind of solid the setting produces.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It loses all its water and turns into quicklime
- id: b
  en: It takes up water and forms a hard crystalline solid of gypsum
- id: c
  en: It reacts with water to form a strong acid
- id: d
  en: It melts and cools into a transparent glass
answer:
  sympy: b
  accept: []
misconception_rules:
