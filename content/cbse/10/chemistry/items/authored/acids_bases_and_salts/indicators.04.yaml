difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why can an extract of turmeric be used as an indicator?
hints:
- level: 1
  en: Think about what property of the solution the pigment responds to.
- level: 2
  en: Ask whether the pigment is used up or remains unchanged.
- level: 3
  en: Consider what makes a substance an indicator rather than a reactant.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It reacts with metals and forms salts that colour the solution
- id: b
  en: Its pigment changes colour with the acidity or basicity of the solution
- id: c
  en: It releases hydrogen gas in acids, which changes the colour
- id: d
  en: It turns into a base when it is added to an acid
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.7083B583A972
  when_answer_equals:
  - c
- id: MC.A.5AB2A8373B4C
  when_answer_equals:
