- id: MC.A.59E6AE09D322
  when_answer_equals:
  - d
solution_steps:
- en: Natural dyes such as turmeric contain pigments whose colour depends on the pH of the solution.
- en: This is what makes them indicators.
- en: The correct option is b.
tier: C
