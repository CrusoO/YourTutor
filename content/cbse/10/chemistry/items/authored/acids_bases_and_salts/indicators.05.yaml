stem:
  en: Red litmus paper is dipped into a solution of sodium chloride, which is a neutral salt. What is observed?
hints:
- level: 1
  en: Recall what red litmus responds to.
- level: 2
  en: Consider whether the salt is acidic, basic or neutral.
- level: 3
  en: Think about how a neutral solution affects litmus.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It turns green
- id: b
  en: It turns blue because the salt is basic
- id: c
  en: It turns colourless
- id: d
  en: The paper stays red
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.71181A24DD33
  when_answer_equals:
  - b
- id: MC.A.E9331527BB06
  when_answer_equals:
