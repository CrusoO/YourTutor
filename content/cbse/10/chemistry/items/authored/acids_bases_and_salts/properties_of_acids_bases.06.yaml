stem:
  en: Why should concentrated acid be added slowly to water during dilution, and not water to the acid?
hints:
- level: 1
  en: Think about what happens to temperature when the two liquids mix.
- level: 2
  en: Consider which liquid is in the larger amount during mixing.
- level: 3
  en: Ask what could spatter out of the container if the heat builds up.
