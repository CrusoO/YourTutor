options:
- id: a
  en: Acid added to water releases a poisonous gas
- id: b
  en: Water added to acid turns the acid into a base
- id: c
  en: Water added to acid makes the mixture more concentrated
- id: d
  en: Dilution releases a lot of heat, so adding acid slowly to a large volume of water spreads the heat safely
