- id: MC.A.72145461ACA2
  when_answer_equals:
  - a
solution_steps:
- en: Acidic behaviour needs hydrogen ions, which form when the gas dissolves in water and ionises.
- en: Without water, the gas does not produce them.
- en: The correct option is c.
tier: C
