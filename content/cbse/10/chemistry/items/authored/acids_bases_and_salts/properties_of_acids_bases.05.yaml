stem:
  en: Dry hydrogen chloride gas does not turn dry blue litmus paper red, but a solution of hydrogen chloride in water does. What explains this?
hints:
- level: 1
  en: Think about what is needed for hydrogen ions to form.
- level: 2
  en: Consider what water does to the gas.
- level: 3
  en: Ask which property of an acid needs a solvent.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Hydrogen chloride gas contains no hydrogen
- id: b
  en: Litmus responds only to liquids, not to gases
- id: c
  en: Hydrogen ions are formed only when the gas dissolves in water
- id: d
  en: Dry hydrogen chloride is a base
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.C45FDC4889D9
  when_answer_equals:
  - d
- id: MC.A.D37F02A5A064
  when_answer_equals:
