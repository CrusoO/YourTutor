solution_steps:
- en: Going from term 5 to term 6 takes 1 equal steps, and the terms change by 5.
- en: So the common difference is 5 / 1 = 5.
- en: 'Go back to the first term: a = 14 - (5 - 1)(5) = -6.'
- en: Then a_9 = -6 + (9 - 1)(5) = 34.
- en: The correct option is c.
