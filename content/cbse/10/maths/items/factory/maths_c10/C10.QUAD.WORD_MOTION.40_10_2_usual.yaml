solution_steps:
- en: Let x km/h be the usual speed. The time taken is 400/x hours, and at the higher
    speed it is 400/(x + 10) hours.
- en: 'The saving is 2: 400/x - 400/(x + 10) = 2. Multiply every term by x(x + 10)
    to clear the fractions.'
- en: This gives 2x² + 20x - 4000 = 0, which factorises as (x - 40)(x + 50) = 0 after
    dividing by 2.
- en: A speed is positive, so the usual speed is 40 km/h and the faster speed is 50
    km/h.
- en: The correct option is d.
