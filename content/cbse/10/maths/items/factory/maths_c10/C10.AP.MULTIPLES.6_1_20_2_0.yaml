stem:
  en: What is the sum of the multiples of 6 that lie between 4 and 120, ends included?
options:
- id: a
  en: '1240'
- id: b
  en: '2520'
- id: c
  en: '1197'
- id: d
  en: '1260'
answer:
  sympy: d
  accept: []
solution_steps:
- en: The first multiple of 6 in the range is 6 and the last is 120.
- en: 'They form an AP with common difference 6. Number of terms: (120 - 6)/6 + 1
    = 20.'
- en: S = (20/2)(6 + 120) = 1260.
- en: The correct option is d.
hints:
- level: 1
  en: List the first multiple inside the range and the last multiple inside it.
- level: 2
  en: Work out how many multiples lie between the first and last, remembering to add
    one to the count, then use the sum rule with the first and last multiples.
- level: 3
  en: 'Full method: find the first and last multiples inside the range, count them
    using the difference between multiples, then multiply the count by half the sum
    of the first and last multiples.'
prediction_prompt:
  en: About how many multiples do you expect in the range?
