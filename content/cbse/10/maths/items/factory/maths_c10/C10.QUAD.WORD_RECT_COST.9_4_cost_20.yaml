solution_steps:
- en: Let x metres be the breadth. Then the length is x + 9 metres.
- en: The area gives x(x + 9) = 52, so x² + 9x - 52 = 0.
- en: 'Factorise: (x - 4)(x + 13) = 0, so x = 4 or x = -13; a length is positive,
    so the breadth is 4 m and the length is 13 m.'
- en: The perimeter is 2(4 + 13) = 34 m, and the cost is 34 x 20.
- en: The correct option is a.
