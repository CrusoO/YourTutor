solution_steps:
- en: No solution needs equal ratios of the x and y coefficients, and a different
    ratio for the constants.
- en: 'Use the ratios that contain k: 1/-2 = -3/k, so k = 6.'
- en: 'Check the constants: -3/7 differs from the coefficient ratio, so there really
    is no solution.'
