solution_steps:
- en: 'Equal roots need the discriminant to be zero: k² - 4(2)(8) = 0.'
- en: So k² = 64.
- en: 'Take the square root of both sides, keeping both signs: k = -8 or k = 8.'
- en: The correct option is c.
