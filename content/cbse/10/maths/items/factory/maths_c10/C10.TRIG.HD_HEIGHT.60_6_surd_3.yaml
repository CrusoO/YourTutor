- MATH.TRIG.HD.HEIGHT_FROM_DISTANCE
difficulty: 0.39
type: mcq
pool: practice
role: apply
stem:
  en: A flagpole stands upright on level ground. From a point on the ground 6 m from
    the foot, the angle of elevation of the top is 60°. Find the height of the flagpole
    in metres.
options:
- id: a
  en: '3'
- id: b
  en: 2√3
- id: c
  en: 6√3
- id: d
  en: 3√3
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Sketch a right triangle: the flagpole is the side opposite the 60° angle and
    the ground distance is the adjacent side.'
- en: 'Opposite and adjacent sides link through tan 60°: height = 6 x tan 60°.'
- en: With tan 60° taken from the table, the height is 6√3 m.
- en: The correct option is c.
hints:
- level: 1
  en: Draw the right triangle first and label what is known and what is wanted.
- level: 2
  en: The ratio that links the opposite side to the adjacent side is the tangent.
    Write it as one relation and undo the division by doing the same thing to each
    side.
- level: 3
  en: 'Full method: sketch and label the triangle, name the two sides involved, write
    the tangent ratio for the stated angle, replace the tangent by its exact value,
    and solve for the height.'
prediction_prompt:
  en: Is the height larger or smaller than the distance from the foot?
