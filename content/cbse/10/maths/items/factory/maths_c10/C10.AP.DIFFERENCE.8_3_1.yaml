solution_steps:
- en: In an AP every term is the previous term plus the same number, the common difference.
- en: 'Subtract a term from the one after it: 11 - (8) = 3.'
- en: 'Check with another pair: 14 - (11) = 3. The common difference is 3.'
- en: The correct option is c.
