solution_steps:
- en: Let x be the smaller number. The other is x + 2.
- en: Their product is 8, so x(x + 2) = 8, which is x² + 2x - 8 = 0.
- en: 'Factorise: (x - 2)(x + 4) = 0, so x = 2 or x = -4.'
- en: The numbers must be positive, so the smaller number is 2.
- en: The correct option is a.
