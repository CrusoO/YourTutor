solution_steps:
- en: The first term is 13, the last term is 47 and the difference is 2.
- en: 'Number of terms: n = (47 - 13)/2 + 1 = 18.'
- en: S = (n/2)(first + last) = (18/2)(13 + 47) = 540.
- en: The correct option is c.
