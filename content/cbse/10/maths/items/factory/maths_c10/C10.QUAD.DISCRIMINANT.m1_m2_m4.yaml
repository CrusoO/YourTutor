stem:
  en: What is the value of the discriminant of -x² - 2x - 4 = 0?
options:
- id: a
  en: '0'
- id: b
  en: '-12'
- id: c
  en: '-20'
- id: d
  en: '20'
answer:
  sympy: b
  accept: []
solution_steps:
- en: Here the coefficients are -1, -2 and -4.
- en: The discriminant is b² - 4ac = (-2)² - 4(-1)(-4).
- en: This equals 4 - (16) = -12.
- en: The correct option is b.
hints:
- level: 1
  en: Be careful with brackets around negative numbers when you square.
- level: 2
  en: Square the x coefficient first, then work out four times the product of the
    other two coefficients, and subtract.
- level: 3
  en: 'Full method: write the three coefficients with signs, square the middle one,
    multiply the outer two together and then by four, and subtract the second result
    from the first.'
prediction_prompt:
  en: Will the discriminant be positive, zero or negative?
