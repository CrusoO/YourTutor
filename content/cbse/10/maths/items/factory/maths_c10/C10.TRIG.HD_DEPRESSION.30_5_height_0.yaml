stem:
  en: A boat on the sea is 5√3 m from the foot of a lighthouse. From the top of the
    lighthouse the angle of depression of a boat is 30°. Find the height of the lighthouse
    in metres.
hints:
- level: 1
  en: Alternate angles let you move the angle to the bottom of the triangle.
- level: 2
  en: After placing the angle inside the right triangle, decide which side is opposite
    it and which is adjacent, then use the matching ratio and undo it by doing the
    same thing to each side.
- level: 3
  en: 'Full method: sketch the horizontal line from the top, mark the angle below
    it, copy that angle into the right triangle using alternate angles, pick the ratio
    for the two sides involved, and solve.'
prediction_prompt:
  en: Does the sight line make a steep or a shallow angle with the horizontal?
