stem:
  en: For 2x + 4y + 3 = 0 and 3x + y - 7 = 0, the ratio formula is written x/p = y/q
    = 1/r. Find the value of r.
hints:
- level: 1
  en: Each denominator in the formula is made from two products of the coefficients.
- level: 2
  en: Subtract the products in the order the formula gives. Reversing the order reverses
    the sign of the answer.
- level: 3
  en: 'Full method: identify the coefficients and constants of both equations, then
    evaluate the wanted difference of products with great care over signs.'
prediction_prompt:
  en: Will the number come out positive or negative?
