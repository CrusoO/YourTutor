solution_steps:
- en: Multiply the first equation by 4 and the second by 3, every term, so both x
    coefficients become 12.
- en: 'Subtract the second new equation from the first: -21y = -42, so y = 2.'
- en: Put y = 2 in the first original equation to get x = -2.
- en: The correct option is c.
