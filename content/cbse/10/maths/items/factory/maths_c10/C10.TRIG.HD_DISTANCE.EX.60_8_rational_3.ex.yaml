solution_steps:
- en: The flagpole is the side opposite the 60° angle and the shadow is the adjacent
    side.
- en: tan 60° = opposite / adjacent, so shadow = 8√3 / tan 60°.
- en: 'Replace the tangent by its exact value and simplify: the shadow is 8 m.'
- en: The correct option is a.
