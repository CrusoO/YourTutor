stem:
  en: A runner trains for 8 weeks. In week 1 she runs 35 km and each week she runs
    2 km more than the week before. How far does she run in all the weeks together,
    in km?
options:
- id: a
  en: '336'
- id: b
  en: '49'
- id: c
  en: '672'
- id: d
  en: '344'
answer:
  sympy: a
  accept: []
solution_steps:
- en: The amounts form an AP with first term 35 and common difference 2.
- en: The last amount is 49, so the total is S = (8/2)(35 + 49).
- en: S = 336.
- en: The correct option is a.
