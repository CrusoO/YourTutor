solution_steps:
- en: Let x be the smaller number. The other is x + 2.
- en: Their product is 675, so x(x + 2) = 675, which is x² + 2x - 675 = 0.
- en: 'Factorise: (x - 25)(x + 27) = 0, so x = 25 or x = -27.'
- en: The numbers must be positive, so the smaller number is 25.
- en: The correct option is c.
