difficulty: 0.42
type: mcq
pool: practice
role: procedure
stem:
  en: Solve x² + 4x - 12 = 0.
options:
- id: a
  en: x = -6
- id: b
  en: x = -6 or x = -2
- id: c
  en: x = -6 or x = 2
- id: d
  en: x = -2 or x = 6
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Look for two numbers with product -12 and sum 4: they are 6 and -2.'
- en: 'Factorise: (x + 6)(x - 2) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: x + 6 = 0 gives x
    = -6 and x - 2 = 0 gives x = 2.'
- en: The correct option is c.
hints:
- level: 1
  en: Try writing the left side as two brackets multiplied together.
- level: 2
  en: Find two numbers that multiply to the plain number and add to the x coefficient.
    Then set each bracket to zero and undo it by doing the same thing to both sides.
- level: 3
  en: 'Full method: factorise the left side, set each bracket to zero, add or subtract
    the same number on both sides, divide both sides by the coefficient of x, then
    check each solution by substituting it back.'
prediction_prompt:
  en: How many different values of x do you expect?
