solution_steps:
- en: The first term is 1, the last term is 92 and the difference is 7.
- en: 'Number of terms: n = (92 - 1)/7 + 1 = 14.'
- en: S = (n/2)(first + last) = (14/2)(1 + 92) = 651.
- en: The correct option is c.
