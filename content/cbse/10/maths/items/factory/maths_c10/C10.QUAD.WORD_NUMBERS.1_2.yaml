stem:
  en: The product of two consecutive positive integers is 6. Find the smaller one.
options:
- id: a
  en: '-3'
- id: b
  en: '2'
- id: c
  en: '1'
- id: d
  en: '3'
answer:
  sympy: b
  accept: []
solution_steps:
- en: Let x be the smaller number. The other is x + 1.
- en: Their product is 6, so x(x + 1) = 6, which is x² + 1x - 6 = 0.
- en: 'Factorise: (x - 2)(x + 3) = 0, so x = 2 or x = -3.'
- en: The numbers must be positive, so the smaller number is 2.
- en: The correct option is b.
hints:
- level: 1
  en: Let x be the smaller number and write the other number using x.
- level: 2
  en: Write the product as one relation in x, bring every term to one side, then factorise
    or use the formula. Check which solution fits the words of the question.
- level: 3
  en: 'Full method: name the smaller number, write the larger one, form the product
    relation, rearrange so the right side is zero, solve, and reject any solution
    that is not positive.'
prediction_prompt:
  en: Roughly how big do you expect the smaller number to be?
