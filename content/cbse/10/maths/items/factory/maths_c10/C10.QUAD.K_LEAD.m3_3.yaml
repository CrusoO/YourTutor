difficulty: 0.56
type: mcq
pool: practice
role: apply
stem:
  en: Find the value of k for which kx² - 18x - 3 = 0 has two equal real roots.
options:
- id: a
  en: k = -27
- id: b
  en: k = -54
- id: c
  en: k = -108
- id: d
  en: k = 27
answer:
  sympy: a
  accept: []
solution_steps:
- en: Equal roots need b² - 4ac = 0, so (-18)² - 4(k)(-3) = 0.
- en: 'This gives 324 - -12k = 0. Add -12k to both sides: -12k = 324.'
- en: 'Divide both sides by -12: k = -27.'
- en: The correct option is a.
hints:
- level: 1
  en: Equal roots mean the discriminant is zero. Put the unknown k into it.
- level: 2
  en: You will get an equation that is linear in k. Undo each operation by doing the
    same thing to both sides.
- level: 3
  en: 'Full method: write the discriminant using k as the leading coefficient, set
    it to zero, collect the k term on one side by adding the same amount to both sides,
    then divide both sides by the number multiplying k.'
prediction_prompt:
  en: Will k have the same sign as the plain number?
