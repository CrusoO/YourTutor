solution_steps:
- en: Let x km/h be the usual speed. The time taken is 715/x hours, and at the higher
    speed it is 715/(x + 10) hours.
- en: 'The saving is 2: 715/x - 715/(x + 10) = 2. Multiply every term by x(x + 10)
    to clear the fractions.'
- en: This gives 2x² + 20x - 7150 = 0, which factorises as (x - 55)(x + 65) = 0 after
    dividing by 2.
- en: A speed is positive, so the usual speed is 55 km/h and the faster speed is 65
    km/h.
- en: The correct option is c.
