solution_steps:
- en: The first multiple of 9 in the range is 9 and the last is 270.
- en: 'They form an AP with common difference 9. Number of terms: (270 - 9)/9 + 1
    = 30.'
- en: S = (30/2)(9 + 270) = 4185.
