difficulty: 0.8
pool: practice
role: explain
stem:
  en: From a point on level ground close to a tower the angle of elevation of its
    top is 45°. After walking 16 m directly away from the tower, the angle of elevation
    becomes 30°. Find the height of the tower in metres. A classmate says the answer
    is 16. Work it out yourself and choose the correct answer.
hints:
- level: 1
  en: Draw both positions on one diagram with the tower standing on the same line.
- level: 2
  en: Write the ground distance from each position in terms of the height. Their difference
    equals the distance walked. Then undo each operation by doing the same thing to
    each side to get the height.
- level: 3
  en: 'Full method: draw the figure, write each ground distance using the tangent
    of the angle, subtract to match the distance walked, replace tangents by exact
    values, collect the height terms, and divide each side to isolate the height.'
prediction_prompt:
  en: Is the tower taller or shorter than the distance walked?
