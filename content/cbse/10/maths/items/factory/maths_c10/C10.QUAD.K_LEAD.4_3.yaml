solution_steps:
- en: Equal roots need b² - 4ac = 0, so (24)² - 4(k)(4) = 0.
- en: 'This gives 576 - 16k = 0. Add 16k to both sides: 16k = 576.'
- en: 'Divide both sides by 16: k = 36.'
- en: The correct option is a.
