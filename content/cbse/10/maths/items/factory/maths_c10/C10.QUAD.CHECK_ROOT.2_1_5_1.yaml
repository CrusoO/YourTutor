stem:
  en: One of the following is a root of 2x² - 12x + 10 = 0. Which one?
options:
- id: a
  en: '10'
- id: b
  en: '6'
- id: c
  en: '5'
- id: d
  en: '-5'
answer:
  sympy: c
  accept: []
solution_steps:
- en: A value satisfies the equation when substituting it makes the left side equal
    to 0.
- en: 'Substitute x = 5: 2(5)² + (-12)(5) + (10) = 0.'
- en: The left side is 0, so x = 5 satisfies the equation.
- en: The correct option is c.
hints:
- level: 1
  en: Solutions are the numbers that make the left side exactly zero.
- level: 2
  en: Substitute the choices one after another, work out the left side carefully with
    its signs, and see whether it comes to zero.
- level: 3
  en: 'Full method: replace x by the choice, square first, then multiply by the coefficients,
    add the terms, and keep only the choice that gives zero.'
prediction_prompt:
  en: Which choice looks most likely to work?
