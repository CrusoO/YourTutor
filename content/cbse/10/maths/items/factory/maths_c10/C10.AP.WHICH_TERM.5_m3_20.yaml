difficulty: 0.44
type: mcq
pool: practice
role: procedure
stem:
  en: In the progression 5, 2, -1, ... the number -52 appears. Which term is it?
options:
- id: a
  en: '21'
- id: b
  en: '19'
- id: c
  en: '20'
- id: d
  en: '-57'
answer:
  sympy: c
  accept: []
solution_steps:
- en: The first term is 5 and the common difference is -3.
- en: 'Set the nth term equal to -52: 5 + (n - 1)(-3) = -52.'
- en: 'Take 5 away from both sides: (n - 1)(-3) = -57. Divide both sides by -3: n
    - 1 = 19.'
- en: 'Add 1 to both sides: n = 20.'
- en: The correct option is c.
hints:
- level: 1
  en: Use the rule for the nth term, but this time n is the thing you do not know.
- level: 2
  en: 'Undo each operation in the rule by doing the same thing to each side: first
    take away the first term, then divide by the difference, then deal with the minus
    one.'
- level: 3
  en: 'Full method: write first term + (n - 1) x difference, set it equal to the target,
    take away the first term from each side, divide each side by the difference, and
    add one to each side.'
prediction_prompt:
  en: Roughly how many steps from the first term will it take to reach this number?
