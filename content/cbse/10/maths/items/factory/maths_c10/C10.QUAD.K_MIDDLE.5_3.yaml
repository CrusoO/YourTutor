difficulty: 0.59
type: mcq
pool: practice
role: apply
stem:
  en: The equation 5x² + kx + 45 = 0 has repeated roots. Find k.
options:
- id: a
  en: k = -30 or k = 30
- id: b
  en: k = -15 or k = 15
- id: c
  en: k = 30
- id: d
  en: k = -900 or k = 900
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Equal roots need the discriminant to be zero: k² - 4(5)(45) = 0.'
- en: So k² = 900.
- en: 'Take the square root of both sides, keeping both signs: k = -30 or k = 30.'
- en: The correct option is a.
hints:
- level: 1
  en: The discriminant will contain k; make it zero.
- level: 2
  en: After writing the discriminant, undo the subtraction by adding the same number
    to both sides, then undo the square by taking the square root of both sides.
- level: 3
  en: 'Full method: write the discriminant with k in it, set it to zero, add the same
    number to both sides, take the square root of both sides, and remember both signs.'
prediction_prompt:
  en: Should k be allowed to be negative as well as positive?
