difficulty: 0.51
type: mcq
pool: practice
role: apply
stem:
  en: A is an acute angle and sin A = 24/25. Find the value of cos A.
options:
- id: a
  en: 7/25
- id: b
  en: 25/7
- id: c
  en: 1/25
- id: d
  en: 49/625
answer:
  sympy: a
  accept: []
solution_steps:
- en: Draw a right triangle with angle A and mark the sides so that sin A = 24/25.
- en: Use the identity sin² A + cos² A = 1 (or tan A = sin A / cos A) to find the
    missing ratio.
- en: 'Since A is acute, take the positive root: cos A = 7/25.'
- en: The correct option is a.
hints:
- level: 1
  en: Because the angle is acute, every ratio is positive.
- level: 2
  en: Find the third side of your triangle with the rule for right triangles, then
    form the ratio you need as one fraction of the sides.
- level: 3
  en: 'Full method: choose side lengths that fit the given ratio, find the missing
    side, write the asked ratio from the sides, and simplify.'
prediction_prompt:
  en: Is the asked ratio bigger or smaller than the given one?
