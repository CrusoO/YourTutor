stem:
  en: A library puts books on display. On day 1 it shows 50 books and each day it
    shows 8 more than the day before, for 12 days. How many books are shown over all
    the days together?
options:
- id: a
  en: '1176'
- id: b
  en: '2256'
- id: c
  en: '138'
- id: d
  en: '1128'
answer:
  sympy: d
  accept: []
solution_steps:
- en: The amounts form an AP with first term 50 and common difference 8.
- en: The last amount is 138, so the total is S = (12/2)(50 + 138).
- en: S = 1128.
- en: The correct option is d.
hints:
- level: 1
  en: 'Let the amounts in order be the terms of an AP: name its first term and its
    common difference.'
- level: 2
  en: Decide whether the question asks for one term or for the sum of all the terms,
    then choose the matching rule. Work through it one operation after another.
- level: 3
  en: 'Full method: identify the first term, the common difference and the number
    of rows or days, pick the rule for one term or for the sum, substitute carefully,
    and give the answer with its unit.'
prediction_prompt:
