solution_steps:
- en: Let x metres be the breadth. Then the length is x + 10 metres.
- en: The area gives x(x + 10) = 816, so x² + 10x - 816 = 0.
- en: 'Factorise: (x - 24)(x + 34) = 0, so x = 24 or x = -34; a length is positive,
    so the breadth is 24 m and the length is 34 m.'
- en: The correct option is b.
