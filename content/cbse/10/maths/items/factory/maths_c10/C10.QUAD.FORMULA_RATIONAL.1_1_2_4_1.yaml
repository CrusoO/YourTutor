difficulty: 0.57
type: mcq
pool: practice
role: procedure
stem:
  en: Use the quadratic formula to solve 2x² - 9x + 4 = 0.
options:
- id: a
  en: x = -4 or x = -1/2
- id: b
  en: x = 1/2 or x = 4
- id: c
  en: x = 1 or x = 8
- id: d
  en: x = 29/4 or x = 43/4
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 2, of x is -9, plain number
    is 4.'
- en: The discriminant is -9² - 4 x 2 x 4 = 49, and its square root is 7.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 2).
- en: 'Work out both signs: x = 1/2 or x = 4.'
- en: The correct option is b.
hints:
- level: 1
  en: Identify the three coefficients carefully before you substitute anything.
- level: 2
  en: Work out the discriminant first, then its square root. Keep the minus sign of
    the x coefficient when you write the opposite of it.
- level: 3
  en: 'Full method: list the coefficients, compute the discriminant, take its square
    root, put the numbers into the formula once with the plus sign and once with the
    minus sign, divide each by twice the leading coefficient, and check by substitution.'
prediction_prompt:
  en: How many different values of x do you expect?
