solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 2, of x is -9, plain number
    is 4.'
- en: The discriminant is -9² - 4 x 2 x 4 = 49, and its square root is 7.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 2).
- en: 'Work out both signs: x = 1/2 or x = 4.'
- en: The correct option is b.
