solution_steps:
- en: A root r means (x - r) is a factor, so the factors are (x - (3)) and (x - (5)).
- en: 'Multiply them: x² - (8)x + (15).'
- en: 'Multiply by the leading coefficient 1 if it is not 1: x² - 8x + 15 = 0.'
- en: The correct option is c.
