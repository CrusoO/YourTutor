solution_steps:
- en: Put 1/x = u and 1/y = v. Both relations become linear in u and v.
- en: They read u + 2v = 1/3 and u - 3v = -4/3.
- en: Solving gives u = -1/3 and v = 1/3.
- en: 'Turn back: x = 1/u = -3 and y = 1/v = 3.'
- en: The correct option is b.
