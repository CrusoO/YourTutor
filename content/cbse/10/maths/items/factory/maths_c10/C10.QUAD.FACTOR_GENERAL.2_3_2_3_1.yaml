solution_steps:
- en: Divide both sides by 2, the common factor, to get 2x² - 9x + 9 = 0.
- en: Split the middle term -9x into -6x and -3x, because -6 and -3 multiply to 18
    (the product of 2 and 9) and add to -9.
- en: 'Factorise: (2x - 3)(x - 3) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: 2x - 3 = 0 gives x
    = 3/2 and x - 3 = 0 gives x = 3.'
- en: The correct option is a.
