solution_steps:
- en: Take the whole right-hand side away from both sides, so the right-hand side
    is 0.
- en: The left-hand side becomes x² - 9, so the equation is x² - 9 = 0.
- en: Comparing with ax² + bx + c = 0 gives b = 0.
- en: The correct option is d.
