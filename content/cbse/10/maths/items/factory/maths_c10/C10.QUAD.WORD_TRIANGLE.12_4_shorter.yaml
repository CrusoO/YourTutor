solution_steps:
- en: Let x metres be the shorter side. The other side is x + 4 metres.
- en: By Pythagoras, x² + (x + 4)² = 20², so 2x² + 8x - 384 = 0.
- en: 'Divide both sides by 2 and factorise: (x - 12)(x + 16) = 0, so x = 12 (a length
    cannot be negative).'
- en: The shorter side is 12 m and the longer side is 16 m.
- en: The correct option is a.
