difficulty: 0.59
type: mcq
pool: practice
role: apply
stem:
  en: 'Two terms of an AP are known: term 5 is 10 and term 7 is 16. Work out term
    11.'
options:
- id: a
  en: '46'
- id: b
  en: '28'
- id: c
  en: '31'
- id: d
  en: '40'
answer:
  sympy: b
  accept: []
solution_steps:
- en: Going from term 5 to term 7 takes 2 equal steps, and the terms change by 6.
- en: So the common difference is 6 / 2 = 3.
- en: 'Go back to the first term: a = 10 - (5 - 1)(3) = -2.'
- en: Then a_11 = -2 + (11 - 1)(3) = 28.
- en: The correct option is b.
hints:
- level: 1
  en: Use the two given terms to find the first term and the difference before anything
    else.
- level: 2
  en: Share the total change between the two terms equally over the number of steps
    between them, then work back to the first term.
- level: 3
  en: 'Full method: divide the change in value by the change in position to get the
    difference, use one given term to find the first term, then apply the rule for
    the term you are asked for.'
prediction_prompt:
  en: Is the common difference positive or negative?
