solution_steps:
- en: The first term is -3 and the common difference is -3.
- en: 'Set the nth term equal to -36: -3 + (n - 1)(-3) = -36.'
- en: 'Take -3 away from both sides: (n - 1)(-3) = -33. Divide both sides by -3: n
    - 1 = 11.'
- en: 'Add 1 to both sides: n = 12.'
- en: The correct option is d.
