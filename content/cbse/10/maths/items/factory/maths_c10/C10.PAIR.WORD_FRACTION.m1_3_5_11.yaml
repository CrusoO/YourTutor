stem:
  en: A fraction in lowest terms has numerator plus denominator equal to 16. If the
    numerator is increased by 3 and the denominator is decreased by 1, the new fraction
    is 4/5. Find the original fraction.
hints:
- level: 1
  en: Write what the sum of the two parts tells you about x and y.
- level: 2
  en: The new fraction equals the stated value, so multiply out the two sides to remove
    the fractions before solving.
- level: 3
  en: 'Full method: name the numerator and denominator, write the sum relation, write
    the relation for the new fraction without fractions, solve the pair, then state
    the fraction.'
prediction_prompt:
  en: Roughly what size should the answer be?
