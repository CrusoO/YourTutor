solution_steps:
- en: Let the length be x metres and the width y metres. The perimeter counts every
    side.
- en: The two facts give 2x + 2y = 92 and x - 3y = 6.
- en: Solving the pair gives x = 36 and y = 10. The area is 36 × 10 = 360 square metres.
- en: The correct option is c.
