solution_steps:
- en: 'The nth term is the difference of two sums: a_n = S_n - S_(n-1).'
- en: S_n - S_(n-1) = 3n² - (3(n - 1)² + 0(n - 1)) = 6n - 3.
- en: The coefficient of n is 6, so the common difference is 6.
- en: The correct option is c.
