solution_steps:
- en: Use the exact values for 0, 30, 45, 60 and 90 degrees.
- en: cos 30° = √3/2 and sin 45° = √2/2.
- en: Square each value before combining, because the squares apply to the values.
- en: 'Combine them: the result is 3/8.'
- en: The correct option is a.
