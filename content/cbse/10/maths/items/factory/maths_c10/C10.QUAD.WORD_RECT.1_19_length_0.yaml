difficulty: 0.54
type: mcq
pool: practice
role: apply
stem:
  en: A rectangular plot has a length that is 1 m more than its breadth. The plot
    covers 380 m². Find the length of the plot in metres.
options:
- id: a
  en: '21'
- id: b
  en: '20'
- id: c
  en: '19'
- id: d
  en: '-19'
answer:
  sympy: b
  accept: []
solution_steps:
- en: Let x metres be the breadth. Then the length is x + 1 metres.
- en: The area gives x(x + 1) = 380, so x² + 1x - 380 = 0.
- en: 'Factorise: (x - 19)(x + 20) = 0, so x = 19 or x = -20; a length is positive,
    so the breadth is 19 m and the length is 20 m.'
- en: The correct option is b.
hints:
- level: 1
  en: Let x be the unknown side, express the other side with x, then use the area.
- level: 2
  en: Write the area as one relation in x, rearrange so the right side is zero, and
    solve it. Discard any solution that makes the length negative. Undo each step
    by doing the same thing to each side.
- level: 3
  en: 'Full method: name the breadth, write the length, form the area relation, rearrange
    to zero, factorise, keep the positive solution, then answer exactly what is asked
    (breadth, length or cost).'
prediction_prompt:
  en: About how long do you think the shorter side is?
