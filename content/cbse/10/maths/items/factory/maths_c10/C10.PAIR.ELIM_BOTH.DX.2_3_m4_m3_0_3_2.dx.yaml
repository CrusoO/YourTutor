solution_steps:
- en: Multiply the first equation by 3 and the second by 2, every term, so both x
    coefficients become 6.
- en: 'Subtract the second new equation from the first: -y = -2, so y = 2.'
- en: Put y = 2 in the first original equation to get x = 3.
- en: The correct option is b.
