solution_steps:
- en: Let the length be x metres and the width y metres. The perimeter counts every
    side.
- en: The two facts give 2x + 2y = 36 and x - y = 6.
- en: Solving the pair gives x = 12 and y = 6. The area is 12 × 6 = 72 square metres.
- en: The correct option is d.
