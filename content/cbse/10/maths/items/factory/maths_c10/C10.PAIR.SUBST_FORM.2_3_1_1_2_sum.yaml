solution_steps:
- en: 'Put y = x + 1 into the second equation: x + 2(x + 1) = 8.'
- en: 'Multiply out and collect the x terms: 3x = 6, so x = 2.'
- en: 'Put x = 2 back into the first equation: y = 1 × 2 + (1) = 3.'
- en: So x + y = 2 + (3) = 5.
- en: The correct option is a.
