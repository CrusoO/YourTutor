solution_steps:
- en: Let x metres be the breadth. Then the length is x + 4 metres.
- en: The area gives x(x + 4) = 140, so x² + 4x - 140 = 0.
- en: 'Factorise: (x - 10)(x + 14) = 0, so x = 10 or x = -14; a length is positive,
    so the breadth is 10 m and the length is 14 m.'
- en: The correct option is d.
