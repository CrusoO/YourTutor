solution_steps:
- en: A value satisfies the equation when substituting it makes the left side equal
    to 0.
- en: 'Substitute x = 6: 1(6)² + (-4)(6) + (-12) = 0.'
- en: The left side is 0, so x = 6 satisfies the equation.
- en: The correct option is c.
