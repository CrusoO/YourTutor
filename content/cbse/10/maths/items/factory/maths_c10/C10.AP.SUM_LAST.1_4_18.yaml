stem:
  en: Add every term of the progression that begins 1, 5, 9 and ends at 69.
options:
- id: a
  en: '595'
- id: b
  en: '630'
- id: c
  en: '1260'
- id: d
  en: '2415'
answer:
  sympy: b
  accept: []
solution_steps:
- en: The first term is 1, the last term is 69 and the difference is 4.
- en: 'Number of terms: n = (69 - 1)/4 + 1 = 18.'
- en: S = (n/2)(first + last) = (18/2)(1 + 69) = 630.
- en: The correct option is b.
hints:
- level: 1
  en: Before you can add, you need the number of terms.
- level: 2
  en: The number of terms is the distance from first to last divided by the difference,
    plus one. Then average the first and last terms and multiply by the count.
- level: 3
  en: 'Full method: subtract the first term from the last, divide by the difference,
    add one to get n, then multiply n by half of (first + last).'
prediction_prompt:
  en: Is the number of terms more or less than ten?
