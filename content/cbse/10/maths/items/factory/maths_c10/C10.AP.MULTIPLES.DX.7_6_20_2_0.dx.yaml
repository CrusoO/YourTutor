solution_steps:
- en: The first multiple of 7 in the range is 42 and the last is 175.
- en: 'They form an AP with common difference 7. Number of terms: (175 - 42)/7 + 1
    = 20.'
- en: S = (20/2)(42 + 175) = 2170.
- en: The correct option is c.
