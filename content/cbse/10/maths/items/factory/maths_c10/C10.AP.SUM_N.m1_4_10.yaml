difficulty: 0.41
type: mcq
pool: practice
role: procedure
stem:
  en: Find the sum of the first 10 terms of the AP -1, 3, 7, ...
options:
- id: a
  en: '175'
- id: b
  en: '340'
- id: c
  en: '170'
- id: d
  en: '190'
answer:
  sympy: c
  accept: []
solution_steps:
- en: The first term is -1, the common difference is 4 and the number of terms is
    10.
- en: S_n = (n/2)(2a + (n - 1)d) = (10/2)(2 x -1 + (10 - 1) x 4).
- en: = (10/2)(34) = 170.
- en: The correct option is c.
hints:
- level: 1
  en: You need the first term, the common difference and how many terms are added.
- level: 2
  en: Work out twice the first term plus one fewer than n times the difference, then
    multiply by n and halve.
- level: 3
  en: 'Full method: read off the first term and difference, compute twice the first
    term plus (n - 1) times the difference, multiply by n, then divide by 2.'
prediction_prompt:
  en: Roughly how big do you expect the total to be?
