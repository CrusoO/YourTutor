solution_steps:
- en: Let x metres be the breadth. Then the length is x + 5 metres.
- en: The area gives x(x + 5) = 234, so x² + 5x - 234 = 0.
- en: 'Factorise: (x - 13)(x + 18) = 0, so x = 13 or x = -18; a length is positive,
    so the breadth is 13 m and the length is 18 m.'
- en: The correct option is c.
