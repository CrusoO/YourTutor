solution_steps:
- en: The first term is 1, the last term is -84 and the difference is -5.
- en: 'Number of terms: n = (-84 - 1)/-5 + 1 = 18.'
- en: S = (n/2)(first + last) = (18/2)(1 + -84) = -747.
- en: The correct option is c.
