stem:
  en: Use substitution on y = 3x + 10 and 3x - 3y = -12. What is x + y?
hints:
- level: 1
  en: Use the first equation to replace y in the second one.
- level: 2
  en: Multiply every term inside the bracket, then solve the one-unknown equation
    that is left.
- level: 3
  en: 'Full method: substitute for y, multiply out the bracket, collect the x terms,
    solve for x, then put that value of x back into the first equation to get y.'
