solution_steps:
- en: 'Put y = 3x + 10 into the second equation: 3x - 3(3x + 10) = -12.'
- en: 'Multiply out and collect the x terms: -6x = 18, so x = -3.'
- en: 'Put x = -3 back into the first equation: y = 3 × -3 + (10) = 1.'
- en: So x + y = -3 + (1) = -2.
- en: The correct option is d.
