solution_steps:
- en: Let x metres be the breadth. Then the length is x + 10 metres.
- en: The area gives x(x + 10) = 459, so x² + 10x - 459 = 0.
- en: 'Factorise: (x - 17)(x + 27) = 0, so x = 17 or x = -27; a length is positive,
    so the breadth is 17 m and the length is 27 m.'
- en: The perimeter is 2(17 + 27) = 88 m, and the cost is 88 x 20.
- en: The correct option is a.
