solution_steps:
- en: 'Compare the ratios of matching numbers: x coefficients, y coefficients, then
    the constants.'
- en: Here the three ratios are 1/3, 1/3 and 1/3.
- en: All three ratios match, so the two equations describe the same line.
- en: The correct option is d.
