difficulty: 0.59
type: mcq
pool: practice
role: apply
stem:
  en: 'Two terms of an AP are known: term 5 is 14 and term 9 is 34. Work out term
    11.'
options:
- id: a
  en: '64'
- id: b
  en: '134'
- id: c
  en: '49'
- id: d
  en: '44'
answer:
  sympy: d
  accept: []
solution_steps:
- en: Going from term 5 to term 9 takes 4 equal steps, and the terms change by 20.
- en: So the common difference is 20 / 4 = 5.
- en: 'Go back to the first term: a = 14 - (5 - 1)(5) = -6.'
- en: Then a_11 = -6 + (11 - 1)(5) = 44.
- en: The correct option is d.
hints:
- level: 1
  en: Use the two given terms to find the first term and the difference before anything
    else.
- level: 2
  en: Share the total change between the two terms equally over the number of steps
    between them, then work back to the first term.
- level: 3
  en: 'Full method: divide the change in value by the change in position to get the
    difference, use one given term to find the first term, then apply the rule for
    the term you are asked for.'
prediction_prompt:
  en: Is the common difference positive or negative?
