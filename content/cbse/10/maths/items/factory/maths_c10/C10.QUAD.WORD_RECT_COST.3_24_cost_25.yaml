solution_steps:
- en: Let x metres be the breadth. Then the length is x + 3 metres.
- en: The area gives x(x + 3) = 648, so x² + 3x - 648 = 0.
- en: 'Factorise: (x - 24)(x + 27) = 0, so x = 24 or x = -27; a length is positive,
    so the breadth is 24 m and the length is 27 m.'
- en: The perimeter is 2(24 + 27) = 102 m, and the cost is 102 x 25.
- en: The correct option is b.
