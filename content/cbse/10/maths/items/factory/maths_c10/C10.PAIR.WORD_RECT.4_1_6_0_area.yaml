solution_steps:
- en: Let the length be x metres and the width y metres. The perimeter counts every
    side.
- en: The two facts give 2x + 2y = 28 and x - y = 6.
- en: Solving the pair gives x = 10 and y = 4. The area is 10 × 4 = 40 square metres.
- en: The correct option is a.
