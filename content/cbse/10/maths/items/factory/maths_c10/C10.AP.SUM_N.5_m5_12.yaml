stem:
  en: Find the sum of the first 12 terms of the AP 5, 0, -5, ...
hints:
- level: 1
  en: You need the first term, the common difference and how many terms are added.
- level: 2
  en: Work out twice the first term plus one fewer than n times the difference, then
    multiply by n and halve.
- level: 3
  en: 'Full method: read off the first term and difference, compute twice the first
    term plus (n - 1) times the difference, multiply by n, then divide by 2.'
prediction_prompt:
  en: Roughly how big do you expect the total to be?
