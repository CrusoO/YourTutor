solution_steps:
- en: The first term is 5, the common difference is -5 and the number of terms is
    12.
- en: S_n = (n/2)(2a + (n - 1)d) = (12/2)(2 x 5 + (12 - 1) x -5).
- en: = (12/2)(-45) = -270.
- en: The correct option is c.
