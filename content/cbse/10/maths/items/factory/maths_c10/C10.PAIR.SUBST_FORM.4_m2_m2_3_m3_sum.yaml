solution_steps:
- en: 'Put y = -2x + 6 into the second equation: 3x - 3(-2x + 6) = 18.'
- en: 'Multiply out and collect the x terms: 9x = 36, so x = 4.'
- en: 'Put x = 4 back into the first equation: y = -2 × 4 + (6) = -2.'
- en: So x + y = 4 + (-2) = 2.
- en: The correct option is a.
