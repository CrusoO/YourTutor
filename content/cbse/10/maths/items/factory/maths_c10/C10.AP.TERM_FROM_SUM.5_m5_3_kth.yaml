solution_steps:
- en: 'The nth term is the difference of two sums: a_n = S_n - S_(n-1).'
- en: S_n - S_(n-1) = 5n² - 5n - (5(n - 1)² - 5(n - 1)) = 10n - 10.
- en: 'Put n = 3: a_3 = 20.'
- en: The correct option is d.
