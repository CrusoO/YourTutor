options:
- id: a
  en: They meet at exactly two points.
- id: b
  en: They are parallel and never meet.
- id: c
  en: They are the same line.
- id: d
  en: They meet at exactly one point.
answer:
  sympy: b
  accept: []
misconception_rules:
