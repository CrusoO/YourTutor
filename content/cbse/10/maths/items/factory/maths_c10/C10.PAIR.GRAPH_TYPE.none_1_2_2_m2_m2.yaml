solution_steps:
- en: 'Compare the ratios of matching numbers: x coefficients, y coefficients, then
    the constants.'
- en: Here the three ratios are -1/2, -1/2 and -1/3.
- en: The first two ratios match but the third differs, so the lines are parallel
    and never meet.
- en: The correct option is b.
