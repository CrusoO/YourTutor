solution_steps:
- en: Put 1/x = u and 1/y = v. Both relations become linear in u and v.
- en: They read 3u + 2v = -2 and u - 3v = 7/6.
- en: Solving gives u = -1/3 and v = -1/2.
- en: 'Turn back: x = 1/u = -3 and y = 1/v = -2.'
- en: The correct option is d.
