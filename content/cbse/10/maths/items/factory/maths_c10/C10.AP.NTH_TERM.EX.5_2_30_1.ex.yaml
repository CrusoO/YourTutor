difficulty: 0.31
pool: practice
role: explain
stem:
  en: The first term of an AP is 5 and its common difference is 2. Find the 30th term.
    A classmate says the answer is 65. Work it out yourself and choose the correct
    answer.
hints:
- level: 1
  en: Each step adds the common difference; count the steps from the first term.
- level: 2
  en: The number of jumps is one less than the position. Multiply the difference by
    the number of jumps, then add the result to the first term.
- level: 3
  en: 'Full method: identify the first term and the common difference, count the jumps
    which is the position minus one, multiply by the difference, and add to the first
    term.'
prediction_prompt:
  en: Will the term be much bigger or smaller than the first term?
