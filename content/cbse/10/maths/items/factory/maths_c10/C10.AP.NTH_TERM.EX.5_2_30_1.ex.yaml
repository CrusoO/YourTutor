solution_steps:
- en: The first term is 5 and the common difference is 2.
- en: The nth term is first term + (n - 1) x difference, so a_30 = 5 + (30 - 1)(2).
- en: a_30 = 5 + 58 = 63.
- en: The correct option is d.
