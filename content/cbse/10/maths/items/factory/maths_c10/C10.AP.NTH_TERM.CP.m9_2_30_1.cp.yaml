solution_steps:
- en: The first term is -9 and the common difference is 2.
- en: The nth term is first term + (n - 1) x difference, so a_30 = -9 + (30 - 1)(2).
- en: a_30 = -9 + 58 = 49.
- en: The correct option is c.
