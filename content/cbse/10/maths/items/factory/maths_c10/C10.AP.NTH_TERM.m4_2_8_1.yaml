id: C10.AP.NTH_TERM.m4_2_8_1
skill_ids:
- MATH.ALG.AP.NTH_TERM
difficulty: 0.29
type: mcq
pool: practice
role: procedure
stem:
  en: An AP starts at -4 and changes by 2 at every step. What is its 8th term?
options:
- id: a
  en: '-18'
- id: b
  en: '10'
- id: c
  en: '12'
- id: d
  en: '5'
answer:
  sympy: b
  accept: []
solution_steps:
- en: The first term is -4 and the common difference is 2.
- en: The nth term is first term + (n - 1) x difference, so a_8 = -4 + (8 - 1)(2).
- en: a_8 = -4 + 14 = 10.
- en: The correct option is b.
hints:
- level: 1
  en: To reach the nth term you make one fewer jump than n.
- level: 2
  en: The number of jumps is one less than the position. Multiply the difference by
    the number of jumps, then add the result to the first term.
- level: 3
  en: 'Full method: identify the first term and the common difference, count the jumps
    which is the position minus one, multiply by the difference, and add to the first
    term.'
prediction_prompt:
  en: Will the term be much bigger or smaller than the first term?
