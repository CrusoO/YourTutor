difficulty: 0.59
type: mcq
pool: practice
role: procedure
stem:
  en: Complete the square on x² + 4x + 6 = 0 to reach (x + p)² = q. What is q?
options:
- id: a
  en: '2'
- id: b
  en: '-4'
- id: c
  en: '-2'
- id: d
  en: '10'
answer:
  sympy: c
  accept: []
solution_steps:
- en: Half of the x coefficient 4 is 2, so the square is (x + 2)².
- en: (x + 2)² = x² + 4x + 4, so add 4 to both sides and subtract 6 from both sides.
- en: This gives (x + 2)² = -2. So p = 2 and q = -2.
- en: The correct option is c.
hints:
- level: 1
  en: Think of one bracket squared; match the x term first.
- level: 2
  en: Whatever you add to one side you must add to both sides. Compare the expanded
    bracket with the original to see what is missing.
- level: 3
  en: 'Full method: halve the x coefficient, square it, add that square to both sides
    after taking the plain number away from both sides, write the left side as a bracket
    squared, and read off the two values.'
prediction_prompt:
  en: Will p have the same sign as the x coefficient?
