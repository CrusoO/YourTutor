stem:
  en: Solve x² = -4x.
options:
- id: a
  en: x = 0
- id: b
  en: x = 0 or x = 4
- id: c
  en: x = -4
- id: d
  en: x = -4 or x = 0
answer:
  sympy: d
  accept: []
solution_steps:
- en: Bring every term to the left so the right side is 0, then take out x as a common
    factor.
- en: This gives x(x + 4) = 0.
- en: A product is zero only when one factor is zero, so x = 0 or the bracket is 0.
- en: 'Undo the bracket: add -4 to both sides, then divide both sides by 1: x = -4.'
- en: The solutions are x = -4 or x = 0.
- en: The correct option is d.
hints:
- level: 1
  en: Both terms share an x, so take it out as the common factor instead of dividing.
- level: 2
  en: Set each factor to zero. For the bracket, undo each operation by doing the same
    thing to both sides.
- level: 3
  en: 'Full method: bring all terms to one side, take out the common factor x, set
    each factor to zero, add the same number to both sides, divide both sides by the
    coefficient, and write both solutions.'
prediction_prompt:
  en: Will x = 0 be one of the answers?
