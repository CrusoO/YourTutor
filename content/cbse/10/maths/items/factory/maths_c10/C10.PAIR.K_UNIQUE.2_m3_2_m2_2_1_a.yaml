solution_steps:
- en: A pair fails to have exactly one solution when the ratio of the x coefficients
    equals the ratio of the y coefficients.
- en: 'Use the ratios that contain k: 4/k = -6/6, so k = -4.'
- en: At k = -4 the two coefficient ratios are equal, so the pair has no unique solution.
- en: The correct option is c.
