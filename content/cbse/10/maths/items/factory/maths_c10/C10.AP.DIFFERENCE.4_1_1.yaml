solution_steps:
- en: In an AP every term is the previous term plus the same number, the common difference.
- en: 'Subtract a term from the one after it: 5 - (4) = 1.'
- en: 'Check with another pair: 6 - (5) = 1. The common difference is 1.'
- en: The correct option is a.
