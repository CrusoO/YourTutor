solution_steps:
- en: The first term is 12, the common difference is 7 and the number of terms is
    6.
- en: S_n = (n/2)(2a + (n - 1)d) = (6/2)(2 x 12 + (6 - 1) x 7).
- en: = (6/2)(59) = 177.
