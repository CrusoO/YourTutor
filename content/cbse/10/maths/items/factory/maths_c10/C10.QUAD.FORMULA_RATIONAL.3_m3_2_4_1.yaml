difficulty: 0.57
type: mcq
pool: practice
role: procedure
stem:
  en: Use the quadratic formula to solve 6x² - 15x - 36 = 0.
options:
- id: a
  en: x = -3 or x = 8
- id: b
  en: x = -4 or x = 3/2
- id: c
  en: x = 49/4 or x = 71/4
- id: d
  en: x = -3/2 or x = 4
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 6, of x is -15, plain number
    is -36.'
- en: The discriminant is -15² - 4 x 6 x -36 = 1089, and its square root is 33.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 6).
- en: 'Work out both signs: x = -3/2 or x = 4.'
- en: The correct option is d.
hints:
- level: 1
  en: Identify the three coefficients carefully before you substitute anything.
- level: 2
  en: Work out the discriminant first, then its square root. Keep the minus sign of
    the x coefficient when you write the opposite of it.
- level: 3
  en: 'Full method: list the coefficients, compute the discriminant, take its square
    root, put the numbers into the formula once with the plus sign and once with the
    minus sign, divide each by twice the leading coefficient, and check by substitution.'
prediction_prompt:
  en: How many different values of x do you expect?
