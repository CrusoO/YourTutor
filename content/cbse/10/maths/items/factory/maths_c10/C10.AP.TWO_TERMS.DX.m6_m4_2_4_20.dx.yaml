solution_steps:
- en: Going from term 2 to term 6 takes 4 equal steps, and the terms change by -16.
- en: So the common difference is -16 / 4 = -4.
- en: 'Go back to the first term: a = -10 - (2 - 1)(-4) = -6.'
- en: Then a_20 = -6 + (20 - 1)(-4) = -82.
- en: The correct option is b.
