solution_steps:
- en: Half of the x coefficient -4 is -2, so the square is (x - 2)².
- en: (x - 2)² = x² + -4x + 4, so add 4 to both sides and subtract -7 from both sides.
- en: This gives (x - 2)² = 11. So p = -2 and q = 11.
- en: The correct option is a.
