stem:
  en: In a hall the first row has 12 seats and every row after it has 2 more seats
    than the row before. There are 12 rows. How many seats are there in the whole
    hall?
options:
- id: a
  en: '276'
- id: b
  en: '288'
- id: c
  en: '552'
- id: d
  en: '34'
answer:
  sympy: a
  accept: []
solution_steps:
- en: The amounts form an AP with first term 12 and common difference 2.
- en: The last amount is 34, so the total is S = (12/2)(12 + 34).
- en: S = 276.
- en: The correct option is a.
