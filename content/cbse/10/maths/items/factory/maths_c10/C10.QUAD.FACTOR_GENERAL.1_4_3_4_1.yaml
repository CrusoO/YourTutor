solution_steps:
- en: Split the middle term -16x into -12x and -4x, because -12 and -4 multiply to
    48 (the product of 3 and 16) and add to -16.
- en: 'Factorise: (3x - 4)(x - 4) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: 3x - 4 = 0 gives x
    = 4/3 and x - 4 = 0 gives x = 4.'
- en: The correct option is d.
