solution_steps:
- en: The first term is 14 and the common difference is -3.
- en: 'Set the nth term equal to -43: 14 + (n - 1)(-3) = -43.'
- en: 'Take 14 away from both sides: (n - 1)(-3) = -57. Divide both sides by -3: n
    - 1 = 19.'
- en: 'Add 1 to both sides: n = 20.'
- en: The correct option is a.
