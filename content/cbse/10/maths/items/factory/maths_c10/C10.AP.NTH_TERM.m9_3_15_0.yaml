difficulty: 0.31
type: mcq
pool: practice
role: procedure
stem:
  en: What is the 15th term of the progression -9, -6, -3, ...?
options:
- id: a
  en: '-51'
- id: b
  en: '8'
- id: c
  en: '33'
- id: d
  en: '36'
answer:
  sympy: c
  accept: []
solution_steps:
- en: The first term is -9 and the common difference is 3.
- en: The nth term is first term + (n - 1) x difference, so a_15 = -9 + (15 - 1)(3).
- en: a_15 = -9 + 42 = 33.
- en: The correct option is c.
hints:
- level: 1
  en: To reach the nth term you make one fewer jump than n.
- level: 2
  en: The number of jumps is one less than the position. Multiply the difference by
    the number of jumps, then add the result to the first term.
- level: 3
  en: 'Full method: identify the first term and the common difference, count the jumps
    which is the position minus one, multiply by the difference, and add to the first
    term.'
prediction_prompt:
  en: Will the term be much bigger or smaller than the first term?
