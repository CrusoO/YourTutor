solution_steps:
- en: Read off a1 = 2, b1 = 2, c1 = -5, a2 = -2, b2 = 5, c2 = 9.
- en: 'Use the matching difference of products: r = a1b2 - a2b1 = (2)(5) - (-2)(2)
    = 14.'
- en: The correct option is b.
