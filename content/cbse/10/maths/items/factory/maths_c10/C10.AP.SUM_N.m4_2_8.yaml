solution_steps:
- en: The first term is -4, the common difference is 2 and the number of terms is
    8.
- en: S_n = (n/2)(2a + (n - 1)d) = (8/2)(2 x -4 + (8 - 1) x 2).
- en: = (8/2)(6) = 24.
- en: The correct option is b.
