solution_steps:
- en: Let x metres be the breadth. Then the length is x + 1 metres.
- en: The area gives x(x + 1) = 12, so x² + 1x - 12 = 0.
- en: 'Factorise: (x - 3)(x + 4) = 0, so x = 3 or x = -4; a length is positive, so
    the breadth is 3 m and the length is 4 m.'
- en: The correct option is c.
