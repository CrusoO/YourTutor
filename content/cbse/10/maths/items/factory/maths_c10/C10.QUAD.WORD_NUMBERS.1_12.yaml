solution_steps:
- en: Let x be the smaller number. The other is x + 1.
- en: Their product is 156, so x(x + 1) = 156, which is x² + 1x - 156 = 0.
- en: 'Factorise: (x - 12)(x + 13) = 0, so x = 12 or x = -13.'
- en: The numbers must be positive, so the smaller number is 12.
- en: The correct option is b.
