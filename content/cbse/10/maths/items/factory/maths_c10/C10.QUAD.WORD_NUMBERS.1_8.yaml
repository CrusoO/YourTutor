stem:
  en: The product of two consecutive positive integers is 72. Find the smaller one.
options:
- id: a
  en: '7'
- id: b
  en: '-9'
- id: c
  en: '9'
- id: d
  en: '8'
answer:
  sympy: d
  accept: []
solution_steps:
- en: Let x be the smaller number. The other is x + 1.
- en: Their product is 72, so x(x + 1) = 72, which is x² + 1x - 72 = 0.
- en: 'Factorise: (x - 8)(x + 9) = 0, so x = 8 or x = -9.'
- en: The numbers must be positive, so the smaller number is 8.
- en: The correct option is d.
hints:
- level: 1
  en: Let x be the number you are asked for and write the other number in terms of
    x.
- level: 2
  en: Write the product as one relation in x, bring every term to one side, then factorise
    or use the formula. Check which solution fits the words of the question.
- level: 3
  en: 'Full method: name the smaller number, write the larger one, form the product
    relation, rearrange so the right side is zero, solve, and reject any solution
    that is not positive.'
prediction_prompt:
  en: Roughly how big do you expect the smaller number to be?
