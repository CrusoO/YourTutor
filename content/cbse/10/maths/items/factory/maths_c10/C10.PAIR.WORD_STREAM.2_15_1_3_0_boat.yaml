solution_steps:
- en: Let the still-water speed be x km/h and the stream speed y km/h. Upstream the
    speed is x - y, downstream it is x + y.
- en: Distance = speed × time gives 3x - 3y = 39 and x + y = 17.
- en: 'Dividing out the hours: x - y = 13 and x + y = 17, so x = 15 and y = 2.'
- en: The correct option is c.
