stem:
  en: In a hall the first row has 12 seats and every row after it has 5 more seats
    than the row before. There are 8 rows. How many seats are in the last row? A classmate
    says the answer is 52. Work it out yourself and choose the correct answer.
hints:
- level: 1
  en: 'The same change repeats at every step, so the amounts form an AP: find its
    first term and its difference.'
- level: 2
  en: Decide whether the question asks for one term or for the sum of all the terms,
    then choose the matching rule. Work through it one operation after another.
- level: 3
  en: 'Full method: identify the first term, the common difference and the number
    of rows or days, pick the rule for one term or for the sum, substitute carefully,
    and give the answer with its unit.'
prediction_prompt:
  en: Is the pattern growing or shrinking from one step to the next?
