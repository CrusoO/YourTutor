solution_steps:
- en: 'Look for two numbers with product -45 and sum 4: they are 9 and -5.'
- en: 'Factorise: (x + 9)(x - 5) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: x + 9 = 0 gives x
    = -9 and x - 5 = 0 gives x = 5.'
- en: The correct option is b.
