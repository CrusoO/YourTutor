stem:
  en: Find the value of sin² 37° + sin² 53°.
hints:
- level: 1
  en: Check whether the two angles are complementary before calculating anything.
- level: 2
  en: A ratio of an angle equals the matching co-ratio of its complement. Use that
    to rewrite one term so both terms involve the same angle.
- level: 3
  en: 'Full method: confirm the angles add to ninety, convert one term to the other
    angle with the complement rule, then simplify the expression.'
