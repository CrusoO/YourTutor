solution_steps:
- en: Equal roots need b² - 4ac = 0, so (10)² - 4(k)(1) = 0.
- en: 'This gives 100 - 4k = 0. Add 4k to both sides: 4k = 100.'
- en: 'Divide both sides by 4: k = 25.'
- en: The correct option is d.
