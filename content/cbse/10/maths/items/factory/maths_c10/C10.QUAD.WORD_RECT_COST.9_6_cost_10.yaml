solution_steps:
- en: Let x metres be the breadth. Then the length is x + 9 metres.
- en: The area gives x(x + 9) = 90, so x² + 9x - 90 = 0.
- en: 'Factorise: (x - 6)(x + 15) = 0, so x = 6 or x = -15; a length is positive,
    so the breadth is 6 m and the length is 15 m.'
- en: The perimeter is 2(6 + 15) = 42 m, and the cost is 42 x 10.
- en: The correct option is a.
