difficulty: 0.86
type: mcq
pool: practice
role: transfer
stem:
  en: A bus travels 300 km along a fixed route at a steady speed. If it travelled
    5 km/h faster, the journey would take 2 hours less. Find the speed of the bus
    on the faster run in km/h.
options:
- id: a
  en: '30'
- id: b
  en: '20'
- id: c
  en: '-30'
- id: d
  en: '25'
answer:
  sympy: a
  accept: []
solution_steps:
- en: Let x km/h be the usual speed. The time taken is 300/x hours, and at the higher
    speed it is 300/(x + 5) hours.
- en: 'The saving is 2: 300/x - 300/(x + 5) = 2. Multiply every term by x(x + 5) to
    clear the fractions.'
- en: This gives 2x² + 10x - 1500 = 0, which factorises as (x - 25)(x + 30) = 0 after
    dividing by 2.
- en: A speed is positive, so the usual speed is 25 km/h and the faster speed is 30
    km/h.
- en: The correct option is a.
hints:
- level: 1
  en: Let x be the usual speed, then express the two journey times in terms of x.
- level: 2
  en: Subtract the two times and set the difference equal to the time saved. Multiply
    every term by the same expression to clear the fractions, then solve. Do the same
    thing to each side at every step.
- level: 3
  en: 'Full method: name the usual speed, write the two times, form the difference
    relation, clear the fractions by multiplying every term, rearrange to zero, solve,
    reject the negative speed, then answer the speed that was asked for.'
prediction_prompt:
  en: Will the usual speed be more or less than the increase in speed?
