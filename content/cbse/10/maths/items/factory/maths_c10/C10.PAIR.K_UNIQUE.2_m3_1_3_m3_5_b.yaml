stem:
  en: Find the value of k for which 2x - 3y = -3 and 6x + ky = 5 fail to have exactly
    one solution.
hints:
- level: 1
  en: Find the value of k that makes the lines parallel or identical. All other values
    give one solution.
- level: 2
  en: Set the right ratios equal, multiply out, and solve the small equation for k.
- level: 3
  en: 'Full method: write the ratios of matching numbers, put equal the ones the situation
    requires, solve for k, then check that the remaining ratio behaves as needed.'
prediction_prompt:
  en: Is k going to be positive or negative?
