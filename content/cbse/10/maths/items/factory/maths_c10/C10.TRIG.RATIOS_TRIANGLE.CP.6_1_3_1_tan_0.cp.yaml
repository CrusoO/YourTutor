solution_steps:
- en: 'Name the sides from angle P: the side opposite it, the side next to it (adjacent),
    and the hypotenuse.'
- en: By Pythagoras the hypotenuse PR = square root of (36² + 105²) = 111.
- en: Opposite = 105, adjacent = 36, hypotenuse = 111.
- en: tan P = opposite / adjacent = 35/12.
- en: The correct option is b.
