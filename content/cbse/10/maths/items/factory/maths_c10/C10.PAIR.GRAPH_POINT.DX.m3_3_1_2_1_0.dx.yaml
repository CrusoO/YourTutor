solution_steps:
- en: 'Line A: y changes by 1 each time x goes up by 1, so y = x + 6.'
- en: 'Line B: y changes by 2 each time x goes up by 1, so y = 2x + 9.'
- en: 'At the meeting point both rules give the same y: 1x + (6) = 2x + (9), so x
    = -3.'
- en: Then y = 1 × -3 + (6) = 3. The lines meet at (-3, 3).
- en: The correct option is a.
