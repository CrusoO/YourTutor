solution_steps:
- en: Multiply the first equation by 5 and the second by 2, every term, so both y
    coefficients become 10.
- en: 'Subtract the second new equation from the first: 4x = 12, so x = 3.'
- en: Put x = 3 in the first original equation to get y = -3.
- en: The correct option is a.
