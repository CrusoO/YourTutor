solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 6, of x is -15, plain number
    is 6.'
- en: The discriminant is -15² - 4 x 6 x 6 = 81, and its square root is 9.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 6).
- en: 'Work out both signs: x = 1/2 or x = 2.'
- en: The correct option is c.
