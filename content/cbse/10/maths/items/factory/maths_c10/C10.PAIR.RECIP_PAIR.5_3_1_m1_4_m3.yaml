solution_steps:
- en: Put 1/x = u and 1/y = v. Both relations become linear in u and v.
- en: They read u - v = -2/15 and 4u - 3v = -1/5.
- en: Solving gives u = 1/5 and v = 1/3.
- en: 'Turn back: x = 1/u = 5 and y = 1/v = 3.'
