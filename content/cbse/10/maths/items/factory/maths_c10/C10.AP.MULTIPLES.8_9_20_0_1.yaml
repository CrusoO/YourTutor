stem:
  en: Find the sum of all the multiples of 8 from 72 to 225, both included.
options:
- id: a
  en: '2970'
- id: b
  en: '2812'
- id: c
  en: '2960'
- id: d
  en: '5920'
answer:
  sympy: c
  accept: []
solution_steps:
- en: The first multiple of 8 in the range is 72 and the last is 224.
- en: 'They form an AP with common difference 8. Number of terms: (224 - 72)/8 + 1
    = 20.'
- en: S = (20/2)(72 + 224) = 2960.
- en: The correct option is c.
hints:
- level: 1
  en: The end numbers of the range may not themselves be multiples.
- level: 2
  en: Work out how many multiples lie between the first and last, remembering to add
    one to the count, then use the sum rule with the first and last multiples.
- level: 3
  en: 'Full method: find the first and last multiples inside the range, count them
    using the difference between multiples, then multiply the count by half the sum
    of the first and last multiples.'
prediction_prompt:
  en: About how many multiples do you expect in the range?
