solution_steps:
- en: In an AP every term is the previous term plus the same number, the common difference.
- en: 'Subtract a term from the one after it: 5 - (-3) = 8.'
- en: 'Check with another pair: 13 - (5) = 8. The common difference is 8.'
- en: The correct option is b.
