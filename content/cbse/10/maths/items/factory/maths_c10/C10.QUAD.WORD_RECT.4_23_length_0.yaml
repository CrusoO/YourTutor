difficulty: 0.54
type: mcq
pool: practice
role: apply
stem:
  en: A rectangular plot has a length that is 4 m more than its breadth. The plot
    covers 621 m². Find the length of the plot in metres.
options:
- id: a
  en: '-23'
- id: b
  en: '23'
- id: c
  en: '31'
- id: d
  en: '27'
answer:
  sympy: d
  accept: []
solution_steps:
- en: Let x metres be the breadth. Then the length is x + 4 metres.
- en: The area gives x(x + 4) = 621, so x² + 4x - 621 = 0.
- en: 'Factorise: (x - 23)(x + 27) = 0, so x = 23 or x = -27; a length is positive,
    so the breadth is 23 m and the length is 27 m.'
- en: The correct option is d.
hints:
- level: 1
  en: Let x be the unknown side, express the other side with x, then use the area.
- level: 2
  en: Write the area as one relation in x, rearrange so the right side is zero, and
    solve it. Discard any solution that makes the length negative. Undo each step
    by doing the same thing to each side.
- level: 3
  en: 'Full method: name the breadth, write the length, form the area relation, rearrange
    to zero, factorise, keep the positive solution, then answer exactly what is asked
    (breadth, length or cost).'
prediction_prompt:
  en: About how long do you think the shorter side is?
