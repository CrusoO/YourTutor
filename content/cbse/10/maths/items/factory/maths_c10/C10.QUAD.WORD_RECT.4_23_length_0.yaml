solution_steps:
- en: Let x metres be the breadth. Then the length is x + 4 metres.
- en: The area gives x(x + 4) = 621, so x² + 4x - 621 = 0.
- en: 'Factorise: (x - 23)(x + 27) = 0, so x = 23 or x = -27; a length is positive,
    so the breadth is 23 m and the length is 27 m.'
- en: The correct option is d.
