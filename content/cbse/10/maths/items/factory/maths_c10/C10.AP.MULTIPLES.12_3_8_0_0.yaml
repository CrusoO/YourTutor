solution_steps:
- en: The first multiple of 12 in the range is 36 and the last is 120.
- en: 'They form an AP with common difference 12. Number of terms: (120 - 36)/12 +
    1 = 8.'
- en: S = (8/2)(36 + 120) = 624.
- en: The correct option is b.
