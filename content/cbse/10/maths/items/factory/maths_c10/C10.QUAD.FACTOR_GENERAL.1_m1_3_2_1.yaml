difficulty: 0.62
type: mcq
pool: practice
role: procedure
stem:
  en: Find all values of x that satisfy 3x² - 5x - 2 = 0.
options:
- id: a
  en: x = -2 or x = -1/3
- id: b
  en: x = -1 or x = 2
- id: c
  en: x = -2 or x = 1/3
- id: d
  en: x = -1/3 or x = 2
answer:
  sympy: d
  accept: []
solution_steps:
- en: Split the middle term -5x into -6x and 1x, because -6 and 1 multiply to -6 (the
    product of 3 and -2) and add to -5.
- en: 'Factorise: (3x + 1)(x - 2) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: 3x + 1 = 0 gives x
    = -1/3 and x - 2 = 0 gives x = 2.'
- en: The correct option is d.
hints:
- level: 1
  en: Aim to turn the left side into two simpler expressions multiplied together.
- level: 2
  en: Divide out any common factor, split the middle term into two parts, and group
    in pairs to find the brackets. Then set each bracket to zero and undo it by doing
    the same thing to both sides.
- level: 3
  en: 'Full method: factorise the left side, set each bracket to zero, add or subtract
    the same number on both sides, divide both sides by the coefficient of x, then
    check each solution by substituting it back.'
prediction_prompt:
  en: How many different values of x do you expect?
