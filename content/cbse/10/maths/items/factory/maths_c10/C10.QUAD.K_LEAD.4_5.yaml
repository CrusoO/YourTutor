solution_steps:
- en: Equal roots need b² - 4ac = 0, so (40)² - 4(k)(4) = 0.
- en: 'This gives 1600 - 16k = 0. Add 16k to both sides: 16k = 1600.'
- en: 'Divide both sides by 16: k = 100.'
- en: The correct option is d.
