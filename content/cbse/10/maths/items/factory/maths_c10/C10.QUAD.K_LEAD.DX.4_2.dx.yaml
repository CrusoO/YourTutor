solution_steps:
- en: Equal roots need b² - 4ac = 0, so (16)² - 4(k)(4) = 0.
- en: 'This gives 256 - 16k = 0. Add 16k to both sides: 16k = 256.'
- en: 'Divide both sides by 16: k = 16.'
- en: The correct option is a.
