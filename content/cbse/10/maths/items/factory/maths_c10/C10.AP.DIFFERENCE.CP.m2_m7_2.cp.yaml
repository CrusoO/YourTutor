solution_steps:
- en: In an AP every term is the previous term plus the same number, the common difference.
- en: 'Subtract a term from the one after it: -9/2 - (-1) = -7/2.'
- en: 'Check with another pair: -8 - (-9/2) = -7/2. The common difference is -7/2.'
- en: The correct option is a.
