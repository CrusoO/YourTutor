stem:
  en: Find all values of x that satisfy x² + 7x + 10 = 0.
hints:
- level: 1
  en: Try writing the left side as two brackets multiplied together.
- level: 2
  en: Find two numbers that multiply to the plain number and add to the x coefficient.
    Then set each bracket to zero and undo it by doing the same thing to both sides.
- level: 3
  en: 'Full method: factorise the left side, set each bracket to zero, add or subtract
    the same number on both sides, divide both sides by the coefficient of x, then
    check each solution by substituting it back.'
prediction_prompt:
  en: How many different values of x do you expect?
