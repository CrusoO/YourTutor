solution_steps:
- en: 'Look for two numbers with product 10 and sum 7: they are 5 and 2.'
- en: 'Factorise: (x + 5)(x + 2) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: x + 5 = 0 gives x
    = -5 and x + 2 = 0 gives x = -2.'
- en: The correct option is b.
