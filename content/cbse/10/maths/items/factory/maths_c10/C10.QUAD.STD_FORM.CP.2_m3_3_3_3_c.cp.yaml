solution_steps:
- en: Take the whole right-hand side away from both sides, so the right-hand side
    is 0.
- en: The left-hand side becomes 2x² - 18, so the equation is 2x² - 18 = 0.
- en: Comparing with ax² + bx + c = 0 gives c = -18.
- en: The correct option is d.
