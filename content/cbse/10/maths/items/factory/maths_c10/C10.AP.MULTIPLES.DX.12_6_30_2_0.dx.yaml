solution_steps:
- en: The first multiple of 12 in the range is 72 and the last is 420.
- en: 'They form an AP with common difference 12. Number of terms: (420 - 72)/12 +
    1 = 30.'
- en: S = (30/2)(72 + 420) = 7380.
