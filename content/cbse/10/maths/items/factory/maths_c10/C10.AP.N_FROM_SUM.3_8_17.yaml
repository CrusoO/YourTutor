solution_steps:
- en: Here a = 3, d = 8 and S_n = 1139.
- en: '(n/2)(2 x 3 + (n - 1) x 8) = 1139. Multiply both sides by 2 and expand: 8n²
    + -2n = 2278.'
- en: 'Rearranged: 8n² + (-2)n - 2278 = 0, whose solutions are n = 17 and n = -67/4.'
- en: The number of terms is a positive whole number, so n = 17.
- en: The correct option is a.
