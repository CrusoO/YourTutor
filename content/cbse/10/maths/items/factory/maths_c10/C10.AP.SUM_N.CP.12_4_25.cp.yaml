solution_steps:
- en: The first term is 12, the common difference is 4 and the number of terms is
    25.
- en: S_n = (n/2)(2a + (n - 1)d) = (25/2)(2 x 12 + (25 - 1) x 4).
- en: = (25/2)(120) = 1500.
- en: The correct option is b.
