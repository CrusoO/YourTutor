solution_steps:
- en: 'Line A: y changes by 1 each time x goes up by 1, so y = x - 1.'
- en: 'Line B: y changes by 2 each time x goes up by 1, so y = 2x.'
- en: 'At the meeting point both rules give the same y: 1x + (-1) = 2x + (0), so x
    = -1.'
- en: Then y = 1 × -1 + (-1) = -2. The lines meet at (-1, -2).
- en: The correct option is c.
