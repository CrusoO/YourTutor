stem:
  en: From a point on level ground close to a tower the angle of elevation of its
    top is 60°. After walking 20 m directly away from the tower, the angle of elevation
    becomes 45°. How tall is the tower, in metres?
options:
- id: a
  en: 30 + 10√3
- id: b
  en: '20'
- id: c
  en: 30 - 10√3
- id: d
  en: 20√3
answer:
  sympy: a
  accept: []
solution_steps:
- en: Let the tower be h m high. Seen at 45° the ground distance is h / tan 45°; seen
    at 60° it is h / tan 60°.
- en: 'The two distances differ by the 20 m walked: h / tan 45° - h / tan 60° = 20.'
- en: 'Put in the exact values of the tangents and solve for h: h = 30 + 10√3 m.'
- en: The correct option is a.
hints:
- level: 1
  en: You get two right triangles that share the tower as one side.
- level: 2
  en: Write the ground distance from each position in terms of the height. Their difference
    equals the distance walked. Then undo each operation by doing the same thing to
    each side to get the height.
- level: 3
  en: 'Full method: draw the figure, write each ground distance using the tangent
    of the angle, subtract to match the distance walked, replace tangents by exact
    values, collect the height terms, and divide each side to isolate the height.'
prediction_prompt:
  en: Is the tower taller or shorter than the distance walked?
