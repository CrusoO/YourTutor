solution_steps:
- en: Let x km/h be the usual speed. The time taken is 495/x hours, and at the higher
    speed it is 495/(x + 10) hours.
- en: 'The saving is 2: 495/x - 495/(x + 10) = 2. Multiply every term by x(x + 10)
    to clear the fractions.'
- en: This gives 2x² + 20x - 4950 = 0, which factorises as (x - 45)(x + 55) = 0 after
    dividing by 2.
- en: A speed is positive, so the usual speed is 45 km/h and the faster speed is 55
    km/h.
- en: The correct option is b.
