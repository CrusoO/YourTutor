stem:
  en: Two straight lines are drawn from x + 5y = 2 and -2x - 10y = -4. Which statement
    about them is true?
hints:
- level: 1
  en: Write the ratio of the x coefficients and the ratio of the y coefficients.
- level: 2
  en: If the first two ratios differ the lines meet once. If they match, the third
    ratio decides between parallel lines and the same line.
- level: 3
  en: 'Full method: find the ratio of the x coefficients, the ratio of the y coefficients
    and the ratio of the constants. Different first two ratios: one meeting point.
    All three equal: same line. First two equal and the third different: parallel
    lines.'
prediction_prompt:
  en: Do you expect these lines to meet, never meet, or lie on top of each other?
