solution_steps:
- en: Let x metres be the breadth. Then the length is x + 7 metres.
- en: The area gives x(x + 7) = 78, so x² + 7x - 78 = 0.
- en: 'Factorise: (x - 6)(x + 13) = 0, so x = 6 or x = -13; a length is positive,
    so the breadth is 6 m and the length is 13 m.'
- en: The perimeter is 2(6 + 13) = 38 m, and the cost is 38 x 20.
- en: The correct option is c.
