id: C10.AP.DIFFERENCE.3_4_1
skill_ids:
- MATH.ALG.AP.COMMON_DIFFERENCE
difficulty: 0.16
type: mcq
pool: practice
role: recall
stem:
  en: What is the common difference of the AP 3, 7, 11, 15, ...?
options:
- id: a
  en: '4'
- id: b
  en: 7/3
- id: c
  en: '3'
- id: d
  en: '-4'
answer:
  sympy: a
  accept: []
solution_steps:
- en: In an AP every term is the previous term plus the same number, the common difference.
- en: 'Subtract a term from the one after it: 7 - (3) = 4.'
- en: 'Check with another pair: 11 - (7) = 4. The common difference is 4.'
- en: The correct option is a.
hints:
- level: 1
  en: The common difference is the same jump between every pair of neighbours.
- level: 2
  en: Take the later term and subtract the earlier one, keeping the order and the
    sign. Then try another pair to be sure the jump is the same.
- level: 3
  en: 'Full method: pick two neighbouring terms, subtract the earlier from the later,
    check with another pair, and keep the sign: a falling list has a negative difference.'
prediction_prompt:
  en: Is the list going up or down, and by roughly how much each step?
