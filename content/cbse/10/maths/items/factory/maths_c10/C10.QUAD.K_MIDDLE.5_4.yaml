id: C10.QUAD.K_MIDDLE.5_4
skill_ids:
- MATH.ALG.QUAD.FIND_PARAMETER_FOR_ROOTS
difficulty: 0.59
type: mcq
pool: practice
role: apply
stem:
  en: For which values of k does 5x² + kx + 80 = 0 have equal roots?
options:
- id: a
  en: k = -40 or k = 40
- id: b
  en: k = -1600 or k = 1600
- id: c
  en: k = -20 or k = 20
- id: d
  en: k = 40
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Equal roots need the discriminant to be zero: k² - 4(5)(80) = 0.'
- en: So k² = 1600.
- en: 'Take the square root of both sides, keeping both signs: k = -40 or k = 40.'
- en: The correct option is a.
hints:
- level: 1
  en: Set the discriminant equal to zero and treat k as the unknown.
- level: 2
  en: After writing the discriminant, undo the subtraction by adding the same number
    to both sides, then undo the square by taking the square root of both sides.
- level: 3
  en: 'Full method: write the discriminant with k in it, set it to zero, add the same
    number to both sides, take the square root of both sides, and remember both signs.'
prediction_prompt:
  en: Should k be allowed to be negative as well as positive?
