solution_steps:
- en: The first term is 12, the common difference is -2 and the number of terms is
    15.
- en: S_n = (n/2)(2a + (n - 1)d) = (15/2)(2 x 12 + (15 - 1) x -2).
- en: = (15/2)(-4) = -30.
- en: The correct option is d.
