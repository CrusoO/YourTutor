solution_steps:
- en: In an AP every term is the previous term plus the same number, the common difference.
- en: 'Subtract a term from the one after it: 4 - (0) = 4.'
- en: 'Check with another pair: 8 - (4) = 4. The common difference is 4.'
- en: The correct option is a.
