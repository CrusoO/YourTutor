solution_steps:
- en: Equal roots need b² - 4ac = 0, so (-8)² - 4(k)(-2) = 0.
- en: 'This gives 64 - -8k = 0. Add -8k to both sides: -8k = 64.'
- en: 'Divide both sides by -8: k = -8.'
- en: The correct option is a.
