solution_steps:
- en: 'Line A: y changes by -1 each time x goes up by 1, so y = -x.'
- en: 'Line B: y changes by 2 each time x goes up by 1, so y = 2x + 3.'
- en: 'At the meeting point both rules give the same y: -1x + (0) = 2x + (3), so x
    = -1.'
- en: Then y = -1 × -1 + (0) = 1. The lines meet at (-1, 1).
- en: The correct option is c.
