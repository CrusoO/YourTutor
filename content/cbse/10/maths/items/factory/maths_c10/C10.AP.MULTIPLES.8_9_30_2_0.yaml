solution_steps:
- en: The first multiple of 8 in the range is 72 and the last is 304.
- en: 'They form an AP with common difference 8. Number of terms: (304 - 72)/8 + 1
    = 30.'
- en: S = (30/2)(72 + 304) = 5640.
- en: The correct option is b.
