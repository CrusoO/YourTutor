difficulty: 0.59
type: mcq
pool: practice
role: procedure
stem:
  en: The equation x² + 12x + 1 = 0 is rewritten by completing the square as (x +
    p)² = q. Find the value of q.
options:
- id: a
  en: '37'
- id: b
  en: '35'
- id: c
  en: '143'
- id: d
  en: '5'
answer:
  sympy: b
  accept: []
solution_steps:
- en: Half of the x coefficient 12 is 6, so the square is (x + 6)².
- en: (x + 6)² = x² + 12x + 36, so add 36 to both sides and subtract 1 from both sides.
- en: This gives (x + 6)² = 35. So p = 6 and q = 35.
- en: The correct option is b.
hints:
- level: 1
  en: Halve the x coefficient to find what goes inside the bracket.
- level: 2
  en: Whatever you add to one side you must add to both sides. Compare the expanded
    bracket with the original to see what is missing.
- level: 3
  en: 'Full method: halve the x coefficient, square it, add that square to both sides
    after taking the plain number away from both sides, write the left side as a bracket
    squared, and read off the two values.'
prediction_prompt:
  en: Will p have the same sign as the x coefficient?
