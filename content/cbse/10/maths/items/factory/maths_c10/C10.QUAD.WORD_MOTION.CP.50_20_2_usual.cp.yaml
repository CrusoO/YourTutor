solution_steps:
- en: Let x km/h be the usual speed. The time taken is 350/x hours, and at the higher
    speed it is 350/(x + 20) hours.
- en: 'The saving is 2: 350/x - 350/(x + 20) = 2. Multiply every term by x(x + 20)
    to clear the fractions.'
- en: This gives 2x² + 40x - 7000 = 0, which factorises as (x - 50)(x + 70) = 0 after
    dividing by 2.
- en: A speed is positive, so the usual speed is 50 km/h and the faster speed is 70
    km/h.
- en: The correct option is a.
