id: C10.AP.IDENTIFY.3_4_2_2
skill_ids:
- MATH.ALG.AP.IDENTIFY_AP
difficulty: 0.34
type: mcq
pool: practice
role: recall
stem:
  en: All the lists begin with 3. Choose the one in which the gap between neighbouring
    terms never changes.
options:
- id: a
  en: 3, 7, 12, 18
- id: b
  en: 3, 7, 11, 15
- id: c
  en: 3, 7, 11, 17
- id: d
  en: 3, 6, 12, 24
answer:
  sympy: b
  accept: []
solution_steps:
- en: A list is an AP when the difference between every pair of neighbouring terms
    is the same.
- en: In 3, 7, 11, 15 each step is 4, and it stays 4 all the way along.
- en: In each of the other lists, at least one pair of neighbours has a different
    difference.
- en: The correct option is b.
hints:
- level: 1
  en: An AP keeps adding the same amount; test every neighbouring pair.
- level: 2
  en: For each list subtract every term from the next one. A list passes only when
    all its gaps are identical.
- level: 3
  en: 'Full method: for every list write down the three gaps between neighbours, compare
    them, and keep the one list whose gaps are all equal.'
prediction_prompt:
  en: Which list do you suspect, and why?
