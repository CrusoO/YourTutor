solution_steps:
- en: Read off a1 = -3, b1 = 2, c1 = -5, a2 = -2, b2 = 1, c2 = -7.
- en: 'Use the matching difference of products: r = a1b2 - a2b1 = (-3)(1) - (-2)(2)
    = 1.'
- en: The correct option is c.
