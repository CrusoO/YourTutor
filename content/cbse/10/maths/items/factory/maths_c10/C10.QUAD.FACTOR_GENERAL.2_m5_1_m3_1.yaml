id: C10.QUAD.FACTOR_GENERAL.2_m5_1_m3_1
skill_ids:
- MATH.ALG.QUAD.SOLVE_FACTORISE_GENERAL
difficulty: 0.65
type: mcq
pool: practice
role: procedure
stem:
  en: Solve 2x² + 16x + 30 = 0.
options:
- id: a
  en: x = -5 or x = 3
- id: b
  en: x = 3 or x = 5
- id: c
  en: x = -5 or x = -3
- id: d
  en: x = -5
answer:
  sympy: c
  accept: []
solution_steps:
- en: Divide both sides by 2, the common factor, to get x² + 8x + 15 = 0.
- en: 'Look for two numbers with product 15 and sum 8: they are 5 and 3.'
- en: 'Factorise: (x + 5)(x + 3) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: x + 5 = 0 gives x
    = -5 and x + 3 = 0 gives x = -3.'
- en: The correct option is c.
hints:
- level: 1
  en: Try writing the left side as two brackets multiplied together.
- level: 2
  en: Divide out any common factor, split the middle term into two parts, and group
    in pairs to find the brackets. Then set each bracket to zero and undo it by doing
    the same thing to both sides.
- level: 3
  en: 'Full method: factorise the left side, set each bracket to zero, add or subtract
    the same number on both sides, divide both sides by the coefficient of x, then
    check each solution by substituting it back.'
prediction_prompt:
  en: How many different values of x do you expect?
