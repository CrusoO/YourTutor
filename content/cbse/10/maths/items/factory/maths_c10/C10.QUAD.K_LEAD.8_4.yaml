solution_steps:
- en: Equal roots need b² - 4ac = 0, so (64)² - 4(k)(8) = 0.
- en: 'This gives 4096 - 32k = 0. Add 32k to both sides: 32k = 4096.'
- en: 'Divide both sides by 32: k = 128.'
- en: The correct option is c.
