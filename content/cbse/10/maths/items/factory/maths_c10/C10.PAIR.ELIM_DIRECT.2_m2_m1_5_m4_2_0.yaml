stem:
  en: Find x and y by elimination from 2x - 4y = -12 and -2x + 5y = 14.
hints:
- level: 1
  en: Look for the unknown that is easiest to remove by adding or subtracting the
    equations.
- level: 2
  en: Add the equations when the matching terms have opposite signs and subtract them
    when the signs agree. Apply the operation to every term, constants included.
- level: 3
  en: 'Full method: compare the coefficients of one unknown, add or subtract the equations,
    using every term, so it cancels, solve the single equation left, then put that
    value into one of the originals.'
