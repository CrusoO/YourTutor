stem:
  en: A is an acute angle and tan A = 3/4. Find the value of sin A.
options:
- id: a
  en: 9/25
- id: b
  en: 3/4
- id: c
  en: 3/5
- id: d
  en: 5/3
answer:
  sympy: c
  accept: []
solution_steps:
- en: Draw a right triangle with angle A and mark the sides so that tan A = 3/4.
- en: Use the identity sin² A + cos² A = 1 (or tan A = sin A / cos A) to find the
    missing ratio.
- en: 'Since A is acute, take the positive root: sin A = 3/5.'
- en: The correct option is c.
hints:
- level: 1
  en: A single identity connects sine and cosine of the same angle.
- level: 2
  en: Find the third side of your triangle with the rule for right triangles, then
    form the ratio you need as one fraction of the sides.
- level: 3
  en: 'Full method: choose side lengths that fit the given ratio, find the missing
    side, write the asked ratio from the sides, and simplify.'
prediction_prompt:
  en: Is the asked ratio bigger or smaller than the given one?
