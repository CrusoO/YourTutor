difficulty: 0.67
type: mcq
pool: practice
role: apply
stem:
  en: The sum of the first n terms of an AP is S_n = 1n² + 7n. Find the common difference.
options:
- id: a
  en: '2'
- id: b
  en: '1'
- id: c
  en: '8'
- id: d
  en: '10'
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'The nth term is the difference of two sums: a_n = S_n - S_(n-1).'
- en: S_n - S_(n-1) = 1n² + 7n - (1(n - 1)² + 7(n - 1)) = 2n + 6.
- en: The coefficient of n is 2, so the common difference is 2.
- en: The correct option is a.
hints:
- level: 1
  en: Think about what is left when you remove the earlier sum from the later sum.
- level: 2
  en: Write the sum with n replaced by n minus one, subtract it from the original
    sum, and simplify the result.
- level: 3
  en: 'Full method: find S_n minus S_(n-1) in terms of n, simplify to get the rule
    for the nth term, then substitute the position you need or read off the difference.'
prediction_prompt:
  en: Will the term be larger or smaller than the sum for the same n?
