solution_steps:
- en: Let x be the smaller number. The other is x + 2.
- en: Their product is 195, so x(x + 2) = 195, which is x² + 2x - 195 = 0.
- en: 'Factorise: (x - 13)(x + 15) = 0, so x = 13 or x = -15.'
- en: The numbers must be positive, so the smaller number is 13.
- en: The correct option is c.
