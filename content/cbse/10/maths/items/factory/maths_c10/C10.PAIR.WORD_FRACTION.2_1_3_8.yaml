solution_steps:
- en: Let the fraction be x/y. Then x + y = 11.
- en: After the change the fraction is (x + 1)/(y + 2) = 2/5, so 5x - 2y = -1.
- en: Solving the pair gives x = 3 and y = 8, so the fraction is 3/8.
- en: The correct option is a.
