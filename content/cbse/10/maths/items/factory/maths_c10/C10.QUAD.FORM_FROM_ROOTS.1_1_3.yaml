difficulty: 0.44
type: mcq
pool: practice
role: procedure
stem:
  en: Choose the quadratic equation that has 1 and 3 as its solutions.
options:
- id: a
  en: x² + 4x + 3 = 0
- id: b
  en: x² - 4x + 3 = 0
- id: c
  en: x² - 4x - 3 = 0
- id: d
  en: x² - 3x + 4 = 0
answer:
  sympy: b
  accept: []
solution_steps:
- en: A root r means (x - r) is a factor, so the factors are (x - (1)) and (x - (3)).
- en: 'Multiply them: x² - (4)x + (3).'
- en: 'Multiply by the leading coefficient 1 if it is not 1: x² - 4x + 3 = 0.'
- en: The correct option is b.
hints:
- level: 1
  en: Each root gives one factor; multiply the factors back together.
- level: 2
  en: 'To find each factor, undo x equals the root by doing the same thing to each
    side: take the root away from each side. Then multiply the two factors and collect
    terms.'
- level: 3
  en: 'Full method: write one factor for each root, multiply the two brackets, collect
    like terms, then multiply every term by the stated leading coefficient.'
prediction_prompt:
  en: Will the x coefficient be the sum of the roots or its opposite?
