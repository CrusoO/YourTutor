solution_steps:
- en: Half of the x coefficient 6 is 3, so the square is (x + 3)².
- en: (x + 3)² = x² + 6x + 9, so add 9 to both sides and subtract -9 from both sides.
- en: This gives (x + 3)² = 18. So p = 3 and q = 18.
- en: The correct option is a.
