difficulty: 0.34
pool: practice
role: explain
stem:
  en: Every list starts at 5. Which of these lists is an arithmetic progression? A
    classmate says the answer is 5, 15, 45, 135. Work it out yourself and choose the
    correct answer.
hints:
- level: 1
  en: Work out the gaps between neighbours for each list and compare them.
- level: 2
  en: For each list subtract every term from the next one. A list passes only when
    all its gaps are identical.
- level: 3
  en: 'Full method: for every list write down the three gaps between neighbours, compare
    them, and keep the one list whose gaps are all equal.'
prediction_prompt:
  en: Which list do you suspect, and why?
