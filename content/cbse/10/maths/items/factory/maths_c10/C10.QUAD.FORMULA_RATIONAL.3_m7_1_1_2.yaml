solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 6, of x is 39, plain number
    is -21.'
- en: The discriminant is 39² - 4 x 6 x -21 = 2025, and its square root is 45.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 6).
- en: 'Work out both signs: x = -7 or x = 1/2.'
- en: The correct option is a.
