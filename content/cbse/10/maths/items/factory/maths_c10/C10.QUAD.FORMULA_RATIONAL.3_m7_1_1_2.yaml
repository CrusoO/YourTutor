stem:
  en: Use the quadratic formula to solve 6x² + 39x - 21 = 0.
hints:
- level: 1
  en: Every quadratic can be solved with the formula; the work is in the discriminant.
- level: 2
  en: Work out the discriminant first, then its square root. Keep the minus sign of
    the x coefficient when you write the opposite of it.
- level: 3
  en: 'Full method: list the coefficients, compute the discriminant, take its square
    root, put the numbers into the formula once with the plus sign and once with the
    minus sign, divide each by twice the leading coefficient, and check by substitution.'
prediction_prompt:
  en: How many different values of x do you expect?
