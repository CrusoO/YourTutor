solution_steps:
- en: 'Read off the numbers: a1 = 1, b1 = 2, c1 = 1, a2 = 3, b2 = -1, c2 = 10.'
- en: 'Use x/(b1c2 - b2c1) = y/(c1a2 - c2a1) = 1/(a1b2 - a2b1): x/(21) = y/(-7) =
    1/(-7).'
- en: So x = 21/-7 = -3 and y = -7/-7 = 1.
- en: The correct option is c.
