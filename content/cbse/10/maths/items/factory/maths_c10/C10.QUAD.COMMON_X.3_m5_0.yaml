stem:
  en: Which values of x satisfy 3x² + 15x = 0?
hints:
- level: 1
  en: Look for the factor that both terms contain.
- level: 2
  en: Set each factor to zero. For the bracket, undo each operation by doing the same
    thing to both sides.
- level: 3
  en: 'Full method: bring all terms to one side, take out the common factor x, set
    each factor to zero, add the same number to both sides, divide both sides by the
    coefficient, and write both solutions.'
