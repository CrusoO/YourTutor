stem:
  en: Use elimination on the pair -3x + 2y = -5, -4x + 5y = -2.
hints:
- level: 1
  en: Choose one unknown and make its coefficients match in size in the two equations.
- level: 2
  en: Add the equations when the matching terms have opposite signs and subtract them
    when the signs agree. Apply the operation to every term, constants included.
- level: 3
  en: 'Full method: pick an unknown, multiply each equation by the other equation''s
    coefficient of it, using every term, so they match, subtract to cancel it, solve
    for the other unknown, then substitute back.'
prediction_prompt:
  en: Which unknown will you cancel first?
