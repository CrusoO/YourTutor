solution_steps:
- en: 'Name the sides from angle P: the side opposite it, the side next to it (adjacent),
    and the hypotenuse.'
- en: By Pythagoras the hypotenuse PR = square root of (7² + 24²) = 25.
- en: Opposite = 24, adjacent = 7, hypotenuse = 25.
- en: sin P = opposite / hypotenuse = 24/25.
- en: The correct option is c.
