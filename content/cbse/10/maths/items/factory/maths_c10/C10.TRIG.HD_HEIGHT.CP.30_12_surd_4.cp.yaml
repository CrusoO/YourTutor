solution_steps:
- en: 'Sketch a right triangle: the chimney is the side opposite the 30° angle and
    the ground distance is the adjacent side.'
- en: 'Opposite and adjacent sides link through tan 30°: height = 36 x tan 30°.'
- en: With tan 30° taken from the table, the height is 12√3 m.
- en: The correct option is d.
