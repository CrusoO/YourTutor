solution_steps:
- en: Let x km/h be the usual speed. The time taken is 315/x hours, and at the higher
    speed it is 315/(x + 20) hours.
- en: 'The saving is 1: 315/x - 315/(x + 20) = 1. Multiply every term by x(x + 20)
    to clear the fractions.'
- en: This gives 1x² + 20x - 6300 = 0, which factorises as (x - 70)(x + 90) = 0 after
    dividing by 1.
- en: A speed is positive, so the usual speed is 70 km/h and the faster speed is 90
    km/h.
- en: The correct option is b.
