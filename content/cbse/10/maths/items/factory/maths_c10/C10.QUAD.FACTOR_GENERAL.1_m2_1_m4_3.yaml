solution_steps:
- en: Split the middle term 10x into 4x and 6x, because 4 and 6 multiply to 24 (the
    product of 3 and 8) and add to 10.
- en: 'Factorise: (x + 2)(3x + 4) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: x + 2 = 0 gives x
    = -2 and 3x + 4 = 0 gives x = -4/3.'
- en: The correct option is b.
