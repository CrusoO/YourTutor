solution_steps:
- en: Let the fraction be x/y. Then x + y = 16.
- en: After the change the fraction is (x + 1)/(y + 2) = 6/13, so 13x - 6y = -1.
- en: Solving the pair gives x = 5 and y = 11, so the fraction is 5/11.
- en: The correct option is c.
