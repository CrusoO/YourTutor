stem:
  en: How many terms of the AP 3, 8, 13, ... must be added to make the sum 429?
options:
- id: a
  en: '143'
- id: b
  en: '14'
- id: c
  en: '13'
- id: d
  en: -66/5
answer:
  sympy: c
  accept: []
solution_steps:
- en: Here a = 3, d = 5 and S_n = 429.
- en: '(n/2)(2 x 3 + (n - 1) x 5) = 429. Multiply both sides by 2 and expand: 5n²
    + 1n = 858.'
- en: 'Rearranged: 5n² + (1)n - 858 = 0, whose solutions are n = 13 and n = -66/5.'
- en: The number of terms is a positive whole number, so n = 13.
- en: The correct option is c.
hints:
- level: 1
  en: Use the sum formula, but this time the unknown is the number of terms.
- level: 2
  en: Multiply each side by 2 to clear the fraction, expand the bracket, and bring
    everything to one side so the other side is zero. Then solve for n.
- level: 3
  en: 'Full method: put the numbers into the sum formula, multiply each side by 2,
    expand, rearrange to zero, solve for n, and keep only the positive whole number.'
prediction_prompt:
  en: Is n more likely to be small or large?
