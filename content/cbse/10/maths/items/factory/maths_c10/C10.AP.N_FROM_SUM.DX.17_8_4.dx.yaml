solution_steps:
- en: Here a = 17, d = 8 and S_n = 116.
- en: '(n/2)(2 x 17 + (n - 1) x 8) = 116. Multiply both sides by 2 and expand: 8n²
    + 26n = 232.'
- en: 'Rearranged: 8n² + (26)n - 232 = 0, whose solutions are n = 4 and n = -29/4.'
- en: The number of terms is a positive whole number, so n = 4.
- en: The correct option is a.
