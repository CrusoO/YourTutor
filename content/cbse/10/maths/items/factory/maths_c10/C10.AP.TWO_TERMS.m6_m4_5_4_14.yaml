solution_steps:
- en: Going from term 5 to term 9 takes 4 equal steps, and the terms change by -16.
- en: So the common difference is -16 / 4 = -4.
- en: 'Go back to the first term: a = -22 - (5 - 1)(-4) = -6.'
- en: Then a_14 = -6 + (14 - 1)(-4) = -58.
- en: The correct option is c.
