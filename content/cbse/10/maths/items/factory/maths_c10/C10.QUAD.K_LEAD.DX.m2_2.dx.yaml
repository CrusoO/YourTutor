stem:
  en: The equation kx² - 8x - 2 = 0 has repeated roots. What is k?
hints:
- level: 1
  en: Write the discriminant with k as one of the coefficients and make it zero.
- level: 2
  en: You will get an equation that is linear in k. Undo each operation by doing the
    same thing to both sides.
- level: 3
  en: 'Full method: write the discriminant using k as the leading coefficient, set
    it to zero, collect the k term on one side by adding the same amount to both sides,
    then divide both sides by the number multiplying k.'
prediction_prompt:
  en: Will k have the same sign as the plain number?
