solution_steps:
- en: 'The nth term is the difference of two sums: a_n = S_n - S_(n-1).'
- en: S_n - S_(n-1) = 1n² - 5n - (1(n - 1)² - 5(n - 1)) = 2n - 6.
- en: The coefficient of n is 2, so the common difference is 2.
- en: The correct option is a.
