stem:
  en: The sun is 60° above the horizontal. A vertical tree 12√3 m high casts a shadow
    on level ground. Find the length of the shadow in metres.
options:
- id: a
  en: '36'
- id: b
  en: '18'
- id: c
  en: '24'
- id: d
  en: '12'
answer:
  sympy: d
  accept: []
solution_steps:
- en: The tree is the side opposite the 60° angle and the shadow is the adjacent side.
- en: tan 60° = opposite / adjacent, so shadow = 12√3 / tan 60°.
- en: 'Replace the tangent by its exact value and simplify: the shadow is 12 m.'
- en: The correct option is d.
hints:
- level: 1
  en: Sketch the vertical object, its shadow and the line of the sun's rays.
- level: 2
  en: The shadow is the unknown and it sits underneath in the tangent ratio. Undo
    the division by doing the same thing to each side before you substitute the value.
- level: 3
  en: 'Full method: sketch the triangle, write the tangent ratio with the shadow as
    the unknown, swap the unknown into the numerator by multiplying each side, replace
    the tangent by its exact value and simplify, rationalising if needed.'
prediction_prompt:
  en: Will the shadow be longer or shorter than the object is tall?
