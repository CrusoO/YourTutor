solution_steps:
- en: 'Sketch a right triangle: the tree is the side opposite the 60° angle and the
    ground distance is the adjacent side.'
- en: 'Opposite and adjacent sides link through tan 60°: height = 1 x tan 60°.'
- en: With tan 60° taken from the table, the height is √3 m.
- en: The correct option is d.
