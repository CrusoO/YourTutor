stem:
  en: Reduce the pair 3/(x + y) + 2/(x - y) = 11/6, -2/(x + y) + 1/(x - y) = -5/6
    to a pair of linear equations and solve it for x and y.
hints:
- level: 1
  en: The two denominators repeat. Give each one its own new letter.
- level: 2
  en: After solving for the new letters, take reciprocals to find the sum and the
    difference, then use those two to find x and y.
- level: 3
  en: 'Full method: rename the two reciprocals, solve the linear pair, invert to get
    the sum and the difference of x and y, then add and subtract and halve.'
prediction_prompt:
  en: What new letters could make both relations linear?
