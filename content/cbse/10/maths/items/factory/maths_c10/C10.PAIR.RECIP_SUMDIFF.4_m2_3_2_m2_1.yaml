solution_steps:
- en: Put 1/(x + y) = u and 1/(x - y) = v. Both relations become linear in u and v.
- en: They read 3u + 2v = 11/6 and -2u + v = -5/6.
- en: Solving gives u = 1/2 and v = 1/6, so x + y = 2 and x - y = 6.
- en: 'Add and subtract: x = (2 + (6))/2 = 4 and y = (2 - (6))/2 = -2.'
- en: The correct option is c.
