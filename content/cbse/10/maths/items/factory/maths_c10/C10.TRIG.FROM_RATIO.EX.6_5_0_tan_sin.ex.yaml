solution_steps:
- en: Draw a right triangle with angle A and mark the sides so that tan A = 11/60.
- en: Use the identity sin² A + cos² A = 1 (or tan A = sin A / cos A) to find the
    missing ratio.
- en: 'Since A is acute, take the positive root: sin A = 11/61.'
- en: The correct option is c.
