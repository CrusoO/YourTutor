id: C10.TRIG.HD_HEIGHT.30_2_surd_1
skill_ids:
- MATH.TRIG.HD.HEIGHT_FROM_DISTANCE
difficulty: 0.39
type: mcq
pool: practice
role: apply
stem:
  en: A tree stands on level ground. From a point on the ground 6 m from the foot,
    the angle of elevation of the top is 30°. Find the height of the tree in metres.
options:
- id: a
  en: '3'
- id: b
  en: 3√3
- id: c
  en: 6√3
- id: d
  en: 2√3
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Sketch a right triangle: the tree is the side opposite the 30° angle and the
    ground distance is the adjacent side.'
- en: 'Opposite and adjacent sides link through tan 30°: height = 6 x tan 30°.'
- en: With tan 30° taken from the table, the height is 2√3 m.
- en: The correct option is d.
hints:
- level: 1
  en: Decide which side is opposite the angle and which is next to it.
- level: 2
  en: The ratio that links the opposite side to the adjacent side is the tangent.
    Write it as one relation and undo the division by doing the same thing to each
    side.
- level: 3
  en: 'Full method: sketch and label the triangle, name the two sides involved, write
    the tangent ratio for the stated angle, replace the tangent by its exact value,
    and solve for the height.'
prediction_prompt:
  en: Is the height larger or smaller than the distance from the foot?
