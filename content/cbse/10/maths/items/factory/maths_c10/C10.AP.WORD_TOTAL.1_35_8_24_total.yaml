stem:
  en: A runner trains for 24 weeks. In week 1 she runs 35 km and each week she runs
    8 km more than the week before. How far does she run in all the weeks together,
    in km?
options:
- id: a
  en: '3144'
- id: b
  en: '6096'
- id: c
  en: '3048'
- id: d
  en: '219'
answer:
  sympy: c
  accept: []
solution_steps:
- en: The amounts form an AP with first term 35 and common difference 8.
- en: The last amount is 219, so the total is S = (24/2)(35 + 219).
- en: S = 3048.
- en: The correct option is c.
hints:
