solution_steps:
- en: Let the length be x metres and the width y metres. The perimeter counts every
    side.
- en: The two facts give 2x + 2y = 60 and x - 3y = 6.
- en: Solving the pair gives x = 24 and y = 6. The width is 6 metres.
- en: The correct option is c.
