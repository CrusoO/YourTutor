solution_steps:
- en: Multiply the first equation by 5 and the second by 3, every term, so both x
    coefficients become 15.
- en: 'Subtract the second new equation from the first: 22y = 44, so y = 2.'
- en: Put y = 2 in the first original equation to get x = 3.
- en: The correct option is d.
