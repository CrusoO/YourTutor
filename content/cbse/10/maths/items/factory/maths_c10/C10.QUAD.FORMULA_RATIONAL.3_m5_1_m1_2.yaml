solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 6, of x is 33, plain number
    is 15.'
- en: The discriminant is 33² - 4 x 6 x 15 = 729, and its square root is 27.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 6).
- en: 'Work out both signs: x = -5 or x = -1/2.'
- en: The correct option is b.
