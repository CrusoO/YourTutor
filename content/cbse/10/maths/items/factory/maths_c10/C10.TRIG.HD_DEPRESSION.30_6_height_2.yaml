solution_steps:
- en: The angle of depression is measured downward from the horizontal at the top;
    by alternate angles it equals the angle of elevation of the top seen from a car.
- en: So in the right triangle the 30° angle is at a car, and height and ground distance
    are opposite and adjacent to it.
- en: 'Use tan 30° = height / distance and solve: the answer is 6 m.'
- en: The correct option is c.
