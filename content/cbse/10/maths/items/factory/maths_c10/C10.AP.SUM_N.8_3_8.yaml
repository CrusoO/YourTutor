solution_steps:
- en: The first term is 8, the common difference is 3 and the number of terms is 8.
- en: S_n = (n/2)(2a + (n - 1)d) = (8/2)(2 x 8 + (8 - 1) x 3).
- en: = (8/2)(37) = 148.
- en: The correct option is a.
