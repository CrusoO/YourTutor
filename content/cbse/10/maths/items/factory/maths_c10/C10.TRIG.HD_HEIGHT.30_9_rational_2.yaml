- MATH.TRIG.HD.HEIGHT_FROM_DISTANCE
difficulty: 0.39
type: mcq
pool: practice
role: apply
stem:
  en: A building stands on a flat plot. From a point on the ground 9√3 m from the
    foot, the angle of elevation of the top is 30°. Find the height of the building
    in metres.
options:
- id: a
  en: '27'
- id: b
  en: '9'
- id: c
  en: 27/2
- id: d
  en: 9√3/2
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Sketch a right triangle: the building is the side opposite the 30° angle and
    the ground distance is the adjacent side.'
- en: 'Opposite and adjacent sides link through tan 30°: height = 9√3 x tan 30°.'
- en: With tan 30° taken from the table, the height is 9 m.
- en: The correct option is b.
hints:
- level: 1
  en: Draw the right triangle first and label what is known and what is wanted.
- level: 2
  en: The ratio that links the opposite side to the adjacent side is the tangent.
    Write it as one relation and undo the division by doing the same thing to each
    side.
- level: 3
  en: 'Full method: sketch and label the triangle, name the two sides involved, write
    the tangent ratio for the stated angle, replace the tangent by its exact value,
    and solve for the height.'
prediction_prompt:
  en: Is the height larger or smaller than the distance from the foot?
