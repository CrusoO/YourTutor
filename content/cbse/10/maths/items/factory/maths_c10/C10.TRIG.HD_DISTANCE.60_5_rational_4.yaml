solution_steps:
- en: The chimney is the side opposite the 60° angle and the shadow is the adjacent
    side.
- en: tan 60° = opposite / adjacent, so shadow = 5√3 / tan 60°.
- en: 'Replace the tangent by its exact value and simplify: the shadow is 5 m.'
