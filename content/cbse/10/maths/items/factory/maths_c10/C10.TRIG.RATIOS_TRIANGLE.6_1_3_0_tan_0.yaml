role: procedure
stem:
  en: In triangle PQR the angle at Q is a right angle, PQ = 105 cm and QR = 36 cm.
    Find the value of tan P.
options:
- id: a
  en: 12/37
- id: b
  en: 35/37
- id: c
  en: 12/35
- id: d
  en: 35/12
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Name the sides from angle P: the side opposite it, the side next to it (adjacent),
    and the hypotenuse.'
- en: By Pythagoras the hypotenuse PR = square root of (105² + 36²) = 111.
- en: Opposite = 36, adjacent = 105, hypotenuse = 111.
- en: tan P = opposite / adjacent = 12/35.
- en: The correct option is c.
hints:
- level: 1
  en: Decide which side is opposite the angle, which is next to it, and which is the
    longest.
- level: 2
  en: Only two sides are given, so use the relation between the three sides of this
    triangle to find the third before forming the ratio.
- level: 3
  en: 'Full method: label opposite, adjacent and hypotenuse for the stated angle,
    find the missing side with the rule for right triangles, write the ratio as a
    fraction and simplify it.'
prediction_prompt:
  en: Is this ratio bigger or smaller than 1?
