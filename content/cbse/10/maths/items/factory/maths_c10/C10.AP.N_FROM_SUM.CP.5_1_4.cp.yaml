solution_steps:
- en: Here a = 5, d = 1 and S_n = 26.
- en: '(n/2)(2 x 5 + (n - 1) x 1) = 26. Multiply both sides by 2 and expand: 1n² +
    9n = 52.'
- en: 'Rearranged: 1n² + (9)n - 52 = 0, whose solutions are n = 4 and n = -13.'
- en: The number of terms is a positive whole number, so n = 4.
- en: The correct option is b.
