solution_steps:
- en: Here a = 1, d = 4 and S_n = 561.
- en: '(n/2)(2 x 1 + (n - 1) x 4) = 561. Multiply both sides by 2 and expand: 4n²
    + -2n = 1122.'
- en: 'Rearranged: 4n² + (-2)n - 1122 = 0, whose solutions are n = 17 and n = -33/2.'
- en: The number of terms is a positive whole number, so n = 17.
- en: The correct option is b.
