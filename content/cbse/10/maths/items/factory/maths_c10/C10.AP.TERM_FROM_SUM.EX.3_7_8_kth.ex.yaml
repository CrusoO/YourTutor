role: explain
stem:
  en: The sum of the first n terms of an AP is S_n = 3n² + 7n. Find the 8th term.
    A classmate says the answer is 248. Work it out yourself and choose the correct
    answer.
hints:
- level: 1
  en: Think about what is left when you remove the earlier sum from the later sum.
- level: 2
  en: Write the sum with n replaced by n minus one, subtract it from the original
    sum, and simplify the result.
- level: 3
  en: 'Full method: find S_n minus S_(n-1) in terms of n, simplify to get the rule
    for the nth term, then substitute the position you need or read off the difference.'
prediction_prompt:
  en: Will the term be larger or smaller than the sum for the same n?
