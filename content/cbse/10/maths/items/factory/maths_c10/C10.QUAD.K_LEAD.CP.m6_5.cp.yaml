solution_steps:
- en: Equal roots need b² - 4ac = 0, so (-60)² - 4(k)(-6) = 0.
- en: 'This gives 3600 - -24k = 0. Add -24k to both sides: -24k = 3600.'
- en: 'Divide both sides by -24: k = -150.'
- en: The correct option is c.
