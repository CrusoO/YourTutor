stem:
  en: Without solving it, decide the nature of the roots of -x² + 4x - 4 = 0.
options:
- id: a
  en: Two equal real roots
- id: b
  en: No real roots
- id: c
  en: Two distinct real roots
- id: d
  en: One real root and one non-real root
answer:
  sympy: a
  accept: []
solution_steps:
- en: The coefficients are -1, 4 and -4.
- en: The discriminant is b² - 4ac = 0.
- en: 'The discriminant is zero, so the equation has: two equal real roots.'
- en: The correct option is a.
hints:
- level: 1
  en: Look for one number that decides the nature of the roots.
- level: 2
  en: Work out the discriminant from the three coefficients, then see whether it is
    positive, zero or negative.
- level: 3
  en: 'Full method: write the coefficients with signs, compute the discriminant, and
    match its sign to the three possible cases for the roots.'
prediction_prompt:
  en: Which sign do you expect the discriminant to have?
