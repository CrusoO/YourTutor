solution_steps:
- en: 'Name the sides from angle R: the side opposite it, the side next to it (adjacent),
    and the hypotenuse.'
- en: By Pythagoras the hypotenuse PR = square root of (3² + 4²) = 5.
- en: Opposite = 3, adjacent = 4, hypotenuse = 5.
- en: sin R = opposite / hypotenuse = 3/5.
- en: The correct option is b.
