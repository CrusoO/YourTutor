solution_steps:
- en: Divide both sides by 2, the common factor, to get 3x² + 10x - 25 = 0.
- en: Split the middle term 10x into -5x and 15x, because -5 and 15 multiply to -75
    (the product of 3 and -25) and add to 10.
- en: 'Factorise: (x + 5)(3x - 5) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: x + 5 = 0 gives x
    = -5 and 3x - 5 = 0 gives x = 5/3.'
- en: The correct option is b.
