stem:
  en: Solve 6x² + 20x - 50 = 0.
hints:
- level: 1
  en: Factorise the left side first; any product that equals zero tells you something
    about each bracket.
- level: 2
  en: Divide out any common factor, split the middle term into two parts, and group
    in pairs to find the brackets. Then set each bracket to zero and undo it by doing
    the same thing to both sides.
- level: 3
  en: 'Full method: factorise the left side, set each bracket to zero, add or subtract
    the same number on both sides, divide both sides by the coefficient of x, then
    check each solution by substituting it back.'
prediction_prompt:
  en: How many different values of x do you expect?
