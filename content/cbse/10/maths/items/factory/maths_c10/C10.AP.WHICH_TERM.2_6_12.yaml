solution_steps:
- en: The first term is 2 and the common difference is 6.
- en: 'Set the nth term equal to 68: 2 + (n - 1)(6) = 68.'
- en: 'Take 2 away from both sides: (n - 1)(6) = 66. Divide both sides by 6: n - 1
    = 11.'
- en: 'Add 1 to both sides: n = 12.'
- en: The correct option is a.
