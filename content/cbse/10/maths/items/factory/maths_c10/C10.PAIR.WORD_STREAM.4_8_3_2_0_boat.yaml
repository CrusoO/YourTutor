solution_steps:
- en: Let the still-water speed be x km/h and the stream speed y km/h. Upstream the
    speed is x - y, downstream it is x + y.
- en: Distance = speed × time gives 2x - 2y = 8 and 3x + 3y = 36.
- en: 'Dividing out the hours: x - y = 4 and x + y = 12, so x = 8 and y = 4.'
- en: The correct option is b.
