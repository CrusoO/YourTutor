stem:
  en: On a river, a boat covers 8 km against the current in 2 hours and 36 km with
    the current in 3 hours. What is the speed of the boat in still water?
hints:
- level: 1
  en: The speed over the ground is different upstream and downstream. Write each one.
- level: 2
  en: Distance equals speed times time on each trip. That gives one relation for the
    upstream trip and one for the downstream trip.
- level: 3
  en: 'Full method: name the two speeds, write the upstream and downstream speeds,
    use distance = speed × time twice, solve the pair, and answer the quantity asked.'
prediction_prompt:
  en: Roughly what size should the answer be?
