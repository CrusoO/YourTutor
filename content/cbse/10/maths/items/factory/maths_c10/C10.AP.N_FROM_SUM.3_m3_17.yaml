stem:
  en: The sum of the first n terms of the AP 3, 0, -3, ... is -357. Find n.
options:
- id: a
  en: '-14'
- id: b
  en: '-119'
- id: c
  en: '18'
- id: d
  en: '17'
answer:
  sympy: d
  accept: []
solution_steps:
- en: Here a = 3, d = -3 and S_n = -357.
- en: '(n/2)(2 x 3 + (n - 1) x -3) = -357. Multiply both sides by 2 and expand: -3n²
    + 9n = -714.'
- en: 'Rearranged: -3n² + (9)n - -714 = 0, whose solutions are n = 17 and n = -14.'
- en: The number of terms is a positive whole number, so n = 17.
- en: The correct option is d.
hints:
- level: 1
  en: Write the sum formula with n as the unknown and make it equal to the target.
- level: 2
  en: Multiply each side by 2 to clear the fraction, expand the bracket, and bring
    everything to one side so the other side is zero. Then solve for n.
- level: 3
  en: 'Full method: put the numbers into the sum formula, multiply each side by 2,
    expand, rearrange to zero, solve for n, and keep only the positive whole number.'
prediction_prompt:
  en: Is n more likely to be small or large?
