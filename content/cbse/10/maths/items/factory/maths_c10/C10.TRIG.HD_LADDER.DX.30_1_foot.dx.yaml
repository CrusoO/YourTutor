difficulty: 0.49
pool: diagnostic
role: apply
stem:
  en: A ladder 2 m long leans against a vertical wall and makes an angle of 30° with
    the level ground. How far is the foot of the ladder from the wall, in metres?
hints:
- level: 1
  en: The ladder is always the longest side of the triangle.
- level: 2
  en: 'Choose between sine and cosine by asking which side the question wants: the
    side opposite the angle goes with sine, the side next to it with cosine.'
- level: 3
  en: 'Full method: sketch and label the triangle, identify which two sides are involved,
    pick sine or cosine for them, replace the ratio by its exact value, and solve.'
prediction_prompt:
  en: Is the answer more or less than the length of the ladder?
