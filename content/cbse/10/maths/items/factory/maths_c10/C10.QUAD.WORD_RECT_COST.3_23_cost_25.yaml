stem:
  en: A school garden is rectangular. Its length is 3 m more than its breadth and
    it covers 598 m². The garden is to be fenced all the way round and the fencing
    costs 25 rupees per metre. Find the total cost of the fencing in rupees.
options:
- id: a
  en: '2750'
- id: b
  en: '2450'
- id: c
  en: '14950'
- id: d
  en: '1225'
answer:
  sympy: b
  accept: []
solution_steps:
- en: Let x metres be the breadth. Then the length is x + 3 metres.
- en: The area gives x(x + 3) = 598, so x² + 3x - 598 = 0.
- en: 'Factorise: (x - 23)(x + 26) = 0, so x = 23 or x = -26; a length is positive,
    so the breadth is 23 m and the length is 26 m.'
- en: The perimeter is 2(23 + 26) = 98 m, and the cost is 98 x 25.
- en: The correct option is b.
hints:
- level: 1
  en: Let x be the breadth and write the length using x, then use the area.
- level: 2
  en: Write the area as one relation in x, rearrange so the right side is zero, and
    solve it. Discard any solution that makes the length negative. Undo each step
    by doing the same thing to each side.
- level: 3
  en: 'Full method: name the breadth, write the length, form the area relation, rearrange
    to zero, factorise, keep the positive solution, then answer exactly what is asked
    (breadth, length or cost).'
prediction_prompt:
  en: About how long do you think the shorter side is?
