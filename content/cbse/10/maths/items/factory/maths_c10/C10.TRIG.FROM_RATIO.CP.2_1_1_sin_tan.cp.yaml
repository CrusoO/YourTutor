solution_steps:
- en: Draw a right triangle with angle A and mark the sides so that sin A = 4/5.
- en: Use the identity sin² A + cos² A = 1 (or tan A = sin A / cos A) to find the
    missing ratio.
- en: 'Since A is acute, take the positive root: tan A = 4/3.'
