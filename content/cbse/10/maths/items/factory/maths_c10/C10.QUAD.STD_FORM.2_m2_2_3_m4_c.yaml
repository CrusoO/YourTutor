type: mcq
pool: practice
role: procedure
stem:
  en: Rearrange 2x² + 3x - 12 = 3x - 4 into the form ax² + bx + c = 0. What is the
    value of c?
options:
- id: a
  en: '-12'
- id: b
  en: '-8'
- id: c
  en: '8'
- id: d
  en: '-16'
answer:
  sympy: b
  accept: []
solution_steps:
- en: Take the whole right-hand side away from both sides, so the right-hand side
    is 0.
- en: The left-hand side becomes 2x² - 8, so the equation is 2x² - 8 = 0.
- en: Comparing with ax² + bx + c = 0 gives c = -8.
- en: The correct option is b.
hints:
- level: 1
  en: Collect all the terms on the left side and leave zero on the right.
- level: 2
  en: 'Undo each term on the right by doing the same operation to both sides: take
    the term away from both sides, then combine like terms. Start with the plain number
    on the right: take it away from both sides first.'
- level: 3
  en: 'Full method: take the x term on the right from both sides, take the plain number
    on the right from both sides, combine the x terms, combine the plain numbers,
    then read the coefficient you need, keeping its sign.'
prediction_prompt:
  en: Before you work it out, will the coefficient be positive or negative?
