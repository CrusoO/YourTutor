solution_steps:
- en: The first term is -1 and the common difference is -6.
- en: The nth term is first term + (n - 1) x difference, so a_15 = -1 + (15 - 1)(-6).
- en: a_15 = -1 + -84 = -85.
- en: The correct option is c.
