stem:
  en: A triangular park has a right angle. The two sides that meet at the right angle
    differ in length by 5 m, and the longest side is 145 m. Find the length of the
    shorter of the two sides in metres.
options:
- id: a
  en: '100'
- id: b
  en: '140'
- id: c
  en: '105'
- id: d
  en: '-105'
answer:
  sympy: a
  accept: []
solution_steps:
- en: Let x metres be the shorter side. The other side is x + 5 metres.
- en: By Pythagoras, x² + (x + 5)² = 145², so 2x² + 10x - 21000 = 0.
- en: 'Divide both sides by 2 and factorise: (x - 100)(x + 105) = 0, so x = 100 (a
    length cannot be negative).'
- en: The shorter side is 100 m and the longer side is 105 m.
- en: The correct option is a.
hints:
- level: 1
  en: Let x be the shorter side and write the other side using x. The longest side
    is opposite the right angle.
- level: 2
  en: Use the relation for the sides of this triangle, expand the bracket carefully,
    bring every term to one side, then solve. Undo each step by doing the same thing
    to each side.
- level: 3
  en: 'Full method: name the shorter side, write the longer one, apply the rule linking
    the three sides, expand, rearrange to zero, divide out any common factor, solve,
    and keep the positive solution.'
prediction_prompt:
  en: Is the shorter side more or less than half the longest side?
