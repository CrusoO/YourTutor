solution_steps:
- en: The first term is 14 and the common difference is -4.
- en: 'Set the nth term equal to -62: 14 + (n - 1)(-4) = -62.'
- en: 'Take 14 away from both sides: (n - 1)(-4) = -76. Divide both sides by -4: n
    - 1 = 19.'
- en: 'Add 1 to both sides: n = 20.'
- en: The correct option is a.
