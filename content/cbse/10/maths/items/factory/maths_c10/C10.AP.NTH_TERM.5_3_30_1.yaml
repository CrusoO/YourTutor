solution_steps:
- en: The first term is 5 and the common difference is 3.
- en: The nth term is first term + (n - 1) x difference, so a_30 = 5 + (30 - 1)(3).
- en: a_30 = 5 + 87 = 92.
- en: The correct option is b.
