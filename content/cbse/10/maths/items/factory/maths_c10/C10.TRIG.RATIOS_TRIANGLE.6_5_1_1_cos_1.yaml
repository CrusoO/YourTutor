difficulty: 0.46
type: mcq
pool: practice
role: procedure
stem:
  en: In triangle PQR the angle at Q is a right angle, PQ = 60 cm and QR = 11 cm.
    Find the value of cos R.
options:
- id: a
  en: 11/60
- id: b
  en: 11/61
- id: c
  en: 61/11
- id: d
  en: 60/61
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Name the sides from angle R: the side opposite it, the side next to it (adjacent),
    and the hypotenuse.'
- en: By Pythagoras the hypotenuse PR = square root of (60² + 11²) = 61.
- en: Opposite = 60, adjacent = 11, hypotenuse = 61.
- en: cos R = adjacent / hypotenuse = 11/61.
- en: The correct option is b.
hints:
- level: 1
  en: Label the three sides relative to the angle asked about, not to the triangle.
- level: 2
  en: Only two sides are given, so use the relation between the three sides of this
    triangle to find the third before forming the ratio.
- level: 3
  en: 'Full method: label opposite, adjacent and hypotenuse for the stated angle,
    find the missing side with the rule for right triangles, write the ratio as a
    fraction and simplify it.'
prediction_prompt:
  en: Is this ratio bigger or smaller than 1?
