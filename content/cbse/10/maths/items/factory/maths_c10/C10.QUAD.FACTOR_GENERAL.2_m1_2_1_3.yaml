id: C10.QUAD.FACTOR_GENERAL.2_m1_2_1_3
skill_ids:
- MATH.ALG.QUAD.SOLVE_FACTORISE_GENERAL
difficulty: 0.65
type: mcq
pool: practice
role: procedure
stem:
  en: Solve 12x² + 2x - 2 = 0.
options:
- id: a
  en: x = -1/2 or x = -1/3
- id: b
  en: x = -1 or x = 1
- id: c
  en: x = -1/3 or x = 1/2
- id: d
  en: x = -1/2 or x = 1/3
answer:
  sympy: d
  accept: []
solution_steps:
- en: Divide both sides by 2, the common factor, to get 6x² + x - 1 = 0.
- en: Split the middle term 1x into -2x and 3x, because -2 and 3 multiply to -6 (the
    product of 6 and -1) and add to 1.
- en: 'Factorise: (2x + 1)(3x - 1) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: 2x + 1 = 0 gives x
    = -1/2 and 3x - 1 = 0 gives x = 1/3.'
- en: The correct option is d.
hints:
- level: 1
  en: Aim to turn the left side into two simpler expressions multiplied together.
- level: 2
  en: Divide out any common factor, split the middle term into two parts, and group
    in pairs to find the brackets. Then set each bracket to zero and undo it by doing
    the same thing to both sides.
- level: 3
  en: 'Full method: factorise the left side, set each bracket to zero, add or subtract
    the same number on both sides, divide both sides by the coefficient of x, then
    check each solution by substituting it back.'
prediction_prompt:
  en: How many different values of x do you expect?
