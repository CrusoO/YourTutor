stem:
  en: A is an acute angle and cos A = 12/13. Find the value of sin A.
options:
- id: a
  en: 25/169
- id: b
  en: 13/5
- id: c
  en: 1/13
- id: d
  en: 5/13
answer:
  sympy: d
  accept: []
solution_steps:
- en: Draw a right triangle with angle A and mark the sides so that cos A = 12/13.
- en: Use the identity sin² A + cos² A = 1 (or tan A = sin A / cos A) to find the
    missing ratio.
- en: 'Since A is acute, take the positive root: sin A = 5/13.'
- en: The correct option is d.
hints:
- level: 1
  en: Sketch the right triangle and mark the sides that the given ratio tells you.
- level: 2
  en: Find the third side of your triangle with the rule for right triangles, then
    form the ratio you need as one fraction of the sides.
- level: 3
  en: 'Full method: choose side lengths that fit the given ratio, find the missing
    side, write the asked ratio from the sides, and simplify.'
prediction_prompt:
  en: Is the asked ratio bigger or smaller than the given one?
