solution_steps:
- en: 'Read off the numbers: a1 = 3, b1 = -3, c1 = -3, a2 = 3, b2 = 1, c2 = -7.'
- en: 'Use x/(b1c2 - b2c1) = y/(c1a2 - c2a1) = 1/(a1b2 - a2b1): x/(24) = y/(12) =
    1/(12).'
- en: So x = 24/12 = 2 and y = 12/12 = 1.
- en: The correct option is a.
