role: procedure
stem:
  en: Use the ratio formula to solve 3x - 3y - 3 = 0 and 3x + y - 7 = 0.
hints:
- level: 1
  en: The formula needs the coefficients and the constant term of each equation, with
    signs.
- level: 2
  en: Each denominator is the difference of two products. Keep the order of the subtraction
    exactly as in the formula.
- level: 3
  en: 'Full method: write both equations as ax + by + c = 0, build the three differences
    of products for x, y and 1, then divide to get x and y.'
prediction_prompt:
  en: Which of the three differences of products will be the denominator of the last
    ratio?
