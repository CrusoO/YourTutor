difficulty: 0.57
type: mcq
pool: practice
role: procedure
stem:
  en: Use the quadratic formula to solve x² - 4x - 21 = 0.
options:
- id: a
  en: x = -3 or x = 7
- id: b
  en: x = -7 or x = 3
- id: c
  en: x = -1 or x = 9
- id: d
  en: x = -6 or x = 14
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 1, of x is -4, plain number
    is -21.'
- en: The discriminant is -4² - 4 x 1 x -21 = 100, and its square root is 10.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 1).
- en: 'Work out both signs: x = -3 or x = 7.'
- en: The correct option is a.
hints:
- level: 1
  en: Write down the three coefficients with their signs, then work out the discriminant
    on its own.
- level: 2
  en: Work out the discriminant first, then its square root. Keep the minus sign of
    the x coefficient when you write the opposite of it.
- level: 3
  en: 'Full method: list the coefficients, compute the discriminant, take its square
    root, put the numbers into the formula once with the plus sign and once with the
    minus sign, divide each by twice the leading coefficient, and check by substitution.'
prediction_prompt:
  en: How many different values of x do you expect?
