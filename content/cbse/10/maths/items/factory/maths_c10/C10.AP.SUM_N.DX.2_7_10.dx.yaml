solution_steps:
- en: The first term is 2, the common difference is 7 and the number of terms is 10.
- en: S_n = (n/2)(2a + (n - 1)d) = (10/2)(2 x 2 + (10 - 1) x 7).
- en: = (10/2)(67) = 335.
- en: The correct option is b.
