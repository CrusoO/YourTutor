solution_steps:
- en: Let the length be x metres and the width y metres. The perimeter counts every
    side.
- en: The two facts give 2x + 2y = 44 and x - y = 2.
- en: Solving the pair gives x = 12 and y = 10. The length is 12 metres.
- en: The correct option is b.
