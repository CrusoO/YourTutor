solution_steps:
- en: 'Read off the numbers: a1 = 1, b1 = -3, c1 = -10, a2 = 3, b2 = 1, c2 = -10.'
- en: 'Use x/(b1c2 - b2c1) = y/(c1a2 - c2a1) = 1/(a1b2 - a2b1): x/(40) = y/(-20) =
    1/(10).'
- en: So x = 40/10 = 4 and y = -20/10 = -2.
- en: The correct option is b.
