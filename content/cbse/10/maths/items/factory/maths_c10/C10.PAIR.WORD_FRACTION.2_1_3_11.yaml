solution_steps:
- en: Let the fraction be x/y. Then x + y = 14.
- en: After the change the fraction is (x + 1)/(y + 2) = 4/13, so 13x - 4y = -5.
- en: Solving the pair gives x = 3 and y = 11, so the fraction is 3/11.
- en: The correct option is c.
