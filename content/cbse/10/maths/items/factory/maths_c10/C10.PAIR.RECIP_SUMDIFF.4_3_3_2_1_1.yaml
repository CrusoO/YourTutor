solution_steps:
- en: Put 1/(x + y) = u and 1/(x - y) = v. Both relations become linear in u and v.
- en: They read 3u + 2v = 17/7 and u + v = 8/7.
- en: Solving gives u = 1/7 and v = 1, so x + y = 7 and x - y = 1.
- en: 'Add and subtract: x = (7 + (1))/2 = 4 and y = (7 - (1))/2 = 3.'
- en: The correct option is c.
