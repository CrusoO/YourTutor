id: C10.TRIG.HD_LADDER.60_4_foot
skill_ids:
- MATH.TRIG.HD.LADDER_AND_WALL
difficulty: 0.49
type: mcq
pool: practice
role: apply
stem:
  en: A ladder 8 m long leans against a vertical wall and makes an angle of 60° with
    the level ground. How far is the foot of the ladder from the wall, in metres?
options:
- id: a
  en: 4√3
- id: b
  en: '16'
- id: c
  en: '4'
- id: d
  en: 8√3
answer:
  sympy: c
  accept: []
solution_steps:
- en: The ladder is the hypotenuse. The wall height is opposite the 60° angle and
    the foot distance is adjacent to it.
- en: Distance = ladder x cosine 60° = 8 x (1/2).
- en: 'Simplify: 4 m.'
- en: The correct option is c.
hints:
- level: 1
  en: Sketch the wall, the ground and the ladder as the right triangle.
- level: 2
  en: 'Choose between sine and cosine by asking which side the question wants: the
    side opposite the angle goes with sine, the side next to it with cosine.'
- level: 3
  en: 'Full method: sketch and label the triangle, identify which two sides are involved,
    pick sine or cosine for them, replace the ratio by its exact value, and solve.'
prediction_prompt:
  en: Is the answer more or less than the length of the ladder?
