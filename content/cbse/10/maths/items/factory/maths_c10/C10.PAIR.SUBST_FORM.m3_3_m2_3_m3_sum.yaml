solution_steps:
- en: 'Put y = -2x - 3 into the second equation: 3x - 3(-2x - 3) = -18.'
- en: 'Multiply out and collect the x terms: 9x = -27, so x = -3.'
- en: 'Put x = -3 back into the first equation: y = -2 × -3 + (-3) = 3.'
- en: So x + y = -3 + (3) = 0.
- en: The correct option is a.
