stem:
  en: Use the quadratic formula to solve x² + 5x - 8 = 0. Leave surds in simplest
    form.
options:
- id: a
  en: x = (5 ± √57)/2
- id: b
  en: x = (-10 ± √57)/2
- id: c
  en: x = -5 ± √57
- id: d
  en: x = (-5 ± √57)/2
answer:
  sympy: d
  accept: []
solution_steps:
- en: The coefficients are 1, 5 and -8.
- en: The discriminant is 5² - 4 x 1 x -8 = 57, which is positive but not a perfect
    square.
- en: So x = (-(5) ± √57) / 2, and the square root is simplified as far as it will
    go.
- en: x = (-5 ± √57)/2.
- en: The correct option is d.
hints:
- level: 1
  en: Write down the three coefficients with their signs, then compute the discriminant.
- level: 2
  en: Put the numbers into the formula once with the plus sign and once with the minus
    sign. Simplify the square root by pulling out any square factor.
- level: 3
  en: 'Full method: list the coefficients, compute the discriminant, simplify its
    square root, write both roots over twice the leading coefficient, and cancel any
    common factor from every term of the top and the bottom.'
prediction_prompt:
  en: Is the discriminant a perfect square? What does that say about the roots?
