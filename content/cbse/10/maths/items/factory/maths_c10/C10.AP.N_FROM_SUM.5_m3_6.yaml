stem:
  en: The sum of the first n terms of the AP 5, 2, -1, ... is -15. Find n.
options:
- id: a
  en: '7'
- id: b
  en: '-3'
- id: c
  en: -5/3
- id: d
  en: '6'
answer:
  sympy: d
  accept: []
solution_steps:
- en: Here a = 5, d = -3 and S_n = -15.
- en: '(n/2)(2 x 5 + (n - 1) x -3) = -15. Multiply both sides by 2 and expand: -3n²
    + 13n = -30.'
- en: 'Rearranged: -3n² + (13)n - -30 = 0, whose solutions are n = 6 and n = -5/3.'
- en: The number of terms is a positive whole number, so n = 6.
- en: The correct option is d.
hints:
- level: 1
  en: Write the sum formula with n as the unknown and make it equal to the target.
- level: 2
  en: Multiply each side by 2 to clear the fraction, expand the bracket, and bring
    everything to one side so the other side is zero. Then solve for n.
- level: 3
  en: 'Full method: put the numbers into the sum formula, multiply each side by 2,
    expand, rearrange to zero, solve for n, and keep only the positive whole number.'
prediction_prompt:
  en: Is n more likely to be small or large?
