solution_steps:
- en: Let x metres be the shorter side. The other side is x + 21 metres.
- en: By Pythagoras, x² + (x + 21)² = 105², so 2x² + 42x - 10584 = 0.
- en: 'Divide both sides by 2 and factorise: (x - 63)(x + 84) = 0, so x = 63 (a length
    cannot be negative).'
- en: The shorter side is 63 m and the longer side is 84 m.
- en: The correct option is c.
