stem:
  en: A triangular park has a right angle. The two sides that meet at the right angle
    differ in length by 21 m, and the longest side is 105 m. Find the length of the
    shorter of the two sides in metres.
hints:
- level: 1
  en: Let x be the unknown short side and give the other side in terms of x.
- level: 2
  en: Use the relation for the sides of this triangle, expand the bracket carefully,
    bring every term to one side, then solve. Undo each step by doing the same thing
    to each side.
- level: 3
  en: 'Full method: name the shorter side, write the longer one, apply the rule linking
    the three sides, expand, rearrange to zero, divide out any common factor, solve,
    and keep the positive solution.'
prediction_prompt:
  en: Is the shorter side more or less than half the longest side?
