solution_steps:
- en: Let x km/h be the usual speed. The time taken is 120/x hours, and at the higher
    speed it is 120/(x + 10) hours.
- en: 'The saving is 2: 120/x - 120/(x + 10) = 2. Multiply every term by x(x + 10)
    to clear the fractions.'
- en: This gives 2x² + 20x - 1200 = 0, which factorises as (x - 20)(x + 30) = 0 after
    dividing by 2.
- en: A speed is positive, so the usual speed is 20 km/h and the faster speed is 30
    km/h.
- en: The correct option is d.
