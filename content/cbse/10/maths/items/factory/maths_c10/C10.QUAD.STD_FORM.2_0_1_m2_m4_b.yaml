stem:
  en: Rearrange 2x² - 4x - 4 = -2x - 4 into the form ax² + bx + c = 0. What is the
    value of b?
options:
- id: a
  en: '-6'
- id: b
  en: '-4'
- id: c
  en: '2'
- id: d
  en: '-2'
answer:
  sympy: d
  accept: []
solution_steps:
- en: Take the whole right-hand side away from both sides, so the right-hand side
    is 0.
- en: The left-hand side becomes 2x² - 2x, so the equation is 2x² - 2x = 0.
- en: Comparing with ax² + bx + c = 0 gives b = -2.
- en: The correct option is d.
hints:
- level: 1
  en: The standard form has zero on the right, so deal with the terms on the right
    first.
- level: 2
  en: 'Undo each term on the right by doing the same operation to both sides: take
    the term away from both sides, then combine like terms. Start with the term in
    x on the right: take it away from both sides first.'
- level: 3
  en: 'Full method: take the x term on the right from both sides, take the plain number
    on the right from both sides, combine the x terms, combine the plain numbers,
    then read the coefficient you need, keeping its sign.'
prediction_prompt:
  en: Before you work it out, will the coefficient be positive or negative?
