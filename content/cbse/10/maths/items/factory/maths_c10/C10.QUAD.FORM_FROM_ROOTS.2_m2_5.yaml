difficulty: 0.44
type: mcq
pool: practice
role: procedure
stem:
  en: Form the quadratic equation whose roots are -2 and 5. The coefficient of x²
    is 2.
options:
- id: a
  en: 2x² - 6x - 20 = 0
- id: b
  en: 2x² + 6x - 20 = 0
- id: c
  en: 2x² - 6x + 20 = 0
- id: d
  en: 2x² + 20x + 6 = 0
answer:
  sympy: a
  accept: []
solution_steps:
- en: A root r means (x - r) is a factor, so the factors are (x - (-2)) and (x - (5)).
- en: 'Multiply them: x² - (3)x + (-10).'
- en: 'Multiply by the leading coefficient 2 if it is not 1: 2x² - 6x - 20 = 0.'
- en: The correct option is a.
hints:
- level: 1
  en: Think backwards from the solutions to the brackets that produce them.
- level: 2
  en: 'To find each factor, undo x equals the root by doing the same thing to each
    side: take the root away from each side. Then multiply the two factors and collect
    terms.'
- level: 3
  en: 'Full method: write one factor for each root, multiply the two brackets, collect
    like terms, then multiply every term by the stated leading coefficient.'
prediction_prompt:
  en: Will the x coefficient be the sum of the roots or its opposite?
