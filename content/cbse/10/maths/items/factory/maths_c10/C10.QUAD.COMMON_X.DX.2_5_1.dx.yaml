solution_steps:
- en: Bring every term to the left so the right side is 0, then take out x as a common
    factor.
- en: This gives x(2x - 10) = 0.
- en: A product is zero only when one factor is zero, so x = 0 or the bracket is 0.
- en: 'Undo the bracket: add 10 to both sides, then divide both sides by 2: x = 5.'
- en: The solutions are x = 0 or x = 5.
- en: The correct option is d.
