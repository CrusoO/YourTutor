stem:
  en: The perimeter of a rectangular poster is 20 metres. Its length is 2 metres more
    than its width. Find the area of the poster.
hints:
- level: 1
  en: Write what the perimeter tells you and what the length says about the width.
- level: 2
  en: Two lengths and two widths make up the perimeter, so the perimeter is twice
    the sum of length and width.
- level: 3
  en: 'Full method: name the sides, write the perimeter relation and the relation
    between length and width, solve the pair, then answer what is asked.'
prediction_prompt:
  en: Roughly what size should the answer be?
