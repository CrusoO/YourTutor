solution_steps:
- en: Let the length be x metres and the width y metres. The perimeter counts every
    side.
- en: The two facts give 2x + 2y = 20 and x - y = 2.
- en: Solving the pair gives x = 6 and y = 4. The area is 6 × 4 = 24 square metres.
- en: The correct option is a.
