id: C10.QUAD.FACTOR_MONIC.1_m4_1_3_1
skill_ids:
- MATH.ALG.QUAD.SOLVE_FACTORISE_MONIC
difficulty: 0.42
type: mcq
pool: practice
role: procedure
stem:
  en: Find all values of x that satisfy x² + x - 12 = 0.
options:
- id: a
  en: x = -3 or x = 4
- id: b
  en: x = -4 or x = 3
- id: c
  en: x = -4 or x = -3
- id: d
  en: x = -4
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Look for two numbers with product -12 and sum 1: they are 4 and -3.'
- en: 'Factorise: (x + 4)(x - 3) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: x + 4 = 0 gives x
    = -4 and x - 3 = 0 gives x = 3.'
- en: The correct option is b.
hints:
- level: 1
  en: Factorise the left side first; any product that equals zero tells you something
    about each bracket.
- level: 2
  en: Find two numbers that multiply to the plain number and add to the x coefficient.
    Then set each bracket to zero and undo it by doing the same thing to both sides.
- level: 3
  en: 'Full method: factorise the left side, set each bracket to zero, add or subtract
    the same number on both sides, divide both sides by the coefficient of x, then
    check each solution by substituting it back.'
prediction_prompt:
  en: How many different values of x do you expect?
