solution_steps:
- en: Here a = 5, d = -3 and S_n = -169.
- en: '(n/2)(2 x 5 + (n - 1) x -3) = -169. Multiply both sides by 2 and expand: -3n²
    + 13n = -338.'
- en: 'Rearranged: -3n² + (13)n - -338 = 0, whose solutions are n = 13 and n = -26/3.'
- en: The number of terms is a positive whole number, so n = 13.
- en: The correct option is a.
