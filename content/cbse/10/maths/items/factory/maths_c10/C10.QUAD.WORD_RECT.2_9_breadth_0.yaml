stem:
  en: The length of a rectangular field is 2 m more than its breadth. Its area is
    99 m². Find the breadth of the field in metres.
options:
- id: a
  en: '11'
- id: b
  en: '20'
- id: c
  en: '-11'
- id: d
  en: '9'
answer:
  sympy: d
  accept: []
solution_steps:
- en: Let x metres be the breadth. Then the length is x + 2 metres.
- en: The area gives x(x + 2) = 99, so x² + 2x - 99 = 0.
- en: 'Factorise: (x - 9)(x + 11) = 0, so x = 9 or x = -11; a length is positive,
    so the breadth is 9 m and the length is 11 m.'
- en: The correct option is d.
hints:
- level: 1
  en: Let x be the breadth and write the length using x, then use the area.
- level: 2
  en: Write the area as one relation in x, rearrange so the right side is zero, and
    solve it. Discard any solution that makes the length negative. Undo each step
    by doing the same thing to each side.
- level: 3
  en: 'Full method: name the breadth, write the length, form the area relation, rearrange
    to zero, factorise, keep the positive solution, then answer exactly what is asked
    (breadth, length or cost).'
prediction_prompt:
  en: About how long do you think the shorter side is?
