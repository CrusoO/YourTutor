solution_steps:
- en: A root r means (x - r) is a factor, so the factors are (x - (-5)) and (x - (-3)).
- en: 'Multiply them: x² - (-8)x + (15).'
- en: 'Multiply by the leading coefficient 2 if it is not 1: 2x² + 16x + 30 = 0.'
- en: The correct option is b.
