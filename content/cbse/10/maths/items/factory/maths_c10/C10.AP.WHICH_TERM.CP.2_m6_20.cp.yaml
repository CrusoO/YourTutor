solution_steps:
- en: The first term is 2 and the common difference is -6.
- en: 'Set the nth term equal to -112: 2 + (n - 1)(-6) = -112.'
- en: 'Take 2 away from both sides: (n - 1)(-6) = -114. Divide both sides by -6: n
    - 1 = 19.'
- en: 'Add 1 to both sides: n = 20.'
- en: The correct option is c.
