solution_steps:
- en: Going from term 3 to term 4 takes 1 equal steps, and the terms change by 3.
- en: So the common difference is 3 / 1 = 3.
- en: 'Go back to the first term: a = 0 - (3 - 1)(3) = -6.'
- en: Then a_14 = -6 + (14 - 1)(3) = 33.
- en: The correct option is b.
