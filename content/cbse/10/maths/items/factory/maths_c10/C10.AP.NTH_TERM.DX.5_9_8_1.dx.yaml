solution_steps:
- en: The first term is 5 and the common difference is 9.
- en: The nth term is first term + (n - 1) x difference, so a_8 = 5 + (8 - 1)(9).
- en: a_8 = 5 + 63 = 68.
- en: The correct option is d.
