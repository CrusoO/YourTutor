difficulty: 0.44
type: mcq
pool: practice
role: procedure
stem:
  en: Which quadratic equation has the roots 3 and 5? The coefficient of x² is 2.
options:
- id: a
  en: 2x² - 16x - 30 = 0
- id: b
  en: 2x² - 30x + 16 = 0
- id: c
  en: 2x² - 16x + 30 = 0
- id: d
  en: 2x² + 16x + 30 = 0
answer:
  sympy: c
  accept: []
solution_steps:
- en: A root r means (x - r) is a factor, so the factors are (x - (3)) and (x - (5)).
- en: 'Multiply them: x² - (8)x + (15).'
- en: 'Multiply by the leading coefficient 2 if it is not 1: 2x² - 16x + 30 = 0.'
- en: The correct option is c.
hints:
- level: 1
  en: A root tells you one bracket of the factorised form.
- level: 2
  en: 'To find each factor, undo x equals the root by doing the same thing to each
    side: take the root away from each side. Then multiply the two factors and collect
    terms.'
- level: 3
  en: 'Full method: write one factor for each root, multiply the two brackets, collect
    like terms, then multiply every term by the stated leading coefficient.'
prediction_prompt:
  en: Will the x coefficient be the sum of the roots or its opposite?
