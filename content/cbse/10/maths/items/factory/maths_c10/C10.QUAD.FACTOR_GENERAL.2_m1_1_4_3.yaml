id: C10.QUAD.FACTOR_GENERAL.2_m1_1_4_3
skill_ids:
- MATH.ALG.QUAD.SOLVE_FACTORISE_GENERAL
difficulty: 0.65
type: mcq
pool: practice
role: procedure
stem:
  en: Find all values of x that satisfy 6x² - 2x - 8 = 0.
options:
- id: a
  en: x = -1 or x = 4/3
- id: b
  en: x = -1 or x = 4
- id: c
  en: x = -4/3 or x = -1
- id: d
  en: x = -4/3 or x = 1
answer:
  sympy: a
  accept: []
solution_steps:
- en: Divide both sides by 2, the common factor, to get 3x² - x - 4 = 0.
- en: Split the middle term -1x into -4x and 3x, because -4 and 3 multiply to -12
    (the product of 3 and -4) and add to -1.
- en: 'Factorise: (x + 1)(3x - 4) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: x + 1 = 0 gives x
    = -1 and 3x - 4 = 0 gives x = 4/3.'
- en: The correct option is a.
hints:
- level: 1
  en: Factorise the left side first; any product that equals zero tells you something
    about each bracket.
- level: 2
  en: Divide out any common factor, split the middle term into two parts, and group
    in pairs to find the brackets. Then set each bracket to zero and undo it by doing
    the same thing to both sides.
- level: 3
  en: 'Full method: factorise the left side, set each bracket to zero, add or subtract
    the same number on both sides, divide both sides by the coefficient of x, then
    check each solution by substituting it back.'
prediction_prompt:
  en: How many different values of x do you expect?
