solution_steps:
- en: Let the fraction be x/y. Then x + y = 9.
- en: After the change the fraction is (x + 1)/(y + -1) = 2/7, so 7x - 2y = -9.
- en: Solving the pair gives x = 1 and y = 8, so the fraction is 1/8.
- en: The correct option is a.
