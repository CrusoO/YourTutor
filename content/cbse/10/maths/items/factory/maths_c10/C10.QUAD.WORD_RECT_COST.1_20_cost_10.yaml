difficulty: 0.77
type: mcq
pool: practice
role: transfer
stem:
  en: A school garden is rectangular. Its length is 1 m more than its breadth and
    it covers 420 m². The garden is to be fenced all the way round and the fencing
    costs 10 rupees per metre. Find the total cost of the fencing in rupees.
options:
- id: a
  en: '4200'
- id: b
  en: '860'
- id: c
  en: '410'
- id: d
  en: '820'
answer:
  sympy: d
  accept: []
solution_steps:
- en: Let x metres be the breadth. Then the length is x + 1 metres.
- en: The area gives x(x + 1) = 420, so x² + 1x - 420 = 0.
- en: 'Factorise: (x - 20)(x + 21) = 0, so x = 20 or x = -21; a length is positive,
    so the breadth is 20 m and the length is 21 m.'
- en: The perimeter is 2(20 + 21) = 82 m, and the cost is 82 x 10.
- en: The correct option is d.
hints:
- level: 1
  en: Let x stand for the breadth, then write the length in terms of x.
- level: 2
  en: Write the area as one relation in x, rearrange so the right side is zero, and
    solve it. Discard any solution that makes the length negative. Undo each step
    by doing the same thing to each side.
- level: 3
  en: 'Full method: name the breadth, write the length, form the area relation, rearrange
    to zero, factorise, keep the positive solution, then answer exactly what is asked
    (breadth, length or cost).'
prediction_prompt:
  en: About how long do you think the shorter side is?
