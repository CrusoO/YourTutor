solution_steps:
- en: The angles 76° and 14° add up to 90°, so they are complementary.
- en: 'For complementary angles: sin (90 - A) = cos A, cos (90 - A) = sin A, tan (90
    - A) = cot A, sec (90 - A) = cosec A.'
- en: Rewrite the second term using the first angle and simplify; the value is 1.
- en: The correct option is c.
