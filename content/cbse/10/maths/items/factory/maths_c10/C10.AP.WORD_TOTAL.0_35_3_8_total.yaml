stem:
  en: In a hall the first row has 35 seats and every row after it has 3 more seats
    than the row before. There are 8 rows. How many seats are there in the whole hall?
options:
- id: a
  en: '364'
- id: b
  en: '376'
- id: c
  en: '728'
- id: d
  en: '56'
answer:
  sympy: a
  accept: []
solution_steps:
- en: The amounts form an AP with first term 35 and common difference 3.
- en: The last amount is 56, so the total is S = (8/2)(35 + 56).
- en: S = 364.
- en: The correct option is a.
