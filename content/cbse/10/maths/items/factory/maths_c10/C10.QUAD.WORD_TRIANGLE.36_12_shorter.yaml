solution_steps:
- en: Let x metres be the shorter side. The other side is x + 12 metres.
- en: By Pythagoras, x² + (x + 12)² = 60², so 2x² + 24x - 3456 = 0.
- en: 'Divide both sides by 2 and factorise: (x - 36)(x + 48) = 0, so x = 36 (a length
    cannot be negative).'
- en: The shorter side is 36 m and the longer side is 48 m.
- en: The correct option is a.
