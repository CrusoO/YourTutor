id: C10.AP.TWO_TERMS.m6_5_3_4_20
skill_ids:
- MATH.ALG.AP.TERMS_FROM_TWO_TERMS
difficulty: 0.59
type: mcq
pool: practice
role: apply
stem:
  en: An AP has 4 as its 3rd term and 24 as its 7th term. What is its 20th term?
options:
- id: a
  en: '94'
- id: b
  en: '89'
- id: c
  en: '344'
- id: d
  en: '99'
answer:
  sympy: b
  accept: []
solution_steps:
- en: Going from term 3 to term 7 takes 4 equal steps, and the terms change by 20.
- en: So the common difference is 20 / 4 = 5.
- en: 'Go back to the first term: a = 4 - (3 - 1)(5) = -6.'
- en: Then a_20 = -6 + (20 - 1)(5) = 89.
- en: The correct option is b.
hints:
- level: 1
  en: The change between the two given terms is made of several equal steps.
- level: 2
  en: Share the total change between the two terms equally over the number of steps
    between them, then work back to the first term.
- level: 3
  en: 'Full method: divide the change in value by the change in position to get the
    difference, use one given term to find the first term, then apply the rule for
    the term you are asked for.'
prediction_prompt:
  en: Is the common difference positive or negative?
