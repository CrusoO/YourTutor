solution_steps:
- en: Put 1/(x + y) = u and 1/(x - y) = v. Both relations become linear in u and v.
- en: They read 3u + 2v = -13/5 and -2u + v = -3/5.
- en: Solving gives u = -1/5 and v = -1, so x + y = -5 and x - y = -1.
- en: 'Add and subtract: x = (-5 + (-1))/2 = -3 and y = (-5 - (-1))/2 = -2.'
- en: The correct option is d.
