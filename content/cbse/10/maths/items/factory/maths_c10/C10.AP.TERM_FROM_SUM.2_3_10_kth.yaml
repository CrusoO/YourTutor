solution_steps:
- en: 'The nth term is the difference of two sums: a_n = S_n - S_(n-1).'
- en: S_n - S_(n-1) = 2n² + 3n - (2(n - 1)² + 3(n - 1)) = 4n + 1.
- en: 'Put n = 10: a_10 = 41.'
- en: The correct option is c.
