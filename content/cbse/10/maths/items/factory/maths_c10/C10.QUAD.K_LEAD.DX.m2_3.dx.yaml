solution_steps:
- en: Equal roots need b² - 4ac = 0, so (-12)² - 4(k)(-2) = 0.
- en: 'This gives 144 - -8k = 0. Add -8k to both sides: -8k = 144.'
- en: 'Divide both sides by -8: k = -18.'
- en: The correct option is c.
