id: C10.AP.TERM_FROM_SUM.1_m2_5_kth
skill_ids:
- MATH.ALG.AP.TERM_FROM_SUM_FORMULA
difficulty: 0.67
type: mcq
pool: practice
role: apply
stem:
  en: The sum of the first n terms of an AP is S_n = 1n² - 2n. Find the 5th term.
options:
- id: a
  en: '15'
- id: b
  en: '3'
- id: c
  en: '7'
- id: d
  en: '12'
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'The nth term is the difference of two sums: a_n = S_n - S_(n-1).'
- en: S_n - S_(n-1) = 1n² - 2n - (1(n - 1)² - 2(n - 1)) = 2n - 3.
- en: 'Put n = 5: a_5 = 7.'
- en: The correct option is c.
hints:
- level: 1
  en: The sum up to one term and the sum up to the term before it differ by exactly
    that term.
- level: 2
  en: Write the sum with n replaced by n minus one, subtract it from the original
    sum, and simplify the result.
- level: 3
  en: 'Full method: find S_n minus S_(n-1) in terms of n, simplify to get the rule
    for the nth term, then substitute the position you need or read off the difference.'
prediction_prompt:
  en: Will the term be larger or smaller than the sum for the same n?
