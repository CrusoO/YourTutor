difficulty: 0.46
type: mcq
pool: practice
role: procedure
stem:
  en: In triangle PQR the angle at Q is a right angle, PQ = 40 cm and QR = 42 cm.
    Find the value of sin R.
options:
- id: a
  en: 20/29
- id: b
  en: 20/21
- id: c
  en: 29/20
- id: d
  en: 21/29
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Name the sides from angle R: the side opposite it, the side next to it (adjacent),
    and the hypotenuse.'
- en: By Pythagoras the hypotenuse PR = square root of (40² + 42²) = 58.
- en: Opposite = 40, adjacent = 42, hypotenuse = 58.
- en: sin R = opposite / hypotenuse = 20/29.
- en: The correct option is a.
hints:
- level: 1
  en: Decide which side is opposite the angle, which is next to it, and which is the
    longest.
- level: 2
  en: Only two sides are given, so use the relation between the three sides of this
    triangle to find the third before forming the ratio.
- level: 3
  en: 'Full method: label opposite, adjacent and hypotenuse for the stated angle,
    find the missing side with the rule for right triangles, write the ratio as a
    fraction and simplify it.'
prediction_prompt:
  en: Is this ratio bigger or smaller than 1?
