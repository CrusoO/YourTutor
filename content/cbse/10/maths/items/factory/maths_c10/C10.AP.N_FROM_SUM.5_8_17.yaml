solution_steps:
- en: Here a = 5, d = 8 and S_n = 1173.
- en: '(n/2)(2 x 5 + (n - 1) x 8) = 1173. Multiply both sides by 2 and expand: 8n²
    + 2n = 2346.'
- en: 'Rearranged: 8n² + (2)n - 2346 = 0, whose solutions are n = 17 and n = -69/4.'
- en: The number of terms is a positive whole number, so n = 17.
- en: The correct option is a.
