solution_steps:
- en: 'Look for two numbers with product 27 and sum -12: they are -3 and -9.'
- en: 'Factorise: (x - 3)(x - 9) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: x - 3 = 0 gives x
    = 3 and x - 9 = 0 gives x = 9.'
- en: The correct option is a.
