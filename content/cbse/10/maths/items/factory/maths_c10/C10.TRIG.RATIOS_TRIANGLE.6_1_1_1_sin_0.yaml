solution_steps:
- en: 'Name the sides from angle P: the side opposite it, the side next to it (adjacent),
    and the hypotenuse.'
- en: By Pythagoras the hypotenuse PR = square root of (12² + 35²) = 37.
- en: Opposite = 35, adjacent = 12, hypotenuse = 37.
- en: sin P = opposite / hypotenuse = 35/37.
- en: The correct option is a.
