solution_steps:
- en: The first term is 12, the common difference is 7 and the number of terms is
    10.
- en: S_n = (n/2)(2a + (n - 1)d) = (10/2)(2 x 12 + (10 - 1) x 7).
- en: = (10/2)(87) = 435.
- en: The correct option is d.
