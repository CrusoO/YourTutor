solution_steps:
- en: Let x metres be the shorter side. The other side is x + 6 metres.
- en: By Pythagoras, x² + (x + 6)² = 30², so 2x² + 12x - 864 = 0.
- en: 'Divide both sides by 2 and factorise: (x - 18)(x + 24) = 0, so x = 18 (a length
    cannot be negative).'
- en: The shorter side is 18 m and the longer side is 24 m.
- en: The correct option is a.
