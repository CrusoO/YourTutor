difficulty: 0.49
type: mcq
pool: practice
role: apply
stem:
  en: A ladder 4 m long leans against a vertical wall and makes an angle of 30° with
    the level ground. How high up the wall does the ladder reach, in metres?
options:
- id: a
  en: 4√3/3
- id: b
  en: '2'
- id: c
  en: '8'
- id: d
  en: 2√3
answer:
  sympy: b
  accept: []
solution_steps:
- en: The ladder is the hypotenuse. The wall height is opposite the 30° angle and
    the foot distance is adjacent to it.
- en: Height = ladder x sine 30° = 4 x (1/2).
- en: 'Simplify: 2 m.'
- en: The correct option is b.
hints:
- level: 1
  en: Mark the angle with the ground and name the three sides.
- level: 2
  en: 'Choose between sine and cosine by asking which side the question wants: the
    side opposite the angle goes with sine, the side next to it with cosine.'
- level: 3
  en: 'Full method: sketch and label the triangle, identify which two sides are involved,
    pick sine or cosine for them, replace the ratio by its exact value, and solve.'
prediction_prompt:
  en: Is the answer more or less than the length of the ladder?
