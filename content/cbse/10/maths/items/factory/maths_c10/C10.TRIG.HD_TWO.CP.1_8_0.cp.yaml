solution_steps:
- en: Let the tower be h m high. Seen at 45° the ground distance is h / tan 45°; seen
    at 60° it is h / tan 60°.
- en: 'The two distances differ by the 16 m walked: h / tan 45° - h / tan 60° = 16.'
- en: 'Put in the exact values of the tangents and solve for h: h = 24 + 8√3 m.'
- en: The correct option is b.
