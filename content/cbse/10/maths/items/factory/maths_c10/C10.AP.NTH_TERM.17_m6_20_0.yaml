solution_steps:
- en: The first term is 17 and the common difference is -6.
- en: The nth term is first term + (n - 1) x difference, so a_20 = 17 + (20 - 1)(-6).
- en: a_20 = 17 + -114 = -97.
- en: The correct option is b.
