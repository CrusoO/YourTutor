stem:
  en: Find the value of cos 34° - sin 56°.
options:
- id: a
  en: '2'
- id: b
  en: '1'
- id: c
  en: '-1'
- id: d
  en: '0'
answer:
  sympy: d
  accept: []
solution_steps:
- en: The angles 34° and 56° add up to 90°, so they are complementary.
- en: 'For complementary angles: sin (90 - A) = cos A, cos (90 - A) = sin A, tan (90
    - A) = cot A, sec (90 - A) = cosec A.'
- en: Rewrite the second term using the first angle and simplify; the value is 0.
- en: The correct option is d.
hints:
- level: 1
  en: Try rewriting one ratio so that both terms use the same angle.
- level: 2
  en: A ratio of an angle equals the matching co-ratio of its complement. Use that
    to rewrite one term so both terms involve the same angle.
- level: 3
  en: 'Full method: confirm the angles add to ninety, convert one term to the other
    angle with the complement rule, then simplify the expression.'
prediction_prompt:
  en: Without a calculator, do you think the answer is a surprise number?
