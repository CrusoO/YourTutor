solution_steps:
- en: 'Look for two numbers with product -81 and sum 0: they are 9 and -9.'
- en: 'Factorise: (x + 9)(x - 9) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: x + 9 = 0 gives x
    = -9 and x - 9 = 0 gives x = 9.'
- en: The correct option is d.
