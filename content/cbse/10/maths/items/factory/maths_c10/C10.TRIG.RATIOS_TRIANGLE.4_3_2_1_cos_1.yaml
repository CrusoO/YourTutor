solution_steps:
- en: 'Name the sides from angle R: the side opposite it, the side next to it (adjacent),
    and the hypotenuse.'
- en: By Pythagoras the hypotenuse PR = square root of (48² + 14²) = 50.
- en: Opposite = 48, adjacent = 14, hypotenuse = 50.
- en: cos R = adjacent / hypotenuse = 7/25.
- en: The correct option is a.
