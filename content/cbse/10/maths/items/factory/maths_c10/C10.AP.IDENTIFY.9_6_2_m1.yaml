id: C10.AP.IDENTIFY.9_6_2_m1
skill_ids:
- MATH.ALG.AP.IDENTIFY_AP
difficulty: 0.34
type: mcq
pool: practice
role: recall
stem:
  en: All the lists begin with 9. Choose the one in which the gap between neighbouring
    terms never changes.
options:
- id: a
  en: 9, 15, 21, 26
- id: b
  en: 9, 15, 21, 27
- id: c
  en: 9, 15, 22, 30
- id: d
  en: 9, 18, 36, 72
answer:
  sympy: b
  accept: []
solution_steps:
- en: A list is an AP when the difference between every pair of neighbouring terms
    is the same.
- en: In 9, 15, 21, 27 each step is 6, and it stays 6 all the way along.
- en: In each of the other lists, at least one pair of neighbours has a different
    difference.
- en: The correct option is b.
hints:
- level: 1
  en: Checking only the first two terms is not enough.
- level: 2
  en: For each list subtract every term from the next one. A list passes only when
    all its gaps are identical.
- level: 3
  en: 'Full method: for every list write down the three gaps between neighbours, compare
    them, and keep the one list whose gaps are all equal.'
prediction_prompt:
  en: Which list do you suspect, and why?
