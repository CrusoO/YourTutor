difficulty: 0.72
type: mcq
pool: practice
role: apply
stem:
  en: Use the quadratic formula to solve 2x² - 2x - 6 = 0. Leave surds in simplest
    form.
options:
- id: a
  en: x = 1 ± √13
- id: b
  en: x = (-1 ± √13)/2
- id: c
  en: x = (1 ± √13)/2
- id: d
  en: x = (4 ± √13)/2
answer:
  sympy: c
  accept: []
solution_steps:
- en: The coefficients are 2, -2 and -6.
- en: The discriminant is -2² - 4 x 2 x -6 = 52, which is positive but not a perfect
    square.
- en: So x = (-(-2) ± √52) / 4, and the square root is simplified as far as it will
    go.
- en: x = (1 ± √13)/2.
- en: The correct option is c.
hints:
- level: 1
  en: Work out the discriminant first; it tells you what kind of roots to expect.
- level: 2
  en: Put the numbers into the formula once with the plus sign and once with the minus
    sign. Simplify the square root by pulling out any square factor.
- level: 3
  en: 'Full method: list the coefficients, compute the discriminant, simplify its
    square root, write both roots over twice the leading coefficient, and cancel any
    common factor from every term of the top and the bottom.'
prediction_prompt:
  en: Is the discriminant a perfect square? What does that say about the roots?
