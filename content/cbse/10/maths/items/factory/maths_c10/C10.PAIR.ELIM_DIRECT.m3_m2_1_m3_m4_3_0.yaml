solution_steps:
- en: The x terms are 3x and 3x, so subtracting the equations cancels x.
- en: 'Subtract the second equation from the first, every term: -y = 3, so y = -3.'
- en: Put y = -3 in the first equation to get x = -2.
- en: The correct option is d.
