solution_steps:
- en: 'Read off the numbers: a1 = 1, b1 = 2, c1 = 2, a2 = 3, b2 = -1, c2 = -8.'
- en: 'Use x/(b1c2 - b2c1) = y/(c1a2 - c2a1) = 1/(a1b2 - a2b1): x/(-14) = y/(14) =
    1/(-7).'
- en: So x = -14/-7 = 2 and y = 14/-7 = -2.
- en: The correct option is c.
