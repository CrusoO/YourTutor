solution_steps:
- en: Draw a right triangle with angle A and mark the sides so that tan A = 4/3.
- en: Use the identity sin² A + cos² A = 1 (or tan A = sin A / cos A) to find the
    missing ratio.
- en: 'Since A is acute, take the positive root: sin A = 4/5.'
- en: The correct option is a.
