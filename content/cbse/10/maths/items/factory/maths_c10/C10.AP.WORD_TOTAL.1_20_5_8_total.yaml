stem:
  en: A runner trains for 8 weeks. In week 1 she runs 20 km and each week she runs
    5 km more than the week before. How far does she run in all the weeks together,
    in km?
options:
- id: a
  en: '600'
- id: b
  en: '300'
- id: c
  en: '320'
- id: d
  en: '55'
answer:
  sympy: b
  accept: []
solution_steps:
- en: The amounts form an AP with first term 20 and common difference 5.
- en: The last amount is 55, so the total is S = (8/2)(20 + 55).
- en: S = 300.
- en: The correct option is b.
hints:
- level: 1
  en: 'Let the amounts in order be the terms of an AP: name its first term and its
    common difference.'
- level: 2
  en: Decide whether the question asks for one term or for the sum of all the terms,
    then choose the matching rule. Work through it one operation after another.
- level: 3
  en: 'Full method: identify the first term, the common difference and the number
    of rows or days, pick the rule for one term or for the sum, substitute carefully,
    and give the answer with its unit.'
