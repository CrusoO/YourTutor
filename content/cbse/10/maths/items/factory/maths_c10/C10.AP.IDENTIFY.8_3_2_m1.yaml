stem:
  en: Every list starts at 8. Which of these lists is an arithmetic progression?
hints:
- level: 1
  en: An AP keeps adding the same amount; test every neighbouring pair.
- level: 2
  en: For each list subtract every term from the next one. A list passes only when
    all its gaps are identical.
- level: 3
  en: 'Full method: for every list write down the three gaps between neighbours, compare
    them, and keep the one list whose gaps are all equal.'
prediction_prompt:
  en: Which list do you suspect, and why?
