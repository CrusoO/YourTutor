solution_steps:
- en: 'Name the sides from angle R: the side opposite it, the side next to it (adjacent),
    and the hypotenuse.'
- en: By Pythagoras the hypotenuse PR = square root of (70² + 24²) = 74.
- en: Opposite = 70, adjacent = 24, hypotenuse = 74.
- en: tan R = opposite / adjacent = 35/12.
- en: The correct option is b.
