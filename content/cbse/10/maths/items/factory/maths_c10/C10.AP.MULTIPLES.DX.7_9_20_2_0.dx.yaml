solution_steps:
- en: The first multiple of 7 in the range is 63 and the last is 196.
- en: 'They form an AP with common difference 7. Number of terms: (196 - 63)/7 + 1
    = 20.'
- en: S = (20/2)(63 + 196) = 2590.
- en: The correct option is c.
