solution_steps:
- en: Equal roots need b² - 4ac = 0, so (-36)² - 4(k)(-6) = 0.
- en: 'This gives 1296 - -24k = 0. Add -24k to both sides: -24k = 1296.'
- en: 'Divide both sides by -24: k = -54.'
- en: The correct option is a.
