solution_steps:
- en: Let the still-water speed be x km/h and the stream speed y km/h. Upstream the
    speed is x - y, downstream it is x + y.
- en: Distance = speed × time gives 2x - 2y = 12 and x + y = 10.
- en: 'Dividing out the hours: x - y = 6 and x + y = 10, so x = 8 and y = 2.'
- en: The correct option is c.
