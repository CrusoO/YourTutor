solution_steps:
- en: Let x metres be the shorter side. The other side is x + 17 metres.
- en: By Pythagoras, x² + (x + 17)² = 25², so 2x² + 34x - 336 = 0.
- en: 'Divide both sides by 2 and factorise: (x - 7)(x + 24) = 0, so x = 7 (a length
    cannot be negative).'
- en: The shorter side is 7 m and the longer side is 24 m.
- en: The correct option is b.
