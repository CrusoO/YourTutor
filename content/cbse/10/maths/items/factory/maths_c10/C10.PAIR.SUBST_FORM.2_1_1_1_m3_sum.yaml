solution_steps:
- en: 'Put y = x - 1 into the second equation: x - 3(x - 1) = -1.'
- en: 'Multiply out and collect the x terms: -2x = -4, so x = 2.'
- en: 'Put x = 2 back into the first equation: y = 1 × 2 + (-1) = 1.'
- en: So x + y = 2 + (1) = 3.
- en: The correct option is d.
