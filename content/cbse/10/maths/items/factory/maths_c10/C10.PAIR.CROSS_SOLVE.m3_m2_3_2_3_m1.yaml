solution_steps:
- en: 'Read off the numbers: a1 = 3, b1 = 2, c1 = 13, a2 = 3, b2 = -1, c2 = 7.'
- en: 'Use x/(b1c2 - b2c1) = y/(c1a2 - c2a1) = 1/(a1b2 - a2b1): x/(27) = y/(18) =
    1/(-9).'
- en: So x = 27/-9 = -3 and y = 18/-9 = -2.
- en: The correct option is c.
