solution_steps:
- en: 'Read off the numbers: a1 = 3, b1 = -3, c1 = -18, a2 = -2, b2 = 1, c2 = 10.'
- en: 'Use x/(b1c2 - b2c1) = y/(c1a2 - c2a1) = 1/(a1b2 - a2b1): x/(-12) = y/(6) =
    1/(-3).'
- en: So x = -12/-3 = 4 and y = 6/-3 = -2.
- en: The correct option is b.
