id: C10.AP.NTH_TERM.2_5_15_1
skill_ids:
- MATH.ALG.AP.NTH_TERM
difficulty: 0.31
type: mcq
pool: practice
role: procedure
stem:
  en: An AP starts at 2 and changes by 5 at every step. What is its 15th term?
options:
- id: a
  en: '77'
- id: b
  en: '21'
- id: c
  en: '72'
- id: d
  en: '-68'
answer:
  sympy: c
  accept: []
solution_steps:
- en: The first term is 2 and the common difference is 5.
- en: The nth term is first term + (n - 1) x difference, so a_15 = 2 + (15 - 1)(5).
- en: a_15 = 2 + 70 = 72.
- en: The correct option is c.
hints:
- level: 1
  en: To reach the nth term you make one fewer jump than n.
- level: 2
  en: The number of jumps is one less than the position. Multiply the difference by
    the number of jumps, then add the result to the first term.
- level: 3
  en: 'Full method: identify the first term and the common difference, count the jumps
    which is the position minus one, multiply by the difference, and add to the first
    term.'
prediction_prompt:
  en: Will the term be much bigger or smaller than the first term?
