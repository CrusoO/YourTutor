solution_steps:
- en: 'The nth term is the difference of two sums: a_n = S_n - S_(n-1).'
- en: S_n - S_(n-1) = 5n² + 3n - (5(n - 1)² + 3(n - 1)) = 10n - 2.
- en: 'Put n = 3: a_3 = 28.'
- en: The correct option is a.
