solution_steps:
- en: 'Put y = -2x - 5 into the second equation: 3x + 2(-2x - 5) = -7.'
- en: 'Multiply out and collect the x terms: -x = 3, so x = -3.'
- en: 'Put x = -3 back into the first equation: y = -2 × -3 + (-5) = 1.'
