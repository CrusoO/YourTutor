solution_steps:
- en: The first multiple of 11 in the range is 99 and the last is 220.
- en: 'They form an AP with common difference 11. Number of terms: (220 - 99)/11 +
    1 = 12.'
- en: S = (12/2)(99 + 220) = 1914.
- en: The correct option is b.
