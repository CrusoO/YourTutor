solution_steps:
- en: Multiply the first equation by 5 and the second by 2, every term, so both x
    coefficients become 10.
- en: 'Subtract the second new equation from the first: 4y = 8, so y = 2.'
- en: Put y = 2 in the first original equation to get x = -2.
- en: The correct option is b.
