solution_steps:
- en: 'Line A: y changes by -2 each time x goes up by 1, so y = -2x + 7.'
- en: 'Line B: y changes by -1 each time x goes up by 1, so y = -x + 5.'
- en: 'At the meeting point both rules give the same y: -2x + (7) = -1x + (5), so
    x = 2.'
- en: Then y = -2 × 2 + (7) = 3. The lines meet at (2, 3).
- en: The correct option is d.
