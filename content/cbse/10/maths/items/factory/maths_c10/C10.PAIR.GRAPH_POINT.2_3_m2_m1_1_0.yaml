difficulty: 0.47
pool: practice
role: apply
stem:
  en: Line A passes through (-1, 9) and (4, -1). Line B passes through (0, 5) and
    (5, 0). Find the point where the two lines cut each other.
hints:
- level: 1
  en: Use the two listed points of each line to get its rule first.
- level: 2
  en: The meeting point is the one place where both rules give the same y for the
    same x.
- level: 3
  en: 'Full method: get the rule for each line from its points, set the two rules
    equal to find x, then put x into either rule to find y and check it in the other.'
prediction_prompt:
  en: 'Before working it out: is the meeting point nearer the first listed points
    or the last ones?'
