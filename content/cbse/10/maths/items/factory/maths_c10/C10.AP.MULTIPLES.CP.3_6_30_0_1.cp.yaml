solution_steps:
- en: The first multiple of 3 in the range is 18 and the last is 105.
- en: 'They form an AP with common difference 3. Number of terms: (105 - 18)/3 + 1
    = 30.'
- en: S = (30/2)(18 + 105) = 1845.
- en: The correct option is c.
