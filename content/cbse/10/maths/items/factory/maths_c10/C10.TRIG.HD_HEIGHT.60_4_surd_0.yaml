id: C10.TRIG.HD_HEIGHT.60_4_surd_0
skill_ids:
- MATH.TRIG.HD.HEIGHT_FROM_DISTANCE
difficulty: 0.39
type: mcq
pool: practice
role: apply
stem:
  en: A tower stands on level ground. From a point on the ground 4 m from the foot,
    the angle of elevation of the top is 60°. Find the height of the tower in metres.
options:
- id: a
  en: 2√3
- id: b
  en: '2'
- id: c
  en: 4√3/3
- id: d
  en: 4√3
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Sketch a right triangle: the tower is the side opposite the 60° angle and the
    ground distance is the adjacent side.'
- en: 'Opposite and adjacent sides link through tan 60°: height = 4 x tan 60°.'
- en: With tan 60° taken from the table, the height is 4√3 m.
- en: The correct option is d.
hints:
- level: 1
  en: Choose the ratio that links the two sides you care about.
- level: 2
  en: The ratio that links the opposite side to the adjacent side is the tangent.
    Write it as one relation and undo the division by doing the same thing to each
    side.
- level: 3
  en: 'Full method: sketch and label the triangle, name the two sides involved, write
    the tangent ratio for the stated angle, replace the tangent by its exact value,
    and solve for the height.'
prediction_prompt:
  en: Is the height larger or smaller than the distance from the foot?
