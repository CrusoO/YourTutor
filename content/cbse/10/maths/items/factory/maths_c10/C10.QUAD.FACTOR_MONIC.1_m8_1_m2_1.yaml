solution_steps:
- en: 'Look for two numbers with product 16 and sum 10: they are 8 and 2.'
- en: 'Factorise: (x + 8)(x + 2) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: x + 8 = 0 gives x
    = -8 and x + 2 = 0 gives x = -2.'
- en: The correct option is b.
