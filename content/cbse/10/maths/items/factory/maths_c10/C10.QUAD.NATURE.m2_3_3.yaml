stem:
  en: Describe the roots of the equation -2x² + 3x + 3 = 0 using the discriminant.
options:
- id: a
  en: One real root and one non-real root
- id: b
  en: Two distinct real roots
- id: c
  en: Two equal real roots
- id: d
  en: No real roots
answer:
  sympy: b
  accept: []
solution_steps:
- en: The coefficients are -2, 3 and 3.
- en: The discriminant is b² - 4ac = 33.
- en: 'The discriminant is positive, so the equation has: two distinct real roots.'
- en: The correct option is b.
hints:
- level: 1
  en: Compare that quantity with zero to decide.
- level: 2
  en: Work out the discriminant from the three coefficients, then see whether it is
    positive, zero or negative.
- level: 3
  en: 'Full method: write the coefficients with signs, compute the discriminant, and
    match its sign to the three possible cases for the roots.'
prediction_prompt:
  en: Which sign do you expect the discriminant to have?
