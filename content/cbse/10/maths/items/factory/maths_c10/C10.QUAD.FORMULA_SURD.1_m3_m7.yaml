difficulty: 0.72
type: mcq
pool: practice
role: apply
stem:
  en: Use the quadratic formula to solve x² - 3x - 7 = 0. Leave surds in simplest
    form.
options:
- id: a
  en: x = 3 ± √37
- id: b
  en: x = (-3 ± √37)/2
- id: c
  en: x = (6 ± √37)/2
- id: d
  en: x = (3 ± √37)/2
answer:
  sympy: d
  accept: []
solution_steps:
- en: The coefficients are 1, -3 and -7.
- en: The discriminant is -3² - 4 x 1 x -7 = 37, which is positive but not a perfect
    square.
- en: So x = (-(-3) ± √37) / 2, and the square root is simplified as far as it will
    go.
- en: x = (3 ± √37)/2.
- en: The correct option is d.
hints:
- level: 1
  en: This one will not factorise nicely, so the formula is the right tool.
- level: 2
  en: Put the numbers into the formula once with the plus sign and once with the minus
    sign. Simplify the square root by pulling out any square factor.
- level: 3
  en: 'Full method: list the coefficients, compute the discriminant, simplify its
    square root, write both roots over twice the leading coefficient, and cancel any
    common factor from every term of the top and the bottom.'
prediction_prompt:
  en: Is the discriminant a perfect square? What does that say about the roots?
