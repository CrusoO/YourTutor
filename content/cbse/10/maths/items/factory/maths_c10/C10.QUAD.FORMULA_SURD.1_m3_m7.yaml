solution_steps:
- en: The coefficients are 1, -3 and -7.
- en: The discriminant is -3² - 4 x 1 x -7 = 37, which is positive but not a perfect
    square.
- en: So x = (-(-3) ± √37) / 2, and the square root is simplified as far as it will
    go.
- en: x = (3 ± √37)/2.
- en: The correct option is d.
