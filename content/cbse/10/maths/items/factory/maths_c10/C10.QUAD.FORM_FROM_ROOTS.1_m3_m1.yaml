solution_steps:
- en: A root r means (x - r) is a factor, so the factors are (x - (-3)) and (x - (-1)).
- en: 'Multiply them: x² - (-4)x + (3).'
- en: 'Multiply by the leading coefficient 1 if it is not 1: x² + 4x + 3 = 0.'
- en: The correct option is d.
