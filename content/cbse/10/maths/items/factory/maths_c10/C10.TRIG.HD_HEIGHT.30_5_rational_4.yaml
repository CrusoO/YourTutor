- MATH.TRIG.HD.HEIGHT_FROM_DISTANCE
difficulty: 0.39
type: mcq
pool: practice
role: apply
stem:
  en: A factory chimney stands on level ground. From a point on the ground 5√3 m from
    the foot, the angle of elevation of the top is 30°. Find the height of the chimney
    in metres.
options:
- id: a
  en: 15/2
- id: b
  en: 5√3/2
- id: c
  en: '5'
- id: d
  en: '15'
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Sketch a right triangle: the chimney is the side opposite the 30° angle and
    the ground distance is the adjacent side.'
- en: 'Opposite and adjacent sides link through tan 30°: height = 5√3 x tan 30°.'
- en: With tan 30° taken from the table, the height is 5 m.
- en: The correct option is c.
hints:
- level: 1
  en: Decide which side is opposite the angle and which is next to it.
- level: 2
  en: The ratio that links the opposite side to the adjacent side is the tangent.
    Write it as one relation and undo the division by doing the same thing to each
    side.
- level: 3
  en: 'Full method: sketch and label the triangle, name the two sides involved, write
    the tangent ratio for the stated angle, replace the tangent by its exact value,
    and solve for the height.'
prediction_prompt:
  en: Is the height larger or smaller than the distance from the foot?
