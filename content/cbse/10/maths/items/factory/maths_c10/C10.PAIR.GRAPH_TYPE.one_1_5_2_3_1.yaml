solution_steps:
- en: 'Compare the ratios of matching numbers: x coefficients, y coefficients, then
    the constants.'
- en: Here the three ratios are 1/3, 5/16 and 2/7.
- en: The first two ratios differ, so the lines meet at exactly one point.
- en: The correct option is b.
