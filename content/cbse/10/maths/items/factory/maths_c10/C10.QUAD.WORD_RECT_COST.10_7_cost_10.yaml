solution_steps:
- en: Let x metres be the breadth. Then the length is x + 10 metres.
- en: The area gives x(x + 10) = 119, so x² + 10x - 119 = 0.
- en: 'Factorise: (x - 7)(x + 17) = 0, so x = 7 or x = -17; a length is positive,
    so the breadth is 7 m and the length is 17 m.'
- en: The perimeter is 2(7 + 17) = 48 m, and the cost is 48 x 10.
- en: The correct option is c.
