solution_steps:
- en: In an AP every term is the previous term plus the same number, the common difference.
- en: 'Subtract a term from the one after it: 3/2 - (1) = 1/2.'
- en: 'Check with another pair: 2 - (3/2) = 1/2. The common difference is 1/2.'
- en: The correct option is c.
