solution_steps:
- en: The first term is 5, the common difference is -5 and the number of terms is
    15.
- en: S_n = (n/2)(2a + (n - 1)d) = (15/2)(2 x 5 + (15 - 1) x -5).
- en: = (15/2)(-60) = -450.
- en: The correct option is d.
