difficulty: 0.41
type: mcq
pool: practice
role: procedure
stem:
  en: Add up the first 15 terms of the progression 5, 0, -5, ...
options:
- id: a
  en: '-900'
- id: b
  en: -975/2
- id: c
  en: '-65'
- id: d
  en: '-450'
answer:
  sympy: d
  accept: []
solution_steps:
- en: The first term is 5, the common difference is -5 and the number of terms is
    15.
- en: S_n = (n/2)(2a + (n - 1)d) = (15/2)(2 x 5 + (15 - 1) x -5).
- en: = (15/2)(-60) = -450.
- en: The correct option is d.
hints:
- level: 1
  en: Pair the first term with the last, the second with the second last, and so on.
- level: 2
  en: Work out twice the first term plus one fewer than n times the difference, then
    multiply by n and halve.
- level: 3
  en: 'Full method: read off the first term and difference, compute twice the first
    term plus (n - 1) times the difference, multiply by n, then divide by 2.'
prediction_prompt:
  en: Roughly how big do you expect the total to be?
