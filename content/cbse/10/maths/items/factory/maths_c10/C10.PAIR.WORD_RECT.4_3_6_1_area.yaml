solution_steps:
- en: Let the length be x metres and the width y metres. The perimeter counts every
    side.
- en: The two facts give 2x + 2y = 44 and x - 3y = 6.
- en: Solving the pair gives x = 18 and y = 4. The area is 18 × 4 = 72 square metres.
- en: The correct option is a.
