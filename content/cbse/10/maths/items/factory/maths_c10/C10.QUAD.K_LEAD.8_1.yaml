id: C10.QUAD.K_LEAD.8_1
skill_ids:
- MATH.ALG.QUAD.FIND_PARAMETER_FOR_ROOTS
difficulty: 0.56
type: mcq
pool: practice
role: apply
stem:
  en: Find the value of k for which kx² + 16x + 8 = 0 has two equal real roots.
options:
- id: a
  en: k = -8
- id: b
  en: k = 32
- id: c
  en: k = 16
- id: d
  en: k = 8
answer:
  sympy: d
  accept: []
solution_steps:
- en: Equal roots need b² - 4ac = 0, so (16)² - 4(k)(8) = 0.
- en: 'This gives 256 - 32k = 0. Add 32k to both sides: 32k = 256.'
- en: 'Divide both sides by 32: k = 8.'
- en: The correct option is d.
hints:
- level: 1
  en: Equal roots mean the discriminant is zero. Put the unknown k into it.
- level: 2
  en: You will get an equation that is linear in k. Undo each operation by doing the
    same thing to both sides.
- level: 3
  en: 'Full method: write the discriminant using k as the leading coefficient, set
    it to zero, collect the k term on one side by adding the same amount to both sides,
    then divide both sides by the number multiplying k.'
prediction_prompt:
  en: Will k have the same sign as the plain number?
