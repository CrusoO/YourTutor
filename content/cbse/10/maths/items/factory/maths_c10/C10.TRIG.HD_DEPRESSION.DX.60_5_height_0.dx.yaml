solution_steps:
- en: The angle of depression is measured downward from the horizontal at the top;
    by alternate angles it equals the angle of elevation of the top seen from a boat.
- en: So in the right triangle the 60° angle is at a boat, and height and ground distance
    are opposite and adjacent to it.
- en: 'Use tan 60° = height / distance and solve: the answer is 5√3 m.'
- en: The correct option is d.
