solution_steps:
- en: Here a = 5, d = 8 and S_n = 150.
- en: '(n/2)(2 x 5 + (n - 1) x 8) = 150. Multiply both sides by 2 and expand: 8n²
    + 2n = 300.'
- en: 'Rearranged: 8n² + (2)n - 300 = 0, whose solutions are n = 6 and n = -25/4.'
- en: The number of terms is a positive whole number, so n = 6.
- en: The correct option is b.
