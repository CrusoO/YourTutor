solution_steps:
- en: Here a = 17, d = 8 and S_n = 222.
- en: '(n/2)(2 x 17 + (n - 1) x 8) = 222. Multiply both sides by 2 and expand: 8n²
    + 26n = 444.'
- en: 'Rearranged: 8n² + (26)n - 444 = 0, whose solutions are n = 6 and n = -37/4.'
- en: The number of terms is a positive whole number, so n = 6.
- en: The correct option is a.
