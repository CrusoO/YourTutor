solution_steps:
- en: 'The nth term is the difference of two sums: a_n = S_n - S_(n-1).'
- en: S_n - S_(n-1) = 4n² + 3n - (4(n - 1)² + 3(n - 1)) = 8n - 1.
- en: 'Put n = 10: a_10 = 79.'
- en: The correct option is c.
