solution_steps:
- en: The first term is -2, the last term is 40 and the difference is 6.
- en: 'Number of terms: n = (40 - -2)/6 + 1 = 8.'
- en: S = (n/2)(first + last) = (8/2)(-2 + 40) = 152.
- en: The correct option is c.
