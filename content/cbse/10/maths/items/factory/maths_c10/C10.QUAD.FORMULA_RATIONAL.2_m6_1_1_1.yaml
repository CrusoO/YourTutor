difficulty: 0.57
type: mcq
pool: practice
role: procedure
stem:
  en: Use the quadratic formula to solve 2x² + 10x - 12 = 0.
options:
- id: a
  en: x = -12 or x = 2
- id: b
  en: x = -1 or x = 6
- id: c
  en: x = -6 or x = 1
- id: d
  en: x = -27/2 or x = -13/2
answer:
  sympy: c
  accept: []
solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 2, of x is 10, plain number
    is -12.'
- en: The discriminant is 10² - 4 x 2 x -12 = 196, and its square root is 14.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 2).
- en: 'Work out both signs: x = -6 or x = 1.'
- en: The correct option is c.
hints:
- level: 1
  en: Every quadratic can be solved with the formula; the work is in the discriminant.
- level: 2
  en: Work out the discriminant first, then its square root. Keep the minus sign of
    the x coefficient when you write the opposite of it.
- level: 3
  en: 'Full method: list the coefficients, compute the discriminant, take its square
    root, put the numbers into the formula once with the plus sign and once with the
    minus sign, divide each by twice the leading coefficient, and check by substitution.'
prediction_prompt:
  en: How many different values of x do you expect?
