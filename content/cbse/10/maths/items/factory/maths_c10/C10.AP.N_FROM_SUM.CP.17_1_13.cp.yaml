solution_steps:
- en: Here a = 17, d = 1 and S_n = 299.
- en: '(n/2)(2 x 17 + (n - 1) x 1) = 299. Multiply both sides by 2 and expand: 1n²
    + 33n = 598.'
- en: 'Rearranged: 1n² + (33)n - 598 = 0, whose solutions are n = 13 and n = -46.'
- en: The number of terms is a positive whole number, so n = 13.
- en: The correct option is b.
