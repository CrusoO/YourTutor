difficulty: 0.46
type: mcq
pool: practice
role: procedure
stem:
  en: Which term of the AP 14, 21, 28, ... is 147?
options:
- id: a
  en: '21'
- id: b
  en: '20'
- id: c
  en: '133'
- id: d
  en: '19'
answer:
  sympy: b
  accept: []
solution_steps:
- en: The first term is 14 and the common difference is 7.
- en: 'Set the nth term equal to 147: 14 + (n - 1)(7) = 147.'
- en: 'Take 14 away from both sides: (n - 1)(7) = 133. Divide both sides by 7: n -
    1 = 19.'
- en: 'Add 1 to both sides: n = 20.'
- en: The correct option is b.
hints:
- level: 1
  en: Write the rule for the nth term and make it equal to the given number.
- level: 2
  en: 'Undo each operation in the rule by doing the same thing to each side: first
    take away the first term, then divide by the difference, then deal with the minus
    one.'
- level: 3
  en: 'Full method: write first term + (n - 1) x difference, set it equal to the target,
    take away the first term from each side, divide each side by the difference, and
    add one to each side.'
prediction_prompt:
  en: Roughly how many steps from the first term will it take to reach this number?
