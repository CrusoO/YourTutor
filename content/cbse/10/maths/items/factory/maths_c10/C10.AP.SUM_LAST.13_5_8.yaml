solution_steps:
- en: The first term is 13, the last term is 48 and the difference is 5.
- en: 'Number of terms: n = (48 - 13)/5 + 1 = 8.'
- en: S = (n/2)(first + last) = (8/2)(13 + 48) = 244.
- en: The correct option is b.
