difficulty: 0.54
type: mcq
pool: practice
role: transfer
stem:
  en: From the top of a cliff 8√3 m high, the angle of depression of a swimmer on
    the water is 60°. Find the horizontal distance of a swimmer from the foot of the
    cliff in metres.
options:
- id: a
  en: '16'
- id: b
  en: '8'
- id: c
  en: '24'
- id: d
  en: '12'
answer:
  sympy: b
  accept: []
solution_steps:
- en: The angle of depression is measured downward from the horizontal at the top;
    by alternate angles it equals the angle of elevation of the top seen from a swimmer.
- en: So in the right triangle the 60° angle is at a swimmer, and height and ground
    distance are opposite and adjacent to it.
- en: 'Use tan 60° = height / distance and solve: the answer is 8 m.'
- en: The correct option is b.
hints:
- level: 1
  en: Alternate angles let you move the angle to the bottom of the triangle.
- level: 2
  en: After placing the angle inside the right triangle, decide which side is opposite
    it and which is adjacent, then use the matching ratio and undo it by doing the
    same thing to each side.
- level: 3
  en: 'Full method: sketch the horizontal line from the top, mark the angle below
    it, copy that angle into the right triangle using alternate angles, pick the ratio
    for the two sides involved, and solve.'
prediction_prompt:
  en: Does the sight line make a steep or a shallow angle with the horizontal?
