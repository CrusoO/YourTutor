solution_steps:
- en: Let x be the smaller number. The other is x + 1.
- en: Their product is 272, so x(x + 1) = 272, which is x² + 1x - 272 = 0.
- en: 'Factorise: (x - 16)(x + 17) = 0, so x = 16 or x = -17.'
- en: The numbers must be positive, so the smaller number is 16.
- en: The correct option is a.
