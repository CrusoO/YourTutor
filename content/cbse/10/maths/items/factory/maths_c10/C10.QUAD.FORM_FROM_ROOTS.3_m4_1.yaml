solution_steps:
- en: A root r means (x - r) is a factor, so the factors are (x - (-4)) and (x - (1)).
- en: 'Multiply them: x² - (-3)x + (-4).'
- en: 'Multiply by the leading coefficient 3 if it is not 1: 3x² + 9x - 12 = 0.'
- en: The correct option is b.
