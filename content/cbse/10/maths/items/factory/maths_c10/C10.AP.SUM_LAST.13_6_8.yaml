difficulty: 0.56
type: mcq
pool: practice
role: apply
stem:
  en: Find the sum of all the terms of the AP 13, 19, 25, ..., 55.
options:
- id: a
  en: '238'
- id: b
  en: '544'
- id: c
  en: '272'
- id: d
  en: '1870'
answer:
  sympy: c
  accept: []
solution_steps:
- en: The first term is 13, the last term is 55 and the difference is 6.
- en: 'Number of terms: n = (55 - 13)/6 + 1 = 8.'
- en: S = (n/2)(first + last) = (8/2)(13 + 55) = 272.
- en: The correct option is c.
hints:
- level: 1
  en: First find out how many terms there are.
- level: 2
  en: The number of terms is the distance from first to last divided by the difference,
    plus one. Then average the first and last terms and multiply by the count.
- level: 3
  en: 'Full method: subtract the first term from the last, divide by the difference,
    add one to get n, then multiply n by half of (first + last).'
prediction_prompt:
  en: Is the number of terms more or less than ten?
