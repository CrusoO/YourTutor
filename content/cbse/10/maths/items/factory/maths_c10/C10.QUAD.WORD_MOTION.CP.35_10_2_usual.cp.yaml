solution_steps:
- en: Let x km/h be the usual speed. The time taken is 315/x hours, and at the higher
    speed it is 315/(x + 10) hours.
- en: 'The saving is 2: 315/x - 315/(x + 10) = 2. Multiply every term by x(x + 10)
    to clear the fractions.'
- en: This gives 2x² + 20x - 3150 = 0, which factorises as (x - 35)(x + 45) = 0 after
    dividing by 2.
- en: A speed is positive, so the usual speed is 35 km/h and the faster speed is 45
    km/h.
- en: The correct option is b.
