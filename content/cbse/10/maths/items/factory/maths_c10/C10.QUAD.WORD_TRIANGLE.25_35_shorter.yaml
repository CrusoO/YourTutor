solution_steps:
- en: Let x metres be the shorter side. The other side is x + 35 metres.
- en: By Pythagoras, x² + (x + 35)² = 65², so 2x² + 70x - 3000 = 0.
- en: 'Divide both sides by 2 and factorise: (x - 25)(x + 60) = 0, so x = 25 (a length
    cannot be negative).'
- en: The shorter side is 25 m and the longer side is 60 m.
- en: The correct option is d.
