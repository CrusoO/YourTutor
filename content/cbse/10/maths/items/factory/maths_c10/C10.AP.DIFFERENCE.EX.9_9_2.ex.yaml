solution_steps:
- en: In an AP every term is the previous term plus the same number, the common difference.
- en: 'Subtract a term from the one after it: 9 - (9/2) = 9/2.'
- en: 'Check with another pair: 27/2 - (9) = 9/2. The common difference is 9/2.'
- en: The correct option is c.
