solution_steps:
- en: 'The nth term is the difference of two sums: a_n = S_n - S_(n-1).'
- en: S_n - S_(n-1) = 2n² - (2(n - 1)² + 0(n - 1)) = 4n - 2.
- en: 'Put n = 12: a_12 = 46.'
- en: The correct option is b.
