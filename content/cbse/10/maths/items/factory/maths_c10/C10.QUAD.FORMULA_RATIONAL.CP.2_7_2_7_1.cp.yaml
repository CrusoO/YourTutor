solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 4, of x is -42, plain number
    is 98.'
- en: The discriminant is -42² - 4 x 4 x 98 = 196, and its square root is 14.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 4).
- en: 'Work out both signs: x = 7/2 or x = 7.'
- en: The correct option is a.
