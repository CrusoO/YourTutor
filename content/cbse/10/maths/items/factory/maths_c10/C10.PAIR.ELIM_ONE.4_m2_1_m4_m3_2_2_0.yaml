stem:
  en: Find x and y by elimination from 4x - 4y = -24 and 2x - 3y = -16.
hints:
- level: 1
  en: The aim is to get one equation with only one unknown left.
- level: 2
  en: Add the equations when the matching terms have opposite signs and subtract them
    when the signs agree. Apply the operation to every term, constants included.
- level: 3
  en: 'Full method: multiply the equation with the smaller coefficient by the right
    number, using every term, so the coefficients of one unknown match, add or subtract
    to cancel it, solve, then find the other unknown.'
prediction_prompt:
  en: Which unknown will you cancel first?
