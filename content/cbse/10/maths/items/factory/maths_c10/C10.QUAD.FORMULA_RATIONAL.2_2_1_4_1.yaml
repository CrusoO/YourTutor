solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 2, of x is -12, plain number
    is 16.'
- en: The discriminant is -12² - 4 x 2 x 16 = 16, and its square root is 4.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 2).
- en: 'Work out both signs: x = 2 or x = 4.'
- en: The correct option is a.
