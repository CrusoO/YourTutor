solution_steps:
- en: Let x be the smaller number. The other is x + 1.
- en: Their product is 650, so x(x + 1) = 650, which is x² + 1x - 650 = 0.
- en: 'Factorise: (x - 25)(x + 26) = 0, so x = 25 or x = -26.'
- en: The numbers must be positive, so the smaller number is 25.
- en: The correct option is a.
