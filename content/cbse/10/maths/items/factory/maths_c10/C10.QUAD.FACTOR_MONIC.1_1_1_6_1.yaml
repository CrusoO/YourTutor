solution_steps:
- en: 'Look for two numbers with product 6 and sum -7: they are -1 and -6.'
- en: 'Factorise: (x - 1)(x - 6) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: x - 1 = 0 gives x
    = 1 and x - 6 = 0 gives x = 6.'
- en: The correct option is a.
