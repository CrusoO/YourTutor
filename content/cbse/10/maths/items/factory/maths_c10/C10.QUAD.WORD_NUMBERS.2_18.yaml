stem:
  en: The product of two consecutive positive even integers is 360. Find the smaller
    one.
options:
- id: a
  en: '18'
- id: b
  en: '20'
- id: c
  en: '16'
- id: d
  en: '-20'
answer:
  sympy: a
  accept: []
solution_steps:
- en: Let x be the smaller number. The other is x + 2.
- en: Their product is 360, so x(x + 2) = 360, which is x² + 2x - 360 = 0.
- en: 'Factorise: (x - 18)(x + 20) = 0, so x = 18 or x = -20.'
- en: The numbers must be positive, so the smaller number is 18.
- en: The correct option is a.
hints:
- level: 1
  en: Let x stand for the smaller number, then express the larger one with x.
- level: 2
  en: Write the product as one relation in x, bring every term to one side, then factorise
    or use the formula. Check which solution fits the words of the question.
- level: 3
  en: 'Full method: name the smaller number, write the larger one, form the product
    relation, rearrange so the right side is zero, solve, and reject any solution
    that is not positive.'
prediction_prompt:
  en: Roughly how big do you expect the smaller number to be?
