stem:
  en: For the progression 1, -2, -5, ..., how many terms from the start give a total
    of -39? A classmate says the answer is -13/3. Work it out yourself and choose
    the correct answer.
hints:
- level: 1
  en: This leads to quadratic working in n.
- level: 2
  en: Multiply each side by 2 to clear the fraction, expand the bracket, and bring
    everything to one side so the other side is zero. Then solve for n.
- level: 3
  en: 'Full method: put the numbers into the sum formula, multiply each side by 2,
    expand, rearrange to zero, solve for n, and keep only the positive whole number.'
prediction_prompt:
  en: Is n more likely to be small or large?
