solution_steps:
- en: Here a = 1, d = -3 and S_n = -39.
- en: '(n/2)(2 x 1 + (n - 1) x -3) = -39. Multiply both sides by 2 and expand: -3n²
    + 5n = -78.'
- en: 'Rearranged: -3n² + (5)n - -78 = 0, whose solutions are n = 6 and n = -13/3.'
- en: The number of terms is a positive whole number, so n = 6.
- en: The correct option is c.
