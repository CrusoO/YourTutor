solution_steps:
- en: 'Put y = x - 1 into the second equation: x + 2(x - 1) = 10.'
- en: 'Multiply out and collect the x terms: 3x = 12, so x = 4.'
- en: 'Put x = 4 back into the first equation: y = 1 × 4 + (-1) = 3.'
