solution_steps:
- en: Going from term 3 to term 5 takes 2 equal steps, and the terms change by -8.
- en: So the common difference is -8 / 2 = -4.
- en: 'Go back to the first term: a = -5 - (3 - 1)(-4) = 3.'
- en: Then a_14 = 3 + (14 - 1)(-4) = -49.
- en: The correct option is c.
