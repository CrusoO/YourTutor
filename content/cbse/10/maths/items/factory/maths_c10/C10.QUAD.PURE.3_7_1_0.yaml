stem:
  en: Find every real solution of 3x² = 147.
options:
- id: a
  en: x = -7 or x = 7
- id: b
  en: x = -49 or x = 49
- id: c
  en: x = 7
- id: d
  en: x = -21 or x = 21
answer:
  sympy: a
  accept: []
solution_steps:
- en: 'Add 147 to both sides and divide both sides by 3: x² = 49.'
- en: 'Take the square root of both sides, remembering both signs: x = -7 or x = 7.'
- en: The correct option is a.
hints:
- level: 1
  en: Get the squared term on its own by undoing the other operations.
- level: 2
  en: Undo the addition or subtraction by doing the same thing to both sides, then
    undo the multiplication by dividing both sides by the same number.
- level: 3
  en: 'Full method: take the plain number off one side by adding or subtracting it
    on both sides, divide both sides by the coefficient of the squared term, then
    take the square root of both sides if the result is positive, keeping both signs.'
prediction_prompt:
  en: Will this equation have two answers, one answer or none?
