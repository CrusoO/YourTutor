solution_steps:
- en: Let x be the smaller number. The other is x + 1.
- en: Their product is 210, so x(x + 1) = 210, which is x² + 1x - 210 = 0.
- en: 'Factorise: (x - 14)(x + 15) = 0, so x = 14 or x = -15.'
- en: The numbers must be positive, so the smaller number is 14.
- en: The correct option is b.
