solution_steps:
- en: Going from term 3 to term 4 takes 1 equal steps, and the terms change by -4.
- en: So the common difference is -4 / 1 = -4.
- en: 'Go back to the first term: a = 1 - (3 - 1)(-4) = 9.'
- en: Then a_14 = 9 + (14 - 1)(-4) = -43.
- en: The correct option is c.
