stem:
  en: 'Two terms of an AP are known: term 3 is 1 and term 4 is -3. Work out term 14.'
hints:
- level: 1
  en: Use the two given terms to find the first term and the difference before anything
    else.
- level: 2
  en: Share the total change between the two terms equally over the number of steps
    between them, then work back to the first term.
- level: 3
  en: 'Full method: divide the change in value by the change in position to get the
    difference, use one given term to find the first term, then apply the rule for
    the term you are asked for.'
