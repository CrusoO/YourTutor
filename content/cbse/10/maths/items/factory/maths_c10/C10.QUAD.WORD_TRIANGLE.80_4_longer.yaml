solution_steps:
- en: Let x metres be the shorter side. The other side is x + 4 metres.
- en: By Pythagoras, x² + (x + 4)² = 116², so 2x² + 8x - 13440 = 0.
- en: 'Divide both sides by 2 and factorise: (x - 80)(x + 84) = 0, so x = 80 (a length
    cannot be negative).'
- en: The shorter side is 80 m and the longer side is 84 m.
- en: The correct option is b.
