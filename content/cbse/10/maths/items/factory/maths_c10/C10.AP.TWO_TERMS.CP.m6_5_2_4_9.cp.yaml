solution_steps:
- en: Going from term 2 to term 6 takes 4 equal steps, and the terms change by 20.
- en: So the common difference is 20 / 4 = 5.
- en: 'Go back to the first term: a = -1 - (2 - 1)(5) = -6.'
- en: Then a_9 = -6 + (9 - 1)(5) = 34.
- en: The correct option is a.
