difficulty: 0.41
type: mcq
pool: practice
role: procedure
stem:
  en: What is the total when the first 10 terms of 2, -1, -4, ... are added?
options:
- id: a
  en: '-230'
- id: b
  en: '-130'
- id: c
  en: '-115'
- id: d
  en: '-125'
answer:
  sympy: c
  accept: []
solution_steps:
- en: The first term is 2, the common difference is -3 and the number of terms is
    10.
- en: S_n = (n/2)(2a + (n - 1)d) = (10/2)(2 x 2 + (10 - 1) x -3).
- en: = (10/2)(-23) = -115.
- en: The correct option is c.
hints:
- level: 1
  en: There is one formula for the sum of the first n terms of an AP.
- level: 2
  en: Work out twice the first term plus one fewer than n times the difference, then
    multiply by n and halve.
- level: 3
  en: 'Full method: read off the first term and difference, compute twice the first
    term plus (n - 1) times the difference, multiply by n, then divide by 2.'
prediction_prompt:
  en: Roughly how big do you expect the total to be?
