difficulty: 0.77
type: mcq
pool: practice
role: transfer
stem:
  en: A school garden is rectangular. Its length is 2 m more than its breadth and
    it covers 575 m². The garden is to be fenced all the way round and the fencing
    costs 25 rupees per metre. Find the total cost of the fencing in rupees.
options:
- id: a
  en: '2400'
- id: b
  en: '1200'
- id: c
  en: '2600'
- id: d
  en: '14375'
answer:
  sympy: a
  accept: []
solution_steps:
- en: Let x metres be the breadth. Then the length is x + 2 metres.
- en: The area gives x(x + 2) = 575, so x² + 2x - 575 = 0.
- en: 'Factorise: (x - 23)(x + 25) = 0, so x = 23 or x = -25; a length is positive,
    so the breadth is 23 m and the length is 25 m.'
- en: The perimeter is 2(23 + 25) = 96 m, and the cost is 96 x 25.
- en: The correct option is a.
hints:
- level: 1
  en: Let x be the breadth and write the length using x, then use the area.
- level: 2
  en: Write the area as one relation in x, rearrange so the right side is zero, and
    solve it. Discard any solution that makes the length negative. Undo each step
    by doing the same thing to each side.
- level: 3
  en: 'Full method: name the breadth, write the length, form the area relation, rearrange
    to zero, factorise, keep the positive solution, then answer exactly what is asked
    (breadth, length or cost).'
prediction_prompt:
  en: About how long do you think the shorter side is?
