stem:
  en: Reduce the pair 3/x - 1/y = -1/2, 1/x + 2/y = -4/3 to a pair of linear equations
    and solve it for x and y.
hints:
- level: 1
  en: Rewrite the pair so that it has no unknowns in the denominators.
- level: 2
  en: Solve the new linear pair, then remember that the new letters are reciprocals,
    so finish by turning them back.
- level: 3
  en: 'Full method: put u for one over x and v for one over y, solve the linear pair
    in u and v, then take reciprocals to get x and y and check in the original relations.'
prediction_prompt:
  en: What new letters could make both relations linear?
