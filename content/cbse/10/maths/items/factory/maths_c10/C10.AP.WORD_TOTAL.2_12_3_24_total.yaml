stem:
  en: A library puts books on display. On day 1 it shows 12 books and each day it
    shows 3 more than the day before, for 24 days. How many books are shown over all
    the days together?
options:
- id: a
  en: '1116'
- id: b
  en: '1152'
- id: c
  en: '2232'
- id: d
  en: '81'
answer:
  sympy: a
  accept: []
solution_steps:
- en: The amounts form an AP with first term 12 and common difference 3.
- en: The last amount is 81, so the total is S = (24/2)(12 + 81).
- en: S = 1116.
- en: The correct option is a.
hints:
- level: 1
  en: 'Let the amounts in order be the terms of an AP: name its first term and its
    common difference.'
- level: 2
  en: Decide whether the question asks for one term or for the sum of all the terms,
    then choose the matching rule. Work through it one operation after another.
- level: 3
  en: 'Full method: identify the first term, the common difference and the number
    of rows or days, pick the rule for one term or for the sum, substitute carefully,
    and give the answer with its unit.'
prediction_prompt:
  en: Is the pattern growing or shrinking from one step to the next?
