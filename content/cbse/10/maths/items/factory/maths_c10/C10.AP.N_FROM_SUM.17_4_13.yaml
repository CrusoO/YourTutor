solution_steps:
- en: Here a = 17, d = 4 and S_n = 533.
- en: '(n/2)(2 x 17 + (n - 1) x 4) = 533. Multiply both sides by 2 and expand: 4n²
    + 30n = 1066.'
- en: 'Rearranged: 4n² + (30)n - 1066 = 0, whose solutions are n = 13 and n = -41/2.'
- en: The number of terms is a positive whole number, so n = 13.
- en: The correct option is c.
