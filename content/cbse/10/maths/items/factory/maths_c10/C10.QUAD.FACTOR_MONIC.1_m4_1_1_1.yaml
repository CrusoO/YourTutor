solution_steps:
- en: 'Look for two numbers with product -4 and sum 3: they are 4 and -1.'
- en: 'Factorise: (x + 4)(x - 1) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: x + 4 = 0 gives x
    = -4 and x - 1 = 0 gives x = 1.'
- en: The correct option is b.
