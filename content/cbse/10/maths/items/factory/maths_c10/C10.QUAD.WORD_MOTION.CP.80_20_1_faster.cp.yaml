stem:
  en: A bus travels 400 km along a fixed route at a steady speed. If it travelled
    20 km/h faster, the journey would take 1 hour less. Find the speed of the bus
    on the faster run in km/h.
hints:
- level: 1
  en: Let x be the usual speed, then express the two journey times in terms of x.
- level: 2
  en: Subtract the two times and set the difference equal to the time saved. Multiply
    every term by the same expression to clear the fractions, then solve. Do the same
    thing to each side at every step.
- level: 3
  en: 'Full method: name the usual speed, write the two times, form the difference
    relation, clear the fractions by multiplying every term, rearrange to zero, solve,
    reject the negative speed, then answer the speed that was asked for.'
prediction_prompt:
  en: Will the usual speed be more or less than the increase in speed?
