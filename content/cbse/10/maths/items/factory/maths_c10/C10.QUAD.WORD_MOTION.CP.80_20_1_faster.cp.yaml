solution_steps:
- en: Let x km/h be the usual speed. The time taken is 400/x hours, and at the higher
    speed it is 400/(x + 20) hours.
- en: 'The saving is 1: 400/x - 400/(x + 20) = 1. Multiply every term by x(x + 20)
    to clear the fractions.'
- en: This gives 1x² + 20x - 8000 = 0, which factorises as (x - 80)(x + 100) = 0 after
    dividing by 1.
- en: A speed is positive, so the usual speed is 80 km/h and the faster speed is 100
    km/h.
- en: The correct option is b.
