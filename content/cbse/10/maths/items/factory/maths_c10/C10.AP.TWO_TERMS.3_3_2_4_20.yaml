solution_steps:
- en: Going from term 2 to term 6 takes 4 equal steps, and the terms change by 12.
- en: So the common difference is 12 / 4 = 3.
- en: 'Go back to the first term: a = 6 - (2 - 1)(3) = 3.'
- en: Then a_20 = 3 + (20 - 1)(3) = 60.
- en: The correct option is c.
