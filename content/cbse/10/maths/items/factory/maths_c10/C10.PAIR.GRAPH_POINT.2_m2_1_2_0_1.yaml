solution_steps:
- en: 'Line A: y changes by 1 each time x goes up by 1, so y = x - 4.'
- en: 'Line B: y changes by 2 each time x goes up by 1, so y = 2x - 6.'
- en: 'At the meeting point both rules give the same y: 1x + (-4) = 2x + (-6), so
    x = 2.'
- en: Then y = 1 × 2 + (-4) = -2. The lines meet at (2, -2).
- en: The correct option is a.
