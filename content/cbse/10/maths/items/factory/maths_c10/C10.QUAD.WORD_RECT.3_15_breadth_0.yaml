solution_steps:
- en: Let x metres be the breadth. Then the length is x + 3 metres.
- en: The area gives x(x + 3) = 270, so x² + 3x - 270 = 0.
- en: 'Factorise: (x - 15)(x + 18) = 0, so x = 15 or x = -18; a length is positive,
    so the breadth is 15 m and the length is 18 m.'
- en: The correct option is d.
