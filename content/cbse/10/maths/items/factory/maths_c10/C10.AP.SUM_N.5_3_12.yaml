solution_steps:
- en: The first term is 5, the common difference is 3 and the number of terms is 12.
- en: S_n = (n/2)(2a + (n - 1)d) = (12/2)(2 x 5 + (12 - 1) x 3).
- en: = (12/2)(43) = 258.
- en: The correct option is a.
