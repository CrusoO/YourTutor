stem:
  en: Add up the first 12 terms of the progression 5, 8, 11, ...
options:
- id: a
  en: '258'
- id: b
  en: '276'
- id: c
  en: '516'
- id: d
  en: '228'
answer:
  sympy: a
  accept: []
solution_steps:
- en: The first term is 5, the common difference is 3 and the number of terms is 12.
- en: S_n = (n/2)(2a + (n - 1)d) = (12/2)(2 x 5 + (12 - 1) x 3).
- en: = (12/2)(43) = 258.
- en: The correct option is a.
hints:
- level: 1
  en: Pair the first term with the last, the second with the second last, and so on.
- level: 2
  en: Work out twice the first term plus one fewer than n times the difference, then
    multiply by n and halve.
- level: 3
  en: 'Full method: read off the first term and difference, compute twice the first
    term plus (n - 1) times the difference, multiply by n, then divide by 2.'
prediction_prompt:
  en: Roughly how big do you expect the total to be?
