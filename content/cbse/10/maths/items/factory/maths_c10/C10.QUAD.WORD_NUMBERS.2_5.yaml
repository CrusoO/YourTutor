solution_steps:
- en: Let x be the smaller number. The other is x + 2.
- en: Their product is 35, so x(x + 2) = 35, which is x² + 2x - 35 = 0.
- en: 'Factorise: (x - 5)(x + 7) = 0, so x = 5 or x = -7.'
- en: The numbers must be positive, so the smaller number is 5.
- en: The correct option is d.
