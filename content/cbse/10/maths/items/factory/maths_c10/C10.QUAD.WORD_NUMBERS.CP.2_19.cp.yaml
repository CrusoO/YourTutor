solution_steps:
- en: Let x be the smaller number. The other is x + 2.
- en: Their product is 399, so x(x + 2) = 399, which is x² + 2x - 399 = 0.
- en: 'Factorise: (x - 19)(x + 21) = 0, so x = 19 or x = -21.'
- en: The numbers must be positive, so the smaller number is 19.
- en: The correct option is a.
