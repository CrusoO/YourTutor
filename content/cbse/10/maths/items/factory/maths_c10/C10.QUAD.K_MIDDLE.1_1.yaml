difficulty: 0.59
pool: practice
role: apply
stem:
  en: Find the values of k for which the equation x² + kx + 1 = 0 has two equal real
    roots.
hints:
- level: 1
  en: Equal roots happen when the discriminant is exactly zero.
- level: 2
  en: After writing the discriminant, undo the subtraction by adding the same number
    to both sides, then undo the square by taking the square root of both sides.
- level: 3
  en: 'Full method: write the discriminant with k in it, set it to zero, add the same
    number to both sides, take the square root of both sides, and remember both signs.'
prediction_prompt:
  en: Should k be allowed to be negative as well as positive?
