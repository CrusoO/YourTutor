solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 1, of x is -9, plain number
    is 18.'
- en: The discriminant is -9² - 4 x 1 x 18 = 9, and its square root is 3.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 1).
- en: 'Work out both signs: x = 3 or x = 6.'
- en: The correct option is d.
