difficulty: 0.57
type: mcq
pool: practice
role: procedure
stem:
  en: Use the quadratic formula to solve x² - 9x + 18 = 0.
options:
- id: a
  en: x = 15/2 or x = 21/2
- id: b
  en: x = -6 or x = -3
- id: c
  en: x = 6 or x = 12
- id: d
  en: x = 3 or x = 6
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 1, of x is -9, plain number
    is 18.'
- en: The discriminant is -9² - 4 x 1 x 18 = 9, and its square root is 3.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 1).
- en: 'Work out both signs: x = 3 or x = 6.'
- en: The correct option is d.
hints:
- level: 1
  en: Every quadratic can be solved with the formula; the work is in the discriminant.
- level: 2
  en: Work out the discriminant first, then its square root. Keep the minus sign of
    the x coefficient when you write the opposite of it.
- level: 3
  en: 'Full method: list the coefficients, compute the discriminant, take its square
    root, put the numbers into the formula once with the plus sign and once with the
    minus sign, divide each by twice the leading coefficient, and check by substitution.'
prediction_prompt:
  en: How many different values of x do you expect?
