stem:
  en: A car on a straight road is 8√3 m from the foot of a tower. From the top of
    the tower the angle of depression of a car is 30°. Find the height of the tower
    in metres.
options:
- id: a
  en: '16'
- id: b
  en: '8'
- id: c
  en: 4√3
- id: d
  en: '24'
answer:
  sympy: b
  accept: []
solution_steps:
- en: The angle of depression is measured downward from the horizontal at the top;
    by alternate angles it equals the angle of elevation of the top seen from a car.
- en: So in the right triangle the 30° angle is at a car, and height and ground distance
    are opposite and adjacent to it.
- en: 'Use tan 30° = height / distance and solve: the answer is 8 m.'
- en: The correct option is b.
hints:
- level: 1
  en: Draw the horizontal line at the top and measure the angle downward from it.
- level: 2
  en: After placing the angle inside the right triangle, decide which side is opposite
    it and which is adjacent, then use the matching ratio and undo it by doing the
    same thing to each side.
- level: 3
  en: 'Full method: sketch the horizontal line from the top, mark the angle below
    it, copy that angle into the right triangle using alternate angles, pick the ratio
    for the two sides involved, and solve.'
prediction_prompt:
  en: Does the sight line make a steep or a shallow angle with the horizontal?
