solution_steps:
- en: 'Equal roots need the discriminant to be zero: k² - 4(3)(75) = 0.'
- en: So k² = 900.
- en: 'Take the square root of both sides, keeping both signs: k = -30 or k = 30.'
- en: The correct option is c.
