solution_steps:
- en: 'Put y = -2x + 5 into the second equation: x + 2(-2x + 5) = 4.'
- en: 'Multiply out and collect the x terms: -3x = -6, so x = 2.'
- en: 'Put x = 2 back into the first equation: y = -2 × 2 + (5) = 1.'
- en: So x + y = 2 + (1) = 3.
- en: The correct option is d.
