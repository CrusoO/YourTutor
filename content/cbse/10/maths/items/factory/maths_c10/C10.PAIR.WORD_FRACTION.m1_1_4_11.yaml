solution_steps:
- en: Let the fraction be x/y. Then x + y = 15.
- en: After the change the fraction is (x + 1)/(y + -1) = 1/2, so 2x - y = -3.
- en: Solving the pair gives x = 4 and y = 11, so the fraction is 4/11.
- en: The correct option is d.
