solution_steps:
- en: The first multiple of 7 in the range is 7 and the last is 56.
- en: 'They form an AP with common difference 7. Number of terms: (56 - 7)/7 + 1 =
    8.'
- en: S = (8/2)(7 + 56) = 252.
- en: The correct option is a.
