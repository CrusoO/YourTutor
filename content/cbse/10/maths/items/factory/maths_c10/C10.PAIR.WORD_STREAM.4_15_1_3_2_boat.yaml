solution_steps:
- en: Let the still-water speed be x km/h and the stream speed y km/h. Upstream the
    speed is x - y, downstream it is x + y.
- en: Distance = speed × time gives 3x - 3y = 33 and x + y = 19.
- en: 'Dividing out the hours: x - y = 11 and x + y = 19, so x = 15 and y = 4.'
- en: The correct option is d.
