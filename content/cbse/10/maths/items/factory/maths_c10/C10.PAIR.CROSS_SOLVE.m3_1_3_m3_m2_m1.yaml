solution_steps:
- en: 'Read off the numbers: a1 = 3, b1 = -3, c1 = 12, a2 = -2, b2 = -1, c2 = -5.'
- en: 'Use x/(b1c2 - b2c1) = y/(c1a2 - c2a1) = 1/(a1b2 - a2b1): x/(27) = y/(-9) =
    1/(-9).'
- en: So x = 27/-9 = -3 and y = -9/-9 = 1.
- en: The correct option is c.
