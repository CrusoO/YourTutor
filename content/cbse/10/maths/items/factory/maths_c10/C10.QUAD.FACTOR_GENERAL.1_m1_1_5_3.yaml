solution_steps:
- en: Split the middle term -2x into -5x and 3x, because -5 and 3 multiply to -15
    (the product of 3 and -5) and add to -2.
- en: 'Factorise: (x + 1)(3x - 5) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: x + 1 = 0 gives x
    = -1 and 3x - 5 = 0 gives x = 5/3.'
- en: The correct option is c.
