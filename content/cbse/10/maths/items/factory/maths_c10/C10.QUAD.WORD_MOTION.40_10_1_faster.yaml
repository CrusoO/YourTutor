difficulty: 0.86
type: mcq
pool: practice
role: transfer
stem:
  en: A bus travels 200 km along a fixed route at a steady speed. If it travelled
    10 km/h faster, the journey would take 1 hour less. Find the speed of the bus
    on the faster run in km/h.
options:
- id: a
  en: '40'
- id: b
  en: '50'
- id: c
  en: '-50'
- id: d
  en: '30'
answer:
  sympy: b
  accept: []
solution_steps:
- en: Let x km/h be the usual speed. The time taken is 200/x hours, and at the higher
    speed it is 200/(x + 10) hours.
- en: 'The saving is 1: 200/x - 200/(x + 10) = 1. Multiply every term by x(x + 10)
    to clear the fractions.'
- en: This gives 1x² + 10x - 2000 = 0, which factorises as (x - 40)(x + 50) = 0 after
    dividing by 1.
- en: A speed is positive, so the usual speed is 40 km/h and the faster speed is 50
    km/h.
- en: The correct option is b.
hints:
- level: 1
  en: Let x be the usual speed. Time equals distance divided by speed, so write both
    journey times using x.
- level: 2
  en: Subtract the two times and set the difference equal to the time saved. Multiply
    every term by the same expression to clear the fractions, then solve. Do the same
    thing to each side at every step.
- level: 3
  en: 'Full method: name the usual speed, write the two times, form the difference
    relation, clear the fractions by multiplying every term, rearrange to zero, solve,
    reject the negative speed, then answer the speed that was asked for.'
prediction_prompt:
  en: Will the usual speed be more or less than the increase in speed?
