solution_steps:
- en: Let x be the smaller number. The other is x + 2.
- en: Their product is 80, so x(x + 2) = 80, which is x² + 2x - 80 = 0.
- en: 'Factorise: (x - 8)(x + 10) = 0, so x = 8 or x = -10.'
- en: The numbers must be positive, so the smaller number is 8.
- en: The correct option is b.
