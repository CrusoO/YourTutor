solution_steps:
- en: Let x km/h be the usual speed. The time taken is 80/x hours, and at the higher
    speed it is 80/(x + 20) hours.
- en: 'The saving is 2: 80/x - 80/(x + 20) = 2. Multiply every term by x(x + 20) to
    clear the fractions.'
- en: This gives 2x² + 40x - 1600 = 0, which factorises as (x - 20)(x + 40) = 0 after
    dividing by 2.
- en: A speed is positive, so the usual speed is 20 km/h and the faster speed is 40
    km/h.
- en: The correct option is d.
