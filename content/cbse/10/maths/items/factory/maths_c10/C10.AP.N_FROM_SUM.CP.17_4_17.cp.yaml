solution_steps:
- en: Here a = 17, d = 4 and S_n = 833.
- en: '(n/2)(2 x 17 + (n - 1) x 4) = 833. Multiply both sides by 2 and expand: 4n²
    + 30n = 1666.'
- en: 'Rearranged: 4n² + (30)n - 1666 = 0, whose solutions are n = 17 and n = -49/2.'
- en: The number of terms is a positive whole number, so n = 17.
- en: The correct option is b.
