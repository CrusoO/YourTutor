solution_steps:
- en: Let x km/h be the usual speed. The time taken is 60/x hours, and at the higher
    speed it is 60/(x + 10) hours.
- en: 'The saving is 1: 60/x - 60/(x + 10) = 1. Multiply every term by x(x + 10) to
    clear the fractions.'
- en: This gives 1x² + 10x - 600 = 0, which factorises as (x - 20)(x + 30) = 0 after
    dividing by 1.
- en: A speed is positive, so the usual speed is 20 km/h and the faster speed is 30
    km/h.
- en: The correct option is a.
