stem:
  en: A ladder leans against a vertical wall and makes an angle of 60° with the level
    ground. Its foot is 5 m from the wall. Find the length of the ladder in metres.
hints:
- level: 1
  en: The ladder is always the longest side of the triangle.
- level: 2
  en: The ladder is the unknown and it is the hypotenuse. Undo the multiplication
    by doing the same thing to each side, dividing by the ratio.
- level: 3
  en: 'Full method: sketch and label the triangle, identify which two sides are involved,
    pick sine or cosine for them, replace the ratio by its exact value, and solve.'
prediction_prompt:
  en: Will the ladder be longer than the given side?
