difficulty: 0.48
type: mcq
pool: practice
role: procedure
stem:
  en: In triangle PQR the angle at Q is a right angle, PQ = 33 cm and QR = 180 cm.
    Find the value of sin P.
options:
- id: a
  en: 60/11
- id: b
  en: 60/61
- id: c
  en: 11/61
- id: d
  en: 61/60
answer:
  sympy: b
  accept: []
solution_steps:
- en: 'Name the sides from angle P: the side opposite it, the side next to it (adjacent),
    and the hypotenuse.'
- en: By Pythagoras the hypotenuse PR = square root of (33² + 180²) = 183.
- en: Opposite = 180, adjacent = 33, hypotenuse = 183.
- en: sin P = opposite / hypotenuse = 60/61.
- en: The correct option is b.
hints:
- level: 1
  en: Label the three sides relative to the angle asked about, not to the triangle.
- level: 2
  en: Only two sides are given, so use the relation between the three sides of this
    triangle to find the third before forming the ratio.
- level: 3
  en: 'Full method: label opposite, adjacent and hypotenuse for the stated angle,
    find the missing side with the rule for right triangles, write the ratio as a
    fraction and simplify it.'
prediction_prompt:
  en: Is this ratio bigger or smaller than 1?
