solution_steps:
- en: Half of the x coefficient -12 is -6, so the square is (x - 6)².
- en: (x - 6)² = x² + -12x + 36, so add 36 to both sides and subtract 6 from both
    sides.
- en: This gives (x - 6)² = 30. So p = -6 and q = 30.
- en: The correct option is a.
