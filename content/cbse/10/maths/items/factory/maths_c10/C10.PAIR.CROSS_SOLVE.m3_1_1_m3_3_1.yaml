solution_steps:
- en: 'Read off the numbers: a1 = 1, b1 = -3, c1 = 6, a2 = 3, b2 = 1, c2 = 8.'
- en: 'Use x/(b1c2 - b2c1) = y/(c1a2 - c2a1) = 1/(a1b2 - a2b1): x/(-30) = y/(10) =
    1/(10).'
- en: So x = -30/10 = -3 and y = 10/10 = 1.
- en: The correct option is d.
