- id: MC.QUAD.FACTOR_SIGN_READ
  when_answer_equals:
  - d
solution_steps:
- en: Split the middle term -20x into -15x and -5x, because -15 and -5 multiply to
    75 (the product of 3 and 25) and add to -20.
- en: 'Factorise: (3x - 5)(x - 5) = 0.'
- en: A product is zero only when one factor is zero, so set each bracket equal to
    zero.
- en: 'Undo each bracket by doing the same thing to both sides: 3x - 5 = 0 gives x
    = 5/3 and x - 5 = 0 gives x = 5.'
- en: The correct option is a.
