  en: x = 5/3 or x = 5
- id: b
  en: x = 5 or x = 5
- id: c
  en: x = -5 or x = 5/3
- id: d
  en: x = -5 or x = -5/3
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.QUAD.BRACKET_COEFF_IGNORED
  when_answer_equals:
  - b
- id: MC.QUAD.FACTOR_ONE_SIGN
  when_answer_equals:
