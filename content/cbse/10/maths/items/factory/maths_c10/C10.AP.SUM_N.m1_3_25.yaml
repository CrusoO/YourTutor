difficulty: 0.41
type: mcq
pool: practice
role: procedure
stem:
  en: What is the total when the first 25 terms of -1, 2, 5, ... are added?
options:
- id: a
  en: '875'
- id: b
  en: 1775/2
- id: c
  en: '1750'
- id: d
  en: 1825/2
answer:
  sympy: a
  accept: []
solution_steps:
- en: The first term is -1, the common difference is 3 and the number of terms is
    25.
- en: S_n = (n/2)(2a + (n - 1)d) = (25/2)(2 x -1 + (25 - 1) x 3).
- en: = (25/2)(70) = 875.
- en: The correct option is a.
hints:
- level: 1
  en: There is one formula for the sum of the first n terms of an AP.
- level: 2
  en: Work out twice the first term plus one fewer than n times the difference, then
    multiply by n and halve.
- level: 3
  en: 'Full method: read off the first term and difference, compute twice the first
    term plus (n - 1) times the difference, multiply by n, then divide by 2.'
prediction_prompt:
  en: Roughly how big do you expect the total to be?
