difficulty: 0.77
type: mcq
pool: practice
role: transfer
stem:
  en: A school garden is rectangular. Its length is 10 m more than its breadth and
    it covers 96 m². The garden is to be fenced all the way round and the fencing
    costs 25 rupees per metre. Find the total cost of the fencing in rupees.
options:
- id: a
  en: '2400'
- id: b
  en: '1100'
- id: c
  en: '2100'
- id: d
  en: '550'
answer:
  sympy: b
  accept: []
solution_steps:
- en: Let x metres be the breadth. Then the length is x + 10 metres.
- en: The area gives x(x + 10) = 96, so x² + 10x - 96 = 0.
- en: 'Factorise: (x - 6)(x + 16) = 0, so x = 6 or x = -16; a length is positive,
    so the breadth is 6 m and the length is 16 m.'
- en: The perimeter is 2(6 + 16) = 44 m, and the cost is 44 x 25.
- en: The correct option is b.
hints:
- level: 1
  en: Let x be the breadth and write the length using x, then use the area.
- level: 2
  en: Write the area as one relation in x, rearrange so the right side is zero, and
    solve it. Discard any solution that makes the length negative. Undo each step
    by doing the same thing to each side.
- level: 3
  en: 'Full method: name the breadth, write the length, form the area relation, rearrange
    to zero, factorise, keep the positive solution, then answer exactly what is asked
    (breadth, length or cost).'
prediction_prompt:
  en: About how long do you think the shorter side is?
