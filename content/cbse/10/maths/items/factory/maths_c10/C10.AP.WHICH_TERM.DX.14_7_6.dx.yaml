stem:
  en: Which term of the AP 14, 21, 28, ... is 49?
hints:
- level: 1
  en: Write the rule for the nth term and make it equal to the given number.
- level: 2
  en: 'Undo each operation in the rule by doing the same thing to each side: first
    take away the first term, then divide by the difference, then deal with the minus
    one.'
- level: 3
  en: 'Full method: write first term + (n - 1) x difference, set it equal to the target,
