solution_steps:
- en: The first term is 14 and the common difference is 7.
- en: 'Set the nth term equal to 49: 14 + (n - 1)(7) = 49.'
- en: 'Take 14 away from both sides: (n - 1)(7) = 35. Divide both sides by 7: n -
    1 = 5.'
- en: 'Add 1 to both sides: n = 6.'
- en: The correct option is b.
