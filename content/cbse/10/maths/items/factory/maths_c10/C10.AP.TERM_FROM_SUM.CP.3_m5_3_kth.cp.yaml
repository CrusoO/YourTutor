solution_steps:
- en: 'The nth term is the difference of two sums: a_n = S_n - S_(n-1).'
- en: S_n - S_(n-1) = 3n² - 5n - (3(n - 1)² - 5(n - 1)) = 6n - 8.
- en: 'Put n = 3: a_3 = 10.'
- en: The correct option is c.
