solution_steps:
- en: The coefficients are 3, 1 and -7.
- en: The discriminant is 1² - 4 x 3 x -7 = 85, which is positive but not a perfect
    square.
- en: So x = (-(1) ± √85) / 6, and the square root is simplified as far as it will
    go.
- en: x = (-1 ± √85)/6.
- en: The correct option is a.
