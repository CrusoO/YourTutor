difficulty: 0.44
type: mcq
pool: practice
role: procedure
stem:
  en: In triangle PQR the angle at Q is a right angle, PQ = 9 cm and QR = 12 cm. Find
    the value of sin P.
options:
- id: a
  en: 3/5
- id: b
  en: 4/3
- id: c
  en: 5/4
- id: d
  en: 4/5
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Name the sides from angle P: the side opposite it, the side next to it (adjacent),
    and the hypotenuse.'
- en: By Pythagoras the hypotenuse PR = square root of (9² + 12²) = 15.
- en: Opposite = 12, adjacent = 9, hypotenuse = 15.
- en: sin P = opposite / hypotenuse = 4/5.
- en: The correct option is d.
hints:
- level: 1
  en: The longest side is opposite the right angle; label the other two from the angle
    in the question.
- level: 2
  en: Only two sides are given, so use the relation between the three sides of this
    triangle to find the third before forming the ratio.
- level: 3
  en: 'Full method: label opposite, adjacent and hypotenuse for the stated angle,
    find the missing side with the rule for right triangles, write the ratio as a
    fraction and simplify it.'
prediction_prompt:
  en: Is this ratio bigger or smaller than 1?
