stem:
  en: Find the sum of all the terms of the AP -6, -11, -16, ..., -71.
hints:
- level: 1
  en: First find out how many terms there are.
- level: 2
  en: The number of terms is the distance from first to last divided by the difference,
    plus one. Then average the first and last terms and multiply by the count.
- level: 3
  en: 'Full method: subtract the first term from the last, divide by the difference,
    add one to get n, then multiply n by half of (first + last).'
