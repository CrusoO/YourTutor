solution_steps:
- en: The first term is -6, the last term is -71 and the difference is -5.
- en: 'Number of terms: n = (-71 - -6)/-5 + 1 = 14.'
- en: S = (n/2)(first + last) = (14/2)(-6 + -71) = -539.
