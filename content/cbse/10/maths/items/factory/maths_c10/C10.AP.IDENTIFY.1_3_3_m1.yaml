id: C10.AP.IDENTIFY.1_3_3_m1
skill_ids:
- MATH.ALG.AP.IDENTIFY_AP
difficulty: 0.34
type: mcq
pool: practice
role: recall
stem:
  en: All the lists begin with 1. Choose the one in which the gap between neighbouring
    terms never changes.
options:
- id: a
  en: 1, 4, 7, 9
- id: b
  en: 1, 3, 9, 27
- id: c
  en: 1, 4, 8, 13
- id: d
  en: 1, 4, 7, 10
answer:
  sympy: d
  accept: []
solution_steps:
- en: A list is an AP when the difference between every pair of neighbouring terms
    is the same.
- en: In 1, 4, 7, 10 each step is 3, and it stays 3 all the way along.
- en: In each of the other lists, at least one pair of neighbours has a different
    difference.
- en: The correct option is d.
hints:
- level: 1
  en: Work out the gaps between neighbours for each list and compare them.
- level: 2
  en: For each list subtract every term from the next one. A list passes only when
    all its gaps are identical.
- level: 3
  en: 'Full method: for every list write down the three gaps between neighbours, compare
    them, and keep the one list whose gaps are all equal.'
prediction_prompt:
  en: Which list do you suspect, and why?
