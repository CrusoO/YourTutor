solution_steps:
- en: Let the fraction be x/y. Then x + y = 13.
- en: After the change the fraction is (x + 3)/(y + 2) = 4/5, so 5x - 4y = -7.
- en: Solving the pair gives x = 5 and y = 8, so the fraction is 5/8.
- en: The correct option is a.
