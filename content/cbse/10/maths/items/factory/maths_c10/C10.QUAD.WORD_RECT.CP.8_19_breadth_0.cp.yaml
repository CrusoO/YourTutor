solution_steps:
- en: Let x metres be the breadth. Then the length is x + 8 metres.
- en: The area gives x(x + 8) = 513, so x² + 8x - 513 = 0.
- en: 'Factorise: (x - 19)(x + 27) = 0, so x = 19 or x = -27; a length is positive,
    so the breadth is 19 m and the length is 27 m.'
- en: The correct option is d.
