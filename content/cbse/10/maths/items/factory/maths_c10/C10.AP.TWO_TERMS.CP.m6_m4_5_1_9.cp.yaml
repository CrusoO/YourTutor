solution_steps:
- en: Going from term 5 to term 6 takes 1 equal steps, and the terms change by -4.
- en: So the common difference is -4 / 1 = -4.
- en: 'Go back to the first term: a = -22 - (5 - 1)(-4) = -6.'
- en: Then a_9 = -6 + (9 - 1)(-4) = -38.
- en: The correct option is d.
