solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 4, of x is 14, plain number
    is -98.'
- en: The discriminant is 14² - 4 x 4 x -98 = 1764, and its square root is 42.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 4).
- en: 'Work out both signs: x = -7 or x = 7/2.'
- en: The correct option is d.
