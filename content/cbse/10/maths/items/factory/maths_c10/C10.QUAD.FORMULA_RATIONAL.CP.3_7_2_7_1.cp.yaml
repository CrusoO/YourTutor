solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 6, of x is -63, plain number
    is 147.'
- en: The discriminant is -63² - 4 x 6 x 147 = 441, and its square root is 21.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 6).
- en: 'Work out both signs: x = 7/2 or x = 7.'
- en: The correct option is b.
