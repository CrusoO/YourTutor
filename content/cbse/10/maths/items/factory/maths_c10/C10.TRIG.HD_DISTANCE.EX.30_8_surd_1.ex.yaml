solution_steps:
- en: The tree is the side opposite the 30° angle and the shadow is the adjacent side.
- en: tan 30° = opposite / adjacent, so shadow = 8 / tan 30°.
- en: 'Replace the tangent by its exact value and simplify: the shadow is 8√3 m.'
- en: The correct option is d.
