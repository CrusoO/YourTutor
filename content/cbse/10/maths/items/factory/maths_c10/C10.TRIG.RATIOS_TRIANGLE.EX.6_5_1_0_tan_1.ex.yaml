solution_steps:
- en: 'Name the sides from angle R: the side opposite it, the side next to it (adjacent),
    and the hypotenuse.'
- en: By Pythagoras the hypotenuse PR = square root of (11² + 60²) = 61.
- en: Opposite = 11, adjacent = 60, hypotenuse = 61.
- en: tan R = opposite / adjacent = 11/60.
- en: The correct option is a.
