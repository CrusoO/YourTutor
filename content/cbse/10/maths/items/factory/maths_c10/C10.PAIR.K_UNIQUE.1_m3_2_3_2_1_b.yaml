solution_steps:
- en: A pair fails to have exactly one solution when the ratio of the x coefficients
    equals the ratio of the y coefficients.
- en: 'Use the ratios that contain k: 2/3 = -6/k, so k = -9.'
- en: At k = -9 the two coefficient ratios are equal, so the pair has no unique solution.
- en: The correct option is b.
