solution_steps:
- en: 'Put y = -2x + 9 into the second equation: x - 3(-2x + 9) = 1.'
- en: 'Multiply out and collect the x terms: 7x = 28, so x = 4.'
- en: 'Put x = 4 back into the first equation: y = -2 × 4 + (9) = 1.'
- en: So x + y = 4 + (1) = 5.
- en: The correct option is c.
