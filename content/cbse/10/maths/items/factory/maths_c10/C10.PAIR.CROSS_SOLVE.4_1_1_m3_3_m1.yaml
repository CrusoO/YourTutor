solution_steps:
- en: 'Read off the numbers: a1 = 1, b1 = -3, c1 = -1, a2 = 3, b2 = -1, c2 = -11.'
- en: 'Use x/(b1c2 - b2c1) = y/(c1a2 - c2a1) = 1/(a1b2 - a2b1): x/(32) = y/(8) = 1/(8).'
- en: So x = 32/8 = 4 and y = 8/8 = 1.
- en: The correct option is a.
