solution_steps:
- en: Equal roots need b² - 4ac = 0, so (12)² - 4(k)(3) = 0.
- en: 'This gives 144 - 12k = 0. Add 12k to both sides: 12k = 144.'
- en: 'Divide both sides by 12: k = 12.'
- en: The correct option is a.
