solution_steps:
- en: 'Name the sides from angle P: the side opposite it, the side next to it (adjacent),
    and the hypotenuse.'
- en: By Pythagoras the hypotenuse PR = square root of (60² + 11²) = 61.
- en: Opposite = 11, adjacent = 60, hypotenuse = 61.
- en: sin P = opposite / hypotenuse = 11/61.
- en: The correct option is b.
