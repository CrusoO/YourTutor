solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 2, of x is 7, plain number
    is -49.'
- en: The discriminant is 7² - 4 x 2 x -49 = 441, and its square root is 21.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 2).
- en: 'Work out both signs: x = -7 or x = 7/2.'
- en: The correct option is c.
