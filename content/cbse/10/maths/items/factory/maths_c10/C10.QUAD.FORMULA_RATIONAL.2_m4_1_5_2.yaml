solution_steps:
- en: 'Read off the coefficients: coefficient of x² is 4, of x is 6, plain number
    is -40.'
- en: The discriminant is 6² - 4 x 4 x -40 = 676, and its square root is 26.
- en: Substitute into x = (-b ± square root of the discriminant) / (2 x 4).
- en: 'Work out both signs: x = -4 or x = 5/2.'
- en: The correct option is b.
