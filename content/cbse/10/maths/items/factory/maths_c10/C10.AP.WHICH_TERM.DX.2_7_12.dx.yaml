solution_steps:
- en: The first term is 2 and the common difference is 7.
- en: 'Set the nth term equal to 79: 2 + (n - 1)(7) = 79.'
- en: 'Take 2 away from both sides: (n - 1)(7) = 77. Divide both sides by 7: n - 1
    = 11.'
- en: 'Add 1 to both sides: n = 12.'
- en: The correct option is d.
