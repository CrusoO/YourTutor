solution_steps:
- en: 'Line A: y changes by -1 each time x goes up by 1, so y = -x + 2.'
- en: 'Line B: y changes by 2 each time x goes up by 1, so y = 2x + 5.'
- en: 'At the meeting point both rules give the same y: -1x + (2) = 2x + (5), so x
    = -1.'
- en: Then y = -1 × -1 + (2) = 3. The lines meet at (-1, 3).
- en: The correct option is d.
