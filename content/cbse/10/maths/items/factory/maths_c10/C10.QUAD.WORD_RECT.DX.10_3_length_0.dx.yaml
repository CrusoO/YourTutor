solution_steps:
- en: Let x metres be the breadth. Then the length is x + 10 metres.
- en: The area gives x(x + 10) = 39, so x² + 10x - 39 = 0.
- en: 'Factorise: (x - 3)(x + 13) = 0, so x = 3 or x = -13; a length is positive,
    so the breadth is 3 m and the length is 13 m.'
- en: The correct option is d.
