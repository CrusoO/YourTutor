stem:
  en: In a hall the first row has 20 seats and every row after it has 8 more seats
    than the row before. There are 8 rows. How many seats are there in the whole hall?
options:
- id: a
  en: '384'
- id: b
  en: '416'
- id: c
  en: '76'
- id: d
  en: '768'
answer:
  sympy: a
  accept: []
solution_steps:
- en: The amounts form an AP with first term 20 and common difference 8.
- en: The last amount is 76, so the total is S = (8/2)(20 + 76).
- en: S = 384.
- en: The correct option is a.
