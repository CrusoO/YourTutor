solution_steps:
- en: Here a = 3, d = -2 and S_n = -45.
- en: '(n/2)(2 x 3 + (n - 1) x -2) = -45. Multiply both sides by 2 and expand: -2n²
    + 8n = -90.'
- en: 'Rearranged: -2n² + (8)n - -90 = 0, whose solutions are n = 9 and n = -5.'
- en: The number of terms is a positive whole number, so n = 9.
- en: The correct option is a.
