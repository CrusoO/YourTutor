id: C10.AP.NTH_TERM.8_4_10_1
skill_ids:
- MATH.ALG.AP.NTH_TERM
difficulty: 0.31
type: mcq
pool: practice
role: procedure
stem:
  en: The first term of an AP is 8 and its common difference is 4. Find the 10th term.
options:
- id: a
  en: '44'
- id: b
  en: '21'
- id: c
  en: '48'
- id: d
  en: '-28'
answer:
  sympy: a
  accept: []
solution_steps:
- en: The first term is 8 and the common difference is 4.
- en: The nth term is first term + (n - 1) x difference, so a_10 = 8 + (10 - 1)(4).
- en: a_10 = 8 + 36 = 44.
- en: The correct option is a.
hints:
- level: 1
  en: To reach the nth term you make one fewer jump than n.
- level: 2
  en: The number of jumps is one less than the position. Multiply the difference by
    the number of jumps, then add the result to the first term.
- level: 3
  en: 'Full method: identify the first term and the common difference, count the jumps
    which is the position minus one, multiply by the difference, and add to the first
    term.'
prediction_prompt:
  en: Will the term be much bigger or smaller than the first term?
