solution_steps:
- en: The first term is 2 and the common difference is -4.
- en: The nth term is first term + (n - 1) x difference, so a_10 = 2 + (10 - 1)(-4).
- en: a_10 = 2 + -36 = -34.
- en: The correct option is b.
