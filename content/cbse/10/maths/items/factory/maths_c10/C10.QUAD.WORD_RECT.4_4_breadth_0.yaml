solution_steps:
- en: Let x metres be the breadth. Then the length is x + 4 metres.
- en: The area gives x(x + 4) = 32, so x² + 4x - 32 = 0.
- en: 'Factorise: (x - 4)(x + 8) = 0, so x = 4 or x = -8; a length is positive, so
    the breadth is 4 m and the length is 8 m.'
- en: The correct option is a.
