solution_steps:
- en: Let x be the smaller number. The other is x + 2.
- en: Their product is 224, so x(x + 2) = 224, which is x² + 2x - 224 = 0.
- en: 'Factorise: (x - 14)(x + 16) = 0, so x = 14 or x = -16.'
- en: The numbers must be positive, so the smaller number is 14.
- en: The correct option is a.
