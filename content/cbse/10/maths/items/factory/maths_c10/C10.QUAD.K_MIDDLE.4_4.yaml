options:
- id: a
  en: k = -16 or k = 16
- id: b
  en: k = -32 or k = 32
- id: c
  en: k = 32
- id: d
  en: k = -1024 or k = 1024
answer:
  sympy: b
  accept: []
misconception_rules:
