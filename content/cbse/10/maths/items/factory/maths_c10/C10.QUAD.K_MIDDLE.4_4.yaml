solution_steps:
- en: 'Equal roots need the discriminant to be zero: k² - 4(4)(64) = 0.'
- en: So k² = 1024.
- en: 'Take the square root of both sides, keeping both signs: k = -32 or k = 32.'
- en: The correct option is b.
