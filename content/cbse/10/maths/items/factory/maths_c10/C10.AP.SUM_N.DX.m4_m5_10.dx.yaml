solution_steps:
- en: The first term is -4, the common difference is -5 and the number of terms is
    10.
- en: S_n = (n/2)(2a + (n - 1)d) = (10/2)(2 x -4 + (10 - 1) x -5).
- en: = (10/2)(-53) = -265.
- en: The correct option is b.
