solution_steps:
- en: Take the whole right-hand side away from both sides, so the right-hand side
    is 0.
- en: The left-hand side becomes x² + 3x, so the equation is x² + 3x = 0.
- en: Comparing with ax² + bx + c = 0 gives b = 3.
- en: The correct option is d.
