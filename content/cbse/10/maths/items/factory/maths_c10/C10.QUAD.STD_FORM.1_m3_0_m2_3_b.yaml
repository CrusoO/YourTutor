stem:
  en: Rearrange x² + x + 3 = -2x + 3 into the form ax² + bx + c = 0. What is the value
    of b?
hints:
- level: 1
  en: Collect all the terms on the left side and leave zero on the right.
- level: 2
  en: 'Undo each term on the right by doing the same operation to both sides: take
    the term away from both sides, then combine like terms. Start with the term in
    x on the right: take it away from both sides first.'
- level: 3
  en: 'Full method: take the x term on the right from both sides, take the plain number
    on the right from both sides, combine the x terms, combine the plain numbers,
    then read the coefficient you need, keeping its sign.'
prediction_prompt:
  en: Before you work it out, will the coefficient be positive or negative?
