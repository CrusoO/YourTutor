solution_steps:
- en: Let x km/h be the usual speed. The time taken is 300/x hours, and at the higher
    speed it is 300/(x + 15) hours.
- en: 'The saving is 1: 300/x - 300/(x + 15) = 1. Multiply every term by x(x + 15)
    to clear the fractions.'
- en: This gives 1x² + 15x - 4500 = 0, which factorises as (x - 60)(x + 75) = 0 after
    dividing by 1.
- en: A speed is positive, so the usual speed is 60 km/h and the faster speed is 75
    km/h.
- en: The correct option is d.
