id: C10.QUAD.K_MIDDLE.3_1
skill_ids:
- MATH.ALG.QUAD.FIND_PARAMETER_FOR_ROOTS
difficulty: 0.59
type: mcq
pool: practice
role: apply
stem:
  en: Find the values of k for which the equation 3x² + kx + 3 = 0 has two equal real
    roots.
options:
- id: a
  en: k = 6
- id: b
  en: k = -3 or k = 3
- id: c
  en: k = -36 or k = 36
- id: d
  en: k = -6 or k = 6
answer:
  sympy: d
  accept: []
solution_steps:
- en: 'Equal roots need the discriminant to be zero: k² - 4(3)(3) = 0.'
- en: So k² = 36.
- en: 'Take the square root of both sides, keeping both signs: k = -6 or k = 6.'
- en: The correct option is d.
hints:
- level: 1
  en: Equal roots happen when the discriminant is exactly zero.
- level: 2
  en: After writing the discriminant, undo the subtraction by adding the same number
    to both sides, then undo the square by taking the square root of both sides.
- level: 3
  en: 'Full method: write the discriminant with k in it, set it to zero, add the same
    number to both sides, take the square root of both sides, and remember both signs.'
prediction_prompt:
  en: Should k be allowed to be negative as well as positive?
