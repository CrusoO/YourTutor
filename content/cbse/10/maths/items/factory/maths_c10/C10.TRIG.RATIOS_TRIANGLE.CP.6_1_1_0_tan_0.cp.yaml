solution_steps:
- en: 'Name the sides from angle P: the side opposite it, the side next to it (adjacent),
    and the hypotenuse.'
- en: By Pythagoras the hypotenuse PR = square root of (35² + 12²) = 37.
- en: Opposite = 12, adjacent = 35, hypotenuse = 37.
- en: tan P = opposite / adjacent = 12/35.
- en: The correct option is a.
