solution_steps:
- en: The first term is -3 and the common difference is 4.
- en: 'Set the nth term equal to 101: -3 + (n - 1)(4) = 101.'
- en: 'Take -3 away from both sides: (n - 1)(4) = 104. Divide both sides by 4: n -
    1 = 26.'
- en: 'Add 1 to both sides: n = 27.'
- en: The correct option is b.
