solution_steps:
- en: The coefficients are 1, 7 and 7.
- en: The discriminant is 7² - 4 x 1 x 7 = 21, which is positive but not a perfect
    square.
- en: So x = (-(7) ± √21) / 2, and the square root is simplified as far as it will
    go.
- en: x = (-7 ± √21)/2.
- en: The correct option is d.
