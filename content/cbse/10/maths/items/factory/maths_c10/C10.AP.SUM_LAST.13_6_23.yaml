stem:
  en: The AP 13, 19, 25, ..., 145 stops at 145. What is the sum of all its terms?
options:
- id: a
  en: '11455'
- id: b
  en: '3634'
- id: c
  en: '1738'
- id: d
  en: '1817'
answer:
  sympy: d
  accept: []
solution_steps:
- en: The first term is 13, the last term is 145 and the difference is 6.
- en: 'Number of terms: n = (145 - 13)/6 + 1 = 23.'
- en: S = (n/2)(first + last) = (23/2)(13 + 145) = 1817.
- en: The correct option is d.
hints:
- level: 1
  en: The count of terms is not given, so work it out from the first and last terms.
- level: 2
  en: The number of terms is the distance from first to last divided by the difference,
    plus one. Then average the first and last terms and multiply by the count.
- level: 3
  en: 'Full method: subtract the first term from the last, divide by the difference,
    add one to get n, then multiply n by half of (first + last).'
prediction_prompt:
  en: Is the number of terms more or less than ten?
