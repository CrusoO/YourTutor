solution_steps:
- en: Let the tower be h m high. Seen at 30° the ground distance is h / tan 30°; seen
    at 60° it is h / tan 60°.
- en: 'The two distances differ by the 4 m walked: h / tan 30° - h / tan 60° = 4.'
- en: 'Put in the exact values of the tangents and solve for h: h = 2√3 m.'
- en: The correct option is a.
