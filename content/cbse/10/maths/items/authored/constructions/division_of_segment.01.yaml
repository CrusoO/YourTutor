solution_steps:
- en: 'The ratio 3 : 2 has 3 + 2 = 5 parts, so five equal steps are marked on the ray from A.'
- en: The construction then carries the division onto AB.
- en: The correct option is b.
tier: C
diagram_note: Segment AB drawn horizontally, with a ray from A drawn at an acute angle to AB and equal marks made along that ray.
