id: A.10.maths.constructions.division_of_segment.04
skill_ids:
- SK.A.10.maths.division_of_segment
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why are equal steps marked on a ray from A in the division construction?
hints:
- level: 1
  en: Think about what the ray is used for in the construction.
- level: 2
  en: Ask what the parallel line does to the lengths it cuts.
- level: 3
  en: Consider whether the method needs the ray to be at a special angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: To measure the length of AB in centimetres.
- id: b
  en: To find only the midpoint of AB.
- id: c
  en: To make the ray perpendicular to AB.
- id: d
  en: Parallel lines carry the proportions of the equal steps onto AB, so the division of AB follows the ratio.
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.325E242AF589
  when_answer_equals:
  - c
- id: MC.A.D0D5974C0F19
  when_answer_equals:
  - b
- id: MC.A.C1F0916CB40A
  when_answer_equals:
  - a
solution_steps:
- en: The ray acts as a scale.
- en: The parallel line drawn from a chosen mark to AB keeps the proportions of the steps on AB.
- en: The correct option is d.
tier: C
