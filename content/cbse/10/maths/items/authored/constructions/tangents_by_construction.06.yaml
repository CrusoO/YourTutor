id: A.10.maths.constructions.tangents_by_construction.06
skill_ids:
- SK.A.10.maths.tangents_by_construction
difficulty: 0.9
pool: practice
role: explain
stem:
  en: A student tries the tangent construction from a point T that lies inside the circle. What is the result?
hints:
- level: 1
  en: Decide whether T is inside, on, or outside the circle.
- level: 2
  en: Think about whether a line through an interior point can avoid the circle.
- level: 3
  en: Recall the definition of a tangent.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Two tangents are drawn as usual.
- id: b
  en: No tangents exist, because every line through an interior point crosses the circle.
- id: c
  en: The tangents are parallel to each other.
- id: d
  en: The tangents pass through the centre O.
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.0EA66A6F8971
  when_answer_equals:
  - a
- id: MC.A.D726F47C047A
  when_answer_equals:
  - c
- id: MC.A.5B60FA977E6F
  when_answer_equals:
  - d
solution_steps:
- en: A tangent touches the circle without entering it, and every line through an interior point crosses the circle.
- en: So a point inside the circle has no tangents, and the construction fails.
- en: The correct option is b.
tier: C
