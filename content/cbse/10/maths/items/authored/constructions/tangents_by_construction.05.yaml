difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A circle has centre O and radius 5 cm. An external point T is 13 cm from O. Using the tangent construction, what is the length of each tangent from T in cm?
hints:
- level: 1
  en: Find the right angle at a contact point.
- level: 2
  en: Apply Pythagoras with OT as the hypotenuse.
- level: 3
  en: Take the square root of the difference of the squares.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '12'
  accept: []
solution_steps:
- en: Each tangent is perpendicular to the radius at its contact point, so its length satisfies length² = 13² - 5² = 144.
- en: The tangent length is 12 cm.
- en: The unit of the answer is cm.
- en: Answer = 12
tier: C
diagram_note: A circle with centre O and radius 5 cm, an external point T joined to O with OT = 13 cm, and one tangent from T touching the circle at P.
