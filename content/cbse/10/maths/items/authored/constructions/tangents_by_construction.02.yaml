id: A.10.maths.constructions.tangents_by_construction.02
skill_ids:
- SK.A.10.maths.tangents_by_construction
difficulty: 0.2
pool: practice
role: recall
stem:
  en: To construct tangents from an external point T to a circle with centre O, you draw a helper circle on OT as its diameter. If OT = 10 cm, what is the radius of the helper circle in cm?
hints:
- level: 1
  en: Identify the diameter of the helper circle.
- level: 2
  en: Recall how the radius relates to the diameter.
- level: 3
  en: Halve the length of the diameter.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: The helper circle has OT as its diameter, so its radius is half of 10 cm, which is 5 cm.
- en: The unit of the answer is cm.
- en: Answer = 5
tier: C
diagram_note: A segment OT of 10 cm joining a centre O to an external point T, with a helper circle drawn on OT as its diameter.
