stem:
  en: A triangle has sides 4 cm, 5 cm and 6 cm. A similar triangle is drawn with scale factor 2. What is the longest side of the new triangle in cm?
hints:
- level: 1
  en: Multiply each side by the scale factor.
- level: 2
  en: Find the longest of the new sides.
- level: 3
  en: Check that every side has been scaled the same way.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
