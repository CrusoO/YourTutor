  author: model-draft
type: numeric
answer:
  sympy: '12'
  accept: []
solution_steps:
- en: Each side is doubled, so the new sides are 8, 10 and 12 cm.
- en: The longest side is 12 cm.
- en: The unit of the answer is cm.
- en: Answer = 12
