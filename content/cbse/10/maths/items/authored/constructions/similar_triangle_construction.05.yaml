difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Triangle ABC has sides 6 cm, 8 cm and 10 cm, so its area is 24 cm². A similar triangle is made with scale factor 2.5. What is its area in cm²?
hints:
- level: 1
  en: Remember that areas scale with the square of the scale factor.
- level: 2
  en: Square the scale factor first.
- level: 3
  en: Multiply the original area by that square.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '150'
  accept: []
solution_steps:
- en: Areas of similar triangles scale with the square of the scale factor.
- en: So the new area is 24 × 2.5² = 24 × 6.25 = 150 cm².
- en: The unit of the answer is cm2.
- en: Answer = 150
tier: C
diagram_note: A right-angled triangle with legs 6 cm and 8 cm and hypotenuse 10 cm labelled, drawn with its right angle at the bottom left.
