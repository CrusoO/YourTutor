skill_ids:
- SK.A.10.maths.division_of_segment
difficulty: 0.2
pool: practice
role: apply
stem:
  en: 'Segment AB is 10 cm long. Point P divides AB internally so that AP : PB = 2 : 3. What is AP in cm?'
hints:
- level: 1
  en: Find the total number of parts in the ratio.
- level: 2
  en: Find what one part equals.
- level: 3
  en: Multiply the number of parts for AP by that value.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: AP is 2 of the 5 equal parts of AB, so AP = 2/5 × 10 = 4 cm.
- en: The unit of the answer is cm.
- en: Answer = 4
tier: C
diagram_note: 'Segment AB of length 10 cm drawn horizontally, with a point P on it nearer A, and the ratio 2 : 3 marked between the two parts.'
