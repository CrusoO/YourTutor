role: explain
stem:
  en: Why is the angle at each contact point a right angle in the tangent construction?
hints:
- level: 1
  en: Recall the property of a diameter and a point on the circle.
- level: 2
  en: Ask which lines form the right angle at the contact point.
- level: 3
  en: Compare this with the tangent property you already know.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
