  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Because OT is always the tangent.
- id: b
  en: Because the angle in a semicircle is 90 degrees.
- id: c
  en: Because the radius bisects the diameter.
- id: d
  en: Because the two circles touch at T.
answer:
  sympy: b
  accept: []
