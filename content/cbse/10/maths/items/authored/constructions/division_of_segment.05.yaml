id: A.10.maths.constructions.division_of_segment.05
skill_ids:
- SK.A.10.maths.division_of_segment
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: 'Segment AB is 12 cm long. Point P divides AB internally in the ratio AP : PB = 3 : 5, and point Q divides AB internally in the ratio AQ : QB = 5 : 3. What is PQ in cm?'
hints:
- level: 1
  en: Find the length of AP using the total number of parts.
- level: 2
  en: Find the length of AQ in the same way.
- level: 3
  en: Subtract the shorter distance from the longer one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: AP = 3/8 × 12 = 4.5 cm and AQ = 5/8 × 12 = 7.5 cm.
- en: So PQ = 7.5 - 4.5 = 3 cm.
- en: The unit of the answer is cm.
- en: Answer = 3
tier: C
diagram_note: 'Segment AB drawn horizontally and labelled 12 cm, with points P and Q marked on it: P nearer A and Q nearer B.'
