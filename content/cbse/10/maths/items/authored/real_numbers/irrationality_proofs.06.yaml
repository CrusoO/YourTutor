id: A.10.maths.real_numbers.irrationality_proofs.06
skill_ids:
- SK.A.10.maths.irrationality_proofs
difficulty: 0.9
pool: practice
role: explain
stem:
  en: A student says the sum of two irrational numbers is always irrational. Which pair gives a counterexample?
hints:
- level: 1
  en: Look for two irrational numbers with opposite signs.
- level: 2
  en: Check whether the sum of the pair is a rational number.
- level: 3
  en: Think about how the rationality of a number relates to that of its negative.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: √2 and √3, whose sum is about 3.146
- id: b
  en: √2 and 5, whose sum is 5 + √2
- id: c
  en: √2 and -√2, whose sum is 0
- id: d
  en: √2 and 2√2, whose sum is 3√2
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.C56F1741AB2B
  when_answer_equals:
  - a
- id: MC.A.70B3AC54109E
  when_answer_equals:
  - b
- id: MC.A.AEFDC3F280E2
  when_answer_equals:
  - d
solution_steps:
- en: Both √2 and -√2 are irrational, since the negative of an irrational number is irrational.
- en: Their sum is 0, which is rational, so the student's claim is false.
- en: The correct option is c.
tier: C
