solution_steps:
- en: For angle A, the opposite side is BC and the hypotenuse is AC, since the hypotenuse lies opposite the right angle.
- en: So sin A = BC/AC.
- en: The correct option is c.
tier: C
diagram_note: Right triangle ABC with the right angle at B. The hypotenuse AC is the longest side, and sides AB and BC are labelled.
