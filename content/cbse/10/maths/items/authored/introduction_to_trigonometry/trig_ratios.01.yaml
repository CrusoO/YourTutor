id: A.10.maths.introduction_to_trigonometry.trig_ratios.01
skill_ids:
- SK.A.10.maths.trig_ratios
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In right triangle ABC with the right angle at B, which ratio gives sin A?
hints:
- level: 1
  en: Identify which side is opposite the right angle.
- level: 2
  en: Find the side opposite to angle A.
- level: 3
  en: 'Recall the sine ratio: opposite over hypotenuse.'
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: AB/AC
- id: b
  en: BC/AB
- id: c
  en: BC/AC
- id: d
  en: AC/BC
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.2B026C0940A7
  when_answer_equals:
  - a
- id: MC.A.014EA6A77521
  when_answer_equals:
  - b
- id: MC.A.529391F36E70
  when_answer_equals:
