id: A.10.maths.introduction_to_trigonometry.trig_ratios.02
skill_ids:
- SK.A.10.maths.trig_ratios
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In a right triangle, the side opposite an acute angle θ is 3 cm and the hypotenuse is 5 cm. What is sin θ?
hints:
- level: 1
  en: Name the side opposite to θ and the hypotenuse.
- level: 2
  en: Write sine as opposite over hypotenuse.
- level: 3
  en: Divide the two lengths.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.6'
  accept: []
solution_steps:
- en: Sine is the opposite side divided by the hypotenuse, so sin θ = 3/5 = 0.6.
- en: Answer = 0.6
tier: C
