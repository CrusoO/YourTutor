stem:
  en: For an acute angle θ with sin θ = 3/5, what is the value of (1 + tan²θ) × cos²θ?
hints:
- level: 1
  en: Write tan²θ as sin²θ over cos²θ.
- level: 2
  en: Use a Pythagorean identity to rewrite the bracket in terms of cosine.
- level: 3
  en: Simplify the product before substituting numbers.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1'
  accept: []
solution_steps:
- en: The identity 1 + tan²θ = 1/cos²θ gives (1 + tan²θ) cos²θ = 1 for any acute angle.
- en: The given sine value is not needed.
- en: Answer = 1
tier: C
