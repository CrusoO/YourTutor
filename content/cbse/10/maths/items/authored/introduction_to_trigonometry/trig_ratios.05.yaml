id: A.10.maths.introduction_to_trigonometry.trig_ratios.05
skill_ids:
- SK.A.10.maths.trig_ratios
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: In right triangle ABC, the right angle is at C, sin A = 5/13 and BC = 5 cm. What is AC in cm?
hints:
- level: 1
  en: Write sin A as opposite over hypotenuse and find AB.
- level: 2
  en: Use Pythagoras to find the third side.
- level: 3
  en: Check that the side you find is the longest side.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '12'
  accept: []
solution_steps:
- en: sin A = BC/AB = 5/13, so AB = 13 cm.
- en: By Pythagoras, AC = √(13² - 5²) = √144 = 12 cm.
- en: The unit of the answer is cm.
- en: Answer = 12
tier: C
diagram_note: Right triangle ABC with the right angle at C. The hypotenuse AB is the longest side. The leg BC of 5 cm is opposite angle A, and AC is the unknown leg.
