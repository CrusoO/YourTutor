solution_steps:
- en: For angle P, the opposite side is QR = 3 cm and the adjacent side is PQ = 4 cm, so tan P = opposite over adjacent = 3/4.
- en: The correct option is c.
tier: C
diagram_note: 'Right triangle PQR with the right angle at Q: the leg PQ of 4 cm is drawn horizontally, the leg QR of 3 cm vertically, and the hypotenuse PR of 5 cm.'
