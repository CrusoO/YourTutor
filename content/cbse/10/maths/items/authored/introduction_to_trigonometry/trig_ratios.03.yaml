id: A.10.maths.introduction_to_trigonometry.trig_ratios.03
skill_ids:
- SK.A.10.maths.trig_ratios
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: In right triangle PQR, the right angle is at Q, PQ = 4 cm and QR = 3 cm. What is tan P?
hints:
- level: 1
  en: Label the opposite and adjacent sides for angle P.
- level: 2
  en: Recall which two sides the tangent uses.
- level: 3
  en: Decide whether the hypotenuse is needed for the tangent.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 5/3
- id: b
  en: 4/3
- id: c
  en: 3/4
- id: d
  en: 4/5
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.945D8010DAEC
  when_answer_equals:
  - d
- id: MC.A.10B12DCB539D
  when_answer_equals:
