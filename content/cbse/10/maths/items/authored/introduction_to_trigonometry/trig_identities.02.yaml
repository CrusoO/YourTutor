answer:
  sympy: '0.8'
  accept: []
solution_steps:
- en: From sin²θ + cos²θ = 1 we get cos²θ = 1 - 0.36 = 0.64, so cos θ = 0.8 for an acute angle.
- en: Answer = 0.8
