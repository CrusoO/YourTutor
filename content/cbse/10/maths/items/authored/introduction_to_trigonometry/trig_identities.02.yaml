stem:
  en: For an acute angle θ, sin θ = 0.6. What is cos θ?
hints:
- level: 1
  en: Use the identity that links sin and cos.
- level: 2
  en: Square the given sine value first.
- level: 3
  en: Take the positive square root because the angle is acute.
