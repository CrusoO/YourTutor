difficulty: 0.9
pool: practice
role: transfer
stem:
  en: 'In a trapezium ABCD, AB is parallel to DC and AB = 2DC. The diagonals AC and BD meet at O. What is the ratio AO : OC?'
hints:
- level: 1
  en: Find two triangles that meet at O and have parallel sides.
- level: 2
  en: Use the ratio of corresponding sides in those similar triangles.
- level: 3
  en: Decide which parallel side goes in the numerator.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: '1 : 2'
- id: b
  en: '2 : 1'
- id: c
  en: '1 : 1'
- id: d
  en: '4 : 1'
answer:
  sympy: b
  accept: []
misconception_rules:
