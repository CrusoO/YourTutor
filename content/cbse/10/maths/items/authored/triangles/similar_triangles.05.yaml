solution_steps:
- en: Triangles AOB and COD are similar because AB is parallel to DC, so AO/OC = AB/DC = 2.
- en: The diagonals divide each other in the ratio of the parallel sides.
- en: The correct option is b.
tier: C
diagram_note: Trapezium ABCD with the parallel sides AB at the top and DC at the bottom, AB longer than DC; the diagonals AC and BD cross at the point O.
