difficulty: 0.9
pool: practice
role: transfer
stem:
  en: In triangle ABC, DE is parallel to BC, with D on AB and E on AC. The area of triangle ADE is 16 cm² and the area of triangle ABC is 64 cm². If BC = 12 cm, what is DE in cm?
hints:
- level: 1
  en: Find the ratio of the two areas first.
- level: 2
  en: Remember that an area ratio is the square of the side ratio.
- level: 3
  en: Take the square root of the area ratio and multiply by BC.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: Areas of similar triangles are in the ratio of the squares of corresponding sides, so (DE/BC)² = 16/64 = 1/4.
- en: Thus DE/BC = 1/2 and DE = 6 cm.
- en: The unit of the answer is cm.
- en: Answer = 6
tier: C
diagram_note: Triangle ABC with base BC at the bottom and a segment DE drawn parallel to BC, with D on AB and E on AC; the smaller triangle ADE sits at the top.
