role: recall
stem:
  en: In triangle PQR, a line XY is parallel to QR, with X on PQ and Y on PR. PX = 2 cm, XQ = 3 cm and PY = 4 cm. What is YR in cm?
hints:
- level: 1
  en: Write the ratio PX over XQ.
- level: 2
  en: Set this equal to PY over YR.
- level: 3
  en: Cross-multiply and solve for YR.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: By the basic proportionality theorem, PX/XQ = PY/YR.
- en: So 2/3 = 4/YR, which gives YR = 6 cm.
- en: The unit of the answer is cm.
- en: Answer = 6
tier: C
diagram_note: Triangle PQR with QR as the base; a line XY parallel to QR crosses side PQ at X and side PR at Y. Label PX, XQ, PY and YR.
