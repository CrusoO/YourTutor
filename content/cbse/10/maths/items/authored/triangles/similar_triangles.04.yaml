id: A.10.maths.triangles.similar_triangles.04
skill_ids:
- SK.A.10.maths.similar_triangles
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Triangle ABC is similar to triangle DEF, with A matching D, B matching E and C matching F. If AB = 6 cm, DE = 4 cm and BC = 9 cm, what is EF in cm?
hints:
- level: 1
  en: Identify which side of DEF corresponds to BC.
- level: 2
  en: Write the ratio of two corresponding sides.
- level: 3
  en: Scale BC by that ratio.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: Corresponding sides are in the same ratio, so EF/BC = DE/AB = 4/6.
- en: This gives EF = 9 × 4/6 = 6 cm.
- en: The unit of the answer is cm.
- en: Answer = 6
tier: C
