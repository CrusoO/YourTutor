solution_steps:
- en: Corresponding sides are in the same ratio.
- en: Since DE/AB = 3/2, the side DF that corresponds to CA is 3/2 × 8 = 12 cm.
- en: The correct option is a.
tier: C
diagram_note: Two triangles side by side, ABC on the left and DEF on the right, with corresponding vertices labelled in the same order and the sides CA and FD marked.
