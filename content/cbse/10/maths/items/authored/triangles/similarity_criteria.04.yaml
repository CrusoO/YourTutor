difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Triangle ABC is similar to triangle DEF, with A matching D, B matching E and C matching F. AB/DE = BC/EF = 2/3 and CA = 8 cm. What is DF?
hints:
- level: 1
  en: Find which side of DEF matches CA.
- level: 2
  en: Work out the scale factor from the sides AB and DE.
- level: 3
  en: Multiply CA by that factor, paying attention to its direction.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 12 cm
- id: b
  en: 16/3 cm
- id: c
  en: 8 cm
- id: d
  en: 10 cm
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.A4CA87F9447F
  when_answer_equals:
  - c
- id: MC.A.ACD99C7F89A0
  when_answer_equals:
