id: A.10.maths.triangles.similarity_criteria.05
skill_ids:
- SK.A.10.maths.similarity_criteria
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: In triangles ABC and DEF, angle A equals angle D, AB = 4 cm, AC = 10 cm and DE = 6 cm. For the triangles to be similar by the SAS criterion, what must DF be in cm?
hints:
- level: 1
  en: Find the ratio of DE to AB.
- level: 2
  en: Make the ratio of DF to AC equal to that ratio.
- level: 3
  en: Multiply AC by that ratio.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '15'
  accept: []
solution_steps:
- en: SAS similarity needs the sides enclosing the equal angles to be in the same ratio.
- en: DE/AB = 6/4 = 3/2, so DF/AC = 3/2 and DF = 15 cm.
- en: The unit of the answer is cm.
- en: Answer = 15
tier: C
diagram_note: Two triangles ABC and DEF with the equal angles at A and D marked; AB and AC enclose angle A, and DE and DF enclose angle D.
