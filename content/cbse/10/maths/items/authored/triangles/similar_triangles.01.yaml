difficulty: 0.2
pool: practice
role: recall
stem:
  en: In triangle ABC, the line DE is parallel to BC, with D on AB and E on AC. Which ratio is equal to AD/DB?
hints:
- level: 1
  en: State the theorem about a line parallel to one side of a triangle.
- level: 2
  en: Match each ratio with the two segments on the same side of the triangle.
- level: 3
  en: Compare the two sides cut by DE.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: AE/EC
- id: b
  en: DB/AD
- id: c
  en: EC/AC
- id: d
  en: AE/AC
answer:
  sympy: a
  accept: []
misconception_rules:
