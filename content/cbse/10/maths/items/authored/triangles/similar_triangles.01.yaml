solution_steps:
- en: By the basic proportionality theorem, a line parallel to one side of a triangle divides the other two sides in the same ratio.
- en: So AD/DB = AE/EC.
- en: The correct option is a.
tier: C
diagram_note: Triangle ABC with a straight segment DE drawn from a point D on side AB to a point E on side AC, parallel to the base BC. All five points are labelled.
