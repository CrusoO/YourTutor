answer:
  sympy: '60'
  accept: []
solution_steps:
- en: Corresponding angles of similar triangles are equal, so angle F matches angle C.
- en: Angle C = 180 - 50 - 70 = 60 degrees, so angle F is 60 degrees.
- en: The unit of the answer is degrees.
- en: Answer = 60
