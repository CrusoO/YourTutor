stem:
  en: In triangle ABC, angle A is 50 degrees and angle B is 70 degrees. Triangle DEF is similar to ABC, with D matching A and E matching B. What is angle F in degrees?
hints:
- level: 1
  en: Find the third angle of triangle ABC first.
- level: 2
  en: The angles in a triangle add up to 180 degrees.
- level: 3
  en: Check which angle in DEF corresponds to angle C.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
