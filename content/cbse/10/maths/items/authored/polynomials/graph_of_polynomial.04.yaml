stem:
  en: A quadratic polynomial has its graph crossing the x-axis at x = -2 and x = 4. What is the product of its zeros?
hints:
- level: 1
  en: Identify both x-values where the graph crosses the axis.
- level: 2
  en: Multiply the two zeros together.
- level: 3
  en: Pay attention to the sign of each zero when multiplying.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-8'
  accept: []
solution_steps:
- en: The zeros are -2 and 4, and their product is (-2) × 4 = -8.
- en: The two zeros have opposite signs, so the product is negative.
- en: Answer = -8
tier: C
diagram_note: A parabola opening upward crossing the horizontal x-axis at two points, labelled x = -2 on the left of the origin and x = 4 on the right.
