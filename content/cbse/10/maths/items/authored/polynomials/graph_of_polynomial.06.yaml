stem:
  en: A quadratic polynomial has zeros p and q, with p + q = 3 and pq = -10. What is p² + q²?
hints:
- level: 1
  en: Expand (p + q) squared.
- level: 2
  en: Substitute the given sum and product into the expansion.
- level: 3
  en: Be careful with the sign when you subtract 2pq.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '29'
  accept: []
solution_steps:
- en: Expanding (p + q)² = p² + q² + 2pq gives p² + q² = 3² - 2(-10) = 9 + 20 = 29.
- en: Answer = 29
tier: C
diagram_note: A parabola opening upward, crossing the horizontal x-axis at x = p on the left and x = q on the right of the origin, with both points labelled.
