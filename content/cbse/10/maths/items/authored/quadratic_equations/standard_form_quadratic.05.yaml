stem:
  en: Write (x - 2)(x + 5) = 3x - 4 in the form ax² + bx + c = 0 with a = 1. What is c?
hints:
- level: 1
  en: Expand the product on the left first.
- level: 2
  en: Bring all terms to the left side.
- level: 3
  en: Combine like terms and read off the constant.
