difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Write 4x - 3 = x² + 2 in the form ax² + bx + c = 0, with a positive. What is the value of a + b + c?
hints:
- level: 1
  en: Move every term to one side so that the other side is zero.
- level: 2
  en: Collect the x², x and constant terms carefully.
- level: 3
  en: Check the sign of each coefficient after moving terms.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: Moving every term to one side gives 0 = x² + 2 - 4x + 3, which simplifies to x² - 4x + 5 = 0.
- en: So a = 1, b = -4 and c = 5, and a + b + c = 2.
- en: Answer = 2
tier: C
