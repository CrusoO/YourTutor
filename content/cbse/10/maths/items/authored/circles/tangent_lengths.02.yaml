id: A.10.maths.circles.tangent_lengths.02
skill_ids:
- SK.A.10.maths.tangent_lengths
difficulty: 0.2
pool: practice
role: apply
stem:
  en: From a point T outside a circle with centre O, the tangent TP has length 8 cm and TO = 10 cm. What is the radius in cm?
hints:
- level: 1
  en: Identify the right angle in triangle OPT.
- level: 2
  en: Apply Pythagoras to triangle OPT.
- level: 3
  en: Solve for the unknown radius.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: The radius OP is perpendicular to TP, so OP² = TO² - TP² = 100 - 64 = 36, and OP = 6 cm.
- en: The unit of the answer is cm.
- en: Answer = 6
tier: C
diagram_note: Point T outside a circle with centre O. A tangent segment TP of 8 cm touches the circle at P, and a segment TO of 10 cm joins T to the centre.
