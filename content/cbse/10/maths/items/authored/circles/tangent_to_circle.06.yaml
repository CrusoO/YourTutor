- SK.A.10.maths.tangent_to_circle
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A circle with centre O has radius 5 cm. Tangents from a point T touch it at P and Q, and the angle between the two tangents at T is 90 degrees. Find the length TP in cm.
hints:
- level: 1
  en: Find all the right angles in quadrilateral OPTQ.
- level: 2
  en: Compare the two radii OP and OQ.
- level: 3
  en: Decide what shape OPTQ must be.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: The radii OP and OQ meet the tangents at right angles, so quadrilateral OPTQ has four right angles and two equal adjacent sides.
- en: That makes it a square, so TP equals the radius, 5 cm.
- en: The unit of the answer is cm.
- en: Answer = 5
tier: C
diagram_note: A circle with centre O and radius 5 cm, an external point T with two tangents touching the circle at P and Q, the angle at T marked as a right angle, and the radii OP and OQ drawn.
