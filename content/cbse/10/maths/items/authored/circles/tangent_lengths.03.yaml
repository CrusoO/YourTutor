difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Two tangents TP and TQ are drawn from an external point T to a circle with centre O. The angle PTQ is 60 degrees. What is the angle POQ?
hints:
- level: 1
  en: Draw in the radii to P and Q and find the angles at those points.
- level: 2
  en: Add up the angles of quadrilateral OPTQ.
- level: 3
  en: Recall the total of the angles in any quadrilateral.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
