solution_steps:
- en: The radii OP and OQ are perpendicular to the tangents, so quadrilateral OPTQ has angles 90, 90 and 60 degrees at P, Q and T.
- en: The angle at O is therefore 360 - 240 = 120 degrees.
- en: The correct option is b.
tier: C
diagram_note: An external point T with two tangent lines TP and TQ forming a 60 degree angle at T, touching the circle at P and Q, with the centre O joined to P and Q.
