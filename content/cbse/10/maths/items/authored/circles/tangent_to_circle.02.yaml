difficulty: 0.2
pool: practice
role: recall
stem:
  en: A tangent touches a circle with centre O at P, and OP = 12 cm. A point T on the tangent is 5 cm from P. What is OT in cm?
hints:
- level: 1
  en: Find which angle in triangle OPT is a right angle.
- level: 2
  en: Apply Pythagoras to triangle OPT.
- level: 3
  en: Take the square root of the sum of the squares.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '13'
  accept: []
solution_steps:
- en: OP is perpendicular to PT, so triangle OPT has a right angle at P.
- en: Pythagoras gives OT = √(12² + 5²) = √169 = 13 cm.
- en: The unit of the answer is cm.
- en: Answer = 13
tier: C
diagram_note: A circle with centre O, a radius OP to the point of contact P, and a tangent line through P with a point T on it 5 cm from P. Triangle OPT has its right angle at P.
