stem:
  en: A circle has radius 9 cm. Two tangents are drawn from an external point T, each of length 12 cm, touching the circle at P and Q. What is the length PQ in cm?
hints:
- level: 1
  en: Find the length OT first using Pythagoras.
- level: 2
  en: Find the area of the kite OPTQ by splitting it into two triangles.
- level: 3
  en: The diagonals of a kite are perpendicular.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '14.4'
  accept: []
solution_steps:
- en: OT = √(9² + 12²) = 15 cm.
- en: The kite OPTQ has area 2 × ½ × 9 × 12 = 108 cm², and its diagonals OT and PQ are perpendicular, so ½ × 15 × PQ = 108 and PQ = 14.4 cm.
- en: The unit of the answer is cm.
- en: Answer = 14.4
tier: C
diagram_note: A circle of radius 9 cm with centre O and an external point T joined to O. Two tangents from T touch the circle at P and Q, and the chord PQ is drawn between the contact points.
