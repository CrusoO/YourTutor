stem:
  en: From an external point T, two tangents of length 12 cm each are drawn to a circle, and the angle between them at T is 90 degrees. What is the radius?
hints:
- level: 1
  en: Find the shape of quadrilateral OPTQ.
- level: 2
  en: Look at which sides of that shape are equal.
- level: 3
  en: Relate the radius to one of the tangent lengths.
