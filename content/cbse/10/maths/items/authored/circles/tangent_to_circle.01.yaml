- SK.A.10.maths.tangent_to_circle
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A tangent touches a circle at point P, and O is the centre. What is the angle between the radius OP and the tangent at P?
hints:
- level: 1
  en: Think about how the radius meets the circle at the point of contact.
- level: 2
  en: Recall the property of a tangent at its point of contact.
- level: 3
  en: Name the type of angle formed at P.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 45 degrees
- id: b
  en: 60 degrees
- id: c
  en: 90 degrees
- id: d
  en: 180 degrees
answer:
  sympy: c
  accept: []
misconception_rules:
