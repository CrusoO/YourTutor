solution_steps:
- en: A tangent is perpendicular to the radius drawn to the point of contact.
- en: So the angle between OP and the tangent is 90 degrees.
- en: The correct option is c.
tier: C
diagram_note: A circle with centre O, a radius OP drawn to a point P on the circle, and a straight line touching the circle only at P.
