id: A.10.maths.circles.tangent_to_circle.04
skill_ids:
- SK.A.10.maths.tangent_to_circle
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A circle has centre O and radius 7 cm. A tangent touches it at P, and T is a point on the tangent with OT = 25 cm. What is PT in cm?
hints:
- level: 1
  en: Identify the right angle in the figure.
- level: 2
  en: Use Pythagoras to write PT squared.
- level: 3
  en: Subtract the square of the radius from the square of OT.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '24'
  accept: []
solution_steps:
- en: The radius OP is perpendicular to PT, so PT² = OT² - OP² = 625 - 49 = 576.
- en: Thus PT = 24 cm.
- en: The unit of the answer is cm.
- en: Answer = 24
tier: C
