solution_steps:
- en: Each radius to a point of contact is perpendicular to both parallel tangents, so the two radii lie along one straight line through the centre.
- en: That makes PQ a diameter, which is 2 × 4 = 8 cm.
- en: The correct option is c.
tier: C
diagram_note: A circle of radius 4 cm with two horizontal parallel tangent lines, one touching the top of the circle and one touching the bottom, with the contact points labelled P and Q.
