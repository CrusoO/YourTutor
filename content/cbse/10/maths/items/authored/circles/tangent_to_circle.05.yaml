stem:
  en: Two parallel tangents touch a circle of radius 4 cm at the points P and Q. What is the distance PQ?
hints:
- level: 1
  en: Think about the direction of each radius at a point of contact.
- level: 2
  en: Ask which chord of the circle joins P and Q.
- level: 3
  en: Use the radius to find the length of that chord.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
