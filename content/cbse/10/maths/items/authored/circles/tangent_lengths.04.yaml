stem:
  en: From an external point T, a tangent of length 15 cm touches a circle of radius 8 cm. What is the distance TO in cm?
hints:
- level: 1
  en: Find the right angle in triangle OPT.
- level: 2
  en: Write OT squared as the sum of the two squares.
- level: 3
  en: Take the square root.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '17'
  accept: []
solution_steps:
- en: The radius to the point of contact is perpendicular to the tangent, so OT² = 15² + 8² = 225 + 64 = 289, giving OT = 17 cm.
- en: The unit of the answer is cm.
- en: Answer = 17
tier: C
