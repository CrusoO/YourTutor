difficulty: 0.2
pool: practice
role: recall
stem:
  en: From an external point T, two tangents touch a circle at P and Q. If TP = 7 cm, what is TQ?
hints:
- level: 1
  en: Look at the two right triangles that contain the centre.
- level: 2
  en: Compare the sides of those triangles.
- level: 3
  en: Ask which sides are radii.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
