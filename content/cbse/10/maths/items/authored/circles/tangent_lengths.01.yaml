solution_steps:
- en: Tangents drawn from one external point are equal.
- en: Triangles OPT and OQT share the hypotenuse OT, have equal radii and right angles at P and Q, so TQ = TP = 7 cm.
- en: The correct option is d.
tier: C
diagram_note: An external point T with two straight lines from T touching a circle at points P and Q, and the centre O joined to T, P and Q.
