  author: model-draft
type: mcq
options:
- id: a
  en: 3.5 cm
- id: b
  en: 14 cm
- id: c
  en: 49 cm
- id: d
  en: 7 cm
answer:
  sympy: d
  accept: []
misconception_rules:
