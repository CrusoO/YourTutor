stem:
  en: The nth term of a sequence is 3n² + 1. Is this sequence an arithmetic progression?
hints:
- level: 1
  en: Compute the first three terms from the formula.
- level: 2
  en: Find the difference between each pair of consecutive terms.
- level: 3
  en: Check whether those differences match.
