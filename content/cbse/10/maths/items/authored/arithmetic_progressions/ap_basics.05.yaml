stem:
  en: In an arithmetic progression the 3rd term is 11 and the 10th term is 39. What is the first term?
hints:
- level: 1
  en: Write the two given terms using the first term and the common difference.
- level: 2
  en: Subtract one equation from the other to find d.
- level: 3
  en: Use the value of d to go back to the first term.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: The 10th term minus the 3rd term is 7d = 28, so d = 4.
- en: Then the first term is 11 - 2 × 4 = 3.
- en: Answer = 3
tier: C
