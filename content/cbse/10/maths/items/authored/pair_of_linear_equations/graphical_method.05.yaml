stem:
  en: The lines 3x + 2y = 12 and 2x - y = 1 cross at one point. What is the sum of the x- and y-coordinates of that point?
hints:
- level: 1
  en: Solve the second equation for y.
- level: 2
  en: Substitute that expression into the first equation.
- level: 3
  en: Find both coordinates before adding them.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
