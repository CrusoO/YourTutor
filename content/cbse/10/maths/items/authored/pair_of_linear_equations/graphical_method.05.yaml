  author: model-draft
type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: From the second equation y = 2x - 1.
- en: Substituting into the first gives 3x + 4x - 2 = 12, so x = 2 and y = 3.
- en: The sum is 5.
- en: Answer = 5
