id: A.10.maths.pair_of_linear_equations.graphical_method.04
skill_ids:
- SK.A.10.maths.graphical_method
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Which description matches the graphs of x + y = 4 and x - y = 0?
hints:
- level: 1
  en: Solve the two equations together, perhaps by adding them.
- level: 2
  en: Check each option in both equations.
- level: 3
  en: Look at where each line crosses the axes, but do not stop there.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Two parallel lines with slope 1.
- id: b
  en: Two lines crossing at (4, 0).
- id: c
  en: Two lines crossing at (2, 2).
- id: d
  en: Two lines crossing at (0, 4).
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.78CFB802C3A3
  when_answer_equals:
  - a
- id: MC.A.9B6865C76223
  when_answer_equals:
  - b
- id: MC.A.B95B74BD6770
  when_answer_equals:
  - d
solution_steps:
- en: Adding the equations gives 2x = 4, so x = 2, and then x - y = 0 gives y = 2.
- en: The lines cross at (2, 2).
- en: The correct option is c.
tier: C
diagram_note: 'Two straight lines on the same axes: one through the points (4, 0) and (0, 4), and the other through the origin with slope 1.'
