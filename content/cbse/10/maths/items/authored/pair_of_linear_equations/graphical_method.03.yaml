stem:
  en: The lines x - 2y = 1 and 2x + ky = 4 are parallel and distinct. What is k?
hints:
- level: 1
  en: Write each equation in the form ax + by = c.
- level: 2
  en: Set the ratio of the x-coefficients equal to the ratio of the y-coefficients.
- level: 3
  en: Solve the resulting equation for k.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-4'
  accept: []
solution_steps:
- en: 'Parallel lines need equal ratios of x-coefficients and y-coefficients: 1/2 = -2/k, which gives k = -4.'
- en: The constants 1 and 4 have a different ratio, so the lines are distinct.
- en: Answer = -4
tier: C
