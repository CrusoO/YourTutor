stem:
  en: An element has two isotopes with mass numbers 10 and 12, present in equal amounts. What is the average mass number?
hints:
- level: 1
  en: When the two shares are equal, the average is the midpoint of the two values.
- level: 2
  en: Add the two mass numbers and divide by how many there are.
- level: 3
  en: Check whether your result lies between the two values, as an average should.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '11'
  accept: []
solution_steps:
- en: With equal amounts of the two isotopes, the average is the midpoint of 10 and 12, which is 11.
- en: Answer = 11
tier: C
