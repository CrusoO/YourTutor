stem:
  en: A chlorine atom has 7 electrons in its outermost shell. What is its valency?
hints:
- level: 1
  en: Count how many electrons the atom would need to gain to fill its outer shell.
- level: 2
  en: Compare the outer count with the full outer shell.
- level: 3
  en: Valency is the smaller of the gain and loss counts for this atom.
