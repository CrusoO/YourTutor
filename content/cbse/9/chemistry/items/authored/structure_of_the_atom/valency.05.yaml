difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Element X has 3 electrons in its outer shell and element Y has 6. What is the most likely formula of the compound formed between them?
hints:
- level: 1
  en: Cross the valencies over so that each becomes the subscript of the other element.
- level: 2
  en: Find the valency of each element from its outer electron count.
- level: 3
  en: Reduce the subscripts to the simplest whole-number ratio if needed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
