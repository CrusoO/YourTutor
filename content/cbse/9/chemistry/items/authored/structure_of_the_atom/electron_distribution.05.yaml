stem:
  en: The diagram shows an atom with four shells holding two, eight, eight and two electrons. What is its atomic number?
hints:
- level: 1
  en: Add the dots across all the rings.
- level: 2
  en: The atomic number equals the total electron count of a neutral atom.
- level: 3
  en: Check that the outermost ring is the last one you counted.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '20'
  accept: []
solution_steps:
- en: The total electron count is 2 plus 8 plus 8 plus 2, which is 20, and a neutral atom has as many protons as electrons.
- en: Answer = 20
tier: C
diagram_note: A nucleus with four concentric rings; the rings hold two, eight, eight and two dots, moving outward from the centre.
