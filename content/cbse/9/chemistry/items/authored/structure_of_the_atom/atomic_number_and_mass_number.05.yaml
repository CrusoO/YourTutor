stem:
  en: An ion contains 9 protons, 10 electrons and 10 neutrons. What is its mass number?
hints:
- level: 1
  en: Add the protons and neutrons, since electrons contribute negligible mass.
- level: 2
  en: Ignore the electron count when working out the mass number.
- level: 3
  en: The mass number counts only the particles inside the nucleus.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '19'
  accept: []
solution_steps:
- en: The mass number is the number of protons plus neutrons, which is 9 plus 10.
- en: The extra electrons do not change the mass number.
- en: Answer = 19
tier: C
