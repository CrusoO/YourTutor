id: A.9.chemistry.structure_of_the_atom.isotopes_and_isobars.04
skill_ids:
- SK.A.9.chemistry.isotopes_and_isobars
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why do isotopes of the same element show almost identical chemical behaviour?
hints:
- level: 1
  en: Think about which particles take part in forming chemical bonds.
- level: 2
  en: Ask whether isotopes differ in the number of protons or only in the number of neutrons.
- level: 3
  en: Consider how the electrons of an atom are arranged around the nucleus.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: they have the same mass number
- id: b
  en: they contain the same number of neutrons
- id: c
  en: they have the same number of electrons, so the same electron arrangement
- id: d
  en: they have identical nuclear sizes
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.415E7CD6D523
  when_answer_equals:
  - a
- id: MC.A.CA3319E3241B
  when_answer_equals:
  - b
- id: MC.A.2CBBD770EB4F
  when_answer_equals:
  - d
solution_steps:
- en: Chemical behaviour depends on the electrons, which take part in bonding.
- en: Isotopes have the same number of electrons, so they bond in the same way even though their masses differ.
- en: The correct option is c.
tier: C
diagram_note: Two atom drawings side by side, each with identical electron shells around a nucleus; the nucleus of the second drawing contains two more neutral particles than the first.
