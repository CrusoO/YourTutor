id: A.9.chemistry.structure_of_the_atom.atomic_models.01
skill_ids:
- SK.A.9.chemistry.atomic_models
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In Thomson's model of the atom, how was the positive charge arranged?
hints:
- level: 1
  en: Think of the model where electrons are embedded like seeds in a fruit.
- level: 2
  en: Consider whether the positive part was thought to be a single small point.
- level: 3
  en: Consider how the positive charge would be distributed if the whole atom were a soft mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: concentrated in a tiny nucleus at the centre
- id: b
  en: arranged in fixed shells around the nucleus
- id: c
  en: present only on the orbiting electrons
- id: d
  en: spread uniformly throughout a sphere
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.910F17CA766F
  when_answer_equals:
  - a
- id: MC.A.25153AB657FB
  when_answer_equals:
  - c
- id: MC.A.BDA11A7F8CAC
  when_answer_equals:
  - b
solution_steps:
- en: In Thomson's model, the atom is a sphere of positive charge in which the negative electrons are embedded, a picture often described as a plum pudding.
- en: The correct option is d.
tier: C
