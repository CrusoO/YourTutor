id: A.9.chemistry.structure_of_the_atom.electron_distribution.06
skill_ids:
- SK.A.9.chemistry.electron_distribution
difficulty: 0.9
pool: practice
role: explain
stem:
  en: An atom has 19 electrons arranged as 2, 8, 8, 1. Which statement about its outermost shell is correct?
hints:
- level: 1
  en: Look at the last number in the arrangement.
- level: 2
  en: Think about which shell is the furthest from the nucleus.
- level: 3
  en: Consider how many electrons the outermost shell has compared with a full shell.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the outermost shell holds one electron, which the atom tends to lose
- id: b
  en: the outermost shell is full with eight electrons
- id: c
  en: the outermost shell holds two electrons, which the atom tends to gain
- id: d
  en: the outermost shell holds all 19 electrons
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.39F274887DC3
  when_answer_equals:
  - b
- id: MC.A.2EC8E1262004
  when_answer_equals:
  - d
- id: MC.A.BAE19B51F2AC
  when_answer_equals:
  - c
solution_steps:
- en: The last number in the arrangement, 1, is the outermost shell.
- en: An atom with a single outer electron tends to lose it to reach a stable arrangement.
- en: The correct option is a.
tier: C
diagram_note: Concentric rings around a central nucleus showing 2, 8, 8 and 1 dots from the centre outward, with a single dot in the outermost ring.
