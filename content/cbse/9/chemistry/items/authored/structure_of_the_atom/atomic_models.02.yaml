id: A.9.chemistry.structure_of_the_atom.atomic_models.02
skill_ids:
- SK.A.9.chemistry.atomic_models
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What did the gold foil experiment by Rutherford and his co-workers reveal about the atom?
hints:
- level: 1
  en: Most alpha particles passed through the foil with little deflection.
- level: 2
  en: A few particles were deflected through very large angles.
- level: 3
  en: Ask what structure could let most particles pass while a few bounce back.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: atoms are solid spheres of matter throughout
- id: b
  en: most of the atom is empty space with a small dense positive nucleus
- id: c
  en: electrons move in fixed circular shells
- id: d
  en: the atom is a uniform sphere of positive charge
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.5E3B32F4B57F
  when_answer_equals:
  - d
- id: MC.A.D74A11E27B58
  when_answer_equals:
  - c
- id: MC.A.B09995390BF1
  when_answer_equals:
  - a
solution_steps:
- en: Most alpha particles passed straight through the gold foil, while a few were deflected sharply.
- en: This showed that the atom is mostly empty space with a small, dense, positively charged nucleus.
- en: The correct option is b.
tier: C
