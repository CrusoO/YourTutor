id: A.9.chemistry.structure_of_the_atom.atomic_models.03
skill_ids:
- SK.A.9.chemistry.atomic_models
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A few alpha particles in a scattering experiment were deflected through very large angles. What does this suggest about the positive charge in an atom?
hints:
- level: 1
  en: Think about what kind of structure would deflect a fast particle sharply.
- level: 2
  en: Compare how many particles passed straight through with the few that were turned back.
- level: 3
  en: Consider how much space the charge would occupy to produce such strong deflections.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it is spread throughout the whole atom
- id: b
  en: it is carried mainly by the electrons
- id: c
  en: the foil has no charge at all
- id: d
  en: it is concentrated in a small, dense region
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.AAB22EF5AE8B
  when_answer_equals:
  - a
- id: MC.A.25C665714F47
  when_answer_equals:
  - b
- id: MC.A.8BF6547536B9
  when_answer_equals:
  - c
solution_steps:
- en: Only a small, dense positive centre can push back fast, heavy alpha particles so strongly.
- en: A charge spread over the whole atom would deflect them only slightly.
- en: The correct option is d.
tier: C
diagram_note: A thin metal foil in the centre, a narrow beam of alpha particles entering from the left, and a circular detector screen around the foil; some paths pass straight through while a few bend sharply back.
