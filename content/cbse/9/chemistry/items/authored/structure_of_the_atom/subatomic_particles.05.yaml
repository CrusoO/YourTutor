stem:
  en: An atom with 12 protons loses two electrons to form an ion. Which statement about this ion is correct?
hints:
- level: 1
  en: Think about how the charge of an ion changes when electrons are removed.
- level: 2
  en: Ask whether losing electrons makes a particle more positive or more negative.
- level: 3
  en: Subtract the lost electrons from the original electron count.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
