  author: model-draft
type: mcq
options:
- id: a
  en: A and B
- id: b
  en: A and C, because both have an odd number of neutrons
- id: c
  en: B and C, because their mass numbers are equal
- id: d
  en: A and C, because their mass numbers are close
answer:
  sympy: a
  accept: []
