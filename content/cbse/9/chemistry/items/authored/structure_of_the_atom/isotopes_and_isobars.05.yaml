stem:
  en: Atom A has 8 protons and 9 neutrons, atom B has 8 protons and 10 neutrons, and atom C has 9 protons and 9 neutrons. Which pair are isotopes?
hints:
- level: 1
  en: Isotopes share the number that defines the element.
- level: 2
  en: Compare the proton count of each atom in the pair.
- level: 3
  en: Check whether the pair belongs to the same element before comparing neutron counts.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
