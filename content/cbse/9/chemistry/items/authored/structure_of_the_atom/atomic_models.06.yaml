id: A.9.chemistry.structure_of_the_atom.atomic_models.06
skill_ids:
- SK.A.9.chemistry.atomic_models
difficulty: 0.9
pool: practice
role: explain
stem:
  en: A sketch shows a dense central nucleus with electrons drawn on fixed circular tracks. Which statement is not part of the modern picture of the atom?
hints:
- level: 1
  en: Think about whether modern descriptions of electrons use fixed circular tracks.
- level: 2
  en: Compare each statement with what the scattering experiments established about the nucleus.
- level: 3
  en: Ask which statement describes electrons as moving on exact paths.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the nucleus is very small compared with the whole atom
- id: b
  en: electrons occupy a region of space around the nucleus
- id: c
  en: the nucleus holds most of the atom's mass
- id: d
  en: electrons follow sharply defined circular paths
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.5EAE7AB1A31E
  when_answer_equals:
  - c
- id: MC.A.CA05C4EACB44
  when_answer_equals:
  - b
- id: MC.A.6036D693C612
  when_answer_equals:
  - a
solution_steps:
- en: Modern descriptions treat electrons as occupying regions of probable location rather than fixed circular tracks.
- en: The nucleus's mass and small size are supported by scattering evidence.
- en: The correct option is d.
tier: C
diagram_note: Concentric circular tracks drawn around a filled central circle labelled nucleus, with small dots placed on the tracks to represent electrons.
