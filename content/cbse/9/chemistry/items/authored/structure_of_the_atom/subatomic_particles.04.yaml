stem:
  en: An atom has 11 protons and 12 neutrons. What is its mass number?
hints:
- level: 1
  en: Add the number of protons to the number of neutrons.
- level: 2
  en: Electrons add almost no mass, so leave them out of this count.
- level: 3
  en: The mass number counts only the particles inside the nucleus.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
