id: A.9.chemistry.structure_of_the_atom.atomic_number_and_mass_number.04
skill_ids:
- SK.A.9.chemistry.atomic_number_and_mass_number
difficulty: 0.6
pool: practice
role: explain
stem:
  en: An atom has 15 protons and 16 neutrons. Which statement about its mass number and charge is correct?
hints:
- level: 1
  en: Mass number is the total of protons and neutrons.
- level: 2
  en: A neutral atom has electrons equal in number to its protons.
- level: 3
  en: Compare each statement's mass number with the total you calculate.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: mass number 31 and negative when it has 15 electrons
- id: b
  en: mass number 15 and neutral when it has 16 electrons
- id: c
  en: mass number 16 and neutral when it has 15 electrons
- id: d
  en: mass number 31 and neutral when it has 15 electrons
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.B98357388B6B
  when_answer_equals:
  - c
- id: MC.A.FCAA8D48F3F5
  when_answer_equals:
  - a
- id: MC.A.BD21833E62AC
  when_answer_equals:
  - b
solution_steps:
- en: The mass number is the total of protons and neutrons, 15 plus 16, which is 31.
- en: With 15 electrons matching 15 protons, the atom is neutral.
- en: The correct option is d.
tier: C
