id: A.9.chemistry.structure_of_the_atom.electron_distribution.03
skill_ids:
- SK.A.9.chemistry.electron_distribution
difficulty: 0.6
pool: practice
role: apply
stem:
  en: An atom has 13 electrons. Using shell capacities of 2, 8 and 18 in that order, how many electrons are in its outermost shell?
hints:
- level: 1
  en: Fill the innermost shell to its capacity before placing electrons in the next one.
- level: 2
  en: Subtract the electrons held by the inner shells from the total.
- level: 3
  en: The outermost shell holds whatever remains after the inner shells are full.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: The first shell takes 2 and the second takes 8, leaving 3 electrons for the third shell, which is therefore the outermost shell.
- en: Answer = 3
tier: C
