id: A.9.chemistry.structure_of_the_atom.atomic_number_and_mass_number.01
skill_ids:
- SK.A.9.chemistry.atomic_number_and_mass_number
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What does the atomic number of an element represent?
hints:
- level: 1
  en: Think about the particle that defines which element an atom belongs to.
- level: 2
  en: The positive charge of the nucleus is counted by this number.
- level: 3
  en: This number is the same for all atoms of a given element.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the number of electrons in its outer shell
- id: b
  en: the number of neutrons in its nucleus
- id: c
  en: the number of protons and neutrons together
- id: d
  en: the number of protons in its nucleus
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.905CF5A22F60
  when_answer_equals:
  - c
- id: MC.A.85F7BFFBE110
  when_answer_equals:
  - a
- id: MC.A.0FB81B2EE10C
  when_answer_equals:
  - b
solution_steps:
- en: The atomic number is the count of protons in the nucleus, and it identifies the element.
- en: All atoms of one element have the same atomic number.
- en: The correct option is d.
tier: C
