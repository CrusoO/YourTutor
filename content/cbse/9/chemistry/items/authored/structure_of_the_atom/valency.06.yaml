id: A.9.chemistry.structure_of_the_atom.valency.06
skill_ids:
- SK.A.9.chemistry.valency
difficulty: 0.9
pool: practice
role: explain
stem:
  en: An atom has 5 electrons in its outer shell. How many electrons must it gain to complete that shell?
hints:
- level: 1
  en: Compare the outer count with the full capacity of the outer shell for a stable group.
- level: 2
  en: Subtract the current outer count from the full capacity.
- level: 3
  en: The result is a count of electrons, so give it as a whole number.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: The full outer shell holds 8 electrons for this group, so 8 minus 5 gives 3 electrons that must be gained.
- en: Answer = 3
tier: C
