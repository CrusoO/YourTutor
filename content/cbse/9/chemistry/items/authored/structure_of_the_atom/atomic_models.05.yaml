id: A.9.chemistry.structure_of_the_atom.atomic_models.05
skill_ids:
- SK.A.9.chemistry.atomic_models
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Thomson's model and Rutherford's model predict different deflection patterns for alpha particles on thin gold foil. Which observation clearly favours Rutherford's model?
hints:
- level: 1
  en: Think about how much deflection a spread-out positive charge could produce.
- level: 2
  en: Ask which kind of deflection would be rare if the charge were uniformly spread.
- level: 3
  en: Consider which particles were fired at the foil in the experiment.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: a few particles are deflected by large angles, which a spread-out positive charge cannot produce
- id: b
  en: no particle is deflected at all
- id: c
  en: electrons are scattered more strongly than alpha particles
- id: d
  en: all particles are deflected by the same small angle
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.D0956C7C70DE
  when_answer_equals:
  - d
- id: MC.A.2438B7E867CF
  when_answer_equals:
  - b
- id: MC.A.6A0F4D3E1B76
  when_answer_equals:
  - c
solution_steps:
- en: A uniformly spread positive charge can produce only small deflections, so the observed large-angle scattering points to a concentrated nucleus.
- en: The correct option is a.
tier: C
