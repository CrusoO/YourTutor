difficulty: 0.2
pool: practice
role: recall
stem:
  en: An atom has atomic number 6 and mass number 12. How many neutrons does it have?
hints:
- level: 1
  en: Subtract the atomic number from the mass number.
- level: 2
  en: Neutrons are the nuclear particles that are neither protons nor electrons.
- level: 3
  en: Check that the protons and neutrons add up to the mass number.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: Neutrons equal the mass number minus the atomic number, so 12 minus 6 gives 6 neutrons.
- en: Answer = 6
tier: C
