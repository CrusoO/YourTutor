type: mcq
options:
- id: a
  en: oxygen always gains exactly two protons
- id: b
  en: oxygen shares all six outer electrons with one partner
- id: c
  en: oxygen has 6 outer electrons and needs 2 more to fill its outer shell
- id: d
  en: oxygen has six shells
answer:
  sympy: c
  accept: []
