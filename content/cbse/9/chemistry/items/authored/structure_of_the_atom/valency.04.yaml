stem:
  en: Why is the valency of oxygen 2 rather than 6?
hints:
- level: 1
  en: Count the electrons in the outermost shell first.
- level: 2
  en: Ask how many more electrons the outer shell needs to become full.
- level: 3
  en: Consider which quantity changes when an atom forms bonds.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
