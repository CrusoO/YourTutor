id: A.9.chemistry.structure_of_the_atom.electron_distribution.04
skill_ids:
- SK.A.9.chemistry.electron_distribution
difficulty: 0.6
pool: practice
role: apply
stem:
  en: The diagram shows an atom with its electrons arranged in three shells. Which element does this arrangement belong to?
hints:
- level: 1
  en: Add the dots in all the rings to get the total electron count.
- level: 2
  en: Find the element whose atomic number equals that total.
- level: 3
  en: Check the outer ring count to confirm which group the element belongs to.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: selenium
- id: b
  en: chlorine
- id: c
  en: sulphur
- id: d
  en: oxygen
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.C4C07EDC1D65
  when_answer_equals:
  - d
- id: MC.A.05E60ED2C67B
  when_answer_equals:
