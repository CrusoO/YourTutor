solution_steps:
- en: The shells hold 2, 8 and 6 electrons, a total of 16, and the element with atomic number 16 is sulphur.
- en: The correct option is c.
tier: C
diagram_note: A nucleus at the centre with three concentric rings; the innermost ring holds two dots, the middle ring eight dots and the outer ring six dots.
