id: A.9.chemistry.matter_in_our_surroundings.particle_nature.02
skill_ids:
- SK.A.9.chemistry.particle_nature
difficulty: 0.2
pool: practice
role: recall
stem:
  en: According to the kinetic model, what is true about the particles of every kind of matter?
hints:
- level: 1
  en: Think about what the kinetic model says about particle motion rather than particle size.
- level: 2
  en: Consider whether particles in a gas are moving even when the gas looks still.
- level: 3
  en: Pick the option that describes a motion that never switches off.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: they are at rest at room temperature
- id: b
  en: they are held in fixed lattice points
- id: c
  en: they are all the same size and mass
- id: d
  en: they are in constant random motion
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.2D14F9742C0B
  when_answer_equals:
  - a
- id: MC.A.A04A88D71C59
  when_answer_equals:
  - c
- id: MC.A.9DAF64C2B021
  when_answer_equals:
  - b
solution_steps:
- en: The kinetic model says that all matter is made of particles that keep moving at random, and that they move faster when the temperature rises.
- en: Particles are not at rest even when a sample looks still.
- en: The correct option is d.
tier: C
