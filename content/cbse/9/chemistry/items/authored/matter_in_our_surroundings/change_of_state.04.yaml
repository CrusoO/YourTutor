id: A.9.chemistry.matter_in_our_surroundings.change_of_state.04
skill_ids:
- SK.A.9.chemistry.change_of_state
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A mixture of melting ice and water at 0 degrees Celsius is heated steadily. What happens to the temperature while some ice is still present?
hints:
- level: 1
  en: Think about where the supplied heat goes during melting.
- level: 2
  en: Consider whether the particles are gaining energy to break free or to move faster.
- level: 3
  en: Ask whether the temperature could change while two states are both present.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it falls because the water cools
- id: b
  en: it stays constant
- id: c
  en: it rises steadily
- id: d
  en: it rises only after all the ice has melted
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.22E6F9B51D21
  when_answer_equals:
  - c
- id: MC.A.352CE46A0411
  when_answer_equals:
  - a
- id: MC.A.2CDB69010577
  when_answer_equals:
  - d
solution_steps:
- en: The heat supplied during melting breaks the forces holding the particles in place (latent heat), so the temperature stays steady until all the ice has melted.
- en: The correct option is b.
tier: C
diagram_note: A beaker holding ice and water together with a thermometer standing in the mixture, placed over a gentle flame.
