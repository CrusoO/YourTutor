id: A.9.chemistry.matter_in_our_surroundings.states_of_matter.04
skill_ids:
- SK.A.9.chemistry.states_of_matter
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A gas is trapped in a sealed syringe and the plunger is pushed in, reducing the volume. What does this show about the particles?
hints:
- level: 1
  en: Think about how much room exists between particles in a gas compared with a solid.
- level: 2
  en: Ask what happens to the free space when the plunger pushes inward.
- level: 3
  en: Consider whether the particles keep their positions or can be pushed closer together.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: they expand when they are compressed
- id: b
  en: they are far apart and the spaces between them can be reduced
- id: c
  en: the gas turns into a liquid as soon as the plunger moves
- id: d
  en: they are fixed in position so they cannot move closer
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.83C4AB0C8227
  when_answer_equals:
  - a
- id: MC.A.612C1D67E002
  when_answer_equals:
  - d
- id: MC.A.3B43DBB19545
  when_answer_equals:
  - c
solution_steps:
- en: Gas particles are widely separated, so the plunger pushes them closer together until the space is smaller.
- en: The particles do not turn into a liquid, and they are not fixed in place.
- en: The correct option is b.
tier: C
diagram_note: A gas-filled syringe with its plunger partly pushed in, drawn with dots that stand for gas particles spread through the barrel.
