stem:
  en: What is the name of the change when a solid turns directly into a gas without first becoming a liquid?
hints:
- level: 1
  en: Think of a substance such as dry ice that disappears without leaving a puddle.
- level: 2
  en: The change skips the liquid stage entirely.
- level: 3
  en: Name the change that takes a solid directly to vapour.
