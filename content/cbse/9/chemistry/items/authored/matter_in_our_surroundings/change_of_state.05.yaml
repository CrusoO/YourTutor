id: A.9.chemistry.matter_in_our_surroundings.change_of_state.05
skill_ids:
- SK.A.9.chemistry.change_of_state
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A solid placed in an open tray slowly shrinks and disappears without any liquid forming. Which best describes what happens to its particles?
hints:
- level: 1
  en: Think about whether a liquid stage must appear for the solid to disappear.
- level: 2
  en: Think about how the particles at the top surface can break away from the rest.
- level: 3
  en: Ask whether the loss of matter means particles were lost or changed state.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: particles melt first and then evaporate from a puddle
- id: b
  en: particles lose energy and condense back into the tray
- id: c
  en: particles at the surface gain enough energy to escape as vapour directly
- id: d
  en: particles become heavier and sink into the tray
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.F87BCF5A253D
  when_answer_equals:
  - a
- id: MC.A.B1BEE634323E
  when_answer_equals:
  - b
- id: MC.A.447D088855A4
  when_answer_equals:
  - d
solution_steps:
- en: Some solids change straight into vapour at the surface, a change called sublimation.
- en: The particles leave without passing through a liquid, so no puddle forms.
- en: The correct option is c.
tier: C
