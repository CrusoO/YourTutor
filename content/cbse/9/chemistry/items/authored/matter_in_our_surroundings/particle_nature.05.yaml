id: A.9.chemistry.matter_in_our_surroundings.particle_nature.05
skill_ids:
- SK.A.9.chemistry.particle_nature
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Two gases at the same temperature are released in one corner of a closed room. Gas A has lighter particles than gas B. Which statement is best supported by the kinetic model?
hints:
- level: 1
  en: Think about the kinetic energy the particles share at the same temperature.
- level: 2
  en: Ask which of the two particles must be moving faster to carry the same energy.
- level: 3
  en: Consider how mass and speed are linked when the energy is fixed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: gas B spreads faster because its particles are packed more closely
- id: b
  en: both gases spread at the same rate because the temperature is equal
- id: c
  en: gas A spreads faster because its lighter particles move at higher average speeds
- id: d
  en: gas B spreads faster because its heavier particles push harder
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.364BCE3BEC56
  when_answer_equals:
  - d
- id: MC.A.6174047B8C39
  when_answer_equals:
  - b
- id: MC.A.056FCB155333
  when_answer_equals:
  - a
solution_steps:
- en: At the same temperature the average kinetic energy of the particles is the same, so the lighter particles must move faster on average and spread more quickly.
- en: The correct option is c.
tier: C
