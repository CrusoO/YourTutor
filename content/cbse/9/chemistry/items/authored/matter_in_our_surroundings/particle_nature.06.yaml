id: A.9.chemistry.matter_in_our_surroundings.particle_nature.06
skill_ids:
- SK.A.9.chemistry.particle_nature
difficulty: 0.9
pool: practice
role: explain
stem:
  en: Why does diffusion take much longer in a liquid than in a gas at the same temperature?
hints:
- level: 1
  en: Compare how far a particle can travel before it bumps into another one in each state.
- level: 2
  en: Ask how crowded the particles of a liquid are compared with a gas.
- level: 3
  en: Consider whether particles in a liquid move in long straight lines.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: particles in a liquid collide with neighbours far more often, so their paths are short and zigzag
- id: b
  en: liquid particles move in one fixed direction only
- id: c
  en: liquids have no spaces between their particles at all
- id: d
  en: particles in liquids are heavier than gas particles
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.A02F888A3626
  when_answer_equals:
  - d
- id: MC.A.7EA2ED1D9C09
  when_answer_equals:
  - c
- id: MC.A.7A898354CDDB
  when_answer_equals:
  - b
solution_steps:
- en: Liquid particles are packed close together, so each one is knocked about constantly and makes little net progress.
- en: Gas particles travel much farther between collisions, so the spreading is faster.
- en: The correct option is a.
tier: C
