id: A.9.chemistry.matter_in_our_surroundings.particle_nature.04
skill_ids:
- SK.A.9.chemistry.particle_nature
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Water and ethanol are mixed in a closed flask and left for several days. Ethanol particles are found throughout the water. Which property of particles explains this?
hints:
- level: 1
  en: Think about whether particles in a liquid are still or moving.
- level: 2
  en: Ask what would make ethanol particles reach the bottom of the flask.
- level: 3
  en: Consider whether the size of a particle decides if it can spread.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: water particles are fixed and ethanol particles are pushed through them
- id: b
  en: ethanol particles are too large to pass through water
- id: c
  en: particles stop moving once they mix
- id: d
  en: particles keep moving and fill the gaps between other particles
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.8BF176E0330C
  when_answer_equals:
  - c
- id: MC.A.F75CB57806E8
  when_answer_equals:
  - b
- id: MC.A.FF059C60E5DB
  when_answer_equals:
  - a
solution_steps:
- en: Particles in liquids are always moving, so ethanol particles gradually spread into the gaps between water particles until the mixture is even throughout.
- en: The correct option is d.
tier: C
