id: A.9.chemistry.matter_in_our_surroundings.states_of_matter.02
skill_ids:
- SK.A.9.chemistry.states_of_matter
difficulty: 0.2
pool: practice
role: explain
stem:
  en: Why can a gas be squeezed into a much smaller volume than a solid of the same mass can?
hints:
- level: 1
  en: Compare how much empty room lies between particles in the two states.
- level: 2
  en: Ask whether the particles of a gas are free to move or fixed in place.
- level: 3
  en: Think about what gets reduced when a plunger pushes a gas into a smaller space.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: its particles are bonded into long chains
- id: b
  en: its particles are heavier than those of a solid
- id: c
  en: its particles are separated by large spaces
- id: d
  en: its particles are arranged in fixed layers
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.50D7FEB7C543
  when_answer_equals:
  - a
- id: MC.A.B7FF06EB1502
  when_answer_equals:
  - b
- id: MC.A.7F51C3D2F340
  when_answer_equals:
