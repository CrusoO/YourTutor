id: A.9.chemistry.matter_in_our_surroundings.states_of_matter.01
skill_ids:
- SK.A.9.chemistry.states_of_matter
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which state of matter keeps a definite shape and a definite volume because its particles are held in fixed positions?
hints:
- level: 1
  en: Think about which state keeps its own shape without any container.
- level: 2
  en: Consider how closely the particles are packed and whether they can slide over each other.
- level: 3
  en: Pick the state where particles only vibrate about fixed places.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: suspension
- id: b
  en: solid
- id: c
  en: gas
- id: d
  en: liquid
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.3D7B73A7B9FF
  when_answer_equals:
  - d
- id: MC.A.D1949A0245F4
  when_answer_equals:
