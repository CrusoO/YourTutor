id: A.9.chemistry.matter_in_our_surroundings.states_of_matter.06
skill_ids:
- SK.A.9.chemistry.states_of_matter
difficulty: 0.9
pool: practice
role: explain
stem:
  en: A figure shows the same substance in three states, with dots for particles drawn at equal scale. Which state shows the widest average spacing between its particles?
hints:
- level: 1
  en: Compare how crowded the dots look in each state.
- level: 2
  en: Think about which state lets its particles spread out to fill a container.
- level: 3
  en: Ask which state has the most empty room between its dots.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: solid
- id: b
  en: liquid
- id: c
  en: all three states show equal spacing
- id: d
  en: gas
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.E9D785C9810A
  when_answer_equals:
  - a
- id: MC.A.3B4757056B4E
  when_answer_equals:
  - b
- id: MC.A.041E8D87E3F0
  when_answer_equals:
  - c
solution_steps:
- en: In a gas the particles are far apart and move freely, so the dots in the gas box have the most empty room between them.
- en: The solid dots are the closest together.
- en: The correct option is d.
tier: C
diagram_note: Three square boxes side by side labelled solid, liquid and gas, each holding dots that stand for particles, drawn at the same scale.
