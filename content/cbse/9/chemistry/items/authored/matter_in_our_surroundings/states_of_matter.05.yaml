id: A.9.chemistry.matter_in_our_surroundings.states_of_matter.05
skill_ids:
- SK.A.9.chemistry.states_of_matter
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A balloon filled with gas is put in a freezer and shrinks. Which particle-level explanation is most accurate?
hints:
- level: 1
  en: Think about how the speed of particles changes when a sample cools.
- level: 2
  en: Consider what causes the gas to push on the inside of a balloon.
- level: 3
  en: Ask whether the size of the particles changes or only their motion.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the particles themselves become smaller in size
- id: b
  en: the particles stop moving completely at low temperature
- id: c
  en: the particles move more slowly and hit the walls less often and less forcefully
- id: d
  en: the particles change into a liquid inside the balloon
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.88A8B0047996
  when_answer_equals:
  - a
- id: MC.A.DFA2ED06D4FF
  when_answer_equals:
  - b
- id: MC.A.FC5A1C347FDE
  when_answer_equals:
  - d
solution_steps:
- en: Cooling slows the gas particles, so they strike the balloon wall less often and with less force, and the pressure drops until the balloon shrinks.
- en: The particles keep their size and do not stop moving.
- en: The correct option is c.
tier: C
