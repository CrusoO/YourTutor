id: A.9.chemistry.matter_in_our_surroundings.change_of_state.03
skill_ids:
- SK.A.9.chemistry.change_of_state
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does steam at 100 degrees Celsius usually cause a more severe burn than boiling water at the same temperature?
hints:
- level: 1
  en: Think about what happens to the energy of steam when it changes back into a liquid.
- level: 2
  en: Consider whether a thermometer would read a different value for steam and for boiling water at the same pressure.
- level: 3
  en: Compare the energy released when a gas becomes a liquid with the energy a liquid can absorb.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: steam particles are heavier and fall onto the skin
- id: b
  en: steam has a higher temperature than boiling water
- id: c
  en: boiling water absorbs heat from the skin as it evaporates
- id: d
  en: steam releases latent heat as it condenses on the skin
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.7B3C1379CC49
  when_answer_equals:
  - b
- id: MC.A.0AF37603E0A0
  when_answer_equals:
  - a
- id: MC.A.C3CEE7BFB635
  when_answer_equals:
  - c
solution_steps:
- en: Steam and boiling water are at the same temperature, but steam gives up a large amount of latent heat when it condenses on the skin, on top of the heat it already carries.
- en: The correct option is d.
tier: C
