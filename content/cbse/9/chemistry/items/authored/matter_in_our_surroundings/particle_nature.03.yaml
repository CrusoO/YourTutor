- SK.A.9.chemistry.particle_nature
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does the smell from an open bottle of perfume reach the far corners of a room faster when the room is warm?
hints:
- level: 1
  en: Think about how temperature relates to the speed of the particles.
- level: 2
  en: Ask whether the smell particles are being pushed or moving by themselves.
- level: 3
  en: Consider whether the size of the particles changes when they are warmed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: heat removes the spaces between the air particles
- id: b
  en: warm air pushes the smell particles in one direction only
- id: c
  en: warmer particles move faster and spread out more quickly
- id: d
  en: the perfume particles grow larger when they are heated
answer:
  sympy: c
  accept: []
misconception_rules:
