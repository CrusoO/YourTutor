id: A.9.chemistry.matter_in_our_surroundings.change_of_state.06
skill_ids:
- SK.A.9.chemistry.change_of_state
difficulty: 0.9
pool: practice
role: explain
stem:
  en: On a heating graph of a pure substance, the temperature stays flat while the substance boils. What is the heat supplied during this flat part used for?
hints:
- level: 1
  en: Compare what the supplied energy is used for during a change of state with what it does while the temperature is rising.
- level: 2
  en: Ask whether the temperature needs to rise for the particles to become a gas.
- level: 3
  en: Consider whether the heat supply is still switched on during the flat section.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the substance is changing into a solid
- id: b
  en: heating has stopped because the substance has no more energy
- id: c
  en: the temperature is falling so heat is being lost
- id: d
  en: breaking the forces between particles so they become a gas, with no rise in temperature
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.93EA206CB8F5
  when_answer_equals:
  - b
- id: MC.A.E4BD0635AB9B
  when_answer_equals:
  - a
- id: MC.A.72D46DA8A333
  when_answer_equals:
  - c
solution_steps:
- en: During boiling the supplied heat is used to separate the particles from the liquid, so the temperature remains constant until the whole liquid has become vapour.
- en: The correct option is d.
tier: C
diagram_note: A line graph with temperature on the vertical axis and time on the horizontal axis; the line rises, runs level for a stretch while the substance boils, and then rises again.
