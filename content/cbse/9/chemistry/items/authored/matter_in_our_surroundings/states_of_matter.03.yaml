id: A.9.chemistry.matter_in_our_surroundings.states_of_matter.03
skill_ids:
- SK.A.9.chemistry.states_of_matter
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A block of ice left on a table slowly becomes water. Which change at the particle level explains this?
hints:
- level: 1
  en: Ask what the particles need in order to stop sitting in fixed places.
- level: 2
  en: Consider whether the total amount of matter changes when ice melts.
- level: 3
  en: Consider how a warm object differs from a cold one in terms of particle motion.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: particles begin to attract each other more strongly
- id: b
  en: particles shrink in size as they warm
- id: c
  en: particles gain energy and slide past one another more freely
- id: d
  en: particles lose their mass as they melt
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.850140F2C19D
  when_answer_equals:
  - b
- id: MC.A.CD7EFB3B2015
  when_answer_equals:
  - d
- id: MC.A.DA79E971F520
  when_answer_equals:
  - a
solution_steps:
- en: Heat makes the particles move harder until they can break out of their fixed places and slide past one another.
- en: The particles keep their size and mass, and the total amount of matter stays the same.
- en: The correct option is c.
tier: C
