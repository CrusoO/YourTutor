id: A.9.chemistry.is_matter_around_us_pure.separation_methods.01
skill_ids:
- SK.A.9.chemistry.separation_methods
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which method separates an insoluble solid such as sand from a liquid?
hints:
- level: 1
  en: Think of pouring the mixture through a porous material that lets only the liquid through.
- level: 2
  en: The leftover solid stays on top of the porous material.
- level: 3
  en: Name the method that uses a porous material to catch the solid.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: sublimation
- id: b
  en: evaporation
- id: c
  en: filtration
- id: d
  en: magnetic separation
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.EBDF5F416E8F
  when_answer_equals:
  - b
- id: MC.A.91EE2484D9BB
  when_answer_equals:
  - a
- id: MC.A.41321C55D905
  when_answer_equals:
  - d
solution_steps:
- en: In filtration the liquid passes through a porous material while the insoluble solid is caught on top of it.
- en: The correct option is c.
tier: C
diagram_note: A funnel fitted with a porous material, set over a flask, with a mixture of sand and water poured into the funnel.
