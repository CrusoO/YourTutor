id: A.9.chemistry.is_matter_around_us_pure.mixtures_and_solutions.06
skill_ids:
- SK.A.9.chemistry.mixtures_and_solutions
difficulty: 0.9
pool: practice
role: explain
stem:
  en: Oil and water left in a container form two separate layers. Which property allows a separating funnel to split them apart?
hints:
- level: 1
  en: Think about which property decides which liquid sits on top.
- level: 2
  en: Ask whether the two liquids mix fully or stay separate.
- level: 3
  en: Consider what happens to the two liquids once they are left still for a while.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: they have different colours
- id: b
  en: oil dissolves in water completely
- id: c
  en: they are immiscible liquids with different densities
- id: d
  en: both liquids have the same boiling point
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.A8BED9F02FFB
  when_answer_equals:
  - a
- id: MC.A.DC2C265CFAAD
  when_answer_equals:
  - b
- id: MC.A.B32E2BC0EE25
  when_answer_equals:
  - d
solution_steps:
- en: Oil and water do not mix, and the lighter oil floats above the water, so the layers can be separated by running off the lower liquid through the tap of a separating funnel.
- en: The correct option is c.
tier: C
