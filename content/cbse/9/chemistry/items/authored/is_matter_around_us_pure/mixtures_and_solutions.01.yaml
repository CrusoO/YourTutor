stem:
  en: Which type of mixture has particles so small that they do not scatter a light beam and do not settle out on standing?
hints:
- level: 1
  en: Think of a mixture in which one substance fully dissolves into another and looks clear.
- level: 2
  en: Ask which type of mixture has the smallest particles of the three.
- level: 3
  en: Consider whether the particles eventually fall to the bottom of the container.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
