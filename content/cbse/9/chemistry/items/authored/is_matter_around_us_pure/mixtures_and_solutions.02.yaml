stem:
  en: Chalk powder is stirred into water and settles to the bottom when the mixture is left still. What is this mixture called?
hints:
- level: 1
  en: Notice that the particles are large enough to be seen and that they settle.
- level: 2
  en: Consider whether the particles spread evenly through the liquid over time.
- level: 3
  en: Pick the mixture type whose particles are the largest of the three.
