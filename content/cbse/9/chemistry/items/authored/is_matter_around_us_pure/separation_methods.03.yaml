id: A.9.chemistry.is_matter_around_us_pure.separation_methods.03
skill_ids:
- SK.A.9.chemistry.separation_methods
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A mixture of common salt and water is heated in a flask connected to a bent tube that leads to a cooled receiver. Which method is being used and why?
hints:
- level: 1
  en: Think about which component of the mixture leaves the flask as a vapour.
- level: 2
  en: Consider what the cooled receiver is designed to do with the vapour.
- level: 3
  en: Ask which substance remains in the flask after heating.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: chromatography, because salt moves faster than water
- id: b
  en: sublimation, because the salt turns into a gas
- id: c
  en: filtration, because salt particles are trapped by the tube
- id: d
  en: distillation, because the water boils off, condenses in the tube and is collected
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.7C8EE6C37FFB
  when_answer_equals:
  - c
- id: MC.A.85CCEFB90263
  when_answer_equals:
  - a
- id: MC.A.31109FA30E13
  when_answer_equals:
  - b
solution_steps:
- en: Water boils, its vapour travels down the tube, condenses on the cool walls and is collected, while the salt stays behind in the flask.
- en: This is distillation.
- en: The correct option is d.
tier: C
diagram_note: A round flask on a heater with a bent glass tube leading from its neck to a second flask that is cooled in water and collects liquid.
