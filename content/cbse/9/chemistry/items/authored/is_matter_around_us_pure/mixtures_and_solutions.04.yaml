stem:
  en: A solution is made by dissolving 5 g of salt in 100 g of water. What is the total mass of the solution in grams?
hints:
- level: 1
  en: Add the masses of the dissolved substance and the liquid it dissolves in.
- level: 2
  en: Mass is conserved when a solid dissolves in a liquid.
- level: 3
  en: Do not leave out either of the two parts when finding the total.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '105'
  accept: []
solution_steps:
- en: The mass of a solution is the mass of the solute plus the mass of the solvent, so 5 g plus 100 g gives 105 g.
- en: The unit of the answer is g.
- en: Answer = 105
tier: C
