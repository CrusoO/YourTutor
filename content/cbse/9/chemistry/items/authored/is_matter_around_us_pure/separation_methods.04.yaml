id: A.9.chemistry.is_matter_around_us_pure.separation_methods.04
skill_ids:
- SK.A.9.chemistry.separation_methods
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A mixture of two dyes is spotted near the base of an absorbent strip, and the bottom edge is dipped in a solvent. The dyes separate into coloured bands as the solvent climbs. Which method is this?
hints:
- level: 1
  en: Think about how the solvent carries each colour up the strip at a different rate.
- level: 2
  en: Consider whether the dyes boil or travel along with the solvent.
- level: 3
  en: Name the method based on how substances move through an absorbent material.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: decantation
- id: b
  en: fractional distillation
- id: c
  en: sieving
- id: d
  en: chromatography
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.D847F435734A
  when_answer_equals:
  - a
- id: MC.A.3D0725DE4E4C
  when_answer_equals:
  - b
- id: MC.A.891FB1FEE6CC
  when_answer_equals:
  - c
solution_steps:
- en: Each dye is carried up the strip by the solvent at a different rate, depending on how strongly it sticks to the absorbent material, so the dyes end up in separate bands.
- en: The correct option is d.
tier: C
diagram_note: A narrow strip of absorbent material with a pencil-marked spot near its base, standing in a shallow pool of solvent, with the solvent front visible higher up the strip.
