difficulty: 0.6
pool: practice
role: explain
stem:
  en: Milk looks white and does not clear up on standing, yet a beam of light passing through it can be seen. What type of mixture is milk?
hints:
- level: 1
  en: Think about whether the particles are between solution size and suspension size.
- level: 2
  en: Ask what happens to a beam of light when it passes through the mixture.
- level: 3
  en: Consider whether the particles in milk settle over a short time.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: a colloid
- id: b
  en: a solution
- id: c
  en: a suspension
- id: d
  en: a pure compound
answer:
  sympy: a
  accept: []
misconception_rules:
