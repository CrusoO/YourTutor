id: A.9.chemistry.is_matter_around_us_pure.elements_and_compounds.06
skill_ids:
- SK.A.9.chemistry.elements_and_compounds
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A grey solid that is magnetic is mixed with a yellow powder. When the mixture is heated, a new black solid forms that is not magnetic. Which description best fits the new black solid?
hints:
- level: 1
  en: Think about whether the loss of magnetism means the original parts still exist separately.
- level: 2
  en: Ask whether the new substance has properties that neither starting material had.
- level: 3
  en: Consider whether heating two substances can ever produce a new element.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: a mixture with a higher density than iron
- id: b
  en: a compound formed by chemical combination of the two starting substances
- id: c
  en: a physical blend of the original two substances
- id: d
  en: a new element formed by heating
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.D2911A30EC83
  when_answer_equals:
  - a
- id: MC.A.240AE28E723A
  when_answer_equals:
  - d
- id: MC.A.9804B626D549
  when_answer_equals:
  - c
solution_steps:
- en: The new black solid has properties that neither starting substance had, such as losing magnetism, and it forms in a fixed ratio.
- en: Those features point to a chemical combination, so the product is a compound.
- en: The correct option is b.
tier: C
