id: A.9.chemistry.is_matter_around_us_pure.elements_and_compounds.05
skill_ids:
- SK.A.9.chemistry.elements_and_compounds
difficulty: 0.9
pool: practice
role: explain
stem:
  en: Which property best distinguishes air from carbon dioxide in terms of composition?
hints:
- level: 1
  en: Think about whether the proportions of the parts can change from sample to sample.
- level: 2
  en: Ask whether the parts can be separated by simple physical methods.
- level: 3
  en: Consider how many elements each substance contains.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: air has variable proportions of its components, while carbon dioxide has a fixed ratio of carbon to oxygen
- id: b
  en: air contains only one element
- id: c
  en: carbon dioxide can be separated by simple filtration
- id: d
  en: both have identical boiling points
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.311002CEC977
  when_answer_equals:
  - c
- id: MC.A.A1443DABE779
  when_answer_equals:
  - b
- id: MC.A.1D9D0318CE94
  when_answer_equals:
