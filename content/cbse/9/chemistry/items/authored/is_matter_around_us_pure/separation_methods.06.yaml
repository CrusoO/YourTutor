id: A.9.chemistry.is_matter_around_us_pure.separation_methods.06
skill_ids:
- SK.A.9.chemistry.separation_methods
difficulty: 0.9
pool: practice
role: explain
stem:
  en: A sample of ethanol and water is heated in a distillation setup. Ethanol turns into vapour first. Which property of ethanol causes this?
hints:
- level: 1
  en: Think about which liquid reaches its boiling temperature sooner when heated.
- level: 2
  en: Consider how the boiling temperature of each liquid compares with the other.
- level: 3
  en: Ask which property of a liquid decides when it turns into vapour.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: its lower boiling point
- id: b
  en: its smaller molecules pass through the condenser faster
- id: c
  en: its greater solubility in glass
- id: d
  en: its higher density
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.562EAACBD447
  when_answer_equals:
  - d
- id: MC.A.D2CF2AB3A296
  when_answer_equals:
  - c
- id: MC.A.7B560D5AD982
  when_answer_equals:
  - b
solution_steps:
- en: Ethanol boils at a lower temperature than water, so it reaches its boiling point first and its vapour leaves the flask before the water's does.
- en: This difference in boiling points is what makes the separation possible.
- en: The correct option is a.
tier: C
diagram_note: A round flask of liquid heated on a stand, with a bent tube leading to a condenser that cools the vapour into a receiving flask.
