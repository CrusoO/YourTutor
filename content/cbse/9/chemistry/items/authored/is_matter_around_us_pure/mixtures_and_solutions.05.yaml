id: A.9.chemistry.is_matter_around_us_pure.mixtures_and_solutions.05
skill_ids:
- SK.A.9.chemistry.mixtures_and_solutions
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A mixture of sand, salt and water is filtered through a fine cloth. The filtrate is clear and does not scatter a light beam. What is the filtrate?
hints:
- level: 1
  en: Compare the size of the particles in the filtrate with the sizes found in the other kinds of liquid mixture.
- level: 2
  en: Ask what the lack of scattering in the light beam tells you about the particles.
- level: 3
  en: Consider whether a clear liquid could still contain particles large enough to scatter light.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: a pure substance
- id: b
  en: a colloid
- id: c
  en: a suspension
- id: d
  en: a solution
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.D7C15D8ECC66
  when_answer_equals:
  - b
- id: MC.A.2E0A27388F2D
  when_answer_equals:
  - c
- id: MC.A.B7CAD3B0252E
  when_answer_equals:
  - a
solution_steps:
- en: A clear filtrate that does not scatter light has particles too small to be seen or scattered, so it is a solution of the dissolved salt in water.
- en: The sand has already been removed by the cloth.
- en: The correct option is d.
tier: C
