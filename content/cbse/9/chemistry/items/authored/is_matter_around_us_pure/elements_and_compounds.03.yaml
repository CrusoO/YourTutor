id: A.9.chemistry.is_matter_around_us_pure.elements_and_compounds.03
skill_ids:
- SK.A.9.chemistry.elements_and_compounds
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Iron filings and sulphur powder can be mixed in any ratio and each keeps its own properties. When the two are heated together they form a new substance with fixed proportions and new properties. What does this change show?
hints:
- level: 1
  en: Compare whether the parts keep their own properties in the new substance.
- level: 2
  en: Ask whether the ratio of the parts is fixed or variable in the new substance.
- level: 3
  en: Consider what the heating did to the particles of each element.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the iron has been separated from the sulphur
- id: b
  en: the mixture has become an element
- id: c
  en: the iron and sulphur have combined chemically into a compound
- id: d
  en: the iron and sulphur have simply dissolved into each other
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.E83A44EDA0CC
  when_answer_equals:
  - d
- id: MC.A.49F4359F42F8
  when_answer_equals:
  - a
- id: MC.A.C78F6D805DF2
  when_answer_equals:
  - b
solution_steps:
- en: The mixture kept each component's properties, but after heating the new substance has fixed proportions and new properties, which is the mark of a chemical combination into a compound.
- en: The correct option is c.
tier: C
