stem:
  en: Hydrogen and oxygen form water. Sample A has 2 g of hydrogen with 16 g of oxygen, and sample B has 3 g of hydrogen with 24 g of oxygen. Which law do these samples support?
hints:
- level: 1
  en: Compare the mass ratio of hydrogen to oxygen in each sample.
- level: 2
  en: Ask whether the two samples form the same compound.
- level: 3
  en: Consider what happens to a ratio when both masses are scaled by the same factor.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: law of conservation of mass
- id: b
  en: law of constant proportions
- id: c
  en: Boyle's law
- id: d
  en: law of multiple proportions
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.8C14D5B0AF1D
  when_answer_equals:
  - d
- id: MC.A.355141FC1F7D
  when_answer_equals:
