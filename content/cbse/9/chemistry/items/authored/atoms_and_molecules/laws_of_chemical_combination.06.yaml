difficulty: 0.9
pool: practice
role: explain
stem:
  en: A 5.6 g sample of iron combines with 2.4 g of sulphur to form a compound. What mass of sulphur in grams is needed to combine with 11.2 g of iron in the same compound?
hints:
- level: 1
  en: Find the factor by which the iron mass has changed from the first sample.
- level: 2
  en: Apply the same factor to the sulphur mass of the first sample.
- level: 3
  en: Check the answer against the mass ratio of the two elements in the first sample.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4.8'
  accept: []
solution_steps:
- en: The iron mass doubles from 5.6 g to 11.2 g, so the sulphur mass must also double from 2.4 g to 4.8 g to keep the fixed ratio of the compound.
- en: The unit of the answer is g.
- en: Answer = 4.8
tier: C
