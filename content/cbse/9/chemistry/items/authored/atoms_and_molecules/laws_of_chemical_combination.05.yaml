stem:
  en: Carbon forms two oxides. In one, 12 g of carbon combines with 16 g of oxygen; in the other, 12 g of carbon combines with 32 g of oxygen. Which law do these observations illustrate?
hints:
- level: 1
  en: Compare the oxygen masses that combine with the same mass of carbon in each compound.
- level: 2
  en: Check whether the two oxygen masses form a simple whole-number ratio.
- level: 3
  en: Consider whether one compound or several compounds of the same two elements are involved.
