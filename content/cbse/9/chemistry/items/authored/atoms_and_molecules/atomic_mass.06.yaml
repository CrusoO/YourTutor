difficulty: 0.9
pool: practice
role: apply
stem:
  en: A sample has a mass of 0.25 kg of calcium atoms. Using a molar mass of 40 grams per mole, how many moles are present?
hints:
- level: 1
  en: Convert the mass to grams before dividing by the molar mass.
- level: 2
  en: Check the units so that grams cancel against grams per mole.
- level: 3
  en: Divide the converted mass by the molar mass to finish.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6.25'
  accept: []
solution_steps:
- en: 0.25 kg is 250 g, and 250 g divided by 40 g per mole gives 6.25 mol.
- en: The unit of the answer is mol.
- en: Answer = 6.25
tier: C
