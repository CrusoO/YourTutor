type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The number of moles equals the mass divided by the molar mass, so 46 g divided by 23 g per mole gives 2 moles.
- en: The unit of the answer is mol.
- en: Answer = 2
