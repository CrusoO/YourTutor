stem:
  en: How many moles are in 46 grams of sodium atoms, given a molar mass of 23 grams per mole?
hints:
- level: 1
  en: Divide the given mass by the molar mass.
- level: 2
  en: Mass divided by molar mass gives the number of moles.
- level: 3
  en: Check the result by multiplying it back by the molar mass to recover the mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
