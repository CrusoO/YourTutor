stem:
  en: Sodium sulphate has the formula Na2SO4. Using atomic masses of 23 for Na, 32 for S and 16 for O, what is its formula mass in u?
hints:
- level: 1
  en: Add the contribution of each element separately, then sum the results.
- level: 2
  en: Multiply the mass of each element by its number of atoms in the formula.
- level: 3
  en: Count the oxygen atoms carefully from the subscript written after the symbol.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '142'
  accept: []
solution_steps:
- en: Two sodium atoms give 46 u, one sulphur atom gives 32 u and four oxygen atoms give 64 u, so the total is 142 u.
- en: The unit of the answer is u.
- en: Answer = 142
tier: C
