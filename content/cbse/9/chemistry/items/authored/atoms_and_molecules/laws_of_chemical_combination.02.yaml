difficulty: 0.2
pool: practice
role: recall
stem:
  en: A compound always contains the same elements in the same mass ratio, whatever its source. Which law describes this?
hints:
- level: 1
  en: The law is about the makeup of a single compound, not about a reaction.
- level: 2
  en: Think about whether the proportion of the parts changes from sample to sample.
- level: 3
  en: Consider whether this law concerns the total mass in a reaction or the makeup of one compound.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: law of conservation of mass
- id: b
  en: law of multiple proportions
- id: c
  en: law of constant proportions
- id: d
  en: Avogadro's law
answer:
  sympy: c
  accept: []
