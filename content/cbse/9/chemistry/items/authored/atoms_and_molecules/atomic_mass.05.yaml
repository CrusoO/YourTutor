stem:
  en: A sample contains 3.011e23 atoms of magnesium. Using Avogadro's constant of 6.022e23 per mole, how many moles of magnesium atoms are present?
hints:
- level: 1
  en: Divide the number of atoms by the number of atoms in one mole.
- level: 2
  en: Use Avogadro's constant as the number of atoms in a mole.
- level: 3
  en: The answer is a fraction of a mole, so expect a decimal value.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.5'
  accept: []
solution_steps:
- en: The number of moles is the number of atoms divided by Avogadro's constant, so 3.011e23 divided by 6.022e23 gives 0.5 mol.
- en: The unit of the answer is mol.
- en: Answer = 0.5
tier: C
