stem:
  en: Ammonium has a valency of one and sulphate has a valency of two. Which formula correctly represents ammonium sulphate?
hints:
- level: 1
  en: Balance the charge of the sulphate group with the charge of the ammonium groups.
- level: 2
  en: Compare the valencies of the two groups to see how many of each are needed.
- level: 3
  en: Use brackets around a polyatomic group when more than one of that group appears.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
