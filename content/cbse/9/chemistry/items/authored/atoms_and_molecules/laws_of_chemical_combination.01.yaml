stem:
  en: Which law states that the total mass of the substances does not change in a chemical reaction?
hints:
- level: 1
  en: Think about the total mass of the reactants compared with the total mass of the products.
- level: 2
  en: Consider the principle that the amount of matter is retained in every reaction.
- level: 3
  en: The name of the law says what stays unchanged in a reaction, which is a quantity of matter.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
