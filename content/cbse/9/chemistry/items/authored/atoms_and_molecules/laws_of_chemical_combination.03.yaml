stem:
  en: 'Carbon burns completely: 12 g of carbon reacts with 32 g of oxygen. What mass of oxygen in grams is needed for 24 g of carbon, keeping the same ratio?'
hints:
- level: 1
  en: Scale the given masses by the same factor.
- level: 2
  en: Find how many times larger the new carbon mass is than the original one.
- level: 3
  en: Apply that same factor to the oxygen mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '64'
  accept: []
solution_steps:
- en: The carbon mass doubles from 12 g to 24 g, so the oxygen mass must also double from 32 g to 64 g to keep the same ratio.
- en: The unit of the answer is g.
- en: Answer = 64
tier: C
