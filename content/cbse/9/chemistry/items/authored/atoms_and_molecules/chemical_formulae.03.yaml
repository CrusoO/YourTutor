stem:
  en: Aluminium has a valency of 3 and oxygen has a valency of 2. What is the formula of aluminium oxide?
hints:
- level: 1
  en: Cross over the valencies so each becomes the subscript of the other element.
- level: 2
  en: Check whether the subscripts can be reduced to a simpler whole-number ratio.
- level: 3
  en: Write the metal symbol first and the non-metal symbol second.
prediction_prompt:
