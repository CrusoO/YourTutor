stem:
  en: Water molecules each contain two hydrogen atoms and one oxygen atom. Taking hydrogen as 1 u and oxygen as 16 u, what is the mass of one water molecule in u?
hints:
- level: 1
  en: Multiply the hydrogen mass by the number of hydrogen atoms in the molecule.
- level: 2
  en: Add the oxygen contribution to the hydrogen contribution.
- level: 3
  en: Add the contributions of all atoms in the molecule to finish.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '18'
  accept: []
solution_steps:
- en: Two hydrogen atoms give 2 u and one oxygen atom gives 16 u, so the molecule has a mass of 18 u.
- en: The unit of the answer is u.
- en: Answer = 18
tier: C
