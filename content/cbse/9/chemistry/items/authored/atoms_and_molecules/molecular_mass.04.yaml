stem:
  en: Calcium hydroxide has the formula Ca(OH)2. Using atomic masses of 40 for Ca, 16 for O and 1 for H, what is its formula mass in u?
hints:
- level: 1
  en: Work out the mass of the OH group first.
- level: 2
  en: Multiply the mass of the OH group by the subscript outside the bracket.
- level: 3
  en: Add the calcium mass to that product to finish.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '74'
  accept: []
solution_steps:
- en: The OH group has a mass of 17 u and there are two of them, giving 34 u, which added to the 40 u of calcium gives 74 u.
- en: The unit of the answer is u.
- en: Answer = 74
tier: C
