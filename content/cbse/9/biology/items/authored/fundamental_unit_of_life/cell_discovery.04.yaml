id: A.9.biology.fundamental_unit_of_life.cell_discovery.04
skill_ids:
- SK.A.9.biology.cell_discovery
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A cell has a diameter of 20 micrometres. How many such cells would fit end to end in a line 1 millimetre long, ignoring gaps?
hints:
- level: 1
  en: Convert the millimetre into micrometres first.
- level: 2
  en: Then divide the total length by the size of one cell.
- level: 3
  en: Ignore the gaps between cells, as the question says.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '50'
  accept: []
solution_steps:
- en: One millimetre is 1000 micrometres, and 1000 divided by 20 gives 50 cells in a line.
- en: Answer = 50
tier: C
