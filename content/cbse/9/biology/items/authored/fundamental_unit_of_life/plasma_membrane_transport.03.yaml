id: A.9.biology.fundamental_unit_of_life.plasma_membrane_transport.03
skill_ids:
- SK.A.9.biology.plasma_membrane_transport
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A cell is placed in pure water. Its cytoplasm contains more dissolved solute than the water outside. In which direction will water move across the membrane?
hints:
- level: 1
  en: Compare how much water is present on each side of the membrane.
- level: 2
  en: Remember that pure water has the highest water concentration.
- level: 3
  en: Water moves from high water concentration toward low water concentration.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Only the dissolved solute moves out
- id: b
  en: Out of the cell
- id: c
  en: Into the cell
- id: d
  en: No movement, because the outside water is pure
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.503FB6BF3BDD
  when_answer_equals:
  - b
- id: MC.A.8164C7CE9A49
  when_answer_equals:
  - d
- id: MC.A.E7C2F854EEAA
  when_answer_equals:
  - a
solution_steps:
- en: Pure water has a higher water concentration than the cytoplasm, so water moves across the semi-permeable membrane into the cell by osmosis.
- en: The cell swells as a result.
- en: The correct option is c.
tier: C
diagram_note: 'Draw two compartments separated by a dotted membrane line: one labelled pure water, the other labelled cell cytoplasm with dissolved particles. Add an arrow across the membrane showing the water direction.'
