id: A.9.biology.fundamental_unit_of_life.cell_discovery.01
skill_ids:
- SK.A.9.biology.cell_discovery
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which statement is part of the cell theory?
hints:
- level: 1
  en: Think about how a new cell comes into existence.
- level: 2
  en: Consider whether every cell can be seen without a magnifying tool.
- level: 3
  en: Recall which living things the theory covers.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Cells can only be seen with the naked eye
- id: b
  en: Only plants are made of cells
- id: c
  en: All cells arise from pre-existing cells
- id: d
  en: Viruses are the smallest unit of all life
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.009ACC4D195F
  when_answer_equals:
  - a
- id: MC.A.997CEDBF1F83
  when_answer_equals:
  - d
- id: MC.A.48ACAB0A902C
  when_answer_equals:
  - b
solution_steps:
- en: 'The cell theory has three parts: all living things are made of cells, the cell is the basic unit of structure and function, and new cells come only from existing cells.'
- en: The correct option is c.
tier: C
