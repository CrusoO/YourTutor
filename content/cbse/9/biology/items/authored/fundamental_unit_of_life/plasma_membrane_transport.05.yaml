id: A.9.biology.fundamental_unit_of_life.plasma_membrane_transport.05
skill_ids:
- SK.A.9.biology.plasma_membrane_transport
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A red blood cell is placed in a salt solution that is more concentrated than its cytoplasm. What change is most likely to be seen in the cell after some time?
hints:
- level: 1
  en: Work out which side has more water in this case.
- level: 2
  en: Water moves toward the side with lower water concentration.
- level: 3
  en: Consider what happens to the volume of a cell that loses water.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The cell bursts as water enters it
- id: b
  en: The cell grows larger as solute leaves it
- id: c
  en: The cell shrinks as water leaves it
- id: d
  en: The cell stays the same because membranes block all water movement
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.99EE9B7A92DF
  when_answer_equals:
  - a
- id: MC.A.D2D88581A3EF
  when_answer_equals:
  - b
- id: MC.A.C85B4A126A18
  when_answer_equals:
  - d
solution_steps:
- en: The outside solution has less water per unit volume than the cytoplasm, so water leaves the cell by osmosis and the cell shrinks.
- en: Cells without a rigid wall are most affected.
- en: The correct option is c.
tier: C
