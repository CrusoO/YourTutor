id: A.9.biology.fundamental_unit_of_life.plasma_membrane_transport.04
skill_ids:
- SK.A.9.biology.plasma_membrane_transport
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Oxygen moves into a leaf cell from the air around it without any energy input. Which process is responsible for this movement?
hints:
- level: 1
  en: Ask whether the gas moves down a concentration gradient.
- level: 2
  en: Consider whether the cell must spend energy for this movement.
- level: 3
  en: Eliminate processes that apply only to water.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Osmosis
- id: b
  en: Endocytosis
- id: c
  en: Diffusion
- id: d
  en: Active transport
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.FCAC33EC31B0
  when_answer_equals:
  - d
- id: MC.A.8F803275276F
  when_answer_equals:
  - a
- id: MC.A.B29D99F570B0
  when_answer_equals:
  - b
solution_steps:
- en: Oxygen is more concentrated in the air than inside the cell, so it moves down its gradient by diffusion.
- en: No energy is spent, and the molecule is a gas rather than water, so osmosis does not apply.
- en: The correct option is c.
tier: C
diagram_note: Draw a leaf cell beside an air space, with arrows showing oxygen moving from the air through the cell membrane into the cell, and labels for high and low oxygen concentration.
