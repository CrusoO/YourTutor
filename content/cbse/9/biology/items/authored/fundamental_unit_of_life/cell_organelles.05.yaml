id: A.9.biology.fundamental_unit_of_life.cell_organelles.05
skill_ids:
- SK.A.9.biology.cell_organelles
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A cell with no working mitochondria is placed in an oxygen-rich environment. Compared with a normal cell, what is the most likely outcome?
hints:
- level: 1
  en: Identify the organelle that uses oxygen to release energy.
- level: 2
  en: Think about what aerobic respiration produces.
- level: 3
  en: Eliminate options about structures that are not involved in energy release.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Faster protein synthesis on the ribosomes
- id: b
  en: Greater chlorophyll production in the cytoplasm
- id: c
  en: Less ATP is made through aerobic respiration
- id: d
  en: Thicker cell wall formation
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.7AB67C5B912D
  when_answer_equals:
  - a
- id: MC.A.D69B326A2830
  when_answer_equals:
  - b
- id: MC.A.90FBE40AE61A
  when_answer_equals:
  - d
solution_steps:
- en: Mitochondria use oxygen in aerobic respiration to release most of the cell's usable energy as ATP.
- en: Without working mitochondria the cell makes much less ATP, so its energy supply falls.
- en: The correct option is c.
tier: C
diagram_note: Draw a cell with a few small oval mitochondria marked with folded inner membranes, an arrow showing oxygen entering, and an arrow showing energy leaving as ATP.
