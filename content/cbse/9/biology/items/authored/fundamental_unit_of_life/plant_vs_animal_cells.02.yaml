stem:
  en: Which organelle is typically large and central in a mature plant cell and stores water?
hints:
- level: 1
  en: Think about the large sac that fills most of the cell interior.
- level: 2
  en: Consider which organelle keeps the cell firm when it is full of water.
- level: 3
  en: Eliminate options that are small or linked to digestion.
