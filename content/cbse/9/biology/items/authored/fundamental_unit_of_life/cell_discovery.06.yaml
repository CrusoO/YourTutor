id: A.9.biology.fundamental_unit_of_life.cell_discovery.06
skill_ids:
- SK.A.9.biology.cell_discovery
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which observation most directly supports the idea that every cell comes from an earlier cell rather than from non-living matter?
hints:
- level: 1
  en: Focus on what happens to a cell during growth.
- level: 2
  en: Ask which observation shows new cells being made from existing ones.
- level: 3
  en: Eliminate statements about size or staining.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Dead cork cells keep their walls after death
- id: b
  en: Cells in a growing root tip divide and produce new cells with the same structure
- id: c
  en: Cells can be stained to show their internal parts
- id: d
  en: Some bacteria are much smaller than animal cells
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.BE211763DE87
  when_answer_equals:
  - a
- id: MC.A.50F09160AD27
  when_answer_equals:
  - c
- id: MC.A.79CCCCBAE0DA
  when_answer_equals:
  - d
solution_steps:
- en: Dividing cells in a root tip show new cells arising from older cells during growth.
- en: The other options describe structure, staining or size, which do not show where cells come from.
- en: The correct option is b.
tier: C
