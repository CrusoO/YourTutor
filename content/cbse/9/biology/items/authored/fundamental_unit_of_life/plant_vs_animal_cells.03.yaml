difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why are plant cells usually more regular and box-like in shape than animal cells?
hints:
- level: 1
  en: Think about what the outer layer of a plant cell is made of.
- level: 2
  en: Consider what happens to shape when a cell has no wall.
- level: 3
  en: Eliminate statements about division or the nucleus.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Plant cells are always dividing and so become flattened
- id: b
  en: The rigid cell wall maintains a fixed shape
- id: c
  en: Animal cells contain more chloroplasts that stretch them
- id: d
  en: The nucleus of a plant cell is what keeps it square
answer:
  sympy: b
  accept: []
misconception_rules:
