id: A.9.biology.fundamental_unit_of_life.cell_discovery.03
skill_ids:
- SK.A.9.biology.cell_discovery
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A student claims that a new cell can form spontaneously from non-living material in a sealed flask. Which part of the cell theory does this claim contradict?
hints:
- level: 1
  en: Ask where the theory says new cells come from.
- level: 2
  en: Compare the claim with the origin of cells that the theory describes.
- level: 3
  en: Check which statement concerns how cells originate.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Cells can only be seen with a microscope
- id: b
  en: The cell is the basic unit of structure and function
- id: c
  en: All living things are made of cells
- id: d
  en: All cells arise from pre-existing cells
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.8727A173D86E
  when_answer_equals:
  - b
- id: MC.A.BCE531F796CD
  when_answer_equals:
  - c
- id: MC.A.A15EC8F779A1
  when_answer_equals:
  - a
solution_steps:
- en: The theory states that every cell comes from an earlier cell by division, so spontaneous formation from non-living material would contradict it.
- en: The other parts describe structure, not origin.
- en: The correct option is d.
tier: C
