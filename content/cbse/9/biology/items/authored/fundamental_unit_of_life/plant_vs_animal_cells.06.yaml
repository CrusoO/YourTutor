id: A.9.biology.fundamental_unit_of_life.plant_vs_animal_cells.06
skill_ids:
- SK.A.9.biology.plant_vs_animal_cells
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A cell from a leaf has a thick outer wall, green plastids and one large central sac. What best explains why the leaf stays firm when the plant is well watered?
hints:
- level: 1
  en: Think about which structure holds the water in the cell.
- level: 2
  en: Consider how a full water sac affects the wall around it.
- level: 3
  en: Eliminate options that give storage or pressure roles to organelles that do not hold much water.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The nucleus pushes the membrane against the wall
- id: b
  en: The chloroplasts store water inside the cell
- id: c
  en: The central sac is full of water that presses the cell wall outward
- id: d
  en: Mitochondria stiffen the membrane during respiration
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.79E80CD1D3D0
  when_answer_equals:
  - b
- id: MC.A.C37CAAE10720
  when_answer_equals:
  - a
- id: MC.A.316D8F04597B
  when_answer_equals:
  - d
solution_steps:
- en: Water pressure from the central vacuole pushes the membrane against the cell wall, which keeps the tissue firm.
- en: Chloroplasts make food, nuclei control activity, and mitochondria release energy.
- en: The correct option is c.
tier: C
