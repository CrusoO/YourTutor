id: A.9.biology.fundamental_unit_of_life.plant_vs_animal_cells.05
skill_ids:
- SK.A.9.biology.plant_vs_animal_cells
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A student sees a cell under a microscope. It has no cell wall, a nucleus, mitochondria and no green plastids. Which conclusion is best supported?
hints:
- level: 1
  en: Compare the features shown with the list of plant-only structures.
- level: 2
  en: Ask which structures are absent and which are shared by both cell types.
- level: 3
  en: Ask whether the missing wall alone is enough to rule out a plant cell.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is most likely an animal cell
- id: b
  en: It cannot respire, because it has no chloroplasts
- id: c
  en: It must be a bacterium
- id: d
  en: It is a plant cell that has lost its chloroplasts
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.305F28E26B52
  when_answer_equals:
  - c
- id: MC.A.B190ED1C0C24
  when_answer_equals:
  - d
- id: MC.A.EAACB902530D
  when_answer_equals:
  - b
solution_steps:
- en: A nucleus and mitochondria fit a eukaryotic cell, and the lack of a wall and of chloroplasts fits an animal cell.
- en: Bacteria lack a true nucleus, so that option is ruled out.
- en: The correct option is a.
tier: C
diagram_note: Draw a cell outline with no outer wall, a round nucleus, and a few small oval mitochondria, with no green plastids. Label each structure.
