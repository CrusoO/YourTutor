id: A.9.biology.fundamental_unit_of_life.cell_organelles.03
skill_ids:
- SK.A.9.biology.cell_organelles
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A cell is treated with a substance that stops its ribosomes from working. Which process would be most directly affected?
hints:
- level: 1
  en: Recall what ribosomes are made to do in the cell.
- level: 2
  en: Think about which molecules are built from amino acids.
- level: 3
  en: Ask which process would stop first if the building units were no longer assembled.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Packaging materials for secretion
- id: b
  en: Digesting worn-out parts
- id: c
  en: Releasing energy from glucose
- id: d
  en: Making proteins
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.AF88247F18CD
  when_answer_equals:
  - c
- id: MC.A.14CF6FC645E7
  when_answer_equals:
  - a
- id: MC.A.698441290C05
  when_answer_equals:
  - b
solution_steps:
- en: Ribosomes are the site of protein synthesis, so blocking them stops new proteins being made.
- en: Respiration happens in mitochondria, packaging in the Golgi apparatus and digestion in lysosomes.
- en: The correct option is d.
tier: C
diagram_note: Draw a cell with labels pointing to ribosomes scattered in the cytoplasm and attached to the rough endoplasmic reticulum, with an arrow showing a finished protein leaving the endoplasmic reticulum.
