- id: MC.A.3577E9F4A0DC
  when_answer_equals:
  - a
solution_steps:
- en: Similar wings can evolve independently, so a single outward feature is weak evidence.
- en: Classification compares many features, including internal structure and genetic information.
- en: The correct option is d.
tier: C
