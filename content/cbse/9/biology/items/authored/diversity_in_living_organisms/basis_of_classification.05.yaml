id: A.9.biology.diversity_in_living_organisms.basis_of_classification.05
skill_ids:
- SK.A.9.biology.basis_of_classification
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Two organisms have similar wings, yet they differ strongly in internal skeleton and genetic code. What is the best approach for deciding how to classify them?
hints:
- level: 1
  en: Think about whether one outward feature can prove shared ancestry.
- level: 2
  en: Consider what the internal features and genetic code add to the comparison.
- level: 3
  en: Eliminate options that rely on a single feature alone.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They must go in different kingdoms because they differ at all
- id: b
  en: Internal features are irrelevant once wings are seen
- id: c
  en: Wings are decisive, so they belong in one group
- id: d
  en: Wings alone are not enough, so compare many features before grouping
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.C3D9A44DC831
  when_answer_equals:
  - c
- id: MC.A.7750A2BBAAA6
  when_answer_equals:
