difficulty: 0.6
pool: practice
role: explain
stem:
  en: A moss-like plant needs a film of water so that its male cells can swim to the egg. What does this requirement show about its reproduction?
hints:
- level: 1
  en: Think about how the male cells move toward the female part.
- level: 2
  en: Consider whether this group produces seeds or spores.
- level: 3
  en: Eliminate options about fruits or vascular systems.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The plant has a true vascular system for transport
- id: b
  en: Spores are dispersed by animals
- id: c
  en: Seeds form inside a fruit
- id: d
  en: Fertilisation depends on external water
answer:
  sympy: d
  accept: []
