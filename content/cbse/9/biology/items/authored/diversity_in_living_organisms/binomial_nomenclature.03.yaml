options:
- id: a
  en: Homo Sapiens, with both words capitalised
- id: b
  en: Homo sapiens, with the capital only on the genus
- id: c
  en: HOMO SAPIENS, written in capitals
- id: d
  en: homo sapiens, with both words in lower case
