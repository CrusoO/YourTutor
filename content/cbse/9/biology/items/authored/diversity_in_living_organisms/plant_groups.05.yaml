stem:
  en: A plant has roots, stems and leaves with vascular tissue, and it produces naked seeds on cones. Which plant group does it belong to?
hints:
- level: 1
  en: Think about which group has naked seeds borne on cones.
- level: 2
  en: Consider how the seeds are exposed compared with seeds inside fruits.
- level: 3
  en: Eliminate groups whose members reproduce only by spores.
