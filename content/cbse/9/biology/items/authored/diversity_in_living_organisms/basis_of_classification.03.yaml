id: A.9.biology.diversity_in_living_organisms.basis_of_classification.03
skill_ids:
- SK.A.9.biology.basis_of_classification
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Two plants look alike, but one makes its seeds in cones and the other makes seeds inside flowers. Why are they placed in different groups?
hints:
- level: 1
  en: Think about which part of the plant produces the seed.
- level: 2
  en: Consider which features reflect shared ancestry rather than appearance.
- level: 3
  en: Eliminate options that rely on colour or habitat alone.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They differ in colour, so colour decides the group
- id: b
  en: Their reproductive structures are fundamentally different, which reflects distinct lineages
- id: c
  en: They grow in different soils, so they belong to different kingdoms
- id: d
  en: They have the same leaves, so they must be grouped together
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.975D2CE13B63
  when_answer_equals:
  - a
- id: MC.A.CFF6A4FD259B
  when_answer_equals:
