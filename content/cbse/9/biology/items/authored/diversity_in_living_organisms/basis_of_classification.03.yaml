- id: MC.A.CA2997DFCA60
  when_answer_equals:
  - d
solution_steps:
- en: Reproductive structures are deep, inherited features that reflect ancestry, so differences there signal distinct lineages.
- en: Appearance and habitat can be misleading.
- en: The correct option is b.
tier: C
