id: A.9.biology.diversity_in_living_organisms.binomial_nomenclature.05
skill_ids:
- SK.A.9.biology.binomial_nomenclature
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Two different species belong to the same genus and so share the first word of their names. What does this shared word tell you?
hints:
- level: 1
  en: Think about what the first word of a binomial name represents.
- level: 2
  en: Consider whether a shared genus means the organisms are the same species.
- level: 3
  en: Eliminate statements about habitats or kingdoms.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They live in the same habitat
- id: b
  en: They belong to different kingdoms
- id: c
  en: They are closely related and belong to the same genus
- id: d
  en: They are the same species with two names
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.B0425A77DBF9
  when_answer_equals:
  - d
- id: MC.A.765408587190
  when_answer_equals:
  - b
- id: MC.A.32B93180F4A3
  when_answer_equals:
