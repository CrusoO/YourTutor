id: A.9.biology.diversity_in_living_organisms.basis_of_classification.04
skill_ids:
- SK.A.9.biology.basis_of_classification
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A biologist wants to place an unknown organism into a broad group. Which set of features is most useful for this purpose?
hints:
- level: 1
  en: Think about features that are shared across many related species.
- level: 2
  en: Consider characteristics that go beyond outward appearance.
- level: 3
  en: Eliminate options based on visible but variable features.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Colour and approximate size
- id: b
  en: Body organisation, cell type and mode of nutrition
- id: c
  en: Only the place where it was found
- id: d
  en: Its name in a local language
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.20D99AEC4410
  when_answer_equals:
  - a
- id: MC.A.D2470DC105C5
  when_answer_equals:
  - c
- id: MC.A.265DC4533FAA
  when_answer_equals:
  - d
solution_steps:
- en: Broad groups rest on stable features such as cell type, body organisation and nutrition.
- en: Colour, size and location vary too much within a group to be reliable.
- en: The correct option is b.
tier: C
