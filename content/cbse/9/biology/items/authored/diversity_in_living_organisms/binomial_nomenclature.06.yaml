type: mcq
options:
- id: a
  en: 'Genus word capitalised first, species word in lower case: Rana sylvestris'
- id: b
  en: 'Both words capitalised: Rana Sylvestris'
- id: c
  en: 'Both words in lower case: rana sylvestris'
- id: d
  en: 'Species word written first, then the genus word: Sylvestris Rana'
answer:
  sympy: a
  accept: []
