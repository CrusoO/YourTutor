stem:
  en: A scientist names a newly found frog that belongs to the genus Rana. Which written name follows the rules?
hints:
- level: 1
  en: Check which word is written first and what case it uses.
- level: 2
  en: Consider how the second word should be written.
- level: 3
  en: Eliminate names where the order of the two words is reversed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
