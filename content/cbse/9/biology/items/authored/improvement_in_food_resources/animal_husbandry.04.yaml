stem:
  en: A fish farmer keeps a large number of fish in a small pond. Which practice would most help keep the fish healthy?
hints:
- level: 1
  en: Think about what fish need from the water in order to breathe.
- level: 2
  en: Consider how crowding can use up something important in the pond.
- level: 3
  en: Eliminate choices that add food without checks or leave the water unmanaged.
