stem:
  en: Farmers in a dry region want a crop variety that keeps yielding with less water. Which trait should breeders select for?
hints:
- level: 1
  en: Think about a trait that helps a plant survive and produce under limited moisture.
- level: 2
  en: Consider which quality is named after dry conditions.
- level: 3
  en: Eliminate traits that increase water loss or change only the size of the plant.
