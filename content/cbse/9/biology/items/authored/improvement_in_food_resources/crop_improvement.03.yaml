id: A.9.biology.improvement_in_food_resources.crop_improvement.03
skill_ids:
- SK.A.9.biology.crop_improvement
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A wheat variety is bred to resist a fungal disease. Why is disease resistance valued in crop improvement?
hints:
- level: 1
  en: Think about what happens to the harvest when a crop is infected.
- level: 2
  en: Consider how much of the crop survives an outbreak.
- level: 3
  en: Eliminate options about water, seeds or extra chemicals.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Resistant plants lose less of the harvest to disease
- id: b
  en: Resistant plants never need water
- id: c
  en: Resistant plants need more pesticide, which raises yield
- id: d
  en: Resistant plants produce no seeds
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.1439BBFFF009
  when_answer_equals:
  - b
- id: MC.A.7EB2DEC3B03B
  when_answer_equals:
  - d
- id: MC.A.A21DD3A55164
  when_answer_equals:
  - c
solution_steps:
- en: Resistant varieties keep more of the crop alive and productive when disease strikes, which stabilises yields.
- en: They can also reduce the need for chemical sprays.
- en: The correct option is a.
tier: C
