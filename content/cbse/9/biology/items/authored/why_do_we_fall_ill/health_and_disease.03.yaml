role: explain
stem:
  en: A person has persistently high blood pressure that is not caused by any microbe. How is this condition best classified?
hints:
- level: 1
  en: Think about whether a microbe is the cause of this condition.
- level: 2
  en: Consider whether the condition can spread from person to person.
- level: 3
  en: Eliminate options that describe health or contact spread.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A healthy state with no symptoms
- id: b
  en: A non-infectious disease
- id: c
  en: A trait that cannot be treated
- id: d
  en: An infectious disease spread by contact
answer:
  sympy: b
  accept: []
