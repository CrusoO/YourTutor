difficulty: 0.9
pool: practice
role: apply
stem:
  en: A disease spreads only when an infected person has direct contact with healthy people. Which preventive step addresses this route most directly?
hints:
- level: 1
  en: Think about breaking contact between infected and healthy people.
- level: 2
  en: Consider which step stops the infected from meeting others.
- level: 3
  en: Eliminate actions aimed at water, insects or nutrition.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Spraying insecticide across the fields
- id: b
  en: Isolating infected people until they are no longer contagious
- id: c
  en: Adding vitamins to the daily diet
- id: d
  en: Improving the filter at the village tap
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.2BA4D92A30D5
  when_answer_equals:
  - d
- id: MC.A.E7D7F28575B3
  when_answer_equals:
