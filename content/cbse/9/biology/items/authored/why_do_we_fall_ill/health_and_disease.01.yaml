id: A.9.biology.why_do_we_fall_ill.health_and_disease.01
skill_ids:
- SK.A.9.biology.health_and_disease
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which description best defines health?
hints:
- level: 1
  en: Think about more than the body alone when judging whether someone is well.
- level: 2
  en: Consider whether a person's mind and relationships count.
- level: 3
  en: Eliminate definitions based on one short time period or one visit.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A state of complete physical, mental and social well-being
- id: b
  en: Living for many years without a doctor's visit
- id: c
  en: Having a strong body that never needs rest
- id: d
  en: Having no symptoms for a single day
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.1AAFF25063B6
  when_answer_equals:
  - d
- id: MC.A.E2D5E5E0B146
  when_answer_equals:
  - c
- id: MC.A.F0F530969240
  when_answer_equals:
  - b
solution_steps:
- en: Health is a state of complete physical, mental and social well-being, not merely the absence of disease.
- en: Disease is a condition that disturbs normal functioning.
- en: The correct option is a.
tier: C
