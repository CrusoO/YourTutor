difficulty: 0.6
pool: practice
role: apply
stem:
  en: A village wants to stop a stomach infection that spreads through its shared water source. Which combined action would be most effective?
hints:
- level: 1
  en: Think about breaking the route from waste to drinking water.
- level: 2
  en: Consider how the water source can be kept free of waste.
- level: 3
  en: Eliminate actions that target only one group or the wrong route.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Banning all travel between neighbouring villages
- id: b
  en: Giving everyone antibiotics without testing the water
- id: c
  en: Distributing face masks to children only
- id: d
  en: Treating the water source and keeping toilets away from it
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.A805C130CFD8
  when_answer_equals:
  - b
- id: MC.A.E10B6381B929
  when_answer_equals:
  - c
- id: MC.A.E2090DB32F1F
  when_answer_equals:
  - a
solution_steps:
- en: Treating the water and keeping waste away from it cut off the route from faeces to drinking water.
- en: This targets the actual transmission path.
- en: The correct option is d.
tier: C
