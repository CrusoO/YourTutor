id: A.9.biology.why_do_we_fall_ill.health_and_disease.05
skill_ids:
- SK.A.9.biology.health_and_disease
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: In a village, an illness appears only in households that drink from a contaminated well, and it does not pass directly from person to person. Which statement best fits?
hints:
- level: 1
  en: Think about how a pathogen reaches people through a shared resource.
- level: 2
  en: Consider the route of transmission when there is no direct contact.
- level: 3
  en: Eliminate causes that are inherited or purely dietary.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is a nutrient deficiency from a poor diet
- id: b
  en: It is waterborne and spreads through the water supply, not directly between people
- id: c
  en: It is a healthy state caused by harmless bacteria
- id: d
  en: It is caused by an inherited gene shared in the community
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.4378A0C83EB3
  when_answer_equals:
  - d
- id: MC.A.5743FBB65889
  when_answer_equals:
  - a
- id: MC.A.D7B15F040155
  when_answer_equals:
  - c
solution_steps:
- en: Waterborne pathogens reach people through a contaminated shared source, so the illness is infectious without passing directly between people.
- en: Clean supply and treatment reduce it.
- en: The correct option is b.
tier: C
