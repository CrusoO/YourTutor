id: A.9.biology.why_do_we_fall_ill.infectious_diseases.06
skill_ids:
- SK.A.9.biology.infectious_diseases
difficulty: 0.9
pool: practice
role: explain
stem:
  en: Which feature best distinguishes an infectious disease from a non-infectious disease?
hints:
- level: 1
  en: Think about what causes the disease rather than what it feels like.
- level: 2
  en: Consider whether the cause can move from one host to another.
- level: 3
  en: Eliminate options that describe symptoms or treatments.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It always causes a fever
- id: b
  en: It is always visible on the skin
- id: c
  en: It is caused by a pathogen that can be transmitted to others
- id: d
  en: It can only be treated with surgery
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.1054EF3D175C
  when_answer_equals:
  - a
- id: MC.A.37F103B7E658
  when_answer_equals:
