stem:
  en: Which everyday action most directly reduces the spread of an airborne infection when someone is coughing?
hints:
- level: 1
  en: Think about how droplets leave the body when a person coughs.
- level: 2
  en: Consider which action blocks droplets from reaching others.
- level: 3
  en: Eliminate actions that share items or cut off ventilation.
