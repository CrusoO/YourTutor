id: A.9.biology.natural_resources.water_cycle.05
skill_ids:
- SK.A.9.biology.water_cycle
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A forest is cleared and, after heavy rain, the soil dries out faster than before. Which change in the water cycle best explains the reduced return of vapour to the air?
hints:
- level: 1
  en: Think about which living stage returns water vapour from plants.
- level: 2
  en: Consider how many leaves are left to release water after clearing.
- level: 3
  en: Eliminate options that add water to the soil or describe cloud formation.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Less transpiration from fewer plants
- id: b
  en: Higher condensation at ground level
- id: c
  en: More infiltration into deep rock layers
- id: d
  en: Greater groundwater recharge through the roots
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.4D7C280ED1F5
  when_answer_equals:
  - c
- id: MC.A.F0EA670EDDAE
  when_answer_equals:
  - b
- id: MC.A.76AF7FB88E49
  when_answer_equals:
  - d
solution_steps:
- en: Trees release large amounts of vapour by transpiration.
- en: With fewer plants less vapour returns to the atmosphere, and more rain runs off instead of being cycled back.
- en: The correct option is a.
tier: C
diagram_note: 'Draw two side-by-side scenes: a forest with trees releasing vapour upward through leaves, and cleared land with bare soil and runoff arrows. Label transpiration and runoff.'
