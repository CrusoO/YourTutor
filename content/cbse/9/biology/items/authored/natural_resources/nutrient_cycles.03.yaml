stem:
  en: Bacteria living in root nodules of legumes convert nitrogen gas from the air into a form that plants can absorb. What is this process called?
hints:
- level: 1
  en: Think about how nitrogen gas becomes a compound that can be used.
- level: 2
  en: Consider the first step in which the gas enters the living world.
- level: 3
  en: Eliminate processes that return nitrogen to the air or convert nitrates.
