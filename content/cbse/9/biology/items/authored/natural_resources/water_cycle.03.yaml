solution_steps:
- en: When rising vapour cools it loses energy and changes back into liquid, forming droplets that cluster into clouds.
- en: This change of state is condensation.
- en: The correct option is b.
tier: C
diagram_note: Draw a simple water cycle with the sun over a sea, arrows for rising vapour, a cloud at high altitude, and labels for each stage.
