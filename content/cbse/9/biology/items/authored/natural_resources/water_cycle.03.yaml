id: A.9.biology.natural_resources.water_cycle.03
skill_ids:
- SK.A.9.biology.water_cycle
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Water vapour rises, cools high in the atmosphere, and forms tiny droplets that gather into clouds. Which process is described?
hints:
- level: 1
  en: Think about what happens to vapour when it loses heat.
- level: 2
  en: Consider which change of state turns a gas back into a liquid.
- level: 3
  en: Eliminate processes that involve leaves or soil.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Sublimation
- id: b
  en: Condensation
- id: c
  en: Infiltration
- id: d
  en: Transpiration
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.09C7C08C40D3
  when_answer_equals:
  - a
- id: MC.A.6FB90B1A49D4
  when_answer_equals:
