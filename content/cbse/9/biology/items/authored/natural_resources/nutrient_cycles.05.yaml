id: A.9.biology.natural_resources.nutrient_cycles.05
skill_ids:
- SK.A.9.biology.nutrient_cycles
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: After harvest, a farmer leaves the roots of a legume crop in the soil. How does this practice improve the fertility of the soil for a later crop?
hints:
- level: 1
  en: Think about what happens to nitrogen held in root nodules when plant parts decay.
- level: 2
  en: Consider which nutrient the legume adds to the soil rather than removes.
- level: 3
  en: Eliminate options where a gas is stored or roots absorb more nutrients.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Roots store carbon dioxide permanently in the soil
- id: b
  en: Roots absorb extra nitrates that the next crop needs
- id: c
  en: Roots release oxygen that fixes nitrogen gas into the soil
- id: d
  en: Nodule bacteria leave fixed nitrogen in the soil for later crops
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.EF93FBA76CEE
  when_answer_equals:
  - c
- id: MC.A.039156609898
  when_answer_equals:
  - b
- id: MC.A.34FCC4A0D5A5
  when_answer_equals:
  - a
solution_steps:
- en: Legume root nodules fix nitrogen.
- en: As roots and plant residues decay, nitrogen compounds enrich the soil for subsequent crops, which reduces the need for added fertiliser.
- en: The correct option is d.
tier: C
diagram_note: Draw a legume root system with nodules, an arrow from the nodules into the soil showing nitrogen compounds, and a second arrow to a following crop.
