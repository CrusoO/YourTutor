  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It stops carbon from moving through the soil
- id: b
  en: It removes carbon dioxide through photosynthesis
- id: c
  en: It releases carbon dioxide into the atmosphere
- id: d
  en: It locks carbon permanently into fossil fuel today
answer:
  sympy: c
  accept: []
