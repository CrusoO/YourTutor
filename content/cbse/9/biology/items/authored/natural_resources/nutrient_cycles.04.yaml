stem:
  en: Decomposers break down dead leaves in the soil. What role does this decomposition play in the carbon cycle?
hints:
- level: 1
  en: Think about what decomposers do with the carbon in dead matter.
- level: 2
  en: Consider whether the decomposers' respiration returns a gas to the environment.
- level: 3
  en: Eliminate options that describe photosynthesis or fossil formation.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
