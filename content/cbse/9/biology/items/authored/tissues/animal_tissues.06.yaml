id: A.9.biology.tissues.animal_tissues.06
skill_ids:
- SK.A.9.biology.animal_tissues
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A tendon joins a muscle to a bone and must carry strong pulls without stretching much. Which tissue is the tendon mainly made of?
hints:
- level: 1
  en: Think about which tissue type holds structures together and is rich in fibres.
- level: 2
  en: Consider whether a tendon is mainly made of contracting cells.
- level: 3
  en: Eliminate tissues whose main role is covering or signalling.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Dense fibrous connective tissue
- id: b
  en: Epithelial tissue
- id: c
  en: Cardiac muscle
- id: d
  en: Loose connective tissue
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.9119459C25D5
  when_answer_equals:
  - d
- id: MC.A.7431EE9602B5
  when_answer_equals:
  - c
- id: MC.A.32EFE9FE63ED
  when_answer_equals:
  - b
solution_steps:
- en: Tendons are made of dense fibrous connective tissue, with collagen fibres arranged in parallel.
- en: This gives them strength to transmit force from muscle to bone.
- en: The correct option is a.
tier: C
diagram_note: Draw a tendon connecting a muscle block to a bone block, with a magnified inset showing parallel fibres labelled as dense fibrous connective tissue.
