solution_steps:
- en: Stomata are pores bounded by guard cells in the epidermis, the outer protective layer of the leaf.
- en: When the guard cells lose water they become limp and the pore closes.
- en: The correct option is d.
tier: C
diagram_note: Draw a leaf cross-section with the upper and lower outer layers labelled, a small pore between two bean-shaped guard cells, and the green cells below labelled as the inner layer.
