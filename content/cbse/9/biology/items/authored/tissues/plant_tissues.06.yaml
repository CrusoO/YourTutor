id: A.9.biology.tissues.plant_tissues.06
skill_ids:
- SK.A.9.biology.plant_tissues
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Two bean-shaped cells control a small pore on the leaf surface and close it when they lose water. Which tissue layer of the leaf contains these cells?
hints:
- level: 1
  en: Think about the outermost layer of the leaf.
- level: 2
  en: Consider which layer is exposed to air and contains the pores.
- level: 3
  en: Eliminate the layers that lie inside the leaf.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Cambium
- id: b
  en: Xylem
- id: c
  en: Mesophyll
- id: d
  en: Epidermis
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.0E94B238481D
