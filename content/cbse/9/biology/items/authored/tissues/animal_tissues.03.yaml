id: A.9.biology.tissues.animal_tissues.03
skill_ids:
- SK.A.9.biology.animal_tissues
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Blood, bone and fat tissue differ from covering tissue in one main way. Which feature is this?
hints:
- level: 1
  en: Think about the material that fills the spaces between cells in these tissues.
- level: 2
  en: Compare how tightly the cells in these tissues are packed.
- level: 3
  en: Eliminate options that describe contraction or impulse conduction.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Cells packed in tight sheets with almost no material between them
- id: b
  en: Cells that send electrical impulses along long fibres
- id: c
  en: Cells that contract to produce movement
- id: d
  en: A large amount of non-living matrix between the cells
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.0DB8FCB2AF74
  when_answer_equals:
  - c
- id: MC.A.E5780FE9612B
  when_answer_equals:
  - a
- id: MC.A.9E9200C0A568
  when_answer_equals:
  - b
solution_steps:
- en: Connective tissues have cells scattered within an abundant extracellular matrix, such as the plasma of blood or the mineral matrix of bone.
- en: Covering epithelium has cells packed closely with little matrix between them.
- en: The correct option is d.
tier: C
diagram_note: 'Draw two small panels: on the left, scattered cells sitting in a broad matrix with fibres, labelled as connective tissue; on the right, a sheet of tightly packed cells labelled as covering tissue.'
