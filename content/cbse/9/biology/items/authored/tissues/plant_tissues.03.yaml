solution_steps:
- en: Collenchyma is a living permanent tissue whose cell walls are thickened unevenly, mainly at the corners.
- en: It gives flexible support to growing stems and leaves.
- en: The correct option is d.
tier: C
diagram_note: Draw a cross-section of a young stem showing the outer cortex with cells whose corners are thickened. Label the thick corners and the central vascular bundles.
