id: A.9.biology.tissues.plant_tissues.03
skill_ids:
- SK.A.9.biology.plant_tissues
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A plant needs stems that bend in the wind without breaking. Which living permanent tissue, with unevenly thickened corners, gives this flexible support?
hints:
- level: 1
  en: Consider which permanent tissue has living cells.
- level: 2
  en: Think about tissues whose walls are thickened unevenly at the corners.
- level: 3
  en: Eliminate tissues made only of dead cells.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Xylem
- id: b
  en: Sclerenchyma
- id: c
  en: Parenchyma
- id: d
  en: Collenchyma
answer:
  sympy: d
  accept: []
misconception_rules:
