stem:
  en: A ring of bark is removed all the way around a woody stem. Within a few weeks the tissue just above the ring swells. Which tissue was cut, causing this buildup?
hints:
- level: 1
  en: Think about which tissue carries food downward from the leaves.
- level: 2
  en: Consider what happens above a block in the movement of food.
- level: 3
  en: Eliminate water-only tissues, since the ring affected food movement.
