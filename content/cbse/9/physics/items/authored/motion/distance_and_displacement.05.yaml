id: A.9.physics.motion.distance_and_displacement.05
skill_ids:
- SK.A.9.physics.distance_and_displacement
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A car drives 60 m east from point A to point B, then 80 m north to point C. What is the magnitude of the straight-line displacement from A to C, in metres?
hints:
- level: 1
  en: The two legs are perpendicular, so they form a right-angled triangle.
- level: 2
  en: Square each leg, add the squares, then take the square root.
- level: 3
  en: The straight line from A to C is the hypotenuse of that triangle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '100'
  accept: []
solution_steps:
- en: 'The two legs are perpendicular, so the displacement is the hypotenuse: the square root of 60 squared plus 80 squared is 100 m.'
- en: The unit of the answer is m.
- en: Answer = 100
tier: C
diagram_note: 'A right-angled route: a horizontal line from A to B labelled 60 m east, then a vertical line from B up to C labelled 80 m north, with a dashed straight line joining A to C.'
