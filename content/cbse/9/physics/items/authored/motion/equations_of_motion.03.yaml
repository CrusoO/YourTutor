difficulty: 0.6
pool: practice
role: procedure
stem:
  en: An object starts with a velocity of 4 m/s and accelerates uniformly at 3 m/s2 for 6 s. What distance does it cover, in metres?
hints:
- level: 1
  en: Use the equation that relates distance to initial velocity, time and acceleration.
- level: 2
  en: Half of the acceleration multiplies the time squared.
- level: 3
  en: Add the distance from the initial velocity to the distance from the acceleration.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '78'
  accept: []
solution_steps:
- en: Using s = ut + half at squared, the first part is 4 times 6, which is 24, and the second part is half of 3 times 36, which is 54, giving 78 m.
- en: The unit of the answer is m.
- en: Answer = 78
tier: C
