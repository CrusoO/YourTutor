stem:
  en: A boat is steered straight across a river at 4 m/s relative to the water, while the water flows at 3 m/s. What is the boat's speed relative to the bank?
hints:
- level: 1
  en: The two velocities are at right angles to each other.
- level: 2
  en: Combine perpendicular velocities using the right-angled triangle rule.
- level: 3
  en: Adding the numbers directly is wrong when the directions differ.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
