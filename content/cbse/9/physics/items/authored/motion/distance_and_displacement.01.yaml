  author: model-draft
type: numeric
answer:
  sympy: '40'
  accept: []
solution_steps:
- en: 'Distance is the full length of the path, so the two legs are added together: 30 m plus 10 m.'
- en: The unit of the answer is m.
- en: Answer = 40
