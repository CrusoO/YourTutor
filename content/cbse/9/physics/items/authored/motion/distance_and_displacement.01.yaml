stem:
  en: Along a straight corridor, a student first moves 30 m eastward and then 10 m westward. What total distance has the student covered, in metres?
hints:
- level: 1
  en: Distance adds every part of the path, whatever the direction.
- level: 2
  en: Think about how much ground was covered, not where the student ended up.
- level: 3
  en: Ignore directions when you combine the lengths of the walk.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
