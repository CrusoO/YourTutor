difficulty: 0.6
pool: practice
role: apply
stem:
  en: A car travels 50 km east in 1 hour and then returns 50 km west in 1 hour. Which statement about its average velocity for the whole trip is correct?
hints:
- level: 1
  en: Velocity keeps track of direction along the path.
- level: 2
  en: Compare the net change in position with the total time taken.
- level: 3
  en: Ask where the car finishes relative to where it started.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: zero
- id: b
  en: 100 km/h
- id: c
  en: 50 km/h
- id: d
  en: 50 km/h east
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.F666C8482CBD
  when_answer_equals:
  - d
- id: MC.A.E9F6DD7C144E
  when_answer_equals:
