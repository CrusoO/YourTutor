id: A.9.physics.motion.motion_graphs.04
skill_ids:
- SK.A.9.physics.motion_graphs
difficulty: 0.6
pool: practice
role: apply
stem:
  en: On a velocity-time graph, a straight line slopes upward steadily. What does this indicate about the motion?
hints:
- level: 1
  en: Ask what the slope of a velocity-time graph measures.
- level: 2
  en: A slope is a change in one quantity divided by the change in time.
- level: 3
  en: Compare a rising line with a flat line on the same axes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: uniform acceleration in the positive direction
- id: b
  en: the distance covered is decreasing
- id: c
  en: the object has stopped
- id: d
  en: constant velocity
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.B25D638478C9
  when_answer_equals:
  - d
- id: MC.A.5F035812F09F
  when_answer_equals:
  - c
- id: MC.A.DA2E46166C79
  when_answer_equals:
  - b
solution_steps:
- en: The slope of a velocity-time graph is acceleration, so a steady upward slope means the velocity increases uniformly.
- en: The correct option is a.
tier: C
