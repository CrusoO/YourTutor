id: A.9.physics.motion.acceleration.05
skill_ids:
- SK.A.9.physics.acceleration
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A scooter moving at 18 m/s decelerates uniformly and comes to rest after 6 s, then accelerates from rest at 2 m/s2 for 4 s. What is its final speed, in m/s?
hints:
- level: 1
  en: Work out the first phase, where the scooter stops, before the second phase.
- level: 2
  en: The second phase starts from zero velocity, so its initial velocity is zero.
- level: 3
  en: Use the velocity at the end of the first phase as the starting value for the second.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '8'
  accept: []
solution_steps:
- en: The scooter stops, then starts again from zero velocity, and gains 2 m/s2 times 4 s, which gives a final speed of 8 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 8
tier: C
