role: apply
stem:
  en: A velocity-time graph starts at 0 at t = 0, rises linearly to 20 m/s at t = 5 s, then falls linearly to 0 at t = 9 s. What is the total distance travelled, in metres?
hints:
- level: 1
  en: Find the area of each triangle separately and add them.
- level: 2
  en: Each segment of the graph forms a triangle with the time axis.
- level: 3
  en: The base of the second triangle is the time from its peak to the stop.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '90'
  accept: []
solution_steps:
- en: The first triangle has area 50 m and the second has area 40 m, so the total distance is 90 m.
- en: The unit of the answer is m.
- en: Answer = 90
tier: C
diagram_note: 'A triangular velocity-time profile: a straight rising line from the origin to 20 m/s at 5 s, then a straight falling line back to zero at 9 s, sitting on the time axis.'
