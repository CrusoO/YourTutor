id: A.9.physics.motion.motion_graphs.03
skill_ids:
- SK.A.9.physics.motion_graphs
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A velocity-time graph rises in a straight line from 0 to 12 m/s over 4 s, then stays at 12 m/s for 6 s. What total distance is travelled, in metres?
hints:
- level: 1
  en: Split the area under the graph into a triangle and a rectangle.
- level: 2
  en: The area of a triangle is half of its base times its height.
- level: 3
  en: Add the two areas to get the total distance.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '96'
  accept: []
solution_steps:
- en: The rising part is a triangle with area 24 m and the flat part is a rectangle with area 72 m, giving a total of 96 m.
- en: The unit of the answer is m.
- en: Answer = 96
tier: C
diagram_note: Velocity in m/s on the vertical axis and time in s on the horizontal axis, with a straight line from the origin rising to the 12 m/s level at 4 s, then flat until 10 s.
