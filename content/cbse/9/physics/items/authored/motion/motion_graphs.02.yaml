difficulty: 0.2
pool: practice
role: recall
stem:
  en: A velocity-time graph is a straight horizontal line at 8 m/s lasting 5 s. How far does the object travel, in metres?
hints:
- level: 1
  en: On a velocity-time graph, distance is the area under the line.
- level: 2
  en: A rectangle's area is its width times its height.
- level: 3
  en: Multiply the speed by the duration.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '40'
  accept: []
solution_steps:
- en: The area under a constant velocity line is speed times time, which gives 8 m/s times 5 s, or 40 m.
- en: The unit of the answer is m.
- en: Answer = 40
tier: C
