id: A.9.physics.motion.motion_graphs.06
skill_ids:
- SK.A.9.physics.motion_graphs
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A distance-time graph is a curve that becomes steeper as time passes and then becomes a horizontal line. Which statement describes the object?
hints:
- level: 1
  en: Steeper parts on a distance-time graph mean larger speeds.
- level: 2
  en: Read the graph from left to right, following time.
- level: 3
  en: A horizontal segment corresponds to a state in which nothing is moving.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it moves at constant speed throughout
- id: b
  en: it moves backward and then forward
- id: c
  en: it stops and then speeds up
- id: d
  en: it speeds up and then stops
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.474CA874299C
  when_answer_equals:
  - c
- id: MC.A.7E3B8A8A46AD
  when_answer_equals:
  - a
- id: MC.A.09C5616B8A55
  when_answer_equals:
  - b
solution_steps:
- en: Steepness on a distance-time graph gives speed, so a steepening curve means speeding up and a flat segment means the object has stopped.
- en: The correct option is d.
tier: C
diagram_note: Distance in m on the vertical axis against time in s on the horizontal axis, showing a curve from the origin that gets steeper and then turns into a flat horizontal segment.
