stem:
  en: A car starts from rest and accelerates uniformly at 2 m/s2 for 5 s. What is its final velocity, in m/s?
hints:
- level: 1
  en: Use the first equation of motion with an initial velocity of zero.
- level: 2
  en: The final velocity is the initial velocity plus acceleration times time.
- level: 3
  en: Multiply the acceleration by the duration.
