id: A.9.physics.motion.acceleration.06
skill_ids:
- SK.A.9.physics.acceleration
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A ball is thrown straight up. At its highest point its velocity is momentarily zero. Ignoring air resistance, what is its acceleration at that instant?
hints:
- level: 1
  en: Gravity acts on the ball at every point of its flight.
- level: 2
  en: Velocity and acceleration can be different at the same instant.
- level: 3
  en: Think about which way gravity pulls on the ball.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 4.9 m/s2 downward
- id: b
  en: 9.8 m/s2 downward
- id: c
  en: 9.8 m/s2 upward
- id: d
  en: zero, because the ball has stopped
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.6B28F516FD54
  when_answer_equals:
  - d
- id: MC.A.1D2FC2FF837B
  when_answer_equals:
  - c
- id: MC.A.6EE93DE44790
  when_answer_equals:
  - a
solution_steps:
- en: Gravity gives the ball a constant downward acceleration of 9.8 m/s2 throughout its flight, even at the top where its velocity is momentarily zero.
- en: The correct option is b.
tier: C
