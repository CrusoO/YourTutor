  author: model-draft
type: numeric
answer:
  sympy: '20'
  accept: []
solution_steps:
- en: The runner ends 20 m north of the start, so the displacement magnitude is 20 m, while the distance covered is 80 m.
- en: The unit of the answer is m.
- en: Answer = 20
tier: C
