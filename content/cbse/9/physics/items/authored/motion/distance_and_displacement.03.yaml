stem:
  en: A runner goes 50 m north, then turns and goes 30 m south. What is the magnitude of the displacement from the start to the finish, in metres?
hints:
- level: 1
  en: Treat the two legs as opposite directions along one line.
- level: 2
  en: Combine them by subtracting the smaller leg from the larger one.
- level: 3
  en: The answer is a size, so no sign is needed at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
