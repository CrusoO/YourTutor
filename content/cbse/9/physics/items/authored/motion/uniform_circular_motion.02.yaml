stem:
  en: In uniform circular motion, the acceleration of the object is directed
hints:
- level: 1
  en: The acceleration is needed to keep turning the velocity.
- level: 2
  en: Think about which side the turning is pulled toward.
- level: 3
  en: It is perpendicular to the velocity at every moment.
