stem:
  en: An object of mass 70 kg weighs 140 N on another planet. What is the gravitational field strength there, in N/kg?
hints:
- level: 1
  en: Divide the weight by the mass.
- level: 2
  en: The field strength is weight per unit mass.
- level: 3
  en: 'Check the units: newtons divided by kilograms.'
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: Field strength equals weight divided by mass, so 140 N divided by 70 kg is 2 N/kg.
- en: The unit of the answer is N/kg.
- en: Answer = 2
tier: C
