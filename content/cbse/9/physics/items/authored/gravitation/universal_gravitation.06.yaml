stem:
  en: A mass is moved from Earth's surface to a height equal to Earth's radius above the surface. Its weight there compared with its surface weight is
hints:
- level: 1
  en: Measure the distance from Earth's centre, not from the surface.
- level: 2
  en: The new distance from the centre is twice the radius.
- level: 3
  en: Apply the inverse square dependence to that ratio.
