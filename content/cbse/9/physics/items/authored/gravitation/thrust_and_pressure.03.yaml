type: numeric
answer:
  sympy: '29400'
  accept: []
solution_steps:
- en: The weight is 588 N, and 588 N divided by 0.02 m2 gives 29400 N/m2.
- en: The unit of the answer is N/m2.
- en: Answer = 29400
