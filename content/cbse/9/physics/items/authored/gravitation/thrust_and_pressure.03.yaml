stem:
  en: A 60 kg person stands on one foot, and the contact area of that foot is 0.02 m2. Taking g as 9.8 m/s2, what is the pressure on the ground in N/m2?
hints:
- level: 1
  en: First find the person's weight from the mass.
- level: 2
  en: Divide the weight by the contact area.
- level: 3
  en: Remember that pressure is force per unit area.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
