stem:
  en: A 12 kg bag is taken to the Moon, where the gravitational field strength is 1.6 N/kg. What is its weight there, in newtons?
hints:
- level: 1
  en: Multiply the mass by the field strength given per kilogram.
- level: 2
  en: The field strength already has units of newtons per kilogram.
- level: 3
  en: Weight on the Moon depends on lunar gravity, not the Earth value.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '19.2'
  accept: []
solution_steps:
- en: Weight equals mass times field strength, so 12 kg times 1.6 N/kg gives 19.2 N.
- en: The unit of the answer is N.
- en: Answer = 19.2
tier: C
