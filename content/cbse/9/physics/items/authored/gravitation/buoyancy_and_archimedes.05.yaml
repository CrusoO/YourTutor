stem:
  en: A cylinder with base area 0.01 m2 and height 0.2 m is fully submerged in a liquid of density 500 kg/m3. Using g as 9.8 m/s2, what is the upthrust, in newtons?
hints:
- level: 1
  en: Find the cylinder's volume from its base area and height.
- level: 2
  en: Multiply the fluid density by that volume to get the mass displaced.
- level: 3
  en: Multiply the resulting mass by g.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '9.8'
  accept: []
solution_steps:
- en: The volume is 0.002 m3, so the displaced liquid has mass 1 kg and the upthrust is 1 kg times 9.8 m/s2, which is 9.8 N.
- en: The unit of the answer is N.
- en: Answer = 9.8
tier: C
diagram_note: An upright cylinder fully below a liquid surface line, with an upward arrow labelled upthrust and a downward arrow labelled weight, and its base and height dimensions marked.
