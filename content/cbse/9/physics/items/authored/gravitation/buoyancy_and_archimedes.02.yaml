stem:
  en: An object displaces 0.002 m3 of water when fully submerged. Using water density 1000 kg/m3 and g as 9.8 m/s2, what is the upthrust, in newtons?
hints:
- level: 1
  en: Find the mass of the displaced water from its density and volume.
- level: 2
  en: Multiply that mass by g.
- level: 3
  en: The upthrust equals the weight of the displaced fluid.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '19.6'
  accept: []
solution_steps:
- en: The displaced water has mass 2 kg, so its weight, and therefore the upthrust, is 2 kg times 9.8 m/s2, which is 19.6 N.
- en: The unit of the answer is N.
- en: Answer = 19.6
