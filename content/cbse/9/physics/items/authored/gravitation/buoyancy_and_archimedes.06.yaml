stem:
  en: A boat floats on a lake and then more cargo is loaded onto it. What happens to the volume of water the boat displaces?
hints:
- level: 1
  en: A floating boat's upthrust must equal its total weight.
- level: 2
  en: Consider what happens to the total weight after cargo is added.
- level: 3
  en: Think about how much water must be pushed aside for the upthrust to grow.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it decreases because the boat sits higher
- id: b
  en: it increases until the upthrust matches the new total weight
- id: c
  en: it stays the same because the boat is already floating
- id: d
  en: it becomes zero once the boat is loaded
answer:
  sympy: b
  accept: []
