stem:
  en: A ball is dropped from rest from a height of 19.6 m. Taking g as 9.8 m/s2, how many seconds does it take to reach the ground?
hints:
- level: 1
  en: Use the distance fallen from rest in terms of g and time.
- level: 2
  en: Solve for the square of the time first.
- level: 3
  en: Take the square root at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
