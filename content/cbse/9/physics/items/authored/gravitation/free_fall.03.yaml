type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: From h = half g t squared, t squared equals 2h divided by g, which is 4, so t is 2 s.
- en: The unit of the answer is s.
- en: Answer = 2
tier: C
