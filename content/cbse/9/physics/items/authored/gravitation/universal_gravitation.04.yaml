- id: MC.A.C78B234FE547
  when_answer_equals:
  - c
solution_steps:
- en: The distance is 60 times the radius, so the pull is one over 60 squared, or about one three-thousand-six-hundredth as strong.
- en: The correct option is b.
tier: C
