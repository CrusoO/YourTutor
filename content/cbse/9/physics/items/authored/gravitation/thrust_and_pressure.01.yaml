difficulty: 0.2
pool: practice
role: recall
stem:
  en: A force of 200 N acts perpendicularly on an area of 4 m2. What is the pressure, in N/m2?
hints:
- level: 1
  en: Pressure is force per unit area.
- level: 2
  en: Divide the force by the area.
- level: 3
  en: Check that the units come out as newtons per square metre.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '50'
  accept: []
solution_steps:
- en: Pressure equals force divided by area, so 200 N divided by 4 m2 gives 50 N/m2.
- en: The unit of the answer is N/m2.
- en: Answer = 50
tier: C
