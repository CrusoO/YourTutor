stem:
  en: The gravitational force between two bodies is 36 N when they are 2 m apart. What is the force, in newtons, when they are 6 m apart?
hints:
- level: 1
  en: The force varies inversely with the square of the separation.
- level: 2
  en: Find the ratio of the two separations and square it.
- level: 3
  en: Divide the original force by the square of that ratio.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
