difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A 5 kg object is weighed on a spring balance on Earth and then on a planet where the field strength is 3.2 N/kg. How does the reading change?
hints:
- level: 1
  en: Find the weight on Earth first, using the standard value of g.
- level: 2
  en: Then find the weight on the planet with its field strength.
- level: 3
  en: Subtract the two weights and note which one is larger.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: no change, since the mass stays the same
- id: b
  en: 16 N lower on the planet
- id: c
  en: 33 N higher on the planet
- id: d
  en: 33 N lower on the planet
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.CBD8C75704D7
