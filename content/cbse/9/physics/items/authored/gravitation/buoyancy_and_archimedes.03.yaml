role: procedure
stem:
  en: A solid block of volume 0.5 m3 is fully submerged in water of density 1000 kg/m3. Using g as 9.8 m/s2, what is the upthrust, in newtons?
hints:
- level: 1
  en: The submerged volume equals the displaced volume.
- level: 2
  en: Multiply the density, the volume and g together.
- level: 3
  en: The answer is the weight of the water displaced.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4900'
  accept: []
solution_steps:
- en: The displaced water has mass 500 kg, so the upthrust is 500 kg times 9.8 m/s2, which is 4900 N.
- en: The unit of the answer is N.
- en: Answer = 4900
tier: C
diagram_note: A rectangular block drawn fully below a horizontal water surface line, with an arrow pointing up labelled upthrust and an arrow pointing down labelled weight.
