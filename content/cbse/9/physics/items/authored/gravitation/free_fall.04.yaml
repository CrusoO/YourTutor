stem:
  en: A 1 kg stone and a 5 kg stone are dropped together from the same height. Ignoring air resistance, which statement is correct?
hints:
- level: 1
  en: Compare the acceleration of each stone in free fall.
- level: 2
  en: Mass changes the weight but not the acceleration in free fall.
- level: 3
  en: Think about whether the two stones start from the same height.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the 5 kg stone hits with five times the speed
- id: b
  en: the 5 kg stone hits first
- id: c
  en: they hit the ground at the same time
- id: d
  en: the 1 kg stone hits first
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.5411AAC1F43D
  when_answer_equals:
  - b
- id: MC.A.414592C9FFD8
  when_answer_equals:
