stem:
  en: A stone is thrown straight down at 5 m/s from a cliff and hits the ground after 2 s. Taking g as 9.8 m/s2, how far did it fall, in metres?
hints:
- level: 1
  en: Start from the given initial downward speed rather than from rest.
- level: 2
  en: Add the distance from the initial speed to the distance from gravity.
- level: 3
  en: Use the displacement equation with a nonzero starting velocity.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '29.6'
  accept: []
solution_steps:
- en: The displacement is 5 m/s times 2 s plus half of 9.8 m/s2 times 4 s squared, which gives 10 plus 19.6, a total of 29.6 m.
- en: The unit of the answer is m.
- en: Answer = 29.6
tier: C
