id: A.9.physics.force_and_laws_of_motion.third_law.06
skill_ids:
- SK.A.9.physics.third_law
difficulty: 0.9
pool: practice
role: explain
stem:
  en: A magnet pulls a steel pin toward it. Which statement describes the force pair involved?
hints:
- level: 1
  en: Consider the force the pin feels from the magnet.
- level: 2
  en: Ask which body the reaction force acts on.
- level: 3
  en: Compare the size and direction of the reaction with the original pull.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the magnet pulls itself back toward its own centre
- id: b
  en: the pin pulls the magnet with a force of the same size, directed toward the pin
- id: c
  en: the pin feels no force because it is not fixed
- id: d
  en: the pin pulls the magnet with a weaker force since it is lighter
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.AAA48CC25196
  when_answer_equals:
  - c
- id: MC.A.5957948FF2CC
  when_answer_equals:
  - d
- id: MC.A.E2722CAC51B5
  when_answer_equals:
  - a
solution_steps:
- en: The magnet and the pin attract each other, and the two forces form a third law pair of equal size and opposite direction, acting on different bodies.
- en: The correct option is b.
tier: C
