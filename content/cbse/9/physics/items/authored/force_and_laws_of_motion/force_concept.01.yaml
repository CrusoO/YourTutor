id: A.9.physics.force_and_laws_of_motion.force_concept.01
skill_ids:
- SK.A.9.physics.force_concept
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which of these is NOT an effect that a force can produce on an object?
hints:
- level: 1
  en: A force changes motion or shape, but it does not add matter to the object.
- level: 2
  en: Consider what happens to the amount of matter in the object when a push is applied.
- level: 3
  en: Check each option against changes in shape or motion.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: changing its shape
- id: b
  en: creating mass in the object
- id: c
  en: changing its direction of motion
- id: d
  en: starting it moving from rest
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.2E30AF1315A8
  when_answer_equals:
  - a
- id: MC.A.6D2FDBAE1A50
  when_answer_equals:
  - d
- id: MC.A.E2559B36F785
  when_answer_equals:
  - c
solution_steps:
- en: Forces can change an object's shape or its state of motion, but they do not create mass, which stays the same when a force is applied.
- en: The correct option is b.
tier: C
