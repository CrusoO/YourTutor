  original: true
  author: model-draft
type: numeric
answer:
  sympy: '8'
  accept: []
solution_steps:
- en: The 12 N east pull outweighs the 4 N west pull by 8 N, so the net force is 8 N east.
- en: The unit of the answer is N.
- en: Answer = 8
