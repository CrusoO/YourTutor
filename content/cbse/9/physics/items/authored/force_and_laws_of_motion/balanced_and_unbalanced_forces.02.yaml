stem:
  en: A box is pulled east with 12 N by one rope and west with 4 N by another. What is the magnitude of the net force, in newtons?
hints:
- level: 1
  en: Find the difference between the two opposite pulls.
- level: 2
  en: Use the larger pull minus the smaller one.
- level: 3
  en: The net force points in the direction of the bigger pull.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
