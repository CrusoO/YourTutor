stem:
  en: If the net force on a body doubles while its mass stays the same, what happens to its acceleration?
hints:
- level: 1
  en: Acceleration equals net force divided by mass.
- level: 2
  en: Keep the mass fixed and see how the ratio changes.
- level: 3
  en: Check whether the force appears on the top or the bottom of the ratio.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
