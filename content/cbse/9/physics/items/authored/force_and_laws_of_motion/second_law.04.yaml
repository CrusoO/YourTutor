  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it becomes four times larger
- id: b
  en: it stays the same
- id: c
  en: it doubles
- id: d
  en: it halves
answer:
  sympy: c
  accept: []
misconception_rules:
