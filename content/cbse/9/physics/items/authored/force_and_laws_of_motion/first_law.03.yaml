id: A.9.physics.force_and_laws_of_motion.first_law.03
skill_ids:
- SK.A.9.physics.first_law
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A card is pulled quickly from under objects resting on a table, and the objects remain almost in place. Which idea explains this?
hints:
- level: 1
  en: Think about what a body that is at rest tends to do.
- level: 2
  en: Consider how brief the pull is for the objects.
- level: 3
  en: Ask which property makes a body resist any change in its state.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the objects resist changes to their state of rest
- id: b
  en: gravity pushes the objects down onto the table
- id: c
  en: the card transfers its speed to the objects
- id: d
  en: friction disappears completely for the objects
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.5214D2AB6D81
  when_answer_equals:
  - d
- id: MC.A.8FDE9F8D4B1C
  when_answer_equals:
  - b
- id: MC.A.6C81692BDE35
  when_answer_equals:
  - c
solution_steps:
- en: Each object tends to stay at rest, and the quick pull lasts too short a time to move them much, so they stay almost in place.
- en: The correct option is a.
tier: C
