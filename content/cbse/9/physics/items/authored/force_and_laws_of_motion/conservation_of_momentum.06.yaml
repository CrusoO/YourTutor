stem:
  en: Two balls of equal mass collide head-on in an elastic collision. One moves at 5 m/s and the other is at rest, and the moving ball stops after the collision. What is the speed of the other ball afterwards?
hints:
- level: 1
  en: Momentum is conserved in the collision.
- level: 2
  en: With equal masses, one ball's momentum is passed to the other.
- level: 3
  en: Check which ball carries the momentum after the collision.
prediction_prompt:
