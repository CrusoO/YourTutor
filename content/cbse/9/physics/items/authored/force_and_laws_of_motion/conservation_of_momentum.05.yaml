stem:
  en: A 1500 kg car moving east at 20 m/s collides with a 500 kg car at rest, and they stick together. What is their common velocity, in m/s?
hints:
- level: 1
  en: Work out the total momentum before the collision.
- level: 2
  en: The total mass after sticking is the sum of both masses.
- level: 3
  en: Divide the total momentum by that sum.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
