id: A.9.physics.force_and_laws_of_motion.balanced_and_unbalanced_forces.05
skill_ids:
- SK.A.9.physics.balanced_and_unbalanced_forces
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A ball hangs at rest from a ceiling hook. Its weight is 2 N downward and the string pulls it upward. Which statement about the net force on the ball is correct?
hints:
- level: 1
  en: Compare the sizes and directions of the two forces on the ball.
- level: 2
  en: The ball is not accelerating, which tells you something about the forces.
- level: 3
  en: Consider whether one force is larger than the other.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 2 N downward
- id: b
  en: 2 N upward
- id: c
  en: 4 N upward
- id: d
  en: zero, since the string tension equals the weight
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.78E2B1B653A6
  when_answer_equals:
  - a
- id: MC.A.51EA32D3E51B
  when_answer_equals:
  - c
- id: MC.A.5EA028331AAA
  when_answer_equals:
  - b
solution_steps:
- en: 'The ball is at rest, so its forces balance: the upward tension equals its weight, and the net force is zero.'
- en: The correct option is d.
tier: C
diagram_note: A ball hanging below a fixed hook, with a downward arrow labelled 2 N weight and an upward arrow labelled tension, both drawn through the centre of the ball.
