id: A.9.physics.force_and_laws_of_motion.third_law.03
skill_ids:
- SK.A.9.physics.third_law
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A student stands on a skateboard and throws a heavy ball forward. Why does the student roll backward?
hints:
- level: 1
  en: The student also feels a force from the ball.
- level: 2
  en: Look for the force that acts on the student through the ball.
- level: 3
  en: Consider which object each force acts on.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the air pushes the student back and nothing else
- id: b
  en: the student loses mass when throwing
- id: c
  en: the ball's weight pulls the student backward
- id: d
  en: the ball pushes the student backward with the same force the student gives the ball
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.0F983A1CE6D9
  when_answer_equals:
  - c
- id: MC.A.96CD4EFCEB7D
  when_answer_equals:
  - a
- id: MC.A.2792673CCB1A
  when_answer_equals:
  - b
solution_steps:
- en: When the student pushes the ball forward, the ball pushes the student backward with an equal force, causing the backward motion on the skateboard.
- en: The correct option is d.
tier: C
