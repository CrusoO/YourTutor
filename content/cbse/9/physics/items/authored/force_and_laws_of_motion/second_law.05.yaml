difficulty: 0.9
pool: practice
role: apply
stem:
  en: A 1200 kg car accelerates uniformly from rest to 20 m/s in 10 s. What is the average net force on it, in newtons?
hints:
- level: 1
  en: Find the acceleration from the change in velocity and the time taken.
- level: 2
  en: Then apply the second law with the car's mass.
- level: 3
  en: The car starts from rest, so the change in velocity is its final velocity.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2400'
  accept: []
solution_steps:
- en: The acceleration is 20 m/s divided by 10 s, which is 2 m/s2, so the force is 1200 kg times 2 m/s2, or 2400 N.
- en: The unit of the answer is N.
- en: Answer = 2400
tier: C
