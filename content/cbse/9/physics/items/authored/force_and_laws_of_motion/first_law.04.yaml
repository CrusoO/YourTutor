id: A.9.physics.force_and_laws_of_motion.first_law.04
skill_ids:
- SK.A.9.physics.first_law
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A hockey puck slides on smooth ice at constant velocity. Which statement best explains why it keeps moving without slowing?
hints:
- level: 1
  en: Think about the forces that act along the ice's surface.
- level: 2
  en: Compare the friction on ice with friction on a rough floor.
- level: 3
  en: Constant velocity means the net force is not changing the motion.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: very little friction acts, so the net force on it is almost zero
- id: b
  en: it carries a built-in engine that keeps pushing
- id: c
  en: gravity pushes it forward along the ice
- id: d
  en: its mass keeps it moving on its own
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.10E1C5499C6D
  when_answer_equals:
  - b
- id: MC.A.78DF4BDEF2A4
  when_answer_equals:
  - c
- id: MC.A.995BA432AFCB
  when_answer_equals:
  - d
solution_steps:
- en: Ice gives very little friction, so the net horizontal force on the puck is nearly zero and its velocity stays almost constant.
- en: The correct option is a.
tier: C
