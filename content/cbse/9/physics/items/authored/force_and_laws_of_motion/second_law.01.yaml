id: A.9.physics.force_and_laws_of_motion.second_law.01
skill_ids:
- SK.A.9.physics.second_law
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A 2 kg object accelerates at 3 m/s2. What is the net force on it, in newtons?
hints:
- level: 1
  en: Multiply the mass by the acceleration.
- level: 2
  en: Check that the units combine to give newtons.
- level: 3
  en: Use the second law with mass as the multiplying factor.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: Force equals mass times acceleration, so 2 kg times 3 m/s2 gives 6 N.
- en: The unit of the answer is N.
- en: Answer = 6
tier: C
