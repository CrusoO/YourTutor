id: A.9.physics.force_and_laws_of_motion.force_concept.06
skill_ids:
- SK.A.9.physics.force_concept
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Two students push the same box in opposite directions with equal strength, and the box stays still. What can be said about the forces?
hints:
- level: 1
  en: Compare the two forces by both size and direction.
- level: 2
  en: Opposite directions reduce the total effect on the box.
- level: 3
  en: Ask what the box does when the net effect is zero.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the box is pushed twice as hard because both forces act
- id: b
  en: the stronger student always wins even when strengths are equal
- id: c
  en: the box gets no force from either student
- id: d
  en: they cancel out, so the net force on the box is zero
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.6B5560EB91F8
  when_answer_equals:
  - a
- id: MC.A.C6E5827BF00B
  when_answer_equals:
  - c
- id: MC.A.CB04D95FCBBB
  when_answer_equals:
  - b
solution_steps:
- en: Equal and opposite pushes produce a zero net force, which is why the box does not accelerate even though two forces act on it.
- en: The correct option is d.
tier: C
