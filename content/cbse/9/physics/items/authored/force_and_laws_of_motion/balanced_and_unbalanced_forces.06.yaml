stem:
  en: A trolley is pulled east with a force of 20 N while friction acts west with 6 N. What is the net force on the trolley, in newtons?
hints:
- level: 1
  en: Friction acts opposite to the pull here.
- level: 2
  en: Subtract the smaller opposing force from the larger one.
- level: 3
  en: The direction of the larger force gives the direction of the net force.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '14'
  accept: []
solution_steps:
- en: The 20 N pull east is opposed by 6 N of friction west, leaving 14 N east that accelerates the trolley.
- en: The unit of the answer is N.
- en: Answer = 14
tier: C
diagram_note: A trolley drawn as a rectangle, with a long arrow to the east labelled 20 N pulling it and a shorter arrow to the west labelled 6 N for friction.
