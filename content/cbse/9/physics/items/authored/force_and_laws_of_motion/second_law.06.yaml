stem:
  en: A 0.5 kg ball moving at 10 m/s is stopped by a bat in 0.02 s. What is the magnitude of the average force from the bat, in newtons?
hints:
- level: 1
  en: Find the change in velocity during the contact.
- level: 2
  en: Divide that change by the contact time to get the acceleration.
- level: 3
  en: Multiply the mass by the acceleration to finish.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '250'
  accept: []
solution_steps:
- en: The ball loses 10 m/s in 0.02 s, an acceleration of 500 m/s2, so the force is 0.5 kg times 500 m/s2, which is 250 N.
- en: The unit of the answer is N.
- en: Answer = 250
tier: C
