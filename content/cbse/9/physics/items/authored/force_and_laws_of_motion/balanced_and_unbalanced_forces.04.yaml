id: A.9.physics.force_and_laws_of_motion.balanced_and_unbalanced_forces.04
skill_ids:
- SK.A.9.physics.balanced_and_unbalanced_forces
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A toy car rests on a table. Which pair of forces acting on the car is balanced?
hints:
- level: 1
  en: Look at both forces acting on the car, not on other objects.
- level: 2
  en: Balanced forces act on the same object and cancel.
- level: 3
  en: Check which upward force keeps the car from falling.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the car's push on the table and the table's push on the car
- id: b
  en: its weight pulling down and the table pushing up with equal size
- id: c
  en: its weight and its velocity
- id: d
  en: its weight alone, with nothing opposing it
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.54E615C5E246
  when_answer_equals:
  - d
- id: MC.A.2FB07D32CCA9
  when_answer_equals:
  - c
- id: MC.A.7857C8A90BC2
  when_answer_equals:
  - a
solution_steps:
- en: The car's weight pulls down and the table pushes up with equal size, so both forces act on the car and balance.
- en: The correct option is b.
tier: C
