stem:
  en: A 4 kg trolley moving at 3 m/s hits a 2 kg trolley at rest, and they stick together. What is their common velocity, in m/s?
hints:
- level: 1
  en: Find the total momentum before the collision.
- level: 2
  en: Divide the total momentum by the total mass after they stick.
- level: 3
  en: Momentum before the collision equals momentum after it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
