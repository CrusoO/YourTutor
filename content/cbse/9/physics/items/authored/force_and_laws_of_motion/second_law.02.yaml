id: A.9.physics.force_and_laws_of_motion.second_law.02
skill_ids:
- SK.A.9.physics.second_law
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which statement matches Newton's second law of motion?
hints:
- level: 1
  en: The law links three quantities through a product.
- level: 2
  en: Think about which quantity is multiplied by which.
- level: 3
  en: Acceleration appears on the same side as the mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: acceleration equals force plus mass
- id: b
  en: force equals mass divided by acceleration
- id: c
  en: net force equals mass times acceleration
- id: d
  en: force equals velocity times time
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.D0E5F9AE3C70
  when_answer_equals:
  - b
- id: MC.A.9BB18D6316B6
  when_answer_equals:
  - d
- id: MC.A.CB1AD8E31280
  when_answer_equals:
  - a
solution_steps:
- en: Newton's second law states F = m a, where F is the net force, m the mass and a the acceleration produced.
- en: The correct option is c.
tier: C
