id: A.9.physics.force_and_laws_of_motion.first_law.06
skill_ids:
- SK.A.9.physics.first_law
difficulty: 0.9
pool: practice
role: explain
stem:
  en: A coin rests on a card that sits on a glass. When the card is flicked away quickly, the coin drops straight into the glass. What is the key reason?
hints:
- level: 1
  en: Think about what the coin does while the card moves quickly under it.
- level: 2
  en: Ask how long the card stays in contact with the coin.
- level: 3
  en: Compare the coin's motion with the card's sudden acceleration.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: air pressure pulls the coin into the glass
- id: b
  en: the coin gains mass during the flick
- id: c
  en: the card pushes the coin downward with a larger force
- id: d
  en: the coin tends to stay at rest, so the card leaves before the coin is moved much
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.D755BC2456C4
  when_answer_equals:
  - c
- id: MC.A.7960F32F4E0D
  when_answer_equals:
  - a
- id: MC.A.ABF76B0D69D9
  when_answer_equals:
  - b
solution_steps:
- en: The coin resists changes in its state of rest, so when the card is flicked out quickly, the coin is left almost unmoved and falls into the glass.
- en: The correct option is d.
tier: C
