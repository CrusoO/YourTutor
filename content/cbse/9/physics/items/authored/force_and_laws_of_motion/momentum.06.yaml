difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A ball's momentum doubles while its mass stays the same. What happens to its kinetic energy?
hints:
- level: 1
  en: Write kinetic energy in terms of momentum and mass.
- level: 2
  en: The energy depends on momentum squared.
- level: 3
  en: Divide momentum squared by twice the mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it becomes half as large
- id: b
  en: it doubles
- id: c
  en: it stays the same
- id: d
  en: it becomes four times as large
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.55CACE59154F
  when_answer_equals:
  - b
- id: MC.A.758434BAE9DC
  when_answer_equals:
