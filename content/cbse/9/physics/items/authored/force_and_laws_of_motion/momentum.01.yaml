difficulty: 0.2
pool: practice
role: recall
stem:
  en: A 3 kg object moves at 4 m/s. What is its momentum, in kg m/s?
hints:
- level: 1
  en: Momentum is the product of mass and velocity.
- level: 2
  en: Multiply the two given values.
- level: 3
  en: Keep the unit as kilogram metres per second.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '12'
  accept: []
solution_steps:
- en: Momentum equals mass times velocity, so 3 kg times 4 m/s gives 12 kg m/s.
- en: The unit of the answer is kg m/s.
- en: Answer = 12
tier: C
