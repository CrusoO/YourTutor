id: A.9.physics.force_and_laws_of_motion.force_concept.03
skill_ids:
- SK.A.9.physics.force_concept
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A footballer kicks a stationary ball and it rolls away. Which statement best describes the force's role?
hints:
- level: 1
  en: Compare the ball before and after the kick.
- level: 2
  en: Ask what changed about the ball's state of motion.
- level: 3
  en: Think about what the foot does to the ball during contact.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the ball stores the force inside it and releases it
- id: b
  en: the kick must keep acting for the ball to keep moving
- id: c
  en: the kick creates the ball's mass
- id: d
  en: the kick changes the ball from rest to motion
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.54468E9FA8B5
  when_answer_equals:
  - c
- id: MC.A.7481BE2D1406
  when_answer_equals:
  - b
- id: MC.A.3199AF461DC1
  when_answer_equals:
  - a
solution_steps:
- en: A force acts on the ball during the kick and changes its velocity from zero to a nonzero value; once the foot leaves, the ball moves on without a continuing push.
- en: The correct option is d.
tier: C
