id: A.9.physics.force_and_laws_of_motion.force_concept.04
skill_ids:
- SK.A.9.physics.force_concept
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A spring is squeezed by pushing its two ends together. What change does the force produce?
hints:
- level: 1
  en: Look at how the spring's length or coils respond to the push.
- level: 2
  en: Think about what the force does to the spring's geometry.
- level: 3
  en: A force can deform an object without moving it far.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: a change in its shape
- id: b
  en: no change, because the spring does not move
- id: c
  en: a change in its temperature only
- id: d
  en: a change in its weight
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.074E0C2F5108
  when_answer_equals:
  - c
- id: MC.A.60E4F229230C
  when_answer_equals:
  - d
- id: MC.A.FCF9AE531F93
  when_answer_equals:
  - b
solution_steps:
- en: A squeezing force deforms the spring and changes its shape by shortening it, even if its position barely changes.
- en: The correct option is a.
tier: C
