id: A.9.physics.force_and_laws_of_motion.force_concept.05
skill_ids:
- SK.A.9.physics.force_concept
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A hand presses down on a table top. Which statement about the forces on the table is correct?
hints:
- level: 1
  en: Think about the reaction from the table's surface.
- level: 2
  en: Compare the size of the push from above with the upward response.
- level: 3
  en: Ask whether the table accelerates.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the table's own weight disappears when pressed
- id: b
  en: the table gives way because a force cannot act on a solid
- id: c
  en: the hand's force becomes zero once the table resists
- id: d
  en: the table pushes back up with an equal force, so the net force is zero
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.2771A3AAE383
  when_answer_equals:
  - b
- id: MC.A.54BE5602FAC3
  when_answer_equals:
  - a
- id: MC.A.AE2574A819C1
  when_answer_equals:
  - c
solution_steps:
- en: The table surface pushes up with a force equal to the downward push, so the table stays at rest and the net force on it is zero.
- en: The correct option is d.
tier: C
