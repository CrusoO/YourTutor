stem:
  en: A sound wave in air has wavelength 0.68 m and travels at 340 m/s. What is its frequency, in hertz?
hints:
- level: 1
  en: Frequency is speed divided by wavelength.
- level: 2
  en: Divide the speed by the wavelength.
- level: 3
  en: The answer should come out as cycles per second.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '500'
  accept: []
solution_steps:
- en: Frequency equals speed over wavelength, so 340 m/s divided by 0.68 m gives 500 Hz.
- en: The unit of the answer is Hz.
- en: Answer = 500
tier: C
