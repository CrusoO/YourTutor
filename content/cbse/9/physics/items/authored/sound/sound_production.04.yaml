id: A.9.physics.sound.sound_production.04
skill_ids:
- SK.A.9.physics.sound_production
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A ringing alarm clock is placed inside a jar, and air is pumped out until the jar is nearly empty. The sound becomes much fainter. What does this show?
hints:
- level: 1
  en: Think about what the jar contains as the air is removed.
- level: 2
  en: Ask what the sound needs in order to reach your ear.
- level: 3
  en: Consider the role of particles in carrying the disturbance.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: sound needs a material medium to travel
- id: b
  en: the clock stops vibrating once it is inside a jar
- id: c
  en: sound is produced only by changes of air pressure
- id: d
  en: sound travels faster when there is no air
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.426022E4287E
  when_answer_equals:
  - c
- id: MC.A.63F0A9918F8B
  when_answer_equals:
  - d
- id: MC.A.0FEDCE6DDDEA
  when_answer_equals:
  - b
solution_steps:
- en: As the air is removed, fewer particles carry the vibration, so the sound fades, showing that sound requires a material medium.
- en: The correct option is a.
tier: C
