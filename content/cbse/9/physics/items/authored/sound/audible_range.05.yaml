id: A.9.physics.sound.audible_range.05
skill_ids:
- SK.A.9.physics.audible_range
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: An earthquake produces ground vibrations at 0.5 Hz. How should this sound-type wave be described?
hints:
- level: 1
  en: Compare this frequency with the lower limit of human hearing.
- level: 2
  en: The prefix indicates that the frequency lies beneath the range.
- level: 3
  en: Consider which side of the audible band this frequency lies on.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: audible sound at a normal pitch
- id: b
  en: supersonic sound
- id: c
  en: ultrasound, above the audible range
- id: d
  en: infrasound, below the audible range
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.D11A57162D80
  when_answer_equals:
  - c
- id: MC.A.9EBC630DECDB
  when_answer_equals:
  - a
- id: MC.A.F0DB6F84DA17
  when_answer_equals:
  - b
solution_steps:
- en: Frequencies below about 20 Hz are called infrasound, and 0.5 Hz is far below the lower limit of human hearing.
- en: The correct option is d.
tier: C
