stem:
  en: An echo returns 1 s after a sound is produced. If the speed of sound is 340 m/s, how far away is the reflecting surface, in metres?
hints:
- level: 1
  en: The sound travels to the surface and back in the given time.
- level: 2
  en: Divide the total path by two.
- level: 3
  en: Use speed multiplied by time, then halve it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
