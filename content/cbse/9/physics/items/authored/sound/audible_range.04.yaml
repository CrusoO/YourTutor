difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why can ultrasound be used to scan inside the body?
hints:
- level: 1
  en: Think about what happens when a wave reaches the boundary between two tissues.
- level: 2
  en: Reflections carry information about where the boundaries are.
- level: 3
  en: Consider the link between frequency and the detail that can be seen.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it makes the body glow so it can be seen
- id: b
  en: it is loud enough to pass through every organ
- id: c
  en: it travels faster than light inside tissue
- id: d
  en: it has a high frequency, so it reflects from tissue boundaries and forms images
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.CD3170FC226D
  when_answer_equals:
  - b
- id: MC.A.951F231EA221
  when_answer_equals:
