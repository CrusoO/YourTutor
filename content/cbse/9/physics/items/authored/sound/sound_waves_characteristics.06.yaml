id: A.9.physics.sound.sound_waves_characteristics.06
skill_ids:
- SK.A.9.physics.sound_waves_characteristics
difficulty: 0.9
pool: practice
role: explain
stem:
  en: The amplitude of a sound is doubled while its frequency is also doubled. Which statement about the new sound is correct?
hints:
- level: 1
  en: Loudness and pitch are linked to different properties of the wave.
- level: 2
  en: Think about which property sets the pitch.
- level: 3
  en: Keep the wave speed in mind when you consider the wavelength.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it is quieter and lower in pitch
- id: b
  en: it is louder and lower in pitch
- id: c
  en: its wavelength doubles
- id: d
  en: it is louder and higher in pitch
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.0D7A656BB591
  when_answer_equals:
  - a
- id: MC.A.E849B069700B
  when_answer_equals:
  - b
- id: MC.A.9B12E03D149E
  when_answer_equals:
  - c
solution_steps:
- en: Doubling the amplitude increases loudness and doubling the frequency raises pitch, while the wavelength is halved because the speed is unchanged.
- en: The correct option is d.
tier: C
