difficulty: 0.9
pool: practice
role: apply
stem:
  en: A sound of wavelength 2 m travels through air at 340 m/s. How many complete cycles pass a fixed point in 0.5 s?
hints:
- level: 1
  en: Find the frequency from the speed and the wavelength first.
- level: 2
  en: The number of cycles equals the frequency times the time.
- level: 3
  en: Multiply the frequency by the time interval.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '85'
  accept: []
solution_steps:
- en: The frequency is 340 divided by 2, which is 170 Hz, and over 0.5 s that gives 85 complete cycles past the point.
- en: The unit of the answer is cycles.
- en: Answer = 85
tier: C
diagram_note: A wave train drawn along a horizontal line, with a fixed point marked on the line, a direction arrow along the train, and a bracket labelled one wavelength of 2 m.
