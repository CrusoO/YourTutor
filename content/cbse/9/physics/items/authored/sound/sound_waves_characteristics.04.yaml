difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which change makes a sound louder without changing its pitch?
hints:
- level: 1
  en: Loudness is linked to how far the particles move.
- level: 2
  en: Pitch is linked to frequency, which you should keep fixed.
- level: 3
  en: Think about the height of the wave rather than its timing.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: increasing its period
- id: b
  en: increasing its amplitude
- id: c
  en: decreasing its wavelength
- id: d
  en: increasing its frequency
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.9859DC53AC66
  when_answer_equals:
  - d
- id: MC.A.51EA57A81524
  when_answer_equals:
