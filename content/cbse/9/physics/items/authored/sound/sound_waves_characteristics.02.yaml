stem:
  en: A sound wave has a frequency of 200 Hz. What is its period, in seconds?
hints:
- level: 1
  en: The period is the reciprocal of the frequency.
- level: 2
  en: Divide one by the frequency.
- level: 3
  en: Use the time for one complete cycle.
