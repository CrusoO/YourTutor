stem:
  en: A person claps and hears the echo from a cliff after 0.6 s. Using 340 m/s for the speed of sound, how far away is the cliff, in metres?
hints:
- level: 1
  en: The sound travels to the cliff and back.
- level: 2
  en: The total path is twice the distance to the cliff.
- level: 3
  en: Multiply the speed by the time, then halve the result.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '102'
  accept: []
solution_steps:
- en: The sound covers 340 m/s times 0.6 s, which is 204 m in the round trip, so the cliff is 102 m away.
- en: The unit of the answer is m.
- en: Answer = 102
tier: C
