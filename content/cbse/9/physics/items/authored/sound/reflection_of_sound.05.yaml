  author: model-draft
type: numeric
answer:
  sympy: '3000'
  accept: []
solution_steps:
- en: The round trip covers 1500 m/s times 4 s, which is 6000 m, so the depth is 3000 m.
- en: The unit of the answer is m.
- en: Answer = 3000
