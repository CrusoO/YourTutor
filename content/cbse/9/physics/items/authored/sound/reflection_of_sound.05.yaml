stem:
  en: A ship sends a sound pulse down to the sea floor and receives the echo 4 s later. If the speed of sound in water is 1500 m/s, how deep is the sea floor, in metres?
hints:
- level: 1
  en: The pulse travels down and then back up.
- level: 2
  en: Find the total path length first.
- level: 3
  en: Halve the total path to get the depth.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
