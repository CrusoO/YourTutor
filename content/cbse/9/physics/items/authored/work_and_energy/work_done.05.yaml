id: A.9.physics.work_and_energy.work_done.05
skill_ids:
- SK.A.9.physics.work_done
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A block slides 12 m across a rough floor while friction of 6 N opposes its motion. What work is done by friction, in joules?
hints:
- level: 1
  en: Friction and the displacement point in opposite directions here.
- level: 2
  en: The sign of the work follows the direction of the force relative to the motion.
- level: 3
  en: Multiply the friction magnitude by the distance.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-72'
  accept: []
solution_steps:
- en: 'Friction acts opposite to the displacement, so the work is negative: minus 6 N times 12 m equals minus 72 J.'
- en: The unit of the answer is J.
- en: Answer = -72
tier: C
