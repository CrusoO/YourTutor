type: mcq
options:
- id: a
  en: is conserved only for objects at rest
- id: b
  en: can be created inside a closed system
- id: c
  en: is always lost in every motion
- id: d
  en: cannot be created or destroyed, only transformed
answer:
  sympy: d
  accept: []
misconception_rules:
