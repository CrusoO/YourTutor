stem:
  en: The law of conservation of energy states that energy
hints:
- level: 1
  en: Think about the energy in an isolated system over time.
- level: 2
  en: The law is about the total energy in a process.
- level: 3
  en: Ask whether the total can increase or decrease for a closed system.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
