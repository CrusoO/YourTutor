stem:
  en: A bullet of mass 0.01 kg moves at 300 m/s, and a stone of mass 0.05 kg moves at 60 m/s. Which has the greater kinetic energy?
hints:
- level: 1
  en: Use half times mass times speed squared for both objects.
- level: 2
  en: Compare the two results directly.
- level: 3
  en: Speed enters the formula squared, so it matters more than mass here.
