id: A.9.physics.work_and_energy.potential_energy.03
skill_ids:
- SK.A.9.physics.potential_energy
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A 2.5 kg object is lifted 4 m vertically. Taking g as 9.8 m/s2, how many joules of gravitational potential energy does it gain?
hints:
- level: 1
  en: The gain depends on the change in height only.
- level: 2
  en: Multiply the mass, g and the height change.
- level: 3
  en: Take the product in that order.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '98'
  accept: []
solution_steps:
- en: The gain is 2.5 kg times 9.8 m/s2 times 4 m, which is 98 J.
- en: The unit of the answer is J.
- en: Answer = 98
tier: C
