id: A.9.physics.work_and_energy.forms_of_energy.05
skill_ids:
- SK.A.9.physics.forms_of_energy
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A pendulum swings back and forth and gradually comes to rest. Which statement about its energy is correct?
hints:
- level: 1
  en: Ask where the energy goes when a swinging object loses speed.
- level: 2
  en: Compare the energy at the start with the energy at the end, including the surroundings.
- level: 3
  en: Think about what the air and the support experience during each swing.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: its energy is destroyed completely when it stops
- id: b
  en: its kinetic energy remains constant throughout
- id: c
  en: its total energy stays the same, but some of it transfers to thermal energy and sound
- id: d
  en: its total energy increases with each swing
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.7E56B352CD15
  when_answer_equals:
  - d
- id: MC.A.87731B16C605
  when_answer_equals:
  - b
- id: MC.A.6B866B627147
  when_answer_equals:
  - a
solution_steps:
- en: Energy is conserved overall; the pendulum's mechanical energy is gradually converted to thermal energy and sound in the air and support.
- en: The correct option is c.
tier: C
