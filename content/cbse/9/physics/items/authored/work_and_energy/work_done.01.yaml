id: A.9.physics.work_and_energy.work_done.01
skill_ids:
- SK.A.9.physics.work_done
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A force of 10 N moves a box 5 m in the direction of the force. How much work is done, in joules?
hints:
- level: 1
  en: Work is force multiplied by the displacement along the force.
- level: 2
  en: Multiply the force by the distance moved.
- level: 3
  en: Check that the unit comes out as newton metres, which is the joule.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '50'
  accept: []
solution_steps:
- en: Work equals force times displacement in the same direction, so 10 N times 5 m gives 50 J.
- en: The unit of the answer is J.
- en: Answer = 50
tier: C
