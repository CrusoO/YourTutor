id: A.9.physics.work_and_energy.work_done.03
skill_ids:
- SK.A.9.physics.work_done
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A 20 N force acts at 60 degrees above the horizontal and moves a trolley 4 m horizontally. What work is done, in joules? (cos 60 degrees is 0.5)
hints:
- level: 1
  en: Only the component of the force along the displacement does work.
- level: 2
  en: The horizontal component is the force times the cosine of the angle.
- level: 3
  en: Multiply that component by the horizontal distance.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '40'
  accept: []
solution_steps:
- en: The horizontal component is 20 N times 0.5, which is 10 N, and 10 N times 4 m gives 40 J.
- en: The unit of the answer is J.
- en: Answer = 40
tier: C
