id: A.9.physics.work_and_energy.forms_of_energy.06
skill_ids:
- SK.A.9.physics.forms_of_energy
difficulty: 0.9
pool: practice
role: explain
stem:
  en: A solar panel converts sunlight into electricity that charges a battery. Which chain of energy changes is the best description?
hints:
- level: 1
  en: Start from the energy source that arrives at the panel.
- level: 2
  en: Each step converts one form into the next, ending in storage.
- level: 3
  en: Think about what the battery does with the electricity it receives.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: light, then sound, then chemical
- id: b
  en: electrical, then light, then thermal only
- id: c
  en: chemical, then electrical, then light
- id: d
  en: light, then electrical, then chemical energy stored in the battery
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.5A9AD1C6A3CA
  when_answer_equals:
  - c
- id: MC.A.B3E9A2E77DC2
  when_answer_equals:
  - a
- id: MC.A.C40D63C1DD4C
  when_answer_equals:
  - b
solution_steps:
- en: Sunlight is the input, the panel produces electricity, and the battery stores it as chemical energy during charging.
- en: The correct option is d.
tier: C
