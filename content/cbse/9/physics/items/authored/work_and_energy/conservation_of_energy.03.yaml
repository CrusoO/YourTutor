difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A pendulum bob of mass 0.5 kg is released from rest at a height of 2.5 m above its lowest point. Taking g as 9.8 m/s2, what is its speed at the lowest point, in m/s?
hints:
- level: 1
  en: Set the potential energy lost equal to the kinetic energy gained.
- level: 2
  en: The mass cancels when both sides are divided by it.
- level: 3
  en: Solve for the speed by taking a square root at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '7'
  accept: []
solution_steps:
- en: The bob loses 0.5 times 9.8 times 2.5 J of potential energy, which becomes kinetic energy, so v squared is 49 and v is 7 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 7
tier: C
diagram_note: A pendulum drawn as a string from a fixed pivot at the top to a bob released from a point 2.5 m above a dashed horizontal line marking the lowest point.
