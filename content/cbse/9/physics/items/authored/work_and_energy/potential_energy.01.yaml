id: A.9.physics.work_and_energy.potential_energy.01
skill_ids:
- SK.A.9.physics.potential_energy
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A 5 kg object is raised 4 m above the ground. Taking g as 9.8 m/s2, what is its gravitational potential energy, in joules?
hints:
- level: 1
  en: Multiply mass, gravity and height together.
- level: 2
  en: Measure the height from the ground as the reference level.
- level: 3
  en: Use the product of the three quantities.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '196'
  accept: []
solution_steps:
- en: Potential energy equals m g h, so 5 kg times 9.8 m/s2 times 4 m gives 196 J.
- en: The unit of the answer is J.
- en: Answer = 196
tier: C
