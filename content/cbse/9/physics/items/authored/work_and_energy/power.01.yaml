role: recall
stem:
  en: A motor does 600 J of work in 3 s. What is its power, in watts?
hints:
- level: 1
  en: Power is the work done divided by the time taken.
- level: 2
  en: Divide the energy by the number of seconds.
- level: 3
  en: Joules per second is the unit of power.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '200'
  accept: []
solution_steps:
- en: Power equals work over time, so 600 J divided by 3 s gives 200 W.
- en: The unit of the answer is W.
- en: Answer = 200
tier: C
