difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A lift motor raises a 500 kg load through 12 m in 20 s. Taking g as 9.8 m/s2, what is the average power, in watts?
hints:
- level: 1
  en: Find the work done against gravity first.
- level: 2
  en: Work done against gravity is weight times height.
- level: 3
  en: Divide the total work by the time taken.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2940'
  accept: []
solution_steps:
- en: The work is 500 kg times 9.8 m/s2 times 12 m, which is 58800 J, and dividing by 20 s gives 2940 W.
- en: The unit of the answer is W.
- en: Answer = 2940
tier: C
