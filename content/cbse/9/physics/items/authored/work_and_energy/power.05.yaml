id: A.9.physics.work_and_energy.power.05
skill_ids:
- SK.A.9.physics.power
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A 50 kg climber rises 20 m up a rock face in 40 s. Taking g as 9.8 m/s2, what is the average power, in watts?
hints:
- level: 1
  en: Compute the work done against gravity as weight times height.
- level: 2
  en: Divide that work by the time taken.
- level: 3
  en: 'Keep track of the units: newtons, metres and seconds.'
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '245'
  accept: []
solution_steps:
- en: The work is 50 kg times 9.8 m/s2 times 20 m, which is 9800 J, so the power is 9800 divided by 40, or 245 W.
- en: The unit of the answer is W.
- en: Answer = 245
tier: C
