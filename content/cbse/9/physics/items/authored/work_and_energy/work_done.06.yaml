stem:
  en: A 2 kg block is lifted vertically by 3 m at constant speed. Taking g as 9.8 m/s2, what work does the lifting force do on the block?
hints:
- level: 1
  en: At constant speed the lifting force equals the weight.
- level: 2
  en: Use the weight times the vertical displacement.
- level: 3
  en: The lift and the displacement point in the same direction, so think about the sign carefully.
