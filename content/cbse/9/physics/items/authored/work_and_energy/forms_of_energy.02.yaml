difficulty: 0.2
pool: practice
role: recall
stem:
  en: In an electric fan, which energy form is the main useful output?
hints:
- level: 1
  en: Think about the form of energy that makes the blades turn.
- level: 2
  en: The useful output of a fan is the motion of its parts.
- level: 3
  en: Ask what the blades gain from the electricity.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: light energy from the blades
- id: b
  en: nuclear energy released in the motor
- id: c
  en: kinetic energy of the blades
- id: d
  en: sound energy as its only output
answer:
  sympy: c
  accept: []
misconception_rules:
