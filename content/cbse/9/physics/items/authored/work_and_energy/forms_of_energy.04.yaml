id: A.9.physics.work_and_energy.forms_of_energy.04
skill_ids:
- SK.A.9.physics.forms_of_energy
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A battery lights a bulb. Which energy change takes place in the bulb?
hints:
- level: 1
  en: Consider what the electricity from the battery supplies to the bulb.
- level: 2
  en: The bulb is a receiver of energy rather than a source of it.
- level: 3
  en: Think about the forms energy takes when the filament heats up and glows.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: electrical energy is destroyed in the filament
- id: b
  en: chemical energy is created inside the bulb
- id: c
  en: electrical energy changes into light and thermal energy
- id: d
  en: light energy changes into electrical energy
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.E1918D299493
  when_answer_equals:
  - d
- id: MC.A.7E45565F4F1F
  when_answer_equals:
  - a
- id: MC.A.A90E2D0097B2
  when_answer_equals:
