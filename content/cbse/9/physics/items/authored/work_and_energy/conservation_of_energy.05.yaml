difficulty: 0.9
pool: practice
role: apply
stem:
  en: A 2 kg ball falls from rest from a height of 10 m onto the ground with no energy losses. Taking g as 9.8 m/s2, how many joules of kinetic energy does it have just before landing?
hints:
- level: 1
  en: All the potential energy lost turns into kinetic energy.
- level: 2
  en: Find the potential energy at the top relative to the ground.
- level: 3
  en: Multiply the mass, g and the height.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '196'
  accept: []
solution_steps:
- en: The ball loses 2 kg times 9.8 m/s2 times 10 m, which is 196 J, and all of it is converted into kinetic energy just before landing.
- en: The unit of the answer is J.
- en: Answer = 196
tier: C
diagram_note: A vertical arrow from a point 10 m above the ground down to the ground, with a small ball drawn at the top of the arrow.
