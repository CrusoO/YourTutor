id: A.9.physics.work_and_energy.potential_energy.05
skill_ids:
- SK.A.9.physics.potential_energy
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A 0.5 kg ball slides from the top of a 10 m high slope to a point 2 m high. Taking g as 9.8 m/s2, by how many joules does its gravitational potential energy decrease?
hints:
- level: 1
  en: Find the drop in height first.
- level: 2
  en: The energy change depends only on the change in height.
- level: 3
  en: Multiply the mass, g and the drop in height.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '39.2'
  accept: []
solution_steps:
- en: The height drops by 8 m, so the energy decreases by 0.5 kg times 9.8 m/s2 times 8 m, which is 39.2 J.
- en: The unit of the answer is J.
- en: Answer = 39.2
tier: C
