difficulty: 0.2
pool: practice
role: recall
stem:
  en: A 2 kg ball moves at 3 m/s. What is its kinetic energy, in joules?
hints:
- level: 1
  en: Use one half times the mass times the square of the speed.
- level: 2
  en: Square the speed before multiplying.
- level: 3
  en: Multiply everything together at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '9'
  accept: []
solution_steps:
- en: Kinetic energy is half times the mass times the square of the speed, so half of 2 kg times 9 m2/s2 gives 9 J.
- en: The unit of the answer is J.
- en: Answer = 9
tier: C
