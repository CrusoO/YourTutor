difficulty: 0.6
pool: practice
role: explain
stem:
  en: A kicked ball slows down and stops on grass. Where does its kinetic energy go?
hints:
- level: 1
  en: Think about the surfaces that rub and the air that is disturbed.
- level: 2
  en: Energy changes form rather than vanishing.
- level: 3
  en: Consider what the rubbing surfaces and the disturbed air experience.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it all becomes potential energy of the ball
- id: b
  en: into thermal energy and sound in the grass and air
- id: c
  en: it disappears completely
- id: d
  en: it becomes the ball's extra mass
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.6B866B627147
  when_answer_equals:
  - c
- id: MC.A.0B5C4C223913
  when_answer_equals:
