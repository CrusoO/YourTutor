stem:
  en: To mark the square root of five on a number line, a right triangle with legs of one and two is drawn. What length must the hypotenuse have?
hints:
- level: 1
  en: Square each leg before adding anything.
- level: 2
  en: The squares of the legs add up to the square of the hypotenuse.
- level: 3
  en: Take the square root of the total only at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
