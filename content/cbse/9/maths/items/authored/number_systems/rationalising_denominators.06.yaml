stem:
  en: A denominator reads four minus root two and is rationalised by multiplying the top and bottom by its conjugate. What is the new denominator?
hints:
- level: 1
  en: Multiply the two terms of the form whole number minus root, with the sign flipped on one of them.
- level: 2
  en: Use the square of each term.
- level: 3
  en: Subtract the second square from the first.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
