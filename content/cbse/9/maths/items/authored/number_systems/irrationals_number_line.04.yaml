stem:
  en: A right triangle has legs of two units and three units. What is the length of its hypotenuse, in units, rounded to two decimal places?
hints:
- level: 1
  en: Square each leg and add the results.
- level: 2
  en: Take the square root of that sum.
- level: 3
  en: Round only after the root has been found.
