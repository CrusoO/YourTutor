difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which of the following numbers has a decimal expansion that neither terminates nor repeats?
hints:
- level: 1
  en: Ask whether the number can be written as a fraction of two whole numbers.
- level: 2
  en: Simplify any root first, then look at its decimal form.
- level: 3
  en: Recall which kinds of decimals terminate or repeat.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
