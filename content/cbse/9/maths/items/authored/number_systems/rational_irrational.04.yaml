stem:
  en: The decimal 0.6 is written as a fraction in lowest terms. What is the denominator of that fraction?
hints:
- level: 1
  en: Write the decimal as a fraction over a power of ten.
- level: 2
  en: Cancel the common factor from the top and the bottom.
- level: 3
  en: Check that the top and bottom share no further factor.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
