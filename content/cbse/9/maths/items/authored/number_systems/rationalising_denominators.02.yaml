id: A.9.maths.number_systems.rationalising_denominators.02
skill_ids:
- SK.A.9.maths.rationalising_denominators
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Rationalise the denominator of three over the square root of three. What is the result?
hints:
- level: 1
  en: Multiply the top and the bottom by the same root.
- level: 2
  en: Cancel the common factor from the top and the bottom.
- level: 3
  en: Check that the result squared gives back the original numerator.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 1/3
- id: b
  en: '9'
- id: c
  en: sqrt(3)
- id: d
  en: sqrt(3)/3
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.EDD2CA55BB69
  when_answer_equals:
  - b
- id: MC.A.6FD85B97B02D
  when_answer_equals:
  - d
- id: MC.A.CB429DB65EF4
  when_answer_equals:
  - a
solution_steps:
- en: Multiplying the top and bottom by the root gives three times the root over three, which simplifies to the square root of three.
- en: The correct option is c.
tier: C
