stem:
  en: Two legs of a right triangle are each one unit long. Give the length of the hypotenuse in units, rounded to two decimal places.
hints:
- level: 1
  en: Apply the relation between the squares of the legs and the square of the hypotenuse.
- level: 2
  en: Add the squares of the two known sides.
- level: 3
  en: Take the square root and round at the second decimal place.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
