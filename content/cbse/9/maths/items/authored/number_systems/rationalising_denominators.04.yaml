difficulty: 0.6
pool: practice
role: apply
stem:
  en: What is five over three plus root two, written with a rational denominator?
hints:
- level: 1
  en: Pick the conjugate of the denominator.
- level: 2
  en: Multiply the numerator and the denominator by the same conjugate.
- level: 3
  en: The new denominator is a difference of squares.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: (15 - 5 sqrt(2))/7
- id: b
  en: (15 - 5 sqrt(2))/11
- id: c
  en: (15 + 5 sqrt(2))/7
- id: d
  en: 15 - 5 sqrt(2)
answer:
  sympy: a
  accept: []
misconception_rules:
