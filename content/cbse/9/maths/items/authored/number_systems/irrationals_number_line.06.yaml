stem:
  en: A right triangle has one leg of one unit, and its hypotenuse must equal the square root of ten units. What length, in units, must the other leg be?
hints:
- level: 1
  en: Square the hypotenuse and square the known leg.
- level: 2
  en: Subtract the second square from the first.
- level: 3
  en: Take the square root of what remains.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: 'Subtract the square of the known leg from the square of the hypotenuse: ten minus one gives nine, whose root is three.'
- en: The unit of the answer is units.
- en: Answer = 3
tier: C
