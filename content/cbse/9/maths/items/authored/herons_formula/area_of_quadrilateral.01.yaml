  author: model-draft
type: numeric
answer:
  sympy: '12'
  accept: []
solution_steps:
- en: Each triangle has area 6 square cm, so the quadrilateral's area is 12 square cm.
- en: The unit of the answer is cm^2.
- en: Answer = 12
