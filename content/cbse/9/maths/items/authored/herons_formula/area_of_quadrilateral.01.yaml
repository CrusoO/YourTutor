stem:
  en: Quadrilateral ABCD has diagonal AC of 5 cm. Triangle ABC has sides 3 cm, 4 cm and 5 cm, and triangle ACD has sides 3 cm, 4 cm and 5 cm. What is the area of ABCD, in square cm?
hints:
- level: 1
  en: Split the quadrilateral along the diagonal into two triangles.
- level: 2
  en: Find each triangle's area from its three sides.
- level: 3
  en: Add the two areas together.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
