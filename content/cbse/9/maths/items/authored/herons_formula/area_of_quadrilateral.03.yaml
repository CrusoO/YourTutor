stem:
  en: Quadrilateral PQRS is split by diagonal PR of 15 cm. Triangle PQR has sides 9 cm, 12 cm and 15 cm. Triangle PRS has sides 15 cm, 13 cm and 14 cm. What is the total area of PQRS, in square cm?
