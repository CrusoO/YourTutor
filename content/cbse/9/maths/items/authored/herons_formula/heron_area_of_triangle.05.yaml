stem:
  en: A triangle with semi-perimeter 18 cm has one side of 10 cm, and its other two sides are equal. What is the length of each equal side, in cm?
hints:
- level: 1
  en: The semi-perimeter is half the total of the three sides.
- level: 2
  en: Write the total perimeter using the unknown equal side.
- level: 3
  en: Solve the resulting equation for that unknown.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '13'
  accept: []
solution_steps:
- en: The total perimeter is 36 cm, so 10 plus twice the equal side is 36, which gives each equal side as 13 cm.
- en: The unit of the answer is cm.
- en: Answer = 13
tier: C
