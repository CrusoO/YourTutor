stem:
  en: Using Heron's formula, what is the area of a triangle with sides 6 cm, 8 cm and 10 cm?
hints:
- level: 1
  en: Compute the semi-perimeter, then the three differences.
- level: 2
  en: The area is the square root of a product of four factors.
- level: 3
  en: Take the root of the full product at the end.
