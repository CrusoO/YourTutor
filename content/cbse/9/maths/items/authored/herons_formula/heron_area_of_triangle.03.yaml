stem:
  en: A triangle has sides 13 cm, 14 cm and 15 cm. Find its area by Heron's formula, in square cm.
hints:
- level: 1
  en: Find the semi-perimeter first.
- level: 2
  en: Find the three differences between the semi-perimeter and each side.
- level: 3
  en: Multiply all four quantities and take the square root.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
