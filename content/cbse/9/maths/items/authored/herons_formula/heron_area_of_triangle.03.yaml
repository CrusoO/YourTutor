answer:
  sympy: '84'
  accept: []
solution_steps:
- en: The semi-perimeter is 21, and 21 times 8 times 7 times 6 equals 7056, whose square root is 84 square cm.
- en: The unit of the answer is cm^2.
- en: Answer = 84
