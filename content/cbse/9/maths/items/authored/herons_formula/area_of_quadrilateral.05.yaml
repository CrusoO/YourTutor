stem:
  en: A quadrilateral ABCD is cut along its 25 cm diagonal AC into a piece with sides 7 cm, 24 cm and 25 cm and a piece with sides 15 cm, 20 cm and 25 cm. Find the area of ABCD in square cm.
hints:
- level: 1
  en: Check whether the squares of the two shorter sides add to the square of the longest in each triangle.
- level: 2
  en: If a triangle is right-angled, its two shorter sides give the base and height.
- level: 3
  en: Add the two triangle areas to get the quadrilateral's area.
