difficulty: 0.6
pool: practice
role: apply
stem:
  en: A chord of a circle with radius 13 cm lies 5 cm from the centre. What is the length of the chord, in cm?
hints:
- level: 1
  en: Draw the perpendicular from the centre to the chord, which bisects the chord.
- level: 2
  en: Form a right triangle with the radius as the hypotenuse.
- level: 3
  en: Apply Pythagoras to find half the chord, then double it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '24'
  accept: []
solution_steps:
- en: Half the chord is the square root of 169 minus 25, which is 12 cm, so the full chord is 24 cm.
- en: The unit of the answer is cm.
- en: Answer = 24
tier: C
diagram_note: Circle with a chord drawn, the perpendicular from the centre to the chord marked, and the radius to one end of the chord.
