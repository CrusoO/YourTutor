stem:
  en: In cyclic quadrilateral ABCD, angle ABD is 35 degrees and angle DBC is 40 degrees. What is angle ACD, in degrees?
hints:
- level: 1
  en: Find the chord that both angles stand on.
- level: 2
  en: The two points lie on the same side of that chord.
- level: 3
  en: Equal angles in one segment come from the same chord.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
