stem:
  en: Corner A of a four-cornered figure inscribed in a circle measures 88 degrees. How large is the corner C opposite it?
hints:
- level: 1
  en: Opposite angles of an inscribed four-sided figure are supplementary.
- level: 2
  en: Use the total that opposite angles must make.
- level: 3
  en: Subtract the given corner from that total.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 102 degrees
- id: b
  en: 88 degrees
- id: c
  en: 270 degrees
- id: d
  en: 92 degrees
answer:
  sympy: d
  accept: []
misconception_rules:
