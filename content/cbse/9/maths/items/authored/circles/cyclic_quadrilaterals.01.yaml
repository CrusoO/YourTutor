stem:
  en: In a cyclic quadrilateral ABCD, angle A is 75 degrees. What is the opposite angle C, in degrees?
hints:
- level: 1
  en: Opposite angles of a cyclic quadrilateral add up to a known total.
- level: 2
  en: Subtract the given angle from that total.
- level: 3
  en: Check that the two opposite angles together fit the total.
