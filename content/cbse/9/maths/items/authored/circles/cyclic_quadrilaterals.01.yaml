answer:
  sympy: '105'
  accept: []
solution_steps:
- en: Opposite angles of a cyclic quadrilateral are supplementary, so C is 180 minus 75, which is 105 degrees.
- en: The unit of the answer is degrees.
- en: Answer = 105
