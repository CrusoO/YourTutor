id: A.9.maths.circles.cyclic_quadrilaterals.05
skill_ids:
- SK.A.9.maths.cyclic_quadrilaterals
difficulty: 0.9
pool: practice
role: explain
stem:
  en: In cyclic quadrilateral ABCD, the angles ABD and ACD both stand on the chord AD from the same side. Which statement is true?
hints:
- level: 1
  en: Consider the chord AD and the side on which the points lie.
- level: 2
  en: Recall which relationship applies to angles on the same arc.
- level: 3
  en: Decide whether the two angles stand on the same arc.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They add up to 180 degrees.
- id: b
  en: They are right angles.
- id: c
  en: One is twice the other.
- id: d
  en: They are equal.
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.DAE0FB3F858C
  when_answer_equals:
  - a
- id: MC.A.BB4C207877F7
  when_answer_equals:
  - b
- id: MC.A.9420D5E82C1D
  when_answer_equals:
  - c
solution_steps:
- en: Angles in the same segment that stand on the same chord are equal.
- en: The correct option is d.
tier: C
diagram_note: Circle with chord AD, and two points B and C on the same arc joined to A and D.
