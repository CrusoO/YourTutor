difficulty: 0.2
pool: practice
role: recall
stem:
  en: A chord subtends an angle of 40 degrees at a point on the circumference. What is the angle that the same chord subtends at the centre, in degrees?
hints:
- level: 1
  en: The central angle is related to the angle at the circumference by a fixed factor.
- level: 2
  en: Multiply the circumference angle by that factor.
- level: 3
  en: Check that the answer is larger than the circumference angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '80'
  accept: []
solution_steps:
- en: The central angle is twice the angle at the circumference, so 2 times 40 is 80 degrees.
- en: The unit of the answer is degrees.
- en: Answer = 80
tier: C
diagram_note: Circle with a chord, the centre marked, and the angles at the centre and at the circumference drawn.
