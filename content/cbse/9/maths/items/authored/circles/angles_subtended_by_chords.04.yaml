stem:
  en: A diameter of a circle is seen from any point on the circle. What angle does it subtend there?
hints:
- level: 1
  en: Think about the semicircle that the diameter cuts off on one side.
- level: 2
  en: Relate the central angle of the diameter to the angle at the circumference.
- level: 3
  en: The central angle subtended by a diameter is a straight angle.
