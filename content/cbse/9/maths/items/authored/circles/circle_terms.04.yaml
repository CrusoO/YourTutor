stem:
  en: Which pair of terms names the boundary curve of a circle and the flat region enclosed by that boundary?
hints:
- level: 1
  en: One term names the length of the boundary, and the other names the flat shape inside.
- level: 2
  en: Look for a term for the flat region covering the inside of the circle.
- level: 3
  en: Separate the terms for curves from the terms for straight segments.
