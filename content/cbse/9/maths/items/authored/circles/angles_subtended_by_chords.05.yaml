role: transfer
stem:
  en: A chord of a circle subtends an angle of 130 degrees at the centre. What angle does the same chord subtend at a point on the major arc?
hints:
- level: 1
  en: The relation between central and circumference angles is a fixed factor.
- level: 2
  en: Choose the arc on which the point lies.
- level: 3
  en: Divide the central angle by that factor.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 260 degrees
- id: b
  en: 50 degrees
- id: c
  en: 130 degrees
- id: d
  en: 65 degrees
answer:
  sympy: d
  accept: []
misconception_rules:
