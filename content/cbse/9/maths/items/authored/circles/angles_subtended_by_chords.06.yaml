stem:
  en: A chord of a circle subtends an angle of 110 degrees at a point on the minor arc. What angle does the same chord subtend at a point on the major arc, in degrees?
hints:
- level: 1
  en: Points on opposite arcs of the chord form a cyclic quadrilateral.
- level: 2
  en: Opposite angles of a cyclic quadrilateral are supplementary.
- level: 3
  en: Subtract the given angle from a straight angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '70'
  accept: []
solution_steps:
- en: Angles at points on opposite arcs of a chord are supplementary, so 180 minus 110 is 70 degrees.
- en: The unit of the answer is degrees.
- en: Answer = 70
tier: C
diagram_note: Circle with a chord, a point on the minor arc and a point on the major arc, both joined to the ends of the chord.
