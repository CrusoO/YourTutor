difficulty: 0.2
pool: practice
role: recall
stem:
  en: An arc subtends an angle of 70 degrees at the centre. What angle does the same arc subtend at a point on the remaining part of the circle?
hints:
- level: 1
  en: Recall how the central angle compares with the angle at the circumference.
- level: 2
  en: Divide the central angle by the factor that relates the two angles.
- level: 3
  en: Check that the factor is applied in the right direction.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 70 degrees
- id: b
  en: 140 degrees
- id: c
  en: 35 degrees
- id: d
  en: 110 degrees
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.B1C910B02430
  when_answer_equals:
  - a
- id: MC.A.6A3BB5E45971
  when_answer_equals:
