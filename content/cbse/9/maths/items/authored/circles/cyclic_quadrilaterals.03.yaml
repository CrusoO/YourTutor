stem:
  en: In cyclic quadrilateral PQRS, angle P is 3x degrees and the opposite angle R is x + 40 degrees. What is x?
hints:
- level: 1
  en: The opposite angles sum to a known total.
- level: 2
  en: Set the sum of the two expressions equal to that total.
- level: 3
  en: Collect the letter terms and solve.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '35'
  accept: []
solution_steps:
- en: 3x plus x plus 40 equals 180, so 4x equals 140 and x equals 35.
- en: Answer = 35
