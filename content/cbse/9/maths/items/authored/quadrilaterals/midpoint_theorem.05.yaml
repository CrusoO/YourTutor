  author: model-draft
type: numeric
answer:
  sympy: '28'
  accept: []
solution_steps:
- en: PQRS is a parallelogram whose sides are half the diagonals, so its sides are 9 cm and 5 cm, giving a perimeter of 2 times 14, which is 28 cm.
- en: The unit of the answer is cm.
- en: Answer = 28
tier: C
diagram_note: Quadrilateral ABCD with the midpoints P, Q, R and S joined in order, and both diagonals drawn.
