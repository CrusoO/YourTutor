stem:
  en: In quadrilateral ABCD, the points P, Q, R and S are the midpoints of AB, BC, CD and DA. If the diagonal AC is 18 cm and the diagonal BD is 10 cm, what is the perimeter of PQRS, in cm?
hints:
- level: 1
  en: Each side of the inner figure is set by the midpoints across one diagonal.
- level: 2
  en: Half of each diagonal gives one pair of sides.
- level: 3
  en: The perimeter adds up the two pairs of equal sides.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
