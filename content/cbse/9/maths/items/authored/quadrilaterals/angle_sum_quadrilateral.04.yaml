stem:
  en: 'The angles of a quadrilateral are in the ratio 1 : 2 : 3 : 2. Which is the largest angle?'
hints:
- level: 1
  en: Add the parts of the ratio first.
- level: 2
  en: Find the size of one part using the angle total of the quadrilateral.
- level: 3
  en: Multiply the largest ratio part by that size.
