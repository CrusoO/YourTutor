answer:
  sympy: '80'
  accept: []
solution_steps:
- en: Angles P and R are each 100 degrees, and Q is adjacent to P, so Q equals 180 minus 100, which is 80 degrees.
- en: The unit of the answer is degrees.
- en: Answer = 80
