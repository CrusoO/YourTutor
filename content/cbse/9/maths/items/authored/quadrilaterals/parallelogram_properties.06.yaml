stem:
  en: In parallelogram PQRS, the angles at the opposite vertices P and R add up to 200 degrees. What is angle Q, in degrees?
hints:
- level: 1
  en: Opposite angles are equal, so each of the given pair equals half their sum.
- level: 2
  en: Adjacent angles in a parallelogram add up to a known total.
- level: 3
  en: Subtract the angle at the neighbouring vertex from that total.
