difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which pair of properties holds for every parallelogram?
hints:
- level: 1
  en: Consider what the pairs of parallel sides guarantee.
- level: 2
  en: Think about a general parallelogram before any special type.
- level: 3
  en: Some properties belong only to special parallelograms.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: all angles are right angles
- id: b
  en: opposite sides are equal and opposite angles are equal
- id: c
  en: all four sides are equal
- id: d
  en: the diagonals are always perpendicular
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.78FA0A119CD7
  when_answer_equals:
