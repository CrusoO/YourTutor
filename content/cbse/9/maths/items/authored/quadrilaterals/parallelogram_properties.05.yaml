solution_steps:
- en: The diagonals bisect each other, so AO equals OC and BO equals OD, and the vertically opposite angles at O are equal, giving congruence by SAS.
- en: The correct option is b.
tier: C
diagram_note: Parallelogram ABCD with both diagonals drawn, meeting at O, and the equal halves marked.
