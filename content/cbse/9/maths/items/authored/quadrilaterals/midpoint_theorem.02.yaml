id: A.9.maths.quadrilaterals.midpoint_theorem.02
skill_ids:
- SK.A.9.maths.midpoint_theorem
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In a triangle, the side BC measures 12 cm. A segment joins the midpoints of the other two sides. What is its length, in cm?
hints:
- level: 1
  en: Use the mid-point theorem about the segment and the third side.
- level: 2
  en: Take half of the third side.
- level: 3
  en: Apply the factor that the theorem gives to the known length.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: The segment joining the midpoints is half the third side, so it is half of 12 cm, which is 6 cm.
- en: The unit of the answer is cm.
- en: Answer = 6
tier: C
diagram_note: Triangle with base BC marked 12 cm and a mid-segment drawn between the midpoints of the other two sides.
