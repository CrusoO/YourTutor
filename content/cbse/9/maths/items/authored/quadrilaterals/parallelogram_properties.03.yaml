difficulty: 0.6
pool: practice
role: apply
stem:
  en: In parallelogram PQRS, the diagonals meet at O. If PO equals 5 cm, what is the length of diagonal PR?
hints:
- level: 1
  en: Recall how the diagonals of a parallelogram meet.
- level: 2
  en: The point O is the midpoint of the diagonal.
- level: 3
  en: Double the part from the vertex to that midpoint.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
