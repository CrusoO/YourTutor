id: A.9.maths.quadrilaterals.midpoint_theorem.03
skill_ids:
- SK.A.9.maths.midpoint_theorem
difficulty: 0.6
pool: practice
role: apply
stem:
  en: In triangle PQR, M and N are the midpoints of PQ and PR. The segment MN is 7 cm long. What is the length of QR, in cm?
hints:
- level: 1
  en: Apply the mid-point theorem to the segment joining the midpoints.
- level: 2
  en: The third side is double the segment joining the midpoints.
- level: 3
  en: Multiply the given length by the right factor.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '14'
  accept: []
solution_steps:
- en: MN is half of QR, so QR is 2 times 7, which is 14 cm.
- en: The unit of the answer is cm.
- en: Answer = 14
tier: C
diagram_note: Triangle PQR with the midpoints M and N marked and the segment MN drawn parallel to QR.
