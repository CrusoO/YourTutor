answer:
  sympy: '50'
  accept: []
solution_steps:
- en: Opposite angles are equal, so x plus 30 equals 3x minus 10, giving x equal to 20 and angle A equal to 50 degrees.
- en: The unit of the answer is degrees.
- en: Answer = 50
