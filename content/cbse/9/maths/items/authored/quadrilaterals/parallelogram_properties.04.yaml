stem:
  en: In parallelogram ABCD, angle A is (x + 30) degrees and angle C is (3x - 10) degrees. What is angle A, in degrees?
hints:
- level: 1
  en: Opposite angles of a parallelogram are equal.
- level: 2
  en: Set the two expressions equal and solve for the letter.
- level: 3
  en: Substitute the solved value back into the expression for angle A.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
