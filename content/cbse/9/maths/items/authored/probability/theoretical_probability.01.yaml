difficulty: 0.2
pool: practice
role: recall
stem:
  en: A fair die is rolled once. What is the probability of getting an even number, as a decimal?
hints:
- level: 1
  en: List the equally likely outcomes of one roll.
- level: 2
  en: Count the outcomes that are even.
- level: 3
  en: Divide the favourable count by the total number of outcomes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.5'
  accept: []
solution_steps:
- en: The even outcomes are 2, 4 and 6, so 3 favourable outcomes out of 6 equally likely outcomes gives 0.5.
- en: Answer = 0.5
tier: C
