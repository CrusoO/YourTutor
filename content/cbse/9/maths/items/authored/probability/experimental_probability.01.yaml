difficulty: 0.2
pool: practice
role: procedure
stem:
  en: A die is rolled 60 times and a 6 comes up 12 times. What is the experimental probability of rolling a 6, as a decimal?
hints:
- level: 1
  en: Divide the favourable outcomes by the total number of trials.
- level: 2
  en: Use the count of the outcome you want and the number of rolls.
- level: 3
  en: Write the result as a decimal.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.2'
  accept: []
solution_steps:
- en: The experimental probability is the favourable count over the total number of trials, which is 12 out of 60, giving 0.2.
- en: Answer = 0.2
tier: C
