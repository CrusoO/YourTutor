difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which statement about experimental probability is correct?
hints:
- level: 1
  en: Think about whether repeated experiments always give the same count.
- level: 2
  en: Consider how the estimate behaves as the number of trials grows.
- level: 3
  en: Compare an experimental result with the theoretical value.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is always exactly one sixth for a die.
- id: b
  en: It equals the number of trials divided by the favourable outcomes.
- id: c
  en: It is never written as a decimal.
- id: d
  en: It can change when the trials are repeated.
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.1B8566DDC083
  when_answer_equals:
