stem:
  en: A ball is drawn from a bag 120 times, with replacement, and the outcome blue has an experimental probability of 0.25. How many draws gave blue?
hints:
- level: 1
  en: Multiply the experimental probability by the number of trials.
- level: 2
  en: Use the definition of experimental probability as a ratio of counts.
- level: 3
  en: Check that the count you get is a whole number.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '30'
  accept: []
solution_steps:
- en: The number of blue draws is 0.25 times 120, which equals 30.
- en: Answer = 30
tier: C
