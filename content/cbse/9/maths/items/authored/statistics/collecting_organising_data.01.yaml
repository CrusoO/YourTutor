id: A.9.maths.statistics.collecting_organising_data.01
skill_ids:
- SK.A.9.maths.collecting_organising_data
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In a frequency table, what does the frequency of a class tell you?
hints:
- level: 1
  en: Think about what it means to count observations in a class.
- level: 2
  en: Compare that with the description of the class boundaries.
- level: 3
  en: A frequency is a number of items, not a value from the data.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the total of all values in the class
- id: b
  en: the midpoint of the class
- id: c
  en: the width of the class interval
- id: d
  en: how many observations fall in that class
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.B467C5E578C1
  when_answer_equals:
  - c
- id: MC.A.97042C074778
  when_answer_equals:
  - b
- id: MC.A.43D3646567B2
  when_answer_equals:
  - a
solution_steps:
- en: Frequency is the count of observations that fall in a given class, while the width and the midpoint describe the class itself.
- en: The correct option is d.
tier: C
