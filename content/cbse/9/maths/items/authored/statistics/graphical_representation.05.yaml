stem:
  en: A class from 30 to 40 has a width of 10 and a frequency of 18. What is the frequency density of this class?
hints:
- level: 1
  en: Frequency density is the frequency divided by the class width.
- level: 2
  en: Use the frequency and the width of the 30 to 40 class.
- level: 3
  en: Keep one decimal place in the answer.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
