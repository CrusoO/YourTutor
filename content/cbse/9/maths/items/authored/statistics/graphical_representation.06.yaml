id: A.9.maths.statistics.graphical_representation.06
skill_ids:
- SK.A.9.maths.graphical_representation
difficulty: 0.9
pool: practice
role: explain
stem:
  en: A histogram has bars of unequal width. How should the height of each bar be chosen?
hints:
- level: 1
  en: Think about what keeps the areas proportional to the frequencies.
- level: 2
  en: A wider bar must be shorter for the same frequency.
- level: 3
  en: Ask what a bar's area represents.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Height equals the frequency whatever the width.
- id: b
  en: Height equals the class mid-point.
- id: c
  en: Height equals frequency divided by class width.
- id: d
  en: Height equals the class width.
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.ABA922F84382
  when_answer_equals:
  - a
- id: MC.A.62D885961ADB
  when_answer_equals:
  - d
- id: MC.A.8BEBC0A8FDC3
  when_answer_equals:
  - b
solution_steps:
- en: With unequal widths the heights must be frequency densities, so that each bar's area stays proportional to its frequency.
- en: The correct option is c.
tier: C
diagram_note: Histogram with bars of unequal width and the heights labelled as densities.
