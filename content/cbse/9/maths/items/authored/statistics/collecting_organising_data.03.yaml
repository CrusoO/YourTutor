stem:
  en: A class interval runs from 10 to 20. Which is its class mark?
hints:
- level: 1
  en: The class mark is the middle value of the interval.
- level: 2
  en: Add the two limits of the interval.
- level: 3
  en: Halve that sum to find the middle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: '10'
- id: b
  en: '30'
- id: c
  en: '20'
- id: d
  en: '15'
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.90B55AD25A3D
