difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A data set of 40 values is grouped into 5 classes of equal width. The frequencies of the first four classes are 6, 9, 11 and 7. What is the frequency of the fifth class?
hints:
- level: 1
  en: All the frequencies together make up the total count.
- level: 2
  en: Add the four known frequencies.
- level: 3
  en: Subtract that sum from the total number of values.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '7'
  accept: []
solution_steps:
- en: 6 plus 9 plus 11 plus 7 is 33, so the fifth class has 40 minus 33, which is 7.
- en: Answer = 7
tier: C
