difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Consider the data 4, 4, 6, 7, 9, 12. Which pair gives the mode and the median?
hints:
- level: 1
  en: Count how often each value appears.
- level: 2
  en: With an even count of values, the median is the average of the two middle values.
- level: 3
  en: Read the two middle values from the sorted list.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: mode 4 and median 6
- id: b
  en: mode 4 and median 6.5
- id: c
  en: mode 9 and median 7
- id: d
  en: mode 6 and median 6.5
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.752F31567CE3
  when_answer_equals:
