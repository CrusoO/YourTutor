id: A.9.maths.statistics.graphical_representation.04
skill_ids:
- SK.A.9.maths.graphical_representation
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Where are the points of a frequency polygon plotted?
hints:
- level: 1
  en: Think about which value represents each class along the horizontal axis.
- level: 2
  en: The vertical position shows how many values fall in the class.
- level: 3
  en: Connect the points in order from left to right.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: at the class mid-points, at heights equal to the frequencies
- id: b
  en: at the upper boundaries, at heights equal to the cumulative totals
- id: c
  en: at the class widths, at heights equal to the mid-points
- id: d
  en: at the lower boundaries, at heights equal to the class widths
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.566F31132B61
  when_answer_equals:
  - d
- id: MC.A.56707C28F2E4
  when_answer_equals:
  - b
- id: MC.A.B5BE46CF85D0
  when_answer_equals:
  - c
solution_steps:
- en: A frequency polygon joins points placed at each class mid-point, at a height equal to that class frequency.
- en: The correct option is a.
tier: C
diagram_note: Histogram with bars, and a polygon joining the mid-points of the tops of the bars.
