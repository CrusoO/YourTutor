stem:
  en: Values 12, 15, 15, 18, 20, 20 and 20 are grouped into classes 10 to 15, 15 to 20 and 20 to 25, where a value equal to a lower limit belongs to that class. How many values fall in the class 15 to 20?
hints:
- level: 1
  en: Apply the rule about which class a boundary value belongs to.
- level: 2
  en: Count each value that lies in the second class.
- level: 3
  en: Do not count values that equal the upper limit of a class.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
