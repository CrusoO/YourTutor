id: A.9.maths.statistics.graphical_representation.03
skill_ids:
- SK.A.9.maths.graphical_representation
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A histogram has classes of width 5 with bar heights (frequencies) 6, 10 and 4. What is the total area of the bars, in square units?
hints:
- level: 1
  en: Each bar's area is its width times its height.
- level: 2
  en: All the bars share the same width here.
- level: 3
  en: Add the three areas together.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '100'
  accept: []
solution_steps:
- en: Each bar has width 5, so the total area is 5 times the sum of the heights 6, 10 and 4, which is 100 square units.
- en: The unit of the answer is square units.
- en: Answer = 100
tier: C
diagram_note: Histogram with three adjacent bars of equal width and heights labelled 6, 10 and 4.
