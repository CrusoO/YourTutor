id: A.9.maths.statistics.graphical_representation.02
skill_ids:
- SK.A.9.maths.graphical_representation
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In a histogram with continuous class intervals, what does the area of a bar represent?
hints:
- level: 1
  en: Consider how a bar's width and height combine.
- level: 2
  en: Think about the idea of frequency density.
- level: 3
  en: The area is the product of the width and the height.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the cumulative frequency
- id: b
  en: the frequency of the class
- id: c
  en: the class mark
- id: d
  en: only the class width
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.26DA0039B128
  when_answer_equals:
  - d
- id: MC.A.F6E28140CB5A
  when_answer_equals:
  - c
- id: MC.A.CD3B3B938ED7
  when_answer_equals:
  - a
solution_steps:
- en: The height is the frequency divided by the width, so width times height, which is the area of the bar, equals the frequency.
- en: The correct option is b.
tier: C
