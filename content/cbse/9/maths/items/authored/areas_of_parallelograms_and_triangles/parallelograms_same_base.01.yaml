id: A.9.maths.areas_of_parallelograms_and_triangles.parallelograms_same_base.01
skill_ids:
- SK.A.9.maths.parallelograms_same_base
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Two parallelograms share a base and lie between the same pair of parallel lines. How do their areas compare?
hints:
- level: 1
  en: Ask what stays the same for both shapes.
- level: 2
  en: Consider the perpendicular distance between the parallel lines.
- level: 3
  en: Think about the base that the two shapes share.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The areas depend only on the angle between the sides.
- id: b
  en: They are equal.
- id: c
  en: One is always twice the other.
- id: d
  en: The one with the longer slanted side is larger.
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.58E95F8011FA
  when_answer_equals:
  - d
- id: MC.A.2DC23EAA515F
  when_answer_equals:
  - c
- id: MC.A.D2C9EAD2C01F
  when_answer_equals:
