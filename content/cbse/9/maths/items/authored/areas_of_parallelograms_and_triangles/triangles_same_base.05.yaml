stem:
  en: Triangles XYZ and XYW share the base XY, which is 12 cm long. Triangle XYZ has an area of 42 square cm and triangle XYW has an area of 30 square cm. What is the difference between their heights, in cm?
hints:
- level: 1
  en: Use each area together with the shared base to find that triangle's height.
- level: 2
  en: Area equals half of base times height for both triangles.
- level: 3
  en: Subtract the smaller height from the larger one.
