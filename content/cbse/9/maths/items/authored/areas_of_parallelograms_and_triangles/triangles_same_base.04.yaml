difficulty: 0.6
pool: practice
role: apply
stem:
  en: A triangle lies between two parallel lines that are 9 cm apart, and its base of 4 cm lies on the lower line. What is its area?
hints:
- level: 1
  en: The apex lies on the other parallel, so the height is the given distance.
- level: 2
  en: Write the triangle area formula with its base and height.
- level: 3
  en: Halve the product of the base and the height.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 13 square cm
- id: b
  en: 36 square cm
- id: c
  en: 18 square cm
- id: d
  en: 9 square cm
answer:
  sympy: c
  accept: []
misconception_rules:
