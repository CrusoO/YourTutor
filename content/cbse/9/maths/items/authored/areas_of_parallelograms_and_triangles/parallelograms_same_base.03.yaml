difficulty: 0.6
pool: practice
role: apply
stem:
  en: A parallelogram and a rectangle share a base of 10 cm and lie between the same pair of parallel lines. The rectangle's height is 6 cm. What is the area of the parallelogram, in square cm?
hints:
- level: 1
  en: Both shapes have the same base and the same height between the parallels.
- level: 2
  en: Compute the area of the rectangle first.
- level: 3
  en: Compare the two areas.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '60'
  accept: []
solution_steps:
- en: Equal base and equal height give equal areas, so the parallelogram has the same area as the rectangle, which is 10 times 6, or 60 square cm.
- en: The unit of the answer is cm^2.
- en: Answer = 60
tier: C
diagram_note: Parallelogram and rectangle on the same base between two parallel lines, with the perpendicular height marked.
