stem:
  en: A triangle has an area of 63 square cm on a base of 14 cm. A parallelogram on the same base lies between the same parallel lines. What is the area of the parallelogram, in square cm?
hints:
- level: 1
  en: Use the triangle's area and base to find the common height.
- level: 2
  en: The parallelogram shares that height with the triangle.
- level: 3
  en: Multiply the common base by the common height.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '126'
  accept: []
solution_steps:
- en: The triangle's height is 9 cm, since 63 is half of 14 times 9, and the parallelogram shares that height, so its area is 14 times 9, which is 126 square cm.
- en: The unit of the answer is cm^2.
- en: Answer = 126
tier: C
diagram_note: Parallelogram and triangle sharing a base, with the common height marked between the two parallel lines.
