stem:
  en: A triangle and a parallelogram lie on the same base between the same parallel lines. The parallelogram has an area of 48 square cm. What is the area of the triangle?
hints:
- level: 1
  en: Compare the triangle's base and height with those of the parallelogram.
- level: 2
  en: A triangle on the same base and height is half of the parallelogram.
- level: 3
  en: Halve the given area of the parallelogram.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 12 square cm
- id: b
  en: 48 square cm
- id: c
  en: 96 square cm
- id: d
  en: 24 square cm
answer:
  sympy: d
  accept: []
