stem:
  en: A parallelogram has a base of 12 cm and an area of 84 square cm. What is its height?
hints:
- level: 1
  en: Write the area formula for a parallelogram.
- level: 2
  en: Isolate the height by dividing.
- level: 3
  en: Divide the area by the base.
