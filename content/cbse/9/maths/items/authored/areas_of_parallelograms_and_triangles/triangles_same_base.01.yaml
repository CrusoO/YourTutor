difficulty: 0.2
pool: practice
role: recall
stem:
  en: Two triangles have the same base and lie between the same two parallel lines. Which statement is correct?
hints:
- level: 1
  en: Ask what the two triangles have in common.
- level: 2
  en: Consider the perpendicular distance between the parallel lines.
- level: 3
  en: Area depends only on the base and the height.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Their areas are equal.
- id: b
  en: Their perimeters must be equal.
- id: c
  en: One is always twice the other.
- id: d
  en: Their areas are always different.
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.B2DFD3179A63
