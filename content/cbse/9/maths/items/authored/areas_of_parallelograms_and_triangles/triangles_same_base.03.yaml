id: A.9.maths.areas_of_parallelograms_and_triangles.triangles_same_base.03
skill_ids:
- SK.A.9.maths.triangles_same_base
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Triangle ABC has an area of 36 square cm and a base BC of 12 cm. A second triangle DBC shares the base BC and lies between the same parallel lines. What is the height of triangle DBC, in cm?
hints:
- level: 1
  en: Both triangles share the base and the height between the parallel lines.
- level: 2
  en: Use the area of triangle ABC to find the common height.
- level: 3
  en: The second triangle has that same height.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: The area formula gives 36 equal to half of 12 times the height, so the height is 6 cm, and triangle DBC shares that height.
- en: The unit of the answer is cm.
- en: Answer = 6
tier: C
diagram_note: Triangles ABC and DBC on the common base BC, with apexes A and D on a line parallel to BC.
