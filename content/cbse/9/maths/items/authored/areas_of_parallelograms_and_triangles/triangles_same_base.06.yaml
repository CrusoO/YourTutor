difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Triangles PQR and PQS have the same base PQ, and the area of PQR is three times the area of PQS. Which statement about their apexes is correct?
hints:
- level: 1
  en: Keep the base fixed and compare only the heights.
- level: 2
  en: Area is proportional to the height when the base is the same.
- level: 3
  en: Use the ratio of the areas directly.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: R is nine times as far from line PQ as S.
- id: b
  en: R is three times as far from line PQ as S.
- id: c
  en: S is three times as far from line PQ as R.
- id: d
  en: R and S are the same distance from line PQ.
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.435CCE5FD442
  when_answer_equals:
  - d
- id: MC.A.ECDAAB5C54DA
  when_answer_equals:
