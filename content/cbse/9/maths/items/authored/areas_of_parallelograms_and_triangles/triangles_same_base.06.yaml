solution_steps:
- en: With a shared base, area is proportional to height, so an area ratio of 3 to 1 means R is three times as far from PQ as S.
- en: The correct option is b.
tier: C
diagram_note: Triangles on a shared base PQ with the apexes R and S at different heights above it.
