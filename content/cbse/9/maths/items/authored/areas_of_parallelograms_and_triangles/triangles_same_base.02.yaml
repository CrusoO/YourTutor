stem:
  en: A triangle has a base of 10 cm and a height of 6 cm. What is its area, in square cm?
hints:
- level: 1
  en: The area of a triangle is half of a base-height product.
- level: 2
  en: Multiply the base and the height first.
- level: 3
  en: Halve the product.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
