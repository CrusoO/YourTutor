difficulty: 0.6
pool: practice
role: apply
stem:
  en: A triangle has two sides of 7 cm and 10 cm. What is the smallest whole-number length, in cm, that the third side can take?
hints:
- level: 1
  en: The third side must be longer than the difference of the two given sides.
- level: 2
  en: Subtract the smaller given side from the larger one.
- level: 3
  en: Take the next whole number above that difference.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: The third side must exceed 10 minus 7, which is 3, and be less than 17, so the smallest whole number is 4 cm.
- en: The unit of the answer is cm.
- en: Answer = 4
tier: C
diagram_note: Triangle with two given sides of 7 cm and 10 cm meeting at a vertex, and the third side shown as an unknown.
