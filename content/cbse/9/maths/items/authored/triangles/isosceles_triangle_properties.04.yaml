stem:
  en: An isosceles triangle has two equal sides of 10 cm and a base of 12 cm. What is its altitude from the apex to the base, in cm?
hints:
- level: 1
  en: The altitude from the apex bisects the base.
- level: 2
  en: Form a right triangle with the altitude as one of its legs.
- level: 3
  en: Apply Pythagoras using half the base and one of the equal sides.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '8'
  accept: []
solution_steps:
- en: Half the base is 6 cm, so the altitude is the square root of 100 minus 36, which is 8 cm.
- en: The unit of the answer is cm.
- en: Answer = 8
tier: C
diagram_note: Isosceles triangle with equal sides of 10 cm, a base of 12 cm, and a perpendicular dropped from the apex to the midpoint of the base.
