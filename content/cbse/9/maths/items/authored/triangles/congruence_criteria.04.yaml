role: apply
stem:
  en: Two right triangles have equal hypotenuses of 13 cm, and in each one a leg measures 5 cm. What is the length of the other leg, in cm?
hints:
- level: 1
  en: Use the Pythagoras relation for the known leg and the hypotenuse.
- level: 2
  en: Square the hypotenuse and subtract the square of the known leg.
- level: 3
  en: Take the square root of the result.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '12'
  accept: []
solution_steps:
- en: The other leg squared is 169 minus 25, which is 144, so the leg is 12 cm.
- en: The unit of the answer is cm.
- en: Answer = 12
tier: C
diagram_note: Right triangle with hypotenuse 13 cm and one leg 5 cm, the other leg left unknown.
