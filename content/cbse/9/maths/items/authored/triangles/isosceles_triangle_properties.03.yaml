stem:
  en: In triangle PQR, PQ equals PR, and angle Q measures 3x degrees while angle R measures x + 20 degrees. What is x?
hints:
- level: 1
  en: The angles opposite equal sides are equal.
- level: 2
  en: Set the two expressions for the base angles equal to each other.
- level: 3
  en: Collect the letter terms and solve.
