id: A.9.maths.triangles.inequalities_in_triangles.02
skill_ids:
- SK.A.9.maths.inequalities_in_triangles
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Two sides of a triangle measure 3 cm and 4 cm. The third side must be less than what length, in cm?
hints:
- level: 1
  en: Use the triangle inequality for the sum of two sides.
- level: 2
  en: Add the two given sides.
- level: 3
  en: The third side must be strictly shorter than that total.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '7'
  accept: []
solution_steps:
- en: The sum of any two sides must exceed the third, so the third side is less than 3 plus 4, which is 7 cm.
- en: The unit of the answer is cm.
- en: Answer = 7
tier: C
