stem:
  en: Two triangles are congruent. The sides of the first are 5 cm, 7 cm and 9 cm. What is the perimeter of the second triangle, in cm?
hints:
- level: 1
  en: Congruent figures have the same side lengths.
- level: 2
  en: Add the three side lengths together.
- level: 3
  en: Check your addition carefully.
