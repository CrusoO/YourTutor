difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Two right triangles are congruent by the RHS criterion. Each has a hypotenuse of 10 cm and one leg of 6 cm. What is the area of one triangle, in square cm?
hints:
- level: 1
  en: Find the missing leg first from the hypotenuse and the known leg.
- level: 2
  en: Use the Pythagoras relation for a right triangle.
- level: 3
  en: The area of a right triangle is half the product of its two legs.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '24'
  accept: []
solution_steps:
- en: The missing leg is 8 cm by Pythagoras, so the area is half of 6 times 8, which is 24 square cm.
- en: The unit of the answer is cm^2.
- en: Answer = 24
tier: C
diagram_note: Right triangle with the right angle marked, the hypotenuse labelled 10 cm and one leg labelled 6 cm.
