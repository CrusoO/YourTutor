difficulty: 0.2
pool: practice
role: recall
stem:
  en: In a triangle, a side that faces a larger angle is what, compared with a side that faces a smaller angle?
hints:
- level: 1
  en: Think about which side faces the bigger angle.
- level: 2
  en: Compare the opposite positions in the triangle.
- level: 3
  en: Use the rule that links sides and angles directly.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: equal
- id: b
  en: longer
- id: c
  en: shorter
- id: d
  en: unrelated
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.0710F4C7B072
  when_answer_equals:
  - c
- id: MC.A.D3047517ECA9
  when_answer_equals:
