solution_steps:
- en: In a triangle the larger angle lies opposite the longer side, so sides and angles are ordered in the same way.
- en: The correct option is b.
tier: C
diagram_note: Triangle with one obtuse angle labelled at a vertex and the side opposite it marked as the longest side.
