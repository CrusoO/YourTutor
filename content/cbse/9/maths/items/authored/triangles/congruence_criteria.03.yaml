stem:
  en: In triangles ABC and PQR, AB equals PQ, angle B equals angle Q, and BC equals QR. Which criterion proves the triangles congruent?
hints:
- level: 1
  en: Locate the given angle and check whether it sits between the two given sides.
- level: 2
  en: Check whether the angle is between the given sides or outside them.
- level: 3
  en: Name the criterion using the order of the given parts.
prediction_prompt:
