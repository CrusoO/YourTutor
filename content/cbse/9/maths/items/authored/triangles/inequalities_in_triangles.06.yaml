stem:
  en: In a triangle, the exterior angle at one vertex is 115 degrees, and one remote interior angle is 45 degrees. What is the other remote interior angle, in degrees?
hints:
- level: 1
  en: The exterior angle equals the sum of the two remote interior angles.
- level: 2
  en: Subtract the given remote angle from the exterior angle.
- level: 3
  en: Check that the result is less than the exterior angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
