id: A.9.maths.triangles.isosceles_triangle_properties.01
skill_ids:
- SK.A.9.maths.isosceles_triangle_properties
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In an isosceles triangle, which angles are equal?
hints:
- level: 1
  en: Look at which sides of the triangle are equal in length.
- level: 2
  en: Find the angles that face those equal sides.
- level: 3
  en: Do not assume the third angle matches unless the sides also match.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the base angle and the apex angle
- id: b
  en: the angles at the apex only
- id: c
  en: the angles opposite the equal sides
- id: d
  en: all three angles
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.732BB77BAB3D
  when_answer_equals:
  - b
- id: MC.A.719018A3AE8C
  when_answer_equals:
  - d
- id: MC.A.0BB21DB50043
  when_answer_equals:
  - a
solution_steps:
- en: Equal sides make the angles opposite them equal, which is the isosceles triangle property.
- en: The correct option is c.
tier: C
diagram_note: Isosceles triangle with two equal sides marked by ticks and the opposite base angles labelled.
