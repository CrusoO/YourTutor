stem:
  en: A rectangle has corners at (0, 0), (5, 0), (5, 2) and (0, 2). Which pair is the midpoint of the diagonal from (0, 0) to (5, 2)?
hints:
- level: 1
  en: Average the horizontal values of the two ends.
- level: 2
  en: Average the vertical values of the two ends separately.
- level: 3
  en: Keep decimals if the average is not a whole number.
