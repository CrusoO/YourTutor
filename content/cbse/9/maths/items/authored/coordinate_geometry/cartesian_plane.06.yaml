stem:
  en: The point (-2, 5) is reflected in the line y = x. Which ordered pair is its image?
hints:
- level: 1
  en: Think about which line the mirror is.
- level: 2
  en: On that mirror line, each point keeps its position relative to it.
- level: 3
  en: Try swapping the two coordinates in the ordered pair.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
