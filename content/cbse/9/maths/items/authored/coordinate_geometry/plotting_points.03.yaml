stem:
  en: The points A(1, 3) and B(4, 7) are plotted. What is the horizontal distance between them, in units?
hints:
- level: 1
  en: Subtract the horizontal readings of the two points.
- level: 2
  en: Ignore the vertical values for this distance.
- level: 3
  en: Take the positive difference.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: The horizontal distance is the difference of the x-coordinates, 4 minus 1, which is 3.
- en: The unit of the answer is units.
- en: Answer = 3
tier: C
diagram_note: Two plotted points on a grid joined by a horizontal dashed segment.
