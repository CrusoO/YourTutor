stem:
  en: The point P with coordinates (3, -4) is reflected in the x-axis. What is the y-coordinate of its image?
hints:
- level: 1
  en: Reflection in the horizontal axis keeps the horizontal value unchanged.
- level: 2
  en: Think about how the vertical value changes sign.
- level: 3
  en: Read the result from the new vertical position.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
