id: A.9.maths.coordinate_geometry.plotting_points.05
skill_ids:
- SK.A.9.maths.plotting_points
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A point P lies in the second quadrant, 3 units from the vertical axis and 4 units from the horizontal axis. What is its distance from the origin, in units?
hints:
- level: 1
  en: Form a right triangle with the origin and the point's projections on the axes.
- level: 2
  en: Square the two perpendicular distances.
- level: 3
  en: Take the square root of their sum.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: The distance from the origin is the square root of 3 squared plus 4 squared, which is 5 by Pythagoras.
- en: The unit of the answer is units.
- en: Answer = 5
tier: C
diagram_note: Second-quadrant point joined to the origin, with a right triangle whose legs are parallel to the axes.
