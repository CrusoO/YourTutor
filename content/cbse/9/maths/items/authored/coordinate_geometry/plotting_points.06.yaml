stem:
  en: Three points are plotted at (1, 2), (5, 2) and (1, 8). What is the area of the right triangle they form, in square units?
hints:
- level: 1
  en: Find the horizontal side from the two points that share a vertical value.
- level: 2
  en: Find the vertical side from the two points that share a horizontal value.
- level: 3
  en: Use half the product of the two perpendicular sides.
