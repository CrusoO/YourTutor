id: A.9.maths.coordinate_geometry.plotting_points.02
skill_ids:
- SK.A.9.maths.plotting_points
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which ordered pair is plotted by moving 3 units left and 1 unit down from the origin?
hints:
- level: 1
  en: The horizontal reading comes first in the ordered pair.
- level: 2
  en: Left and down both give negative values.
- level: 3
  en: Write the horizontal value, then the vertical value.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: (-1, -3)
- id: b
  en: (-3, -1)
- id: c
  en: (-3, 1)
- id: d
  en: (3, -1)
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.BF7CAD9DFC76
  when_answer_equals:
  - d
- id: MC.A.9C6240B1E002
  when_answer_equals:
  - a
- id: MC.A.5E4D9FA82DDC
  when_answer_equals:
  - c
solution_steps:
- en: Moving left gives x equal to minus 3 and moving down gives y equal to minus 1, so the point is (-3, -1).
- en: The correct option is b.
tier: C
