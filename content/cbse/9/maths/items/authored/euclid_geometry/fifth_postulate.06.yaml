stem:
  en: Interior angles of 110 degrees and 75 degrees lie on one side of a transversal crossing two lines. By how many degrees does their sum exceed a straight angle?
hints:
- level: 1
  en: Add the two given angles first.
- level: 2
  en: Subtract the total of two right angles from that sum.
- level: 3
  en: Only the positive difference is asked for.
