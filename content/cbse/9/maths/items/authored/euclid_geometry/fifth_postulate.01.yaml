stem:
  en: In Euclid's list, the fifth postulate is stated in terms of what?
hints:
- level: 1
  en: Think about what the postulate says about lines that meet.
- level: 2
  en: It involves a single transversal cutting two lines.
- level: 3
  en: The relation is between angles, not between lengths.
prediction_prompt:
