stem:
  en: Euclid's common notion says that things equal to the same thing are equal to one another. A length A equals a length C, and a length B also equals C. If A is 9 units, what is B, in units?
hints:
- level: 1
  en: Identify the common thing that both lengths are equal to.
- level: 2
  en: Apply the common notion to link the two lengths directly.
- level: 3
  en: Carry the known value across to the other length.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '9'
  accept: []
solution_steps:
- en: A and B are both equal to C, so they are equal to one another, and since A is 9 units, B is also 9 units.
- en: The unit of the answer is units.
- en: Answer = 9
