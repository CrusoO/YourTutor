id: A.9.maths.euclid_geometry.euclid_axioms.01
skill_ids:
- SK.A.9.maths.euclid_axioms
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which statement is a definition in Euclid's geometry rather than an axiom?
hints:
- level: 1
  en: Ask whether the sentence explains what a word means.
- level: 2
  en: Common notions are general truths about equal quantities.
- level: 3
  en: Postulates ask you to accept a construction or a property.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A circle can be drawn with any centre and radius.
- id: b
  en: Things equal to the same thing are equal to one another.
- id: c
  en: A straight line can be drawn between any two points.
- id: d
  en: A point is that which has no part.
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.0F3596A67C31
  when_answer_equals:
  - b
- id: MC.A.6B92DAC318FE
  when_answer_equals:
  - c
- id: MC.A.6B72E42DE892
  when_answer_equals:
  - a
solution_steps:
- en: A definition says what a term means, so 'a point is that which has no part' defines the point.
- en: The other statements are a common notion or postulates.
- en: The correct option is d.
tier: C
