difficulty: 0.9
pool: practice
role: transfer
stem:
  en: 'Three angles at a point are in the ratio 2 : 3 : 4 and together make a full turn. What is the largest angle, in degrees?'
hints:
- level: 1
  en: Use a letter for one part of the ratio.
- level: 2
  en: The three parts add up to the full angle at a point.
- level: 3
  en: Multiply the largest ratio by the size of one part.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '160'
  accept: []
solution_steps:
- en: The parts sum to 9 units, and 360 divided by 9 is 40, so the largest angle is 4 times 40, which is 160 degrees.
- en: The unit of the answer is degrees.
- en: Answer = 160
tier: C
diagram_note: Three rays drawn from one point dividing the full turn into three adjacent angles.
