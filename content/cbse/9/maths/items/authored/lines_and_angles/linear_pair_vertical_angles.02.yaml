id: A.9.maths.lines_and_angles.linear_pair_vertical_angles.02
skill_ids:
- SK.A.9.maths.linear_pair_vertical_angles
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Two straight lines intersect and form four angles. Which statement about vertically opposite angles is correct?
hints:
- level: 1
  en: Consider the angles directly across from each other at the crossing point.
- level: 2
  en: Compare with what a linear pair does instead.
- level: 3
  en: Think about whether the result depends on the lines being perpendicular.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They are always right angles.
- id: b
  en: They are equal in measure.
- id: c
  en: They are always acute.
- id: d
  en: They always add up to 180 degrees.
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.A736DA6384D8
  when_answer_equals:
  - d
- id: MC.A.09D98761D921
  when_answer_equals:
  - a
- id: MC.A.17024B04B32A
  when_answer_equals:
  - c
solution_steps:
- en: Vertically opposite angles formed by two intersecting lines are always equal, while neighbouring angles form linear pairs instead.
- en: The correct option is b.
tier: C
diagram_note: Two straight lines crossing at a point, with the four angles labelled.
