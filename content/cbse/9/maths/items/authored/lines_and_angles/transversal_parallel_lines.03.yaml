stem:
  en: Parallel lines are cut by a transversal. Two alternate interior angles are written as x + 25 and 3x - 5 degrees. What is x?
hints:
- level: 1
  en: Alternate interior angles are equal when the lines are parallel.
- level: 2
  en: Set the two expressions equal to each other.
- level: 3
  en: Collect the letter terms on one side before solving.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '15'
  accept: []
solution_steps:
- en: Equal alternate angles give x plus 25 equal to 3x minus 5, so 2x equals 30 and x is 15.
- en: Answer = 15
tier: C
diagram_note: Parallel lines cut by a transversal, with the two alternate interior angles labelled in terms of x.
