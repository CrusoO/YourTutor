id: A.9.maths.lines_and_angles.transversal_parallel_lines.06
skill_ids:
- SK.A.9.maths.transversal_parallel_lines
difficulty: 0.9
pool: practice
role: explain
stem:
  en: A 70-degree interior angle has an alternate partner across a transversal that meets two parallel lines. Which statement about that partner is correct?
hints:
- level: 1
  en: Find the angle on the other side of the transversal, between the same two lines.
- level: 2
  en: Parallel lines make alternate interior angles equal.
- level: 3
  en: Consider which relationship makes two angles equal.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It cannot be determined without checking whether the lines intersect.
- id: b
  en: It is also 70 degrees and lies on the opposite side of the transversal.
- id: c
  en: It is 20 degrees because the lines differ.
- id: d
  en: It is 110 degrees and lies on the same side.
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.3E5545E2AA96
  when_answer_equals:
  - d
- id: MC.A.421AA22D814C
  when_answer_equals:
