stem:
  en: Two parallel lines are cut by a transversal. One interior angle on one side measures 70 degrees. What is its co-interior partner, in degrees?
hints:
- level: 1
  en: Co-interior angles on the same side add up to a known total.
- level: 2
  en: Subtract the given angle from a straight angle.
- level: 3
  en: Recall the total measure of a straight angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '110'
  accept: []
solution_steps:
- en: Co-interior angles sum to 180 degrees, so the partner is 180 minus 70, which is 110 degrees.
- en: The unit of the answer is degrees.
- en: Answer = 110
tier: C
