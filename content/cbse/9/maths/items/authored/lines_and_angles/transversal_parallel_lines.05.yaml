stem:
  en: Co-interior angles on the same side of a transversal between parallel lines differ by 40 degrees. What is the larger angle, in degrees?
hints:
- level: 1
  en: Express the larger angle as the smaller angle plus the given difference.
- level: 2
  en: The two co-interior angles add up to a straight angle.
- level: 3
  en: Solve for the smaller angle and then add the difference.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
