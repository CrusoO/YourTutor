answer:
  sympy: '110'
  accept: []
solution_steps:
- en: Let the smaller angle be x, so x plus x plus 40 equals 180, which gives x equal to 70 and the larger angle 110 degrees.
- en: The unit of the answer is degrees.
- en: Answer = 110
