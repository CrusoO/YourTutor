solution_steps:
- en: Let the smaller angle be x, so x plus 3x equals 180, giving x equal to 45 degrees.
- en: The correct option is d.
tier: C
diagram_note: A straight line with a ray dividing it into two adjacent angles, the smaller labelled x and the larger labelled 3x.
