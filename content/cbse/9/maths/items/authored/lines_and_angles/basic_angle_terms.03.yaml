difficulty: 0.6
pool: practice
role: apply
stem:
  en: Two adjacent angles on a straight line are supplementary, and one is three times the other. What is the smaller angle?
hints:
- level: 1
  en: Write the smaller angle as a letter and the larger one in terms of that letter.
- level: 2
  en: Supplementary angles add up to a straight angle.
- level: 3
  en: Solve the simple equation formed by the sum.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 135 degrees
- id: b
  en: 90 degrees
- id: c
  en: 60 degrees
- id: d
  en: 45 degrees
answer:
  sympy: d
  accept: []
misconception_rules:
