stem:
  en: A triangle is to be constructed with a base of 8 cm and both base angles equal to 45 degrees. What is the apex angle, in degrees?
hints:
- level: 1
  en: The angles of any triangle add up to a known total.
- level: 2
  en: Add the two given base angles and subtract from that total.
- level: 3
  en: Check that the result is a positive angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
