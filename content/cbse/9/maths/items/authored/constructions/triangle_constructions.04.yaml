  original: true
  author: model-draft
type: numeric
answer:
  sympy: '90'
  accept: []
solution_steps:
- en: The angles of a triangle add to 180 degrees, so the apex is 180 minus 90, which is 90 degrees.
- en: The unit of the answer is degrees.
- en: Answer = 90
