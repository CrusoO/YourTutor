stem:
  en: Which set of measures is enough to construct one unique triangle?
hints:
- level: 1
  en: Ask which measures pin down both the shape and the size.
- level: 2
  en: Three angles can be scaled up or down to give different triangles.
- level: 3
  en: Choose the set that fixes every side length.
