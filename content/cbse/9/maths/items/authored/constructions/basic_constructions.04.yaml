stem:
  en: A segment of length 10 cm is bisected by its perpendicular bisector. What is the distance, in cm, from one end of the segment to the point where the bisector meets it?
hints:
- level: 1
  en: The perpendicular bisector passes through the midpoint.
- level: 2
  en: Divide the total length by the number of equal parts.
- level: 3
  en: Take exactly half of the segment.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: The perpendicular bisector meets the segment at its midpoint, which is exactly half of 10 cm, so the distance is 5 cm.
- en: The unit of the answer is cm.
- en: Answer = 5
tier: C
diagram_note: Segment with its perpendicular bisector drawn through the midpoint, and the two halves marked.
