id: A.9.maths.constructions.basic_constructions.05
skill_ids:
- SK.A.9.maths.basic_constructions
difficulty: 0.9
pool: practice
role: explain
stem:
  en: Why does the perpendicular bisector construction work for a segment?
hints:
- level: 1
  en: Think about what the equal arcs guarantee about distances.
- level: 2
  en: Consider which points are equally far from both ends.
- level: 3
  en: Check the property of the bisector against the radii of the arcs.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The bisector forms an angle of 60 degrees with the segment.
- id: b
  en: The bisector makes the segment twice as long.
- id: c
  en: Every point on the bisector is equally far from both ends of the segment.
- id: d
  en: The bisector passes through only one end of the segment.
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.9D2C4B0EE3CD
  when_answer_equals:
  - b
- id: MC.A.3ED4CFACF8CF
  when_answer_equals:
  - a
- id: MC.A.7DFFBE20022F
  when_answer_equals:
  - d
solution_steps:
- en: Points on the perpendicular bisector are equidistant from the endpoints, which is why arcs of equal radius meet on that line.
- en: The correct option is c.
tier: C
diagram_note: Segment with arcs of equal radius drawn from each end, meeting on the perpendicular bisector.
