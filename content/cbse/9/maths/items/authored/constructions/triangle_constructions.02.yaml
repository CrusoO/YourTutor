id: A.9.maths.constructions.triangle_constructions.02
skill_ids:
- SK.A.9.maths.triangle_constructions
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A triangle is constructed with sides 3 cm, 4 cm and 5 cm. What is its area, in square cm?
hints:
- level: 1
  en: Check whether the squares of the two shorter sides add to the square of the longest.
- level: 2
  en: If they do, the two shorter sides can serve as base and height.
- level: 3
  en: Halve the product of those two sides.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: Since 3 squared plus 4 squared equals 5 squared, the angle between the shorter sides is a right angle, so the area is half of 12, which is 6 square cm.
- en: The unit of the answer is cm^2.
- en: Answer = 6
tier: C
diagram_note: Right triangle with sides of 3 cm, 4 cm and 5 cm labelled.
