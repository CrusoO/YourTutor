stem:
  en: An isosceles triangle is constructed with a base of 10 cm and two equal sides of 13 cm each. What is its height above the base, in cm?
hints:
- level: 1
  en: The perpendicular from the apex bisects the base.
- level: 2
  en: Form a right triangle with half the base and one of the equal sides.
- level: 3
  en: Apply Pythagoras to find the height.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '12'
  accept: []
solution_steps:
- en: Half the base is 5 cm, so the height is the square root of 169 minus 25, which is 12 cm.
- en: The unit of the answer is cm.
- en: Answer = 12
tier: C
diagram_note: Isosceles triangle with base 10 cm, equal sides 13 cm, and the height drawn from the apex to the base.
