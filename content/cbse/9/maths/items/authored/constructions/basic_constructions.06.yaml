difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A segment AB is 8 cm long. A point P lies on its perpendicular bisector so that PA is 5 cm. What is the distance from P to the midpoint of AB, in cm?
hints:
- level: 1
  en: Half the segment is one leg of a right triangle.
- level: 2
  en: The distance from P to an end is the hypotenuse of that triangle.
- level: 3
  en: Apply Pythagoras to find the remaining leg.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: Half of 8 is 4, so the distance is the square root of 25 minus 16, which is 3 cm.
- en: The unit of the answer is cm.
- en: Answer = 3
tier: C
diagram_note: Segment AB with its midpoint M, the point P above on the perpendicular bisector, and the right triangle PMA shown.
