stem:
  en: A solid is a cylinder of radius 7 cm and height 10 cm with a hemisphere of radius 7 cm on top. Using pi equal to 22 over 7, what is the total curved surface area of the two curved parts, in square cm?
hints:
- level: 1
  en: The curved area of the cylinder is 2 pi r h.
- level: 2
  en: The curved area of a hemisphere is 2 pi r squared.
- level: 3
  en: Add the two curved areas, leaving out the flat circle where they join.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '748'
  accept: []
solution_steps:
- en: The cylinder's curved area is 440 square cm and the hemisphere's curved area is 308 square cm, so the total is 748 square cm.
- en: The unit of the answer is cm^2.
- en: Answer = 748
tier: C
