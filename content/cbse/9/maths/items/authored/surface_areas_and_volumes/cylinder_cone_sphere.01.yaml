role: recall
stem:
  en: A cylinder has a radius of 7 cm and a height of 10 cm. Using pi equal to 22 over 7, what is its curved surface area, in square cm?
hints:
- level: 1
  en: The curved surface area of a cylinder is 2 pi r h.
- level: 2
  en: Substitute the radius and the height.
- level: 3
  en: Cancel the common factor of 7 between the radius and the fraction.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '440'
  accept: []
solution_steps:
- en: The curved surface area is 2 times 22/7 times 7 times 10, which equals 440 square cm.
- en: The unit of the answer is cm^2.
- en: Answer = 440
tier: C
diagram_note: Cylinder with its radius and height marked.
