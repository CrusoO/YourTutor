stem:
  en: A solid is made by stacking two cubes, each of edge 2 cm, one on top of the other. What is the total volume, in cubic cm?
hints:
- level: 1
  en: The volume of the combined solid is the sum of the volumes of its parts.
- level: 2
  en: Find the volume of one cube first.
- level: 3
  en: Add the two volumes together.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
