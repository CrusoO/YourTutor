  original: true
  author: model-draft
type: numeric
answer:
  sympy: '16'
  accept: []
solution_steps:
- en: Each cube has volume 8 cubic cm, so together they make 16 cubic cm.
- en: The unit of the answer is cm^3.
- en: Answer = 16
