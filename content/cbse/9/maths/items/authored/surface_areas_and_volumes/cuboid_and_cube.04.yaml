stem:
  en: A cuboid has a volume of 120 cubic cm, a length of 6 cm and a width of 4 cm. What is its height?
hints:
- level: 1
  en: Volume is the product of length, width and height.
- level: 2
  en: Compute the area of the base first.
- level: 3
  en: Divide the volume by the base area.
