stem:
  en: A cone of base radius 7 cm and slant height 25 cm sits on a cylinder of radius 7 cm and height 10 cm. Using pi equal to 22 over 7, what is the total curved surface area of the two curved parts, in square cm?
hints:
- level: 1
  en: Use the curved surface area formula for the cone, which involves the slant height.
- level: 2
  en: Use the curved surface area formula for the cylinder.
- level: 3
  en: Add the two curved areas and leave out the circle where they join.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '990'
  accept: []
solution_steps:
- en: The cone's curved area is 22/7 times 7 times 25, which is 550 square cm, and the cylinder's curved area is 440 square cm, so the total is 990 square cm.
- en: The unit of the answer is cm^2.
- en: Answer = 990
tier: C
