stem:
  en: A cuboid measures 5 cm by 4 cm by 3 cm. What is its total surface area, in square cm?
hints:
- level: 1
  en: The total surface area is the sum of the areas of all six faces.
- level: 2
  en: The faces come in pairs of equal area.
- level: 3
  en: Double the sum of the three distinct face areas.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
