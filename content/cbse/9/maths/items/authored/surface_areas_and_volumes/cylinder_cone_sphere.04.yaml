stem:
  en: A cone has a base radius of 3 cm and a slant height of 5 cm. Using pi equal to 3.14, what is its curved surface area, in square cm?
hints:
- level: 1
  en: The curved surface area of a cone is pi times the radius times the slant height.
- level: 2
  en: Multiply the three quantities together.
- level: 3
  en: Round to one decimal place at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '47.1'
  accept: []
solution_steps:
- en: The curved surface area is 3.14 times 3 times 5, which equals 47.1 square cm.
- en: The unit of the answer is cm^2.
- en: Answer = 47.1
