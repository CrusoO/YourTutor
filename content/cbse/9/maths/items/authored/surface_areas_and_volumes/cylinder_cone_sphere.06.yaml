solution_steps:
- en: A cone has one third of the volume of a cylinder with the same base and height, so 90 divided by 3 gives 30 cubic cm.
- en: The correct option is b.
tier: C
diagram_note: Cylinder and cone sharing the same base and height, drawn side by side.
