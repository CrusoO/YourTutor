stem:
  en: A cuboid measuring 6 cm by 4 cm by 2 cm has a cube of edge 2 cm removed from one corner. What is the volume of the remaining solid, in cubic cm?
hints:
- level: 1
  en: Find the volume of the full cuboid first.
- level: 2
  en: Find the volume of the cube that is removed.
- level: 3
  en: Subtract the removed volume from the full volume.
