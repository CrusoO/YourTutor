stem:
  en: A cone has a base radius of 7 cm and a height of 3 cm. Using pi equal to 22 over 7, what is its volume, in cubic cm?
hints:
- level: 1
  en: Use the volume formula for a cone, which has a one third factor.
- level: 2
  en: Square the radius before multiplying.
- level: 3
  en: Cancel the common factor of 7 early in the calculation.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '154'
  accept: []
solution_steps:
- en: The volume is one third times 22/7 times 49 times 3, which equals 154 cubic cm.
- en: The unit of the answer is cm^3.
- en: Answer = 154
