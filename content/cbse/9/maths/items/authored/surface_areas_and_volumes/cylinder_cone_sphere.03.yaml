stem:
  en: A sphere has a radius of 7 cm. Using pi equal to 22 over 7, what is its total surface area, in square cm?
hints:
- level: 1
  en: The surface area of a sphere is four times pi times the radius squared.
- level: 2
  en: Square the radius first.
- level: 3
  en: Replace pi by the given fraction and simplify.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
