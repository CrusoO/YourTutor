stem:
  en: A cube has a volume of 343 cubic cm. What is its total surface area, in square cm?
hints:
- level: 1
  en: Find the edge from the volume by taking the cube root.
- level: 2
  en: Use the edge to find the area of one face.
- level: 3
  en: Multiply the area of one face by six.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '294'
  accept: []
solution_steps:
- en: The edge is 7 cm, since 7 cubed is 343, and six faces of 49 square cm each give 294 square cm.
- en: The unit of the answer is cm^2.
- en: Answer = 294
tier: C
