role: transfer
stem:
  en: A polynomial equals (x - 1)(x + 2)(x - 4) + 5. What is its remainder when divided by x - 4?
hints:
- level: 1
  en: Substitute the zero of the divisor into the whole expression.
- level: 2
  en: The product part vanishes at that value because one of its factors becomes zero.
- level: 3
  en: What remains after the product vanishes is the remainder.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: At x equal to 4 the product has a factor of zero, so only the added constant remains as the remainder.
- en: Answer = 5
tier: C
