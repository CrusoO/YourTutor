stem:
  en: For f(x) = x^2 - 4x + k, the remainder when f is divided by x - 2 is 6. What is k?
hints:
- level: 1
  en: 'Use the remainder theorem: the remainder is the polynomial at the zero of the divisor.'
- level: 2
  en: Substitute that zero into every term, including the unknown constant.
- level: 3
  en: Move the known terms across and solve the equation for the unknown.
