stem:
  en: A polynomial has the form 5p - 2. How is it best described by its number of terms and its degree?
hints:
- level: 1
  en: Count the terms that are actually present.
- level: 2
  en: The number of terms gives the type of the polynomial.
- level: 3
  en: Find the highest exponent of the variable to get the degree.
