id: A.9.maths.polynomials.factor_theorem.01
skill_ids:
- SK.A.9.maths.factor_theorem
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Is x - 2 a factor of x^2 - 4?
hints:
- level: 1
  en: Use the factor theorem by substituting the root of the divisor.
- level: 2
  en: Check whether the result of the substitution is exactly zero.
- level: 3
  en: A zero remainder means the divisor divides the polynomial exactly.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: No, because the constant term is not zero.
- id: b
  en: No, because the polynomial has degree two.
- id: c
  en: Yes, because the remainder at x equal to 2 is zero.
- id: d
  en: Yes, because the constant term is negative.
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.AE230DBBB01A
  when_answer_equals:
  - a
- id: MC.A.BD2D48E3D3B8
  when_answer_equals:
  - b
- id: MC.A.9E42E5DE6916
  when_answer_equals:
  - d
solution_steps:
- en: Substituting 2 gives 4 - 4, which is zero, so by the factor theorem x - 2 is a factor.
- en: The correct option is c.
tier: C
