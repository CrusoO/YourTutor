stem:
  en: Multiply x squared plus one by x cubed minus x and expand. What is the degree of the resulting polynomial?
hints:
- level: 1
  en: Find the highest power produced by multiplying the leading terms.
- level: 2
  en: Add the exponents of the two leading terms.
- level: 3
  en: Smaller terms do not change the degree, so ignore them.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
