difficulty: 0.6
pool: practice
role: apply
stem:
  en: Using the factor theorem, which linear expression is a factor of x^3 - 7x + 6?
hints:
- level: 1
  en: Test values that divide the constant term evenly.
- level: 2
  en: Substitute the candidate value and check whether the result is zero.
- level: 3
  en: The factor has the opposite sign to the value that gives zero.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: x - 3
- id: b
  en: x - 6
- id: c
  en: x + 3
- id: d
  en: x + 2
answer:
  sympy: c
  accept: []
misconception_rules:
