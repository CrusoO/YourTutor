difficulty: 0.2
pool: practice
role: procedure
stem:
  en: The polynomial x^2 + 5x + 6 has x + 2 as one factor. What is the constant term of the other linear factor?
hints:
- level: 1
  en: Divide the polynomial by the known factor.
- level: 2
  en: The remaining factor is a linear expression.
- level: 3
  en: Compare the constant terms of the product with the original constant.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: Dividing gives x + 3 as the other factor, since the product of the constant terms 2 and 3 is the constant 6.
- en: Answer = 3
tier: C
