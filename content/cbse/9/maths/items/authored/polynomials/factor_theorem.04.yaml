role: procedure
stem:
  en: Find the value of k so that x + 1 is a factor of x^3 + k x^2 + 3x + 2.
hints:
- level: 1
  en: Set the divisor equal to zero and substitute the value into the polynomial.
- level: 2
  en: Replace the variable by that value in every term.
- level: 3
  en: Solve for the unknown using the remaining terms.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: Substituting minus one gives minus one plus k minus three plus two, which equals k minus 2; setting that to zero gives k equal to 2.
- en: Answer = 2
tier: C
