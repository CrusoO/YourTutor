stem:
  en: When x^4 + a x^3 - 3x + 2 is divided by x + 1, the remainder is 4. What is a?
hints:
- level: 1
  en: Set the divisor equal to zero to find the value to substitute.
- level: 2
  en: Substitute that value into the polynomial and keep the letter a in place.
- level: 3
  en: Solve the equation you obtain for the letter.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: Substituting x equal to minus 1 gives 1 - a + 3 + 2, which is 6 - a; setting this equal to 4 gives a equal to 2.
- en: Answer = 2
tier: C
