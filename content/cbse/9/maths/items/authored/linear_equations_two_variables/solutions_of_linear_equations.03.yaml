stem:
  en: Which equation has the pair (1, -2) as a solution?
hints:
- level: 1
  en: Substitute the given x and y into each equation in turn.
- level: 2
  en: Be careful when a negative value is multiplied or subtracted.
- level: 3
  en: Only the equation that balances after substitution is correct.
