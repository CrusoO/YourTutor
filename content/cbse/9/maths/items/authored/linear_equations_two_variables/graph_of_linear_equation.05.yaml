stem:
  en: A straight line passes through (1, 5) and (4, 11) and is written as y = mx + c. What is c?
hints:
- level: 1
  en: Find the slope first from the change in y over the change in x.
- level: 2
  en: Substitute one of the points and the slope into the form y = mx + c.
- level: 3
  en: Solve for the remaining constant.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: The slope is 6 over 3, which is 2, and substituting the point (1, 5) gives 5 equal to 2 plus c, so c is 3.
- en: Answer = 3
tier: C
