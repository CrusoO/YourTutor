difficulty: 0.6
pool: practice
role: apply
stem:
  en: A line passes through the points (0, 3) and (2, 7). What is its slope?
hints:
- level: 1
  en: Compute the change in y between the two points.
- level: 2
  en: Compute the change in x between the same two points.
- level: 3
  en: Divide the change in y by the change in x.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: 'Slope is rise over run: (7 minus 3) over (2 minus 0) gives 4 over 2, which is 2.'
- en: Answer = 2
tier: C
diagram_note: Straight line on a grid joining the marked points, with a rise and run triangle drawn beneath it.
