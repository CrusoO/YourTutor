stem:
  en: Two lines y = 2x + 1 and y = 2x - 3 are drawn on the same grid. Which statement is correct?
hints:
- level: 1
  en: Compare the coefficients of x in both equations.
- level: 2
  en: Lines with equal slopes behave in a specific way.
- level: 3
  en: Check whether the constant terms differ.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They are parallel and never meet.
- id: b
  en: They are perpendicular.
- id: c
  en: They meet at the point (1, 3).
- id: d
  en: They meet at the origin.
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.44929A25EE33
