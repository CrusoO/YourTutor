stem:
  en: Find the angle between the line with direction (1, 1, square root of 2) and the plane z = 0, in degrees.
hints:
- level: 1
  en: The angle between a line and a plane uses the sine together with the normal vector.
- level: 2
  en: Compute the dot product of the direction with the normal.
- level: 3
  en: Divide by the product of the magnitudes and find the angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '45'
  accept: []
solution_steps:
- en: The normal to the plane is (0, 0, 1).
- en: The sine of the angle with the plane equals the dot product 1 times square root of 2 divided by the product of magnitudes 2 and 1, which is square root of 2 over 2, so the angle is 45 degrees.
- en: The unit of the answer is degrees.
- en: Answer = 45
tier: C
diagram_note: A line passing through the horizontal plane at an angle, with the normal to the plane drawn as a vertical arrow.
