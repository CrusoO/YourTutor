difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A line is perpendicular to the z-axis. Which statement about its direction cosines is correct?
hints:
- level: 1
  en: Think about which angle a line makes when it is perpendicular to the z-axis.
- level: 2
  en: Consider which direction cosine corresponds to the angle with the z-axis.
- level: 3
  en: Relate that cosine to the value at a right angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Its direction ratios add up to 1
- id: b
  en: Its direction cosine along z is 0
- id: c
  en: Its direction cosines are all equal
- id: d
  en: Its direction cosine along x is 0
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.057673EC9BF9
  when_answer_equals:
  - d
- id: MC.A.F1E2CB0C9FB1
  when_answer_equals:
