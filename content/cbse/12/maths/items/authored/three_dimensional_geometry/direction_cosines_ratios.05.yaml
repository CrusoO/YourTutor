stem:
  en: A line makes angles of 60 degrees with the x-axis and 60 degrees with the y-axis. Find the angle it makes with the z-axis, in degrees.
hints:
- level: 1
  en: Use the relation between the three direction cosines to find the third one.
- level: 2
  en: Take the positive root for the cosine of the angle with the z-axis.
- level: 3
  en: Convert the cosine you obtain into an angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
