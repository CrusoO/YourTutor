  original: true
  author: model-draft
type: numeric
answer:
  sympy: '45'
  accept: []
solution_steps:
- en: The x and y direction cosines are both 1/2, so the z direction cosine squared is 1 minus 1/4 minus 1/4, which is 1/2.
- en: The cosine is 1 over the square root of 2, giving 45 degrees.
- en: The unit of the answer is degrees.
- en: Answer = 45
