stem:
  en: A line passes through A = (1, 2, 3) and B = (3, 4, 7). Its point at parameter t is A + t(B - A). Find the y-coordinate of this point when t = 0.5.
hints:
- level: 1
  en: Find the direction vector as B minus A.
- level: 2
  en: Substitute the parameter into the y component of A plus t times the direction.
- level: 3
  en: Add the scaled direction component to the starting y-coordinate.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
