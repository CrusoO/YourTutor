stem:
  en: Which line is parallel to r = (1, 2, 3) + t(2, 3, 4)?
hints:
- level: 1
  en: Parallel lines have direction vectors that are scalar multiples of each other.
- level: 2
  en: Check whether each candidate direction is a scalar multiple of (2, 3, 4).
- level: 3
  en: Ignore the point on the line when comparing directions.
