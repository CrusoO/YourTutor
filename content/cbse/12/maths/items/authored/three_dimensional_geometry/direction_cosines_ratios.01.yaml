stem:
  en: Find the x-direction cosine of the line joining the points (1, 2, 3) and (3, 2, 1), rounded to 3 decimal places.
hints:
- level: 1
  en: Subtract the coordinates of the first point from those of the second.
- level: 2
  en: Find the magnitude of the resulting vector.
- level: 3
  en: Divide the first component by that magnitude.
