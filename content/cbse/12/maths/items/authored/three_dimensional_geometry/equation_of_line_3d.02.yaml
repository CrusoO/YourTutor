  en: (x - 1)/2 = (y - 2)/3 = (z - 3)/4
- id: b
  en: (x + 1)/2 = (y + 2)/3 = (z + 3)/4
- id: c
  en: (x - 1)/4 = (y - 2)/3 = (z - 3)/2
- id: d
  en: (x - 1)/2 = (y - 2)/3 = (z - 3)/-4
