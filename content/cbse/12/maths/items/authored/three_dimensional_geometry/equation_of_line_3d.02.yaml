stem:
  en: What is the Cartesian form of the line through (1, 2, 3) with direction ratios (2, 3, 4)?
hints:
- level: 1
  en: Use the given point and the direction ratios in the symmetric form.
- level: 2
  en: Each coordinate difference is divided by its matching direction ratio.
- level: 3
  en: Keep the sign of each point coordinate when you form the difference.
