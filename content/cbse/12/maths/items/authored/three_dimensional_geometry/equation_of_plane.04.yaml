difficulty: 0.6
pool: practice
role: explain
stem:
  en: What is the equation of the plane through (1, 0, 0), (0, 2, 0) and (0, 0, 3)?
hints:
- level: 1
  en: Use the intercept form of a plane with the three axis intercepts.
- level: 2
  en: Clear the fractions by multiplying through by the common denominator.
- level: 3
  en: Check the final equation by substituting each of the three points.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 6x + 3y + 2z = 0
- id: b
  en: 6x + 3y + 2z = 6
- id: c
  en: 6x + 3y + 2z = 1
- id: d
  en: x + 2y + 3z = 6
answer:
