stem:
  en: Line L1 passes through the origin with direction (1, 0, 0), and line L2 passes through (0, 0, 1) with direction (0, 1, 0). What is the shortest distance between them?
hints:
- level: 1
  en: Find a vector perpendicular to both direction vectors.
- level: 2
  en: Project the vector joining a point on each line onto that common perpendicular.
- level: 3
  en: Divide by the length of the perpendicular vector.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
