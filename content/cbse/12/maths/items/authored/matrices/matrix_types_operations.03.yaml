difficulty: 0.6
pool: practice
role: explain
stem:
  en: A = [[2, 1], [0, 3]] and B = [[1, 0], [2, 1]]. Which number is the entry in row 1, column 2 of AB?
hints:
- level: 1
  en: The entry in row i, column j of a product uses row i of the first matrix and column j of the second.
- level: 2
  en: Multiply the paired entries and add the products.
- level: 3
  en: Work out the pairs one at a time and keep the order straight.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: '3'
- id: b
  en: '2'
- id: c
  en: '1'
- id: d
  en: '0'
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.BCA97D163EEB
  when_answer_equals:
  - d
- id: MC.A.B1B1625BB9BC
  when_answer_equals:
