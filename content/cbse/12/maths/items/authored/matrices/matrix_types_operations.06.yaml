  author: model-draft
type: numeric
answer:
  sympy: '9'
  accept: []
solution_steps:
- en: The determinant of A is 4 minus 1, which is 3, and the determinant of a product is the product of the determinants, so det(A squared) is 3 times 3, which is 9.
- en: Answer = 9
