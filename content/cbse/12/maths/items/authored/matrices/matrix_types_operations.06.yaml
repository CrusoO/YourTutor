stem:
  en: Let A = [[2, 1], [1, 2]]. Find the determinant of A squared.
hints:
- level: 1
  en: Recall how the determinant behaves when two matrices are multiplied.
- level: 2
  en: Compute the determinant of A first.
- level: 3
  en: Apply the rule to the second power of A.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
