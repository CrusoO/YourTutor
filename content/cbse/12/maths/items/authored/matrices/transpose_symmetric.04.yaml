stem:
  en: A is a 3 by 3 skew-symmetric matrix whose entry in row 1, column 2 is 4. What is the entry in row 2, column 1?
hints:
- level: 1
  en: Recall how a skew-symmetric matrix relates an entry to its mirror entry.
- level: 2
  en: Look at the sign relation between the two mirror positions.
- level: 3
  en: Keep the size of the entry and decide its sign.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-4'
  accept: []
solution_steps:
- en: In a skew-symmetric matrix each entry is the negative of its mirror entry, so the row 2, column 1 entry is minus 4.
- en: Answer = -4
tier: C
