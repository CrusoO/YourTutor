answer:
  sympy: '0.2'
  accept: []
solution_steps:
- en: For a diagonal matrix the inverse is obtained by taking the reciprocal of each diagonal entry, so the row 2, column 2 entry is 1 divided by 5.
- en: Answer = 0.2
