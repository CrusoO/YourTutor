stem:
  en: Let A = [[2, 0], [0, 5]]. Find the entry in row 2, column 2 of the inverse of A.
hints:
- level: 1
  en: Consider what happens to each diagonal entry when you invert a diagonal matrix.
- level: 2
  en: Focus on the diagonal entry in row 2, column 2.
- level: 3
  en: Take the reciprocal of that entry.
prediction_prompt:
