stem:
  en: Let A = [[3, 1], [5, 2]]. Find the entry in row 2, column 1 of the inverse of A.
hints:
- level: 1
  en: Recall the formula for the inverse of a 2 by 2 matrix.
- level: 2
  en: Swap the diagonal entries and change the signs of the off-diagonal entries.
- level: 3
  en: Divide everything by the determinant of the matrix.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
