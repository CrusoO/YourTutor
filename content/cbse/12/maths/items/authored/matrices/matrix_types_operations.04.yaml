stem:
  en: Let A = [[1, 2], [0, 1]]. Find the entry in row 1, column 2 of A cubed.
hints:
- level: 1
  en: Compute A squared first and watch how the upper right entry changes.
- level: 2
  en: Look for a pattern in the upper right entry as the power increases.
- level: 3
  en: Multiply once more to reach the third power.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: Each multiplication by A adds 2 to the upper right entry, so the upper right entry of A cubed is 2 plus 2 plus 2, which is 6.
- en: Answer = 6
tier: C
