difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which elementary row operation applied to the 2 by 2 identity matrix gives [[1, 0], [3, 1]]?
hints:
- level: 1
  en: Write out row 2 of the identity matrix first.
- level: 2
  en: Decide which row must be added to row 2 and by how much.
- level: 3
  en: Check the sign of the multiple by computing the first entry of the new row.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Replace R2 by R2 + 3R1
- id: b
  en: Replace R1 by R1 + 3R2
- id: c
  en: Replace R2 by 3R2
- id: d
  en: Replace R2 by R2 - 3R1
answer:
  sympy: a
  accept: []
misconception_rules:
