difficulty: 0.6
pool: practice
role: apply
stem:
  en: Product P needs 4 kg of material per unit and product Q needs 6 kg per unit, with 120 kg available. How many kg of material do 10 units of P and 5 units of Q use in total?
hints:
- level: 1
  en: Multiply the material per unit of P by the number of units of P.
- level: 2
  en: Multiply the material per unit of Q by the number of units of Q.
- level: 3
  en: Add the two amounts and compare the total with the 120 kg available.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '70'
  accept: []
solution_steps:
- en: The material used is 4 times 10 plus 6 times 5, which is 40 plus 30, giving 70 kg.
- en: The unit of the answer is kg.
- en: Answer = 70
tier: C
