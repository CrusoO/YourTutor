solution_steps:
- en: Points with x + y arbitrarily large lie in the region, so Z has no upper bound and no maximum exists.
- en: The correct option is c.
tier: C
diagram_note: Unbounded region in the first quadrant lying above the line x + y = 3, with arrows showing it extends outward.
