  author: model-draft
type: numeric
answer:
  sympy: '14'
  accept: []
solution_steps:
- en: The chairs need 2 times 4 = 8 hours and the tables need 3 times 2 = 6 hours, giving 14 hours in total.
- en: The unit of the answer is hours.
- en: Answer = 14
