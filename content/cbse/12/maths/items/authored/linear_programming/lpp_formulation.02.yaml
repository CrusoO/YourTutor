stem:
  en: Each chair needs 2 hours of labour and each table needs 3 hours. How many hours of labour do 4 chairs and 2 tables need in total?
hints:
- level: 1
  en: Multiply the hours per chair by the number of chairs.
- level: 2
  en: Multiply the hours per table by the number of tables.
- level: 3
  en: Add the two amounts.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
