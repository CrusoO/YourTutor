stem:
  en: Maximise Z = 5x + 4y subject to 2x + y <= 8, x + 2y <= 8, x >= 0 and y >= 0. Where is the maximum attained?
hints:
- level: 1
  en: Find where the two constraint lines intersect.
- level: 2
  en: Include the intercepts on the axes as corner points too.
- level: 3
  en: Evaluate the objective at every corner point and compare.
