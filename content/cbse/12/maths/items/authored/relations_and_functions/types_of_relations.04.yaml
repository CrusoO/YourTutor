stem:
  en: Let A = {1, 2, 3, 4} and let R be the relation a is less than b on A. How many ordered pairs does R contain?
hints:
- level: 1
  en: Only pairs whose first entry is smaller than the second belong to R.
- level: 2
  en: Go through the first element one at a time and list its partners.
- level: 3
  en: Count the pairs in the list you built.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: The pairs are (1,2), (1,3), (1,4), (2,3), (2,4) and (3,4), giving 6 ordered pairs.
- en: Answer = 6
tier: C
