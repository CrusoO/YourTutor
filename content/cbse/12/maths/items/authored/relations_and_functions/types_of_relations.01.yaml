id: A.12.maths.relations_and_functions.types_of_relations.01
skill_ids:
- SK.A.12.maths.types_of_relations
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Let A = {1, 2, 3}. Which of the following relations on A is an equivalence relation?
hints:
- level: 1
  en: Start by checking whether each element of A is related to itself.
- level: 2
  en: For each pair in the relation, look for its reverse.
- level: 3
  en: Then chain any two pairs together and see whether the result is already in the relation.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: '{(1,2), (2,3), (1,3)}'
- id: b
  en: '{(1,1), (2,2), (3,3), (1,2)}'
- id: c
  en: '{(1,1), (2,2), (1,2)}'
- id: d
  en: '{(1,1), (2,2), (3,3), (1,2), (2,1)}'
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.B2AE96AEB5A4
  when_answer_equals:
  - c
- id: MC.A.F8BE6285FAAA
  when_answer_equals:
  - b
- id: MC.A.8A1AFC4A23F7
  when_answer_equals:
  - a
solution_steps:
- en: Every element is related to itself and the pair (1,2) comes with (2,1), so the relation is reflexive and symmetric.
- en: Checking the chains of pairs shows it is transitive as well.
- en: The correct option is d.
tier: C
