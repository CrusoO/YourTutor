stem:
  en: How many one-one functions exist from a set with 3 elements to a set with 5 elements?
hints:
- level: 1
  en: The first input can be sent to any of the 5 outputs.
- level: 2
  en: Each later input cannot reuse an output that is already taken.
- level: 3
  en: Multiply the number of choices available at each input.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
