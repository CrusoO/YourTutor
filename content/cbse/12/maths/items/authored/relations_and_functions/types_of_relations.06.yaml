difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Let R be the relation on the set {1, 2, 3, ..., 10} given by a R b if and only if a and b leave the same remainder when divided by 4. How many ordered pairs does R contain?
hints:
- level: 1
  en: Group the numbers in the set by their remainder on division by 4.
- level: 2
  en: Count how many numbers fall into each group.
- level: 3
  en: For a group of size n, the number of ordered pairs inside it is n squared.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '26'
  accept: []
solution_steps:
- en: The classes by remainder are {1,5,9}, {2,6,10}, {3,7} and {4,8}, of sizes 3, 3, 2 and 2.
- en: Each class of size n gives n squared ordered pairs, and 9 plus 9 plus 4 plus 4 is 26.
- en: Answer = 26
tier: C
