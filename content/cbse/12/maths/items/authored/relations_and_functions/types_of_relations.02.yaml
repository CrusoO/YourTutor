id: A.12.maths.relations_and_functions.types_of_relations.02
skill_ids:
- SK.A.12.maths.types_of_relations
difficulty: 0.2
pool: practice
role: procedure
stem:
  en: How many distinct relations can be defined from a set with 3 elements to itself?
hints:
- level: 1
  en: Count the ordered pairs that can be formed from the set.
- level: 2
  en: Each ordered pair is either included in the relation or left out of it.
- level: 3
  en: Count the independent yes or no choices, one for each pair, and think about how those choices combine.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '512'
  accept: []
solution_steps:
- en: A relation is any subset of the 9 ordered pairs that can be formed from the set, so there are 2 raised to the power 9 subsets.
- en: Answer = 512
tier: C
