id: A.12.maths.differential_equations.homogeneous_de.01
skill_ids:
- SK.A.12.maths.homogeneous_de
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which substitution is used to solve a homogeneous differential equation of the form dy/dx = F(y/x)?
hints:
- level: 1
  en: Think about the ratio y over x appearing in the equation.
- level: 2
  en: Choose a substitution that makes that ratio a single new variable.
- level: 3
  en: Check that your choice leads to a separable equation.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: y = x^2
- id: b
  en: y = vx
- id: c
  en: y = v + x
- id: d
  en: v = x + y
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.19B8F41EB230
  when_answer_equals:
  - c
- id: MC.A.EDE6846FA96F
  when_answer_equals:
  - d
- id: MC.A.D6FB42895848
  when_answer_equals:
  - a
solution_steps:
- en: Putting y = vx turns the ratio y/x into the new variable v, which makes the equation separable in v and x.
- en: The correct option is b.
tier: C
