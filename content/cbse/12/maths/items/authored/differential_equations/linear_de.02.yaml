stem:
  en: Solve dy/dx + 2y = 0 with y(0) = 3. Find y(1), rounded to 3 decimal places.
hints:
- level: 1
  en: Identify the integrating factor for the coefficient 2.
- level: 2
  en: Multiply the equation by it and recognise the left side as a derivative.
- level: 3
  en: Use y(0) to find the constant, then evaluate at x equal to 1.
