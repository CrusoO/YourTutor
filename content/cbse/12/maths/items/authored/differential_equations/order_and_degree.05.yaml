stem:
  en: What are the order and degree of d^2y/dx^2 + sin(dy/dx) = 0?
hints:
- level: 1
  en: Find the highest order derivative that occurs in the equation.
- level: 2
  en: Ask whether the equation is a polynomial in the derivatives.
- level: 3
  en: Consider whether a degree can be read off when a trigonometric function of a derivative appears.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Order 2, degree not defined
- id: b
  en: Order 2, degree 2
- id: c
  en: Order 1, degree 1
- id: d
  en: Order 2, degree 1
answer:
  sympy: a
  accept: []
