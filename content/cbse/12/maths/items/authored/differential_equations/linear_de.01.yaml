stem:
  en: What is the integrating factor of dy/dx + y = x?
hints:
- level: 1
  en: Write the equation in the standard form dy/dx + P y = Q.
- level: 2
  en: The integrating factor is e to the power of the integral of P.
- level: 3
  en: Find the integral of the coefficient of y.
