stem:
  en: What is the degree of d^2y/dx^2 = square root of (1 + (dy/dx)^2)?
hints:
- level: 1
  en: Rewrite the equation so that no radical sign remains.
- level: 2
  en: Look at the highest order derivative and the power it carries.
- level: 3
  en: Square both sides carefully before reading the degree.
