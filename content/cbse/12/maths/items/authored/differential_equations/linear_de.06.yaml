- id: MC.A.706E0303BC03
  when_answer_equals:
  - d
solution_steps:
- en: Dividing by x gives dy/dx + 2y/x = x^2, with integrating factor x^2.
- en: Then d(x^2 y)/dx = x^4, so x^2 y = x^5/5 + C, which gives y = x^3/5 + C/x^2.
- en: The correct option is b.
tier: C
