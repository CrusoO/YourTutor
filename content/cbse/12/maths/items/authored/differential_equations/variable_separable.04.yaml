- id: MC.A.82D0310EF60C
  when_answer_equals:
  - d
solution_steps:
- en: Separating gives dy/(1 + y^2) = dx, so arctan y = x + C, and taking the tangent of both sides gives y = tan(x + C).
- en: The correct option is b.
tier: C
