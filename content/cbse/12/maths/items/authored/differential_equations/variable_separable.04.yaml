difficulty: 0.6
pool: practice
role: explain
stem:
  en: What is the general solution of dy/dx = 1 + y^2?
hints:
- level: 1
  en: Separate the variables first.
- level: 2
  en: Recall the integral of one over one plus a square.
- level: 3
  en: Solve for y at the end using the inverse of that function.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: y = sec(x + C)
- id: b
  en: y = tan(x + C)
- id: c
  en: y = x + y^2 + C
- id: d
  en: y = arctan(x) + C
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.31143301B56C
  when_answer_equals:
  - a
- id: MC.A.E3E76F3A22FC
  when_answer_equals:
