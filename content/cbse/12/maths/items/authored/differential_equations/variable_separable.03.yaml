stem:
  en: Solve dy/dx = x y with y(0) = 2. Find y(2), rounded to 3 decimal places.
hints:
- level: 1
  en: Separate the variables with y on one side and x on the other.
- level: 2
  en: Integrate the function of x on the right side.
- level: 3
  en: Apply the initial condition, then evaluate at x equal to 2.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
