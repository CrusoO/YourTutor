type: numeric
answer:
  sympy: '14.778'
  accept: []
solution_steps:
- en: Separating gives dy/y = x dx, so y = 2 e^(x^2/2).
- en: At x = 2 this gives 2e^2, about 14.778.
- en: Answer = 14.778
tier: C
