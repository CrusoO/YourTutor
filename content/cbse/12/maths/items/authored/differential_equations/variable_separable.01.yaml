id: A.12.maths.differential_equations.variable_separable.01
skill_ids:
- SK.A.12.maths.variable_separable
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is the general solution of dy/dx = x?
hints:
- level: 1
  en: Separate the y terms and the x terms on opposite sides.
- level: 2
  en: Integrate each side with respect to its own variable.
- level: 3
  en: Add the constant of integration once at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: y = 2x^2 + C
- id: b
  en: y = x^2 + C
- id: c
  en: y = x + C
- id: d
  en: y = x^2/2 + C
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.04BDEE9E3782
  when_answer_equals:
  - c
- id: MC.A.5C672519A8EC
  when_answer_equals:
  - b
- id: MC.A.DF2144D8ABF2
  when_answer_equals:
  - a
solution_steps:
- en: Separating gives dy = x dx, and integrating both sides gives y = x^2/2 plus a constant.
- en: The correct option is d.
tier: C
