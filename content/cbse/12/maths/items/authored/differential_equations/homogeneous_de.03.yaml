stem:
  en: Solve dy/dx = (x + y)/x with y(1) = 2. Find y(e), rounded to 3 decimal places.
hints:
- level: 1
  en: Put y = vx and differentiate using the product rule.
- level: 2
  en: Simplify until the terms in v cancel.
- level: 3
  en: Integrate in terms of v and apply the initial condition before evaluating.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '8.155'
  accept: []
solution_steps:
- en: With y = vx the equation becomes x dv/dx = 1, so v = ln x + C.
- en: From y(1) = 2 we get C = 2, so y = x(ln x + 2) and at x = e the value is 3e, about 8.155.
- en: Answer = 8.155
tier: C
