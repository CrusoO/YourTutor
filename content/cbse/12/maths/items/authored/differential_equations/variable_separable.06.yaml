stem:
  en: What is the general solution of dy/dx = e^(x + y)?
hints:
- level: 1
  en: Write e^(x + y) as a product of two exponentials.
- level: 2
  en: Separate the terms involving y from those involving x.
- level: 3
  en: Integrate both sides and combine the constants.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: e^(x + y) = C
- id: b
  en: e^(-y) + e^x = C
- id: c
  en: y = ln x + C
- id: d
  en: e^y + e^x = C
answer:
  sympy: b
  accept: []
