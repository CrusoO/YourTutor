solution_steps:
- en: Writing e^(x + y) as e^x times e^y gives e^(-y) dy = e^x dx, and integrating both sides gives -e^(-y) = e^x + constant, which can be written as e^(-y) + e^x = C.
- en: The correct option is b.
tier: C
