difficulty: 0.9
pool: practice
role: transfer
stem:
  en: What is the general solution of dy/dx = y/x + tan(y/x)?
hints:
- level: 1
  en: Substitute y = vx and cancel the common term.
- level: 2
  en: Separate v and x in the resulting equation.
- level: 3
  en: Integrate both sides and rewrite the logarithm as an exponential.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: sin(y/x) = Cx
- id: b
  en: sin(y/x) = C/x
- id: c
  en: y = Cx tan(y/x)
- id: d
  en: cos(y/x) = Cx
answer:
  sympy: a
  accept: []
misconception_rules:
