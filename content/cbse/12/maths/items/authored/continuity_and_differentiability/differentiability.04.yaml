stem:
  en: At which points is f(x) = |x - 2| + x^2 not differentiable?
hints:
- level: 1
  en: Identify the point where the absolute value expression changes its formula.
- level: 2
  en: Look at the one-sided slopes at that point.
- level: 3
  en: The polynomial part is smooth everywhere, so focus on the other term.
