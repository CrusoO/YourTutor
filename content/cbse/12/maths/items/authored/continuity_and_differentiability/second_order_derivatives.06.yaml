role: transfer
stem:
  en: If y = sin^-1(x) for x between minus 1 and 1, which expression gives d2y/dx2?
hints:
- level: 1
  en: Write the first derivative of sin^-1 x as a power of 1 minus x squared.
- level: 2
  en: Apply the chain rule to that power.
- level: 3
  en: Simplify the expression and check the sign.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: x/(1 - x^2)^(3/2)
- id: b
  en: -x/(1 - x^2)^(3/2)
- id: c
  en: 1/(1 - x^2)^(3/2)
- id: d
  en: x/(1 - x^2)^(1/2)
answer:
  sympy: a
  accept: []
