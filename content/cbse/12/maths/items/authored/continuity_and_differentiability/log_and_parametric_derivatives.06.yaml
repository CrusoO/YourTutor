difficulty: 0.9
pool: practice
role: transfer
stem:
  en: For x = a cos t and y = b sin t, which expression gives d2y/dx2?
hints:
- level: 1
  en: Find dy/dx as a function of t first.
- level: 2
  en: Differentiate that expression with respect to t.
- level: 3
  en: Divide by dx/dt, keeping track of its sign.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: -b/(a sin^2 t)
- id: b
  en: b/(a^2 sin^3 t)
- id: c
  en: -b cos t/(a^2 sin^3 t)
- id: d
  en: -b/(a^2 sin^3 t)
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.5BABBCA6BD31
  when_answer_equals:
  - b
- id: MC.A.71209B7C2E10
  when_answer_equals:
