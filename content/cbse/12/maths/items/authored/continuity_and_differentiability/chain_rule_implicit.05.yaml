stem:
  en: A curve is given parametrically by x = t^2 and y = t^3. Find dy/dx at t = 2.
hints:
- level: 1
  en: Compute the derivative of each variable with respect to t.
- level: 2
  en: Divide the derivative of y by the derivative of x.
- level: 3
  en: Substitute the given value of t into the quotient.
prediction_prompt:
