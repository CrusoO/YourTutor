stem:
  en: If x = 2t and y = t^2, what is dy/dx?
hints:
- level: 1
  en: Differentiate each variable separately with respect to the parameter.
- level: 2
  en: Divide the derivative of y by the derivative of x.
- level: 3
  en: Simplify the quotient and leave the answer in terms of t.
prediction_prompt:
