id: A.12.maths.continuity_and_differentiability.chain_rule_implicit.06
skill_ids:
- SK.A.12.maths.chain_rule_implicit
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: For y = (sin x)^x with sin x greater than 0, which expression gives dy/dx?
hints:
- level: 1
  en: Take the natural logarithm of both sides before differentiating.
- level: 2
  en: Use the product rule on the right-hand side of the logarithmic equation.
- level: 3
  en: Recall the derivative of the logarithm of sin x.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: (sin x)^x times ln(sin x)
- id: b
  en: (sin x)^x times (ln(sin x) + cos x over x)
- id: c
  en: (sin x)^x times (ln(sin x) + x cot x)
- id: d
  en: x times (sin x)^(x - 1) times cos x
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.485D7A703F9F
  when_answer_equals:
  - d
- id: MC.A.616E1E4AC928
  when_answer_equals:
  - a
- id: MC.A.843C4C47B4DD
  when_answer_equals:
  - b
solution_steps:
- en: Taking logarithms gives ln y = x ln(sin x), and differentiating with the product rule gives ln(sin x) + x cot x multiplied by y.
- en: The correct option is c.
tier: C
