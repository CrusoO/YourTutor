answer:
  sympy: '2'
  accept: []
solution_steps:
- en: dy/dx equals minus e^(-2t), which is minus 1 over x squared.
- en: Differentiating with respect to x gives 2 over x cubed, which is 2 at x equal to 1, the point t equal to 0.
- en: Answer = 2
tier: C
