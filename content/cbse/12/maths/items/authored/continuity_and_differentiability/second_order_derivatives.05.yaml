stem:
  en: Let x = e^t and y = e^(-t). Find d2y/dx2 at t = 0.
hints:
- level: 1
  en: Compute dy/dx and rewrite it in terms of x.
- level: 2
  en: Differentiate that expression with respect to x.
- level: 3
  en: Substitute the point at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
