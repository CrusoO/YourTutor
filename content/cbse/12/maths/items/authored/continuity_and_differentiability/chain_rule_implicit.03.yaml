stem:
  en: The point (3, 4) lies on the curve x^2 + y^2 = 25. Find dy/dx at this point.
hints:
- level: 1
  en: Differentiate both sides of the equation with respect to x.
- level: 2
  en: Remember that y depends on x, so its derivative carries a dy/dx factor.
- level: 3
  en: Solve for dy/dx and substitute the coordinates of the point.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
