answer:
  sympy: '-0.75'
  accept: []
solution_steps:
- en: Differentiating implicitly gives 2x + 2y dy/dx = 0, so dy/dx equals minus x over y, which at (3, 4) is minus 3 over 4.
- en: Answer = -0.75
