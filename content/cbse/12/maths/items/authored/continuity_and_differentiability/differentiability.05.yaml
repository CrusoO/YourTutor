id: A.12.maths.continuity_and_differentiability.differentiability.05
skill_ids:
- SK.A.12.maths.differentiability
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Let f(x) = cube root of x. Which statement about f at x = 0 is correct?
hints:
- level: 1
  en: Write the difference quotient at 0 for this function.
- level: 2
  en: Evaluate the limit of that quotient as h approaches zero.
- level: 3
  en: Decide whether that limit is a finite number.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Differentiable at 0 with derivative 1/3
- id: b
  en: Not continuous at 0
- id: c
  en: Differentiable at 0 with derivative 0
- id: d
  en: Not differentiable at 0 because the slope tends to infinity
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.523F80C13E0F
  when_answer_equals:
  - a
- id: MC.A.2F99BE38390B
  when_answer_equals:
  - c
- id: MC.A.352A098D298D
  when_answer_equals:
  - b
solution_steps:
- en: The difference quotient at 0 is h to the power 1/3 divided by h, which grows without bound as h approaches 0, so there is no finite derivative at 0.
- en: The function is continuous there.
- en: The correct option is d.
tier: C
