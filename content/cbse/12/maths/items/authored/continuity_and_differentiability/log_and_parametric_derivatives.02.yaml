stem:
  en: Using logarithmic differentiation on y = x^3, find dy/dx at x = 1.
hints:
- level: 1
  en: Take the natural logarithm of both sides.
- level: 2
  en: Use the rule that brings the exponent in front of the logarithm.
- level: 3
  en: Evaluate the result at x equal to 1.
