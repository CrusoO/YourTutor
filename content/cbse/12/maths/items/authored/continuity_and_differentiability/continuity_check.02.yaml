id: A.12.maths.continuity_and_differentiability.continuity_check.02
skill_ids:
- SK.A.12.maths.continuity_check
difficulty: 0.2
pool: practice
role: procedure
stem:
  en: Let f(x) = (x^2 - 4)/(x - 2) for x not equal to 2, and f(2) = k. Find k so that f is continuous at 2.
hints:
- level: 1
  en: Factor the numerator and cancel the common factor where it is allowed.
- level: 2
  en: Find the limit of the simplified expression as x approaches 2.
- level: 3
  en: Set k equal to that limit.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: The expression simplifies to x + 2 away from 2, whose limit at 2 is 4, so k must be 4.
- en: Answer = 4
tier: C
