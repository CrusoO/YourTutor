  author: model-draft
type: numeric
answer:
  sympy: '0.75'
  accept: []
solution_steps:
- en: dy/dx equals 3t over 2, whose derivative with respect to t is 3/2, and dividing by dx/dt = 2t gives 3 over 4t, which is 0.75 at t equal to 1.
- en: Answer = 0.75
tier: C
