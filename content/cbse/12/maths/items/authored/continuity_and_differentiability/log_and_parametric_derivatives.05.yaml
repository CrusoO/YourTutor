stem:
  en: A curve is given by x = t^2 and y = t^3 + 1. Find the second derivative d2y/dx2 at t = 1.
hints:
- level: 1
  en: First find dy/dx as an expression in t.
- level: 2
  en: Differentiate that expression with respect to t.
- level: 3
  en: Divide by dx/dt, then substitute the given value of t.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
