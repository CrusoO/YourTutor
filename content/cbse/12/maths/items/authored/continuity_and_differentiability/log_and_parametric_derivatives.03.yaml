stem:
  en: A curve is given by x = cos t and y = sin t. Find dy/dx at t = pi/4.
hints:
- level: 1
  en: Differentiate x and y with respect to t.
- level: 2
  en: Form the ratio of the two derivatives.
- level: 3
  en: Evaluate the trigonometric ratio at the given angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
