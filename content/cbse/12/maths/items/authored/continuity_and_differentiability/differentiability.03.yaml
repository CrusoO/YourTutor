stem:
  en: Let f(x) = x^2 for x at most 1, and f(x) = ax + b for x greater than 1. If f is differentiable at x = 1, find b.
hints:
- level: 1
  en: Write the continuity condition at x equal to 1.
- level: 2
  en: Write the matching condition on the derivatives from the two sides.
- level: 3
  en: Solve the two equations for a and b.
