id: A.12.maths.continuity_and_differentiability.differentiability.02
skill_ids:
- SK.A.12.maths.differentiability
difficulty: 0.2
pool: practice
role: procedure
stem:
  en: Let f(x) = x^2 for x at most 1, and f(x) = 2x + c for x greater than 1. Find c so that f is continuous at x = 1.
hints:
- level: 1
  en: Compare the two formulas at the point where they meet.
- level: 2
  en: Set the value from the left equal to the value from the right at x equal to 1.
- level: 3
  en: Solve the resulting equation for the constant.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-1'
  accept: []
solution_steps:
- en: At x equal to 1 the first rule gives 1 and the second gives 2 plus c, so continuity requires 1 equal to 2 plus c, giving c equal to minus 1.
- en: Answer = -1
tier: C
