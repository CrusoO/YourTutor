id: A.12.maths.integrals.substitution_method.02
skill_ids:
- SK.A.12.maths.substitution_method
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is the integral of cos x divided by sin x with respect to x?
hints:
- level: 1
  en: Let u be the denominator.
- level: 2
  en: Compute du and match it with the numerator.
- level: 3
  en: Integrate the simple function of u that results.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 1/sin^2 x + C
- id: b
  en: ln|sin x| + C
- id: c
  en: ln|cos x| + C
- id: d
  en: -ln|sin x| + C
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.63B7C6B5416B
  when_answer_equals:
  - c
- id: MC.A.7ECFC091AA6F
  when_answer_equals:
  - d
- id: MC.A.4EFF9029078F
  when_answer_equals:
  - a
solution_steps:
- en: Let u = sin x, so du = cos x dx, and the integral becomes the integral of du over u, which is ln|u|.
- en: The correct option is b.
tier: C
