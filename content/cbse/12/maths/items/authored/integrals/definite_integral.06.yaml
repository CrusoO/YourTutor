difficulty: 0.9
pool: practice
role: transfer
stem:
  en: What is the value of the definite integral of cos x divided by (1 + sin^2 x) from 0 to pi/2?
hints:
- level: 1
  en: Substitute u equal to sin x.
- level: 2
  en: Change the limits of integration to match the new variable.
- level: 3
  en: Recall the antiderivative of 1 over (1 + u squared).
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: ln 2
- id: b
  en: pi/2
- id: c
  en: pi/4
- id: d
  en: 1/2
answer:
  sympy: c
  accept: []
misconception_rules:
