stem:
  en: What is the integral of 1 divided by (x^3 - x) with respect to x?
hints:
- level: 1
  en: Factor the denominator completely first.
- level: 2
  en: Write the decomposition with a constant over each linear factor.
- level: 3
  en: Find each constant by substituting the corresponding root.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: ln|x| - (1/2) ln|x^2 - 1| + C
- id: b
  en: -ln|x| + ln|x^2 - 1| + C
- id: c
  en: -ln|x| + (1/2) ln|x^2 - 1| + C
- id: d
  en: -1/x^2 + C
answer:
  sympy: c
  accept: []
misconception_rules:
