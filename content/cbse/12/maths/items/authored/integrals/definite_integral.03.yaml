stem:
  en: Evaluate the definite integral of sin x with respect to x from 0 to pi.
hints:
- level: 1
  en: Find an antiderivative of sine.
- level: 2
  en: Evaluate the antiderivative at both limits.
- level: 3
  en: Subtract the lower limit value from the upper limit value.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The antiderivative is minus cos x, which is 1 at pi and minus 1 at 0, so the value is 1 minus (-1), which equals 2.
- en: Answer = 2
