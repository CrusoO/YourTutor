stem:
  en: Find the coefficient that multiplies e^(2x) in an antiderivative of 3e^(2x).
hints:
- level: 1
  en: Recall the antiderivative of an exponential whose exponent has a coefficient.
- level: 2
  en: Account for the coefficient inside the exponent.
- level: 3
  en: Keep the constant factor 3 in mind throughout.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
