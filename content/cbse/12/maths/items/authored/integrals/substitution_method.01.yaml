difficulty: 0.2
pool: practice
role: procedure
stem:
  en: Evaluate the definite integral of 2x(x^2 + 1)^3 with respect to x from 0 to 1.
hints:
- level: 1
  en: Let u equal the inner expression.
- level: 2
  en: Find du and compare it with the remaining factor.
- level: 3
  en: Change the limits of integration to the new variable.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3.75'
  accept: []
solution_steps:
- en: Let u = x^2 + 1, so du = 2x dx and the limits become 1 and 2.
- en: The integral of u cubed from 1 to 2 is (16 minus 1) divided by 4, which is 3.75.
- en: Answer = 3.75
tier: C
