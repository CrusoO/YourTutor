stem:
  en: What is the integral of e^(sin x) times cos x with respect to x?
hints:
- level: 1
  en: Identify a function and its derivative appearing together in the integrand.
- level: 2
  en: Let u equal the exponent.
- level: 3
  en: Check the answer by differentiating it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: e^(sin x) cos x + C
- id: b
  en: -e^(sin x) + C
- id: c
  en: sin(e^x) + C
- id: d
  en: e^(sin x) + C
answer:
  sympy: d
  accept: []
misconception_rules:
