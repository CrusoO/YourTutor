stem:
  en: F(x) is an antiderivative of 6x^2 - 2x with F(1) = 5. Find F(2).
hints:
- level: 1
  en: Integrate the function to get a general antiderivative with a constant.
- level: 2
  en: Use the given value at x equal to 1 to find the constant.
- level: 3
  en: Evaluate the complete antiderivative at x equal to 2.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '16'
  accept: []
solution_steps:
- en: The general antiderivative is 2x^3 - x^2 + C.
- en: Using F(1) = 5 gives C = 4, so F(2) = 16 - 4 + 4 = 16.
- en: Answer = 16
tier: C
