  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.333'
  accept: []
solution_steps:
- en: Multiplying by (x - 1) and setting x = 1 gives A = (3 + 1)/(1 + 2) = 4/3, which is about 1.333.
- en: Answer = 1.333
tier: C
