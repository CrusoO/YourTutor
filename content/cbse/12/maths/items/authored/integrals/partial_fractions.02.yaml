stem:
  en: In the partial fraction decomposition of (3x + 1)/((x - 1)(x + 2)) = A/(x - 1) + B/(x + 2), find A, rounded to 3 decimal places.
hints:
- level: 1
  en: Multiply both sides by the factor x minus 1.
- level: 2
  en: Substitute x equal to 1 into the cleared equation.
- level: 3
  en: Divide by the other factor evaluated at that root.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
