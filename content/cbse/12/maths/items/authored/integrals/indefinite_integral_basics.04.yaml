- id: MC.A.34CB0A761144
  when_answer_equals:
  - a
solution_steps:
- en: The antiderivative of 1/x is the natural logarithm of the absolute value of x, because the power rule does not apply at exponent minus one.
- en: The correct option is b.
tier: C
