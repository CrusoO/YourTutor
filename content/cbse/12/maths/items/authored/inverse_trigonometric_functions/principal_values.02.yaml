stem:
  en: Find the principal value of tan^-1(1) in degrees.
hints:
- level: 1
  en: Recall which angle has tangent equal to one.
- level: 2
  en: The principal range of tan^-1 is an open interval around zero.
- level: 3
  en: Convert the radian answer to degrees if your working is in radians.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '45'
  accept: []
solution_steps:
- en: The principal range of tan^-1 is the open interval from minus pi over 2 to pi over 2, and the angle there with tangent equal to one is pi over 4, which is 45 degrees.
- en: The unit of the answer is degrees.
- en: Answer = 45
tier: C
