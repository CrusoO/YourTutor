difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which expression equals sin^-1(x) + cos^-1(x) for every x in the interval from minus 1 to 1?
hints:
- level: 1
  en: Set the sine inverse equal to an angle and study the matching cosine inverse.
- level: 2
  en: Compare the principal ranges of the two inverse functions.
- level: 3
  en: Test the identity with a simple value such as x equals 0.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
