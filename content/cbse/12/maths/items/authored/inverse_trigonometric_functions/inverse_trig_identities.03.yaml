role: explain
stem:
  en: Which expression equals tan^-1(1/2) + tan^-1(1/3) using principal values?
hints:
- level: 1
  en: Write the sum of two inverse tangents using the addition formula for tangent.
- level: 2
  en: Compute the sum and the product of the two fractions separately.
- level: 3
  en: Identify the angle whose tangent equals the resulting ratio.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
