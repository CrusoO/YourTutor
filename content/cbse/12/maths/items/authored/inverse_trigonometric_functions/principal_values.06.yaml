answer:
  sympy: '-0.524'
  accept: []
solution_steps:
- en: cosec^-1 of a value is the sine^-1 of its reciprocal, so the answer is sin^-1(-1/2), which is minus pi over 6, about minus 0.524 radians.
- en: The unit of the answer is radians.
- en: Answer = -0.524
