stem:
  en: Find the principal value of cosec^-1(-2) in radians, rounded to 3 significant figures.
hints:
- level: 1
  en: Relate cosec^-1 of a value to sin^-1 of its reciprocal.
- level: 2
  en: Find the principal angle whose sine equals the reciprocal of the input.
- level: 3
  en: Check that the sign of your answer matches the sign of the input.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
