difficulty: 0.6
pool: practice
role: explain
stem:
  en: What is the value of cos^-1(cos(7pi/6))?
hints:
- level: 1
  en: Recall the interval from 0 to pi that the principal values of cos^-1 must lie in.
- level: 2
  en: Find an angle in that interval with the same cosine as 7pi/6.
- level: 3
  en: Use the symmetry of cosine about the horizontal axis to locate it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
