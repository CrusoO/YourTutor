stem:
  en: Find the principal value of sin^-1(sin(3pi/4)) in radians, rounded to 3 significant figures.
hints:
- level: 1
  en: Recall the principal range of sin^-1.
- level: 2
  en: Locate the angle 3pi/4 relative to that range.
- level: 3
  en: Find an angle inside the range that has the same sine value.
