solution_steps:
- en: The angle 3pi/4 is outside the principal range of sin^-1, but sin(3pi/4) equals sin(pi/4), and pi/4 lies in the range, so the answer is pi/4, about 0.785 radians.
- en: The unit of the answer is radians.
