stem:
  en: Find the principal value of sin^-1(-sqrt(3)/2) in radians, rounded to 3 significant figures.
hints:
- level: 1
  en: Find the angle in the principal range whose sine is the positive version of this value.
- level: 2
  en: Keep track of the sign of the input when you pick the quadrant.
- level: 3
  en: Give the final decimal to 3 significant figures.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
