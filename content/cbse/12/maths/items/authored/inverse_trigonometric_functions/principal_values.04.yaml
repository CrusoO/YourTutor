answer:
  sympy: '-1.047'
  accept: []
solution_steps:
- en: The principal range of sin^-1 is from minus pi over 2 to pi over 2, and the angle there with sine negative square root of three over two is minus pi over 3, which is about minus 1.047 radians.
- en: The unit of the answer is radians.
- en: Answer = -1.047
