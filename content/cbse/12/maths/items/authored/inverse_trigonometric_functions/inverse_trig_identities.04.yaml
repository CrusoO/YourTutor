stem:
  en: Let theta = tan^-1(3/4). Find sin(2 theta) as a decimal.
hints:
- level: 1
  en: Use the double angle identity for sine written in terms of tangent.
- level: 2
  en: Build a right triangle with the tangent ratio and read off the sine and cosine of theta.
- level: 3
  en: Compute the sine and cosine of theta, then double their product.
