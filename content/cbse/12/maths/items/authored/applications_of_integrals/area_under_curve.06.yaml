solution_steps:
- en: The integral of 1/x from 1 to e is ln e minus ln 1, which is 1 minus 0, giving 1.
- en: The correct option is c.
tier: C
diagram_note: Hyperbola y = 1/x between x = 1 and x = e, with the region between the curve and the horizontal axis shaded.
