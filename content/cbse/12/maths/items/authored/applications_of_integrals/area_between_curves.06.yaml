solution_steps:
- en: The curves meet at x = -1, 0 and 1.
- en: On [0, 1] the line is above the cubic, and by symmetry the region on [-1, 0] has the same area, so the total is 2 times the integral of (x - x^3) from 0 to 1, which is 1/2.
- en: The correct option is a.
