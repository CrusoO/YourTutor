difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is the area of the region bounded by y = 4 - x^2 and the x-axis?
hints:
- level: 1
  en: Find where the curve meets the x-axis to set the limits.
- level: 2
  en: Notice whether the region is symmetric about the vertical axis.
- level: 3
  en: Use twice the area on one side if that simplifies the work.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
