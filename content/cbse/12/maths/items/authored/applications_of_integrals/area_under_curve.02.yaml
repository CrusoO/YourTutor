solution_steps:
- en: The curve meets the axis at x = -2 and x = 2, and the region is symmetric, so the area is the integral of 4 - x^2 from -2 to 2, which is 32/3.
- en: The correct option is d.
tier: C
diagram_note: Downward opening parabola y = 4 - x^2 drawn on axes, with the region between the curve and the horizontal axis from minus 2 to 2 shaded.
