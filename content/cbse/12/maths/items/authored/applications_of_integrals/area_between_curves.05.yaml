answer:
  sympy: '0.167'
  accept: []
solution_steps:
- en: The curves meet at x = 1 and x = 2, and the line is above the parabola between them.
- en: The area is the integral of (3x - 2 - x^2) from 1 to 2, which is 1/6, about 0.167.
- en: Answer = 0.167
