stem:
  en: Find the area between the parabola y = x^2 and the line y = 3x - 2, rounded to 3 decimal places.
hints:
- level: 1
  en: Find the intersection points of the two curves.
- level: 2
  en: Determine which function is larger between them.
- level: 3
  en: Integrate the larger function minus the smaller one over that interval.
prediction_prompt:
