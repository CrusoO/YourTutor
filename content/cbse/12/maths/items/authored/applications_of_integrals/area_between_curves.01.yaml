type: numeric
answer:
  sympy: '0.167'
  accept: []
solution_steps:
- en: On [0, 1] the line lies above the parabola, so the area is the integral of x minus x^2, which is 1/2 minus 1/3, equal to 1/6, about 0.167.
- en: Answer = 0.167
