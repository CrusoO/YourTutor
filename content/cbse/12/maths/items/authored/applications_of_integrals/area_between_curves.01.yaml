stem:
  en: Find the area between the curves y = x and y = x^2 for x from 0 to 1, rounded to 3 decimal places.
hints:
- level: 1
  en: Decide which curve is higher on the interval.
- level: 2
  en: Subtract the lower function from the upper one.
- level: 3
  en: Integrate that difference between the two limits.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
