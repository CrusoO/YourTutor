stem:
  en: What is the area bounded by y = x^3, the x-axis and the line x = 2?
hints:
- level: 1
  en: Set up the integral with the correct lower and upper limits.
- level: 2
  en: Find an antiderivative of x cubed.
- level: 3
  en: Evaluate at the upper limit and subtract the value at the lower limit.
prediction_prompt:
