id: A.12.maths.applications_of_derivatives.rate_of_change.05
skill_ids:
- SK.A.12.maths.rate_of_change
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A ladder of length 5 m leans against a vertical wall. Its foot slides away from the wall at 2 m/s. When the foot is 3 m from the wall, find the rate of change of the height of the top of the ladder in m/s.
hints:
- level: 1
  en: Write the relation between the foot distance, the height and the ladder length.
- level: 2
  en: Differentiate that relation with respect to time.
- level: 3
  en: Substitute the height from the relation and then the given rates.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-1.5'
  accept: []
solution_steps:
- en: With x^2 + y^2 = 25, dy/dt = minus (x/y) dx/dt.
- en: At x = 3 and y = 4 with dx/dt = 2, this gives minus 1.5, so the top slides down at 1.5 m/s.
- en: Answer = -1.5
tier: C
diagram_note: A ladder leaning against a vertical wall, with its foot on the ground moving away from the wall and its top sliding down the wall, the three lengths labelled.
