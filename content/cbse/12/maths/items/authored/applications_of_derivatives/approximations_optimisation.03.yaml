id: A.12.maths.applications_of_derivatives.approximations_optimisation.03
skill_ids:
- SK.A.12.maths.approximations_optimisation
difficulty: 0.6
pool: practice
role: apply
stem:
  en: An open-top box is made from a 12 by 12 cm square sheet by cutting equal squares of side x from each corner and folding up the sides. Find the largest possible volume in cubic cm.
hints:
- level: 1
  en: Write the volume as a function of the cut size x.
- level: 2
  en: Differentiate the volume and set the derivative equal to zero.
- level: 3
  en: Check the endpoints of the allowed range for x.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '128'
  accept: []
solution_steps:
- en: The volume is x(12 - 2x)^2, which is maximised at x = 2, giving 2 times 8 squared, which is 2 times 64, equal to 128.
- en: Answer = 128
tier: C
