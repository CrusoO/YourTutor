stem:
  en: Find the minimum value of f(x) = x + 4/x for x greater than 0.
hints:
- level: 1
  en: Differentiate the function and set the derivative equal to zero.
- level: 2
  en: Solve for x, keeping in mind that x must be positive.
- level: 3
  en: Evaluate the function at that point.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: f'(x) = 1 - 4/x^2 vanishes at x = 2, where f(2) = 2 + 2 = 4, and f is decreasing before and increasing after this point, so 4 is the minimum.
- en: Answer = 4
tier: C
diagram_note: Graph of x plus 4 over x for positive x, a curve with a single lowest point marked and two branches approaching the axes.
