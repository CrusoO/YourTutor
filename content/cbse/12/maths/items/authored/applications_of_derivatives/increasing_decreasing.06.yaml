stem:
  en: For f(x) = x^4 - 8x^2 + 1, how many separate intervals on the real line is f increasing?
hints:
- level: 1
  en: Find the critical points by setting the derivative equal to zero.
- level: 2
  en: Test the sign of the derivative between consecutive critical points.
- level: 3
  en: Count the intervals where the sign is positive.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: f'(x) = 4x(x^2 - 4) has roots at -2, 0 and 2, and the derivative is positive on (-2, 0) and on (2, infinity), giving two intervals of increase.
- en: Answer = 2
tier: C
