stem:
  en: Find the maximum value of f(x) = x^3 - 3x^2 + 1 on the closed interval from 0 to 3.
hints:
- level: 1
  en: Find the critical points that lie inside the interval.
- level: 2
  en: Compare the values at those points with the values at both endpoints.
- level: 3
  en: Substitute each candidate into the function.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1'
  accept: []
solution_steps:
- en: f'(x) = 3x(x - 2) gives the critical point x = 2 in the interval, with f(2) = -3, while f(0) = 1 and f(3) = 1, so the maximum is 1.
- en: Answer = 1
tier: C
diagram_note: Cubic curve drawn over the interval from 0 to 3, with a turning point inside the interval marked and both endpoints labelled.
