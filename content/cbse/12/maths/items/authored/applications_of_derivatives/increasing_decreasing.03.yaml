role: apply
stem:
  en: For f(x) = x^3 - 6x^2 + 9x, find the length of the interval on which f is decreasing.
hints:
- level: 1
  en: Find f' and factor it.
- level: 2
  en: Determine the sign of f' between its two roots.
- level: 3
  en: Measure the distance between the two endpoints of that interval.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: f'(x) = 3(x - 1)(x - 3), which is negative between 1 and 3, so f decreases on an interval of length 2.
- en: Answer = 2
tier: C
diagram_note: Cubic curve with two turning points marked on the horizontal axis, and the stretch between them shaded to show where the curve falls.
