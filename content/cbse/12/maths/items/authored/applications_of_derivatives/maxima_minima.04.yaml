difficulty: 0.6
pool: practice
role: explain
stem:
  en: Two positive numbers have a sum of 10. What is the largest possible value of their product?
hints:
- level: 1
  en: Write one number as x and express the other in terms of x.
- level: 2
  en: Form the product as a function of x.
- level: 3
  en: Find the maximum of that function using the derivative.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
