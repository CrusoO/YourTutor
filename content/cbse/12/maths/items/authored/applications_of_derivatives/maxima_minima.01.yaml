stem:
  en: Find the minimum value of f(x) = x^2 - 6x + 10 on the real numbers.
hints:
- level: 1
  en: Differentiate and find the stationary point.
- level: 2
  en: Check the sign of the second derivative at that point.
- level: 3
  en: Substitute the stationary point back into the function.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1'
  accept: []
solution_steps:
- en: The derivative 2x - 6 vanishes at x = 3, where f(3) = 9 - 18 + 10 = 1, and the second derivative is positive, so this is the minimum.
- en: Answer = 1
tier: C
diagram_note: Upward opening parabola drawn on axes, with its lowest point marked and labelled as the minimum.
