stem:
  en: Using the bag setup where the first bag is chosen with probability 0.5, gives red with probability 0.2 and the second gives red with probability 0.6, what is the probability that the first bag was chosen given that the ball is red?
hints:
- level: 1
  en: Use the total probability of red from the earlier part.
- level: 2
  en: Put the joint probability of the first bag and red over that total.
- level: 3
  en: Compare your answer with the prior probability of the first bag.
