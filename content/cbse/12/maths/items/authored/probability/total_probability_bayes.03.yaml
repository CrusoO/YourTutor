stem:
  en: Machine X makes 60 percent of the items and has a defect rate of 0.02. Machine Y makes the other 40 percent with a defect rate of 0.05. Find the overall probability that a randomly chosen item is defective.
hints:
- level: 1
  en: Weight each machine's defect rate by its share of production.
- level: 2
  en: Add the two weighted rates.
- level: 3
  en: Check that the shares of production add to one.
