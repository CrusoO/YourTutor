stem:
  en: A and B are independent with P(A) = 1/2 and P(B) = 1/3. What is P(A or B)?
hints:
- level: 1
  en: Use the addition rule for the union of two events.
- level: 2
  en: Find the intersection probability using independence.
- level: 3
  en: Subtract the overlap from the sum of the two probabilities.
