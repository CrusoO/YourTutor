stem:
  en: P(A) = 0.3 and P(B) = 0.4, and P(A given B) = 0.3. Which statement is correct?
hints:
- level: 1
  en: Compare P(A given B) with P(A) itself.
- level: 2
  en: If conditioning on the other event changes nothing, what does that say about the events?
- level: 3
  en: Check the product of the two probabilities against the joint probability.
