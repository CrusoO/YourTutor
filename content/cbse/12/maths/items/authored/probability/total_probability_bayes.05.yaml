stem:
  en: Three suppliers provide 50, 30 and 20 percent of parts, with defect rates 0.01, 0.02 and 0.05 respectively. Find the overall probability that a randomly chosen part is defective.
hints:
- level: 1
  en: Multiply each supplier share by its defect rate.
- level: 2
  en: Sum the three products.
- level: 3
  en: Keep track of the decimal places as you multiply.
