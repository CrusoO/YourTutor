stem:
  en: A discrete random variable has P(X = k) proportional to k for k = 1, 2 and 3. What is the constant of proportionality c in P(X = k) = c k?
hints:
- level: 1
  en: The probabilities must sum to 1.
- level: 2
  en: Add the values of k at the three points.
- level: 3
  en: Solve the resulting equation for the constant.
