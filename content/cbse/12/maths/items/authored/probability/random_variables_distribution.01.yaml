answer:
  sympy: '1.1'
  accept: []
solution_steps:
- en: The mean is 0 times 0.2 plus 1 times 0.5 plus 2 times 0.3, which equals 0 + 0.5 + 0.6 = 1.1.
- en: Answer = 1.1
