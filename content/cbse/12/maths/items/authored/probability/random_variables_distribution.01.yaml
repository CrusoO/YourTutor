stem:
  en: A random variable X takes the values 0, 1 and 2 with probabilities 0.2, 0.5 and 0.3. Find the mean of X.
hints:
- level: 1
  en: Multiply each value of X by its probability.
- level: 2
  en: Add the products together.
- level: 3
  en: Check that the probabilities add up to one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
