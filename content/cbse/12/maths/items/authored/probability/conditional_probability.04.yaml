stem:
  en: Two fair dice are rolled and the sum is known to be 8. What is the probability that at least one die shows a 6?
hints:
- level: 1
  en: List the outcomes whose sum is 8 first.
- level: 2
  en: Among those outcomes, count the ones containing at least one 6.
- level: 3
  en: Divide the second count by the first.
