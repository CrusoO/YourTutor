stem:
  en: A card is drawn at random from a standard 52-card deck and is known to be a heart. What is the probability that it is a queen?
hints:
- level: 1
  en: Count the hearts, which form the reduced sample space.
- level: 2
  en: Count the queens among those hearts.
- level: 3
  en: Divide the favourable count by the number of hearts.
