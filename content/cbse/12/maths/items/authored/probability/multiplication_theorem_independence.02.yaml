difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which expression is the multiplication theorem for two events A and B?
hints:
- level: 1
  en: Recall the multiplication theorem for two events.
- level: 2
  en: Start with the probability of A and multiply by the conditional probability of B.
- level: 3
  en: Check that the expression uses the joint probability on the left.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: P(A and B) = P(A) times P(B given A)
- id: b
  en: P(A and B) = P(A given B)
- id: c
  en: P(A and B) = P(A) + P(B)
- id: d
  en: P(A and B) = P(A) + P(B) - P(A or B)
answer:
  sympy: a
  accept: []
misconception_rules:
