stem:
  en: Using the three suppliers in which the third supplies 20 percent of parts and the overall defect probability is 0.021, what is the probability that a defective part came from the third supplier, rounded to 3 decimal places?
hints:
- level: 1
  en: Compute the joint probability of the third supplier and a defect.
- level: 2
  en: Divide by the overall defect probability found in the earlier part.
- level: 3
  en: Round the result to 3 decimal places.
