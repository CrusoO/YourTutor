  en: P(X=0)=-0.2, P(X=1)=0.6, P(X=2)=0.6
- id: b
  en: P(X=0)=0.1, P(X=1)=0.2, P(X=2)=0.3
- id: c
  en: P(X=0)=0.2, P(X=1)=0.3, P(X=2)=0.5
- id: d
