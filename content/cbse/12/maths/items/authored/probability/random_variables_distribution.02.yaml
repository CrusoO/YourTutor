stem:
  en: Which of the following is a valid probability distribution for a random variable X taking the values 0, 1 and 2?
hints:
- level: 1
  en: Each probability must lie between 0 and 1.
- level: 2
  en: The probabilities must add up to a fixed total.
- level: 3
  en: Check each option against both conditions.
