stem:
  en: X follows a binomial distribution with n = 3 and p = 0.5. Find P(X is at least 1), rounded to 3 decimal places.
hints:
- level: 1
  en: Consider the complement event of having at least one success.
- level: 2
  en: Find the probability of no successes at all.
- level: 3
  en: Subtract that probability from one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
