stem:
  en: Find the value of k for which the determinant of [[1, 2, 3], [4, 5, 6], [7, 8, k]] equals zero.
hints:
- level: 1
  en: Expand the determinant along the first row while keeping k as a symbol.
- level: 2
  en: Collect the terms that contain k together.
- level: 3
  en: Set the resulting linear expression equal to zero and solve.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
