  original: true
  author: model-draft
type: numeric
answer:
  sympy: '9'
  accept: []
solution_steps:
- en: Expanding gives 1 times (5k minus 48) minus 2 times (4k minus 42) plus 3 times (32 minus 35), which simplifies to 27 minus 3k, and this is zero when k is 9.
- en: Answer = 9
tier: C
