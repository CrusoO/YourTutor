id: A.12.maths.determinants.adjoint_inverse.01
skill_ids:
- SK.A.12.maths.adjoint_inverse
difficulty: 0.2
pool: practice
role: procedure
stem:
  en: Let A = [[2, 1], [5, 3]]. Find the entry in row 1, column 1 of the adjoint of A.
hints:
- level: 1
  en: Swap the two diagonal entries of the matrix.
- level: 2
  en: Change the signs of the off-diagonal entries.
- level: 3
  en: Read off the entry in the top left of the result.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: For a 2 by 2 matrix the adjoint swaps the two diagonal entries and changes the sign of the off-diagonal entries, so the row 1, column 1 entry is the original row 2, column 2 entry, which is 3.
- en: Answer = 3
tier: C
