stem:
  en: A is a 3 by 3 matrix with determinant 3. What is the determinant of its adjoint?
hints:
- level: 1
  en: Recall the general formula linking the determinant of a matrix and of its adjoint.
- level: 2
  en: Check the power, which depends on the order of the matrix.
- level: 3
  en: Substitute the given determinant into that power.
