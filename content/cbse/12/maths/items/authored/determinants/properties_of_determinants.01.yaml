stem:
  en: If A is a 3 by 3 matrix with determinant 4, what is the determinant of 2A?
hints:
- level: 1
  en: Consider how many rows are multiplied when the whole matrix is scaled.
- level: 2
  en: Each row scaling multiplies the determinant by the same factor.
- level: 3
  en: Apply the power of the scalar that matches the number of rows.
