stem:
  en: Which value is the determinant of [[1, 2, 0], [0, 1, 2], [2, 0, 1]]?
hints:
- level: 1
  en: Expand the determinant along its first row.
- level: 2
  en: Each entry multiplies a signed minor obtained by deleting its row and column.
- level: 3
  en: Evaluate each 2 by 2 minor carefully before combining them.
prediction_prompt:
