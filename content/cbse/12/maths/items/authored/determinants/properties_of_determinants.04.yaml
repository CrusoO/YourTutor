id: A.12.maths.determinants.properties_of_determinants.04
skill_ids:
- SK.A.12.maths.properties_of_determinants
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A 2 by 2 matrix [[a, b], [c, d]] has determinant 7. If its two rows are interchanged, what is the determinant of the new matrix?
hints:
- level: 1
  en: Consider the effect of one interchange of rows on a determinant.
- level: 2
  en: Work out how the sign of the determinant changes.
- level: 3
  en: Keep the magnitude of the original value.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-7'
  accept: []
solution_steps:
- en: Interchanging two rows multiplies the determinant by minus 1, so the new determinant is minus 7.
- en: Answer = -7
tier: C
