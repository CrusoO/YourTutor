id: A.12.maths.determinants.adjoint_inverse.05
skill_ids:
- SK.A.12.maths.adjoint_inverse
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Let A = [[1, 2, 0], [0, 1, 3], [2, 0, 1]]. Find the entry in row 1, column 2 of the inverse of A, rounded to 3 decimal places.
hints:
- level: 1
  en: The inverse entry in row i, column j uses the cofactor in row j, column i.
- level: 2
  en: Find the minor by deleting row 2 and column 1 from the matrix.
- level: 3
  en: Attach the correct sign to that cofactor and divide by the determinant.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-0.154'
  accept: []
solution_steps:
- en: The determinant of A is 13.
- en: The row 1, column 2 entry of the inverse is the cofactor of the row 2, column 1 entry divided by 13, and that cofactor is minus 2, so the result is minus 2 over 13, about minus 0.154.
- en: Answer = -0.154
tier: C
