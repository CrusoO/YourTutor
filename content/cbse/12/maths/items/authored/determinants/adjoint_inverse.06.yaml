difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A is a 3 by 3 matrix with determinant 2. Which expression equals adj(adj A)?
hints:
- level: 1
  en: Apply the rule for the adjoint of an adjoint using the order of the matrix.
- level: 2
  en: Keep the scalar factor coming from the determinant.
- level: 3
  en: Compare the power of the determinant with the order of the matrix minus two.
