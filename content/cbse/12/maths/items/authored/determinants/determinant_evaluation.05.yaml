stem:
  en: Find the determinant of the matrix [[1, 1, 1], [1, 2, 3], [1, 4, 9]].
hints:
- level: 1
  en: Subtract the first row from the other two rows to create zeros.
- level: 2
  en: Expand along the first column after those row operations.
- level: 3
  en: Factor the remaining 2 by 2 determinant.
