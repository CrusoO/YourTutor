solution_steps:
- en: Subtracting the first row from the other two gives rows [0, 1, 2] and [0, 3, 8].
- en: Expanding along the first column gives the 2 by 2 determinant of those rows, which is 2 times 8 minus 2 times 3, equal to 2 times 2, so the value is 2.
- en: Answer = 2
