stem:
  en: A vector has components (1, square root of 3). Find the angle it makes with the positive x-axis, in degrees.
hints:
- level: 1
  en: Use the tangent of the angle as the ratio of the vertical component to the horizontal component.
- level: 2
  en: Recall the angle whose tangent equals the square root of 3.
- level: 3
  en: Give the answer in degrees.
prediction_prompt:
