stem:
  en: A point P divides the segment from A = (1, 2, 3) to B = (4, 5, 6) internally in the ratio 2:1, with P closer to B. What are the coordinates of P?
hints:
- level: 1
  en: Write the section formula for internal division in the ratio m:n.
- level: 2
  en: Identify which endpoint gets which weight.
- level: 3
  en: Divide the weighted sum by the total of the ratio parts.
