stem:
  en: Vectors a and b are unit vectors with a dot b equal to 1/2. What is the magnitude of a x b?
hints:
- level: 1
  en: Relate the dot product of two unit vectors to the cosine of the angle between them.
- level: 2
  en: Find the sine of that angle from the cosine.
- level: 3
  en: Recall that the cross product magnitude uses the sine of the angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
