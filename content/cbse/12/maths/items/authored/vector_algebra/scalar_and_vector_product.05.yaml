  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: square root of 3 divided by 2
- id: b
  en: 1/2
- id: c
  en: '1'
- id: d
  en: square root of (1/2)
answer:
  sympy: a
  accept: []
