difficulty: 0.6
pool: practice
role: apply
stem:
  en: Find the scalar projection of b = (2, 1, 3) onto a = (1, 1, 1), rounded to 3 decimal places.
hints:
- level: 1
  en: The scalar projection equals the dot product divided by the magnitude of a.
- level: 2
  en: Compute the dot product of the two vectors first.
- level: 3
  en: Find the magnitude of the vector you are projecting onto.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3.464'
  accept: []
solution_steps:
- en: The dot product is 6 and the magnitude of a is the square root of 3, so the scalar projection is 6 over the square root of 3, about 3.464.
- en: Answer = 3.464
tier: C
diagram_note: Vector b drawn at an angle to vector a, with the projection of b onto the line of a marked as a segment along a.
