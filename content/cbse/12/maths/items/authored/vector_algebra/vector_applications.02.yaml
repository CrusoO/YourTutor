stem:
  en: What is the area of the parallelogram whose adjacent sides are a = i + j and b = i - j?
hints:
- level: 1
  en: Compute the cross product of the two adjacent sides.
- level: 2
  en: The area of a parallelogram is the magnitude of that product.
- level: 3
  en: Check the third component of the cross product.
