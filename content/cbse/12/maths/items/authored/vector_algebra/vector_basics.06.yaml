stem:
  en: A vector of magnitude 6 makes equal angles with the three coordinate axes. What is each of its components?
hints:
- level: 1
  en: Equal angles with the axes give equal components.
- level: 2
  en: The sum of the squares of the components equals the squared magnitude.
- level: 3
  en: Solve for one component.
