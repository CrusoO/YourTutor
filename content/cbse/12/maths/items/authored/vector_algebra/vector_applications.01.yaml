answer:
  sympy: '3'
  accept: []
solution_steps:
- en: Taking the vectors (2, 0, 0) and (0, 3, 0), their cross product is (0, 0, 6), whose magnitude is 6, and half of that gives the triangle area of 3.
- en: Answer = 3
