stem:
  en: Find the area of the triangle with vertices (0, 0, 0), (2, 0, 0) and (0, 3, 0).
hints:
- level: 1
  en: Form two vectors from one vertex of the triangle.
- level: 2
  en: Find their cross product.
- level: 3
  en: Take half of the magnitude of that product.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
