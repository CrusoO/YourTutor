solution_steps:
- en: The slope of the tangent is dy/dx at x = -1, which is -12.
- en: The curve passes through y = 0 at that x.
- en: Write the tangent line through that point with that slope. The normal has the
    negative reciprocal slope. Then read off what is asked.
- en: The value is -12.
- en: The correct option is d.
