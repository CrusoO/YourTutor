solution_steps:
- en: The ratios add to 12, so the probabilities are each ratio divided by 12.
- en: 'The mean is the sum of value times probability: 3/2.'
- en: 'The variance is the mean of the squares minus the square of the mean: 17/12.'
- en: The answer is 17/12.
