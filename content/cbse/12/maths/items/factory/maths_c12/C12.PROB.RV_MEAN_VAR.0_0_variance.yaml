stem:
  en: 'The probabilities of X taking the values 0, 1, 2, 3 are in the ratio 4 : 1
    : 4 : 3. What is the variance of X?'
hints:
- level: 1
  en: Turn the ratio into probabilities before any other step.
- level: 2
  en: Divide each ratio number by their total, then use the sum of value times probability
    for the mean.
- level: 3
  en: 'Full method: probabilities from the ratio, mean as the sum of value times probability,
    and for the variance the mean of squares minus the square of the mean.'
prediction_prompt:
  en: Should the mean lie between the smallest and largest value?
