- en: The ratios add to 14, so the probabilities are each ratio divided by 14.
- en: 'The mean is the sum of value times probability: 39/14.'
- en: 'The variance is the mean of the squares minus the square of the mean: 201/196.'
- en: The answer is 201/196.
