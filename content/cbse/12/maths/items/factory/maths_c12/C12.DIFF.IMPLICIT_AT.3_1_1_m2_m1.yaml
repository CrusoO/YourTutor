solution_steps:
- en: Differentiate both sides with respect to x, treating y as a function of x, so
    each y term brings a factor dy/dx and xy needs the product rule.
- en: 'Collect the dy/dx terms and solve: dy/dx = -(2·3x + 1y) / (1x + 2·1y).'
- en: At the point the value is -13/4.
- en: The correct option is b.
