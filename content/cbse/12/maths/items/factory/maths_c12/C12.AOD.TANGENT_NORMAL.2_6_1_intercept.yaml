id: C12.AOD.TANGENT_NORMAL.2_6_1_intercept
skill_ids:
- MATH.C12.AOD.TANGENT_NORMAL
difficulty: 0.65
pool: practice
role: apply
stem:
  en: Let y = -x² - 3x. Find the y-intercept of the tangent to the curve at the point
    with x = 1.
hints:
- level: 1
  en: You need both the slope and the point on the curve.
- level: 2
  en: Find the slope from the derivative, the height from the curve itself, form the
    line through that point, and read off the quantity asked.
- level: 3
  en: 'Full method: derivative gives the slope; the curve gives the point; use the
    point-slope form for the tangent, with the negative reciprocal slope for the normal;
    find the intercept or slope asked.'
prediction_prompt:
  en: Is the tangent rising or falling at this point?
