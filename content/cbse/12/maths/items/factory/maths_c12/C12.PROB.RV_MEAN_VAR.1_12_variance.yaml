solution_steps:
- en: The ratios add to 9, so the probabilities are each ratio divided by 9.
- en: 'The mean is the sum of value times probability: 26/9.'
- en: 'The variance is the mean of the squares minus the square of the mean: 62/81.'
- en: The answer is 62/81.
