stem:
  en: Solve the system -3x = 9; 3x - 3y = -18.
hints:
- level: 1
  en: Each unknown needs its own determinant.
- level: 2
  en: Either replace one column at the time by the right-hand side and divide determinants,
    or multiply the inverse of the coefficient matrix by the right-hand side.
- level: 3
  en: 'Full method: write A X = B, compute the determinant of A, find each unknown
    by column replacement or with the inverse, and put your answer back into every
    equation.'
prediction_prompt:
  en: Does the system have one solution, none, or infinitely many?
