solution_steps:
- en: 'The number of heads follows a binomial pattern: each outcome with i heads has
    probability p to the i times q to the n minus i, and there are n choose i ways
    to place the heads.'
- en: Add the cases that belong to the event asked.
- en: The probability is 19/27.
- en: The correct option is b.
