solution_steps:
- en: The inverse is the adjoint divided by the determinant.
- en: The determinant is 1. For a 2 by 2 matrix, swap the diagonal entries and change
    the sign of the other two to get the adjoint.
- en: 'Divide every entry by 1: [[-3, -2], [-1, -1]].'
- en: The correct option is c.
