role: recall
stem:
  en: State the order and the degree of the differential equation d³y/dx³ + (dy/dx)³
    + y = 0.
hints:
- level: 1
  en: 'Order and degree are different ideas: one counts derivatives, one counts powers.'
- level: 2
  en: The order is the highest derivative present; the degree is the exponent on that
    same highest derivative, not on any other term.
- level: 3
  en: 'Full method: list every derivative, pick the highest order, read the power
    on that one derivative, and ignore the powers on lower ones.'
prediction_prompt:
  en: Which term decides the order?
