role: apply
stem:
  en: A factory has 3 machines. They make first source 50%, second source 30%, third
    source 20% of the bolts. The chance that a bolt is faulty is 4%, 5%, 3% for the
    machines in that order. A bolt is picked at random and found faulty. What is the
    probability that it came from the second machine?
hints:
- level: 1
  en: Several machines can give faulty bolts, so you need the total.
- level: 2
  en: Multiply each machine's share by its fault rate, add them all for the total,
    then divide the share of the asked machine by that total.
- level: 3
  en: 'Full method: joint probability for each machine, their sum as the total probability
    of a fault, then the asked joint divided by the total; simplify the fraction.'
prediction_prompt:
  en: Should the answer be larger or smaller than the machine's share?
