stem:
  en: Let y = x³ - 3x² - 24x + 4. Find the value of x at which the function has a
    local maximum.
hints:
- level: 1
  en: 'Finding the critical points is only half the job: you must classify them.'
- level: 2
  en: Solve for the points where the derivative is zero, then use the second derivative
    or the change of sign of the first to tell maximum from minimum.
- level: 3
  en: 'Full method: derivative equal to zero, solve, second derivative at each solution,
    choose the maximum or minimum asked, and put that x into the original function
    if a value is wanted.'
prediction_prompt:
  en: Will the maximum be to the left or the right of the minimum?
