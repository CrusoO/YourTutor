stem:
  en: The function f is given by x → x + 2 for x < 2, and x → kx² for x ≥ 2. Find
    the value of k that makes f continuous at x = 2.
hints:
- level: 1
  en: Work out the limit coming from the formula that is not at the point.
- level: 2
  en: Find the limit as x approaches the point from the formula near it, simplify
    first if the quotient looks like zero over zero, then set it equal to the value.
- level: 3
  en: 'Full method: compute the limit near the point after any cancelling, write the
    value of the function at the point, equate them and solve for k.'
prediction_prompt:
  en: Which two quantities must be equal for continuity?
