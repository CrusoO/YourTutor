solution_steps:
- en: The inverse is the adjoint divided by the determinant.
- en: The determinant is -3. For a 2 by 2 matrix, swap the diagonal entries and change
    the sign of the other two to get the adjoint.
- en: 'Divide every entry by -3: [[-1, 1], [-1/3, 2/3]].'
- en: The correct option is a.
