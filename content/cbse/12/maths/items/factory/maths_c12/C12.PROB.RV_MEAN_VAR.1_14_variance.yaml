solution_steps:
- en: The ratios add to 11, so the probabilities are each ratio divided by 11.
- en: 'The mean is the sum of value times probability: 29/11.'
- en: 'The variance is the mean of the squares minus the square of the mean: 116/121.'
- en: The answer is 116/121.
