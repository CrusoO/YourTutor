stem:
  en: Find the cross product of the vectors -i + 3k and -i + 2j + 2k, in that order.
hints:
- level: 1
  en: The order of the two vectors matters.
- level: 2
  en: Expand the determinant along the unit-vector row, taking care with the sign
    of the middle term.
- level: 3
  en: 'Full method: determinant with i, j, k on the first row, expand, simplify each
    component, and check that your result is perpendicular to both vectors by taking
    dot products.'
prediction_prompt:
  en: Is the result perpendicular to both vectors?
