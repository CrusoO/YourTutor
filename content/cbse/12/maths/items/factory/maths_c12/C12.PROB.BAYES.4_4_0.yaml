solution_steps:
- en: 'Find the probability of each machine and a faulty bolt together: prior times
    fault rate.'
- en: 'Add them to get the total chance of a faulty bolt: 395 out of 10000.'
- en: Posterior = 100 / 395 = 20/79.
- en: The correct option is b.
