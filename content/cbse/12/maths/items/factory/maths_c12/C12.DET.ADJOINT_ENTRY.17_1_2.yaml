solution_steps:
- en: The adjoint is the transpose of the matrix of cofactors, so its entry in row
    i and column j is the cofactor of the entry in row j and column i of A.
- en: Delete row 3 and column 2, take the 2 by 2 determinant, and attach the sign
    -.
- en: The entry is 2.
- en: The correct option is b.
