difficulty: 0.57
pool: practice
role: apply
stem:
  en: For the matrix A = [[-3, 0, 2], [2, 0, 1], [-1, 2, -2]], what is the element
    in row 2, column 3 of adj A?
hints:
- level: 1
  en: Remember that the adjoint is built from cofactors and then turned over.
- level: 2
  en: Find the cofactor of the entry in the mirrored position, since the adjoint is
    the transpose of the cofactor matrix.
- level: 3
  en: 'Full method: locate the mirrored position, delete its row and column, find
    the 2 by 2 determinant, and multiply by the sign of that position.'
prediction_prompt:
  en: Does the position of the entry matter once the matrix is turned over?
