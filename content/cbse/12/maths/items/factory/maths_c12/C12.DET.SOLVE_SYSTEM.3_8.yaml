solution_steps:
- en: Write the system as the matrix equation A X = B.
- en: The determinant of A is 3, which is not zero, so there is exactly one solution.
- en: Find each unknown as the determinant with that column replaced by B, divided
    by the determinant of A.
- en: The correct option is b.
