solution_steps:
- en: 'Find the probability of each machine and a faulty bolt together: prior times
    fault rate.'
- en: 'Add them to get the total chance of a faulty bolt: 450 out of 10000.'
- en: Posterior = 250 / 450 = 5/9.
- en: The correct option is c.
