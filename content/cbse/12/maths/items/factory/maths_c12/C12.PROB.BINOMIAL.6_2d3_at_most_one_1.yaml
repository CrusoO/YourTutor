stem:
  en: A biased coin shows heads with probability 2/3. It is tossed 6 times, each toss
    independent of the others. Find the probability of at most one head.
hints:
- level: 1
  en: How many different orders can the heads appear in?
- level: 2
  en: For each allowed number of heads, multiply the number of arrangements by the
    probability of one arrangement, then add the cases.
- level: 3
  en: 'Full method: list the allowed head counts, compute n choose i times p to the
    i times q to the n minus i for each, add, and simplify. A complement can save
    work for at least one.'
