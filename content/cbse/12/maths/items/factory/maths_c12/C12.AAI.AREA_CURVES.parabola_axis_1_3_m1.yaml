stem:
  en: Find the area of the region enclosed between the curve y = -x² + 4x - 3 and
    the x-axis.
hints:
- level: 1
  en: Area is never negative, so decide which curve is on top.
- level: 2
  en: Solve for the meeting points, write the upper minus the lower curve, integrate
    between the meeting points, and take the positive value.
- level: 3
  en: 'Full method: meeting points, upper minus lower, antiderivative, upper limit
    minus lower limit, and make sure the final area is positive.'
prediction_prompt:
  en: Is the enclosed region above or below the x-axis?
