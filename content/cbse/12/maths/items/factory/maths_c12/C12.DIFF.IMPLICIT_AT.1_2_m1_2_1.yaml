stem:
  en: The curve x² + 2xy - y² = 7 passes through the point (2, 1). Find dy/dx at that
    point.
hints:
- level: 1
  en: The mixed term needs the product rule.
- level: 2
  en: Differentiate both sides with respect to x, gather the dy/dx terms on one side,
    factor, and divide.
- level: 3
  en: 'Full method: differentiate term by term (chain rule on y, product rule on the
    mixed term), collect the dy/dx terms, solve for dy/dx, then substitute the point.'
prediction_prompt:
  en: Can you find dy/dx without solving the curve for y first?
