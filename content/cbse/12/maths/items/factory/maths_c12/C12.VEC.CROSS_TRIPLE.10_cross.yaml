solution_steps:
- en: Write the 3 by 3 determinant with the unit vectors on the first row, the first
    vector on the second row and the second vector on the third row.
- en: Expand along the first row; the middle term carries a minus sign.
- en: The cross product is -3j - 3k.
- en: The correct option is c.
