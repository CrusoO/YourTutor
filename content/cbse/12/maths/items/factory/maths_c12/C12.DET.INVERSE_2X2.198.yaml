difficulty: 0.47
pool: practice
role: apply
stem:
  en: Find the inverse of the matrix [[-1, 1], [-3, 4]].
hints:
- level: 1
  en: What must be true about the determinant before an inverse exists?
- level: 2
  en: Compute the determinant, build the adjoint by exchanging the main diagonal entries
    and negating the other two, then divide by the determinant.
- level: 3
  en: 'Full method: determinant, adjoint, divide every entry; finally multiply your
    answer by the original matrix to see the identity.'
prediction_prompt:
  en: What should the product of the matrix and its inverse be?
