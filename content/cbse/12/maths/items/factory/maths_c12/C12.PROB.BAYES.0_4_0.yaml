solution_steps:
- en: 'Find the probability of each machine and a faulty bolt together: prior times
    fault rate.'
- en: 'Add them to get the total chance of a faulty bolt: 500 out of 10000.'
- en: Posterior = 200 / 500 = 2/5.
- en: The correct option is a.
