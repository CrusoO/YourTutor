stem:
  en: How do biofertilisers improve plant nutrition?
hints:
- level: 1
  en: Think about nutrients that plants struggle to get from the air or soil.
- level: 2
  en: Consider microbes that live in association with roots.
- level: 3
  en: Focus on how the microbe makes a nutrient usable by the plant.
