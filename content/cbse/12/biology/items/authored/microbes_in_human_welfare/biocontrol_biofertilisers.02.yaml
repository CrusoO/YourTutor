options:
- id: a
  en: They absorb sunlight to feed the roots
- id: b
  en: They kill all other soil microbes
- id: c
  en: They release chemical fertilisers into the soil
- id: d
  en: They fix atmospheric nitrogen or make phosphate available to roots
