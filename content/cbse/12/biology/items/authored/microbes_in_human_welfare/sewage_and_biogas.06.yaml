type: numeric
answer:
  sympy: '50'
  accept: []
solution_steps:
- en: Dividing 500 cubic metres by 10 tonnes gives 50 cubic metres per tonne.
- en: The unit of the answer is cubic metres per tonne.
- en: Answer = 50
