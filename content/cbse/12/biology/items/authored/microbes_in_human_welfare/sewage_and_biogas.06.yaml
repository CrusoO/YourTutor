stem:
  en: A biogas plant produces 500 cubic metres of gas per day from 10 tonnes of waste. How many cubic metres of gas are produced per tonne of waste? Give the number only.
hints:
- level: 1
  en: Divide the gas volume by the mass of waste.
- level: 2
  en: Keep the units as cubic metres per tonne.
- level: 3
  en: Check the result against the daily total.
