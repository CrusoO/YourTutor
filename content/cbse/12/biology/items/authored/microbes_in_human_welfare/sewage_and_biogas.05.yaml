stem:
  en: A biogas plant produces little methane. Which change is most likely to improve its output?
hints:
- level: 1
  en: Think about the conditions that keep the microbes active.
- level: 2
  en: Consider which factor the microbes need to stay productive.
- level: 3
  en: Ask which conditions would harm anaerobic microbes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
