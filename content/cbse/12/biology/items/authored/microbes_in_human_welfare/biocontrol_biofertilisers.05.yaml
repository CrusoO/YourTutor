id: A.12.biology.microbes_in_human_welfare.biocontrol_biofertilisers.05
skill_ids:
- SK.A.12.biology.biocontrol_biofertilisers
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A biocontrol agent is found to harm a beneficial insect that is not a pest. What is the best next step before wider use?
hints:
- level: 1
  en: Think about what a limited field trial can show before wider use.
- level: 2
  en: Consider the effect on species beyond the target pest.
- level: 3
  en: Ask which step gathers evidence before a decision on wider use.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Add a chemical pesticide to boost its effect
- id: b
  en: Stop all pest control entirely
- id: c
  en: Apply it to all fields immediately
- id: d
  en: Assess the impact on non-target species in trials before wider use
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.0D0943D764F5
  when_answer_equals:
  - c
- id: MC.A.7910892201CF
  when_answer_equals:
  - b
- id: MC.A.F1AD437BBFD0
  when_answer_equals:
  - a
solution_steps:
- en: Non-target effects must be measured in controlled trials before a biocontrol agent is released widely.
- en: This protects beneficial species and the wider ecosystem.
- en: The correct option is d.
tier: C
