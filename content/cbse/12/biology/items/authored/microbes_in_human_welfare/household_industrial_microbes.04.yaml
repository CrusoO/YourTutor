stem:
  en: A fermenting batch of 500 litres produces alcohol equal to 4 percent of its volume. How many litres of alcohol are produced? Give the number only.
hints:
- level: 1
  en: Convert the percentage into a decimal.
- level: 2
  en: Multiply the volume by that decimal.
- level: 3
  en: Check that the unit is litres.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
