stem:
  en: On a diagram of a biogas plant, which microbes produce the methane in the anaerobic digester?
hints:
- level: 1
  en: Think about the group of microbes that grows without oxygen.
- level: 2
  en: Consider which microbe group releases methane as a waste product.
- level: 3
  en: Separate aerobic microbes from anaerobic ones.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
