stem:
  en: Certain cheeses develop a characteristic flavour and blue veins from a particular microbe. Which microbe is most associated with this?
hints:
- level: 1
  en: Think about a mould associated with blue veins.
- level: 2
  en: Consider which microbes are used on purpose in food production.
- level: 3
  en: Separate deliberate food microbes from disease causing ones.
