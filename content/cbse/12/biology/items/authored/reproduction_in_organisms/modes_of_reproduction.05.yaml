stem:
  en: A filament of the alga Spirogyra breaks into several pieces, and each piece grows into a new filament. Which method of reproduction does this describe?
hints:
- level: 1
  en: Look at what happens to the body of the filament.
- level: 2
  en: Check whether a bud or a spore is involved in this process.
- level: 3
  en: Ask whether any gamete fusion takes place.
