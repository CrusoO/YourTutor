id: A.12.biology.reproduction_in_organisms.modes_of_reproduction.01
skill_ids:
- SK.A.12.biology.modes_of_reproduction
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which mode of reproduction involves only one parent and produces offspring that are genetically identical to that parent?
hints:
- level: 1
  en: Ask how many parents contribute genetic material to each offspring.
- level: 2
  en: Consider whether gametes are formed and fused in this mode.
- level: 3
  en: Think about where the offspring's genes come from.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Gametic fusion between unlike gametes
- id: b
  en: Sexual reproduction
- id: c
  en: Cross-fertilisation
- id: d
  en: Asexual reproduction
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.E3CDB7CC1500
  when_answer_equals:
  - b
- id: MC.A.B037AB3DC248
  when_answer_equals:
  - c
- id: MC.A.489911A501E0
  when_answer_equals:
  - a
solution_steps:
- en: Asexual reproduction copies the genome of one parent, so offspring are clones apart from rare mutations.
- en: Sexual reproduction mixes genetic material from two parents through gametes.
- en: The correct option is d.
tier: C
