stem:
  en: A long-lived species keeps 80 percent of its adults each year, with no births or immigration. Starting with 500 adults, how many adults remain after 2 years? Give the count only.
hints:
- level: 1
  en: Apply the survival fraction once for each year.
- level: 2
  en: Use the surviving count from year one as the start of year two.
- level: 3
  en: Keep the answer as a count of adults.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
