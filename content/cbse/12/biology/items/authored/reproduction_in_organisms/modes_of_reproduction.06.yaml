difficulty: 0.9
pool: practice
role: apply
stem:
  en: A plant produces 1200 seeds per season. Each seed has a 0.5 percent chance of establishing a new plant. On average, how many new plants establish per season? Give the count only.
hints:
- level: 1
  en: Convert the percentage into a decimal before using it.
- level: 2
  en: Multiply the seed count by that decimal.
- level: 3
  en: Check that the result is a small count of plants, not a percentage.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: Half a percent is 0.005, and 1200 times 0.005 equals 6 established plants on average.
- en: Answer = 6
tier: C
