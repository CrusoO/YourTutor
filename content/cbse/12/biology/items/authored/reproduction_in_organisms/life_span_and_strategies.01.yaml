stem:
  en: Organisms that produce many small offspring with little parental care are often suited to which kind of environment?
hints:
- level: 1
  en: Think about how many offspring survive when conditions change unpredictably.
- level: 2
  en: Consider how much energy a parent can put into each young one.
- level: 3
  en: Compare the cost of many cheap offspring with few costly ones.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
