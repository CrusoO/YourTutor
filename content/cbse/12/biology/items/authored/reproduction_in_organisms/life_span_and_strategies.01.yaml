  author: model-draft
type: mcq
options:
- id: a
  en: Unstable environments where many offspring die young
- id: b
  en: Stable environments with few competitors
- id: c
  en: Only aquatic environments
- id: d
  en: Environments with long-lived adults and slow growth
answer:
  sympy: a
  accept: []
