id: A.12.biology.reproduction_in_organisms.modes_of_reproduction.04
skill_ids:
- SK.A.12.biology.modes_of_reproduction
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A plant spreads by runners. Each existing plant produces 3 new plants per month, and no plant dies. Starting with 1 plant, how many plants exist at the end of 2 months? Give the count only.
hints:
- level: 1
  en: Work out the total at the end of month one first.
- level: 2
  en: Each plant that exists at the start of a month adds three new ones.
- level: 3
  en: Carry the month one total forward into month two.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '16'
  accept: []
solution_steps:
- en: After month one there are 1 plus 3 equals 4 plants.
- en: In month two each of the 4 plants adds 3 more, giving 4 plus 12 equals 16.
- en: Answer = 16
tier: C
