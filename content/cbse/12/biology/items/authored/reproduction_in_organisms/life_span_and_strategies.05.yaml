id: A.12.biology.reproduction_in_organisms.life_span_and_strategies.05
skill_ids:
- SK.A.12.biology.life_span_and_strategies
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A bacterium divides every 20 minutes under good conditions, yet a closed culture stops growing after a while. Which factor best explains this limit?
hints:
- level: 1
  en: Think about what a growing population consumes from its surroundings.
- level: 2
  en: Consider what a closed flask can supply over time and what the cells keep using up.
- level: 3
  en: Ask what changes as the population becomes dense.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Nutrients are used up and waste builds up, capping the population size
- id: b
  en: Parental care keeps their numbers low
- id: c
  en: Their genome mutates after every division
- id: d
  en: Bacteria stop dividing after a fixed number of divisions
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.F2A294692A06
  when_answer_equals:
  - d
- id: MC.A.D1D1B895E702
  when_answer_equals:
  - c
- id: MC.A.BD6FDFF87250
  when_answer_equals:
  - b
solution_steps:
- en: In a closed culture the food supply is finite and wastes accumulate, so growth slows and levels off.
- en: This is the carrying capacity idea applied to a microbe.
- en: The correct option is a.
tier: C
