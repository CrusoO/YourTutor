solution_steps:
- en: In regeneration, a fragment of the body grows into a whole new individual, which is a form of asexual reproduction in some animals.
- en: The other options describe cell division or gene transfer rather than rebuilding a whole body from a piece.
- en: The correct option is b.
tier: C
