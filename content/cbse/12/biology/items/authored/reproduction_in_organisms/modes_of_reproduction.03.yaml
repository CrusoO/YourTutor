id: A.12.biology.reproduction_in_organisms.modes_of_reproduction.03
skill_ids:
- SK.A.12.biology.modes_of_reproduction
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A hydra regenerates a complete new organism from a small cut piece of its body. Which asexual mode does this most closely match?
hints:
- level: 1
  en: Focus on how a whole body forms again from a small fragment.
- level: 2
  en: Compare the process with cell division in single-celled organisms.
- level: 3
  en: Eliminate modes that involve gametes or genetic exchange between cells.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Sporulation
- id: b
  en: Regeneration
- id: c
  en: Binary fission
- id: d
  en: Conjugation
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.9847F8DD215B
  when_answer_equals:
  - c
- id: MC.A.17FBD1E2B509
  when_answer_equals:
