id: A.12.biology.reproduction_in_organisms.life_span_and_strategies.04
skill_ids:
- SK.A.12.biology.life_span_and_strategies
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A fish lays 10000 eggs and gives no care. A mammal bears one young per year and cares for it for years. Which statement correctly contrasts their strategies?
hints:
- level: 1
  en: Count how many young each animal produces and what care it gives.
- level: 2
  en: Compare how much each offspring receives from its parent.
- level: 3
  en: Decide which pattern fits each animal rather than comparing their modes of reproduction.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The fish follows a many-offspring strategy and the mammal a few-offspring strategy
- id: b
  en: Both follow the same strategy because both reproduce sexually
- id: c
  en: The fish invests more energy in each egg than the mammal does
- id: d
  en: The mammal follows a many-offspring strategy because it lives longer
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.1D0778D2C9CB
  when_answer_equals:
  - b
- id: MC.A.928E054DBDE8
  when_answer_equals:
  - d
- id: MC.A.C4741BD14745
  when_answer_equals:
  - c
solution_steps:
- en: The fish spreads its investment across thousands of eggs with no care, which is a many-offspring pattern.
- en: The mammal puts heavy investment into one young with long parental care.
- en: The correct option is a.
tier: C
