stem:
  en: Which codon signals the start of translation in most mRNAs?
hints:
- level: 1
  en: Think about the codon that also specifies methionine.
- level: 2
  en: Stop codons end translation rather than begin it.
- level: 3
  en: Focus on the codon that is read first in most messages.
