id: A.12.biology.molecular_basis_of_inheritance.dna_structure_packaging.05
skill_ids:
- SK.A.12.biology.dna_structure_packaging
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Chromatin in a cell is highly condensed, and its genes are poorly expressed. Which change would most likely increase expression of those genes?
hints:
- level: 1
  en: Think about what the positive histone tails do to the negative DNA.
- level: 2
  en: Consider how adding a chemical group to histone tails changes their charge.
- level: 3
  en: Ask which change would make the DNA more accessible to enzymes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Coiling of DNA into a tighter superhelix
- id: b
  en: Addition of extra linker histone H1 to each nucleosome
- id: c
  en: Increased methylation of histone tails that tightens packing
- id: d
  en: Histone acetylation that loosens the packing of chromatin
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.C4F077C65DD9
  when_answer_equals:
  - c
- id: MC.A.090D236A18BC
  when_answer_equals:
  - b
- id: MC.A.7FF40F4D148A
  when_answer_equals:
  - a
solution_steps:
- en: Acetylation neutralises the positive charge on histone tails, which weakens their grip on DNA and makes it more accessible.
- en: Tighter packing and extra linker histone make the chromatin less accessible.
- en: The correct option is d.
tier: C
