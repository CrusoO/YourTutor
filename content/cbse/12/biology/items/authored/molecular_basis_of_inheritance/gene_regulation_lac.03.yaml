stem:
  en: In a strain with a deleted lacI gene and no inducer, what level of lac enzymes would be expected?
hints:
- level: 1
  en: Think about what the repressor does when it is missing.
- level: 2
  en: Consider whether the operator is blocked in this strain.
- level: 3
  en: Compare with a cell that has no inducer but still has the repressor.
