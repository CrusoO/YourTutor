id: A.12.biology.molecular_basis_of_inheritance.human_genome_project.04
skill_ids:
- SK.A.12.biology.human_genome_project
difficulty: 0.6
pool: practice
role: apply
stem:
  en: The human genome has about 3 billion base pairs. A sequencing run reads 150 bases per read. How many reads cover the genome once with no overlap? Give the count only.
hints:
- level: 1
  en: Divide the genome length by the read length.
- level: 2
  en: Express the answer as a plain count of reads.
- level: 3
  en: Check that the number of reads is in the millions.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '20000000'
  accept: []
solution_steps:
- en: Three billion divided by 150 gives 20 million reads for a single non overlapping coverage.
- en: Answer = 20000000
tier: C
