stem:
  en: A mutant cell lacks active DNA ligase. Which product is most likely to accumulate during replication?
hints:
- level: 1
  en: Think about which step seals the gaps between newly made pieces.
- level: 2
  en: Consider which strand is made in pieces.
- level: 3
  en: Look at the strand that needs many joins.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
