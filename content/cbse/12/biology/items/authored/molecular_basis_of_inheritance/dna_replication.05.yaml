  author: model-draft
type: mcq
options:
- id: a
  en: Extra supercoiling ahead of the fork
- id: b
  en: Unwound single strands at the leading strand only
- id: c
  en: Unjoined Okazaki fragments on the lagging strand
- id: d
  en: Complete double strands with no nicks
answer:
  sympy: c
  accept: []
