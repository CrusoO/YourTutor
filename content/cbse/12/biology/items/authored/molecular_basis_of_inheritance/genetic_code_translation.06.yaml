stem:
  en: A coding region of 180 nucleotides is read in triplets from the start codon, with no stop codon before its end. How many codons are read? Give the count only.
hints:
- level: 1
  en: Divide the length in bases by the number of bases per codon.
- level: 2
  en: Keep the count in codons rather than bases.
- level: 3
  en: Check that the division leaves no partial codon.
prediction_prompt:
