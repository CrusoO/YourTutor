stem:
  en: RNA polymerase adds 50 nucleotides per second. How many seconds does it take to transcribe a gene of 3000 nucleotides? Give the number only.
hints:
- level: 1
  en: Divide the length of the gene by the rate of addition.
- level: 2
  en: Check that your unit is seconds.
- level: 3
  en: Keep the answer as a time.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '60'
  accept: []
solution_steps:
- en: Dividing 3000 nucleotides by a rate of 50 per second gives 60 seconds.
- en: The unit of the answer is seconds.
- en: Answer = 60
tier: C
