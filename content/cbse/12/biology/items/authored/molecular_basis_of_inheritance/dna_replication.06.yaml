id: A.12.biology.molecular_basis_of_inheritance.dna_replication.06
skill_ids:
- SK.A.12.biology.dna_replication
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A bacterial chromosome of 4.6 million base pairs is replicated from one origin, with two forks each copying 1000 base pairs per second. How many seconds does full replication take? Give the count only.
hints:
- level: 1
  en: Work out the combined rate of copying with two forks.
- level: 2
  en: Divide the total base pair count by the combined rate.
- level: 3
  en: Check that the unit of your answer is seconds.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2300'
  accept: []
solution_steps:
- en: Two forks copy 2000 base pairs per second together, and 4.6 million divided by 2000 is 2300 seconds.
- en: Answer = 2300
tier: C
diagram_note: Draw a circular bacterial chromosome with a single origin and two replication forks moving in opposite directions around the circle.
