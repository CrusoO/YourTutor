stem:
  en: A transcript is 1800 nucleotides long, and its 5-prime and 3-prime untranslated regions together total 300 nucleotides. How many nucleotides are in the coding sequence? Give the count only.
hints:
- level: 1
  en: Subtract the untranslated portions from the total length.
- level: 2
  en: Check that the remaining coding length divides by three.
- level: 3
  en: Keep the answer as a count of nucleotides.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1500'
  accept: []
solution_steps:
- en: Subtracting the 300 untranslated nucleotides from 1800 leaves 1500 nucleotides in the coding sequence.
- en: Answer = 1500
tier: C
