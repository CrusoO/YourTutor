stem:
  en: A child inherits half of each parent's band pattern. One parent has 40 bands. How many of that parent's bands does the child inherit on average? Give the count only.
hints:
- level: 1
  en: Work out the share each parent contributes to the child.
- level: 2
  en: Apply that fraction to the parent's band count.
- level: 3
  en: Keep the answer as a count of bands.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
