id: A.12.biology.molecular_basis_of_inheritance.gene_regulation_lac.06
skill_ids:
- SK.A.12.biology.gene_regulation_lac
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A cell has 3 copies of the operon after replication. Each copy produces 200 beta-galactosidase molecules per hour when induced. How many molecules per hour are made from all copies? Give the count only.
hints:
- level: 1
  en: Multiply the number of operon copies by the output per copy.
- level: 2
  en: Check that the rate is measured in molecules per hour.
- level: 3
  en: Keep the answer as a count of molecules per hour.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '600'
  accept: []
solution_steps:
- en: Three copies each producing 200 molecules per hour give 600 molecules per hour.
- en: Answer = 600
tier: C
diagram_note: Draw three operon copies side by side, each with promoter, operator and lacZ, and show the inducer binding the repressor.
