id: A.12.biology.molecular_basis_of_inheritance.transcription.04
skill_ids:
- SK.A.12.biology.transcription
difficulty: 0.6
pool: practice
role: apply
stem:
  en: On a diagram of eukaryotic pre-mRNA with exons and introns, which segments are removed to form the mature mRNA?
hints:
- level: 1
  en: Consider the non-coding segments that interrupt the coding ones.
- level: 2
  en: Think about which pieces the spliceosome cuts out.
- level: 3
  en: Exons are the parts that stay in the mature transcript.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The binding sites for tRNA
- id: b
  en: The 5-prime cap
- id: c
  en: Introns
- id: d
  en: Exons
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.3A6A826991A4
  when_answer_equals:
  - d
- id: MC.A.F6CB29F173DD
  when_answer_equals:
  - b
- id: MC.A.E8BA19B18E9A
  when_answer_equals:
