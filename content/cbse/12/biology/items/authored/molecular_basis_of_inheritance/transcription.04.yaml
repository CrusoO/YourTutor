solution_steps:
- en: The spliceosome removes introns from pre-mRNA and joins the exons, creating the mature mRNA.
- en: The 5-prime cap and poly-A tail are added and kept.
- en: The correct option is c.
tier: C
diagram_note: Draw pre-mRNA as a bar with alternating exons and introns, mark the 5-prime cap and poly-A tail, and show the splicing step that removes the introns.
