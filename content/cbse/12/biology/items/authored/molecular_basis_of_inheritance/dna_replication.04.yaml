solution_steps:
- en: DNA polymerase adds deoxyribonucleotides to the 3-prime end of a primed strand, so the new strand grows in the 5-prime to 3-prime direction.
- en: Primase only makes the short RNA primer.
- en: The correct option is b.
tier: C
diagram_note: Draw a replication fork with helicase, leading and lagging strands, Okazaki fragments, primase and DNA ligase labelled, and mark the 5-prime and 3-prime ends on each strand.
