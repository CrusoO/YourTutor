difficulty: 0.6
pool: practice
role: apply
stem:
  en: In a replication bubble, which enzyme adds nucleotides to the 3-prime end of a growing strand?
hints:
- level: 1
  en: Think about which enzyme requires a primer to start.
- level: 2
  en: Focus on the enzyme that extends the chain in the 5-prime to 3-prime direction.
- level: 3
  en: Ask which enzyme is the main builder of new DNA.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Reverse transcriptase
- id: b
  en: DNA polymerase
- id: c
  en: DNA gyrase
- id: d
  en: Primase
answer:
  sympy: b
  accept: []
misconception_rules:
