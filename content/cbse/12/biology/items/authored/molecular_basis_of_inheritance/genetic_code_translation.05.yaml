id: A.12.biology.molecular_basis_of_inheritance.genetic_code_translation.05
skill_ids:
- SK.A.12.biology.genetic_code_translation
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A point mutation changes the codon UUU, which codes phenylalanine, to UUC. What is the expected effect on the amino acid?
hints:
- level: 1
  en: Look up both codons in the genetic code table.
- level: 2
  en: Check whether two codons specify the same amino acid.
- level: 3
  en: Ask whether the number of bases changed is a multiple of three.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It stays phenylalanine, so the protein sequence is unchanged at that site
- id: b
  en: It becomes a stop codon
- id: c
  en: The reading frame shifts
- id: d
  en: It becomes leucine
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.07E043B8466F
  when_answer_equals:
  - d
- id: MC.A.8751F297E4E3
  when_answer_equals:
  - b
- id: MC.A.7CCEF87B1D49
  when_answer_equals:
  - c
solution_steps:
- en: UUC also codes for phenylalanine, so this third position change is silent.
- en: Only insertions or deletions shift the reading frame.
- en: The correct option is a.
tier: C
