stem:
  en: Translate the mRNA codons AUG, GCU and UAA in order. How many amino acids are added to the polypeptide? Give the count only.
hints:
- level: 1
  en: Read the codons in order starting from the start codon.
- level: 2
  en: A stop codon does not add an amino acid.
- level: 3
  en: Count only the codons that specify an amino acid.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
