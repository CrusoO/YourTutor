difficulty: 0.9
pool: practice
role: apply
stem:
  en: A linear DNA molecule of 5 million base pairs is packed into nucleosomes spaced every 200 base pairs. How many nucleosomes form? Give the count only.
hints:
- level: 1
  en: Divide the total base pairs by the spacing between nucleosomes.
- level: 2
  en: Check that the spacing is measured in base pairs.
- level: 3
  en: Keep the answer as a count of nucleosomes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '25000'
  accept: []
solution_steps:
- en: Five million divided by 200 gives 25000 nucleosomes along the molecule.
- en: Answer = 25000
tier: C
diagram_note: Draw a row of nucleosomes on one DNA strand with linker DNA between them, and label the 200 base pair spacing.
