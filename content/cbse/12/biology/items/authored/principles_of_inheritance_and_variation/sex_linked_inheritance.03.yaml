id: A.12.biology.principles_of_inheritance_and_variation.sex_linked_inheritance.03
skill_ids:
- SK.A.12.biology.sex_linked_inheritance
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A carrier mother and a normal father have children. For an X-linked recessive trait, what percentage of their sons are expected to be affected? Give the number only.
hints:
- level: 1
  en: Write the cross as a Punnett square using the father's gametes.
- level: 2
  en: Focus on the mother's gametes that carry the recessive allele.
- level: 3
  en: Consider which sons inherit the X carrying the recessive allele.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '50'
  accept: []
solution_steps:
- en: Half of the mother's eggs carry the recessive allele, so half of the sons receive it and are affected.
- en: The unit of the answer is %.
- en: Answer = 50
tier: C
