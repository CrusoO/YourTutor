stem:
  en: Roan cattle carry both red and white hair patterns. Two roan cattle are crossed, and 40 offspring are born. Assuming the usual 1:2:1 pattern, how many offspring are expected to be white? Give the count only.
hints:
- level: 1
  en: Write out the 1:2:1 pattern for a roan by roan cross.
- level: 2
  en: Apply the fraction for the homozygous white class to the total.
- level: 3
  en: Check that the counts across all classes add up to the total.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10'
  accept: []
solution_steps:
- en: The roan cross gives one red, two roan and one white in four, so one quarter of 40 is 10 white calves.
- en: Answer = 10
tier: C
