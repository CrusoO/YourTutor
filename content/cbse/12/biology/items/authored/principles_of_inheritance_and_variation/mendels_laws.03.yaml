stem:
  en: In a dihybrid cross of AaBb by AaBb, what fraction of the offspring is expected to be aabb?
hints:
- level: 1
  en: Find the fraction for each gene separately.
- level: 2
  en: Multiply the two single gene fractions together.
- level: 3
  en: Check that the answer is one of the sixteen equally likely combinations.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
