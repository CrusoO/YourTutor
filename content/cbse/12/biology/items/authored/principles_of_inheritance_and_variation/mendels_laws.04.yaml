id: A.12.biology.principles_of_inheritance_and_variation.mendels_laws.04
skill_ids:
- SK.A.12.biology.mendels_laws
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A dihybrid cross of AaBb by AaBb produces 320 offspring. How many are expected to show both dominant traits? Give the count only.
hints:
- level: 1
  en: Find the fraction showing dominance for each trait separately.
- level: 2
  en: Multiply the two fractions, then apply the result to the total.
- level: 3
  en: Check that your answer is a whole number of offspring.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '180'
  accept: []
solution_steps:
- en: Nine of sixteen offspring show both dominant traits, and nine sixteenths of 320 is 180.
- en: Answer = 180
tier: C
diagram_note: Draw a four by four Punnett square for AaBb by AaBb, with gametes AB, Ab, aB and ab along each axis, and shade the cells that show both dominant traits.
