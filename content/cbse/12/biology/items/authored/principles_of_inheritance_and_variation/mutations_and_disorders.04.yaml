difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which statement correctly contrasts sickle cell anaemia with a chromosomal disorder?
hints:
- level: 1
  en: Consider whether the change is in one gene or in the chromosome number.
- level: 2
  en: Think about the scale of the change in the genome.
- level: 3
  en: Separate point mutations from whole chromosome changes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is always caused by environmental exposure
- id: b
  en: It arises from an extra chromosome
- id: c
  en: It requires two copies of the X chromosome
- id: d
  en: It arises from a single gene change, not from a missing or extra chromosome
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.737349A22307
  when_answer_equals:
  - b
- id: MC.A.0CD7EFB9028D
