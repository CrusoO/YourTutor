stem:
  en: In a trihybrid cross AaBbCc by AaBbCc, how many distinct genotypes are possible among the offspring? Give the count only.
hints:
- level: 1
  en: Each gene pair gives three possible genotypes.
- level: 2
  en: Multiply the number of options for each gene pair together.
- level: 3
  en: Keep the three gene pairs independent when counting.
