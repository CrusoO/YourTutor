id: A.12.biology.principles_of_inheritance_and_variation.incomplete_dominance_multiple_alleles.02
skill_ids:
- SK.A.12.biology.incomplete_dominance_multiple_alleles
difficulty: 0.2
pool: practice
role: explain
stem:
  en: In codominance, what does the heterozygote show?
hints:
- level: 1
  en: Consider whether both alleles produce their own products.
- level: 2
  en: Compare with the blended pattern seen in incomplete dominance.
- level: 3
  en: Ask whether each allele shows its effect separately.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A blend of both traits
- id: b
  en: Neither trait because it is lethal
- id: c
  en: Only the dominant trait
- id: d
  en: Both parental traits expressed side by side
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.13B58DF6663E
  when_answer_equals:
  - a
- id: MC.A.9E5A9EBC9E0C
  when_answer_equals:
  - c
- id: MC.A.54EFC3D41A04
  when_answer_equals:
  - b
solution_steps:
- en: In codominance both alleles produce their own products, so both traits appear together, as in the roan coat of cattle or the AB blood group.
- en: A blend is the incomplete dominance pattern instead.
- en: The correct option is d.
tier: C
