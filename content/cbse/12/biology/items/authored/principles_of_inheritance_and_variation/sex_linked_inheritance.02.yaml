id: A.12.biology.principles_of_inheritance_and_variation.sex_linked_inheritance.02
skill_ids:
- SK.A.12.biology.sex_linked_inheritance
difficulty: 0.2
pool: practice
role: explain
stem:
  en: Why do X-linked recessive disorders appear more often in males?
hints:
- level: 1
  en: Count how many X chromosomes a male carries compared with a female.
- level: 2
  en: Consider whether a second copy can mask a recessive allele.
- level: 3
  en: Think about what happens when the Y chromosome has no matching allele.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A male has one X, so a single recessive allele is expressed
- id: b
  en: Males have a stronger immune response to the allele
- id: c
  en: Males inherit the disorder only from their mothers
- id: d
  en: Females carry lethal copies of the allele
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.24D8AE25741D
  when_answer_equals:
  - b
- id: MC.A.86EE2B39804B
  when_answer_equals:
  - d
- id: MC.A.1A50D2C339D9
  when_answer_equals:
  - c
solution_steps:
- en: Males have only one X chromosome, so a single copy of a recessive allele is enough to show the trait.
- en: A female needs two copies of the recessive allele to show the trait, so one copy leaves her a carrier.
- en: The correct option is a.
tier: C
