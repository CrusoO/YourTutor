stem:
  en: Two genes show a recombination frequency of 10 percent. What is their map distance in centimorgans? Give the number only.
hints:
- level: 1
  en: Check how the map unit is defined in terms of recombination.
- level: 2
  en: Map units are defined by the rate of crossing over.
- level: 3
  en: Apply the definition directly without rescaling the value.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
