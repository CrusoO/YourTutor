id: A.12.biology.principles_of_inheritance_and_variation.mendels_laws.05
skill_ids:
- SK.A.12.biology.mendels_laws
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: An individual with an unknown genotype is test crossed and gives a 1:1 ratio of dominant to recessive offspring. What is the most likely genotype of the unknown parent?
hints:
- level: 1
  en: Count how many dominant gametes the unknown parent could produce.
- level: 2
  en: Compare the outcome with the expected ratio for each candidate genotype.
- level: 3
  en: Remember that the tester contributes only recessive alleles.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Homozygous recessive
- id: b
  en: Homozygous dominant
- id: c
  en: Heterozygous
- id: d
  en: Triploid
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.6ED1819B531C
  when_answer_equals:
  - b
- id: MC.A.77E54ED4AED5
  when_answer_equals:
  - a
- id: MC.A.EB7CF73EB3F8
  when_answer_equals:
  - d
solution_steps:
- en: A heterozygote crossed with a recessive tester gives half dominant and half recessive offspring.
- en: A homozygous dominant parent would give only dominant offspring.
- en: The correct option is c.
tier: C
