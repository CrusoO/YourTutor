id: A.12.biology.principles_of_inheritance_and_variation.incomplete_dominance_multiple_alleles.04
skill_ids:
- SK.A.12.biology.incomplete_dominance_multiple_alleles
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A child has blood type O, and the mother has blood type A. What genotype must the mother have?
hints:
- level: 1
  en: A type O child must have the genotype ii.
- level: 2
  en: So each parent must have passed on an i allele.
- level: 3
  en: Check which genotypes for type A include an i allele.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: AA
- id: b
  en: BB
- id: c
  en: AO
- id: d
  en: ii
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.9F7D6DC29495
  when_answer_equals:
  - a
- id: MC.A.6BEA5FE2E9EE
  when_answer_equals:
  - b
- id: MC.A.070B16C96D63
  when_answer_equals:
  - d
solution_steps:
- en: A type O child is ii, so each parent must pass on an i allele.
- en: A type A mother who carries an i allele must be AO, since AA would not give her child an i.
- en: The correct option is c.
tier: C
diagram_note: Draw a Punnett square for the mother and father in the ABO cross, with each parent's gametes along the edges and the child genotypes and blood groups in the cells.
