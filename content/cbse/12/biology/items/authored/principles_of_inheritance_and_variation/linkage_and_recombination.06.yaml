id: A.12.biology.principles_of_inheritance_and_variation.linkage_and_recombination.06
skill_ids:
- SK.A.12.biology.linkage_and_recombination
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A parent with genotype AB/ab is testcrossed with ab/ab, and the two loci are 20 cM apart. What percentage of the offspring are recombinant? Give the number only.
hints:
- level: 1
  en: Check which gametes of the heterozygote differ from the parental combinations.
- level: 2
  en: Compare the gamete classes that are not parental.
- level: 3
  en: Relate the map distance to the proportion of crossover gametes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '20'
  accept: []
solution_steps:
- en: Twenty cM means 20 percent of the gametes from the heterozygote are recombinant, and the testcross reflects those gametes directly.
- en: The unit of the answer is %.
- en: Answer = 20
tier: C
diagram_note: Show two homologous chromosomes in the AB/ab heterozygote with a crossover between the two loci, and list the four gamete types with parental and recombinant classes marked.
