id: A.12.biology.principles_of_inheritance_and_variation.sex_linked_inheritance.06
skill_ids:
- SK.A.12.biology.sex_linked_inheritance
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Consider a cross between a carrier mother and an affected father for an X-linked recessive trait. What share, as a percentage, of the daughters is expected to show the trait? Give the number only.
hints:
- level: 1
  en: Note which X every daughter receives from the father.
- level: 2
  en: Check which of the mother's gametes gives a daughter two recessive copies.
- level: 3
  en: Keep the count at the level of daughters only.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '50'
  accept: []
solution_steps:
- en: Every daughter gets the father's affected X, and half of them also get the mother's recessive X, so half of the daughters are affected.
- en: The unit of the answer is %.
- en: Answer = 50
tier: C
diagram_note: Draw a Punnett square for a carrier mother by an affected father, labelling the daughter and son genotypes in each cell.
