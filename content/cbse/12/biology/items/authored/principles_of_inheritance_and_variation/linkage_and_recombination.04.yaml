id: A.12.biology.principles_of_inheritance_and_variation.linkage_and_recombination.04
skill_ids:
- SK.A.12.biology.linkage_and_recombination
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Two genes lie 15 cM apart. In a testcross with 2000 offspring, how many are expected to be recombinant? Give the count only.
hints:
- level: 1
  en: Convert the map distance into a recombination fraction.
- level: 2
  en: Apply that fraction to the total number of offspring.
- level: 3
  en: Check that the answer is a count of offspring.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '300'
  accept: []
solution_steps:
- en: A map distance of 15 cM means 15 percent recombinant gametes, and 15 percent of 2000 is 300.
- en: Answer = 300
tier: C
diagram_note: Draw a chromosome with two loci 15 cM apart, a crossover point between them, and the four gamete types produced.
