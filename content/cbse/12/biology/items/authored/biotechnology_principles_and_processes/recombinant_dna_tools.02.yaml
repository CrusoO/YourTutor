role: explain
stem:
  en: What is the role of DNA ligase in recombinant DNA technology?
hints:
- level: 1
  en: Think about what must be sealed after the vector and gene are cut.
- level: 2
  en: Consider the type of bond that must form between fragments.
- level: 3
  en: Separate the joining step from the cutting and separating steps.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It separates fragments by size
- id: b
  en: It cuts the vector at its origin of replication
- id: c
  en: It copies the gene into RNA
- id: d
  en: It joins cut DNA fragments by forming phosphodiester bonds
answer:
  sympy: d
  accept: []
