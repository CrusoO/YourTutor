id: A.12.biology.biotechnology_principles_and_processes.rdna_process.04
skill_ids:
- SK.A.12.biology.rdna_process
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Transformed bacteria grow on a plate with no antibiotic. What does this growth show about the insert?
hints:
- level: 1
  en: Consider which step checks for successful uptake of the vector.
- level: 2
  en: Think about what the antibiotic in the medium would select for.
- level: 3
  en: Ask whether growth on this plate distinguishes transformed cells from the rest.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The bacteria are dead
- id: b
  en: The vector was not replicated
- id: c
  en: Every colony must carry the insert
- id: d
  en: Growth does not confirm the insert, because bacteria with or without the vector can grow
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.AEE7BBE36638
  when_answer_equals:
  - c
- id: MC.A.64E6635BCB34
  when_answer_equals:
  - b
- id: MC.A.9C3B6F22163C
  when_answer_equals:
  - a
solution_steps:
- en: Without an antibiotic, bacteria that did not take up the vector also grow, so the plate does not select recombinant cells.
- en: A selective medium and a check of the insert are needed.
- en: The correct option is d.
tier: C
