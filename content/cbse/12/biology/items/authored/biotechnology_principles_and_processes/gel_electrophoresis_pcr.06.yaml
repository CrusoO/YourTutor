id: A.12.biology.biotechnology_principles_and_processes.gel_electrophoresis_pcr.06
skill_ids:
- SK.A.12.biology.gel_electrophoresis_pcr
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A 1000 bp fragment travels 2 cm in a gel, and a 500 bp fragment travels 4 cm in the same gel. Assuming each halving of size adds the same distance, how many cm does a 250 bp fragment travel? Give the number only.
hints:
- level: 1
  en: Note how the distance changes each time the fragment size halves.
- level: 2
  en: Extend the same pattern to the next halving.
- level: 3
  en: Check that your unit is centimetres.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: Each halving of fragment size adds 2 cm of travel, so the 250 bp fragment moves 4 cm plus 2 cm, which is 6 cm.
- en: The unit of the answer is cm.
- en: Answer = 6
tier: C
diagram_note: Sketch a gel with a ladder lane and a sample lane, marking the distance from the well to each band.
