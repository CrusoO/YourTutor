stem:
  en: Which host is commonly used to produce a recombinant protein on a large scale?
hints:
- level: 1
  en: Think about a fast growing bacterium used in many laboratories.
- level: 2
  en: Consider a host that grows cheaply in large fermenters.
- level: 3
  en: Ask which host is a prokaryote used widely in genetic engineering.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
