difficulty: 0.2
pool: practice
role: explain
stem:
  en: Why does DNA move toward the positive electrode during gel electrophoresis?
hints:
- level: 1
  en: Think about the charge carried by the phosphate groups.
- level: 2
  en: Consider what happens to a charged molecule in an electric field.
- level: 3
  en: Separate the reason for movement from the reason for sieving.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Its bases carry a positive charge
- id: b
  en: Its sugar phosphate backbone carries a net negative charge
- id: c
  en: Its size makes it float upward in the gel
- id: d
  en: The gel carries positive ions that pull DNA in
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.C28A82ADBD18
  when_answer_equals:
  - a
- id: MC.A.8317A4CD3330
  when_answer_equals:
  - d
- id: MC.A.5616FB52DCD6
  when_answer_equals:
  - c
solution_steps:
- en: The phosphate groups of DNA are negatively charged, so the molecule moves toward the positive electrode in an electric field.
- en: The gel sieves the fragments by size as they move.
- en: The correct option is b.
tier: C
