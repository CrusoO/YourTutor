difficulty: 0.9
pool: practice
role: apply
stem:
  en: A recombinant plasmid of 6000 bp contains a 1500 bp insert. How many base pairs belong to the vector backbone? Give the count only.
hints:
- level: 1
  en: Subtract the insert length from the total plasmid length.
- level: 2
  en: State the answer in base pairs.
- level: 3
  en: Check that the insert is inside the total length.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4500'
  accept: []
solution_steps:
- en: Subtracting the 1500 bp insert from the 6000 bp plasmid leaves 4500 bp of vector backbone.
- en: The unit of the answer is bp.
- en: Answer = 4500
tier: C
diagram_note: Draw a circular plasmid with the vector backbone and an inserted gene segment marked, and label the lengths of each part.
