  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: To cut the vector at its origin
- id: b
  en: To identify cells that have taken up the recombinant plasmid
- id: c
  en: To degrade foreign DNA in the host
- id: d
  en: To increase the size of the insert
