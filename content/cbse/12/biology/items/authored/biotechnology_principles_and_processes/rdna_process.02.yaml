difficulty: 0.2
pool: practice
role: explain
stem:
  en: Why is a selectable marker included in a cloning vector?
hints:
- level: 1
  en: Think about how transformed cells can be told apart from the rest.
- level: 2
  en: Consider a gene that lets cells survive on a specific medium.
- level: 3
  en: Focus on what the marker lets the researcher detect.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
