stem:
  en: A circular plasmid of 5000 base pairs is cut at 3 sites. How many fragments result? Give the count only.
hints:
- level: 1
  en: Consider how the number of cuts relates to the fragments in a circular molecule.
- level: 2
  en: Check whether the molecule is circular or linear.
- level: 3
  en: Count the arcs between neighbouring cuts.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: A circular molecule cut at three sites gives three fragments, because each pair of adjacent cuts defines one fragment.
- en: Answer = 3
tier: C
diagram_note: Draw a circular plasmid of 5000 base pairs with three restriction sites marked and the resulting fragments labelled.
