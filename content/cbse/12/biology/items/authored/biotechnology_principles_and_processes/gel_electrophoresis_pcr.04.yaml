id: A.12.biology.biotechnology_principles_and_processes.gel_electrophoresis_pcr.04
skill_ids:
- SK.A.12.biology.gel_electrophoresis_pcr
difficulty: 0.6
pool: practice
role: apply
stem:
  en: On a gel image with the wells at the top, which DNA fragments travel farthest from the wells?
hints:
- level: 1
  en: Consider how a gel sieves molecules by size.
- level: 2
  en: Think about which molecules pass through the mesh more easily.
- level: 3
  en: Compare the distance travelled by fragments of different sizes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Fragments of equal length in every lane
- id: b
  en: Only fragments with high GC content
- id: c
  en: The largest fragments
- id: d
  en: The smallest fragments
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.BC5117F34A61
  when_answer_equals:
  - c
- id: MC.A.1DD78718C1EE
  when_answer_equals:
  - a
- id: MC.A.32687D1DBB7E
  when_answer_equals:
  - b
solution_steps:
- en: The gel acts as a sieve, so smaller fragments pass through the pores more easily and travel farther from the wells.
- en: Larger fragments remain closer to the wells.
- en: The correct option is d.
tier: C
diagram_note: Draw an agarose gel with wells at the top, a ladder lane on the left, two sample lanes and labelled bands by size, with an arrow showing migration toward the positive electrode at the bottom.
