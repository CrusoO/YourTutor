id: A.12.biology.biotechnology_principles_and_processes.recombinant_dna_tools.03
skill_ids:
- SK.A.12.biology.recombinant_dna_tools
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which feature makes a plasmid useful as a cloning vector?
hints:
- level: 1
  en: Think about what allows the vector to copy itself inside the host.
- level: 2
  en: Consider how you would identify cells that took up the vector.
- level: 3
  en: Ask which features the vector needs in order to be propagated and selected.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Complete absence of restriction sites
- id: b
  en: A histone core that protects the DNA
- id: c
  en: A linear shape without any origin
- id: d
  en: An origin of replication and a selectable marker
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.27624CDEA350
  when_answer_equals:
  - c
- id: MC.A.42E2EBDF750D
  when_answer_equals:
  - a
- id: MC.A.F725E73C66C7
  when_answer_equals:
  - b
solution_steps:
- en: An origin of replication lets the vector copy itself inside the host, and a selectable marker identifies cells that took it up.
- en: Restriction sites are needed for inserting genes.
- en: The correct option is d.
tier: C
