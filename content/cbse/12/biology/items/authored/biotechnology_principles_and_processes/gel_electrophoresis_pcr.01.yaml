difficulty: 0.2
pool: practice
role: recall
stem:
  en: In PCR, which step separates the two strands of the template DNA?
hints:
- level: 1
  en: Think about the step that uses the highest temperature in each cycle.
- level: 2
  en: Consider which step breaks hydrogen bonds between the two strands.
- level: 3
  en: Separate the strand separation step from the primer binding and building steps.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Annealing of primers at low temperature
- id: b
  en: Extension by the polymerase
- id: c
  en: Denaturation at high temperature
- id: d
  en: Ligation of fragments
answer:
  sympy: c
  accept: []
misconception_rules:
