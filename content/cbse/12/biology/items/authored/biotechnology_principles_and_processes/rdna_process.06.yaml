id: A.12.biology.biotechnology_principles_and_processes.rdna_process.06
skill_ids:
- SK.A.12.biology.rdna_process
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A ligation mixes one vector with three different insert fragments, and each insert joins the vector once. How many distinct recombinant plasmids are possible? Give the count only.
hints:
- level: 1
  en: Consider each insert as one choice.
- level: 2
  en: Count the choices for the single vector slot.
- level: 3
  en: Check whether any two inserts give the same plasmid.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: Each of the three different inserts can join the single vector in one way, so three distinct recombinant plasmids are possible.
- en: Answer = 3
tier: C
diagram_note: Sketch a vector cut at one site and three different insert fragments with matching ends, labelled one to three.
