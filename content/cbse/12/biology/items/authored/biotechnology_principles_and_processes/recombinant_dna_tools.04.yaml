id: A.12.biology.biotechnology_principles_and_processes.recombinant_dna_tools.04
skill_ids:
- SK.A.12.biology.recombinant_dna_tools
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A restriction enzyme has a site on average every 4096 base pairs. How many cut sites are expected in a DNA molecule of 40960 base pairs? Give the count only.
hints:
- level: 1
  en: Divide the DNA length by the average spacing between sites.
- level: 2
  en: Check that the spacing and length are in base pairs.
- level: 3
  en: Keep the answer as a count of sites.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10'
  accept: []
solution_steps:
- en: Dividing 40960 base pairs by the average spacing of 4096 gives 10 expected cut sites.
- en: Answer = 10
tier: C
diagram_note: Draw a circular plasmid with one cut site marked, and a linear DNA molecule with several cut sites marked along its length.
