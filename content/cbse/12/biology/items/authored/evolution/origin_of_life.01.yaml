stem:
  en: Which experiment showed that amino acids can form from simple gases under conditions meant to mimic early Earth?
hints:
- level: 1
  en: Think about an apparatus that circulated gases and passed sparks through them.
- level: 2
  en: The set-up imitated a reducing atmosphere with electric discharges.
- level: 3
  en: Focus on the experiment that produced biological building blocks.
