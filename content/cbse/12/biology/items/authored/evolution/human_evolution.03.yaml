difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which evidence best establishes the age of early hominin fossils?
hints:
- level: 1
  en: Think about how rock layers can be dated using isotopes.
- level: 2
  en: Consider evidence drawn from the deposits around the fossil.
- level: 3
  en: Separate evidence from the fossil itself from evidence from the surrounding rock.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Measuring the colour of the skull
- id: b
  en: Counting the number of teeth in a fossil jaw
- id: c
  en: Comparing only the diet of living apes
- id: d
  en: Radiometric dating of volcanic layers surrounding the fossils
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.99C8C3D1A35A
  when_answer_equals:
  - b
- id: MC.A.6C46A6AADF5A
  when_answer_equals:
