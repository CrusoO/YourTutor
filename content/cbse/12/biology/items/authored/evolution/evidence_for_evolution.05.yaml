id: A.12.biology.evolution.evidence_for_evolution.05
skill_ids:
- SK.A.12.biology.evidence_for_evolution
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Two species have wings used for flight, but their skeletons differ strongly. Which conclusion is best supported?
hints:
- level: 1
  en: Compare the bone structure with the function of the wing.
- level: 2
  en: Ask whether the shared feature comes from a common plan or from similar pressures.
- level: 3
  en: Check whether the skeletons follow the same bone pattern.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Their wings are vestigial and no longer used for flight
- id: b
  en: Their skeletons prove they belong to the same species
- id: c
  en: Their wings are homologous, showing recent common ancestry
- id: d
  en: Their wings are analogous, with a similar function from different origins
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.60E30DAE3AF4
  when_answer_equals:
  - c
- id: MC.A.1711B0990036
  when_answer_equals:
  - a
- id: MC.A.2D908D4BF936
  when_answer_equals:
  - b
solution_steps:
- en: Similar function with different skeletal plans suggests convergent evolution, so the wings are analogous.
- en: Homology would require the same underlying bone plan.
- en: The correct option is d.
tier: C
