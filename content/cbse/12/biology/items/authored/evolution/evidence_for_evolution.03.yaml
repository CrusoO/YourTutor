stem:
  en: In one fossil layer, 60 percent of the organisms are type X and 40 percent are type Y. If 1200 fossils are counted from this layer, how many are type X? Give the count only.
hints:
- level: 1
  en: Convert the percentage into a fraction.
- level: 2
  en: Multiply that fraction by the total fossil count.
- level: 3
  en: Check that type X and type Y together account for the whole count.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
