id: A.12.biology.evolution.origin_of_life.05
skill_ids:
- SK.A.12.biology.origin_of_life
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Hydrothermal vents are proposed as a site where early life may have begun. Which argument supports this idea?
hints:
- level: 1
  en: Consider what energy and materials a vent supplies to its surroundings.
- level: 2
  en: Think about how surfaces and gradients could concentrate molecules.
- level: 3
  en: Ask which feature of a vent would favour building larger molecules.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Vents are cold and dark, which prevents any chemistry
- id: b
  en: Vents supply no energy or chemicals at all
- id: c
  en: Chemical gradients and mineral surfaces could concentrate molecules and drive early chemistry
- id: d
  en: Vents exist only on land far from water
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.FAE34B8E2DD1
  when_answer_equals:
  - b
- id: MC.A.940D2C407F65
  when_answer_equals:
  - a
- id: MC.A.2F8A198DB18F
  when_answer_equals:
  - d
solution_steps:
- en: Vents release chemicals and create steep gradients, and their mineral surfaces may have helped concentrate and link molecules.
- en: These features make them plausible settings for early chemistry.
- en: The correct option is c.
tier: C
