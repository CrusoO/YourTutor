stem:
  en: A hominin lineage splits into three lineages every million years, starting from one lineage. How many lineages exist after four million years? Give the count only.
hints:
- level: 1
  en: Count how many splits occur in four million years.
- level: 2
  en: Each split triples the number of lineages.
- level: 3
  en: Apply the tripling once for each split.
