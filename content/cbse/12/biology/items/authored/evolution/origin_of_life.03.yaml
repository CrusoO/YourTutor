id: A.12.biology.evolution.origin_of_life.03
skill_ids:
- SK.A.12.biology.origin_of_life
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which property would an early self-replicating molecule need for natural selection to begin acting on it?
hints:
- level: 1
  en: Think about what differences between copies would let some survive better.
- level: 2
  en: Consider whether copies must differ to be selected at all.
- level: 3
  en: Focus on differences that are passed to the next copies.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Heritable variation in the copies it makes
- id: b
  en: A membrane that protects it from light
- id: c
  en: A fixed sequence that never changes
- id: d
  en: A large size that allows it to be read
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.C55037493109
  when_answer_equals:
  - c
- id: MC.A.809C153BEABB
  when_answer_equals:
  - b
- id: MC.A.0373A161B55C
  when_answer_equals:
  - d
solution_steps:
- en: Selection needs differences among copies that are passed on, so the copies must vary in ways that are inherited.
- en: Without heritable variation, nothing can be selected.
- en: The correct option is a.
tier: C
