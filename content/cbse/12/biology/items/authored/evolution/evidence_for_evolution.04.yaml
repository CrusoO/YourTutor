id: A.12.biology.evolution.evidence_for_evolution.04
skill_ids:
- SK.A.12.biology.evidence_for_evolution
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Limb diagrams show the same bone arrangement in a whale flipper and a human arm. What does this best indicate?
hints:
- level: 1
  en: Compare the arrangement of the bones rather than the outside shape of the limb.
- level: 2
  en: Think about the inheritance pattern that would produce the same bone plan.
- level: 3
  en: Ask whether the similarity is in the skeletal plan or only in the function.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Common ancestry with the same skeletal plan adapted to different uses
- id: b
  en: Independent evolution of flippers from fish fins
- id: c
  en: The flipper is a vestigial form of the arm
- id: d
  en: Whales are descended from humans
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.FC016B8B83C5
  when_answer_equals:
  - b
- id: MC.A.9FE44F8D0BDB
  when_answer_equals:
  - d
- id: MC.A.F54BB2E7186D
  when_answer_equals:
  - c
solution_steps:
- en: The same bones in the same arrangement, adapted for swimming in one case and grasping in the other, point to shared ancestry.
- en: This is the defining mark of homology.
- en: The correct option is a.
tier: C
diagram_note: Draw a human arm and a whale flipper side by side showing the humerus, radius, ulna, carpals and phalanges, with matching bones colour coded.
