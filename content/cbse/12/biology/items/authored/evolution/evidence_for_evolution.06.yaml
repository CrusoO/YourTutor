difficulty: 0.9
pool: practice
role: apply
stem:
  en: Three related species each carry 5 homologous bones in the forelimb. How many homologous bone elements are counted across the three species? Give the count only.
hints:
- level: 1
  en: Count the bones in one species first.
- level: 2
  en: Multiply that count by the number of species.
- level: 3
  en: Keep the answer as a count of bone elements.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '15'
  accept: []
solution_steps:
- en: Three species with 5 bones each give 15 homologous bone elements in total.
- en: Answer = 15
tier: C
diagram_note: Draw forelimb skeletons of three species side by side, with the five homologous bones shaded in matching colours.
