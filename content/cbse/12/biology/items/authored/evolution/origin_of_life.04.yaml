stem:
  en: A protocell model assumes that one molecule doubles every 2 hours. Starting from one molecule, how many molecules exist after 10 hours? Give the count only.
hints:
- level: 1
  en: Count how many doublings fit into 10 hours.
- level: 2
  en: Each doubling multiplies the count by two.
- level: 3
  en: Keep the answer as a count of molecules.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '32'
  accept: []
solution_steps:
- en: Ten hours contains five doublings of two hours each, and two to the power five is 32.
- en: Answer = 32
tier: C
