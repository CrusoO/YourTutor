id: A.12.biology.evolution.evidence_for_evolution.02
skill_ids:
- SK.A.12.biology.evidence_for_evolution
difficulty: 0.2
pool: practice
role: explain
stem:
  en: What do analogous structures indicate about the organisms that have them?
hints:
- level: 1
  en: Think about the pressure that favours a shared function in unrelated groups.
- level: 2
  en: Consider whether the structure is inherited from a common ancestor or evolved separately.
- level: 3
  en: Ask whether the shared feature reflects a common plan or a common job.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: That the structure is vestigial and no longer used
- id: b
  en: Descent from the same fossil ancestor only
- id: c
  en: Shared ancestry through a common bone plan
- id: d
  en: Similar function arising from convergent evolution rather than shared ancestry
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.FCAF0415F47A
  when_answer_equals:
  - c
- id: MC.A.517C7828B7F5
  when_answer_equals:
  - b
- id: MC.A.A21FFBB1176A
  when_answer_equals:
  - a
solution_steps:
- en: Analogous structures do similar jobs but evolved separately under similar pressures, which is convergent evolution.
- en: Their similarity does not show a shared ancestral form.
- en: The correct option is d.
tier: C
