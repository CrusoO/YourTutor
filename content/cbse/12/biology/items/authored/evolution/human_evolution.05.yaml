id: A.12.biology.evolution.human_evolution.05
skill_ids:
- SK.A.12.biology.human_evolution
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A fossil hominin has a small brain but a fully bipedal walking gait. What is the best inference about the order of these traits?
hints:
- level: 1
  en: Think about which traits the fossil already shows.
- level: 2
  en: Consider which trait is missing from the fossil.
- level: 3
  en: Ask which trait is recorded in the skeleton and which in the skull.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Bipedalism evolved before large brain expansion
- id: b
  en: Brain expansion came first, followed by bipedalism
- id: c
  en: Bipedalism was lost in all later hominins
- id: d
  en: Tool use appeared before any bipedalism
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.61B861622181
  when_answer_equals:
  - b
- id: MC.A.AB88C3CEDAFE
  when_answer_equals:
  - c
- id: MC.A.AC0A8C8EBBDB
  when_answer_equals:
  - d
solution_steps:
- en: The fossil already walks upright while its brain is still small, so bipedalism came before the large brain expansion seen later in Homo.
- en: Upright walking is recorded in the skeleton, while brain size is a separate trait.
- en: The correct option is a.
tier: C
