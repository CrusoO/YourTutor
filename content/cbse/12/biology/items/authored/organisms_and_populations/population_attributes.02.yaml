difficulty: 0.2
pool: practice
role: explain
stem:
  en: Which factor increases the size of a population most directly?
hints:
- level: 1
  en: Think about what adds new individuals to the population.
- level: 2
  en: Consider which rates appear in the balance of growth.
- level: 3
  en: Separate births and deaths from movement in and out.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Natality exceeding mortality
- id: b
  en: A constant density over time
- id: c
  en: Mortality exceeding natality
- id: d
  en: Emigration only
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.3A22C4763D6E
  when_answer_equals:
  - c
- id: MC.A.743875B7F4E5
  when_answer_equals:
