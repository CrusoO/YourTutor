id: A.12.biology.organisms_and_populations.organism_environment.05
skill_ids:
- SK.A.12.biology.organism_environment
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A lake warms because of climate change, and a cold adapted fish species is affected. What is the most likely population response?
hints:
- level: 1
  en: Think about where a cold adapted species can persist as temperatures rise.
- level: 2
  en: Consider the direction a population moves to track its preferred temperature.
- level: 3
  en: Ask which option is consistent with a species that tolerates only a narrow range.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Its range shifts toward cooler deeper or higher latitude waters
- id: b
  en: It turns into a different species of plant
- id: c
  en: Its range expands into warmer shallow areas only
- id: d
  en: It stops reproducing completely
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.D42022A8778B
  when_answer_equals:
  - c
- id: MC.A.A3BF74EC6D03
  when_answer_equals:
  - d
- id: MC.A.51D4C97CD2E8
  when_answer_equals:
  - b
solution_steps:
- en: A cold adapted species tends to move toward the parts of its habitat that remain within its tolerance, such as deeper or cooler water or higher latitudes.
- en: Expansion into warm areas usually fails.
- en: The correct option is a.
tier: C
