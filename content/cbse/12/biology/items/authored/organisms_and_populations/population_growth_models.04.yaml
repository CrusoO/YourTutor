id: A.12.biology.organisms_and_populations.population_growth_models.04
skill_ids:
- SK.A.12.biology.population_growth_models
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A logistic population has N equal to 300 and carrying capacity K equal to 1000. What is the value of 1 minus N divided by K? Give the number only.
hints:
- level: 1
  en: Divide the population by the carrying capacity first.
- level: 2
  en: Subtract that ratio from one.
- level: 3
  en: Keep the answer as a decimal fraction.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.7'
  accept: []
solution_steps:
- en: N divided by K is 0.3, and 1 minus 0.3 is 0.7.
- en: Answer = 0.7
tier: C
diagram_note: Sketch a sigmoid logistic curve with a horizontal carrying capacity line K and mark the point where N equals 300.
