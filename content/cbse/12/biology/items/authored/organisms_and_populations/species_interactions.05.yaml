stem:
  en: A cuckoo lays its eggs in the nest of another bird, which then raises the cuckoo's chick. Which interaction is this?
hints:
- level: 1
  en: Consider whether the host bird is harmed by the interaction.
- level: 2
  en: Think about which species gains and at what cost.
- level: 3
  en: Separate interactions where one species raises the other's young from those where both benefit.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
