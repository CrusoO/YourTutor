id: A.12.biology.organisms_and_populations.species_interactions.03
skill_ids:
- SK.A.12.biology.species_interactions
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Lichens are a partnership between a fungus and an alga. Which interaction does this describe?
hints:
- level: 1
  en: Think about whether both partners gain from the association.
- level: 2
  en: Consider which interaction describes a partnership with reciprocal benefit.
- level: 3
  en: Separate reciprocal partnerships from interactions where one partner is harmed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Parasitism
- id: b
  en: Amensalism
- id: c
  en: Mutualism
- id: d
  en: Competition
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.BCF4402E0A1C
  when_answer_equals:
  - a
- id: MC.A.27D0FE0EA000
  when_answer_equals:
  - d
- id: MC.A.C2A75F557367
  when_answer_equals:
  - b
solution_steps:
- en: The fungus gets water and minerals while the alga gets a protected environment and some food from its photosynthesis, so both partners benefit.
- en: This is the defining feature of mutualism.
- en: The correct option is c.
tier: C
