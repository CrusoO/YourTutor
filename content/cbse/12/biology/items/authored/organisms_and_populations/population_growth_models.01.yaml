difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which growth model assumes unlimited resources and produces a J-shaped curve?
hints:
- level: 1
  en: Think about growth with a constant per capita rate and no limit.
- level: 2
  en: Consider the shape of the curve that results from unlimited growth.
- level: 3
  en: Separate the models with a limit from those without one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Exponential growth
- id: b
  en: Stable equilibrium
- id: c
  en: Random walk
- id: d
  en: Logistic growth
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.7B2323E06FDD
  when_answer_equals:
  - d
- id: MC.A.F34B42FACFDE
  when_answer_equals:
