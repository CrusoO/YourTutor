difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which adaptation helps a desert plant conserve water?
hints:
- level: 1
  en: Think about how the plant reduces water loss from its surface.
- level: 2
  en: Consider a feature that limits evaporation from the leaves.
- level: 3
  en: Separate structural features that conserve water from those that increase its loss.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A thick waxy cuticle and reduced leaf surface
- id: b
  en: Large broad leaves for shade
- id: c
  en: Constantly shallow roots
- id: d
  en: Continuous flowering with thin stems
answer:
  sympy: a
  accept: []
misconception_rules:
