id: A.12.biology.organisms_and_populations.population_growth_models.06
skill_ids:
- SK.A.12.biology.population_growth_models
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A logistic population has r equal to 0.5, N equal to 200 and K equal to 1000. What is the growth rate r times N times (1 minus N divided by K)? Give the number only.
hints:
- level: 1
  en: Compute the fraction of carrying capacity still available.
- level: 2
  en: Multiply r, N and that fraction together.
- level: 3
  en: Keep the answer in individuals per year.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '80'
  accept: []
solution_steps:
- en: The fraction still available is 0.8, and 0.5 times 200 times 0.8 gives 80 individuals per year.
- en: The unit of the answer is individuals per year.
- en: Answer = 80
tier: C
diagram_note: Sketch a sigmoid curve and mark the current population on the lower part of the curve with its slope indicated by a short tangent line.
