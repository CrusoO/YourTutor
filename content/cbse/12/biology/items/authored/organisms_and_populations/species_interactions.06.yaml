stem:
  en: A community of 80 species includes 20 predator species and 60 other species. What percentage of the species are predators? Give the number only.
hints:
- level: 1
  en: Divide the predator count by the total number of species.
- level: 2
  en: Multiply the result by one hundred.
- level: 3
  en: Check the answer is a percentage of the whole community.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
