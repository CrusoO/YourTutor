difficulty: 0.6
pool: practice
role: apply
stem:
  en: Natality is 40 per 1000 individuals per year and mortality is 25 per 1000 per year. What is the natural increase in individuals per 1000 per year? Give the number only.
hints:
- level: 1
  en: Subtract mortality from natality.
- level: 2
  en: Keep the units as per 1000 individuals per year.
- level: 3
  en: Check that the answer is a rate, not a count.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '15'
  accept: []
solution_steps:
- en: Natural increase is natality minus mortality, which is 40 minus 25, giving 15 per 1000 per year.
- en: The unit of the answer is per 1000 per year.
- en: Answer = 15
tier: C
