stem:
  en: A population of 800 has a birth rate of 0.05 per individual per year and a death rate of 0.03 per individual per year. What is the expected number of births minus deaths in one year? Give the count only.
hints:
- level: 1
  en: Compute the net per capita rate first.
- level: 2
  en: Apply the net rate to the starting population.
- level: 3
  en: Keep the answer as a count of individuals.
