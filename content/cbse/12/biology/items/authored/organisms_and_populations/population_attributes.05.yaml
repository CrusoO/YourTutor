difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A population starts at 400 with 40 births and 20 deaths in a year. Immigration adds 30 individuals and emigration removes 10. What is the final population? Give the count only.
hints:
- level: 1
  en: Add every incoming individual and subtract every outgoing one.
- level: 2
  en: Check that each event is counted once.
- level: 3
  en: Keep the answer as a count of individuals.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '440'
  accept: []
solution_steps:
- en: 400 plus 40 minus 20 plus 30 minus 10 gives 440 individuals at the end of the year.
- en: Answer = 440
tier: C
