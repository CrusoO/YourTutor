stem:
  en: Which adaptation helps an aquatic animal obtain oxygen from water with low oxygen levels?
hints:
- level: 1
  en: Think about the organ that exchanges gases with water.
- level: 2
  en: Consider how the surface area of an exchange organ affects oxygen uptake.
- level: 3
  en: Compare how the organ extracts gas from water rather than air.
