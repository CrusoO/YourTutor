id: A.12.biology.organisms_and_populations.population_attributes.03
skill_ids:
- SK.A.12.biology.population_attributes
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A population of 1200 individuals has 150 births and 90 deaths in a year, with no migration. What is the per capita growth rate? Give the number only.
hints:
- level: 1
  en: Compute the net change from births and deaths first.
- level: 2
  en: Divide the net change by the starting population.
- level: 3
  en: Keep the answer as a rate per individual.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.05'
  accept: []
solution_steps:
- en: The net change is 150 minus 90, which is 60, and 60 divided by 1200 gives 0.05 per individual per year.
- en: Answer = 0.05
tier: C
