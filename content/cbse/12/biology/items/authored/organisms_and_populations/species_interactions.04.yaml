difficulty: 0.6
pool: practice
role: apply
stem:
  en: Two species use the same limited food, and both populations decline. Which interaction does this describe?
hints:
- level: 1
  en: Think about both species being harmed by shared resource use.
- level: 2
  en: Consider which interaction causes harm to both species.
- level: 3
  en: Separate interactions that harm both partners from those that help or harm only one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
