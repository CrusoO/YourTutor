difficulty: 0.2
pool: practice
role: explain
stem:
  en: Why are hybrid crop varieties often higher yielding than their parents?
hints:
- level: 1
  en: Think about what happens when two different lines are crossed.
- level: 2
  en: Consider whether hybrid offspring stay uniform in the next generation.
- level: 3
  en: Ask which option describes the boost in vigour seen in the first cross.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Heterosis, where the cross combines favourable traits and vigour
- id: b
  en: They are always polyploid
- id: c
  en: They breed true for every trait
- id: d
  en: They lack all genetic variation
answer:
  sympy: a
  accept: []
