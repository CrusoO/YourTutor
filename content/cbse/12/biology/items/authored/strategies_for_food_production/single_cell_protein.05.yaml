id: A.12.biology.strategies_for_food_production.single_cell_protein.05
skill_ids:
- SK.A.12.biology.single_cell_protein
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: An apiculture operation wants to improve pollination of nearby crops. Which action is most suitable?
hints:
- level: 1
  en: Think about where bees need to forage.
- level: 2
  en: Consider the timing of flowering relative to the hive location.
- level: 3
  en: Ask which option brings the pollinators to the flowers when they bloom.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Spraying insecticide inside the hive
- id: b
  en: Keeping hives sealed until harvest
- id: c
  en: Removing all flowers near the hives
- id: d
  en: Placing hives near the crop fields during flowering
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.0E4923FBEF86
  when_answer_equals:
  - c
- id: MC.A.11458014F8C8
  when_answer_equals:
  - b
- id: MC.A.D8343F69CD12
  when_answer_equals:
  - a
solution_steps:
- en: Bees forage on flowers near their hive, so placing hives close to the crop during flowering raises pollination.
- en: Actions that remove flowers or harm bees work against the goal.
- en: The correct option is d.
tier: C
