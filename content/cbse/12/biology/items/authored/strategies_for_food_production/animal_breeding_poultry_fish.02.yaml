difficulty: 0.2
pool: practice
role: explain
stem:
  en: Why is inbreeding used in some animal breeding programmes?
hints:
- level: 1
  en: Think about what happens to genetic diversity when relatives mate.
- level: 2
  en: Consider the trade-off between uniformity and vigour.
- level: 3
  en: Ask whether close mating makes animals more or less uniform.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: To fix desirable traits in pure lines, even though vigour falls
- id: b
  en: To create many genetic variants quickly
- id: c
  en: To reduce the time to sexual maturity
- id: d
  en: To increase heterosis in the first generation
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.C8ADBF347BC1
  when_answer_equals:
  - d
- id: MC.A.E1870A4454B3
  when_answer_equals:
