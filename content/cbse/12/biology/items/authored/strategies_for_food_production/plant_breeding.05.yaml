id: A.12.biology.strategies_for_food_production.plant_breeding.05
skill_ids:
- SK.A.12.biology.plant_breeding
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A breeder wants resistance to a disease found only in a wild relative of the crop. Which approach is most suitable?
hints:
- level: 1
  en: Think about how to move a gene from a relative into the crop.
- level: 2
  en: Consider how selection works on the offspring.
- level: 3
  en: Ask which option introduces new genetic material into the crop.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Crossing the crop with the wild relative and selecting resistant progeny
- id: b
  en: Using only clones of the crop
- id: c
  en: Growing the crop in sterile soil only
- id: d
  en: Applying an antibiotic to kill the disease
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.CEB08451A354
  when_answer_equals:
  - c
- id: MC.A.583F73993D81
  when_answer_equals:
  - b
- id: MC.A.F01C397F3E42
  when_answer_equals:
  - d
solution_steps:
- en: Crossing transfers the resistance gene from the wild relative into the crop, and selection among the progeny keeps the plants that carry it.
- en: Clones or environmental changes cannot add a new gene.
- en: The correct option is a.
tier: C
