stem:
  en: Two traits are each controlled by one dominant allele that assorts independently. In an F2 generation of 160 plants, how many show both dominant traits? Give the count only.
hints:
- level: 1
  en: Find the fraction showing dominance for each trait separately.
- level: 2
  en: Multiply the two fractions and apply the result to the total.
- level: 3
  en: Check that the answer is a whole number of plants.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
