stem:
  en: Which technique produces many genetically identical plants quickly from a single parent plant?
hints:
- level: 1
  en: Think about culturing small pieces of tissue on a nutrient medium.
- level: 2
  en: Consider a method that gives clones rather than new combinations.
- level: 3
  en: Separate cloning from crossing or mutation.
