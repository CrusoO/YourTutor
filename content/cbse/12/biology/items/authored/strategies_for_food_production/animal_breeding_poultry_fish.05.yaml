stem:
  en: A fish hatchery wants faster growth in its stock. Which strategy is best suited to this aim?
hints:
- level: 1
  en: Think about a selection method that is repeated across generations.
- level: 2
  en: Consider which trait the breeding goal targets.
- level: 3
  en: Ask whether the change is genetic or only environmental.
