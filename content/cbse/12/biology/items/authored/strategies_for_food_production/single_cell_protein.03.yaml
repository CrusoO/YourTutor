stem:
  en: A fermenter produces 2 kg of microbial biomass per day, which is 50 percent protein. How many kilograms of protein are produced per day? Give the number only.
hints:
- level: 1
  en: Convert the protein percentage into a fraction.
- level: 2
  en: Multiply the biomass by that fraction.
- level: 3
  en: Check that the unit is kilograms.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1'
  accept: []
solution_steps:
- en: Half of 2 kg is 1 kg of protein per day.
- en: The unit of the answer is kg.
- en: Answer = 1
tier: C
