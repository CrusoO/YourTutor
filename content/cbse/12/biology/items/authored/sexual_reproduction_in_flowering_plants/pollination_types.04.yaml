id: A.12.biology.sexual_reproduction_in_flowering_plants.pollination_types.04
skill_ids:
- SK.A.12.biology.pollination_types
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Some species rarely self-pollinate. Which feature of a flower is most directly responsible for limiting self-pollination in such species?
hints:
- level: 1
  en: Think about a barrier that stops a flower pollinating itself.
- level: 2
  en: Consider which feature separates the male and female parts in time.
- level: 3
  en: Ask whether the feature relates to timing or to attraction.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Bright petals that attract insects
- id: b
  en: Sticky pollen grains only
- id: c
  en: Large quantities of nectar
- id: d
  en: Stamens and stigma maturing at different times
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.A8E08C376262
  when_answer_equals:
  - a
- id: MC.A.1F195BF4AFB8
  when_answer_equals:
  - c
- id: MC.A.797538FDF542
  when_answer_equals:
  - b
solution_steps:
- en: When the stamens shed pollen before the stigma is receptive, or the reverse, a flower cannot easily pollinate itself.
- en: This is a timing barrier rather than an attraction feature.
- en: The correct option is d.
tier: C
