solution_steps:
- en: The hilum is the point where the funicle attaches to the ovule, and it later becomes the scar on the seed.
- en: The micropyle is the opening at the opposite end.
- en: The correct option is c.
tier: C
diagram_note: Draw a labelled anatropous ovule showing the funicle, hilum, micropyle, nucellus and embryo sac; mark the hilum where the funicle joins the ovule body.
