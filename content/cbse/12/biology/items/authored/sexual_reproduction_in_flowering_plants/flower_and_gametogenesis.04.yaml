stem:
  en: On a labelled diagram of an anatropous ovule, which point marks where the funicle joins the body of the ovule?
hints:
- level: 1
  en: Trace the stalk that attaches the ovule to the placenta.
- level: 2
  en: Compare this point with the small opening at the other end.
- level: 3
  en: Locate where the funicle meets the ovule body rather than the pore.
