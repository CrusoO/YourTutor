solution_steps:
- en: The large central cell contains the two polar nuclei, which fuse with a sperm nucleus to form the triploid endosperm nucleus.
- en: The egg apparatus and antipodals sit at other ends of the sac.
- en: The correct option is c.
tier: C
diagram_note: Draw an eight-nucleate embryo sac with the egg, two synergids and three antipodal cells at the ends and the large central cell holding two polar nuclei; label each group.
