stem:
  en: On a labelled diagram of a mature embryo sac, which cell holds two polar nuclei that fuse with a sperm nucleus?
hints:
- level: 1
  en: Locate the large central region of the sac.
- level: 2
  en: Count how many nuclei each cell group holds.
- level: 3
  en: Two nuclei sit in one large cell rather than in the small cells.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
