stem:
  en: A plant has 60 flowers, and 15 of them were self-pollinated. What percentage of the flowers were self-pollinated? Give the number only.
hints:
- level: 1
  en: Divide the self-pollinated count by the total number of flowers.
- level: 2
  en: Convert the resulting fraction into a percentage.
- level: 3
  en: Multiply by one hundred at the end.
