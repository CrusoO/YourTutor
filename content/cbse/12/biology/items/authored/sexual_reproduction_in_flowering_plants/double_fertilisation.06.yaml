stem:
  en: A pistil has 12 ovules, and each ovule holds one embryo sac with 8 nuclei. How many nuclei are present in all the embryo sacs together? Give the count only.
hints:
- level: 1
  en: Multiply the number of ovules by the nuclei in one sac.
- level: 2
  en: Check how many nuclei one mature sac holds.
- level: 3
  en: Keep the answer as a total count.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '96'
  accept: []
solution_steps:
- en: Twelve sacs with 8 nuclei each give 96 nuclei in total.
- en: Answer = 96
tier: C
diagram_note: Sketch a longitudinal section of an ovule showing the micropyle, the nucellus and an embryo sac with its eight nuclei, labelled.
