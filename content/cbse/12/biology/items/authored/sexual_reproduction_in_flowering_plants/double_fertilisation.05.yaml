id: A.12.biology.sexual_reproduction_in_flowering_plants.double_fertilisation.05
skill_ids:
- SK.A.12.biology.double_fertilisation
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A mutant plant forms a normal egg and zygote, but the second fertilisation event fails. What is the most likely consequence for the seed?
hints:
- level: 1
  en: Identify which product of the second fusion is missing.
- level: 2
  en: Think about what a young seed needs for early growth.
- level: 3
  en: The zygote can still form, so focus on the triploid tissue.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: No endosperm forms, so the embryo lacks stored food
- id: b
  en: The embryo develops with twice the normal chromosome number
- id: c
  en: Pollination fails completely
- id: d
  en: The seed becomes a fruit without any embryo
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.56CEF2DEB3B7
  when_answer_equals:
  - b
- id: MC.A.1D53A3868766
  when_answer_equals:
  - d
- id: MC.A.67BC81C8A798
  when_answer_equals:
  - c
solution_steps:
- en: The second fusion produces the triploid endosperm, which feeds the young embryo.
- en: Without it the zygote can still form but has no stored food supply.
- en: The correct option is a.
tier: C
