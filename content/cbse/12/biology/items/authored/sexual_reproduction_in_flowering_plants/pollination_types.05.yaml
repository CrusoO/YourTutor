id: A.12.biology.sexual_reproduction_in_flowering_plants.pollination_types.05
skill_ids:
- SK.A.12.biology.pollination_types
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A plant rejects pollen from its own flowers but accepts pollen from other plants. Which mechanism is most likely responsible?
hints:
- level: 1
  en: Consider a chemical signal passing between the pollen and the receiving surface.
- level: 2
  en: Think about a reaction that rejects some pollen but accepts other pollen.
- level: 3
  en: Focus on the surface of the receiving organ rather than the tube.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The ovule degenerates before pollen arrives
- id: b
  en: Anthers release pollen before the stigma is receptive
- id: c
  en: The stigma recognises and rejects pollen of the same plant through chemical signals
- id: d
  en: The pollen tube grows too slowly in the style
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.2E3C7760D05F
  when_answer_equals:
  - b
- id: MC.A.DC22EACFCF2C
  when_answer_equals:
  - d
- id: MC.A.AD4272EBDCA6
  when_answer_equals:
  - a
solution_steps:
- en: Self-incompatibility works by chemical recognition on the stigma, which accepts or rejects pollen according to its genetic identity.
- en: This selectivity distinguishes it from timing or growth barriers.
- en: The correct option is c.
tier: C
