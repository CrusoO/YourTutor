stem:
  en: A flowering plant has a diploid chromosome number of 16. How many chromosomes does its primary endosperm nucleus contain? Give the count only.
hints:
- level: 1
  en: Check where each haploid contribution comes from.
- level: 2
  en: Each polar nucleus is haploid, the same as a sperm nucleus.
- level: 3
  en: Add the haploid contributions from the sperm and both polar nuclei.
prediction_prompt:
