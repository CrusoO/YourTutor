stem:
  en: An anther has 4 pollen sacs. Each sac contains 100 pollen mother cells, and each mother cell gives 4 pollen grains. How many pollen grains form in total? Give the count only.
hints:
- level: 1
  en: Start with the number of pollen sacs in the anther.
- level: 2
  en: Multiply by the number of mother cells in each sac.
- level: 3
  en: Apply the number of grains per mother cell last.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1600'
  accept: []
solution_steps:
- en: Four sacs of 100 mother cells give 400 mother cells, and 400 times 4 grains equals 1600.
- en: Answer = 1600
tier: C
diagram_note: Sketch a transverse section of an anther showing four pollen sacs, each containing many pollen mother cells, with the connective and wall layers labelled.
