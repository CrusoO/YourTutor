id: A.12.biology.human_health_and_disease.vaccines_and_antibodies.04
skill_ids:
- SK.A.12.biology.vaccines_and_antibodies
difficulty: 0.6
pool: practice
role: apply
stem:
  en: What distinguishes a monoclonal antibody from a polyclonal antibody mixture?
hints:
- level: 1
  en: Think about how many lineages of cells make the antibody.
- level: 2
  en: Consider how many distinct epitopes the product recognises.
- level: 3
  en: Compare a uniform product with a mixture from many sources.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is always a viral protein
- id: b
  en: It cannot bind any antigen
- id: c
  en: All copies come from one B cell clone and bind one epitope
- id: d
  en: It is produced by many different B cell clones
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.A1B701758D84
  when_answer_equals:
  - d
- id: MC.A.20D082D08B28
  when_answer_equals:
  - a
- id: MC.A.A5F8412FAAAA
  when_answer_equals:
  - b
solution_steps:
- en: A monoclonal antibody is identical in every copy because it comes from one clone of B cells and recognises one epitope.
- en: A polyclonal mixture is made by many clones and can bind several epitopes.
- en: The correct option is c.
tier: C
