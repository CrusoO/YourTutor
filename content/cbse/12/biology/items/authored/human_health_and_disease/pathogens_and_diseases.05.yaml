id: A.12.biology.human_health_and_disease.pathogens_and_diseases.05
skill_ids:
- SK.A.12.biology.pathogens_and_diseases
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A new disease spreads through contaminated food and is caused by a toxin-producing bacterium. Which feature is most likely?
hints:
- level: 1
  en: Think about the route by which the pathogen reaches the person.
- level: 2
  en: Consider whether the damage requires the organism to grow in the body.
- level: 3
  en: Ask whether the harm could come from a substance rather than a living organism.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Only fungi can produce this type of toxin
- id: b
  en: The disease spreads only through the air to the lungs
- id: c
  en: Symptoms appear only after a vector bite
- id: d
  en: Symptoms can appear from a preformed toxin even when live bacteria are absent
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.EAEB60DD673F
  when_answer_equals:
  - c
- id: MC.A.9935A30C47F9
  when_answer_equals:
  - a
- id: MC.A.1823E3CDAF6A
  when_answer_equals:
  - b
solution_steps:
- en: Some bacteria release toxins into food, and eating the food causes symptoms even if the bacteria are no longer alive.
- en: This is a food poisoning pattern rather than an infection that establishes itself in the body.
- en: The correct option is d.
tier: C
