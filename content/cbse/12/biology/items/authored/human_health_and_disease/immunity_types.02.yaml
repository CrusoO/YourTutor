difficulty: 0.2
pool: practice
role: explain
stem:
  en: What is the main feature of innate immunity?
hints:
- level: 1
  en: Consider whether the response becomes stronger after repeated exposure.
- level: 2
  en: Think about whether the defence is aimed at a specific pathogen.
- level: 3
  en: Compare innate defences with the responses that build memory.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It improves with memory after each infection
- id: b
  en: It is found only in vertebrates
- id: c
  en: It requires prior exposure before it can work
- id: d
  en: It responds in the same way each time and does not improve with repeated exposure
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.1A6292CE8601
  when_answer_equals:
  - a
- id: MC.A.33F8A6EF90B6
  when_answer_equals:
