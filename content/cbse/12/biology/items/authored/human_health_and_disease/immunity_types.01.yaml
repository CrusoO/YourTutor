id: A.12.biology.human_health_and_disease.immunity_types.01
skill_ids:
- SK.A.12.biology.immunity_types
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which of the following is an example of passive immunity?
hints:
- level: 1
  en: Think about immunity that is given rather than produced by the body itself.
- level: 2
  en: Consider whether the person's own immune system made the antibodies.
- level: 3
  en: Separate transferred antibodies from those the body makes after infection or vaccination.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Recovery from measles leaves lasting protection
- id: b
  en: The skin barrier against pathogens
- id: c
  en: Protection after vaccination with a killed bacterium
- id: d
  en: Antibodies received from the mother across the placenta
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.E1A5F0DD8B3B
  when_answer_equals:
  - a
- id: MC.A.C036FB36607C
  when_answer_equals:
