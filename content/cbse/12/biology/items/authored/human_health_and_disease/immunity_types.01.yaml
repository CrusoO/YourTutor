- id: MC.A.3BBE06E57908
  when_answer_equals:
  - b
solution_steps:
- en: Passive immunity is conferred by antibodies made by another individual, such as those passed from mother to foetus.
- en: The body did not produce these antibodies itself.
- en: The correct option is d.
tier: C
