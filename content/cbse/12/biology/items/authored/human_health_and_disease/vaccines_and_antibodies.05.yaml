difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A vaccine uses an inactivated toxin rather than live bacteria. What is the main advantage of this approach?
hints:
- level: 1
  en: Think about which part of the pathogen causes the harm.
- level: 2
  en: Consider whether the vaccine contains active living bacteria.
- level: 3
  en: Focus on what the immune system must neutralise to prevent disease.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It replaces antibodies with T cells only
- id: b
  en: It grants lifelong immunity without any boosters
- id: c
  en: It kills bacteria in the bloodstream directly
- id: d
  en: It triggers an antibody response to the toxin without causing the disease
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.A52A58DB748A
  when_answer_equals:
  - b
- id: MC.A.1AF600D790F1
  when_answer_equals:
