difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which effect is a common consequence of drug abuse on the nervous system?
hints:
- level: 1
  en: Consider how drugs change the signals between neurons.
- level: 2
  en: Think about functions that depend on normal brain signalling.
- level: 3
  en: Focus on effects that impair the nervous system rather than strengthen it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Increased bone density
- id: b
  en: Lowered blood sugar only
- id: c
  en: Altered perception and reduced coordination
- id: d
  en: Improved memory of all events
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.7F14A01B61BC
  when_answer_equals:
