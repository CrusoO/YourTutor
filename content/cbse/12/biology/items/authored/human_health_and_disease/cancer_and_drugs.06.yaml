stem:
  en: A tumour's volume doubles every 3 months. Starting from 2 cubic centimetres, what is its volume after 9 months? Give the number only.
hints:
- level: 1
  en: Count how many doublings occur in nine months.
- level: 2
  en: Double the volume once for each three month interval.
- level: 3
  en: Check that the unit is cubic centimetres.
