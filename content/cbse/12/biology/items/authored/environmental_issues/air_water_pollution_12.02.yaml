role: explain
stem:
  en: What is the main effect of excess nutrients such as nitrates and phosphates in a lake?
hints:
- level: 1
  en: Think about what the algae do to the oxygen in the water when they decay.
- level: 2
  en: Consider how a sudden population boom of algae ends.
- level: 3
  en: Ask which process uses up oxygen after the bloom.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
