  author: model-draft
type: mcq
options:
- id: a
  en: They increase oxygen levels permanently
- id: b
  en: They reduce plant growth in the lake
- id: c
  en: They make the water sterile
- id: d
  en: Algal blooms that deplete oxygen when they die and decay
