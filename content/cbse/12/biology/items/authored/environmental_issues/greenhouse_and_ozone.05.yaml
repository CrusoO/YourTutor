id: A.12.biology.environmental_issues.greenhouse_and_ozone.05
skill_ids:
- SK.A.12.biology.greenhouse_and_ozone
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Old refrigerants were replaced by a non-CFC alternative. What is the main environmental benefit of this change?
hints:
- level: 1
  en: Think about the gas that the old refrigerants were destroying.
- level: 2
  en: Consider which layer of the atmosphere the damage occurs in.
- level: 3
  en: Ask which benefit is directly linked to stopping chlorine release.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Immediate full restoration of the ozone layer within a year
- id: b
  en: Complete removal of all greenhouse gases
- id: c
  en: Higher ozone production at ground level
- id: d
  en: Less damage to the stratospheric ozone layer
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.38DB6C65900A
  when_answer_equals:
  - b
- id: MC.A.0B5F97034901
  when_answer_equals:
  - a
- id: MC.A.BFF914E33C53
  when_answer_equals:
  - c
solution_steps:
- en: Replacing chlorofluorocarbons stops the release of ozone destroying chlorine, allowing the stratospheric ozone to recover slowly over decades.
- en: The change does not remove all greenhouse effects.
- en: The correct option is d.
tier: C
