pool: practice
role: procedure
stem:
  en: Which step separates waste into biodegradable and non-biodegradable components?
hints:
- level: 1
  en: Think about the earliest point at which waste can be sorted.
- level: 2
  en: Consider the step that happens before the waste is mixed.
- level: 3
  en: Ask which step is carried out at the house or workplace.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
