id: A.12.biology.environmental_issues.greenhouse_and_ozone.04
skill_ids:
- SK.A.12.biology.greenhouse_and_ozone
difficulty: 0.6
pool: practice
role: apply
stem:
  en: In a greenhouse effect diagram, which arrow represents heat re-emitted from Earth that is trapped by gases?
hints:
- level: 1
  en: Think about the wavelength of heat radiated from the warm surface.
- level: 2
  en: Consider which kind of radiation the greenhouse gases absorb.
- level: 3
  en: Separate reflected sunlight from heat that leaves the surface.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Ultraviolet light blocked by the ozone layer
- id: b
  en: Heat conducted into the deep ocean
- id: c
  en: Infrared radiation leaving the surface and absorbed by gases in the atmosphere
- id: d
  en: Visible light reflected by clouds straight back to space
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.3FB125FBC942
  when_answer_equals:
  - d
- id: MC.A.D748C49EEFC1
  when_answer_equals:
  - a
- id: MC.A.E1D5EE6FFD4B
  when_answer_equals:
  - b
solution_steps:
- en: Earth's surface re-emits energy as infrared radiation, and greenhouse gases absorb and re-emit part of it back toward the surface.
- en: That trapping is the greenhouse effect.
- en: The correct option is c.
tier: C
diagram_note: Draw Earth with incoming sunlight arrows, reflected arrows, outgoing infrared arrows from the surface, and gas molecules in the atmosphere absorbing and re-emitting the infrared.
