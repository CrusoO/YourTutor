stem:
  en: A city produces 300 tonnes of waste per day, and 40 percent of it is biodegradable and composted. How many tonnes are composted per day? Give the number only.
hints:
- level: 1
  en: Convert the percentage into a fraction.
- level: 2
  en: Apply the fraction to the total daily waste.
- level: 3
  en: Check that the unit is tonnes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '120'
  accept: []
solution_steps:
- en: Forty percent of 300 tonnes is 120 tonnes composted per day.
- en: The unit of the answer is tonnes.
- en: Answer = 120
tier: C
