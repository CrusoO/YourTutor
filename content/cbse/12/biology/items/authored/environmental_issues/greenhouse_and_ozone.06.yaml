id: A.12.biology.environmental_issues.greenhouse_and_ozone.06
skill_ids:
- SK.A.12.biology.greenhouse_and_ozone
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A city emits 500000 tonnes of carbon dioxide per year, and one tree absorbs about 20 kg per year. How many trees would be needed to absorb all of it? Give the count only.
hints:
- level: 1
  en: Convert tonnes to kilograms before dividing.
- level: 2
  en: Divide the total absorbed amount by the absorption per tree.
- level: 3
  en: Keep the answer as a count of trees.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '25000000'
  accept: []
solution_steps:
- en: Five hundred thousand tonnes is 500 million kg, and dividing by 20 kg per tree gives 25 million trees.
- en: Answer = 25000000
tier: C
diagram_note: Draw a bar of annual emissions in tonnes beside a single tree labelled as absorbing 20 kg per year.
