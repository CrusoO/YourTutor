id: A.12.biology.environmental_issues.solid_waste_management.02
skill_ids:
- SK.A.12.biology.solid_waste_management
difficulty: 0.2
pool: practice
role: explain
stem:
  en: Why is the 3R approach recommended for managing waste?
hints:
- level: 1
  en: Think about the stages that come before any waste is produced.
- level: 2
  en: Consider which step prevents waste from being created in the first place.
- level: 3
  en: Ask which option describes a set of actions that lower waste volume.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It always produces toxic gas
- id: b
  en: It increases the volume of waste sent to landfill
- id: c
  en: It reduces waste at the source, reuses items and recycles materials
- id: d
  en: It requires the most land of any waste method
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.AD47FEB52AE6
  when_answer_equals:
  - b
- id: MC.A.56CA847EF1E0
  when_answer_equals:
  - d
- id: MC.A.A39F42CB6061
  when_answer_equals:
  - a
solution_steps:
- en: Reduce, reuse and recycle cut the amount of waste produced and the resources used, which eases the load on landfills and incinerators.
- en: Reduction at the source is the most effective step.
- en: The correct option is c.
tier: C
