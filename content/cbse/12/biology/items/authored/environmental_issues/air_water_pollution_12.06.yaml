stem:
  en: A water sample has a biochemical oxygen demand of 60 mg per litre. After treatment, this falls by 75 percent. What is the new value in mg per litre? Give the number only.
hints:
- level: 1
  en: Find the amount removed by applying the percentage to the original value.
- level: 2
  en: Subtract the removed amount from the original value.
- level: 3
  en: Check that the unit is mg per litre.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
