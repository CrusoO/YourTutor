  author: model-draft
type: numeric
answer:
  sympy: '15'
  accept: []
solution_steps:
- en: A 75 percent reduction of 60 mg per litre removes 45 mg per litre, leaving 15 mg per litre.
- en: The unit of the answer is mg per litre.
- en: Answer = 15
