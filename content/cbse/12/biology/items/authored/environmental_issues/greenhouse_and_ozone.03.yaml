stem:
  en: Which group of chemicals is primarily responsible for ozone depletion in the stratosphere?
hints:
- level: 1
  en: Think about synthetic compounds once used as refrigerants.
- level: 2
  en: Consider compounds that release chlorine in the stratosphere.
- level: 3
  en: Ask which group of synthetic chemicals has been phased out by treaty.
