id: A.12.biology.environmental_issues.solid_waste_management.05
skill_ids:
- SK.A.12.biology.solid_waste_management
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A landfill produces liquid that threatens groundwater. Which design feature best reduces this risk?
hints:
- level: 1
  en: Think about how liquid can be kept from moving into the soil.
- level: 2
  en: Consider a barrier and a drain for the liquid.
- level: 3
  en: Ask which design feature blocks and collects the leachate.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A deeper unlined pit
- id: b
  en: Stacking waste directly over surface water
- id: c
  en: Leaving the waste uncovered
- id: d
  en: A lined base with a leachate collection system
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.19E53FFD41D8
  when_answer_equals:
  - a
- id: MC.A.0211DCBA9C47
  when_answer_equals:
  - b
- id: MC.A.64BFD1D17A2A
  when_answer_equals:
  - c
solution_steps:
- en: A lined base stops the liquid from seeping into the soil, and a collection system drains the leachate for treatment.
- en: Together they keep contaminants out of groundwater.
- en: The correct option is d.
tier: C
