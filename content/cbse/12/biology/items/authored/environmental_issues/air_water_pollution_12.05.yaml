stem:
  en: A river shows a sudden fish kill after a sewage spill. Which mechanism most likely caused the deaths?
hints:
- level: 1
  en: Think about what the decomposing sewage consumes in the water.
- level: 2
  en: Consider what fish need to survive in water.
- level: 3
  en: Ask which change in the water would cause fish to suffocate quickly.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The sewage blocked sunlight permanently
- id: b
  en: Microbial decomposition of the sewage used up the dissolved oxygen
- id: c
  en: The sewage raised the water temperature to lethal levels only
- id: d
  en: The sewage added chlorine that fish cannot breathe
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.6D0560318DB8
  when_answer_equals:
  - c
- id: MC.A.3C7CB412A1E8
  when_answer_equals:
