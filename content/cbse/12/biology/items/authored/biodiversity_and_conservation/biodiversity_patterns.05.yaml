id: A.12.biology.biodiversity_and_conservation.biodiversity_patterns.05
skill_ids:
- SK.A.12.biology.biodiversity_patterns
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A region has many species but little genetic variation within each species. Which concern follows?
hints:
- level: 1
  en: Think about what variation allows populations to respond to new conditions.
- level: 2
  en: Consider the link between genes within a species and its resilience.
- level: 3
  en: Ask what a population can do when a new disease appears if all its members are alike.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Species are now immune to disease
- id: b
  en: Ecosystem diversity is irrelevant to the species
- id: c
  en: Low genetic diversity may reduce the ability to adapt to change
- id: d
  en: Genetic diversity is at its maximum
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.9BB84D9B08EC
  when_answer_equals:
  - a
- id: MC.A.52CA1C3D6DCE
  when_answer_equals:
  - d
- id: MC.A.45D8EE5C92A5
  when_answer_equals:
  - b
solution_steps:
- en: Populations with little genetic variation have fewer options when conditions change, such as new diseases or a warmer climate.
- en: Species richness alone does not capture this risk.
- en: The correct option is c.
tier: C
