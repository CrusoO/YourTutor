id: A.12.biology.biodiversity_and_conservation.conservation_strategies.05
skill_ids:
- SK.A.12.biology.conservation_strategies
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A rare plant has only a few wild populations, and its habitat is being drained. Which combined approach would be most sensible?
hints:
- level: 1
  en: Think about combining protection in place with storage elsewhere.
- level: 2
  en: Consider how each approach covers a different kind of risk.
- level: 3
  en: Ask which option uses both in situ and ex situ methods.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Grow it in a single greenhouse and do nothing else
- id: b
  en: Remove the plant from the wild to make room for crops
- id: c
  en: Protect the remaining wild sites and store seeds in a gene bank
- id: d
  en: Only store seeds and abandon the wild sites
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.6C3803828439
  when_answer_equals:
  - d
- id: MC.A.F460E17C8762
  when_answer_equals:
  - a
- id: MC.A.B18DDB04472A
  when_answer_equals:
  - b
solution_steps:
- en: Protecting the wild sites keeps the species evolving in place, while seed storage guards against further loss.
- en: Using both approaches covers different risks.
- en: The correct option is c.
tier: C
