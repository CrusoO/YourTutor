id: A.12.biology.biodiversity_and_conservation.loss_of_biodiversity.05
skill_ids:
- SK.A.12.biology.loss_of_biodiversity
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: An area is rich in endemic species but has little legal protection. Which action is most useful?
hints:
- level: 1
  en: Think about tools that protect habitats directly.
- level: 2
  en: Consider which action keeps the endemic species in their home habitat.
- level: 3
  en: Ask which option removes the main threat to the species.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Clearing more forest to expand agriculture
- id: b
  en: Introducing a new exotic species to add diversity
- id: c
  en: Establishing protected areas that cover the endemic habitat
- id: d
  en: Reducing monitoring because the area is important
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.AB5DFCF68E39
  when_answer_equals:
  - b
- id: MC.A.2F3D6423A9E2
  when_answer_equals:
  - a
- id: MC.A.724EB73ADB1E
  when_answer_equals:
  - d
solution_steps:
- en: Legal protection of the habitat keeps the endemic species in place, which addresses the main threat.
- en: Introducing exotic species or clearing habitat would increase the threat.
- en: The correct option is c.
tier: C
