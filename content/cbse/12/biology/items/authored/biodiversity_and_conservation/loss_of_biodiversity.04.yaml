stem:
  en: What is a biodiversity hotspot?
hints:
- level: 1
  en: Think about endemism and threat together.
- level: 2
  en: Consider whether the area is rich in species found nowhere else and under pressure.
- level: 3
  en: Separate total species counts from endemism and threat.
