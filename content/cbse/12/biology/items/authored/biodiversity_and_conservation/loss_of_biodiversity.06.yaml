stem:
  en: A hotspot has 1500 plant species, and 600 of them are endemic. What percentage of the plant species are endemic? Give the number only.
hints:
- level: 1
  en: Divide the endemic count by the total plant species.
- level: 2
  en: Multiply the result by one hundred.
- level: 3
  en: Check that the answer is a percentage of the total.
prediction_prompt:
