stem:
  en: What is the latitudinal gradient in species richness?
hints:
- level: 1
  en: Think about how species numbers change from the poles to the equator.
- level: 2
  en: Consider which climate tends to support the most species.
- level: 3
  en: Ask which direction of the gradient fits warm and productive regions.
