stem:
  en: A survey finds 80 species in an area, and 20 of them are endemic. What percentage of the species are endemic? Give the number only.
hints:
- level: 1
  en: Divide the endemic count by the total number of species.
- level: 2
  en: Multiply the result by one hundred.
- level: 3
  en: Check that the percentage is a share of the total species.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '25'
  accept: []
solution_steps:
- en: Twenty out of 80 species is one quarter, which is 25 percent endemic.
- en: The unit of the answer is %.
- en: Answer = 25
tier: C
