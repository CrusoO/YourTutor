stem:
  en: Which factor is the most important cause of biodiversity loss worldwide?
hints:
- level: 1
  en: Think about what most often removes the places where species live.
- level: 2
  en: Consider the change in land use that leads to the loss of species.
- level: 3
  en: Ask which human activity most often removes habitat.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
