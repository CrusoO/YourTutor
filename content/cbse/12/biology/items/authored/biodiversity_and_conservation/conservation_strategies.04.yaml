stem:
  en: A sanctuary keeps animals inside a fenced area near their natural range. Which category does this belong to?
hints:
- level: 1
  en: Consider whether the animals remain near their natural range.
- level: 2
  en: Think about the difference between protecting a place and moving a population out of it.
- level: 3
  en: Ask whether the animals are kept in the environment they normally live in.
