solution_steps:
- en: GIFT, or gamete intrafallopian transfer, places eggs and sperm into the fallopian tube so that fertilisation occurs inside the body.
- en: IVF fertilises outside the body and transfers the embryo to the uterus.
- en: The correct option is c.
