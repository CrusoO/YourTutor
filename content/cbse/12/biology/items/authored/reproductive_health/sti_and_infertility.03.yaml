stem:
  en: Which assisted reproduction technique transfers unfertilised gametes into the fallopian tube?
hints:
- level: 1
  en: Think about where the gametes are placed rather than where fertilisation is done in a dish.
- level: 2
  en: The technique transfers gametes, not embryos, into the tube.
- level: 3
  en: Compare the options by where the gametes are placed.
