id: A.12.biology.reproductive_health.sti_and_infertility.05
skill_ids:
- SK.A.12.biology.sti_and_infertility
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A woman has a blocked fallopian tube and seeks assisted conception. Which approach avoids needing a working tube for fertilisation?
hints:
- level: 1
  en: Think about where fertilisation happens in each option.
- level: 2
  en: Consider which approach skips the tube entirely.
- level: 3
  en: Check which options put the gametes or zygote into the tube.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: In vitro fertilisation with uterine embryo transfer
- id: b
  en: ZIFT
- id: c
  en: Surgical reconnection of the tube with no other help
- id: d
  en: GIFT
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.5B570899F388
  when_answer_equals:
  - d
- id: MC.A.BEF00A2D11A6
  when_answer_equals:
  - b
- id: MC.A.ADE9D332A3AA
  when_answer_equals:
  - c
solution_steps:
- en: In vitro fertilisation fertilises the egg in a dish and transfers the embryo into the uterus, so the tube is bypassed.
- en: GIFT and ZIFT both rely on the tube.
- en: The correct option is a.
tier: C
