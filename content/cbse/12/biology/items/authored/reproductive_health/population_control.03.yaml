id: A.12.biology.reproductive_health.population_control.03
skill_ids:
- SK.A.12.biology.population_control
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A contraceptive method has a failure rate of 2 pregnancies per 100 woman-years of use. How many pregnancies are expected among 250 woman-years of use? Give the number only.
hints:
- level: 1
  en: Convert the rate into pregnancies per woman-year.
- level: 2
  en: Multiply the rate by the total woman-years of use.
- level: 3
  en: Check that the expected count is a small number.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: A rate of 2 per 100 is 0.02 per woman-year, and 250 times 0.02 equals 5 expected pregnancies.
- en: Answer = 5
tier: C
