id: A.12.biology.reproductive_health.population_control.05
skill_ids:
- SK.A.12.biology.population_control
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A person wants reliable protection and cannot manage a daily routine. Which method suits this need best?
hints:
- level: 1
  en: Consider which method needs no daily action from the user.
- level: 2
  en: Think about how long a single placement can last.
- level: 3
  en: Weigh the need for routine against the level of reliability.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Withdrawal used when remembered
- id: b
  en: A long-acting implant placed under the skin
- id: c
  en: A condom used at each intercourse
- id: d
  en: A daily oral pill taken at the same time
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.FA386539E1F5
  when_answer_equals:
  - d
- id: MC.A.F60D186BAE76
  when_answer_equals:
  - c
- id: MC.A.706EAA0D98F8
  when_answer_equals:
  - a
solution_steps:
- en: A long-acting implant releases hormones for an extended period after a single placement, so it needs no daily action.
- en: The other choices all depend on routine or consistent behaviour.
- en: The correct option is b.
tier: C
