id: A.12.biology.reproductive_health.population_control.04
skill_ids:
- SK.A.12.biology.population_control
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which pairing correctly matches a natural family planning method with its basis?
hints:
- level: 1
  en: Think about which days in a cycle are most likely for conception.
- level: 2
  en: Consider whether a method changes hormone levels or changes behaviour.
- level: 3
  en: Focus on the mechanism rather than the name of the method.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 'Withdrawal: using a hormone to stop ovulation'
- id: b
  en: 'Calendar method: avoiding intercourse during the fertile window'
- id: c
  en: 'Surgery: blocking hormone release in the uterus'
- id: d
  en: 'Barrier: using a copper coil to block sperm'
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.8E79F3CD3488
  when_answer_equals:
  - a
- id: MC.A.9486836FD8ED
  when_answer_equals:
  - d
- id: MC.A.306A2013E4E2
  when_answer_equals:
  - c
solution_steps:
- en: The calendar method relies on tracking the cycle and avoiding intercourse around the days when conception is most likely.
- en: The other pairings mix up the basis of the methods.
- en: The correct option is b.
tier: C
