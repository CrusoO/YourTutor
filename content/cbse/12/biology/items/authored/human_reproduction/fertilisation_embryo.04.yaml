stem:
  en: Which hormone, produced by the early placenta, keeps the corpus luteum active in early pregnancy?
hints:
- level: 1
  en: Think about the signal that passes from the embryo to the ovary.
- level: 2
  en: Consider which hormone the early placenta releases in large amounts.
- level: 3
  en: Think about which hormone is detected early in pregnancy in a test of blood or urine.
