id: A.12.biology.human_reproduction.menstrual_cycle.04
skill_ids:
- SK.A.12.biology.menstrual_cycle
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A graph plots hormone levels over days 1 to 28. Which hormone is secreted by the corpus luteum after ovulation?
hints:
- level: 1
  en: Trace the structure left behind in the ovary after the egg leaves.
- level: 2
  en: Think about which hormone that structure makes to prepare the lining.
- level: 3
  en: Consider the hormone that rises in the second half of the cycle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Oestrogen from the pituitary
- id: b
  en: Oxytocin
- id: c
  en: Follicle-stimulating hormone
- id: d
  en: Progesterone
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.618A3E8EA772
  when_answer_equals:
  - c
- id: MC.A.D05EFACCB373
  when_answer_equals:
  - b
- id: MC.A.821F6E759893
  when_answer_equals:
  - a
solution_steps:
- en: After ovulation the corpus luteum secretes progesterone, which keeps the uterine lining ready for an embryo.
- en: The pituitary releases FSH and LH rather than the steroid hormones of the ovary.
- en: The correct option is d.
tier: C
diagram_note: Draw a line graph over days 1 to 28 with LH, FSH, oestrogen and progesterone curves, marking the LH peak near day 14.
