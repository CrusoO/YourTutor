id: A.12.biology.human_reproduction.menstrual_cycle.02
skill_ids:
- SK.A.12.biology.menstrual_cycle
difficulty: 0.2
pool: practice
role: explain
stem:
  en: Which phase of the menstrual cycle is the period in which the uterine lining is rebuilt after menstruation?
hints:
- level: 1
  en: Think about the hormone that dominates the first half of the cycle.
- level: 2
  en: Ask which phase comes right after the shedding of the lining.
- level: 3
  en: Compare the building phase with the phase that prepares the lining after ovulation.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Secretory phase
- id: b
  en: Luteal decline phase
- id: c
  en: Menstrual phase
- id: d
  en: Proliferative phase
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.249CF3C17E20
  when_answer_equals:
  - a
- id: MC.A.DBBE47E89DA0
  when_answer_equals:
