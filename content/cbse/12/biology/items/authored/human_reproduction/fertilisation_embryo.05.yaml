id: A.12.biology.human_reproduction.fertilisation_embryo.05
skill_ids:
- SK.A.12.biology.fertilisation_embryo
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A blastocyst fails to implant even though it is healthy. Which change in the uterus is most likely responsible?
hints:
- level: 1
  en: Think about the time window in which the lining accepts an embryo.
- level: 2
  en: Consider the timing of hormone-driven changes in the uterus.
- level: 3
  en: Ask what the uterine lining must do before the blastocyst can attach.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The corpus luteum is too large
- id: b
  en: The embryo has too many cells
- id: c
  en: The cervix is closed completely
- id: d
  en: The endometrium is not receptive at the right time
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.C68166C25225
  when_answer_equals:
  - b
- id: MC.A.CEA0B696C417
  when_answer_equals:
  - a
- id: MC.A.0BB676E3628C
