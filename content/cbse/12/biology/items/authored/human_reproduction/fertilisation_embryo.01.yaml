stem:
  en: Where does the blastocyst implant in a normal human pregnancy?
hints:
- level: 1
  en: Think about the tissue that lines the uterus.
- level: 2
  en: Recall which tissue thickens each cycle to support a pregnancy.
- level: 3
  en: The site lies inside the uterus rather than the tubes.
