id: A.12.biology.human_reproduction.gametogenesis_humans.05
skill_ids:
- SK.A.12.biology.gametogenesis_humans
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A male carries a gene defect that stops the Sertoli cells from working. Which outcome is most likely?
hints:
- level: 1
  en: Consider the job of the cells that support developing germ cells.
- level: 2
  en: Separate the roles of the supporting cells and the hormone-making cells.
- level: 3
  en: Think about what happens to developing sperm without nourishment.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Testosterone production stops completely
- id: b
  en: Oocytes begin forming in the male gonad
- id: c
  en: Sperm form but cannot leave the testis
- id: d
  en: Germ cells fail to mature, so sperm production is reduced
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.B90C609420BD
  when_answer_equals:
  - a
- id: MC.A.B1FE5CE51A80
  when_answer_equals:
  - c
- id: MC.A.DBA01202CA35
  when_answer_equals:
  - b
solution_steps:
- en: Sertoli cells nourish and support developing germ cells, so their failure reduces sperm maturation.
- en: Testosterone is made by Leydig cells, which are a separate population.
- en: The correct option is d.
tier: C
