difficulty: 0.6
pool: practice
role: apply
stem:
  en: On a labelled diagram of the male tract, which duct carries mature sperm from the epididymis towards the urethra?
hints:
- level: 1
  en: Follow the route from the epididymis onward.
- level: 2
  en: Consider which tube is long and runs up into the abdomen.
- level: 3
  en: The duct passes over the bladder before the gland ducts join it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Ejaculatory duct
- id: b
  en: Efferent duct
- id: c
  en: Vas deferens
- id: d
  en: Seminiferous tubule
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.8F076ACC2C51
