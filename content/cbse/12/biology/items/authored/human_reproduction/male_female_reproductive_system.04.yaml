solution_steps:
- en: The vas deferens is a long muscular duct that carries sperm from the epididymis up into the abdomen and onward to the urethra.
- en: The seminiferous tubules are where sperm are formed.
- en: The correct option is c.
tier: C
diagram_note: Draw the male reproductive tract with testis, seminiferous tubules, epididymis, vas deferens, seminal vesicle, prostate, urethra and penis; label each and draw arrows showing the sperm route.
