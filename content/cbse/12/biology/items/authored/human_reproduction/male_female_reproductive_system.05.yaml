  author: model-draft
type: mcq
options:
- id: a
  en: Secretion of prostatic fluid
- id: b
  en: Nourishment of developing germ cells by Sertoli cells
- id: c
  en: Production of testosterone by Leydig cells
- id: d
  en: Transport of mature sperm out of the body
answer:
  sympy: d
  accept: []
