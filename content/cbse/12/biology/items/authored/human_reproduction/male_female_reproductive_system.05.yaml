stem:
  en: A man has a blockage only in the vas deferens. Which function is most directly affected?
hints:
- level: 1
  en: Consider which steps happen before the duct and which happen after it.
- level: 2
  en: Hormone production occurs in a separate tissue of the testis.
- level: 3
  en: Ask what the duct physically carries.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
