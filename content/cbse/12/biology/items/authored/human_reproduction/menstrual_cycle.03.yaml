difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A cycle is 28 days long, and ovulation occurs on day 14, counting day 1 as the first day of menstruation. How many days remain after the ovulation day until day 28? Give the count only.
hints:
- level: 1
  en: Subtract the ovulation day from the last day of the cycle.
- level: 2
  en: Count the days strictly after the ovulation day.
- level: 3
  en: Do not count the ovulation day itself.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '14'
  accept: []
solution_steps:
- en: Days 15 to 28 inclusive form 14 days after ovulation.
- en: Answer = 14
tier: C
