id: A.12.biology.human_reproduction.gametogenesis_humans.04
skill_ids:
- SK.A.12.biology.gametogenesis_humans
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A diagram of oogenesis traces the cell from oogonium to ovum. At which stage is the female germ cell arrested until puberty?
hints:
- level: 1
  en: Think about when the first meiotic division starts in the female fetus.
- level: 2
  en: Consider which division is completed only after ovulation.
- level: 3
  en: The arrest point comes before the first meiotic division finishes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Primary oocyte in prophase I
- id: b
  en: Secondary oocyte in metaphase II
- id: c
  en: Ovum after fertilisation
- id: d
  en: Oogonium in mitosis
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.9F5A30F133D5
  when_answer_equals:
  - d
- id: MC.A.0EEFFAAEEB17
  when_answer_equals:
  - b
- id: MC.A.EDF3356F7121
  when_answer_equals:
  - c
solution_steps:
- en: The primary oocyte starts meiosis I during fetal life and stays arrested in prophase I until puberty.
- en: Meiosis resumes in each cycle and is completed only after fertilisation.
- en: The correct option is a.
tier: C
diagram_note: Draw a flow diagram of oogenesis from oogonium to primary oocyte, secondary oocyte, ovum and polar bodies, marking where each division occurs and where the cell is arrested.
