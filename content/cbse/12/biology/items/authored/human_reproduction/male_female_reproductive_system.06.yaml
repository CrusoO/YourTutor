difficulty: 0.9
pool: practice
role: apply
stem:
  en: A female cycle lasts 28 days and includes one ovulation. How many ovulations occur in 336 days? Give the count only.
hints:
- level: 1
  en: Divide the total number of days by the length of one cycle.
- level: 2
  en: Recall how many ovulations occur in each cycle.
- level: 3
  en: Check that the answer is a whole number of cycles.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '12'
  accept: []
solution_steps:
- en: Three hundred thirty-six days divided by a 28 day cycle is 12 cycles, each with one ovulation.
- en: Answer = 12
tier: C
diagram_note: Sketch the female reproductive tract with the two ovaries, fallopian tubes with fimbriae, uterus, cervix and vagina, marking the ovulation site on one ovary.
