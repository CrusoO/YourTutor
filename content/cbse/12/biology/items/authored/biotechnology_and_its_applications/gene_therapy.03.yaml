id: A.12.biology.biotechnology_and_its_applications.gene_therapy.03
skill_ids:
- SK.A.12.biology.gene_therapy
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: In ex vivo gene therapy, where is the gene introduced?
hints:
- level: 1
  en: Think about whether the cells are treated outside or inside the body.
- level: 2
  en: Consider the step that happens before the cells are returned.
- level: 3
  en: Separate the laboratory step from the direct delivery step.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Into cells removed from the patient, which are then returned
- id: b
  en: Directly into the bloodstream without any carrier
- id: c
  en: Only onto the skin surface of the patient
- id: d
  en: Into sperm before the patient is born
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.88F20112A879
  when_answer_equals:
  - b
- id: MC.A.D2BBEBA47204
  when_answer_equals:
  - c
- id: MC.A.C8BF9FDB5F2B
  when_answer_equals:
  - d
solution_steps:
- en: In ex vivo therapy, cells are taken from the patient, the gene is added in the laboratory, and the modified cells are infused back.
- en: In vivo therapy delivers the gene directly into the body.
- en: The correct option is a.
tier: C
