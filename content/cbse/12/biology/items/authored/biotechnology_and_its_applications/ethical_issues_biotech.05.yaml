id: A.12.biology.biotechnology_and_its_applications.ethical_issues_biotech.05
skill_ids:
- SK.A.12.biology.ethical_issues_biotech
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A proposed genetically modified animal may suffer welfare harm. Which principle best guides the decision?
hints:
- level: 1
  en: Think about who checks the balance of benefits and harms.
- level: 2
  en: Consider whether the welfare cost has been weighed against the aim.
- level: 3
  en: Ask which option keeps an independent check in place.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Weigh the benefit against the animal's suffering through independent review
- id: b
  en: Approve it if the benefit goes only to the company
- id: c
  en: Skip review because the animal is not human
- id: d
  en: Ignore welfare if the trait is only cosmetic
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.42679B5167A0
  when_answer_equals:
  - b
- id: MC.A.C729F7348950
  when_answer_equals:
  - c
- id: MC.A.ECE5F3090970
  when_answer_equals:
  - d
solution_steps:
- en: Animal use in research and modification requires a balance of expected benefits against harms to the animal, judged by an independent committee.
- en: Harm to the animal must be justified, not overlooked.
- en: The correct option is a.
tier: C
