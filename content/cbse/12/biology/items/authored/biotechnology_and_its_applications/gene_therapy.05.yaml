stem:
  en: A transgenic animal produces a human protein in its milk. What is the main practical benefit?
hints:
- level: 1
  en: Think about where the protein ends up in the animal.
- level: 2
  en: Consider how easily milk can be collected from the animal.
- level: 3
  en: Ask which feature of milk makes it useful for producing a protein.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
