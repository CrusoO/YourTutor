  author: model-draft
type: mcq
options:
- id: a
  en: The animal creates a new gene for its milk
- id: b
  en: The milk loses all its natural nutrients
- id: c
  en: The protein stops being made after one day
- id: d
  en: The protein can be collected easily from the milk in large amounts
