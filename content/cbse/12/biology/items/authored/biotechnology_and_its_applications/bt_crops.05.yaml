id: A.12.biology.biotechnology_and_its_applications.bt_crops.05
skill_ids:
- SK.A.12.biology.bt_crops
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A Bt crop loses its effectiveness after several seasons. Which management practice would best delay this loss?
hints:
- level: 1
  en: Think about how resistant insects mate with susceptible ones.
- level: 2
  en: Consider how to keep susceptible pests in the population.
- level: 3
  en: Ask which practice keeps a source of susceptible individuals available.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Planting refuge areas of non-Bt crops nearby
- id: b
  en: Planting only the Bt variety everywhere
- id: c
  en: Spraying more toxin at higher concentrations
- id: d
  en: Removing all natural predators of the pest
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.8B21BCB4CCB0
  when_answer_equals:
  - c
- id: MC.A.5D383653280B
  when_answer_equals:
  - b
- id: MC.A.2B02EA3D5524
  when_answer_equals:
  - d
solution_steps:
- en: Refuges let susceptible pests survive and mate with any resistant survivors, which dilutes the resistance gene in the population.
- en: This delays the spread of resistance.
- en: The correct option is a.
tier: C
