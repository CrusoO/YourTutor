id: A.12.biology.biotechnology_and_its_applications.ethical_issues_biotech.02
skill_ids:
- SK.A.12.biology.ethical_issues_biotech
difficulty: 0.2
pool: practice
role: explain
stem:
  en: What is a major ethical concern about genetically modified crops?
hints:
- level: 1
  en: Think about effects that may only show over many years.
- level: 2
  en: Consider which effects are hard to predict for the wider ecosystem.
- level: 3
  en: Separate proven facts about crops from questions still under study.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They always produce identical yields in every season
- id: b
  en: Uncertainty about long-term effects on ecosystems and food safety
- id: c
  en: They cannot carry any foreign genes
- id: d
  en: They never need any water to grow
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.7BEBB8028511
  when_answer_equals:
  - a
- id: MC.A.1C6B6FE034AA
  when_answer_equals:
  - c
- id: MC.A.3C1A404DD194
  when_answer_equals:
  - d
solution_steps:
- en: Debate about GM crops centres on the uncertain long-term effects on ecosystems, gene flow to wild relatives and food safety.
- en: These concerns are reviewed case by case.
- en: The correct option is b.
tier: C
