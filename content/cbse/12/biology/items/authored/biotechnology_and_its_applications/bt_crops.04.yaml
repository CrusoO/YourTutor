stem:
  en: Why do Bt crops reduce the need for chemical sprays against their target pests?
hints:
- level: 1
  en: Think about whether the toxin acts widely or narrowly.
- level: 2
  en: Consider which insects the crop protection is aimed at.
- level: 3
  en: Ask how much spraying is needed when the plant already carries the protection.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
