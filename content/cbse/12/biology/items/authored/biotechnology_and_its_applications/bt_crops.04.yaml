type: mcq
options:
- id: a
  en: The toxin kills all insects, including predators
- id: b
  en: The toxin replaces the need for water
- id: c
  en: The toxin acts on target insects, so fewer broad sprays are needed
- id: d
  en: The plant grows without soil
