difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which concern relates to patenting of biological materials taken from communities?
hints:
- level: 1
  en: Think about who owns a biological resource and who benefits from it.
- level: 2
  en: Consider the communities that provided the original resource.
- level: 3
  en: Separate the question of ownership from the question of product quality.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Patents guarantee better taste in food
- id: b
  en: Patents make seeds free of cost
- id: c
  en: Patenting stops all diseases
- id: d
  en: Access and benefit sharing for traditional knowledge and genetic resources
answer:
  sympy: d
  accept: []
misconception_rules:
