stem:
  en: Which regulatory step checks a genetically modified product before its release?
hints:
- level: 1
  en: Think about who evaluates environmental and health risks.
- level: 2
  en: Consider a formal evaluation carried out before wider use.
- level: 3
  en: Separate formal risk checks from informal or commercial steps.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Export without any testing
- id: b
  en: Random tasting by a farmer
- id: c
  en: Risk assessment by an approved regulatory body
- id: d
  en: Public voting on every crop batch
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.9B1C73C691A6
  when_answer_equals:
