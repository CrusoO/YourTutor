stem:
  en: A biosafety committee reviews 48 applications and approves 3 of every 4. How many applications are approved? Give the count only.
hints:
- level: 1
  en: Convert the approval ratio into a fraction.
- level: 2
  en: Apply the fraction to the total number of applications.
- level: 3
  en: Check that the answer is a count of applications.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
