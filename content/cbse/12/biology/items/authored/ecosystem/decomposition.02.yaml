id: A.12.biology.ecosystem.decomposition.02
skill_ids:
- SK.A.12.biology.decomposition
difficulty: 0.2
pool: practice
role: explain
stem:
  en: What is the first step in the decomposition of dead organic matter?
hints:
- level: 1
  en: Consider which organisms physically break up litter first.
- level: 2
  en: Think about animals that feed on dead matter and move through soil.
- level: 3
  en: Ask which step in decomposition comes before the microbial breakdown.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Leaching of all salts from the soil
- id: b
  en: Release of methane before any breakdown
- id: c
  en: Mineralisation into inorganic nutrients
- id: d
  en: Fragmentation of the litter by detritivores such as earthworms
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.9C66C5B4F159
  when_answer_equals:
  - c
- id: MC.A.D6C51510E9AE
  when_answer_equals:
  - a
- id: MC.A.54552EB2A381
  when_answer_equals:
  - b
solution_steps:
- en: Detritivores physically break litter into smaller pieces, which increases the surface area for microbes.
- en: Microbial breakdown and mineralisation follow this fragmentation.
- en: The correct option is d.
tier: C
