id: A.12.biology.ecosystem.productivity_energy_flow.03
skill_ids:
- SK.A.12.biology.productivity_energy_flow
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A lake has net primary productivity of 450 and respiration of 350, both in kcal per square metre. What is its gross primary productivity? Give the number only.
hints:
- level: 1
  en: Add respiration back to the net productivity.
- level: 2
  en: Keep the same units throughout.
- level: 3
  en: Check that gross productivity is larger than net productivity.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '800'
  accept: []
solution_steps:
- en: Gross productivity equals net productivity plus respiration, so 450 plus 350 gives 800.
- en: The unit of the answer is kcal per square metre.
- en: Answer = 800
tier: C
