difficulty: 0.9
pool: practice
role: apply
stem:
  en: Producers hold 1000 kJ of energy. Primary consumers receive 10 percent of that energy, and secondary consumers receive 10 percent of what the primary consumers get. How many kJ reach the secondary consumers? Give the number only.
hints:
- level: 1
  en: Apply the transfer percentage at each step.
- level: 2
  en: Multiply the energy by the fraction twice.
- level: 3
  en: Check that the unit is kilojoules.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10'
  accept: []
solution_steps:
- en: Ten percent of 1000 kJ is 100 kJ for primary consumers, and 10 percent of 100 kJ is 10 kJ for secondary consumers.
- en: The unit of the answer is kJ.
- en: Answer = 10
tier: C
