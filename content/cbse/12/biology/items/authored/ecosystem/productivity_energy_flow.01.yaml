  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The total biomass of all consumers
- id: b
  en: The rate of decomposition of dead matter
- id: c
  en: The energy left after the producers' own respiration
- id: d
  en: The total rate at which producers fix energy through photosynthesis
answer:
