id: A.12.biology.ecosystem.productivity_energy_flow.02
skill_ids:
- SK.A.12.biology.productivity_energy_flow
difficulty: 0.2
pool: practice
role: explain
stem:
  en: Gross primary productivity is 800 and respiration by producers is 300, in the same units. What is the net primary productivity? Give the number only.
hints:
- level: 1
  en: Net productivity is what remains after respiration.
- level: 2
  en: Subtract respiration from gross productivity.
- level: 3
  en: Keep the same units as the inputs.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '500'
  accept: []
solution_steps:
- en: Net primary productivity equals gross productivity minus respiration, so 800 minus 300 gives 500.
- en: Answer = 500
tier: C
