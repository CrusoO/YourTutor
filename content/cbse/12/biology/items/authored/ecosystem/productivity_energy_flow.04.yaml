stem:
  en: Herbivores assimilate 5000 kJ of energy, and 10 percent of it passes to carnivores. How many kJ reach the carnivores? Give the number only.
hints:
- level: 1
  en: Apply the transfer percentage once for this step.
- level: 2
  en: Use the herbivore energy as the starting value.
- level: 3
  en: Check that the unit is kilojoules.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '500'
  accept: []
solution_steps:
- en: Ten percent of 5000 kJ is 500 kJ passed to carnivores.
- en: The unit of the answer is kJ.
- en: Answer = 500
tier: C
diagram_note: Draw an energy pyramid with producer, herbivore and carnivore levels, labelled with their energy values, and arrows showing the 10 percent transfer and the heat loss.
