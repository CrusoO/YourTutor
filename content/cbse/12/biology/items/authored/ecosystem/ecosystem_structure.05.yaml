id: A.12.biology.ecosystem.ecosystem_structure.05
skill_ids:
- SK.A.12.biology.ecosystem_structure
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A pyramid of energy always has a broad base and narrows upward. Which principle explains this?
hints:
- level: 1
  en: Think about what happens to energy at each transfer.
- level: 2
  en: Consider which law of physics explains the loss of usable energy.
- level: 3
  en: Ask why the energy at the top must be smaller than at the base.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Energy is created anew at every trophic level
- id: b
  en: Decomposers gain energy from consumers
- id: c
  en: Energy lost as heat at each level limits the energy available to the next level
- id: d
  en: Each level stores more energy than the one below
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.C993B21E597F
  when_answer_equals:
  - d
- id: MC.A.BF831FA2607A
  when_answer_equals:
  - a
- id: MC.A.094099CBD0C3
  when_answer_equals:
  - b
solution_steps:
- en: Only about a tenth of the energy at one level is passed on, with the rest lost as heat and used in metabolism.
- en: This loss at each step limits the energy available to higher levels.
- en: The correct option is c.
tier: C
