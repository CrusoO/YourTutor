id: A.12.biology.ecosystem.decomposition.04
skill_ids:
- SK.A.12.biology.decomposition
difficulty: 0.6
pool: practice
role: apply
stem:
  en: In a carbon cycle diagram, carbon moves from dead matter back to the air. Which process releases this carbon?
hints:
- level: 1
  en: Think about the process in decomposers that releases carbon dioxide.
- level: 2
  en: Consider the living process that uses oxygen and gives off carbon dioxide.
- level: 3
  en: Separate processes that remove carbon dioxide from those that release it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Pollination by insects
- id: b
  en: Photosynthesis by producers
- id: c
  en: Respiration by decomposers
- id: d
  en: Transpiration by leaves
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.A2891080528F
  when_answer_equals:
  - b
- id: MC.A.A2398A6F9726
  when_answer_equals:
  - a
- id: MC.A.144513BB7395
  when_answer_equals:
  - d
solution_steps:
- en: Decomposers respire organic carbon from dead matter and release carbon dioxide to the atmosphere.
- en: Photosynthesis removes carbon dioxide from the air instead.
- en: The correct option is c.
tier: C
diagram_note: Draw a carbon cycle showing atmospheric carbon dioxide, producers, consumers, dead matter and decomposers, with arrows for photosynthesis, respiration and combustion.
