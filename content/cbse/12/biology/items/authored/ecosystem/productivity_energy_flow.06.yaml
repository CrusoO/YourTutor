difficulty: 0.9
pool: practice
role: apply
stem:
  en: Herbivores eat 100 kg of plant matter, and 10 percent of it becomes herbivore biomass. A carnivore eats 20 percent of that herbivore biomass. How many kg of carnivore biomass result? Give the number only.
hints:
- level: 1
  en: Apply the first transfer percentage to the plant matter.
- level: 2
  en: Apply the second percentage to the herbivore biomass.
- level: 3
  en: Check that the unit is kilograms.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: Ten percent of 100 kg is 10 kg of herbivore biomass, and 20 percent of that is 2 kg of carnivore biomass.
- en: The unit of the answer is kg.
- en: Answer = 2
tier: C
diagram_note: Sketch a biomass pyramid with producers, herbivores and carnivores, with the transfer percentages marked on the arrows between levels.
