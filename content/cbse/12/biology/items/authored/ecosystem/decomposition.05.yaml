id: A.12.biology.ecosystem.decomposition.05
skill_ids:
- SK.A.12.biology.decomposition
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A field shows a very low decomposition rate. Which environmental condition is most likely limiting decomposition?
hints:
- level: 1
  en: Think about the conditions that microbes need for their activity.
- level: 2
  en: Consider which factor slows enzyme driven breakdown.
- level: 3
  en: Compare the conditions in soils with fast and slow decay.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Low oxygen and cold temperatures that slow microbial activity
- id: b
  en: High carbon dioxide in the soil air only
- id: c
  en: High moisture and warmth in the soil
- id: d
  en: Excess sunlight on the soil surface
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.CE97A80DD5F1
  when_answer_equals:
  - c
- id: MC.A.01B15DDDD4E6
  when_answer_equals:
  - d
- id: MC.A.B268CD0EE7CE
  when_answer_equals:
  - b
solution_steps:
- en: Decomposers need oxygen and warmth to respire and grow, so waterlogged, cold or low oxygen conditions slow decomposition.
- en: Warm, moist, aerated soil generally speeds it up.
- en: The correct option is a.
tier: C
