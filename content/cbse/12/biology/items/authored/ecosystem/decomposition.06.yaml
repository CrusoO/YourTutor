stem:
  en: A litter bag starts at 50 g and loses 40 percent of its mass in 6 months. How many grams remain? Give the number only.
hints:
- level: 1
  en: Find the portion that remains after the loss.
- level: 2
  en: Multiply the starting mass by the remaining fraction.
- level: 3
  en: Check that the unit is grams.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '30'
  accept: []
solution_steps:
- en: Forty percent of 50 g is 20 g lost, which leaves 30 g of litter.
- en: The unit of the answer is g.
- en: Answer = 30
tier: C
diagram_note: Sketch a litter bag placed in soil with its starting mass and a 6 month time marker labelled.
