solution_steps:
- en: 'Write the relation: series: 1/C = 1/C1 + 1/C2, so C = C1 x C2 / (C1 + C2).'
- en: 'Put each quantity in SI units: 30 μF = 3 x 10^-5 F; 20 μF = 2 x 10^-5 F.'
- en: 'Substitute: Cs = (3 x 10^-5) x (2 x 10^-5) / ((3 x 10^-5) + (2 x 10^-5)).'
- en: 'Calculate: Cs = 1.2 x 10^-5 F.'
- en: 'Give it in μF: 12 μF.'
- en: So the series capacitance is 12 μF.
- en: The correct option is c.
