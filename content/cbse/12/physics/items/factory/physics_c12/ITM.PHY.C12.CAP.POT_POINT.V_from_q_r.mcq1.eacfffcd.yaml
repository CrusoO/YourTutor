solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 2 nC = 2 x 10^-9 C; 5 cm = 0.05 m.'
- en: 'Substitute: V = (9 x 10^9) x (2 x 10^-9) / 0.05.'
- en: 'Calculate: V = 360 V.'
- en: So the potential is 360 V.
