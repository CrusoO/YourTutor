stem:
  en: The maximum kinetic energy of the emitted electrons, Kj, is 7.78 x 10^-20 J
    and the work function of the metal, phi, is 2 eV. Find the frequency of the light.
    Take Planck's constant, h, = 6.63 x 10^-34 J s.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: K = h x f - work function, so f = (K + work function) / h.'
- level: 2
  en: The relation already gives the frequency directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 2 eV as 3.2 x 10^-19 J, then write f = (Kj + phi) / h, where
    f is the frequency, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the frequency have, and roughly how large
    is it?
