solution_steps:
- en: 'Write the relation: K = h x f - work function, so f = (K + work function) /
    h.'
- en: 'Put each quantity in SI units: 2 eV = 3.2 x 10^-19 J.'
- en: 'Substitute: f = ((7.78 x 10^-20) + (3.2 x 10^-19)) / (6.63 x 10^-34).'
- en: 'Calculate: f = 6 x 10^14 Hz.'
- en: So the frequency is 6 x 10^14 Hz.
- en: The correct option is b.
