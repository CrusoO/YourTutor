solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 10 μC = 1 x 10^-5 C; 2 μC = 2 x 10^-6 C.'
- en: 'Substitute: F = (9 x 10^9) x (1 x 10^-5) x (2 x 10^-6) / 5^2.'
- en: 'Calculate: F = 0.0072 N.'
- en: So the force is 0.0072 N.
