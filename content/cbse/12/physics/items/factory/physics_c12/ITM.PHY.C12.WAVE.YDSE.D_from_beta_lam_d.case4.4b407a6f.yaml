stem:
  en: 'Case: a student investigates Young''s double slit experiment and records the
    following. The fringe width, beta, is 0.75 mm, the wavelength of the light, lam,
    is 600 nm and the slits are 0.4 mm apart. Find the distance from the slits to
    the screen.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: fringe width = wavelength x D / d.'
- level: 2
  en: The relation already gives the screen distance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 0.75 mm as 7.5 x 10^-4 m, 600 nm as 6 x 10^-7 m and 0.4 mm
    as 4 x 10^-4 m, then write D = beta x d / lam, where D is the screen distance,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the screen distance have, and roughly
    how large is it?
