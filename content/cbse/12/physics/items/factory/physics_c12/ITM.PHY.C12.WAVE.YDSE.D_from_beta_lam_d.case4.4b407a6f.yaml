solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 0.75 mm = 7.5 x 10^-4 m; 600 nm = 6 x 10^-7
    m; 0.4 mm = 4 x 10^-4 m.'
- en: 'Substitute: D = (7.5 x 10^-4) x (4 x 10^-4) / (6 x 10^-7).'
- en: 'Calculate: D = 0.5 m.'
- en: So the screen distance is 0.5 m.
- en: The correct option is d.
