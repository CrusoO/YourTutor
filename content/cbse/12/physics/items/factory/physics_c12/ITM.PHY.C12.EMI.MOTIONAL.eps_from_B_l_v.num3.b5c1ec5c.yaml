solution_steps:
- en: 'Write the relation: emf = B x l x v.'
- en: 'Put each quantity in SI units: 100 mT = 0.1 T; 10 cm = 0.1 m.'
- en: 'Substitute: eps = 0.1 x 0.1 x 5.'
- en: 'Calculate: eps = 0.05 V.'
- en: 'Give it in mV: 50 mV.'
- en: So the induced emf is 50 mV.
- en: The correct option is d.
