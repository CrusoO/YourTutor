solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 3 μC = 3 x 10^-6 C; 5 μC = 5 x 10^-6 C; 3 cm
    = 0.03 m.'
- en: 'Substitute: F = (9 x 10^9) x (3 x 10^-6) x (5 x 10^-6) / 0.03^2.'
- en: 'Calculate: F = 150 N.'
- en: So the force is 150 N.
- en: The correct option is a.
