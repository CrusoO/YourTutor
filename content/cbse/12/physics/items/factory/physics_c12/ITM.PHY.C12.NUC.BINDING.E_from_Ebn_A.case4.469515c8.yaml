stem:
  en: 'Case: a student investigates the binding energy of a nucleus and records the
    following. The binding energy per nucleon, Ebn, is 1.863 MeV and the mass number,
    A, is 20. Find the total binding energy.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: binding energy per nucleon = binding energy / A.'
- level: 2
  en: The relation already gives the binding energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 1.863 MeV as 2.9808 x 10^-13 J, then write E = Ebn x A, where
    E is the binding energy, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the binding energy have, and roughly
    how large is it?
