stem:
  en: The refractive index of the glass, n, is 1.5, the radius of curvature of the
    convex surface, R, is 20 cm and a point object in air, d, is 10 cm from the surface
    on its axis. Find the distance of the image from the surface.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: n/v - 1/d = (n - 1)/R, with the distances as positive numbers
    for a real object and a real image in the glass.'
- level: 2
  en: The relation already gives the image distance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 20 cm as 0.2 m and 10 cm as 0.1 m, then write v = n x R x
    d / ((n - 1) x d + R), where v is the image distance, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the image distance have, and roughly
    how large is it?
