solution_steps:
- en: 'Write the relation: n/v - 1/d = (n - 1)/R, with the distances as positive numbers
    for a real object and a real image in the glass.'
- en: 'Put each quantity in SI units: 30 cm = 0.3 m; 60 cm = 0.6 m.'
- en: 'Substitute: v = 1.5 x 0.3 x 0.6 / ((1.5 - 1) x 0.6 + 0.3).'
- en: 'Calculate: v = 0.45 m.'
- en: 'Give it in cm: 45 cm.'
- en: So the image distance is 45 cm.
- en: The correct option is b.
