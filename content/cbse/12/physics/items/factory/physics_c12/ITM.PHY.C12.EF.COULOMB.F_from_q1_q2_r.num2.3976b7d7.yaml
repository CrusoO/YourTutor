solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 3 nC = 3 x 10^-9 C; 2 nC = 2 x 10^-9 C.'
- en: 'Substitute: F = (9 x 10^9) x (3 x 10^-9) x (2 x 10^-9) / 5^2.'
- en: 'Calculate: F = 2.16 x 10^-9 N.'
- en: So the force is 2.16 x 10^-9 N.
- en: The correct option is c.
