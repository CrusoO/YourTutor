stem:
  en: This question is about the force between two point charges. The first charge,
    q1, is 3 nC, the second charge, q2, is 2 nC and the separation of the charges,
    r, is 5 m. Find the force between the charges. Take k = 9 x 10^9 N m²/C².
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: F = k x q1 x q2 / r^2.'
- level: 2
  en: The relation already gives the force directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 3 nC as 3 x 10^-9 C and 2 nC as 2 x 10^-9 C, then write F
    = k x q1 x q2 / r^2, where F is the force, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the force have, and roughly how large
    is it?
