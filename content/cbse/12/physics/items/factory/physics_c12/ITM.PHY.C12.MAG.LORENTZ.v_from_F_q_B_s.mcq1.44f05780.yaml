solution_steps:
- en: 'Write the relation: F = q x v x B x sine of the angle.'
- en: 'Put each quantity in SI units: 500 mT = 0.5 T.'
- en: 'Get the speed alone: divide each side by q x B x sine of the angle.'
- en: 'Substitute: v = (4 x 10^-14) / ((1.6 x 10^-19) x 0.5 x 0.5).'
- en: 'Calculate: v = 1 x 10^6 m/s.'
- en: So the speed is 1 x 10^6 m/s.
- en: The correct option is c.
