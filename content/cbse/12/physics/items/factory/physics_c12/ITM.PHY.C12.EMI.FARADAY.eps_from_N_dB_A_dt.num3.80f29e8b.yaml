solution_steps:
- en: 'Write the relation: flux change = dB x A, then emf = N x [flux change] / time.'
- en: 'Put each quantity in SI units: 20 cm² = 0.002 m²; 100 ms = 0.1 s.'
- en: 'Substitute: eps = 500 x 0.2 x 0.002 / 0.1.'
- en: 'Calculate: eps = 2 V.'
- en: So the induced emf is 2 V.
- en: The correct option is c.
