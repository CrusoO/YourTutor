solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 88.5 pF = 8.85 x 10^-11 F; 200 cm² = 0.02 m²;
    2 mm = 0.002 m.'
- en: 'Get the dielectric constant alone: multiply each side by d and divide each
    side by eps0 x A.'
- en: 'Substitute: K = (8.85 x 10^-11) x 0.002 / ((8.85 x 10^-12) x 0.02).'
- en: 'Calculate: K = 1.'
- en: So the dielectric constant is 1.
- en: The correct option is c.
