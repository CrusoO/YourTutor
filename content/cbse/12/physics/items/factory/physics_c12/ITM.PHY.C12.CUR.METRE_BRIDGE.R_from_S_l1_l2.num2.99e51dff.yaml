solution_steps:
- en: 'Write the relation: R / S = l1 / l2.'
- en: 'Put each quantity in SI units: 25 cm = 0.25 m; 75 cm = 0.75 m.'
- en: 'Substitute: R = 30 x 0.25 / 0.75.'
- en: 'Calculate: R = 10 Ω.'
- en: So the known resistance is 10 Ω.
- en: The correct option is a.
