solution_steps:
- en: 'Write the relation: binding energy per nucleon = mass defect x energy of one
    atomic mass unit / A.'
- en: 'Put each quantity in SI units: 0.8 u = 1.328 x 10^-27 kg.'
- en: 'Substitute: Ebn = (1.328 x 10^-27) x 8.98e + 16 / 40.'
- en: 'Calculate: Ebn = 2.9808 x 10^-12 J.'
- en: 'Give it in MeV: 18.63 MeV.'
- en: So the binding energy per nucleon is 18.63 MeV.
- en: The correct option is b.
