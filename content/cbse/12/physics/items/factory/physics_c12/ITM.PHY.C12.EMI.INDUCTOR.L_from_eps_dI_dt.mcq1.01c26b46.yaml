solution_steps:
- en: 'Write the relation: emf = L x current change / time.'
- en: 'Put each quantity in SI units: 50 ms = 0.05 s.'
- en: 'Get the inductance alone: multiply each side by the time and divide each side
    by the change in current.'
- en: 'Substitute: L = 0.2 x 0.05 / 1.'
- en: 'Calculate: L = 0.01 H.'
- en: 'Give it in mH: 10 mH.'
- en: So the inductance is 10 mH.
- en: The correct option is c.
