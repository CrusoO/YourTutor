stem:
  en: 'Case: a student investigates a transistor in the common emitter connection
    and records the following. The collector current, Ic, is 0.5 mA and the emitter
    current, Ie, is 0.525 mA. Find the base current.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: emitter current = base current + collector current.'
- level: 2
  en: The relation already gives the base current directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 0.5 mA as 5 x 10^-4 A and 0.525 mA as 5.25 x 10^-4 A, then
    write Ib = Ie - Ic, where Ib is the base current, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the base current have, and roughly how
    large is it?
