stem:
  en: A student is studying a series LCR circuit on an alternating supply. The rms
    current, I, is 1.5 A and the resistance, R, is 60 Ω. Find the average power used.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: P = I^2 x R, only the resistor uses power.'
- level: 2
  en: The relation already gives the average power directly, so decide what to substitute.
- level: 3
  en: 'First step: write P = I^2 x R, where P is the average power, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the average power have, and roughly how
    large is it?
