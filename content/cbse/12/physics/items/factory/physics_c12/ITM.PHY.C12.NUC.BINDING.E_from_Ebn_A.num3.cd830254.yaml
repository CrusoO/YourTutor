solution_steps:
- en: 'Write the relation: binding energy per nucleon = binding energy / A.'
- en: 'Put each quantity in SI units: 74.52 MeV = 1.19232 x 10^-11 J.'
- en: 'Substitute: E = (1.19232 x 10^-11) x 10.'
- en: 'Calculate: E = 1.19232 x 10^-10 J.'
- en: 'Give it in MeV: 745.2 MeV.'
- en: So the binding energy is 745.2 MeV.
- en: The correct option is b.
