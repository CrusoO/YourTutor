stem:
  en: 'Case: a student investigates a charged capacitor and records the following.
    The charge stored, Q, is 4400 μC and the capacitance, C, is 20 μF. Find the energy
    stored.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: U = Q^2 / (2 x C).'
- level: 2
  en: The relation already gives the stored energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 4400 μC as 0.0044 C and 20 μF as 2 x 10^-5 F, then write
    U = Q^2 / (2 x C), where U is the stored energy, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the stored energy have, and roughly how
    large is it?
