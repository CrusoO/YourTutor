solution_steps:
- en: 'Write the relation: U = Q^2 / (2 x C).'
- en: 'Put each quantity in SI units: 4400 μC = 0.0044 C; 20 μF = 2 x 10^-5 F.'
- en: 'Substitute: U = 0.0044^2 / (2 x (2 x 10^-5)).'
- en: 'Calculate: U = 0.484 J.'
- en: 'Give it in μJ: 484000 μJ.'
- en: So the stored energy is 484000 μJ.
- en: The correct option is b.
