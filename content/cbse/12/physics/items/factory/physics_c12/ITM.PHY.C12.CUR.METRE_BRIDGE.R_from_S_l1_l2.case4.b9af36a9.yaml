solution_steps:
- en: 'Write the relation: R / S = l1 / l2.'
- en: 'Put each quantity in SI units: 60 cm = 0.6 m; 40 cm = 0.4 m.'
- en: 'Substitute: R = 2 x 0.6 / 0.4.'
- en: 'Calculate: R = 3 Ω.'
- en: So the known resistance is 3 Ω.
- en: The correct option is c.
