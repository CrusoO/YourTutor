solution_steps:
- en: 'Write the relation: the shunt takes the extra current: Ig x G = (I - Ig) x
    S.'
- en: 'Put each quantity in SI units: 10 mA = 0.01 A; 110 mA = 0.11 A.'
- en: 'Get the shunt alone: divide each side of Ig x G = (I - Ig) x S by (I - Ig).'
- en: 'Substitute: S = 50 x 0.01 / (0.11 - 0.01).'
- en: 'Calculate: S = 5 Ω.'
- en: So the shunt is 5 Ω.
- en: The correct option is c.
