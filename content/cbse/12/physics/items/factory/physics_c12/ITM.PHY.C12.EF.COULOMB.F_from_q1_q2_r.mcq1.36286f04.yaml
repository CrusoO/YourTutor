solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 3 nC = 3 x 10^-9 C; 4 nC = 4 x 10^-9 C; 3 cm
    = 0.03 m.'
- en: 'Substitute: F = (9 x 10^9) x (3 x 10^-9) x (4 x 10^-9) / 0.03^2.'
- en: 'Calculate: F = 1.2 x 10^-4 N.'
- en: So the force is 1.2 x 10^-4 N.
