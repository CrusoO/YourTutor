solution_steps:
- en: 'Plan: the number of half-lives is t / T.'
- en: 'Put each quantity in SI units: 10 days = 864000 s.'
- en: 'Substitute: t = 2 x 864000.'
- en: 'Calculate: t = 1.728 x 10^6 s.'
- en: 'Give it in days: 20 days.'
- en: So the time is 20 days.
- en: The correct option is d.
