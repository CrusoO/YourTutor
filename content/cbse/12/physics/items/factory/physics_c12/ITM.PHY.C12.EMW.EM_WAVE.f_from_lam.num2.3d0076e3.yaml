solution_steps:
- en: 'Write the relation: c = f x wavelength.'
- en: 'Get the frequency alone: divide each side by the wavelength.'
- en: 'Substitute: f = (3 x 10^8) / 3.'
- en: 'Calculate: f = 1 x 10^8 Hz.'
- en: 'Give it in MHz: 100 MHz.'
- en: So the frequency is 100 MHz.
