stem:
  en: This question is about converting a galvanometer into an ammeter or a voltmeter.
    The galvanometer coil has a resistance of 50 Ω, its full scale deflection needs
    10 mA and the shunt resistance, S, is 1 Ω. Find the largest current the ammeter
    can read.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: Ig x G = (I - Ig) x S, so I = Ig x (G + S) / S.'
- level: 2
  en: The relation already gives the ammeter range directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 10 mA as 0.01 A, then write I = Ig x (G + S) / S, where I
    is the ammeter range, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the ammeter range have, and roughly how
    large is it?
