solution_steps:
- en: 'Write the relation: Ig x G = (I - Ig) x S, so I = Ig x (G + S) / S.'
- en: 'Put each quantity in SI units: 10 mA = 0.01 A.'
- en: 'Substitute: I = 0.01 x (50 + 1) / 1.'
- en: 'Calculate: I = 0.51 A.'
- en: 'Give it in mA: 510 mA.'
- en: So the ammeter range is 510 mA.
- en: The correct option is d.
