solution_steps:
- en: 'Write the relation: collector current = beta x base current.'
- en: 'Put each quantity in SI units: 25 μA = 2.5 x 10^-5 A.'
- en: 'Substitute: Ic = 20 x (2.5 x 10^-5).'
- en: 'Calculate: Ic = 5 x 10^-4 A.'
- en: 'Give it in mA: 0.5 mA.'
- en: So the collector current is 0.5 mA.
- en: The correct option is d.
