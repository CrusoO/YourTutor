stem:
  en: This question is about a transistor in the common emitter connection. The current
    gain, beta, is 20 and the base current, Ib, is 25 μA. Find the collector current.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: collector current = beta x base current.'
- level: 2
  en: The relation already gives the collector current directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 25 μA as 2.5 x 10^-5 A, then write Ic = beta x Ib, where
    Ic is the collector current, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the collector current have, and roughly
    how large is it?
