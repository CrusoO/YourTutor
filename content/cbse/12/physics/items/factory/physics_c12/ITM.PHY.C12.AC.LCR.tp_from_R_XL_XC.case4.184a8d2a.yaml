stem:
  en: 'Case: a student investigates a series LCR circuit on an alternating supply
    and records the following. The resistance, R, is 16 Ω, the inductive reactance,
    XL, is 30 Ω and the capacitive reactance, XC, is 18 Ω. Find tan of the phase angle.'
