solution_steps:
- en: 'Write the relation: K = h x f - work function, so f = (K + work function) /
    h.'
- en: 'Put each quantity in SI units: 1.5 eV = 2.4 x 10^-19 J.'
- en: 'Substitute: f = ((4.23 x 10^-19) + (2.4 x 10^-19)) / (6.63 x 10^-34).'
- en: 'Calculate: f = 1 x 10^15 Hz.'
- en: So the frequency is 1 x 10^15 Hz.
- en: The correct option is c.
