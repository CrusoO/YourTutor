stem:
  en: 'Case: a student investigates a coil in a changing magnetic field and records
    the following. The number of turns, N, is 500, the flux through the coil changes
    by 1 mWb and the change takes 10 ms. Find the magnitude of the induced emf.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: emf = N x flux change / time.'
- level: 2
  en: The relation already gives the induced emf directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 1 mWb as 0.001 Wb and 10 ms as 0.01 s, then write eps = N
    x dPhi / dt, where eps is the induced emf, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the induced emf have, and roughly how
    large is it?
