solution_steps:
- en: 'Write the relation: emf = N x flux change / time.'
- en: 'Put each quantity in SI units: 1 mWb = 0.001 Wb; 10 ms = 0.01 s.'
- en: 'Substitute: eps = 500 x 0.001 / 0.01.'
- en: 'Calculate: eps = 50 V.'
- en: So the induced emf is 50 V.
- en: The correct option is a.
