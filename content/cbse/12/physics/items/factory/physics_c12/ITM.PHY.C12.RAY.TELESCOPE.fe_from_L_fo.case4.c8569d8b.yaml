stem:
  en: 'Case: a student investigates an astronomical telescope in normal adjustment
    and records the following. The distance between the lenses, L, is 102.5 cm and
    the focal length of the objective, fo, is 100 cm. Find the focal length of the
    eyepiece.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: tube length = fo + fe in normal adjustment.'
- level: 2
  en: 'Get the eyepiece focal length on its own before you put numbers in: subtract
    fo from each side. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 102.5 cm as 1.025 m and 100 cm as 1 m, then write fe = L
    - fo, where fe is the eyepiece focal length, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the eyepiece focal length have, and roughly
    how large is it?
