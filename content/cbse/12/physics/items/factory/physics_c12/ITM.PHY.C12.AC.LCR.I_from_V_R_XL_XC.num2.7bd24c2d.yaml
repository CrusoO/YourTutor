solution_steps:
- en: 'Write the relation: Z = square root of (R^2 + (XL - XC)^2), then I = V / Z.'
- en: 'Substitute: I = 100 / sqrt(60^2 + (100 - 20)^2).'
- en: 'Calculate: I = 1 A.'
- en: So the rms current is 1 A.
- en: The correct option is b.
