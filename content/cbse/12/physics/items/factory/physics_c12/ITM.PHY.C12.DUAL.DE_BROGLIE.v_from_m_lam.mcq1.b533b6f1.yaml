solution_steps:
- en: 'Write the relation: wavelength = h / [m x v], so v = h / [m x wavelength].'
- en: 'Put each quantity in SI units: 0.5 nm = 5 x 10^-10 m.'
- en: 'Substitute: v = (6.63 x 10^-34) / ((1.326 x 10^-26) x (5 x 10^-10)).'
- en: 'Calculate: v = 100 m/s.'
- en: So the speed is 100 m/s.
- en: The correct option is a.
