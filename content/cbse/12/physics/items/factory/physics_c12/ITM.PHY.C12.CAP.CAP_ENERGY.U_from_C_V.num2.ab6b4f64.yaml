solution_steps:
- en: 'Write the relation: U = (1/2) x C x V^2.'
- en: 'Put each quantity in SI units: 50 μF = 5 x 10^-5 F.'
- en: 'Substitute: U = (5 x 10^-5) x 5^2 / 2.'
- en: 'Calculate: U = 6.25 x 10^-4 J.'
- en: 'Give it in μJ: 625 μJ.'
- en: So the stored energy is 625 μJ.
- en: The correct option is c.
