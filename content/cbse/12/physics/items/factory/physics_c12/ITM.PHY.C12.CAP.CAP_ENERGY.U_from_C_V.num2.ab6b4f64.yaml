stem:
  en: This question is about a charged capacitor. The capacitance, C, is 50 μF and
    the potential difference across it, V, is 5 V. Find the energy stored.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: U = (1/2) x C x V^2.'
- level: 2
  en: The relation already gives the stored energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 50 μF as 5 x 10^-5 F, then write U = C x V^2 / 2, where U
    is the stored energy, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the stored energy have, and roughly how
    large is it?
