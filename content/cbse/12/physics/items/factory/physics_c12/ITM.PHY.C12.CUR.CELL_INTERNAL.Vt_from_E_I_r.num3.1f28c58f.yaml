stem:
  en: A student is studying a cell with internal resistance driving a resistor. The
    emf of the cell, E, is 9 V, the current, I, is 1.5 A and its internal resistance,
    r, is 1 Ω. Find the terminal voltage of the cell.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: terminal voltage V = E - I x r.'
- level: 2
  en: The relation already gives the terminal voltage directly, so decide what to
    substitute.
- level: 3
  en: 'First step: write Vt = E - I x r, where Vt is the terminal voltage, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the terminal voltage have, and roughly
    how large is it?
