solution_steps:
- en: 'Write the relation: beta = collector current / base current.'
- en: 'Put each quantity in SI units: 0.5 mA = 5 x 10^-4 A; 25 μA = 2.5 x 10^-5 A.'
- en: 'Substitute: beta = (5 x 10^-4) / (2.5 x 10^-5).'
- en: 'Calculate: beta = 20.'
- en: So the current gain is 20.
