stem:
  en: This question is about a transistor in the common emitter connection. The collector
    current, Ic, is 0.5 mA and the base current, Ib, is 25 μA. Find the current gain.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: beta = collector current / base current.'
- level: 2
  en: The relation already gives the current gain directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 0.5 mA as 5 x 10^-4 A and 25 μA as 2.5 x 10^-5 A, then write
    beta = Ic / Ib, where beta is the current gain, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the current gain be?
