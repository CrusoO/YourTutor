solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Put each quantity in SI units: 4 nC = 4 x 10^-9 C.'
- en: 'Get the distance alone: multiply each side by r^2, divide each side by E, then
    take the square root.'
- en: 'Substitute: r = sqrt((9 x 10^9) x (4 x 10^-9) / 1.44).'
- en: 'Calculate: r = 5 m.'
- en: So the distance is 5 m.
- en: The correct option is a.
