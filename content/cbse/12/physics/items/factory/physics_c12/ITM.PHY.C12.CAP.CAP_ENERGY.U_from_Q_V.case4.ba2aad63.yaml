solution_steps:
- en: 'Write the relation: U = (1/2) x Q x V.'
- en: 'Put each quantity in SI units: 200 μC = 2 x 10^-4 C.'
- en: 'Substitute: U = (2 x 10^-4) x 50 / 2.'
- en: 'Calculate: U = 0.005 J.'
- en: 'Give it in μJ: 5000 μJ.'
- en: So the stored energy is 5000 μJ.
- en: The correct option is c.
