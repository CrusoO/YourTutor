stem:
  en: A student is studying a series LCR circuit on an alternating supply. The resistance,
    R, is 16 Ω and the impedance, Z, is 20 Ω. Find the power factor of the circuit.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: power factor = cosine of phi = R / Z.'
- level: 2
  en: 'Get the power factor on its own before you put numbers in: no rearranging is
    needed. Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write cosp = R / Z, where cosp is the power factor, with the values
    in place, one quantity at a time.'
