stem:
  en: A student is studying the electric field of a point charge. The field, E, is
    2.25 N/C and the distance from the charge, r, is 2 m. Find the charge. Take k
    = 9 x 10^9 N m²/C².
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: E = k x q / r^2.'
- level: 2
  en: 'Get the charge on its own before you put numbers in: multiply each side by
    r^2 and divide each side by k. Do the same operation to each side of the formula.
    Change every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: write q = E x r^2 / k, where q is the charge, with the values in
    place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the charge have, and roughly how large
    is it?
