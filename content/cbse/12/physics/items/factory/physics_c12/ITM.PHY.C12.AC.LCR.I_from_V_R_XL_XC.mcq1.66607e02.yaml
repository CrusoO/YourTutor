stem:
  en: The rms supply voltage, V, is 150 V, the resistance, R, is 7 Ω, the inductive
    reactance, XL, is 34 Ω and the capacitive reactance, XC, is 10 Ω. Find the rms
    current.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: Z = square root of (R^2 + (XL - XC)^2), then I = V / Z.'
- level: 2
  en: The relation already gives the rms current directly, so decide what to substitute.
- level: 3
  en: 'First step: write I = V / sqrt(R^2 + (XL - XC)^2), where I is the rms current,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the rms current have, and roughly how
    large is it?
