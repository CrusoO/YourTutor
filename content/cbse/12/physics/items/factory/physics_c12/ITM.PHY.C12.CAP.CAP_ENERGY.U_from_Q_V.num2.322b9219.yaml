solution_steps:
- en: 'Write the relation: U = (1/2) x Q x V.'
- en: 'Put each quantity in SI units: 1000 μC = 0.001 C.'
- en: 'Substitute: U = 0.001 x 100 / 2.'
- en: 'Calculate: U = 0.05 J.'
- en: 'Give it in μJ: 50000 μJ.'
- en: So the stored energy is 50000 μJ.
- en: The correct option is d.
