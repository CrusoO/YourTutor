stem:
  en: This question is about a charged capacitor. The charge stored, Q, is 1000 μC
    and the potential difference across it, V, is 100 V. Find the energy stored.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: U = (1/2) x Q x V.'
- level: 2
  en: The relation already gives the stored energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 1000 μC as 0.001 C, then write U = Q x V / 2, where U is
    the stored energy, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the stored energy have, and roughly how
    large is it?
