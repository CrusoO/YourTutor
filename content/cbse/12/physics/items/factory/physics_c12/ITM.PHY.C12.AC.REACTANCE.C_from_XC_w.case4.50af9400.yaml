solution_steps:
- en: 'Write the relation: XC = 1 / [w x C].'
- en: 'Get the capacitance alone: multiply each side by C, then divide each side by
    XC x w.'
- en: 'Substitute: C = 1 / (250 x 800).'
- en: 'Calculate: C = 5 x 10^-6 F.'
- en: 'Give it in μF: 5 μF.'
- en: So the capacitance is 5 μF.
- en: The correct option is b.
