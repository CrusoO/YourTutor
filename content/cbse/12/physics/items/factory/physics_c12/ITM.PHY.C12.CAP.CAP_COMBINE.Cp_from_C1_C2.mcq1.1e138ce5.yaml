solution_steps:
- en: 'Write the relation: parallel: C = C1 + C2.'
- en: 'Put each quantity in SI units: 30 μF = 3 x 10^-5 F; 20 μF = 2 x 10^-5 F.'
- en: 'Substitute: Cp = (3 x 10^-5) + (2 x 10^-5).'
- en: 'Calculate: Cp = 5 x 10^-5 F.'
- en: 'Give it in μF: 50 μF.'
- en: So the parallel capacitance is 50 μF.
- en: The correct option is d.
