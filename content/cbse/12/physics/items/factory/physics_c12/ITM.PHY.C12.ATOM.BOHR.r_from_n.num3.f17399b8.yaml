stem:
  en: A student is studying the hydrogen atom in the Bohr model. The principal quantum
    number, n, is 5. Find the radius of that orbit. Take the radius of the first Bohr
    orbit, a0, = 5.3 x 10^-11 m.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Plan the steps: the radius
    of the n-th orbit is a0 times n squared.'
- level: 2
  en: Work through the plan one step at a time. Change every quantity to SI units
    first, and change back at the end if asked.
- level: 3
  en: 'First step: write r = a0 x n^2, where r is the orbit radius, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the orbit radius have, and roughly how
    large is it?
