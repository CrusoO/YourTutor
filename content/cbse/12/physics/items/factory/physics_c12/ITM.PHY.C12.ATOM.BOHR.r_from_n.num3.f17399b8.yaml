solution_steps:
- en: 'Plan: the radius of the n-th orbit is a0 times n squared.'
- en: 'Substitute: r = (5.3 x 10^-11) x 5^2.'
- en: 'Calculate: r = 1.325 x 10^-9 m.'
- en: 'Give it in pm: 1325 pm.'
- en: So the orbit radius is 1325 pm.
