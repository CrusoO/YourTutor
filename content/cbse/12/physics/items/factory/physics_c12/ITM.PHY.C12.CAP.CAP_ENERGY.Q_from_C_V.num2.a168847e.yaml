solution_steps:
- en: 'Write the relation: Q = C x V.'
- en: 'Put each quantity in SI units: 100 μF = 1 x 10^-4 F.'
- en: 'Substitute: Q = (1 x 10^-4) x 20.'
- en: 'Calculate: Q = 0.002 C.'
- en: 'Give it in μC: 2000 μC.'
- en: So the charge is 2000 μC.
- en: The correct option is c.
