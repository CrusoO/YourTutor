solution_steps:
- en: 'Write the relation: B = mu0 x n x I inside a long solenoid.'
- en: 'Put each quantity in SI units: 0.628 mT = 6.28 x 10^-4 T.'
- en: 'Get the turns per metre alone: divide each side by mu0 x I.'
- en: 'Substitute: n = (6.28 x 10^-4) / ((1.256 x 10^-6) x 1).'
- en: 'Calculate: n = 500 m⁻¹.'
- en: So the turns per metre is 500 m⁻¹.
- en: The correct option is c.
