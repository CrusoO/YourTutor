stem:
  en: The field inside the solenoid, Bs, is 0.628 mT and the current, I, is 1 A. Find
    the number of turns on each metre of the solenoid. Take the permeability of free
    space, mu0, = 1.256 x 10^-6 N/A².
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: B = mu0 x n x I inside a long solenoid.'
- level: 2
  en: 'Get the turns per metre on its own before you put numbers in: divide each side
    by mu0 x I. Do the same operation to each side of the formula. Change every quantity
    to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 0.628 mT as 6.28 x 10^-4 T, then write n = Bs / (mu0 x I),
    where n is the turns per metre, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the turns per metre have, and roughly
    how large is it?
