solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 100 cm² = 0.01 m²; 4 mm = 0.004 m.'
- en: 'Substitute: C = 2 x (8.85 x 10^-12) x 0.01 / 0.004.'
- en: 'Calculate: C = 4.425 x 10^-11 F.'
- en: 'Give it in pF: 44.25 pF.'
- en: So the capacitance is 44.25 pF.
- en: The correct option is b.
