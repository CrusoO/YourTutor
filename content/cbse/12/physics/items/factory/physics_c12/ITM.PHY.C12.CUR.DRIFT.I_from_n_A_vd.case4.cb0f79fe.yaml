solution_steps:
- en: 'Write the relation: I = n x e x A x v_d.'
- en: 'Put each quantity in SI units: 1 mm² = 1 x 10^-6 m²; 1 mm/s = 0.001 m/s.'
- en: 'Substitute: I = (4 x 10^28) x (1.6 x 10^-19) x (1 x 10^-6) x 0.001.'
- en: 'Calculate: I = 6.4 A.'
- en: So the current is 6.4 A.
