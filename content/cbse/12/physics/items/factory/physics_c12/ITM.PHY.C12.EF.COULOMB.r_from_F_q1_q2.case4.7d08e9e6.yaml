stem:
  en: 'Case: a student investigates the force between two point charges and records
    the following. The force between them, F, is 4 x 10^-5 N, the first charge, q1,
    is 2 μC and the second charge, q2, is 2 μC. Find the distance between the charges.
    Take k = 9 x 10^9 N m²/C².'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: F = k x q1 x q2 / r^2.'
- level: 2
  en: 'Get the separation on its own before you put numbers in: multiply each side
    by r^2 and divide each side by F, then take the square root. Do the same operation
    to each side of the formula. Change every quantity to SI units first, and change
    back at the end if asked.'
- level: 3
  en: 'First step: Write 2 μC as 2 x 10^-6 C, then write r = sqrt(k x q1 x q2 / F),
    where r is the separation, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the separation have, and roughly how
    large is it?
