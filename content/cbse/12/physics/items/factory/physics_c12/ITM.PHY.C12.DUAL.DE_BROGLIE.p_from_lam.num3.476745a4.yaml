solution_steps:
- en: 'Write the relation: wavelength = h / p, so p = h / wavelength.'
- en: 'Put each quantity in SI units: 1 nm = 1 x 10^-9 m.'
- en: 'Get the momentum alone: multiply each side by p and divide each side by the
    wavelength.'
- en: 'Substitute: p = (6.63 x 10^-34) / (1 x 10^-9).'
- en: 'Calculate: p = 6.63 x 10^-25 kg m/s.'
- en: So the momentum is 6.63 x 10^-25 kg m/s.
- en: The correct option is b.
