solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 2.1 mm = 0.0021 m; 700 nm = 7 x 10^-7 m.'
- en: 'Substitute: d = (7 x 10^-7) x 1.2 / 0.0021.'
- en: 'Calculate: d = 4 x 10^-4 m.'
- en: 'Give it in mm: 0.4 mm.'
- en: So the slit separation is 0.4 mm.
- en: The correct option is d.
