stem:
  en: A student is studying Young's double slit experiment. The fringe width, beta,
    is 2.1 mm, the wavelength of the light, lam, is 700 nm and the screen, D, is 1.2
    m from the slits. Find the separation of the slits.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: fringe width = wavelength x D / d.'
- level: 2
  en: The relation already gives the slit separation directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 2.1 mm as 0.0021 m and 700 nm as 7 x 10^-7 m, then write
    d = lam x D / beta, where d is the slit separation, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the slit separation have, and roughly
    how large is it?
