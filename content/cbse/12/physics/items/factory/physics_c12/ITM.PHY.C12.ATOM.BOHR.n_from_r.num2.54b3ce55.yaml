solution_steps:
- en: 'Plan: the radius of the n-th orbit is a0 times n squared.'
- en: 'Put each quantity in SI units: 848 pm = 8.48 x 10^-10 m.'
- en: 'Get the quantum number alone: divide each side by a0, then take the square
    root.'
- en: 'Substitute: n = sqrt((8.48 x 10^-10) / (5.3 x 10^-11)).'
- en: 'Calculate: n = 4.'
- en: So the quantum number is 4.
- en: The correct option is b.
