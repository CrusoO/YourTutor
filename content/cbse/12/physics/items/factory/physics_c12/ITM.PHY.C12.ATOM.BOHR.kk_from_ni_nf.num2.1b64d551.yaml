stem:
  en: This question is about the hydrogen atom in the Bohr model. The electron falls
    from the level with n = 2 and to the level with n = 1. Find the wave number (1
    / wavelength) of the line. Take the Rydberg constant, Ry, = 1.1 x 10^7 m⁻¹.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: 1 / wavelength = R x (1/nf^2 - 1/ni^2).'
- level: 2
  en: The relation already gives the wave number directly, so decide what to substitute.
- level: 3
  en: 'First step: write kk = Ry x (1 / nf^2 - 1 / ni^2), where kk is the wave number,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the wave number have, and roughly how
    large is it?
