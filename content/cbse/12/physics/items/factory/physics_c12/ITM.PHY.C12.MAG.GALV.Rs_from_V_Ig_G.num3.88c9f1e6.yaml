stem:
  en: A student is studying converting a galvanometer into an ammeter or a voltmeter.
    The voltmeter must read up to 10 V, its full scale deflection needs 10 mA and
    the galvanometer coil has a resistance of 100 Ω. Find the series resistance needed.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: V = Ig x (G + Rs), so Rs = V / Ig - G.'
- level: 2
  en: The relation already gives the series resistance directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 10 mA as 0.01 A, then write Rs = V / Ig - G, where Rs is
    the series resistance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the series resistance have, and roughly
    how large is it?
