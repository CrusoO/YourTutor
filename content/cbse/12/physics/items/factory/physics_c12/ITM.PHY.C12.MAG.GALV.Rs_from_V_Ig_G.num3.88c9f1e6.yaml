solution_steps:
- en: 'Write the relation: V = Ig x (G + Rs), so Rs = V / Ig - G.'
- en: 'Put each quantity in SI units: 10 mA = 0.01 A.'
- en: 'Substitute: Rs = 10 / 0.01 - 100.'
- en: 'Calculate: Rs = 900 Ω.'
- en: So the series resistance is 900 Ω.
- en: The correct option is a.
