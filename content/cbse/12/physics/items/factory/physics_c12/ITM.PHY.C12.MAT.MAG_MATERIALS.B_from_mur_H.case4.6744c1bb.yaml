stem:
  en: 'Case: a student investigates a magnetic material in an external field and records
    the following. The relative permeability, mur, is 100 and the magnetising field,
    H, is 500 A/m. Find the magnetic field inside the material. Take the permeability
    of free space, mu0, = 1.256 x 10^-6 N/A².'
