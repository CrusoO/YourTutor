solution_steps:
- en: 'Write the relation: emf = N x flux change / time.'
- en: 'Put each quantity in SI units: 10 mWb = 0.01 Wb; 20 ms = 0.02 s.'
- en: 'Get the number of turns alone: multiply each side by the time and divide each
    side by the flux change.'
- en: 'Substitute: N = 50 x 0.02 / 0.01.'
- en: 'Calculate: N = 100.'
- en: So the number of turns is 100.
- en: The correct option is d.
