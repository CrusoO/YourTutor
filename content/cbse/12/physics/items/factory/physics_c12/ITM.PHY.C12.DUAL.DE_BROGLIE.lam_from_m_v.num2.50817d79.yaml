solution_steps:
- en: 'Write the relation: p = m x v, then wavelength = h / p.'
- en: 'Substitute: lam = (6.63 x 10^-34) / ((6.63 x 10^-28) x 2000).'
- en: 'Calculate: lam = 5 x 10^-10 m.'
- en: 'Give it in nm: 0.5 nm.'
- en: So the de Broglie wavelength is 0.5 nm.
