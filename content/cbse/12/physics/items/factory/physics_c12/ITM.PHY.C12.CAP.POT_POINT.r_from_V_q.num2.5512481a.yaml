solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 1 nC = 1 x 10^-9 C.'
- en: 'Get the distance alone: multiply each side by r and divide each side by V.'
- en: 'Substitute: r = (9 x 10^9) x (1 x 10^-9) / 4.5.'
- en: 'Calculate: r = 2 m.'
- en: So the distance is 2 m.
- en: The correct option is b.
