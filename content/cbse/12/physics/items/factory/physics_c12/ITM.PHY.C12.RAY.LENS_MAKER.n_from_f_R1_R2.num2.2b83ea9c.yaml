stem:
  en: This question is about a thin double convex lens in air. The focal length, f,
    is 15 cm, the radius of curvature of the first face, R1, is 10 cm and the radius
    of curvature of the second face, R2, is 15 cm. Find the refractive index of the
    glass.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: 1/f = (n - 1) x (1/R1 + 1/R2), so n = 1 + 1/(f x (1/R1 + 1/R2)).'
- level: 2
  en: The relation already gives the refractive index directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 15 cm as 0.15 m and 10 cm as 0.1 m, then write n = 1 + R1
    x R2 / (f x (R1 + R2)), where n is the refractive index, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the refractive index be?
