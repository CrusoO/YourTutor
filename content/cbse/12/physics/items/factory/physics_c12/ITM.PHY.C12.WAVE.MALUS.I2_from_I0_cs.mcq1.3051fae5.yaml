role: procedure
stem:
  en: The intensity of the incident light, I0, is 100 W/m^2 and the cosine of the
    angle between the pass directions, cs, is 0.8. Find the intensity after the second
    polariser.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: unpolarised light loses half of its intensity at the first polariser,
    then I2 = (I0 / 2) x cosine squared of the angle.'
- level: 2
  en: The relation already gives the final intensity directly, so decide what to substitute.
- level: 3
  en: 'First step: write I2 = I0 x cs^2 / 2, where I2 is the final intensity, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the final intensity have, and roughly
    how large is it?
