solution_steps:
- en: 'Write the relation: c = f x wavelength.'
- en: 'Put each quantity in SI units: 6 MHz = 6 x 10^6 Hz.'
- en: 'Get the wavelength alone: divide each side by the frequency.'
- en: 'Substitute: lam = (3 x 10^8) / (6 x 10^6).'
- en: 'Calculate: lam = 50 m.'
- en: So the wavelength is 50 m.
- en: The correct option is d.
