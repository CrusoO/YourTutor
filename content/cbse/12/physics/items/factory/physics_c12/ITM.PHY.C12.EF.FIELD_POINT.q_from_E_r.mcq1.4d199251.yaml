solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Get the charge alone: multiply each side by r^2 and divide each side by k.'
- en: 'Substitute: q = 1.44 x 5^2 / (9 x 10^9).'
- en: 'Calculate: q = 4 x 10^-9 C.'
- en: 'Give it in nC: 4 nC.'
- en: So the charge is 4 nC.
- en: The correct option is c.
