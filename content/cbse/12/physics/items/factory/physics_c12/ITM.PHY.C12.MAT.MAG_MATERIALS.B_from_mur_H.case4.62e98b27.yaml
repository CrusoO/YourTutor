stem:
  en: 'Case: a student investigates a magnetic material in an external field and records
    the following. The relative permeability, mur, is 2000 and the magnetising field,
    H, is 1000 A/m. Find the magnetic field inside the material. Take the permeability
    of free space, mu0, = 1.256 x 10^-6 N/A².'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: B = mu0 x relative permeability x H.'
- level: 2
  en: The relation already gives the magnetic field directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: write B = mu0 x mur x H, where B is the magnetic field, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the magnetic field have, and roughly
    how large is it?
