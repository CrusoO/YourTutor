solution_steps:
- en: 'Write the relation: B = mu0 x relative permeability x H.'
- en: 'Substitute: B = (1.256 x 10^-6) x 2000 x 1000.'
- en: 'Calculate: B = 2.512 T.'
- en: 'Give it in mT: 2512 mT.'
- en: So the magnetic field is 2512 mT.
