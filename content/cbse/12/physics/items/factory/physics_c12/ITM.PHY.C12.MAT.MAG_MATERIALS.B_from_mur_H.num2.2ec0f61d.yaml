solution_steps:
- en: 'Write the relation: B = mu0 x relative permeability x H.'
- en: 'Substitute: B = (1.256 x 10^-6) x 2000 x 100.'
- en: 'Calculate: B = 0.2512 T.'
- en: 'Give it in mT: 251.2 mT.'
- en: So the magnetic field is 251.2 mT.
