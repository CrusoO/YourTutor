solution_steps:
- en: 'Write the relation: emf = B x l x v, then I = emf / R.'
- en: 'Put each quantity in SI units: 500 mT = 0.5 T; 50 cm = 0.5 m.'
- en: 'Substitute: I = 0.5 x 0.5 x 2 / 2.'
- en: 'Calculate: I = 0.25 A.'
- en: 'Give it in mA: 250 mA.'
- en: So the current is 250 mA.
- en: The correct option is b.
