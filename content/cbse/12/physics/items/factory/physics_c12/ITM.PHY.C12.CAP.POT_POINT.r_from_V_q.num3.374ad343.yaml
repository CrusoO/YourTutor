solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 5 nC = 5 x 10^-9 C.'
- en: 'Get the distance alone: multiply each side by r and divide each side by V.'
- en: 'Substitute: r = (9 x 10^9) x (5 x 10^-9) / 2250.'
- en: 'Calculate: r = 0.02 m.'
- en: 'Give it in cm: 2 cm.'
- en: So the distance is 2 cm.
- en: The correct option is a.
