stem:
  en: 'Case: a student investigates a current-carrying conductor in a magnetic field
    and records the following. The magnetic field, B, is 100 mT, the current, I, is
    2 A, the length of wire in the field, L, is 20 cm and the sine of the angle between
    the wire and the field, s, is 1. Find the force on the wire.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: F = B x I x L x sine of the angle.'
- level: 2
  en: The relation already gives the force directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 100 mT as 0.1 T and 20 cm as 0.2 m, then write F = B x I
    x L x s, where F is the force, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the force have, and roughly how large
    is it?
