solution_steps:
- en: 'Write the relation: F = B x I x L x sine of the angle.'
- en: 'Put each quantity in SI units: 100 mT = 0.1 T; 20 cm = 0.2 m.'
- en: 'Substitute: F = 0.1 x 2 x 0.2 x 1.'
- en: 'Calculate: F = 0.04 N.'
- en: 'Give it in mN: 40 mN.'
- en: So the force is 40 mN.
- en: The correct option is c.
