stem:
  en: This question is about the photoelectric effect at a metal surface. The energy
    of each photon, Eph, is 4.5 eV and the work function of the metal, phi, is 1.5
    eV. Find the maximum kinetic energy of the emitted electrons.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: K = photon energy - work function.'
- level: 2
  en: The relation already gives the maximum kinetic energy directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 4.5 eV as 7.2 x 10^-19 J and 1.5 eV as 2.4 x 10^-19 J, then
    write K = Eph - phi, where K is the maximum kinetic energy, with the values in
    place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the maximum kinetic energy have, and
    roughly how large is it?
