stem:
  en: This question is about the force between two point charges. The first charge,
    q1, is 2 μC, the second charge, q2, is 2 μC and the separation of the charges,
    r, is 3 cm. Find the force between the charges. Take k = 9 x 10^9 N m²/C².
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: F = k x q1 x q2 / r^2.'
- level: 2
  en: The relation already gives the force directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 2 μC as 2 x 10^-6 C and 3 cm as 0.03 m, then write F = k
    x q1 x q2 / r^2, where F is the force, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the force have, and roughly how large
    is it?
