solution_steps:
- en: 'Write the relation: XC = 1 / [w x C].'
- en: 'Put each quantity in SI units: 5 μF = 5 x 10^-6 F.'
- en: 'Substitute: XC = 1 / (500 x (5 x 10^-6)).'
- en: 'Calculate: XC = 400 Ω.'
- en: So the capacitive reactance is 400 Ω.
- en: The correct option is d.
