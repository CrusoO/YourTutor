solution_steps:
- en: 'Write the relation: binding energy = mass defect x energy of one atomic mass
    unit.'
- en: 'Put each quantity in SI units: 37.26 MeV = 5.9616 x 10^-12 J.'
- en: 'Get the mass defect alone: divide each side by the energy of one atomic mass
    unit.'
- en: 'Substitute: dm = (5.9616 x 10^-12) / 8.98e + 16.'
- en: 'Calculate: dm = 6.64 x 10^-29 kg.'
- en: 'Give it in u: 0.04 u.'
- en: So the mass defect is 0.04 u.
