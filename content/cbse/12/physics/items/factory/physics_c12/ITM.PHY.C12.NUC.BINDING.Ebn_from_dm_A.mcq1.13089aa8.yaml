solution_steps:
- en: 'Write the relation: binding energy per nucleon = mass defect x energy of one
    atomic mass unit / A.'
- en: 'Put each quantity in SI units: 0.4 u = 6.64 x 10^-28 kg.'
- en: 'Substitute: Ebn = (6.64 x 10^-28) x 8.98e + 16 / 10.'
- en: 'Calculate: Ebn = 5.9616 x 10^-12 J.'
- en: 'Give it in MeV: 37.26 MeV.'
- en: So the binding energy per nucleon is 37.26 MeV.
- en: The correct option is a.
