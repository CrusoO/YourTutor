solution_steps:
- en: 'Write the relation: binding energy = mass defect x energy of one atomic mass
    unit.'
- en: 'Put each quantity in SI units: 0.2 u = 3.32 x 10^-28 kg.'
- en: 'Substitute: E = (3.32 x 10^-28) x 8.98e + 16.'
- en: 'Calculate: E = 2.9808 x 10^-11 J.'
- en: 'Give it in MeV: 186.3 MeV.'
- en: So the binding energy is 186.3 MeV.
