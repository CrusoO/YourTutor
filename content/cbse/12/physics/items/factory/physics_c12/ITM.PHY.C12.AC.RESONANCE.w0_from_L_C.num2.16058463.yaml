solution_steps:
- en: 'Write the relation: w0 = 1 / square root of [L x C].'
- en: 'Put each quantity in SI units: 50 mH = 0.05 H; 20 μF = 2 x 10^-5 F.'
- en: 'Substitute: w0 = 1 / sqrt(0.05 x (2 x 10^-5)).'
- en: 'Calculate: w0 = 1000 rad/s.'
- en: So the resonant angular frequency is 1000 rad/s.
- en: The correct option is a.
