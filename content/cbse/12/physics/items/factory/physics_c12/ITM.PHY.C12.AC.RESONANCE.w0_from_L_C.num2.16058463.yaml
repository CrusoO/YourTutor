stem:
  en: This question is about a series LCR circuit at resonance. The inductance, L,
    is 50 mH and the capacitance, C, is 20 μF. Find the resonant angular frequency.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: w0 = 1 / square root of [L x C].'
- level: 2
  en: The relation already gives the resonant angular frequency directly, so decide
    what to substitute. Change every quantity to SI units first, and change back at
    the end if asked.
- level: 3
  en: 'First step: Write 50 mH as 0.05 H and 20 μF as 2 x 10^-5 F, then write w0 =
    1 / sqrt[L x C], where w0 is the resonant angular frequency, with the values in
    place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the resonant angular frequency have,
    and roughly how large is it?
