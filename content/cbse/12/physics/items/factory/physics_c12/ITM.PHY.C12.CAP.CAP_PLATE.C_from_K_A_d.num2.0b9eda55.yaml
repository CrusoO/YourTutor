stem:
  en: This question is about a parallel plate capacitor. The dielectric constant of
    the material between the plates, K, is 5, the area of each plate, A, is 400 cm²
    and the gap between the plates, d, is 1 mm. Find the capacitance. Take the permittivity
    of free space, eps0, = 8.85 x 10^-12 C²/(N m²).
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: C = K x eps0 x A / d.'
- level: 2
  en: The relation already gives the capacitance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 400 cm² as 0.04 m² and 1 mm as 0.001 m, then write C = K
    x eps0 x A / d, where C is the capacitance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the capacitance have, and roughly how
    large is it?
