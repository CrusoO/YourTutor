solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 400 cm² = 0.04 m²; 1 mm = 0.001 m.'
- en: 'Substitute: C = 5 x (8.85 x 10^-12) x 0.04 / 0.001.'
- en: 'Calculate: C = 1.77 x 10^-9 F.'
- en: 'Give it in pF: 1770 pF.'
- en: So the capacitance is 1770 pF.
- en: The correct option is d.
