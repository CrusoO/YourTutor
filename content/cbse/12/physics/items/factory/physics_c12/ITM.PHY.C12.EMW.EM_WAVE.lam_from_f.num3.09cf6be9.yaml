stem:
  en: A student is studying a plane electromagnetic wave in vacuum. The frequency,
    f, is 150 MHz. Find the wavelength. Take the speed of light in vacuum, c, = 3
    x 10^8 m/s.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: c = f x wavelength.'
- level: 2
  en: 'Get the wavelength on its own before you put numbers in: divide each side by
    the frequency. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 150 MHz as 1.5 x 10^8 Hz, then write lam = c / f, where lam
    is the wavelength, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the wavelength have, and roughly how
    large is it?
