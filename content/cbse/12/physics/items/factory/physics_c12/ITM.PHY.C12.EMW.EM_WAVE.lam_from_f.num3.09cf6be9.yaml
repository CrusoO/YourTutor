solution_steps:
- en: 'Write the relation: c = f x wavelength.'
- en: 'Put each quantity in SI units: 150 MHz = 1.5 x 10^8 Hz.'
- en: 'Get the wavelength alone: divide each side by the frequency.'
- en: 'Substitute: lam = (3 x 10^8) / (1.5 x 10^8).'
- en: 'Calculate: lam = 2 m.'
- en: So the wavelength is 2 m.
- en: The correct option is c.
