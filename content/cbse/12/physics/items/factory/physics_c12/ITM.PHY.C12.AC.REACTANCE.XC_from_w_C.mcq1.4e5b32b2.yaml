solution_steps:
- en: 'Write the relation: XC = 1 / [w x C].'
- en: 'Put each quantity in SI units: 1 μF = 1 x 10^-6 F.'
- en: 'Substitute: XC = 1 / (500 x (1 x 10^-6)).'
- en: 'Calculate: XC = 2000 Ω.'
- en: So the capacitive reactance is 2000 Ω.
- en: The correct option is b.
