solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 1 μC = 1 x 10^-6 C; 4 μC = 4 x 10^-6 C.'
- en: 'Get the separation alone: multiply each side by r^2 and divide each side by
    F, then take the square root.'
- en: 'Substitute: r = sqrt((9 x 10^9) x (1 x 10^-6) x (4 x 10^-6) / 14.4).'
- en: 'Calculate: r = 0.05 m.'
- en: 'Give it in cm: 5 cm.'
- en: So the separation is 5 cm.
- en: The correct option is d.
