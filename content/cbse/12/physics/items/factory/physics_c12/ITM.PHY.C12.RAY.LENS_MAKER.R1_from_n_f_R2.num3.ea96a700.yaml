solution_steps:
- en: 'Write the relation: 1/f = (n - 1) x (1/R1 + 1/R2), so 1/R1 = 1/((n - 1) x f)
    - 1/R2.'
- en: 'Put each quantity in SI units: 20 cm = 0.2 m; 60 cm = 0.6 m.'
- en: 'Substitute: R1 = 1 / (1 / ((1.6 - 1) x 0.2) - 1 / 0.6).'
- en: 'Calculate: R1 = 0.15 m.'
- en: 'Give it in cm: 15 cm.'
- en: So the first radius is 15 cm.
