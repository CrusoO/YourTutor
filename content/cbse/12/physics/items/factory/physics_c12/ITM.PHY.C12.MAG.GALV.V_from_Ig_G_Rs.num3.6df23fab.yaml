stem:
  en: A student is studying converting a galvanometer into an ammeter or a voltmeter.
    Its full scale deflection needs 5 mA, the galvanometer coil has a resistance of
    25 Ω and the series resistance, Rs, is 575 Ω. Find the largest voltage the voltmeter
    can read.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: V = Ig x (G + Rs).'
- level: 2
  en: The relation already gives the voltmeter range directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 5 mA as 0.005 A, then write V = Ig x (G + Rs), where V is
    the voltmeter range, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the voltmeter range have, and roughly
    how large is it?
