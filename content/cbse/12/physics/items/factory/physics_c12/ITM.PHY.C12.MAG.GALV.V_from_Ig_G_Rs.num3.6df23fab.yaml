solution_steps:
- en: 'Write the relation: V = Ig x (G + Rs).'
- en: 'Put each quantity in SI units: 5 mA = 0.005 A.'
- en: 'Substitute: V = 0.005 x (25 + 575).'
- en: 'Calculate: V = 3 V.'
- en: So the voltmeter range is 3 V.
- en: The correct option is b.
