solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Put each quantity in SI units: 30 cm = 0.3 m.'
- en: 'Get the charge alone: multiply each side by r^2 and divide each side by k.'
- en: 'Substitute: q = 500 x 0.3^2 / (9 x 10^9).'
- en: 'Calculate: q = 5 x 10^-9 C.'
- en: 'Give it in nC: 5 nC.'
- en: So the charge is 5 nC.
- en: The correct option is a.
