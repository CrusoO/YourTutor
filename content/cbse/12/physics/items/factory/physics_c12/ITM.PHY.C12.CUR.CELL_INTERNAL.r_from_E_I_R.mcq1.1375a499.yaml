stem:
  en: The emf of the cell, E, is 24 V, the current, I, is 4 A and the external resistor,
    R, is 5 Ω. Find the internal resistance of the cell.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: E = I x (R + r).'
- level: 2
  en: 'Get the internal resistance on its own before you put numbers in: divide each
    side of E = I x (R + r) by I, then subtract R. Do the same operation to each side
    of the formula.'
- level: 3
  en: 'First step: write r = E / I - R, where r is the internal resistance, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the internal resistance have, and roughly
    how large is it?
