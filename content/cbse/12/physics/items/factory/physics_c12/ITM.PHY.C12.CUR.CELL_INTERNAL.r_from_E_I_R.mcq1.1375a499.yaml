solution_steps:
- en: 'Write the relation: E = I x (R + r).'
- en: 'Get the internal resistance alone: divide each side of E = I x (R + r) by I,
    then subtract R.'
- en: 'Substitute: r = 24 / 4 - 5.'
- en: 'Calculate: r = 1 Ω.'
- en: So the internal resistance is 1 Ω.
