stem:
  en: 'Case: a student investigates an ideal transformer and records the following.
    The secondary current, I2, is 10 A, the number of primary turns, Np, is 1000 and
    the number of secondary turns, Ns, is 10. Find the primary current.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: an ideal transformer has Vp x I1 = Vs x I2, so I1 = I2 x Ns /
    Np.'
- level: 2
  en: The relation already gives the primary current directly, so decide what to substitute.
- level: 3
  en: 'First step: write I1 = I2 x Ns / Np, where I1 is the primary current, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the primary current have, and roughly
    how large is it?
