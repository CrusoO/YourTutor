stem:
  en: 'Case: a student investigates a metre bridge at balance and records the following.
    The known resistance in the left gap, R, is 6 Ω, the balance point, l1, is 40
    cm from the left end and the remaining wire on the right, l2, is 60 cm. Find the
    unknown resistance.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: R / S = l1 / l2.'
- level: 2
  en: 'Get the unknown resistance on its own before you put numbers in: multiply each
    side of R / S = l1 / l2 by S, then rearrange for S. Do the same operation to each
    side of the formula. Change every quantity to SI units first, and change back
    at the end if asked.'
- level: 3
  en: 'First step: Write 40 cm as 0.4 m and 60 cm as 0.6 m, then write S = R x l2
    / l1, where S is the unknown resistance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the unknown resistance have, and roughly
    how large is it?
