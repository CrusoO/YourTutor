solution_steps:
- en: 'Write the relation: R / S = l1 / l2.'
- en: 'Put each quantity in SI units: 40 cm = 0.4 m; 60 cm = 0.6 m.'
- en: 'Get the unknown resistance alone: multiply each side of R / S = l1 / l2 by
    S, then rearrange for S.'
- en: 'Substitute: S = 6 x 0.6 / 0.4.'
- en: 'Calculate: S = 9 Ω.'
- en: So the unknown resistance is 9 Ω.
- en: The correct option is b.
