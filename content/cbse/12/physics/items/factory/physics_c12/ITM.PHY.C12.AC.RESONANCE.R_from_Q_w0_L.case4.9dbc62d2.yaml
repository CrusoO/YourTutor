solution_steps:
- en: 'Write the relation: Q = w0 x L / R.'
- en: 'Put each quantity in SI units: 400 mH = 0.4 H.'
- en: 'Substitute: R = 500 x 0.4 / 10.'
- en: 'Calculate: R = 20 Ω.'
- en: So the resistance is 20 Ω.
- en: The correct option is a.
