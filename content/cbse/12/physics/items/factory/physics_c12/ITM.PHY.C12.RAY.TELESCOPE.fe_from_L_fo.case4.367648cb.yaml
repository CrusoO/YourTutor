solution_steps:
- en: 'Write the relation: tube length = fo + fe in normal adjustment.'
- en: 'Put each quantity in SI units: 90 cm = 0.9 m; 80 cm = 0.8 m.'
- en: 'Get the eyepiece focal length alone: subtract fo from each side.'
- en: 'Substitute: fe = 0.9 - 0.8.'
- en: 'Calculate: fe = 0.1 m.'
- en: 'Give it in cm: 10 cm.'
- en: So the eyepiece focal length is 10 cm.
- en: The correct option is b.
