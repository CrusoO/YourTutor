solution_steps:
- en: 'Write the relation: 1/f = (n - 1) x (1/R1 + 1/R2) for a double convex lens,
    with the radii as positive numbers.'
- en: 'Put each quantity in SI units: 20 cm = 0.2 m; 60 cm = 0.6 m.'
- en: 'Substitute: f = 1 / ((1.6 - 1) x (1 / 0.2 + 1 / 0.6)).'
- en: 'Calculate: f = 0.25 m.'
- en: 'Give it in cm: 25 cm.'
- en: So the focal length is 25 cm.
- en: The correct option is b.
