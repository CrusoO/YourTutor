stem:
  en: 'Case: a student investigates an electric dipole in a uniform field and records
    the following. The torque on the dipole, tau, is 6 x 10^-4 N m, the dipole moment,
    p, is 2 x 10^-7 C m and the sine of the angle between the dipole and the field,
    s, is 0.6. Find the strength of the field.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: torque = p x E x sine of the angle.'
- level: 2
  en: 'Get the field on its own before you put numbers in: divide each side of torque
    = p x E x sine of the angle by p x sine of the angle. Do the same operation to
    each side of the formula.'
- level: 3
  en: 'First step: write E = tau / [p x s], where E is the field, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the field have, and roughly how large
    is it?
