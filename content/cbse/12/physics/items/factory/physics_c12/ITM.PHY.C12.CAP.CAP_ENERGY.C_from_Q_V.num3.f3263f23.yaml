solution_steps:
- en: 'Write the relation: Q = C x V.'
- en: 'Put each quantity in SI units: 240 μC = 2.4 x 10^-4 C.'
- en: 'Get the capacitance alone: divide each side of Q = C x V by V.'
- en: 'Substitute: C = (2.4 x 10^-4) / 12.'
- en: 'Calculate: C = 2 x 10^-5 F.'
- en: 'Give it in μF: 20 μF.'
- en: So the capacitance is 20 μF.
- en: The correct option is c.
