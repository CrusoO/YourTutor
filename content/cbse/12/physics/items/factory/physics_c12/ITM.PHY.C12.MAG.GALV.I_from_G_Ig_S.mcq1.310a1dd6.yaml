stem:
  en: The galvanometer coil has a resistance of 25 Ω, its full scale deflection needs
    5 mA and the shunt resistance, S, is 0.5 Ω. Find the largest current the ammeter
    can read.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: Ig x G = (I - Ig) x S, so I = Ig x (G + S) / S.'
- level: 2
  en: The relation already gives the ammeter range directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 5 mA as 0.005 A, then write I = Ig x (G + S) / S, where I
    is the ammeter range, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the ammeter range have, and roughly how
    large is it?
