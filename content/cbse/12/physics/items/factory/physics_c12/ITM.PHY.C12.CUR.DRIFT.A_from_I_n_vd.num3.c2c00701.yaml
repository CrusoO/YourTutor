stem:
  en: A student is studying current carried by free electrons in a wire. The current,
    I, is 3.2 A, the free electron density, n, is 4 x 10^28 m⁻³ and the drift speed,
    vd, is 0.2 mm/s. Find the cross-sectional area of the wire. Take the charge of
    one electron, e, = 1.6 x 10^-19 C.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: I = n x e x A x v_d.'
- level: 2
  en: 'Get the cross section on its own before you put numbers in: divide each side
    by n x e x v_d. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 0.2 mm/s as 2 x 10^-4 m/s, then write A = I / [n x e x vd],
    where A is the cross section, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the cross section have, and roughly how
    large is it?
