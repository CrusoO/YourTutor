solution_steps:
- en: 'Write the relation: F = B x I x L x sine of the angle.'
- en: 'Put each quantity in SI units: 1250 mN = 1.25 N; 500 mT = 0.5 T; 50 cm = 0.5
    m.'
- en: 'Get the current alone: divide each side by B x L x sine of the angle.'
- en: 'Substitute: I = 1.25 / (0.5 x 0.5 x 1).'
- en: 'Calculate: I = 5 A.'
- en: So the current is 5 A.
- en: The correct option is a.
