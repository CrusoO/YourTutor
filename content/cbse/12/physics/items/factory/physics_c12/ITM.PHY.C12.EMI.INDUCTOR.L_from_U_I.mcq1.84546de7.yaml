stem:
  en: The energy stored in the magnetic field, U, is 20 mJ and the steady current,
    I, is 2 A. Find the inductance.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: U = (1/2) x L x I^2.'
- level: 2
  en: The relation already gives the inductance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 20 mJ as 0.02 J, then write L = 2 x U / I^2, where L is the
    inductance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the inductance have, and roughly how
    large is it?
