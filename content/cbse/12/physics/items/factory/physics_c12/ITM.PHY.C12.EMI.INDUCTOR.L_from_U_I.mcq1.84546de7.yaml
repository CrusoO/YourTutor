solution_steps:
- en: 'Write the relation: U = (1/2) x L x I^2.'
- en: 'Put each quantity in SI units: 20 mJ = 0.02 J.'
- en: 'Substitute: L = 2 x 0.02 / 2^2.'
- en: 'Calculate: L = 0.01 H.'
- en: 'Give it in mH: 10 mH.'
- en: So the inductance is 10 mH.
- en: The correct option is b.
