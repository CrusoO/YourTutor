stem:
  en: This question is about the electric potential of a point charge. The charge,
    q, is 10 nC and the distance from the charge, r, is 10 m. Find the potential at
    that point. Take k = 9 x 10^9 N m²/C².
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: V = k x q / r.'
- level: 2
  en: The relation already gives the potential directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 10 nC as 1 x 10^-8 C, then write V = k x q / r, where V is
    the potential, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential have, and roughly how large
    is it?
