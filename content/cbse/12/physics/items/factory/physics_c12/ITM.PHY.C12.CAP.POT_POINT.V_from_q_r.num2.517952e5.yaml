solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 10 nC = 1 x 10^-8 C.'
- en: 'Substitute: V = (9 x 10^9) x (1 x 10^-8) / 10.'
- en: 'Calculate: V = 9 V.'
- en: So the potential is 9 V.
- en: The correct option is a.
