stem:
  en: 'Case: a student investigates two capacitors joined together and records the
    following. The first capacitor, C1, is 9 μF and the second capacitor, C2, is 18
    μF. Find the capacitance of the parallel combination.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: parallel: C = C1 + C2.'
- level: 2
  en: The relation already gives the parallel capacitance directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 9 μF as 9 x 10^-6 F and 18 μF as 1.8 x 10^-5 F, then write
    Cp = C1 + C2, where Cp is the parallel capacitance, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the parallel capacitance have, and roughly
    how large is it?
