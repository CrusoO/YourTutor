solution_steps:
- en: 'Write the relation: parallel: C = C1 + C2.'
- en: 'Put each quantity in SI units: 9 μF = 9 x 10^-6 F; 18 μF = 1.8 x 10^-5 F.'
- en: 'Substitute: Cp = (9 x 10^-6) + (1.8 x 10^-5).'
- en: 'Calculate: Cp = 2.7 x 10^-5 F.'
- en: 'Give it in μF: 27 μF.'
- en: So the parallel capacitance is 27 μF.
- en: The correct option is b.
