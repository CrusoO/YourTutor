solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 0.48 mm = 4.8 x 10^-4 m; 400 nm = 4 x 10^-7
    m.'
- en: 'Substitute: d = (4 x 10^-7) x 1.2 / (4.8 x 10^-4).'
- en: 'Calculate: d = 0.001 m.'
- en: 'Give it in mm: 1 mm.'
- en: So the slit separation is 1 mm.
- en: The correct option is b.
