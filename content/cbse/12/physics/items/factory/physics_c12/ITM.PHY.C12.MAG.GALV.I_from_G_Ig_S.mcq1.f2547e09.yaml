solution_steps:
- en: 'Write the relation: Ig x G = (I - Ig) x S, so I = Ig x (G + S) / S.'
- en: 'Put each quantity in SI units: 5 mA = 0.005 A.'
- en: 'Substitute: I = 0.005 x (200 + 20) / 20.'
- en: 'Calculate: I = 0.055 A.'
- en: 'Give it in mA: 55 mA.'
- en: So the ammeter range is 55 mA.
- en: The correct option is b.
