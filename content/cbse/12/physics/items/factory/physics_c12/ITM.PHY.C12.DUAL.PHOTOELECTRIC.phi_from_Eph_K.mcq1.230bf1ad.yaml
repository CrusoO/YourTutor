solution_steps:
- en: 'Write the relation: K = photon energy - work function.'
- en: 'Put each quantity in SI units: 2.5 eV = 4 x 10^-19 J; 1 eV = 1.6 x 10^-19 J.'
- en: 'Get the work function alone: rearrange K = photon energy - work function for
    the work function.'
- en: 'Substitute: phi = (4 x 10^-19) - (1.6 x 10^-19).'
- en: 'Calculate: phi = 2.4 x 10^-19 J.'
- en: 'Give it in eV: 1.5 eV.'
- en: So the work function is 1.5 eV.
- en: The correct option is a.
