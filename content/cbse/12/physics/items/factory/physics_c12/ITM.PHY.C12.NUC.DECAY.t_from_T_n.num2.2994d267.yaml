solution_steps:
- en: 'Plan: the number of half-lives is t / T.'
- en: 'Put each quantity in SI units: 5 days = 432000 s.'
- en: 'Substitute: t = 2 x 432000.'
- en: 'Calculate: t = 864000 s.'
- en: 'Give it in days: 10 days.'
- en: So the time is 10 days.
- en: The correct option is a.
