stem:
  en: A student is studying the photoelectric effect at a metal surface. The frequency
    of the light, f, is 8 x 10^14 Hz and the work function of the metal, phi, is 1.5
    eV. Find the maximum kinetic energy of the electrons. Take Planck's constant,
    h, = 6.63 x 10^-34 J s.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: K = h x f - work function [all in joules].'
- level: 2
  en: The relation already gives the maximum kinetic energy directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 1.5 eV as 2.4 x 10^-19 J, then write Kj = h x f - phi, where
    Kj is the maximum kinetic energy, with the values in place, one quantity at a
    time.'
prediction_prompt:
  en: Before you calculate, what unit should the maximum kinetic energy have, and
    roughly how large is it?
