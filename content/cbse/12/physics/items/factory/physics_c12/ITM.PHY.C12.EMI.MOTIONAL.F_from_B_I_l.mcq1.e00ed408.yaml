solution_steps:
- en: 'Write the relation: F = B x I x l on the current-carrying rod.'
- en: 'Put each quantity in SI units: 500 mT = 0.5 T; 250 mA = 0.25 A; 10 cm = 0.1
    m.'
- en: 'Substitute: F = 0.5 x 0.25 x 0.1.'
- en: 'Calculate: F = 0.0125 N.'
- en: 'Give it in mN: 12.5 mN.'
- en: So the force is 12.5 mN.
