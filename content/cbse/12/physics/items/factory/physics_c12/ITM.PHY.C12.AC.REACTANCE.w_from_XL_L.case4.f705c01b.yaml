solution_steps:
- en: 'Write the relation: XL = w x L.'
- en: 'Put each quantity in SI units: 200 mH = 0.2 H.'
- en: 'Substitute: w = 50 / 0.2.'
- en: 'Calculate: w = 250 rad/s.'
- en: So the angular frequency is 250 rad/s.
- en: The correct option is b.
