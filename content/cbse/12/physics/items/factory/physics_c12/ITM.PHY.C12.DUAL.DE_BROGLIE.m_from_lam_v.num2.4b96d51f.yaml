solution_steps:
- en: 'Write the relation: wavelength = h / [m x v], so m = h / [wavelength x v].'
- en: 'Put each quantity in SI units: 2 nm = 2 x 10^-9 m.'
- en: 'Substitute: m = (6.63 x 10^-34) / ((2 x 10^-9) x 50).'
- en: 'Calculate: m = 6.63 x 10^-27 kg.'
- en: So the mass is 6.63 x 10^-27 kg.
- en: The correct option is c.
