solution_steps:
- en: 'Write the relation: Z = square root of (R^2 + (XL - XC)^2), then I = V / Z.'
- en: 'Substitute: I = 130 / sqrt(40^2 + (50 - 20)^2).'
- en: 'Calculate: I = 2.6 A.'
- en: So the rms current is 2.6 A.
- en: The correct option is b.
