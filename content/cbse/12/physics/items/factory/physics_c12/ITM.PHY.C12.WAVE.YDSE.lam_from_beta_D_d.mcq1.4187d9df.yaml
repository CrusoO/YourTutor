stem:
  en: The fringe width, beta, is 2.1 mm, the screen, D, is 1.2 m from the slits and
    the slits are 0.4 mm apart. Find the wavelength of the light.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: fringe width = wavelength x D / d.'
- level: 2
  en: 'Get the wavelength on its own before you put numbers in: multiply each side
    by d and divide each side by D. Do the same operation to each side of the formula.
    Change every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 2.1 mm as 0.0021 m and 0.4 mm as 4 x 10^-4 m, then write
    lam = beta x d / D, where lam is the wavelength, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the wavelength have, and roughly how
    large is it?
