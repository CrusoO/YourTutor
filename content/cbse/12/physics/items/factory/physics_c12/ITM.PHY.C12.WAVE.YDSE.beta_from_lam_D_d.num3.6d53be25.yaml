solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 600 nm = 6 x 10^-7 m; 1 mm = 0.001 m.'
- en: 'Substitute: beta = (6 x 10^-7) x 0.5 / 0.001.'
- en: 'Calculate: beta = 3 x 10^-4 m.'
- en: 'Give it in mm: 0.3 mm.'
- en: So the fringe width is 0.3 mm.
- en: The correct option is a.
