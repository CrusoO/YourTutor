solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Put each quantity in SI units: 5 μC = 5 x 10^-6 C.'
- en: 'Get the distance alone: multiply each side by r^2, divide each side by E, then
    take the square root.'
- en: 'Substitute: r = sqrt((9 x 10^9) x (5 x 10^-6) / 112.5).'
- en: 'Calculate: r = 20 m.'
- en: So the distance is 20 m.
- en: The correct option is b.
