stem:
  en: A student is studying a coil in a changing magnetic field. The induced emf,
    eps, is 10 V, the flux through the coil changes by 2 mWb and the change takes
    20 ms. Find the number of turns in the coil.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: emf = N x flux change / time.'
- level: 2
  en: 'Get the number of turns on its own before you put numbers in: multiply each
    side by the time and divide each side by the flux change. Do the same operation
    to each side of the formula. Change every quantity to SI units first, and change
    back at the end if asked.'
- level: 3
  en: 'First step: Write 2 mWb as 0.002 Wb and 20 ms as 0.02 s, then write N = eps
    x dt / dPhi, where N is the number of turns, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the number of turns be?
