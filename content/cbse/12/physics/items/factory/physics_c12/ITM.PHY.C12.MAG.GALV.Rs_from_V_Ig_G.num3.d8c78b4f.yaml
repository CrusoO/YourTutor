solution_steps:
- en: 'Write the relation: V = Ig x (G + Rs), so Rs = V / Ig - G.'
- en: 'Put each quantity in SI units: 5 mA = 0.005 A.'
- en: 'Substitute: Rs = 30 / 0.005 - 50.'
- en: 'Calculate: Rs = 5950 Ω.'
- en: So the series resistance is 5950 Ω.
- en: The correct option is b.
