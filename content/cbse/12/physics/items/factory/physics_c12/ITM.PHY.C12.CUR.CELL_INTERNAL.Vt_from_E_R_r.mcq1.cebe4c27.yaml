- en: 'Write the relation: I = E / (R + r), and the terminal voltage is V = I x R.'
- en: 'Substitute: Vt = 24 x 4 / (4 + 1).'
- en: 'Calculate: Vt = 19.2 V.'
- en: So the terminal voltage is 19.2 V.
