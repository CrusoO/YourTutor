solution_steps:
- en: 'Write the relation: F = B x I x L x sine of the angle.'
- en: 'Put each quantity in SI units: 100 mN = 0.1 N; 100 mT = 0.1 T; 20 cm = 0.2
    m.'
- en: 'Get the current alone: divide each side by B x L x sine of the angle.'
- en: 'Substitute: I = 0.1 / (0.1 x 0.2 x 1).'
- en: 'Calculate: I = 5 A.'
- en: So the current is 5 A.
- en: The correct option is b.
