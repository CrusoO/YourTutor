stem:
  en: The force on the wire, F, is 100 mN, the magnetic field, B, is 100 mT, the length
    of wire in the field, L, is 20 cm and the sine of the angle between the wire and
    the field, s, is 1. Find the current in the wire.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: F = B x I x L x sine of the angle.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side by B
    x L x sine of the angle. Do the same operation to each side of the formula. Change
    every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 100 mN as 0.1 N, 100 mT as 0.1 T and 20 cm as 0.2 m, then
    write I = F / [B x L x s], where I is the current, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
