stem:
  en: A student is studying a series LCR circuit at resonance. The resonant angular
    frequency, w0, is 1000 rad/s and the capacitance, C, is 10 μF. Find the inductance.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: w0 = 1 / square root of [L x C], so L = 1 / (w0^2 x C).'
- level: 2
  en: 'Get the inductance on its own before you put numbers in: square each side of
    the relation, then rearrange for L. Do the same operation to each side of the
    formula. Change every quantity to SI units first, and change back at the end if
    asked.'
- level: 3
  en: 'First step: Write 10 μF as 1 x 10^-5 F, then write L = 1 / (w0^2 x C), where
    L is the inductance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the inductance have, and roughly how
    large is it?
