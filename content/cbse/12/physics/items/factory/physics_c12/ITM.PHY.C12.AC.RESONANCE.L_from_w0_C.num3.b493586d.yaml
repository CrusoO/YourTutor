solution_steps:
- en: 'Write the relation: w0 = 1 / square root of [L x C], so L = 1 / (w0^2 x C).'
- en: 'Put each quantity in SI units: 10 μF = 1 x 10^-5 F.'
- en: 'Get the inductance alone: square each side of the relation, then rearrange
    for L.'
- en: 'Substitute: L = 1 / (1000^2 x (1 x 10^-5)).'
- en: 'Calculate: L = 0.1 H.'
- en: 'Give it in mH: 100 mH.'
- en: So the inductance is 100 mH.
- en: The correct option is b.
