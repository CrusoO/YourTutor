solution_steps:
- en: 'Write the relation: series: 1/C = 1/C1 + 1/C2, so C = C1 x C2 / (C1 + C2).'
- en: 'Put each quantity in SI units: 15 μF = 1.5 x 10^-5 F; 10 μF = 1 x 10^-5 F.'
- en: 'Substitute: Cs = (1.5 x 10^-5) x (1 x 10^-5) / ((1.5 x 10^-5) + (1 x 10^-5)).'
- en: 'Calculate: Cs = 6 x 10^-6 F.'
- en: 'Give it in μF: 6 μF.'
- en: So the series capacitance is 6 μF.
- en: The correct option is c.
