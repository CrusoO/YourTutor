stem:
  en: A student is studying a current-carrying conductor in a magnetic field. The
    force on the wire, F, is 50 mN, the current, I, is 2 A, the length of wire in
    the field, L, is 10 cm and the sine of the angle between the wire and the field,
    s, is 0.5. Find the strength of the field.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: F = B x I x L x sine of the angle.'
- level: 2
  en: 'Get the field on its own before you put numbers in: divide each side by I x
    L x sine of the angle. Do the same operation to each side of the formula. Change
    every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 50 mN as 0.05 N and 10 cm as 0.1 m, then write B = F / [I
    x L x s], where B is the field, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the field have, and roughly how large
    is it?
