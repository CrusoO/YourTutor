solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 2 μC = 2 x 10^-6 C; 30 cm = 0.3 m.'
- en: 'Get the second charge alone: multiply each side by r^2 and divide each side
    by k x q1.'
- en: 'Substitute: q2 = 0.8 x 0.3^2 / ((9 x 10^9) x (2 x 10^-6)).'
- en: 'Calculate: q2 = 4 x 10^-6 C.'
- en: 'Give it in μC: 4 μC.'
- en: So the second charge is 4 μC.
- en: The correct option is c.
