stem:
  en: 'Case: a student investigates the force between two point charges and records
    the following. The force between them, F, is 0.8 N, the first charge, q1, is 2
    μC and the separation of the charges, r, is 30 cm. Find the second charge. Take
    k = 9 x 10^9 N m²/C².'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: F = k x q1 x q2 / r^2.'
- level: 2
  en: 'Get the second charge on its own before you put numbers in: multiply each side
    by r^2 and divide each side by k x q1. Do the same operation to each side of the
    formula. Change every quantity to SI units first, and change back at the end if
    asked.'
- level: 3
  en: 'First step: Write 2 μC as 2 x 10^-6 C and 30 cm as 0.3 m, then write q2 = F
    x r^2 / (k x q1), where q2 is the second charge, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the second charge have, and roughly how
    large is it?
