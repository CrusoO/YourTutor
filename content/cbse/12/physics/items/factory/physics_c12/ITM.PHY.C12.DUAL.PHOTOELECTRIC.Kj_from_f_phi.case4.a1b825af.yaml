solution_steps:
- en: 'Write the relation: K = h x f - work function [all in joules].'
- en: 'Put each quantity in SI units: 2 eV = 3.2 x 10^-19 J.'
- en: 'Substitute: Kj = (6.63 x 10^-34) x (1 x 10^15) - (3.2 x 10^-19).'
- en: 'Calculate: Kj = 3.43 x 10^-19 J.'
- en: So the maximum kinetic energy is 3.43 x 10^-19 J.
- en: The correct option is b.
