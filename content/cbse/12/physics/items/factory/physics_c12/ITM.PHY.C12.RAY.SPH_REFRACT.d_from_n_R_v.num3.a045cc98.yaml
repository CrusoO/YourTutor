solution_steps:
- en: 'Write the relation: n/v - 1/d = (n - 1)/R, so 1/d = n/v - (n - 1)/R.'
- en: 'Put each quantity in SI units: 20 cm = 0.2 m; 12 cm = 0.12 m.'
- en: 'Substitute: d = 1 / (1.5 / 0.12 - (1.5 - 1) / 0.2).'
- en: 'Calculate: d = 0.1 m.'
- en: 'Give it in cm: 10 cm.'
- en: So the object distance is 10 cm.
- en: The correct option is a.
