stem:
  en: A student is studying refraction at a curved glass surface. The refractive index
    of the glass, n, is 1.5, the radius of curvature of the convex surface, R, is
    20 cm and the image forms 12 cm from the surface inside the glass. Find the distance
    of the object from the surface.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: n/v - 1/d = (n - 1)/R, so 1/d = n/v - (n - 1)/R.'
- level: 2
  en: The relation already gives the object distance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 20 cm as 0.2 m and 12 cm as 0.12 m, then write d = 1 / (n
    / v - (n - 1) / R), where d is the object distance, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the object distance have, and roughly
    how large is it?
