solution_steps:
- en: 'Write the relation: Q = C x V.'
- en: 'Put each quantity in SI units: 50 μF = 5 x 10^-5 F.'
- en: 'Substitute: Q = (5 x 10^-5) x 50.'
- en: 'Calculate: Q = 0.0025 C.'
- en: 'Give it in μC: 2500 μC.'
- en: So the charge is 2500 μC.
- en: The correct option is c.
