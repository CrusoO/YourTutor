stem:
  en: The capacitance, C, is 50 μF and the potential difference across it, V, is 50
    V. Find the charge on the capacitor.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: Q = C x V.'
- level: 2
  en: The relation already gives the charge directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 50 μF as 5 x 10^-5 F, then write Q = C x V, where Q is the
    charge, with the values in place, one quantity at a time.'
prediction_prompt:
