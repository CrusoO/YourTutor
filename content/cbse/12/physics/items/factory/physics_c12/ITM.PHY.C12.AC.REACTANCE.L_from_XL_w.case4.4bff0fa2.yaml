stem:
  en: 'Case: a student investigates an inductor or a capacitor in an alternating circuit
    and records the following. The inductive reactance, XL, is 5 Ω and the angular
    frequency of the supply, w, is 500 rad/s. Find the inductance.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: XL = w x L.'
- level: 2
  en: 'Get the inductance on its own before you put numbers in: divide each side by
    w. Do the same operation to each side of the formula. Change every quantity to
    SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: write L = XL / w, where L is the inductance, with the values in
    place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the inductance have, and roughly how
    large is it?
