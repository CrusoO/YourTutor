solution_steps:
- en: 'Write the relation: n/v - 1/d = (n - 1)/R, so 1/d = n/v - (n - 1)/R.'
- en: 'Put each quantity in SI units: 40 cm = 0.4 m; 48 cm = 0.48 m.'
- en: 'Substitute: d = 1 / (2 / 0.48 - (2 - 1) / 0.4).'
- en: 'Calculate: d = 0.6 m.'
- en: 'Give it in cm: 60 cm.'
- en: So the object distance is 60 cm.
- en: The correct option is d.
