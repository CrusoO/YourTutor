solution_steps:
- en: 'Write the relation: Q = w0 x L / R.'
- en: 'Put each quantity in SI units: 250 mH = 0.25 H.'
- en: 'Substitute: R = 1000 x 0.25 / 25.'
- en: 'Calculate: R = 10 Ω.'
- en: So the resistance is 10 Ω.
- en: The correct option is b.
