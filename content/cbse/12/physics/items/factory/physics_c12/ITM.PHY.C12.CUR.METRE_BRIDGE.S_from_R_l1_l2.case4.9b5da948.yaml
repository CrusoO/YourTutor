solution_steps:
- en: 'Write the relation: R / S = l1 / l2.'
- en: 'Put each quantity in SI units: 80 cm = 0.8 m; 20 cm = 0.2 m.'
- en: 'Get the unknown resistance alone: multiply each side of R / S = l1 / l2 by
    S, then rearrange for S.'
- en: 'Substitute: S = 3 x 0.2 / 0.8.'
- en: 'Calculate: S = 0.75 Ω.'
- en: So the unknown resistance is 0.75 Ω.
- en: The correct option is c.
