stem:
  en: This question is about an inductor in a circuit. The induced emf, eps, is 20
    V, the change takes 50 ms and the inductance, L, is 200 mH. Find the change in
    current.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: emf = L x current change / time.'
- level: 2
  en: The relation already gives the change in current directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 50 ms as 0.05 s and 200 mH as 0.2 H, then write dI = eps
    x dt / L, where dI is the change in current, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the change in current have, and roughly
    how large is it?
