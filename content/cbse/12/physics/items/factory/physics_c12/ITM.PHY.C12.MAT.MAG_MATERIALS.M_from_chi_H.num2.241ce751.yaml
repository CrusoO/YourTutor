stem:
  en: This question is about a magnetic material in an external field. The magnetic
    susceptibility, chi, is 999 and the magnetising field, H, is 1000 A/m. Find the
    magnetisation of the material.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: magnetisation = susceptibility x H.'
- level: 2
  en: The relation already gives the magnetisation directly, so decide what to substitute.
- level: 3
  en: 'First step: write M = chi x H, where M is the magnetisation, with the values
    in place, one quantity at a time.'
