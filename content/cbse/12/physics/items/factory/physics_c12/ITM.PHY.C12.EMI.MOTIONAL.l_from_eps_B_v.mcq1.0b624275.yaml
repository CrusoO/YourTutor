solution_steps:
- en: 'Write the relation: emf = B x l x v.'
- en: 'Put each quantity in SI units: 500 mV = 0.5 V; 500 mT = 0.5 T.'
- en: 'Get the rod length alone: divide each side by B x v.'
- en: 'Substitute: l = 0.5 / (0.5 x 2).'
- en: 'Calculate: l = 0.5 m.'
- en: 'Give it in cm: 50 cm.'
- en: So the rod length is 50 cm.
- en: The correct option is d.
