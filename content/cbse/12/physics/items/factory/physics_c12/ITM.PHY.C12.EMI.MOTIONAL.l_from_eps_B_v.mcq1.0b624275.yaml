stem:
  en: The induced emf, eps, is 500 mV, the magnetic field, B, is 500 mT and the speed
    of the rod, v, is 2 m/s. Find the length of the rod.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: emf = B x l x v.'
- level: 2
  en: 'Get the rod length on its own before you put numbers in: divide each side by
    B x v. Do the same operation to each side of the formula. Change every quantity
    to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 500 mV as 0.5 V and 500 mT as 0.5 T, then write l = eps /
    [B x v], where l is the rod length, with the values in place, one quantity at
    a time.'
prediction_prompt:
  en: Before you calculate, what unit should the rod length have, and roughly how
    large is it?
