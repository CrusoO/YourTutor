solution_steps:
- en: 'Write the relation: the number of half-lives is t / T, then N = N0 / 2^(t/T).'
- en: 'Put each quantity in SI units: 10 days = 864000 s.'
- en: 'Substitute: N = 1280 / 2^(864000 / 864000).'
- en: 'Calculate: N = 640.'
- en: So the remaining number of nuclei is 640.
- en: The correct option is c.
