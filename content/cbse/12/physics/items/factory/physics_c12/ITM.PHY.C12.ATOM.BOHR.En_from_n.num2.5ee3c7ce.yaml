solution_steps:
- en: 'Plan: the magnitude of the energy is E1 divided by n squared.'
- en: 'Substitute: En = (2.176 x 10^-18) / 1^2.'
- en: 'Calculate: En = 2.176 x 10^-18 J.'
- en: 'Give it in eV: 13.6 eV.'
- en: So the energy of the level is 13.6 eV.
