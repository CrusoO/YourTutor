stem:
  en: This question is about the hydrogen atom in the Bohr model. The principal quantum
    number, n, is 1. Find the magnitude of the energy of that level. Take the ground
    state energy of hydrogen, E1, = -13.6 eV.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Plan the steps: the magnitude
    of the energy is E1 divided by n squared.'
- level: 2
  en: Work through the plan one step at a time. Change every quantity to SI units
    first, and change back at the end if asked.
- level: 3
  en: 'First step: write En = E1 / n^2, where En is the energy of the level, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the energy of the level have, and roughly
    how large is it?
