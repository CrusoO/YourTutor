solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 10 nC = 1 x 10^-8 C; 2 nC = 2 x 10^-9 C.'
- en: 'Substitute: F = (9 x 10^9) x (1 x 10^-8) x (2 x 10^-9) / 30^2.'
- en: 'Calculate: F = 2 x 10^-10 N.'
- en: So the force is 2 x 10^-10 N.
- en: The correct option is d.
