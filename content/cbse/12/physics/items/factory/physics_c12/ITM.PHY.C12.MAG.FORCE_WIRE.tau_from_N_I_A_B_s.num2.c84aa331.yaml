solution_steps:
- en: 'Write the relation: torque = N x I x A x B x sine of the angle on a flat coil.'
- en: 'Put each quantity in SI units: 100 cm² = 0.01 m²; 500 mT = 0.5 T.'
- en: 'Substitute: tau = 10 x 5 x 0.01 x 0.5 x 1.'
- en: 'Calculate: tau = 0.25 N m.'
- en: 'Give it in mNm: 250 mNm.'
- en: So the torque is 250 mNm.
- en: The correct option is c.
