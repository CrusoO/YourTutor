solution_steps:
- en: 'Plan: the number of half-lives is t / T.'
- en: 'Put each quantity in SI units: 10 years = 3.1536 x 10^8 s.'
- en: 'Substitute: t = 5 x (3.1536 x 10^8).'
- en: 'Calculate: t = 1.5768 x 10^9 s.'
- en: 'Give it in years: 50 years.'
- en: So the time is 50 years.
- en: The correct option is d.
