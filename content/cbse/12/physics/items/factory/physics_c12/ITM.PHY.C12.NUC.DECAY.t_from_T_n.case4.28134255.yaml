stem:
  en: 'Case: a student investigates a radioactive sample decaying by half-lives and
    records the following. The half-life, T, is 10 years and the number of half-lives
    that pass, n, is 5. Find the time that has passed.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Plan the steps: the
    number of half-lives is t / T.'
- level: 2
  en: Work through the plan one step at a time. Change every quantity to SI units
    first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 10 years as 3.1536 x 10^8 s, then write t = n x T, where
    t is the time, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the time have, and roughly how large
    is it?
