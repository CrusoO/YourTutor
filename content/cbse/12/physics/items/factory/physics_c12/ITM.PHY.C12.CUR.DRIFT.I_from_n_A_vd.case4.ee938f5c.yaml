solution_steps:
- en: 'Write the relation: I = n x e x A x v_d.'
- en: 'Put each quantity in SI units: 4 mm² = 4 x 10^-6 m²; 0.2 mm/s = 2 x 10^-4 m/s.'
- en: 'Substitute: I = (1 x 10^29) x (1.6 x 10^-19) x (4 x 10^-6) x (2 x 10^-4).'
- en: 'Calculate: I = 12.8 A.'
- en: So the current is 12.8 A.
- en: The correct option is b.
