solution_steps:
- en: 'Write the relation: torque = N x I x A x B x sine of the angle on a flat coil.'
- en: 'Put each quantity in SI units: 20 mNm = 0.02 N m; 100 cm² = 0.01 m²; 100 mT
    = 0.1 T.'
- en: 'Get the number of turns alone: divide each side by I x A x B x sine of the
    angle.'
- en: 'Substitute: N = 0.02 / (2 x 0.01 x 0.1 x 1).'
- en: 'Calculate: N = 10.'
- en: So the number of turns is 10.
- en: The correct option is c.
