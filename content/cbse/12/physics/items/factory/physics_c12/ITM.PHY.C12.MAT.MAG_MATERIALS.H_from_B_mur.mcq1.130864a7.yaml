stem:
  en: The magnetic field inside the material, B, is 62.8 mT and the relative permeability,
    mur, is 100. Find the magnetising field. Take the permeability of free space,
    mu0, = 1.256 x 10^-6 N/A².
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: B = mu0 x relative permeability x H.'
- level: 2
  en: 'Get the magnetising field on its own before you put numbers in: divide each
    side by mu0 x relative permeability. Do the same operation to each side of the
    formula. Change every quantity to SI units first, and change back at the end if
    asked.'
- level: 3
  en: 'First step: Write 62.8 mT as 0.0628 T, then write H = B / (mu0 x mur), where
    H is the magnetising field, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the magnetising field have, and roughly
    how large is it?
