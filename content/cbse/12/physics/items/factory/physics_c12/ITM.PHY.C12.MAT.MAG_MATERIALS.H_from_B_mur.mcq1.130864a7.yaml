solution_steps:
- en: 'Write the relation: B = mu0 x relative permeability x H.'
- en: 'Put each quantity in SI units: 62.8 mT = 0.0628 T.'
- en: 'Get the magnetising field alone: divide each side by mu0 x relative permeability.'
- en: 'Substitute: H = 0.0628 / ((1.256 x 10^-6) x 100).'
- en: 'Calculate: H = 500 A/m.'
- en: So the magnetising field is 500 A/m.
- en: The correct option is c.
