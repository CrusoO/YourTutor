stem:
  en: A student is studying a cell with internal resistance driving a resistor. The
    current, I, is 0.6 A, the external resistor, R, is 9 Ω and its internal resistance,
    r, is 1 Ω. Find the emf of the cell.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: E = I x (R + r).'
- level: 2
  en: The relation already gives the emf directly, so decide what to substitute.
- level: 3
  en: 'First step: write E = I x (R + r), where E is the emf, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the emf have, and roughly how large is
    it?
