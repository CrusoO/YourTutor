solution_steps:
- en: 'Write the relation: wavelength = h / [m x v], so v = h / [m x wavelength].'
- en: 'Put each quantity in SI units: 0.2 nm = 2 x 10^-10 m.'
- en: 'Substitute: v = (6.63 x 10^-34) / ((6.63 x 10^-31) x (2 x 10^-10)).'
- en: 'Calculate: v = 5 x 10^6 m/s.'
- en: So the speed is 5 x 10^6 m/s.
- en: The correct option is a.
