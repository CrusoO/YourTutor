solution_steps:
- en: 'Write the relation: n/v - 1/d = (n - 1)/R, so 1/d = n/v - (n - 1)/R.'
- en: 'Put each quantity in SI units: 10 cm = 0.1 m; 15 cm = 0.15 m.'
- en: 'Substitute: d = 1 / (1.5 / 0.15 - (1.5 - 1) / 0.1).'
- en: 'Calculate: d = 0.2 m.'
- en: 'Give it in cm: 20 cm.'
- en: So the object distance is 20 cm.
