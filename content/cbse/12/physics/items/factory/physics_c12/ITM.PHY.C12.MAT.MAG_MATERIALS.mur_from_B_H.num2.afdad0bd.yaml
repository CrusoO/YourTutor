solution_steps:
- en: 'Write the relation: B = mu0 x relative permeability x H.'
- en: 'Put each quantity in SI units: 628 mT = 0.628 T.'
- en: 'Substitute: mur = 0.628 / ((1.256 x 10^-6) x 500).'
- en: 'Calculate: mur = 1000.'
- en: So the relative permeability is 1000.
- en: The correct option is c.
