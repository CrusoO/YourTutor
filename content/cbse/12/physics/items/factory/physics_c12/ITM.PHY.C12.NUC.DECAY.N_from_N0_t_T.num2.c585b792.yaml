solution_steps:
- en: 'Write the relation: the number of half-lives is t / T, then N = N0 / 2^(t/T).'
- en: 'Put each quantity in SI units: 30 days = 2.592 x 10^6 s; 10 days = 864000 s.'
- en: 'Substitute: N = 640 / 2^((2.592 x 10^6) / 864000).'
- en: 'Calculate: N = 80.'
- en: So the remaining number of nuclei is 80.
- en: The correct option is c.
