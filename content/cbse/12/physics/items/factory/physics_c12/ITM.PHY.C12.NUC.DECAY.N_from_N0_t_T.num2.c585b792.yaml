stem:
  en: This question is about a radioactive sample decaying by half-lives. The sample
    starts with 640 undecayed nuclei, the time that passes, t, is 30 days and the
    half-life, T, is 10 days. Find how many undecayed nuclei are left.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: the number of half-lives is t / T, then N = N0 / 2^(t/T).'
- level: 2
  en: The relation already gives the remaining number of nuclei directly, so decide
    what to substitute. Change every quantity to SI units first, and change back at
    the end if asked.
- level: 3
  en: 'First step: Write 30 days as 2.592 x 10^6 s and 10 days as 864000 s, then write
    N = N0 / 2^(t / T), where N is the remaining number of nuclei, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the remaining number of nuclei
    be?
