solution_steps:
- en: 'Write the relation: binding energy = mass defect x energy of one atomic mass
    unit.'
- en: 'Put each quantity in SI units: 0.01 u = 1.66 x 10^-29 kg.'
- en: 'Substitute: E = (1.66 x 10^-29) x 8.98e + 16.'
- en: 'Calculate: E = 1.4904 x 10^-12 J.'
- en: 'Give it in MeV: 9.315 MeV.'
- en: So the binding energy is 9.315 MeV.
- en: The correct option is a.
