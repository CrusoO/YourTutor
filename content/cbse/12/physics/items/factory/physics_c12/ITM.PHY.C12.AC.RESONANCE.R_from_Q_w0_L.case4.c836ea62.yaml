solution_steps:
- en: 'Write the relation: Q = w0 x L / R.'
- en: 'Put each quantity in SI units: 100 mH = 0.1 H.'
- en: 'Substitute: R = 1000 x 0.1 / 4.'
- en: 'Calculate: R = 25 Ω.'
- en: So the resistance is 25 Ω.
- en: The correct option is b.
