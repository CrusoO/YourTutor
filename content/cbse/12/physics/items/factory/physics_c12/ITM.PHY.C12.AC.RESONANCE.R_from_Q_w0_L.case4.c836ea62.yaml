stem:
  en: 'Case: a student investigates a series LCR circuit at resonance and records
    the following. The quality factor, Q, is 4, the resonant angular frequency, w0,
    is 1000 rad/s and the inductance, L, is 100 mH. Find the resistance.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: Q = w0 x L / R.'
- level: 2
  en: The relation already gives the resistance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 100 mH as 0.1 H, then write R = w0 x L / Q, where R is the
    resistance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the resistance have, and roughly how
    large is it?
