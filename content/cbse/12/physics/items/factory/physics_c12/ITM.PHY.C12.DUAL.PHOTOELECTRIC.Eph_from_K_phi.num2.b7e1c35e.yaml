solution_steps:
- en: 'Write the relation: K = photon energy - work function.'
- en: 'Put each quantity in SI units: 4 eV = 6.4 x 10^-19 J; 2 eV = 3.2 x 10^-19 J.'
- en: 'Substitute: Eph = (6.4 x 10^-19) + (3.2 x 10^-19).'
- en: 'Calculate: Eph = 9.6 x 10^-19 J.'
- en: 'Give it in eV: 6 eV.'
- en: So the photon energy is 6 eV.
- en: The correct option is d.
