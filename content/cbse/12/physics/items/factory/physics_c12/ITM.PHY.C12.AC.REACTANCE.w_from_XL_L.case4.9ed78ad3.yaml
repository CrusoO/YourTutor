stem:
  en: 'Case: a student investigates an inductor or a capacitor in an alternating circuit
    and records the following. The inductive reactance, XL, is 25 Ω and the inductance,
    L, is 50 mH. Find the angular frequency of the supply.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: XL = w x L.'
- level: 2
  en: The relation already gives the angular frequency directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 50 mH as 0.05 H, then write w = XL / L, where w is the angular
    frequency, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the angular frequency have, and roughly
    how large is it?
