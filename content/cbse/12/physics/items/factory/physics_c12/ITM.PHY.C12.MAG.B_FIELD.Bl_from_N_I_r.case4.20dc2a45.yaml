solution_steps:
- en: 'Write the relation: B = mu0 x N x I / (2 x r) at the centre of a circular coil.'
- en: 'Put each quantity in SI units: 5 cm = 0.05 m.'
- en: 'Substitute: Bl = (1.256 x 10^-6) x 100 x 1 / (2 x 0.05).'
- en: 'Calculate: Bl = 0.001256 T.'
- en: 'Give it in μT: 1256 μT.'
- en: So the field at the centre is 1256 μT.
- en: The correct option is b.
