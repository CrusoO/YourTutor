solution_steps:
- en: 'Write the relation: XC = 1 / [w x C].'
- en: 'Get the capacitance alone: multiply each side by C, then divide each side by
    XC x w.'
- en: 'Substitute: C = 1 / (1000 x 100).'
- en: 'Calculate: C = 1 x 10^-5 F.'
- en: 'Give it in μF: 10 μF.'
- en: So the capacitance is 10 μF.
- en: The correct option is a.
