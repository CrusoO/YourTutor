stem:
  en: The current, I, is 1 A, the current in the second wire, I2, is 5 A and the distance,
    r, is 10 cm. Find the force on each metre of either wire. Take mu0_4pi (the permeability
    of free space divided by 4 pi) = 1 x 10^-7 N/A².
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: force per metre = (mu0 / 4 pi) x 2 x I1 x I2 / d for two long parallel
    wires.'
- level: 2
  en: The relation already gives the force per unit length directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 10 cm as 0.1 m, then write f = 2 x mu0_4pi x I x I2 / r,
    where f is the force per unit length, with the values in place, one quantity at
    a time.'
prediction_prompt:
  en: Before you calculate, what unit should the force per unit length have, and roughly
    how large is it?
