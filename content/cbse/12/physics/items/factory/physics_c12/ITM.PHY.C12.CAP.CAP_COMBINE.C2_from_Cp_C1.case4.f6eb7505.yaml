stem:
  en: 'Case: a student investigates two capacitors joined together and records the
    following. The parallel combination, Cp, is 25 μF and the first capacitor, C1,
    is 10 μF. Find the second capacitance.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: parallel: Cp = C1 + C2.'
- level: 2
  en: 'Get the second capacitance on its own before you put numbers in: subtract C1
    from each side. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 25 μF as 2.5 x 10^-5 F and 10 μF as 1 x 10^-5 F, then write
    C2 = Cp - C1, where C2 is the second capacitance, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the second capacitance have, and roughly
    how large is it?
