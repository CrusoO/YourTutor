solution_steps:
- en: 'Write the relation: parallel: Cp = C1 + C2.'
- en: 'Put each quantity in SI units: 25 μF = 2.5 x 10^-5 F; 10 μF = 1 x 10^-5 F.'
- en: 'Get the second capacitance alone: subtract C1 from each side.'
- en: 'Substitute: C2 = (2.5 x 10^-5) - (1 x 10^-5).'
- en: 'Calculate: C2 = 1.5 x 10^-5 F.'
- en: 'Give it in μF: 15 μF.'
- en: So the second capacitance is 15 μF.
- en: The correct option is c.
