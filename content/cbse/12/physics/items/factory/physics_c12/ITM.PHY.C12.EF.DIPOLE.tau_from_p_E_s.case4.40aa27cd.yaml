solution_steps:
- en: 'Write the relation: torque = p x E x sine of the angle.'
- en: 'Substitute: tau = (1 x 10^-7) x 5000 x 0.8.'
- en: 'Calculate: tau = 4 x 10^-4 N m.'
- en: So the torque is 4 x 10^-4 N m.
