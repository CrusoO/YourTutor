solution_steps:
- en: 'Write the relation: the n-th bright fringe is at x = n x wavelength x D / d.'
- en: 'Put each quantity in SI units: 600 nm = 6 x 10^-7 m; 0.2 mm = 2 x 10^-4 m.'
- en: 'Substitute: x = 5 x (6 x 10^-7) x 1 / (2 x 10^-4).'
- en: 'Calculate: x = 0.015 m.'
- en: 'Give it in mm: 15 mm.'
- en: So the position is 15 mm.
- en: The correct option is b.
