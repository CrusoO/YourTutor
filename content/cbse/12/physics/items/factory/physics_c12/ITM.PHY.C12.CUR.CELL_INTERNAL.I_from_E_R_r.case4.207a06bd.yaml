solution_steps:
- en: 'Write the relation: E = I x (R + r).'
- en: 'Get the current alone: divide each side of E = I x (R + r) by (R + r).'
- en: 'Substitute: I = 12 / (3 + 2).'
- en: 'Calculate: I = 2.4 A.'
- en: So the current is 2.4 A.
