solution_steps:
- en: 'Write the relation: V = Ig x (G + Rs), so Rs = V / Ig - G.'
- en: 'Put each quantity in SI units: 10 mA = 0.01 A.'
- en: 'Substitute: Rs = 3 / 0.01 - 50.'
- en: 'Calculate: Rs = 250 Ω.'
- en: So the series resistance is 250 Ω.
- en: The correct option is b.
