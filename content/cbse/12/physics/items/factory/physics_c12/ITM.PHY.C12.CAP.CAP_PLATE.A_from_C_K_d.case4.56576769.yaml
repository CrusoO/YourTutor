solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 177 pF = 1.77 x 10^-10 F; 4 mm = 0.004 m.'
- en: 'Get the plate area alone: multiply each side by d and divide each side by K
    x eps0.'
- en: 'Substitute: A = (1.77 x 10^-10) x 0.004 / (4 x (8.85 x 10^-12)).'
- en: 'Calculate: A = 0.02 m².'
- en: 'Give it in cm²: 200 cm².'
- en: So the plate area is 200 cm².
- en: The correct option is a.
