solution_steps:
- en: 'Write the relation: the magnetic force gives the centripetal force: q x v x
    B = m x v^2 / r, so r = m x v / [q x B].'
- en: 'Put each quantity in SI units: 100 mT = 0.1 T.'
- en: 'Substitute: r = (6.4 x 10^-27) x (1 x 10^6) / ((3.2 x 10^-19) x 0.1).'
- en: 'Calculate: r = 0.2 m.'
- en: 'Give it in cm: 20 cm.'
- en: So the radius is 20 cm.
- en: The correct option is c.
