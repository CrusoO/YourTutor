stem:
  en: A student is studying a charged particle moving in a magnetic field. Its mass,
    m, is 6.4 x 10^-27 kg, its speed, v, is 1 x 10^6 m/s, the charge of the particle,
    q, is 3.2 x 10^-19 C and the magnetic field, B, is 100 mT. Find the radius of
    the circular path.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: the magnetic force gives the centripetal force: q x v x B = m
    x v^2 / r, so r = m x v / [q x B].'
- level: 2
  en: The relation already gives the radius directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 100 mT as 0.1 T, then write r = m x v / [q x B], where r
    is the radius, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the radius have, and roughly how large
    is it?
