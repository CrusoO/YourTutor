solution_steps:
- en: 'Write the relation: q x v x B = m x v^2 / r, so v = q x B x r / m.'
- en: 'Put each quantity in SI units: 2 cm = 0.02 m; 200 mT = 0.2 T.'
- en: 'Substitute: v = (3.2 x 10^-19) x 0.2 x 0.02 / (6.4 x 10^-27).'
- en: 'Calculate: v = 200000 m/s.'
- en: So the speed is 200000 m/s.
- en: The correct option is d.
