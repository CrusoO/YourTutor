solution_steps:
- en: 'Write the relation: B = mu0 x relative permeability x H.'
- en: 'Substitute: B = (1.256 x 10^-6) x 2000 x 500.'
- en: 'Calculate: B = 1.256 T.'
- en: 'Give it in mT: 1256 mT.'
- en: So the magnetic field is 1256 mT.
- en: The correct option is b.
