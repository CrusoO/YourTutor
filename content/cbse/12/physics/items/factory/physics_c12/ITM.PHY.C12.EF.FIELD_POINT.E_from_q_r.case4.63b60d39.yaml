solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Put each quantity in SI units: 1 μC = 1 x 10^-6 C.'
- en: 'Substitute: E = (9 x 10^9) x (1 x 10^-6) / 5^2.'
- en: 'Calculate: E = 360 N/C.'
- en: So the electric field is 360 N/C.
- en: The correct option is d.
