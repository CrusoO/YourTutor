stem:
  en: 'Case: a student investigates the electric field of a point charge and records
    the following. The charge, q, is 1 μC and the distance from the charge, r, is
    5 m. Find the magnitude of the electric field. Take k = 9 x 10^9 N m²/C².'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: E = k x q / r^2.'
- level: 2
  en: The relation already gives the electric field directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 1 μC as 1 x 10^-6 C, then write E = k x q / r^2, where E
    is the electric field, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the electric field have, and roughly
    how large is it?
