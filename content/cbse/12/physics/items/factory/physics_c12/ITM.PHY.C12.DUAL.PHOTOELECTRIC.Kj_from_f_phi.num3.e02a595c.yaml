solution_steps:
- en: 'Write the relation: K = h x f - work function [all in joules].'
- en: 'Put each quantity in SI units: 1.5 eV = 2.4 x 10^-19 J.'
- en: 'Substitute: Kj = (6.63 x 10^-34) x (6 x 10^14) - (2.4 x 10^-19).'
- en: 'Calculate: Kj = 1.578 x 10^-19 J.'
- en: So the maximum kinetic energy is 1.578 x 10^-19 J.
- en: The correct option is c.
