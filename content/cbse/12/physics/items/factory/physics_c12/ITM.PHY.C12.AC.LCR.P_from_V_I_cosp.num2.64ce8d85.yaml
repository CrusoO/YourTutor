stem:
  en: This question is about a series LCR circuit on an alternating supply. The rms
    supply voltage, V, is 130 V, the rms current, I, is 6.5 A and the power factor,
    cosp, is 0.8. Find the average power used.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: P = V x I x cosine of phi.'
- level: 2
  en: The relation already gives the average power directly, so decide what to substitute.
- level: 3
  en: 'First step: write P = V x I x cosp, where P is the average power, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the average power have, and roughly how
    large is it?
