stem:
  en: The electron falls from the level with n = 5 and to the level with n = 2. Find
    the energy of the photon given out. Take the ground state energy of hydrogen,
    E1, = -13.6 eV.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: photon energy = 13.6 x (1/nf^2 - 1/ni^2) electron-volts.'
- level: 2
  en: The relation already gives the photon energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: write dE = E1 x (1 / nf^2 - 1 / ni^2), where dE is the photon energy,
    with the values in place, one quantity at a time.'
