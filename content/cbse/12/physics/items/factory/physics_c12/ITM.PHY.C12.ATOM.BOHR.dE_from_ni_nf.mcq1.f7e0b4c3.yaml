solution_steps:
- en: 'Write the relation: photon energy = 13.6 x (1/nf^2 - 1/ni^2) electron-volts.'
- en: 'Substitute: dE = (2.176 x 10^-18) x (1 / 2^2 - 1 / 5^2).'
- en: 'Calculate: dE = 4.5696 x 10^-19 J.'
- en: 'Give it in eV: 2.856 eV.'
- en: So the photon energy is 2.856 eV.
