solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 400 nm = 4 x 10^-7 m; 0.2 mm = 2 x 10^-4 m.'
- en: 'Substitute: beta = (4 x 10^-7) x 0.5 / (2 x 10^-4).'
- en: 'Calculate: beta = 0.001 m.'
- en: 'Give it in mm: 1 mm.'
- en: So the fringe width is 1 mm.
- en: The correct option is d.
