stem:
  en: 'Case: a student investigates a thin double convex lens in air and records the
    following. The refractive index of the glass, n, is 1.6, the radius of curvature
    of the first face, R1, is 15 cm and the radius of curvature of the second face,
    R2, is 15 cm. Find the focal length of the lens.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: 1/f = (n - 1) x (1/R1 + 1/R2) for a double convex lens, with
    the radii as positive numbers.'
- level: 2
  en: The relation already gives the focal length directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 15 cm as 0.15 m, then write f = 1 / ((n - 1) x (1 / R1 +
    1 / R2)), where f is the focal length, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the focal length have, and roughly how
    large is it?
