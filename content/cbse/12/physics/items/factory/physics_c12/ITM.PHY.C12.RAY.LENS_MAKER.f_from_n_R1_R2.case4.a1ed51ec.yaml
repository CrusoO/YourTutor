solution_steps:
- en: 'Write the relation: 1/f = (n - 1) x (1/R1 + 1/R2) for a double convex lens,
    with the radii as positive numbers.'
- en: 'Put each quantity in SI units: 15 cm = 0.15 m.'
- en: 'Substitute: f = 1 / ((1.6 - 1) x (1 / 0.15 + 1 / 0.15)).'
- en: 'Calculate: f = 0.125 m.'
- en: 'Give it in cm: 12.5 cm.'
- en: So the focal length is 12.5 cm.
