solution_steps:
- en: 'Write the relation: I = E / (R + r), and the terminal voltage is V = I x R.'
- en: 'Substitute: Vt = 24 x 2 / (2 + 2).'
- en: 'Calculate: Vt = 12 V.'
- en: So the terminal voltage is 12 V.
