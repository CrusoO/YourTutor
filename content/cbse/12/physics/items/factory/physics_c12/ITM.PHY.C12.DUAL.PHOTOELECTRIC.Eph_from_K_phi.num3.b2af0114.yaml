solution_steps:
- en: 'Write the relation: K = photon energy - work function.'
- en: 'Put each quantity in SI units: 3 eV = 4.8 x 10^-19 J; 1.5 eV = 2.4 x 10^-19
    J.'
- en: 'Substitute: Eph = (4.8 x 10^-19) + (2.4 x 10^-19).'
- en: 'Calculate: Eph = 7.2 x 10^-19 J.'
- en: 'Give it in eV: 4.5 eV.'
- en: So the photon energy is 4.5 eV.
- en: The correct option is a.
