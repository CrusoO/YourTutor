stem:
  en: A student is studying the photoelectric effect at a metal surface. The maximum
    kinetic energy of the emitted electrons, K, is 3 eV and the work function of the
    metal, phi, is 1.5 eV. Find the energy of each photon.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: K = photon energy - work function.'
- level: 2
  en: The relation already gives the photon energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 3 eV as 4.8 x 10^-19 J and 1.5 eV as 2.4 x 10^-19 J, then
    write Eph = K + phi, where Eph is the photon energy, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the photon energy have, and roughly how
    large is it?
