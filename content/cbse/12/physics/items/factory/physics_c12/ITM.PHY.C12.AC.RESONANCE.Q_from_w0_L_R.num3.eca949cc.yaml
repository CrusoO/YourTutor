solution_steps:
- en: 'Write the relation: Q = w0 x L / R.'
- en: 'Put each quantity in SI units: 400 mH = 0.4 H.'
- en: 'Substitute: Q = 500 x 0.4 / 20.'
- en: 'Calculate: Q = 10.'
- en: So the quality factor is 10.
