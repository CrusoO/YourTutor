stem:
  en: 'Case: a student investigates the truth table of a logic gate and records the
    following. The gate has 6 inputs. For an OR gate with this many inputs, in how
    many rows is the output 1?'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Plan the steps: an OR gate
    gives 0 only when every input is 0, so it gives 1 in 2^n - 1 of the 2^n rows.'
- level: 2
  en: Work through the plan one step at a time.
- level: 3
  en: 'First step: write Ro = 2^n - 1, where Ro is the number of rows with output
    1, with the values in place, one quantity at a time.'
