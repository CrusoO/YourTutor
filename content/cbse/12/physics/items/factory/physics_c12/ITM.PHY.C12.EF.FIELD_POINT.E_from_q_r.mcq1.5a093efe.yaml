solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Put each quantity in SI units: 4 nC = 4 x 10^-9 C.'
- en: 'Substitute: E = (9 x 10^9) x (4 x 10^-9) / 10^2.'
- en: 'Calculate: E = 0.36 N/C.'
- en: So the electric field is 0.36 N/C.
