solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 2 μC = 2 x 10^-6 C.'
- en: 'Get the distance alone: multiply each side by r and divide each side by V.'
- en: 'Substitute: r = (9 x 10^9) x (2 x 10^-6) / 1200.'
- en: 'Calculate: r = 15 m.'
- en: So the distance is 15 m.
- en: The correct option is d.
