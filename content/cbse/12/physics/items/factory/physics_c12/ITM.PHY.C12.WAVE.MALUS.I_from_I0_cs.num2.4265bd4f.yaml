stem:
  en: This question is about polarised light through an analyser. The intensity of
    the incident light, I0, is 100 W/m^2 and the cosine of the angle between the pass
    directions, cs, is 0.6. Find the transmitted intensity.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: I = I0 x cosine squared of the angle for polarised light.'
- level: 2
  en: The relation already gives the transmitted intensity directly, so decide what
    to substitute.
- level: 3
  en: 'First step: write I = I0 x cs^2, where I is the transmitted intensity, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the transmitted intensity have, and roughly
    how large is it?
