solution_steps:
- en: 'Write the relation: emf = L x current change / time.'
- en: 'Put each quantity in SI units: 10 mH = 0.01 H; 50 ms = 0.05 s.'
- en: 'Substitute: eps = 0.01 x 5 / 0.05.'
- en: 'Calculate: eps = 1 V.'
- en: So the induced emf is 1 V.
- en: The correct option is a.
