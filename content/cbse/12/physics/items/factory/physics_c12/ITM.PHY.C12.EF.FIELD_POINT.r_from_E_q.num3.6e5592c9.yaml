solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Put each quantity in SI units: 1 μC = 1 x 10^-6 C.'
- en: 'Get the distance alone: multiply each side by r^2, divide each side by E, then
    take the square root.'
- en: 'Substitute: r = sqrt((9 x 10^9) x (1 x 10^-6) / 225000).'
- en: 'Calculate: r = 0.2 m.'
- en: 'Give it in cm: 20 cm.'
- en: So the distance is 20 cm.
- en: The correct option is c.
