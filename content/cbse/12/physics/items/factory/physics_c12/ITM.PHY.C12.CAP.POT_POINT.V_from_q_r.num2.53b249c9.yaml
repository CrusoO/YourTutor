solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 5 μC = 5 x 10^-6 C; 30 cm = 0.3 m.'
- en: 'Substitute: V = (9 x 10^9) x (5 x 10^-6) / 0.3.'
- en: 'Calculate: V = 150000 V.'
- en: So the potential is 150000 V.
- en: The correct option is a.
