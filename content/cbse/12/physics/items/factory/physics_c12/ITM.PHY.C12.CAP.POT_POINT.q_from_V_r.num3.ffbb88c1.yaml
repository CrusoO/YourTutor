stem:
  en: A student is studying the electric potential of a point charge. The potential,
    V, is 150 V and the distance from the charge, r, is 30 cm. Find the charge. Take
    k = 9 x 10^9 N m²/C².
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: V = k x q / r.'
- level: 2
  en: 'Get the charge on its own before you put numbers in: multiply each side by
    r and divide each side by k. Do the same operation to each side of the formula.
    Change every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 30 cm as 0.3 m, then write q = V x r / k, where q is the
    charge, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the charge have, and roughly how large
    is it?
