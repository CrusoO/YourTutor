solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 30 cm = 0.3 m.'
- en: 'Get the charge alone: multiply each side by r and divide each side by k.'
- en: 'Substitute: q = 150 x 0.3 / (9 x 10^9).'
- en: 'Calculate: q = 5 x 10^-9 C.'
- en: 'Give it in nC: 5 nC.'
- en: So the charge is 5 nC.
- en: The correct option is d.
