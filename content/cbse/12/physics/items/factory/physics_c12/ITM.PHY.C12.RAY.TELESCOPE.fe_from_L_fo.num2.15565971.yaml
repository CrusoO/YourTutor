solution_steps:
- en: 'Write the relation: tube length = fo + fe in normal adjustment.'
- en: 'Put each quantity in SI units: 70 cm = 0.7 m; 50 cm = 0.5 m.'
- en: 'Get the eyepiece focal length alone: subtract fo from each side.'
- en: 'Substitute: fe = 0.7 - 0.5.'
- en: 'Calculate: fe = 0.2 m.'
- en: 'Give it in cm: 20 cm.'
- en: So the eyepiece focal length is 20 cm.
- en: The correct option is c.
