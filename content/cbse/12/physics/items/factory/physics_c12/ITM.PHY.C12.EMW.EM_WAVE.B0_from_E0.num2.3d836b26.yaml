solution_steps:
- en: 'Write the relation: E0 / B0 = c.'
- en: 'Get the magnetic amplitude alone: divide each side by c.'
- en: 'Substitute: B0 = 30 / (3 x 10^8).'
- en: 'Calculate: B0 = 1 x 10^-7 T.'
- en: 'Give it in nT: 100 nT.'
- en: So the magnetic amplitude is 100 nT.
- en: The correct option is c.
