solution_steps:
- en: 'Write the relation: binding energy per nucleon = binding energy / A.'
- en: 'Put each quantity in SI units: 9.315 MeV = 1.4904 x 10^-12 J.'
- en: 'Substitute: E = (1.4904 x 10^-12) x 2.'
- en: 'Calculate: E = 2.9808 x 10^-12 J.'
- en: 'Give it in MeV: 18.63 MeV.'
- en: So the binding energy is 18.63 MeV.
