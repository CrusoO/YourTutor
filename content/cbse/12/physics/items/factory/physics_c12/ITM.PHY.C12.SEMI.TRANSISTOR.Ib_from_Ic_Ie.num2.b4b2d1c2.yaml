stem:
  en: This question is about a transistor in the common emitter connection. The collector
    current, Ic, is 1.25 mA and the emitter current, Ie, is 1.275 mA. Find the base
    current.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: emitter current = base current + collector current.'
- level: 2
  en: The relation already gives the base current directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 1.25 mA as 0.00125 A and 1.275 mA as 0.001275 A, then write
    Ib = Ie - Ic, where Ib is the base current, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the base current have, and roughly how
    large is it?
