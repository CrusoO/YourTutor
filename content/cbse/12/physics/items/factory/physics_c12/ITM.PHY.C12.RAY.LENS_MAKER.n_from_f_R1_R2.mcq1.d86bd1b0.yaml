stem:
  en: The focal length, f, is 40 cm, the radius of curvature of the first face, R1,
    is 30 cm and the radius of curvature of the second face, R2, is 60 cm. Find the
    refractive index of the glass.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: 1/f = (n - 1) x (1/R1 + 1/R2), so n = 1 + 1/(f x (1/R1 + 1/R2)).'
- level: 2
  en: The relation already gives the refractive index directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 40 cm as 0.4 m, 30 cm as 0.3 m and 60 cm as 0.6 m, then write
    n = 1 + R1 x R2 / (f x (R1 + R2)), where n is the refractive index, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the refractive index be?
