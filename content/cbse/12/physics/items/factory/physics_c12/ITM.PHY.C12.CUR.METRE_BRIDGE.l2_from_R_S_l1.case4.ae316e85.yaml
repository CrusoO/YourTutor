stem:
  en: 'Case: a student investigates a metre bridge at balance and records the following.
    The known resistance in the left gap, R, is 6 Ω, the unknown resistance in the
    right gap, S, is 24 Ω and the balance point, l1, is 20 cm from the left end. Find
    the length of wire on the right of the balance point.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: R / S = l1 / l2.'
- level: 2
  en: The relation already gives the right length directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 20 cm as 0.2 m, then write l2 = l1 x S / R, where l2 is the
    right length, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the right length have, and roughly how
    large is it?
