solution_steps:
- en: 'Write the relation: R / S = l1 / l2.'
- en: 'Put each quantity in SI units: 20 cm = 0.2 m.'
- en: 'Substitute: l2 = 0.2 x 24 / 6.'
- en: 'Calculate: l2 = 0.8 m.'
- en: 'Give it in cm: 80 cm.'
- en: So the right length is 80 cm.
- en: The correct option is b.
