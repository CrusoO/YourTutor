solution_steps:
- en: 'Write the relation: emf = B x l x v.'
- en: 'Put each quantity in SI units: 200 mT = 0.2 T; 50 cm = 0.5 m.'
- en: 'Substitute: eps = 0.2 x 0.5 x 5.'
- en: 'Calculate: eps = 0.5 V.'
- en: 'Give it in mV: 500 mV.'
- en: So the induced emf is 500 mV.
- en: The correct option is b.
