stem:
  en: This question is about a rod sliding on rails in a magnetic field. The magnetic
    field, B, is 200 mT, the rod, l, is 50 cm long and the speed of the rod, v, is
    5 m/s. Find the induced emf across the rod.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: emf = B x l x v.'
- level: 2
  en: The relation already gives the induced emf directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 200 mT as 0.2 T and 50 cm as 0.5 m, then write eps = B x
    l x v, where eps is the induced emf, with the values in place, one quantity at
    a time.'
prediction_prompt:
  en: Before you calculate, what unit should the induced emf have, and roughly how
    large is it?
