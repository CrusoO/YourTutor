solution_steps:
- en: 'Write the relation: e x V0 = K = photon energy - work function.'
- en: 'Put each quantity in SI units: 4 eV = 6.4 x 10^-19 J; 2.5 eV = 4 x 10^-19 J.'
- en: 'Substitute: V0 = ((6.4 x 10^-19) - (4 x 10^-19)) / (1.6 x 10^-19).'
- en: 'Calculate: V0 = 1.5 V.'
- en: So the stopping potential is 1.5 V.
- en: The correct option is c.
