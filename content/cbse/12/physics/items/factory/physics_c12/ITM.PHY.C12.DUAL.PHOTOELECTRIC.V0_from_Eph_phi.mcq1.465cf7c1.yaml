stem:
  en: The energy of each photon, Eph, is 4 eV and the work function of the metal,
    phi, is 2.5 eV. Find the stopping potential. Take the charge of one electron,
    e, = 1.6 x 10^-19 C.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: e x V0 = K = photon energy - work function.'
- level: 2
  en: The relation already gives the stopping potential directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 4 eV as 6.4 x 10^-19 J and 2.5 eV as 4 x 10^-19 J, then write
    V0 = (Eph - phi) / e, where V0 is the stopping potential, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the stopping potential have, and roughly
    how large is it?
