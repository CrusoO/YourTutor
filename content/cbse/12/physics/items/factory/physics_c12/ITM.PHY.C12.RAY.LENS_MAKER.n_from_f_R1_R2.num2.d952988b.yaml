solution_steps:
- en: 'Write the relation: 1/f = (n - 1) x (1/R1 + 1/R2), so n = 1 + 1/(f x (1/R1
    + 1/R2)).'
- en: 'Put each quantity in SI units: 8 cm = 0.08 m; 10 cm = 0.1 m; 15 cm = 0.15 m.'
- en: 'Substitute: n = 1 + 0.1 x 0.15 / (0.08 x (0.1 + 0.15)).'
- en: 'Calculate: n = 1.75.'
- en: So the refractive index is 1.75.
- en: The correct option is a.
