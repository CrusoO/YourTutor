stem:
  en: 'Case: a student investigates an ideal transformer and records the following.
    The primary voltage, Vp, is 110 V, the number of primary turns, Np, is 200 and
    the number of secondary turns, Ns, is 2000. Find the secondary voltage.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: Vs / Vp = Ns / Np.'
- level: 2
  en: The relation already gives the secondary voltage directly, so decide what to
    substitute.
- level: 3
  en: 'First step: write Vs = Vp x Ns / Np, where Vs is the secondary voltage, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the secondary voltage have, and roughly
    how large is it?
