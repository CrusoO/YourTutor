solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Put each quantity in SI units: 2 μC = 2 x 10^-6 C.'
- en: 'Substitute: E = (9 x 10^9) x (2 x 10^-6) / 30^2.'
- en: 'Calculate: E = 20 N/C.'
- en: So the electric field is 20 N/C.
- en: The correct option is a.
