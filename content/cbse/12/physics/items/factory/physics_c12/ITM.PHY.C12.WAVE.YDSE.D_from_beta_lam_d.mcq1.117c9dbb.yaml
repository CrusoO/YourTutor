stem:
  en: The fringe width, beta, is 0.2 mm, the wavelength of the light, lam, is 400
    nm and the slits are 1 mm apart. Find the distance from the slits to the screen.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: fringe width = wavelength x D / d.'
- level: 2
  en: The relation already gives the screen distance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 0.2 mm as 2 x 10^-4 m, 400 nm as 4 x 10^-7 m and 1 mm as
    0.001 m, then write D = beta x d / lam, where D is the screen distance, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the screen distance have, and roughly
    how large is it?
