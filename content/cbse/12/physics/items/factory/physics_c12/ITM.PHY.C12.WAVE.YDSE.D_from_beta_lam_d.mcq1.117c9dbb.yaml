solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 0.2 mm = 2 x 10^-4 m; 400 nm = 4 x 10^-7 m;
    1 mm = 0.001 m.'
- en: 'Substitute: D = (2 x 10^-4) x 0.001 / (4 x 10^-7).'
- en: 'Calculate: D = 0.5 m.'
- en: So the screen distance is 0.5 m.
- en: The correct option is d.
