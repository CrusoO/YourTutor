stem:
  en: 'Case: a student investigates a cell with internal resistance driving a resistor
    and records the following. The current, I, is 1.5 A, the external resistor, R,
    is 4 Ω and its internal resistance, r, is 2 Ω. Find the emf of the cell.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: E = I x (R + r).'
- level: 2
  en: The relation already gives the emf directly, so decide what to substitute.
- level: 3
  en: 'First step: write E = I x (R + r), where E is the emf, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the emf have, and roughly how large is
    it?
