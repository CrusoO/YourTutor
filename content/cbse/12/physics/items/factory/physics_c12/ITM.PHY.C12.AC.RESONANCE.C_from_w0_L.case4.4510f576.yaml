solution_steps:
- en: 'Write the relation: w0 = 1 / square root of [L x C], so C = 1 / (w0^2 x L).'
- en: 'Put each quantity in SI units: 10 mH = 0.01 H.'
- en: 'Get the capacitance alone: square each side of the relation, then rearrange
    for C.'
- en: 'Substitute: C = 1 / (1000^2 x 0.01).'
- en: 'Calculate: C = 1 x 10^-4 F.'
- en: 'Give it in μF: 100 μF.'
- en: So the capacitance is 100 μF.
