role: procedure
stem:
  en: The energy of each photon, Eph, is 4 eV and the work function of the metal,
    phi, is 1.5 eV. Find the maximum kinetic energy of the emitted electrons.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: K = photon energy - work function.'
- level: 2
  en: The relation already gives the maximum kinetic energy directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 4 eV as 6.4 x 10^-19 J and 1.5 eV as 2.4 x 10^-19 J, then
    write K = Eph - phi, where K is the maximum kinetic energy, with the values in
    place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the maximum kinetic energy have, and
    roughly how large is it?
