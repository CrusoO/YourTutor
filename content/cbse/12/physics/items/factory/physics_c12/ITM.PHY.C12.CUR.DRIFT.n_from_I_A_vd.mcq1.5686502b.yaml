solution_steps:
- en: 'Write the relation: I = n x e x A x v_d.'
- en: 'Put each quantity in SI units: 2.5 mm² = 2.5 x 10^-6 m²; 0.05 mm/s = 5 x 10^-5
    m/s.'
- en: 'Get the electron density alone: divide each side by e x A x v_d.'
- en: 'Substitute: n = 0.4 / ((1.6 x 10^-19) x (2.5 x 10^-6) x (5 x 10^-5)).'
- en: 'Calculate: n = 2 x 10^28 m⁻³.'
- en: So the electron density is 2 x 10^28 m⁻³.
- en: The correct option is c.
