solution_steps:
- en: 'Write the relation: Z = square root of (R^2 + (XL - XC)^2).'
- en: 'Substitute: Z = sqrt(16^2 + (30 - 18)^2).'
- en: 'Calculate: Z = 20 Ω.'
- en: So the impedance is 20 Ω.
- en: The correct option is a.
