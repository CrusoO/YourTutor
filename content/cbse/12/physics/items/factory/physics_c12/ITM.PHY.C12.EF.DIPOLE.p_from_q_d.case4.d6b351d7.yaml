solution_steps:
- en: 'Write the relation: p = q x d, charge times separation.'
- en: 'Put each quantity in SI units: 5 μC = 5 x 10^-6 C; 2 cm = 0.02 m.'
- en: 'Substitute: p = (5 x 10^-6) x 0.02.'
- en: 'Calculate: p = 1 x 10^-7 C m.'
- en: So the dipole moment is 1 x 10^-7 C m.
- en: The correct option is a.
