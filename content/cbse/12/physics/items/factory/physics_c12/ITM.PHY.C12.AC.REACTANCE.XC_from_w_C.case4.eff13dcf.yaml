solution_steps:
- en: 'Write the relation: XC = 1 / [w x C].'
- en: 'Put each quantity in SI units: 5 μF = 5 x 10^-6 F.'
- en: 'Substitute: XC = 1 / (250 x (5 x 10^-6)).'
- en: 'Calculate: XC = 800 Ω.'
- en: So the capacitive reactance is 800 Ω.
- en: The correct option is a.
