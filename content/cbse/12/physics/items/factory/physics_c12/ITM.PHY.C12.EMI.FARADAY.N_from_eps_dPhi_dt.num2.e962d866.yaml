solution_steps:
- en: 'Write the relation: emf = N x flux change / time.'
- en: 'Put each quantity in SI units: 1 mWb = 0.001 Wb; 10 ms = 0.01 s.'
- en: 'Get the number of turns alone: multiply each side by the time and divide each
    side by the flux change.'
- en: 'Substitute: N = 50 x 0.01 / 0.001.'
- en: 'Calculate: N = 500.'
- en: So the number of turns is 500.
- en: The correct option is c.
