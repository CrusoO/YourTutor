stem:
  en: This question is about a rod sliding on rails in a magnetic field. The magnetic
    field, B, is 100 mT, the induced current, I, is 8 mA and the rod, l, is 20 cm
    long. Find the force on the rod.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: F = B x I x l on the current-carrying rod.'
- level: 2
  en: The relation already gives the force directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 100 mT as 0.1 T, 8 mA as 0.008 A and 20 cm as 0.2 m, then
    write F = B x I x l, where F is the force, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the force have, and roughly how large
    is it?
