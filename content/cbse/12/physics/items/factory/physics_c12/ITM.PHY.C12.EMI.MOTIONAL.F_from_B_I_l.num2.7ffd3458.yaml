solution_steps:
- en: 'Write the relation: F = B x I x l on the current-carrying rod.'
- en: 'Put each quantity in SI units: 100 mT = 0.1 T; 8 mA = 0.008 A; 20 cm = 0.2
    m.'
- en: 'Substitute: F = 0.1 x 0.008 x 0.2.'
- en: 'Calculate: F = 1.6 x 10^-4 N.'
- en: 'Give it in mN: 0.16 mN.'
- en: So the force is 0.16 mN.
