solution_steps:
- en: 'Write the relation: torque = N x I x A x B x sine of the angle on a flat coil.'
- en: 'Put each quantity in SI units: 500 mNm = 0.5 N m; 20 cm² = 0.002 m²; 500 mT
    = 0.5 T.'
- en: 'Get the number of turns alone: divide each side by I x A x B x sine of the
    angle.'
- en: 'Substitute: N = 0.5 / (5 x 0.002 x 0.5 x 1).'
- en: 'Calculate: N = 100.'
- en: So the number of turns is 100.
- en: The correct option is b.
