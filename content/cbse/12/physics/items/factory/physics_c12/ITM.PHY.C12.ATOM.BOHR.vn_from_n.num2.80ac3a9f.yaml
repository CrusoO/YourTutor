solution_steps:
- en: 'Plan: the speed in the n-th orbit is v1 / n.'
- en: 'Substitute: vn = (2.2 x 10^6) / 5.'
- en: 'Calculate: vn = 440000 m/s.'
- en: So the orbital speed is 440000 m/s.
