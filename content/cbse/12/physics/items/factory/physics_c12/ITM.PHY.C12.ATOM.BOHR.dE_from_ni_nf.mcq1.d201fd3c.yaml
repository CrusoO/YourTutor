solution_steps:
- en: 'Write the relation: photon energy = 13.6 x (1/nf^2 - 1/ni^2) electron-volts.'
- en: 'Substitute: dE = (2.176 x 10^-18) x (1 / 1^2 - 1 / 4^2).'
- en: 'Calculate: dE = 2.04 x 10^-18 J.'
- en: 'Give it in eV: 12.75 eV.'
- en: So the photon energy is 12.75 eV.
- en: The correct option is c.
