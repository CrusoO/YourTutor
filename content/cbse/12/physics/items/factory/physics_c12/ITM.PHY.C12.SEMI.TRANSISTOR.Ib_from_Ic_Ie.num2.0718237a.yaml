solution_steps:
- en: 'Write the relation: emitter current = base current + collector current.'
- en: 'Put each quantity in SI units: 2 mA = 0.002 A; 2.01 mA = 0.00201 A.'
- en: 'Substitute: Ib = 0.00201 - 0.002.'
- en: 'Calculate: Ib = 1 x 10^-5 A.'
- en: 'Give it in μA: 10 μA.'
- en: So the base current is 10 μA.
- en: The correct option is b.
