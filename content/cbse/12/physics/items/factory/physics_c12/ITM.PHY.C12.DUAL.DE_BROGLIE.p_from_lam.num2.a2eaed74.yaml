solution_steps:
- en: 'Write the relation: wavelength = h / p, so p = h / wavelength.'
- en: 'Put each quantity in SI units: 0.1 nm = 1 x 10^-10 m.'
- en: 'Get the momentum alone: multiply each side by p and divide each side by the
    wavelength.'
- en: 'Substitute: p = (6.63 x 10^-34) / (1 x 10^-10).'
- en: 'Calculate: p = 6.63 x 10^-24 kg m/s.'
- en: So the momentum is 6.63 x 10^-24 kg m/s.
- en: The correct option is d.
