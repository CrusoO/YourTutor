solution_steps:
- en: 'Write the relation: binding energy per nucleon = binding energy / A.'
- en: 'Put each quantity in SI units: 372.6 MeV = 5.9616 x 10^-11 J; 9.315 MeV = 1.4904
    x 10^-12 J.'
- en: 'Substitute: A = (5.9616 x 10^-11) / (1.4904 x 10^-12).'
- en: 'Calculate: A = 40.'
- en: So the mass number is 40.
- en: The correct option is b.
