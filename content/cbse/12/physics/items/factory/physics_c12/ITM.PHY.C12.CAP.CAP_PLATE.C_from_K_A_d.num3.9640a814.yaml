solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 500 cm² = 0.05 m²; 0.5 mm = 5 x 10^-4 m.'
- en: 'Substitute: C = 2 x (8.85 x 10^-12) x 0.05 / (5 x 10^-4).'
- en: 'Calculate: C = 1.77 x 10^-9 F.'
- en: 'Give it in pF: 1770 pF.'
- en: So the capacitance is 1770 pF.
- en: The correct option is b.
