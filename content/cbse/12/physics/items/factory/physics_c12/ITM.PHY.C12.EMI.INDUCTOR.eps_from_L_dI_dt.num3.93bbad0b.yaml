solution_steps:
- en: 'Write the relation: emf = L x current change / time.'
- en: 'Put each quantity in SI units: 50 mH = 0.05 H; 10 ms = 0.01 s.'
- en: 'Substitute: eps = 0.05 x 1 / 0.01.'
- en: 'Calculate: eps = 5 V.'
- en: So the induced emf is 5 V.
- en: The correct option is c.
