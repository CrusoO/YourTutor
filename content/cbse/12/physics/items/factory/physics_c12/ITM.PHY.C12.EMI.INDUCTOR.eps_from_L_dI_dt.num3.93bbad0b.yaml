stem:
  en: A student is studying an inductor in a circuit. The inductance, L, is 50 mH,
    the current changes by 1 A and the change takes 10 ms. Find the magnitude of the
    induced emf.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: emf = L x current change / time.'
- level: 2
  en: The relation already gives the induced emf directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 50 mH as 0.05 H and 10 ms as 0.01 s, then write eps = L x
    dI / dt, where eps is the induced emf, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the induced emf have, and roughly how
    large is it?
