solution_steps:
- en: 'Write the relation: Q = C x V.'
- en: 'Put each quantity in SI units: 20 μF = 2 x 10^-5 F.'
- en: 'Substitute: Q = (2 x 10^-5) x 20.'
- en: 'Calculate: Q = 4 x 10^-4 C.'
- en: 'Give it in μC: 400 μC.'
- en: So the charge is 400 μC.
