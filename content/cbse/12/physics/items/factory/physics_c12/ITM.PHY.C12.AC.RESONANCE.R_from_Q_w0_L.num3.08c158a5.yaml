solution_steps:
- en: 'Write the relation: Q = w0 x L / R.'
- en: 'Put each quantity in SI units: 250 mH = 0.25 H.'
- en: 'Substitute: R = 500 x 0.25 / 2.5.'
- en: 'Calculate: R = 50 Ω.'
- en: So the resistance is 50 Ω.
- en: The correct option is c.
