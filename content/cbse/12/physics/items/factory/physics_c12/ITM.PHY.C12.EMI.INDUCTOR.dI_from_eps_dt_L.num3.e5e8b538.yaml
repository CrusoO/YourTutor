solution_steps:
- en: 'Write the relation: emf = L x current change / time.'
- en: 'Put each quantity in SI units: 50 ms = 0.05 s; 200 mH = 0.2 H.'
- en: 'Substitute: dI = 8 x 0.05 / 0.2.'
- en: 'Calculate: dI = 2 A.'
- en: So the change in current is 2 A.
- en: The correct option is d.
