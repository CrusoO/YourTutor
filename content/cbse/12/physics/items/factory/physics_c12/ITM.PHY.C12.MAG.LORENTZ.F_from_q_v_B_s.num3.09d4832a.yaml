solution_steps:
- en: 'Write the relation: F = q x v x B x sine of the angle.'
- en: 'Put each quantity in SI units: 500 mT = 0.5 T.'
- en: 'Substitute: F = (3.2 x 10^-19) x 200000 x 0.5 x 1.'
- en: 'Calculate: F = 3.2 x 10^-14 N.'
- en: So the force is 3.2 x 10^-14 N.
- en: The correct option is c.
