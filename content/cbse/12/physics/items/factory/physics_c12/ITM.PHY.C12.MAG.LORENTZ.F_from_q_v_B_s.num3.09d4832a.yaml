stem:
  en: A student is studying a charged particle moving in a magnetic field. The charge
    of the particle, q, is 3.2 x 10^-19 C, its speed, v, is 200000 m/s, the magnetic
    field, B, is 500 mT and the sine of the angle between the velocity and the field,
    s, is 1. Find the magnitude of the magnetic force.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: F = q x v x B x sine of the angle.'
- level: 2
  en: The relation already gives the force directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 500 mT as 0.5 T, then write F = q x v x B x s, where F is
    the force, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the force have, and roughly how large
    is it?
