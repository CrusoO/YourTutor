solution_steps:
- en: 'Write the relation: emf = L x current change / time.'
- en: 'Put each quantity in SI units: 200 mH = 0.2 H; 10 ms = 0.01 s.'
- en: 'Substitute: eps = 0.2 x 2 / 0.01.'
- en: 'Calculate: eps = 40 V.'
- en: So the induced emf is 40 V.
- en: The correct option is c.
