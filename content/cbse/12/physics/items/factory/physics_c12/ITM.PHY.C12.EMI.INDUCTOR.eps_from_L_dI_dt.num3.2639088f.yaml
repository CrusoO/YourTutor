stem:
  en: A student is studying an inductor in a circuit. The inductance, L, is 200 mH,
    the current changes by 2 A and the change takes 10 ms. Find the magnitude of the
    induced emf.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: emf = L x current change / time.'
- level: 2
  en: The relation already gives the induced emf directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 200 mH as 0.2 H and 10 ms as 0.01 s, then write eps = L x
    dI / dt, where eps is the induced emf, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the induced emf have, and roughly how
    large is it?
