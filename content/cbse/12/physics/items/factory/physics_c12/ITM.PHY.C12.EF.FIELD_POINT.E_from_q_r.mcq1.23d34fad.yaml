solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Put each quantity in SI units: 5 nC = 5 x 10^-9 C.'
- en: 'Substitute: E = (9 x 10^9) x (5 x 10^-9) / 5^2.'
- en: 'Calculate: E = 1.8 N/C.'
- en: So the electric field is 1.8 N/C.
