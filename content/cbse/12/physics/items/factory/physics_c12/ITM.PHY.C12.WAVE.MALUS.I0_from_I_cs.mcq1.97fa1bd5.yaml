stem:
  en: The transmitted intensity, I, is 12.5 W/m^2 and the cosine of the angle between
    the pass directions, cs, is 0.5. Find the intensity of the incident light.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: I = I0 x cosine squared of the angle for polarised light.'
- level: 2
  en: 'Get the incident intensity on its own before you put numbers in: divide each
    side by cosine squared of the angle. Do the same operation to each side of the
    formula.'
- level: 3
  en: 'First step: write I0 = I / cs^2, where I0 is the incident intensity, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the incident intensity have, and roughly
    how large is it?
