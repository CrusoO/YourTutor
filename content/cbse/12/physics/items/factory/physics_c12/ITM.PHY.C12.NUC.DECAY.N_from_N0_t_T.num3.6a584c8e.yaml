solution_steps:
- en: 'Write the relation: the number of half-lives is t / T, then N = N0 / 2^(t/T).'
- en: 'Put each quantity in SI units: 50 years = 1.5768 x 10^9 s; 10 years = 3.1536
    x 10^8 s.'
- en: 'Substitute: N = 640 / 2^((1.5768 x 10^9) / (3.1536 x 10^8)).'
- en: 'Calculate: N = 20.'
- en: So the remaining number of nuclei is 20.
- en: The correct option is d.
