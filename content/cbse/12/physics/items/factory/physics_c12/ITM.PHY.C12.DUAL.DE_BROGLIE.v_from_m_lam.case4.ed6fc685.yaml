solution_steps:
- en: 'Write the relation: wavelength = h / [m x v], so v = h / [m x wavelength].'
- en: 'Put each quantity in SI units: 2 nm = 2 x 10^-9 m.'
- en: 'Substitute: v = (6.63 x 10^-34) / ((6.63 x 10^-31) x (2 x 10^-9)).'
- en: 'Calculate: v = 500000 m/s.'
- en: So the speed is 500000 m/s.
- en: The correct option is c.
