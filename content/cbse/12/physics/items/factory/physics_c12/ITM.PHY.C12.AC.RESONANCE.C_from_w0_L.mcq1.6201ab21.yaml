solution_steps:
- en: 'Write the relation: w0 = 1 / square root of [L x C], so C = 1 / (w0^2 x L).'
- en: 'Put each quantity in SI units: 400 mH = 0.4 H.'
- en: 'Get the capacitance alone: square each side of the relation, then rearrange
    for C.'
- en: 'Substitute: C = 1 / (500^2 x 0.4).'
- en: 'Calculate: C = 1 x 10^-5 F.'
- en: 'Give it in μF: 10 μF.'
- en: So the capacitance is 10 μF.
- en: The correct option is a.
