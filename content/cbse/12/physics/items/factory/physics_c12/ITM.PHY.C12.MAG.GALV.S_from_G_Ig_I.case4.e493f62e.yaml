stem:
  en: 'Case: a student investigates converting a galvanometer into an ammeter or a
    voltmeter and records the following. The galvanometer coil has a resistance of
    100 Ω, its full scale deflection needs 5 mA and the ammeter must read up to 255
    mA. Find the shunt resistance needed.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: the shunt takes the extra current: Ig x G = (I - Ig) x S.'
- level: 2
  en: 'Get the shunt on its own before you put numbers in: divide each side of Ig
    x G = (I - Ig) x S by (I - Ig). Do the same operation to each side of the formula.
    Change every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 5 mA as 0.005 A and 255 mA as 0.255 A, then write S = G x
    Ig / (I - Ig), where S is the shunt, with the values in place, one quantity at
    a time.'
prediction_prompt:
  en: Before you calculate, what unit should the shunt have, and roughly how large
    is it?
