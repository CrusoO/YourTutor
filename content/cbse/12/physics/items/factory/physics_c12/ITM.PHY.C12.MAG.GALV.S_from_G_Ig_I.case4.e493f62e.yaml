solution_steps:
- en: 'Write the relation: the shunt takes the extra current: Ig x G = (I - Ig) x
    S.'
- en: 'Put each quantity in SI units: 5 mA = 0.005 A; 255 mA = 0.255 A.'
- en: 'Get the shunt alone: divide each side of Ig x G = (I - Ig) x S by (I - Ig).'
- en: 'Substitute: S = 100 x 0.005 / (0.255 - 0.005).'
- en: 'Calculate: S = 2 Ω.'
- en: So the shunt is 2 Ω.
- en: The correct option is a.
