- en: 'Put each quantity in SI units: 500 mT = 0.5 T; 250 mA = 0.25 A; 20 cm = 0.2
    m.'
- en: 'Substitute: F = 0.5 x 0.25 x 0.2.'
- en: 'Calculate: F = 0.025 N.'
- en: 'Give it in mN: 25 mN.'
- en: So the force is 25 mN.
