stem:
  en: 'Case: a student investigates a parallel plate capacitor and records the following.
    The capacitance, C, is 177 pF, the dielectric constant of the material between
    the plates, K, is 5 and the area of each plate, A, is 100 cm². Find the gap between
    the plates. Take the permittivity of free space, eps0, = 8.85 x 10^-12 C²/(N m²).'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: C = K x eps0 x A / d.'
- level: 2
  en: 'Get the plate gap on its own before you put numbers in: multiply each side
    by d and divide each side by C. Do the same operation to each side of the formula.
    Change every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 177 pF as 1.77 x 10^-10 F and 100 cm² as 0.01 m², then write
    d = K x eps0 x A / C, where d is the plate gap, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the plate gap have, and roughly how large
    is it?
