solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 177 pF = 1.77 x 10^-10 F; 100 cm² = 0.01 m².'
- en: 'Get the plate gap alone: multiply each side by d and divide each side by C.'
- en: 'Substitute: d = 5 x (8.85 x 10^-12) x 0.01 / (1.77 x 10^-10).'
- en: 'Calculate: d = 0.0025 m.'
- en: 'Give it in mm: 2.5 mm.'
- en: So the plate gap is 2.5 mm.
- en: The correct option is d.
