solution_steps:
- en: 'Write the relation: R / S = l1 / l2.'
- en: 'Put each quantity in SI units: 75 cm = 0.75 m; 25 cm = 0.25 m.'
- en: 'Substitute: R = 1 x 0.75 / 0.25.'
- en: 'Calculate: R = 3 Ω.'
- en: So the known resistance is 3 Ω.
