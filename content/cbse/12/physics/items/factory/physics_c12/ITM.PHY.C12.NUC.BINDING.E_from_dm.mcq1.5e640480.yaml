stem:
  en: The mass defect, dm, is 0.02 u. Find the binding energy. Take the energy equivalent
    of one atomic mass unit, ue, = 931.5 MeV/u.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: binding energy = mass defect x energy of one atomic mass unit.'
- level: 2
  en: The relation already gives the binding energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 0.02 u as 3.32 x 10^-29 kg, then write E = dm x ue, where
    E is the binding energy, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the binding energy have, and roughly
    how large is it?
