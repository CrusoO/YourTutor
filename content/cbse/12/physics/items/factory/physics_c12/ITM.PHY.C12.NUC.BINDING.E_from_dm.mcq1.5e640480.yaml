solution_steps:
- en: 'Write the relation: binding energy = mass defect x energy of one atomic mass
    unit.'
- en: 'Put each quantity in SI units: 0.02 u = 3.32 x 10^-29 kg.'
- en: 'Substitute: E = (3.32 x 10^-29) x 8.98e + 16.'
- en: 'Calculate: E = 2.9808 x 10^-12 J.'
- en: 'Give it in MeV: 18.63 MeV.'
- en: So the binding energy is 18.63 MeV.
- en: The correct option is b.
