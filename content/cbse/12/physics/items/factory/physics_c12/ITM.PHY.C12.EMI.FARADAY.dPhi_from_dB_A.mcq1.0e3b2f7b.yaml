solution_steps:
- en: 'Write the relation: change in flux = [change in field] x area, for a field
    along the normal.'
- en: 'Put each quantity in SI units: 200 cm² = 0.02 m².'
- en: 'Substitute: dPhi = 0.5 x 0.02.'
- en: 'Calculate: dPhi = 0.01 Wb.'
- en: 'Give it in mWb: 10 mWb.'
- en: So the change in flux is 10 mWb.
