stem:
  en: This question is about a parallel plate capacitor. The capacitance, C, is 708
    pF, the dielectric constant of the material between the plates, K, is 4 and the
    area of each plate, A, is 200 cm². Find the gap between the plates. Take the permittivity
    of free space, eps0, = 8.85 x 10^-12 C²/(N m²).
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: C = K x eps0 x A / d.'
- level: 2
  en: 'Get the plate gap on its own before you put numbers in: multiply each side
    by d and divide each side by C. Do the same operation to each side of the formula.
    Change every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 708 pF as 7.08 x 10^-10 F and 200 cm² as 0.02 m², then write
    d = K x eps0 x A / C, where d is the plate gap, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the plate gap have, and roughly how large
    is it?
