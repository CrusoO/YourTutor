solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 708 pF = 7.08 x 10^-10 F; 200 cm² = 0.02 m².'
- en: 'Get the plate gap alone: multiply each side by d and divide each side by C.'
- en: 'Substitute: d = 4 x (8.85 x 10^-12) x 0.02 / (7.08 x 10^-10).'
- en: 'Calculate: d = 0.001 m.'
- en: 'Give it in mm: 1 mm.'
- en: So the plate gap is 1 mm.
- en: The correct option is a.
