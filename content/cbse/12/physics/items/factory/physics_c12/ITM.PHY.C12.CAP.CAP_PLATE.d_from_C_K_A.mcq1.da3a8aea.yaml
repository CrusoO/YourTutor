solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 88.5 pF = 8.85 x 10^-11 F; 400 cm² = 0.04 m².'
- en: 'Get the plate gap alone: multiply each side by d and divide each side by C.'
- en: 'Substitute: d = 1 x (8.85 x 10^-12) x 0.04 / (8.85 x 10^-11).'
- en: 'Calculate: d = 0.004 m.'
- en: 'Give it in mm: 4 mm.'
- en: So the plate gap is 4 mm.
- en: The correct option is c.
