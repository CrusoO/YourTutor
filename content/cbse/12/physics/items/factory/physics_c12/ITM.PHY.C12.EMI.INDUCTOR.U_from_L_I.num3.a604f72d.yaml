stem:
  en: A student is studying an inductor in a circuit. The inductance, L, is 10 mH
    and the steady current, I, is 2 A. Find the energy stored in the inductor.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: U = (1/2) x L x I^2.'
- level: 2
  en: The relation already gives the stored energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 10 mH as 0.01 H, then write U = L x I^2 / 2, where U is the
    stored energy, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the stored energy have, and roughly how
    large is it?
