solution_steps:
- en: 'Write the relation: U = (1/2) x L x I^2.'
- en: 'Put each quantity in SI units: 10 mH = 0.01 H.'
- en: 'Substitute: U = 0.01 x 2^2 / 2.'
- en: 'Calculate: U = 0.02 J.'
- en: 'Give it in mJ: 20 mJ.'
- en: So the stored energy is 20 mJ.
- en: The correct option is c.
