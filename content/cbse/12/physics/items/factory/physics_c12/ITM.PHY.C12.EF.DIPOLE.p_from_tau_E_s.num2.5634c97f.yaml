solution_steps:
- en: 'Write the relation: torque = p x E x sine of the angle.'
- en: 'Get the dipole moment alone: divide each side of torque = p x E x sine of the
    angle by E x sine of the angle.'
- en: 'Substitute: p = (1.2 x 10^-4) / (1000 x 0.6).'
- en: 'Calculate: p = 2 x 10^-7 C m.'
- en: So the dipole moment is 2 x 10^-7 C m.
- en: The correct option is d.
