stem:
  en: 'Case: a student investigates an electric dipole in a uniform field and records
    the following. The dipole moment, p, is 2 x 10^-10 C m, the uniform field, E,
    is 5000 N/C and the sine of the angle between the dipole and the field, s, is
    0.5. Find the torque on the dipole.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: torque = p x E x sine of the angle.'
- level: 2
  en: The relation already gives the torque directly, so decide what to substitute.
- level: 3
  en: 'First step: write tau = p x E x s, where tau is the torque, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the torque have, and roughly how large
    is it?
