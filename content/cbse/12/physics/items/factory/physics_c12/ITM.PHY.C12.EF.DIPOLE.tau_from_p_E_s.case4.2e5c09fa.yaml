solution_steps:
- en: 'Write the relation: torque = p x E x sine of the angle.'
- en: 'Substitute: tau = (2 x 10^-10) x 5000 x 0.5.'
- en: 'Calculate: tau = 5 x 10^-7 N m.'
- en: So the torque is 5 x 10^-7 N m.
- en: The correct option is c.
