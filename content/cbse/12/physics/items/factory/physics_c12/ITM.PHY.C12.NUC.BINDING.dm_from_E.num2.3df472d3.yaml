solution_steps:
- en: 'Write the relation: binding energy = mass defect x energy of one atomic mass
    unit.'
- en: 'Put each quantity in SI units: 745.2 MeV = 1.19232 x 10^-10 J.'
- en: 'Get the mass defect alone: divide each side by the energy of one atomic mass
    unit.'
- en: 'Substitute: dm = (1.19232 x 10^-10) / 8.98e + 16.'
- en: 'Calculate: dm = 1.328 x 10^-27 kg.'
- en: 'Give it in u: 0.8 u.'
- en: So the mass defect is 0.8 u.
- en: The correct option is c.
