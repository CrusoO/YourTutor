stem:
  en: This question is about the binding energy of a nucleus. The binding energy,
    E, is 745.2 MeV. Find the mass defect. Take the energy equivalent of one atomic
    mass unit, ue, = 931.5 MeV/u.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: binding energy = mass defect x energy of one atomic mass unit.'
- level: 2
  en: 'Get the mass defect on its own before you put numbers in: divide each side
    by the energy of one atomic mass unit. Do the same operation to each side of the
    formula. Change every quantity to SI units first, and change back at the end if
    asked.'
- level: 3
  en: 'First step: Write 745.2 MeV as 1.19232 x 10^-10 J, then write dm = E / ue,
    where dm is the mass defect, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the mass defect have, and roughly how
    large is it?
