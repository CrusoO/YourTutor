solution_steps:
- en: 'Write the relation: tube length = fo + fe in normal adjustment.'
- en: 'Put each quantity in SI units: 82 cm = 0.82 m; 80 cm = 0.8 m.'
- en: 'Get the eyepiece focal length alone: subtract fo from each side.'
- en: 'Substitute: fe = 0.82 - 0.8.'
- en: 'Calculate: fe = 0.02 m.'
- en: 'Give it in cm: 2 cm.'
- en: So the eyepiece focal length is 2 cm.
- en: The correct option is a.
