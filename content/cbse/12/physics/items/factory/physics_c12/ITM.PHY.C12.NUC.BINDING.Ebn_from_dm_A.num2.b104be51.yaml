solution_steps:
- en: 'Write the relation: binding energy per nucleon = mass defect x energy of one
    atomic mass unit / A.'
- en: 'Put each quantity in SI units: 0.2 u = 3.32 x 10^-28 kg.'
- en: 'Substitute: Ebn = (3.32 x 10^-28) x 8.98e + 16 / 2.'
- en: 'Calculate: Ebn = 1.4904 x 10^-11 J.'
- en: 'Give it in MeV: 93.15 MeV.'
- en: So the binding energy per nucleon is 93.15 MeV.
- en: The correct option is c.
