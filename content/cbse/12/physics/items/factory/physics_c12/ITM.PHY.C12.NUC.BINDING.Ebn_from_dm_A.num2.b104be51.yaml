stem:
  en: This question is about the binding energy of a nucleus. The mass defect, dm,
    is 0.2 u and the mass number, A, is 2. Find the binding energy per nucleon. Take
    the energy equivalent of one atomic mass unit, ue, = 931.5 MeV/u.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: binding energy per nucleon = mass defect x energy of one atomic mass
    unit / A.'
- level: 2
  en: The relation already gives the binding energy per nucleon directly, so decide
    what to substitute. Change every quantity to SI units first, and change back at
    the end if asked.
- level: 3
  en: 'First step: Write 0.2 u as 3.32 x 10^-28 kg, then write Ebn = dm x ue / A,
    where Ebn is the binding energy per nucleon, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the binding energy per nucleon have,
    and roughly how large is it?
