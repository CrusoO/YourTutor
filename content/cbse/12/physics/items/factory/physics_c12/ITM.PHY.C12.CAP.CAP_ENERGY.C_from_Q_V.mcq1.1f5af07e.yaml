stem:
  en: The charge stored, Q, is 1000 μC and the potential difference across it, V,
    is 10 V. Find the capacitance.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: Q = C x V.'
- level: 2
  en: 'Get the capacitance on its own before you put numbers in: divide each side
    of Q = C x V by V. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 1000 μC as 0.001 C, then write C = Q / V, where C is the
    capacitance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the capacitance have, and roughly how
    large is it?
