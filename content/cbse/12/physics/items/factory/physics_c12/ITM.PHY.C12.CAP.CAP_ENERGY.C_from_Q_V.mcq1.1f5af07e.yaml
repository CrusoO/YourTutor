solution_steps:
- en: 'Write the relation: Q = C x V.'
- en: 'Put each quantity in SI units: 1000 μC = 0.001 C.'
- en: 'Get the capacitance alone: divide each side of Q = C x V by V.'
- en: 'Substitute: C = 0.001 / 10.'
- en: 'Calculate: C = 1 x 10^-4 F.'
- en: 'Give it in μF: 100 μF.'
- en: So the capacitance is 100 μF.
- en: The correct option is c.
