solution_steps:
- en: 'Write the relation: emf = N x flux change / time.'
- en: 'Put each quantity in SI units: 4 mWb = 0.004 Wb.'
- en: 'Get the time alone: multiply each side by the time and divide each side by
    the emf.'
- en: 'Substitute: dt = 500 x 0.004 / 200.'
- en: 'Calculate: dt = 0.01 s.'
- en: 'Give it in ms: 10 ms.'
- en: So the time is 10 ms.
- en: The correct option is a.
