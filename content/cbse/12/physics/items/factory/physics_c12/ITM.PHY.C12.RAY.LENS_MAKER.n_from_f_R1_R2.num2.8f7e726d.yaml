solution_steps:
- en: 'Write the relation: 1/f = (n - 1) x (1/R1 + 1/R2), so n = 1 + 1/(f x (1/R1
    + 1/R2)).'
- en: 'Put each quantity in SI units: 25 cm = 0.25 m; 15 cm = 0.15 m; 30 cm = 0.3
    m.'
- en: 'Substitute: n = 1 + 0.15 x 0.3 / (0.25 x (0.15 + 0.3)).'
- en: 'Calculate: n = 1.4.'
- en: So the refractive index is 1.4.
