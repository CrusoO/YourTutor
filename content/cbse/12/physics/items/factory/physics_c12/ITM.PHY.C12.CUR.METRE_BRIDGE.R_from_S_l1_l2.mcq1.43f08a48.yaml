solution_steps:
- en: 'Write the relation: R / S = l1 / l2.'
- en: 'Put each quantity in SI units: 25 cm = 0.25 m; 75 cm = 0.75 m.'
- en: 'Substitute: R = 45 x 0.25 / 0.75.'
- en: 'Calculate: R = 15 Ω.'
- en: So the known resistance is 15 Ω.
