stem:
  en: This question is about an inductor in a circuit. The induced emf, eps, is 100
    V, the current changes by 5 A and the change takes 10 ms. Find the inductance
    of the coil.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: emf = L x current change / time.'
- level: 2
  en: 'Get the inductance on its own before you put numbers in: multiply each side
    by the time and divide each side by the change in current. Do the same operation
    to each side of the formula. Change every quantity to SI units first, and change
    back at the end if asked.'
- level: 3
  en: 'First step: Write 10 ms as 0.01 s, then write L = eps x dt / dI, where L is
    the inductance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the inductance have, and roughly how
    large is it?
