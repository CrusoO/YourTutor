stem:
  en: 'Case: a student investigates an inductor in a circuit and records the following.
    The energy stored in the magnetic field, U, is 2500 mJ and the inductance, L,
    is 200 mH. Find the current in the inductor.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: U = (1/2) x L x I^2.'
- level: 2
  en: 'Get the current on its own before you put numbers in: multiply each side by
    2, divide each side by L, then take the square root. Do the same operation to
    each side of the formula. Change every quantity to SI units first, and change
    back at the end if asked.'
- level: 3
  en: 'First step: Write 2500 mJ as 2.5 J and 200 mH as 0.2 H, then write I = sqrt(2
    x U / L), where I is the current, with the values in place, one quantity at a
    time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
