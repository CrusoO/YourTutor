solution_steps:
- en: 'Write the relation: U = (1/2) x L x I^2.'
- en: 'Put each quantity in SI units: 2500 mJ = 2.5 J; 200 mH = 0.2 H.'
- en: 'Get the current alone: multiply each side by 2, divide each side by L, then
    take the square root.'
- en: 'Substitute: I = sqrt(2 x 2.5 / 0.2).'
- en: 'Calculate: I = 5 A.'
- en: So the current is 5 A.
- en: The correct option is b.
