solution_steps:
- en: 'Write the relation: c = f x wavelength.'
- en: 'Put each quantity in SI units: 60 MHz = 6 x 10^7 Hz.'
- en: 'Get the wavelength alone: divide each side by the frequency.'
- en: 'Substitute: lam = (3 x 10^8) / (6 x 10^7).'
- en: 'Calculate: lam = 5 m.'
- en: So the wavelength is 5 m.
- en: The correct option is a.
