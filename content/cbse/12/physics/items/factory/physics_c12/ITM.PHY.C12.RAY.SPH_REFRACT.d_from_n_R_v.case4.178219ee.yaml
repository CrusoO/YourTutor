stem:
  en: 'Case: a student investigates refraction at a curved glass surface and records
    the following. The refractive index of the glass, n, is 2, the radius of curvature
    of the convex surface, R, is 15 cm and the image forms 20 cm from the surface
    inside the glass. Find the distance of the object from the surface.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: n/v - 1/d = (n - 1)/R, so 1/d = n/v - (n - 1)/R.'
- level: 2
  en: The relation already gives the object distance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 15 cm as 0.15 m and 20 cm as 0.2 m, then write d = 1 / (n
    / v - (n - 1) / R), where d is the object distance, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the object distance have, and roughly
    how large is it?
