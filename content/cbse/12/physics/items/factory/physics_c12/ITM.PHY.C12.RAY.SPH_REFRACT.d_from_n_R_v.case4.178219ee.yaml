solution_steps:
- en: 'Write the relation: n/v - 1/d = (n - 1)/R, so 1/d = n/v - (n - 1)/R.'
- en: 'Put each quantity in SI units: 15 cm = 0.15 m; 20 cm = 0.2 m.'
- en: 'Substitute: d = 1 / (2 / 0.2 - (2 - 1) / 0.15).'
- en: 'Calculate: d = 0.3 m.'
- en: 'Give it in cm: 30 cm.'
- en: So the object distance is 30 cm.
- en: The correct option is b.
