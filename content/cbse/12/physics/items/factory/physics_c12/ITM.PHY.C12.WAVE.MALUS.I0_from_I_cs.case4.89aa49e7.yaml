solution_steps:
- en: 'Write the relation: I = I0 x cosine squared of the angle for polarised light.'
- en: 'Get the incident intensity alone: divide each side by cosine squared of the
    angle.'
- en: 'Substitute: I0 = 25 / 0.5^2.'
- en: 'Calculate: I0 = 100 W/m^2.'
- en: So the incident intensity is 100 W/m^2.
- en: The correct option is b.
