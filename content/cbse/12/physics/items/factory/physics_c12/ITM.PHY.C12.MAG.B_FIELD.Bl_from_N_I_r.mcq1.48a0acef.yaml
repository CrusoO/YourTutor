stem:
  en: The number of turns, N, is 100, the current, I, is 5 A and the distance, r,
    is 10 cm. Find the field at the centre of the coil. Take the permeability of free
    space, mu0, = 1.256 x 10^-6 N/A².
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: B = mu0 x N x I / (2 x r) at the centre of a circular coil.'
- level: 2
  en: The relation already gives the field at the centre directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 10 cm as 0.1 m, then write Bl = mu0 x N x I / (2 x r), where
    Bl is the field at the centre, with the values in place, one quantity at a time.'
