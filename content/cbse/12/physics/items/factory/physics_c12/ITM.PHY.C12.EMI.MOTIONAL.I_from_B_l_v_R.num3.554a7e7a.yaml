solution_steps:
- en: 'Write the relation: emf = B x l x v, then I = emf / R.'
- en: 'Put each quantity in SI units: 200 mT = 0.2 T; 10 cm = 0.1 m.'
- en: 'Substitute: I = 0.2 x 0.1 x 1 / 1.'
- en: 'Calculate: I = 0.02 A.'
- en: 'Give it in mA: 20 mA.'
- en: So the current is 20 mA.
- en: The correct option is d.
