stem:
  en: A student is studying an ideal transformer. The primary voltage, Vp, is 220
    V, the number of primary turns, Np, is 1000 and the number of secondary turns,
    Ns, is 20. Find the secondary voltage.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: Vs / Vp = Ns / Np.'
- level: 2
  en: The relation already gives the secondary voltage directly, so decide what to
    substitute.
- level: 3
  en: 'First step: write Vs = Vp x Ns / Np, where Vs is the secondary voltage, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the secondary voltage have, and roughly
    how large is it?
