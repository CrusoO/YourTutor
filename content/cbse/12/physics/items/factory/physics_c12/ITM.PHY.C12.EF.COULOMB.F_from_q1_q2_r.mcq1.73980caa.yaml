- en: 'Put each quantity in SI units: 10 μC = 1 x 10^-5 C; 5 μC = 5 x 10^-6 C; 10
    cm = 0.1 m.'
- en: 'Substitute: F = (9 x 10^9) x (1 x 10^-5) x (5 x 10^-6) / 0.1^2.'
