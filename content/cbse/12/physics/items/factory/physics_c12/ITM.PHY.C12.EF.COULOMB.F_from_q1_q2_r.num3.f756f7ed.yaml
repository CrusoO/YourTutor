solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 5 μC = 5 x 10^-6 C; 2 μC = 2 x 10^-6 C; 10 cm
    = 0.1 m.'
- en: 'Substitute: F = (9 x 10^9) x (5 x 10^-6) x (2 x 10^-6) / 0.1^2.'
- en: 'Calculate: F = 9 N.'
- en: So the force is 9 N.
- en: The correct option is b.
