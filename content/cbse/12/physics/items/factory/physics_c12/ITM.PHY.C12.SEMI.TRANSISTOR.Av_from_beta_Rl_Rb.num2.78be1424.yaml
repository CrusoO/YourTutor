solution_steps:
- en: 'Write the relation: voltage gain = beta x load resistance / input resistance.'
- en: 'Put each quantity in SI units: 5 kΩ = 5000 Ω; 2 kΩ = 2000 Ω.'
- en: 'Substitute: Av = 20 x 5000 / 2000.'
- en: 'Calculate: Av = 50.'
- en: So the voltage gain is 50.
- en: The correct option is d.
