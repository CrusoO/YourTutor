solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 1770 pF = 1.77 x 10^-9 F; 1000 cm² = 0.1 m²;
    2.5 mm = 0.0025 m.'
- en: 'Get the dielectric constant alone: multiply each side by d and divide each
    side by eps0 x A.'
- en: 'Substitute: K = (1.77 x 10^-9) x 0.0025 / ((8.85 x 10^-12) x 0.1).'
- en: 'Calculate: K = 5.'
- en: So the dielectric constant is 5.
- en: The correct option is a.
