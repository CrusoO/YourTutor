solution_steps:
- en: 'Write the relation: emf = B x l x v.'
- en: 'Put each quantity in SI units: 50 mV = 0.05 V; 100 mT = 0.1 T.'
- en: 'Get the rod length alone: divide each side by B x v.'
- en: 'Substitute: l = 0.05 / (0.1 x 5).'
- en: 'Calculate: l = 0.1 m.'
- en: 'Give it in cm: 10 cm.'
- en: So the rod length is 10 cm.
- en: The correct option is d.
