stem:
  en: This question is about an ideal transformer. The primary voltage, Vp, is 220
    V, the secondary voltage, Vs, is 22 V and the number of secondary turns, Ns, is
    20. Find the number of primary turns.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: Vs / Vp = Ns / Np.'
- level: 2
  en: The relation already gives the primary turns directly, so decide what to substitute.
- level: 3
  en: 'First step: write Np = Ns x Vp / Vs, where Np is the primary turns, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the primary turns be?
