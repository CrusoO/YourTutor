solution_steps:
- en: 'Write the relation: series: 1/Cs = 1/C1 + 1/C2.'
- en: 'Put each quantity in SI units: 2 μF = 2 x 10^-6 F; 6 μF = 6 x 10^-6 F.'
- en: 'Get the second capacitance alone: write 1/C2 = 1/Cs - 1/C1 and combine the
    fractions.'
- en: 'Substitute: C2 = (2 x 10^-6) x (6 x 10^-6) / ((6 x 10^-6) - (2 x 10^-6)).'
- en: 'Calculate: C2 = 3 x 10^-6 F.'
- en: 'Give it in μF: 3 μF.'
- en: So the second capacitance is 3 μF.
- en: The correct option is b.
