stem:
  en: This question is about two capacitors joined together. The series combination,
    Cs, is 2 μF and the first capacitor, C1, is 6 μF. Find the second capacitance.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: series: 1/Cs = 1/C1 + 1/C2.'
- level: 2
  en: 'Get the second capacitance on its own before you put numbers in: write 1/C2
    = 1/Cs - 1/C1 and combine the fractions. Do the same operation to each side of
    the formula. Change every quantity to SI units first, and change back at the end
    if asked.'
- level: 3
  en: 'First step: Write 2 μF as 2 x 10^-6 F and 6 μF as 6 x 10^-6 F, then write C2
    = Cs x C1 / (C1 - Cs), where C2 is the second capacitance, with the values in
    place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the second capacitance have, and roughly
    how large is it?
