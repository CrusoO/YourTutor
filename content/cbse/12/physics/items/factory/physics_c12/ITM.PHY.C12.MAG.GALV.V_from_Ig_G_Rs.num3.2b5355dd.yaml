solution_steps:
- en: 'Write the relation: V = Ig x (G + Rs).'
- en: 'Put each quantity in SI units: 10 mA = 0.01 A.'
- en: 'Substitute: V = 0.01 x (50 + 2950).'
- en: 'Calculate: V = 30 V.'
- en: So the voltmeter range is 30 V.
- en: The correct option is c.
