solution_steps:
- en: 'Write the relation: emitter current = base current + collector current.'
- en: 'Put each quantity in SI units: 25 μA = 2.5 x 10^-5 A; 0.5 mA = 5 x 10^-4 A.'
- en: 'Substitute: Ie = (2.5 x 10^-5) + (5 x 10^-4).'
- en: 'Calculate: Ie = 5.25 x 10^-4 A.'
- en: 'Give it in mA: 0.525 mA.'
- en: So the emitter current is 0.525 mA.
