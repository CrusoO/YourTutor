stem:
  en: 'Case: a student investigates a thin double convex lens in air and records the
    following. The refractive index of the glass, n, is 2, the focal length, f, is
    12 cm and the radius of curvature of the second face, R2, is 60 cm. Find the radius
    of curvature of the first face.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: 1/f = (n - 1) x (1/R1 + 1/R2), so 1/R1 = 1/((n - 1) x f) - 1/R2.'
- level: 2
  en: The relation already gives the first radius directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 12 cm as 0.12 m and 60 cm as 0.6 m, then write R1 = 1 / (1
    / ((n - 1) x f) - 1 / R2), where R1 is the first radius, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the first radius have, and roughly how
    large is it?
