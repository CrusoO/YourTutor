solution_steps:
- en: 'Write the relation: I = n x e x A x v_d.'
- en: 'Put each quantity in SI units: 4 mm² = 4 x 10^-6 m².'
- en: 'Get the drift speed alone: divide each side by n x e x A.'
- en: 'Substitute: vd = 6.4 / ((2 x 10^28) x (1.6 x 10^-19) x (4 x 10^-6)).'
- en: 'Calculate: vd = 5 x 10^-4 m/s.'
- en: 'Give it in mm/s: 0.5 mm/s.'
- en: So the drift speed is 0.5 mm/s.
- en: The correct option is d.
