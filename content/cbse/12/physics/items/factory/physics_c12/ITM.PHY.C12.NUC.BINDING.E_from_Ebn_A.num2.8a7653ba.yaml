solution_steps:
- en: 'Write the relation: binding energy per nucleon = binding energy / A.'
- en: 'Put each quantity in SI units: 18.63 MeV = 2.9808 x 10^-12 J.'
- en: 'Substitute: E = (2.9808 x 10^-12) x 2.'
- en: 'Calculate: E = 5.9616 x 10^-12 J.'
- en: 'Give it in MeV: 37.26 MeV.'
- en: So the binding energy is 37.26 MeV.
- en: The correct option is b.
