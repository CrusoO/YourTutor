solution_steps:
- en: 'Write the relation: emf = L x current change / time.'
- en: 'Put each quantity in SI units: 10 ms = 0.01 s.'
- en: 'Get the inductance alone: multiply each side by the time and divide each side
    by the change in current.'
- en: 'Substitute: L = 5 x 0.01 / 1.'
- en: 'Calculate: L = 0.05 H.'
- en: 'Give it in mH: 50 mH.'
- en: So the inductance is 50 mH.
- en: The correct option is a.
