solution_steps:
- en: 'Write the relation: I = I0 x cosine squared of the angle for polarised light.'
- en: 'Get the cosine of the angle alone: divide each side by I0, then take the square
    root.'
- en: 'Substitute: cs = sqrt(12.5 / 50).'
- en: 'Calculate: cs = 0.5.'
- en: So the cosine of the angle is 0.5.
- en: The correct option is c.
