solution_steps:
- en: 'Write the relation: F = B x I x l on the current-carrying rod.'
- en: 'Put each quantity in SI units: 500 mT = 0.5 T; 100 mA = 0.1 A; 50 cm = 0.5
    m.'
- en: 'Substitute: F = 0.5 x 0.1 x 0.5.'
- en: 'Calculate: F = 0.025 N.'
- en: 'Give it in mN: 25 mN.'
- en: So the force is 25 mN.
