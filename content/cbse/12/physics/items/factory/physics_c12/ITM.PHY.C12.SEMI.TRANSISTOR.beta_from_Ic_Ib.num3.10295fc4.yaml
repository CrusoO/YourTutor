solution_steps:
- en: 'Write the relation: beta = collector current / base current.'
- en: 'Put each quantity in SI units: 5 mA = 0.005 A; 100 μA = 1 x 10^-4 A.'
- en: 'Substitute: beta = 0.005 / (1 x 10^-4).'
- en: 'Calculate: beta = 50.'
- en: So the current gain is 50.
- en: The correct option is b.
