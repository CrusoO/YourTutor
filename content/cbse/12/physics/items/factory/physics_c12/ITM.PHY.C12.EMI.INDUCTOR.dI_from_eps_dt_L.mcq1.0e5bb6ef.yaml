solution_steps:
- en: 'Write the relation: emf = L x current change / time.'
- en: 'Put each quantity in SI units: 50 ms = 0.05 s; 10 mH = 0.01 H.'
- en: 'Substitute: dI = 0.4 x 0.05 / 0.01.'
- en: 'Calculate: dI = 2 A.'
- en: So the change in current is 2 A.
- en: The correct option is a.
