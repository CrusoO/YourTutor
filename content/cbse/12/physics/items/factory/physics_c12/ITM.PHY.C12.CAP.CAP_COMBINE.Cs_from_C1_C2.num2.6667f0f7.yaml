solution_steps:
- en: 'Write the relation: series: 1/C = 1/C1 + 1/C2, so C = C1 x C2 / (C1 + C2).'
- en: 'Put each quantity in SI units: 60 μF = 6 x 10^-5 F; 20 μF = 2 x 10^-5 F.'
- en: 'Substitute: Cs = (6 x 10^-5) x (2 x 10^-5) / ((6 x 10^-5) + (2 x 10^-5)).'
- en: 'Calculate: Cs = 1.5 x 10^-5 F.'
- en: 'Give it in μF: 15 μF.'
- en: So the series capacitance is 15 μF.
