stem:
  en: This question is about two capacitors joined together. The first capacitor,
    C1, is 60 μF and the second capacitor, C2, is 20 μF. Find the capacitance of the
    series combination.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: series: 1/C = 1/C1 + 1/C2, so C = C1 x C2 / (C1 + C2).'
- level: 2
  en: The relation already gives the series capacitance directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 60 μF as 6 x 10^-5 F and 20 μF as 2 x 10^-5 F, then write
    Cs = C1 x C2 / (C1 + C2), where Cs is the series capacitance, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the series capacitance have, and roughly
    how large is it?
