solution_steps:
- en: 'Write the relation: c = f x wavelength.'
- en: 'Get the frequency alone: divide each side by the wavelength.'
- en: 'Substitute: f = (3 x 10^8) / 100.'
- en: 'Calculate: f = 3 x 10^6 Hz.'
- en: 'Give it in MHz: 3 MHz.'
- en: So the frequency is 3 MHz.
