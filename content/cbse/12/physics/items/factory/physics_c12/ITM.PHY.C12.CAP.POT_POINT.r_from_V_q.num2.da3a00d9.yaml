solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 4 nC = 4 x 10^-9 C.'
- en: 'Get the distance alone: multiply each side by r and divide each side by V.'
- en: 'Substitute: r = (9 x 10^9) x (4 x 10^-9) / 7.2.'
- en: 'Calculate: r = 5 m.'
- en: So the distance is 5 m.
- en: The correct option is c.
