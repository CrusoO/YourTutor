stem:
  en: This question is about a parallel plate capacitor. The dielectric constant of
    the material between the plates, K, is 2, the area of each plate, A, is 1000 cm²
    and the gap between the plates, d, is 4 mm. Find the capacitance. Take the permittivity
    of free space, eps0, = 8.85 x 10^-12 C²/(N m²).
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: C = K x eps0 x A / d.'
- level: 2
  en: The relation already gives the capacitance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 1000 cm² as 0.1 m² and 4 mm as 0.004 m, then write C = K
    x eps0 x A / d, where C is the capacitance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the capacitance have, and roughly how
    large is it?
