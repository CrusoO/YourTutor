solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 1000 cm² = 0.1 m²; 4 mm = 0.004 m.'
- en: 'Substitute: C = 2 x (8.85 x 10^-12) x 0.1 / 0.004.'
- en: 'Calculate: C = 4.425 x 10^-10 F.'
- en: 'Give it in pF: 442.5 pF.'
- en: So the capacitance is 442.5 pF.
- en: The correct option is b.
