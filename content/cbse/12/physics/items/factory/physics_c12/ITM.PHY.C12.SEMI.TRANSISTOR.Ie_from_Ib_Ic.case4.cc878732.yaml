solution_steps:
- en: 'Write the relation: emitter current = base current + collector current.'
- en: 'Put each quantity in SI units: 100 μA = 1 x 10^-4 A; 5 mA = 0.005 A.'
- en: 'Substitute: Ie = (1 x 10^-4) + 0.005.'
- en: 'Calculate: Ie = 0.0051 A.'
- en: 'Give it in mA: 5.1 mA.'
- en: So the emitter current is 5.1 mA.
- en: The correct option is b.
