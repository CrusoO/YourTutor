stem:
  en: 'Case: a student investigates a transistor in the common emitter connection
    and records the following. The base current, Ib, is 100 μA and the collector current,
    Ic, is 5 mA. Find the emitter current.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: emitter current = base current + collector current.'
- level: 2
  en: The relation already gives the emitter current directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 100 μA as 1 x 10^-4 A and 5 mA as 0.005 A, then write Ie
    = Ib + Ic, where Ie is the emitter current, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the emitter current have, and roughly
    how large is it?
