solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 1.75 mm = 0.00175 m; 700 nm = 7 x 10^-7 m.'
- en: 'Substitute: d = (7 x 10^-7) x 1 / 0.00175.'
- en: 'Calculate: d = 4 x 10^-4 m.'
- en: 'Give it in mm: 0.4 mm.'
- en: So the slit separation is 0.4 mm.
- en: The correct option is a.
