solution_steps:
- en: 'Write the relation: F = B x I x L x sine of the angle.'
- en: 'Put each quantity in SI units: 50 mN = 0.05 N; 20 cm = 0.2 m.'
- en: 'Get the field alone: divide each side by I x L x sine of the angle.'
- en: 'Substitute: B = 0.05 / (5 x 0.2 x 0.5).'
- en: 'Calculate: B = 0.1 T.'
- en: 'Give it in mT: 100 mT.'
- en: So the field is 100 mT.
- en: The correct option is b.
