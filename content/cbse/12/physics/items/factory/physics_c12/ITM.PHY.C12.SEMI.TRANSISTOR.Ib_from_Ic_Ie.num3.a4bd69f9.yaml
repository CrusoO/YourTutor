stem:
  en: A student is studying a transistor in the common emitter connection. The collector
    current, Ic, is 20 mA and the emitter current, Ie, is 20.1 mA. Find the base current.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: emitter current = base current + collector current.'
- level: 2
  en: The relation already gives the base current directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 20 mA as 0.02 A and 20.1 mA as 0.0201 A, then write Ib =
    Ie - Ic, where Ib is the base current, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the base current have, and roughly how
    large is it?
