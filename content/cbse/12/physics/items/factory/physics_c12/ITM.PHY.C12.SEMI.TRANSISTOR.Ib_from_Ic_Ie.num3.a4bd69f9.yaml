solution_steps:
- en: 'Write the relation: emitter current = base current + collector current.'
- en: 'Put each quantity in SI units: 20 mA = 0.02 A; 20.1 mA = 0.0201 A.'
- en: 'Substitute: Ib = 0.0201 - 0.02.'
- en: 'Calculate: Ib = 1 x 10^-4 A.'
- en: 'Give it in μA: 100 μA.'
- en: So the base current is 100 μA.
- en: The correct option is c.
