stem:
  en: A student is studying an astronomical telescope in normal adjustment. The magnifying
    power, M, is 80 and the focal length of the objective, fo, is 200 cm. Find the
    focal length of the eyepiece.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: M = fo / fe in normal adjustment.'
- level: 2
  en: 'Get the eyepiece focal length on its own before you put numbers in: divide
    each side by M. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 200 cm as 2 m, then write fe = fo / M, where fe is the eyepiece
    focal length, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the eyepiece focal length have, and roughly
    how large is it?
