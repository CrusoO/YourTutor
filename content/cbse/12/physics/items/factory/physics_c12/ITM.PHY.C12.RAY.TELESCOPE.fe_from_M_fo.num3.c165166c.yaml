solution_steps:
- en: 'Write the relation: M = fo / fe in normal adjustment.'
- en: 'Put each quantity in SI units: 200 cm = 2 m.'
- en: 'Get the eyepiece focal length alone: divide each side by M.'
- en: 'Substitute: fe = 2 / 80.'
- en: 'Calculate: fe = 0.025 m.'
- en: 'Give it in cm: 2.5 cm.'
- en: So the eyepiece focal length is 2.5 cm.
- en: The correct option is c.
