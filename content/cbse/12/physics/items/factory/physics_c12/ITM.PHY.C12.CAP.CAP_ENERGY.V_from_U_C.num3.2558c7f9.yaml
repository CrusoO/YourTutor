stem:
  en: A student is studying a charged capacitor. The energy stored, U, is 2.42 x 10^6
    μJ and the capacitance, C, is 100 μF. Find the potential difference.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: U = (1/2) x C x V^2.'
- level: 2
  en: 'Get the potential difference on its own before you put numbers in: multiply
    each side by 2, divide each side by C, then take the square root. Do the same
    operation to each side of the formula. Change every quantity to SI units first,
    and change back at the end if asked.'
- level: 3
  en: 'First step: Write 2.42 x 10^6 μJ as 2.42 J and 100 μF as 1 x 10^-4 F, then
    write V = sqrt(2 x U / C), where V is the potential difference, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference have, and roughly
    how large is it?
