solution_steps:
- en: 'Write the relation: beta = collector current / base current.'
- en: 'Put each quantity in SI units: 2 mA = 0.002 A; 100 μA = 1 x 10^-4 A.'
- en: 'Substitute: beta = 0.002 / (1 x 10^-4).'
- en: 'Calculate: beta = 20.'
- en: So the current gain is 20.
- en: The correct option is b.
