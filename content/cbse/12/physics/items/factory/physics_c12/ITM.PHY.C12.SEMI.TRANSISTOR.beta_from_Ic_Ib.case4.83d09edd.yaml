stem:
  en: 'Case: a student investigates a transistor in the common emitter connection
    and records the following. The collector current, Ic, is 2 mA and the base current,
    Ib, is 100 μA. Find the current gain.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: beta = collector current / base current.'
- level: 2
  en: The relation already gives the current gain directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 2 mA as 0.002 A and 100 μA as 1 x 10^-4 A, then write beta
    = Ic / Ib, where beta is the current gain, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the current gain be?
