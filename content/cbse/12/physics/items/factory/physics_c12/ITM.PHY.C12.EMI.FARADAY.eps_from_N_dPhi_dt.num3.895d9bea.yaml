solution_steps:
- en: 'Write the relation: emf = N x flux change / time.'
- en: 'Put each quantity in SI units: 0.4 mWb = 4 x 10^-4 Wb; 20 ms = 0.02 s.'
- en: 'Substitute: eps = 100 x (4 x 10^-4) / 0.02.'
- en: 'Calculate: eps = 2 V.'
- en: So the induced emf is 2 V.
- en: The correct option is a.
