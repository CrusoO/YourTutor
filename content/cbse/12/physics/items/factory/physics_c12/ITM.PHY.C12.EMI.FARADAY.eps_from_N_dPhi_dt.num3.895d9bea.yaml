stem:
  en: A student is studying a coil in a changing magnetic field. The number of turns,
    N, is 100, the flux through the coil changes by 0.4 mWb and the change takes 20
    ms. Find the magnitude of the induced emf.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: emf = N x flux change / time.'
- level: 2
  en: The relation already gives the induced emf directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 0.4 mWb as 4 x 10^-4 Wb and 20 ms as 0.02 s, then write eps
    = N x dPhi / dt, where eps is the induced emf, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the induced emf have, and roughly how
    large is it?
