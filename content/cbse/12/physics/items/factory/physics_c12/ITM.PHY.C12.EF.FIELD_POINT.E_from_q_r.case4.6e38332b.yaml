solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Put each quantity in SI units: 10 μC = 1 x 10^-5 C; 20 cm = 0.2 m.'
- en: 'Substitute: E = (9 x 10^9) x (1 x 10^-5) / 0.2^2.'
- en: 'Calculate: E = 2.25 x 10^6 N/C.'
- en: So the electric field is 2.25 x 10^6 N/C.
