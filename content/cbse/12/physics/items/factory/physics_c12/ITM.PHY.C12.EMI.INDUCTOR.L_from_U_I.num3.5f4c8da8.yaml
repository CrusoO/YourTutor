solution_steps:
- en: 'Write the relation: U = (1/2) x L x I^2.'
- en: 'Put each quantity in SI units: 100 mJ = 0.1 J.'
- en: 'Substitute: L = 2 x 0.1 / 2^2.'
- en: 'Calculate: L = 0.05 H.'
- en: 'Give it in mH: 50 mH.'
- en: So the inductance is 50 mH.
- en: The correct option is c.
