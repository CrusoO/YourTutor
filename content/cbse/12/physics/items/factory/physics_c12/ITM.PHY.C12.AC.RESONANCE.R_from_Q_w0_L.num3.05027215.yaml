solution_steps:
- en: 'Write the relation: Q = w0 x L / R.'
- en: 'Put each quantity in SI units: 40 mH = 0.04 H.'
- en: 'Substitute: R = 1000 x 0.04 / 2.'
- en: 'Calculate: R = 20 Ω.'
- en: So the resistance is 20 Ω.
- en: The correct option is d.
