solution_steps:
- en: 'Write the relation: XL = w x L.'
- en: 'Put each quantity in SI units: 200 mH = 0.2 H.'
- en: 'Substitute: XL = 100 x 0.2.'
- en: 'Calculate: XL = 20 Ω.'
- en: So the inductive reactance is 20 Ω.
