stem:
  en: This question is about an inductor or a capacitor in an alternating circuit.
    The angular frequency of the supply, w, is 100 rad/s and the inductance, L, is
    200 mH. Find the inductive reactance.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: XL = w x L.'
- level: 2
  en: The relation already gives the inductive reactance directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 200 mH as 0.2 H, then write XL = w x L, where XL is the inductive
    reactance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the inductive reactance have, and roughly
    how large is it?
