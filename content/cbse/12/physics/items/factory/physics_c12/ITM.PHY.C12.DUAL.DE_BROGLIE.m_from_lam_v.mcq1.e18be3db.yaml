solution_steps:
- en: 'Write the relation: wavelength = h / [m x v], so m = h / [wavelength x v].'
- en: 'Put each quantity in SI units: 0.2 nm = 2 x 10^-10 m.'
- en: 'Substitute: m = (6.63 x 10^-34) / ((2 x 10^-10) x 5000).'
- en: 'Calculate: m = 6.63 x 10^-28 kg.'
- en: So the mass is 6.63 x 10^-28 kg.
- en: The correct option is c.
