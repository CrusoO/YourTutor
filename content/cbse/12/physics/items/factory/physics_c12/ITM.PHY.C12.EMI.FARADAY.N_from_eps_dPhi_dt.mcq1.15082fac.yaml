solution_steps:
- en: 'Write the relation: emf = N x flux change / time.'
- en: 'Put each quantity in SI units: 1 mWb = 0.001 Wb; 100 ms = 0.1 s.'
- en: 'Get the number of turns alone: multiply each side by the time and divide each
    side by the flux change.'
- en: 'Substitute: N = 0.1 x 0.1 / 0.001.'
- en: 'Calculate: N = 10.'
- en: So the number of turns is 10.
- en: The correct option is c.
