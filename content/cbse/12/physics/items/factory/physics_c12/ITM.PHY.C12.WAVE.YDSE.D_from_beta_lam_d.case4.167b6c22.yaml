solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 1.8 mm = 0.0018 m; 600 nm = 6 x 10^-7 m; 0.4
    mm = 4 x 10^-4 m.'
- en: 'Substitute: D = 0.0018 x (4 x 10^-4) / (6 x 10^-7).'
- en: 'Calculate: D = 1.2 m.'
- en: So the screen distance is 1.2 m.
- en: The correct option is c.
