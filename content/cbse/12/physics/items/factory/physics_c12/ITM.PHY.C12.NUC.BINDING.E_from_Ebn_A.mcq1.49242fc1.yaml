solution_steps:
- en: 'Write the relation: binding energy per nucleon = binding energy / A.'
- en: 'Put each quantity in SI units: 186.3 MeV = 2.9808 x 10^-11 J.'
- en: 'Substitute: E = (2.9808 x 10^-11) x 2.'
- en: 'Calculate: E = 5.9616 x 10^-11 J.'
- en: 'Give it in MeV: 372.6 MeV.'
- en: So the binding energy is 372.6 MeV.
