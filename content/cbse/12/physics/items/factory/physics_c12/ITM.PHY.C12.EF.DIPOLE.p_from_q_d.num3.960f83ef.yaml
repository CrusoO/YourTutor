solution_steps:
- en: 'Write the relation: p = q x d, charge times separation.'
- en: 'Put each quantity in SI units: 1 nC = 1 x 10^-9 C; 10 cm = 0.1 m.'
- en: 'Substitute: p = (1 x 10^-9) x 0.1.'
- en: 'Calculate: p = 1 x 10^-10 C m.'
- en: So the dipole moment is 1 x 10^-10 C m.
- en: The correct option is a.
