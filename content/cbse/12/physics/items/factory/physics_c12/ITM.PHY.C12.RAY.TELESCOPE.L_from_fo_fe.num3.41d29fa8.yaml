solution_steps:
- en: 'Write the relation: tube length = fo + fe in normal adjustment.'
- en: 'Put each quantity in SI units: 200 cm = 2 m; 20 cm = 0.2 m.'
- en: 'Substitute: L = 2 + 0.2.'
- en: 'Calculate: L = 2.2 m.'
- en: 'Give it in cm: 220 cm.'
- en: So the tube length is 220 cm.
- en: The correct option is b.
