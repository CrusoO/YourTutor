stem:
  en: 'Case: a student investigates a series LCR circuit on an alternating supply
    and records the following. The resistance, R, is 40 Ω, the inductive reactance,
    XL, is 50 Ω and the capacitive reactance, XC, is 20 Ω. Find tan of the phase angle.'
