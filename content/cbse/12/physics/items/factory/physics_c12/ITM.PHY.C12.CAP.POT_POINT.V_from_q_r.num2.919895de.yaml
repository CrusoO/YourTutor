solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 10 μC = 1 x 10^-5 C; 10 cm = 0.1 m.'
- en: 'Substitute: V = (9 x 10^9) x (1 x 10^-5) / 0.1.'
- en: 'Calculate: V = 900000 V.'
- en: So the potential is 900000 V.
- en: The correct option is b.
