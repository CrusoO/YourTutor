solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 4 μC = 4 x 10^-6 C.'
- en: 'Get the distance alone: multiply each side by r and divide each side by V.'
- en: 'Substitute: r = (9 x 10^9) x (4 x 10^-6) / 120000.'
- en: 'Calculate: r = 0.3 m.'
- en: 'Give it in cm: 30 cm.'
- en: So the distance is 30 cm.
- en: The correct option is c.
