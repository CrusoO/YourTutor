stem:
  en: This question is about the electric potential of a point charge. The potential,
    V, is 120000 V and the charge, q, is 4 μC. Find the distance from the charge.
    Take k = 9 x 10^9 N m²/C².
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: V = k x q / r.'
- level: 2
  en: 'Get the distance on its own before you put numbers in: multiply each side by
    r and divide each side by V. Do the same operation to each side of the formula.
    Change every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 4 μC as 4 x 10^-6 C, then write r = k x q / V, where r is
    the distance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the distance have, and roughly how large
    is it?
