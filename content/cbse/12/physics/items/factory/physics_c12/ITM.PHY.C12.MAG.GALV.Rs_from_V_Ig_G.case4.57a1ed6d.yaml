solution_steps:
- en: 'Write the relation: V = Ig x (G + Rs), so Rs = V / Ig - G.'
- en: 'Put each quantity in SI units: 1 mA = 0.001 A.'
- en: 'Substitute: Rs = 3 / 0.001 - 100.'
- en: 'Calculate: Rs = 2900 Ω.'
- en: So the series resistance is 2900 Ω.
- en: The correct option is c.
