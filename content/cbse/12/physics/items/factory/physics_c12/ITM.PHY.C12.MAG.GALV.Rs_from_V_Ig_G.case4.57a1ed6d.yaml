stem:
  en: 'Case: a student investigates converting a galvanometer into an ammeter or a
    voltmeter and records the following. The voltmeter must read up to 3 V, its full
    scale deflection needs 1 mA and the galvanometer coil has a resistance of 100
    Ω. Find the series resistance needed.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: V = Ig x (G + Rs), so Rs = V / Ig - G.'
- level: 2
  en: The relation already gives the series resistance directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 1 mA as 0.001 A, then write Rs = V / Ig - G, where Rs is
    the series resistance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the series resistance have, and roughly
    how large is it?
