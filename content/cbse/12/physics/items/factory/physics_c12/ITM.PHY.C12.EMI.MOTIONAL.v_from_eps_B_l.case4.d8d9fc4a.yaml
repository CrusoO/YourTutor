solution_steps:
- en: 'Write the relation: emf = B x l x v.'
- en: 'Put each quantity in SI units: 100 mV = 0.1 V; 500 mT = 0.5 T; 10 cm = 0.1
    m.'
- en: 'Get the speed alone: divide each side by B x l.'
- en: 'Substitute: v = 0.1 / (0.5 x 0.1).'
- en: 'Calculate: v = 2 m/s.'
- en: So the speed is 2 m/s.
- en: The correct option is c.
