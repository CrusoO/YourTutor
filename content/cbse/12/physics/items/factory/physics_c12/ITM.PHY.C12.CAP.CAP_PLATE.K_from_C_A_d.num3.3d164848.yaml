solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 44.25 pF = 4.425 x 10^-11 F; 100 cm² = 0.01
    m²; 4 mm = 0.004 m.'
- en: 'Get the dielectric constant alone: multiply each side by d and divide each
    side by eps0 x A.'
- en: 'Substitute: K = (4.425 x 10^-11) x 0.004 / ((8.85 x 10^-12) x 0.01).'
- en: 'Calculate: K = 2.'
- en: So the dielectric constant is 2.
- en: The correct option is b.
