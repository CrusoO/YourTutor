solution_steps:
- en: 'Write the relation: B = mu0 x N x I / (2 x r) at the centre of a circular coil.'
- en: 'Put each quantity in SI units: 10 cm = 0.1 m.'
- en: 'Substitute: Bl = (1.256 x 10^-6) x 10 x 5 / (2 x 0.1).'
- en: 'Calculate: Bl = 3.14 x 10^-4 T.'
- en: 'Give it in μT: 314 μT.'
- en: So the field at the centre is 314 μT.
- en: The correct option is b.
