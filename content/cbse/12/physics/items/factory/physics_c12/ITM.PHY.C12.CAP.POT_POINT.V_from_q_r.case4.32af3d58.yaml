solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 1 μC = 1 x 10^-6 C.'
- en: 'Substitute: V = (9 x 10^9) x (1 x 10^-6) / 5.'
- en: 'Calculate: V = 1800 V.'
- en: So the potential is 1800 V.
