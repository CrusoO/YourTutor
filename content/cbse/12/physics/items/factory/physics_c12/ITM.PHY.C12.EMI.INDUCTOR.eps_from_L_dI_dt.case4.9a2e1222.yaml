stem:
  en: 'Case: a student investigates an inductor in a circuit and records the following.
    The inductance, L, is 10 mH, the current changes by 2 A and the change takes 5
    ms. Find the magnitude of the induced emf.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: emf = L x current change / time.'
- level: 2
  en: The relation already gives the induced emf directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 10 mH as 0.01 H and 5 ms as 0.005 s, then write eps = L x
    dI / dt, where eps is the induced emf, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the induced emf have, and roughly how
    large is it?
