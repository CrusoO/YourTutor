solution_steps:
- en: 'Write the relation: emf = L x current change / time.'
- en: 'Put each quantity in SI units: 10 mH = 0.01 H; 5 ms = 0.005 s.'
- en: 'Substitute: eps = 0.01 x 2 / 0.005.'
- en: 'Calculate: eps = 4 V.'
- en: So the induced emf is 4 V.
- en: The correct option is c.
