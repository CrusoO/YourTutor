solution_steps:
- en: 'Write the relation: E = I x (R + r).'
- en: 'Get the current alone: divide each side of E = I x (R + r) by (R + r).'
- en: 'Substitute: I = 12 / (9 + 1).'
- en: 'Calculate: I = 1.2 A.'
- en: So the current is 1.2 A.
- en: The correct option is b.
