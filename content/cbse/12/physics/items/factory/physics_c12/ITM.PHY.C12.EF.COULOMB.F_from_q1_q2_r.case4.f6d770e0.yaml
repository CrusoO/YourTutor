solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 3 μC = 3 x 10^-6 C; 4 μC = 4 x 10^-6 C; 30 cm
    = 0.3 m.'
- en: 'Substitute: F = (9 x 10^9) x (3 x 10^-6) x (4 x 10^-6) / 0.3^2.'
- en: 'Calculate: F = 1.2 N.'
- en: So the force is 1.2 N.
