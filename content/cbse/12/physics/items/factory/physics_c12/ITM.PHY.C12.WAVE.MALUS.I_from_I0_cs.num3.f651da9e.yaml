solution_steps:
- en: 'Write the relation: I = I0 x cosine squared of the angle for polarised light.'
- en: 'Substitute: I = 50 x 0.8^2.'
- en: 'Calculate: I = 32 W/m^2.'
- en: So the transmitted intensity is 32 W/m^2.
- en: The correct option is d.
