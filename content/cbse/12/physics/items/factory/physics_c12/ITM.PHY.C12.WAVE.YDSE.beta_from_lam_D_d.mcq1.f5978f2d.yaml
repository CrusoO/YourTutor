stem:
  en: The wavelength of the light, lam, is 700 nm, the screen, D, is 0.5 m from the
    slits and the slits are 1 mm apart. Find the fringe width.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: fringe width = wavelength x D / d.'
- level: 2
  en: The relation already gives the fringe width directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 700 nm as 7 x 10^-7 m and 1 mm as 0.001 m, then write beta
    = lam x D / d, where beta is the fringe width, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the fringe width have, and roughly how
    large is it?
