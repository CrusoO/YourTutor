solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Get the charge alone: multiply each side by r^2 and divide each side by k.'
- en: 'Substitute: q = 2250 x 2^2 / (9 x 10^9).'
- en: 'Calculate: q = 1 x 10^-6 C.'
- en: 'Give it in μC: 1 μC.'
- en: So the charge is 1 μC.
- en: The correct option is c.
