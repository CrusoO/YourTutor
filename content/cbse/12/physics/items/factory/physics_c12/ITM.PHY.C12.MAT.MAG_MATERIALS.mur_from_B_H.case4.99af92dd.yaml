solution_steps:
- en: 'Write the relation: B = mu0 x relative permeability x H.'
- en: 'Put each quantity in SI units: 25.12 mT = 0.02512 T.'
- en: 'Substitute: mur = 0.02512 / ((1.256 x 10^-6) x 100).'
- en: 'Calculate: mur = 200.'
- en: So the relative permeability is 200.
- en: The correct option is b.
