solution_steps:
- en: 'Write the relation: tube length = fo + fe in normal adjustment.'
- en: 'Put each quantity in SI units: 52.5 cm = 0.525 m; 50 cm = 0.5 m.'
- en: 'Get the eyepiece focal length alone: subtract fo from each side.'
- en: 'Substitute: fe = 0.525 - 0.5.'
- en: 'Calculate: fe = 0.025 m.'
- en: 'Give it in cm: 2.5 cm.'
- en: So the eyepiece focal length is 2.5 cm.
- en: The correct option is a.
