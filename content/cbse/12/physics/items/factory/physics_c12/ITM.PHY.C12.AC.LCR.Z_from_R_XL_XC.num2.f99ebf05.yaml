- en: 'Write the relation: Z = square root of (R^2 + (XL - XC)^2).'
- en: 'Substitute: Z = sqrt(7^2 + (34 - 10)^2).'
- en: 'Calculate: Z = 25 Ω.'
- en: So the impedance is 25 Ω.
