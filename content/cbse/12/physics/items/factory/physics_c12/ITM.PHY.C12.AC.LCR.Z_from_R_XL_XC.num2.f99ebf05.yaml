stem:
  en: This question is about a series LCR circuit on an alternating supply. The resistance,
    R, is 7 Ω, the inductive reactance, XL, is 34 Ω and the capacitive reactance,
    XC, is 10 Ω. Find the impedance of the circuit.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: Z = square root of (R^2 + (XL - XC)^2).'
- level: 2
  en: The relation already gives the impedance directly, so decide what to substitute.
- level: 3
  en: 'First step: write Z = sqrt(R^2 + (XL - XC)^2), where Z is the impedance, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the impedance have, and roughly how large
    is it?
