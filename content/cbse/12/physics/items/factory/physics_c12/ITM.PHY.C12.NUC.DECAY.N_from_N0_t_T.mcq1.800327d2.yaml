solution_steps:
- en: 'Write the relation: the number of half-lives is t / T, then N = N0 / 2^(t/T).'
- en: 'Put each quantity in SI units: 15 days = 1.296 x 10^6 s; 5 days = 432000 s.'
- en: 'Substitute: N = 1280 / 2^((1.296 x 10^6) / 432000).'
- en: 'Calculate: N = 160.'
- en: So the remaining number of nuclei is 160.
- en: The correct option is a.
