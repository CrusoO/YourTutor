stem:
  en: A student is studying a rod sliding on rails in a magnetic field. The magnetic
    field, B, is 500 mT, the induced current, I, is 1250 mA and the rod, l, is 50
    cm long. Find the force on the rod.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: F = B x I x l on the current-carrying rod.'
- level: 2
  en: The relation already gives the force directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 500 mT as 0.5 T, 1250 mA as 1.25 A and 50 cm as 0.5 m, then
    write F = B x I x l, where F is the force, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the force have, and roughly how large
    is it?
