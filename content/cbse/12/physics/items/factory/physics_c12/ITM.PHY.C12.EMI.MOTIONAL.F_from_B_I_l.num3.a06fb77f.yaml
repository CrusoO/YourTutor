solution_steps:
- en: 'Write the relation: F = B x I x l on the current-carrying rod.'
- en: 'Put each quantity in SI units: 500 mT = 0.5 T; 1250 mA = 1.25 A; 50 cm = 0.5
    m.'
- en: 'Substitute: F = 0.5 x 1.25 x 0.5.'
- en: 'Calculate: F = 0.3125 N.'
- en: 'Give it in mN: 312.5 mN.'
- en: So the force is 312.5 mN.
