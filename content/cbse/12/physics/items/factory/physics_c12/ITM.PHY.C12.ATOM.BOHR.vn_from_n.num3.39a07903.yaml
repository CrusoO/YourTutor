stem:
  en: A student is studying the hydrogen atom in the Bohr model. The principal quantum
    number, n, is 4. Find the speed of the electron in that orbit. Take the speed
    of the electron in the first Bohr orbit, v1, = 2.2 x 10^6 m/s.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Plan the steps: the
    speed in the n-th orbit is v1 / n.'
- level: 2
  en: Work through the plan one step at a time.
- level: 3
  en: 'First step: write vn = v1 / n, where vn is the orbital speed, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the orbital speed have, and roughly how
    large is it?
