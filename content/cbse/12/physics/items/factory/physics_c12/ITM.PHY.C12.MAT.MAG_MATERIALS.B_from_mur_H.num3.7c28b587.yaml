solution_steps:
- en: 'Write the relation: B = mu0 x relative permeability x H.'
- en: 'Substitute: B = (1.256 x 10^-6) x 200 x 500.'
- en: 'Calculate: B = 0.1256 T.'
- en: 'Give it in mT: 125.6 mT.'
- en: So the magnetic field is 125.6 mT.
