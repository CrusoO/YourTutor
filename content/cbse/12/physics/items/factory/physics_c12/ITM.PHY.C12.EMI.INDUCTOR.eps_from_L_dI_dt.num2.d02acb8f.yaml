solution_steps:
- en: 'Write the relation: emf = L x current change / time.'
- en: 'Put each quantity in SI units: 200 mH = 0.2 H; 50 ms = 0.05 s.'
- en: 'Substitute: eps = 0.2 x 5 / 0.05.'
- en: 'Calculate: eps = 20 V.'
- en: So the induced emf is 20 V.
