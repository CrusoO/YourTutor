solution_steps:
- en: 'Write the relation: I = I0 x cosine squared of the angle for polarised light.'
- en: 'Substitute: I = 200 x 0.6^2.'
- en: 'Calculate: I = 72 W/m^2.'
- en: So the transmitted intensity is 72 W/m^2.
- en: The correct option is b.
