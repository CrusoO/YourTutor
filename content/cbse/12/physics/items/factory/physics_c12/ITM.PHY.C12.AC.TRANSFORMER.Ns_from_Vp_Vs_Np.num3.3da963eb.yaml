stem:
  en: A student is studying an ideal transformer. The primary voltage, Vp, is 110
    V, the secondary voltage, Vs, is 220 V and the number of primary turns, Np, is
    1000. Find the number of secondary turns.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: Vs / Vp = Ns / Np.'
- level: 2
  en: The relation already gives the secondary turns directly, so decide what to substitute.
- level: 3
  en: 'First step: write Ns = Np x Vs / Vp, where Ns is the secondary turns, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the secondary turns be?
