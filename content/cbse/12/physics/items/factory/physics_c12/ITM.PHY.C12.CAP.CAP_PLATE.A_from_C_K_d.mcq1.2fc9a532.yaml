difficulty: 0.35
pool: practice
role: procedure
stem:
  en: The capacitance, C, is 88.5 pF, the dielectric constant of the material between
    the plates, K, is 2 and the gap between the plates, d, is 2 mm. Find the area
    of each plate. Take the permittivity of free space, eps0, = 8.85 x 10^-12 C²/(N
    m²).
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: C = K x eps0 x A / d.'
- level: 2
  en: 'Get the plate area on its own before you put numbers in: multiply each side
    by d and divide each side by K x eps0. Do the same operation to each side of the
    formula. Change every quantity to SI units first, and change back at the end if
    asked.'
- level: 3
  en: 'First step: Write 88.5 pF as 8.85 x 10^-11 F and 2 mm as 0.002 m, then write
    A = C x d / (K x eps0), where A is the plate area, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the plate area have, and roughly how
    large is it?
