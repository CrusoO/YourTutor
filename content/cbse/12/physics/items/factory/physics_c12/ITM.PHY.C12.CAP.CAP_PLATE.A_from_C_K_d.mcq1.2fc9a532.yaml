solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 88.5 pF = 8.85 x 10^-11 F; 2 mm = 0.002 m.'
- en: 'Get the plate area alone: multiply each side by d and divide each side by K
    x eps0.'
- en: 'Substitute: A = (8.85 x 10^-11) x 0.002 / (2 x (8.85 x 10^-12)).'
- en: 'Calculate: A = 0.01 m².'
- en: 'Give it in cm²: 100 cm².'
- en: So the plate area is 100 cm².
- en: The correct option is c.
