solution_steps:
- en: 'Write the relation: collector current = beta x base current.'
- en: 'Put each quantity in SI units: 10 μA = 1 x 10^-5 A.'
- en: 'Substitute: Ic = 200 x (1 x 10^-5).'
- en: 'Calculate: Ic = 0.002 A.'
- en: 'Give it in mA: 2 mA.'
- en: So the collector current is 2 mA.
- en: The correct option is d.
