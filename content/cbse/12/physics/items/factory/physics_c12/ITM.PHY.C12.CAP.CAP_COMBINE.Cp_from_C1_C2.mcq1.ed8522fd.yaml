solution_steps:
- en: 'Write the relation: parallel: C = C1 + C2.'
- en: 'Put each quantity in SI units: 15 μF = 1.5 x 10^-5 F; 10 μF = 1 x 10^-5 F.'
- en: 'Substitute: Cp = (1.5 x 10^-5) + (1 x 10^-5).'
- en: 'Calculate: Cp = 2.5 x 10^-5 F.'
- en: 'Give it in μF: 25 μF.'
- en: So the parallel capacitance is 25 μF.
- en: The correct option is b.
