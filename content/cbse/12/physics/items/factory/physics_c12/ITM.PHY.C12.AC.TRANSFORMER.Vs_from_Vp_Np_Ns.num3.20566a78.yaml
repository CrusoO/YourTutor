solution_steps:
- en: 'Write the relation: Vs / Vp = Ns / Np.'
- en: 'Substitute: Vs = 220 x 10 / 200.'
- en: 'Calculate: Vs = 11 V.'
- en: So the secondary voltage is 11 V.
