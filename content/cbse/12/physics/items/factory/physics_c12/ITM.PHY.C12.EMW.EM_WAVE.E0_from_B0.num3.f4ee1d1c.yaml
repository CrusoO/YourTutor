stem:
  en: A student is studying a plane electromagnetic wave in vacuum. The amplitude
    of the magnetic field, B0, is 1000 nT. Find the amplitude of the electric field.
    Take the speed of light in vacuum, c, = 3 x 10^8 m/s.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: E0 / B0 = c.'
- level: 2
  en: The relation already gives the electric amplitude directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 1000 nT as 1 x 10^-6 T, then write E0 = c x B0, where E0
    is the electric amplitude, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the electric amplitude have, and roughly
    how large is it?
