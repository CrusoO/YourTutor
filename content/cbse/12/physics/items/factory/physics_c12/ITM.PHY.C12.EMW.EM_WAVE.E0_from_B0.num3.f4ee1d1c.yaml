solution_steps:
- en: 'Write the relation: E0 / B0 = c.'
- en: 'Put each quantity in SI units: 1000 nT = 1 x 10^-6 T.'
- en: 'Substitute: E0 = (3 x 10^8) x (1 x 10^-6).'
- en: 'Calculate: E0 = 300 V/m.'
- en: So the electric amplitude is 300 V/m.
- en: The correct option is b.
