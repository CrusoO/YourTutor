stem:
  en: The resistance, R, is 9 Ω, the inductive reactance, XL, is 16 Ω and the capacitive
    reactance, XC, is 4 Ω. Find the impedance of the circuit.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: Z = square root of (R^2 + (XL - XC)^2).'
- level: 2
  en: The relation already gives the impedance directly, so decide what to substitute.
- level: 3
  en: 'First step: write Z = sqrt(R^2 + (XL - XC)^2), where Z is the impedance, with
    the values in place, one quantity at a time.'
