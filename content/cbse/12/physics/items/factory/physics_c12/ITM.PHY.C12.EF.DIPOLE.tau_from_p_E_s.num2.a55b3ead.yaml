solution_steps:
- en: 'Write the relation: torque = p x E x sine of the angle.'
- en: 'Substitute: tau = (5 x 10^-8) x 5000 x 0.6.'
- en: 'Calculate: tau = 1.5 x 10^-4 N m.'
- en: So the torque is 1.5 x 10^-4 N m.
- en: The correct option is d.
