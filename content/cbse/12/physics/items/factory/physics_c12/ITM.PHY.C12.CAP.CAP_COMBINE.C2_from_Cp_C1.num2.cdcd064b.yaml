solution_steps:
- en: 'Write the relation: parallel: Cp = C1 + C2.'
- en: 'Put each quantity in SI units: 9 μF = 9 x 10^-6 F; 6 μF = 6 x 10^-6 F.'
- en: 'Get the second capacitance alone: subtract C1 from each side.'
- en: 'Substitute: C2 = (9 x 10^-6) - (6 x 10^-6).'
- en: 'Calculate: C2 = 3 x 10^-6 F.'
- en: 'Give it in μF: 3 μF.'
- en: So the second capacitance is 3 μF.
- en: The correct option is b.
