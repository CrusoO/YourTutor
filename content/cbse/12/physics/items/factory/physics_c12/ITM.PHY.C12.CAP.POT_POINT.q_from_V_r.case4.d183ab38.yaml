solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Get the charge alone: multiply each side by r and divide each side by k.'
- en: 'Substitute: q = 4500 x 2 / (9 x 10^9).'
- en: 'Calculate: q = 1 x 10^-6 C.'
- en: 'Give it in μC: 1 μC.'
- en: So the charge is 1 μC.
- en: The correct option is b.
