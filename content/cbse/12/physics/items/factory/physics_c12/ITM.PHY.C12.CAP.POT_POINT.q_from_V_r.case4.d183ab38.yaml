stem:
  en: 'Case: a student investigates the electric potential of a point charge and records
    the following. The potential, V, is 4500 V and the distance from the charge, r,
    is 2 m. Find the charge. Take k = 9 x 10^9 N m²/C².'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: V = k x q / r.'
- level: 2
  en: 'Get the charge on its own before you put numbers in: multiply each side by
    r and divide each side by k. Do the same operation to each side of the formula.
    Change every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: write q = V x r / k, where q is the charge, with the values in
    place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the charge have, and roughly how large
    is it?
