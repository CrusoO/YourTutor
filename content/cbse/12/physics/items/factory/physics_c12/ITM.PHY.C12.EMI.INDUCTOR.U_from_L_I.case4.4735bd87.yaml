solution_steps:
- en: 'Write the relation: U = (1/2) x L x I^2.'
- en: 'Put each quantity in SI units: 10 mH = 0.01 H.'
- en: 'Substitute: U = 0.01 x 1^2 / 2.'
- en: 'Calculate: U = 0.005 J.'
- en: 'Give it in mJ: 5 mJ.'
- en: So the stored energy is 5 mJ.
