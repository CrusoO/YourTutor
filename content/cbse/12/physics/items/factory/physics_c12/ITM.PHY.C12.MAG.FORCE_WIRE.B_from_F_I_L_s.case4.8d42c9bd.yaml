stem:
  en: 'Case: a student investigates a current-carrying conductor in a magnetic field
    and records the following. The force on the wire, F, is 250 mN, the current, I,
    is 5 A, the length of wire in the field, L, is 50 cm and the sine of the angle
    between the wire and the field, s, is 1. Find the strength of the field.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: F = B x I x L x sine of the angle.'
- level: 2
  en: 'Get the field on its own before you put numbers in: divide each side by I x
    L x sine of the angle. Do the same operation to each side of the formula. Change
    every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 250 mN as 0.25 N and 50 cm as 0.5 m, then write B = F / [I
    x L x s], where B is the field, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the field have, and roughly how large
    is it?
