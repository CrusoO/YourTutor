stem:
  en: A student is studying an astronomical telescope in normal adjustment. The focal
    length of the objective, fo, is 100 cm and the focal length of the eyepiece, fe,
    is 4 cm. Find the distance between the two lenses.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: tube length = fo + fe in normal adjustment.'
- level: 2
  en: The relation already gives the tube length directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 100 cm as 1 m and 4 cm as 0.04 m, then write L = fo + fe,
    where L is the tube length, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the tube length have, and roughly how
    large is it?
