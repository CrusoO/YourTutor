solution_steps:
- en: 'Write the relation: tube length = fo + fe in normal adjustment.'
- en: 'Put each quantity in SI units: 100 cm = 1 m; 4 cm = 0.04 m.'
- en: 'Substitute: L = 1 + 0.04.'
- en: 'Calculate: L = 1.04 m.'
- en: 'Give it in cm: 104 cm.'
- en: So the tube length is 104 cm.
- en: The correct option is d.
