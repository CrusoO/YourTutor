solution_steps:
- en: 'Write the relation: the shunt takes the extra current: Ig x G = (I - Ig) x
    S.'
- en: 'Put each quantity in SI units: 1 mA = 0.001 A; 11 mA = 0.011 A.'
- en: 'Get the shunt alone: divide each side of Ig x G = (I - Ig) x S by (I - Ig).'
- en: 'Substitute: S = 25 x 0.001 / (0.011 - 0.001).'
- en: 'Calculate: S = 2.5 Ω.'
- en: So the shunt is 2.5 Ω.
- en: The correct option is c.
