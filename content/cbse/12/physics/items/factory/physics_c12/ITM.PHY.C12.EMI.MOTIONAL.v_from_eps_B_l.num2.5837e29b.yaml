stem:
  en: This question is about a rod sliding on rails in a magnetic field. The induced
    emf, eps, is 50 mV, the magnetic field, B, is 100 mT and the rod, l, is 50 cm
    long. Find the speed of the rod.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: emf = B x l x v.'
- level: 2
  en: 'Get the speed on its own before you put numbers in: divide each side by B x
    l. Do the same operation to each side of the formula. Change every quantity to
    SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 50 mV as 0.05 V, 100 mT as 0.1 T and 50 cm as 0.5 m, then
    write v = eps / [B x l], where v is the speed, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the speed have, and roughly how large
    is it?
