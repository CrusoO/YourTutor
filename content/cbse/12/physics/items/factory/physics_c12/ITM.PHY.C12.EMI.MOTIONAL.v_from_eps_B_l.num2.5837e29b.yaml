solution_steps:
- en: 'Write the relation: emf = B x l x v.'
- en: 'Put each quantity in SI units: 50 mV = 0.05 V; 100 mT = 0.1 T; 50 cm = 0.5
    m.'
- en: 'Get the speed alone: divide each side by B x l.'
- en: 'Substitute: v = 0.05 / (0.1 x 0.5).'
- en: 'Calculate: v = 1 m/s.'
- en: So the speed is 1 m/s.
- en: The correct option is a.
