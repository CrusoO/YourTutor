stem:
  en: A student is studying the binding energy of a nucleus. The binding energy, E,
    is 93.15 MeV and the binding energy per nucleon, Ebn, is 18.63 MeV. Find the mass
    number.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: binding energy per nucleon = binding energy / A.'
- level: 2
  en: The relation already gives the mass number directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 93.15 MeV as 1.4904 x 10^-11 J and 18.63 MeV as 2.9808 x
    10^-12 J, then write A = E / Ebn, where A is the mass number, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the mass number be?
