solution_steps:
- en: 'Write the relation: R / S = l1 / l2.'
- en: 'Put each quantity in SI units: 40 cm = 0.4 m; 60 cm = 0.6 m.'
- en: 'Substitute: R = 15 x 0.4 / 0.6.'
- en: 'Calculate: R = 10 Ω.'
- en: So the known resistance is 10 Ω.
- en: The correct option is d.
