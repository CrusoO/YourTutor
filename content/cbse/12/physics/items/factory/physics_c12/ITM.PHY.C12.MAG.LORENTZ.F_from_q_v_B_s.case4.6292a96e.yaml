stem:
  en: 'Case: a student investigates a charged particle moving in a magnetic field
    and records the following. The charge of the particle, q, is 1.6 x 10^-19 C, its
    speed, v, is 1 x 10^6 m/s, the magnetic field, B, is 100 mT and the sine of the
    angle between the velocity and the field, s, is 0.5. Find the magnitude of the
    magnetic force.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: F = q x v x B x sine of the angle.'
- level: 2
  en: The relation already gives the force directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 100 mT as 0.1 T, then write F = q x v x B x s, where F is
    the force, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the force have, and roughly how large
    is it?
