  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: relative permeability = 1 + susceptibility.'
- level: 2
  en: The relation already gives the relative permeability directly, so decide what
    to substitute.
- level: 3
  en: 'First step: write mur = 1 + chi, where mur is the relative permeability, with
    the values in place, one quantity at a time.'
