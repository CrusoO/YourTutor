solution_steps:
- en: 'Write the relation: c = f x wavelength.'
- en: 'Put each quantity in SI units: 10 MHz = 1 x 10^7 Hz.'
- en: 'Get the wavelength alone: divide each side by the frequency.'
- en: 'Substitute: lam = (3 x 10^8) / (1 x 10^7).'
- en: 'Calculate: lam = 30 m.'
- en: So the wavelength is 30 m.
- en: The correct option is c.
