stem:
  en: The primary current, I1, is 0.5 A, the number of primary turns, Np, is 1000
    and the number of secondary turns, Ns, is 2000. Find the secondary current.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: an ideal transformer has Vp x I1 = Vs x I2, so I2 = I1 x Np / Ns.'
- level: 2
  en: The relation already gives the secondary current directly, so decide what to
    substitute.
- level: 3
  en: 'First step: write I2 = I1 x Np / Ns, where I2 is the secondary current, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the secondary current have, and roughly
    how large is it?
