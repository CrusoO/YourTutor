solution_steps:
- en: 'Write the relation: R / S = l1 / l2.'
- en: 'Put each quantity in SI units: 20 cm = 0.2 m; 80 cm = 0.8 m.'
- en: 'Substitute: R = 60 x 0.2 / 0.8.'
- en: 'Calculate: R = 15 Ω.'
- en: So the known resistance is 15 Ω.
- en: The correct option is c.
