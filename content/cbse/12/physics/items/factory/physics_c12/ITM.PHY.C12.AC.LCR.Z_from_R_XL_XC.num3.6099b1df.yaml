solution_steps:
- en: 'Write the relation: Z = square root of (R^2 + (XL - XC)^2).'
- en: 'Substitute: Z = sqrt(12^2 + (25 - 20)^2).'
- en: 'Calculate: Z = 13 Ω.'
- en: So the impedance is 13 Ω.
