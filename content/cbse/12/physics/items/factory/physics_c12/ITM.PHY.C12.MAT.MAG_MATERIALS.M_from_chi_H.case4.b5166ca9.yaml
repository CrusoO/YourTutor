stem:
  en: 'Case: a student investigates a magnetic material in an external field and records
    the following. The magnetic susceptibility, chi, is 1999 and the magnetising field,
    H, is 1000 A/m. Find the magnetisation of the material.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: magnetisation = susceptibility x H.'
- level: 2
  en: The relation already gives the magnetisation directly, so decide what to substitute.
- level: 3
  en: 'First step: write M = chi x H, where M is the magnetisation, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the magnetisation have, and roughly how
    large is it?
