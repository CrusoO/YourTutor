solution_steps:
- en: 'Write the relation: series: 1/Cs = 1/C1 + 1/C2.'
- en: 'Put each quantity in SI units: 3 μF = 3 x 10^-6 F; 12 μF = 1.2 x 10^-5 F.'
- en: 'Get the second capacitance alone: write 1/C2 = 1/Cs - 1/C1 and combine the
    fractions.'
- en: 'Substitute: C2 = (3 x 10^-6) x (1.2 x 10^-5) / ((1.2 x 10^-5) - (3 x 10^-6)).'
- en: 'Calculate: C2 = 4 x 10^-6 F.'
- en: 'Give it in μF: 4 μF.'
- en: So the second capacitance is 4 μF.
- en: The correct option is d.
