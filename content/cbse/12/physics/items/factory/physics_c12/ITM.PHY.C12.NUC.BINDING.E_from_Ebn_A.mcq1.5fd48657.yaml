solution_steps:
- en: 'Write the relation: binding energy per nucleon = binding energy / A.'
- en: 'Put each quantity in SI units: 37.26 MeV = 5.9616 x 10^-12 J.'
- en: 'Substitute: E = (5.9616 x 10^-12) x 5.'
- en: 'Calculate: E = 2.9808 x 10^-11 J.'
- en: 'Give it in MeV: 186.3 MeV.'
- en: So the binding energy is 186.3 MeV.
