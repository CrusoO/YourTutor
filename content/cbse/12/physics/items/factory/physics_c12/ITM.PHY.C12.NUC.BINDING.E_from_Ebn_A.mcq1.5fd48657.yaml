stem:
  en: The binding energy per nucleon, Ebn, is 37.26 MeV and the mass number, A, is
    5. Find the total binding energy.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: binding energy per nucleon = binding energy / A.'
- level: 2
  en: The relation already gives the binding energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 37.26 MeV as 5.9616 x 10^-12 J, then write E = Ebn x A, where
    E is the binding energy, with the values in place, one quantity at a time.'
