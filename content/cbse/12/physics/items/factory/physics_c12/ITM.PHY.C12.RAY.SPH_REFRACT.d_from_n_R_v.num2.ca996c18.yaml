solution_steps:
- en: 'Write the relation: n/v - 1/d = (n - 1)/R, so 1/d = n/v - (n - 1)/R.'
- en: 'Put each quantity in SI units: 10 cm = 0.1 m; 12 cm = 0.12 m.'
- en: 'Substitute: d = 1 / (2 / 0.12 - (2 - 1) / 0.1).'
- en: 'Calculate: d = 0.15 m.'
- en: 'Give it in cm: 15 cm.'
- en: So the object distance is 15 cm.
- en: The correct option is b.
