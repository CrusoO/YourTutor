solution_steps:
- en: 'Write the relation: emf = B x l x v, then I = emf / R.'
- en: 'Put each quantity in SI units: 200 mT = 0.2 T; 50 cm = 0.5 m.'
- en: 'Substitute: I = 0.2 x 0.5 x 5 / 5.'
- en: 'Calculate: I = 0.1 A.'
- en: 'Give it in mA: 100 mA.'
- en: So the current is 100 mA.
- en: The correct option is b.
