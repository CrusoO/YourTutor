solution_steps:
- en: 'Write the relation: wavelength = h / [m x v], so m = h / [wavelength x v].'
- en: 'Put each quantity in SI units: 0.1 nm = 1 x 10^-10 m.'
- en: 'Substitute: m = (6.63 x 10^-34) / ((1 x 10^-10) x 1000).'
- en: 'Calculate: m = 6.63 x 10^-27 kg.'
- en: So the mass is 6.63 x 10^-27 kg.
- en: The correct option is c.
