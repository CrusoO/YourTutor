stem:
  en: 'Case: a student investigates an ideal transformer and records the following.
    The primary voltage, Vp, is 110 V, the secondary voltage, Vs, is 5.5 V and the
    number of primary turns, Np, is 200. Find the number of secondary turns.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: Vs / Vp = Ns / Np.'
- level: 2
  en: The relation already gives the secondary turns directly, so decide what to substitute.
- level: 3
  en: 'First step: write Ns = Np x Vs / Vp, where Ns is the secondary turns, with
    the values in place, one quantity at a time.'
