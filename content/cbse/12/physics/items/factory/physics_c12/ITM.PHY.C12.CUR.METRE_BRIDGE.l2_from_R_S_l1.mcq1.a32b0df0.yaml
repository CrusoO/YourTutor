solution_steps:
- en: 'Write the relation: R / S = l1 / l2.'
- en: 'Put each quantity in SI units: 25 cm = 0.25 m.'
- en: 'Substitute: l2 = 0.25 x 36 / 12.'
- en: 'Calculate: l2 = 0.75 m.'
- en: 'Give it in cm: 75 cm.'
- en: So the right length is 75 cm.
