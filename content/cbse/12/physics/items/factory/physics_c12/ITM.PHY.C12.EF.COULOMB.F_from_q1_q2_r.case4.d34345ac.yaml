solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 2 nC = 2 x 10^-9 C; 4 nC = 4 x 10^-9 C; 30 cm
    = 0.3 m.'
- en: 'Substitute: F = (9 x 10^9) x (2 x 10^-9) x (4 x 10^-9) / 0.3^2.'
- en: 'Calculate: F = 8 x 10^-7 N.'
- en: So the force is 8 x 10^-7 N.
