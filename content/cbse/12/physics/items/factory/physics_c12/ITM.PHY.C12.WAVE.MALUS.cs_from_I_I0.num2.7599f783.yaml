stem:
  en: This question is about polarised light through an analyser. The transmitted
    intensity, I, is 100 W/m^2 and the intensity of the incident light, I0, is 400
    W/m^2. Find the cosine of the angle.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: I = I0 x cosine squared of the angle for polarised light.'
- level: 2
  en: 'Get the cosine of the angle on its own before you put numbers in: divide each
    side by I0, then take the square root. Do the same operation to each side of the
    formula.'
- level: 3
  en: 'First step: write cs = sqrt(I / I0), where cs is the cosine of the angle, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the cosine of the angle be?
