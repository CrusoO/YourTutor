solution_steps:
- en: 'Write the relation: force per metre = (mu0 / 4 pi) x 2 x I1 x I2 / d for two
    long parallel wires.'
- en: 'Put each quantity in SI units: 20 cm = 0.2 m.'
- en: 'Substitute: f = 2 x (1 x 10^-7) x 1 x 5 / 0.2.'
- en: 'Calculate: f = 5 x 10^-6 N/m.'
- en: 'Give it in mN/m: 0.005 mN/m.'
- en: So the force per unit length is 0.005 mN/m.
