solution_steps:
- en: 'Write the relation: w0 = 1 / square root of [L x C], so C = 1 / (w0^2 x L).'
- en: 'Put each quantity in SI units: 500 mH = 0.5 H.'
- en: 'Get the capacitance alone: square each side of the relation, then rearrange
    for C.'
- en: 'Substitute: C = 1 / (500^2 x 0.5).'
- en: 'Calculate: C = 8 x 10^-6 F.'
- en: 'Give it in μF: 8 μF.'
- en: So the capacitance is 8 μF.
- en: The correct option is d.
