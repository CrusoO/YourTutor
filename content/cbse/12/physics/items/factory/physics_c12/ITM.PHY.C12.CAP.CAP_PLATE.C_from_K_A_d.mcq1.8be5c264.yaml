solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 400 cm² = 0.04 m²; 2 mm = 0.002 m.'
- en: 'Substitute: C = 1 x (8.85 x 10^-12) x 0.04 / 0.002.'
- en: 'Calculate: C = 1.77 x 10^-10 F.'
- en: 'Give it in pF: 177 pF.'
- en: So the capacitance is 177 pF.
- en: The correct option is b.
