solution_steps:
- en: 'Write the relation: the magnetic force gives the centripetal force: q x v x
    B = m x v^2 / r, so r = m x v / [q x B].'
- en: 'Put each quantity in SI units: 500 mT = 0.5 T.'
- en: 'Substitute: r = (1.6 x 10^-27) x 200000 / ((1.6 x 10^-19) x 0.5).'
- en: 'Calculate: r = 0.004 m.'
- en: 'Give it in cm: 0.4 cm.'
- en: So the radius is 0.4 cm.
- en: The correct option is a.
