solution_steps:
- en: 'Write the relation: U = (1/2) x Q x V.'
- en: 'Put each quantity in SI units: 500 μC = 5 x 10^-4 C.'
- en: 'Substitute: U = (5 x 10^-4) x 10 / 2.'
- en: 'Calculate: U = 0.0025 J.'
- en: 'Give it in μJ: 2500 μJ.'
- en: So the stored energy is 2500 μJ.
- en: The correct option is a.
