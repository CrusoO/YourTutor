stem:
  en: This question is about a thin double convex lens in air. The refractive index
    of the glass, n, is 1.4, the focal length, f, is 30 cm and the radius of curvature
    of the second face, R2, is 30 cm. Find the radius of curvature of the first face.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: 1/f = (n - 1) x (1/R1 + 1/R2), so 1/R1 = 1/((n - 1) x f) - 1/R2.'
- level: 2
  en: The relation already gives the first radius directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 30 cm as 0.3 m, then write R1 = 1 / (1 / ((n - 1) x f) -
    1 / R2), where R1 is the first radius, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the first radius have, and roughly how
    large is it?
