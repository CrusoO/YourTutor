solution_steps:
- en: 'Write the relation: XC = 1 / [w x C].'
- en: 'Put each quantity in SI units: 10 μF = 1 x 10^-5 F.'
- en: 'Substitute: XC = 1 / (100 x (1 x 10^-5)).'
- en: 'Calculate: XC = 1000 Ω.'
- en: So the capacitive reactance is 1000 Ω.
- en: The correct option is d.
