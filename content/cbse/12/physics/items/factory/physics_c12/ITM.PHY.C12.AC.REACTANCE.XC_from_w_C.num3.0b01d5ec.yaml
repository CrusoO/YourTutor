difficulty: 0.6
pool: practice
role: apply
stem:
  en: A student is studying an inductor or a capacitor in an alternating circuit.
    The angular frequency of the supply, w, is 100 rad/s and the capacitance, C, is
    10 μF. Find the capacitive reactance.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: XC = 1 / [w x C].'
- level: 2
  en: The relation already gives the capacitive reactance directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 10 μF as 1 x 10^-5 F, then write XC = 1 / [w x C], where
    XC is the capacitive reactance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the capacitive reactance have, and roughly
    how large is it?
