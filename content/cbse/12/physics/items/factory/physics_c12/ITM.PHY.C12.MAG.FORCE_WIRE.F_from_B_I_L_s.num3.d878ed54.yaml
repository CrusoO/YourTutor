solution_steps:
- en: 'Write the relation: F = B x I x L x sine of the angle.'
- en: 'Put each quantity in SI units: 500 mT = 0.5 T; 50 cm = 0.5 m.'
- en: 'Substitute: F = 0.5 x 2 x 0.5 x 0.5.'
- en: 'Calculate: F = 0.25 N.'
- en: 'Give it in mN: 250 mN.'
- en: So the force is 250 mN.
- en: The correct option is b.
