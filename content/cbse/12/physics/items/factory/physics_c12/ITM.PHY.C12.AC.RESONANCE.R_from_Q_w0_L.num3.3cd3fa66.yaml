solution_steps:
- en: 'Write the relation: Q = w0 x L / R.'
- en: 'Put each quantity in SI units: 400 mH = 0.4 H.'
- en: 'Substitute: R = 500 x 0.4 / 40.'
- en: 'Calculate: R = 5 Ω.'
- en: So the resistance is 5 Ω.
- en: The correct option is d.
