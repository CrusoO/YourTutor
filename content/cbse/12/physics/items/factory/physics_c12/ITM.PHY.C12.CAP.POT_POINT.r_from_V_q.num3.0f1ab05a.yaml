solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 2 nC = 2 x 10^-9 C.'
- en: 'Get the distance alone: multiply each side by r and divide each side by V.'
- en: 'Substitute: r = (9 x 10^9) x (2 x 10^-9) / 360.'
- en: 'Calculate: r = 0.05 m.'
- en: 'Give it in cm: 5 cm.'
- en: So the distance is 5 cm.
- en: The correct option is c.
