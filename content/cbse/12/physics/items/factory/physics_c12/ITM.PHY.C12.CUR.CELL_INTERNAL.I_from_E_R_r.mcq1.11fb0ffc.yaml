stem:
  en: The emf of the cell, E, is 12 V, the external resistor, R, is 2 Ω and its internal
    resistance, r, is 0.5 Ω. Find the current in the circuit.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: E = I x (R + r).'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side of E
    = I x (R + r) by (R + r). Do the same operation to each side of the formula.'
- level: 3
  en: 'First step: write I = E / (R + r), where I is the current, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
