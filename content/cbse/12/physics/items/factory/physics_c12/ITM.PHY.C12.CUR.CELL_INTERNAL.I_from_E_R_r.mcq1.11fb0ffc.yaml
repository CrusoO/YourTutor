solution_steps:
- en: 'Write the relation: E = I x (R + r).'
- en: 'Get the current alone: divide each side of E = I x (R + r) by (R + r).'
- en: 'Substitute: I = 12 / (2 + 0.5).'
- en: 'Calculate: I = 4.8 A.'
- en: So the current is 4.8 A.
- en: The correct option is c.
