solution_steps:
- en: 'Write the relation: R / S = l1 / l2.'
- en: 'Put each quantity in SI units: 75 cm = 0.75 m; 25 cm = 0.25 m.'
- en: 'Get the unknown resistance alone: multiply each side of R / S = l1 / l2 by
    S, then rearrange for S.'
- en: 'Substitute: S = 15 x 0.25 / 0.75.'
- en: 'Calculate: S = 5 Ω.'
- en: So the unknown resistance is 5 Ω.
- en: The correct option is c.
