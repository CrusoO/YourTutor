solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 600 nm = 6 x 10^-7 m; 1 mm = 0.001 m.'
- en: 'Substitute: beta = (6 x 10^-7) x 1.2 / 0.001.'
- en: 'Calculate: beta = 7.2 x 10^-4 m.'
- en: 'Give it in mm: 0.72 mm.'
- en: So the fringe width is 0.72 mm.
