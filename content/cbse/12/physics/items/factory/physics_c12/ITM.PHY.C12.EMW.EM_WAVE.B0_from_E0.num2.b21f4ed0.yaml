solution_steps:
- en: 'Write the relation: E0 / B0 = c.'
- en: 'Get the magnetic amplitude alone: divide each side by c.'
- en: 'Substitute: B0 = 60 / (3 x 10^8).'
- en: 'Calculate: B0 = 2 x 10^-7 T.'
- en: 'Give it in nT: 200 nT.'
- en: So the magnetic amplitude is 200 nT.
- en: The correct option is b.
