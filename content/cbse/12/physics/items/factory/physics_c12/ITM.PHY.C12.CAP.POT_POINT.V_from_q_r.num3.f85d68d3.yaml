solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 5 nC = 5 x 10^-9 C; 30 cm = 0.3 m.'
- en: 'Substitute: V = (9 x 10^9) x (5 x 10^-9) / 0.3.'
- en: 'Calculate: V = 150 V.'
- en: So the potential is 150 V.
- en: The correct option is c.
