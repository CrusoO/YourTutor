solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Put each quantity in SI units: 1 μC = 1 x 10^-6 C; 5 cm = 0.05 m.'
- en: 'Substitute: E = (9 x 10^9) x (1 x 10^-6) / 0.05^2.'
- en: 'Calculate: E = 3.6 x 10^6 N/C.'
- en: So the electric field is 3.6 x 10^6 N/C.
- en: The correct option is b.
