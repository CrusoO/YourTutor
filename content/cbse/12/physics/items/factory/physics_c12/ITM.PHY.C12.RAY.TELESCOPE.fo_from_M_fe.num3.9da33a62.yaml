stem:
  en: A student is studying an astronomical telescope in normal adjustment. The magnifying
    power, M, is 2.5 and the focal length of the eyepiece, fe, is 20 cm. Find the
    focal length of the objective.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: M = fo / fe in normal adjustment.'
- level: 2
  en: 'Get the objective focal length on its own before you put numbers in: multiply
    each side by fe. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 20 cm as 0.2 m, then write fo = M x fe, where fo is the objective
    focal length, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the objective focal length have, and
    roughly how large is it?
