solution_steps:
- en: 'Write the relation: M = fo / fe in normal adjustment.'
- en: 'Put each quantity in SI units: 20 cm = 0.2 m.'
- en: 'Get the objective focal length alone: multiply each side by fe.'
- en: 'Substitute: fo = 2.5 x 0.2.'
- en: 'Calculate: fo = 0.5 m.'
- en: 'Give it in cm: 50 cm.'
- en: So the objective focal length is 50 cm.
- en: The correct option is d.
