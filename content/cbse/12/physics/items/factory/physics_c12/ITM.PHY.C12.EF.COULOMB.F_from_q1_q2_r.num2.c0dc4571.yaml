solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 5 μC = 5 x 10^-6 C; 4 μC = 4 x 10^-6 C.'
- en: 'Substitute: F = (9 x 10^9) x (5 x 10^-6) x (4 x 10^-6) / 30^2.'
- en: 'Calculate: F = 2 x 10^-4 N.'
- en: So the force is 2 x 10^-4 N.
- en: The correct option is c.
