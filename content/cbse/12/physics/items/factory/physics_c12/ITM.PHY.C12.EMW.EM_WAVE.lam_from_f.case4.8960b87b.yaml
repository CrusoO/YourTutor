solution_steps:
- en: 'Write the relation: c = f x wavelength.'
- en: 'Put each quantity in SI units: 3 MHz = 3 x 10^6 Hz.'
- en: 'Get the wavelength alone: divide each side by the frequency.'
- en: 'Substitute: lam = (3 x 10^8) / (3 x 10^6).'
- en: 'Calculate: lam = 100 m.'
- en: So the wavelength is 100 m.
- en: The correct option is b.
