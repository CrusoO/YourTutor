solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 200 cm² = 0.02 m²; 2.5 mm = 0.0025 m.'
- en: 'Substitute: C = 3 x (8.85 x 10^-12) x 0.02 / 0.0025.'
- en: 'Calculate: C = 2.124 x 10^-10 F.'
- en: 'Give it in pF: 212.4 pF.'
- en: So the capacitance is 212.4 pF.
