solution_steps:
- en: 'Write the relation: 1/f = (n - 1) x (1/R1 + 1/R2), so n = 1 + 1/(f x (1/R1
    + 1/R2)).'
- en: 'Put each quantity in SI units: 16 cm = 0.16 m; 15 cm = 0.15 m; 60 cm = 0.6
    m.'
- en: 'Substitute: n = 1 + 0.15 x 0.6 / (0.16 x (0.15 + 0.6)).'
- en: 'Calculate: n = 1.75.'
- en: So the refractive index is 1.75.
- en: The correct option is b.
