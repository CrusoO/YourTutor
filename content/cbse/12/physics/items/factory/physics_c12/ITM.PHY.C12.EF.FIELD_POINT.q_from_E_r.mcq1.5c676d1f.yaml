solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Put each quantity in SI units: 20 cm = 0.2 m.'
- en: 'Get the charge alone: multiply each side by r^2 and divide each side by k.'
- en: 'Substitute: q = 2250 x 0.2^2 / (9 x 10^9).'
- en: 'Calculate: q = 1 x 10^-8 C.'
- en: 'Give it in nC: 10 nC.'
- en: So the charge is 10 nC.
- en: The correct option is b.
