stem:
  en: A student is studying a magnetic material in an external field. The magnetic
    field inside the material, B, is 6.28 mT and the magnetising field, H, is 50 A/m.
    Find the relative permeability. Take the permeability of free space, mu0, = 1.256
    x 10^-6 N/A².
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: B = mu0 x relative permeability x H.'
- level: 2
  en: The relation already gives the relative permeability directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 6.28 mT as 0.00628 T, then write mur = B / (mu0 x H), where
    mur is the relative permeability, with the values in place, one quantity at a
    time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the relative permeability be?
