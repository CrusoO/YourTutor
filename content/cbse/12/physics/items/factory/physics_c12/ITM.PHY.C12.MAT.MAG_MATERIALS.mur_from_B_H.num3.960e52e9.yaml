solution_steps:
- en: 'Write the relation: B = mu0 x relative permeability x H.'
- en: 'Put each quantity in SI units: 6.28 mT = 0.00628 T.'
- en: 'Substitute: mur = 0.00628 / ((1.256 x 10^-6) x 50).'
- en: 'Calculate: mur = 100.'
- en: So the relative permeability is 100.
- en: The correct option is b.
