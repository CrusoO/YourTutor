solution_steps:
- en: 'Write the relation: binding energy per nucleon = binding energy / A.'
- en: 'Put each quantity in SI units: 745.2 MeV = 1.19232 x 10^-10 J; 18.63 MeV =
    2.9808 x 10^-12 J.'
- en: 'Substitute: A = (1.19232 x 10^-10) / (2.9808 x 10^-12).'
- en: 'Calculate: A = 40.'
- en: So the mass number is 40.
- en: The correct option is d.
