solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 1416 pF = 1.416 x 10^-9 F; 400 cm² = 0.04 m².'
- en: 'Get the plate gap alone: multiply each side by d and divide each side by C.'
- en: 'Substitute: d = 2 x (8.85 x 10^-12) x 0.04 / (1.416 x 10^-9).'
- en: 'Calculate: d = 5 x 10^-4 m.'
- en: 'Give it in mm: 0.5 mm.'
- en: So the plate gap is 0.5 mm.
- en: The correct option is b.
