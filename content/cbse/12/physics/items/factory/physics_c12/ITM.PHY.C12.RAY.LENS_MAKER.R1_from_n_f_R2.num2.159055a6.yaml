solution_steps:
- en: 'Write the relation: 1/f = (n - 1) x (1/R1 + 1/R2), so 1/R1 = 1/((n - 1) x f)
    - 1/R2.'
- en: 'Put each quantity in SI units: 37.5 cm = 0.375 m; 60 cm = 0.6 m.'
- en: 'Substitute: R1 = 1 / (1 / ((1.4 - 1) x 0.375) - 1 / 0.6).'
- en: 'Calculate: R1 = 0.2 m.'
- en: 'Give it in cm: 20 cm.'
- en: So the first radius is 20 cm.
- en: The correct option is b.
