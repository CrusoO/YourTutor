solution_steps:
- en: 'Write the relation: 1/f = (n - 1) x (1/R1 + 1/R2), so n = 1 + 1/(f x (1/R1
    + 1/R2)).'
- en: 'Put each quantity in SI units: 16 cm = 0.16 m; 20 cm = 0.2 m; 30 cm = 0.3 m.'
- en: 'Substitute: n = 1 + 0.2 x 0.3 / (0.16 x (0.2 + 0.3)).'
- en: 'Calculate: n = 1.75.'
- en: So the refractive index is 1.75.
