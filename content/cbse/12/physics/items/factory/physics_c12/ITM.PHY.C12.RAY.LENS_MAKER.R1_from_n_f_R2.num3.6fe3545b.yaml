solution_steps:
- en: 'Write the relation: 1/f = (n - 1) x (1/R1 + 1/R2), so 1/R1 = 1/((n - 1) x f)
    - 1/R2.'
- en: 'Put each quantity in SI units: 16 cm = 0.16 m; 20 cm = 0.2 m.'
- en: 'Substitute: R1 = 1 / (1 / ((1.75 - 1) x 0.16) - 1 / 0.2).'
- en: 'Calculate: R1 = 0.3 m.'
- en: 'Give it in cm: 30 cm.'
- en: So the first radius is 30 cm.
- en: The correct option is c.
