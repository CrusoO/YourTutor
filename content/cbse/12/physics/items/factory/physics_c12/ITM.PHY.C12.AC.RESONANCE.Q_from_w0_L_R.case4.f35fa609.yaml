solution_steps:
- en: 'Write the relation: Q = w0 x L / R.'
- en: 'Put each quantity in SI units: 50 mH = 0.05 H.'
- en: 'Substitute: Q = 1000 x 0.05 / 25.'
- en: 'Calculate: Q = 2.'
- en: So the quality factor is 2.
- en: The correct option is b.
