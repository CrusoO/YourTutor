stem:
  en: 'Case: a student investigates a series LCR circuit at resonance and records
    the following. The resonant angular frequency, w0, is 1000 rad/s, the inductance,
    L, is 50 mH and the resistance, R, is 25 Ω. Find the quality factor.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: Q = w0 x L / R.'
- level: 2
  en: The relation already gives the quality factor directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 50 mH as 0.05 H, then write Q = w0 x L / R, where Q is the
    quality factor, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the quality factor be?
