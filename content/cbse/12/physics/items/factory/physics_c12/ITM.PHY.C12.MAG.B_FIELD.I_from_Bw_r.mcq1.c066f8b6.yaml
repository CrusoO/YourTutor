stem:
  en: The field of the wire, Bw, is 2 μT and the distance, r, is 10 cm. Find the current
    in the wire. Take mu0_4pi (the permeability of free space divided by 4 pi) = 1
    x 10^-7 N/A².
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: B = (mu0 / 4 pi) x 2 x I / r for a long straight wire.'
- level: 2
  en: 'Get the current on its own before you put numbers in: multiply each side by
    r and divide each side by 2 x (mu0 / 4 pi). Do the same operation to each side
    of the formula. Change every quantity to SI units first, and change back at the
    end if asked.'
- level: 3
  en: 'First step: Write 2 μT as 2 x 10^-6 T and 10 cm as 0.1 m, then write I = Bw
    x r / (2 x mu0_4pi), where I is the current, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
