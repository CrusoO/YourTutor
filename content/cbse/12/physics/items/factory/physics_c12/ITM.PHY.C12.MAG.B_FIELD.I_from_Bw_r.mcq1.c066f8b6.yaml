solution_steps:
- en: 'Write the relation: B = (mu0 / 4 pi) x 2 x I / r for a long straight wire.'
- en: 'Put each quantity in SI units: 2 μT = 2 x 10^-6 T; 10 cm = 0.1 m.'
- en: 'Get the current alone: multiply each side by r and divide each side by 2 x
    (mu0 / 4 pi).'
- en: 'Substitute: I = (2 x 10^-6) x 0.1 / (2 x (1 x 10^-7)).'
- en: 'Calculate: I = 1 A.'
- en: So the current is 1 A.
- en: The correct option is a.
