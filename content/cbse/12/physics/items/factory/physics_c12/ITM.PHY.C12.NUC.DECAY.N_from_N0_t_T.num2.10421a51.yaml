solution_steps:
- en: 'Write the relation: the number of half-lives is t / T, then N = N0 / 2^(t/T).'
- en: 'Put each quantity in SI units: 6 days = 518400 s; 2 days = 172800 s.'
- en: 'Substitute: N = 1280 / 2^(518400 / 172800).'
- en: 'Calculate: N = 160.'
- en: So the remaining number of nuclei is 160.
- en: The correct option is b.
