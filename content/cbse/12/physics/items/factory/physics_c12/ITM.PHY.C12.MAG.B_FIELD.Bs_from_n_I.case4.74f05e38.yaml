stem:
  en: 'Case: a student investigates the magnetic field of a current and records the
    following. The number of turns per metre, n, is 500 m⁻¹ and the current, I, is
    1 A. Find the field inside the solenoid. Take the permeability of free space,
    mu0, = 1.256 x 10^-6 N/A².'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: B = mu0 x n x I inside a long solenoid.'
- level: 2
  en: The relation already gives the field inside directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: write Bs = mu0 x n x I, where Bs is the field inside, with the
    values in place, one quantity at a time.'
prediction_prompt:
