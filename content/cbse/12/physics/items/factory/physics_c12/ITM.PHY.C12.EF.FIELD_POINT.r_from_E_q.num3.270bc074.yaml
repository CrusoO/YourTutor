stem:
  en: A student is studying the electric field of a point charge. The field, E, is
    2250 N/C and the charge, q, is 10 nC. Find the distance from the charge. Take
    k = 9 x 10^9 N m²/C².
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: E = k x q / r^2.'
- level: 2
  en: 'Get the distance on its own before you put numbers in: multiply each side by
    r^2, divide each side by E, then take the square root. Do the same operation to
    each side of the formula. Change every quantity to SI units first, and change
    back at the end if asked.'
- level: 3
  en: 'First step: Write 10 nC as 1 x 10^-8 C, then write r = sqrt(k x q / E), where
    r is the distance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the distance have, and roughly how large
    is it?
