solution_steps:
- en: 'Write the relation: Q = w0 x L / R.'
- en: 'Put each quantity in SI units: 400 mH = 0.4 H.'
- en: 'Substitute: R = 500 x 0.4 / 20.'
- en: 'Calculate: R = 10 Ω.'
- en: So the resistance is 10 Ω.
- en: The correct option is c.
