solution_steps:
- en: 'Plan: the magnitude of the energy is E1 divided by n squared.'
- en: 'Substitute: En = (2.176 x 10^-18) / 2^2.'
- en: 'Calculate: En = 5.44 x 10^-19 J.'
- en: 'Give it in eV: 3.4 eV.'
- en: So the energy of the level is 3.4 eV.
