solution_steps:
- en: 'Write the relation: w0 = 1 / square root of [L x C].'
- en: 'Put each quantity in SI units: 10 mH = 0.01 H; 100 μF = 1 x 10^-4 F.'
- en: 'Substitute: w0 = 1 / sqrt(0.01 x (1 x 10^-4)).'
- en: 'Calculate: w0 = 1000 rad/s.'
- en: So the resonant angular frequency is 1000 rad/s.
- en: The correct option is b.
