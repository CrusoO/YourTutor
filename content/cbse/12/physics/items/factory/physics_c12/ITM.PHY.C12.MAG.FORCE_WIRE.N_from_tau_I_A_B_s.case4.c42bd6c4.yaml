stem:
  en: 'Case: a student investigates a current-carrying conductor in a magnetic field
    and records the following. The torque on the coil, tau, is 2 mNm, the current,
    I, is 2 A, the area of the coil, A, is 20 cm², the magnetic field, B, is 100 mT
    and the sine of the angle between the wire and the field, s, is 0.5. Find the
    number of turns on the coil.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: torque = N x I x A x B x sine of the angle on a flat coil.'
- level: 2
  en: 'Get the number of turns on its own before you put numbers in: divide each side
    by I x A x B x sine of the angle. Do the same operation to each side of the formula.
    Change every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 2 mNm as 0.002 N m, 20 cm² as 0.002 m² and 100 mT as 0.1
    T, then write N = tau / [I x A x B x s], where N is the number of turns, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the number of turns be?
