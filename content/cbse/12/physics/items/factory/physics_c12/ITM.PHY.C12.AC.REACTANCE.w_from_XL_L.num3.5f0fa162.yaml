solution_steps:
- en: 'Write the relation: XL = w x L.'
- en: 'Put each quantity in SI units: 50 mH = 0.05 H.'
- en: 'Substitute: w = 5 / 0.05.'
- en: 'Calculate: w = 100 rad/s.'
- en: So the angular frequency is 100 rad/s.
- en: The correct option is a.
