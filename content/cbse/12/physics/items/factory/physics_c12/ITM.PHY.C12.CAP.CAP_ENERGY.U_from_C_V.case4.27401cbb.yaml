solution_steps:
- en: 'Write the relation: U = (1/2) x C x V^2.'
- en: 'Put each quantity in SI units: 2 μF = 2 x 10^-6 F.'
- en: 'Substitute: U = (2 x 10^-6) x 20^2 / 2.'
- en: 'Calculate: U = 4 x 10^-4 J.'
- en: 'Give it in μJ: 400 μJ.'
- en: So the stored energy is 400 μJ.
- en: The correct option is c.
