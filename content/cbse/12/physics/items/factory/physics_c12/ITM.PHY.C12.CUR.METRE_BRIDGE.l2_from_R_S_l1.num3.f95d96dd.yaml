solution_steps:
- en: 'Write the relation: R / S = l1 / l2.'
- en: 'Put each quantity in SI units: 80 cm = 0.8 m.'
- en: 'Substitute: l2 = 0.8 x 1.25 / 5.'
- en: 'Calculate: l2 = 0.2 m.'
- en: 'Give it in cm: 20 cm.'
- en: So the right length is 20 cm.
- en: The correct option is a.
