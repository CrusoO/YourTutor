stem:
  en: 'Case: a student investigates the binding energy of a nucleus and records the
    following. The binding energy, E, is 372.6 MeV and the binding energy per nucleon,
    Ebn, is 18.63 MeV. Find the mass number.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: binding energy per nucleon = binding energy / A.'
- level: 2
  en: The relation already gives the mass number directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 372.6 MeV as 5.9616 x 10^-11 J and 18.63 MeV as 2.9808 x
    10^-12 J, then write A = E / Ebn, where A is the mass number, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the mass number be?
