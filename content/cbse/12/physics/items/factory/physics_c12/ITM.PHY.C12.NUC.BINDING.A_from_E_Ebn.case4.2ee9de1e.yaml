solution_steps:
- en: 'Write the relation: binding energy per nucleon = binding energy / A.'
- en: 'Put each quantity in SI units: 372.6 MeV = 5.9616 x 10^-11 J; 18.63 MeV = 2.9808
    x 10^-12 J.'
- en: 'Substitute: A = (5.9616 x 10^-11) / (2.9808 x 10^-12).'
- en: 'Calculate: A = 20.'
- en: So the mass number is 20.
