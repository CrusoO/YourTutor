solution_steps:
- en: 'Write the relation: emf = B x l x v, then I = emf / R.'
- en: 'Put each quantity in SI units: 100 mT = 0.1 T; 20 cm = 0.2 m.'
- en: 'Substitute: I = 0.1 x 0.2 x 2 / 5.'
- en: 'Calculate: I = 0.008 A.'
- en: 'Give it in mA: 8 mA.'
- en: So the current is 8 mA.
- en: The correct option is d.
