solution_steps:
- en: 'Write the relation: R / S = l1 / l2.'
- en: 'Put each quantity in SI units: 40 cm = 0.4 m.'
- en: 'Substitute: l2 = 0.4 x 6 / 4.'
- en: 'Calculate: l2 = 0.6 m.'
- en: 'Give it in cm: 60 cm.'
- en: So the right length is 60 cm.
