stem:
  en: A student is studying current carried by free electrons in a wire. The current,
    I, is 6.4 A, the cross-sectional area, A, is 1 mm² and the drift speed, vd, is
    1 mm/s. Find the number of free electrons in each cubic metre. Take the charge
    of one electron, e, = 1.6 x 10^-19 C.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: I = n x e x A x v_d.'
- level: 2
  en: 'Get the electron density on its own before you put numbers in: divide each
    side by e x A x v_d. Do the same operation to each side of the formula. Change
    every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 1 mm² as 1 x 10^-6 m² and 1 mm/s as 0.001 m/s, then write
    n = I / [e x A x vd], where n is the electron density, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the electron density have, and roughly
    how large is it?
