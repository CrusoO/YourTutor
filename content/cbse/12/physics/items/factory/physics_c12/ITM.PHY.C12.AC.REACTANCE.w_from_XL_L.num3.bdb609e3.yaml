solution_steps:
- en: 'Write the relation: XL = w x L.'
- en: 'Put each quantity in SI units: 10 mH = 0.01 H.'
- en: 'Substitute: w = 1 / 0.01.'
- en: 'Calculate: w = 100 rad/s.'
- en: So the angular frequency is 100 rad/s.
- en: The correct option is a.
