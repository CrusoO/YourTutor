solution_steps:
- en: 'Write the relation: U = (1/2) x Q x V.'
- en: 'Put each quantity in SI units: 2500 μC = 0.0025 C.'
- en: 'Substitute: U = 0.0025 x 50 / 2.'
- en: 'Calculate: U = 0.0625 J.'
- en: 'Give it in μJ: 62500 μJ.'
- en: So the stored energy is 62500 μJ.
- en: The correct option is b.
