stem:
  en: A student is studying two capacitors joined together. The first capacitor, C1,
    is 2 μF and the second capacitor, C2, is 3 μF. Find the capacitance of the series
    combination.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: series: 1/C = 1/C1 + 1/C2, so C = C1 x C2 / (C1 + C2).'
- level: 2
  en: The relation already gives the series capacitance directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 2 μF as 2 x 10^-6 F and 3 μF as 3 x 10^-6 F, then write Cs
    = C1 x C2 / (C1 + C2), where Cs is the series capacitance, with the values in
    place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the series capacitance have, and roughly
    how large is it?
