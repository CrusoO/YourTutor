solution_steps:
- en: 'Write the relation: series: 1/C = 1/C1 + 1/C2, so C = C1 x C2 / (C1 + C2).'
- en: 'Put each quantity in SI units: 2 μF = 2 x 10^-6 F; 3 μF = 3 x 10^-6 F.'
- en: 'Substitute: Cs = (2 x 10^-6) x (3 x 10^-6) / ((2 x 10^-6) + (3 x 10^-6)).'
- en: 'Calculate: Cs = 1.2 x 10^-6 F.'
- en: 'Give it in μF: 1.2 μF.'
- en: So the series capacitance is 1.2 μF.
- en: The correct option is b.
