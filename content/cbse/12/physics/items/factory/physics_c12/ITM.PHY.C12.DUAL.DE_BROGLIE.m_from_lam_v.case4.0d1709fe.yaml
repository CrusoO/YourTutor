stem:
  en: 'Case: a student investigates the wave nature of a moving particle and records
    the following. The de Broglie wavelength, lam, is 0.1 nm and its speed, v, is
    1 x 10^7 m/s. Find the mass of the particle. Take Planck''s constant, h, = 6.63
    x 10^-34 J s.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: wavelength = h / [m x v], so m = h / [wavelength x v].'
- level: 2
  en: The relation already gives the mass directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 0.1 nm as 1 x 10^-10 m, then write m = h / [lam x v], where
    m is the mass, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the mass have, and roughly how large
    is it?
