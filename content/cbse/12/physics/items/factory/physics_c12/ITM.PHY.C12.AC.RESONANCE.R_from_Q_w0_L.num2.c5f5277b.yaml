solution_steps:
- en: 'Write the relation: Q = w0 x L / R.'
- en: 'Put each quantity in SI units: 500 mH = 0.5 H.'
- en: 'Substitute: R = 500 x 0.5 / 5.'
- en: 'Calculate: R = 50 Ω.'
- en: So the resistance is 50 Ω.
- en: The correct option is b.
