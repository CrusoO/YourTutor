stem:
  en: The order of the bright fringe, n, is 3, the wavelength of the light, lam, is
    600 nm, the screen, D, is 1.2 m from the slits and the slits are 0.4 mm apart.
    Find the distance of that bright fringe from the central one.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: the n-th bright fringe is at x = n x wavelength x D / d.'
- level: 2
  en: The relation already gives the position directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 600 nm as 6 x 10^-7 m and 0.4 mm as 4 x 10^-4 m, then write
    x = n x lam x D / d, where x is the position, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the position have, and roughly how large
    is it?
