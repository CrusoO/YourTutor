solution_steps:
- en: 'Write the relation: the n-th bright fringe is at x = n x wavelength x D / d.'
- en: 'Put each quantity in SI units: 600 nm = 6 x 10^-7 m; 0.4 mm = 4 x 10^-4 m.'
- en: 'Substitute: x = 3 x (6 x 10^-7) x 1.2 / (4 x 10^-4).'
- en: 'Calculate: x = 0.0054 m.'
- en: 'Give it in mm: 5.4 mm.'
- en: So the position is 5.4 mm.
- en: The correct option is d.
