stem:
  en: Its mass, m, is 3.2 x 10^-27 kg, its speed, v, is 200000 m/s, the charge of
    the particle, q, is 1.6 x 10^-19 C and the radius of its circular path, r, is
    4 cm. Find the strength of the magnetic field.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: q x v x B = m x v^2 / r, so B = m x v / [q x r].'
- level: 2
  en: The relation already gives the field directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 4 cm as 0.04 m, then write B = m x v / [q x r], where B is
    the field, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the field have, and roughly how large
    is it?
