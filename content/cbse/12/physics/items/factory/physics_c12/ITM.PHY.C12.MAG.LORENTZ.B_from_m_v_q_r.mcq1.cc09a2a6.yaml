solution_steps:
- en: 'Write the relation: q x v x B = m x v^2 / r, so B = m x v / [q x r].'
- en: 'Put each quantity in SI units: 4 cm = 0.04 m.'
- en: 'Substitute: B = (3.2 x 10^-27) x 200000 / ((1.6 x 10^-19) x 0.04).'
- en: 'Calculate: B = 0.1 T.'
- en: 'Give it in mT: 100 mT.'
- en: So the field is 100 mT.
