stem:
  en: A student is studying the binding energy of a nucleus. The mass defect, dm,
    is 0.4 u. Find the binding energy. Take the energy equivalent of one atomic mass
    unit, ue, = 931.5 MeV/u.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: binding energy = mass defect x energy of one atomic mass unit.'
- level: 2
  en: The relation already gives the binding energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 0.4 u as 6.64 x 10^-28 kg, then write E = dm x ue, where
    E is the binding energy, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the binding energy have, and roughly
    how large is it?
