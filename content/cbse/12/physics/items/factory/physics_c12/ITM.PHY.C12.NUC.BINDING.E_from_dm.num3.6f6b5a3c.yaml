solution_steps:
- en: 'Write the relation: binding energy = mass defect x energy of one atomic mass
    unit.'
- en: 'Put each quantity in SI units: 0.4 u = 6.64 x 10^-28 kg.'
- en: 'Substitute: E = (6.64 x 10^-28) x 8.98e + 16.'
- en: 'Calculate: E = 5.9616 x 10^-11 J.'
- en: 'Give it in MeV: 372.6 MeV.'
- en: So the binding energy is 372.6 MeV.
