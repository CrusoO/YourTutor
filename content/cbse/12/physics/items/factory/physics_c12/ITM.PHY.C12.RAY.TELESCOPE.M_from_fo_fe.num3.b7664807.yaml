stem:
  en: A student is studying an astronomical telescope in normal adjustment. The focal
    length of the objective, fo, is 150 cm and the focal length of the eyepiece, fe,
    is 5 cm. Find the magnifying power.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: M = fo / fe in normal adjustment.'
- level: 2
  en: The relation already gives the magnifying power directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 150 cm as 1.5 m and 5 cm as 0.05 m, then write M = fo / fe,
    where M is the magnifying power, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the magnifying power be?
