- en: 'Write the relation: M = fo / fe in normal adjustment.'
- en: 'Put each quantity in SI units: 150 cm = 1.5 m; 5 cm = 0.05 m.'
- en: 'Substitute: M = 1.5 / 0.05.'
- en: 'Calculate: M = 30.'
- en: So the magnifying power is 30.
