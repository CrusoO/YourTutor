stem:
  en: 'Case: a student investigates an inductor in a circuit and records the following.
    The energy stored in the magnetic field, U, is 625 mJ and the steady current,
    I, is 5 A. Find the inductance.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: U = (1/2) x L x I^2.'
- level: 2
  en: The relation already gives the inductance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 625 mJ as 0.625 J, then write L = 2 x U / I^2, where L is
    the inductance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the inductance have, and roughly how
    large is it?
