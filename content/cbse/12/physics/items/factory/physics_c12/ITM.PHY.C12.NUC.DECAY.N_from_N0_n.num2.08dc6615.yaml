stem:
  en: This question is about a radioactive sample decaying by half-lives. The sample
    starts with 640 undecayed nuclei and the number of half-lives that pass, n, is
    5. Find how many undecayed nuclei are left.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Plan the steps: after n
    half-lives the number left is N0 / 2^n.'
- level: 2
  en: Work through the plan one step at a time.
- level: 3
  en: 'First step: write N = N0 / 2^n, where N is the remaining number of nuclei,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the remaining number of nuclei
    be?
