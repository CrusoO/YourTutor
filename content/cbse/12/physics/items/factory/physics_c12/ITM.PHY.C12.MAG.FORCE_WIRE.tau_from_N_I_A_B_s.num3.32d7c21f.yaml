stem:
  en: A student is studying a current-carrying conductor in a magnetic field. The
    number of turns, N, is 100, the current, I, is 2 A, the area of the coil, A, is
    100 cm², the magnetic field, B, is 500 mT and the sine of the angle between the
    wire and the field, s, is 1. Find the torque on the coil.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: torque = N x I x A x B x sine of the angle on a flat coil.'
- level: 2
  en: The relation already gives the torque directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 100 cm² as 0.01 m² and 500 mT as 0.5 T, then write tau =
    N x I x A x B x s, where tau is the torque, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the torque have, and roughly how large
    is it?
