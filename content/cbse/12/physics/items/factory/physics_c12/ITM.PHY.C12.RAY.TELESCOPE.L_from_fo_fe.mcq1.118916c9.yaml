stem:
  en: The focal length of the objective, fo, is 150 cm and the focal length of the
    eyepiece, fe, is 20 cm. Find the distance between the two lenses.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: tube length = fo + fe in normal adjustment.'
- level: 2
  en: The relation already gives the tube length directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 150 cm as 1.5 m and 20 cm as 0.2 m, then write L = fo + fe,
    where L is the tube length, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the tube length have, and roughly how
    large is it?
