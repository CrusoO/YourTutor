solution_steps:
- en: 'Write the relation: tube length = fo + fe in normal adjustment.'
- en: 'Put each quantity in SI units: 150 cm = 1.5 m; 20 cm = 0.2 m.'
- en: 'Substitute: L = 1.5 + 0.2.'
- en: 'Calculate: L = 1.7 m.'
- en: 'Give it in cm: 170 cm.'
- en: So the tube length is 170 cm.
