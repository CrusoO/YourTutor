solution_steps:
- en: 'Write the relation: wavelength = h / [m x v], so m = h / [wavelength x v].'
- en: 'Put each quantity in SI units: 0.25 nm = 2.5 x 10^-10 m.'
- en: 'Substitute: m = (6.63 x 10^-34) / ((2.5 x 10^-10) x 200).'
- en: 'Calculate: m = 1.326 x 10^-26 kg.'
- en: So the mass is 1.326 x 10^-26 kg.
- en: The correct option is b.
