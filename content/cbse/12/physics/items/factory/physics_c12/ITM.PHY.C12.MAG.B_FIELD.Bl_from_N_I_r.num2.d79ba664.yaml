- en: 'Write the relation: B = mu0 x N x I / (2 x r) at the centre of a circular coil.'
- en: 'Put each quantity in SI units: 10 cm = 0.1 m.'
- en: 'Substitute: Bl = (1.256 x 10^-6) x 10 x 2 / (2 x 0.1).'
- en: 'Calculate: Bl = 1.256 x 10^-4 T.'
- en: 'Give it in μT: 125.6 μT.'
- en: So the field at the centre is 125.6 μT.
