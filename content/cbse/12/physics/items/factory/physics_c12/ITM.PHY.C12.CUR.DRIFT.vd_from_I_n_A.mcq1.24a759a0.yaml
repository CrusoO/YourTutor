stem:
  en: The current, I, is 0.4 A, the free electron density, n, is 2 x 10^28 m⁻³ and
    the cross-sectional area, A, is 2.5 mm². Find the drift speed of the electrons.
    Take the charge of one electron, e, = 1.6 x 10^-19 C.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: I = n x e x A x v_d.'
- level: 2
  en: 'Get the drift speed on its own before you put numbers in: divide each side
    by n x e x A. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 2.5 mm² as 2.5 x 10^-6 m², then write vd = I / [n x e x A],
    where vd is the drift speed, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the drift speed have, and roughly how
    large is it?
