solution_steps:
- en: 'Write the relation: torque = p x E x sine of the angle.'
- en: 'Get the field alone: divide each side of torque = p x E x sine of the angle
    by p x sine of the angle.'
- en: 'Substitute: E = (3 x 10^-6) / ((2.5 x 10^-10) x 0.6).'
- en: 'Calculate: E = 20000 N/C.'
- en: So the field is 20000 N/C.
- en: The correct option is b.
