solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 0.84 mm = 8.4 x 10^-4 m; 700 nm = 7 x 10^-7
    m; 1 mm = 0.001 m.'
- en: 'Substitute: D = (8.4 x 10^-4) x 0.001 / (7 x 10^-7).'
- en: 'Calculate: D = 1.2 m.'
- en: So the screen distance is 1.2 m.
- en: The correct option is b.
