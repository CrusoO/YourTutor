solution_steps:
- en: 'Write the relation: binding energy = mass defect x energy of one atomic mass
    unit.'
- en: 'Put each quantity in SI units: 0.04 u = 6.64 x 10^-29 kg.'
- en: 'Substitute: E = (6.64 x 10^-29) x 8.98e + 16.'
- en: 'Calculate: E = 5.9616 x 10^-12 J.'
- en: 'Give it in MeV: 37.26 MeV.'
- en: So the binding energy is 37.26 MeV.
- en: The correct option is a.
