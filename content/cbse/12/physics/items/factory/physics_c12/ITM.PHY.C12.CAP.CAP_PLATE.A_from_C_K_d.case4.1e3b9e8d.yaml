solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 531 pF = 5.31 x 10^-10 F; 2 mm = 0.002 m.'
- en: 'Get the plate area alone: multiply each side by d and divide each side by K
    x eps0.'
- en: 'Substitute: A = (5.31 x 10^-10) x 0.002 / (3 x (8.85 x 10^-12)).'
- en: 'Calculate: A = 0.04 m².'
- en: 'Give it in cm²: 400 cm².'
- en: So the plate area is 400 cm².
- en: The correct option is d.
