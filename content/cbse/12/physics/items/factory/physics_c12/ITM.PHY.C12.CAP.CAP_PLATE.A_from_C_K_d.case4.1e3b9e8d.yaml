stem:
  en: 'Case: a student investigates a parallel plate capacitor and records the following.
    The capacitance, C, is 531 pF, the dielectric constant of the material between
    the plates, K, is 3 and the gap between the plates, d, is 2 mm. Find the area
    of each plate. Take the permittivity of free space, eps0, = 8.85 x 10^-12 C²/(N
    m²).'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: C = K x eps0 x A / d.'
- level: 2
  en: 'Get the plate area on its own before you put numbers in: multiply each side
    by d and divide each side by K x eps0. Do the same operation to each side of the
    formula. Change every quantity to SI units first, and change back at the end if
    asked.'
- level: 3
  en: 'First step: Write 531 pF as 5.31 x 10^-10 F and 2 mm as 0.002 m, then write
    A = C x d / (K x eps0), where A is the plate area, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the plate area have, and roughly how
    large is it?
