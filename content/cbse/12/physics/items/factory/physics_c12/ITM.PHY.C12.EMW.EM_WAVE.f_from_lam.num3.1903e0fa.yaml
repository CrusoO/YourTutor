stem:
  en: A student is studying a plane electromagnetic wave in vacuum. The wavelength,
    lam, is 20 m. Find the frequency. Take the speed of light in vacuum, c, = 3 x
    10^8 m/s.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: c = f x wavelength.'
- level: 2
  en: 'Get the frequency on its own before you put numbers in: divide each side by
    the wavelength. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: write f = c / lam, where f is the frequency, with the values in
    place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the frequency have, and roughly how large
    is it?
