solution_steps:
- en: 'Write the relation: c = f x wavelength.'
- en: 'Get the frequency alone: divide each side by the wavelength.'
- en: 'Substitute: f = (3 x 10^8) / 20.'
- en: 'Calculate: f = 1.5 x 10^7 Hz.'
- en: 'Give it in MHz: 15 MHz.'
- en: So the frequency is 15 MHz.
- en: The correct option is c.
