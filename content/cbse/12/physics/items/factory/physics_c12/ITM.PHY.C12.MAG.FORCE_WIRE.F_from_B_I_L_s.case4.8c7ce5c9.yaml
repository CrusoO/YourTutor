stem:
  en: 'Case: a student investigates a current-carrying conductor in a magnetic field
    and records the following. The magnetic field, B, is 500 mT, the current, I, is
    5 A, the length of wire in the field, L, is 10 cm and the sine of the angle between
    the wire and the field, s, is 0.5. Find the force on the wire.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: F = B x I x L x sine of the angle.'
- level: 2
  en: The relation already gives the force directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 500 mT as 0.5 T and 10 cm as 0.1 m, then write F = B x I
    x L x s, where F is the force, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the force have, and roughly how large
    is it?
