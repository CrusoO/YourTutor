solution_steps:
- en: 'Write the relation: 1/f = (n - 1) x (1/R1 + 1/R2) for a double convex lens,
    with the radii as positive numbers.'
- en: 'Put each quantity in SI units: 30 cm = 0.3 m; 10 cm = 0.1 m.'
- en: 'Substitute: f = 1 / ((1.4 - 1) x (1 / 0.3 + 1 / 0.1)).'
- en: 'Calculate: f = 0.1875 m.'
- en: 'Give it in cm: 18.75 cm.'
- en: So the focal length is 18.75 cm.
