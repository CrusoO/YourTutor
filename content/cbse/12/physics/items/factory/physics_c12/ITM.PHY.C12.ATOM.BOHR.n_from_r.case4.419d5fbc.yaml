solution_steps:
- en: 'Plan: the radius of the n-th orbit is a0 times n squared.'
- en: 'Put each quantity in SI units: 1325 pm = 1.325 x 10^-9 m.'
- en: 'Get the quantum number alone: divide each side by a0, then take the square
    root.'
- en: 'Substitute: n = sqrt((1.325 x 10^-9) / (5.3 x 10^-11)).'
- en: 'Calculate: n = 5.'
- en: So the quantum number is 5.
- en: The correct option is a.
