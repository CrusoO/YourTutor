stem:
  en: 'Case: a student investigates the hydrogen atom in the Bohr model and records
    the following. The orbit radius, r, is 1325 pm. Find the principal quantum number
    of the orbit. Take the radius of the first Bohr orbit, a0, = 5.3 x 10^-11 m.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Plan the steps: the
    radius of the n-th orbit is a0 times n squared.'
- level: 2
  en: 'Get the quantum number on its own before you put numbers in: divide each side
    by a0, then take the square root. Do the same operation to each side of the formula.
    Change every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 1325 pm as 1.325 x 10^-9 m, then write n = sqrt(r / a0),
    where n is the quantum number, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the quantum number be?
