solution_steps:
- en: 'Write the relation: parallel: C = C1 + C2.'
- en: 'Put each quantity in SI units: 12 μF = 1.2 x 10^-5 F; 6 μF = 6 x 10^-6 F.'
- en: 'Substitute: Cp = (1.2 x 10^-5) + (6 x 10^-6).'
- en: 'Calculate: Cp = 1.8 x 10^-5 F.'
- en: 'Give it in μF: 18 μF.'
- en: So the parallel capacitance is 18 μF.
- en: The correct option is b.
