stem:
  en: This question is about two capacitors joined together. The first capacitor,
    C1, is 12 μF and the second capacitor, C2, is 6 μF. Find the capacitance of the
    parallel combination.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: parallel: C = C1 + C2.'
- level: 2
  en: The relation already gives the parallel capacitance directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 12 μF as 1.2 x 10^-5 F and 6 μF as 6 x 10^-6 F, then write
    Cp = C1 + C2, where Cp is the parallel capacitance, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the parallel capacitance have, and roughly
    how large is it?
