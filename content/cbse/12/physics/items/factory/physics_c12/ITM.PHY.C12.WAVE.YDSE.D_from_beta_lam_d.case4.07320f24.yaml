stem:
  en: 'Case: a student investigates Young''s double slit experiment and records the
    following. The fringe width, beta, is 2.1 mm, the wavelength of the light, lam,
    is 700 nm and the slits are 0.4 mm apart. Find the distance from the slits to
    the screen.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: fringe width = wavelength x D / d.'
- level: 2
  en: The relation already gives the screen distance directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 2.1 mm as 0.0021 m, 700 nm as 7 x 10^-7 m and 0.4 mm as 4
    x 10^-4 m, then write D = beta x d / lam, where D is the screen distance, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the screen distance have, and roughly
    how large is it?
