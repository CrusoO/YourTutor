stem:
  en: A student is studying the photoelectric effect at a metal surface. The energy
    of each photon, Eph, is 3.5 eV and the maximum kinetic energy of the emitted electrons,
    K, is 1.5 eV. Find the work function of the metal.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: K = photon energy - work function.'
- level: 2
  en: 'Get the work function on its own before you put numbers in: rearrange K = photon
    energy - work function for the work function. Do the same operation to each side
    of the formula. Change every quantity to SI units first, and change back at the
    end if asked.'
- level: 3
  en: 'First step: Write 3.5 eV as 5.6 x 10^-19 J and 1.5 eV as 2.4 x 10^-19 J, then
    write phi = Eph - K, where phi is the work function, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the work function have, and roughly how
    large is it?
