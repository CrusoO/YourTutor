solution_steps:
- en: 'Write the relation: K = photon energy - work function.'
- en: 'Put each quantity in SI units: 3.5 eV = 5.6 x 10^-19 J; 1.5 eV = 2.4 x 10^-19
    J.'
- en: 'Get the work function alone: rearrange K = photon energy - work function for
    the work function.'
- en: 'Substitute: phi = (5.6 x 10^-19) - (2.4 x 10^-19).'
- en: 'Calculate: phi = 3.2 x 10^-19 J.'
- en: 'Give it in eV: 2 eV.'
- en: So the work function is 2 eV.
- en: The correct option is d.
