stem:
  en: A student is studying a charged particle moving in a magnetic field. The magnetic
    force, F, is 3.84 x 10^-15 N, the charge of the particle, q, is 1.6 x 10^-19 C,
    the magnetic field, B, is 200 mT and the sine of the angle between the velocity
    and the field, s, is 0.6. Find the speed of the particle.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: F = q x v x B x sine of the angle.'
- level: 2
  en: 'Get the speed on its own before you put numbers in: divide each side by q x
    B x sine of the angle. Do the same operation to each side of the formula. Change
    every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 200 mT as 0.2 T, then write v = F / [q x B x s], where v
    is the speed, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the speed have, and roughly how large
    is it?
