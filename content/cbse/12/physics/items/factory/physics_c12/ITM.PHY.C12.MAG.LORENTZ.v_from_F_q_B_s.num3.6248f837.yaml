solution_steps:
- en: 'Write the relation: F = q x v x B x sine of the angle.'
- en: 'Put each quantity in SI units: 200 mT = 0.2 T.'
- en: 'Get the speed alone: divide each side by q x B x sine of the angle.'
- en: 'Substitute: v = (3.84 x 10^-15) / ((1.6 x 10^-19) x 0.2 x 0.6).'
- en: 'Calculate: v = 200000 m/s.'
- en: So the speed is 200000 m/s.
- en: The correct option is b.
