solution_steps:
- en: 'Write the relation: n/v - 1/d = (n - 1)/R, so 1/d = n/v - (n - 1)/R.'
- en: 'Put each quantity in SI units: 30 cm = 0.3 m; 36 cm = 0.36 m.'
- en: 'Substitute: d = 1 / (1.5 / 0.36 - (1.5 - 1) / 0.3).'
- en: 'Calculate: d = 0.4 m.'
- en: 'Give it in cm: 40 cm.'
- en: So the object distance is 40 cm.
- en: The correct option is c.
