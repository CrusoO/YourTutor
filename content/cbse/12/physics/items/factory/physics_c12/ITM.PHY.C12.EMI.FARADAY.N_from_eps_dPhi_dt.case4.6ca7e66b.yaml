stem:
  en: 'Case: a student investigates a coil in a changing magnetic field and records
    the following. The induced emf, eps, is 1000 V, the flux through the coil changes
    by 20 mWb and the change takes 10 ms. Find the number of turns in the coil.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: emf = N x flux change / time.'
- level: 2
  en: 'Get the number of turns on its own before you put numbers in: multiply each
    side by the time and divide each side by the flux change. Do the same operation
    to each side of the formula. Change every quantity to SI units first, and change
    back at the end if asked.'
- level: 3
  en: 'First step: Write 20 mWb as 0.02 Wb and 10 ms as 0.01 s, then write N = eps
    x dt / dPhi, where N is the number of turns, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the number of turns be?
