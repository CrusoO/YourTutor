solution_steps:
- en: 'Write the relation: 1 / wavelength = R x (1/nf^2 - 1/ni^2).'
- en: 'Substitute: kk = (1.1 x 10^7) x (1 / 2^2 - 1 / 5^2).'
- en: 'Calculate: kk = 2.31 x 10^6 m⁻¹.'
- en: So the wave number is 2.31 x 10^6 m⁻¹.
