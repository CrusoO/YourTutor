solution_steps:
- en: 'Plan: the number of half-lives is t / T.'
- en: 'Put each quantity in SI units: 6 years = 1.89216 x 10^8 s.'
- en: 'Substitute: T = (1.89216 x 10^8) / 3.'
- en: 'Calculate: T = 6.3072 x 10^7 s.'
- en: 'Give it in years: 2 years.'
- en: So the half-life is 2 years.
- en: The correct option is c.
