solution_steps:
- en: 'Write the relation: 1/f = (n - 1) x (1/R1 + 1/R2), so n = 1 + 1/(f x (1/R1
    + 1/R2)).'
- en: 'Put each quantity in SI units: 12.5 cm = 0.125 m; 10 cm = 0.1 m; 30 cm = 0.3
    m.'
- en: 'Substitute: n = 1 + 0.1 x 0.3 / (0.125 x (0.1 + 0.3)).'
- en: 'Calculate: n = 1.6.'
- en: So the refractive index is 1.6.
- en: The correct option is a.
