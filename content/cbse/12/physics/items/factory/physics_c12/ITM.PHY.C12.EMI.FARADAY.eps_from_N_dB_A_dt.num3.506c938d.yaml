solution_steps:
- en: 'Write the relation: flux change = dB x A, then emf = N x [flux change] / time.'
- en: 'Put each quantity in SI units: 50 cm² = 0.005 m²; 20 ms = 0.02 s.'
- en: 'Substitute: eps = 10 x 0.5 x 0.005 / 0.02.'
- en: 'Calculate: eps = 1.25 V.'
- en: So the induced emf is 1.25 V.
- en: The correct option is a.
