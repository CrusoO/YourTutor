solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 1062 pF = 1.062 x 10^-9 F; 2.5 mm = 0.0025 m.'
- en: 'Get the plate area alone: multiply each side by d and divide each side by K
    x eps0.'
- en: 'Substitute: A = (1.062 x 10^-9) x 0.0025 / (3 x (8.85 x 10^-12)).'
- en: 'Calculate: A = 0.1 m².'
- en: 'Give it in cm²: 1000 cm².'
- en: So the plate area is 1000 cm².
- en: The correct option is a.
