solution_steps:
- en: 'Write the relation: q x v x B = m x v^2 / r, so B = m x v / [q x r].'
- en: 'Put each quantity in SI units: 5 cm = 0.05 m.'
- en: 'Substitute: B = (1.6 x 10^-27) x (1 x 10^6) / ((1.6 x 10^-19) x 0.05).'
- en: 'Calculate: B = 0.2 T.'
- en: 'Give it in mT: 200 mT.'
- en: So the field is 200 mT.
- en: The correct option is b.
