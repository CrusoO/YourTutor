solution_steps:
- en: 'Write the relation: U = (1/2) x C x V^2.'
- en: 'Put each quantity in SI units: 5 μF = 5 x 10^-6 F.'
- en: 'Substitute: U = (5 x 10^-6) x 20^2 / 2.'
- en: 'Calculate: U = 0.001 J.'
- en: 'Give it in μJ: 1000 μJ.'
- en: So the stored energy is 1000 μJ.
- en: The correct option is d.
