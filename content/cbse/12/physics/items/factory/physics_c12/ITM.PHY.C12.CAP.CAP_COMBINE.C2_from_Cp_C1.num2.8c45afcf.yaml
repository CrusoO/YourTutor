stem:
  en: This question is about two capacitors joined together. The parallel combination,
    Cp, is 80 μF and the first capacitor, C1, is 60 μF. Find the second capacitance.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: parallel: Cp = C1 + C2.'
- level: 2
  en: 'Get the second capacitance on its own before you put numbers in: subtract C1
    from each side. Do the same operation to each side of the formula. Change every
    quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 80 μF as 8 x 10^-5 F and 60 μF as 6 x 10^-5 F, then write
    C2 = Cp - C1, where C2 is the second capacitance, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the second capacitance have, and roughly
    how large is it?
