solution_steps:
- en: 'Write the relation: parallel: Cp = C1 + C2.'
- en: 'Put each quantity in SI units: 80 μF = 8 x 10^-5 F; 60 μF = 6 x 10^-5 F.'
- en: 'Get the second capacitance alone: subtract C1 from each side.'
- en: 'Substitute: C2 = (8 x 10^-5) - (6 x 10^-5).'
- en: 'Calculate: C2 = 2 x 10^-5 F.'
- en: 'Give it in μF: 20 μF.'
- en: So the second capacitance is 20 μF.
- en: The correct option is a.
