stem:
  en: The charge on each end, q, is 5 μC and the two charges are 10 cm apart. Find
    the dipole moment.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: p = q x d, charge times separation.'
- level: 2
  en: The relation already gives the dipole moment directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 5 μC as 5 x 10^-6 C and 10 cm as 0.1 m, then write p = q
    x d, where p is the dipole moment, with the values in place, one quantity at a
    time.'
prediction_prompt:
  en: Before you calculate, what unit should the dipole moment have, and roughly how
    large is it?
