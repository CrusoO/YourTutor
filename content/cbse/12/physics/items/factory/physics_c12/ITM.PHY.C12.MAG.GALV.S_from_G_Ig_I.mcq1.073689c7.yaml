stem:
  en: The galvanometer coil has a resistance of 100 Ω, its full scale deflection needs
    10 mA and the ammeter must read up to 60 mA. Find the shunt resistance needed.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: the shunt takes the extra current: Ig x G = (I - Ig) x S.'
- level: 2
  en: 'Get the shunt on its own before you put numbers in: divide each side of Ig
    x G = (I - Ig) x S by (I - Ig). Do the same operation to each side of the formula.
    Change every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 10 mA as 0.01 A and 60 mA as 0.06 A, then write S = G x Ig
    / (I - Ig), where S is the shunt, with the values in place, one quantity at a
    time.'
prediction_prompt:
  en: Before you calculate, what unit should the shunt have, and roughly how large
    is it?
