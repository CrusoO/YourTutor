solution_steps:
- en: 'Write the relation: I = n x e x A x v_d.'
- en: 'Put each quantity in SI units: 1 mm² = 1 x 10^-6 m²; 0.05 mm/s = 5 x 10^-5
    m/s.'
- en: 'Substitute: I = (2 x 10^28) x (1.6 x 10^-19) x (1 x 10^-6) x (5 x 10^-5).'
- en: 'Calculate: I = 0.16 A.'
- en: So the current is 0.16 A.
- en: The correct option is c.
