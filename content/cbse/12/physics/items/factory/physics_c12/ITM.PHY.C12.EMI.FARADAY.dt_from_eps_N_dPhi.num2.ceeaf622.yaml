solution_steps:
- en: 'Write the relation: emf = N x flux change / time.'
- en: 'Put each quantity in SI units: 1 mWb = 0.001 Wb.'
- en: 'Get the time alone: multiply each side by the time and divide each side by
    the emf.'
- en: 'Substitute: dt = 500 x 0.001 / 5.'
- en: 'Calculate: dt = 0.1 s.'
- en: 'Give it in ms: 100 ms.'
- en: So the time is 100 ms.
- en: The correct option is d.
