stem:
  en: This question is about a coil in a changing magnetic field. The induced emf,
    eps, is 5 V, the number of turns, N, is 500 and the flux through the coil changes
    by 1 mWb. Find the time taken for the flux to change.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: emf = N x flux change / time.'
- level: 2
  en: 'Get the time on its own before you put numbers in: multiply each side by the
    time and divide each side by the emf. Do the same operation to each side of the
    formula. Change every quantity to SI units first, and change back at the end if
    asked.'
- level: 3
  en: 'First step: Write 1 mWb as 0.001 Wb, then write dt = N x dPhi / eps, where
    dt is the time, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the time have, and roughly how large
    is it?
