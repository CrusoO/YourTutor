solution_steps:
- en: 'Write the relation: F = B x I x L x sine of the angle.'
- en: 'Put each quantity in SI units: 500 mT = 0.5 T; 10 cm = 0.1 m.'
- en: 'Substitute: F = 0.5 x 2 x 0.1 x 1.'
- en: 'Calculate: F = 0.1 N.'
- en: 'Give it in mN: 100 mN.'
- en: So the force is 100 mN.
