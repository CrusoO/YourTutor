stem:
  en: This question is about an electric dipole in a uniform field. The torque on
    the dipole, tau, is 5 x 10^-8 N m, the dipole moment, p, is 1 x 10^-10 C m and
    the sine of the angle between the dipole and the field, s, is 0.5. Find the strength
    of the field.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: torque = p x E x sine of the angle.'
- level: 2
  en: 'Get the field on its own before you put numbers in: divide each side of torque
    = p x E x sine of the angle by p x sine of the angle. Do the same operation to
    each side of the formula.'
- level: 3
  en: 'First step: write E = tau / [p x s], where E is the field, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the field have, and roughly how large
    is it?
