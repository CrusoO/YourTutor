solution_steps:
- en: 'Write the relation: B = (mu0 / 4 pi) x 2 x I / r for a long straight wire.'
- en: 'Put each quantity in SI units: 5 cm = 0.05 m.'
- en: 'Substitute: Bw = 2 x (1 x 10^-7) x 2 / 0.05.'
- en: 'Calculate: Bw = 8 x 10^-6 T.'
- en: 'Give it in μT: 8 μT.'
- en: So the field of the wire is 8 μT.
- en: The correct option is b.
