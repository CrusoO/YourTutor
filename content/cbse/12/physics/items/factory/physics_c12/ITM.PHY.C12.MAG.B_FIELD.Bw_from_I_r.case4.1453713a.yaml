stem:
  en: 'Case: a student investigates the magnetic field of a current and records the
    following. The current, I, is 2 A and the distance, r, is 5 cm. Find the field
    at that distance from the wire. Take mu0_4pi (the permeability of free space divided
    by 4 pi) = 1 x 10^-7 N/A².'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: B = (mu0 / 4 pi) x 2 x I / r for a long straight wire.'
- level: 2
  en: The relation already gives the field of the wire directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 5 cm as 0.05 m, then write Bw = 2 x mu0_4pi x I / r, where
    Bw is the field of the wire, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the field of the wire have, and roughly
    how large is it?
