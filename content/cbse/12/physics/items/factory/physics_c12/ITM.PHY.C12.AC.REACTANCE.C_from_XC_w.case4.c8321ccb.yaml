stem:
  en: 'Case: a student investigates an inductor or a capacitor in an alternating circuit
    and records the following. The capacitive reactance, XC, is 2000 Ω and the angular
    frequency of the supply, w, is 100 rad/s. Find the capacitance.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: XC = 1 / [w x C].'
- level: 2
  en: 'Get the capacitance on its own before you put numbers in: multiply each side
    by C, then divide each side by XC x w. Do the same operation to each side of the
    formula. Change every quantity to SI units first, and change back at the end if
    asked.'
- level: 3
  en: 'First step: write C = 1 / [w x XC], where C is the capacitance, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the capacitance have, and roughly how
    large is it?
