stem:
  en: The de Broglie wavelength, lam, is 2 nm. Find the momentum of the particle.
    Take Planck's constant, h, = 6.63 x 10^-34 J s.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: wavelength = h / p, so p = h / wavelength.'
- level: 2
  en: 'Get the momentum on its own before you put numbers in: multiply each side by
    p and divide each side by the wavelength. Do the same operation to each side of
    the formula. Change every quantity to SI units first, and change back at the end
    if asked.'
- level: 3
  en: 'First step: Write 2 nm as 2 x 10^-9 m, then write p = h / lam, where p is the
    momentum, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the momentum have, and roughly how large
    is it?
