solution_steps:
- en: 'Write the relation: emitter current = base current + collector current.'
- en: 'Put each quantity in SI units: 2.5 mA = 0.0025 A; 2.525 mA = 0.002525 A.'
- en: 'Substitute: Ib = 0.002525 - 0.0025.'
- en: 'Calculate: Ib = 2.5 x 10^-5 A.'
- en: 'Give it in μA: 25 μA.'
- en: So the base current is 25 μA.
- en: The correct option is a.
