solution_steps:
- en: 'Write the relation: voltage gain = beta x load resistance / input resistance.'
- en: 'Put each quantity in SI units: 2 kΩ = 2000 Ω; 1 kΩ = 1000 Ω.'
- en: 'Substitute: Av = 200 x 2000 / 1000.'
- en: 'Calculate: Av = 400.'
- en: So the voltage gain is 400.
- en: The correct option is b.
