stem:
  en: 'Case: a student investigates a transistor in the common emitter connection
    and records the following. The current gain, beta, is 200, the load resistance,
    Rl, is 2 kΩ and the input resistance, Rb, is 1 kΩ. Find the voltage gain.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: voltage gain = beta x load resistance / input resistance.'
- level: 2
  en: The relation already gives the voltage gain directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 2 kΩ as 2000 Ω and 1 kΩ as 1000 Ω, then write Av = beta x
    Rl / Rb, where Av is the voltage gain, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the voltage gain be?
