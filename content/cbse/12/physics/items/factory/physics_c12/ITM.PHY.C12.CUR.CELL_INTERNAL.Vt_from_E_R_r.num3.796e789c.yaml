solution_steps:
- en: 'Write the relation: I = E / (R + r), and the terminal voltage is V = I x R.'
- en: 'Substitute: Vt = 12 x 4 / (4 + 2).'
- en: 'Calculate: Vt = 8 V.'
- en: So the terminal voltage is 8 V.
