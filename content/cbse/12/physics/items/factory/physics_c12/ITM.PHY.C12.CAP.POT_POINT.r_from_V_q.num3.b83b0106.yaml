solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 1 μC = 1 x 10^-6 C.'
- en: 'Get the distance alone: multiply each side by r and divide each side by V.'
- en: 'Substitute: r = (9 x 10^9) x (1 x 10^-6) / 60000.'
- en: 'Calculate: r = 0.15 m.'
- en: 'Give it in cm: 15 cm.'
- en: So the distance is 15 cm.
- en: The correct option is d.
