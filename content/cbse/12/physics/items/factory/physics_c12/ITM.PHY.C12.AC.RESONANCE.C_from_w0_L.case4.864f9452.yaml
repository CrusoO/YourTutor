stem:
  en: 'Case: a student investigates a series LCR circuit at resonance and records
    the following. The resonant angular frequency, w0, is 1000 rad/s and the inductance,
    L, is 50 mH. Find the capacitance.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: w0 = 1 / square root of [L x C], so C = 1 / (w0^2 x L).'
- level: 2
  en: 'Get the capacitance on its own before you put numbers in: square each side
    of the relation, then rearrange for C. Do the same operation to each side of the
    formula. Change every quantity to SI units first, and change back at the end if
    asked.'
- level: 3
  en: 'First step: Write 50 mH as 0.05 H, then write C = 1 / (w0^2 x L), where C is
    the capacitance, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the capacitance have, and roughly how
    large is it?
