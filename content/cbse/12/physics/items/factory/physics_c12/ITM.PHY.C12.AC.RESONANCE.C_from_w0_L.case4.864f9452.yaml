solution_steps:
- en: 'Write the relation: w0 = 1 / square root of [L x C], so C = 1 / (w0^2 x L).'
- en: 'Put each quantity in SI units: 50 mH = 0.05 H.'
- en: 'Get the capacitance alone: square each side of the relation, then rearrange
    for C.'
- en: 'Substitute: C = 1 / (1000^2 x 0.05).'
- en: 'Calculate: C = 2 x 10^-5 F.'
- en: 'Give it in μF: 20 μF.'
- en: So the capacitance is 20 μF.
- en: The correct option is d.
