solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 200 cm² = 0.02 m²; 0.5 mm = 5 x 10^-4 m.'
- en: 'Substitute: C = 1 x (8.85 x 10^-12) x 0.02 / (5 x 10^-4).'
- en: 'Calculate: C = 3.54 x 10^-10 F.'
- en: 'Give it in pF: 354 pF.'
- en: So the capacitance is 354 pF.
- en: The correct option is c.
