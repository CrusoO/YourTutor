solution_steps:
- en: 'Write the relation: XL = w x L.'
- en: 'Put each quantity in SI units: 200 mH = 0.2 H.'
- en: 'Substitute: w = 100 / 0.2.'
- en: 'Calculate: w = 500 rad/s.'
- en: So the angular frequency is 500 rad/s.
- en: The correct option is c.
