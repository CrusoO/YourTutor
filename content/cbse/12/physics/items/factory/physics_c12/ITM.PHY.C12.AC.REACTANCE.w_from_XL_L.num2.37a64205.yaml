stem:
  en: This question is about an inductor or a capacitor in an alternating circuit.
    The inductive reactance, XL, is 100 Ω and the inductance, L, is 200 mH. Find the
    angular frequency of the supply.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: XL = w x L.'
- level: 2
  en: The relation already gives the angular frequency directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 200 mH as 0.2 H, then write w = XL / L, where w is the angular
    frequency, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the angular frequency have, and roughly
    how large is it?
