solution_steps:
- en: 'Write the relation: series: 1/C = 1/C1 + 1/C2, so C = C1 x C2 / (C1 + C2).'
- en: 'Put each quantity in SI units: 8 μF = 8 x 10^-6 F.'
- en: 'Substitute: Cs = (8 x 10^-6) x (8 x 10^-6) / ((8 x 10^-6) + (8 x 10^-6)).'
- en: 'Calculate: Cs = 4 x 10^-6 F.'
- en: 'Give it in μF: 4 μF.'
- en: So the series capacitance is 4 μF.
