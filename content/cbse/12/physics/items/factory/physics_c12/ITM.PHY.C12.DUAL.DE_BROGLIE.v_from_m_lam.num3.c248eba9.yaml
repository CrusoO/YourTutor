solution_steps:
- en: 'Write the relation: wavelength = h / [m x v], so v = h / [m x wavelength].'
- en: 'Put each quantity in SI units: 0.25 nm = 2.5 x 10^-10 m.'
- en: 'Substitute: v = (6.63 x 10^-34) / ((1.326 x 10^-26) x (2.5 x 10^-10)).'
- en: 'Calculate: v = 200 m/s.'
- en: So the speed is 200 m/s.
- en: The correct option is c.
