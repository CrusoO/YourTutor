solution_steps:
- en: 'Write the relation: U = (1/2) x L x I^2.'
- en: 'Put each quantity in SI units: 200 mH = 0.2 H.'
- en: 'Substitute: U = 0.2 x 5^2 / 2.'
- en: 'Calculate: U = 2.5 J.'
- en: 'Give it in mJ: 2500 mJ.'
- en: So the stored energy is 2500 mJ.
- en: The correct option is a.
