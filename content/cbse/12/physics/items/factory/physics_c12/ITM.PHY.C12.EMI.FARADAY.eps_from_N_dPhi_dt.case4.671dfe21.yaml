solution_steps:
- en: 'Write the relation: emf = N x flux change / time.'
- en: 'Put each quantity in SI units: 1 mWb = 0.001 Wb; 20 ms = 0.02 s.'
- en: 'Substitute: eps = 100 x 0.001 / 0.02.'
- en: 'Calculate: eps = 5 V.'
- en: So the induced emf is 5 V.
- en: The correct option is b.
