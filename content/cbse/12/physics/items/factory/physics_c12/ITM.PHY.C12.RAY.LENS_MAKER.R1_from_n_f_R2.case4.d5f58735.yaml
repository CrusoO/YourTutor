solution_steps:
- en: 'Write the relation: 1/f = (n - 1) x (1/R1 + 1/R2), so 1/R1 = 1/((n - 1) x f)
    - 1/R2.'
- en: 'Put each quantity in SI units: 15 cm = 0.15 m; 30 cm = 0.3 m.'
- en: 'Substitute: R1 = 1 / (1 / ((1.5 - 1) x 0.15) - 1 / 0.3).'
- en: 'Calculate: R1 = 0.1 m.'
- en: 'Give it in cm: 10 cm.'
- en: So the first radius is 10 cm.
- en: The correct option is b.
