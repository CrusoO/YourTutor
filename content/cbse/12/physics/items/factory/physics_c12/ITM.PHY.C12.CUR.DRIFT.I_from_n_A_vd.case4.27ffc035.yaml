stem:
  en: 'Case: a student investigates current carried by free electrons in a wire and
    records the following. The free electron density, n, is 5 x 10^28 m⁻³, the cross-sectional
    area, A, is 2.5 mm² and the drift speed, vd, is 0.1 mm/s. Find the current in
    the wire. Take the charge of one electron, e, = 1.6 x 10^-19 C.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: I = n x e x A x v_d.'
- level: 2
  en: The relation already gives the current directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 2.5 mm² as 2.5 x 10^-6 m² and 0.1 mm/s as 1 x 10^-4 m/s,
    then write I = n x e x A x vd, where I is the current, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
