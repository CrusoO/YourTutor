solution_steps:
- en: 'Write the relation: I = n x e x A x v_d.'
- en: 'Put each quantity in SI units: 2.5 mm² = 2.5 x 10^-6 m²; 0.1 mm/s = 1 x 10^-4
    m/s.'
- en: 'Substitute: I = (5 x 10^28) x (1.6 x 10^-19) x (2.5 x 10^-6) x (1 x 10^-4).'
- en: 'Calculate: I = 2 A.'
- en: So the current is 2 A.
