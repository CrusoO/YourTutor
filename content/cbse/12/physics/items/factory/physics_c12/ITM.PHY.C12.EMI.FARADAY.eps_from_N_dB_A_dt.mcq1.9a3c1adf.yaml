- en: 'Write the relation: flux change = dB x A, then emf = N x [flux change] / time.'
- en: 'Put each quantity in SI units: 50 cm² = 0.005 m²; 100 ms = 0.1 s.'
- en: 'Substitute: eps = 500 x 0.2 x 0.005 / 0.1.'
- en: 'Calculate: eps = 5 V.'
- en: So the induced emf is 5 V.
