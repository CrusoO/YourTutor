stem:
  en: The number of turns, N, is 500, the field changes by 0.2 T, the area of the
    coil, A, is 50 cm² and the change takes 100 ms. Find the magnitude of the induced
    emf.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: flux change = dB x A, then emf = N x [flux change] / time.'
- level: 2
  en: The relation already gives the induced emf directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 50 cm² as 0.005 m² and 100 ms as 0.1 s, then write eps =
    N x dB x A / dt, where eps is the induced emf, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the induced emf have, and roughly how
    large is it?
