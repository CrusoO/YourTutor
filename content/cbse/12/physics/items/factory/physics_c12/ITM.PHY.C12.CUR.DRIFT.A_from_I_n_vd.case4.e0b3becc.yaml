solution_steps:
- en: 'Write the relation: I = n x e x A x v_d.'
- en: 'Put each quantity in SI units: 0.5 mm/s = 5 x 10^-4 m/s.'
- en: 'Get the cross section alone: divide each side by n x e x v_d.'
- en: 'Substitute: A = 12.8 / ((8 x 10^28) x (1.6 x 10^-19) x (5 x 10^-4)).'
- en: 'Calculate: A = 2 x 10^-6 m².'
- en: 'Give it in mm²: 2 mm².'
- en: So the cross section is 2 mm².
- en: The correct option is a.
