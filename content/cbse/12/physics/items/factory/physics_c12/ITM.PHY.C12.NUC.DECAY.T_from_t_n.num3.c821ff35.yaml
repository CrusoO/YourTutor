solution_steps:
- en: 'Plan: the number of half-lives is t / T.'
- en: 'Put each quantity in SI units: 15 days = 1.296 x 10^6 s.'
- en: 'Substitute: T = (1.296 x 10^6) / 3.'
- en: 'Calculate: T = 432000 s.'
- en: 'Give it in days: 5 days.'
- en: So the half-life is 5 days.
- en: The correct option is c.
