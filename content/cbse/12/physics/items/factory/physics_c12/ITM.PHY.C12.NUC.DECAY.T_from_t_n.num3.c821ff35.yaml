stem:
  en: A student is studying a radioactive sample decaying by half-lives. The time
    that passes, t, is 15 days and the number of half-lives that pass, n, is 3. Find
    the half-life.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Plan the steps: the
    number of half-lives is t / T.'
- level: 2
  en: Work through the plan one step at a time. Change every quantity to SI units
    first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 15 days as 1.296 x 10^6 s, then write T = t / n, where T
    is the half-life, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the half-life have, and roughly how large
    is it?
