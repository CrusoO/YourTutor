solution_steps:
- en: 'Write the relation: F = q x v x B x sine of the angle.'
- en: 'Get the field alone: divide each side by q x v x sine of the angle.'
- en: 'Substitute: B = (6.4 x 10^-14) / ((3.2 x 10^-19) x (1 x 10^6) x 1).'
- en: 'Calculate: B = 0.2 T.'
- en: 'Give it in mT: 200 mT.'
- en: So the field is 200 mT.
