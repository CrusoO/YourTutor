solution_steps:
- en: 'Write the relation: U = (1/2) x L x I^2.'
- en: 'Put each quantity in SI units: 2500 mJ = 2.5 J.'
- en: 'Substitute: L = 2 x 2.5 / 5^2.'
- en: 'Calculate: L = 0.2 H.'
- en: 'Give it in mH: 200 mH.'
- en: So the inductance is 200 mH.
- en: The correct option is c.
