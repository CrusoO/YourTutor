solution_steps:
- en: 'Write the relation: XL = w x L.'
- en: 'Put each quantity in SI units: 50 mH = 0.05 H.'
- en: 'Substitute: XL = 500 x 0.05.'
- en: 'Calculate: XL = 25 Ω.'
- en: So the inductive reactance is 25 Ω.
