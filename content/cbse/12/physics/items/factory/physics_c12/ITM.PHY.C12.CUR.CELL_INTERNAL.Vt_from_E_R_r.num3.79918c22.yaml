solution_steps:
- en: 'Write the relation: I = E / (R + r), and the terminal voltage is V = I x R.'
- en: 'Substitute: Vt = 9 x 9 / (9 + 1).'
- en: 'Calculate: Vt = 8.1 V.'
- en: So the terminal voltage is 8.1 V.
- en: The correct option is b.
