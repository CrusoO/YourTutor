solution_steps:
- en: 'Write the relation: series: 1/C = 1/C1 + 1/C2, so C = C1 x C2 / (C1 + C2).'
- en: 'Put each quantity in SI units: 12 μF = 1.2 x 10^-5 F; 6 μF = 6 x 10^-6 F.'
- en: 'Substitute: Cs = (1.2 x 10^-5) x (6 x 10^-6) / ((1.2 x 10^-5) + (6 x 10^-6)).'
- en: 'Calculate: Cs = 4 x 10^-6 F.'
- en: 'Give it in μF: 4 μF.'
- en: So the series capacitance is 4 μF.
- en: The correct option is d.
