solution_steps:
- en: 'Write the relation: the shunt takes the extra current: Ig x G = (I - Ig) x
    S.'
- en: 'Put each quantity in SI units: 10 mA = 0.01 A; 510 mA = 0.51 A.'
- en: 'Get the shunt alone: divide each side of Ig x G = (I - Ig) x S by (I - Ig).'
- en: 'Substitute: S = 200 x 0.01 / (0.51 - 0.01).'
- en: 'Calculate: S = 4 Ω.'
- en: So the shunt is 4 Ω.
- en: The correct option is b.
