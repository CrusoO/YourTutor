solution_steps:
- en: 'Write the relation: emf = B x l x v.'
- en: 'Put each quantity in SI units: 200 mV = 0.2 V; 200 mT = 0.2 T.'
- en: 'Get the rod length alone: divide each side by B x v.'
- en: 'Substitute: l = 0.2 / (0.2 x 5).'
- en: 'Calculate: l = 0.2 m.'
- en: 'Give it in cm: 20 cm.'
- en: So the rod length is 20 cm.
- en: The correct option is b.
