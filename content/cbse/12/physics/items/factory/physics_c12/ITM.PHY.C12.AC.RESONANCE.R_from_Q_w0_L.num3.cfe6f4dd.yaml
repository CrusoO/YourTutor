solution_steps:
- en: 'Write the relation: Q = w0 x L / R.'
- en: 'Put each quantity in SI units: 200 mH = 0.2 H.'
- en: 'Substitute: R = 1000 x 0.2 / 8.'
- en: 'Calculate: R = 25 Ω.'
- en: So the resistance is 25 Ω.
- en: The correct option is b.
