solution_steps:
- en: 'Write the relation: torque = p x E x sine of the angle.'
- en: 'Substitute: tau = (2 x 10^-8) x 5000 x 0.8.'
- en: 'Calculate: tau = 8 x 10^-5 N m.'
- en: So the torque is 8 x 10^-5 N m.
