solution_steps:
- en: 'Write the relation: emf = B x l x v.'
- en: 'Put each quantity in SI units: 100 mT = 0.1 T; 10 cm = 0.1 m.'
- en: 'Substitute: eps = 0.1 x 0.1 x 2.'
- en: 'Calculate: eps = 0.02 V.'
- en: 'Give it in mV: 20 mV.'
- en: So the induced emf is 20 mV.
- en: The correct option is c.
