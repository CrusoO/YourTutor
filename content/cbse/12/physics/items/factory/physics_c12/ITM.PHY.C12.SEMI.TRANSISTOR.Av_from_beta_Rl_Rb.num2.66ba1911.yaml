solution_steps:
- en: 'Write the relation: voltage gain = beta x load resistance / input resistance.'
- en: 'Put each quantity in SI units: 5 kΩ = 5000 Ω; 1 kΩ = 1000 Ω.'
- en: 'Substitute: Av = 20 x 5000 / 1000.'
- en: 'Calculate: Av = 100.'
- en: So the voltage gain is 100.
