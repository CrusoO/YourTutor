solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Put each quantity in SI units: 2 nC = 2 x 10^-9 C; 5 cm = 0.05 m.'
- en: 'Substitute: E = (9 x 10^9) x (2 x 10^-9) / 0.05^2.'
- en: 'Calculate: E = 7200 N/C.'
- en: So the electric field is 7200 N/C.
