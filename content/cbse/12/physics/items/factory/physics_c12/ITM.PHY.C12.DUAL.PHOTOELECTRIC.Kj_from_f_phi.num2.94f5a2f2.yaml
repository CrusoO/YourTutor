solution_steps:
- en: 'Write the relation: K = h x f - work function [all in joules].'
- en: 'Put each quantity in SI units: 2 eV = 3.2 x 10^-19 J.'
- en: 'Substitute: Kj = (6.63 x 10^-34) x (5 x 10^14) - (3.2 x 10^-19).'
- en: 'Calculate: Kj = 1.15 x 10^-20 J.'
- en: So the maximum kinetic energy is 1.15 x 10^-20 J.
- en: The correct option is c.
