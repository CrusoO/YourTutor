solution_steps:
- en: 'Write the relation: parallel: Cp = C1 + C2.'
- en: 'Put each quantity in SI units: 18 μF = 1.8 x 10^-5 F; 12 μF = 1.2 x 10^-5 F.'
- en: 'Get the second capacitance alone: subtract C1 from each side.'
- en: 'Substitute: C2 = (1.8 x 10^-5) - (1.2 x 10^-5).'
- en: 'Calculate: C2 = 6 x 10^-6 F.'
- en: 'Give it in μF: 6 μF.'
- en: So the second capacitance is 6 μF.
- en: The correct option is d.
