solution_steps:
- en: 'Write the relation: Z = square root of (R^2 + (XL - XC)^2), then I = V / Z.'
- en: 'Substitute: I = 130 / sqrt(24^2 + (40 - 33)^2).'
- en: 'Calculate: I = 5.2 A.'
- en: So the rms current is 5.2 A.
- en: The correct option is c.
