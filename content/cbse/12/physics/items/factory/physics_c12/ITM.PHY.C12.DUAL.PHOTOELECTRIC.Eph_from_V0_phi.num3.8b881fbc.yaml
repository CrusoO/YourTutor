solution_steps:
- en: 'Write the relation: e x V0 = K = photon energy - work function, so photon energy
    = e x V0 + work function.'
- en: 'Put each quantity in SI units: 2.5 eV = 4 x 10^-19 J.'
- en: 'Substitute: Eph = (1.6 x 10^-19) x 3.5 + (4 x 10^-19).'
- en: 'Calculate: Eph = 9.6 x 10^-19 J.'
- en: 'Give it in eV: 6 eV.'
- en: So the photon energy is 6 eV.
- en: The correct option is a.
