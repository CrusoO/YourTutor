stem:
  en: A student is studying the photoelectric effect at a metal surface. The stopping
    potential, V0, is 3.5 V and the work function of the metal, phi, is 2.5 eV. Find
    the energy of each photon. Take the charge of one electron, e, = 1.6 x 10^-19
    C.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: e x V0 = K = photon energy - work function, so photon energy = e x
    V0 + work function.'
- level: 2
  en: The relation already gives the photon energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 2.5 eV as 4 x 10^-19 J, then write Eph = e x V0 + phi, where
    Eph is the photon energy, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the photon energy have, and roughly how
    large is it?
