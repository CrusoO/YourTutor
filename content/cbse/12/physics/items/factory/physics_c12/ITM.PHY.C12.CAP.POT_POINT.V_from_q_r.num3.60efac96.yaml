solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 5 μC = 5 x 10^-6 C.'
- en: 'Substitute: V = (9 x 10^9) x (5 x 10^-6) / 30.'
- en: 'Calculate: V = 1500 V.'
- en: So the potential is 1500 V.
- en: The correct option is b.
