solution_steps:
- en: 'Write the relation: w0 = 1 / square root of [L x C].'
- en: 'Put each quantity in SI units: 250 mH = 0.25 H; 16 μF = 1.6 x 10^-5 F.'
- en: 'Substitute: w0 = 1 / sqrt(0.25 x (1.6 x 10^-5)).'
- en: 'Calculate: w0 = 500 rad/s.'
- en: So the resonant angular frequency is 500 rad/s.
- en: The correct option is a.
