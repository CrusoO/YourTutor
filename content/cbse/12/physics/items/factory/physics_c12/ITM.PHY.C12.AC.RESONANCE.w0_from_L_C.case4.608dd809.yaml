stem:
  en: 'Case: a student investigates a series LCR circuit at resonance and records
    the following. The inductance, L, is 250 mH and the capacitance, C, is 16 μF.
    Find the resonant angular frequency.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: w0 = 1 / square root of [L x C].'
- level: 2
  en: The relation already gives the resonant angular frequency directly, so decide
    what to substitute. Change every quantity to SI units first, and change back at
    the end if asked.
- level: 3
  en: 'First step: Write 250 mH as 0.25 H and 16 μF as 1.6 x 10^-5 F, then write w0
    = 1 / sqrt[L x C], where w0 is the resonant angular frequency, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the resonant angular frequency have,
    and roughly how large is it?
