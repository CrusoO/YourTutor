solution_steps:
- en: 'Write the relation: q x v x B = m x v^2 / r, so v = q x B x r / m.'
- en: 'Put each quantity in SI units: 10 cm = 0.1 m; 200 mT = 0.2 T.'
- en: 'Substitute: v = (1.6 x 10^-19) x 0.2 x 0.1 / (3.2 x 10^-27).'
- en: 'Calculate: v = 1 x 10^6 m/s.'
- en: So the speed is 1 x 10^6 m/s.
- en: The correct option is b.
