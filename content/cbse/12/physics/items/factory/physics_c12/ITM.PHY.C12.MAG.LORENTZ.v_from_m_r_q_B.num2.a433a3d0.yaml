stem:
  en: This question is about a charged particle moving in a magnetic field. Its mass,
    m, is 3.2 x 10^-27 kg, the radius of its circular path, r, is 10 cm, the charge
    of the particle, q, is 1.6 x 10^-19 C and the magnetic field, B, is 200 mT. Find
    the speed of the particle.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: q x v x B = m x v^2 / r, so v = q x B x r / m.'
- level: 2
  en: The relation already gives the speed directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 10 cm as 0.1 m and 200 mT as 0.2 T, then write v = q x B
    x r / m, where v is the speed, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the speed have, and roughly how large
    is it?
