solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 700 nm = 7 x 10^-7 m; 0.4 mm = 4 x 10^-4 m.'
- en: 'Substitute: beta = (7 x 10^-7) x 0.5 / (4 x 10^-4).'
- en: 'Calculate: beta = 8.75 x 10^-4 m.'
- en: 'Give it in mm: 0.875 mm.'
- en: So the fringe width is 0.875 mm.
- en: The correct option is b.
