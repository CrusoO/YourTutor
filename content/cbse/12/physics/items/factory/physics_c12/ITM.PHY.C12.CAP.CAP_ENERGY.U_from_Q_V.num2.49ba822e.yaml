solution_steps:
- en: 'Write the relation: U = (1/2) x Q x V.'
- en: 'Put each quantity in SI units: 50 μC = 5 x 10^-5 C.'
- en: 'Substitute: U = (5 x 10^-5) x 10 / 2.'
- en: 'Calculate: U = 2.5 x 10^-4 J.'
- en: 'Give it in μJ: 250 μJ.'
- en: So the stored energy is 250 μJ.
- en: The correct option is a.
