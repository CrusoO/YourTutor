solution_steps:
- en: 'Write the relation: U = Q^2 / (2 x C).'
- en: 'Put each quantity in SI units: 400 μC = 4 x 10^-4 C; 20 μF = 2 x 10^-5 F.'
- en: 'Substitute: U = (4 x 10^-4)^2 / (2 x (2 x 10^-5)).'
- en: 'Calculate: U = 0.004 J.'
- en: 'Give it in μJ: 4000 μJ.'
- en: So the stored energy is 4000 μJ.
- en: The correct option is b.
