solution_steps:
- en: 'Write the relation: XL = w x L.'
- en: 'Get the inductance alone: divide each side by w.'
- en: 'Substitute: L = 5 / 100.'
- en: 'Calculate: L = 0.05 H.'
- en: 'Give it in mH: 50 mH.'
- en: So the inductance is 50 mH.
- en: The correct option is b.
