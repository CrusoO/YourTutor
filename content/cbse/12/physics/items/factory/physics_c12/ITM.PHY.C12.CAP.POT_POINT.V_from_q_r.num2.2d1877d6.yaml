solution_steps:
- en: 'Write the relation: V = k x q / r.'
- en: 'Put each quantity in SI units: 1 μC = 1 x 10^-6 C; 15 cm = 0.15 m.'
- en: 'Substitute: V = (9 x 10^9) x (1 x 10^-6) / 0.15.'
- en: 'Calculate: V = 60000 V.'
- en: So the potential is 60000 V.
- en: The correct option is a.
