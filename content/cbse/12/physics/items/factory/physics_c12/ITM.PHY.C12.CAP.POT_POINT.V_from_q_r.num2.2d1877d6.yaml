stem:
  en: This question is about the electric potential of a point charge. The charge,
    q, is 1 μC and the distance from the charge, r, is 15 cm. Find the potential at
    that point. Take k = 9 x 10^9 N m²/C².
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: V = k x q / r.'
- level: 2
  en: The relation already gives the potential directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 1 μC as 1 x 10^-6 C and 15 cm as 0.15 m, then write V = k
    x q / r, where V is the potential, with the values in place, one quantity at a
    time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential have, and roughly how large
    is it?
