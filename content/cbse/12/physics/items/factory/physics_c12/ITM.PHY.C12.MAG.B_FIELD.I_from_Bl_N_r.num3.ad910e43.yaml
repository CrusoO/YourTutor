stem:
  en: A student is studying the magnetic field of a current. The field at the centre
    of the loop, Bl, is 125.6 μT, the number of turns, N, is 10 and the distance,
    r, is 5 cm. Find the current in the coil. Take the permeability of free space,
    mu0, = 1.256 x 10^-6 N/A².
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: B = mu0 x N x I / (2 x r) at the centre of a circular coil.'
- level: 2
  en: 'Get the current on its own before you put numbers in: multiply each side by
    2 x r and divide each side by mu0 x N. Do the same operation to each side of the
    formula. Change every quantity to SI units first, and change back at the end if
    asked.'
- level: 3
  en: 'First step: Write 125.6 μT as 1.256 x 10^-4 T and 5 cm as 0.05 m, then write
    I = 2 x r x Bl / (mu0 x N), where I is the current, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
