solution_steps:
- en: 'Write the relation: B = mu0 x N x I / (2 x r) at the centre of a circular coil.'
- en: 'Put each quantity in SI units: 125.6 μT = 1.256 x 10^-4 T; 5 cm = 0.05 m.'
- en: 'Get the current alone: multiply each side by 2 x r and divide each side by
    mu0 x N.'
- en: 'Substitute: I = 2 x 0.05 x (1.256 x 10^-4) / ((1.256 x 10^-6) x 10).'
- en: 'Calculate: I = 1 A.'
- en: So the current is 1 A.
