stem:
  en: This question is about the wave nature of a moving particle. Its mass, m, is
    6.63 x 10^-28 kg and its speed, v, is 10000 m/s. Find the de Broglie wavelength.
    Take Planck's constant, h, = 6.63 x 10^-34 J s.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: p = m x v, then wavelength = h / p.'
- level: 2
  en: The relation already gives the de Broglie wavelength directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: write lam = h / [m x v], where lam is the de Broglie wavelength,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the de Broglie wavelength have, and roughly
    how large is it?
