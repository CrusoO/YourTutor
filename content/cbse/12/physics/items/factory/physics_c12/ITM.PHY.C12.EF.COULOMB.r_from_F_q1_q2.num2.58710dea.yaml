solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 2 nC = 2 x 10^-9 C.'
- en: 'Get the separation alone: multiply each side by r^2 and divide each side by
    F, then take the square root.'
- en: 'Substitute: r = sqrt((9 x 10^9) x (2 x 10^-9) x (2 x 10^-9) / (1.44 x 10^-9)).'
- en: 'Calculate: r = 5 m.'
- en: So the separation is 5 m.
- en: The correct option is b.
