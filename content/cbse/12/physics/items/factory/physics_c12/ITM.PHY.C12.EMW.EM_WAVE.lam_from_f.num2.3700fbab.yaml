solution_steps:
- en: 'Write the relation: c = f x wavelength.'
- en: 'Put each quantity in SI units: 100 MHz = 1 x 10^8 Hz.'
- en: 'Get the wavelength alone: divide each side by the frequency.'
- en: 'Substitute: lam = (3 x 10^8) / (1 x 10^8).'
- en: 'Calculate: lam = 3 m.'
- en: So the wavelength is 3 m.
- en: The correct option is a.
