solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 10 μC = 1 x 10^-5 C; 4 μC = 4 x 10^-6 C; 10
    cm = 0.1 m.'
- en: 'Substitute: F = (9 x 10^9) x (1 x 10^-5) x (4 x 10^-6) / 0.1^2.'
- en: 'Calculate: F = 36 N.'
- en: So the force is 36 N.
