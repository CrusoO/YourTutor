stem:
  en: 'Case: a student investigates the wave nature of a moving particle and records
    the following. Its mass, m, is 1.326 x 10^-26 kg and the de Broglie wavelength,
    lam, is 1 nm. Find the speed of the particle. Take Planck''s constant, h, = 6.63
    x 10^-34 J s.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: wavelength = h / [m x v], so v = h / [m x wavelength].'
- level: 2
  en: The relation already gives the speed directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 1 nm as 1 x 10^-9 m, then write v = h / [m x lam], where
    v is the speed, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the speed have, and roughly how large
    is it?
