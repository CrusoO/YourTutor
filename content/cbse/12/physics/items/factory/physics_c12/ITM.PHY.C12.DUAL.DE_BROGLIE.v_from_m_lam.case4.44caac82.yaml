solution_steps:
- en: 'Write the relation: wavelength = h / [m x v], so v = h / [m x wavelength].'
- en: 'Put each quantity in SI units: 1 nm = 1 x 10^-9 m.'
- en: 'Substitute: v = (6.63 x 10^-34) / ((1.326 x 10^-26) x (1 x 10^-9)).'
- en: 'Calculate: v = 50 m/s.'
- en: So the speed is 50 m/s.
- en: The correct option is b.
