stem:
  en: The maximum kinetic energy of the emitted electrons, K, is 2 eV and the work
    function of the metal, phi, is 2 eV. Find the energy of each photon.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: K = photon energy - work function.'
- level: 2
  en: The relation already gives the photon energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 2 eV as 3.2 x 10^-19 J, then write Eph = K + phi, where Eph
    is the photon energy, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the photon energy have, and roughly how
    large is it?
