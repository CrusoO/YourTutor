solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 0.48 mm = 4.8 x 10^-4 m; 1 mm = 0.001 m.'
- en: 'Get the wavelength alone: multiply each side by d and divide each side by D.'
- en: 'Substitute: lam = (4.8 x 10^-4) x 0.001 / 1.2.'
- en: 'Calculate: lam = 4 x 10^-7 m.'
- en: 'Give it in nm: 400 nm.'
- en: So the wavelength is 400 nm.
- en: The correct option is d.
