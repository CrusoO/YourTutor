solution_steps:
- en: 'Write the relation: U = (1/2) x L x I^2.'
- en: 'Put each quantity in SI units: 400 mJ = 0.4 J.'
- en: 'Substitute: L = 2 x 0.4 / 2^2.'
- en: 'Calculate: L = 0.2 H.'
- en: 'Give it in mH: 200 mH.'
- en: So the inductance is 200 mH.
- en: The correct option is d.
