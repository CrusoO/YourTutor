solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 10 nC = 1 x 10^-8 C; 30 cm = 0.3 m.'
- en: 'Get the second charge alone: multiply each side by r^2 and divide each side
    by k x q1.'
- en: 'Substitute: q2 = (5 x 10^-6) x 0.3^2 / ((9 x 10^9) x (1 x 10^-8)).'
- en: 'Calculate: q2 = 5 x 10^-9 C.'
- en: 'Give it in nC: 5 nC.'
- en: So the second charge is 5 nC.
- en: The correct option is c.
