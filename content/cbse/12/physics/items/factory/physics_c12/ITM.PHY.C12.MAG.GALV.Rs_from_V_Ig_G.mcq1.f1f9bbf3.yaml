solution_steps:
- en: 'Write the relation: V = Ig x (G + Rs), so Rs = V / Ig - G.'
- en: 'Put each quantity in SI units: 5 mA = 0.005 A.'
- en: 'Substitute: Rs = 10 / 0.005 - 50.'
- en: 'Calculate: Rs = 1950 Ω.'
- en: So the series resistance is 1950 Ω.
- en: The correct option is c.
