solution_steps:
- en: 'Write the relation: p = q x d, charge times separation.'
- en: 'Put each quantity in SI units: 1 nC = 1 x 10^-9 C; 5 cm = 0.05 m.'
- en: 'Substitute: p = (1 x 10^-9) x 0.05.'
- en: 'Calculate: p = 5 x 10^-11 C m.'
- en: So the dipole moment is 5 x 10^-11 C m.
- en: The correct option is d.
