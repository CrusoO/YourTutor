solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 2.4 mm = 0.0024 m; 400 nm = 4 x 10^-7 m; 0.2
    mm = 2 x 10^-4 m.'
- en: 'Substitute: D = 0.0024 x (2 x 10^-4) / (4 x 10^-7).'
- en: 'Calculate: D = 1.2 m.'
- en: So the screen distance is 1.2 m.
- en: The correct option is b.
