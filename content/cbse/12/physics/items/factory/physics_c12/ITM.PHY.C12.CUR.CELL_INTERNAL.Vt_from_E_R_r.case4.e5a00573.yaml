stem:
  en: 'Case: a student investigates a cell with internal resistance driving a resistor
    and records the following. The emf of the cell, E, is 6 V, the external resistor,
    R, is 3 Ω and its internal resistance, r, is 1 Ω. Find the terminal voltage of
    the cell.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: I = E / (R + r), and the terminal voltage is V = I x R.'
- level: 2
  en: The relation already gives the terminal voltage directly, so decide what to
    substitute.
- level: 3
  en: 'First step: write Vt = E x R / (R + r), where Vt is the terminal voltage, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the terminal voltage have, and roughly
    how large is it?
