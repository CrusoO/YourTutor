solution_steps:
- en: 'Write the relation: I = E / (R + r), and the terminal voltage is V = I x R.'
- en: 'Substitute: Vt = 6 x 3 / (3 + 1).'
- en: 'Calculate: Vt = 4.5 V.'
- en: So the terminal voltage is 4.5 V.
