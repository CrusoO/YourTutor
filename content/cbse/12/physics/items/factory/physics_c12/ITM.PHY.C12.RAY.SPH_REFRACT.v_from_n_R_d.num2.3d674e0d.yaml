solution_steps:
- en: 'Write the relation: n/v - 1/d = (n - 1)/R, with the distances as positive numbers
    for a real object and a real image in the glass.'
- en: 'Put each quantity in SI units: 30 cm = 0.3 m; 10 cm = 0.1 m.'
- en: 'Substitute: v = 2 x 0.3 x 0.1 / ((2 - 1) x 0.1 + 0.3).'
- en: 'Calculate: v = 0.15 m.'
- en: 'Give it in cm: 15 cm.'
- en: So the image distance is 15 cm.
- en: The correct option is c.
