solution_steps:
- en: 'Write the relation: B = mu0 x relative permeability x H.'
- en: 'Substitute: B = (1.256 x 10^-6) x 200 x 50.'
- en: 'Calculate: B = 0.01256 T.'
- en: 'Give it in mT: 12.56 mT.'
- en: So the magnetic field is 12.56 mT.
