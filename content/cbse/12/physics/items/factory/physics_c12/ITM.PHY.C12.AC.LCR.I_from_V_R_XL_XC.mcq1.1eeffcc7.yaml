solution_steps:
- en: 'Write the relation: Z = square root of (R^2 + (XL - XC)^2), then I = V / Z.'
- en: 'Substitute: I = 200 / sqrt(7^2 + (34 - 10)^2).'
- en: 'Calculate: I = 8 A.'
- en: So the rms current is 8 A.
- en: The correct option is c.
