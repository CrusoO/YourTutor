stem:
  en: A student is studying two capacitors joined together. The first capacitor, C1,
    is 10 μF and the second capacitor, C2, is 15 μF. Find the capacitance of the series
    combination.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: series: 1/C = 1/C1 + 1/C2, so C = C1 x C2 / (C1 + C2).'
- level: 2
  en: The relation already gives the series capacitance directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 10 μF as 1 x 10^-5 F and 15 μF as 1.5 x 10^-5 F, then write
    Cs = C1 x C2 / (C1 + C2), where Cs is the series capacitance, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the series capacitance have, and roughly
    how large is it?
