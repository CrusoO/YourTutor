solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 1 nC = 1 x 10^-9 C; 5 nC = 5 x 10^-9 C; 30 cm
    = 0.3 m.'
- en: 'Substitute: F = (9 x 10^9) x (1 x 10^-9) x (5 x 10^-9) / 0.3^2.'
- en: 'Calculate: F = 5 x 10^-7 N.'
- en: So the force is 5 x 10^-7 N.
