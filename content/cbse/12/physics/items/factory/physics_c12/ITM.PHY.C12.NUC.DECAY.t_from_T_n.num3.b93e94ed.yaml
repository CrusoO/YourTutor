solution_steps:
- en: 'Plan: the number of half-lives is t / T.'
- en: 'Put each quantity in SI units: 5 days = 432000 s.'
- en: 'Substitute: t = 3 x 432000.'
- en: 'Calculate: t = 1.296 x 10^6 s.'
- en: 'Give it in days: 15 days.'
- en: So the time is 15 days.
- en: The correct option is d.
