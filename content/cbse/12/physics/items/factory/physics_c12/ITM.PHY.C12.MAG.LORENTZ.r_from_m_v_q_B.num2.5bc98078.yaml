stem:
  en: This question is about a charged particle moving in a magnetic field. Its mass,
    m, is 3.2 x 10^-27 kg, its speed, v, is 1 x 10^6 m/s, the charge of the particle,
    q, is 1.6 x 10^-19 C and the magnetic field, B, is 200 mT. Find the radius of
    the circular path.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: the magnetic force gives the centripetal force: q x v x B = m x v^2
    / r, so r = m x v / [q x B].'
- level: 2
  en: The relation already gives the radius directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 200 mT as 0.2 T, then write r = m x v / [q x B], where r
    is the radius, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the radius have, and roughly how large
    is it?
