solution_steps:
- en: 'Write the relation: the magnetic force gives the centripetal force: q x v x
    B = m x v^2 / r, so r = m x v / [q x B].'
- en: 'Put each quantity in SI units: 200 mT = 0.2 T.'
- en: 'Substitute: r = (3.2 x 10^-27) x (1 x 10^6) / ((1.6 x 10^-19) x 0.2).'
- en: 'Calculate: r = 0.1 m.'
- en: 'Give it in cm: 10 cm.'
- en: So the radius is 10 cm.
