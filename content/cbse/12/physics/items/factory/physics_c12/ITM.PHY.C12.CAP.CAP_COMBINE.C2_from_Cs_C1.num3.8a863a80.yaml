solution_steps:
- en: 'Write the relation: series: 1/Cs = 1/C1 + 1/C2.'
- en: 'Put each quantity in SI units: 6 μF = 6 x 10^-6 F; 9 μF = 9 x 10^-6 F.'
- en: 'Get the second capacitance alone: write 1/C2 = 1/Cs - 1/C1 and combine the
    fractions.'
- en: 'Substitute: C2 = (6 x 10^-6) x (9 x 10^-6) / ((9 x 10^-6) - (6 x 10^-6)).'
- en: 'Calculate: C2 = 1.8 x 10^-5 F.'
- en: 'Give it in μF: 18 μF.'
- en: So the second capacitance is 18 μF.
- en: The correct option is b.
