- en: 'Write the relation: Z = square root of (R^2 + (XL - XC)^2), then I = V / Z.'
- en: 'Substitute: I = 250 / sqrt(16^2 + (30 - 18)^2).'
- en: 'Calculate: I = 12.5 A.'
- en: So the rms current is 12.5 A.
