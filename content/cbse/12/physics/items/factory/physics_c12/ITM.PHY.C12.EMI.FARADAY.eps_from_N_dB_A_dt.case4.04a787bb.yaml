solution_steps:
- en: 'Write the relation: flux change = dB x A, then emf = N x [flux change] / time.'
- en: 'Put each quantity in SI units: 50 cm² = 0.005 m²; 10 ms = 0.01 s.'
- en: 'Substitute: eps = 100 x 0.5 x 0.005 / 0.01.'
- en: 'Calculate: eps = 25 V.'
- en: So the induced emf is 25 V.
- en: The correct option is d.
