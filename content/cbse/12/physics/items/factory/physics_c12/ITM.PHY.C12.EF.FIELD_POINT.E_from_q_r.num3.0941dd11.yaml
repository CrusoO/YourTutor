stem:
  en: A student is studying the electric field of a point charge. The charge, q, is
    5 μC and the distance from the charge, r, is 30 m. Find the magnitude of the electric
    field. Take k = 9 x 10^9 N m²/C².
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: E = k x q / r^2.'
- level: 2
  en: The relation already gives the electric field directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 5 μC as 5 x 10^-6 C, then write E = k x q / r^2, where E
    is the electric field, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the electric field have, and roughly
    how large is it?
