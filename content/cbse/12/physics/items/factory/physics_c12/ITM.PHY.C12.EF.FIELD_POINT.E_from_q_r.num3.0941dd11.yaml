solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Put each quantity in SI units: 5 μC = 5 x 10^-6 C.'
- en: 'Substitute: E = (9 x 10^9) x (5 x 10^-6) / 30^2.'
- en: 'Calculate: E = 50 N/C.'
- en: So the electric field is 50 N/C.
- en: The correct option is d.
