stem:
  en: The torque on the dipole, tau, is 0.0016 N m, the uniform field, E, is 20000
    N/C and the sine of the angle between the dipole and the field, s, is 0.8. Find
    the dipole moment.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: torque = p x E x sine of the angle.'
- level: 2
  en: 'Get the dipole moment on its own before you put numbers in: divide each side
    of torque = p x E x sine of the angle by E x sine of the angle. Do the same operation
    to each side of the formula.'
- level: 3
  en: 'First step: write p = tau / [E x s], where p is the dipole moment, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the dipole moment have, and roughly how
    large is it?
