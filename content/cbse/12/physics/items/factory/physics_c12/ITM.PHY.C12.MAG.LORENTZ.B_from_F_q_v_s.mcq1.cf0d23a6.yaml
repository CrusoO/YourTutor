stem:
  en: The magnetic force, F, is 4.8 x 10^-14 N, the charge of the particle, q, is
    1.6 x 10^-19 C, its speed, v, is 1 x 10^6 m/s and the sine of the angle between
    the velocity and the field, s, is 0.6. Find the strength of the magnetic field.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: F = q x v x B x sine of the angle.'
- level: 2
  en: 'Get the field on its own before you put numbers in: divide each side by q x
    v x sine of the angle. Do the same operation to each side of the formula. Change
    every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: write B = F / [q x v x s], where B is the field, with the values
    in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the field have, and roughly how large
    is it?
