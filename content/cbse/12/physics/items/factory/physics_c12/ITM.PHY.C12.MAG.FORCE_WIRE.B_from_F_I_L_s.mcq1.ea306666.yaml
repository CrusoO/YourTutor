solution_steps:
- en: 'Write the relation: F = B x I x L x sine of the angle.'
- en: 'Put each quantity in SI units: 625 mN = 0.625 N; 50 cm = 0.5 m.'
- en: 'Get the field alone: divide each side by I x L x sine of the angle.'
- en: 'Substitute: B = 0.625 / (5 x 0.5 x 0.5).'
- en: 'Calculate: B = 0.5 T.'
- en: 'Give it in mT: 500 mT.'
- en: So the field is 500 mT.
