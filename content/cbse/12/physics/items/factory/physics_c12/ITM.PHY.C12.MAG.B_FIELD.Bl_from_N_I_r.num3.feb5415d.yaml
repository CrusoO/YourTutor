stem:
  en: A student is studying the magnetic field of a current. The number of turns,
    N, is 10, the current, I, is 2 A and the distance, r, is 5 cm. Find the field
    at the centre of the coil. Take the permeability of free space, mu0, = 1.256 x
    10^-6 N/A².
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: B = mu0 x N x I / (2 x r) at the centre of a circular coil.'
- level: 2
  en: The relation already gives the field at the centre directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: Write 5 cm as 0.05 m, then write Bl = mu0 x N x I / (2 x r), where
    Bl is the field at the centre, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the field at the centre have, and roughly
    how large is it?
