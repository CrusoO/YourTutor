solution_steps:
- en: 'Write the relation: tube length = fo + fe in normal adjustment.'
- en: 'Put each quantity in SI units: 124 cm = 1.24 m; 120 cm = 1.2 m.'
- en: 'Get the eyepiece focal length alone: subtract fo from each side.'
- en: 'Substitute: fe = 1.24 - 1.2.'
- en: 'Calculate: fe = 0.04 m.'
- en: 'Give it in cm: 4 cm.'
- en: So the eyepiece focal length is 4 cm.
- en: The correct option is b.
