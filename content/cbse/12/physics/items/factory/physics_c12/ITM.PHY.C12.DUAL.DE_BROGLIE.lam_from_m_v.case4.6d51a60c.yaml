solution_steps:
- en: 'Write the relation: p = m x v, then wavelength = h / p.'
- en: 'Substitute: lam = (6.63 x 10^-34) / ((1.326 x 10^-26) x 50).'
- en: 'Calculate: lam = 1 x 10^-9 m.'
- en: 'Give it in nm: 1 nm.'
- en: So the de Broglie wavelength is 1 nm.
- en: The correct option is b.
