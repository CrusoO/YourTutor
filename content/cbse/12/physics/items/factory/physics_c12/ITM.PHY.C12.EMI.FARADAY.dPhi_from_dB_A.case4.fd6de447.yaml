stem:
  en: 'Case: a student investigates a coil in a changing magnetic field and records
    the following. The field changes by 0.2 T and the area of the coil, A, is 50 cm².
    Find the change in magnetic flux through the coil.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: change in flux = [change in field] x area, for a field along the normal.'
- level: 2
  en: The relation already gives the change in flux directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 50 cm² as 0.005 m², then write dPhi = dB x A, where dPhi
    is the change in flux, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the change in flux have, and roughly
    how large is it?
