solution_steps:
- en: 'Write the relation: change in flux = [change in field] x area, for a field
    along the normal.'
- en: 'Put each quantity in SI units: 50 cm² = 0.005 m².'
- en: 'Substitute: dPhi = 0.2 x 0.005.'
- en: 'Calculate: dPhi = 0.001 Wb.'
- en: 'Give it in mWb: 1 mWb.'
- en: So the change in flux is 1 mWb.
- en: The correct option is b.
