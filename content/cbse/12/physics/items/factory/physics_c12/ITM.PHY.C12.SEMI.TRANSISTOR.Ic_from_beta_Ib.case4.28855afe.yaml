stem:
  en: 'Case: a student investigates a transistor in the common emitter connection
    and records the following. The current gain, beta, is 200 and the base current,
    Ib, is 100 μA. Find the collector current.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: collector current = beta x base current.'
- level: 2
  en: The relation already gives the collector current directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 100 μA as 1 x 10^-4 A, then write Ic = beta x Ib, where Ic
    is the collector current, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the collector current have, and roughly
    how large is it?
