solution_steps:
- en: 'Write the relation: collector current = beta x base current.'
- en: 'Put each quantity in SI units: 100 μA = 1 x 10^-4 A.'
- en: 'Substitute: Ic = 200 x (1 x 10^-4).'
- en: 'Calculate: Ic = 0.02 A.'
- en: 'Give it in mA: 20 mA.'
- en: So the collector current is 20 mA.
- en: The correct option is b.
