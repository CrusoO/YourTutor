stem:
  en: The capacitance, C, is 442.5 pF, the area of each plate, A, is 1000 cm² and
    the gap between the plates, d, is 4 mm. Find the dielectric constant of the material.
    Take the permittivity of free space, eps0, = 8.85 x 10^-12 C²/(N m²).
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: C = K x eps0 x A / d.'
- level: 2
  en: 'Get the dielectric constant on its own before you put numbers in: multiply
    each side by d and divide each side by eps0 x A. Do the same operation to each
    side of the formula. Change every quantity to SI units first, and change back
    at the end if asked.'
- level: 3
  en: 'First step: Write 442.5 pF as 4.425 x 10^-10 F, 1000 cm² as 0.1 m² and 4 mm
    as 0.004 m, then write K = C x d / (eps0 x A), where K is the dielectric constant,
    with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, roughly how large should the dielectric constant be?
