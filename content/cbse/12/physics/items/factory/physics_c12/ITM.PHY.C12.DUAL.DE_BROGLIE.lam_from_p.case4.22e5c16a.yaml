stem:
  en: 'Case: a student investigates the wave nature of a moving particle and records
    the following. The momentum of the particle, p, is 2.652 x 10^-24 kg m/s. Find
    the de Broglie wavelength. Take Planck''s constant, h, = 6.63 x 10^-34 J s.'
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: wavelength = h / p.'
- level: 2
  en: The relation already gives the de Broglie wavelength directly, so decide what
    to substitute. Change every quantity to SI units first, and change back at the
    end if asked.
- level: 3
  en: 'First step: write lam = h / p, where lam is the de Broglie wavelength, with
    the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the de Broglie wavelength have, and roughly
    how large is it?
