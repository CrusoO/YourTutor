- en: 'Write the relation: wavelength = h / p.'
- en: 'Substitute: lam = (6.63 x 10^-34) / (2.652 x 10^-24).'
- en: 'Calculate: lam = 2.5 x 10^-10 m.'
- en: 'Give it in nm: 0.25 nm.'
- en: So the de Broglie wavelength is 0.25 nm.
