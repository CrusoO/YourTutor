solution_steps:
- en: 'Write the relation: V = Ig x (G + Rs).'
- en: 'Put each quantity in SI units: 10 mA = 0.01 A.'
- en: 'Substitute: V = 0.01 x (100 + 200).'
- en: 'Calculate: V = 3 V.'
- en: So the voltmeter range is 3 V.
- en: The correct option is b.
