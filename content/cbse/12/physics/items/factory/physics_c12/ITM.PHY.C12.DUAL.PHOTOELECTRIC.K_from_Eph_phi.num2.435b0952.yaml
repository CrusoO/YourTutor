solution_steps:
- en: 'Write the relation: K = photon energy - work function.'
- en: 'Put each quantity in SI units: 6 eV = 9.6 x 10^-19 J; 1.5 eV = 2.4 x 10^-19
    J.'
- en: 'Substitute: K = (9.6 x 10^-19) - (2.4 x 10^-19).'
- en: 'Calculate: K = 7.2 x 10^-19 J.'
- en: 'Give it in eV: 4.5 eV.'
- en: So the maximum kinetic energy is 4.5 eV.
- en: The correct option is a.
