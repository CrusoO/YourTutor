solution_steps:
- en: 'Write the relation: U = Q^2 / (2 x C).'
- en: 'Put each quantity in SI units: 250 μC = 2.5 x 10^-4 C; 50 μF = 5 x 10^-5 F.'
- en: 'Substitute: U = (2.5 x 10^-4)^2 / (2 x (5 x 10^-5)).'
- en: 'Calculate: U = 6.25 x 10^-4 J.'
- en: 'Give it in μJ: 625 μJ.'
- en: So the stored energy is 625 μJ.
- en: The correct option is a.
