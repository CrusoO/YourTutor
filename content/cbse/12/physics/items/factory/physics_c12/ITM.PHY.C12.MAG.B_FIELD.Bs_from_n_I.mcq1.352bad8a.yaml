stem:
  en: The number of turns per metre, n, is 2000 m⁻¹ and the current, I, is 5 A. Find
    the field inside the solenoid. Take the permeability of free space, mu0, = 1.256
    x 10^-6 N/A².
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: B = mu0 x n x I inside a long solenoid.'
- level: 2
  en: The relation already gives the field inside directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: write Bs = mu0 x n x I, where Bs is the field inside, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the field inside have, and roughly how
    large is it?
