- en: 'Write the relation: B = mu0 x n x I inside a long solenoid.'
- en: 'Substitute: Bs = (1.256 x 10^-6) x 2000 x 5.'
- en: 'Calculate: Bs = 0.01256 T.'
- en: 'Give it in mT: 12.56 mT.'
- en: So the field inside is 12.56 mT.
