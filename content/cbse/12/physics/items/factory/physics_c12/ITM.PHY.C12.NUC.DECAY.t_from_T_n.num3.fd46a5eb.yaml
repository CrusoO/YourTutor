solution_steps:
- en: 'Plan: the number of half-lives is t / T.'
- en: 'Put each quantity in SI units: 2 years = 6.3072 x 10^7 s.'
- en: 'Substitute: t = 3 x (6.3072 x 10^7).'
- en: 'Calculate: t = 1.89216 x 10^8 s.'
- en: 'Give it in years: 6 years.'
- en: So the time is 6 years.
- en: The correct option is c.
