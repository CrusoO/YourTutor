solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 700 nm = 7 x 10^-7 m; 0.4 mm = 4 x 10^-4 m.'
- en: 'Substitute: beta = (7 x 10^-7) x 1 / (4 x 10^-4).'
- en: 'Calculate: beta = 0.00175 m.'
- en: 'Give it in mm: 1.75 mm.'
- en: So the fringe width is 1.75 mm.
- en: The correct option is c.
