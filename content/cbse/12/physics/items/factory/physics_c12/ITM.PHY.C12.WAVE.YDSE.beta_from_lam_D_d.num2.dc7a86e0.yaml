stem:
  en: This question is about Young's double slit experiment. The wavelength of the
    light, lam, is 700 nm, the screen, D, is 1 m from the slits and the slits are
    0.4 mm apart. Find the fringe width.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: fringe width = wavelength x D / d.'
- level: 2
  en: The relation already gives the fringe width directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 700 nm as 7 x 10^-7 m and 0.4 mm as 4 x 10^-4 m, then write
    beta = lam x D / d, where beta is the fringe width, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the fringe width have, and roughly how
    large is it?
