solution_steps:
- en: 'Write the relation: U = (1/2) x C x V^2.'
- en: 'Put each quantity in SI units: 10 μF = 1 x 10^-5 F.'
- en: 'Substitute: U = (1 x 10^-5) x 220^2 / 2.'
- en: 'Calculate: U = 0.242 J.'
- en: 'Give it in μJ: 242000 μJ.'
- en: So the stored energy is 242000 μJ.
- en: The correct option is b.
