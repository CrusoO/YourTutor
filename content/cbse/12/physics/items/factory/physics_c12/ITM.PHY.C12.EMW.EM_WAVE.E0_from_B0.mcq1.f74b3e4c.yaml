solution_steps:
- en: 'Write the relation: E0 / B0 = c.'
- en: 'Put each quantity in SI units: 500 nT = 5 x 10^-7 T.'
- en: 'Substitute: E0 = (3 x 10^8) x (5 x 10^-7).'
- en: 'Calculate: E0 = 150 V/m.'
- en: So the electric amplitude is 150 V/m.
- en: The correct option is a.
