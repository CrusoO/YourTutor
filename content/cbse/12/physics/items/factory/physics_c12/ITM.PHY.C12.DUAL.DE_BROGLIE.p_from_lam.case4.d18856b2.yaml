solution_steps:
- en: 'Write the relation: wavelength = h / p, so p = h / wavelength.'
- en: 'Put each quantity in SI units: 0.5 nm = 5 x 10^-10 m.'
- en: 'Get the momentum alone: multiply each side by p and divide each side by the
    wavelength.'
- en: 'Substitute: p = (6.63 x 10^-34) / (5 x 10^-10).'
- en: 'Calculate: p = 1.326 x 10^-24 kg m/s.'
- en: So the momentum is 1.326 x 10^-24 kg m/s.
- en: The correct option is a.
