solution_steps:
- en: 'Write the relation: unpolarised light loses half of its intensity at the first
    polariser, then I2 = (I0 / 2) x cosine squared of the angle.'
- en: 'Substitute: I2 = 50 x 0.6^2 / 2.'
- en: 'Calculate: I2 = 9 W/m^2.'
- en: So the final intensity is 9 W/m^2.
- en: The correct option is b.
