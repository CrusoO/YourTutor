solution_steps:
- en: 'Write the relation: flux change = dB x A, then emf = N x [flux change] / time.'
- en: 'Put each quantity in SI units: 200 cm² = 0.02 m²; 20 ms = 0.02 s.'
- en: 'Substitute: eps = 500 x 0.5 x 0.02 / 0.02.'
- en: 'Calculate: eps = 250 V.'
- en: So the induced emf is 250 V.
- en: The correct option is c.
