stem:
  en: 'Case: a student investigates a plane electromagnetic wave in vacuum and records
    the following. The amplitude of the magnetic field, B0, is 300 nT. Find the amplitude
    of the electric field. Take the speed of light in vacuum, c, = 3 x 10^8 m/s.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: E0 / B0 = c.'
- level: 2
  en: The relation already gives the electric amplitude directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 300 nT as 3 x 10^-7 T, then write E0 = c x B0, where E0 is
    the electric amplitude, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the electric amplitude have, and roughly
    how large is it?
