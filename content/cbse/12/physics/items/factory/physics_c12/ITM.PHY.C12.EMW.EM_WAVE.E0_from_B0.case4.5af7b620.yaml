solution_steps:
- en: 'Write the relation: E0 / B0 = c.'
- en: 'Put each quantity in SI units: 300 nT = 3 x 10^-7 T.'
- en: 'Substitute: E0 = (3 x 10^8) x (3 x 10^-7).'
- en: 'Calculate: E0 = 90 V/m.'
- en: So the electric amplitude is 90 V/m.
- en: The correct option is c.
