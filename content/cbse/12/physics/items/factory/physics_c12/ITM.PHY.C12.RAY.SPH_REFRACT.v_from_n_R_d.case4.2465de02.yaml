solution_steps:
- en: 'Write the relation: n/v - 1/d = (n - 1)/R, with the distances as positive numbers
    for a real object and a real image in the glass.'
- en: 'Put each quantity in SI units: 10 cm = 0.1 m; 90 cm = 0.9 m.'
- en: 'Substitute: v = 2 x 0.1 x 0.9 / ((2 - 1) x 0.9 + 0.1).'
- en: 'Calculate: v = 0.18 m.'
- en: 'Give it in cm: 18 cm.'
- en: So the image distance is 18 cm.
- en: The correct option is d.
