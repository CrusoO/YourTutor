solution_steps:
- en: 'Write the relation: beta = collector current / base current.'
- en: 'Put each quantity in SI units: 2.5 mA = 0.0025 A; 25 μA = 2.5 x 10^-5 A.'
- en: 'Substitute: beta = 0.0025 / (2.5 x 10^-5).'
- en: 'Calculate: beta = 100.'
- en: So the current gain is 100.
- en: The correct option is c.
