stem:
  en: This question is about a charged capacitor. The capacitance, C, is 4 μF and
    the potential difference across it, V, is 10 V. Find the charge on the capacitor.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: Q = C x V.'
- level: 2
  en: The relation already gives the charge directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 4 μF as 4 x 10^-6 F, then write Q = C x V, where Q is the
    charge, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the charge have, and roughly how large
    is it?
