solution_steps:
- en: 'Write the relation: Q = C x V.'
- en: 'Put each quantity in SI units: 4 μF = 4 x 10^-6 F.'
- en: 'Substitute: Q = (4 x 10^-6) x 10.'
- en: 'Calculate: Q = 4 x 10^-5 C.'
- en: 'Give it in μC: 40 μC.'
- en: So the charge is 40 μC.
- en: The correct option is d.
