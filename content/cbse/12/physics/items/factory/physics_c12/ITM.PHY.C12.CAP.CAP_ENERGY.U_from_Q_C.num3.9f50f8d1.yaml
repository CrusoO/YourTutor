solution_steps:
- en: 'Write the relation: U = Q^2 / (2 x C).'
- en: 'Put each quantity in SI units: 40 μC = 4 x 10^-5 C; 2 μF = 2 x 10^-6 F.'
- en: 'Substitute: U = (4 x 10^-5)^2 / (2 x (2 x 10^-6)).'
- en: 'Calculate: U = 4 x 10^-4 J.'
- en: 'Give it in μJ: 400 μJ.'
- en: So the stored energy is 400 μJ.
- en: The correct option is c.
