stem:
  en: A student is studying a charged capacitor. The charge stored, Q, is 40 μC and
    the capacitance, C, is 2 μF. Find the energy stored.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: U = Q^2 / (2 x C).'
- level: 2
  en: The relation already gives the stored energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 40 μC as 4 x 10^-5 C and 2 μF as 2 x 10^-6 F, then write
    U = Q^2 / (2 x C), where U is the stored energy, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the stored energy have, and roughly how
    large is it?
