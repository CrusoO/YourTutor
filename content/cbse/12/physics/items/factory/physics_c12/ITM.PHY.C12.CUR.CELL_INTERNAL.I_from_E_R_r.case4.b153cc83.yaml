solution_steps:
- en: 'Write the relation: E = I x (R + r).'
- en: 'Get the current alone: divide each side of E = I x (R + r) by (R + r).'
- en: 'Substitute: I = 3 / (5 + 1).'
- en: 'Calculate: I = 0.5 A.'
- en: So the current is 0.5 A.
- en: The correct option is c.
