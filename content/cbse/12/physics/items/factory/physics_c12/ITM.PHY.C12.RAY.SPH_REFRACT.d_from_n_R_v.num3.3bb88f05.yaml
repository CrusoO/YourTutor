solution_steps:
- en: 'Write the relation: n/v - 1/d = (n - 1)/R, so 1/d = n/v - (n - 1)/R.'
- en: 'Put each quantity in SI units: 10 cm = 0.1 m; 22.5 cm = 0.225 m.'
- en: 'Substitute: d = 1 / (1.6 / 0.225 - (1.6 - 1) / 0.1).'
- en: 'Calculate: d = 0.9 m.'
- en: 'Give it in cm: 90 cm.'
- en: So the object distance is 90 cm.
- en: The correct option is b.
