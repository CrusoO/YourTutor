solution_steps:
- en: 'Write the relation: R / S = l1 / l2.'
- en: 'Put each quantity in SI units: 80 cm = 0.8 m; 20 cm = 0.2 m.'
- en: 'Substitute: R = 3.75 x 0.8 / 0.2.'
- en: 'Calculate: R = 15 Ω.'
- en: So the known resistance is 15 Ω.
