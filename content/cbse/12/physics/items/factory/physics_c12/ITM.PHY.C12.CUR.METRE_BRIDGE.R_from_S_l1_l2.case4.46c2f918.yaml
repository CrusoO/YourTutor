stem:
  en: 'Case: a student investigates a metre bridge at balance and records the following.
    The unknown resistance in the right gap, S, is 3.75 Ω, the balance point, l1,
    is 80 cm from the left end and the remaining wire on the right, l2, is 20 cm.
    Find the known resistance.'
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: R / S = l1 / l2.'
- level: 2
  en: The relation already gives the known resistance directly, so decide what to
    substitute. Change every quantity to SI units first, and change back at the end
    if asked.
- level: 3
  en: 'First step: Write 80 cm as 0.8 m and 20 cm as 0.2 m, then write R = S x l1
    / l2, where R is the known resistance, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the known resistance have, and roughly
    how large is it?
