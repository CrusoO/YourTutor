difficulty: 0.8
pool: practice
role: transfer
stem:
  en: 'Case: a student investigates a current-carrying conductor in a magnetic field
    and records the following. The force on the wire, F, is 50 mN, the magnetic field,
    B, is 100 mT, the length of wire in the field, L, is 10 cm and the sine of the
    angle between the wire and the field, s, is 1. Find the current in the wire.'
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: F = B x I x L x sine of the angle.'
- level: 2
  en: 'Get the current on its own before you put numbers in: divide each side by B
    x L x sine of the angle. Do the same operation to each side of the formula. Change
    every quantity to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: Write 50 mN as 0.05 N, 100 mT as 0.1 T and 10 cm as 0.1 m, then
    write I = F / [B x L x s], where I is the current, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
