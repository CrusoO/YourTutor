solution_steps:
- en: 'Write the relation: B = mu0 x n x I inside a long solenoid.'
- en: 'Put each quantity in SI units: 12.56 mT = 0.01256 T.'
- en: 'Get the turns per metre alone: divide each side by mu0 x I.'
- en: 'Substitute: n = 0.01256 / ((1.256 x 10^-6) x 5).'
- en: 'Calculate: n = 2000 m⁻¹.'
- en: So the turns per metre is 2000 m⁻¹.
- en: The correct option is a.
