solution_steps:
- en: 'Write the relation: terminal voltage V = E - I x r.'
- en: 'Substitute: Vt = 12 - 2 x 1.'
- en: 'Calculate: Vt = 10 V.'
- en: So the terminal voltage is 10 V.
