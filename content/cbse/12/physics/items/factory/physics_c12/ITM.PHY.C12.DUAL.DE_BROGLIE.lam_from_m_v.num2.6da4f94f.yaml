solution_steps:
- en: 'Write the relation: p = m x v, then wavelength = h / p.'
- en: 'Substitute: lam = (6.63 x 10^-34) / ((6.63 x 10^-27) x 50).'
- en: 'Calculate: lam = 2 x 10^-9 m.'
- en: 'Give it in nm: 2 nm.'
- en: So the de Broglie wavelength is 2 nm.
