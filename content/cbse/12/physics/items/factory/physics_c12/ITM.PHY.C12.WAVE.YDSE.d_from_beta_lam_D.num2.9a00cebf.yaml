solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 2 mm = 0.002 m; 400 nm = 4 x 10^-7 m.'
- en: 'Substitute: d = (4 x 10^-7) x 1 / 0.002.'
- en: 'Calculate: d = 2 x 10^-4 m.'
- en: 'Give it in mm: 0.2 mm.'
- en: So the slit separation is 0.2 mm.
- en: The correct option is d.
