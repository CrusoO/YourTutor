stem:
  en: This question is about Young's double slit experiment. The fringe width, beta,
    is 2 mm, the wavelength of the light, lam, is 400 nm and the screen, D, is 1 m
    from the slits. Find the separation of the slits.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: fringe width = wavelength x D / d.'
- level: 2
  en: The relation already gives the slit separation directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 2 mm as 0.002 m and 400 nm as 4 x 10^-7 m, then write d =
    lam x D / beta, where d is the slit separation, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the slit separation have, and roughly
    how large is it?
