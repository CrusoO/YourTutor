solution_steps:
- en: 'Write the relation: M = fo / fe in normal adjustment.'
- en: 'Put each quantity in SI units: 120 cm = 1.2 m.'
- en: 'Get the eyepiece focal length alone: divide each side by M.'
- en: 'Substitute: fe = 1.2 / 60.'
- en: 'Calculate: fe = 0.02 m.'
- en: 'Give it in cm: 2 cm.'
- en: So the eyepiece focal length is 2 cm.
- en: The correct option is d.
