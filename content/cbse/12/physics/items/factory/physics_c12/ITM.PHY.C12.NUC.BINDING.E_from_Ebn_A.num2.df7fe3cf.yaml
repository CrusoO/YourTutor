stem:
  en: This question is about the binding energy of a nucleus. The binding energy per
    nucleon, Ebn, is 7.452 MeV and the mass number, A, is 5. Find the total binding
    energy.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: binding energy per nucleon = binding energy / A.'
- level: 2
  en: The relation already gives the binding energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 7.452 MeV as 1.19232 x 10^-12 J, then write E = Ebn x A,
    where E is the binding energy, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the binding energy have, and roughly
    how large is it?
