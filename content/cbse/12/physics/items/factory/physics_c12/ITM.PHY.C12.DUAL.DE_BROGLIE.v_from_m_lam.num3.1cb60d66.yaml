stem:
  en: A student is studying the wave nature of a moving particle. Its mass, m, is
    6.63 x 10^-31 kg and the de Broglie wavelength, lam, is 0.5 nm. Find the speed
    of the particle. Take Planck's constant, h, = 6.63 x 10^-34 J s.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: wavelength = h / [m x v], so v = h / [m x wavelength].'
- level: 2
  en: The relation already gives the speed directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 0.5 nm as 5 x 10^-10 m, then write v = h / [m x lam], where
    v is the speed, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the speed have, and roughly how large
    is it?
