solution_steps:
- en: 'Write the relation: wavelength = h / [m x v], so v = h / [m x wavelength].'
- en: 'Put each quantity in SI units: 0.5 nm = 5 x 10^-10 m.'
- en: 'Substitute: v = (6.63 x 10^-34) / ((6.63 x 10^-31) x (5 x 10^-10)).'
- en: 'Calculate: v = 2 x 10^6 m/s.'
- en: So the speed is 2 x 10^6 m/s.
- en: The correct option is b.
