solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 708 pF = 7.08 x 10^-10 F; 400 cm² = 0.04 m²;
    1 mm = 0.001 m.'
- en: 'Get the dielectric constant alone: multiply each side by d and divide each
    side by eps0 x A.'
- en: 'Substitute: K = (7.08 x 10^-10) x 0.001 / ((8.85 x 10^-12) x 0.04).'
- en: 'Calculate: K = 2.'
- en: So the dielectric constant is 2.
- en: The correct option is b.
