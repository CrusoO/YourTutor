solution_steps:
- en: 'Write the relation: F = q x v x B x sine of the angle.'
- en: 'Put each quantity in SI units: 100 mT = 0.1 T.'
- en: 'Substitute: F = (3.2 x 10^-19) x 100000 x 0.1 x 0.5.'
- en: 'Calculate: F = 1.6 x 10^-15 N.'
- en: So the force is 1.6 x 10^-15 N.
- en: The correct option is d.
