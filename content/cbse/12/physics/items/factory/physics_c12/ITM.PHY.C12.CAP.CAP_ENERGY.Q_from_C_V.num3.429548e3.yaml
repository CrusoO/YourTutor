solution_steps:
- en: 'Write the relation: Q = C x V.'
- en: 'Put each quantity in SI units: 2 μF = 2 x 10^-6 F.'
- en: 'Substitute: Q = (2 x 10^-6) x 50.'
- en: 'Calculate: Q = 1 x 10^-4 C.'
- en: 'Give it in μC: 100 μC.'
- en: So the charge is 100 μC.
- en: The correct option is b.
