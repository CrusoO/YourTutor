solution_steps:
- en: 'Write the relation: torque = p x E x sine of the angle.'
- en: 'Substitute: tau = (2.5 x 10^-10) x 20000 x 0.6.'
- en: 'Calculate: tau = 3 x 10^-6 N m.'
- en: So the torque is 3 x 10^-6 N m.
- en: The correct option is b.
