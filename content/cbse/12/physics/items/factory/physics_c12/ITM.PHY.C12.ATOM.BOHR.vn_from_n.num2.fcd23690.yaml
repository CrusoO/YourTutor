solution_steps:
- en: 'Plan: the speed in the n-th orbit is v1 / n.'
- en: 'Substitute: vn = (2.2 x 10^6) / 2.'
- en: 'Calculate: vn = 1.1 x 10^6 m/s.'
- en: So the orbital speed is 1.1 x 10^6 m/s.
