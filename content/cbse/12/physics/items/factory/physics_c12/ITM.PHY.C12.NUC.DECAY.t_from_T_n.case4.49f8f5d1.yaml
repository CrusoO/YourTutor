solution_steps:
- en: 'Plan: the number of half-lives is t / T.'
- en: 'Put each quantity in SI units: 2 days = 172800 s.'
- en: 'Substitute: t = 3 x 172800.'
- en: 'Calculate: t = 518400 s.'
- en: 'Give it in days: 6 days.'
- en: So the time is 6 days.
- en: The correct option is a.
