solution_steps:
- en: 'Write the relation: K = photon energy - work function.'
- en: 'Put each quantity in SI units: 2 eV = 3.2 x 10^-19 J; 2.5 eV = 4 x 10^-19 J.'
- en: 'Substitute: Eph = (3.2 x 10^-19) + (4 x 10^-19).'
- en: 'Calculate: Eph = 7.2 x 10^-19 J.'
- en: 'Give it in eV: 4.5 eV.'
- en: So the photon energy is 4.5 eV.
- en: The correct option is a.
