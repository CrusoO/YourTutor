stem:
  en: Its full scale deflection needs 1 mA, the galvanometer coil has a resistance
    of 50 Ω and the series resistance, Rs, is 9950 Ω. Find the largest voltage the
    voltmeter can read.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: V = Ig x (G + Rs).'
- level: 2
  en: The relation already gives the voltmeter range directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 1 mA as 0.001 A, then write V = Ig x (G + Rs), where V is
    the voltmeter range, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the voltmeter range have, and roughly
    how large is it?
