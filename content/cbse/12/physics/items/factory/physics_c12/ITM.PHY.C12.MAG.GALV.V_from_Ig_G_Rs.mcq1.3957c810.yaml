solution_steps:
- en: 'Write the relation: V = Ig x (G + Rs).'
- en: 'Put each quantity in SI units: 1 mA = 0.001 A.'
- en: 'Substitute: V = 0.001 x (50 + 9950).'
- en: 'Calculate: V = 10 V.'
- en: So the voltmeter range is 10 V.
- en: The correct option is b.
