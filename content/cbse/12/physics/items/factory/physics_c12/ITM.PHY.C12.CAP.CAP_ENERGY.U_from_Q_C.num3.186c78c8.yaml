stem:
  en: A student is studying a charged capacitor. The charge stored, Q, is 11000 μC
    and the capacitance, C, is 50 μF. Find the energy stored.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: U = Q^2 / (2 x C).'
- level: 2
  en: The relation already gives the stored energy directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 11000 μC as 0.011 C and 50 μF as 5 x 10^-5 F, then write
    U = Q^2 / (2 x C), where U is the stored energy, with the values in place, one
    quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the stored energy have, and roughly how
    large is it?
