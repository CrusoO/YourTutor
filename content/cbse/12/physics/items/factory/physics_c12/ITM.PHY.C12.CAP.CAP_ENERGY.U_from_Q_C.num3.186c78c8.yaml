solution_steps:
- en: 'Write the relation: U = Q^2 / (2 x C).'
- en: 'Put each quantity in SI units: 11000 μC = 0.011 C; 50 μF = 5 x 10^-5 F.'
- en: 'Substitute: U = 0.011^2 / (2 x (5 x 10^-5)).'
- en: 'Calculate: U = 1.21 J.'
- en: 'Give it in μJ: 1.21 x 10^6 μJ.'
- en: So the stored energy is 1.21 x 10^6 μJ.
- en: The correct option is c.
