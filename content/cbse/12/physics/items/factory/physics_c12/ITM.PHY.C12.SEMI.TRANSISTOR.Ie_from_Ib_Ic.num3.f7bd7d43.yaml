stem:
  en: A student is studying a transistor in the common emitter connection. The base
    current, Ib, is 10 μA and the collector current, Ic, is 2 mA. Find the emitter
    current.
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: emitter current = base current + collector current.'
- level: 2
  en: The relation already gives the emitter current directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 10 μA as 1 x 10^-5 A and 2 mA as 0.002 A, then write Ie =
    Ib + Ic, where Ie is the emitter current, with the values in place, one quantity
    at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the emitter current have, and roughly
    how large is it?
