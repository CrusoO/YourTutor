solution_steps:
- en: 'Write the relation: emitter current = base current + collector current.'
- en: 'Put each quantity in SI units: 10 μA = 1 x 10^-5 A; 2 mA = 0.002 A.'
- en: 'Substitute: Ie = (1 x 10^-5) + 0.002.'
- en: 'Calculate: Ie = 0.00201 A.'
- en: 'Give it in mA: 2.01 mA.'
- en: So the emitter current is 2.01 mA.
- en: The correct option is c.
