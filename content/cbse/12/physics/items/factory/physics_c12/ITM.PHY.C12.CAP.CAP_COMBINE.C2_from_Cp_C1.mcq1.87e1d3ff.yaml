solution_steps:
- en: 'Write the relation: parallel: Cp = C1 + C2.'
- en: 'Put each quantity in SI units: 27 μF = 2.7 x 10^-5 F; 9 μF = 9 x 10^-6 F.'
- en: 'Get the second capacitance alone: subtract C1 from each side.'
- en: 'Substitute: C2 = (2.7 x 10^-5) - (9 x 10^-6).'
- en: 'Calculate: C2 = 1.8 x 10^-5 F.'
- en: 'Give it in μF: 18 μF.'
- en: So the second capacitance is 18 μF.
- en: The correct option is d.
