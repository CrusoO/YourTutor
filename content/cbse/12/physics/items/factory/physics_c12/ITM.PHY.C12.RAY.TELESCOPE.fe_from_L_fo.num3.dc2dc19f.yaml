solution_steps:
- en: 'Write the relation: tube length = fo + fe in normal adjustment.'
- en: 'Put each quantity in SI units: 205 cm = 2.05 m; 200 cm = 2 m.'
- en: 'Get the eyepiece focal length alone: subtract fo from each side.'
- en: 'Substitute: fe = 2.05 - 2.'
- en: 'Calculate: fe = 0.05 m.'
- en: 'Give it in cm: 5 cm.'
- en: So the eyepiece focal length is 5 cm.
- en: The correct option is d.
