solution_steps:
- en: 'Write the relation: F = k x q1 x q2 / r^2.'
- en: 'Put each quantity in SI units: 2 μC = 2 x 10^-6 C.'
- en: 'Get the second charge alone: multiply each side by r^2 and divide each side
    by k x q1.'
- en: 'Substitute: q2 = (1 x 10^-4) x 30^2 / ((9 x 10^9) x (2 x 10^-6)).'
- en: 'Calculate: q2 = 5 x 10^-6 C.'
- en: 'Give it in μC: 5 μC.'
- en: So the second charge is 5 μC.
- en: The correct option is d.
