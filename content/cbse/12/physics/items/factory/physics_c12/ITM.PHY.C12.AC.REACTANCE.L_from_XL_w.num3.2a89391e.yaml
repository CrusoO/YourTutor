solution_steps:
- en: 'Write the relation: XL = w x L.'
- en: 'Get the inductance alone: divide each side by w.'
- en: 'Substitute: L = 1 / 100.'
- en: 'Calculate: L = 0.01 H.'
- en: 'Give it in mH: 10 mH.'
- en: So the inductance is 10 mH.
- en: The correct option is a.
