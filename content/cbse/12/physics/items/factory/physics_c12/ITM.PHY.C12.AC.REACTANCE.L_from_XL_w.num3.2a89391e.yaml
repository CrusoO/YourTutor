stem:
  en: A student is studying an inductor or a capacitor in an alternating circuit.
    The inductive reactance, XL, is 1 Ω and the angular frequency of the supply, w,
    is 100 rad/s. Find the inductance.
hints:
- level: 1
  en: 'Name each quantity in the question before you calculate. Pick the relation
    that links them: XL = w x L.'
- level: 2
  en: 'Get the inductance on its own before you put numbers in: divide each side by
    w. Do the same operation to each side of the formula. Change every quantity to
    SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: write L = XL / w, where L is the inductance, with the values in
    place, one quantity at a time.'
