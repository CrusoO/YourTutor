solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 1.75 mm = 0.00175 m; 700 nm = 7 x 10^-7 m; 0.4
    mm = 4 x 10^-4 m.'
- en: 'Substitute: D = 0.00175 x (4 x 10^-4) / (7 x 10^-7).'
- en: 'Calculate: D = 1 m.'
- en: So the screen distance is 1 m.
- en: The correct option is a.
