stem:
  en: 'Case: a student investigates a charged capacitor and records the following.
    The energy stored, U, is 484000 μJ and the capacitance, C, is 20 μF. Find the
    potential difference.'
hints:
- level: 1
  en: 'Read the question once more and mark what you must find. Pick the relation
    that links them: U = (1/2) x C x V^2.'
- level: 2
  en: 'Get the potential difference on its own before you put numbers in: multiply
    each side by 2, divide each side by C, then take the square root. Do the same
    operation to each side of the formula. Change every quantity to SI units first,
    and change back at the end if asked.'
- level: 3
  en: 'First step: Write 484000 μJ as 0.484 J and 20 μF as 2 x 10^-5 F, then write
    V = sqrt(2 x U / C), where V is the potential difference, with the values in place,
    one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the potential difference have, and roughly
    how large is it?
