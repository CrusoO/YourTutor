solution_steps:
- en: 'Write the relation: U = (1/2) x C x V^2.'
- en: 'Put each quantity in SI units: 484000 μJ = 0.484 J; 20 μF = 2 x 10^-5 F.'
- en: 'Get the potential difference alone: multiply each side by 2, divide each side
    by C, then take the square root.'
- en: 'Substitute: V = sqrt(2 x 0.484 / (2 x 10^-5)).'
- en: 'Calculate: V = 220 V.'
- en: So the potential difference is 220 V.
- en: The correct option is a.
