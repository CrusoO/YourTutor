solution_steps:
- en: 'Write the relation: C = K x eps0 x A / d.'
- en: 'Put each quantity in SI units: 100 cm² = 0.01 m²; 2.5 mm = 0.0025 m.'
- en: 'Substitute: C = 3 x (8.85 x 10^-12) x 0.01 / 0.0025.'
- en: 'Calculate: C = 1.062 x 10^-10 F.'
- en: 'Give it in pF: 106.2 pF.'
- en: So the capacitance is 106.2 pF.
- en: The correct option is a.
