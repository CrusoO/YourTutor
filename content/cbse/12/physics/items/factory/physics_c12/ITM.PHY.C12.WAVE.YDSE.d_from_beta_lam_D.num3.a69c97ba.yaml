solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 0.3 mm = 3 x 10^-4 m; 600 nm = 6 x 10^-7 m.'
- en: 'Substitute: d = (6 x 10^-7) x 0.5 / (3 x 10^-4).'
- en: 'Calculate: d = 0.001 m.'
- en: 'Give it in mm: 1 mm.'
- en: So the slit separation is 1 mm.
- en: The correct option is a.
