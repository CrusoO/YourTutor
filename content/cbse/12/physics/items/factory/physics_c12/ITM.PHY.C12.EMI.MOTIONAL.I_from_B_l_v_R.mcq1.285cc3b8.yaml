stem:
  en: The magnetic field, B, is 500 mT, the rod, l, is 20 cm long, the speed of the
    rod, v, is 2 m/s and the resistance of the circuit, R, is 2 Ω. Find the current
    in the circuit.
hints:
- level: 1
  en: 'List what the question gives you and what it asks for. Pick the relation that
    links them: emf = B x l x v, then I = emf / R.'
- level: 2
  en: The relation already gives the current directly, so decide what to substitute.
    Change every quantity to SI units first, and change back at the end if asked.
- level: 3
  en: 'First step: Write 500 mT as 0.5 T and 20 cm as 0.2 m, then write I = B x l
    x v / R, where I is the current, with the values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the current have, and roughly how large
    is it?
