stem:
  en: The amplitude of the electric field, E0, is 90 V/m. Find the amplitude of the
    magnetic field. Take the speed of light in vacuum, c, = 3 x 10^8 m/s.
hints:
- level: 1
  en: 'Separate the known quantities from the unknown one. Pick the relation that
    links them: E0 / B0 = c.'
- level: 2
  en: 'Get the magnetic amplitude on its own before you put numbers in: divide each
    side by c. Do the same operation to each side of the formula. Change every quantity
    to SI units first, and change back at the end if asked.'
- level: 3
  en: 'First step: write B0 = E0 / c, where B0 is the magnetic amplitude, with the
    values in place, one quantity at a time.'
prediction_prompt:
  en: Before you calculate, what unit should the magnetic amplitude have, and roughly
    how large is it?
