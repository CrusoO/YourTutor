solution_steps:
- en: 'Write the relation: fringe width = wavelength x D / d.'
- en: 'Put each quantity in SI units: 0.35 mm = 3.5 x 10^-4 m; 1 mm = 0.001 m.'
- en: 'Get the wavelength alone: multiply each side by d and divide each side by D.'
- en: 'Substitute: lam = (3.5 x 10^-4) x 0.001 / 0.5.'
- en: 'Calculate: lam = 7 x 10^-7 m.'
- en: 'Give it in nm: 700 nm.'
- en: So the wavelength is 700 nm.
- en: The correct option is b.
