solution_steps:
- en: 'Write the relation: binding energy per nucleon = binding energy / A.'
- en: 'Put each quantity in SI units: 372.6 MeV = 5.9616 x 10^-11 J; 74.52 MeV = 1.19232
    x 10^-11 J.'
- en: 'Substitute: A = (5.9616 x 10^-11) / (1.19232 x 10^-11).'
- en: 'Calculate: A = 5.'
- en: So the mass number is 5.
- en: The correct option is c.
