solution_steps:
- en: 'Write the relation: B = (mu0 / 4 pi) x 2 x I / r for a long straight wire.'
- en: 'Put each quantity in SI units: 4 μT = 4 x 10^-6 T; 5 cm = 0.05 m.'
- en: 'Get the current alone: multiply each side by r and divide each side by 2 x
    (mu0 / 4 pi).'
- en: 'Substitute: I = (4 x 10^-6) x 0.05 / (2 x (1 x 10^-7)).'
- en: 'Calculate: I = 1 A.'
- en: So the current is 1 A.
- en: The correct option is b.
