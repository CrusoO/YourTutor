solution_steps:
- en: 'Write the relation: E = k x q / r^2.'
- en: 'Put each quantity in SI units: 10 nC = 1 x 10^-8 C.'
- en: 'Substitute: E = (9 x 10^9) x (1 x 10^-8) / 10^2.'
- en: 'Calculate: E = 0.9 N/C.'
- en: So the electric field is 0.9 N/C.
- en: The correct option is c.
