solution_steps:
- en: 'Write the relation: force per metre = (mu0 / 4 pi) x 2 x I1 x I2 / d for two
    long parallel wires.'
- en: 'Put each quantity in SI units: 20 cm = 0.2 m.'
- en: 'Substitute: f = 2 x (1 x 10^-7) x 2 x 5 / 0.2.'
- en: 'Calculate: f = 1 x 10^-5 N/m.'
- en: 'Give it in mN/m: 0.01 mN/m.'
- en: So the force per unit length is 0.01 mN/m.
- en: The correct option is d.
