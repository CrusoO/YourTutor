role: transfer
stem:
  en: A 0.2 m rod moves at 10 m/s perpendicular to a uniform 0.5 T field in a closed circuit of total resistance 1 ohm. What is the magnitude of the retarding magnetic force on the rod in newton?
hints:
- level: 1
  en: Find the current in the rod from the EMF and the circuit resistance first.
- level: 2
  en: The magnetic force on a current-carrying rod is the field times the current times the length.
- level: 3
  en: Use the current you found before calculating the force.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.1'
  accept: []
solution_steps:
- en: The EMF is 0.2 times 0.5 times 10, which is 1 V, so the current is 1 A.
- en: The retarding force is B I l, which is 0.5 times 1 times 0.2, giving 0.1 N.
- en: The unit of the answer is N.
- en: Answer = 0.1
tier: C
diagram_note: A rod sliding on parallel rails in a field directed into the page, with a closed circuit through a resistor, and an arrow showing the retarding force opposing the motion.
