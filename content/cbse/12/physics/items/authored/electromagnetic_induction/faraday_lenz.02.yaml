id: A.12.physics.electromagnetic_induction.faraday_lenz.02
skill_ids:
- SK.A.12.physics.faraday_lenz
difficulty: 0.2
pool: practice
role: apply
stem:
  en: A coil of 100 turns has its magnetic flux changed by 0.02 Wb in 0.5 s. What is the magnitude of the induced EMF in volt?
hints:
- level: 1
  en: Use EMF equal to the number of turns times the rate of change of flux.
- level: 2
  en: Divide the flux change by the time taken.
- level: 3
  en: Multiply by the number of turns as the last step.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: Faraday's law gives EMF equal to N times the change in flux divided by the time.
- en: That is 100 times 0.02 divided by 0.5, which is 4 V.
- en: The unit of the answer is V.
- en: Answer = 4
tier: C
