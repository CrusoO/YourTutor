id: A.12.physics.electromagnetic_induction.motional_emf.02
skill_ids:
- SK.A.12.physics.motional_emf
difficulty: 0.2
pool: practice
role: apply
stem:
  en: A rod of length 0.5 m moves at 4 m/s perpendicular to a uniform field of 0.2 T, with the rod also perpendicular to the field. What is the induced EMF in volt?
hints:
- level: 1
  en: Use EMF equal to the field times the length times the speed.
- level: 2
  en: Keep the lengths in metre and the speed in metre per second.
- level: 3
  en: Multiply the three quantities together.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.4'
  accept: []
solution_steps:
- en: The motional EMF is B l v, which is 0.2 times 0.5 times 4, giving 0.4 V.
- en: The unit of the answer is V.
- en: Answer = 0.4
tier: C
