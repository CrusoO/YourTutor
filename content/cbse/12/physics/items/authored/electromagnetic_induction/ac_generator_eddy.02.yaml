stem:
  en: A coil of 100 turns and area 0.1 m^2 rotates at 10 rad/s in a uniform field of 0.5 T. What is the peak induced EMF in volt?
hints:
- level: 1
  en: The peak EMF is the number of turns times the field, the area and the angular speed.
- level: 2
  en: Multiply the turns and the field strength first.
- level: 3
  en: Keep the angular speed in radian per second.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '50'
  accept: []
solution_steps:
- en: The peak EMF is N B A omega, which is 100 times 0.5 times 0.1 times 10, giving 50 V.
- en: The unit of the answer is V.
- en: Answer = 50
