id: A.12.physics.electromagnetic_induction.motional_emf.01
skill_ids:
- SK.A.12.physics.motional_emf
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A straight conductor of length l moves with speed v at right angles to a uniform field B, and both the length and the velocity are perpendicular to the field. What is the induced EMF?
hints:
- level: 1
  en: Think about the force on the charges in the conductor as it moves.
- level: 2
  en: Consider how the length and speed each contribute once to the EMF.
- level: 3
  en: Recall the general formula for motional EMF with a sine of an angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: B v divided by l
- id: b
  en: B l v
- id: c
  en: B l divided by v
- id: d
  en: B l v squared
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.28E5E32CF3F8
  when_answer_equals:
  - c
- id: MC.A.A5F3E4291888
  when_answer_equals:
  - d
- id: MC.A.7460777996A4
  when_answer_equals:
  - a
solution_steps:
- en: For a conductor moving perpendicular to the field, the motional EMF is B times l times v, because the electrons feel a force that drives them along the rod.
- en: The correct option is b.
tier: C
