difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A 0.3 m rod slides at 2 m/s across a U-shaped frame in a uniform field of 0.5 T perpendicular to the plane of the frame. The total resistance of the closed circuit is 0.2 ohm. What is the induced current in ampere?
hints:
- level: 1
  en: Find the motional EMF of the rod first.
- level: 2
  en: Use Ohm's law for the closed circuit with that EMF.
- level: 3
  en: Divide the EMF by the total resistance of the circuit.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.5'
  accept: []
solution_steps:
- en: The EMF is B l v, which is 0.5 times 0.3 times 2, giving 0.3 V.
- en: The current is 0.3 divided by 0.2, which is 1.5 A.
- en: The unit of the answer is A.
- en: Answer = 1.5
tier: C
diagram_note: A U-shaped conducting frame with a sliding rod across its open end, a field drawn into the page, and a resistor closing the circuit, with the direction of motion of the rod marked.
