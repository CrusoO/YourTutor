stem:
  en: Which expression gives the energy stored in an inductor of inductance L carrying a steady current I?
hints:
- level: 1
  en: Think about how the energy depends on the current, which is not linear.
- level: 2
  en: The factor in the formula comes from building up the current gradually.
- level: 3
  en: Compare with the energy of a capacitor, which has a similar structure.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: L times I squared
- id: b
  en: One half times L squared times I
- id: c
  en: L times I
- id: d
  en: One half times L times I squared
answer:
  sympy: d
  accept: []
