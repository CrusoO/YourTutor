stem:
  en: Two coils are moved closer together while the currents in them are unchanged. What happens to their mutual inductance?
hints:
- level: 1
  en: Think about how much of the flux from one coil passes through the other coil when they are close.
- level: 2
  en: Consider whether the distance between the coils affects the coupling.
- level: 3
  en: Recall what mutual inductance measures about the two coils.
