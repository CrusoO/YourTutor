id: A.12.physics.electromagnetic_induction.faraday_lenz.03
skill_ids:
- SK.A.12.physics.faraday_lenz
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A circular coil of 200 turns and area 0.01 m^2 lies perpendicular to a magnetic field that rises uniformly from 0 to 0.5 T in 0.2 s. What is the magnitude of the induced EMF in volt?
hints:
- level: 1
  en: Write the flux as B times A when the field is perpendicular to the coil.
- level: 2
  en: Find the rate of change of the field first.
- level: 3
  en: Multiply the number of turns by the area and by the rate of change of the field.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: The EMF is N times A times the rate of change of B.
- en: That is 200 times 0.01 times 0.5 divided by 0.2, which equals 5 V.
- en: The unit of the answer is V.
- en: Answer = 5
tier: C
diagram_note: A circular coil drawn face-on with a field arrow pointing perpendicularly into the page and a label showing the field increasing from 0 to 0.5 tesla over 0.2 seconds.
