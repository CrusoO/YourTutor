difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A generator coil rotates at 3000 revolutions per minute. What is its frequency in hertz?
hints:
- level: 1
  en: Convert revolutions per minute into revolutions per second.
- level: 2
  en: Divide the rate by 60 to change the time unit.
- level: 3
  en: The frequency in hertz equals the revolutions per second.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '50'
  accept: []
solution_steps:
- en: Frequency is revolutions per second.
- en: 3000 revolutions per minute is 3000 divided by 60, which is 50 revolutions per second, so the frequency is 50 Hz.
- en: The unit of the answer is Hz.
- en: Answer = 50
tier: C
diagram_note: A rectangular coil between the poles of a magnet, with a rotation arrow around its axis and slip rings connecting the coil to an external circuit.
