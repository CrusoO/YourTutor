id: A.12.physics.electromagnetic_induction.faraday_lenz.04
skill_ids:
- SK.A.12.physics.faraday_lenz
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Which action does NOT produce an induced EMF in a closed coil held in a uniform magnetic field?
hints:
- level: 1
  en: Think about whether the amount of field passing through the loop is changing.
- level: 2
  en: Consider which action alters the orientation or the size of the loop.
- level: 3
  en: Ask what the induced EMF needs in order to be produced at all.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Reducing the area of the coil inside the field
- id: b
  en: Keeping the coil still with its plane perpendicular to a steady uniform field
- id: c
  en: Rotating the coil about an axis in its plane
- id: d
  en: Moving a bar magnet towards the coil
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.998C6DD4B814
  when_answer_equals:
  - c
- id: MC.A.6E7BD48D6B1F
  when_answer_equals:
  - d
- id: MC.A.2B2CA5A2FAF7
  when_answer_equals:
  - a
solution_steps:
- en: A steady uniform field through a fixed loop gives constant flux, so there is no change to induce an EMF.
- en: Rotation, moving magnets and changing area all change the flux.
- en: The correct option is b.
tier: C
