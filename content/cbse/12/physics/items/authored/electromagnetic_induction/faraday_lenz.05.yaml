id: A.12.physics.electromagnetic_induction.faraday_lenz.05
skill_ids:
- SK.A.12.physics.faraday_lenz
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: The flux through a 10 turn coil is given by 0.5 t^2 weber, where t is in seconds. What is the magnitude of the induced EMF in volt at t equal to 2 s?
hints:
- level: 1
  en: Differentiate the flux with respect to time first.
- level: 2
  en: Substitute the time only after you have differentiated.
- level: 3
  en: Multiply the result by the number of turns.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '20'
  accept: []
solution_steps:
- en: The rate of change of flux is t, so the EMF is N times t.
- en: At t equal to 2 s this is 10 times 2, which is 20 V.
- en: The unit of the answer is V.
- en: Answer = 20
tier: C
