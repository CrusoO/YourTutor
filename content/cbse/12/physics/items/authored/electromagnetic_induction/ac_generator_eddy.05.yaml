difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A coil of 200 turns and area 0.02 m^2 rotates at 50 rad/s in a uniform field of 0.1 T. What is the peak induced EMF in volt?
hints:
- level: 1
  en: Use the peak EMF formula with turns, field, area and angular speed.
- level: 2
  en: Multiply the turns, field and area before multiplying by the angular speed.
- level: 3
  en: Keep track of the decimal places in the area and field strength.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '20'
  accept: []
solution_steps:
- en: The peak EMF is N B A omega.
- en: With N equal to 200, B equal to 0.1, A equal to 0.02 and omega equal to 50, the peak is 20 V.
- en: The unit of the answer is V.
- en: Answer = 20
tier: C
diagram_note: A loop rotating about an axis between the poles of a magnet, with its angular speed marked as an arrow and the field lines drawn across the loop.
