stem:
  en: An inductor of inductance 0.2 H stores 0.4 J of energy. What is the steady current through it in ampere?
hints:
- level: 1
  en: Rearrange the energy formula to find the current.
- level: 2
  en: Multiply the energy by two before dividing by the inductance.
- level: 3
  en: Take the square root as the last step.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
