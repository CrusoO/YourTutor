  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The energy is one half L I squared.
- en: Rearranging gives I squared equal to 2E over L, which is 0.8 divided by 0.2, equal to 4, so I is 2 A.
- en: The unit of the answer is A.
- en: Answer = 2
