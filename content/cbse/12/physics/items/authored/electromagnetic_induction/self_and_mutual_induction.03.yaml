difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A primary coil carries a current that changes at 50 A/s. This induces an EMF of 2 V in a nearby secondary coil. What is the mutual inductance in henry?
hints:
- level: 1
  en: The secondary EMF equals the mutual inductance times the rate of change of the primary current.
- level: 2
  en: Rearrange the relation to find the mutual inductance.
- level: 3
  en: Divide the induced voltage by the rate of change of current.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.04'
  accept: []
solution_steps:
- en: The induced EMF in the secondary is M times the rate of change of the primary current.
- en: Rearranging gives M equal to 2 divided by 50, which is 0.04 H.
- en: The unit of the answer is H.
- en: Answer = 0.04
tier: C
diagram_note: Two coils placed side by side, with the primary connected to a current source and the secondary connected to a voltmeter, and the current change indicated on the primary.
