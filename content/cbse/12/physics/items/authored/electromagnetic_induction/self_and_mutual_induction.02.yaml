stem:
  en: A coil has self-inductance 0.5 H. The current through it changes by 2 A in 0.1 s. What is the magnitude of the induced EMF in volt?
hints:
- level: 1
  en: Use EMF equal to inductance times the rate of change of current.
- level: 2
  en: Find the rate of change of current first.
- level: 3
  en: Multiply the inductance by that rate.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10'
  accept: []
solution_steps:
- en: The self-induced EMF is L times the rate of change of current.
- en: The rate is 2 divided by 0.1, which is 20 A/s, so the EMF is 0.5 times 20, which is 10 V.
- en: The unit of the answer is V.
- en: Answer = 10
tier: C
