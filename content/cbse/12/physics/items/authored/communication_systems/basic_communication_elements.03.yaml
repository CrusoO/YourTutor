id: A.12.physics.communication_systems.basic_communication_elements.03
skill_ids:
- SK.A.12.physics.basic_communication_elements
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A voice signal occupies frequencies from 300 Hz to 3400 Hz. What is its bandwidth in hertz?
hints:
- level: 1
  en: Bandwidth is the difference between the highest and lowest frequencies.
- level: 2
  en: Subtract the lower frequency from the upper frequency.
- level: 3
  en: Keep the unit as hertz.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3100'
  accept: []
solution_steps:
- en: The bandwidth is the highest frequency minus the lowest frequency, which is 3400 minus 300, equal to 3100 Hz.
- en: The unit of the answer is Hz.
- en: Answer = 3100
tier: C
