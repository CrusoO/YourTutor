difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A carrier wave has amplitude 8 V and the message signal has amplitude 4 V. What is the modulation index?
hints:
- level: 1
  en: The modulation index is the ratio of the message amplitude to the carrier amplitude.
- level: 2
  en: Divide the message amplitude by the carrier amplitude.
- level: 3
  en: The modulation index has no unit.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.5'
  accept: []
solution_steps:
- en: The modulation index is the message amplitude divided by the carrier amplitude, which is 4 divided by 8, equal to 0.5.
- en: Answer = 0.5
tier: C
