stem:
  en: A carrier of frequency 1000 kHz is amplitude modulated by a message of frequency 5 kHz. What is the frequency of the upper sideband?
hints:
- level: 1
  en: The upper sideband is the carrier frequency plus the message frequency.
- level: 2
  en: Add the message frequency to the carrier frequency.
- level: 3
  en: The lower sideband is found by subtracting instead.
