id: A.12.physics.communication_systems.modulation_and_propagation.04
skill_ids:
- SK.A.12.physics.modulation_and_propagation
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why is frequency modulation less affected by noise than amplitude modulation?
hints:
- level: 1
  en: Think about which property of the wave noise usually disturbs.
- level: 2
  en: Consider whether the receiver can discard the disturbance.
- level: 3
  en: Compare how the message is carried in each scheme.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Noise cannot affect any modulated wave
- id: b
  en: The FM signal has a higher amplitude than the noise
- id: c
  en: Noise mainly changes the amplitude, which the receiver can limit away
- id: d
  en: FM uses less bandwidth than amplitude modulation
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.28340B3C2E28
  when_answer_equals:
  - b
- id: MC.A.178C8BC023C9
  when_answer_equals:
  - d
- id: MC.A.F6A8CF95219F
  when_answer_equals:
  - a
solution_steps:
- en: Most noise appears as amplitude variation.
- en: An FM receiver ignores amplitude changes by limiting the signal, so the message carried in the frequency is preserved.
- en: The correct option is c.
tier: C
