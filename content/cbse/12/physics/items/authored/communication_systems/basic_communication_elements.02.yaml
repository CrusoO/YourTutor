difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which element of a communication system recovers the original message from the received signal?
hints:
- level: 1
  en: Think about the element at the far end of the link.
- level: 2
  en: Consider which element extracts the message from the carrier.
- level: 3
  en: Compare with the element that starts the process at the source.
