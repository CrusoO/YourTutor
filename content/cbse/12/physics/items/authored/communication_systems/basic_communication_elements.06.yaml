stem:
  en: A radio carrier wave has frequency 3 MHz. What is the length in metre of a quarter-wave antenna for this carrier? Use c equal to 3 x 10^8 m/s.
hints:
- level: 1
  en: Find the wavelength from the speed of light and the frequency first.
- level: 2
  en: A quarter-wave antenna is one quarter of the wavelength.
- level: 3
  en: Divide the wavelength by four as the last step.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '25'
  accept: []
solution_steps:
- en: The wavelength is c over f, which is 3 x 10^8 divided by 3 x 10^6, giving 100 m.
- en: A quarter-wave antenna is 100 divided by 4, which is 25 m.
- en: The unit of the answer is m.
- en: Answer = 25
tier: C
diagram_note: A vertical antenna rod with its length marked as one quarter of a wavelength, and the wavelength shown as a full sine wave drawn beside it.
