stem:
  en: A photon has energy 10 eV. Using hc equal to 1240 eV nm, what is its wavelength in nanometre?
hints:
- level: 1
  en: Use wavelength equal to hc divided by the photon energy.
- level: 2
  en: Divide the constant 1240 by the energy in eV.
- level: 3
  en: Check that the unit is nanometre.
prediction_prompt:
