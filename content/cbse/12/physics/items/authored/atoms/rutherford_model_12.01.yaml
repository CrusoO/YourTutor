id: A.12.physics.atoms.rutherford_model_12.01
skill_ids:
- SK.A.12.physics.rutherford_model_12
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What did Rutherford's alpha particle scattering experiment establish about the atom?
hints:
- level: 1
  en: Think about how most alpha particles behaved when they hit the foil.
- level: 2
  en: Consider what a few large deflections would require of the charge distribution.
- level: 3
  en: Compare the uniform sphere picture with the observed number of large deflections.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Most of the mass and positive charge are concentrated in a tiny central nucleus
- id: b
  en: The atom is a uniform sphere of positive charge with electrons embedded in it
- id: c
  en: Most alpha particles are absorbed by the atoms they hit
- id: d
  en: Electrons move in fixed orbits with specific energies
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.9D5701D27C21
  when_answer_equals:
  - b
- id: MC.A.EF0D052C33E4
  when_answer_equals:
  - d
- id: MC.A.B71D6604C1B9
  when_answer_equals:
  - c
solution_steps:
- en: Most alpha particles passed straight through the foil while a few were deflected by large angles.
- en: This showed that the positive charge sits in a very small nucleus.
- en: The correct option is a.
tier: C
