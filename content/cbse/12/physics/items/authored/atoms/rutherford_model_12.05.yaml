difficulty: 0.9
pool: practice
role: explain
stem:
  en: Classical physics predicted that the nuclear model of the atom would be unstable. What was the main problem?
hints:
- level: 1
  en: Think about what an accelerating electric charge should do according to classical electromagnetism.
- level: 2
  en: Consider what happens to an orbiting electron that keeps losing energy.
- level: 3
  en: Ask whether the nuclear model by itself can explain the stability of atoms.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: An orbiting electron should radiate energy and spiral into the nucleus
- id: b
  en: Alpha particles were deflected too little at small angles
- id: c
  en: The nucleus could not be located at the centre of the atom
- id: d
  en: The scattering of alpha particles could not be measured
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.A4D7F65CAC36
  when_answer_equals:
  - c
- id: MC.A.CC2505AC259D
  when_answer_equals:
