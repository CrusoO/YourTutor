stem:
  en: What energy in eV must a hydrogen atom absorb to move an electron from the n equal to 1 level to the n equal to 2 level?
hints:
- level: 1
  en: Find the energy of each of the two levels using minus 13.6 over n squared.
- level: 2
  en: Subtract the lower level energy from the higher level energy.
- level: 3
  en: Report the energy absorbed as a positive number.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
