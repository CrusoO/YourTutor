type: numeric
answer:
  sympy: '10.2'
  accept: []
solution_steps:
- en: The level energies are minus 13.6 eV for n equal to 1 and minus 3.4 eV for n equal to 2.
- en: The difference is 10.2 eV, so that much energy must be absorbed.
- en: The unit of the answer is eV.
- en: Answer = 10.2
