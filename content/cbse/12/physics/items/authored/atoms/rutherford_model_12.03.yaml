stem:
  en: The diameter of an atom is about 10^-10 m, and its nucleus has a diameter of about 10^-14 m. How many times larger is the atom's diameter than the nucleus's?
hints:
- level: 1
  en: Divide the atom's diameter by the nuclear diameter.
- level: 2
  en: Subtract the powers of ten to get the power of ten in the ratio.
- level: 3
  en: Write the final ratio as a plain number.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10000'
  accept: []
solution_steps:
- en: Dividing 10^-10 by 10^-14 gives 10^4, so the atom is about 10000 times wider than its nucleus.
- en: Answer = 10000
tier: C
