stem:
  en: An alpha particle approaches a nucleus head-on. If its initial kinetic energy is doubled, by what factor does its distance of closest approach change?
hints:
- level: 1
  en: At closest approach the kinetic energy has been converted into electric potential energy.
- level: 2
  en: Think about whether the distance goes up or down as the energy goes up.
- level: 3
  en: Compare the new closest approach with the old one as a ratio.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
