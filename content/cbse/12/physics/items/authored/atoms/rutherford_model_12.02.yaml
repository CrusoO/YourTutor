difficulty: 0.2
pool: practice
role: explain
stem:
  en: In alpha scattering, why do only a very small fraction of alpha particles get deflected through large angles?
hints:
- level: 1
  en: Think about how close an alpha particle must come to a charge to be strongly deflected.
- level: 2
  en: Consider the size of the region that holds the positive charge.
- level: 3
  en: Compare the chance of a close encounter with the size of the target.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The positive charge is concentrated in a very small nucleus
- id: b
  en: Electrons repel the alpha particles away from the atom
- id: c
  en: Alpha particles are too heavy to be deflected easily
- id: d
  en: The gold foil is so thin that it absorbs the alpha particles
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.112D513AB0D3
  when_answer_equals:
