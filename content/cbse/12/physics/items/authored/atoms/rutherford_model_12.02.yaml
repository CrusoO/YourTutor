solution_steps:
- en: A large deflection needs a close encounter with a concentrated positive charge.
- en: Because the nucleus is tiny, only a few alpha particles come close enough.
- en: The correct option is a.
tier: C
diagram_note: 'A thin gold foil with alpha particle paths drawn through it: most paths pass straight through, while one path is drawn deflected at a large angle near a small central nucleus.'
