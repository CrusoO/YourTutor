stem:
  en: An alpha particle of kinetic energy 5.76 MeV approaches head-on a nucleus of atomic number 2. What is its distance of closest approach in femtometre? Use k = 9 x 10^9 N m^2 C^-2, e = 1.6 x 10^-19 C and 1 MeV = 1.6 x 10^-13 J.
hints:
- level: 1
  en: At closest approach all the kinetic energy has become electric potential energy.
- level: 2
  en: Find the charge of the alpha particle and the charge of the nucleus in terms of e.
- level: 3
  en: Convert the energy to joule before you solve for the distance.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1'
  accept: []
solution_steps:
- en: At closest approach the kinetic energy equals k times the product of the two charges over r.
- en: The alpha has charge 2e and the nucleus has charge 2e, so r equals 9 x 10^9 times 4 times 2.56 x 10^-38 divided by 9.216 x 10^-13, which is 10^-15 m, or 1 fm.
- en: The unit of the answer is fm.
- en: Answer = 1
tier: C
