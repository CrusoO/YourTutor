answer:
  sympy: '3.4'
  accept: []
solution_steps:
- en: Ionisation from a level requires energy equal to the magnitude of that level's energy.
- en: For n equal to 2 that is 13.6 divided by 4, which is 3.4 eV.
- en: The unit of the answer is eV.
- en: Answer = 3.4
