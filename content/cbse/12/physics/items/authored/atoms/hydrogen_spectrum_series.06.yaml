stem:
  en: What is the ionisation energy in eV of a hydrogen electron that is initially in the n equal to 2 level?
hints:
- level: 1
  en: Ionisation from a level needs energy equal to the magnitude of that level's energy.
- level: 2
  en: Use minus 13.6 over n squared for the level energy.
- level: 3
  en: Take the magnitude of the energy as your answer.
prediction_prompt:
