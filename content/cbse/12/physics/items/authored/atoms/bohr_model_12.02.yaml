stem:
  en: Using E_n equal to minus 13.6 eV divided by n squared, what is the energy in eV of the n equal to 2 level of hydrogen?
hints:
- level: 1
  en: Use the level energy formula with n equal to 2.
- level: 2
  en: Square n before dividing into 13.6.
- level: 3
  en: Keep the negative sign in the final answer.
