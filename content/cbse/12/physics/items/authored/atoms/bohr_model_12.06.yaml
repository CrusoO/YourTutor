- level: 1
  en: Write the potential energy and the total energy of a Bohr orbit, each in terms of n.
- level: 2
  en: Consider the sign convention for energies of an electron bound to the nucleus.
- level: 3
  en: Take the ratio of the potential energy to the total energy, keeping the signs.
