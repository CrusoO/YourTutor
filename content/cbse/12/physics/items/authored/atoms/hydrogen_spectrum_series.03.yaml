answer:
  sympy: '12.75'
  accept: []
solution_steps:
- en: The photon energy is 13.6 times one minus one over 16, which equals 13.6 times 15 over 16, giving 12.75 eV.
- en: The unit of the answer is eV.
- en: Answer = 12.75
