stem:
  en: An electron in a hydrogen atom drops from the n equal to 4 level to the n equal to 1 level in one step. What is the energy of the emitted photon in eV?
hints:
- level: 1
  en: Use E equal to 13.6 eV times one over n1 squared minus one over n2 squared, with the lower level as n1.
- level: 2
  en: Put the lower final level as n1 equal to 1.
- level: 3
  en: Evaluate the bracketed difference first.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
