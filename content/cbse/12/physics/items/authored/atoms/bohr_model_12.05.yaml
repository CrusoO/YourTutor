- id: MC.A.C3A63BE60CAB
  when_answer_equals:
  - c
solution_steps:
- en: The photon energy equals E3 minus E1, which is minus 1.51 minus minus 13.6, giving about 12.1 eV.
- en: The correct option is d.
tier: C
