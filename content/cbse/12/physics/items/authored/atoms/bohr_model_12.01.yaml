id: A.12.physics.atoms.bohr_model_12.01
skill_ids:
- SK.A.12.physics.bohr_model_12
difficulty: 0.2
pool: practice
role: recall
stem:
  en: According to Bohr's model, what happens to an electron while it is in a permitted stationary orbit?
hints:
- level: 1
  en: Think about the postulates Bohr added to the classical picture.
- level: 2
  en: Consider whether the energy of an electron in an orbit can take any value.
- level: 3
  en: Recall what happens when an electron changes from one orbit to another.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It does not radiate energy while it stays in that orbit
- id: b
  en: Its orbit grows as its energy increases
- id: c
  en: It radiates energy continuously as it orbits
- id: d
  en: It can have any energy value it likes
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.352F905F2849
  when_answer_equals:
  - c
- id: MC.A.122B92F7B5AF
  when_answer_equals:
  - d
- id: MC.A.4B64C6F92873
  when_answer_equals:
  - b
solution_steps:
- en: Bohr postulated that electrons in stationary orbits do not radiate, and that only specific orbits with quantised angular momentum are allowed.
- en: The correct option is a.
tier: C
