role: explain
stem:
  en: The first Bohr radius of hydrogen is 0.53 angstrom. What is the radius in angstrom of the n equal to 2 orbit?
hints:
- level: 1
  en: The orbit radius scales as the square of the principal quantum number.
- level: 2
  en: Multiply the first Bohr radius by the square of n.
- level: 3
  en: Keep the answer in angstrom.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2.12'
  accept: []
solution_steps:
- en: The orbit radius scales as n squared, so the n equal to 2 orbit has radius 4 times 0.53 angstrom, which is 2.12 angstrom.
- en: The unit of the answer is angstrom.
- en: Answer = 2.12
tier: C
diagram_note: Concentric circles around a central nucleus representing the n equal to 1 and n equal to 2 orbits, with each radius labelled.
