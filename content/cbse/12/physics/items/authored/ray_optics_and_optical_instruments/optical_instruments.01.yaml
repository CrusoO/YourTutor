difficulty: 0.2
pool: practice
role: recall
stem:
  en: In a compound microscope, which lens forms the first real image of the object?
hints:
- level: 1
  en: Think about which lens is closest to the object being viewed.
- level: 2
  en: Consider the order in which the two lenses act on the light.
- level: 3
  en: Recall which image the eyepiece magnifies.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Both lenses together in one step
- id: b
  en: The objective
- id: c
  en: The condenser below the stage
- id: d
  en: The eyepiece
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.6471ECB051D9
  when_answer_equals:
  - d
- id: MC.A.4B53A7BEC1D3
  when_answer_equals:
