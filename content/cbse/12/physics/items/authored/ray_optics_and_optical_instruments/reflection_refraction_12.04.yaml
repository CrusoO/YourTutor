stem:
  en: Light travels at 2 x 10^8 m/s in a transparent medium. What is the refractive index of that medium? Use c equal to 3 x 10^8 m/s.
hints:
- level: 1
  en: The refractive index is the speed in vacuum divided by the speed in the medium.
- level: 2
  en: Use the vacuum speed of 3 x 10^8 m/s in the division.
- level: 3
  en: Check that the index is greater than one for a transparent medium.
