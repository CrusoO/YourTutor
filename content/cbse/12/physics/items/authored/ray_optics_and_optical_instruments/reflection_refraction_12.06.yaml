stem:
  en: Two thin lenses, each of focal length 0.5 m, are placed in contact. What is the combined power in dioptre?
hints:
- level: 1
  en: The power of a lens is one over its focal length in metre.
- level: 2
  en: Powers of thin lenses in contact add directly.
- level: 3
  en: Find the power of each lens and then add the two values.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
