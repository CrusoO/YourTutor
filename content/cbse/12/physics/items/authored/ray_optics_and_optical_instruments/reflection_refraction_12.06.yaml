type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: The power of a lens is the reciprocal of its focal length in metre.
- en: Each lens has power 2 D, and powers of lenses in contact add, giving 4 D.
- en: The unit of the answer is D.
- en: Answer = 4
