stem:
  en: A thin biconvex lens has its two faces with radii 0.2 m and minus 0.2 m, using the sign convention where the second radius is negative. Its refractive index is 1.5. What is its focal length in metre?
hints:
- level: 1
  en: Note the sign of the second radius for a biconvex lens in the sign convention.
- level: 2
  en: Find the bracket term for each face and add them.
- level: 3
  en: Multiply the sum by the refractive index minus one and then take the reciprocal.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.2'
  accept: []
solution_steps:
- en: The lens maker's formula gives 1 over f equal to 0.5 times (5 plus 5), which is 5 per metre, so the focal length is 0.2 m.
- en: The unit of the answer is m.
- en: Answer = 0.2
tier: C
diagram_note: A biconvex lens with its two faces drawn, the radius of each face marked, and the centres of curvature shown on opposite sides of the lens.
