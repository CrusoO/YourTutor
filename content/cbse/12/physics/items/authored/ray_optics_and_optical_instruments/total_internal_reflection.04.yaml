id: A.12.physics.ray_optics_and_optical_instruments.total_internal_reflection.04
skill_ids:
- SK.A.12.physics.total_internal_reflection
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does a cut diamond sparkle so strongly?
hints:
- level: 1
  en: Think about the path light takes once it has entered the stone.
- level: 2
  en: Consider the critical angle for a material with a high refractive index.
- level: 3
  en: Ask what happens when light meets the internal faces at steep angles.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Diamond has a refractive index close to zero
- id: b
  en: Light is reflected only from the outer surface
- id: c
  en: Diamond emits its own light
- id: d
  en: Light undergoes repeated total internal reflection inside the cut stone
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.677844B5A2A2
  when_answer_equals:
  - c
- id: MC.A.F02DC0C334A5
  when_answer_equals:
  - a
- id: MC.A.215BBCC2B776
  when_answer_equals:
  - b
solution_steps:
- en: Diamond has a high refractive index, so its critical angle is small.
- en: Light entering a well cut stone is reflected internally many times before leaving through the top.
- en: The correct option is d.
tier: C
