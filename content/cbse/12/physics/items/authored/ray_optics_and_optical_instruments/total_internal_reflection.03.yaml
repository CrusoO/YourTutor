difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Light travels in the core of an optical fibre with refractive index 1.25 and meets the boundary with the cladding of refractive index 1. What is the sine of the critical angle at this boundary?
hints:
- level: 1
  en: The sine of the critical angle equals the ratio of the two refractive indices.
- level: 2
  en: Put the index of the cladding over the index of the core.
- level: 3
  en: Work out the division carefully before reading off the answer.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.8'
  accept: []
solution_steps:
- en: The sine of the critical angle is the refractive index of the cladding divided by that of the core.
- en: Dividing 1 by 1.25 gives 0.8.
- en: Answer = 0.8
tier: C
diagram_note: A cross section of an optical fibre with a central core and a surrounding cladding, and a ray striking the core to cladding boundary at an angle, with the normal drawn.
