stem:
  en: A thin prism of refracting angle 6 degrees has refractive index 1.52 for violet light and 1.50 for red light. What is the angular dispersion in degree, the difference between the violet and red deviations?
hints:
- level: 1
  en: Angular dispersion is the difference between the two deviations, which depends on the difference in index.
- level: 2
  en: Subtract the two refractive indices first.
- level: 3
  en: Multiply the difference by the prism angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.12'
  accept: []
solution_steps:
- en: The angular dispersion is the difference of the indices times the prism angle.
- en: That is 0.02 times 6 degrees, which is 0.12 degrees.
- en: The unit of the answer is degree.
- en: Answer = 0.12
tier: C
diagram_note: A thin prism with white light entering one face and a fan of separate coloured rays emerging, with the angular spread between violet and red marked.
