stem:
  en: A thin prism has a refracting angle of 60 degrees and refractive index 1.5. What is its deviation in degree for a thin prism approximation?
hints:
- level: 1
  en: Use the thin prism formula that multiplies the prism angle by the index minus one.
- level: 2
  en: Subtract one from the refractive index first.
- level: 3
  en: Multiply the result by the prism angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '30'
  accept: []
solution_steps:
- en: For a thin prism the deviation is (mu minus 1) times the prism angle.
- en: That is 0.5 times 60 degrees, which is 30 degrees.
- en: The unit of the answer is degree.
- en: Answer = 30
