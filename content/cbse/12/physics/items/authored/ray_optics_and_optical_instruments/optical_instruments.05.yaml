stem:
  en: A refracting telescope in normal adjustment has an objective of focal length 1 m and an eyepiece of focal length 0.05 m. What is the length of the telescope in metre?
hints:
- level: 1
  en: In normal adjustment the two lenses are separated by the sum of their focal lengths.
- level: 2
  en: Add the two focal lengths in metre.
- level: 3
  en: Keep both values in metre before adding.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.05'
  accept: []
solution_steps:
- en: In normal adjustment the objective and eyepiece are separated by the sum of their focal lengths.
- en: That is 1 m plus 0.05 m, giving 1.05 m.
- en: The unit of the answer is m.
- en: Answer = 1.05
tier: C
diagram_note: A refracting telescope with the objective and eyepiece drawn apart, the separation marked as the sum of their focal lengths, and parallel rays from a distant object entering the objective.
