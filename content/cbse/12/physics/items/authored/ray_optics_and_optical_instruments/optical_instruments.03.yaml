id: A.12.physics.ray_optics_and_optical_instruments.optical_instruments.03
skill_ids:
- SK.A.12.physics.optical_instruments
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A compound microscope has an objective of focal length 1 cm, an eyepiece of focal length 5 cm and a tube length of 20 cm. The final image is at the near point of 25 cm. What is the magnifying power?
hints:
- level: 1
  en: The magnifying power is a product of an objective term and an eyepiece term.
- level: 2
  en: The objective term uses the tube length divided by its focal length.
- level: 3
  en: The eyepiece term uses the near point divided by its focal length.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '100'
  accept: []
solution_steps:
- en: The magnifying power is the tube length over the objective focal length times the near point over the eyepiece focal length.
- en: That is 20 divided by 1, times 25 divided by 5, which is 100.
- en: Answer = 100
tier: C
diagram_note: A compound microscope drawn with its objective and eyepiece labelled, the tube length marked between them, and the focal lengths of each lens noted beside it.
