id: A.12.physics.ray_optics_and_optical_instruments.optical_instruments.04
skill_ids:
- SK.A.12.physics.optical_instruments
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why is a mirror used as the objective in a reflecting telescope instead of a lens?
hints:
- level: 1
  en: Think about how a mirror treats different colours compared with a lens.
- level: 2
  en: Consider how easily a large mirror can be supported compared with a large lens.
- level: 3
  en: Recall what chromatic aberration is in a lens.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Mirrors form a virtual image that is easier to view
- id: b
  en: Mirrors have a higher refractive index than glass
- id: c
  en: Mirrors avoid chromatic aberration and can be made very large
- id: d
  en: Mirrors make the eyepiece unnecessary
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.351B31654B14
  when_answer_equals:
  - b
- id: MC.A.0DCEEFF43038
  when_answer_equals:
  - a
- id: MC.A.51DB3C64FDEF
  when_answer_equals:
  - d
solution_steps:
- en: A mirror reflects all colours in the same way, so it has no chromatic aberration, and a large mirror can be supported from behind, which lets it collect more light.
- en: The correct option is c.
tier: C
