stem:
  en: A transparent medium has refractive index 2 and is surrounded by air. What is its critical angle in degree?
hints:
- level: 1
  en: Use sin C equal to one over the refractive index.
- level: 2
  en: Find the sine of the critical angle from the given index.
- level: 3
  en: Take the inverse sine to get the angle in degrees.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
