stem:
  en: A refracting telescope has an objective of focal length 100 cm and an eyepiece of focal length 5 cm. What is its angular magnification in normal adjustment?
hints:
- level: 1
  en: The angular magnification is the objective focal length divided by the eyepiece focal length.
- level: 2
  en: Use both focal lengths in the same unit.
- level: 3
  en: Divide the objective focal length by the eyepiece focal length.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '20'
  accept: []
solution_steps:
- en: The angular magnification of a telescope in normal adjustment is the objective focal length divided by the eyepiece focal length, which is 100 divided by 5, giving 20.
- en: Answer = 20
