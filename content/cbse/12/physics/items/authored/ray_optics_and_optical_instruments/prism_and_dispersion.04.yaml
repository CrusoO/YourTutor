id: A.12.physics.ray_optics_and_optical_instruments.prism_and_dispersion.04
skill_ids:
- SK.A.12.physics.prism_and_dispersion
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A beam of white light passes through a glass prism and leaves as a band of colours. Which property of the glass explains this?
hints:
- level: 1
  en: Think about what property of the glass changes between colours.
- level: 2
  en: Consider how different colours bend when they enter the prism.
- level: 3
  en: Recall the quantity that determines how strongly light bends at a surface.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The prism absorbs some colours and emits the rest
- id: b
  en: The refractive index of the glass depends on the wavelength of light
- id: c
  en: The speed of light in vacuum depends on its colour
- id: d
  en: Each colour is reflected from the prism at a different angle
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.36965C7311E4
  when_answer_equals:
  - c
- id: MC.A.D6CEB2D4F7BC
  when_answer_equals:
  - a
- id: MC.A.38A1677ACD37
  when_answer_equals:
  - d
solution_steps:
- en: Shorter wavelengths are refracted more strongly in glass, so each colour emerges at a slightly different angle, which spreads the white light into a spectrum.
- en: The correct option is b.
tier: C
