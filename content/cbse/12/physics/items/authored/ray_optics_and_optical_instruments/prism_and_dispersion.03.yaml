stem:
  en: A thin prism of refracting angle 4 degrees is made of glass with refractive index 1.5. What is its deviation in degree?
hints:
- level: 1
  en: Use the thin prism formula with the index minus one.
- level: 2
  en: Subtract one from the index before multiplying.
- level: 3
  en: Multiply by the small prism angle as the last step.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The thin prism deviation is (mu minus 1) times the angle, which is 0.5 times 4 degrees, equal to 2 degrees.
- en: The unit of the answer is degree.
- en: Answer = 2
tier: C
diagram_note: A thin prism with its apex angle marked, a ray entering one face and deviated towards the base of the prism.
