stem:
  en: A medium is surrounded by air. Light inside the medium strikes its boundary with air at a critical angle of 30 degrees. What is the refractive index of the medium?
hints:
- level: 1
  en: At the critical angle the sine equals one over the refractive index.
- level: 2
  en: Find the sine of 30 degrees first.
- level: 3
  en: Divide one by that sine to get the index.
prediction_prompt:
