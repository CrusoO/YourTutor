difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Light from a point object 0.9 m in front of a convex spherical surface of radius 0.3 m passes from air into a medium of refractive index 1.5. What is the image distance in metre from the surface, measured on the far side?
hints:
- level: 1
  en: Use the surface formula with the object distance taken as negative in the real-is-positive convention.
- level: 2
  en: Work out the right hand side from the index difference and the radius first.
- level: 3
  en: Rearrange the equation for the term containing v before you substitute the numbers.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2.7'
  accept: []
solution_steps:
- en: Using 1.5 over v minus 1 over u equals 0.5 over 0.3 with u equal to minus 0.9 gives 1.5 over v equal to 0.556, so v is 2.7 m on the far side.
- en: The unit of the answer is m.
- en: Answer = 2.7
tier: C
diagram_note: A convex spherical surface with its centre of curvature on the far side, an object on the left at 0.9 m, and the refracted light crossing the surface to a marked image point on the right.
