difficulty: 0.9
pool: practice
role: explain
stem:
  en: Why does a rainbow appear in the sky after rain?
hints:
- level: 1
  en: Think about what sunlight does when it enters and leaves a water droplet.
- level: 2
  en: Consider the internal path inside a droplet and where the reflection happens.
- level: 3
  en: Recall why the index of water depends on colour.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Sunlight is reflected only from the surface of clouds
- id: b
  en: Water droplets emit coloured light of their own
- id: c
  en: Sunlight is refracted, dispersed and reflected inside water droplets
- id: d
  en: The atmosphere creates colours from scattered noise
answer:
  sympy: c
  accept: []
misconception_rules:
