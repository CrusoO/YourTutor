stem:
  en: A thin plano-convex lens of refractive index 1.5 has a curved face of radius 0.2 m and a flat second face, and is placed in air. What is its focal length in metre?
hints:
- level: 1
  en: Use the lens maker's formula with one of the radii set to infinity for a flat face.
- level: 2
  en: Find the bracket term, the refractive index minus one times the reciprocal radius, first.
- level: 3
  en: Take the reciprocal of the result to get the focal length.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.4'
  accept: []
solution_steps:
- en: The lens maker's formula with one infinite radius gives 1 over f equal to 0.5 times 1 over 0.2, which is 2.5 per metre, so the focal length is 0.4 m.
- en: The unit of the answer is m.
- en: Answer = 0.4
tier: C
