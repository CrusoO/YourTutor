difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is the angle of deviation produced by a prism?
hints:
- level: 1
  en: Compare the direction of the ray going into the prism with the direction coming out.
- level: 2
  en: Think about the change of direction over both faces of the prism.
- level: 3
  en: Consider whether a prism bends light at all.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The angle between the incident ray and the emergent ray
- id: b
  en: The angle of the prism itself
- id: c
  en: Zero for every prism
- id: d
  en: The angle of incidence at the first face
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.A0162026B0DD
  when_answer_equals:
  - b
- id: MC.A.4915A373C2D5
  when_answer_equals:
