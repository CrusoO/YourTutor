stem:
  en: A simple magnifier, an eyepiece of focal length 2.5 cm, forms its final image at the near point of 25 cm. What is its angular magnification?
hints:
- level: 1
  en: For a simple magnifier with the image at the near point, the magnification is the near point over the focal length.
- level: 2
  en: Use the near point and focal length in the same unit.
- level: 3
  en: Divide the near point by the focal length.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
