  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10'
  accept: []
solution_steps:
- en: For a simple lens with the final image at the near point the magnification is D over f.
- en: That is 25 divided by 2.5, which gives 10.
- en: Answer = 10
