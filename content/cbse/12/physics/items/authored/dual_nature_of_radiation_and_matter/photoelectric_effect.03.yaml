id: A.12.physics.dual_nature_of_radiation_and_matter.photoelectric_effect.03
skill_ids:
- SK.A.12.physics.photoelectric_effect
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A metal has work function 2.0 eV. Light whose photons each carry 3.5 eV falls on it. What is the maximum kinetic energy of the emitted electrons in electronvolt?
hints:
- level: 1
  en: Use Einstein's photoelectric equation for the maximum kinetic energy.
- level: 2
  en: Subtract the work function from the photon energy.
- level: 3
  en: Keep the answer in electronvolt.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.5'
  accept: []
solution_steps:
- en: Einstein's equation gives the maximum kinetic energy as the photon energy minus the work function.
- en: That is 3.5 eV minus 2.0 eV, which equals 1.5 eV.
- en: The unit of the answer is eV.
- en: Answer = 1.5
tier: C
diagram_note: An energy level sketch with a photon arrow striking a metal surface, a horizontal line marking the work function, and the leftover energy shown as the kinetic energy of the emitted electron.
