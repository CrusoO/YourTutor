stem:
  en: A proton and an alpha particle move at the same speed. The alpha particle has four times the mass of the proton. What is the ratio of the alpha particle's de Broglie wavelength to the proton's?
hints:
- level: 1
  en: At equal speeds the momentum is proportional to the mass.
- level: 2
  en: The wavelength is inversely proportional to the momentum.
- level: 3
  en: Take the reciprocal of the mass ratio.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.25'
  accept: []
solution_steps:
- en: At equal speeds the momentum is proportional to mass, so the wavelength is inversely proportional to mass.
- en: The ratio is 1 divided by 4, which is 0.25.
- en: Answer = 0.25
tier: C
