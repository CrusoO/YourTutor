answer:
  sympy: '500000'
  accept: []
solution_steps:
- en: The speed is h divided by m times lambda.
- en: That is 6 x 10^-34 divided by 1.2 x 10^-39, which equals 5 x 10^5 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 500000
