stem:
  en: A particle of mass 4 x 10^-30 kg has a de Broglie wavelength of 3 x 10^-10 m. Taking h equal to 6 x 10^-34 J s, what is its speed in m/s?
hints:
- level: 1
  en: Rearrange the de Broglie relation to find the speed.
- level: 2
  en: Multiply the mass by the wavelength before dividing the constant by that product.
- level: 3
  en: Keep the powers of ten exact in the division.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
