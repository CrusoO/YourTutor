id: A.12.physics.dual_nature_of_radiation_and_matter.photoelectric_effect.06
skill_ids:
- SK.A.12.physics.photoelectric_effect
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Light of wavelength 400 nm gives a stopping potential of 1.2 V on a metal surface. What is the work function of the metal in electronvolt? Use hc equal to 1240 eV nm.
hints:
- level: 1
  en: The photon energy comes from hc divided by the wavelength.
- level: 2
  en: The stopping potential gives the maximum kinetic energy in electronvolt.
- level: 3
  en: Subtract the maximum kinetic energy from the photon energy to get the work function.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.9'
  accept: []
solution_steps:
- en: The photon energy is 1240 divided by 400, which is 3.1 eV.
- en: The maximum kinetic energy is 1.2 eV, so the work function is 3.1 minus 1.2, which is 1.9 eV.
- en: The unit of the answer is eV.
- en: Answer = 1.9
tier: C
diagram_note: A graph of stopping potential against frequency showing a straight line, with its intercept on the frequency axis labelled as the threshold frequency and its slope labelled with the constant h over e.
