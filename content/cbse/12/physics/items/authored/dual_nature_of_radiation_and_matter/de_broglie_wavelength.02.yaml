stem:
  en: A particle has momentum 3 x 10^-23 kg m/s. Taking h equal to 6 x 10^-34 J s, what is its de Broglie wavelength in picometre?
hints:
- level: 1
  en: Use the de Broglie formula with the momentum in the denominator.
- level: 2
  en: Divide the constant by the momentum, keeping the powers of ten exact.
- level: 3
  en: Convert the answer from metre to picometre at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '20'
  accept: []
solution_steps:
- en: The wavelength is h over p, which is 6 x 10^-34 divided by 3 x 10^-23, equal to 2 x 10^-11 m.
- en: That is 20 pm.
- en: The unit of the answer is pm.
- en: Answer = 20
tier: C
