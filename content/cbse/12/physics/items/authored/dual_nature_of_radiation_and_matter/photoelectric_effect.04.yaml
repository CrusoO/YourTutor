difficulty: 0.6
pool: practice
role: explain
stem:
  en: Light of wavelength 310 nm falls on a metal of work function 2 eV. What is the stopping potential in volt? Use hc equal to 1240 eV nm.
hints:
- level: 1
  en: First find the photon energy from the wavelength.
- level: 2
  en: Subtract the work function from the photon energy to get the maximum kinetic energy.
- level: 3
  en: The stopping potential in volt is numerically equal to the maximum kinetic energy in electronvolt.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The photon energy is 1240 divided by 310, which is 4 eV.
- en: The maximum kinetic energy is 4 minus 2, which is 2 eV, and the stopping potential in volt has the same numerical value.
- en: The unit of the answer is V.
- en: Answer = 2
tier: C
