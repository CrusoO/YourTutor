stem:
  en: A particle of mass 1 x 10^-27 kg moves at 2 x 10^3 m/s. Taking h equal to 6 x 10^-34 J s, what is its de Broglie wavelength in nanometre?
hints:
- level: 1
  en: Find the momentum from the mass and the speed first.
- level: 2
  en: Divide the constant h by the momentum.
- level: 3
  en: Convert the result from metre to nanometre at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.3'
  accept: []
solution_steps:
- en: The momentum is 1 x 10^-27 times 2 x 10^3, which is 2 x 10^-24 kg m/s.
- en: The wavelength is 6 x 10^-34 divided by 2 x 10^-24, which is 3 x 10^-10 m, or 0.3 nm.
- en: The unit of the answer is nm.
- en: Answer = 0.3
tier: C
