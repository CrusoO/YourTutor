options:
- id: a
  en: Electrons reflect from surfaces more strongly than light
- id: b
  en: Electrons travel faster than light in any medium
- id: c
  en: Electron wavelengths are much shorter, which allows finer resolution
- id: d
  en: Electrons are heavier and penetrate samples more easily
