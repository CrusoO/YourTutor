stem:
  en: Why are electron beams used in electron microscopes instead of visible light to see very fine structures?
hints:
- level: 1
  en: Think about what limits the smallest detail that a microscope can resolve.
- level: 2
  en: Consider the de Broglie wavelength of electrons at moderate energies.
- level: 3
  en: Compare the scale of visible light wavelengths with the size of atoms.
