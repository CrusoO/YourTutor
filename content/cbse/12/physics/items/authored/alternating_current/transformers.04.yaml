stem:
  en: A transformer has an efficiency of 90 percent. Its input power is 100 W. What is the output power in watt?
hints:
- level: 1
  en: Efficiency is the output power divided by the input power.
- level: 2
  en: Convert the percentage to a decimal before multiplying.
- level: 3
  en: Check that the output is smaller than the input power.
prediction_prompt:
