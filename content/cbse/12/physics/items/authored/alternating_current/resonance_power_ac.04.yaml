difficulty: 0.6
pool: practice
role: explain
stem:
  en: Which change increases the quality factor of a series resonant circuit and makes its resonance peak sharper?
hints:
- level: 1
  en: Think about which quantity appears in the denominator of the quality factor.
- level: 2
  en: Consider how losses in the circuit affect the sharpness of the peak.
- level: 3
  en: Compare the series resistance with the reactances at resonance.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Lowering the resistance
- id: b
  en: Increasing the bandwidth of the response
- id: c
  en: Adding a resistor in series
- id: d
  en: Raising the resistance
answer:
  sympy: a
  accept: []
misconception_rules:
