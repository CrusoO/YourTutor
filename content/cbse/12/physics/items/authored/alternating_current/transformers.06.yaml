id: A.12.physics.alternating_current.transformers.06
skill_ids:
- SK.A.12.physics.transformers
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A step-down transformer has 1000 turns on the primary and 50 turns on the secondary. The primary voltage is 2200 V and the secondary current is 20 A. What is the primary current in ampere?
hints:
- level: 1
  en: Find the secondary voltage from the turns ratio first.
- level: 2
  en: Use the power balance between the primary and the secondary.
- level: 3
  en: Divide the secondary power by the primary voltage.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1'
  accept: []
solution_steps:
- en: The secondary voltage is 2200 times 50 over 1000, which is 110 V.
- en: Power balance gives the primary current as 110 times 20 divided by 2200, which is 1 A.
- en: The unit of the answer is A.
- en: Answer = 1
tier: C
diagram_note: A step-down transformer with a primary coil labelled 1000 turns and a secondary coil labelled 50 turns, with the primary voltage and the secondary current marked.
