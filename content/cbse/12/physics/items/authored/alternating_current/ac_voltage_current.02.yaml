difficulty: 0.2
pool: practice
role: apply
stem:
  en: An alternating voltage has peak value 20 times the square root of 2 volt. What is its rms value in volt?
hints:
- level: 1
  en: Use rms equal to peak divided by the square root of two.
- level: 2
  en: Look for a common factor of the square root of two in the numerator and denominator.
- level: 3
  en: Write the peak voltage in the form given before dividing.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '20'
  accept: []
solution_steps:
- en: The rms value is the peak divided by the square root of two.
- en: Dividing 20 root 2 by root 2 gives 20 V.
- en: The unit of the answer is V.
- en: Answer = 20
tier: C
