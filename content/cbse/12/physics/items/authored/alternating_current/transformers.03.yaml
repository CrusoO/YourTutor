id: A.12.physics.alternating_current.transformers.03
skill_ids:
- SK.A.12.physics.transformers
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: An ideal transformer has a primary voltage of 240 V and a secondary voltage of 12 V. The primary current is 0.5 A. What is the secondary current in ampere?
hints:
- level: 1
  en: For an ideal transformer the input power equals the output power.
- level: 2
  en: Write the power on each side as voltage times current.
- level: 3
  en: Solve the power balance for the secondary current.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10'
  accept: []
solution_steps:
- en: An ideal transformer conserves power, so the primary power 240 times 0.5 equals the secondary voltage times the secondary current.
- en: That gives 120 divided by 12, which is 10 A.
- en: The unit of the answer is A.
- en: Answer = 10
tier: C
diagram_note: A transformer drawn with a primary coil and a secondary coil on a common iron core, with the primary voltage and current labelled on one side and the secondary voltage on the other.
