id: A.12.physics.alternating_current.ac_voltage_current.03
skill_ids:
- SK.A.12.physics.ac_voltage_current
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: An alternating supply has a frequency of 50 Hz. What is the time period of one complete cycle in milliseconds?
hints:
- level: 1
  en: The period is the reciprocal of the frequency.
- level: 2
  en: Work in seconds first and convert to milliseconds at the end.
- level: 3
  en: Multiply the time in seconds by 1000 to get milliseconds.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '20'
  accept: []
solution_steps:
- en: The period is the reciprocal of the frequency, so T equals 1 divided by 50, which is 0.02 s, or 20 ms.
- en: The unit of the answer is ms.
- en: Answer = 20
tier: C
diagram_note: A sine wave drawn against a time axis with one complete cycle marked from its start to its end and the period labelled.
