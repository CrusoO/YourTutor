difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A series RLC circuit has R equal to 3 ohm, inductive reactance 8 ohm and capacitive reactance 4 ohm. The peak source voltage is 50 V. What is the peak current in ampere?
hints:
- level: 1
  en: The net reactance is the difference between the inductive and capacitive reactances.
- level: 2
  en: Combine the resistance and net reactance to find the impedance.
- level: 3
  en: Divide the peak voltage by the impedance.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10'
  accept: []
solution_steps:
- en: The net reactance is 8 minus 4, which is 4 ohm.
- en: The impedance is the square root of 3 squared plus 4 squared, which is 5 ohm.
- en: The peak current is 50 divided by 5, which is 10 A.
- en: The unit of the answer is A.
- en: Answer = 10
tier: C
diagram_note: A series loop containing a resistor labelled 3 ohm, an inductor labelled with reactance 8 ohm and a capacitor labelled with reactance 4 ohm, with a source of peak voltage 50 V.
