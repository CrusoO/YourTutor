id: A.12.physics.alternating_current.transformers.02
skill_ids:
- SK.A.12.physics.transformers
difficulty: 0.2
pool: practice
role: apply
stem:
  en: A transformer has 100 turns on the primary and 500 turns on the secondary. The primary voltage is 20 V. What is the secondary voltage in volt?
hints:
- level: 1
  en: Use the relation between the secondary and primary voltages and the turns on each coil.
- level: 2
  en: Find the turns ratio first.
- level: 3
  en: Multiply the primary voltage by that ratio.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '100'
  accept: []
solution_steps:
- en: The voltage ratio equals the turns ratio.
- en: The secondary voltage is 20 times 500 divided by 100, which is 100 V.
- en: The unit of the answer is V.
- en: Answer = 100
tier: C
