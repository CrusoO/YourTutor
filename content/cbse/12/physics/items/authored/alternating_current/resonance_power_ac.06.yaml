stem:
  en: A circuit has a resistance of 3 ohm and a net reactance of 4 ohm in series. What is its power factor?
hints:
- level: 1
  en: The power factor is the resistance divided by the impedance.
- level: 2
  en: Find the impedance from the resistance and the reactance first.
- level: 3
  en: Take the ratio of the resistance to that impedance.
prediction_prompt:
