id: A.12.physics.alternating_current.resonance_power_ac.03
skill_ids:
- SK.A.12.physics.resonance_power_ac
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: An AC circuit has rms voltage 100 V and rms current 2 A with a power factor of 0.5. What is the average power in watt?
hints:
- level: 1
  en: Average power uses the rms values and the power factor.
- level: 2
  en: Multiply the two rms values first.
- level: 3
  en: Apply the power factor as the last multiplication.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '100'
  accept: []
solution_steps:
- en: The average power is V rms times I rms times the power factor, which is 100 times 2 times 0.5, giving 100 W.
- en: The unit of the answer is W.
- en: Answer = 100
tier: C
diagram_note: A phasor diagram with a voltage vector and a current vector drawn from a common origin, separated by an angle that is marked on the diagram.
