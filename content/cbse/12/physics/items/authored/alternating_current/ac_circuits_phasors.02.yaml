stem:
  en: An inductor of inductance 0.1 H is connected to an AC source of angular frequency 1000 rad/s. What is its inductive reactance in ohm?
hints:
- level: 1
  en: Use the formula for inductive reactance in terms of angular frequency and inductance.
- level: 2
  en: Use the angular frequency as given, not the frequency in hertz.
- level: 3
  en: Multiply the angular frequency by the inductance.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
