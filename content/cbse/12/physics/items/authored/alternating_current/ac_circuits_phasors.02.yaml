answer:
  sympy: '100'
  accept: []
solution_steps:
- en: The inductive reactance is omega times L.
- en: Multiplying 1000 rad/s by 0.1 H gives 100 ohm.
- en: The unit of the answer is ohm.
- en: Answer = 100
