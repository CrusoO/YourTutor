id: A.12.physics.alternating_current.ac_circuits_phasors.01
skill_ids:
- SK.A.12.physics.ac_circuits_phasors
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In a purely inductive AC circuit, what is the phase relationship between the current and the voltage?
hints:
- level: 1
  en: Write the voltage across the inductor in terms of the rate of change of current.
- level: 2
  en: Think about which quantity reaches its peak first in a sinusoidal relation.
- level: 3
  en: Recall the phase angle between the two quantities in a quarter cycle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The current lags the voltage by 180 degrees
- id: b
  en: The current is in phase with the voltage
- id: c
  en: The current leads the voltage by 90 degrees
- id: d
  en: The current lags the voltage by 90 degrees
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.7F9DF71B03D5
  when_answer_equals:
  - c
- id: MC.A.F7D2171F0515
  when_answer_equals:
  - b
- id: MC.A.485E514DBC7F
  when_answer_equals:
  - a
solution_steps:
- en: For an inductor the voltage is L times the rate of change of current, so the voltage peaks a quarter cycle before the current.
- en: The current therefore lags by 90 degrees.
- en: The correct option is d.
tier: C
