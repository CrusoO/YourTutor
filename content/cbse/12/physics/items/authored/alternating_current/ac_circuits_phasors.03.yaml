stem:
  en: A series circuit has a resistor of 30 ohm and an inductor with reactance 40 ohm. What is the magnitude of its impedance in ohm?
hints:
- level: 1
  en: The impedance of a series resistor and reactance combines like the sides of a right-angled triangle.
- level: 2
  en: Square each of the two values before adding them.
- level: 3
  en: Take the square root of the sum as the last step.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '50'
  accept: []
solution_steps:
- en: The impedance of a series RL circuit is the square root of R squared plus X squared.
- en: This gives the square root of 900 plus 1600, which is 50 ohm.
- en: The unit of the answer is ohm.
- en: Answer = 50
tier: C
diagram_note: A series circuit with a resistor and an inductor in one loop, with the resistance labelled 30 ohm and the inductive reactance labelled 40 ohm.
