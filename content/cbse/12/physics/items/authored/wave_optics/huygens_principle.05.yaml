stem:
  en: A wave passes from medium 1 into medium 2. The ratio of the speed in medium 2 to the speed in medium 1 is 0.8, and the sine of the angle of incidence is 0.5. What is the sine of the angle of refraction?
hints:
- level: 1
  en: Use the relation between the sines of the angles and the speed ratio.
- level: 2
  en: Multiply the sine of the incidence angle by the speed ratio.
- level: 3
  en: Check that the result is smaller than one.
