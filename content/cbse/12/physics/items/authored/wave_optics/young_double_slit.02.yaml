difficulty: 0.2
pool: practice
role: apply
stem:
  en: A double slit experiment uses light of wavelength 6 x 10^-7 m, slits 1 x 10^-3 m apart, and a screen 1 m away. What is the fringe width in mm?
hints:
- level: 1
  en: Use the fringe width formula lambda times D over d.
- level: 2
  en: Convert the wavelength and slit separation to metre before dividing.
- level: 3
  en: Convert the answer from metre to millimetre at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.6'
  accept: []
solution_steps:
- en: The fringe width is lambda D over d.
- en: Substituting gives 6 x 10^-7 times 1 divided by 1 x 10^-3, which is 6 x 10^-4 m, or 0.6 mm.
- en: The unit of the answer is mm.
- en: Answer = 0.6
tier: C
