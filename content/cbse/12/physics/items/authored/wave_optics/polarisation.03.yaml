id: A.12.physics.wave_optics.polarisation.03
skill_ids:
- SK.A.12.physics.polarisation
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Unpolarised light of intensity 100 units passes through a polariser and then through a second polariser whose axis is at 30 degrees to the first. What is the final intensity in units?
hints:
- level: 1
  en: The first polariser halves unpolarised light.
- level: 2
  en: Apply Malus's law to the second polariser using the angle between the two axes.
- level: 3
  en: Cos squared of 30 degrees is three quarters.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '37.5'
  accept: []
solution_steps:
- en: The first polariser halves the unpolarised light to 50 units.
- en: Malus's law for the second gives 50 times cos squared 30 degrees, which is 50 times 0.75, equal to 37.5 units.
- en: Answer = 37.5
tier: C
diagram_note: Two polarising filters placed in line with light passing through them, each with its transmission axis marked, and the angle between the two axes shown as 30 degrees.
