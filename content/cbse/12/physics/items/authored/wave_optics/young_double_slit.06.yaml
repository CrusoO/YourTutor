difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Two slits are 1 mm apart and a screen is 1 m away. Light of wavelength 500 nm illuminates the slits. How far is the third bright fringe from the central fringe in mm?
hints:
- level: 1
  en: Bright fringes are at distances n times lambda times D over d from the centre.
- level: 2
  en: Use n equal to 3 for the third bright fringe.
- level: 3
  en: Convert the wavelength from nanometre to metre before the calculation.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.5'
  accept: []
solution_steps:
- en: Bright fringes are at y equal to n lambda D over d.
- en: For n equal to 3, y is 3 times 5 x 10^-7 times 1 divided by 1 x 10^-3, which is 1.5 x 10^-3 m, or 1.5 mm.
- en: The unit of the answer is mm.
- en: Answer = 1.5
tier: C
diagram_note: A screen with equally spaced bright fringes marked, the central fringe labelled, and the third bright fringe on one side labelled with its distance from the centre.
