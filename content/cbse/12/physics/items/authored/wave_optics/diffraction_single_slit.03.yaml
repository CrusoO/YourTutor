  accept: []
solution_steps:
- en: The first minimum occurs where a sin theta equals lambda.
- en: So sin theta is 5 x 10^-7 divided by 1 x 10^-6, which is 0.5, and theta is 30 degrees.
- en: The unit of the answer is degree.
- en: Answer = 30
