stem:
  en: Light of wavelength 5 x 10^-7 m passes through a single slit of width 1 x 10^-6 m. What is the angle in degree of the first minimum?
hints:
- level: 1
  en: The first minimum occurs where the slit width times the sine of the angle equals the wavelength.
- level: 2
  en: Divide the wavelength by the slit width to get the sine.
- level: 3
  en: Take the inverse sine to find the angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
