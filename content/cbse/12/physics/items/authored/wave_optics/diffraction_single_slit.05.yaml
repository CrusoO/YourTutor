  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: About twice the central intensity
- id: b
  en: Less than about five percent of the central intensity
- id: c
  en: About half the central intensity
- id: d
  en: The same as the central intensity
answer:
  sympy: b
  accept: []
