stem:
  en: In a single slit diffraction pattern, roughly how bright is the first secondary maximum compared with the central maximum?
hints:
- level: 1
  en: Think about how the light is distributed between the central band and the side bands.
- level: 2
  en: Consider whether the side bands can be as bright as the central band.
- level: 3
  en: Recall which maximum in a single slit pattern is the brightest.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
