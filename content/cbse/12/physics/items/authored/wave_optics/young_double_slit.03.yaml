difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A double slit setup has slits 1 x 10^-3 m apart, a screen 2 m away and light of wavelength 5 x 10^-7 m. What is the fringe width in mm?
hints:
- level: 1
  en: Write the fringe width as lambda times D over d.
- level: 2
  en: Keep all lengths in metre until the final step.
- level: 3
  en: Convert the result to millimetre last.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1'
  accept: []
solution_steps:
- en: The fringe width is lambda D over d.
- en: That is 5 x 10^-7 times 2 divided by 1 x 10^-3, which is 1 x 10^-3 m, or 1 mm.
- en: The unit of the answer is mm.
- en: Answer = 1
tier: C
diagram_note: Two narrow slits S1 and S2 drawn side by side with a screen at distance D to their right, and a bright fringe marked at the central position on the screen.
