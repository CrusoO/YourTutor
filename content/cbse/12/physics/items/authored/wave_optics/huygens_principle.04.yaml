stem:
  en: Why does a wavefront change direction when it enters a medium in which its speed is lower?
hints:
- level: 1
  en: Think about which part of the wavefront reaches the boundary first.
- level: 2
  en: Consider what happens to the lagging part of the front in the slower medium.
- level: 3
  en: Recall whether the frequency of a wave changes when it crosses a boundary.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
