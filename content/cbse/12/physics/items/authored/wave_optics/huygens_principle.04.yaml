type: mcq
options:
- id: a
  en: The wave stops at the boundary and restarts
- id: b
  en: The frequency of the wave decreases in the new medium
- id: c
  en: Different parts of the wavefront slow down at different times, so the front turns
- id: d
  en: The wave speeds up, which makes it bend
answer:
  sympy: c
  accept: []
