difficulty: 0.6
pool: practice
role: explain
stem:
  en: In a double slit pattern the fringe width is 0.4 mm. How far is the first dark fringe from the central bright fringe, in mm?
hints:
- level: 1
  en: Dark fringes lie halfway between adjacent bright fringes.
- level: 2
  en: Think about where the first dark fringe sits relative to the central bright fringe.
- level: 3
  en: Multiply the fringe width by one half.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.2'
  accept: []
solution_steps:
- en: Dark fringes lie halfway between bright fringes, so the first dark fringe is half a fringe width from the centre.
- en: That is 0.4 divided by 2, which is 0.2 mm.
- en: The unit of the answer is mm.
- en: Answer = 0.2
tier: C
