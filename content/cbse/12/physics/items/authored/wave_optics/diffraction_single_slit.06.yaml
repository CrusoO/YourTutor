stem:
  en: A single slit of width 2 x 10^-6 m is illuminated by light of wavelength 5 x 10^-7 m. What is the sine of the angle at which the second minimum occurs?
hints:
- level: 1
  en: Minima occur where the slit width times the sine of the angle equals a whole number times the wavelength.
- level: 2
  en: For the second minimum use the value of n that corresponds to it.
- level: 3
  en: Divide the product of the number and the wavelength by the slit width.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.5'
  accept: []
solution_steps:
- en: The minima occur where a sin theta equals n lambda.
- en: For the second minimum n is 2, so sin theta is 2 times 5 x 10^-7 divided by 2 x 10^-6, which is 0.5.
- en: Answer = 0.5
tier: C
diagram_note: A single slit with parallel rays passing through it and a set of angled rays drawn to the minima, with the angle to the second minimum marked on the screen side.
