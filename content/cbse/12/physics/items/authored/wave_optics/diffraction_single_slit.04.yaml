  sympy: '1'
  accept: []
solution_steps:
- en: The full width of the central maximum is 2 lambda D over a.
- en: That gives 2 times 5 x 10^-7 times 1 divided by 1 x 10^-3, which is 1 x 10^-3 m, or 1 mm.
- en: The unit of the answer is mm.
- en: Answer = 1
