stem:
  en: Light of wavelength 5 x 10^-7 m passes through a slit of width 1 x 10^-3 m and falls on a screen 1 m away. What is the full width of the central maximum in mm?
hints:
- level: 1
  en: The full width of the central maximum is twice lambda times D over the slit width.
- level: 2
  en: Use metre for all the lengths before multiplying.
- level: 3
  en: Convert the answer to millimetre at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
