difficulty: 0.2
pool: practice
role: apply
stem:
  en: What happens to the central maximum of a single slit diffraction pattern when the slit is made wider?
hints:
- level: 1
  en: Think about how the diffraction angle depends on the ratio of wavelength to slit width.
- level: 2
  en: Consider what a wider slit does to the spreading of the light.
- level: 3
  en: Compare the angular spread for a larger slit with that for a smaller slit.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It stays unchanged
- id: b
  en: It becomes narrower
- id: c
  en: It becomes wider
- id: d
  en: It shifts to one side of the screen
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.9C0CB8B20390
  when_answer_equals:
  - c
- id: MC.A.82E0C0DD2827
