solution_steps:
- en: The angular width of the central maximum is proportional to lambda over the slit width, so a wider slit gives a narrower central maximum.
- en: The correct option is b.
tier: C
diagram_note: A single slit with parallel rays passing through it and a narrow central band on a distant screen, with a second drawing showing a wider slit and a narrower band.
