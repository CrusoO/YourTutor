difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A wavefront passes from a medium where its speed is 3 x 10^8 m/s into one where its speed is 2 x 10^8 m/s. What is the ratio of sin i to sin r for the wavefront?
hints:
- level: 1
  en: The Huygens construction gives sin i over sin r equal to a ratio of speeds.
- level: 2
  en: Put the speed in the first medium in the numerator.
- level: 3
  en: Divide the first speed by the second.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.5'
  accept: []
solution_steps:
- en: The Huygens construction gives sin i over sin r equal to the ratio of the speeds in the two media.
- en: That is 3 x 10^8 over 2 x 10^8, which equals 1.5.
- en: Answer = 1.5
tier: C
diagram_note: A plane wavefront crossing a boundary between two media at an angle, with the incident wavefront, the boundary and the refracted wavefront drawn and the two angles marked.
