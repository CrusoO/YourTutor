difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A full-wave bridge rectifier is fed with a 12 V peak AC input. Each conducting diode drops 0.7 V, and two diodes conduct at any instant. What is the peak output voltage across the load in volt?
hints:
- level: 1
  en: Find how many diodes conduct at any instant in a bridge rectifier.
- level: 2
  en: Multiply the drop per diode by the number of conducting diodes.
- level: 3
  en: Subtract the total drop from the peak input voltage.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10.6'
  accept: []
solution_steps:
- en: Two diodes conduct at each instant, so the drop is 1.4 V.
- en: The peak output is 12 minus 1.4, which is 10.6 V.
- en: The unit of the answer is V.
- en: Answer = 10.6
tier: C
diagram_note: A bridge rectifier with four diodes arranged in a diamond, an AC input across two opposite corners, and the load across the other two corners, with the conducting path highlighted.
