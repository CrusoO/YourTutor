stem:
  en: An intrinsic carrier concentration is 1 x 10^10 per cm^3. A donor doping adds 1 x 10^15 per cm^3 electrons. What is the hole concentration in per cm^3?
hints:
- level: 1
  en: The product of the electron and hole concentrations equals the intrinsic concentration squared.
- level: 2
  en: Divide the square of the intrinsic concentration by the electron concentration.
- level: 3
  en: Keep the powers of ten exact in the division.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
