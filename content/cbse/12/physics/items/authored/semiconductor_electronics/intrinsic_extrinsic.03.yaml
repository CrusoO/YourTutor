solution_steps:
- en: The product of electron and hole concentrations equals the intrinsic concentration squared.
- en: Dividing 1 x 10^20 by 1 x 10^15 gives 1 x 10^5 holes per cm^3.
- en: The unit of the answer is per cm^3.
