type: mcq
options:
- id: a
  en: The dopant atoms widen the band gap
- id: b
  en: The dopant atoms supply many extra charge carriers
- id: c
  en: The dopant atoms reduce the number of carriers
- id: d
  en: The dopant atoms make the crystal stronger
