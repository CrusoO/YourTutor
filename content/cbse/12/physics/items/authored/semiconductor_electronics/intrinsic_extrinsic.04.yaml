stem:
  en: Why does adding a small amount of dopant increase the conductivity of a semiconductor so much?
hints:
- level: 1
  en: Think about how many carriers a small dopant concentration can supply.
- level: 2
  en: Compare the carriers from doping with those from thermal excitation in the pure crystal.
- level: 3
  en: Consider which property of the material controls how much current it carries.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
