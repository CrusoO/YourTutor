stem:
  en: What is the output of a NAND gate when both of its inputs are high?
hints:
- level: 1
  en: Start by finding the output of the AND stage for these two inputs.
- level: 2
  en: Apply the inversion that follows the AND stage.
- level: 3
  en: Consider what an inverter does to a high input.
prediction_prompt:
