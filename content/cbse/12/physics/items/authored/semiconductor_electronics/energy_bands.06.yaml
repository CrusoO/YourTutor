stem:
  en: A material has a band gap of 0.62 eV. What is the longest wavelength in nm of light that it can absorb? Use hc equal to 1240 eV nm.
hints:
- level: 1
  en: The longest absorbed wavelength corresponds to a photon with exactly the band gap energy.
- level: 2
  en: Divide the constant hc by the band gap energy.
- level: 3
  en: Keep the answer in nanometre.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2000'
  accept: []
solution_steps:
- en: The longest absorbed wavelength corresponds to the band gap energy.
- en: Dividing 1240 eV nm by 0.62 eV gives 2000 nm.
- en: The unit of the answer is nm.
- en: Answer = 2000
tier: C
diagram_note: A band diagram with a narrow gap marked at 0.62 eV and an infrared photon arrow drawn with energy matching that gap.
