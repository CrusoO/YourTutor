id: A.12.physics.semiconductor_electronics.energy_bands.03
skill_ids:
- SK.A.12.physics.energy_bands
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A semiconductor has a band gap of 2.0 eV. What is the longest wavelength in nm of light it can absorb? Use hc equal to 1240 eV nm.
hints:
- level: 1
  en: A photon must have at least the band gap energy to be absorbed.
- level: 2
  en: Use wavelength equal to hc divided by that energy.
- level: 3
  en: Divide 1240 by the gap energy in eV.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '620'
  accept: []
solution_steps:
- en: A photon must have at least the band gap energy.
- en: Its wavelength is hc divided by the gap energy, which is 1240 divided by 2.0, equal to 620 nm.
- en: The unit of the answer is nm.
- en: Answer = 620
tier: C
diagram_note: An energy band diagram with the valence band at the bottom, the conduction band at the top, the gap marked, and a photon arrow drawn with energy equal to the gap.
