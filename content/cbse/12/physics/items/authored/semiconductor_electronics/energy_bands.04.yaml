id: A.12.physics.semiconductor_electronics.energy_bands.04
skill_ids:
- SK.A.12.physics.energy_bands
difficulty: 0.6
pool: practice
role: explain
stem:
  en: What happens to the conductivity of a pure semiconductor when its temperature rises?
hints:
- level: 1
  en: Think about how heat affects the number of electrons that can cross the band gap.
- level: 2
  en: Compare the trend in a semiconductor with the trend in a metal.
- level: 3
  en: Consider how many carriers are available to carry current.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It increases, because more electrons are thermally excited into the conduction band
- id: b
  en: It decreases, as it does in a metal
- id: c
  en: It becomes a superconductor
- id: d
  en: It stays exactly the same
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.408D2BFE1B11
  when_answer_equals:
  - b
- id: MC.A.4ABADC150453
  when_answer_equals:
  - d
- id: MC.A.4EC7670A2233
  when_answer_equals:
  - c
solution_steps:
- en: Heating supplies energy for more electrons to cross the gap, creating more carriers, so the conductivity of a semiconductor rises with temperature.
- en: The correct option is a.
tier: C
