difficulty: 0.2
pool: practice
role: recall
stem:
  en: When does a p-n junction diode conduct easily?
hints:
- level: 1
  en: Think about which polarity of the applied voltage lowers the barrier at the junction.
- level: 2
  en: Consider how the depletion region changes with that polarity.
- level: 3
  en: Recall which bias allows majority carriers to cross the junction easily.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: When it is left unbiased
- id: b
  en: When it is forward biased
- id: c
  en: When it is reverse biased below its breakdown voltage
- id: d
  en: When it is reverse biased
answer:
  sympy: b
  accept: []
