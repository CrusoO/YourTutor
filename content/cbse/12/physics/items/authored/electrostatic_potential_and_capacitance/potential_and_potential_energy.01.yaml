stem:
  en: Taking the potential at infinity as zero, what is the sign and distance behaviour of the potential due to an isolated positive point charge?
hints:
- level: 1
  en: Consider the sign of the source charge that creates the potential.
- level: 2
  en: Think about what happens to the potential at points very far away.
- level: 3
  en: Compare the potential at a near point and a far point from the charge.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Zero at every point
- id: b
  en: Positive and increasing as distance increases
- id: c
  en: Negative and decreasing as distance increases
- id: d
  en: Positive and decreasing as distance increases
answer:
  sympy: d
  accept: []
