stem:
  en: A 4 microfarad capacitor charged to 100 V is disconnected from the supply and its plate separation is halved. What is the final stored energy in millijoule?
hints:
- level: 1
  en: After disconnection the charge on the plates stays fixed.
- level: 2
  en: Use the energy formula written in terms of charge and capacitance.
- level: 3
  en: Check how the capacitance changes when the separation is halved.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10'
  accept: []
solution_steps:
- en: After disconnection the charge stays fixed.
- en: Halving the separation doubles the capacitance, so the energy Q squared over 2C halves from 20 millijoule to 10 millijoule.
- en: The unit of the answer is millijoule.
- en: Answer = 10
tier: C
