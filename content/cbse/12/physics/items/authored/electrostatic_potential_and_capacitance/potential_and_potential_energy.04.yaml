type: numeric
answer:
  sympy: '0.0004'
  accept: []
solution_steps:
- en: The change in potential energy is the charge times the change in potential.
- en: Here it is 2 x 10^-6 times 200, which is 0.0004 J.
- en: The unit of the answer is J.
- en: Answer = 0.0004
