stem:
  en: A charge of 2 microcoulomb moves from a point at 50 V to a point at 250 V. What is the change in its electric potential energy in joules?
hints:
- level: 1
  en: The change in potential energy is the charge multiplied by the potential difference.
- level: 2
  en: Convert the charge to coulomb before multiplying.
- level: 3
  en: Subtract the starting potential from the final potential first.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
