stem:
  en: A dipole has moment 2 x 10^-8 C m. What is the potential in volts at a point 0.5 m away on its axis? Use k = 9 x 10^9 N m^2 C^-2.
hints:
- level: 1
  en: Use the axial dipole potential formula, which has a factor of 2k in the numerator.
- level: 2
  en: Square the distance before dividing.
- level: 3
  en: Keep the dipole moment in coulomb metre throughout.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1440'
  accept: []
solution_steps:
- en: The axial potential of a dipole is 2kp over r squared.
- en: With these values it gives 2 x 9 x 10^9 x 2 x 10^-8 divided by 0.25, which is 1440 V.
- en: The unit of the answer is V.
- en: Answer = 1440
