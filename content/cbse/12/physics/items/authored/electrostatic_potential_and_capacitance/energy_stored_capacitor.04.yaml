difficulty: 0.6
pool: practice
role: explain
stem:
  en: A 10 microfarad capacitor stores 0.2 J of energy. What is the voltage across it in volts?
hints:
- level: 1
  en: Rearrange the energy formula so the voltage is the subject.
- level: 2
  en: Multiply both sides by two before dividing by the capacitance.
- level: 3
  en: Take the square root as the last step.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '200'
  accept: []
solution_steps:
- en: Rearranging gives V squared equal to twice the energy over the capacitance.
- en: That is 0.4 divided by 10 to the minus 5, which equals 40000, so V is 200 V.
- en: The unit of the answer is V.
- en: Answer = 200
tier: C
