difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A dipole with moment 4 x 10^-9 C m is placed at 90 degrees to a uniform electric field of 5 x 10^4 N/C. What is the magnitude of the torque in newton metre?
hints:
- level: 1
  en: The torque depends on the sine of the angle between the moment and the field.
- level: 2
  en: At 90 degrees the sine takes its largest value.
- level: 3
  en: Multiply the dipole moment by the field strength.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.0002'
  accept: []
solution_steps:
- en: The torque on a dipole in a uniform field is p E sin theta.
- en: At 90 degrees the sine is 1, so the torque is 4 x 10^-9 times 5 x 10^4, which is 0.0002 N m.
- en: The unit of the answer is N m.
- en: Answer = 0.0002
tier: C
diagram_note: A dipole drawn as two opposite charges joined by a short arrow for its moment, placed perpendicular to a set of horizontal uniform field lines.
