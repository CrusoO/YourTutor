answer:
  sympy: '180000'
  accept: []
solution_steps:
- en: The potential of a point charge is k times the charge divided by the distance.
- en: With k = 9 x 10^9 N m^2 C^-2 this gives 180000 V.
- en: The unit of the answer is V.
- en: Answer = 180000
