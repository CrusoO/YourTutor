stem:
  en: What is the electric potential in volts at a distance of 0.3 m from a point charge of 6 microcoulomb in vacuum?
hints:
- level: 1
  en: Write the potential of a point charge as k times q over r, with k equal to 9 x 10^9 N m^2 C^-2.
- level: 2
  en: Convert the charge from microcoulomb to coulomb before you substitute.
- level: 3
  en: Divide by the distance as the last step.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
