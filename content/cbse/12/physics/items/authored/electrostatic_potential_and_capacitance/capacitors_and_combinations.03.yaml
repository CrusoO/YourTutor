stem:
  en: Two capacitors of 6 microfarad and 3 microfarad are connected in series. What is their equivalent capacitance in microfarad?
hints:
- level: 1
  en: Add the reciprocals of the two capacitances.
- level: 2
  en: Invert the sum at the end to get the equivalent value.
- level: 3
  en: Check that your answer is smaller than the smallest capacitor.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: For series capacitors the reciprocal of the total equals the sum of the reciprocals.
- en: One over 6 plus one over 3 is one half, so the total is 2 microfarad.
- en: The unit of the answer is microfarad.
- en: Answer = 2
tier: C
