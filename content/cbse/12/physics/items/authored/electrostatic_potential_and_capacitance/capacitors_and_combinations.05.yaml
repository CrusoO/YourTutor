stem:
  en: A 2 microfarad capacitor is connected in parallel with a series pair made of two 4 microfarad capacitors. What is the equivalent capacitance in microfarad?
hints:
- level: 1
  en: Find the equivalent of the series pair first.
- level: 2
  en: Then add the result in parallel with the other capacitor.
- level: 3
  en: Each step uses a different combination rule, so keep them separate.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
