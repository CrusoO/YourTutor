role: transfer
stem:
  en: A 10 microfarad capacitor charged to 100 V is connected in parallel with an uncharged 10 microfarad capacitor. What is the final charge in millicoulomb on the originally charged capacitor?
hints:
- level: 1
  en: Charge is conserved when the capacitors are joined together.
- level: 2
  en: Find the total charge before the connection and the total capacitance after it.
- level: 3
  en: Divide the total charge in proportion to the capacitances.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.5'
  accept: []
solution_steps:
- en: The initial charge is 10 microfarad times 100 V, which is 1 millicoulomb.
- en: Charge is conserved and shares equally between the two identical capacitors, so each keeps 0.5 millicoulomb.
- en: The unit of the answer is millicoulomb.
- en: Answer = 0.5
tier: C
diagram_note: Two capacitor symbols placed side by side and joined by wires to a common pair of terminals. The first is labelled 100 V before the connection and the second is labelled uncharged.
