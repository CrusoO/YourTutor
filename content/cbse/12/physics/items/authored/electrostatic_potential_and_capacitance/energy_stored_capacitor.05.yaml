stem:
  en: A parallel plate capacitor stays connected to a battery while its plate separation is doubled. What happens to the energy stored in it?
hints:
- level: 1
  en: Note whether the voltage or the charge is fixed while the battery is connected.
- level: 2
  en: Find how the capacitance depends on the plate separation.
- level: 3
  en: Use the energy formula that matches the quantity that stays fixed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It becomes four times larger
- id: b
  en: It halves
- id: c
  en: It stays the same
- id: d
  en: It doubles
answer:
  sympy: b
  accept: []
