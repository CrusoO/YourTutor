id: A.12.physics.electrostatic_potential_and_capacitance.dipole_potential.05
skill_ids:
- SK.A.12.physics.dipole_potential
difficulty: 0.9
pool: practice
role: explain
stem:
  en: In a uniform electric field, at what orientation is the potential energy of an electric dipole at its minimum?
hints:
- level: 1
  en: Use the expression for the potential energy of a dipole in a uniform field.
- level: 2
  en: Find the angle at which the cosine in that expression is largest.
- level: 3
  en: Think about the sign in front of the potential energy expression.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Moment perpendicular to the field
- id: b
  en: Moment antiparallel to the field
- id: c
  en: Moment at 45 degrees to the field
- id: d
  en: Moment parallel to the field
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.9A3C2B74A99F
  when_answer_equals:
  - b
- id: MC.A.02330C6D2448
  when_answer_equals:
