id: A.12.physics.electrostatic_potential_and_capacitance.equipotential_surfaces.04
skill_ids:
- SK.A.12.physics.equipotential_surfaces
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Concentric spherical equipotential surfaces of radii 0.1 m and 0.2 m surround a point charge of 2 microcoulomb in vacuum. What is the potential difference in volts between the two surfaces?
hints:
- level: 1
  en: Write the potential at each radius using k q over r.
- level: 2
  en: Subtract the two potentials, not the two radii.
- level: 3
  en: Keep the powers of ten exact when you multiply.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '90000'
  accept: []
solution_steps:
- en: The potential at each radius is k q over r.
- en: The difference is k q times (1 over 0.1 minus 1 over 0.2), which is 9 x 10^9 x 2 x 10^-6 x 5, giving 90000 V.
- en: The unit of the answer is V.
- en: Answer = 90000
tier: C
diagram_note: Two concentric circles around a central dot labelled plus 2 microcoulomb, the inner circle marked with radius 0.1 m and the outer circle marked with radius 0.2 m, both labelled as equipotential surfaces.
