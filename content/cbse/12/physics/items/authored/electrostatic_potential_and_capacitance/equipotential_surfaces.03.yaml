difficulty: 0.6
pool: practice
role: explain
stem:
  en: A charge of 3 microcoulomb moves between two points on the same equipotential surface at 120 V. What is the work done by the electric field in joules?
hints:
- level: 1
  en: Work done equals the charge times the potential difference between the endpoints.
- level: 2
  en: Compare the potential at the starting point with the potential at the finishing point.
- level: 3
  en: Both points are on the same surface, so think about what they share.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0'
  accept: []
solution_steps:
- en: Work equals the charge times the potential difference between the endpoints.
- en: Both points lie on the same equipotential, so the potential difference is zero and no work is done.
- en: The unit of the answer is J.
- en: Answer = 0
tier: C
