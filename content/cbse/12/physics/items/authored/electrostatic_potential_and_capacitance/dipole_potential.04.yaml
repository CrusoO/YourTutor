difficulty: 0.6
pool: practice
role: explain
stem:
  en: A dipole has charges of plus 5 microcoulomb and minus 5 microcoulomb separated by 0.02 m. What is the magnitude of its dipole moment in microcoulomb metre?
hints:
- level: 1
  en: The dipole moment is the magnitude of one charge multiplied by the separation.
- level: 2
  en: Use the charge in microcoulomb and the distance in metre directly.
- level: 3
  en: Do not include the sign of the charges in the magnitude.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.1'
  accept: []
solution_steps:
- en: The dipole moment is the magnitude of one charge times the separation.
- en: Here it is 5 microcoulomb times 0.02 m, which is 0.1 microcoulomb metre.
- en: The unit of the answer is microcoulomb metre.
- en: Answer = 0.1
tier: C
diagram_note: Two dots on a horizontal line, labelled plus 5 microcoulomb and minus 5 microcoulomb, separated by a 0.02 m line, with an arrow pointing from the negative dot to the positive dot.
