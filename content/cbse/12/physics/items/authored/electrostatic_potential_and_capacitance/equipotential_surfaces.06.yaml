stem:
  en: The electric potential at a distance of 0.2 m from a point charge is 450 V in vacuum. What is the magnitude of the charge in microcoulomb?
hints:
- level: 1
  en: Rearrange the potential formula to make the charge the subject.
- level: 2
  en: Multiply the potential by the distance before dividing by k.
- level: 3
  en: Convert the answer from coulomb to microcoulomb at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.01'
  accept: []
solution_steps:
- en: Rearranging V = kq over r gives q = V r over k.
- en: With V = 450 V, r = 0.2 m and k = 9 x 10^9, the charge is 10^-8 C, which is 0.01 microcoulomb.
- en: The unit of the answer is microcoulomb.
- en: Answer = 0.01
