id: A.12.physics.electrostatic_potential_and_capacitance.equipotential_surfaces.02
skill_ids:
- SK.A.12.physics.equipotential_surfaces
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which shape describes the equipotential surfaces around an isolated point charge?
hints:
- level: 1
  en: Consider which quantity stays fixed on an equipotential surface.
- level: 2
  en: Think about which surface has the same distance from the charge at every point.
- level: 3
  en: Compare the potential formula with the shape of constant distance.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Concentric spheres centred on the charge
- id: b
  en: Cubes with the charge at one corner
- id: c
  en: Parallel planes
- id: d
  en: A plane passing through the charge
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.944601EBBCAC
  when_answer_equals:
  - c
- id: MC.A.652AC4BE06C0
  when_answer_equals:
  - d
- id: MC.A.10EDDBA75314
  when_answer_equals:
  - b
solution_steps:
- en: An isolated point charge gives a potential that depends only on distance from the charge.
- en: Surfaces of equal distance are therefore concentric spheres.
- en: The correct option is a.
tier: C
