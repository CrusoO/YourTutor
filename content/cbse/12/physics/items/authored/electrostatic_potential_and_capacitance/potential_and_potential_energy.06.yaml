stem:
  en: Two point charges of +1 microcoulomb and +2 microcoulomb are placed 0.1 m apart in vacuum. What is the electric potential energy of this pair in joules?
hints:
- level: 1
  en: Write the pair energy as k times the product of the two charges over their separation.
- level: 2
  en: Convert both charges to coulomb before multiplying them.
- level: 3
  en: Keep the powers of ten exact when you multiply and divide.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
