answer:
  sympy: '0.18'
  accept: []
solution_steps:
- en: The potential energy of a pair is k times the product of the charges divided by their separation.
- en: With these values it equals 0.18 J.
- en: The unit of the answer is J.
- en: Answer = 0.18
