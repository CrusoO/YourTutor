stem:
  en: A dipole of moment 1.2 x 10^-7 C m is aligned parallel to a uniform electric field of 2 x 10^4 N/C. What is its potential energy in joules?
hints:
- level: 1
  en: Write the potential energy as minus p times E when the angle is zero.
- level: 2
  en: Multiply the dipole moment and the field strength first.
- level: 3
  en: Pay attention to the sign of the result.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-0.0024'
  accept: []
solution_steps:
- en: For a dipole aligned with the field the potential energy is minus p E.
- en: Multiplying 1.2 x 10^-7 by 2 x 10^4 gives 2.4 x 10^-3 J, so the energy is negative.
- en: The unit of the answer is J.
- en: Answer = -0.0024
tier: C
