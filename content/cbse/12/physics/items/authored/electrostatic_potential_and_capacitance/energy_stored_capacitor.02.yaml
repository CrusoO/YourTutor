stem:
  en: A 4 microfarad capacitor is charged to 50 V. What is the energy stored in joules?
hints:
- level: 1
  en: Use one half times the capacitance times the voltage squared.
- level: 2
  en: Convert the capacitance from microfarad to farad before you multiply.
- level: 3
  en: Square the voltage before multiplying by the other factors.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
