  author: model-draft
type: numeric
answer:
  sympy: '0.005'
  accept: []
solution_steps:
- en: The energy is one half times 4 x 10^-6 times 50 squared, which is 0.005 J.
- en: The unit of the answer is J.
- en: Answer = 0.005
