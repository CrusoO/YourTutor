solution_steps:
- en: The parallel pair gives 12 microfarad.
- en: That combined with the third 6 microfarad capacitor in series gives one over 12 plus one over 6, which is one quarter, so the equivalent is 4 microfarad.
- en: The correct option is b.
tier: C
diagram_note: A network with two capacitor symbols side by side on the top branch, wired in parallel, and a third capacitor below them connected in series.
