id: A.12.physics.electric_charges_and_fields.electric_field_lines.01
skill_ids:
- SK.A.12.physics.electric_field_lines
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which statement about electric field lines is correct?
hints:
- level: 1
  en: Think about what it would mean for the field to point two ways at one point.
- level: 2
  en: Recall which sign of charge the lines begin on.
- level: 3
  en: Consider what a higher density of lines represents.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They are denser where the field is weaker
- id: b
  en: They never cross each other
- id: c
  en: They start on negative charges and end on positive charges
- id: d
  en: They always form closed loops around a positive charge
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.DACF864317DE
  when_answer_equals:
  - d
- id: MC.A.4340F4EA5F60
  when_answer_equals:
  - a
- id: MC.A.07351F9C66AD
  when_answer_equals:
  - c
solution_steps:
- en: Field lines start on positive charges and end on negative charges.
- en: Two lines cannot cross, because the field has only one direction at any point.
- en: The correct option is b.
tier: C
