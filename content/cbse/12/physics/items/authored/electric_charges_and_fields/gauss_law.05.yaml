difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Using k = 9 x 10^9 N m^2 C^-2, find the magnitude of the electric field in newtons per coulomb at 0.1 m from a long straight wire carrying a uniform linear charge density of 2 microcoulomb per metre.
hints:
- level: 1
  en: Use the field of a long wire, which has a factor of 2k in the numerator.
- level: 2
  en: Keep the inverse dependence on distance in mind when you check the order of magnitude.
- level: 3
  en: Convert the linear charge density to coulomb per metre before substituting.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '360000'
  accept: []
solution_steps:
- en: A long wire gives a field of 2k times the linear charge density divided by the distance.
- en: With these values the field is 2 x 9 x 10^9 x 2 x 10^-6 divided by 0.1, which is 360000 N/C.
- en: The unit of the answer is N/C.
- en: Answer = 360000
tier: C
diagram_note: A long straight vertical line representing the wire, with arrows pointing radially outward from it, and a point marked at a perpendicular distance of 0.1 m from the wire.
