difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is the total electric flux in N m^2 C^-1 through a closed surface that encloses a net charge of 8.85 microcoulomb in vacuum? Use epsilon zero equal to 8.85 x 10^-12 C^2 N^-1 m^-2.
hints:
- level: 1
  en: Recall the relation between total flux and the enclosed charge.
- level: 2
  en: Convert the charge to coulomb before dividing.
- level: 3
  en: Divide the powers of ten separately from the numerical parts.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1000000'
  accept: []
solution_steps:
- en: Gauss's law states that the total flux equals the enclosed charge divided by epsilon zero.
- en: Dividing 8.85 x 10^-6 by 8.85 x 10^-12 gives 1000000.
- en: The unit of the answer is N m^2 C^-1.
- en: Answer = 1000000
tier: C
