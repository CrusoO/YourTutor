id: A.12.physics.electric_charges_and_fields.electric_field_lines.02
skill_ids:
- SK.A.12.physics.electric_field_lines
difficulty: 0.2
pool: practice
role: explain
stem:
  en: Two equal and opposite point charges form an electric dipole. Compared with the number of field lines that leave the positive charge, how many field lines end on the negative charge?
hints:
- level: 1
  en: Recall where field lines begin and where they finish.
- level: 2
  en: Compare the magnitudes of the two charges in the dipole.
- level: 3
  en: Think about the link between the number of lines and the size of the charge.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Half as many
- id: b
  en: The same number
- id: c
  en: None, because lines stop at the positive charge
- id: d
  en: Twice as many
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.6D8110637098
  when_answer_equals:
  - d
- id: MC.A.630E1C6DCD69
  when_answer_equals:
  - a
- id: MC.A.92920D2ECF39
  when_answer_equals:
  - c
solution_steps:
- en: The number of field lines is proportional to the charge, and each line starts on a positive charge and ends on a negative one.
- en: Equal and opposite charges therefore have equal line counts.
- en: The correct option is b.
tier: C
diagram_note: Two dots on a horizontal line. The left dot is labelled plus q and the right dot is labelled minus q, with several curved lines running from the left dot to the right dot.
