difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A charge of +4 microcoulomb sits at x = 0 and a charge of -4 microcoulomb sits at x = 0.6 m in vacuum. What is the magnitude of the net electric field in newtons per coulomb at x = 0.3 m?
hints:
- level: 1
  en: Find the field from each charge separately at the midpoint.
- level: 2
  en: Check whether the two fields point in the same direction or opposite directions.
- level: 3
  en: Each charge is 0.3 m from the midpoint, so use that distance for both.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '800000'
  accept: []
solution_steps:
- en: Each charge gives a field of 400000 N/C at the midpoint, and both fields point towards the negative charge.
- en: The two magnitudes add to 800000 N/C.
- en: The unit of the answer is N/C.
- en: Answer = 800000
tier: C
diagram_note: A horizontal axis with +4 microcoulomb at x = 0, -4 microcoulomb at x = 0.6 m, and the midpoint marked with two arrows that both point towards the negative charge.
