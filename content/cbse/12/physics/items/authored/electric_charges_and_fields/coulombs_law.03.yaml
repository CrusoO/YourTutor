stem:
  en: Charges of +4 microcoulomb and -4 microcoulomb sit 0.2 m apart in vacuum. What is the magnitude of the electrostatic force in newtons?
hints:
- level: 1
  en: The force magnitude does not depend on the sign of each charge.
- level: 2
  en: Square the separation before dividing.
- level: 3
  en: Keep track of the powers of ten when multiplying the two charges.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3.6'
  accept: []
solution_steps:
- en: The magnitude depends only on the product of the charge magnitudes and the square of the separation.
- en: Substituting gives 3.6 N, and the attractive sign does not change the magnitude.
- en: The unit of the answer is N.
- en: Answer = 3.6
tier: C
