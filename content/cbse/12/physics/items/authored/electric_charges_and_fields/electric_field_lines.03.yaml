stem:
  en: What is the magnitude of the electric field in newtons per coulomb at a distance of 0.5 m from a point charge of 1 microcoulomb in vacuum?
hints:
- level: 1
  en: Use the point charge field formula with k equal to 9 x 10^9 N m^2 C^-2.
- level: 2
  en: Convert the charge to coulomb before substituting.
- level: 3
  en: Square the distance before dividing.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '36000'
  accept: []
solution_steps:
- en: The point charge field is k times the charge divided by the square of the distance.
- en: With k = 9 x 10^9 N m^2 C^-2, this gives 36000 N/C.
- en: The unit of the answer is N/C.
- en: Answer = 36000
