difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A charge of +2 microcoulomb is fixed at the origin and a charge of -6 microcoulomb is fixed at x = 0.4 m. What is the magnitude of the net electrostatic force in newtons on a charge of +1 microcoulomb placed at x = 0.2 m?
hints:
- level: 1
  en: Find the force from each fixed charge separately on the charge at x = 0.2 m.
- level: 2
  en: Decide whether each force pulls or pushes the test charge along the x axis.
- level: 3
  en: Check whether the two forces point in the same or opposite directions before adding.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.8'
  accept: []
solution_steps:
- en: The two forces act along the same line and point in the same direction, so they add.
- en: The force from the positive charge is 0.45 N and from the negative charge is 1.35 N, giving 1.8 N.
- en: The unit of the answer is N.
- en: Answer = 1.8
tier: C
diagram_note: 'A horizontal axis with three marked points: a +2 microcoulomb charge at the origin, a +1 microcoulomb test charge at x = 0.2 m, and a -6 microcoulomb charge at x = 0.4 m, with arrows showing the forces on the test charge.'
