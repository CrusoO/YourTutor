id: A.12.physics.electric_charges_and_fields.electric_field_lines.04
skill_ids:
- SK.A.12.physics.electric_field_lines
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A region between two large parallel charged plates is shown with field lines. Which feature of the lines tells you that the field is uniform?
hints:
- level: 1
  en: Think about how the lines look far away from any single charge.
- level: 2
  en: Consider the spacing between neighbouring lines in the region.
- level: 3
  en: Compare the pattern with the field near one isolated point charge.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Lines that curve everywhere in the region
- id: b
  en: Lines converging towards one side
- id: c
  en: Parallel, equally spaced lines
- id: d
  en: Lines radiating outward from a single point
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.52F4EA416458
  when_answer_equals:
  - d
- id: MC.A.4554E8D96422
  when_answer_equals:
  - b
- id: MC.A.30357B04FE97
  when_answer_equals:
  - a
solution_steps:
- en: A uniform field has parallel field lines with the same spacing everywhere, so the field strength is constant.
- en: Equal spacing means equal field strength.
- en: The correct option is c.
tier: C
diagram_note: A region between two large parallel plates with straight, evenly spaced arrows running from the positive plate to the negative plate.
