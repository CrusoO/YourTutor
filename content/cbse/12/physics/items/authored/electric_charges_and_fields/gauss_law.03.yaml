id: A.12.physics.electric_charges_and_fields.gauss_law.03
skill_ids:
- SK.A.12.physics.gauss_law
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: An infinite plane sheet has surface charge density 1.77 x 10^-9 C/m^2. What is the magnitude of the electric field in newtons per coulomb near it? Use epsilon zero equal to 8.85 x 10^-12 C^2 N^-1 m^-2.
hints:
- level: 1
  en: Use the formula for a sheet, which has a factor of two in the denominator.
- level: 2
  en: Write 2 times epsilon zero before dividing.
- level: 3
  en: Keep the powers of ten exact when dividing.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '100'
  accept: []
solution_steps:
- en: The field of a sheet is the surface density divided by twice epsilon zero.
- en: Substituting gives 1.77 x 10^-9 divided by 1.77 x 10^-11, which is 100 N/C.
- en: The unit of the answer is N/C.
- en: Answer = 100
tier: C
