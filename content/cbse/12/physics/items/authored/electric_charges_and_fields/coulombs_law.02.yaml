stem:
  en: Two point charges of 2 microcoulomb and 3 microcoulomb are placed 0.3 m apart in vacuum. What is the magnitude of the electrostatic force in newtons?
hints:
- level: 1
  en: Write Coulomb's law with k equal to 9 x 10^9 N m^2 C^-2.
- level: 2
  en: Convert both charges from microcoulomb to coulomb before substituting.
- level: 3
  en: Check that the units of your result come out in newtons.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.6'
  accept: []
solution_steps:
- en: Coulomb's law with k = 9 x 10^9 N m^2 C^-2 gives the force from the product of the charges divided by the square of the separation.
- en: Converting the charges to coulombs first gives 0.6 N.
- en: The unit of the answer is N.
- en: Answer = 0.6
tier: C
diagram_note: A horizontal line with two dots. The left dot is labelled 2 microcoulomb and the right dot is labelled 3 microcoulomb, with a double arrow of 0.3 m between them.
