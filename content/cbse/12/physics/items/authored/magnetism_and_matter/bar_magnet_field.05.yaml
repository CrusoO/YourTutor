id: A.12.physics.magnetism_and_matter.bar_magnet_field.05
skill_ids:
- SK.A.12.physics.bar_magnet_field
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A bar magnet is cut in two across its middle. What do the two pieces become?
hints:
- level: 1
  en: Consider whether isolated magnetic poles have ever been observed.
- level: 2
  en: Think about where the field lines of each piece must close.
- level: 3
  en: Recall what each small piece does to the field around it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Two demagnetised pieces with no field at all
- id: b
  en: One piece with only a north pole and one with only a south pole
- id: c
  en: Two smaller magnets, each with both a north pole and a south pole
- id: d
  en: Two single magnetic monopoles
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.9923107EFB3A
  when_answer_equals:
  - b
- id: MC.A.AFACE54F8999
  when_answer_equals:
  - d
- id: MC.A.E2B7F7D30117
  when_answer_equals:
  - a
solution_steps:
- en: Magnetic dipoles cannot be split into isolated poles.
- en: Each piece of a cut magnet is a smaller magnet with its own north and south poles.
- en: The correct option is c.
tier: C
