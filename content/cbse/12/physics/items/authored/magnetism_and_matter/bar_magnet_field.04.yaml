id: A.12.physics.magnetism_and_matter.bar_magnet_field.04
skill_ids:
- SK.A.12.physics.bar_magnet_field
difficulty: 0.6
pool: practice
role: explain
stem:
  en: The same short bar magnet, with moment 1 A m^2, is measured at 0.2 m from its centre on the equatorial line, perpendicular to its axis. What is the field magnitude in tesla? Take mu0 over 4 pi as 1 x 10^-7 T m/A.
hints:
- level: 1
  en: The equatorial formula is the axial formula without its factor of 2.
- level: 2
  en: Use the same moment and distance as in the axial case.
- level: 3
  en: Cube the distance before dividing the constant term.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.0000125'
  accept: []
solution_steps:
- en: On the equatorial line the field is mu0 over 4 pi times M over d cubed, without the factor of 2 used on the axis.
- en: This gives 1 x 10^-7 divided by 0.008, which is 1.25 x 10^-5 T.
- en: The unit of the answer is T.
- en: Answer = 0.0000125
tier: C
diagram_note: A short bar magnet drawn horizontally with its axis marked, and a point at distance d from its centre drawn perpendicular to the axis, labelled as the equatorial point.
