stem:
  en: A paramagnetic sample has a susceptibility of 0.002 at 300 K. Following Curie's law, what is its susceptibility at 600 K? Give a plain number with no unit.
hints:
- level: 1
  en: Curie's law makes susceptibility inversely proportional to absolute temperature.
- level: 2
  en: Find the ratio of the two absolute temperatures.
- level: 3
  en: Divide the original susceptibility by that ratio.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.001'
  accept: []
solution_steps:
- en: Curie's law gives susceptibility inversely proportional to absolute temperature.
- en: Doubling the temperature halves the susceptibility, from 0.002 to 0.001.
- en: Answer = 0.001
