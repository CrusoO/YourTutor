  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Zero
- id: b
  en: Horizontal
- id: c
  en: Radially outward from the Earth's centre
- id: d
  en: Vertical
answer:
  sympy: b
  accept: []
