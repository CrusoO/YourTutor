stem:
  en: Near the magnetic equator, what is the approximate orientation of the Earth's magnetic field at the surface?
hints:
- level: 1
  en: Think about the dip angle of the field lines near the equator.
- level: 2
  en: Consider how the field lines tilt as you move from the equator towards the poles.
- level: 3
  en: Compare the field at the magnetic equator with the field near the magnetic poles.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
