difficulty: 0.9
pool: practice
role: explain
stem:
  en: Near a bar magnet, where are the magnetic field lines most closely packed together?
hints:
- level: 1
  en: The density of field lines tells you how strong the field is.
- level: 2
  en: Think about where the lines leave and enter the magnet.
- level: 3
  en: Compare the spacing of lines near the ends with the spacing near the middle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Far away from the magnet
- id: b
  en: At the two poles
- id: c
  en: Along the equatorial line
- id: d
  en: At the midpoint of the magnet
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.8CBE3E92407D
  when_answer_equals:
  - d
- id: MC.A.2524A52A7F18
  when_answer_equals:
