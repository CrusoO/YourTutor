solution_steps:
- en: The field is strongest where the lines are closest together, which is near the poles of the magnet.
- en: The correct option is b.
tier: C
diagram_note: A sketch of a bar magnet with curved field lines looping from the north pole, around the outside, and back into the south pole, drawn closer together near both ends.
