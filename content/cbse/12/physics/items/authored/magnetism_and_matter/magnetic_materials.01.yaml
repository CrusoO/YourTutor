difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which class of material is weakly repelled by a strong magnetic field?
hints:
- level: 1
  en: Consider the direction of the induced moment compared with the applied field.
- level: 2
  en: Think about which class is repelled by a strong magnet.
- level: 3
  en: Compare with the class of materials that are attracted and whether the attraction is weak or strong.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
