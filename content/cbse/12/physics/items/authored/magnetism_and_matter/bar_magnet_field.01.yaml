id: A.12.physics.magnetism_and_matter.bar_magnet_field.01
skill_ids:
- SK.A.12.physics.bar_magnet_field
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Inside a bar magnet, in which direction do the magnetic field lines run?
hints:
- level: 1
  en: Field lines form closed loops that pass through the magnet and the air around it.
- level: 2
  en: Think about the direction of the lines outside the magnet first.
- level: 3
  en: Consider how the lines inside must connect to the lines outside to form closed loops.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Radially outward from the centre of the magnet
- id: b
  en: From the north pole to the south pole
- id: c
  en: Perpendicular to the length of the magnet
- id: d
  en: From the south pole to the north pole
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.15ABD40E6FF8
  when_answer_equals:
  - b
- id: MC.A.07A4880E87E5
  when_answer_equals:
  - a
- id: MC.A.75D9ADB20241
  when_answer_equals:
  - c
solution_steps:
- en: Field lines form closed loops.
- en: Outside the magnet they leave from the north pole, so inside they must run from the south pole back to the north pole.
- en: The correct option is d.
tier: C
