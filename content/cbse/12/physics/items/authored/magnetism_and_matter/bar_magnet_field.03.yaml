stem:
  en: A short bar magnet has a magnetic moment of 1 A m^2. What is the magnitude in tesla of its field on its axis at 0.2 m from its centre? Take mu0 over 4 pi as 1 x 10^-7 T m/A.
hints:
- level: 1
  en: The axial field of a short magnet has a factor of 2 in its formula.
- level: 2
  en: Cube the distance before dividing.
- level: 3
  en: Multiply the constant by the moment and by 2 before dividing.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.000025'
  accept: []
solution_steps:
- en: On the axis of a short magnet the field is 2 times mu0 over 4 pi times M over d cubed.
- en: This gives 2 x 10^-7 divided by 0.008, which is 2.5 x 10^-5 T.
- en: The unit of the answer is T.
- en: Answer = 0.000025
tier: C
