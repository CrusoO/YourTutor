answer:
  sympy: '279.3'
  accept: []
solution_steps:
- en: The energy released is the mass decrease times 931 MeV per u.
- en: That is 0.3 times 931, which equals 279.3 MeV.
- en: The unit of the answer is MeV.
- en: Answer = 279.3
