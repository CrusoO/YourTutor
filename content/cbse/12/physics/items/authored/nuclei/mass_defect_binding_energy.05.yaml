stem:
  en: In a nuclear reaction the total mass decreases by 0.3 u. Using 1 u equal to 931 MeV, how much energy in MeV is released?
hints:
- level: 1
  en: The energy released equals the mass decrease times 931 MeV per u.
- level: 2
  en: Multiply 0.3 by 931.
- level: 3
  en: Check that the result is in MeV.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
