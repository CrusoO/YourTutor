stem:
  en: Why do fusion reactions need a very high temperature to occur?
hints:
- level: 1
  en: Think about what force acts between two positively charged nuclei as they approach.
- level: 2
  en: Consider how the kinetic energy of the nuclei relates to temperature.
- level: 3
  en: Recall the range over which the strong nuclear force acts.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: To overcome the electrostatic repulsion between positively charged nuclei
- id: b
  en: To break the nuclei apart before they can fuse
- id: c
  en: To increase the mass of the nuclei before they fuse
- id: d
  en: To make the nuclei decay faster into lighter particles
answer:
  sympy: a
  accept: []
