stem:
  en: Each fission releases 200 MeV. A reactor undergoes 5 x 10^6 fissions per second. What is its power in MeV per second?
hints:
- level: 1
  en: The power is the energy per fission multiplied by the number of fissions per second.
- level: 2
  en: Multiply 200 by 5 and then by 10 to the sixth.
- level: 3
  en: Keep the unit as MeV per second.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1000000000'
  accept: []
solution_steps:
- en: The power is the energy per fission times the number of fissions per second.
- en: That is 200 times 5 x 10^6, which equals 1 x 10^9 MeV/s.
- en: The unit of the answer is MeV/s.
- en: Answer = 1000000000
