stem:
  en: Using R equal to 1.2 times A to the power one third fm, what is the radius of a nucleus with mass number 27, in fm?
hints:
- level: 1
  en: Use R equal to R0 times A to the one third, with R0 equal to 1.2 fm.
- level: 2
  en: Find the cube root of the mass number first.
- level: 3
  en: Multiply the cube root by 1.2 fm.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
