difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A nucleus of mass number 56 has a total binding energy of 504 MeV. What is its binding energy per nucleon in MeV?
hints:
- level: 1
  en: Binding energy per nucleon is the total binding energy divided by the mass number.
- level: 2
  en: Divide 504 by 56.
- level: 3
  en: Keep the unit as MeV.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '9'
  accept: []
solution_steps:
- en: Binding energy per nucleon is the total binding energy divided by the mass number.
- en: That is 504 divided by 56, which is 9 MeV.
- en: The unit of the answer is MeV.
- en: Answer = 9
tier: C
diagram_note: A curve of binding energy per nucleon plotted against mass number, with a peak near mass number 56 marked and the axes labelled.
