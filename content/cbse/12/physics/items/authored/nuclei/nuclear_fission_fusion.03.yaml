difficulty: 0.6
pool: practice
role: explain
stem:
  en: What makes a self-sustaining chain reaction possible in nuclear fission?
hints:
- level: 1
  en: Think about which particles can strike and split another heavy nucleus.
- level: 2
  en: Consider what the products of one fission event can do to other nuclei.
- level: 3
  en: Recall the particle that has no charge and can penetrate nuclei easily.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Each fission produces electrons that trigger new fissions
- id: b
  en: Each fission releases photons that split other nuclei
- id: c
  en: Each fission releases only alpha particles
- id: d
  en: Each fission releases neutrons that can cause further fissions
answer:
  sympy: d
  accept: []
