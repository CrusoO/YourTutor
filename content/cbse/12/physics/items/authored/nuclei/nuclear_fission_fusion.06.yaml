stem:
  en: A fusion reaction shows a mass decrease of 0.02 u. Using 1 u equal to 931 MeV, what energy in MeV is released?
hints:
- level: 1
  en: The energy released equals the mass decrease multiplied by 931 MeV per u.
- level: 2
  en: Multiply the mass decrease by 931.
- level: 3
  en: Give the result to two decimal places.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
