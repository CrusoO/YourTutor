answer:
  sympy: '18.62'
  accept: []
solution_steps:
- en: The energy released is the mass decrease times 931 MeV per u.
- en: That is 0.02 times 931, which equals 18.62 MeV.
- en: The unit of the answer is MeV.
- en: Answer = 18.62
