answer:
  sympy: '93.1'
  accept: []
solution_steps:
- en: The binding energy is the mass defect times 931 MeV per u.
- en: That is 0.1 times 931, which is 93.1 MeV.
- en: The unit of the answer is MeV.
- en: Answer = 93.1
