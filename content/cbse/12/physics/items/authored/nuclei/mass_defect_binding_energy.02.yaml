stem:
  en: A nucleus has a mass defect of 0.1 u. Using 1 u equal to 931 MeV, what is its binding energy in MeV?
hints:
- level: 1
  en: Binding energy is the mass defect multiplied by 931 MeV per u.
- level: 2
  en: Multiply 0.1 by 931.
- level: 3
  en: Keep the answer in MeV.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
