stem:
  en: A nucleus has a radius of 6 fm. Using R equal to 1.2 times A to the power one third fm, what is its mass number?
hints:
- level: 1
  en: Divide the radius by R0 first to get the cube root of A.
- level: 2
  en: Cube the result to remove the one third power.
- level: 3
  en: The mass number is a whole number, so check that your result is close to one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
