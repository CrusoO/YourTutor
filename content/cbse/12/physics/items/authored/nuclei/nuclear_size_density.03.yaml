stem:
  en: What is the ratio of the radius of a nucleus with mass number 64 to the radius of a nucleus with mass number 8?
hints:
- level: 1
  en: Use the cube root relation for the nuclear radius.
- level: 2
  en: Compare the cube roots of the two mass numbers.
- level: 3
  en: Take the ratio of the two cube roots.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
