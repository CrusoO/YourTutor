difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A nucleus has a total binding energy of 186.2 MeV. What is its mass defect in u, using 1 u equal to 931 MeV?
hints:
- level: 1
  en: Mass defect equals binding energy divided by 931 MeV per u.
- level: 2
  en: Divide 186.2 by 931.
- level: 3
  en: Check that the result is a small fraction of one u.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.2'
  accept: []
solution_steps:
- en: The mass defect is the binding energy divided by 931 MeV per u.
- en: That is 186.2 divided by 931, which equals 0.2 u.
- en: The unit of the answer is u.
- en: Answer = 0.2
tier: C
diagram_note: A horizontal energy scale showing a bar for the total binding energy, with the equivalent mass defect marked in atomic mass units on a second scale below it.
