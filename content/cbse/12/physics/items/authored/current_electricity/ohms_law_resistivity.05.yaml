stem:
  en: A uniform wire of resistance 4 ohm is stretched so that its length doubles and its volume stays the same. What is its new resistance in ohm?
hints:
- level: 1
  en: The volume of the wire stays the same when it is stretched.
- level: 2
  en: Find the new cross-sectional area from the constant volume and the new length.
- level: 3
  en: Write resistance in terms of length squared over volume for a fixed material.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '16'
  accept: []
solution_steps:
- en: Doubling the length while keeping the volume fixed halves the area.
- en: Resistance is proportional to length squared over volume, so it increases by a factor of four to 16 ohm.
- en: The unit of the answer is ohm.
- en: Answer = 16
tier: C
