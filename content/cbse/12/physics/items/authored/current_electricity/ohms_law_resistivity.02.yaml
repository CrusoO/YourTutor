difficulty: 0.2
pool: practice
role: apply
stem:
  en: A copper wire is 2 m long, has cross-sectional area 1 x 10^-6 m^2 and resistivity 1.7 x 10^-8 ohm m. What is its resistance in ohm?
hints:
- level: 1
  en: Use resistance equals resistivity times length divided by area.
- level: 2
  en: Keep track of the powers of ten in the area.
- level: 3
  en: Check that the units combine to ohm.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.034'
  accept: []
solution_steps:
- en: Resistance is resistivity times length over area.
- en: Substituting gives 1.7 x 10^-8 times 2 divided by 1 x 10^-6, which is 0.034 ohm.
- en: The unit of the answer is ohm.
- en: Answer = 0.034
tier: C
