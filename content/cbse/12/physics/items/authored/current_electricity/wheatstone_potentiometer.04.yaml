difficulty: 0.6
pool: practice
role: explain
stem:
  en: In a potentiometer, a cell of EMF E1 balances at a length of 300 cm and a second cell balances at 200 cm on the same wire. What is the ratio E1 over E2?
hints:
- level: 1
  en: The balance length on a potentiometer is proportional to the EMF being measured.
- level: 2
  en: Divide the first balance length by the second.
- level: 3
  en: The ratio of two EMFs has no unit.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.5'
  accept: []
solution_steps:
- en: On a potentiometer the balance lengths are proportional to the EMFs, so E1 over E2 equals 300 divided by 200, which is 1.5.
- en: Answer = 1.5
tier: C
