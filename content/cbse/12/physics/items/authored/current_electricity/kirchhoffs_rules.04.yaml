stem:
  en: A single loop contains an ideal 10 V source and two resistors of 2 ohm and 3 ohm in series. What is the current in ampere?
hints:
- level: 1
  en: Apply Kirchhoff's voltage law around the loop once.
- level: 2
  en: Add the two resistances because they are in series.
- level: 3
  en: Divide the source voltage by the total resistance.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: Applying Kirchhoff's voltage law around the loop, the EMF equals the total IR drop, so the current is 10 divided by 5 ohm, which is 2 A.
- en: The unit of the answer is A.
- en: Answer = 2
tier: C
diagram_note: A rectangular loop with an ideal 10 V source on one side and two resistors, one labelled 2 ohm and the other labelled 3 ohm, on the opposite side, with a current arrow around the loop.
