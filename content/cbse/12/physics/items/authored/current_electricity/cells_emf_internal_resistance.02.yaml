stem:
  en: A cell of EMF 2 V and internal resistance 0.5 ohm delivers a current of 1 A to an external load. What is its terminal voltage in volt?
hints:
- level: 1
  en: Write the terminal voltage as EMF minus current times internal resistance.
- level: 2
  en: Multiply the current by the internal resistance first.
- level: 3
  en: Subtract that drop from the EMF as the last step.
