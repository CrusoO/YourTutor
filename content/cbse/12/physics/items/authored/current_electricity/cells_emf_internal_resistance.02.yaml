answer:
  sympy: '1.5'
  accept: []
solution_steps:
- en: The terminal voltage is the EMF minus I times r.
- en: Here I r is 0.5 V, so the terminal voltage is 1.5 V.
- en: The unit of the answer is V.
- en: Answer = 1.5
