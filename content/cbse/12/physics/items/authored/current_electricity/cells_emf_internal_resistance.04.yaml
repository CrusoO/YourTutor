difficulty: 0.6
pool: practice
role: explain
stem:
  en: A cell of EMF 6 V and internal resistance 2 ohm is connected to an external resistor. The power delivered to the external resistor is largest. What is that maximum power in watt?
hints:
- level: 1
  en: The external power is largest when the external resistance matches the internal resistance.
- level: 2
  en: Find the total resistance and then the current in that case.
- level: 3
  en: Use P equal to I squared times R for the external resistor.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4.5'
  accept: []
solution_steps:
- en: External power is largest when the external resistance equals the internal resistance, here 2 ohm.
- en: The current is then 6 divided by 4, which is 1.5 A, and the power is 1.5 squared times 2, which is 4.5 W.
- en: The unit of the answer is W.
- en: Answer = 4.5
tier: C
