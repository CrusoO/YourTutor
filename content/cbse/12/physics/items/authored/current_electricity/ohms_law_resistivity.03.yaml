stem:
  en: A wire has resistance 10 ohm at 20 degrees Celsius. Its temperature coefficient of resistance is 0.004 per degree Celsius. What is its resistance in ohm at 70 degrees Celsius?
hints:
- level: 1
  en: Use R equals R0 times one plus alpha times the temperature change.
- level: 2
  en: Find the temperature change before you use the coefficient.
- level: 3
  en: Multiply the coefficient by the change first and then add one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
