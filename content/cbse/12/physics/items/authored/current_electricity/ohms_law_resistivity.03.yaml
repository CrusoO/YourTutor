  author: model-draft
type: numeric
answer:
  sympy: '12'
  accept: []
solution_steps:
- en: The resistance at temperature t is R0 times one plus alpha times the change in temperature.
- en: The change is 50 degrees, so the resistance is 10 times 1.2, which is 12 ohm.
- en: The unit of the answer is ohm.
- en: Answer = 12
