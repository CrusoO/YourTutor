difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A cell of EMF 12 V and internal resistance 1 ohm is connected to an external resistor of 5 ohm. What is the current in ampere?
hints:
- level: 1
  en: Add the internal and external resistances because they are in one series loop.
- level: 2
  en: Apply Ohm's law to the whole loop using the EMF.
- level: 3
  en: Divide the EMF by the total resistance.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The internal and external resistances are in series, giving a total of 6 ohm.
- en: The current is the EMF divided by 6 ohm, which is 2 A.
- en: The unit of the answer is A.
- en: Answer = 2
tier: C
diagram_note: A single loop containing a cell, a small series resistor labelled internal resistance, and an external resistor labelled 5 ohm, with the current arrow drawn around the loop.
