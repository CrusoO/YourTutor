stem:
  en: Which expression gives the magnetic field at the centre of a circular loop of radius R carrying current I in vacuum?
hints:
- level: 1
  en: Compare the loop geometry with that of a long straight wire.
- level: 2
  en: Think about how the field at the centre depends on the radius of the loop.
- level: 3
  en: Recall the factor that appears for a single turn of current.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: mu0 I over R squared
- id: b
  en: mu0 I over 2R
- id: c
  en: mu0 I R over 2
- id: d
  en: mu0 I over 2 pi R
answer:
  sympy: b
  accept: []
