stem:
  en: A galvanometer of resistance 50 ohm gives full scale deflection at a current of 5 mA. What series resistance in ohm must be added to convert it into a voltmeter reading 10 V at full scale?
hints:
- level: 1
  en: The total resistance is the full scale voltage divided by the full scale current.
- level: 2
  en: Convert the milliampere to ampere before dividing.
- level: 3
  en: Subtract the galvanometer's own resistance at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1950'
  accept: []
solution_steps:
- en: The total resistance needed is 10 V divided by 0.005 A, which is 2000 ohm.
- en: Subtracting the galvanometer resistance of 50 ohm gives a series resistance of 1950 ohm.
- en: The unit of the answer is ohm.
- en: Answer = 1950
tier: C
