id: A.12.physics.moving_charges_and_magnetism.force_on_moving_charge.04
skill_ids:
- SK.A.12.physics.force_on_moving_charge
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A positive charge moves towards the north in a magnetic field that points towards the east. Using the right-hand rule, in which direction is the force on the charge?
hints:
- level: 1
  en: The force is along the cross product of the velocity vector and the field vector.
- level: 2
  en: Keep the order of the two vectors in the cross product as written.
- level: 3
  en: The force is perpendicular to both the velocity and the field.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Towards the east
- id: b
  en: Vertically downward
- id: c
  en: Vertically upward
- id: d
  en: Towards the north
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.EFF944069B7B
  when_answer_equals:
  - c
- id: MC.A.D35C331FCACA
  when_answer_equals:
  - a
- id: MC.A.4D73806A8A34
  when_answer_equals:
  - d
solution_steps:
- en: The force is along the cross product of velocity and field.
- en: North crossed with east points downward for a positive charge, so the force is vertically downward.
- en: The correct option is b.
tier: C
diagram_note: A compass sketch with a north arrow and an east arrow for the field, and a positive charge drawn moving along the north arrow.
