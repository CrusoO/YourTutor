difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Two long parallel wires 0.2 m apart each carry a current of 10 A in the same direction in vacuum. What is the magnitude of the force per unit length between them in newton per metre? Take mu0 over 4 pi as 1 x 10^-7 T m/A.
hints:
- level: 1
  en: The force per unit length depends on the product of the two currents divided by the separation.
- level: 2
  en: Use 2 x 10^-7 as the constant in the formula.
- level: 3
  en: Check that you have squared the currents correctly, not added them.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.0001'
  accept: []
solution_steps:
- en: The force per unit length is 2 x 10^-7 times the product of the currents over the separation.
- en: With 10 A each and 0.2 m this gives 0.0001 N/m.
- en: The unit of the answer is N/m.
- en: Answer = 0.0001
tier: C
diagram_note: Two long parallel vertical wires drawn side by side, each with a current arrow pointing up, and the separation of 0.2 m marked between them.
