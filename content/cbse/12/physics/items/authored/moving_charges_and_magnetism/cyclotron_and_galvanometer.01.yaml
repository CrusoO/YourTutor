- id: MC.A.23BE599A869A
  when_answer_equals:
  - c
solution_steps:
- en: A uniform magnetic field perpendicular to the velocity bends the particle into a circle.
- en: The alternating electric field between the dees accelerates it at each crossing.
- en: The correct option is d.
tier: C
