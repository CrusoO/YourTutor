id: A.12.physics.moving_charges_and_magnetism.solenoid_toroid.04
skill_ids:
- SK.A.12.physics.solenoid_toroid
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A long solenoid has 500 turns per metre and carries a current of 3 A. What is its field inside, in units of mu0 tesla?
hints:
- level: 1
  en: Write the field as mu0 times the turns per metre times the current.
- level: 2
  en: Multiply the turns per metre by the current.
- level: 3
  en: Give your answer as a number multiplied by mu0.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1500'
  accept: []
solution_steps:
- en: The field inside is mu0 times n times I.
- en: With n equal to 500 and I equal to 3, the product n I is 1500, so the field is 1500 mu0 tesla.
- en: The unit of the answer is mu0 T.
- en: Answer = 1500
tier: C
