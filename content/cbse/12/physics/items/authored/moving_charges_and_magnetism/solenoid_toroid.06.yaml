  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.0005'
  accept: []
solution_steps:
- en: The field is mu0 times n times I.
- en: Substituting gives 1.25 x 10^-6 times 2000 times 0.2, which is 0.0005 T.
- en: The unit of the answer is T.
- en: Answer = 0.0005
