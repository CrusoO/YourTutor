stem:
  en: Taking mu0 as 1.25 x 10^-6 T m/A, a long solenoid with 2000 turns per metre carries a current of 0.2 A. What is the field inside it in tesla?
hints:
- level: 1
  en: The field is mu0 times the turns per metre times the current.
- level: 2
  en: Multiply the turns per metre by the current before multiplying by mu0.
- level: 3
  en: Keep the powers of ten exact in the final product.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
