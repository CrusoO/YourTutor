solution_steps:
- en: The field of a long straight wire is mu0 I over 2 pi r.
- en: Substituting gives 2 x 10^-7 times 3 divided by 0.2, which equals 3 x 10^-6 T.
- en: The unit of the answer is T.
- en: Answer = 0.000003
