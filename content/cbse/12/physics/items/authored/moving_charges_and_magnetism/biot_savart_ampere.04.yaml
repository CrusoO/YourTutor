stem:
  en: What is the magnitude of the magnetic field in tesla at a distance of 0.2 m from a long straight wire carrying 3 A in vacuum? Take mu0 over 2 pi as 2 x 10^-7 T m/A.
hints:
- level: 1
  en: Use the long wire formula, which has a current over a distance.
- level: 2
  en: Multiply the constant by the current first.
- level: 3
  en: Divide by the distance as the last step.
