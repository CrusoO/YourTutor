id: A.12.physics.moving_charges_and_magnetism.force_on_moving_charge.03
skill_ids:
- SK.A.12.physics.force_on_moving_charge
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A charge of 5 microcoulomb moves at 2000 m/s at an angle of 30 degrees to a magnetic field of 0.2 tesla. What is the magnitude of the magnetic force in newton?
hints:
- level: 1
  en: Include the sine of the angle between the velocity and the field.
- level: 2
  en: Find the value of the sine for the given angle.
- level: 3
  en: Multiply the charge, speed and field strength first.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.001'
  accept: []
solution_steps:
- en: The force is q v B sin theta.
- en: Multiplying 5 x 10^-6, 2000 and 0.2 gives 0.002 N, and the sine of 30 degrees is one half, so the force is 0.001 N.
- en: The unit of the answer is N.
- en: Answer = 0.001
tier: C
diagram_note: A velocity arrow drawn at 30 degrees to a magnetic field arrow, both starting from a common point, with the angle marked between them.
