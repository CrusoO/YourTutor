stem:
  en: Ampere's circuital law states that the line integral of the magnetic field around a closed loop equals mu0 multiplied by what?
hints:
- level: 1
  en: Ampere's law is about the currents that pass through the closed path.
- level: 2
  en: Compare it with Gauss's law and what that law counts inside a surface.
- level: 3
  en: Think about whether the loop is linked with current or with flux.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The rate of change of electric flux only
- id: b
  en: The net current passing through the loop
- id: c
  en: The total charge inside a closed sphere
- id: d
  en: The magnetic flux through the loop
answer:
  sympy: b
  accept: []
misconception_rules:
