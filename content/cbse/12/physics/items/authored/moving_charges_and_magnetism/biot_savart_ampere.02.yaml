stem:
  en: What is the magnetic field in tesla at 0.1 m from a very long straight wire carrying a current of 5 A in vacuum? Take mu0 over 4 pi as 1 x 10^-7 T m/A.
hints:
- level: 1
  en: Use the long wire formula and write mu0 over 2 pi as twice mu0 over 4 pi.
- level: 2
  en: Multiply the current by the constant before dividing by the distance.
- level: 3
  en: Keep the powers of ten correct when you divide by the distance.
