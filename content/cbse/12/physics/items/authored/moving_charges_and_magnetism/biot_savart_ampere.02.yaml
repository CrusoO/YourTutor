solution_steps:
- en: The field of a long straight wire is mu0 I over 2 pi r.
- en: With mu0 over 2 pi equal to 2 x 10^-7, the field is 2 x 10^-7 times 5 divided by 0.1, which is 1 x 10^-5 T.
- en: The unit of the answer is T.
