role: explain
stem:
  en: In a cyclotron the particle speed at the edge of the dee of radius 0.5 m, with a field of 0.2 T and charge to mass ratio of 1 x 10^8 C/kg, is what in metre per second?
hints:
- level: 1
  en: The speed at radius R is the charge to mass ratio multiplied by the field and by the radius.
- level: 2
  en: Multiply the ratio by the field strength first.
- level: 3
  en: Keep track of the powers of ten at each step.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10000000'
  accept: []
solution_steps:
- en: The speed at radius R is the charge to mass ratio times the field times R.
- en: That is 1 x 10^8 times 0.2 times 0.5, which is 1 x 10^7 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 10000000
tier: C
diagram_note: A circular dee with a spiral path of a particle drawn from the centre outward, with the radius of 0.5 m marked from the centre to the edge.
