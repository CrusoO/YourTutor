stem:
  en: The magnetic field at 0.4 m from a long straight wire is 5 x 10^-6 T. Taking mu0 over 2 pi as 2 x 10^-7 T m/A, what current in ampere flows in the wire?
hints:
- level: 1
  en: Rearrange the long wire field formula to make the current the subject.
- level: 2
  en: Multiply the field by the distance before dividing by the constant.
- level: 3
  en: Use mu0 over 2 pi equal to 2 x 10^-7 T m/A.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10'
  accept: []
solution_steps:
- en: Rearranging B equals mu0 I over 2 pi r gives I equal to B r over the constant.
- en: That is 5 x 10^-6 times 0.4 divided by 2 x 10^-7, which is 10 A.
- en: The unit of the answer is A.
- en: Answer = 10
tier: C
diagram_note: A long vertical wire with a current arrow along it, and a point 0.4 m horizontally away from the wire, with a circular field line around the wire passing through that point.
