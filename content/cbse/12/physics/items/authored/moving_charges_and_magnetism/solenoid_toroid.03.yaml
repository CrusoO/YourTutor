id: A.12.physics.moving_charges_and_magnetism.solenoid_toroid.03
skill_ids:
- SK.A.12.physics.solenoid_toroid
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Two long solenoids, A and B, carry the same current. Solenoid A has twice as many turns per metre as solenoid B. What is the ratio of the field inside A to the field inside B?
hints:
- level: 1
  en: The field inside a long solenoid depends on the turns per metre and the current.
- level: 2
  en: Compare the turns per metre of the two solenoids.
- level: 3
  en: Keep the current the same for both solenoids in your comparison.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The field inside a long solenoid is proportional to the turns per metre times the current.
- en: Since the current is the same, doubling the turns per metre doubles the field.
- en: Answer = 2
tier: C
diagram_note: Two parallel long solenoids drawn side by side, one with closely spaced coils labelled A and one with more widely spaced coils labelled B, with field lines drawn inside each.
