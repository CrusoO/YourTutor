stem:
  en: A charge of 2 microcoulomb moves at 3000 m/s perpendicular to a uniform magnetic field of 0.5 tesla. What is the magnitude of the force in newton?
hints:
- level: 1
  en: When velocity is perpendicular to the field, the sine of the angle equals one.
- level: 2
  en: Convert the charge from microcoulomb to coulomb before multiplying.
- level: 3
  en: Multiply the charge, speed and field strength together.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.003'
  accept: []
solution_steps:
- en: For velocity perpendicular to the field the force is q v B.
- en: Converting the charge to coulomb gives 2 x 10^-6 times 3000 times 0.5, which is 0.003 N.
- en: The unit of the answer is N.
- en: Answer = 0.003
tier: C
