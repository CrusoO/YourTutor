answer:
  sympy: '20000000'
  accept: []
solution_steps:
- en: The cyclotron angular frequency is q B over m.
- en: Multiplying the charge to mass ratio of 1 x 10^8 by 0.2 gives 2 x 10^7 rad/s.
- en: The unit of the answer is rad/s.
- en: Answer = 20000000
