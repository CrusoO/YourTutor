stem:
  en: A particle has a charge to mass ratio of 1 x 10^8 C/kg and moves in a magnetic field of 0.2 T. What is its cyclotron angular frequency in radian per second?
hints:
- level: 1
  en: The angular frequency is the charge to mass ratio multiplied by the field strength.
- level: 2
  en: Multiply the ratio by the field strength.
- level: 3
  en: Keep the powers of ten correct when you multiply.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
