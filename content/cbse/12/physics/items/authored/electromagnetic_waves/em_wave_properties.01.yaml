id: A.12.physics.electromagnetic_waves.em_wave_properties.01
skill_ids:
- SK.A.12.physics.em_wave_properties
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In an electromagnetic wave travelling in vacuum, how are the electric and magnetic field vectors oriented?
hints:
- level: 1
  en: Think about the direction of oscillation of each field relative to the wave direction.
- level: 2
  en: Consider whether the two fields can be parallel to each other.
- level: 3
  en: Recall whether an electromagnetic wave is transverse or longitudinal.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They are perpendicular to each other and to the direction of propagation
- id: b
  en: They are parallel to each other and perpendicular to the direction of propagation
- id: c
  en: They are both parallel to the direction of propagation
- id: d
  en: They are perpendicular but out of phase by 90 degrees
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.AF09CC0F1D8B
  when_answer_equals:
  - c
- id: MC.A.028ECF94F791
  when_answer_equals:
  - b
- id: MC.A.7C56BCB2D3E2
  when_answer_equals:
  - d
solution_steps:
- en: The electric and magnetic fields oscillate in phase, perpendicular to each other, and both are perpendicular to the direction in which the wave travels.
- en: The correct option is a.
tier: C
