stem:
  en: The displacement current in the gap of a capacitor is 0.885 A. Taking epsilon zero as 8.85 x 10^-12 C^2 N^-1 m^-2, what is the rate of change of electric flux in V m per second?
hints:
- level: 1
  en: Divide the displacement current by epsilon zero to find the rate of change of flux.
- level: 2
  en: Use the same constant as in the earlier steps, 8.85 x 10^-12.
- level: 3
  en: Count the powers of ten carefully when you divide.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '100000000000'
  accept: []
solution_steps:
- en: Displacement current equals epsilon zero times the rate of change of electric flux.
- en: Dividing 0.885 by 8.85 x 10^-12 gives 1 x 10^11 V m/s.
- en: The unit of the answer is V m/s.
- en: Answer = 100000000000
