difficulty: 0.2
pool: practice
role: recall
stem:
  en: Why did Maxwell introduce the idea of displacement current?
hints:
- level: 1
  en: Think about what current passes through the gap of a charging capacitor.
- level: 2
  en: Consider whether Ampere's law works for a surface that no wire crosses.
- level: 3
  en: Recall the role of the changing electric field between the plates.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
