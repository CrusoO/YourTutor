options:
- id: a
  en: To explain the origin of resistance in metal wires
- id: b
  en: To explain the magnetic field of a static charge
- id: c
  en: To replace conduction current inside metals
- id: d
  en: To make Ampere's law consistent for a circuit with a gap, such as a charging capacitor
answer:
  sympy: d
  accept: []
