id: A.12.physics.electromagnetic_waves.em_spectrum.05
skill_ids:
- SK.A.12.physics.em_spectrum
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: An ultraviolet wave has a wavelength of 3 x 10^-7 m. What is its frequency in units of 10^14 Hz? Use c equal to 3 x 10^8 m/s.
hints:
- level: 1
  en: Use frequency equal to the speed of light divided by the wavelength.
- level: 2
  en: Make sure the wavelength is in metre before dividing.
- level: 3
  en: Express your answer in the unit you were asked for.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10'
  accept: []
solution_steps:
- en: Frequency is c divided by the wavelength, which is 3 x 10^8 divided by 3 x 10^-7, equal to 10^15 Hz.
- en: In units of 10^14 Hz this is 10.
- en: The unit of the answer is 10^14 Hz.
- en: Answer = 10
tier: C
diagram_note: A wavelength axis marking the ultraviolet band between visible light and X-rays, with a point labelled at 3 x 10^-7 m inside that band.
