id: A.12.physics.electromagnetic_waves.em_spectrum.03
skill_ids:
- SK.A.12.physics.em_spectrum
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: An electromagnetic wave in vacuum has a frequency of 3 x 10^9 Hz. What is its wavelength in metre? Use c equal to 3 x 10^8 m/s.
hints:
- level: 1
  en: Use c equal to frequency times wavelength.
- level: 2
  en: Divide the speed of light by the frequency.
- level: 3
  en: Keep the powers of ten exact in the division.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.1'
  accept: []
solution_steps:
- en: The speed of light equals frequency times wavelength, so the wavelength is 3 x 10^8 divided by 3 x 10^9, which is 0.1 m.
- en: The unit of the answer is m.
- en: Answer = 0.1
tier: C
diagram_note: A horizontal wavelength axis with the microwave and radio region marked, and a point near the short wavelength end labelled with the wavelength found from the frequency.
