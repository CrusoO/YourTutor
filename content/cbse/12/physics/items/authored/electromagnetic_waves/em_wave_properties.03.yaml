stem:
  en: An electromagnetic wave travels through a non-magnetic medium of relative permittivity 4. What is its speed in the medium in m/s? Use c equal to 3 x 10^8 m/s.
hints:
- level: 1
  en: For a non-magnetic medium the speed depends on the square root of the relative permittivity.
- level: 2
  en: Take the square root of the relative permittivity first.
- level: 3
  en: Divide the speed of light in vacuum by that square root.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '150000000'
  accept: []
solution_steps:
- en: For a non-magnetic medium the speed is c divided by the square root of the relative permittivity.
- en: The square root of 4 is 2, giving 1.5 x 10^8 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 150000000
