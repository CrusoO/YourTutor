id: A.12.physics.electromagnetic_waves.em_spectrum.04
skill_ids:
- SK.A.12.physics.em_spectrum
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Which list places the regions of the electromagnetic spectrum in order from shortest to longest wavelength?
hints:
- level: 1
  en: Start from the region with the highest energy photons.
- level: 2
  en: Recall that energy and frequency increase together.
- level: 3
  en: A shorter wavelength means a higher frequency.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Gamma rays, X-rays, ultraviolet, visible light, infrared, microwaves, radio waves
- id: b
  en: Microwaves, radio waves, visible light, gamma rays, X-rays, ultraviolet, infrared
- id: c
  en: Visible light, infrared, ultraviolet, X-rays, gamma rays, radio waves, microwaves
- id: d
  en: Radio waves, microwaves, infrared, visible light, ultraviolet, X-rays, gamma rays
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.BEAD3ECF5ADE
  when_answer_equals:
  - d
- id: MC.A.71FC76663E21
