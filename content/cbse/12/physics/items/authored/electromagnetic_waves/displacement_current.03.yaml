id: A.12.physics.electromagnetic_waves.displacement_current.03
skill_ids:
- SK.A.12.physics.displacement_current
difficulty: 0.6
pool: practice
role: explain
stem:
  en: While a capacitor in a circuit is charging, what is the displacement current between its plates compared with the conduction current in the connecting wire?
hints:
- level: 1
  en: Think about how current is continuous through the whole circuit.
- level: 2
  en: Consider what happens to the electric flux between the plates as the capacitor charges.
- level: 3
  en: Recall the role of the changing electric flux in carrying current across the gap.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Equal to the charge on the plates
- id: b
  en: Twice the conduction current
- id: c
  en: Zero, because no charge crosses the gap
- id: d
  en: Equal to the conduction current in the wire
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.6CA2059B8EDA
  when_answer_equals:
  - c
- id: MC.A.C20B07B260F3
  when_answer_equals:
  - b
- id: MC.A.57A5EE8C5FAE
  when_answer_equals:
  - a
solution_steps:
- en: Current is continuous around the circuit.
- en: The displacement current between the plates equals the conduction current in the wire, so the total current is the same everywhere.
- en: The correct option is d.
tier: C
