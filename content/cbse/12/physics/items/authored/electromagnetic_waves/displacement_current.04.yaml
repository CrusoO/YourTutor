stem:
  en: The electric field in a region of vacuum changes at 1 x 10^10 V/m per second. What is the displacement current density in A/m^2? Use epsilon zero equal to 8.85 x 10^-12 C^2 N^-1 m^-2.
hints:
- level: 1
  en: Displacement current density is epsilon zero times the rate of change of the electric field.
- level: 2
  en: Multiply the constant by the rate of change.
- level: 3
  en: Keep the powers of ten exact in the product.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.0885'
  accept: []
solution_steps:
- en: The displacement current density is epsilon zero times the rate of change of electric field.
- en: That is 8.85 x 10^-12 times 1 x 10^10, which equals 0.0885 A/m^2.
- en: The unit of the answer is A/m^2.
- en: Answer = 0.0885
