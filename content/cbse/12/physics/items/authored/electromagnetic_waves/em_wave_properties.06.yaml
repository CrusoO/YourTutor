stem:
  en: An electromagnetic wave in vacuum has a magnetic field amplitude of 2 x 10^-8 T. What is the electric field amplitude? Use c equal to 3 x 10^8 m/s.
hints:
- level: 1
  en: The electric amplitude is the speed of light times the magnetic amplitude.
- level: 2
  en: Multiply the magnetic amplitude by the speed of light.
- level: 3
  en: Check that the unit of your answer is the unit of the electric field.
prediction_prompt:
