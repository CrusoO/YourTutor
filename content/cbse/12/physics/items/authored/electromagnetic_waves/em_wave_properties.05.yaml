stem:
  en: The electric field amplitude of an electromagnetic wave is doubled. By what factor does the average intensity of the wave change?
hints:
- level: 1
  en: Intensity is proportional to the square of the field amplitude.
- level: 2
  en: Find the ratio of the squared amplitudes before and after.
- level: 3
  en: Compare the new amplitude with the old amplitude as a ratio.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: Intensity is proportional to the square of the electric field amplitude.
- en: Doubling the amplitude therefore multiplies the intensity by 2 squared, which is 4.
- en: Answer = 4
tier: C
