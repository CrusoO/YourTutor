stem:
  en: An electromagnetic wave in vacuum has an electric field amplitude of 300 V/m. What is the magnetic field amplitude in tesla? Use c equal to 3 x 10^8 m/s.
hints:
- level: 1
  en: The ratio of the electric amplitude to the magnetic amplitude equals the speed of light.
- level: 2
  en: Divide the electric amplitude by the speed of light.
- level: 3
  en: Keep the powers of ten correct in the division.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.000001'
  accept: []
solution_steps:
- en: In vacuum the ratio of the electric and magnetic amplitudes equals c.
- en: Dividing 300 by 3 x 10^8 gives 1 x 10^-6 T.
- en: The unit of the answer is T.
- en: Answer = 0.000001
tier: C
