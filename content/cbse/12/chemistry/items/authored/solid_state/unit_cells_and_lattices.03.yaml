stem:
  en: How many atoms belong to one face-centred cubic unit cell in total?
hints:
- level: 1
  en: Each corner atom is shared by eight cells, so it contributes only a fraction.
- level: 2
  en: Each atom on a face is shared between two cells.
- level: 3
  en: Sum the fractional contributions from the corners and from the faces.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: Eight corner atoms each contribute one eighth, giving one atom.
- en: Six face atoms each contribute one half, giving three.
- en: The total is four.
- en: Answer = 4
tier: C
