id: A.12.chemistry.solid_state.close_packing.05
skill_ids:
- SK.A.12.chemistry.close_packing
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A cubic close packed lattice is built from 150 anions, and every octahedral void is available. How many octahedral voids does the lattice contain?
hints:
- level: 1
  en: Compare the number of octahedral voids with the number of close packed spheres.
- level: 2
  en: Count the voids per sphere, not per unit cell.
- level: 3
  en: Think about how the octahedral voids relate to the spheres that form the lattice.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '150'
  accept: []
solution_steps:
- en: A close packed arrangement of N spheres has N octahedral voids, one for each sphere, so the count equals the anion count.
- en: Answer = 150
tier: C
