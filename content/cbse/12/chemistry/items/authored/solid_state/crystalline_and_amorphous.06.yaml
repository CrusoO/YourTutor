difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Quartz glass and crystalline quartz both have the formula SiO2. What most clearly separates their properties?
hints:
- level: 1
  en: Both materials share one formula, so look for a property that depends on something other than the formula.
- level: 2
  en: Think about what the word amorphous says about particle positions.
- level: 3
  en: Consider which feature a crystal has that a disordered glass does not.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: One contains oxygen and the other does not
- id: b
  en: Their chemical formulas differ
- id: c
  en: Their molar masses are unequal
- id: d
  en: The long-distance arrangement of their silicon and oxygen atoms
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.353BA1369218
  when_answer_equals:
  - b
- id: MC.A.52628081976C
  when_answer_equals:
  - a
- id: MC.A.AECB8BD19E3A
  when_answer_equals:
  - c
solution_steps:
- en: Both forms have the same SiO2 composition and molar mass, but quartz glass lacks the long-range lattice of crystalline quartz.
- en: Structure, not composition, separates them.
- en: The correct option is d.
tier: C
