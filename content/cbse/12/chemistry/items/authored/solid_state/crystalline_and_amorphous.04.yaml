id: A.12.chemistry.solid_state.crystalline_and_amorphous.04
skill_ids:
- SK.A.12.chemistry.crystalline_and_amorphous
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why is a crystalline solid described as having long-range order?
hints:
- level: 1
  en: Think about whether the pattern is local or extends across the entire solid.
- level: 2
  en: Compare how far the arrangement continues in a crystal with how far it continues in a liquid.
- level: 3
  en: Ask whether the word order refers to particle positions or to particle types.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Its particles repeat in a fixed pattern throughout the whole solid
- id: b
  en: It contains only one type of atom
- id: c
  en: Its particles move freely, as in a liquid
- id: d
  en: Its particles are arranged at random
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.96B044DE0F9C
  when_answer_equals:
  - c
- id: MC.A.51B8EC01EA5C
  when_answer_equals:
  - d
- id: MC.A.3D1ED2772AB1
  when_answer_equals:
  - b
solution_steps:
- en: Long-range order means the same pattern repeats over large distances in every direction.
- en: This repeating arrangement is what gives crystals their sharp melting point.
- en: The correct option is a.
tier: C
