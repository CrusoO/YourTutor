id: A.12.chemistry.solid_state.crystalline_and_amorphous.05
skill_ids:
- SK.A.12.chemistry.crystalline_and_amorphous
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A solid is isotropic and melts over a range of temperatures. Which statement about its particles is most consistent with this?
hints:
- level: 1
  en: Isotropic means the same in every direction, so ask which solid type behaves this way.
- level: 2
  en: Consider whether a range of melting temperatures suggests a regular repeating pattern.
- level: 3
  en: Eliminate options that describe a specific repeating lattice.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They are held by ionic bonds in a layered array
- id: b
  en: They form a face-centred cubic lattice
- id: c
  en: They have short-range order only, with no repeating pattern across the solid
- id: d
  en: They are arranged in a repeating hexagonal pattern
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.A70E6203E8B9
  when_answer_equals:
  - b
- id: MC.A.FE017510D762
  when_answer_equals:
  - d
- id: MC.A.A9095184CE76
  when_answer_equals:
  - a
solution_steps:
- en: Isotropy and melting over a range both indicate an amorphous solid.
- en: Its particles keep only local order and have no repeating unit cell.
- en: The correct option is c.
tier: C
