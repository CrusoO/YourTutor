difficulty: 0.9
pool: practice
role: apply
stem:
  en: A solid has 4000 cation sites, and 0.5 percent of them are vacant. How many cation vacancies are there?
hints:
- level: 1
  en: Turn the percentage into a fraction of the total before multiplying.
- level: 2
  en: Multiply the total number of sites by that fraction.
- level: 3
  en: Check that the result is a whole number of vacancies.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '20'
  accept: []
solution_steps:
- en: Half a percent of 4000 is found by multiplying 4000 by 0.005.
- en: The product is the number of vacant cation sites.
- en: Answer = 20
tier: C
