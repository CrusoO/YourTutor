stem:
  en: What is the coordination number of each atom in a body-centred cubic structure?
hints:
- level: 1
  en: Count the nearest touching atoms of the atom placed at the body centre.
- level: 2
  en: Consider the neighbours that lie along the body diagonal.
- level: 3
  en: The nearest neighbours are all at the same distance from the central atom.
