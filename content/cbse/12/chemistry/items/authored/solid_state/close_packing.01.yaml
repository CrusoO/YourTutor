stem:
  en: How many nearest neighbours surround each atom in a hexagonal close packed structure?
hints:
- level: 1
  en: Count the touching spheres in the layer that sits in the same plane first.
- level: 2
  en: Then count the spheres touching it in the layer above and in the layer below.
- level: 3
  en: Compare the arrangement with the layer pattern of close packing.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
