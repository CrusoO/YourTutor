id: A.12.chemistry.solid_state.unit_cells_and_lattices.05
skill_ids:
- SK.A.12.chemistry.unit_cells_and_lattices
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A metal forms a body-centred cubic lattice with edge length 287 pm. If atoms touch along the body diagonal, what is the atomic radius in pm? Give the nearest whole number.
hints:
- level: 1
  en: Relate the body diagonal to the edge using the Pythagoras theorem twice.
- level: 2
  en: The body diagonal passes through the central atom and two corner atoms.
- level: 3
  en: Equate the length of the body diagonal to the sum of the radii it spans.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '124'
  accept: []
solution_steps:
- en: The body diagonal equals the square root of three times the edge, and it spans four atomic radii.
- en: Dividing the diagonal by four gives the radius.
- en: The unit of the answer is pm.
- en: Answer = 124
tier: C
diagram_note: Cube with atoms at the eight corners and one at the centre; a straight line runs from one corner through the centre to the opposite corner.
