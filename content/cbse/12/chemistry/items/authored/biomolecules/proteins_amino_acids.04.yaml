  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Only a positive charge
- id: b
  en: Zero, because positive and negative charges balance
- id: c
  en: Only a negative charge
- id: d
  en: A charge that depends on the side chain only
answer:
  sympy: b
  accept: []
