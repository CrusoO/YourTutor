stem:
  en: What is the net charge of an amino acid at its isoelectric point?
hints:
- level: 1
  en: Recall the charges carried on the amino and carboxyl groups of a zwitterion.
- level: 2
  en: Consider which pH gives no net movement in an electric field.
- level: 3
  en: Think about the two charged groups present on the backbone.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
