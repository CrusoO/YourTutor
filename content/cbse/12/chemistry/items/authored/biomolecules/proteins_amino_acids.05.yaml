  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The primary sequence becomes branched
- id: b
  en: Heat or pH changes disrupt the non-covalent interactions that hold the fold
- id: c
  en: Peptide bonds are broken by mild heat
- id: d
  en: Amino acids change into sugars
answer:
