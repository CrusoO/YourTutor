difficulty: 0.9
pool: practice
role: explain
stem:
  en: Why does denaturation destroy the tertiary structure of a protein without breaking its peptide bonds?
hints:
- level: 1
  en: Consider which bonds are strong covalent links and which are weaker interactions.
- level: 2
  en: Think about which interactions hold a folded protein in shape.
- level: 3
  en: Compare the energy needed to break a covalent bond with that needed to disrupt the fold.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
