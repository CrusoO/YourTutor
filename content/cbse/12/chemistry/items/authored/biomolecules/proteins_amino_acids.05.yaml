solution_steps:
- en: The fold is held by hydrogen bonds, salt bridges and hydrophobic contacts, which are weaker than covalent bonds.
- en: Heat or pH change breaks these and the chain unfolds while the backbone stays intact.
- en: The correct option is b.
tier: C
diagram_note: Folded protein drawn as a tangled ribbon, with arrows showing heat and acid breaking hydrogen bonds and salt bridges while the backbone remains a continuous chain.
