id: A.12.chemistry.biomolecules.carbohydrate_classes.05
skill_ids:
- SK.A.12.chemistry.carbohydrate_classes
difficulty: 0.6
pool: practice
role: explain
stem:
  en: The two anomers of glucose differ at which carbon?
hints:
- level: 1
  en: Find the carbon that becomes a new stereocentre after ring closure.
- level: 2
  en: Think about which carbon in the ring bears the hemiacetal OH.
- level: 3
  en: Compare the carbon that changes configuration with the carbons that stay fixed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: C1 in the cyclic hemiacetal form
- id: b
  en: C6, which carries the hydroxymethyl group
- id: c
  en: C4, which carries the glycosidic oxygen
- id: d
  en: C5 in the open chain form
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.7FF46CD68539
  when_answer_equals:
  - c
- id: MC.A.B7BA743551FB
  when_answer_equals:
  - d
- id: MC.A.FB428C9AE2D8
  when_answer_equals:
  - b
solution_steps:
- en: Ring closure makes C1 a new stereocentre, with its OH either below or above the ring plane.
- en: These two forms are the alpha and beta anomers.
- en: The correct option is a.
tier: C
diagram_note: Pyranose ring drawn as a hexagon with oxygen at one corner; the carbon next to the ring oxygen carries an OH drawn either up or down.
