stem:
  en: Which disaccharide is a reducing sugar?
hints:
- level: 1
  en: Check whether the anomeric carbon of each unit is free to open into an aldehyde.
- level: 2
  en: Consider which disaccharide has a free hemiacetal group.
- level: 3
  en: Think about how the two units are linked in each disaccharide.
