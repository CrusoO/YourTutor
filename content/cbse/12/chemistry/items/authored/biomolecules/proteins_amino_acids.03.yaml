stem:
  en: Which level of protein structure is the alpha helix?
hints:
- level: 1
  en: Consider whether the level involves local folding stabilised by hydrogen bonds along the backbone.
- level: 2
  en: Think about how far along the chain the stabilising bonds connect.
- level: 3
  en: Compare the local folding with the overall three dimensional shape.
