stem:
  en: What is the elevation of the boiling point of water, in K, when 1 mol/kg of a non-volatile non-electrolyte is dissolved? The ebullioscopic constant of water is 0.52 K kg/mol.
hints:
- level: 1
  en: Use the relation between molality and the boiling point elevation constant.
- level: 2
  en: Multiply the constant by the molality of the solution.
- level: 3
  en: Check the units so that the molality cancels.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
