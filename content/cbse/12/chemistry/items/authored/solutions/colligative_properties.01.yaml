  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.52'
  accept: []
solution_steps:
- en: The boiling point elevation equals the constant times the molality.
- en: With molality 1 mol/kg, the elevation is 0.52 K.
- en: The unit of the answer is K.
- en: Answer = 0.52
