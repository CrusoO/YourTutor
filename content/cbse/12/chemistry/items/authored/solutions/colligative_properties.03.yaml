stem:
  en: The freezing point depression constant of water is 1.86 K kg/mol. What is the freezing point depression in K when 0.5 mol/kg of a non-electrolyte is dissolved in water?
hints:
- level: 1
  en: Multiply the freezing point constant by the molality.
- level: 2
  en: The solute is a non-electrolyte, so each formula unit gives one particle.
- level: 3
  en: Keep track of the units in kelvin.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
