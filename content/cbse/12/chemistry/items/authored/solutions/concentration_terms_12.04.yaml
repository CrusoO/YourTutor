stem:
  en: A solution is made from 46 g of ethanol (molar mass 46 g/mol) and 72 g of water (molar mass 18 g/mol). What is the mole fraction of ethanol?
hints:
- level: 1
  en: Find the moles of each component from its mass and molar mass.
- level: 2
  en: The mole fraction is the moles of one component divided by the total moles.
- level: 3
  en: Add the moles of both components to get the total.
