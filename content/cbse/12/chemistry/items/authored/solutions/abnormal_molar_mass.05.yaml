stem:
  en: A salt AB2 dissociates in water with a degree of dissociation of 0.8. What is its van't Hoff factor? Give one decimal place.
hints:
- level: 1
  en: Use the relation i equals one plus alpha times the number of ions minus one.
- level: 2
  en: First count how many ions one formula unit produces on complete dissociation.
- level: 3
  en: Substitute the degree of dissociation given in the stem.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2.6'
  accept: []
solution_steps:
- en: AB2 gives three ions when it dissociates.
- en: The factor is one plus alpha times the number of ions minus one, which gives 1 plus 0.8 times 2, or 2.6.
- en: Answer = 2.6
tier: C
