answer:
  sympy: '28.62'
  accept: []
solution_steps:
- en: Multiplying the pure vapour pressure 31.8 mm Hg by the mole fraction 0.9 gives 28.62 mm Hg.
- en: The unit of the answer is mm Hg.
- en: Answer = 28.62
