stem:
  en: Pure water has a vapour pressure of 31.8 mm Hg at a temperature. In an ideal solution the mole fraction of water is 0.9. What is the vapour pressure of water above the solution in mm Hg?
hints:
- level: 1
  en: Multiply the pure vapour pressure by the mole fraction of the water in the mixture.
- level: 2
  en: Keep the two decimal places in the product.
- level: 3
  en: Do not use the mole fraction of the solute.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
