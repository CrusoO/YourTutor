stem:
  en: A solution is 10 percent by mass of a solute with molar mass 60 g/mol, and the rest is water. What is its molality in mol/kg? Give two decimal places.
hints:
- level: 1
  en: Assume a 100 g sample so that the mass of solvent is what remains.
- level: 2
  en: Convert the mass of solute into moles first.
- level: 3
  en: Divide the moles by the solvent mass expressed in kilograms.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.85'
  accept: []
solution_steps:
- en: A 100 g sample holds 10 g of solute and 90 g of water.
- en: The 10 g is 0.1667 mol, and dividing by 0.09 kg gives about 1.85 mol/kg.
- en: The unit of the answer is mol/kg.
- en: Answer = 1.85
tier: C
