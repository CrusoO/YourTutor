difficulty: 0.6
pool: practice
role: apply
stem:
  en: Benzoic acid dimerises completely in benzene, giving a van't Hoff factor of 0.5. If the calculated molar mass is 122 g/mol, what is the observed molar mass in g/mol?
hints:
- level: 1
  en: Divide the normal molar mass by the van't Hoff factor.
- level: 2
  en: A factor below one means that the particles have joined together in solution.
- level: 3
  en: Keep the units of molar mass unchanged.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '244'
  accept: []
solution_steps:
- en: The observed molar mass is the calculated value divided by the van't Hoff factor.
- en: Dividing 122 by 0.5 gives 244 g/mol.
- en: The unit of the answer is g/mol.
- en: Answer = 244
tier: C
