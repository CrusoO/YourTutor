stem:
  en: Two volatile liquids A and B form an ideal solution. Pure A has a vapour pressure of 300 mm Hg and pure B has 100 mm Hg at the same temperature. If the mole fraction of A in the liquid is 0.4, what is the total vapour pressure in mm Hg?
hints:
- level: 1
  en: Find the mole fraction of B from the mole fraction of A.
- level: 2
  en: Calculate each partial pressure separately using Raoult's law.
- level: 3
  en: Add the two partial pressures to get the total.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
