answer:
  sympy: '180'
  accept: []
solution_steps:
- en: The partial pressure of A is 0.4 times 300, which is 120 mm Hg.
- en: The partial pressure of B is 0.6 times 100, which is 60 mm Hg.
- en: The total is 180 mm Hg.
- en: The unit of the answer is mm Hg.
- en: Answer = 180
