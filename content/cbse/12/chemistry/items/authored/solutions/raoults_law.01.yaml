stem:
  en: Pure benzene has a vapour pressure of 100 mm Hg at a given temperature. In an ideal solution its mole fraction is 0.5. What is its partial vapour pressure in mm Hg?
hints:
- level: 1
  en: 'Apply Raoult''s law: partial pressure equals mole fraction times pure vapour pressure.'
- level: 2
  en: Use the pure vapour pressure given in the stem.
- level: 3
  en: Multiply the two values together.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '50'
  accept: []
solution_steps:
- en: Raoult's law says the partial pressure equals the mole fraction times the pure vapour pressure.
- en: That gives 0.5 times 100 mm Hg.
- en: The unit of the answer is mm Hg.
- en: Answer = 50
