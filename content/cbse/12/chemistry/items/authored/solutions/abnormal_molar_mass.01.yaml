stem:
  en: A solute dissociates completely into two ions when dissolved. What is its van't Hoff factor?
hints:
- level: 1
  en: Count the particles that form from one formula unit when it dissolves completely.
- level: 2
  en: The van't Hoff factor is the ratio of the actual particle count to the formula unit count.
- level: 3
  en: Check that every ion counts as one particle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
