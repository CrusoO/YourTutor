stem:
  en: 5 g of a non-volatile solute dissolved in 100 g of benzene lowers the freezing point by 1.28 K. The freezing point constant of benzene is 5.12 K kg/mol. What is the molar mass of the solute in g/mol?
hints:
- level: 1
  en: Rearrange the freezing point relation so that molar mass is the subject.
- level: 2
  en: Express the mass of solvent in kilograms before substituting.
- level: 3
  en: Recall that molality equals moles of solute divided by kilograms of solvent.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '200'
  accept: []
solution_steps:
- en: Rearranging the depression formula gives molar mass equal to Kf times the mass of solute divided by the depression times the solvent mass in kg.
- en: That gives 200 g/mol.
- en: The unit of the answer is g/mol.
- en: Answer = 200
tier: C
