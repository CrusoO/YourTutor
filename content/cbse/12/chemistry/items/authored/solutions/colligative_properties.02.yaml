stem:
  en: Which of these is a colligative property?
hints:
- level: 1
  en: Colligative means the property depends on how many particles are present, not on what they are.
- level: 2
  en: Think about which property changes in a predictable way with the particle count.
- level: 3
  en: Eliminate properties that depend mainly on the identity or colour of the particles.
