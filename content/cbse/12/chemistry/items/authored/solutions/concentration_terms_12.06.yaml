stem:
  en: A sodium chloride solution is 15 percent by mass, has density 1.2 g/mL, and NaCl has molar mass 58.5 g/mol. What is its molarity in mol/L? Give two decimal places.
hints:
- level: 1
  en: Start from one litre of solution and use the density to find its mass.
- level: 2
  en: Find the mass of solute from the mass percentage.
- level: 3
  en: Convert that solute mass into moles using the molar mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
