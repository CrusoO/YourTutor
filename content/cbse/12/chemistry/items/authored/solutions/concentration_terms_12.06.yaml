answer:
  sympy: '3.08'
  accept: []
solution_steps:
- en: One litre of solution weighs 1200 g and holds 180 g of NaCl.
- en: That is about 3.08 mol, so the molarity is 3.08 mol/L.
- en: The unit of the answer is mol/L.
- en: Answer = 3.08
