  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: The expected depression for a non-electrolyte would be 0.186 K.
- en: The observed value is three times larger, so the van't Hoff factor is 3.
- en: Answer = 3
