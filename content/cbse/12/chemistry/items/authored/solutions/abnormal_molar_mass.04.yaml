stem:
  en: A 0.1 molal solution of a salt has a freezing point depression of 0.558 K. With Kf equal to 1.86 K kg/mol, what is the van't Hoff factor?
hints:
- level: 1
  en: Compute the depression expected for the same molality without any dissociation.
- level: 2
  en: Divide the observed depression by that expected value.
- level: 3
  en: The van't Hoff factor is the ratio of observed to expected colligative effect.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
