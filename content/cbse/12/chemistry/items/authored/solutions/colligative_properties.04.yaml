stem:
  en: A solution has concentration 0.1 mol/L of a non-electrolyte at 300 K. Using R = 8.314 J/mol/K, what is its osmotic pressure in kPa? Give one decimal place.
hints:
- level: 1
  en: Convert the concentration to mol per cubic metre before using the gas constant in SI units.
- level: 2
  en: Osmotic pressure is the product of the concentration, R and the temperature.
- level: 3
  en: Convert the result from pascals to kilopascals at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '249.4'
  accept: []
solution_steps:
- en: Osmotic pressure is the concentration times R times T.
- en: Converting 0.1 mol/L to 100 mol/m cubed and multiplying by 8.314 and 300 gives about 249.4 kPa.
- en: The unit of the answer is kPa.
- en: Answer = 249.4
