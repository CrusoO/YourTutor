id: A.12.chemistry.haloalkanes_and_haloarenes.sn1_sn2.05
skill_ids:
- SK.A.12.chemistry.sn1_sn2
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Tertiary bromides react mainly by SN1. Which factor explains this preference?
hints:
- level: 1
  en: Compare the stability of the intermediate formed from primary and tertiary structures.
- level: 2
  en: Think about which groups around the carbon can donate electron density to a positive centre.
- level: 3
  en: Consider how crowded the carbon is for a backside attack.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The tertiary carbocation is stabilised by hyperconjugation and alkyl groups
- id: b
  en: Steric hindrance is lowest at the tertiary carbon
- id: c
  en: Bromine is a poor leaving group
- id: d
  en: The nucleophile attacks from the back more easily
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.6C0C39F4AFD1
  when_answer_equals:
  - b
- id: MC.A.AE4DFD3DBEE1
  when_answer_equals:
  - d
- id: MC.A.AAF6D2ADE929
  when_answer_equals:
  - c
solution_steps:
- en: Three alkyl groups donate electron density and stabilise the positive charge of the carbocation.
- en: That makes the ionisation step easy, so SN1 dominates.
- en: The correct option is a.
tier: C
diagram_note: Central carbon bonded to three alkyl groups and to a bromine atom; a bracket shows the planar cation formed when bromine leaves.
