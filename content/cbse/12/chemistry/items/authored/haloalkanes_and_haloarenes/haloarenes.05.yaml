stem:
  en: Why does 1-chloro-2,4-dinitrobenzene react with sodium hydroxide much more readily than chlorobenzene does?
hints:
- level: 1
  en: Think about the effect of electron withdrawing groups on a negative intermediate formed on the ring.
- level: 2
  en: Consider which positions relative to the chlorine the nitro groups occupy.
- level: 3
  en: Compare the stability of the intermediate with and without the nitro groups.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Nitro groups make the ring non-aromatic
- id: b
  en: Nitro groups withdraw electrons and stabilise the negative intermediate
- id: c
  en: Nitro groups donate electrons to the chlorine
- id: d
  en: Nitro groups lengthen the C-Cl bond
answer:
