stem:
  en: Why is the carbon chlorine bond in chlorobenzene shorter than in a chloroalkane?
hints:
- level: 1
  en: Think about overlap between a lone pair on chlorine and the pi system of the ring.
- level: 2
  en: Consider how resonance changes the bond order of the carbon chlorine bond.
- level: 3
  en: Compare the bond in the ring with a single bond in an alkyl chloride.
