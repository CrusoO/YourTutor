id: A.12.chemistry.electrochemistry.conductance_electrolysis.04
skill_ids:
- SK.A.12.chemistry.conductance_electrolysis
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A salt solution of concentration 0.02 mol/L has a specific conductance of 0.0025 S/cm. What is its molar conductivity in S cm2/mol?
hints:
- level: 1
  en: Multiply the conductivity by one thousand and divide by the concentration in mol/L.
- level: 2
  en: The factor of one thousand converts the volume unit from cubic centimetres to litres.
- level: 3
  en: Keep track of the units through the calculation.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '125'
  accept: []
solution_steps:
- en: Molar conductivity equals the specific conductance times 1000 divided by the concentration in mol/L.
- en: That gives 0.0025 times 1000 divided by 0.02, which is 125.
- en: The unit of the answer is S cm2/mol.
- en: Answer = 125
tier: C
