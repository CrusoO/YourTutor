stem:
  en: How does a sacrificial anode of zinc protect an iron structure from rusting?
hints:
- level: 1
  en: Compare the standard potentials of the protecting metal and iron.
- level: 2
  en: Think about which metal is more easily oxidised in contact with iron.
- level: 3
  en: Decide which metal becomes the anode in the corrosion cell.
