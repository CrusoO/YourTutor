- id: MC.A.84CD13135477
  when_answer_equals:
  - a
solution_steps:
- en: Tin is less reactive than iron.
- en: Once the coating is broken, the exposed iron acts as the anode of a corrosion cell and is oxidised.
- en: The correct option is c.
tier: C
