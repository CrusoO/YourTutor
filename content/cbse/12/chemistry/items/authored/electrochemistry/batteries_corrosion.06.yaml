difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A tin coating on iron is scratched and the iron is exposed to moist air. Which statement explains why the iron then rusts faster than it would without the coating?
hints:
- level: 1
  en: Compare the reactivity of tin and iron in the electrochemical series.
- level: 2
  en: Decide which metal is oxidised when the two are in contact in water.
- level: 3
  en: Think about which metal acts as the anode in the corrosion cell.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Tin forms a salt bridge that carries electrons
- id: b
  en: Tin is more active than iron and dissolves first
- id: c
  en: Tin is less active than iron, so iron becomes the anode and oxidises
- id: d
  en: Tin releases oxygen that attacks the iron
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.6F4A99A37AD1
  when_answer_equals:
  - b
- id: MC.A.02D6E947721A
  when_answer_equals:
