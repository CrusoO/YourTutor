difficulty: 0.6
pool: practice
role: procedure
stem:
  en: The standard EMF of the Daniell cell is 1.10 V and two electrons are transferred per reaction. Using F = 96500 C/mol, what is the magnitude of the standard Gibbs energy change in kJ/mol? Give one decimal place.
hints:
- level: 1
  en: Use the relation between the Gibbs energy change, the number of electrons, the Faraday constant and the cell EMF.
- level: 2
  en: Keep the EMF in volts and the charge in coulombs per mole.
- level: 3
  en: Convert joules to kilojoules at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '212.3'
  accept: []
solution_steps:
- en: Delta G equals minus n F E.
- en: With n = 2, F = 96500 C/mol and E = 1.10 V, the magnitude is 212300 J/mol, or 212.3 kJ/mol.
- en: The unit of the answer is kJ/mol.
- en: Answer = 212.3
tier: C
