stem:
  en: A galvanic cell has a magnesium anode and a silver cathode. Which description of electron flow is correct?
hints:
- level: 1
  en: Electrons leave the electrode where oxidation happens.
- level: 2
  en: Trace the path of electrons only through the metal conductor.
- level: 3
  en: Ions move through the bridge while electrons do not.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: From magnesium to silver through the external wire
- id: b
  en: From magnesium to silver through the solution
- id: c
  en: Through the salt bridge from magnesium to silver
- id: d
  en: From silver to magnesium through the external wire
answer:
  sympy: a
  accept: []
