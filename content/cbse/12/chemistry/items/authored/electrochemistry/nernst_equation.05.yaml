answer:
  sympy: '0.12'
  accept: []
solution_steps:
- en: Both half cells have the same standard potential, so only the logarithm term remains.
- en: The ratio of concentrations is 100, giving 0.0591 times 2, or 0.12 V.
- en: The unit of the answer is V.
- en: Answer = 0.12
