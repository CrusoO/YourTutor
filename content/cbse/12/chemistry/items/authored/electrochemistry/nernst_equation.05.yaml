stem:
  en: A silver concentration cell has electrodes in 0.001 M and 0.1 M silver ion solutions at 298 K. What is its EMF in volts? Give two decimal places.
hints:
- level: 1
  en: A concentration cell has zero standard EMF, so only the logarithm term remains.
- level: 2
  en: Take the ratio of the two concentrations, with the more dilute one in the denominator.
- level: 3
  en: Use one electron for silver in the coefficient.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
