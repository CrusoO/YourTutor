stem:
  en: Which unit is used for molar conductivity?
hints:
- level: 1
  en: Molar conductivity is conductivity divided by concentration in moles per unit volume.
- level: 2
  en: Think about how dividing by moles per litre changes the length and volume units.
- level: 3
  en: Start from the unit of specific conductance and then adjust for the concentration.
