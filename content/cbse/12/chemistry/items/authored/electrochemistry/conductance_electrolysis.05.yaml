answer:
  sympy: '0.635'
  accept: []
solution_steps:
- en: 1930 C is 0.02 mol of electrons.
- en: Two electrons per copper ion mean 0.01 mol of copper, which weighs 0.635 g.
- en: The unit of the answer is g.
- en: Answer = 0.635
