stem:
  en: How many grams of copper are deposited by 1930 C passed through copper sulphate solution? Copper has molar mass 63.5 g/mol and is deposited as Cu2+. Use F = 96500 C/mol and give three decimal places.
hints:
- level: 1
  en: Convert the charge to moles of electrons using the Faraday constant.
- level: 2
  en: Use the valency of copper to find the moles of metal deposited.
- level: 3
  en: Multiply the moles of metal by its molar mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
