difficulty: 0.2
pool: practice
role: recall
stem:
  en: A cell has a standard EMF of 0.50 V and its reaction quotient equals 1 at 298 K. What is the cell EMF in volts?
hints:
- level: 1
  en: When the reaction quotient equals one, the logarithm term in the equation disappears.
- level: 2
  en: Identify which term is left in the equation.
- level: 3
  en: Compare the cell EMF with the standard EMF under these conditions.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.5'
  accept: []
solution_steps:
- en: When Q equals 1 the logarithm term vanishes, so the cell EMF equals the standard EMF.
- en: The unit of the answer is V.
- en: Answer = 0.5
tier: C
