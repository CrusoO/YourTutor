difficulty: 0.9
pool: practice
role: transfer
stem:
  en: At infinite dilution the limiting molar conductivities of Na+ and Cl- are 50.1 and 76.3 S cm2/mol. What is the limiting molar conductivity of NaCl in S cm2/mol?
hints:
- level: 1
  en: Add the limiting ionic contributions of the two ions.
- level: 2
  en: Each ion contributes independently at infinite dilution.
- level: 3
  en: Check the units carried by each contribution.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '126.4'
  accept: []
solution_steps:
- en: By Kohlrausch's law the limiting molar conductivity of a salt is the sum of the limiting ionic contributions.
- en: Adding 50.1 and 76.3 gives 126.4.
- en: The unit of the answer is S cm2/mol.
- en: Answer = 126.4
tier: C
