stem:
  en: How many grams of silver are deposited when 0.5 faraday of charge passes through a silver nitrate solution? The molar mass of silver is 108 g/mol.
hints:
- level: 1
  en: One faraday of charge deposits one mole of a univalent metal.
- level: 2
  en: Scale the number of faradays to moles of silver.
- level: 3
  en: Multiply the moles by the molar mass of silver.
