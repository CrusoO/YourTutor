answer:
  sympy: '54'
  accept: []
solution_steps:
- en: Each faraday deposits one mole of univalent silver.
- en: Half a faraday deposits half a mole, which is 54 g of silver.
- en: The unit of the answer is g.
- en: Answer = 54
