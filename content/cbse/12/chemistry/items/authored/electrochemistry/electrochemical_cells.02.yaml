stem:
  en: What is the function of the salt bridge in a galvanic cell?
hints:
- level: 1
  en: Think about what must move through the solution for the charge to balance.
- level: 2
  en: Consider why the two half cells would become charged without a link between them.
- level: 3
  en: Identify whether the bridge carries electrons or ions.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
