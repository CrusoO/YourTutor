options:
- id: a
  en: It completes the circuit by letting ions move and keeps the solutions neutral
- id: b
  en: It removes gases formed at the electrodes
- id: c
  en: It converts chemical energy into heat
- id: d
  en: It supplies electrons to the cathode
answer:
  sympy: a
  accept: []
