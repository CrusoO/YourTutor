id: A.12.chemistry.electrochemistry.electrochemical_cells.03
skill_ids:
- SK.A.12.chemistry.electrochemical_cells
difficulty: 0.6
pool: practice
role: apply
stem:
  en: In the cell Zn | Zn2+ || Cu2+ | Cu, which electrode is the positive terminal?
hints:
- level: 1
  en: Find the electrode where reduction happens.
- level: 2
  en: The cathode in a galvanic cell is where electrons are consumed.
- level: 3
  en: Compare the standard potentials of the two couples.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Zinc
- id: b
  en: The salt bridge
- id: c
  en: Both electrodes are neutral
- id: d
  en: Copper
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.4B61F1A8EB9B
  when_answer_equals:
  - a
- id: MC.A.BA8702BE8934
  when_answer_equals:
  - c
- id: MC.A.0359A70BF942
  when_answer_equals:
  - b
solution_steps:
- en: Zinc is oxidised at the anode, which is the negative terminal.
- en: Copper ions are reduced at the cathode, which is the positive terminal.
- en: The correct option is d.
tier: C
diagram_note: Left beaker holds a zinc rod in zinc sulphate solution, right beaker holds a copper rod in copper sulphate solution, a salt bridge joins the beakers, and a voltmeter is wired between the two rods.
