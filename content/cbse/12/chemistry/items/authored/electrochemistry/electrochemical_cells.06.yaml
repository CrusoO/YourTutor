stem:
  en: The standard reduction potential of the cathode half cell is 0.34 V and that of the anode half cell is -0.76 V. What is the cell EMF in volts? Give two decimal places.
hints:
- level: 1
  en: Subtract the anode reduction potential from the cathode reduction potential.
- level: 2
  en: Subtracting a negative number adds its magnitude.
- level: 3
  en: Report the answer with two decimal places.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.10'
  accept: []
solution_steps:
- en: The cell EMF is the cathode reduction potential minus the anode reduction potential.
- en: Subtracting -0.76 from 0.34 gives 1.10 V.
- en: The unit of the answer is V.
- en: Answer = 1.10
tier: C
