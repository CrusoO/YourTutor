id: A.12.chemistry.coordination_compounds.isomerism_coordination.05
skill_ids:
- SK.A.12.chemistry.isomerism_coordination
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which feature is required for optical isomerism in an octahedral complex?
hints:
- level: 1
  en: Compare the complex with its reflection in a mirror.
- level: 2
  en: Check whether the complex has a plane of symmetry.
- level: 3
  en: Consider whether the arrangement can be rotated onto its reflection.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A high coordination number alone
- id: b
  en: The complex must be non-superimposable on its mirror image
- id: c
  en: A square planar geometry
- id: d
  en: Two identical ligands in trans positions
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.61DDD434EAF5
  when_answer_equals:
  - c
- id: MC.A.8F35B9AC85CD
  when_answer_equals:
  - d
- id: MC.A.A0AEDD43105B
  when_answer_equals:
  - a
solution_steps:
- en: An optically active complex is chiral.
- en: Its mirror image cannot be rotated onto it, which happens when the arrangement of ligands lacks a plane of symmetry.
- en: The correct option is b.
tier: C
diagram_note: Pair of mirror image octahedral drawings with the same ligands arranged in a twisted, propeller-like pattern.
