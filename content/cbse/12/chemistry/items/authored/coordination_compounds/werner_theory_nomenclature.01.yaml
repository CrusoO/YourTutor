stem:
  en: What is the IUPAC name of K4[Fe(CN)6]?
hints:
- level: 1
  en: Find the oxidation state of iron from the overall charge of the complex.
- level: 2
  en: Cyanide is a ligand with charge minus one, so count its total contribution.
- level: 3
  en: Name the cation first, then the anion, ending the metal with the -ate suffix.
