stem:
  en: Calculate the spin-only magnetic moment in Bohr magnetons of the high spin d6 Fe2+ ion. Give two decimal places.
hints:
- level: 1
  en: Use the spin-only formula with n equal to the number of unpaired electrons.
- level: 2
  en: Compute n times n plus two before taking the square root.
- level: 3
  en: Round the final result to two decimal places.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
