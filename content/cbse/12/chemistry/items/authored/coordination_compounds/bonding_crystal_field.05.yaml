type: numeric
answer:
  sympy: '4.90'
  accept: []
solution_steps:
- en: With four unpaired electrons the spin-only moment is the square root of n times n plus two, which is the square root of 24, or about 4.90 BM.
- en: The unit of the answer is BM.
- en: Answer = 4.90
