solution_steps:
- en: The two chloride ligands can sit next to each other, which is the cis isomer, or on opposite corners, which is the trans isomer.
- en: Cis and trans forms are geometrical isomers.
- en: The correct option is c.
tier: C
diagram_note: Two square planar drawings of platinum with two ammine ligands and two chloride ligands; in one drawing the two chlorides are next to each other, and in the other they sit on opposite corners.
