id: A.12.chemistry.coordination_compounds.isomerism_coordination.03
skill_ids:
- SK.A.12.chemistry.isomerism_coordination
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which type of isomerism does the square planar complex [Pt(NH3)2Cl2] show?
hints:
- level: 1
  en: Consider whether the two chloride ligands can be placed next to each other or opposite each other.
- level: 2
  en: Think about the arrangement of the two ammine ligands relative to the chlorides.
- level: 3
  en: Compare the arrangements that differ only in the position of identical ligands.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: No isomerism is possible
- id: b
  en: Ionisation isomerism
- id: c
  en: Geometrical isomerism
- id: d
  en: Hydrate isomerism
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.EBA91F9144C9
  when_answer_equals:
  - b
- id: MC.A.881ADA62348E
  when_answer_equals:
  - d
- id: MC.A.7B6F3231B31A
