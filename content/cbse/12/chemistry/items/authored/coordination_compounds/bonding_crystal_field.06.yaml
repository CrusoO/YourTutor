difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which aqueous complex is coloured because of a d to d transition?
hints:
- level: 1
  en: Count the d electrons of the metal ion in each complex.
- level: 2
  en: Check whether the d subshell is empty, full or partly filled.
- level: 3
  en: Consider whether an electron can move between two split levels.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: '[Zn(H2O)6]2+'
- id: b
  en: '[Sc(H2O)6]3+'
- id: c
  en: '[Ti(H2O)6]3+'
- id: d
  en: '[Ag(NH3)2]+'
answer:
