solution_steps:
- en: Ti3+ has one d electron, which can be promoted between the split t2g and eg levels by visible light.
- en: The d0 and d10 ions in the other options cannot make this transition.
- en: The correct option is c.
tier: C
diagram_note: Octahedral arrangement with a metal ion at the centre and six water ligands on the axes, beside a bar diagram of d levels split into a lower set and an upper set.
