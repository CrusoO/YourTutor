role: explain
stem:
  en: In Werner's theory, what does the principal valency of a metal correspond to?
hints:
- level: 1
  en: Werner separated two kinds of valency, and the primary one is the one that can be ionised.
- level: 2
  en: Think about which valency is satisfied by anions that appear outside the complex.
- level: 3
  en: Compare the primary valency with the secondary valency in his description.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
