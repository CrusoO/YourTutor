stem:
  en: Which complex is the active ingredient in the platinum based anticancer drug cisplatin?
hints:
- level: 1
  en: Think about the geometry of the two chloride ligands relative to each other.
- level: 2
  en: Compare the cis and trans forms of the same composition.
- level: 3
  en: Consider which ligands are present in the drug in addition to the chlorides.
