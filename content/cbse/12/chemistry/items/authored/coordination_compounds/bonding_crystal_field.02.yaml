difficulty: 0.2
pool: practice
role: recall
stem:
  en: What does the crystal field splitting parameter, delta o, represent?
hints:
- level: 1
  en: Think about two groups of d orbitals whose energies separate in an octahedral environment.
- level: 2
  en: Consider which quantity describes the separation between these two groups.
- level: 3
  en: Compare the splitting with the ionisation energy of the metal.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The energy needed to remove an electron from the metal
- id: b
  en: The stability constant of the complex
- id: c
  en: The energy gap between the t2g and eg sets of orbitals in an octahedral field
- id: d
  en: The metal to ligand bond length
answer:
  sympy: c
  accept: []
misconception_rules:
