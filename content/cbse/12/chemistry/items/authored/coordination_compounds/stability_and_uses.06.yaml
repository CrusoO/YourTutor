stem:
  en: In a titration that removes calcium ions from hard water with EDTA, which indicator is used?
hints:
- level: 1
  en: Choose an indicator that changes colour when it is released from a metal complex.
- level: 2
  en: Think about whether the indicator is an acid base type or a metal ion type.
- level: 3
  en: Consider which indicator is used for metal ions in EDTA titrations.
