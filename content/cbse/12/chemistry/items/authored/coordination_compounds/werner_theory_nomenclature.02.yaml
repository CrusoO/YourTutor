stem:
  en: What is the IUPAC name of [Co(NH3)6]Cl3?
hints:
- level: 1
  en: The chloride ions outside the complex balance the charge, so the cobalt oxidation state follows from that.
- level: 2
  en: Use the prefix that gives the number of ligands and the special spelling for the neutral ligand.
- level: 3
  en: Name the cation first and the chloride salt second.
