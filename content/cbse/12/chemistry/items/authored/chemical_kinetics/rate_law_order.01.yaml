difficulty: 0.2
pool: practice
role: recall
stem:
  en: When the concentration of a reactant doubles and the rate also doubles, what is the order of the reaction with respect to that reactant?
hints:
- level: 1
  en: Compare the factor by which the rate changes with the factor by which the concentration changes.
- level: 2
  en: The order is the exponent that links the two factors.
- level: 3
  en: Think about which exponent makes the two factors equal.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1'
  accept: []
solution_steps:
- en: A rate that changes in the same ratio as the concentration indicates a first order dependence.
- en: Answer = 1
tier: C
