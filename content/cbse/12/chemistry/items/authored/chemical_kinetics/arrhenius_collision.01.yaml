- id: MC.A.B34310850887
  when_answer_equals:
  - c
solution_steps:
- en: The exponential term exp(-Ea/RT) is the fraction of molecular collisions that carry enough energy to react.
- en: The frequency factor A is a separate term.
- en: The correct option is d.
tier: C
