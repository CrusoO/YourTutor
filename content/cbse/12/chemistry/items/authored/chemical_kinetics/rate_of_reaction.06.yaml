stem:
  en: A reaction has rate = k[A][B]^2. At a certain point the rate is 0.9 mol/L/s. What is the new rate in mol/L/s if [A] is doubled and [B] is tripled?
hints:
- level: 1
  en: Each concentration contributes a factor equal to its ratio raised to its exponent.
- level: 2
  en: Multiply the factors contributed by [A] and [B] together.
- level: 3
  en: Apply the combined factor to the original rate.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '16.2'
  accept: []
solution_steps:
- en: Doubling [A] multiplies the rate by 2, and tripling [B] multiplies it by 9.
- en: The combined factor is 18, so the new rate is 16.2 mol/L/s.
- en: The unit of the answer is mol/L/s.
- en: Answer = 16.2
tier: C
