id: A.12.chemistry.chemical_kinetics.rate_law_order.02
skill_ids:
- SK.A.12.chemistry.rate_law_order
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which statement about the order of a reaction is correct?
hints:
- level: 1
  en: Think about whether the order comes from the rate law or from the balanced equation.
- level: 2
  en: Consider how the rate law is determined in the laboratory.
- level: 3
  en: Check whether the order is linked to the energy change of the reaction.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It always equals the sum of the stoichiometric coefficients
- id: b
  en: It is always a whole number
- id: c
  en: It must be found experimentally and need not match the stoichiometric coefficients
- id: d
  en: It is fixed by the enthalpy of the reaction
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.3FA5E4CD5E0A
  when_answer_equals:
  - a
- id: MC.A.3FC501FF57DE
  when_answer_equals:
  - b
- id: MC.A.5F35BE7F19BD
  when_answer_equals:
  - d
solution_steps:
- en: The order comes from experimental data on how the rate depends on concentration.
- en: It is not read directly from the balanced equation.
- en: The correct option is c.
tier: C
