stem:
  en: The rate constant of a reaction is 0.002 per second at 300 K and 0.008 per second at 320 K. Using R = 8.314 J/mol/K, what is the activation energy in kJ/mol? Give one decimal place.
hints:
- level: 1
  en: Take the natural logarithm of the ratio of the two rate constants.
- level: 2
  en: Use the difference between the reciprocals of the two temperatures.
- level: 3
  en: Solve for the activation energy and convert joules to kilojoules.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '55.3'
  accept: []
solution_steps:
- en: The ratio of rate constants is 4, so ln 4 equals Ea over R times the difference of reciprocal temperatures.
- en: Solving gives an activation energy of about 55.3 kJ/mol.
- en: The unit of the answer is kJ/mol.
- en: Answer = 55.3
tier: C
