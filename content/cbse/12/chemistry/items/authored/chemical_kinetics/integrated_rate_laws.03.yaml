stem:
  en: A first order reaction has a rate constant of 0.0231 per minute. What is its half-life in minutes? Give the nearest whole number.
hints:
- level: 1
  en: Use the relation between the half-life and the rate constant for first order decay.
- level: 2
  en: Divide the natural logarithm of two by the rate constant.
- level: 3
  en: Round the result to the nearest whole number.
