id: A.12.chemistry.chemical_kinetics.arrhenius_collision.03
skill_ids:
- SK.A.12.chemistry.arrhenius_collision
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A reaction has activation energy 50 kJ/mol. How many times larger is the rate constant at 310 K than at 300 K? Use R = 8.314 J/mol/K and give two decimal places.
hints:
- level: 1
  en: Use the two-point form of the Arrhenius equation with the difference of reciprocal temperatures.
- level: 2
  en: Convert the activation energy to J/mol before dividing by R.
- level: 3
  en: Exponentiate the result to get the ratio of the rate constants.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.91'
  accept: []
solution_steps:
- en: The two-point Arrhenius form gives ln of the ratio of rate constants equal to Ea over R times the difference of reciprocal temperatures.
- en: Exponentiating gives a ratio of about 1.91.
- en: Answer = 1.91
tier: C
