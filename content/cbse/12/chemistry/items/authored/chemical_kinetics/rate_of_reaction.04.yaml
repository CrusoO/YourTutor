id: A.12.chemistry.chemical_kinetics.rate_of_reaction.04
skill_ids:
- SK.A.12.chemistry.rate_of_reaction
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does the rate of a reaction usually slow down as it proceeds?
hints:
- level: 1
  en: Track how the concentrations of the reactants change during the reaction.
- level: 2
  en: Consider how the number of collisions depends on the reactant concentration.
- level: 3
  en: Think about what happens to the rate when the reactants become dilute.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Product molecules absorb the activation energy
- id: b
  en: The rate constant rises as products build up
- id: c
  en: Reactant concentrations fall, so collisions become less frequent
- id: d
  en: Products act as a catalyst that inhibits the reaction
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.0F507633361E
  when_answer_equals:
  - a
- id: MC.A.3AF8C529BDA2
  when_answer_equals:
  - b
- id: MC.A.25A8E9DDA077
  when_answer_equals:
  - d
solution_steps:
- en: As reactants are used up, their concentrations fall and the rate drops, because fewer reacting particles meet each second.
- en: The correct option is c.
tier: C
