difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A zero order reaction starts with [A] = 0.5 mol/L and has k = 0.02 mol/L/min. How many minutes does it take for [A] to reach zero?
hints:
- level: 1
  en: For zero order the concentration falls by a fixed amount each unit of time.
- level: 2
  en: Divide the starting concentration by the rate constant.
- level: 3
  en: Check the units so that the time comes out in minutes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '25'
  accept: []
solution_steps:
- en: For zero order the concentration falls by k each minute, so the time to consume 0.5 mol/L is 0.5 divided by 0.02, which is 25 minutes.
- en: The unit of the answer is min.
- en: Answer = 25
tier: C
