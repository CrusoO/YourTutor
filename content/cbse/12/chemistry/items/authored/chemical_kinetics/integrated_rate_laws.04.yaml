difficulty: 0.6
pool: practice
role: apply
stem:
  en: For a first order reaction with k = 0.1 per minute, how many minutes does the concentration take to fall from 0.8 mol/L to 0.1 mol/L? Give one decimal place.
hints:
- level: 1
  en: Use the natural logarithm of the ratio of initial to final concentration divided by the rate constant.
- level: 2
  en: Compute the ratio of the two concentrations first.
- level: 3
  en: Round the final answer to one decimal place.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '20.8'
  accept: []
solution_steps:
- en: The time is ln of the ratio of initial to final concentration divided by k.
- en: The ratio is 8, and ln 8 divided by 0.1 gives about 20.8 minutes.
- en: The unit of the answer is min.
- en: Answer = 20.8
tier: C
