stem:
  en: A first order reaction has a rate constant of 0.693 per second. What is its half-life in seconds?
hints:
- level: 1
  en: For a first order reaction the half-life is ln 2 divided by the rate constant.
- level: 2
  en: Use the value of ln 2 as about 0.693.
- level: 3
  en: Check the units of the half-life.
