id: A.12.chemistry.chemical_kinetics.rate_of_reaction.03
skill_ids:
- SK.A.12.chemistry.rate_of_reaction
difficulty: 0.6
pool: practice
role: apply
stem:
  en: For the reaction 2A gives B, the rate of disappearance of A is 0.6 mol/L/s. What is the rate of formation of B in mol/L/s?
hints:
- level: 1
  en: Use the stoichiometric coefficients to relate the rates of the two species.
- level: 2
  en: Divide the rate of A by its coefficient and multiply by the coefficient of B.
- level: 3
  en: Compare the number of moles of each species in the balanced equation.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.3'
  accept: []
solution_steps:
- en: Two moles of A disappear for each mole of B formed, so B forms at half the rate at which A disappears.
- en: The unit of the answer is mol/L/s.
- en: Answer = 0.3
tier: C
