id: A.12.chemistry.chemical_kinetics.rate_law_order.03
skill_ids:
- SK.A.12.chemistry.rate_law_order
difficulty: 0.6
pool: practice
role: apply
stem:
  en: When the concentration of a reactant is doubled, the rate becomes four times larger. What is the order of the reaction with respect to that reactant?
hints:
- level: 1
  en: Write the rate ratio as the concentration ratio raised to the order.
- level: 2
  en: Take logarithms of both sides to find the exponent.
- level: 3
  en: Solve for the exponent that gives the observed rate ratio.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: Doubling the concentration multiplies the rate by 2 raised to the order.
- en: Since 2 squared equals 4, the order is 2.
- en: Answer = 2
tier: C
