difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Why does anisole react with HI to give phenol and methyl iodide rather than the reverse cleavage?
hints:
- level: 1
  en: Compare the bond strengths of the aryl carbon to oxygen and the methyl carbon to oxygen.
- level: 2
  en: Think about which carbon is more easily attacked by the iodide ion.
- level: 3
  en: Consider which carbon is sp3 hybridised and which is sp2.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The aryl oxygen bond is stronger, so the methyl carbon is attacked
- id: b
  en: Methanol forms in the first step
- id: c
  en: The benzene ring is attacked first
- id: d
  en: Iodine oxidises the methyl group
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.3F94E9DC5A0F
  when_answer_equals:
