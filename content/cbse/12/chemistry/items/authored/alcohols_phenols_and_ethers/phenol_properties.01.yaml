stem:
  en: Why is phenol more acidic than ethanol?
hints:
- level: 1
  en: Compare the conjugate bases and how their negative charge is spread out.
- level: 2
  en: Think about whether the negative charge can move onto the ring.
- level: 3
  en: Consider which conjugate base is more stable.
