options:
- id: a
  en: Phenol has more hydroxyl groups than ethanol
- id: b
  en: The phenoxide ion is stabilised by resonance with the ring
- id: c
  en: The ethoxide ion is stabilised by the ring
- id: d
  en: Ethanol is aromatic
answer:
