stem:
  en: Kolbe's reaction converts sodium phenoxide and carbon dioxide into which product?
hints:
- level: 1
  en: The product has a carboxyl group and a hydroxyl group on the same ring.
- level: 2
  en: Think about which ring position receives the carboxyl group.
- level: 3
  en: Consider the position the phenoxide directs the electrophile to.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
