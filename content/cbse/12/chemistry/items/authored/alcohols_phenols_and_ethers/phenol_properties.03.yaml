id: A.12.chemistry.alcohols_phenols_and_ethers.phenol_properties.03
skill_ids:
- SK.A.12.chemistry.phenol_properties
difficulty: 0.6
pool: practice
role: apply
stem:
  en: What product forms when phenol is treated with bromine water at room temperature?
hints:
- level: 1
  en: The hydroxyl group activates the positions ortho and para to it.
- level: 2
  en: Count how many activated positions are available on the ring.
- level: 3
  en: Consider how strongly a hydroxyl group activates the ring compared with a single halogen.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Monobromophenol only
- id: b
  en: 2,4,6-tribromophenol
- id: c
  en: Bromobenzene
- id: d
  en: 1,2-dibromobenzene
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.0262CFEBE3C6
  when_answer_equals:
  - a
- id: MC.A.DF0D52658772
  when_answer_equals:
  - c
- id: MC.A.D94815A0EA9E
  when_answer_equals:
