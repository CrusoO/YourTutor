stem:
  en: What is formed when an ether such as methyl ethyl ether is cleaved with hot concentrated HI?
hints:
- level: 1
  en: Think about the iodide attacking the less hindered alkyl carbon.
- level: 2
  en: Consider which two products form when one C-O bond breaks.
- level: 3
  en: Compare cleavage with esterification as possible reactions.
