- id: MC.A.D3A3AE09EE08
  when_answer_equals:
  - d
solution_steps:
- en: The alkoxide is a strong base, and a tertiary halide is hindered for SN2.
- en: Elimination dominates, so an alkene forms instead of the ether.
- en: The correct option is b.
tier: C
