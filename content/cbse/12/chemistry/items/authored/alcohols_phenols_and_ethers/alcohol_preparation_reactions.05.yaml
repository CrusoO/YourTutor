stem:
  en: Which mechanism applies when a secondary alcohol reacts with concentrated HBr?
hints:
- level: 1
  en: Think about the leaving group, which is water after protonation, and the carbon's ability to stabilise a positive charge.
- level: 2
  en: Consider whether the carbon forms an intermediate cation.
- level: 3
  en: Compare the substrate with a primary alcohol, which reacts differently.
