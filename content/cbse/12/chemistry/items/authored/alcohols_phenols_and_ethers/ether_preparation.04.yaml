difficulty: 0.6
pool: practice
role: apply
stem:
  en: Acid catalysed dehydration of two ethanol molecules gives which ether?
hints:
- level: 1
  en: Count the carbons in each ethyl group that join through the oxygen.
- level: 2
  en: Think about which two molecules combine and what is lost between them.
- level: 3
  en: Check that the number of carbons in the product matches the reactants.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Dimethyl ether
- id: b
  en: Diethyl ether
- id: c
  en: Vinyl ether
- id: d
  en: Ethyl methyl ether
answer:
  sympy: b
  accept: []
misconception_rules:
