id: A.12.chemistry.surface_chemistry.catalysis.03
skill_ids:
- SK.A.12.chemistry.catalysis
difficulty: 0.6
pool: practice
role: explain
stem:
  en: How does a catalyst increase the rate of a reaction?
hints:
- level: 1
  en: Compare the energy barrier with and without the catalyst.
- level: 2
  en: Think about whether the catalyst changes where the reaction ends up or only how fast it gets there.
- level: 3
  en: Consider which energy quantity the catalyst alters.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It lowers the activation energy by providing an alternative pathway
- id: b
  en: It raises the equilibrium constant
- id: c
  en: It supplies extra energy to the molecules
- id: d
  en: It changes the enthalpy of the reaction
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.46649BF4BFED
  when_answer_equals:
  - b
- id: MC.A.16ED11C9415C
  when_answer_equals:
  - c
- id: MC.A.3B5650458E29
  when_answer_equals:
  - d
solution_steps:
- en: A catalyst opens a route with a lower energy barrier.
- en: Both the forward and reverse reactions speed up, and the equilibrium position is unchanged.
- en: The correct option is a.
tier: C
