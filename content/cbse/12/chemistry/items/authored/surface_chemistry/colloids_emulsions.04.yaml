stem:
  en: What is the process called when a freshly formed precipitate is converted back into a colloidal sol by adding a small amount of electrolyte?
hints:
- level: 1
  en: Think about the process that disperses a precipitate back into fine particles.
- level: 2
  en: Consider which process restores the sol state after coagulation.
- level: 3
  en: Compare the process with its reverse, the one that makes particles settle.
