id: A.12.chemistry.surface_chemistry.colloids_emulsions.01
skill_ids:
- SK.A.12.chemistry.colloids_emulsions
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which property of colloids is shown by the Tyndall effect?
hints:
- level: 1
  en: Think about what a beam of light does when it passes through a fine dispersion.
- level: 2
  en: Consider whether the particles in the path send light sideways.
- level: 3
  en: Compare what a true solution does to a light beam with what a colloid does.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Absorption of light by the solvent
- id: b
  en: Scattering of light by dispersed particles
- id: c
  en: Reflection of heat by the solutes
- id: d
  en: Bending of light by dissolved ions
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.61F819032C98
  when_answer_equals:
  - a
- id: MC.A.510B00784536
  when_answer_equals:
  - c
- id: MC.A.8E71E183190D
  when_answer_equals:
  - d
solution_steps:
- en: The Tyndall effect is the scattering of a light beam by particles of a colloid, which makes the beam path visible.
- en: The correct option is b.
tier: C
