id: A.12.chemistry.amines.amine_preparation.04
skill_ids:
- SK.A.12.chemistry.amine_preparation
difficulty: 0.6
pool: practice
role: explain
stem:
  en: What is the product of ammonolysis of ethyl bromide with excess ammonia?
hints:
- level: 1
  en: The amine formed is itself a nucleophile that can react again with the halide.
- level: 2
  en: Think about how many times the product can be alkylated.
- level: 3
  en: Consider whether the product distribution is controlled in this reaction.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Ethanol
- id: b
  en: A mixture of primary, secondary and tertiary amines
- id: c
  en: Only the primary amine
- id: d
  en: Only a quaternary salt
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.C09274BC0570
  when_answer_equals:
  - c
- id: MC.A.E0E1EDC4F606
  when_answer_equals:
  - d
- id: MC.A.E4904BE44A85
  when_answer_equals:
  - a
solution_steps:
- en: Each amine formed is also a nucleophile, so it reacts further with ethyl bromide.
- en: The result is a mixture of amines and their salts.
- en: The correct option is b.
tier: C
