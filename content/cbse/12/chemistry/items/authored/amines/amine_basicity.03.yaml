  en: In the gas phase there is no solvent to stabilise the ammonium ion, so inductive effects matter most.
- level: 2
  en: Count the alkyl groups on nitrogen in each option.
- level: 3
  en: Consider which amine has the strongest electron donation to nitrogen.
