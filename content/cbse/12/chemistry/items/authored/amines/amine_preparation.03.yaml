stem:
  en: Hofmann bromamide degradation of propanamide gives which amine?
hints:
- level: 1
  en: Each degradation step removes the carbonyl carbon from the amide chain.
- level: 2
  en: Count the carbons in the amide and subtract the carbonyl carbon.
- level: 3
  en: Check how many carbons are left attached to the nitrogen.
