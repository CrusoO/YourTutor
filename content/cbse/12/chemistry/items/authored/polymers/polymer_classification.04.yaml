difficulty: 0.6
pool: practice
role: apply
stem:
  en: Buna-S is classified as which type of polymer?
hints:
- level: 1
  en: Think about the two monomers used and whether the product stretches like rubber.
- level: 2
  en: Consider whether the polymer is made by a single monomer or by two.
- level: 3
  en: Decide whether the material is natural or synthetic.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Natural elastomer
- id: b
  en: Thermosetting resin
- id: c
  en: Synthetic elastomer from copolymerisation
- id: d
  en: Fibre from condensation
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.30882228656D
  when_answer_equals:
  - a
- id: MC.A.908CB85E16DB
  when_answer_equals:
  - b
- id: MC.A.C5D7D89C8CBD
  when_answer_equals:
