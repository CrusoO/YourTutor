stem:
  en: What are the monomers of nylon-6,6?
hints:
- level: 1
  en: Nylon-6,6 uses two monomers, one with amine groups at both ends and one with acid groups at both ends.
- level: 2
  en: Count the carbons in each monomer, since both have six.
- level: 3
  en: Think about which pair of monomers forms amide links.
