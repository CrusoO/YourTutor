stem:
  en: Which property best describes a condensation polymer?
hints:
- level: 1
  en: Think about what a step growth reaction releases as two monomers link.
- level: 2
  en: Consider which functional groups react together to join the monomers.
- level: 3
  en: Compare with addition polymerisation, which joins monomers without losing anything.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
