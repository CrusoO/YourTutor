  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Only one monomer type is used
- id: b
  en: Only double bonds open during growth
- id: c
  en: No byproduct is formed
- id: d
  en: Loss of a small molecule such as water at each linking step
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.8333886DEF4F
  when_answer_equals:
