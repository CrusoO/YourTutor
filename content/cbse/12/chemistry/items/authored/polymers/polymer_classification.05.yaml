provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They have no carbon chains
- id: b
  en: Their chains are cross linked into a rigid network
- id: c
  en: Their monomers are gases
- id: d
  en: They are always ionic
answer:
  sympy: b
  accept: []
misconception_rules:
