role: transfer
stem:
  en: Why do thermosetting polymers not soften on heating?
hints:
- level: 1
  en: Think about the bonds between chains in a set resin.
- level: 2
  en: Consider whether the chains can slide past one another when heated.
- level: 3
  en: Compare the network of a set resin with the separate chains of a thermoplastic.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
