difficulty: 0.6
pool: practice
role: explain
stem:
  en: The biodegradable polymer PHBV is made from which units?
hints:
- level: 1
  en: Think about hydroxy acid units linked by ester bonds that bacteria can produce.
- level: 2
  en: Consider which monomers contain both an alcohol and an acid group.
- level: 3
  en: Eliminate options that are simple alkenes or diamine monomers.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 3-hydroxybutanoic and 3-hydroxypentanoic acid units
- id: b
  en: Caprolactam
- id: c
  en: Ethene and propene
- id: d
  en: Styrene and butadiene
answer:
  sympy: a
  accept: []
misconception_rules:
