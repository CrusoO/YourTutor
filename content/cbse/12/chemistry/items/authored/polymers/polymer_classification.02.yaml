id: A.12.chemistry.polymers.polymer_classification.02
skill_ids:
- SK.A.12.chemistry.polymer_classification
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What property defines a thermoplastic polymer?
hints:
- level: 1
  en: Compare with thermosetting polymers that set once and cannot be softened again.
- level: 2
  en: Think about whether the chains are held together by weak forces or by permanent cross links.
- level: 3
  en: Consider how the polymer responds to repeated heating.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is insoluble in every solvent
- id: b
  en: It is permanently cross linked after the first heating
- id: c
  en: It softens on heating and hardens again on cooling
- id: d
  en: It cannot be remoulded once made
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.6BDD06FA2728
  when_answer_equals:
  - b
  - d
- id: MC.A.C0A2B20411DB
  when_answer_equals:
  - a
solution_steps:
- en: Thermoplastics have linear or branched chains held by weak forces.
- en: They soften on heating and can be remoulded many times.
- en: The correct option is c.
tier: C
