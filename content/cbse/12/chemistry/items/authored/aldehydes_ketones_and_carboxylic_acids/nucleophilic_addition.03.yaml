stem:
  en: In the addition of HCN to an aldehyde, which atom of the carbonyl group is attacked first by the nucleophile?
hints:
- level: 1
  en: Consider which atom is electron poor because of the polar carbon oxygen bond.
- level: 2
  en: Think about the site where a nucleophile is attracted.
- level: 3
  en: Track where the electron pair of the new bond ends up.
