difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which cross aldol combination gives essentially one main product?
hints:
- level: 1
  en: Choose a partner that cannot form an enolate itself.
- level: 2
  en: Think about which carbonyl compound can act as the enolate component.
- level: 3
  en: Consider why a mixture of several products is avoided in this pairing.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Two different aliphatic aldehydes in equal amounts
- id: b
  en: Benzaldehyde with acetone under base, the Claisen-Schmidt condensation
- id: c
  en: Formaldehyde with formaldehyde in acid
- id: d
  en: Acetone with acetone only in base
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.ABC2FEDA54B4
  when_answer_equals:
