stem:
  en: Why is ethanoic acid more acidic than ethanol?
hints:
- level: 1
  en: Compare the conjugate bases and the number of resonance structures they have.
- level: 2
  en: Think about how the negative charge spreads over the two oxygens.
- level: 3
  en: Consider which conjugate base is more stable.
