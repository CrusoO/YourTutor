stem:
  en: The Hell-Volhard-Zelinsky reaction adds a halogen to which carbon of a carboxylic acid?
hints:
- level: 1
  en: Think about which carbon is next to the carbonyl group.
- level: 2
  en: Consider the position that enolises in the acyl halide intermediate.
- level: 3
  en: Compare the positions labelled alpha and beta in the chain.
