stem:
  en: Which factor favours hydrate formation from formaldehyde more than from acetone?
hints:
- level: 1
  en: Compare how many groups surround the carbonyl carbon in each compound.
- level: 2
  en: Think about the electrophilicity of the carbonyl carbon and how crowded it is.
- level: 3
  en: Consider how the equilibrium of water addition depends on steric crowding.
