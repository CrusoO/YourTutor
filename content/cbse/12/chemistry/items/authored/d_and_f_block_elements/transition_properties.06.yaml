difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Why are zinc(II) compounds usually colourless?
hints:
- level: 1
  en: Count the d electrons in the Zn2+ ion and consider whether they can move between levels.
- level: 2
  en: Think about whether a full d subshell has a gap to absorb into.
- level: 3
  en: Compare Zn2+ with an ion that has partly filled d orbitals.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Zinc is a noble metal that does not react
- id: b
  en: Zinc(II) absorbs only in the ultraviolet
- id: c
  en: Its d orbitals are completely filled, so no d to d transitions occur
- id: d
  en: Zinc has no d electrons in any of its states
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.E5AA1F0F1D0C
  when_answer_equals:
  - d
- id: MC.A.9414808382C1
  when_answer_equals:
  - b
- id: MC.A.BF9BFB5D4E93
  when_answer_equals:
  - a
solution_steps:
- en: Zn2+ has a completely filled 3d10 subshell.
- en: With no partly filled d level, visible light cannot promote an electron, so the ion is colourless.
- en: The correct option is c.
tier: C
