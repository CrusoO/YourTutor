stem:
  en: Why do actinoids show a wider range of oxidation states than lanthanoids?
hints:
- level: 1
  en: Compare the energies of the 5f and 6d electrons in the actinoids.
- level: 2
  en: Think about whether the outer f electrons are close in energy to the d electrons.
- level: 3
  en: Consider how tightly the 4f electrons of the lanthanoids are held.
