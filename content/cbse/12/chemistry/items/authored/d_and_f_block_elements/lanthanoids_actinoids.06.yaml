difficulty: 0.9
pool: practice
role: explain
stem:
  en: Why is the magnetic moment of lanthanoid ions harder to predict than that of d block ions?
hints:
- level: 1
  en: Compare how strongly the surrounding ligands affect 4f electrons with their effect on 3d electrons.
- level: 2
  en: Think about whether the orbital contribution to the moment survives in the complex.
- level: 3
  en: Consider how shielding changes the influence of the environment.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The 4f electrons are well shielded, and orbital contributions are not quenched by the ligands
- id: b
  en: Their nuclei are magnetic
- id: c
  en: The f electrons are always paired
- id: d
  en: f orbitals are absent in these ions
answer:
  sympy: a
  accept: []
misconception_rules:
