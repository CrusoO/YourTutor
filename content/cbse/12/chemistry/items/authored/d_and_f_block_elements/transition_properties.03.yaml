options:
- id: a
  en: Free protons in the nucleus produce a field
- id: b
  en: The ionic charge alone creates a magnetic moment
- id: c
  en: The unpaired d electrons give a net magnetic moment
- id: d
  en: Paired s electrons align in a magnetic field
