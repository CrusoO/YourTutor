id: A.12.chemistry.d_and_f_block_elements.transition_properties.01
skill_ids:
- SK.A.12.chemistry.transition_properties
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Why are most transition metal ions coloured?
hints:
- level: 1
  en: Think about electrons moving between energy levels split by the surrounding ligands.
- level: 2
  en: Consider which subshell of the metal is involved in the absorption.
- level: 3
  en: Compare the colour of an ion with the light it absorbs.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Their nuclei absorb light
- id: b
  en: They emit light when heated
- id: c
  en: They have filled s orbitals only
- id: d
  en: They absorb visible light to promote d electrons between split d orbitals
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.9FC8BFA09CC9
  when_answer_equals:
  - c
- id: MC.A.CF03B7DEDDC5
  when_answer_equals:
  - b
- id: MC.A.004C9B22E5CE
  when_answer_equals:
  - a
solution_steps:
- en: Ligands split the d orbitals into groups of different energy.
- en: Electrons absorb visible light to move between these levels, and the colour seen is the complementary colour.
- en: The correct option is d.
tier: C
