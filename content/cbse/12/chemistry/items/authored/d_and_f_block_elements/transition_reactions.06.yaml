stem:
  en: What is the equivalent mass of KMnO4 when it acts as an oxidant in acidic solution?
hints:
- level: 1
  en: Count the electrons gained per permanganate ion when it is reduced to manganese(II) in acid.
- level: 2
  en: Equivalent mass depends on the number of electrons exchanged, not on the oxidation state.
- level: 3
  en: Write the reduction half reaction to find the electrons gained.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
