  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Molar mass divided by five
- id: b
  en: Molar mass divided by one
- id: c
  en: Molar mass divided by seven
- id: d
  en: Molar mass divided by three
answer:
  sympy: a
