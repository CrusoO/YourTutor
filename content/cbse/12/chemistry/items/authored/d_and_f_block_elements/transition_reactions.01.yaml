stem:
  en: What colour change occurs when acidified dichromate is reduced by a reducing agent?
hints:
- level: 1
  en: Chromium in dichromate starts at a high oxidation state and is reduced to a lower one.
- level: 2
  en: Consider the colour of the chromium(III) ion formed after reduction.
- level: 3
  en: Compare the colours of the chromium species before and after reduction.
