difficulty: 0.6
pool: practice
role: apply
stem:
  en: Why do transition metals form interstitial compounds with small atoms such as hydrogen, carbon and nitrogen?
hints:
- level: 1
  en: Think about the size of the small atoms compared with the spaces between metal atoms.
- level: 2
  en: Consider whether the small atoms take the place of metal atoms or sit between them.
- level: 3
  en: Compare the structure of these compounds with that of simple salts.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Small atoms fit into the gaps of the metal lattice
- id: b
  en: Metals have excess electrons that bond with the small atoms
- id: c
  en: The small atoms replace the metal atoms in the lattice
- id: d
  en: The compounds are simple ionic salts
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.FE5764B893F3
  when_answer_equals:
  - b
- id: MC.A.10AC0C73E661
  when_answer_equals:
