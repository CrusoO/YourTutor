id: A.12.chemistry.d_and_f_block_elements.transition_reactions.05
skill_ids:
- SK.A.12.chemistry.transition_reactions
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Why does the reaction between acidified permanganate and oxalic acid speed up after the first few drops?
hints:
- level: 1
  en: Consider which product of the reaction could speed up the same reaction.
- level: 2
  en: Think about whether a species formed during the reaction can increase its own rate.
- level: 3
  en: Compare the rate at the start with the rate after some product has formed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Permanganate becomes a stronger oxidant on dilution
- id: b
  en: The Mn2+ formed acts as an autocatalyst
- id: c
  en: The reaction releases heat, so it speeds up
- id: d
  en: Oxalic acid dissolves the manganese in the flask
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.4662938ABABC
  when_answer_equals:
  - d
- id: MC.A.B2B82C83EC61
  when_answer_equals:
  - c
- id: MC.A.31715E385205
  when_answer_equals:
  - a
solution_steps:
- en: Mn2+ is one of the products, and it catalyses the same reaction.
- en: Once a little is formed, the rate rises sharply, which is autocatalysis.
- en: The correct option is b.
tier: C
