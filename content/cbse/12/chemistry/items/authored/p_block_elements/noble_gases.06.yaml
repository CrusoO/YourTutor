options:
- id: a
  en: Xenon is large with a low ionisation energy, so its valence electrons are easier to involve in bonding
- id: b
  en: Fluorine is inert towards xenon
- id: c
  en: Xenon has a negative electron affinity
- id: d
  en: Xenon is always a liquid at room temperature
