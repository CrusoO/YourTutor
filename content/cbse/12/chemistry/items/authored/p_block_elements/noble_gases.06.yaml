stem:
  en: Why can xenon form fluorides when the lighter noble gases do not?
hints:
- level: 1
  en: Compare the ionisation energy of xenon with that of the lighter noble gases.
- level: 2
  en: Think about how the size of the atom affects how far its outer electrons sit from the nucleus.
- level: 3
  en: Consider which element is needed to pull electrons from xenon.
