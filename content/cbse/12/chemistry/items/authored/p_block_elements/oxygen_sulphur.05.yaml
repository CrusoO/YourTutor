stem:
  en: Why does hot concentrated sulphuric acid act as an oxidising agent towards copper?
hints:
- level: 1
  en: Track the oxidation state of sulphur in the acid and in the gas formed.
- level: 2
  en: Decide which element is oxidised and which is reduced in the reaction with copper.
- level: 3
  en: Consider which species gains electrons.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Copper is reduced to copper(II) by the acid
- id: b
  en: Sulphur is reduced from +6 to a lower oxidation state
- id: c
  en: Hydrogen ions are reduced to hydrogen gas by copper
- id: d
  en: Oxygen in water is reduced by the acid
answer:
  sympy: b
  accept: []
