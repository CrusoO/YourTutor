difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does chlorine act as a bleaching agent when it is passed through water?
hints:
- level: 1
  en: Look at what the reaction with water produces that can act as an oxidant.
- level: 2
  en: Think about which product of the reaction breaks down and releases an active species.
- level: 3
  en: Consider whether the coloured compound is oxidised or reduced.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It releases nascent oxygen that oxidises the coloured compounds
- id: b
  en: It forms chlorine dioxide that removes all colour
- id: c
  en: It dissolves the pigment by forming a salt
- id: d
  en: It reduces the dye using hydrogen released from water
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.60FE47C99C3E
  when_answer_equals:
  - b
- id: MC.A.F7C2E015662F
  when_answer_equals:
