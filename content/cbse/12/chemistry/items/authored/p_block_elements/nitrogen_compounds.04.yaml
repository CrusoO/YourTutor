id: A.12.chemistry.p_block_elements.nitrogen_compounds.04
skill_ids:
- SK.A.12.chemistry.nitrogen_compounds
difficulty: 0.6
pool: practice
role: explain
stem:
  en: The brown ring test for nitrate ions gives its colour because of which species?
hints:
- level: 1
  en: The test uses iron(II) sulphate and a strong acid that releases nitric oxide.
- level: 2
  en: Think about which species binds to the iron to give the colour at the boundary.
- level: 3
  en: Consider which species is formed from the nitrate in the test.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Copper(II) nitrate
- id: b
  en: An iron(II) nitrosyl complex
- id: c
  en: Sulphur dioxide
- id: d
  en: Iron(III) chloride
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.D8E724747132
  when_answer_equals:
  - a
- id: MC.A.5A0848B00A7F
  when_answer_equals:
  - d
- id: MC.A.E033C52F4E5A
  when_answer_equals:
  - c
solution_steps:
- en: Nitrate is reduced to nitric oxide, which binds to iron(II) in the test solution and forms a brown nitrosyl complex at the boundary.
- en: The correct option is b.
tier: C
