stem:
  en: Why is hypophosphorous acid, H3PO2, a monobasic acid?
hints:
- level: 1
  en: Count the hydrogens attached to oxygen rather than to phosphorus.
- level: 2
  en: Draw the structure to see which hydrogens sit on phosphorus.
- level: 3
