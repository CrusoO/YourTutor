stem:
  en: What is the oxidation state of sulphur in Caro's acid, H2SO5?
hints:
- level: 1
  en: The two oxygen atoms in the peroxo group carry an oxidation state of minus one rather than minus two.
- level: 2
  en: Assign the usual values to hydrogen and to the ordinary oxygen atoms first.
- level: 3
  en: Use the rule that the oxidation states sum to zero in a neutral molecule.
