difficulty: 0.9
pool: practice
role: explain
stem:
  en: Why are noble gases largely unreactive?
hints:
- level: 1
  en: Think about the outer electron configuration of these elements.
- level: 2
  en: Consider how hard it is to remove an electron from these atoms.
- level: 3
  en: Compare the electron arrangement of noble gases with that of the halogens.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They contain no electrons
- id: b
  en: They are all gases at room temperature
- id: c
  en: Their nuclei contain no protons
- id: d
  en: They have complete valence shells and high ionisation energies
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.EEBD1ABBD908
  when_answer_equals:
  - b
- id: MC.A.7DDB9E1E073D
  when_answer_equals:
