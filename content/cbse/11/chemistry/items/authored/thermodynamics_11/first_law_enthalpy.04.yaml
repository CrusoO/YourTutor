stem:
  en: For a reaction with an increase of 1 mol in gaseous moles, delta U is 20 kJ at 300 K. What is delta H in kJ? Use R = 8.314 J/mol/K.
hints:
- level: 1
  en: Multiply the change in gas moles by R and by the temperature.
- level: 2
  en: Add that product to the internal energy change.
- level: 3
  en: Keep units consistent by converting joules to kilojoules at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '22.5'
  accept: []
solution_steps:
- en: delta H equals delta U plus delta n times RT, which is 20 kJ plus 1 times 8.314 times 300 J, about 2.49 kJ, giving 22.5 kJ.
- en: The unit of the answer is kJ.
- en: Answer = 22.5
tier: C
