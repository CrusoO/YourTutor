difficulty: 0.9
pool: practice
role: apply
stem:
  en: A reaction has delta H = 120 kJ and delta S = 0.4 kJ/K. At what temperature in kelvin does delta G equal zero?
hints:
- level: 1
  en: Set the Gibbs energy change to zero and solve for the temperature.
- level: 2
  en: Rearrange the relation so that temperature is the subject.
- level: 3
  en: Keep the units of enthalpy and entropy consistent before dividing.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '300'
  accept: []
solution_steps:
- en: Setting delta G to zero gives T equal to delta H divided by delta S, which is 120 divided by 0.4, equal to 300 K.
- en: The unit of the answer is K.
- en: Answer = 300
tier: C
