stem:
  en: How many kilojoules of heat are needed to raise the temperature of 50 g of water by 10 K? The specific heat capacity of water is 4.18 J/g/K.
hints:
- level: 1
  en: Multiply the mass, the specific heat capacity and the temperature change.
- level: 2
  en: Be careful to use the same units for the mass and the specific heat.
- level: 3
  en: Convert the final value from joules into kilojoules.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2.09'
  accept: []
solution_steps:
- en: Heat equals mass times specific heat times temperature change, which is 50 times 4.18 times 10 equal to 2090 J, or 2.09 kJ.
- en: The unit of the answer is kJ.
- en: Answer = 2.09
tier: C
