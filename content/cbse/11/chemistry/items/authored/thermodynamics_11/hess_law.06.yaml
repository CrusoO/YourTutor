stem:
  en: Using standard enthalpies of formation of CO2 = -394, H2O(l) = -286 and CH4 = -75 kJ/mol, what is delta H in kJ/mol for CH4 + 2 O2 -> CO2 + 2 H2O(l)?
hints:
- level: 1
  en: Subtract the total for the reactants from the total for the products.
- level: 2
  en: Multiply each enthalpy of formation by its coefficient before adding.
- level: 3
  en: The element oxygen has a formation value of zero.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-891'
  accept: []
solution_steps:
- en: The sum of product values is -394 plus 2 times -286, or -966 kJ/mol, and the reactant sum is -75 kJ/mol, so delta H is -966 minus -75, which equals -891 kJ/mol.
- en: The unit of the answer is kJ/mol.
- en: Answer = -891
tier: C
