stem:
  en: In the first law written as delta U = q + w, what sign is taken for work done on the system?
hints:
- level: 1
  en: Think about whether the energy supplied to the system raises its internal energy.
- level: 2
  en: Consider the sign used for energy that enters the system.
- level: 3
  en: Look for the option that matches energy entering the system.
