role: procedure
stem:
  en: A gas expands against a constant external pressure of 0.5 atm from 2 L to 4 L. Taking 1 atm L as 101 J, what is the work done by the gas in joules? Report it as a positive number.
hints:
- level: 1
  en: Multiply the constant external pressure by the change in volume.
- level: 2
  en: Work done by the gas during expansion equals pressure times the volume change.
- level: 3
  en: Convert the result using the conversion factor given in the question.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '101'
  accept: []
solution_steps:
- en: Work against a constant pressure is P times the volume change, which is 0.5 atm times 2 L, or 1 atm L, equal to 101 J.
- en: The unit of the answer is J.
- en: Answer = 101
tier: C
