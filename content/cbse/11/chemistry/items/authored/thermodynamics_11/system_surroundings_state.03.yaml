stem:
  en: Which thermodynamic variable is an extensive property?
hints:
- level: 1
  en: An extensive property changes in proportion to the amount of matter in the system.
- level: 2
  en: Check whether doubling the sample would double the quantity.
- level: 3
  en: Intensive properties stay the same when the sample is divided.
