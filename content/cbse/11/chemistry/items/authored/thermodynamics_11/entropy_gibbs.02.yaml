stem:
  en: For a reaction with delta H = 100 kJ and T delta S = 40 kJ, what is delta G in kJ?
hints:
- level: 1
  en: Subtract the product of temperature and entropy change from the enthalpy change.
- level: 2
  en: Use the standard relation between Gibbs energy, enthalpy and entropy.
- level: 3
  en: Keep the sign of each term as given in the question.
