answer:
  sympy: '-75'
  accept: []
solution_steps:
- en: Adding the first equation to two times the second and then reversing the methane combustion gives delta H equal to -394 plus 2 times -286 minus -891, which is -75 kJ/mol.
- en: The unit of the answer is kJ/mol.
- en: Answer = -75
tier: C
