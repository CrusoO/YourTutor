id: A.11.chemistry.thermodynamics_11.first_law_enthalpy.01
skill_ids:
- SK.A.11.chemistry.first_law_enthalpy
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A system absorbs 100 J of heat and does 40 J of work on the surroundings. What is the change in its internal energy in joules?
hints:
- level: 1
  en: Use the first law with heat added as positive and work done by the system subtracted.
- level: 2
  en: Identify which quantity is the heat and which is the work before substituting.
- level: 3
  en: Compute the difference between the heat and the work.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '60'
  accept: []
solution_steps:
- en: Using delta U equal to q minus w, with q = +100 J and work done by the system w = 40 J, gives a change of 60 J.
- en: The unit of the answer is J.
- en: Answer = 60
tier: C
