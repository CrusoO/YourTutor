difficulty: 0.6
pool: practice
role: apply
stem:
  en: If A -> C has delta H1 and C -> B has delta H2, what is delta H for the reaction 2A -> B?
hints:
- level: 1
  en: Multiply each step by the factor needed to match the coefficients of the target reaction.
- level: 2
  en: Add the adjusted steps together to get the overall reaction.
- level: 3
  en: Make sure no intermediate species is left over at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 2 delta H1 + delta H2
- id: b
  en: delta H2 - delta H1
- id: c
  en: 2 delta H1 - delta H2
- id: d
  en: delta H1 + delta H2
answer:
  sympy: a
  accept: []
misconception_rules:
