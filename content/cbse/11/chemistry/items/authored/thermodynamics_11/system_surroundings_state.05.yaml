stem:
  en: Which process is isothermal?
hints:
- level: 1
  en: Constant temperature needs thermal contact with something at that temperature.
- level: 2
  en: Consider whether the gas can exchange heat with a large reservoir during the change.
- level: 3
  en: Look for the process that is slow and in thermal contact with its surroundings.
