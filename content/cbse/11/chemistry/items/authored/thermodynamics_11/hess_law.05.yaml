stem:
  en: 'Estimate delta H in kJ/mol for H2 + Cl2 -> 2 HCl using bond enthalpies: H-H 436, Cl-Cl 242 and H-Cl 431 kJ/mol.'
hints:
- level: 1
  en: Add the energies needed to break the bonds in the reactants.
- level: 2
  en: Subtract the energy released when the bonds in the products form.
- level: 3
  en: Check that you counted every bond with its correct multiplier.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-184'
  accept: []
solution_steps:
- en: Bonds broken total 436 plus 242, or 678 kJ/mol, while bonds formed total 2 times 431, or 862 kJ/mol, so delta H is 678 minus 862, which is -184 kJ/mol.
- en: The unit of the answer is kJ/mol.
- en: Answer = -184
tier: C
