stem:
  en: Why does aluminium chloride exist as a dimer, Al2Cl6, in the vapour phase?
hints:
- level: 1
  en: Aluminium has an incomplete octet, so think about how neighbouring atoms can share lone pairs with it.
- level: 2
  en: Consider which atoms can act as bridges between two metal centres.
- level: 3
  en: Look for the option describing a bridging arrangement that completes the octet.
