stem:
  en: 'What mass in grams of aluminium is needed to produce 102 g of aluminium oxide? 4 Al + 3 O2 -> 2 Al2O3. Molar masses: Al 27 g/mol, Al2O3 102 g/mol.'
hints:
- level: 1
  en: Convert the mass of the oxide into moles using its molar mass.
- level: 2
  en: Use the mole ratio of aluminium to aluminium oxide from the balanced equation.
- level: 3
  en: Convert the moles of aluminium into a mass.
