id: A.11.chemistry.p_block_elements_group_13_14.group14_carbon_family.06
skill_ids:
- SK.A.11.chemistry.group14_carbon_family
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Why does silicon not form pi-bonded networks as readily as carbon does?
hints:
- level: 1
  en: Compare the size of the valence orbitals of silicon and carbon and how well they overlap.
- level: 2
  en: Think about how far the outer orbitals extend from the nucleus.
- level: 3
  en: Consider which overlap between p orbitals is needed for a pi bond.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: its larger atoms overlap poorly in side-on pi bonds
- id: b
  en: silicon has fewer valence electrons than carbon
- id: c
  en: silicon forms only triple bonds
- id: d
  en: silicon atoms always form ionic bonds
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.21D26E95480C
  when_answer_equals:
  - b
- id: MC.A.7EE925EF53F7
  when_answer_equals:
  - d
- id: MC.A.CF60CB980158
  when_answer_equals:
  - c
solution_steps:
- en: The 3p orbitals of silicon are more diffuse than the 2p orbitals of carbon, so side-on overlap for pi bonds is weak, and silicon prefers single bonds.
- en: The correct option is a.
tier: C
diagram_note: Two side-by-side p orbitals on adjacent atoms, drawn once for a compact carbon pair with a large sideways overlap and once for a larger silicon pair with a smaller sideways overlap.
