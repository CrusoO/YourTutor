solution_steps:
- en: Each carbon in a graphite layer forms three sigma bonds in a plane using sp2 orbitals, and its remaining p electron delocalises over the layer.
- en: The correct option is a.
tier: C
diagram_note: A flat hexagonal honeycomb layer of carbon atoms, with the layers stacked above one another and a wider gap drawn between the layers.
