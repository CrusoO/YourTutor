difficulty: 0.6
pool: practice
role: procedure
stem:
  en: In graphite, what is the hybridisation of each carbon atom in a layer and how many delocalised electrons does each carbon contribute?
hints:
- level: 1
  en: Count the sigma bonds in the plane and match that count to a hybrid set.
- level: 2
  en: Think about the leftover p orbital that lies perpendicular to the layer.
- level: 3
  en: Consider how many electrons are not used in sigma bonding.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: sp2 hybridised with one delocalised electron
- id: b
  en: sp3 hybridised with no delocalised electron
- id: c
  en: sp2 hybridised with no delocalised electrons
- id: d
  en: sp hybridised with two delocalised electrons
answer:
  sympy: a
  accept: []
