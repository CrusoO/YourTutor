id: A.11.chemistry.organic_chemistry_basic_principles.isomerism.06
skill_ids:
- SK.A.11.chemistry.isomerism
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which statement about the cis and trans forms of 1,2-dichloroethene is correct?
hints:
- level: 1
  en: Consider whether the bond dipoles add up or cancel in each arrangement.
- level: 2
  en: Compare the polarity of the cis and trans arrangements.
- level: 3
  en: Think about whether the double bond allows the two forms to interconvert easily.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the trans form has the larger dipole moment
- id: b
  en: they have identical dipole moments
- id: c
  en: they have different boiling points because their dipole moments differ
- id: d
  en: they interconvert freely at room temperature
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.0776BCFCF4E3
  when_answer_equals:
  - b
- id: MC.A.AE99A48BE081
  when_answer_equals:
  - a
- id: MC.A.8C61DD2F2CD8
  when_answer_equals:
  - d
solution_steps:
- en: In the cis form the bond dipoles add to a net dipole, while in the trans form they cancel, so the two isomers have different polarities and boiling points.
- en: The correct option is c.
tier: C
diagram_note: Two planar drawings of 1,2-dichloroethene, one with the two chlorine atoms on the same side of the double bond and one with them on opposite sides.
