options:
- id: a
  en: distance moved by the spot divided by distance moved by the solvent front
- id: b
  en: solvent speed divided by the time taken
- id: c
  en: distance moved by the spot plus distance moved by the solvent front
- id: d
  en: distance moved by the solvent front divided by distance moved by the spot
