stem:
  en: In chromatography, how is the Rf value of a spot defined?
hints:
- level: 1
  en: Both distances are measured from the same starting line.
- level: 2
  en: The spot cannot move farther than the solvent front, so the ratio stays below a limit.
- level: 3
  en: Think about which distance goes on top in the ratio.
prediction_prompt:
