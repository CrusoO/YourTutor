solution_steps:
- en: The first step, in which the leaving group departs to form a carbocation, has the highest activation energy and so controls the rate.
- en: The correct option is a.
tier: C
diagram_note: Two-step energy profile for an SN1 reaction with a higher first hump leading to a carbocation intermediate, followed by a lower second hump.
