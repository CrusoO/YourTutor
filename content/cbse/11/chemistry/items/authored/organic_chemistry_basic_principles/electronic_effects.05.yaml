id: A.11.chemistry.organic_chemistry_basic_principles.electronic_effects.05
skill_ids:
- SK.A.11.chemistry.electronic_effects
difficulty: 0.9
pool: practice
role: apply
stem:
  en: In phenol, what does the -OH group do to the electron density of the ring through resonance?
hints:
- level: 1
  en: Look at the lone pair on oxygen and where it can delocalise in the ring.
- level: 2
  en: Draw the resonance structures and see which carbons carry the extra charge.
- level: 3
  en: Consider which positions the donated pair can reach through the pi system.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it increases electron density only at the meta positions
- id: b
  en: it withdraws electrons from the ring
- id: c
  en: it decreases electron density at the ortho and para positions
- id: d
  en: it increases electron density at the ortho and para positions
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.21C7427BD647
  when_answer_equals:
  - c
- id: MC.A.35725D987BF1
  when_answer_equals:
  - a
- id: MC.A.19A085F6EE56
  when_answer_equals:
  - b
solution_steps:
- en: A lone pair on oxygen delocalises into the ring, so the electron density at the ortho and para carbons rises, which activates those positions.
- en: The correct option is d.
tier: C
diagram_note: A benzene ring with an OH group on one carbon, and curved arrows from the oxygen lone pair into the ring showing resonance to the ortho and para carbons.
