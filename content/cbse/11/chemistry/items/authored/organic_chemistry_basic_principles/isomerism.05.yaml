stem:
  en: Which compound shows optical isomerism?
hints:
- level: 1
  en: Find a carbon with four different groups attached, which is needed for mirror-image forms.
- level: 2
  en: Check whether any carbon in the compound has two identical groups.
- level: 3
  en: Look at which carbon of the chain carries the bromine atom.
