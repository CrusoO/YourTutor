id: A.11.chemistry.organic_chemistry_basic_principles.isomerism.03
skill_ids:
- SK.A.11.chemistry.isomerism
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which pair of compounds shows cis and trans isomerism?
hints:
- level: 1
  en: Both isomers have the same connectivity, so consider the spatial orientation of the groups on the double bond.
- level: 2
  en: Check whether each carbon of the double bond has two different groups.
- level: 3
  en: Look for the pair that differs only in how the groups are placed around the double bond.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: butane and 2-methylpropane
- id: b
  en: but-1-ene and but-2-ene
- id: c
  en: propene and cyclopropane
- id: d
  en: cis-but-2-ene and trans-but-2-ene
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.2BE3DE622CE6
  when_answer_equals:
  - b
- id: MC.A.6C030CB206AA
  when_answer_equals:
  - a
- id: MC.A.35F3666B4D1E
  when_answer_equals:
  - c
solution_steps:
- en: In but-2-ene the two methyl groups can lie on the same side of the double bond (cis) or on opposite sides (trans), giving two geometrical isomers.
- en: The correct option is d.
tier: C
diagram_note: Two drawings of the central double bond of but-2-ene, one with both methyl groups on the same side of the bond and one with them on opposite sides.
