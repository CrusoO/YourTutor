difficulty: 0.9
pool: practice
role: transfer
stem:
  en: In the electrophilic addition of H+ to an alkene, which bond is broken first?
hints:
- level: 1
  en: The loosely held electron pair of the double bond reacts first.
- level: 2
  en: Think about which bond is the most accessible to an electrophile.
- level: 3
  en: Look for the bond that supplies the electrons to the proton.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the sigma C-H bond
- id: b
  en: the pi bond
- id: c
  en: the C-C sigma bond
- id: d
  en: the H-H bond
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.7233C026A33A
  when_answer_equals:
  - a
- id: MC.A.A4707CA33680
