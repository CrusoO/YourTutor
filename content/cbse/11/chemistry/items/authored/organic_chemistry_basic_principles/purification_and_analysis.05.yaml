stem:
  en: In the Kjeldahl method, 0.2 g of an organic compound is digested and the ammonia formed is absorbed by 30 mL of 0.1 mol/L sulphuric acid. Using N = 14 g/mol, what is the percentage of nitrogen in the compound?
hints:
- level: 1
  en: Find the moles of sulphuric acid from its volume and concentration.
- level: 2
  en: Use the ratio of ammonia to sulphuric acid in the neutralisation step.
- level: 3
  en: Convert the mass of nitrogen into a percentage of the sample mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '42'
  accept: []
solution_steps:
- en: 30 mL of 0.1 M acid contains 0.003 mol of H2SO4, which neutralises 0.006 mol of NH3, equal to 0.084 g of nitrogen, or 42 percent of 0.2 g.
- en: The unit of the answer is %.
- en: Answer = 42
tier: C
