stem:
  en: Which effect describes the electron withdrawal that travels through sigma bonds?
hints:
- level: 1
  en: The effect travels through sigma bonds and weakens with each bond it crosses.
- level: 2
  en: Think about which effect works without any movement of pi electrons.
- level: 3
  en: Look for the effect named after the polarisation of single bonds.
