stem:
  en: Which method separates a mixture of two miscible liquids whose boiling points differ by a large margin?
hints:
- level: 1
  en: Heat the mixture so that the component with the lower boiling point vaporises first.
- level: 2
  en: Consider the condensation and collection of the vapour as the final step.
- level: 3
  en: Look for the method that separates by boiling point.
