id: A.11.chemistry.organic_chemistry_basic_principles.electronic_effects.06
skill_ids:
- SK.A.11.chemistry.electronic_effects
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which factor increases hyperconjugation in a carbocation?
hints:
- level: 1
  en: Think about which sigma bonds next to the positive centre can donate electron density.
- level: 2
  en: Consider how the number of donor bonds changes the stabilisation.
- level: 3
  en: Look for the option that increases the number of donor sigma bonds.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: a triple bond next to the positive carbon
- id: b
  en: a heavier halogen attached to the positive carbon
- id: c
  en: more C-H bonds adjacent to the positive carbon
- id: d
  en: fewer C-H bonds adjacent to the positive carbon
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.26A5DDF6331E
  when_answer_equals:
  - d
- id: MC.A.215C82AC5C45
  when_answer_equals:
  - b
- id: MC.A.013ECF77D8A7
  when_answer_equals:
  - a
solution_steps:
- en: Hyperconjugation donates electron density from adjacent C-H sigma bonds into the empty orbital of the carbocation, so more such bonds give more stabilisation.
- en: The correct option is c.
tier: C
diagram_note: A carbocation drawn with the positive carbon at the centre and three adjacent carbon atoms, each carrying hydrogens shown with dotted arrows toward the positive carbon.
