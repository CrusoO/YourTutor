stem:
  en: A 20 g sample of an organic compound contains 12 g of carbon. What is the percentage of carbon by mass?
hints:
- level: 1
  en: Divide the mass of the element by the mass of the sample.
- level: 2
  en: Multiply the fraction by 100 to convert it to a percentage.
- level: 3
  en: Check that the result is less than the whole sample.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
