stem:
  en: In the Carius method, 0.5 g of an organic compound gives 0.7 g of silver bromide. Using Br = 80 and AgBr = 188 in g/mol, what is the percentage of bromine in the compound?
hints:
- level: 1
  en: Multiply the mass of the silver bromide by the bromine fraction of silver bromide.
- level: 2
  en: Find the fraction of bromine in silver bromide from the molar masses.
- level: 3
  en: Divide by the mass of the sample and convert to a percentage.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '59.6'
  accept: []
solution_steps:
- en: Each gram of AgBr contains 80 divided by 188 grams of bromine, so 0.7 g of AgBr holds 0.298 g of bromine, which is 59.6 percent of the 0.5 g sample.
- en: The unit of the answer is %.
- en: Answer = 59.6
tier: C
