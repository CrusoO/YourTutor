stem:
  en: Why is ice less dense than liquid water?
hints:
- level: 1
  en: Think about the geometry that the hydrogen bonds force on the molecules in the solid.
- level: 2
  en: Consider whether the molecules are closer together or farther apart in the solid.
- level: 3
  en: Compare the arrangement in the solid with the more disordered arrangement in the liquid.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: ice contains more ions than liquid water
- id: b
  en: ice has no hydrogen bonds at all
- id: c
  en: its hydrogen bonds hold the molecules in an open lattice with more empty space
- id: d
  en: ice molecules are packed more closely than liquid molecules
answer:
  sympy: c
  accept: []
