stem:
  en: What is the electron-pair geometry of a central atom with four bonding pairs and no lone pairs?
hints:
- level: 1
  en: Four electron groups around the central atom spread as far apart as possible.
- level: 2
  en: Think about the arrangement that puts the groups at the corners of a three-dimensional solid.
- level: 3
  en: The geometry does not change when all four groups are bonding pairs.
