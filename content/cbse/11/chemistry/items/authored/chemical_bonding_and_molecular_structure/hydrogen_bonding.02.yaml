stem:
  en: Why does water have a much higher boiling point than hydrogen sulphide?
hints:
- level: 1
  en: Compare how strongly the molecules attract each other through the hydrogen atoms.
- level: 2
  en: Think about the forces between molecules rather than the bonds within them.
- level: 3
  en: Consider which of the two compounds has the stronger intermolecular attraction.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: sulphur atoms are more electronegative than oxygen
- id: b
  en: water has more covalent bonds in each molecule
- id: c
  en: water forms stronger hydrogen bonds between its molecules
- id: d
  en: water has a larger molar mass
answer:
  sympy: c
  accept: []
