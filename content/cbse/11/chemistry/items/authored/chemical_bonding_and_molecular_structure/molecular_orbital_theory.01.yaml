stem:
  en: A hydrogen molecule has 2 electrons in bonding molecular orbitals and none in antibonding orbitals. What is its bond order?
hints:
- level: 1
  en: Bond order is half the difference between bonding and antibonding electrons.
- level: 2
  en: Subtract the antibonding count from the bonding count first.
- level: 3
  en: Divide the result by a factor that converts pairs into bonds.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1'
  accept: []
solution_steps:
- en: Bond order is half the difference between bonding and antibonding electrons, which is (2 minus 0) divided by 2, giving 1.
- en: Answer = 1
tier: C
