difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which species has a formal charge of +1 on its nitrogen atom in the best Lewis structure?
hints:
- level: 1
  en: Compare the bonding electrons shared by the atom with the valence electrons the atom owns.
- level: 2
  en: Count the bonds on the nitrogen and the lone pairs it keeps.
- level: 3
  en: The formal charge is the valence count minus the lone electrons minus half the bonding electrons.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: NO2
- id: b
  en: NH3
- id: c
  en: N2H4
- id: d
  en: NH4+
answer:
  sympy: d
  accept: []
misconception_rules:
