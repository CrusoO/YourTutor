solution_steps:
- en: In NH4+ nitrogen has five valence electrons, no lone pairs and four bonds, giving a formal charge of 5 minus 0 minus 4, which equals +1.
- en: The correct option is d.
tier: C
diagram_note: Lewis dot diagram of the ammonium ion with a nitrogen atom at the centre, four hydrogen atoms bonded to it, and a bracket around the structure with a plus sign at the top right.
