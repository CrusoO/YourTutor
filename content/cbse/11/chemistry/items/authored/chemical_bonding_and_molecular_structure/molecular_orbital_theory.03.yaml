stem:
  en: What is the bond order of the O2 molecule according to molecular orbital theory?
hints:
- level: 1
  en: Count the total electrons and fill the molecular orbitals in energy order.
- level: 2
  en: Separate the filled orbitals into bonding and antibonding groups.
- level: 3
  en: Take half of the difference between the two counts.
prediction_prompt:
