stem:
  en: According to Fajans' rules, which chloride shows the most covalent character?
hints:
- level: 1
  en: Consider which cation has the highest charge and the smallest size.
- level: 2
  en: High charge and small size both increase the polarising power of a cation.
- level: 3
  en: Polarisation of the anion increases the sharing of electrons.
