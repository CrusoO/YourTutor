stem:
  en: A white crystalline compound has a high melting point, dissolves well in water and conducts electricity when melted but not when solid. Which bond type is most likely?
hints:
- level: 1
  en: Consider what carries the current when the compound is melted.
- level: 2
  en: Think about what breaks apart when the solid dissolves in water.
- level: 3
  en: Look for the bond type whose charged particles can move when the solid is liquid.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
