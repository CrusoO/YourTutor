stem:
  en: Which molecular orbital is formed by head-on overlap of two atomic orbitals?
hints:
- level: 1
  en: Think about the axis that joins the two nuclei.
- level: 2
  en: Orbitals that point straight at each other overlap along that axis.
- level: 3
  en: The overlap is symmetric around the line joining the nuclei.
