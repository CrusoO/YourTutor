stem:
  en: A solution contains 10 g of sodium hydroxide (molar mass 40 g/mol) dissolved in 500 g of water. What is its molality in mol/kg?
hints:
- level: 1
  en: Convert the mass of solute into moles using its molar mass.
- level: 2
  en: Convert the mass of the solvent from grams into kilograms.
- level: 3
  en: Divide the amount of solute by the mass of solvent in kilograms.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.5'
  accept: []
solution_steps:
- en: 10 g is 0.25 mol and 500 g is 0.5 kg, so the molality is 0.25 divided by 0.5, which is 0.5 mol/kg.
- en: The unit of the answer is mol/kg.
- en: Answer = 0.5
tier: C
