stem:
  en: Which quantity contains the same number of entities as one mole of any substance?
hints:
- level: 1
  en: Consider which unit counts particles rather than weighing them.
- level: 2
  en: The same count applies to atoms, molecules or ions alike.
- level: 3
  en: Think about a fixed count of entities that does not depend on the substance.
prediction_prompt:
