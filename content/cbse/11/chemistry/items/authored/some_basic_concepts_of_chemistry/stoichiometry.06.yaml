stem:
  en: 46 g of sodium (molar mass 23 g/mol) reacts with 35.5 g of chlorine gas (molar mass 71 g/mol) by 2 Na + Cl2 -> 2 NaCl. What mass in grams of sodium chloride (molar mass 58.5 g/mol) forms?
hints:
- level: 1
  en: Convert both masses into moles before comparing the reactants.
- level: 2
  en: Work out how much of each reactant the equation needs for the amount of the other.
- level: 3
  en: Base the product amount on the reactant that runs out.
