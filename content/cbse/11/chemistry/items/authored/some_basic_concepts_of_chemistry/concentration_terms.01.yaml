difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is the molarity of a solution made by dissolving 0.5 mol of sodium hydroxide to make 250 mL of solution?
hints:
- level: 1
  en: Molarity is the amount of solute divided by the volume of solution.
- level: 2
  en: Convert the volume into litres before dividing.
- level: 3
  en: Keep track of the units to confirm the answer is in mol per litre.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: 250 mL is 0.25 L, so 0.5 mol divided by 0.25 L gives 2 mol/L.
- en: The unit of the answer is mol/L.
- en: Answer = 2
tier: C
