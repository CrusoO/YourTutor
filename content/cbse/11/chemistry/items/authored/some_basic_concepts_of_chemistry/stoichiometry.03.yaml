stem:
  en: 'Magnesium reacts with hydrochloric acid: Mg + 2 HCl -> MgCl2 + H2. How many moles of hydrogen gas form from 0.3 mol of magnesium?'
hints:
- level: 1
  en: Compare the coefficients of magnesium and hydrogen in the balanced equation.
- level: 2
  en: Only the two species named in the question matter for the ratio.
- level: 3
  en: Multiply the given amount by the ratio you found.
