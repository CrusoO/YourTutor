answer:
  sympy: '0.3'
  accept: []
solution_steps:
- en: Magnesium and hydrogen are formed in a one to one mole ratio, so 0.3 mol of magnesium gives 0.3 mol of hydrogen.
- en: The unit of the answer is mol.
- en: Answer = 0.3
