stem:
  en: What is the empirical formula of a compound whose molecular formula is C6H12O6?
hints:
- level: 1
  en: Find the largest number that divides every subscript exactly.
- level: 2
  en: Divide each subscript by that common factor.
- level: 3
  en: The empirical formula shows the simplest whole-number ratio of atoms.
