difficulty: 0.2
pool: practice
role: recall
stem:
  en: How many moles are present in 36 g of water? The molar mass of water is 18 g/mol.
hints:
- level: 1
  en: Recall how mass, molar mass and number of moles are related.
- level: 2
  en: Divide the mass of the sample by the molar mass of the substance.
- level: 3
  en: Check that the units cancel to leave moles.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: Moles equal mass divided by molar mass, so 36 g divided by 18 g/mol gives 2 mol.
- en: The unit of the answer is mol.
- en: Answer = 2
tier: C
