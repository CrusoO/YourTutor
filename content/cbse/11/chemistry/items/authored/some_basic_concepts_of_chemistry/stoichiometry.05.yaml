stem:
  en: 'Aluminium burns: 4 Al + 3 O2 -> 2 Al2O3. What mass in grams of aluminium oxide forms from 54 g of aluminium? The molar masses are 27 g/mol for Al and 102 g/mol for Al2O3.'
hints:
- level: 1
  en: Convert the mass of aluminium into moles first.
- level: 2
  en: Use the mole ratio of aluminium oxide to aluminium from the balanced equation.
- level: 3
  en: Convert the moles of product back into a mass at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
