stem:
  en: Each sample is one mole of a substance. Which sample contains the greatest total number of atoms?
hints:
- level: 1
  en: Count the atoms in each molecular formula rather than the molecules.
- level: 2
  en: Multiply the number of atoms per molecule by one mole for each sample.
- level: 3
  en: Compare the totals for all the samples before choosing.
