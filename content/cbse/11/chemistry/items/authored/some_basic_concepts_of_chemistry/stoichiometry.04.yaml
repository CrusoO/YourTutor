stem:
  en: In N2 + 3 H2 -> 2 NH3, 6 mol of hydrogen reacts with excess nitrogen. How many moles of ammonia can form?
hints:
- level: 1
  en: Find the ratio of ammonia to hydrogen from the coefficients.
- level: 2
  en: Hydrogen is the species that limits the reaction here, so use its amount.
- level: 3
  en: Multiply the hydrogen amount by the ratio and check the answer against the equation.
