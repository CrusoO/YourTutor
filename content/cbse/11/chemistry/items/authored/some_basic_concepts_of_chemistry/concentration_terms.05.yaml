stem:
  en: How many grams of potassium chloride (molar mass 74.5 g/mol) are needed to prepare 0.2 L of a 0.5 M solution?
hints:
- level: 1
  en: Find the moles of solute from the molarity and the volume first.
- level: 2
  en: Convert that amount into mass using the molar mass.
- level: 3
  en: Keep the volume in litres when you multiply.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '7.45'
  accept: []
solution_steps:
- en: The solution needs 0.5 mol/L times 0.2 L, which is 0.1 mol, and 0.1 mol times 74.5 g/mol gives 7.45 g.
- en: The unit of the answer is g.
- en: Answer = 7.45
