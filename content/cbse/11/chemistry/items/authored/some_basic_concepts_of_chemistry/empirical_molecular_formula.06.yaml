stem:
  en: A hydrocarbon has the empirical formula CH and a molar mass of 78 g/mol. How many carbon atoms are in one molecule of this hydrocarbon? The atomic masses are C = 12 and H = 1.
hints:
- level: 1
  en: Work out the mass of one empirical unit before comparing it with the molar mass.
- level: 2
  en: Find how many empirical units fit into the molar mass.
- level: 3
  en: Each empirical unit contributes one carbon atom to the molecule.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
