  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: The empirical unit CH has a mass of 13 g/mol, and 78 divided by 13 is 6, so each molecule has 6 carbon atoms.
- en: Answer = 6
