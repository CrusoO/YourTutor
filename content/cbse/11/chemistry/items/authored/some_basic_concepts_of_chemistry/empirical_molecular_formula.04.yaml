difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A compound has the empirical formula CH2 and a molar mass of 42 g/mol. What is the value of n, the number of CH2 units in its molecular formula?
hints:
- level: 1
  en: Find the mass of one empirical unit first.
- level: 2
  en: Divide the molar mass of the compound by the mass of one empirical unit.
- level: 3
  en: The result must be a whole number.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: The empirical formula mass of CH2 is 14 g/mol, and 42 divided by 14 gives n equal to 3.
- en: Answer = 3
tier: C
