role: explain
stem:
  en: Which term describes the reactant that is used up first and so limits the amount of product formed?
hints:
- level: 1
  en: Think about which reactant runs out first when the materials are mixed.
- level: 2
  en: The product amount is decided by the species that is fully used.
- level: 3
  en: Leftover material is not the one that controls the yield.
