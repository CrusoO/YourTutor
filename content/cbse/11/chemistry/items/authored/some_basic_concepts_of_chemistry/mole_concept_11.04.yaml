stem:
  en: What is the mass, in grams, of 0.25 mol of carbon dioxide? The molar mass of carbon dioxide is 44 g/mol.
hints:
- level: 1
  en: Mass is found by multiplying the amount in moles by the molar mass.
- level: 2
  en: Use the molar mass given in the question for carbon dioxide.
- level: 3
  en: Keep track of the unit so that moles cancel and grams remain.
