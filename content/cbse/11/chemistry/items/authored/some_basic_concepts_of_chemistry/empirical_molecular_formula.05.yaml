stem:
  en: A compound has a molar mass of 180 g/mol and an empirical formula of CH2O. What is its molecular formula?
hints:
- level: 1
  en: Divide the given molar mass by the mass of one empirical unit.
- level: 2
  en: Multiply every subscript of the empirical formula by the whole number you obtained.
- level: 3
  en: Check that the total mass of the new formula matches the molar mass given.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: C6H12O6
- id: b
  en: CH2O
- id: c
  en: C3H6O3
- id: d
  en: C12H24O12
answer:
  sympy: a
  accept: []
