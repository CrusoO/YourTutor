stem:
  en: Why does lithium differ from the other alkali metals in the stability of its carbonate?
hints:
- level: 1
  en: Think about the ion size and how strongly it distorts a neighbouring anion.
- level: 2
  en: Consider how charge density affects the stability of an anion.
- level: 3
  en: Look at the size of the lithium ion compared with the others in the group.
