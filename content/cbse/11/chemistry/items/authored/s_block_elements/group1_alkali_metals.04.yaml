stem:
  en: 'How many grams of sodium hydroxide form when 46 g of sodium reacts completely with water? 2 Na + 2 H2O -> 2 NaOH + H2. Molar masses: Na 23 g/mol and NaOH 40 g/mol.'
hints:
- level: 1
  en: Convert the mass of sodium into moles using its molar mass.
- level: 2
  en: Compare the mole ratio of sodium to sodium hydroxide in the balanced equation.
- level: 3
  en: Multiply the moles of product by its molar mass.
