stem:
  en: Which property is shared by lithium and magnesium because of their diagonal relationship?
hints:
- level: 1
  en: Think about which products form when the metals burn in air, not only in pure oxygen.
- level: 2
  en: Consider the reaction of each metal with nitrogen in the air.
- level: 3
  en: Look for the property that links the small first member of group 1 with the second member of group 2.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: both react vigorously with cold water
- id: b
  en: both form nitrides when burnt in air
- id: c
  en: both form peroxides as their main oxide
- id: d
  en: neither forms a stable hydride
answer:
  sympy: b
  accept: []
