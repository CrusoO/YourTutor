difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which pair of elements shows a diagonal relationship in the periodic table?
hints:
- level: 1
  en: Diagonal pairs sit one group to the right and one period below each other.
- level: 2
  en: Look for the element in the second period that is diagonal to the second element of the group.
- level: 3
  en: Check the group and period of each element in the pair.
prediction_prompt:
