stem:
  en: What mass in grams of magnesium is needed to produce 2.24 L of hydrogen at standard conditions? Mg + 2 HCl -> MgCl2 + H2, and magnesium has a molar mass of 24 g/mol.
hints:
- level: 1
  en: Find the moles of hydrogen from the volume at standard conditions.
- level: 2
  en: Use the one to one ratio between magnesium and hydrogen in the equation.
- level: 3
  en: Convert the moles of magnesium into a mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
