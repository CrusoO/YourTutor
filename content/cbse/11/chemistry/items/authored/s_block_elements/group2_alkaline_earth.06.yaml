answer:
  sympy: '2.4'
  accept: []
solution_steps:
- en: 2.24 L at standard conditions is 0.1 mol of hydrogen, which needs 0.1 mol of magnesium, and 0.1 mol times 24 g/mol is 2.4 g.
- en: The unit of the answer is g.
- en: Answer = 2.4
