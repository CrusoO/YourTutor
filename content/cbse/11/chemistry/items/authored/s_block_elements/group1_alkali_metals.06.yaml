stem:
  en: What mass in grams of carbon dioxide forms when 10.6 g of sodium carbonate (molar mass 106 g/mol) reacts with excess hydrochloric acid? Na2CO3 + 2 HCl -> 2 NaCl + H2O + CO2. Carbon dioxide has a molar mass of 44 g/mol.
hints:
- level: 1
  en: Find the moles of carbonate from its mass and molar mass.
- level: 2
  en: Use the mole ratio of carbon dioxide to carbonate in the equation.
- level: 3
  en: Convert the moles of carbon dioxide into a mass.
