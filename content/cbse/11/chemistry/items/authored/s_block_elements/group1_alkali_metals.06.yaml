answer:
  sympy: '4.4'
  accept: []
solution_steps:
- en: 10.6 g of sodium carbonate is 0.1 mol, which gives 0.1 mol of carbon dioxide, and 0.1 mol times 44 g/mol equals 4.4 g.
- en: The unit of the answer is g.
- en: Answer = 4.4
