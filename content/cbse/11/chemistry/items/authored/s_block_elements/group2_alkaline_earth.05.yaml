stem:
  en: Why does magnesium react only slowly with cold water while calcium reacts more readily?
hints:
- level: 1
  en: Consider what forms on the surface of the metal when it reacts with water.
- level: 2
  en: Think about whether the product stays on the metal or dissolves away.
- level: 3
  en: Compare how readily the hydroxide of each metal dissolves.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
