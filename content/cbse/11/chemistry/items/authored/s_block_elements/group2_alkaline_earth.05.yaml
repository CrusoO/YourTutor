  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: calcium dissolves in water as ions only
- id: b
  en: magnesium forms a protective hydroxide coating on its surface
- id: c
  en: calcium is less reactive because it is larger
- id: d
  en: magnesium has no valence electrons to lose
