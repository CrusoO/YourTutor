  en: Lithium behaves like magnesium here, so think about what magnesium nitrate gives on heating.
- level: 2
  en: Consider the products of nitrate decomposition in general.
- level: 3
  en: Look for the option that gives an oxide along with nitrogen oxides and oxygen.
