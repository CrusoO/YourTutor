stem:
  en: The solubility product Ksp of calcium hydroxide is 5.0 x 10^-6. What is the molar solubility of Ca(OH)2 in mol/L?
hints:
- level: 1
  en: Write the solubility product in terms of the solubility, with the hydroxide term squared and multiplied out.
- level: 2
  en: Collect the terms into a single power of the solubility.
- level: 3
  en: Take the cube root of the value you find for the power.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.0108'
  accept: []
solution_steps:
- en: Ca(OH)2 gives one calcium ion and two hydroxide ions, so Ksp equals s times (2s) squared, which is 4s cubed, and s is about 0.0108 mol/L.
- en: The unit of the answer is mol/L.
- en: Answer = 0.0108
tier: C
