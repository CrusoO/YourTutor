stem:
  en: The solubility product Ksp of silver chloride is 1.8 x 10^-10. What is the molar solubility of AgCl in mol/L?
hints:
- level: 1
  en: For a salt that gives one of each ion, the solubility squared equals Ksp.
- level: 2
  en: Write Ksp in terms of the solubility and solve for it.
- level: 3
  en: Take the square root of the solubility product.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.34e-5'
  accept: []
solution_steps:
- en: For AgCl the solubility s satisfies s squared equal to Ksp, so s is the square root of 1.8 x 10^-10, which is about 1.34 x 10^-5 mol/L.
- en: The unit of the answer is mol/L.
- en: Answer = 1.34e-5
tier: C
