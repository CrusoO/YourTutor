stem:
  en: What is the pH of a solution in which the hydrogen ion concentration is 1 x 10^-3 mol/L?
hints:
- level: 1
  en: pH equals the negative logarithm of the hydrogen ion concentration.
- level: 2
  en: Take the base ten logarithm of the concentration and reverse its sign.
- level: 3
  en: The exponent of the power of ten gives the pH directly when the mantissa is one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
