stem:
  en: A buffer contains 0.2 mol/L acetic acid and 0.4 mol/L sodium acetate. The pKa of acetic acid is 4.74. What is the pH of this buffer?
hints:
- level: 1
  en: Take the logarithm of the ratio of salt to acid concentrations and add it to pKa.
- level: 2
  en: Find the ratio first by dividing the salt concentration by the acid concentration.
- level: 3
  en: Use the logarithm value of the ratio you obtained.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
