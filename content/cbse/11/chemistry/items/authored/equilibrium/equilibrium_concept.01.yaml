id: A.11.chemistry.equilibrium.equilibrium_concept.01
skill_ids:
- SK.A.11.chemistry.equilibrium_concept
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What characterises a system that has reached dynamic equilibrium?
hints:
- level: 1
  en: Think about whether molecules are still reacting even though the overall amounts do not change.
- level: 2
  en: Consider what it means for two opposing processes to balance.
- level: 3
  en: Look for the option that describes unchanging amounts with continuing reactions.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the reactions have stopped completely
- id: b
  en: forward and reverse rates are equal and concentrations stay constant
- id: c
  en: only the products are present
- id: d
  en: all the reactants have been used up
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.1C08A46A1934
  when_answer_equals:
  - a
- id: MC.A.E59A256A223B
  when_answer_equals:
  - d
- id: MC.A.C2A026A5A7B4
  when_answer_equals:
  - c
solution_steps:
- en: At dynamic equilibrium the forward and reverse processes continue at equal rates, so the macroscopic amounts of each species do not change.
- en: The correct option is b.
tier: C
