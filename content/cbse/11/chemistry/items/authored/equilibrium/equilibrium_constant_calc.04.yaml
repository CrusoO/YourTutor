difficulty: 0.6
pool: practice
role: procedure
stem:
  en: The equilibrium constant for a reaction at a given temperature is 0.25. What is the equilibrium constant for the reverse reaction at the same temperature?
hints:
- level: 1
  en: Reversing a reaction inverts the expression for the equilibrium constant.
- level: 2
  en: The new value is the reciprocal of the original one.
- level: 3
  en: A constant that is a concentration ratio cannot be negative.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: '-0.25'
- id: b
  en: '0.5'
- id: c
  en: '0.25'
- id: d
  en: '4'
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.C88156297442
  when_answer_equals:
