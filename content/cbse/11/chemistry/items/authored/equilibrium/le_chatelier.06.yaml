stem:
  en: Adding more solid A to the equilibrium A(s) + B(g) <=> C(g) has what effect on the position of equilibrium?
hints:
- level: 1
  en: Activities of pure solids and liquids are treated as constant.
- level: 2
  en: Consider whether the amount of a solid affects the equilibrium expression.
- level: 3
  en: Look for the option describing an unchanged position.
prediction_prompt:
