stem:
  en: What is the pH of 0.01 mol/L acetic acid? The acid dissociation constant Ka is 1.8 x 10^-5.
hints:
- level: 1
  en: For a weak acid the hydrogen ion concentration is the square root of Ka times the concentration.
- level: 2
  en: Multiply Ka by the concentration first and then take the square root.
- level: 3
  en: Take the negative logarithm of the hydrogen ion concentration you obtained.
