  sympy: '3.37'
  accept: []
solution_steps:
- en: For a weak acid [H+] is the square root of Ka times the concentration, which gives sqrt(1.8 x 10^-7), about 4.24 x 10^-4 mol/L, and a pH of about 3.37.
