difficulty: 0.2
pool: practice
role: explain
stem:
  en: Which statement about pH and pOH is correct at 25 degrees Celsius?
hints:
- level: 1
  en: The ion product of water at this temperature sets the relation between the two logarithms.
- level: 2
  en: Take the negative logarithm of the ion product to see how the two values combine.
- level: 3
  en: Look for the option that describes a sum rather than a product.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: pH plus pOH equals 14
- id: b
  en: pH times pOH equals 14
- id: c
  en: pOH equals pH at all temperatures
- id: d
  en: pH plus pOH equals 7
answer:
  sympy: a
  accept: []
misconception_rules:
