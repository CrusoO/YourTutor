id: A.11.chemistry.equilibrium.equilibrium_concept.03
skill_ids:
- SK.A.11.chemistry.equilibrium_concept
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which physical process is an example of dynamic equilibrium?
hints:
- level: 1
  en: Ask whether the two opposing processes can both happen inside a closed container.
- level: 2
  en: Look for a system where the opposite changes balance each other with nothing leaving.
- level: 3
  en: Consider whether the process can be reversed under the same conditions.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: sugar dissolving in an unsaturated solution
- id: b
  en: ice melting in an open beaker at room temperature
- id: c
  en: a candle burning in a closed room
- id: d
  en: liquid water and water vapour in a sealed flask
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.231170919470
  when_answer_equals:
  - b
- id: MC.A.E1442030BCEF
  when_answer_equals:
  - a
- id: MC.A.A8B265185491
  when_answer_equals:
  - c
solution_steps:
- en: In a sealed flask liquid water evaporates and vapour condenses at equal rates, establishing a dynamic equilibrium between the two phases.
- en: The correct option is d.
tier: C
