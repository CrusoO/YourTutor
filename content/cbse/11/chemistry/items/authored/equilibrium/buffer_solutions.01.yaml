id: A.11.chemistry.equilibrium.buffer_solutions.01
skill_ids:
- SK.A.11.chemistry.buffer_solutions
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is a buffer solution?
hints:
- level: 1
  en: Think about a pair of species that can absorb added acid and added base.
- level: 2
  en: Consider which pair of weak species resists pH change.
- level: 3
  en: Look for the option that describes a weak acid or base together with its partner species.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: any solution with a pH of exactly seven
- id: b
  en: a mixture of a weak acid with its salt, or a weak base with its salt, that resists changes in pH
- id: c
  en: a strong acid mixed with a strong base
- id: d
  en: a salt dissolved in pure water
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.771F750E2AC3
  when_answer_equals:
  - c
- id: MC.A.FD0FA63C7FEF
  when_answer_equals:
  - a
- id: MC.A.93FEFE2A287D
  when_answer_equals:
  - d
solution_steps:
- en: A buffer contains a weak acid and its conjugate base, or a weak base and its conjugate acid, which absorb added acid or base and keep the pH nearly constant.
- en: The correct option is b.
tier: C
