id: A.11.chemistry.equilibrium.equilibrium_concept.02
skill_ids:
- SK.A.11.chemistry.equilibrium_concept
difficulty: 0.2
pool: practice
role: explain
stem:
  en: Does adding a catalyst change the position of an equilibrium?
hints:
- level: 1
  en: Think about whether the catalyst changes the free energy difference between reactants and products.
- level: 2
  en: Consider what the catalyst does to the forward and reverse reactions alike.
- level: 3
  en: Look for the option that says the catalyst affects only how quickly equilibrium is reached.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: yes, it shifts the equilibrium toward the reactants
- id: b
  en: yes, it doubles the value of the equilibrium constant
- id: c
  en: no, it only speeds up the time taken to reach equilibrium
- id: d
  en: yes, it shifts the equilibrium toward the products
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.BE4BD894D8E8
  when_answer_equals:
  - d
- id: MC.A.8455180E21EA
  when_answer_equals:
  - b
- id: MC.A.EC739466D21B
  when_answer_equals:
  - a
solution_steps:
- en: A catalyst lowers the activation energy for both the forward and reverse reactions equally, so it helps reach equilibrium faster without changing the equilibrium composition.
- en: The correct option is c.
tier: C
