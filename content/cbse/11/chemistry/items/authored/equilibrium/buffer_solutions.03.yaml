  author: model-draft
type: numeric
answer:
  sympy: '4.74'
  accept: []
solution_steps:
- en: When the acid and conjugate base concentrations are equal, the logarithm term is zero, so the pH equals the pKa of 4.74.
- en: Answer = 4.74
