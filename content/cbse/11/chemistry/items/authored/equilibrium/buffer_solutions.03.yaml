stem:
  en: A buffer contains 0.1 mol/L acetic acid and 0.1 mol/L sodium acetate. The pKa of acetic acid is 4.74. What is the pH of this buffer?
hints:
- level: 1
  en: When the acid and conjugate base concentrations are equal, the logarithm term vanishes.
- level: 2
  en: Substitute the equal concentrations into the ratio and simplify.
- level: 3
  en: The pH then matches the constant given for the acid.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
