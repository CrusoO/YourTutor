id: A.11.chemistry.equilibrium.equilibrium_constant_calc.01
skill_ids:
- SK.A.11.chemistry.equilibrium_constant_calc
difficulty: 0.2
pool: practice
role: recall
stem:
  en: For A + B <=> C + D at equilibrium, [A] = 1, [B] = 1, [C] = 2 and [D] = 2, all in mol/L. What is Kc?
hints:
- level: 1
  en: Write the products over the reactants, each raised to its coefficient.
- level: 2
  en: All coefficients here are one, so each concentration appears once.
- level: 3
  en: Multiply the product concentrations and divide by the product of the reactant concentrations.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: Kc equals [C][D] divided by [A][B], which is 2 times 2 divided by 1 times 1, equal to 4.
- en: Answer = 4
tier: C
