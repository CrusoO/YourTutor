id: A.11.chemistry.equilibrium.le_chatelier.01
skill_ids:
- SK.A.11.chemistry.le_chatelier
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What does Le Chatelier's principle state?
hints:
- level: 1
  en: Think about the direction the reaction moves to counteract the disturbance.
- level: 2
  en: Consider how the system responds when one of its conditions is changed.
- level: 3
  en: Look for the option describing a counteracting shift rather than a fixed direction.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the equilibrium constant changes with every change in concentration
- id: b
  en: a system at equilibrium shifts to oppose an applied change
- id: c
  en: a system always shifts toward the products
- id: d
  en: the reaction stops when a change is applied
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.64C52BDBDAD7
  when_answer_equals:
  - c
- id: MC.A.B25CFD55AA10
  when_answer_equals:
  - a
- id: MC.A.F856F0C0C50D
  when_answer_equals:
  - d
solution_steps:
- en: When a condition such as concentration, pressure or temperature is changed, the equilibrium moves in the direction that partly counteracts that change.
- en: The correct option is b.
tier: C
