difficulty: 0.9
pool: practice
role: apply
stem:
  en: Which reaction is a displacement redox reaction?
hints:
- level: 1
  en: Look for a halogen atom that takes the place of another halogen in a salt.
- level: 2
  en: Check which element is reduced and which is oxidised in each equation.
- level: 3
  en: Consider whether any element changes its oxidation number in the reaction.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: NaOH + HCl -> NaCl + H2O
- id: b
  en: Cl2 + 2 KBr -> 2 KCl + Br2
- id: c
  en: CaO + H2O -> Ca(OH)2
- id: d
  en: NH4Cl -> NH3 + HCl
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.686EBC0A824E
  when_answer_equals:
  - a
- id: MC.A.8690522634B7
  when_answer_equals:
  - c
- id: MC.A.B6D08CA3E354
  when_answer_equals:
  - d
solution_steps:
- en: Chlorine displaces bromine from potassium bromide, and the oxidation numbers of chlorine and bromine change, so the reaction is a displacement redox reaction.
- en: The correct option is b.
tier: C
