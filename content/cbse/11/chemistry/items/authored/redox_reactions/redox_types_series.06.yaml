difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Why is the decomposition of hydrogen peroxide, 2 H2O2 -> 2 H2O + O2, classed as a disproportionation reaction?
hints:
- level: 1
  en: Compare the oxidation number of oxygen in the reactant with its values in the two products.
- level: 2
  en: Check whether one element is found in both a higher and a lower oxidation state.
- level: 3
  en: Look at which species carries the oxygen atoms in each product.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: no element changes its oxidation number
- id: b
  en: hydrogen changes its oxidation number
- id: c
  en: oxygen is both a reactant and a product
- id: d
  en: oxygen goes from minus one to minus two and to zero
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.31F79AEA5FD7
  when_answer_equals:
  - c
- id: MC.A.A8CDB63836EA
  when_answer_equals:
