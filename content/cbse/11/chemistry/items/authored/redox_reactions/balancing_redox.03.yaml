stem:
  en: In acidic solution, the half reaction MnO4- -> Mn2+ needs how many electrons on the reactant side to balance the charge?
hints:
- level: 1
  en: Compare the manganese oxidation number before and after the change.
- level: 2
  en: The number of electrons equals the change in oxidation number for one manganese atom.
- level: 3
  en: Balance the charge after adding the water and hydrogen ions.
