difficulty: 0.9
pool: practice
role: apply
stem:
  en: Which species is the reducing agent in the reaction 2 Al + 3 Cu2+ -> 2 Al3+ + 3 Cu?
hints:
- level: 1
  en: The reducing agent is the species that is oxidised, so find the atom whose oxidation number rises.
- level: 2
  en: Look for the reactant that loses electrons to the other species.
- level: 3
  en: The reducing agent appears as a reactant, not a product.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
