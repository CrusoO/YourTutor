stem:
  en: What is the oxidation number of the carbon atom bonded to oxygen in methanol, CH3OH?
hints:
- level: 1
  en: Assign the electrons in each bond to the more electronegative atom and sum them.
- level: 2
  en: Count the bonds to hydrogen and the bond to oxygen separately.
- level: 3
  en: Add the contributions to get the oxidation number of the carbon.
