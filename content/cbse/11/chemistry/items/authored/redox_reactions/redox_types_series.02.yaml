id: A.11.chemistry.redox_reactions.redox_types_series.02
skill_ids:
- SK.A.11.chemistry.redox_types_series
difficulty: 0.2
pool: practice
role: explain
stem:
  en: What is a disproportionation reaction?
hints:
- level: 1
  en: The same element appears in both an oxidised product and a reduced product.
- level: 2
  en: Look for one species that changes in two opposite directions at once.
- level: 3
  en: Consider whether the reactant is also a product in a different form.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: a metal reacts with a halogen to form a salt
- id: b
  en: a single element is simultaneously oxidised and reduced
- id: c
  en: an element displaces another element from a compound
- id: d
  en: a compound splits into simpler substances with no change in oxidation numbers
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.F95E748247F3
  when_answer_equals:
  - c
- id: MC.A.FB357BDF2D7D
  when_answer_equals:
  - d
- id: MC.A.E1B79F985EB3
  when_answer_equals:
  - a
solution_steps:
- en: In disproportionation one species acts as both the oxidising agent and the reducing agent, so it ends up in both a higher and a lower oxidation state.
- en: The correct option is b.
tier: C
