stem:
  en: What is the oxidation number of manganese in potassium permanganate, KMnO4?
hints:
- level: 1
  en: Potassium is assigned its usual positive value in this compound.
- level: 2
  en: Oxygen has its usual negative value, and the total must sum to zero.
- level: 3
  en: Solve the balance for the one unknown oxidation number.
prediction_prompt:
