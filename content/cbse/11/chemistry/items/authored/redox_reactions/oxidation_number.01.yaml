stem:
  en: What is the oxidation number of sulphur in the sulphate ion, SO4 2-?
hints:
- level: 1
  en: Oxygen is usually assigned a value of minus two in its compounds.
- level: 2
  en: The sum of all oxidation numbers equals the charge on the ion.
- level: 3
  en: Solve for the unknown oxidation number of the central atom.
