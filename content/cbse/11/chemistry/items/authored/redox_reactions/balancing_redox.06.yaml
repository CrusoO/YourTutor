stem:
  en: In the balanced acidic equation 2 MnO4- + 16 H+ + 10 Cl- -> 2 Mn2+ + x Cl2 + 8 H2O, what is the value of x?
hints:
- level: 1
  en: Balance the electron transfer first, so that the manganese gain matches the chloride loss.
- level: 2
  en: Each chloride ion loses one electron when it becomes a chlorine atom in Cl2.
- level: 3
  en: Count the chloride ions and pair them up to form the chlorine molecules.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
