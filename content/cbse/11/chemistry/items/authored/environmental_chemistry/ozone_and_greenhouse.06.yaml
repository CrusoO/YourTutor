stem:
  en: Which action most directly reduces the depletion of the ozone layer?
hints:
- level: 1
  en: Think about which human-made source released the chlorine in the cycle.
- level: 2
  en: Consider which action stops the source rather than treating the effect.
- level: 3
  en: Look for the option that targets the chemical that breaks down ozone.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
