options:
- id: a
  en: phasing out the use of chlorofluorocarbons under an international agreement
- id: b
  en: increasing the use of aerosol sprays
- id: c
  en: burning more coal to produce electricity
- id: d
  en: adding more nitrogen oxides to the air
