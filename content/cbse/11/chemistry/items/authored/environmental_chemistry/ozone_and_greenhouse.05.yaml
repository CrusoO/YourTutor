solution_steps:
- en: The linear CO2 molecule has no permanent dipole, but its bending and asymmetric stretching vibrations create a changing dipole, which lets it absorb infrared radiation.
- en: The correct option is c.
tier: C
diagram_note: A linear O=C=O molecule with arrows along its axis for the asymmetric stretch and with bending motions drawn above and below the axis.
