difficulty: 0.9
pool: practice
role: apply
stem:
  en: Why does carbon dioxide absorb infrared radiation?
hints:
- level: 1
  en: A molecule absorbs infrared when its vibration changes how its charge is distributed.
- level: 2
  en: Think about a vibration that makes the molecule's dipole change.
- level: 3
  en: Consider the motions of a linear three-atom molecule.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: its molecules are polar and rotate freely as a gas
- id: b
  en: its carbon double bonds break easily on heating
- id: c
  en: its bending and stretching vibrations change the dipole moment
- id: d
  en: it is a strong oxidising agent
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.FB333B09A4C7
  when_answer_equals:
  - d
- id: MC.A.79F4357F1EA4
  when_answer_equals:
