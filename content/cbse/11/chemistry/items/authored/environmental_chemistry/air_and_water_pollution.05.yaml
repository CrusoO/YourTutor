difficulty: 0.9
pool: practice
role: apply
stem:
  en: A water sample has a dissolved oxygen of 8 mg/L when first measured and 3 mg/L after 5 days of bacterial action. What is its biochemical oxygen demand in mg/L?
hints:
- level: 1
  en: Subtract the final dissolved oxygen from the initial value.
- level: 2
  en: The oxygen used up by the bacteria is the drop in dissolved oxygen.
- level: 3
  en: Keep the units as mg/L in the final answer.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: The oxygen consumed by the bacteria is the initial value minus the final value, which is 8 minus 3, equal to 5 mg/L.
- en: The unit of the answer is mg/L.
- en: Answer = 5
tier: C
