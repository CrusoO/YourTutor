id: A.11.chemistry.structure_of_atom.orbitals_and_shapes.05
skill_ids:
- SK.A.11.chemistry.orbitals_and_shapes
difficulty: 0.9
pool: practice
role: apply
stem:
  en: The 2s orbital has a node. Which statement correctly describes this node?
hints:
- level: 1
  en: Look at the radial probability plot and find where the curve reaches zero between two maxima.
- level: 2
  en: Consider whether the node is a surface that depends only on distance from the nucleus.
- level: 3
  en: An s orbital has no angular node, so think about radial nodes only.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: a conical node along the z axis
- id: b
  en: a planar angular node passing through the nucleus
- id: c
  en: a spherical radial node at a certain distance from the nucleus
- id: d
  en: no node at all, because all s orbitals are nodeless
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.5381DE6D37B3
  when_answer_equals:
  - b
- id: MC.A.8273060C177C
  when_answer_equals:
  - d
- id: MC.A.6F421033F7A9
  when_answer_equals:
  - a
solution_steps:
- en: The 2s orbital has one spherical radial node, which is a shell of zero probability at a certain distance from the nucleus.
- en: The correct option is c.
tier: C
diagram_note: A radial distribution plot with distance on the horizontal axis, showing a first peak near the nucleus, a point where the curve touches zero, and a second, larger peak further out.
