stem:
  en: Which statement correctly compares the atomic models proposed by Thomson and Rutherford?
hints:
- level: 1
  en: Compare where each scientist located the positive charge relative to the rest of the atom.
- level: 2
  en: One model spreads the positive charge throughout the atom, and the other concentrates it.
- level: 3
  en: Look for the statement that matches the concentrated picture.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Thomson placed the positive charge in a nucleus at the centre
- id: b
  en: Rutherford stated that electrons are embedded in a uniform positive sphere
- id: c
  en: Both models placed all the mass at the surface of the atom
- id: d
  en: Rutherford placed the positive charge in a small dense nucleus
answer:
  sympy: d
  accept: []
