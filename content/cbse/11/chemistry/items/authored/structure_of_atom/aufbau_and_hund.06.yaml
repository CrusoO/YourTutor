stem:
  en: The electron configuration of iron, atomic number 26, ends in 3d6. How many unpaired electrons does an iron atom have in its ground state?
hints:
- level: 1
  en: Work out how many orbitals the d subshell contains.
- level: 2
  en: Fill each orbital with one electron before any orbital receives a second electron.
- level: 3
  en: Count the orbitals that still hold a single electron after the rule has been applied.
