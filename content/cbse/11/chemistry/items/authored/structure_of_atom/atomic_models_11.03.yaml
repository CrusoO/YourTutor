id: A.11.chemistry.structure_of_atom.atomic_models_11.03
skill_ids:
- SK.A.11.chemistry.atomic_models_11
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which limitation of Rutherford's model could not be explained by classical physics?
hints:
- level: 1
  en: Consider what an orbiting charge would do according to classical electromagnetism.
- level: 2
  en: Think about whether the electron can keep its energy while it circles the nucleus.
- level: 3
  en: The problem is with the motion of the electron, not with the nucleus.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: atoms have no net electric charge
- id: b
  en: the nucleus is too small to be detected
- id: c
  en: electrons would spiral into the nucleus by radiating energy
- id: d
  en: alpha particles are deflected at small angles
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.8AC63D616549
  when_answer_equals:
  - d
- id: MC.A.8FC766750ED1
  when_answer_equals:
  - b
- id: MC.A.BC47617F8F7E
  when_answer_equals:
  - a
solution_steps:
- en: An accelerating charge should radiate energy and lose it, so in Rutherford's model the orbiting electron would collapse into the nucleus, which does not happen.
- en: The correct option is c.
tier: C
diagram_note: Sketch Rutherford's model with a small central nucleus labelled and electrons drawn in circular orbits around it, with a spiral arrow from one orbit toward the nucleus.
