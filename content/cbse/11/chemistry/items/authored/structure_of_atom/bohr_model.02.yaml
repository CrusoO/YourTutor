role: explain
stem:
  en: What does the Bohr model say about the energy of an electron in a hydrogen atom?
hints:
- level: 1
  en: Think about which energies the electron is allowed to have.
- level: 2
  en: Consider what happens to the electron when it moves between allowed states.
- level: 3
  en: Look for the option that describes quantised energy levels.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it falls into the nucleus whenever it absorbs light
- id: b
  en: it spreads into a continuous cloud of any energy
- id: c
  en: it moves in fixed orbits with set energies
- id: d
  en: it can take any energy within an orbit
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.B4F97476D445
