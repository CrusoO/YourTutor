id: A.11.chemistry.structure_of_atom.bohr_model.05
skill_ids:
- SK.A.11.chemistry.bohr_model
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Calculate the energy in joules of a photon emitted when a hydrogen electron drops from n = 3 to n = 1. The energy of level n = 1 is -2.18 x 10^-18 J and each level energy is that value divided by n squared.
hints:
- level: 1
  en: Find the energy of each level using the formula given in the question.
- level: 2
  en: Subtract the energy of the lower level from the energy of the higher level.
- level: 3
  en: The energy of the emitted photon is the size of that energy difference.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.96e-18'
  accept: []
solution_steps:
- en: The level 3 energy is -2.42 x 10^-19 J, so the energy released is -2.42 x 10^-19 minus -2.18 x 10^-18, which is 1.96 x 10^-18 J.
- en: The unit of the answer is J.
- en: Answer = 1.96e-18
tier: C
diagram_note: Energy-level ladder for hydrogen with levels n = 1, 2 and 3 marked, and a downward arrow from the n = 3 level to the n = 1 level labelled with the emitted photon.
