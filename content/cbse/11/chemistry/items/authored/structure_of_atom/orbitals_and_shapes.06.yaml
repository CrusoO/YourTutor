id: A.11.chemistry.structure_of_atom.orbitals_and_shapes.06
skill_ids:
- SK.A.11.chemistry.orbitals_and_shapes
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which orbital has exactly two angular nodes?
hints:
- level: 1
  en: Angular nodes equal the azimuthal quantum number for the subshell.
- level: 2
  en: Match the azimuthal value to the subshell letter using the standard order.
- level: 3
  en: The subshell with the matching azimuthal value is the answer.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: an s orbital
- id: b
  en: an f orbital
- id: c
  en: a d orbital
- id: d
  en: a p orbital
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.8248689B0A93
  when_answer_equals:
  - a
- id: MC.A.AA49C3B59CE3
  when_answer_equals:
  - d
- id: MC.A.C289FC1E13D6
  when_answer_equals:
  - b
solution_steps:
- en: Angular nodes equal the azimuthal quantum number, and the d subshell has azimuthal value 2, so a d orbital has two angular nodes.
- en: The correct option is c.
tier: C
diagram_note: Four orbital outlines drawn side by side and labelled s, p, d and f, with the number of nodal surfaces written beneath each one.
