difficulty: 0.6
pool: practice
role: apply
stem:
  en: An atom has atomic number 11 and mass number 23. How many neutrons does it have?
hints:
- level: 1
  en: Subtract the number of protons from the total number of nucleons.
- level: 2
  en: The atomic number tells you the number of protons.
- level: 3
  en: The mass number counts protons and neutrons together.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '12'
  accept: []
solution_steps:
- en: Neutrons equal the mass number minus the atomic number, so 23 minus 11 gives 12 neutrons.
- en: Answer = 12
tier: C
