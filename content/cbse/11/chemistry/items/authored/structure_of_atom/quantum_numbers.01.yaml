stem:
  en: Which quantum number describes the shape of an orbital?
hints:
- level: 1
  en: This number is denoted by l and takes values from zero up to one less than the principal number.
- level: 2
  en: It labels the subshell as s, p, d or f.
- level: 3
  en: The principal number gives the shell, while this number gives the subshell.
