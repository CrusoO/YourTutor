difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A diagram shows four lobes lying in one plane, arranged along the diagonals of the x and y axes, with a node at the centre. Which orbital is shown?
hints:
- level: 1
  en: Count the lobes and note which plane they lie in.
- level: 2
  en: Decide whether the lobes lie along the axes or between them.
- level: 3
  en: A node-free sphere would point you to a different orbital.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: f orbital
- id: b
  en: p_x orbital
- id: c
  en: d_xy orbital
- id: d
  en: s orbital
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.3132B5256323
  when_answer_equals:
  - b
- id: MC.A.4412D88EB6EC
  when_answer_equals:
