solution_steps:
- en: A d_xy orbital has four lobes in the xy plane lying between the axes, with nodal planes through the nucleus, matching the diagram.
- en: The correct option is c.
tier: C
diagram_note: A four-lobed cloverleaf in the xy plane, with lobes placed along the diagonals between the x and y axes and no lobes along the axes themselves, with a node at the nucleus.
