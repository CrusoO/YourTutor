id: A.11.chemistry.structure_of_atom.atomic_models_11.02
skill_ids:
- SK.A.11.chemistry.atomic_models_11
difficulty: 0.2
pool: practice
role: explain
stem:
  en: In Rutherford's gold foil experiment most alpha particles passed straight through the foil. What did this result show about the atom?
hints:
- level: 1
  en: Think about how much of the space the deflected particles actually met.
- level: 2
  en: Only a few particles were turned sharply back, so the deflecting centre is small.
- level: 3
  en: Compare the amount of open space the beam crossed with the size of the central core.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: neutrons are located in the outer shell
- id: b
  en: most of the atom is empty space
- id: c
  en: the atom is a solid sphere of positive charge
- id: d
  en: electrons are fixed in orbits of set energy
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.F92320C2EBC0
  when_answer_equals:
  - c
- id: MC.A.723BDB9CBDEB
  when_answer_equals:
  - d
- id: MC.A.01752B59F62F
  when_answer_equals:
  - a
solution_steps:
- en: Because most alpha particles passed through undeflected, most of the atomic volume must be empty, with a small dense nucleus causing the rare large deflections.
- en: The correct option is b.
tier: C
