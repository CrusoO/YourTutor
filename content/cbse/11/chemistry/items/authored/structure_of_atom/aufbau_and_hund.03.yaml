  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 1s2 2s2 2p4
- id: b
  en: 1s2 2s1 2p5
- id: c
  en: 1s2 2s2 2p6
- id: d
  en: 1s2 2s2 2p2 3s2
