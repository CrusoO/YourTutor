difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which is the correct ground state electronic configuration of oxygen, atomic number 8?
hints:
- level: 1
  en: Fill subshells in the order 1s, 2s, then 2p, counting electrons as you go.
- level: 2
  en: Stop once you have placed as many electrons as the atomic number states.
- level: 3
  en: Use Hund's rule to place electrons singly in the p orbitals before pairing.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
