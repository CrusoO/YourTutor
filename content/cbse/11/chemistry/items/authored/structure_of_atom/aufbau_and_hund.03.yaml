solution_steps:
- en: Oxygen has eight electrons, which fill 1s with two, 2s with two and then four electrons across the three 2p orbitals.
- en: The correct option is a.
tier: C
diagram_note: Orbital box diagram with boxes for 1s, 2s and three 2p boxes in a row. The 1s and 2s boxes hold pairs of arrows, and the 2p boxes hold four arrows, with one box containing a pair.
