id: A.11.chemistry.structure_of_atom.atomic_models_11.05
skill_ids:
- SK.A.11.chemistry.atomic_models_11
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A beam of particles travels between two charged parallel plates in a cathode ray tube. The top plate is positive and the bottom plate is negative. Which observation shows that the beam particles are negatively charged?
hints:
- level: 1
  en: Recall which plate attracts a negative charge.
- level: 2
  en: The direction of the bend tells you the sign of the charge on the particles.
- level: 3
  en: Think about the force on a charged particle in an electric field.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the beam slows down between the plates
- id: b
  en: the beam passes straight with no deflection
- id: c
  en: the beam bends toward the positive plate
- id: d
  en: the beam bends toward the negative plate
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.5E20876CA5F0
  when_answer_equals:
  - d
- id: MC.A.0333D5BE14D5
  when_answer_equals:
  - b
- id: MC.A.BF740CBB3260
  when_answer_equals:
  - a
solution_steps:
- en: Opposite charges attract, so a negatively charged beam is pulled toward the positive plate, showing its charge sign.
- en: The correct option is c.
tier: C
diagram_note: Two parallel charged plates sit across a glowing beam tube. The upper plate is labelled positive and the lower plate negative, and a thin beam passes between them, drawn with a curved path toward the upper plate.
