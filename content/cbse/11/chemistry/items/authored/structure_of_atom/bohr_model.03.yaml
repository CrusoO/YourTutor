stem:
  en: Calculate the wavelength in nanometres of light emitted when a hydrogen electron falls from n = 3 to n = 2. Use the Rydberg constant 1.097 x 10^7 per metre.
hints:
- level: 1
  en: Use the reciprocal wavelength formula with the Rydberg constant and the two levels.
- level: 2
  en: Subtract one over the square of the lower level from one over the square of the higher level.
- level: 3
  en: Invert the result and convert metres into nanometres at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
