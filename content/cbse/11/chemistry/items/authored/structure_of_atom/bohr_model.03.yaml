answer:
  sympy: '656'
  accept: []
solution_steps:
- en: The reciprocal wavelength is R times (1/4 minus 1/9), which gives about 1.52 x 10^6 per metre, so the wavelength is about 656 nm.
- en: The unit of the answer is nm.
- en: Answer = 656
