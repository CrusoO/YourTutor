difficulty: 0.2
pool: practice
role: recall
stem:
  en: The energy of the electron in hydrogen at level n = 1 is -2.18 x 10^-18 J. What is the energy in joules at level n = 2?
hints:
- level: 1
  en: Energy in the Bohr model depends on one divided by the square of the level number.
- level: 2
  en: Find the factor by which the energy changes from level one to the next level.
- level: 3
  en: Multiply the level one energy by that factor.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-5.45e-19'
  accept: []
solution_steps:
- en: Bohr energies scale as one over n squared, so level 2 has one quarter of the level 1 value, which is -5.45 x 10^-19 J.
- en: The unit of the answer is J.
- en: Answer = -5.45e-19
tier: C
