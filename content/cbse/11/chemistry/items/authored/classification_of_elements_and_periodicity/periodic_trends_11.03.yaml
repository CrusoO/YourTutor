difficulty: 0.6
pool: practice
role: procedure
stem:
  en: 'Which species has the largest radius: Na, Na+, Mg or Mg2+?'
hints:
- level: 1
  en: Compare atoms in the same period first and then consider the effect of losing electrons.
- level: 2
  en: Losing electrons from an atom shrinks the ion compared with the neutral atom.
- level: 3
  en: Look for the atom that sits furthest to the left in the period.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Na
- id: b
  en: Na+
- id: c
  en: Mg
- id: d
  en: Mg2+
answer:
  sympy: a
  accept: []
