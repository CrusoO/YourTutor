solution_steps:
- en: Sodium is larger than magnesium in the same period, and removing an electron from sodium makes Na+ smaller than Na, so Na has the largest radius.
- en: The correct option is a.
tier: C
diagram_note: Four labelled spheres representing Na, Na+, Mg and Mg2+, drawn at sizes that show the relative radii, with Na drawn largest.
