solution_steps:
- en: The lanthanoids and actinoids fill f subshells, so they form the f block, which is placed as two detached rows below the main table.
- en: The correct option is b.
tier: C
diagram_note: Standard periodic table outline with the two detached rows below the main body, labelled as the lanthanoid series in the upper detached row and the actinoid series in the lower one.
