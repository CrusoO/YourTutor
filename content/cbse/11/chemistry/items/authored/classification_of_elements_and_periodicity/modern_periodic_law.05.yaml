difficulty: 0.9
pool: practice
role: apply
stem:
  en: In the modern periodic table, which block contains the lanthanoid and actinoid series?
hints:
- level: 1
  en: They are placed below the main table so that the main body stays narrow.
- level: 2
  en: Think about which subshell letter is filled in these inner transition series.
- level: 3
  en: The block letter is the subshell that the last electron enters.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: s block
- id: b
  en: f block
- id: c
  en: d block
- id: d
  en: p block
answer:
  sympy: b
  accept: []
misconception_rules:
