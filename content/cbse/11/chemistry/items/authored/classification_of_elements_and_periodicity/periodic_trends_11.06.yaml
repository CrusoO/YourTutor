difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which statement correctly describes the trend in properties down a group of the periodic table?
hints:
- level: 1
  en: Consider how the distance from the nucleus to the outer electron changes as shells are added.
- level: 2
  en: Think about whether a greater distance strengthens or weakens the attraction.
- level: 3
  en: Relate the size of the atom to how easily its outer electron is removed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: ionisation enthalpy increases as shells are added
- id: b
  en: atomic radius decreases as shells are added
- id: c
  en: ionisation enthalpy decreases as atomic radius increases
- id: d
  en: electronegativity increases as atomic size increases
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.0552949CDF77
  when_answer_equals:
  - d
- id: MC.A.9E15BF9E3B03
  when_answer_equals:
