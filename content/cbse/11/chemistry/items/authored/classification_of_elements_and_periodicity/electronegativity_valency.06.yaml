stem:
  en: Why does electronegativity increase from left to right across period 2 of the periodic table?
hints:
- level: 1
  en: Focus on what changes as protons are added within the same shell.
- level: 2
  en: Think about how strongly the nucleus draws in the electrons of a bond.
- level: 3
  en: Compare the number of shells across the period.
