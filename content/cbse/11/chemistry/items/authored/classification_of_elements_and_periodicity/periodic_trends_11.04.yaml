stem:
  en: Which halogen has the most negative electron gain enthalpy among fluorine, chlorine and bromine?
hints:
- level: 1
  en: Fluorine's small size means the added electron meets strong repulsion from the crowded valence shell.
- level: 2
  en: Compare the three elements by their position within the group.
- level: 3
  en: The trend within the group is not simply monotonic for the first member.
