stem:
  en: On what property are elements arranged in order in the modern periodic table?
hints:
- level: 1
  en: Think about the number that defines the identity of an element.
- level: 2
  en: The ordering follows a whole number that counts protons in the nucleus.
- level: 3
  en: Mass can vary between isotopes, so it cannot be the defining order.
prediction_prompt:
