id: A.11.chemistry.classification_of_elements_and_periodicity.periodic_trends_11.05
skill_ids:
- SK.A.11.chemistry.periodic_trends_11
difficulty: 0.9
pool: practice
role: apply
stem:
  en: The first ionisation enthalpy of beryllium is higher than that of boron. Which statement explains this?
hints:
- level: 1
  en: Compare the orbital the electron is removed from in each atom.
- level: 2
  en: Think about whether a full subshell has extra stability.
- level: 3
  en: Look at which electron is lost first in each element.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: beryllium has a filled 2s subshell that is more stable
- id: b
  en: boron has a larger nuclear charge than beryllium
- id: c
  en: boron's outer electron is shielded less than beryllium's
- id: d
  en: beryllium has more unpaired electrons than boron
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.BB6A2ACDACE2
  when_answer_equals:
  - b
- id: MC.A.BFE571520A60
  when_answer_equals:
  - d
- id: MC.A.099B780828C6
  when_answer_equals:
  - c
solution_steps:
- en: Beryllium has a completely filled 2s subshell, and removing an electron from its stable configuration needs more energy than removing the 2p electron of boron.
- en: The correct option is a.
tier: C
diagram_note: Two orbital box diagrams side by side, one for beryllium showing a filled 2s pair and one for boron showing a single 2p electron in a higher subshell.
