stem:
  en: Why does ionisation enthalpy generally increase from left to right across a period?
hints:
- level: 1
  en: Consider how the pull on the outer electron changes as protons are added within one shell.
- level: 2
  en: Think about how well the inner electrons block the charge of the nucleus.
- level: 3
  en: Compare the change in nuclear charge with the change in shielding across the period.
