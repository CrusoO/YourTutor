solution_steps:
- en: An element whose last electron enters a p subshell is in the p block, and with three electrons in that subshell it belongs to group 15.
- en: The correct option is d.
tier: C
diagram_note: Outline of the periodic table with the p block on the right side, showing the six columns from group 13 to group 18 and the last electron position labelled in the p block.
