id: A.11.chemistry.classification_of_elements_and_periodicity.modern_periodic_law.03
skill_ids:
- SK.A.11.chemistry.modern_periodic_law
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: An element has its last electron entering a 4p subshell and its outer shell holds three electrons in that subshell. Which block and group is it in?
hints:
- level: 1
  en: Find the subshell letter where the last electron enters to decide the block.
- level: 2
  en: Count the electrons in the outer subshells to decide the group.
- level: 3
  en: Groups of the p block run from 13 to 18 across the right side of the table.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: d block, group 5
- id: b
  en: s block, group 2
- id: c
  en: p block, group 13
- id: d
  en: p block, group 15
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.A8A5C2EA20C6
  when_answer_equals:
  - c
- id: MC.A.089E70C06160
  when_answer_equals:
