stem:
  en: The element with atomic number 37 is placed in which period and group of the modern periodic table?
hints:
- level: 1
  en: Work out the electron configuration first and count the highest shell number.
- level: 2
  en: The group is set by the number of outer electrons in the s block.
- level: 3
  en: Compare the element with the noble gas that ends the previous period.
