stem:
  en: What is the product of ozonolysis of 2-butene followed by a reductive work-up?
hints:
- level: 1
  en: Split the double bond and attach an oxygen to each carbon, counting the carbons on each side.
- level: 2
  en: Each carbon of the double bond becomes a carbonyl carbon in the product.
- level: 3
  en: Count how many carbons remain on each side after the cleavage.
