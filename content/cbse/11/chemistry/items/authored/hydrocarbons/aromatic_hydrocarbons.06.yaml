id: A.11.chemistry.hydrocarbons.aromatic_hydrocarbons.06
skill_ids:
- SK.A.11.chemistry.aromatic_hydrocarbons
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Why does a nitro group direct incoming electrophiles mainly to the meta position of benzene?
hints:
- level: 1
  en: Compare the resonance structures of the intermediate for each position of attack.
- level: 2
  en: Check where the positive charge sits in the intermediate for ortho, para and meta attack.
- level: 3
  en: Consider which positions keep the destabilising charge away from the nitro group.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it sterically blocks the meta carbons
- id: b
  en: it withdraws electron density from the ortho and para positions
- id: c
  en: it makes the meta carbons more positive
- id: d
  en: it donates electrons to the meta carbons
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.00791C0DA3A9
  when_answer_equals:
  - d
- id: MC.A.29932F60FCF6
  when_answer_equals:
  - a
- id: MC.A.E7383BD4F5FC
  when_answer_equals:
  - c
solution_steps:
- en: Resonance structures of the arenium intermediate place positive charge on the carbons next to the nitro-bearing carbon, which is destabilised, so attack at the meta position is favoured.
- en: The correct option is b.
tier: C
diagram_note: A benzene ring with a nitro group on one carbon, with arrows showing that electron density is lowered at the ortho and para carbons.
