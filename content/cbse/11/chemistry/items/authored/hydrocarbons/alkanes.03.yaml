stem:
  en: Which product is formed as the major product when methane reacts with excess chlorine in sunlight?
hints:
- level: 1
  en: Keep substituting hydrogens one at a time until none remain on the carbon.
- level: 2
  en: Each substitution gives a product that can react again with the halogen.
- level: 3
  en: Consider the product when the carbon carries only halogen atoms.
