stem:
  en: In Friedel-Crafts alkylation of benzene using methyl chloride and aluminium chloride, which electrophile attacks the ring?
hints:
- level: 1
  en: The Lewis acid pulls the halide away, leaving a positively charged carbon.
- level: 2
  en: Think about which species is an electrophile in the alkylation step.
- level: 3
  en: Look for the cation formed from methyl chloride with the catalyst.
