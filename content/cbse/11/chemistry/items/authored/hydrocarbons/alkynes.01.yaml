stem:
  en: What is the general molecular formula of an alkyne with one triple bond?
hints:
- level: 1
  en: Think about how many hydrogens are removed compared with the saturated chain when the bond order is three.
- level: 2
  en: Compare how many hydrogens each kind of multiple bond removes relative to the alkane formula.
- level: 3
  en: Compare with the alkene formula and then add one more unsaturation.
