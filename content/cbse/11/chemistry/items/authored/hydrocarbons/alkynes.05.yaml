- id: MC.A.3099C34709FD
  when_answer_equals:
  - c
solution_steps:
- en: The sp carbon-hydrogen bond of propyne is acidic enough to be deprotonated by the strong base, whereas the sp3 and sp2 hydrogens of propene are not.
- en: The correct option is b.
tier: C
