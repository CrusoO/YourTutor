id: A.11.chemistry.hydrocarbons.alkynes.05
skill_ids:
- SK.A.11.chemistry.alkynes
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Why does sodium amide react with propyne but not with propene?
hints:
- level: 1
  en: Compare the acidity of the hydrogens on each carbon, focusing on the hybridisation.
- level: 2
  en: Think about which carbon in each molecule holds its bonding electrons closest to the nucleus.
- level: 3
  en: Consider which hydrogen can be removed by a very strong base.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: propene has stronger carbon-hydrogen bonds
- id: b
  en: the terminal alkyne hydrogen is acidic enough to be removed
- id: c
  en: the amide attacks the double bond of propene
- id: d
  en: propyne is nonpolar and so cannot react
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.E22276B4B9B0
  when_answer_equals:
  - a
- id: MC.A.2E3474F76636
  when_answer_equals:
