stem:
  en: Which of the following species is aromatic according to Huckel's rule?
hints:
- level: 1
  en: Count the pi electrons in the ring and check whether the total fits the rule.
- level: 2
  en: Consider whether the ring is planar and fully conjugated.
- level: 3
  en: Saturated rings cannot be aromatic because they have no delocalised pi system.
