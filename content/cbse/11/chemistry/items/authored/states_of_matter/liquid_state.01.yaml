id: A.11.chemistry.states_of_matter.liquid_state.01
skill_ids:
- SK.A.11.chemistry.liquid_state
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is the vapour pressure of a liquid?
hints:
- level: 1
  en: Think about a closed container where evaporation and condensation balance each other.
- level: 2
  en: The vapour is the gas phase above the liquid, not the liquid itself.
- level: 3
  en: Look for the option that describes a balance between two opposing processes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the atmospheric pressure at the surface of the liquid
- id: b
  en: the pressure of the vapour in equilibrium with the liquid
- id: c
  en: the pressure the liquid exerts on the walls of its container
- id: d
  en: the pressure needed to compress the liquid
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.6A0C468E2D7F
  when_answer_equals:
  - c
- id: MC.A.F6AD5E366612
  when_answer_equals:
  - a
- id: MC.A.F1E0A65E30B9
  when_answer_equals:
  - d
solution_steps:
- en: Vapour pressure is the pressure exerted by the vapour when evaporation and condensation balance in a closed container.
- en: The correct option is b.
tier: C
