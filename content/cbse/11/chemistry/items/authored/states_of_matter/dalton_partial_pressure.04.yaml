stem:
  en: Hydrogen is collected over water at 25 degrees Celsius. The total pressure in the collecting vessel is 1.00 atm and the vapour pressure of water is 0.03 atm. What is the pressure of the dry hydrogen?
hints:
- level: 1
  en: The collected gas is mixed with water vapour in the same space.
- level: 2
  en: Find the part of the total pressure that is due to the water vapour.
- level: 3
  en: Subtract that part from the total to isolate the dry gas.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
