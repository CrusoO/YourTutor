difficulty: 0.2
pool: practice
role: recall
stem:
  en: What does the kinetic molecular theory assume about the volume occupied by gas molecules?
hints:
- level: 1
  en: Think about how much space the molecules occupy compared with the empty space between them.
- level: 2
  en: A gas is mostly empty space, so consider what that implies for the molecules themselves.
- level: 3
  en: Look for the statement that treats molecular size as very small.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: negligible compared with the volume of the container
- id: b
  en: comparable to the spacing of molecules in a liquid
- id: c
  en: larger for heavier gases only
- id: d
  en: equal to the volume of the container
answer:
  sympy: a
  accept: []
