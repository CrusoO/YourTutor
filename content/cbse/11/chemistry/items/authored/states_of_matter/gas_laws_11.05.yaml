stem:
  en: What pressure in kilopascals is exerted by 2 mol of an ideal gas in a 10 L container at 300 K? Use R = 8.314 J/mol/K.
hints:
- level: 1
  en: Convert the volume into cubic metres before using R in joules.
- level: 2
  en: Rearrange the ideal gas equation to solve for pressure.
- level: 3
  en: Give the pressure in pascals first and convert to kilopascals at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '499'
  accept: []
solution_steps:
- en: Using P = nRT/V with V = 0.010 m3 gives 2 times 8.314 times 300 divided by 0.010, which is about 4.99 x 10^5 Pa, or 499 kPa.
- en: The unit of the answer is kPa.
- en: Answer = 499
tier: C
