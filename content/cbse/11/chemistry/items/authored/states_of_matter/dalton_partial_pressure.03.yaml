stem:
  en: A container holds oxygen at a partial pressure of 0.4 atm and nitrogen at a partial pressure of 0.6 atm. What is the mole fraction of oxygen?
hints:
- level: 1
  en: Divide the partial pressure of one gas by the total pressure.
- level: 2
  en: Add the partial pressures of all gases to find the total.
- level: 3
  en: A mole fraction has no units.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
