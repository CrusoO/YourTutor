difficulty: 0.2
pool: practice
role: explain
stem:
  en: Why does the pressure of a gas increase when its temperature rises at constant volume?
hints:
- level: 1
  en: Think about the speed of the molecules and how often they reach the walls.
- level: 2
  en: Consider how the momentum of each collision changes with speed.
- level: 3
  en: Look for the statement that links faster molecules to more forceful collisions.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: molecules attract each other more strongly
- id: b
  en: molecules grow larger when heated
- id: c
  en: the number of molecules in the container increases
- id: d
  en: molecules strike the walls more often and with more force
answer:
  sympy: d
  accept: []
misconception_rules:
