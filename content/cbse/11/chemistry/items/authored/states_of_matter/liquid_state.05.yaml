id: A.11.chemistry.states_of_matter.liquid_state.05
skill_ids:
- SK.A.11.chemistry.liquid_state
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Why does the surface tension of a liquid decrease as its temperature rises?
hints:
- level: 1
  en: Think about the energy that holds molecules at the surface and how heat affects it.
- level: 2
  en: Consider how the thermal motion of the molecules competes with cohesion.
- level: 3
  en: Look for the option that describes weaker cohesion at higher energy.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: molecules pack more tightly at higher temperature
- id: b
  en: the surface area of the liquid increases
- id: c
  en: molecules move more and the cohesive attraction between them weakens
- id: d
  en: the liquid gains more hydrogen bonds as it warms
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.E8C74D5C987D
  when_answer_equals:
  - a
- id: MC.A.00A0D451B744
  when_answer_equals:
  - d
- id: MC.A.D0C5E94BD067
  when_answer_equals:
  - b
solution_steps:
- en: Thermal motion loosens the cohesive forces that pull surface molecules inward, so the surface tension falls as the temperature rises.
- en: The correct option is c.
tier: C
