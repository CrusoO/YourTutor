difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A 4.46 g sample of a gas occupies 1.00 L at 273 K and 101325 Pa. Taking R = 8.314 J/mol/K, what is its molar mass in g/mol?
hints:
- level: 1
  en: Find the number of moles from the ideal gas equation first.
- level: 2
  en: Convert the volume into cubic metres so that the units match R in joules.
- level: 3
  en: Divide the mass of the sample by the number of moles you found.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '99.9'
  accept: []
solution_steps:
- en: The amount is PV/RT, about 0.0446 mol, so the molar mass is 4.46 g divided by 0.0446 mol, which is about 99.9 g/mol.
- en: The unit of the answer is g/mol.
- en: Answer = 99.9
tier: C
