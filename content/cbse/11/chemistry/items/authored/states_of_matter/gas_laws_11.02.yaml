difficulty: 0.2
pool: practice
role: recall
stem:
  en: A gas occupies 2 L at 300 K and constant pressure. What volume in litres does it occupy at 600 K at the same pressure?
hints:
- level: 1
  en: Charles's law says volume divided by absolute temperature stays constant at fixed pressure.
- level: 2
  en: Set up the ratio of the two volumes equal to the ratio of the two temperatures.
- level: 3
  en: Solve for the unknown volume after writing the ratio.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: At constant pressure volume is proportional to absolute temperature, so doubling the temperature doubles the volume from 2 L to 4 L.
- en: The unit of the answer is L.
- en: Answer = 4
tier: C
