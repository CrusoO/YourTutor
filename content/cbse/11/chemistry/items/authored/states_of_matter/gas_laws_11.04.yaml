difficulty: 0.6
pool: practice
role: apply
stem:
  en: A fixed mass of gas at 27 degrees Celsius is heated to 327 degrees Celsius at constant pressure. How does its volume change?
hints:
- level: 1
  en: Convert both temperatures to the absolute scale before comparing them.
- level: 2
  en: Volume is proportional to absolute temperature at fixed pressure.
- level: 3
  en: Find the ratio of the final absolute temperature to the initial one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: stays the same
- id: b
  en: increases by 300 units
- id: c
  en: halves
- id: d
  en: doubles
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.8B888A5D5517
