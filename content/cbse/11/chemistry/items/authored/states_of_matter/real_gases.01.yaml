id: A.11.chemistry.states_of_matter.real_gases.01
skill_ids:
- SK.A.11.chemistry.real_gases
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Under which conditions do real gases behave most like ideal gases?
hints:
- level: 1
  en: Think about when molecules are far apart and moving fast enough to avoid attracting each other.
- level: 2
  en: Consider how the distance between molecules changes with pressure.
- level: 3
  en: Look for the pair of conditions that makes molecules spread out and move quickly.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: low pressure and low temperature
- id: b
  en: high pressure and low temperature
- id: c
  en: low pressure and high temperature
- id: d
  en: high pressure and high temperature
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.969876D2FEC8
  when_answer_equals:
  - b
- id: MC.A.81F7D3264092
  when_answer_equals:
  - d
- id: MC.A.3304F604F4A7
  when_answer_equals:
  - a
solution_steps:
- en: At low pressure molecules are far apart, and at high temperature they move fast enough that attractions matter little, so the gas behaves ideally.
- en: The correct option is c.
tier: C
