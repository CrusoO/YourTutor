stem:
  en: A 3.0 L vessel holds 0.2 mol of helium and 0.3 mol of neon at 300 K. Using R = 8.314 J/mol/K, what is the total pressure in kilopascals?
hints:
- level: 1
  en: Add the moles of both gases to get the total amount first.
- level: 2
  en: Convert the volume into cubic metres before substituting.
- level: 3
  en: Use the ideal gas equation with the total amount.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
