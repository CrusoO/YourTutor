answer:
  sympy: '416'
  accept: []
solution_steps:
- en: The total amount is 0.5 mol, so P = nRT/V = 0.5 times 8.314 times 300 divided by 0.0030 m3, which is about 4.16 x 10^5 Pa, or 416 kPa.
- en: The unit of the answer is kPa.
- en: Answer = 416
