id: A.11.chemistry.states_of_matter.kinetic_theory_gases.05
skill_ids:
- SK.A.11.chemistry.kinetic_theory_gases
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Two gases have molar masses of 16 g/mol and 64 g/mol at the same temperature. How many times faster does the lighter gas effuse than the heavier gas?
hints:
- level: 1
  en: Effusion rate varies inversely with the square root of the molar mass.
- level: 2
  en: Take the ratio of the molar masses before finding the square root.
- level: 3
  en: The lighter gas has the larger rate, so the ratio is greater than one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: Graham's law gives a rate ratio equal to the square root of 64 divided by 16, which is 2.
- en: Answer = 2
tier: C
