stem:
  en: A liquid boils at 353 K under normal pressure. What is its boiling point in degrees Celsius?
hints:
- level: 1
  en: Subtract the standard offset between the kelvin and Celsius scales.
- level: 2
  en: The offset is about two hundred and seventy-three.
- level: 3
  en: Keep the sign positive because the temperature is above freezing.
