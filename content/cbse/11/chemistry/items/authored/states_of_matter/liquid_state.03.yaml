id: A.11.chemistry.states_of_matter.liquid_state.03
skill_ids:
- SK.A.11.chemistry.liquid_state
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Why does a liquid with stronger intermolecular forces have a higher boiling point?
hints:
- level: 1
  en: Boiling happens when vapour pressure equals the external pressure, so think about what it takes to reach that.
- level: 2
  en: Consider how strongly the molecules are held in the liquid.
- level: 3
  en: Compare the energy needed to free molecules from the liquid in each case.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: more energy is needed to overcome the forces between molecules
- id: b
  en: it has a smaller surface area
- id: c
  en: it is less dense than other liquids
- id: d
  en: its vapour pressure is always higher at the same temperature
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.961BE669D32A
  when_answer_equals:
  - d
- id: MC.A.5E35C38F2FB1
  when_answer_equals:
  - b
- id: MC.A.3F6C143CEF3C
  when_answer_equals:
  - c
solution_steps:
- en: Boiling needs the vapour pressure to reach the external pressure, and stronger attractions mean more energy must be supplied before molecules can escape.
- en: The correct option is a.
tier: C
