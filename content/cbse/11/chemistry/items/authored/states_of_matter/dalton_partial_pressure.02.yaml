stem:
  en: A gas mixture has a total pressure of 2.0 atm, and nitrogen in it has a partial pressure of 1.2 atm. What is the combined partial pressure of the other gases in atm?
hints:
- level: 1
  en: Subtract the known partial pressure from the total pressure.
- level: 2
  en: The remaining pressure belongs to the gases not yet counted.
- level: 3
  en: Check that the units of the answer are atmospheres.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.8'
  accept: []
solution_steps:
- en: The other gases make up the rest of the total pressure, so 2.0 minus 1.2 gives 0.8 atm.
- en: The unit of the answer is atm.
- en: Answer = 0.8
