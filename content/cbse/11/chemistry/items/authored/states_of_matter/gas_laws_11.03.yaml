id: A.11.chemistry.states_of_matter.gas_laws_11.03
skill_ids:
- SK.A.11.chemistry.gas_laws_11
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A gas occupies 500 mL at 1.0 atm. What volume in millilitres does it occupy at 2.5 atm, with temperature held constant?
hints:
- level: 1
  en: Multiply the first pressure by the first volume to get a constant.
- level: 2
  en: Divide that constant by the new pressure to find the new volume.
- level: 3
  en: Check that the volume decreases when the pressure increases.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '200'
  accept: []
solution_steps:
- en: Boyle's law gives V2 = P1 V1 / P2, which is 1.0 times 500 divided by 2.5, equal to 200 mL.
- en: The unit of the answer is mL.
- en: Answer = 200
tier: C
