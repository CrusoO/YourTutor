stem:
  en: What volume in litres of hydrogen gas at standard conditions forms when 2.4 g of magnesium reacts completely with excess hydrochloric acid? Mg + 2 HCl -> MgCl2 + H2, and magnesium has a molar mass of 24 g/mol.
hints:
- level: 1
  en: Convert the mass of the metal into moles using its molar mass.
- level: 2
  en: Use the one to one ratio between magnesium and hydrogen from the equation.
- level: 3
  en: Multiply the moles of gas by the molar volume at standard conditions.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2.24'
  accept: []
solution_steps:
- en: 2.4 g of magnesium is 0.1 mol, which gives 0.1 mol of hydrogen, and 0.1 mol times 22.4 L/mol at standard conditions is 2.24 L.
- en: The unit of the answer is L.
- en: Answer = 2.24
tier: C
