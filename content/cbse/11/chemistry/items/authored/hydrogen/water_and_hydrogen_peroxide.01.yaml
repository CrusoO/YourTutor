role: recall
stem:
  en: What type of bonding holds the hydrogen and oxygen atoms together within a water molecule?
hints:
- level: 1
  en: The two atoms share electron pairs rather than transferring them.
- level: 2
  en: Think about whether the electrons stay on one atom or are shared between two.
- level: 3
  en: Consider the bonds inside the molecule rather than the forces between molecules.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
