stem:
  en: A hydrogen sample is 90 percent protium with mass 1.00783 u and 10 percent deuterium with mass 2.0141 u. What is its average atomic mass in u, to three significant figures?
hints:
- level: 1
  en: Weight each isotope mass by its fraction in the sample.
- level: 2
  en: Add the two weighted contributions together.
- level: 3
  en: Round the final result to the number of significant figures asked for.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.11'
  accept: []
solution_steps:
- en: The average is 0.90 times 1.00783 plus 0.10 times 2.0141, which is about 1.1085, or 1.11 u to three significant figures.
- en: The unit of the answer is u.
- en: Answer = 1.11
tier: C
