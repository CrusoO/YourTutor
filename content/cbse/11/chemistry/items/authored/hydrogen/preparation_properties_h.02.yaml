id: A.11.chemistry.hydrogen.preparation_properties_h.02
skill_ids:
- SK.A.11.chemistry.preparation_properties_h
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which equation correctly represents the reaction of zinc with dilute hydrochloric acid?
hints:
- level: 1
  en: Zinc is divalent so it pairs with two chloride ions.
- level: 2
  en: Check that the number of hydrogen atoms on each side of the equation matches.
- level: 3
  en: The gas released from acid with a metal is hydrogen.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Zn + 2 HCl -> ZnCl2 + O2
- id: b
  en: Zn + HCl -> ZnH + Cl2
- id: c
  en: Zn + HCl -> ZnCl + H2
- id: d
  en: Zn + 2 HCl -> ZnCl2 + H2
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.BEE766D4DDAB
  when_answer_equals:
  - c
- id: MC.A.2C960AD5E8F8
  when_answer_equals:
  - a
- id: MC.A.756669F9F8DC
  when_answer_equals:
  - b
solution_steps:
- en: Zinc is divalent, so it combines with two chloride ions to form zinc chloride, and the hydrogen ions are released as hydrogen gas.
- en: The correct option is d.
tier: C
