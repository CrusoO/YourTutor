stem:
  en: What volume in litres of oxygen at standard conditions forms when 68 g of hydrogen peroxide (molar mass 34 g/mol) decomposes completely? 2 H2O2 -> 2 H2O + O2
hints:
- level: 1
  en: Find the moles of peroxide from its mass and molar mass.
- level: 2
  en: Use the mole ratio of oxygen to peroxide in the balanced equation.
- level: 3
  en: Convert the moles of oxygen into a volume at standard conditions.
