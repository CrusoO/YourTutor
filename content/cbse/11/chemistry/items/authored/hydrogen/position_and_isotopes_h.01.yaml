stem:
  en: Where is hydrogen placed in the modern periodic table?
hints:
- level: 1
  en: Think about its single valence electron and which column that matches.
- level: 2
  en: Consider which element sits directly beneath it in the same column.
- level: 3
  en: Its placement is a convention, since its behaviour differs from the column it shares.
