stem:
  en: Which change increases the mean free path of gas molecules at fixed temperature?
hints:
- level: 1
  en: The mean free path is inversely related to how crowded the gas is.
- level: 2
  en: Lower density means fewer collisions.
- level: 3
  en: At fixed temperature, pressure is a measure of how crowded the gas is.
