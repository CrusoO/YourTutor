stem:
  en: 'For the molecules of a gas, which is larger: the rms speed or the mean speed?'
hints:
- level: 1
  en: Squaring emphasises the faster molecules before averaging.
- level: 2
  en: Compare the mean of the squares with the square of the mean.
- level: 3
  en: Think about how taking a square root after averaging the squares behaves.
