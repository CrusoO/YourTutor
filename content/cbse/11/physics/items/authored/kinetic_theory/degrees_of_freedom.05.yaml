stem:
  en: A diatomic ideal gas at high temperature has molar heat capacity at constant volume equal to 7/2 R. Using R = 8.31 J/mol K, what is its molar heat capacity at constant pressure in J/mol K, to one decimal place?
hints:
- level: 1
  en: Mayer's relation links the two molar heat capacities.
- level: 2
  en: Add the gas constant to the constant-volume value.
- level: 3
  en: Express the sum as a multiple of R, then multiply by the numerical value of R.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '37.4'
  accept: []
solution_steps:
- en: Mayer's relation gives Cp = Cv + R = 4.5 R = 4.5 times 8.31 = 37.4 J/mol K.
- en: The unit of the answer is J/mol K.
- en: Answer = 37.4
tier: C
