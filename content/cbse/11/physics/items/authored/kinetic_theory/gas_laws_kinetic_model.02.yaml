stem:
  en: According to the kinetic model, what does the temperature of an ideal gas measure?
hints:
- level: 1
  en: Temperature is linked to the motion of molecules.
- level: 2
  en: Think about which energy grows as molecules move faster.
- level: 3
  en: The quantity is an average over all molecules, not one molecule.
