stem:
  en: Two gases are at the same temperature. The molecules of one have mass m and those of the other have mass 4m. What is the ratio of the rms speed of the lighter gas to that of the heavier gas?
hints:
- level: 1
  en: At equal temperature the average kinetic energies of the two gases are equal.
- level: 2
  en: For equal energies the speed squared is inversely proportional to the mass.
- level: 3
  en: Take the square root of the mass ratio to get the speed ratio.
