stem:
  en: The absolute temperature of an ideal gas is doubled in kelvin. What happens to the average translational kinetic energy of its molecules?
hints:
- level: 1
  en: Average kinetic energy is directly proportional to the absolute temperature.
- level: 2
  en: Use kelvin, not Celsius, when forming the ratio.
- level: 3
  en: Check whether the relation is linear or involves a square.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
