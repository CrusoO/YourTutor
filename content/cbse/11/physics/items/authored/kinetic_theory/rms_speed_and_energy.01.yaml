stem:
  en: Using k = 1.38 times 10 to the power minus 23 J/K, what is the average translational kinetic energy of an ideal gas molecule at 300 K, in units of 10 to the power minus 21 joules?
hints:
- level: 1
  en: The average translational kinetic energy is three halves times the Boltzmann constant times the temperature.
- level: 2
  en: Multiply the constant by the absolute temperature first.
- level: 3
  en: Express the result in the power of ten that the question requests.
