role: recall
stem:
  en: Oxygen has molar mass 0.032 kg/mol. Using R = 8.31 J/mol K, what is the rms speed of its molecules at 300 K in metres per second, to the nearest metre per second?
hints:
- level: 1
  en: The rms speed squared equals three times R times T over the molar mass.
- level: 2
  en: Compute the numerator and the denominator separately.
- level: 3
  en: Take the square root last.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '483'
  accept: []
solution_steps:
- en: The rms speed is the square root of 3 R T divided by M, which is the square root of 7479 / 0.032, about 483 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 483
tier: C
