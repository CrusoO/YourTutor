stem:
  en: 0.5 mol of a monatomic ideal gas is cooled from 400 K to 300 K. Using R = 8.31 J/mol K, what is the change in its internal energy in joules, to the nearest joule?
hints:
- level: 1
  en: The internal energy change of an ideal gas depends only on the temperature change.
- level: 2
  en: Use three halves times the moles times the gas constant times the temperature change.
- level: 3
  en: Keep the sign negative because the gas is cooling.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-623'
  accept: []
solution_steps:
- en: Delta U = 1.5 times 0.5 times 8.31 times (300 - 400) = -623.25 J, which rounds to -623 J.
- en: The unit of the answer is J.
- en: Answer = -623
tier: C
