id: A.11.physics.kinetic_theory.mean_free_path.05
skill_ids:
- SK.A.11.physics.mean_free_path
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: At fixed temperature and number density, the molecular diameter is doubled. How does the mean free path change?
hints:
- level: 1
  en: The collision cross-section scales with the square of the diameter.
- level: 2
  en: The mean free path is inversely proportional to that cross-section.
- level: 3
  en: Use the square of the size ratio.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it stays unchanged
- id: b
  en: it halves
- id: c
  en: it becomes one quarter of its original value
- id: d
  en: it doubles
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.F18723B840C8
  when_answer_equals:
  - d
- id: MC.A.9612D93EE2DF
  when_answer_equals:
  - b
- id: MC.A.A1EF22552A16
  when_answer_equals:
  - a
solution_steps:
- en: The mean free path is inversely proportional to the collision cross-section, which goes as the square of the diameter.
- en: Doubling the diameter therefore divides the mean free path by four.
- en: The correct option is c.
tier: C
