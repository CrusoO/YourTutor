difficulty: 0.9
pool: practice
role: transfer
stem:
  en: 'At very low temperature, the rotational contribution to the heat capacity of a diatomic gas is:'
hints:
- level: 1
  en: Energy levels are quantised, so some modes need a minimum energy to be excited.
- level: 2
  en: Compare the thermal energy available with the spacing of the rotational levels.
- level: 3
  en: At low temperature there is little thermal energy to excite these levels.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: doubled compared with the high-temperature value
- id: b
  en: fully present at the classical value
- id: c
  en: larger than at high temperature
- id: d
  en: almost absent because rotation is frozen out
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.9FEB074B5B65
  when_answer_equals:
  - b
- id: MC.A.7E3CA22856F9
  when_answer_equals:
