answer:
  sympy: '7479'
  accept: []
solution_steps:
- en: A monatomic ideal gas has U = 3/2 n R T, so U = 1.5 times 2 times 8.31 times 300 = 7479 J.
- en: The unit of the answer is J.
- en: Answer = 7479
