stem:
  en: Find the internal energy in joules of 2 mol of a monatomic ideal gas at 300 K, using R = 8.31 J/mol K. Give the result to the nearest joule.
hints:
- level: 1
  en: A monatomic gas has three translational degrees of freedom, each contributing half of k T per molecule.
- level: 2
  en: The internal energy is three halves of n times R times T.
- level: 3
  en: Multiply the factor, the moles, the gas constant and the temperature.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
