stem:
  en: A diatomic ideal gas has five active degrees of freedom. For one mole, the internal energy equals a number times R times T. What is that number?
hints:
- level: 1
  en: Each active degree of freedom contributes one half of R T per mole.
- level: 2
  en: Multiply the count of active degrees by one half.
- level: 3
  en: The temperature does not appear in the coefficient itself.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2.5'
  accept: []
solution_steps:
- en: Each active degree of freedom contributes one half R T per mole, so five of them give 5/2 R T, a coefficient of 2.5.
- en: Answer = 2.5
tier: C
