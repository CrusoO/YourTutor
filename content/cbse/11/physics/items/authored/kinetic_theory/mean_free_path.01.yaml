id: A.11.physics.kinetic_theory.mean_free_path.01
skill_ids:
- SK.A.11.physics.mean_free_path
difficulty: 0.2
pool: practice
role: recall
stem:
  en: 'The mean free path of gas molecules is the average distance a molecule travels between:'
hints:
- level: 1
  en: The distance is measured between collision events, not from the wall.
- level: 2
  en: Think about how often a molecule bumps into its neighbours.
- level: 3
  en: It is a path length between interactions.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: changes in direction caused by gravity
- id: b
  en: successive collisions with other molecules
- id: c
  en: two points on the same wall
- id: d
  en: collisions with the container walls only
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.DCD14E29F015
  when_answer_equals:
  - d
- id: MC.A.2B4A5EFE1CA0
  when_answer_equals:
  - c
- id: MC.A.86A7AE8C9533
  when_answer_equals:
  - a
solution_steps:
- en: The mean free path is the average distance a molecule moves between successive collisions with other molecules in the gas.
- en: The correct option is b.
tier: C
