role: recall
stem:
  en: A point mass of 2 kg is 3 m from an axis of rotation. What is its moment of inertia about that axis in kg m^2?
hints:
- level: 1
  en: The moment of inertia of a point mass is its mass times the square of its distance from the axis.
- level: 2
  en: Square the distance first.
- level: 3
  en: Multiply that result by the mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '18'
  accept: []
solution_steps:
- en: For a point mass, I = m r^2 = 2 times 9 = 18 kg m^2.
- en: The unit of the answer is kg m^2.
- en: Answer = 18
tier: C
diagram_note: An axis drawn as a vertical line with a dot 3 m away from it to the right, labelled with its mass of 2 kg.
