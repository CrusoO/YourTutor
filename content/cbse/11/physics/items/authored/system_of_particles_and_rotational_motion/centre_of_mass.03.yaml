type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: The sum of m x is 0 + 4 + 8 = 12, and the total mass is 4 kg.
- en: The centre of mass is at x = 3 m.
- en: The unit of the answer is m.
- en: Answer = 3
