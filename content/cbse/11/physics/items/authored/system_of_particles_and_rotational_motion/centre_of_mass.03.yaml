stem:
  en: Particles of masses 2 kg, 1 kg and 1 kg lie at x = 0 m, 4 m and 8 m on a straight line. What is the x coordinate of the centre of mass in metres?
hints:
- level: 1
  en: Multiply each mass by its position and add those products.
- level: 2
  en: Divide that sum by the sum of all the masses.
- level: 3
  en: Keep the units consistent throughout the calculation.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
