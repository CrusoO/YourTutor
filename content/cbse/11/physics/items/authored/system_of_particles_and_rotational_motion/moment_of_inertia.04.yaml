stem:
  en: For bodies of the same mass and radius, which has the largest moment of inertia about an axis through its centre?
hints:
- level: 1
  en: Compare how far the mass sits from the axis in each shape.
- level: 2
  en: A ring has all of its mass at the same radius.
- level: 3
  en: A solid disc has some of its mass close to the axis.
