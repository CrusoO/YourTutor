difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A solid sphere rolls without slipping down an incline from rest through a vertical height of 7 m. Taking g = 9.8 m/s^2, what is its speed at the bottom in metres per second?
hints:
- level: 1
  en: All of the energy is potential energy at the top.
- level: 2
  en: The rotational energy adds a fixed fraction of the translational energy.
- level: 3
  en: For a solid sphere the moment of inertia is two fifths of m R^2.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '9.9'
  accept: []
solution_steps:
- en: Energy gives m g h = one half m v^2 times (1 + 2/5), so v^2 = g h / 0.7 = 98 and v is about 9.9 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 9.9
tier: C
