stem:
  en: A solid sphere rolls down an incline without slipping. What fraction of its total kinetic energy is rotational?
hints:
- level: 1
  en: Compare the rotational energy with the translational energy term by term.
- level: 2
  en: The rotational part is a fixed fraction of the translational part, set by the moment of inertia.
- level: 3
  en: Write the total as a sum and take the ratio of the rotational part to it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
