  original: true
  author: model-draft
type: numeric
answer:
  sympy: '9'
  accept: []
solution_steps:
- en: Translational energy is one half times 3 times 4 = 6 J.
- en: The rotational energy is one half of that for a solid cylinder, giving 3 J.
- en: The total is 9 J.
- en: The unit of the answer is J.
- en: Answer = 9
