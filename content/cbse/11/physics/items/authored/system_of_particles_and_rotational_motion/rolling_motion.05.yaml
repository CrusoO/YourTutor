stem:
  en: A solid cylinder of mass 3 kg and radius 0.2 m rolls without slipping along a horizontal floor at 2 m/s. What is its total kinetic energy in joules?
hints:
- level: 1
  en: Translational energy is one half times mass times speed squared.
- level: 2
  en: For a solid cylinder the rotational energy is one half of the translational energy.
- level: 3
  en: Add the translational and rotational parts together.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
