stem:
  en: A 20 N force acts at 30 degrees to a 0.6 m rod pivoted at one end, applied at the free end. What is the torque about the pivot in newton metres?
hints:
- level: 1
  en: Only the component of the force perpendicular to the rod produces torque.
- level: 2
  en: Use the sine of the angle between the force and the rod.
- level: 3
  en: Multiply the length, the force and that sine factor.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: Only the component of force perpendicular to the rod gives torque, so tau = r F sin 30 degrees = 0.6 times 20 times 0.5 = 6 N m.
- en: The unit of the answer is N m.
- en: Answer = 6
tier: C
