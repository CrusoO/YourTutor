stem:
  en: A rigid body experiences zero net torque about an axis. Which quantity is conserved about that axis?
hints:
- level: 1
  en: Compare the role of net torque in rotation with the role of net force in linear motion.
- level: 2
  en: The rate at which the rotational analogue of momentum changes is set by the net torque.
- level: 3
  en: Look for the rotational quantity that stays fixed when no net torque acts.
