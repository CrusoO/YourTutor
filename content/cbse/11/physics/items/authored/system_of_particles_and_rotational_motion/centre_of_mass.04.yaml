stem:
  en: Where is the centre of mass of a uniform circular ring?
hints:
- level: 1
  en: Symmetry places the centre where the ring has no preferred side.
- level: 2
  en: The centre of mass of a symmetric body lies at its middle.
- level: 3
  en: Look for the point that is equally far from every part of the ring.
