id: A.11.physics.system_of_particles_and_rotational_motion.centre_of_mass.02
skill_ids:
- SK.A.11.physics.centre_of_mass
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Two particles of masses 1 kg and 3 kg are placed 8 m apart on a line. How far is the centre of mass from the 1 kg particle, in metres?
hints:
- level: 1
  en: Weight each position by its mass.
- level: 2
  en: Use the mass of the other particle as the lever arm.
- level: 3
  en: Divide the total moment by the total mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: The centre of mass is at (1 times 0 + 3 times 8) divided by 4, which is 6 m from the 1 kg particle.
- en: The unit of the answer is m.
- en: Answer = 6
tier: C
diagram_note: A horizontal line with a 1 kg point on the left and a 3 kg point on the right, 8 m apart. A cross marks the centre of mass between them.
