id: A.11.physics.system_of_particles_and_rotational_motion.centre_of_mass.06
skill_ids:
- SK.A.11.physics.centre_of_mass
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A uniform rod of mass 4 kg and length 2 m has a 2 kg particle attached to one end. Measured from the free end of the rod, where is the centre of mass in metres, to two decimal places?
hints:
- level: 1
  en: The rod's own mass can be treated as acting at its middle point.
- level: 2
  en: Weight the two positions by their masses.
- level: 3
  en: Divide the weighted sum by the total mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.33'
  accept: []
solution_steps:
- en: The rod's mass acts at its middle, 1 m from the free end, and the particle is at 2 m.
- en: The centre of mass is (4 times 1 + 2 times 2) divided by 6, which is about 1.33 m.
- en: The unit of the answer is m.
- en: Answer = 1.33
tier: C
diagram_note: A horizontal rod, 2 m long, with its left end labelled as the free end and its right end carrying a small 2 kg mass. The centre of the rod is marked at its middle.
