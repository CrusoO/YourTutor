stem:
  en: A 10 N force acts perpendicular to a wrench handle 0.5 m long, applied at its far end. What is the torque in newton metres?
hints:
- level: 1
  en: Torque is the force multiplied by the perpendicular lever arm.
- level: 2
  en: Here the force is perpendicular to the handle, so the arm is the full length of the handle.
- level: 3
  en: Multiply the force by the arm.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
