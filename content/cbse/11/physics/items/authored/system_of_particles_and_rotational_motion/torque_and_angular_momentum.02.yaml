type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: Torque is force times the perpendicular lever arm.
- en: The force is perpendicular, so the arm is the full 0.5 m, giving 10 times 0.5 = 5 N m.
- en: The unit of the answer is N m.
- en: Answer = 5
tier: C
diagram_note: A wrench with a pivot at one end and a handle of length 0.5 m. An arrow of 10 N points perpendicular to the handle at its far end.
