stem:
  en: A solid uniform disc of mass 4 kg and radius 0.5 m rotates about an axis through its centre, perpendicular to its plane. What is its moment of inertia in kg m^2?
hints:
- level: 1
  en: Use the formula for a solid disc about its central axis.
- level: 2
  en: Square the radius before using it in the formula.
- level: 3
  en: Multiply the mass by the squared radius, then halve the result.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.5'
  accept: []
solution_steps:
- en: For a solid disc about its central axis, I = M R^2 / 2 = 4 times 0.25 / 2 = 0.5 kg m^2.
- en: The unit of the answer is kg m^2.
- en: Answer = 0.5
tier: C
diagram_note: A circle drawn in perspective with its centre marked. A line through the centre perpendicular to the disc marks the axis, and the radius is labelled.
