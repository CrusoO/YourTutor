stem:
  en: A solid sphere and a hollow sphere have the same mass and radius. Each rotates about a diameter. Which has the larger moment of inertia?
hints:
- level: 1
  en: Moment of inertia depends on how the mass is spread out relative to the axis.
- level: 2
  en: Compare how much of each sphere's mass lies far from its centre.
- level: 3
  en: In a hollow sphere the mass sits near the outer surface.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the solid sphere
- id: b
  en: they are equal
- id: c
  en: it depends on their angular speed
- id: d
  en: the hollow sphere
answer:
  sympy: d
  accept: []
