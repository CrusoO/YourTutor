difficulty: 0.6
pool: practice
role: apply
stem:
  en: A solid cylinder and a hollow cylinder of the same mass and radius are released from rest at the top of an incline and roll down without slipping. Which one reaches the bottom first?
hints:
- level: 1
  en: Compare the moments of inertia of the two cylinders.
- level: 2
  en: A smaller share of energy stored in rotation leaves more for translation.
- level: 3
  en: Lower moment of inertia means the body accelerates more easily down the slope.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: they arrive at the same time
- id: b
  en: it depends only on the mass
- id: c
  en: the hollow cylinder
- id: d
  en: the solid cylinder
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.A1F56C850F17
  when_answer_equals:
  - c
- id: MC.A.97E54AF0E899
  when_answer_equals:
