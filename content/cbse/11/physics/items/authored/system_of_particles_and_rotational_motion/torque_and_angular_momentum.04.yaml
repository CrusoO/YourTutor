stem:
  en: A particle of mass 2 kg moves at 3 m/s in a circle of radius 4 m. What is its angular momentum about the centre, in kg m^2/s?
hints:
- level: 1
  en: Angular momentum of a particle is its mass times velocity times the perpendicular distance.
- level: 2
  en: The velocity is perpendicular to the radius in circular motion.
- level: 3
  en: Multiply the three quantities and keep track of the units.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
