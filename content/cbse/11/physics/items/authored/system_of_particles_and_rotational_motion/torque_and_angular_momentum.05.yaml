stem:
  en: A 4 N force acts on a particle at a point 2 m from a pivot. The line of the force makes 150 degrees with the position vector from the pivot. What is the magnitude of the torque in newton metres?
hints:
- level: 1
  en: Torque magnitude is the product of the distance, the force and a sine of the angle between them.
- level: 2
  en: The sine of an obtuse angle matches the sine of its supplement.
- level: 3
  en: Multiply the magnitudes, then multiply by the sine of the angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: The torque magnitude is r F sin theta.
- en: With r = 2 m, F = 4 N and sin 150 degrees = 0.5, the torque is 4 N m.
- en: The unit of the answer is N m.
- en: Answer = 4
tier: C
diagram_note: A pivot at the origin with a position vector drawn to a point. From that point a force arrow of 4 N leaves at 150 degrees to the position vector.
