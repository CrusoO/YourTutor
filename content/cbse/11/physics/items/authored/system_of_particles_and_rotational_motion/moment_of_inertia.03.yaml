stem:
  en: What is the moment of inertia in kg m^2 of a uniform rod of mass 6 kg and length 2 m about an axis through its centre, perpendicular to its length?
hints:
- level: 1
  en: Use the standard result for a thin rod about an axis through its centre.
- level: 2
  en: Square the length of the rod.
- level: 3
  en: Multiply by the mass and divide by twelve.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The standard result for a thin uniform rod about its centre is M L^2 / 12.
- en: That gives 6 times 4 / 12 = 2 kg m^2.
- en: The unit of the answer is kg m^2.
- en: Answer = 2
tier: C
