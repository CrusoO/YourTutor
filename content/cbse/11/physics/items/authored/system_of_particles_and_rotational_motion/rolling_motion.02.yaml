id: A.11.physics.system_of_particles_and_rotational_motion.rolling_motion.02
skill_ids:
- SK.A.11.physics.rolling_motion
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A ring of mass 2 kg rolls without slipping with its centre moving at 4 m/s. What is its total kinetic energy in joules?
hints:
- level: 1
  en: Rolling without slipping links the rotation to the translation.
- level: 2
  en: Translational energy is one half times mass times speed squared.
- level: 3
  en: For a ring the rotational energy equals the translational energy.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '32'
  accept: []
solution_steps:
- en: For a ring, I = M R^2, and rolling gives omega = v / R, so the rotational energy equals the translational energy.
- en: The total is M v^2 = 2 times 16 = 32 J.
- en: The unit of the answer is J.
- en: Answer = 32
tier: C
diagram_note: A ring rolling on a horizontal floor, with its centre marked, a velocity arrow pointing right from the centre, and a curved arrow showing the rotation.
