stem:
  en: A steel wire of original length 2 m is stretched by 0.5 mm. What is its longitudinal strain, written as a plain decimal?
hints:
- level: 1
  en: Strain is the change in length divided by the original length.
- level: 2
  en: Convert the millimetres to metres before dividing.
- level: 3
  en: Divide the extension by the original length once both are in metres.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.00025'
  accept: []
solution_steps:
- en: Strain is the change in length divided by the original length.
- en: With 0.5 mm = 0.0005 m, the strain is 0.0005 / 2 = 0.00025.
- en: Answer = 0.00025
