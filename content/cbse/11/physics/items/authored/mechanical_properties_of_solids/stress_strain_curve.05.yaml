id: A.11.physics.mechanical_properties_of_solids.stress_strain_curve.05
skill_ids:
- SK.A.11.physics.stress_strain_curve
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A material follows a straight stress-strain line up to a stress of 400 MPa at a strain of 0.002. What is the stored elastic energy per unit volume, in kilojoules per cubic metre?
hints:
- level: 1
  en: The energy stored equals the area under the linear stress-strain graph.
- level: 2
  en: The area of a triangle is half of base times height.
- level: 3
  en: Multiply stress by strain and then halve the product.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '400'
  accept: []
solution_steps:
- en: The energy per unit volume is the triangular area under the line, one half times 400 MPa times 0.002, which is 0.4 MJ/m^3, or 400 kJ/m^3.
- en: The unit of the answer is kJ/m^3.
- en: Answer = 400
tier: C
diagram_note: A stress-strain line from the origin up to a point at a strain of 0.002 and a stress of 400 MPa, with the triangle under the line shaded.
