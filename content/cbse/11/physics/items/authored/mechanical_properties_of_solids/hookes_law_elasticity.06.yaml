stem:
  en: A wire obeying Hooke's law is pulled with the same force, but its length is doubled and its radius is doubled. How does its extension change?
hints:
- level: 1
  en: The extension depends on the length in the numerator.
- level: 2
  en: The cross-sectional area depends on the square of the radius.
- level: 3
  en: Compare the length factor with the area factor.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: halves
- id: b
  en: doubles
- id: c
  en: stays the same
- id: d
  en: becomes four times as large
answer:
  sympy: a
  accept: []
misconception_rules:
