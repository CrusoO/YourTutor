id: A.11.physics.mechanical_properties_of_solids.stress_and_strain.06
skill_ids:
- SK.A.11.physics.stress_and_strain
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A material follows a straight stress-strain line up to a stress of 200 MPa. Its Young's modulus is 200 GPa. What is the strain at that stress, as a plain decimal?
hints:
- level: 1
  en: Young's modulus is the ratio of stress to strain.
- level: 2
  en: Rearrange the modulus relation to isolate the strain.
- level: 3
  en: Put both stress and modulus in pascals before dividing.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.001'
  accept: []
solution_steps:
- en: Young's modulus is stress divided by strain, so the strain is 200 MPa / 200 GPa = 200 times 10^6 / 200 times 10^9 = 0.001.
- en: Answer = 0.001
tier: C
