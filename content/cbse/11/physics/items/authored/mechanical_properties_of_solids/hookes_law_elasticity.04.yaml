stem:
  en: Two identical springs, each of stiffness k, are joined end to end in series. What is the effective stiffness of the combination?
hints:
- level: 1
  en: In series, the same force passes through each spring.
- level: 2
  en: The total extension is the sum of the extensions of the two springs.
- level: 3
  en: Stiffness is the reciprocal of the total flexibility.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
