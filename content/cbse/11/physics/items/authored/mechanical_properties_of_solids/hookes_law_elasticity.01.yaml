id: A.11.physics.mechanical_properties_of_solids.hookes_law_elasticity.01
skill_ids:
- SK.A.11.physics.hookes_law_elasticity
difficulty: 0.2
pool: practice
role: recall
stem:
  en: 'According to Hooke''s law, within the elastic limit, the extension of a spring is:'
hints:
- level: 1
  en: The law describes a linear relationship.
- level: 2
  en: Plot the extension against the load to visualise it.
- level: 3
  en: Look for a straight line passing through the origin on that graph.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: independent of the applied force
- id: b
  en: proportional to the applied force
- id: c
  en: inversely proportional to the applied force
- id: d
  en: proportional to the square of the applied force
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.7E39CBF7B53A
  when_answer_equals:
  - c
- id: MC.A.E8ED50BAF125
  when_answer_equals:
  - a
- id: MC.A.9480BD8AB925
  when_answer_equals:
  - d
solution_steps:
- en: Hooke's law states that within the elastic limit the extension is directly proportional to the applied force, so the graph is a straight line through the origin.
- en: The correct option is b.
tier: C
