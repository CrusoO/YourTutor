difficulty: 0.2
pool: practice
role: recall
stem:
  en: A spring of spring constant 200 N/m is stretched by 0.05 m. What force in newtons is needed?
hints:
- level: 1
  en: Hooke's law says the force equals the constant times the extension.
- level: 2
  en: Multiply the spring constant by the extension.
- level: 3
  en: Keep the units consistent, with newtons per metre multiplied by metres.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10'
  accept: []
solution_steps:
- en: Hooke's law gives F = k x = 200 times 0.05 = 10 N.
- en: The unit of the answer is N.
- en: Answer = 10
tier: C
diagram_note: A helical spring hanging vertically from a fixed support with a mass attached at its lower end. The extension beyond the natural length is marked on the spring.
