difficulty: 0.2
pool: practice
role: recall
stem:
  en: A force of 20 N acts uniformly over a cross-sectional area of 0.5 m^2. What is the stress in pascals?
hints:
- level: 1
  en: Stress equals force divided by the area it acts over.
- level: 2
  en: Divide the force by the area directly.
- level: 3
  en: The result is in pascals with no further conversion.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '40'
  accept: []
solution_steps:
- en: Stress is force divided by area, which is 20 / 0.5 = 40 Pa.
- en: The unit of the answer is Pa.
- en: Answer = 40
tier: C
