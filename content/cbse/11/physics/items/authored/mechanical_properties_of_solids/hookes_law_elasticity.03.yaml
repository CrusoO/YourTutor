difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A wire of cross-sectional area 1 times 10^-6 m^2 and length 2 m is stretched by 1 mm under a load of 100 N. What is its Young's modulus in gigapascals?
hints:
- level: 1
  en: Young's modulus is stress divided by strain.
- level: 2
  en: Compute the stress from the load and the area, and the strain from the extension and the length.
- level: 3
  en: Convert the final answer from pascals to gigapascals.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '200'
  accept: []
solution_steps:
- en: Stress is 100 / 10^-6 = 10^8 Pa and strain is 0.001 / 2 = 5 times 10^-4.
- en: Young's modulus is 2 times 10^11 Pa, which is 200 GPa.
- en: The unit of the answer is GPa.
- en: Answer = 200
tier: C
