id: A.11.physics.mechanical_properties_of_solids.stress_strain_curve.03
skill_ids:
- SK.A.11.physics.stress_strain_curve
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: On a stress-strain graph, the straight line from the origin reaches a stress of 150 MPa at a strain of 0.001. What is the Young's modulus in gigapascals?
hints:
- level: 1
  en: Use modulus equals stress over strain at any point on the straight part.
- level: 2
  en: Convert megapascals to gigapascals by dividing by one thousand.
- level: 3
  en: Divide the stress by the strain first, then convert the units.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '150'
  accept: []
solution_steps:
- en: Young's modulus is stress over strain, which is 150 MPa / 0.001 = 150000 MPa, equal to 150 GPa.
- en: The unit of the answer is GPa.
- en: Answer = 150
tier: C
