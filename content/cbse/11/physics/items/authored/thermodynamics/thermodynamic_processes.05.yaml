stem:
  en: Two moles of an ideal monatomic gas are cooled at constant pressure from 400 K to 300 K. Its molar heat capacity at constant pressure is 2.5 R, with R = 8.31 J/mol K. How many joules of heat are removed?
hints:
- level: 1
  en: At constant pressure, the heat exchanged equals moles times molar heat capacity times the temperature change.
- level: 2
  en: The molar heat capacity at constant pressure is given in the question.
- level: 3
  en: Multiply the moles, the heat capacity factor, the gas constant and the temperature change, then report the magnitude.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4155'
  accept: []
solution_steps:
- en: At constant pressure the heat exchanged is n Cp delta T = 2 times 2.5 times 8.31 times 100 = 4155 J.
- en: The gas gives this amount up while it cools.
- en: The unit of the answer is J.
- en: Answer = 4155
tier: C
