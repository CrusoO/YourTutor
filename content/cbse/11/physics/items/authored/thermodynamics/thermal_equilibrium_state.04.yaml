difficulty: 0.6
pool: practice
role: apply
stem:
  en: Two systems are in thermal equilibrium with each other. What do they have in common?
hints:
- level: 1
  en: Equilibrium means no net heat flows between the two systems.
- level: 2
  en: Think about the quantity that decides the direction of heat flow.
- level: 3
  en: Equal values of the intensive quantity that controls heat flow decide equilibrium.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the same internal energy
- id: b
  en: the same temperature
- id: c
  en: the same volume
- id: d
  en: equal heat capacities
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.F689A02AAB98
  when_answer_equals:
  - a
- id: MC.A.0A1337A8C9B0
  when_answer_equals:
