difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which thermodynamic process involves zero work done by the gas?
hints:
- level: 1
  en: Work is pressure times a volume change in many processes.
- level: 2
  en: Check which process keeps the volume unchanged.
- level: 3
  en: If the volume does not change, the area under the P-V curve has no width.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: isochoric process
- id: b
  en: isothermal process
- id: c
  en: isobaric process
- id: d
  en: adiabatic process
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.E25249D65822
  when_answer_equals:
  - b
- id: MC.A.3F159737EE87
  when_answer_equals:
