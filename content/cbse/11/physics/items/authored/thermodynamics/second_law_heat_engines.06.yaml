stem:
  en: A Carnot refrigerator operates between a cold reservoir at 250 K and a hot reservoir at 300 K. What is its coefficient of performance?
hints:
- level: 1
  en: The coefficient of performance of a refrigerator puts the cold temperature in the numerator.
- level: 2
  en: The denominator is the temperature gap between the two reservoirs.
- level: 3
  en: Use absolute temperatures in kelvin, not degrees Celsius.
