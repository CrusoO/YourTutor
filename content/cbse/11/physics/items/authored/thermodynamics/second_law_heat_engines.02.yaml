difficulty: 0.2
pool: practice
role: recall
stem:
  en: A heat engine absorbs 500 J of heat each cycle and does 150 J of work. What is its efficiency as a percentage?
hints:
- level: 1
  en: Efficiency is useful work output divided by heat input.
- level: 2
  en: Divide the work by the heat absorbed.
- level: 3
  en: Multiply the fraction by one hundred to get a percentage.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '30'
  accept: []
solution_steps:
- en: Efficiency is work out divided by heat in, so 150 / 500 = 0.30, which is 30 percent.
- en: The unit of the answer is %.
- en: Answer = 30
tier: C
diagram_note: A block representing the engine, with an arrow of heat entering from a hot reservoir, an arrow of work leaving, and a second arrow of heat rejected to a cold reservoir.
