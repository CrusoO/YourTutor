stem:
  en: A Carnot engine operates between a hot reservoir at 500 K and a cold reservoir at 300 K. What is its efficiency as a percentage?
hints:
- level: 1
  en: Carnot efficiency depends only on the two absolute temperatures.
- level: 2
  en: Divide the cold temperature by the hot temperature.
- level: 3
  en: Subtract that ratio from one, then convert to a percentage.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '40'
  accept: []
solution_steps:
- en: The Carnot efficiency is 1 - T_cold / T_hot = 1 - 300/500 = 0.4, which is 40 percent.
- en: The unit of the answer is %.
- en: Answer = 40
