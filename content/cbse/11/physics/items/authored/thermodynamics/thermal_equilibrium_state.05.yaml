stem:
  en: An ideal monatomic gas sample of 0.2 mol has internal energy 1.5 n R T. Using R = 8.31 J/mol K, what is the change in its internal energy in joules, to the nearest joule, when its temperature rises from 300 K to 400 K?
hints:
- level: 1
  en: For an ideal monatomic gas, the internal energy depends only on the temperature.
- level: 2
  en: Multiply the factor three halves, the moles, the gas constant and the temperature change.
- level: 3
  en: Keep the moles and the gas constant in consistent units.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '249'
  accept: []
solution_steps:
- en: The change is 1.5 times 0.2 times 8.31 times 100 = 249.3 J, which rounds to 249 J.
- en: The unit of the answer is J.
- en: Answer = 249
tier: C
