id: A.11.physics.thermodynamics.first_law.02
skill_ids:
- SK.A.11.physics.first_law
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A gas absorbs 300 J of heat and does 120 J of work on its surroundings. Taking work done by the gas as positive, what is the change in its internal energy in joules?
hints:
- level: 1
  en: Apply the first law with heat received as positive and work done by the gas as positive.
- level: 2
  en: Subtract the work done by the system from the heat received.
- level: 3
  en: Keep the sign of the result.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '180'
  accept: []
solution_steps:
- en: Using delta U = Q - W with Q = 300 J and W = 120 J gives delta U = 180 J.
- en: The unit of the answer is J.
- en: Answer = 180
tier: C
diagram_note: A cylinder with a piston containing a gas. An arrow shows heat entering the gas from a flame below, and another arrow shows work leaving the piston upward.
