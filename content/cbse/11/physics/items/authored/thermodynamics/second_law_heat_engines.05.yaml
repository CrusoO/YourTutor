difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A heat engine has efficiency 25 percent and produces 200 J of work per cycle. How many joules of heat are rejected to the cold reservoir each cycle?
hints:
- level: 1
  en: The work output equals efficiency times the heat input.
- level: 2
  en: Find the heat input first, then subtract the work to get the rejected heat.
- level: 3
  en: Energy conservation links the heat input, the work output and the rejected heat.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '600'
  accept: []
solution_steps:
- en: The heat input is 200 / 0.25 = 800 J.
- en: The rejected heat is 800 - 200 = 600 J.
- en: The unit of the answer is J.
- en: Answer = 600
tier: C
diagram_note: An energy flow diagram. Heat input arrow goes into the engine from the hot reservoir, a work output arrow leaves the engine, and a heat rejected arrow goes down to the cold reservoir.
