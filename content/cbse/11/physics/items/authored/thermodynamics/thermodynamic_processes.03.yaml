stem:
  en: An ideal gas is compressed adiabatically, and 200 J of work is done on it. What is the change in its internal energy in joules?
hints:
- level: 1
  en: No heat enters or leaves the gas in an adiabatic process.
- level: 2
  en: Apply the first law with the heat term set to zero.
- level: 3
  en: Work done on the gas increases its internal energy.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
