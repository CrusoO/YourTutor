id: A.11.physics.motion_in_a_plane.projectile_motion.02
skill_ids:
- SK.A.11.physics.projectile_motion
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A ball is thrown horizontally from the top of a building 19.6 m high. Taking g = 9.8 m/s^2, how many seconds does it take to reach the ground?
hints:
- level: 1
  en: Vertical motion starts with zero vertical velocity for a horizontal throw.
- level: 2
  en: Use the displacement equal to half of g times time squared.
- level: 3
  en: Solve for the time from the height, then take the square root.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The vertical motion starts from zero vertical velocity, so 19.6 = 0.5 times 9.8 times t squared.
- en: This gives t^2 = 4 and t = 2 s.
- en: The unit of the answer is s.
- en: Answer = 2
tier: C
diagram_note: A side view of a building edge with a horizontal arrow leaving the top. A vertical dimension line marks the height from the top down to the ground.
