role: recall
stem:
  en: Vector P has components (4, 0) and vector Q has components (0, 3), both in metres. What is the magnitude of P plus Q?
hints:
- level: 1
  en: Add the x-components together and the y-components together.
- level: 2
  en: The resultant of two perpendicular components is the diagonal of a rectangle.
- level: 3
  en: Square each component, add the squares, and take the square root.
