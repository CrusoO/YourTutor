id: A.11.physics.motion_in_a_plane.relative_velocity_2d.02
skill_ids:
- SK.A.11.physics.relative_velocity_2d
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Rain falls vertically at 12 m/s. A cyclist rides east at 5 m/s. What is the speed of the rain as seen by the cyclist, in metres per second?
hints:
- level: 1
  en: The cyclist sees the rain moving both downward and backward.
- level: 2
  en: Draw the two perpendicular velocity components of the rain relative to the cyclist.
- level: 3
  en: Find the hypotenuse of the right triangle those components form.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '13'
  accept: []
solution_steps:
- en: Relative to the cyclist, the rain has a horizontal component of 5 m/s backward and a vertical component of 12 m/s.
- en: The magnitude is the square root of 25 plus 144, which is 13 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 13
tier: C
diagram_note: A right triangle. One leg is vertical and labelled 12 m/s for the rain. The other leg is horizontal and labelled 5 m/s for the cyclist. The hypotenuse is the apparent velocity of the rain.
