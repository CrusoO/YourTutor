solution_steps:
- en: The relative velocity is (6, 0) minus (0, 8), which is (6, -8).
- en: Its magnitude is the square root of 36 plus 64, which is 10 m/s.
- en: The correct option is b.
tier: C
diagram_note: Two velocity arrows from a common origin, one along the horizontal axis and one along the vertical axis, with the relative velocity drawn as a third arrow forming a right triangle.
