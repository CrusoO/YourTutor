difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Particle one moves with velocity (6, 0) m/s and particle two moves with velocity (0, 8) m/s. What is the magnitude of the velocity of particle one relative to particle two?
hints:
- level: 1
  en: Subtract the second velocity from the first, component by component.
- level: 2
  en: The magnitude of the result is the hypotenuse of a right triangle.
- level: 3
  en: Square the components, add them, then take the square root.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
