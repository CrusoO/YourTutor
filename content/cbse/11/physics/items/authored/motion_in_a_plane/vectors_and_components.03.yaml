stem:
  en: A displacement of 5 m east is followed by a displacement of 12 m north. What is the magnitude of the total displacement in metres?
hints:
- level: 1
  en: Treat east and north as two perpendicular axes.
- level: 2
  en: The total displacement is the hypotenuse of a right triangle.
- level: 3
  en: Square each leg, add them, then take the square root.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
