stem:
  en: Which launch angle gives the maximum horizontal range for a projectile launched from ground level, ignoring air resistance?
hints:
- level: 1
  en: The range depends on the product of the sine and cosine of the launch angle.
- level: 2
  en: Write that product as half of the sine of twice the angle.
- level: 3
  en: Find the angle that makes that sine as large as possible.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
