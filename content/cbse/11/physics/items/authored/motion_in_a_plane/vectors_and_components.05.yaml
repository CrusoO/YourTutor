stem:
  en: Two forces of 3 N each act at a point, with an angle of 120 degrees between their directions. What is the magnitude of the resultant in newtons?
hints:
- level: 1
  en: Use the law of cosines for the resultant of two vectors.
- level: 2
  en: The cosine of 120 degrees is negative, which reduces the resultant.
- level: 3
  en: Compute the squared resultant first, then take the square root.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: Using the law of cosines, R squared equals 9 + 9 + 2 times 9 times cos 120 degrees, which is 18 minus 9 = 9.
- en: So R = 3 N.
- en: The unit of the answer is N.
- en: Answer = 3
tier: C
diagram_note: A single point with two arrows of equal length leaving it at 120 degrees to each other. A dashed line shows their resultant as the diagonal of the shape they form.
