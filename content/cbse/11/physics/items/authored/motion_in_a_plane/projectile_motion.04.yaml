id: A.11.physics.motion_in_a_plane.projectile_motion.04
skill_ids:
- SK.A.11.physics.projectile_motion
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A projectile is launched at 20 m/s at 30 degrees above the horizontal. Taking g = 9.8 m/s^2, what is its maximum height in metres, to one decimal place?
hints:
- level: 1
  en: Only the vertical part of the launch velocity raises the projectile.
- level: 2
  en: Find the vertical component using the sine of the launch angle.
- level: 3
  en: Use the vertical speed relation where the final vertical velocity is zero at the top.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5.1'
  accept: []
solution_steps:
- en: The maximum height is (20 sin 30)^2 divided by 2 times 9.8, which is 100 divided by 19.6, about 5.1 m.
- en: The unit of the answer is m.
- en: Answer = 5.1
tier: C
