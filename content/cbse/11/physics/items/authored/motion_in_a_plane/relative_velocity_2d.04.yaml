difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Ship A moves at 8 m/s due north and ship B moves at 6 m/s due east, both measured from the shore. What is the speed of A relative to B, in metres per second?
hints:
- level: 1
  en: The relative velocity of A with respect to B is a vector difference.
- level: 2
  en: Treat north and east as two perpendicular components.
- level: 3
  en: The magnitude comes from the square root of the sum of the squares of the components.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10'
  accept: []
solution_steps:
- en: The relative velocity of A with respect to B is (0, 8) minus (6, 0), which is (-6, 8).
- en: Its magnitude is 10 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 10
tier: C
diagram_note: Arrows for north and east drawn from a common origin, with the relative velocity drawn from the tip of B's arrow to the tip of A's arrow, forming a right triangle.
