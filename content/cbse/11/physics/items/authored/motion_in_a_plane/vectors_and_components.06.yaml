stem:
  en: A vector has an x-component of 6 units and a y-component of 8 units. Measured from the positive x-axis, what is its direction, to one decimal place?
hints:
- level: 1
  en: The tangent of the angle equals the y-component divided by the x-component.
- level: 2
  en: Use the inverse tangent function on that ratio.
- level: 3
  en: Check that the angle lies in the first quadrant for positive components.
