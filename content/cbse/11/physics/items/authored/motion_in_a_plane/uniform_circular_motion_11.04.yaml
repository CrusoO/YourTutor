stem:
  en: A particle moves in a circle of radius 2 m and completes one revolution every 4 s. What is its speed?
hints:
- level: 1
  en: Speed in circular motion equals the distance covered divided by the time taken.
- level: 2
  en: The distance covered in one period is the circumference of the circle.
- level: 3
  en: Divide the circumference by the period.
