id: A.11.physics.motion_in_a_plane.uniform_circular_motion_11.02
skill_ids:
- SK.A.11.physics.uniform_circular_motion_11
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A car moves round a circular track of radius 50 m at a constant speed of 10 m/s. What is its centripetal acceleration in metres per second squared?
hints:
- level: 1
  en: Centripetal acceleration depends on the speed squared and the radius.
- level: 2
  en: Divide the square of the speed by the radius.
- level: 3
  en: Compute the speed squared before dividing.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The centripetal acceleration is v squared over r, which is 100 divided by 50, giving 2 m/s^2.
- en: The unit of the answer is m/s^2.
- en: Answer = 2
tier: C
diagram_note: A circle with the car marked on its circumference. A radius line runs from the centre to the car, and a velocity arrow touches the circle at that point, perpendicular to the radius.
