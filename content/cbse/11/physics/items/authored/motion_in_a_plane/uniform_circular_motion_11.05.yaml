difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A particle moves on a circle of radius 1.5 m at a constant speed of 6 m/s. Using pi as 3.14, how many seconds does it take to complete one revolution, to two decimal places?
hints:
- level: 1
  en: The time for one revolution equals the distance around the circle divided by the speed.
- level: 2
  en: The distance around the circle is two pi times the radius.
- level: 3
  en: Divide the circumference by the speed at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.57'
  accept: []
solution_steps:
- en: One revolution covers the circumference 2 pi r, which is 9.42 m.
- en: Dividing by the speed 6 m/s gives about 1.57 s.
- en: The unit of the answer is s.
- en: Answer = 1.57
tier: C
diagram_note: A circle of radius 1.5 m with its centre marked and a radius line labelled. A point on the circumference carries a tangential velocity arrow.
