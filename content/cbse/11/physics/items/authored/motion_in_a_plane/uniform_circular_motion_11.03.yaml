stem:
  en: A stone tied to a string of length 0.5 m moves in a horizontal circle, making 2 revolutions per second. Using pi as 3.14, what is its centripetal acceleration in metres per second squared, to one decimal place?
hints:
- level: 1
  en: Convert the revolutions per second into an angular speed first.
- level: 2
  en: Angular speed is two pi times the frequency.
- level: 3
  en: Centripetal acceleration equals the square of the angular speed times the radius.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '78.9'
  accept: []
solution_steps:
- en: The angular speed is 2 pi f, which is 12.56 rad/s.
- en: Then a = omega squared times r = 157.75 times 0.5, about 78.9 m/s^2.
- en: The unit of the answer is m/s^2.
- en: Answer = 78.9
tier: C
