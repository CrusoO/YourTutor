stem:
  en: A man walks at 4 km/h north on a train that moves east at 3 km/h. What is his speed relative to the ground?
hints:
- level: 1
  en: The man's motion relative to the train and the train's motion are perpendicular.
- level: 2
  en: Combine perpendicular components with the Pythagorean approach.
- level: 3
  en: Square each component, add them, then take the square root.
