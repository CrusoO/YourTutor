answer:
  sympy: '5'
  accept: []
solution_steps:
- en: Perpendicular vectors form the two legs of a right triangle, so the resultant is the hypotenuse, with magnitude the square root of 9 plus 16, which is 5 N.
- en: The unit of the answer is N.
- en: Answer = 5
