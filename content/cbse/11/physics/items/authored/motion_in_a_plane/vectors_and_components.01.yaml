stem:
  en: Two perpendicular forces of 3 N and 4 N act at a point. What is the magnitude of their resultant in newtons?
hints:
- level: 1
  en: Perpendicular vectors form the two legs of a right triangle.
- level: 2
  en: Use the relation between the squares of the legs and the hypotenuse.
- level: 3
  en: Take the square root of the sum of the squares.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
