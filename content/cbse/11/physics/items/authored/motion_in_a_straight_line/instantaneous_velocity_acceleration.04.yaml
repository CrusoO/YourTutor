id: A.11.physics.motion_in_a_straight_line.instantaneous_velocity_acceleration.04
skill_ids:
- SK.A.11.physics.instantaneous_velocity_acceleration
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A particle's velocity is v = 6t^2 - 12t metres per second, with t in seconds. At what time is its acceleration zero?
hints:
- level: 1
  en: Acceleration is the rate of change of velocity.
- level: 2
  en: Differentiate the velocity expression with respect to time.
- level: 3
  en: Set the resulting expression equal to zero and solve for time.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: t = 0 s
- id: b
  en: t = 3 s
- id: c
  en: t = 1 s
- id: d
  en: t = 2 s
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.B358CD1355F8
  when_answer_equals:
  - d
- id: MC.A.888A2AF25E7E
  when_answer_equals:
  - a
- id: MC.A.2E89996DFE2D
  when_answer_equals:
  - b
solution_steps:
- en: Acceleration is dv/dt = 12t - 12.
- en: Setting this to zero gives t = 1 s.
- en: The correct option is c.
tier: C
