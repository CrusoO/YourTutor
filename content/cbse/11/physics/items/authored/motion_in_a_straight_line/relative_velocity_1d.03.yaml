stem:
  en: A boat moves at 5 m/s in still water. The river current flows at 3 m/s. Going upstream, what is the speed of the boat relative to the bank in metres per second?
hints:
- level: 1
  en: Upstream, the current opposes the motion of the boat.
- level: 2
  en: Find the net velocity along the river line.
- level: 3
  en: Subtract the opposing current from the boat speed in still water.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: Upstream, the current opposes the boat, so the velocity relative to the bank is 5 minus 3, which is 2 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 2
tier: C
