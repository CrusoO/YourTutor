stem:
  en: A particle has position x = 5t^2 - t^3 metres, with t in seconds. What is its acceleration at t = 2 s, in metres per second squared?
hints:
- level: 1
  en: Differentiate the position twice with respect to time.
- level: 2
  en: Find the velocity first, then differentiate it.
- level: 3
  en: Substitute the time only after simplifying the acceleration expression.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-2'
  accept: []
solution_steps:
- en: The velocity is 10t - 3t^2 and the acceleration is 10 - 6t.
- en: At t = 2 s the acceleration is 10 - 12 = -2 m/s^2.
- en: The unit of the answer is m/s^2.
- en: Answer = -2
tier: C
