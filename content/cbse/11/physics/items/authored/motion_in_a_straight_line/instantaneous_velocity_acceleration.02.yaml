stem:
  en: A velocity-time graph is a straight line from 4 m/s at t = 0 to 16 m/s at t = 6 s. What is the acceleration in metres per second squared?
hints:
- level: 1
  en: Acceleration is the rate of change of velocity with time.
- level: 2
  en: Find the change in velocity between the two marked points.
- level: 3
  en: Divide that change by the time interval.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
