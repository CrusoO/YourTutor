  author: model-draft
type: numeric
answer:
  sympy: '2.8'
  accept: []
solution_steps:
- en: The path length is 8 m on the first leg and 6 m on the return, a total of 14 m.
- en: Dividing by 5 s gives 2.8 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 2.8
