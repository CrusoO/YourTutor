stem:
  en: A particle moves from x = 2 m to x = 10 m in 2 s, then back to x = 4 m in 3 s. What is its average speed over the 5 s, in metres per second?
hints:
- level: 1
  en: Speed counts the full path travelled, not the net shift.
- level: 2
  en: Find the distance covered in each leg and add them.
- level: 3
  en: Divide the total path by the total time at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
