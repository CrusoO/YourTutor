id: A.11.physics.motion_in_a_straight_line.position_displacement_velocity.02
skill_ids:
- SK.A.11.physics.position_displacement_velocity
difficulty: 0.2
pool: practice
role: recall
stem:
  en: An object goes from position 8 m to position 28 m in 4 s along a straight line. What is its average velocity in metres per second?
hints:
- level: 1
  en: Average velocity is displacement divided by the time taken.
- level: 2
  en: Find the change in position first, as later position minus earlier position.
- level: 3
  en: Divide that change by the elapsed time.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: Average velocity is the change in position divided by the time taken.
- en: The change is 20 m over 4 s, giving 5 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 5
tier: C
diagram_note: A horizontal straight track with an origin marked. Two dots sit at the 8 m and 28 m marks, with an arrow from the first dot to the second labelled 4 s.
