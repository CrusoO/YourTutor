stem:
  en: A car starts from rest and accelerates uniformly at 2 m/s^2. What is its velocity after 5 s, in metres per second?
hints:
- level: 1
  en: The starting velocity is zero for a car at rest.
- level: 2
  en: Use the equation that links final velocity, initial velocity, acceleration and time.
- level: 3
  en: Multiply the acceleration by the elapsed time and add the starting velocity.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10'
  accept: []
solution_steps:
- en: Using v = u + at with u = 0 gives v = 2 times 5, which is 10 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 10
tier: C
