stem:
  en: A passenger on a train moving at 30 m/s throws a ball forward at 10 m/s relative to the train. A stationary observer by the track measures the ball's velocity. Which value does the observer record?
hints:
- level: 1
  en: Velocities measured from the ground add along the same line.
- level: 2
  en: The train's velocity is one part of the ball's velocity from the ground.
- level: 3
  en: Use the same direction as positive for both velocities.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
