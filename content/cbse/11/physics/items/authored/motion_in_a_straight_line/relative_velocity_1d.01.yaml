id: A.11.physics.motion_in_a_straight_line.relative_velocity_1d.01
skill_ids:
- SK.A.11.physics.relative_velocity_1d
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Train A moves east at 20 m/s and train B moves east at 12 m/s on a parallel track. What is the velocity of A relative to B in metres per second, taking east as positive?
hints:
- level: 1
  en: Relative velocity is the difference between the two velocities.
- level: 2
  en: Subtract the velocity of the reference object from the velocity of the object of interest.
- level: 3
  en: Keep the sign convention for east the same in both velocities.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '8'
  accept: []
solution_steps:
- en: The relative velocity of A with respect to B is v_A minus v_B, which is 20 minus 12 = 8 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 8
tier: C
