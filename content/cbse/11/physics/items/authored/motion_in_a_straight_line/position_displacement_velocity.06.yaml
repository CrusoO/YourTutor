stem:
  en: A particle has position x = 2t^2 + 3t metres, with t in seconds. What is its average velocity in metres per second between t = 1 s and t = 3 s?
hints:
- level: 1
  en: Substitute each time into the position formula separately.
- level: 2
  en: Subtract the earlier position from the later one.
- level: 3
  en: Divide by the length of the time interval.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '11'
  accept: []
solution_steps:
- en: At t = 1 s the position is 5 m and at t = 3 s it is 27 m.
- en: The change of 22 m over 2 s gives 11 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 11
tier: C
