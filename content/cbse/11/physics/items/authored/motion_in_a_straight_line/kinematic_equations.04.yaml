stem:
  en: A stone is dropped from rest and falls for 3 s. Taking g = 9.8 m/s^2, how far does it fall in metres?
hints:
- level: 1
  en: The starting velocity is zero for an object that is dropped.
- level: 2
  en: Displacement equals half of the acceleration times the time squared.
- level: 3
  en: Gravity provides the acceleration in this situation.
