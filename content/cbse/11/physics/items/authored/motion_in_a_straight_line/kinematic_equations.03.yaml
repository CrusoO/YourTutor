stem:
  en: A train decelerates uniformly from 30 m/s to rest over a distance of 150 m. What is the magnitude of its deceleration in metres per second squared?
hints:
- level: 1
  en: Pick the equation with velocity, acceleration and displacement but no time.
- level: 2
  en: Put the final velocity equal to zero because the train stops.
- level: 3
  en: Solve for the acceleration and then state its size.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: Using v^2 = u^2 + 2as with v = 0 gives 0 = 900 + 2a(150), so a = -3 m/s^2.
- en: The magnitude is 3 m/s^2.
- en: The unit of the answer is m/s^2.
- en: Answer = 3
tier: C
