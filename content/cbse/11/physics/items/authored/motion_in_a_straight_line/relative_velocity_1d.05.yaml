stem:
  en: Particle A moves east at 7 m/s and particle B moves west at 11 m/s along the same line. They start 36 m apart and move toward each other. After how many seconds do they meet?
hints:
- level: 1
  en: Work out how fast the gap between the two particles closes.
- level: 2
  en: The gap closes at the sum of the two speeds when they move toward each other.
- level: 3
  en: Divide the initial gap by the closing rate.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The gap closes at the sum of the speeds, 18 m/s.
- en: Dividing the initial gap of 36 m by 18 m/s gives 2 s.
- en: The unit of the answer is s.
- en: Answer = 2
tier: C
