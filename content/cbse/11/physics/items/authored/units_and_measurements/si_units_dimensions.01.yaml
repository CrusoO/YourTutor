difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which of these is the SI unit of force?
hints:
- level: 1
  en: Force equals mass times acceleration, so find the unit of that product.
- level: 2
  en: Mass is measured in kilograms and acceleration in metres per second squared.
- level: 3
  en: The unit is named after a scientist who studied motion and gravity.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: joule
- id: b
  en: watt
- id: c
  en: pascal
- id: d
  en: newton
answer:
  sympy: d
  accept: []
misconception_rules:
