id: A.11.physics.units_and_measurements.significant_figures_errors.03
skill_ids:
- SK.A.11.physics.significant_figures_errors
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A rectangular sheet has length 12.4 cm and breadth 3.1 cm. What is its area in square centimetres, rounded to the correct number of significant figures?
hints:
- level: 1
  en: A product keeps the fewest significant figures of its factors.
- level: 2
  en: Multiply the two lengths before deciding how many digits to keep.
- level: 3
  en: Round only the final product, not the factors.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '38'
  accept: []
solution_steps:
- en: Area is 12.4 times 3.1, which is 38.44.
- en: The breadth has two significant figures, so the area is 38.
- en: The unit of the answer is cm^2.
- en: Answer = 38
tier: C
