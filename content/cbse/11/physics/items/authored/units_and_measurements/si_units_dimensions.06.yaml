stem:
  en: In Newton's law of gravitation, the constant G relates force to two masses and a distance. What is the exponent of time T in the dimensional formula of G?
hints:
- level: 1
  en: Start from force equals G times the product of two masses over distance squared.
- level: 2
  en: Rearrange the law to isolate G on one side.
- level: 3
  en: Track each base separately and read off the power of time from the final expression.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-2'
  accept: []
solution_steps:
- en: From F = G m1 m2 / r^2, G equals F r^2 divided by m1 m2.
- en: This gives M^-1 L^3 T^-2, so the power of time is minus two.
- en: Answer = -2
tier: C
