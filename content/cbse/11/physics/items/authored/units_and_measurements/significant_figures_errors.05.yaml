id: A.11.physics.units_and_measurements.significant_figures_errors.05
skill_ids:
- SK.A.11.physics.significant_figures_errors
difficulty: 0.9
pool: practice
role: apply
stem:
  en: The side of a square is measured as 2.5 cm with an absolute error of 0.1 cm. What is the percentage error in its area?
hints:
- level: 1
  en: The relative error in the area of a square is twice the relative error in one side.
- level: 2
  en: Divide the absolute error by the measured side first.
- level: 3
  en: Multiply the fraction by one hundred to get a percentage.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '8'
  accept: []
solution_steps:
- en: The relative error in the area is twice the relative error in the side.
- en: That is 2 times 0.1 over 2.5, which is 0.08, or 8 percent.
- en: The unit of the answer is %.
- en: Answer = 8
tier: C
