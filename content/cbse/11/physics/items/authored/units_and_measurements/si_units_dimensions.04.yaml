stem:
  en: What is the exponent of length L in the dimensional formula of energy?
hints:
- level: 1
  en: Energy is work, and work is force multiplied by distance.
- level: 2
  en: Force is mass times acceleration, and acceleration is length per time squared.
- level: 3
  en: Add up the powers of length from every factor you substituted.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: Energy is work, which is force times distance.
- en: Force is mass times length per time squared, so energy has dimensions M L^2 T^-2.
- en: Answer = 2
tier: C
