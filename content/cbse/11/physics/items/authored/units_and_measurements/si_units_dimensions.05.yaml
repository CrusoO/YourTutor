stem:
  en: Using mass M, length L and time T, which dimensional formula describes impulse, the product of force and time?
hints:
- level: 1
  en: Impulse is force times time, so start from the formula for force.
- level: 2
  en: Force has the dimensions of mass times acceleration.
- level: 3
  en: Combine the power of each base separately and never mix different bases.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
