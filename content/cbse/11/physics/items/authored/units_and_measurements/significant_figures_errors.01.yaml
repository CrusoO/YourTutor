stem:
  en: How many significant figures are in the measurement 0.0340 metres?
hints:
- level: 1
  en: Leading zeros before the first non-zero digit do not count.
- level: 2
  en: Trailing zeros after a decimal point are significant.
- level: 3
  en: Count the digits that remain after the leading zeros are removed.
prediction_prompt:
