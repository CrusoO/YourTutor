id: A.11.physics.units_and_measurements.si_units_dimensions.02
skill_ids:
- SK.A.11.physics.si_units_dimensions
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is the exponent of time T in the dimensional formula of velocity?
hints:
- level: 1
  en: Velocity is a length divided by a time.
- level: 2
  en: Write length as L and time as T, then read off the power of T.
- level: 3
  en: A quantity sitting in the denominator carries a negative power.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-1'
  accept: []
solution_steps:
- en: Velocity is length divided by time, so its dimensions are L T^-1.
- en: The power of time is therefore minus one.
- en: Answer = -1
tier: C
