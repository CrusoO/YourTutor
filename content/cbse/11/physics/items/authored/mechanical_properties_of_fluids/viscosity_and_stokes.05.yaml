stem:
  en: Using pi as 3.14, what is the Stokes drag in millinewtons on a sphere of radius 2 mm moving at 0.05 m/s through a fluid of viscosity 0.2 Pa s, to three decimal places?
hints:
- level: 1
  en: Stokes drag is six times pi times viscosity times radius times speed.
- level: 2
  en: Convert the radius to metres before multiplying.
- level: 3
  en: Convert the final force from newtons to millinewtons.
