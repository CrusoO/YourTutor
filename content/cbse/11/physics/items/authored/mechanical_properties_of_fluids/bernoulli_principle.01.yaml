stem:
  en: The equation of continuity expresses the conservation of which quantity for an incompressible fluid?
hints:
- level: 1
  en: The equation links the cross-sectional area of a pipe with the speed of the fluid.
- level: 2
  en: Think about how much fluid passes a section of pipe in each second.
- level: 3
  en: The conserved quantity is a flow per unit time.
