id: A.11.physics.mechanical_properties_of_fluids.pressure_in_fluids.03
skill_ids:
- SK.A.11.physics.pressure_in_fluids
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: In a hydraulic lift, a small piston of area 0.01 m^2 is pushed with a force of 200 N. The large piston has area 0.5 m^2. What force in newtons does the large piston exert?
hints:
- level: 1
  en: Pressure is transmitted equally through the enclosed fluid.
- level: 2
  en: Equal pressures on both pistons make the force ratio equal to the area ratio.
- level: 3
  en: Multiply the small force by the ratio of the large area to the small area.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10000'
  accept: []
solution_steps:
- en: The pressure is the same on both pistons, so F2 = F1 times A2 / A1 = 200 times 50 = 10000 N.
- en: The unit of the answer is N.
- en: Answer = 10000
tier: C
diagram_note: Two connected vertical cylinders with pistons. A small piston on the left has a downward force arrow, and a large piston on the right shows an unknown upward force. A fluid-filled tube joins the two cylinders.
