id: A.11.physics.mechanical_properties_of_fluids.pressure_in_fluids.05
skill_ids:
- SK.A.11.physics.pressure_in_fluids
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A U-tube has water on one side and oil of density 800 kg/m^3 on the other. The oil column stands 10 cm above the interface. How high, in centimetres, must the water column stand above the interface for balance?
hints:
- level: 1
  en: Equal pressures are at the same horizontal level across the interface.
- level: 2
  en: The pressure of each column is density times gravity times its height.
- level: 3
  en: Equate the two pressures and cancel gravity.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '8'
  accept: []
solution_steps:
- en: At the interface the pressures balance, so rho_oil h_oil = rho_water h_water.
- en: Then h_water = 0.8 times 10 = 8 cm.
- en: The unit of the answer is cm.
- en: Answer = 8
tier: C
diagram_note: A U-tube drawn vertically with two arms. The left arm holds water and the right arm holds oil. A horizontal dashed line marks the interface, and the heights of both columns above it are labelled.
