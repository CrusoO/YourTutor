difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Water rises 5 cm in a clean capillary tube of radius 0.5 mm, with zero contact angle. Taking density 1000 kg/m^3 and g = 9.8 m/s^2, what is the surface tension in N/m, to two significant figures?
hints:
- level: 1
  en: Rearrange the capillary rise formula to isolate the surface tension.
- level: 2
  en: Multiply the height, density, gravity and radius together first.
- level: 3
  en: Divide the product by two.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.12'
  accept: []
solution_steps:
- en: Rearranging the capillary rise formula gives T = rho g h r / 2 = 1000 times 9.8 times 0.05 times 0.0005 / 2 = 0.1225 N/m, about 0.12 N/m.
- en: The unit of the answer is N/m.
- en: Answer = 0.12
tier: C
diagram_note: A capillary tube dipped in water, with the liquid risen 5 cm above the surface. A vertical arrow shows the rise and the radius of the tube is marked across it.
