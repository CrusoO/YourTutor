id: A.11.physics.mechanical_properties_of_fluids.viscosity_and_stokes.06
skill_ids:
- SK.A.11.physics.viscosity_and_stokes
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Two identical spheres are released in two different liquids and both reach terminal speed. Which sphere falls faster?
hints:
- level: 1
  en: Terminal speed is inversely related to the viscosity of the liquid.
- level: 2
  en: Think about how thick honey slows down a falling bead.
- level: 3
  en: Compare the viscosity values of the two liquids.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: both fall at the same speed
- id: b
  en: the one in the more viscous liquid
- id: c
  en: the heavier sphere always, whatever the liquid
- id: d
  en: the one in the less viscous liquid
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.750D7A6861E7
  when_answer_equals:
  - b
- id: MC.A.F7A4231F8C75
  when_answer_equals:
  - a
- id: MC.A.7B9F91511F3F
  when_answer_equals:
  - c
solution_steps:
- en: Stokes' law gives terminal speed inversely proportional to viscosity, so the sphere in the less viscous liquid falls faster.
- en: The correct option is d.
tier: C
