- SK.A.11.physics.bernoulli_principle
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Water flows at 2 m/s through a pipe section of area 0.04 m^2 and then into a narrower section of area 0.01 m^2. What is its speed in the narrower section, in metres per second?
hints:
- level: 1
  en: The volume flow rate is the same at both sections of the pipe.
- level: 2
  en: Multiply area and speed on one side and equate it with the other side.
- level: 3
  en: Solve for the speed in the narrow section.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '8'
  accept: []
solution_steps:
- en: The volume flow rate is the same in both sections, so v2 = v1 times A1 / A2 = 2 times 0.04 / 0.01 = 8 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 8
tier: C
diagram_note: A horizontal pipe that narrows from a wide section on the left to a narrow section on the right. Both areas are labelled, and an arrow shows the direction of flow.
