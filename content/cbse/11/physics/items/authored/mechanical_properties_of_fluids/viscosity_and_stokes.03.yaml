type: numeric
answer:
  sympy: '0.0095'
  accept: []
solution_steps:
- en: At terminal speed, the weight minus buoyancy equals the Stokes drag, so v = 2 (rho_s - rho_f) g r^2 / (9 eta).
- en: This gives about 0.0095 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 0.0095
