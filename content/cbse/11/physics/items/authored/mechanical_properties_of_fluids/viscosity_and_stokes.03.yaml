stem:
  en: A steel sphere of radius 1 mm falls through glycerine of viscosity 1.5 Pa s. Steel has density 7800 kg/m^3 and glycerine has density 1260 kg/m^3. Taking g = 9.8 m/s^2, what is its terminal speed in metres per second, to four decimal places?
hints:
- level: 1
  en: At terminal speed the net weight minus buoyancy equals the drag force.
- level: 2
  en: The Stokes drag on a sphere involves six times pi times the viscosity times the radius times the speed.
- level: 3
  en: Solve for the speed using the difference in densities and the squared radius.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
