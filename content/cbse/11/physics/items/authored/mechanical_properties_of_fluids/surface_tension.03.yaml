stem:
  en: A soap film is stretched on a wire loop whose contact length is 0.1 m on each face. The film has surface tension 0.03 N/m. What force in newtons is needed to hold the loop's edge in place against the film?
hints:
- level: 1
  en: A soap film has two surfaces, so count both faces.
- level: 2
  en: The surface tension force acts per unit length along the edge.
- level: 3
  en: Multiply the tension by the total length of contact on both faces.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.006'
  accept: []
solution_steps:
- en: A soap film has two surfaces, so the total force is 2 T L = 2 times 0.03 times 0.1 = 0.006 N.
- en: The unit of the answer is N.
- en: Answer = 0.006
tier: C
