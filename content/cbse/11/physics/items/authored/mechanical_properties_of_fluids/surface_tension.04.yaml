difficulty: 0.6
pool: practice
role: apply
stem:
  en: Why does a small drop of water take a spherical shape when it floats freely?
hints:
- level: 1
  en: Think about how surface energy is related to surface area.
- level: 2
  en: A freely floating drop moves toward the configuration of least surface energy.
- level: 3
  en: Compare the shape of a sphere with other shapes of the same volume.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: gravity pulls the small drop into a sphere
- id: b
  en: water is almost incompressible
- id: c
  en: its density is uniform throughout
- id: d
  en: surface tension minimises the surface area
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.B89005B85AB9
