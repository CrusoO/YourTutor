difficulty: 0.2
pool: practice
role: recall
stem:
  en: Water with surface tension 0.072 N/m rises in a clean glass capillary of radius 0.5 mm. Taking density 1000 kg/m^3, g = 9.8 m/s^2 and zero contact angle, what is the height of the rise in centimetres, to two decimal places?
hints:
- level: 1
  en: The capillary rise balances the upward surface tension pull against the weight of the liquid column.
- level: 2
  en: The surface tension acts along the circumference of the tube, which is two pi r.
- level: 3
  en: Solve for the height from the balance between weight and the upward force.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2.94'
  accept: []
solution_steps:
- en: Capillary rise h = 2 T cos theta / (rho g r) = 0.144 / 4.9 = 0.0294 m, which is 2.94 cm.
- en: The unit of the answer is cm.
- en: Answer = 2.94
tier: C
diagram_note: A narrow vertical glass tube dipped in a beaker of water. The liquid column has risen to a height above the beaker surface, and the radius of the tube is marked.
