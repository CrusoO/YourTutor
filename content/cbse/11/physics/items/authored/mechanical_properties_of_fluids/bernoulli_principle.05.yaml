- SK.A.11.physics.bernoulli_principle
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A large open tank is filled with water to a depth of 5 m above a small hole at its base. Taking g = 9.8 m/s^2, what is the speed of water leaving the hole in metres per second, to one decimal place?
hints:
- level: 1
  en: Apply Bernoulli's equation between the free surface and the hole.
- level: 2
  en: The pressure at both the free surface and the hole is atmospheric.
- level: 3
  en: Equate the gravitational energy lost to the kinetic energy gained.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '9.9'
  accept: []
solution_steps:
- en: Applying Bernoulli between the free surface and the hole, with atmospheric pressure at both ends, gives v = square root of 2 g h = square root of 98, about 9.9 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 9.9
tier: C
diagram_note: An open tank of water with a small hole near the base. The free surface is marked at the top, 5 m above the hole, and an arrow shows the jet leaving the hole sideways.
