stem:
  en: Water has density 1000 kg/m^3. Taking g = 9.8 m/s^2, what is the gauge pressure at a depth of 2 m, in kilopascals?
hints:
- level: 1
  en: Gauge pressure is density times gravity times depth.
- level: 2
  en: Multiply the three quantities in SI units first.
- level: 3
  en: Convert pascals to kilopascals at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
