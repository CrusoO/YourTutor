answer:
  sympy: '19.6'
  accept: []
solution_steps:
- en: Gauge pressure is rho g h = 1000 times 9.8 times 2 = 19600 Pa, which is 19.6 kPa.
- en: The unit of the answer is kPa.
- en: Answer = 19.6
