stem:
  en: A bob hangs from the roof of a trolley that accelerates along a track at a constant rate. At equilibrium the string makes an angle with the vertical. Which expression gives the tangent of that angle?
hints:
- level: 1
  en: Use the balance of forces on the bob in the trolley's frame.
- level: 2
  en: Draw the string tension, the weight of the bob and the pseudo force.
- level: 3
  en: Find the ratio of the horizontal balance to the vertical balance.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: a times g
- id: b
  en: a divided by g
- id: c
  en: g divided by a
- id: d
  en: a squared divided by g
answer:
  sympy: b
  accept: []
