id: A.11.physics.laws_of_motion.circular_motion_dynamics.02
skill_ids:
- SK.A.11.physics.circular_motion_dynamics
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A 1.2 kg ball is whirled on a string of length 0.5 m in a horizontal circle at a speed of 2 m/s. What is the tension in the string in newtons?
hints:
- level: 1
  en: In this setup the tension supplies the entire centripetal force.
- level: 2
  en: Centripetal force equals mass times speed squared divided by the radius.
- level: 3
  en: Square the speed before you multiply by the mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '9.6'
  accept: []
solution_steps:
- en: In a horizontal circle the tension supplies the whole centripetal force, T = m v^2 / r = 1.2 times 4 divided by 0.5, which is 9.6 N.
- en: The unit of the answer is N.
- en: Answer = 9.6
tier: C
diagram_note: A top-down view of a circular path with a ball on a string. The string is drawn as a radius to the centre, and the tension arrow points along the string toward the centre.
