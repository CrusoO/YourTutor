difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A 2 kg block on a smooth incline of 30 degrees is held in place by a string parallel to the slope. Taking g = 9.8 m/s^2, what is the tension in the string in newtons?
hints:
- level: 1
  en: Resolve the weight into a component along the slope and one perpendicular to it.
- level: 2
  en: The component along the slope is the one the string must balance.
- level: 3
  en: Use the sine of the incline angle for the part along the slope.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '9.8'
  accept: []
solution_steps:
- en: The component of weight along the slope is mg sin 30 degrees, which is 2 times 9.8 times 0.5 = 9.8 N.
- en: The string balances this component.
- en: The unit of the answer is N.
- en: Answer = 9.8
tier: C
diagram_note: An inclined plane at 30 degrees with a block resting on the slope. Weight acts vertically downward, the normal force is perpendicular to the slope, and the string acts along the slope upward.
