stem:
  en: A bob of mass 2 kg on a string of length 1.5 m moves in a vertical circle. At the lowest point the tension is 60 N. Taking g = 9.8 m/s^2, what is its speed at the lowest point in metres per second, to one decimal place?
hints:
- level: 1
  en: At the bottom of the circle the tension acts upward and the weight acts downward.
- level: 2
  en: The net upward force is the centripetal force that keeps the bob on the circle.
- level: 3
  en: Subtract the weight from the tension before solving for the speed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5.5'
  accept: []
solution_steps:
- en: At the bottom, T - mg = m v^2 / r, so 60 - 19.6 = 2 v^2 / 1.5.
- en: This gives v^2 = 30.3 and v = 5.5 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 5.5
tier: C
diagram_note: A vertical circle with the bob at its lowest point. Tension acts upward along the string toward the centre, and weight acts downward from the bob.
