stem:
  en: A block on a rough plane tilted at 30 degrees is just on the point of sliding. What is the coefficient of static friction?
hints:
- level: 1
  en: At the point of sliding, friction balances the weight component along the plane.
- level: 2
  en: Compare the component along the plane with the component perpendicular to it.
- level: 3
  en: Their ratio is a trigonometric ratio of the angle.
prediction_prompt:
