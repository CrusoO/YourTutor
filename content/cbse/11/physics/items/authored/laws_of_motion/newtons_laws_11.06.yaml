stem:
  en: A 5 kg body on a frictionless surface is acted on by two perpendicular forces of 3 N and 4 N. What is the magnitude of its acceleration in metres per second squared?
hints:
- level: 1
  en: Two forces at right angles combine like the legs of a right triangle.
- level: 2
  en: Find the resultant force before using Newton's second law.
- level: 3
  en: Divide the resultant force by the mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
