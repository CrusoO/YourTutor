id: A.11.physics.laws_of_motion.friction.03
skill_ids:
- SK.A.11.physics.friction
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A 20 kg crate is pushed along a horizontal floor at constant speed by a horizontal force of 49 N. Taking g = 9.8 m/s^2, what is the coefficient of kinetic friction?
hints:
- level: 1
  en: Constant speed means the net force on the crate is zero.
- level: 2
  en: Kinetic friction then balances the applied force exactly.
- level: 3
  en: Divide the friction by the normal force, which equals the weight on a horizontal floor.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.25'
  accept: []
solution_steps:
- en: Constant speed means the net force is zero, so the kinetic friction equals the 49 N push.
- en: The normal force is 196 N, so the coefficient is 49 / 196 = 0.25.
- en: Answer = 0.25
tier: C
