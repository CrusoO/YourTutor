stem:
  en: A lift of mass 500 kg accelerates upward at 2 m/s^2. Taking g = 9.8 m/s^2, what is the tension in the supporting cable?
hints:
- level: 1
  en: The cable supports the weight and also supplies the extra push for the acceleration.
- level: 2
  en: Write the net upward force on the lift as tension minus weight.
- level: 3
  en: Solve the net force equation for the tension.
