difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A lift accelerates upward at 2 m/s^2. A 5 kg object hangs from a spring scale inside it. Taking g = 9.8 m/s^2, what does the scale read in newtons?
hints:
- level: 1
  en: The scale reads the force the spring must supply to hold the object.
- level: 2
  en: In the lift's frame, add the pseudo force acting downward to the weight.
- level: 3
  en: The spring balances the weight and the pseudo force together.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '59'
  accept: []
solution_steps:
- en: The scale reads the force needed to support the object in the lift, which is m(g + a) = 5 times 11.8 = 59 N.
- en: The unit of the answer is N.
- en: Answer = 59
tier: C
