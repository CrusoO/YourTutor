stem:
  en: A car accelerates forward at 4 m/s^2 and a 3 kg box rests on its smooth floor without sliding. What is the magnitude of the pseudo force on the box in newtons?
hints:
- level: 1
  en: The pseudo force equals mass times the acceleration of the frame.
- level: 2
  en: The box is at rest relative to the car, so the pseudo force must be balanced.
- level: 3
  en: Multiply the mass by the acceleration directly, since no gravity term enters this part.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '12'
  accept: []
solution_steps:
- en: The pseudo force equals the mass times the frame acceleration, so it is 3 times 4 = 12 N, acting backward in the car's frame.
- en: The unit of the answer is N.
- en: Answer = 12
tier: C
