pool: practice
role: procedure
stem:
  en: Two blocks of masses 3 kg and 5 kg are joined by a light string on a frictionless floor. A horizontal force of 16 N pulls the 3 kg block. What is the tension in the string in newtons?
hints:
- level: 1
  en: Treat both blocks together first to find the common acceleration.
- level: 2
  en: The string pulls the far block and transmits the accelerating force.
- level: 3
  en: Apply Newton's second law to the far block alone using that acceleration.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '10'
  accept: []
solution_steps:
- en: The whole system has mass 8 kg, so a = 16 / 8 = 2 m/s^2.
- en: The string must accelerate the 5 kg block, so T = 5 times 2 = 10 N.
- en: The unit of the answer is N.
- en: Answer = 10
tier: C
diagram_note: Two blocks in a line on a frictionless floor. A force arrow on the left block points right, and a string links the left block to the right block.
