difficulty: 0.2
pool: practice
role: recall
stem:
  en: What provides the centripetal force for a car turning on a flat, unbanked road?
hints:
- level: 1
  en: Centripetal force points toward the centre of the circle.
- level: 2
  en: Which contact between the car and the road can push or pull sideways?
- level: 3
  en: Consider the force that acts along the road surface.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the weight of the car
- id: b
  en: friction between the tyres and the road
- id: c
  en: the normal reaction alone
- id: d
  en: the engine thrust
answer:
  sympy: b
  accept: []
misconception_rules:
