id: A.11.physics.laws_of_motion.newtons_laws_11.01
skill_ids:
- SK.A.11.physics.newtons_laws_11
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which statement is Newton's second law of motion?
hints:
- level: 1
  en: 'The law links three quantities: a net force, a mass and an acceleration.'
- level: 2
  en: Think about how a push changes the speed of a heavy object compared with a light one.
- level: 3
  en: Decide which quantity the net force is set equal to in the law.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: a force is needed to keep an object moving at constant speed
- id: b
  en: every action has an equal and opposite reaction acting on a different body
- id: c
  en: an object at rest stays at rest unless acted on by a net force
- id: d
  en: net force equals mass times acceleration
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.0559B8A71897
  when_answer_equals:
  - b
- id: MC.A.6A79EDBB6AC6
  when_answer_equals:
  - a
- id: MC.A.3D786BC19FC5
  when_answer_equals:
  - c
solution_steps:
- en: The second law links the net force on a body to its mass and the acceleration it produces, in the form F = m a.
- en: The correct option is d.
tier: C
