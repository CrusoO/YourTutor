difficulty: 0.2
pool: practice
role: recall
stem:
  en: A 4 kg block rests on a smooth table and is pulled by a horizontal force of 12 N. What is its acceleration in metres per second squared?
hints:
- level: 1
  en: A smooth table means there is no friction acting on the block.
- level: 2
  en: Apply Newton's second law along the horizontal direction.
- level: 3
  en: Divide the net force by the mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: With no friction, the net horizontal force is the applied 12 N.
- en: Dividing by the mass 4 kg gives 3 m/s^2.
- en: The unit of the answer is m/s^2.
- en: Answer = 3
tier: C
diagram_note: Free-body diagram of a block on a table. Weight acts downward, the normal force acts upward, a horizontal applied force acts to the right, and no friction arrow is drawn.
