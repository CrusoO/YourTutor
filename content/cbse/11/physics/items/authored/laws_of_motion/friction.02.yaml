id: A.11.physics.laws_of_motion.friction.02
skill_ids:
- SK.A.11.physics.friction
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A 10 kg block rests on a horizontal floor where the coefficient of static friction is 0.4. Taking g = 9.8 m/s^2, what is the maximum static friction force in newtons?
hints:
- level: 1
  en: Maximum static friction equals the coefficient times the normal force.
- level: 2
  en: On a horizontal floor the normal force equals the weight of the block.
- level: 3
  en: Multiply the coefficient, the mass and gravity together.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '39.2'
  accept: []
solution_steps:
- en: On a horizontal floor the normal force equals the weight, 98 N.
- en: The maximum static friction is 0.4 times 98, which is 39.2 N.
- en: The unit of the answer is N.
- en: Answer = 39.2
tier: C
diagram_note: Side view of a block on a horizontal floor. A weight arrow points down, a normal arrow points up, and a horizontal friction arrow points opposite to the intended pull.
