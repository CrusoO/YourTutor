stem:
  en: A pendulum hangs in a lift that falls freely with acceleration g. What is the effective gravity acting on the bob as seen from inside the lift?
hints:
- level: 1
  en: Take a frame falling with the same acceleration as gravity.
- level: 2
  en: The pseudo force points opposite to the acceleration of the frame.
- level: 3
  en: Add the real weight and the pseudo force as vectors.
prediction_prompt:
