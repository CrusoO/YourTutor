stem:
  en: A cart starts from rest at a height of 3 m on a frictionless track and passes a point 1 m high. Taking g = 9.8 m/s^2, what is its speed at that lower point?
hints:
- level: 1
  en: Only the height that is lost between the two points matters.
- level: 2
  en: Find the height difference between the starting point and the lower point.
- level: 3
  en: Set the energy given up equal to the kinetic energy gained, then solve.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
