difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A spring of constant 200 N/m is compressed by 0.1 m and launches a 0.5 kg block along a frictionless horizontal floor. What is the speed of the block in metres per second?
hints:
- level: 1
  en: On a frictionless floor, all of the spring's stored energy becomes kinetic energy.
- level: 2
  en: Write the stored energy as one half times the spring constant times the compression squared.
- level: 3
  en: Set it equal to one half times the mass times the speed squared, then solve.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The spring energy one half k x^2 becomes the kinetic energy one half m v^2.
- en: So v = x times the square root of k over m, which is 0.1 times 20 = 2 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 2
tier: C
diagram_note: A horizontal spring at the left, compressed against a block on a frictionless floor. An arrow shows the block being launched to the right.
