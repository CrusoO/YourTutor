id: A.11.physics.work_energy_and_power.collisions_energy.05
skill_ids:
- SK.A.11.physics.collisions_energy
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A 3 kg body moving at 4 m/s collides elastically and head-on with a 1 kg body at rest. What is the velocity of the 1 kg body after the collision, in metres per second?
hints:
- level: 1
  en: Use conservation of momentum and kinetic energy together, or the standard result for head-on elastic collisions.
- level: 2
  en: The velocity of the target involves twice the mass of the moving body.
- level: 3
  en: Divide by the sum of the two masses.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: For an elastic head-on collision with a target at rest, v2 = 2 m1 u1 / (m1 + m2) = 2 times 3 times 4 / 4 = 6 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 6
tier: C
