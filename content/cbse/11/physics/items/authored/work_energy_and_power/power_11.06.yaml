stem:
  en: A car engine delivers constant power while the car moves on a level road. If the car's speed doubles, how does the forward force the engine can deliver change?
hints:
- level: 1
  en: Power equals force times speed when the force acts along the motion.
- level: 2
  en: Solve that relation for the force.
- level: 3
  en: Notice where the speed sits once the relation is solved for the force.
