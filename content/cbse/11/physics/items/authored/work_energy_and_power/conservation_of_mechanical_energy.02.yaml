stem:
  en: A ball is dropped from rest from a height of 10 m. Taking g = 9.8 m/s^2, what is its speed just before it reaches the ground in metres per second?
hints:
- level: 1
  en: At the top, all of the energy is potential energy.
- level: 2
  en: Equate that energy with the kinetic energy just before impact.
- level: 3
  en: Solve for the speed after the mass cancels.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '14'
  accept: []
solution_steps:
- en: All the initial energy is potential, so 0.5 v^2 = g h.
- en: This gives v^2 = 2 times 9.8 times 10 = 196, so v = 14 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 14
