id: A.11.physics.work_energy_and_power.work_by_variable_force.02
skill_ids:
- SK.A.11.physics.work_by_variable_force
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A constant force of 10 N acts along the direction of motion of a body that moves 4 m. How much work is done, in joules?
hints:
- level: 1
  en: A constant force times a displacement in the same direction gives the work.
- level: 2
  en: A rectangular force-displacement graph needs no area search.
- level: 3
  en: Multiply the force by the distance moved.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '40'
  accept: []
solution_steps:
- en: For a constant force in the direction of displacement, work is force times displacement, which is 10 times 4 = 40 J.
- en: The unit of the answer is J.
- en: Answer = 40
tier: C
diagram_note: A rectangular force-displacement graph. Force is on the vertical axis at a constant height and displacement is on the horizontal axis, with the rectangle under the line shaded.
