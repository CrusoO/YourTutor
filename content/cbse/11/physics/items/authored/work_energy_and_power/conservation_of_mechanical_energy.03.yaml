id: A.11.physics.work_energy_and_power.conservation_of_mechanical_energy.03
skill_ids:
- SK.A.11.physics.conservation_of_mechanical_energy
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A pendulum bob of mass 2 kg is released from rest at a height of 0.5 m above its lowest point. Taking g = 9.8 m/s^2, what is its speed at the lowest point in metres per second, to two decimal places?
hints:
- level: 1
  en: Released from rest, the bob has only potential energy at the start.
- level: 2
  en: Energy is conserved between the release point and the lowest point.
- level: 3
  en: The mass cancels, so solve for the speed from the height directly.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3.13'
  accept: []
solution_steps:
- en: Energy is conserved, so m g h = one half m v^2.
- en: Then v = square root of 2 g h = square root of 9.8, which is about 3.13 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 3.13
tier: C
