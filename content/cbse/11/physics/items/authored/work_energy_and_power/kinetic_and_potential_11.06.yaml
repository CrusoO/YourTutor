stem:
  en: Two bodies of equal mass move with speeds of 2 m/s and 4 m/s. What is the ratio of the kinetic energy of the faster body to that of the slower body?
hints:
- level: 1
  en: Kinetic energy depends on the square of the speed.
- level: 2
  en: The mass cancels out when the two bodies have equal masses.
- level: 3
  en: Compare the squares of the two speeds.
