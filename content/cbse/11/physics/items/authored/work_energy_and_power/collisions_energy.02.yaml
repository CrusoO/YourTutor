id: A.11.physics.work_energy_and_power.collisions_energy.02
skill_ids:
- SK.A.11.physics.collisions_energy
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A 2 kg body moving at 6 m/s collides with a 4 kg body at rest, and the two stick together. What is their common velocity in metres per second?
hints:
- level: 1
  en: The total momentum before the collision equals the total momentum after it.
- level: 2
  en: Before the collision only the moving body has momentum, equal to its mass times its velocity.
- level: 3
  en: Divide the total momentum by the total mass.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: Momentum before is 2 times 6 = 12 kg m/s.
- en: Dividing by the total mass 6 kg gives 2 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 2
tier: C
