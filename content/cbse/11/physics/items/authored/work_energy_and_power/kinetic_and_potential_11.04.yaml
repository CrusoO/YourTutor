stem:
  en: The kinetic energy of a body is doubled by increasing its speed. By what factor did its speed increase?
hints:
- level: 1
  en: Kinetic energy depends on the square of the speed.
- level: 2
  en: If the energy doubles, the square of the speed must also double.
- level: 3
  en: Take the square root of the factor by which the squared speed changes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: one half
- id: b
  en: '2'
- id: c
  en: '4'
- id: d
  en: square root of 2
answer:
  sympy: d
  accept: []
misconception_rules:
