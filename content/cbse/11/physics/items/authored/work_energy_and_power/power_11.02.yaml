stem:
  en: A motor does 600 J of work in 20 s. What is its average power in watts?
hints:
- level: 1
  en: Power is work divided by the time taken.
- level: 2
  en: Divide the energy by the number of seconds.
- level: 3
  en: The result is expressed in watts.
