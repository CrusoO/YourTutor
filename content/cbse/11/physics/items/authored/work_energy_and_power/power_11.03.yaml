stem:
  en: A 60 kg man climbs a flight of stairs 4 m high in 8 s. Taking g = 9.8 m/s^2, what is his average power in watts?
hints:
- level: 1
  en: Work done against gravity equals weight times height climbed.
- level: 2
  en: Power is that work divided by the time taken.
- level: 3
  en: Multiply the mass, gravity and height first.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '294'
  accept: []
solution_steps:
- en: The work against gravity is m g h = 60 times 9.8 times 4 = 2352 J.
- en: Dividing by 8 s gives 294 W.
- en: The unit of the answer is W.
- en: Answer = 294
tier: C
