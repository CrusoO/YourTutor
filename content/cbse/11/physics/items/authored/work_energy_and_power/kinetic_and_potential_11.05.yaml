difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A 0.5 kg ball is thrown straight up with a speed of 10 m/s. Neglecting air resistance and taking g = 9.8 m/s^2, how high does it rise in metres, to one decimal place?
hints:
- level: 1
  en: At the highest point the ball's kinetic energy is zero.
- level: 2
  en: Equate the initial kinetic energy with the potential energy at the top.
- level: 3
  en: Divide the speed squared by two times gravity to get the height.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5.1'
  accept: []
solution_steps:
- en: At the top the kinetic energy is zero, so the initial kinetic energy converts to potential energy.
- en: The height is v^2 / (2g) = 100 / 19.6, about 5.1 m.
- en: The unit of the answer is m.
- en: Answer = 5.1
tier: C
