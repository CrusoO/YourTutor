stem:
  en: A pump lifts 240 kg of water every minute through a height of 10 m. Taking g = 9.8 m/s^2, what is the required power in watts?
hints:
- level: 1
  en: Convert the mass lifted per minute into the mass lifted per second.
- level: 2
  en: Energy per second is work per second, which is power.
- level: 3
  en: Multiply the mass per second by gravity and by the height.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '392'
  accept: []
solution_steps:
- en: The mass lifted per second is 4 kg.
- en: The power is 4 times 9.8 times 10 = 392 W.
- en: The unit of the answer is W.
- en: Answer = 392
tier: C
