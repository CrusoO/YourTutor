difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Two 5 kg bodies moving at 2 m/s toward each other stick together after colliding. How much kinetic energy remains afterwards?
hints:
- level: 1
  en: Find the total momentum of the two bodies before the collision first.
- level: 2
  en: Opposite velocities of equal mass give a total momentum that is zero.
- level: 3
  en: A body that is not moving has no kinetic energy.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 20 joules
- id: b
  en: 10 joules
- id: c
  en: zero joules
- id: d
  en: 5 joules
answer:
  sympy: c
  accept: []
misconception_rules:
