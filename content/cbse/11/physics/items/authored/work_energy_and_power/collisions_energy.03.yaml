id: A.11.physics.work_energy_and_power.collisions_energy.03
skill_ids:
- SK.A.11.physics.collisions_energy
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A 0.2 kg ball moving at 5 m/s hits a wall and rebounds with 5 m/s in the opposite direction. What is the magnitude of the impulse on the ball, in newton seconds?
hints:
- level: 1
  en: Impulse equals the change in momentum of the ball.
- level: 2
  en: Take the direction of the incoming motion as positive.
- level: 3
  en: Subtract the initial momentum from the final momentum, keeping the signs.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The change in momentum is 0.2 times (5 - (-5)) = 2 kg m/s, which equals the impulse in N s.
- en: The unit of the answer is N s.
- en: Answer = 2
tier: C
