id: A.11.physics.work_energy_and_power.work_by_variable_force.05
skill_ids:
- SK.A.11.physics.work_by_variable_force
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A force is zero from 0 m to 2 m and then rises in a straight line from 0 N at 2 m to 6 N at 6 m. What is the work done from 0 to 6 m, in joules?
hints:
- level: 1
  en: Split the displacement at the point where the force starts to change.
- level: 2
  en: A zero force contributes no work over its interval.
- level: 3
  en: Find the triangle area for the sloped part using half of base times height.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '12'
  accept: []
solution_steps:
- en: The first 2 m contribute no work.
- en: The sloping part is a triangle with base 4 m and height 6 N, with area 12 J.
- en: The unit of the answer is J.
- en: Answer = 12
tier: C
diagram_note: A force-displacement graph with a flat zero line from the origin to the 2 m mark, then a straight rising line reaching 6 N at the 6 m mark. The triangle under the rising part is shaded.
