stem:
  en: A constant force of 4 N makes a 60 degree angle with a displacement of 5 m. What is the work done by the force?
hints:
- level: 1
  en: Only the component of force in the direction of displacement does work.
- level: 2
  en: Use the cosine of the angle between the force and the displacement.
- level: 3
  en: Multiply the force, the displacement and that cosine.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
