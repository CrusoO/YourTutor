id: A.11.physics.work_energy_and_power.work_by_variable_force.03
skill_ids:
- SK.A.11.physics.work_by_variable_force
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A force F = 2x newtons acts on a body as it moves from x = 0 m to x = 3 m. What is the work done in joules?
hints:
- level: 1
  en: Work from a varying force is the area under the force-displacement graph.
- level: 2
  en: A straight line through the origin forms a triangle with the axis.
- level: 3
  en: The area of a triangle is half of base times height.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '9'
  accept: []
solution_steps:
- en: Work is the integral of 2x dx from 0 to 3, which equals x squared from 0 to 3, giving 9 J.
- en: The same answer follows from the triangle area under the straight line.
- en: The unit of the answer is J.
- en: Answer = 9
tier: C
