stem:
  en: A 4 kg body is raised 5 m above the ground. Taking g = 9.8 m/s^2, what is its gravitational potential energy in joules?
hints:
- level: 1
  en: Potential energy relative to the ground is mass times gravity times height.
- level: 2
  en: Multiply the three quantities together.
- level: 3
  en: Use the value of g given in the question.
prediction_prompt:
