stem:
  en: What is the kinetic energy of a body of mass m moving with speed v?
hints:
- level: 1
  en: Kinetic energy depends on the speed through a power that is not one.
- level: 2
  en: It is the work needed to bring the body from rest up to that speed.
- level: 3
  en: Use the formula that contains the square of the speed.
