stem:
  en: A block slides from rest down a frictionless curved track starting at a height of 2.5 m. Taking g = 9.8 m/s^2, what is its speed at the bottom of the track?
hints:
- level: 1
  en: Energy at the top is all potential energy because the block starts from rest.
- level: 2
  en: Set the potential energy at the top equal to the kinetic energy at the bottom.
- level: 3
  en: Take the square root only after solving for the speed squared.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
