type: numeric
answer:
  sympy: '-1'
  accept: []
solution_steps:
- en: In a circular orbit the potential energy is minus twice the kinetic energy, so the total energy is K + (-2K) = -K.
- en: The multiple is -1.
- en: Answer = -1
