stem:
  en: For a satellite in a circular orbit, what multiple of its kinetic energy gives its total mechanical energy? Give the number.
hints:
- level: 1
  en: The potential energy in a circular orbit is twice the kinetic energy with the opposite sign.
- level: 2
  en: Add the kinetic energy and the potential energy.
- level: 3
  en: The sum is a negative multiple of the kinetic part.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
