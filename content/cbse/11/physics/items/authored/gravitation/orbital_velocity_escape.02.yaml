id: A.11.physics.gravitation.orbital_velocity_escape.02
skill_ids:
- SK.A.11.physics.orbital_velocity_escape
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A planet has surface gravity 4 m/s^2 and radius 9 m. What is the orbital speed of a satellite circling just above its surface, in metres per second?
hints:
- level: 1
  en: For a close orbit, gravity supplies the centripetal force.
- level: 2
  en: Set the centripetal acceleration v squared over the radius equal to the surface gravity.
- level: 3
  en: Solve for the speed and take the square root.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: For a close orbit, gravity supplies the centripetal force, so v^2 / R = g and v = square root of g R = square root of 36 = 6 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 6
tier: C
