difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which statement correctly describes Kepler's first law of planetary motion?
hints:
- level: 1
  en: The first law is about the shape of each orbit.
- level: 2
  en: Think of an oval path rather than a circle.
- level: 3
  en: Recall which point of the oval the Sun occupies.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: planets move in perfect circles with the Sun at the centre
- id: b
  en: planets move in ellipses with the Sun at one focus
- id: c
  en: planets move at constant speed along their orbits
- id: d
  en: the period is independent of the orbit size
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.185B15810955
  when_answer_equals:
  - a
- id: MC.A.8F5C34906FCA
  when_answer_equals:
  - c
- id: MC.A.D3C5DD1A93A8
  when_answer_equals:
  - d
solution_steps:
- en: The first law states that each planet's orbit is an ellipse with the Sun at one of the two foci.
- en: The correct option is b.
tier: C
