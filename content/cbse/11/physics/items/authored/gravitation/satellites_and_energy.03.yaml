stem:
  en: A satellite of mass 200 kg orbits at a speed of 6000 m/s. What is its kinetic energy in gigajoules?
hints:
- level: 1
  en: Kinetic energy is one half times mass times speed squared.
- level: 2
  en: Square the speed first, which produces a large number.
- level: 3
  en: Convert joules to gigajoules by dividing by one billion.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3.6'
  accept: []
solution_steps:
- en: Kinetic energy is one half times 200 times 6000 squared, which is 3.6 times 10 to the power 9 J, or 3.6 GJ.
- en: The unit of the answer is GJ.
- en: Answer = 3.6
tier: C
