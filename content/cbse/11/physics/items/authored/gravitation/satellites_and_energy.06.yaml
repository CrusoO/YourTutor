stem:
  en: The orbital radius of a satellite is increased. Which statement about its kinetic energy is correct?
hints:
- level: 1
  en: Orbital speed falls as the orbit becomes larger.
- level: 2
  en: Kinetic energy depends on the square of the speed.
- level: 3
  en: Relate the orbital radius to the speed through gravity.
