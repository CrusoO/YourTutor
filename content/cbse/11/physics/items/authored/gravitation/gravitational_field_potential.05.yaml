stem:
  en: On a planet where the gravitational field strength is 6 N/kg, a 2 kg object is lifted 5 m. What is its gain in gravitational potential energy in joules?
hints:
- level: 1
  en: The gain in potential energy equals the weight times the height raised.
- level: 2
  en: Weight equals mass times field strength.
- level: 3
  en: Multiply the weight by the height.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '60'
  accept: []
solution_steps:
- en: The weight is 2 times 6 = 12 N.
- en: Lifting it 5 m stores 12 times 5 = 60 J of potential energy.
- en: The unit of the answer is J.
- en: Answer = 60
tier: C
