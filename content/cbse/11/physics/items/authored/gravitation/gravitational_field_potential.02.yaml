difficulty: 0.2
pool: practice
role: recall
stem:
  en: Near Earth's surface the gravitational field strength is 9.8 N/kg. Between two points 5 m apart vertically, what is the change in gravitational potential energy per kilogram, in joules per kilogram?
hints:
- level: 1
  en: The change in potential per unit mass equals field strength times the height change.
- level: 2
  en: Multiply the field strength by the vertical separation.
- level: 3
  en: Newtons per kilogram times metres gives joules per kilogram.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '49'
  accept: []
solution_steps:
- en: The change in gravitational potential per unit mass is the field strength times the height difference, 9.8 times 5 = 49 J/kg.
- en: The unit of the answer is J/kg.
- en: Answer = 49
tier: C
