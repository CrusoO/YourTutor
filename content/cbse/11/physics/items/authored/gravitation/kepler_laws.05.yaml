stem:
  en: A moon orbits a planet at a distance four times that of an inner moon whose period is 3 days. Using Kepler's third law, what is the period of the outer moon in days?
hints:
- level: 1
  en: The period grows with the three halves power of the orbital radius.
- level: 2
  en: Raise the radius ratio to the power three halves to get the period ratio.
- level: 3
  en: Multiply the inner moon's period by that factor.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '24'
  accept: []
solution_steps:
- en: The period scales with the radius to the power three halves.
- en: Four to the power 1.5 is 8, so the outer period is 8 times 3 = 24 days.
- en: The unit of the answer is days.
- en: Answer = 24
tier: C
