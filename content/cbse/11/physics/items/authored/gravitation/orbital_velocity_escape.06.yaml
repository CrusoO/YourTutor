stem:
  en: If the mass of a planet is doubled while its radius stays the same, how does its escape velocity change?
hints:
- level: 1
  en: Escape speed depends on the planet's mass through a square root.
- level: 2
  en: Escape speed squared is proportional to mass divided by radius.
- level: 3
  en: Look at how a square root responds when its argument doubles.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
