difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Taking Earth's orbital period as 1 year, find the period in years of a planet whose average distance from the Sun is 1.5 times Earth's, using Kepler's third law. Give two decimal places.
hints:
- level: 1
  en: Find how the period changes when the orbital distance changes.
- level: 2
  en: The period squared scales with the distance cubed.
- level: 3
  en: Raise the distance ratio to the power three halves to get the period ratio.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.84'
  accept: []
solution_steps:
- en: The period scales as the distance raised to the power three halves.
- en: So T = 1.5 to the power 1.5, which is about 1.84 years.
- en: The unit of the answer is years.
- en: Answer = 1.84
tier: C
