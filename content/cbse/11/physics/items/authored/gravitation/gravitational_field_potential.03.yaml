difficulty: 0.6
pool: practice
role: procedure
stem:
  en: The gravitational potential energy of a 4 kg mass is 196 J relative to the ground. Taking g = 9.8 m/s^2, what is its height above the ground in metres?
hints:
- level: 1
  en: Potential energy relative to the ground is mass times gravity times height.
- level: 2
  en: Divide the given energy by the mass and by the field strength.
- level: 3
  en: Solve for the height as the final step.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: Potential energy relative to the ground is m g h, so h = 196 / (4 times 9.8) = 196 / 39.2 = 5 m.
- en: The unit of the answer is m.
- en: Answer = 5
tier: C
