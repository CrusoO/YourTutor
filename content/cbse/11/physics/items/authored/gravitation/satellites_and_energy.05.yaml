  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-4'
  accept: []
solution_steps:
- en: In a circular orbit the total energy is half the potential energy.
- en: Half of minus 8 GJ is minus 4 GJ.
- en: The unit of the answer is GJ.
- en: Answer = -4
tier: C
