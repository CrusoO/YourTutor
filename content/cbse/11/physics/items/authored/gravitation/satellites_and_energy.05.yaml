stem:
  en: A satellite in a circular orbit has gravitational potential energy of minus 8 gigajoules. What is its total mechanical energy in gigajoules?
hints:
- level: 1
  en: In a circular orbit the potential energy is twice the total energy.
- level: 2
  en: Find the total energy by halving the potential energy.
- level: 3
  en: Keep the negative sign in the answer.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
