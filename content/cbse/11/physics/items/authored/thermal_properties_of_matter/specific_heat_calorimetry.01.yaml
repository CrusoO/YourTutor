id: A.11.physics.thermal_properties_of_matter.specific_heat_calorimetry.01
skill_ids:
- SK.A.11.physics.specific_heat_calorimetry
difficulty: 0.2
pool: practice
role: recall
stem:
  en: 'The specific heat capacity of a substance is the heat needed to raise the temperature of:'
hints:
- level: 1
  en: The definition is given per unit of mass.
- level: 2
  en: Specific means per unit of something.
- level: 3
  en: The unit involves joules, kilograms and kelvin.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: one kilogram of it to its boiling point
- id: b
  en: one mole of it by one kelvin
- id: c
  en: one kilogram of it by one kelvin
- id: d
  en: its entire mass by one kelvin
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.213F19B8DD16
  when_answer_equals:
  - a
- id: MC.A.DC00C7D4A9C7
  when_answer_equals:
  - d
- id: MC.A.6647C80D6338
  when_answer_equals:
  - b
solution_steps:
- en: Specific heat capacity is the heat required per unit mass for a one-unit rise in temperature, so its unit is joules per kilogram per kelvin.
- en: The correct option is c.
tier: C
