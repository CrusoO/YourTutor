stem:
  en: Water has a density maximum near 4 degrees Celsius. As water cools from 10 degrees Celsius down to 4 degrees Celsius, what happens to it?
hints:
- level: 1
  en: Most substances become denser as they cool.
- level: 2
  en: Water behaves differently only in a narrow temperature range near its density maximum.
- level: 3
  en: Watch how the volume trend changes on either side of that special temperature.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
