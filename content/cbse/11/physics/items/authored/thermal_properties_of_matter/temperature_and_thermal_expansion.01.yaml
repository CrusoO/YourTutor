stem:
  en: 'When a metal rod is heated, its length increases because:'
hints:
- level: 1
  en: Consider what heating does to the motion of the atoms.
- level: 2
  en: Think about the average separation between atoms in a solid.
- level: 3
  en: Stronger vibrations push neighbouring atoms apart.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
