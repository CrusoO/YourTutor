role: recall
stem:
  en: Water has specific heat capacity 4200 J/kg K. How many kilojoules are needed to warm 2 kg of water by 10 K?
hints:
- level: 1
  en: Heat equals mass times specific heat times the temperature change.
- level: 2
  en: Multiply the three quantities together.
- level: 3
  en: Divide the joules by one thousand at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '84'
  accept: []
solution_steps:
- en: Heat equals mass times specific heat times temperature change, so Q = 2 times 4200 times 10 = 84000 J, which is 84 kJ.
- en: The unit of the answer is kJ.
- en: Answer = 84
tier: C
