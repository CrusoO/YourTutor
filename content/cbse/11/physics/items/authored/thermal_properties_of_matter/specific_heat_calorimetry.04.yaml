difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which is the SI unit of specific heat capacity?
hints:
- level: 1
  en: Heat is measured in joules.
- level: 2
  en: Specific means per unit mass and per unit temperature change.
- level: 3
  en: The denominator needs one mass unit and one temperature unit.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: joule per kilogram
- id: b
  en: joule per kelvin
- id: c
  en: watt per kelvin
- id: d
  en: joule per kilogram kelvin
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.0AFA8204BEB2
  when_answer_equals:
  - b
- id: MC.A.F8C469183201
  when_answer_equals:
  - a
- id: MC.A.D3B5B83B3CCD
  when_answer_equals:
  - c
solution_steps:
- en: Specific heat capacity is heat per unit mass per unit temperature change, so its SI unit is joule per kilogram kelvin.
- en: The correct option is d.
tier: C
