difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A slab of area 2 m^2 and thickness 2 m has a temperature difference of 20 K across it. Its thermal conductivity is 400 W/m K. What is the rate of heat flow through it in watts?
hints:
- level: 1
  en: The conduction rate depends on conductivity, area and temperature difference.
- level: 2
  en: Divide by the thickness to account for the gradient.
- level: 3
  en: Multiply the conductivity, the area and the temperature difference first.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '8000'
  accept: []
solution_steps:
- en: Conduction rate is P = k A delta T / d = 400 times 2 times 20 / 2 = 8000 W.
- en: The unit of the answer is W.
- en: Answer = 8000
tier: C
