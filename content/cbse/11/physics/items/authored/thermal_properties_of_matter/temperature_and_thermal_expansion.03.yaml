difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A glass vessel of volume 500 cm^3 is filled with mercury at 20 degrees Celsius. When heated through 50 K, how many cubic centimetres of mercury overflow? The volume expansion coefficient of mercury is 1.8 times 10^-4 per K, and glass expansion is ignored.
hints:
- level: 1
  en: Volume expansion uses the volume coefficient, not the linear coefficient.
- level: 2
  en: Multiply the original volume by the coefficient and by the temperature rise.
- level: 3
  en: Glass expansion is ignored in this question.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4.5'
  accept: []
solution_steps:
- en: The expansion of the mercury is V beta delta T = 500 times 1.8 times 10^-4 times 50 = 4.5 cm^3.
- en: The unit of the answer is cm^3.
- en: Answer = 4.5
tier: C
