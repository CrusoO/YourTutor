stem:
  en: In an insulated container, 50 g of ice at 0 degrees Celsius is added to 200 g of water at 25 degrees Celsius. Latent heat of fusion is 336 J/g and water's specific heat is 4.2 J/g K. What is the final temperature in degrees Celsius?
hints:
- level: 1
  en: First check whether the heat given up by the water can melt all of the ice.
- level: 2
  en: Compare the heat needed to melt the ice with the heat the water can give up.
- level: 3
  en: After melting, treat the whole liquid as one sample of water and find its warming.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: The water releases 21000 J on cooling to 0 degrees, but melting the ice needs only 16800 J.
- en: The remaining 4200 J warms the 250 g of water by 4 degrees.
- en: The unit of the answer is degrees Celsius.
- en: Answer = 4
tier: C
