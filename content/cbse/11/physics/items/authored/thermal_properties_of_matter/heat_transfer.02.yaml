id: A.11.physics.thermal_properties_of_matter.heat_transfer.02
skill_ids:
- SK.A.11.physics.heat_transfer
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A metal rod is heated at one end. Heat travels to the far end mainly by which mode?
hints:
- level: 1
  en: Energy passes from one particle to the next through contact.
- level: 2
  en: No fluid flows inside a solid rod.
- level: 3
  en: Think of the mode that needs matter in contact.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: evaporation
- id: b
  en: conduction
- id: c
  en: convection
- id: d
  en: radiation
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.99310274754D
  when_answer_equals:
  - d
- id: MC.A.96A418EE701B
  when_answer_equals:
  - c
- id: MC.A.B1218EDE5112
  when_answer_equals:
  - a
solution_steps:
- en: In a solid, energy passes from particle to particle through contact, which is conduction.
- en: The metal rod does not flow, so convection is not the main mode.
- en: The correct option is b.
tier: C
diagram_note: A horizontal metal rod with one end labelled hot and a flame beneath that end. Arrows along the rod show heat moving toward the cooler end.
