stem:
  en: A steel rod of length 2 m is heated through 100 K. Its coefficient of linear expansion is 12 times 10 to the power minus six per kelvin. What is its increase in length in millimetres?
hints:
- level: 1
  en: The change in length is the original length times the coefficient times the temperature change.
- level: 2
  en: Keep all quantities in metres and kelvin until the end.
- level: 3
  en: Convert metres to millimetres as the final step.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2.4'
  accept: []
solution_steps:
- en: The change in length is L alpha delta T = 2 times 12 times 10^-6 times 100 = 0.0024 m, which is 2.4 mm.
- en: The unit of the answer is mm.
- en: Answer = 2.4
