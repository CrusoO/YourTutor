stem:
  en: A 0.5 kg metal block at 100 degrees Celsius is dropped into 1 kg of water at 20 degrees Celsius. The final common temperature is 30 degrees Celsius, with no heat lost. Water has specific heat 4200 J/kg K. What is the specific heat of the metal in J/kg K?
hints:
- level: 1
  en: Heat lost by the hot body equals heat gained by the cold one.
- level: 2
  en: Write each heat as mass times specific heat times the temperature change.
- level: 3
  en: Solve the equality for the unknown specific heat.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1200'
  accept: []
solution_steps:
- en: Heat lost by the metal, 0.5 times c times 70, equals heat gained by the water, 1 times 4200 times 10.
- en: So c = 42000 / 35 = 1200 J/kg K.
- en: The unit of the answer is J/kg K.
- en: Answer = 1200
tier: C
