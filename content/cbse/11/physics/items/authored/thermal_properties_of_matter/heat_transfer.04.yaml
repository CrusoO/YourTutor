stem:
  en: 'Newton''s law of cooling states that the rate at which a body loses heat is:'
hints:
- level: 1
  en: Hot coffee cools quickly at first and then more slowly.
- level: 2
  en: Consider how the surroundings enter the rate of cooling.
- level: 3
  en: A linear relation is the simplest version of this law.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
