difficulty: 0.9
pool: practice
role: transfer
stem:
  en: An aluminium sheet has area 2 m^2 at 20 degrees Celsius. Its coefficient of area expansion is 4.6 times 10^-5 per K. Its temperature rises by 80 K. What is the increase in area in square centimetres, to one decimal place?
hints:
- level: 1
  en: The area coefficient is given directly, so you do not need to double anything.
- level: 2
  en: Multiply the original area, the coefficient and the temperature change.
- level: 3
  en: Convert square metres to square centimetres at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '73.6'
  accept: []
solution_steps:
- en: The increase in area is A beta delta T = 2 times 4.6 times 10^-5 times 80 = 7.36 times 10^-3 m^2.
- en: One square metre is ten thousand square centimetres, so the increase is 73.6 cm^2.
- en: The unit of the answer is cm^2.
- en: Answer = 73.6
tier: C
