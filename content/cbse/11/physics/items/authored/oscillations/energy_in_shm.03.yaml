stem:
  en: A particle of mass 0.2 kg in SHM has amplitude 0.1 m and angular frequency 5 rad/s. What is its total mechanical energy in joules?
hints:
- level: 1
  en: The total energy equals the maximum kinetic energy at the mean position.
- level: 2
  en: Use the maximum speed, which is amplitude times angular frequency.
- level: 3
  en: Half of the mass times that speed squared gives the answer.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.025'
  accept: []
solution_steps:
- en: The total energy is one half times m times omega squared times A squared, which is 0.5 times 0.2 times 25 times 0.01 = 0.025 J.
- en: The unit of the answer is J.
- en: Answer = 0.025
tier: C
