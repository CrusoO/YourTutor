stem:
  en: A mass in SHM has total energy 0.5 J and amplitude 0.2 m. What is the spring constant in newtons per metre?
hints:
- level: 1
  en: The total energy equals half the spring constant times the amplitude squared.
- level: 2
  en: Rearrange the relation to isolate the spring constant.
- level: 3
  en: Multiply the energy by two before dividing by the amplitude squared.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '25'
  accept: []
solution_steps:
- en: The total energy is one half k A^2, so k = 2E / A^2 = 1 / 0.04 = 25 N/m.
- en: The unit of the answer is N/m.
- en: Answer = 25
tier: C
