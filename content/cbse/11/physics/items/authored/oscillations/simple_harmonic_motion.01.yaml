id: A.11.physics.oscillations.simple_harmonic_motion.01
skill_ids:
- SK.A.11.physics.simple_harmonic_motion
difficulty: 0.2
pool: practice
role: recall
stem:
  en: 'In simple harmonic motion, the acceleration of the particle is:'
hints:
- level: 1
  en: Think about the restoring force in a stretched spring.
- level: 2
  en: The acceleration changes as the particle moves.
- level: 3
  en: Compare where the restoring effect is greatest.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: proportional to the velocity
- id: b
  en: zero at the extreme positions
- id: c
  en: constant in magnitude and direction
- id: d
  en: proportional to the displacement and directed toward the mean position
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.69F7EED8CAEF
  when_answer_equals:
  - c
- id: MC.A.22DE4A7063C7
  when_answer_equals:
  - a
- id: MC.A.55FEA5E8F9DD
  when_answer_equals:
  - b
solution_steps:
- en: In SHM the restoring acceleration is proportional to the displacement from the mean position and points back toward that position.
- en: The correct option is d.
tier: C
