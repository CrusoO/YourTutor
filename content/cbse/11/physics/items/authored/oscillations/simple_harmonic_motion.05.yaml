stem:
  en: A particle moves with x = 0.05 sin(10 t) metres, with t in seconds. What is the magnitude of its maximum acceleration in metres per second squared?
hints:
- level: 1
  en: The acceleration amplitude is the amplitude times the square of the angular frequency.
- level: 2
  en: Read the amplitude and the angular frequency from the sine form.
- level: 3
  en: Square the angular frequency before multiplying by the amplitude.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
