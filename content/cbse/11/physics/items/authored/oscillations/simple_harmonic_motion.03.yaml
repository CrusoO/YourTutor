stem:
  en: A particle in SHM has amplitude 4 cm and angular frequency 2 rad/s. What is its maximum speed in cm/s?
hints:
- level: 1
  en: The maximum speed occurs at the mean position.
- level: 2
  en: Multiply the amplitude by the angular frequency.
- level: 3
  en: Keep the units in centimetres and seconds.
