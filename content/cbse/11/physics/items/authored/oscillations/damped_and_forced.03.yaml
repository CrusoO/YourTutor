stem:
  en: A damped oscillator is to return to equilibrium as quickly as possible without overshooting. Which damping condition is required?
hints:
- level: 1
  en: This case is the boundary between oscillating and non-oscillating motion.
- level: 2
  en: Too much resistance slows the return to equilibrium.
- level: 3
  en: Think of a door closer that brings the door back quickly without swinging past the frame.
