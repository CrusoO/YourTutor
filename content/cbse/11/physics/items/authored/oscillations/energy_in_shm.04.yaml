stem:
  en: In simple harmonic motion, at what displacement are the kinetic energy and the potential energy equal?
hints:
- level: 1
  en: The total energy splits between the kinetic and potential forms.
- level: 2
  en: Set the potential energy equal to half the total energy.
- level: 3
  en: Solve for the displacement in terms of the amplitude.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: amplitude divided by the square root of 2
- id: b
  en: at the extreme positions
- id: c
  en: at the mean position
- id: d
  en: nowhere in the motion
answer:
  sympy: a
  accept: []
