role: recall
stem:
  en: A 2 kg mass is attached to a spring of stiffness 50 N/m and set oscillating. Using pi as 3.14, what is the period in seconds, to two decimal places?
hints:
- level: 1
  en: The period of a spring-mass system depends on the mass and the stiffness.
- level: 2
  en: Take the square root of the mass divided by the stiffness.
- level: 3
  en: Multiply by two pi at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.26'
  accept: []
solution_steps:
- en: The period is 2 pi times the square root of m over k, which is 6.28 times the square root of 0.04, equal to 1.256 s.
- en: The unit of the answer is s.
- en: Answer = 1.26
tier: C
diagram_note: A vertical spring hanging from a fixed support with a 2 kg mass attached at its lower end. Arrows show the mass moving up and down about its rest position.
