stem:
  en: A simple pendulum has length 1 m. Taking g = 9.8 m/s^2 and pi as 3.14, what is its period in seconds, to two decimal places?
hints:
- level: 1
  en: For small swings the period depends only on the length and gravity.
- level: 2
  en: Use the square root of length divided by gravity.
- level: 3
  en: Multiply by two pi at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
