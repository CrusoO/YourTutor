stem:
  en: A lightly damped oscillator has a high quality factor Q. What does a high Q indicate?
hints:
- level: 1
  en: A high quality factor means low energy loss per cycle.
- level: 2
  en: Sharp resonance peaks come from little damping.
- level: 3
  en: Think about how much energy the system loses each cycle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
