  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: damping is light, so the resonance peak is sharp and tall
- id: b
  en: damping is heavy, so the resonance peak is broad
- id: c
  en: the driving force is very large
- id: d
  en: the natural frequency is zero
answer:
  sympy: a
  accept: []
