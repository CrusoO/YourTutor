id: A.11.physics.oscillations.simple_harmonic_motion.02
skill_ids:
- SK.A.11.physics.simple_harmonic_motion
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In simple harmonic motion, at which position is the speed of the particle at its maximum?
hints:
- level: 1
  en: The displacement is zero at the centre of the motion.
- level: 2
  en: Potential energy is smallest where the displacement is smallest.
- level: 3
  en: Think about where the particle moves fastest.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: where the potential energy is largest
- id: b
  en: the mean position
- id: c
  en: wherever the acceleration is largest
- id: d
  en: the extreme positions
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.6CA4B407A1BD
  when_answer_equals:
  - d
- id: MC.A.41145F16F89D
  when_answer_equals:
  - c
- id: MC.A.92337CD5D62B
  when_answer_equals:
  - a
solution_steps:
- en: At the mean position the displacement and potential energy are zero, so all the energy is kinetic and the speed is at its maximum.
- en: The correct option is b.
tier: C
diagram_note: A horizontal spring-mass system with the mean position marked at the centre and the two extreme positions marked on either side. An arrow shows the oscillation between them.
