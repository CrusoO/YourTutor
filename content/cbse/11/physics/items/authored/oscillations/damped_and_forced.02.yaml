difficulty: 0.2
pool: practice
role: recall
stem:
  en: In a damped oscillator, what happens to the amplitude of oscillation over time?
hints:
- level: 1
  en: Friction or resistance removes energy from the motion.
- level: 2
  en: Think of a swing slowing down when nobody pushes it.
- level: 3
  en: Energy is lost to the environment over each cycle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it stays constant
- id: b
  en: it increases without bound
- id: c
  en: it grows and then shrinks
- id: d
  en: it decreases
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.22DF2C9132AD
  when_answer_equals:
  - b
- id: MC.A.3DF8FE67D091
  when_answer_equals:
  - a
- id: MC.A.375935B5E567
  when_answer_equals:
  - c
solution_steps:
- en: Damping removes energy from the oscillator through friction or resistance, so the amplitude decays with time.
- en: The correct option is d.
tier: C
diagram_note: A plot of displacement against time for an oscillating mass. The peaks become progressively smaller as time increases.
