solution_steps:
- en: The total energy is one half m omega squared A squared.
- en: Doubling A multiplies A squared by four, so the total energy quadruples.
- en: The correct option is a.
tier: C
diagram_note: Two sine waves drawn on the same axes. One has amplitude A marked above and below the axis, and the second, taller wave is labelled with amplitude 2A.
