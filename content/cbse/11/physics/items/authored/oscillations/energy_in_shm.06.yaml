stem:
  en: If the amplitude of a simple harmonic oscillator is doubled while its frequency stays the same, how does its total energy change?
hints:
- level: 1
  en: The energy depends on the amplitude squared.
- level: 2
  en: Compare the new amplitude squared with the old one.
- level: 3
  en: The energy scales with a power of the amplitude, not the amplitude itself.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it quadruples
- id: b
  en: it doubles
- id: c
  en: it halves
- id: d
  en: it stays the same
answer:
  sympy: a
  accept: []
