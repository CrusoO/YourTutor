difficulty: 0.2
pool: practice
role: recall
stem:
  en: A string fixed at both ends is 0.4 m long, and waves travel along it at 100 m/s. What is its fundamental frequency in hertz?
hints:
- level: 1
  en: The fundamental frequency uses a wavelength equal to twice the string length.
- level: 2
  en: Divide the wave speed by that wavelength.
- level: 3
  en: Keep the frequency in hertz.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '125'
  accept: []
solution_steps:
- en: The fundamental wavelength is twice the string length, 0.8 m.
- en: The frequency is 100 / 0.8 = 125 Hz.
- en: The unit of the answer is Hz.
- en: Answer = 125
tier: C
diagram_note: A horizontal string fixed at both ends with a single loop drawn between the ends. The length of 0.4 m is labelled along the string.
