role: recall
stem:
  en: Sound travelling through air is what type of wave?
hints:
- level: 1
  en: Sound moves through air as compressions and rarefactions.
- level: 2
  en: The particles oscillate along the direction the wave travels.
- level: 3
  en: Ask whether the particle displacement is along or across the direction of travel.
