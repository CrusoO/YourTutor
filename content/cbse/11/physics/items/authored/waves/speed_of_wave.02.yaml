id: A.11.physics.waves.speed_of_wave.02
skill_ids:
- SK.A.11.physics.speed_of_wave
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What determines the speed of a mechanical wave in a uniform medium?
hints:
- level: 1
  en: Ask what the medium is like rather than what the source is doing.
- level: 2
  en: The source sets how often the oscillations occur.
- level: 3
  en: Consider which properties of the rope or the air govern how fast a disturbance spreads.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the properties of the medium, such as its tension and density
- id: b
  en: the wavelength chosen by the source
- id: c
  en: the amplitude of the source
- id: d
  en: the frequency chosen by the source
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.E9768BD21FBB
  when_answer_equals:
  - c
- id: MC.A.CDD4C0CAE007
  when_answer_equals:
  - d
- id: MC.A.0D23BD007A19
  when_answer_equals:
  - b
solution_steps:
- en: In a given medium the wave speed is fixed by the medium's properties.
- en: The source controls the frequency, and the wavelength then follows from the speed.
- en: The correct option is a.
tier: C
