stem:
  en: A string under a tension of 80 N has a mass of 0.02 kg per metre. What is the speed of transverse waves on it in metres per second, to one decimal place?
hints:
- level: 1
  en: Wave speed on a string depends on the tension and the mass per unit length.
- level: 2
  en: Divide the tension by the mass per unit length.
- level: 3
  en: Take the square root last.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '63.2'
  accept: []
solution_steps:
- en: The wave speed on a string is the square root of T divided by mu, which is the square root of 80 / 0.02 = 4000, or about 63.2 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 63.2
tier: C
