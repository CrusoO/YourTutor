- SK.A.11.physics.beats_and_doppler
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A source emits 500 Hz and moves toward a stationary listener at 20 m/s. Taking the speed of sound as 340 m/s, what frequency in hertz does the listener hear, to the nearest hertz?
hints:
- level: 1
  en: An approaching source compresses the wavelengths ahead of it.
- level: 2
  en: Use the observed frequency formula with the speed of sound minus the source speed in the denominator.
- level: 3
  en: Multiply the source frequency by the speed of sound, then divide.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '531'
  accept: []
solution_steps:
- en: For an approaching source the observed frequency is f v / (v - v_s) = 500 times 340 / 320 = 531.25 Hz, which rounds to 531 Hz.
- en: The unit of the answer is Hz.
- en: Answer = 531
tier: C
