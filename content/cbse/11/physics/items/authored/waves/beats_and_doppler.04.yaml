id: A.11.physics.waves.beats_and_doppler.04
skill_ids:
- SK.A.11.physics.beats_and_doppler
difficulty: 0.6
pool: practice
role: apply
stem:
  en: 'When a source moves away from a stationary observer, the observed frequency is:'
hints:
- level: 1
  en: Think of a passing siren changing pitch.
- level: 2
  en: Moving away stretches the wavelengths.
- level: 3
  en: Stretched wavelengths mean fewer waves per second reach the listener.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: lower than the source frequency
- id: b
  en: zero
- id: c
  en: higher than the source frequency
- id: d
  en: equal to the source frequency
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.760D3B9DE992
  when_answer_equals:
  - c
- id: MC.A.5EBCA3A8B0BF
  when_answer_equals:
  - d
- id: MC.A.93E8225F9B9B
  when_answer_equals:
  - b
solution_steps:
- en: A receding source stretches the wavelengths, so fewer wave crests reach the observer each second and the observed frequency is lower.
- en: The correct option is a.
tier: C
