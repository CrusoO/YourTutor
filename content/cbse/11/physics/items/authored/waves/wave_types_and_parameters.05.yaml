stem:
  en: On a transverse wave, the distance from a crest to the adjacent trough is 0.4 m. What is the wavelength in metres?
hints:
- level: 1
  en: A crest and an adjacent trough are half a cycle apart.
- level: 2
  en: Double the crest-to-trough distance to get a full wavelength.
- level: 3
  en: Keep the result in metres.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.8'
  accept: []
solution_steps:
- en: A crest and the adjacent trough are half a cycle apart, so the full wavelength is twice 0.4 m, which is 0.8 m.
- en: The unit of the answer is m.
- en: Answer = 0.8
tier: C
diagram_note: A sine wave with a crest and its adjacent trough marked. A horizontal arrow spans from the crest to the trough, and a bracket shows one full wavelength.
