difficulty: 0.2
pool: practice
role: recall
stem:
  en: Two tuning forks of frequencies 256 Hz and 260 Hz are struck together. How many beats per second are heard?
hints:
- level: 1
  en: Beats occur at the difference of the two frequencies.
- level: 2
  en: Subtract the smaller frequency from the larger one.
- level: 3
  en: The beat frequency is always positive.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: The beat frequency is the difference of the two frequencies, 260 - 256 = 4 beats per second.
- en: The unit of the answer is Hz.
- en: Answer = 4
tier: C
