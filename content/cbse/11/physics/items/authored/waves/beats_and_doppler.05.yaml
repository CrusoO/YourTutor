difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A stationary listener hears a 400 Hz source directly and a second identical 400 Hz source approaching at 10 m/s. Taking the speed of sound as 340 m/s, how many beats per second does the listener hear, to one decimal place?
hints:
- level: 1
  en: Find the frequency that the moving source produces at the listener first.
- level: 2
  en: Subtract the stationary source frequency from the frequency of the moving one.
- level: 3
  en: Use the approaching source formula with the speed of sound minus the source speed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '12.1'
  accept: []
solution_steps:
- en: The approaching source is heard at 400 times 340 / 330 = 412.1 Hz.
- en: Beating against the 400 Hz source gives 12.1 beats per second.
- en: The unit of the answer is Hz.
- en: Answer = 12.1
tier: C
