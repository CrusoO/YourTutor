id: A.11.physics.waves.wave_types_and_parameters.04
skill_ids:
- SK.A.11.physics.wave_types_and_parameters
difficulty: 0.6
pool: practice
role: apply
stem:
  en: The wavelength of a wave is the distance between which two points?
hints:
- level: 1
  en: The wavelength is the length of one full repeating pattern.
- level: 2
  en: Pick two points that look identical in the shape of the wave.
- level: 3
  en: Half a cycle connects a crest with a trough.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the source and the first crest
- id: b
  en: two nodes of a standing wave
- id: c
  en: two successive crests
- id: d
  en: a crest and the mean position
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.19A933113279
  when_answer_equals:
  - d
- id: MC.A.8521493971ED
  when_answer_equals:
  - b
- id: MC.A.91F2701BB937
  when_answer_equals:
  - a
solution_steps:
- en: The wavelength is the spatial period of the wave, so it is the distance between two successive points that look identical, such as two crests.
- en: The correct option is c.
tier: C
