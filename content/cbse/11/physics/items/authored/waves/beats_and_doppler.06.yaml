difficulty: 0.9
pool: practice
role: transfer
stem:
  en: An observer moves toward a stationary source that emits a constant frequency. What happens to the frequency the observer hears?
hints:
- level: 1
  en: The observer meets more wave crests per second when moving toward the source.
- level: 2
  en: Relative motion matters, not only which object is moving.
- level: 3
  en: Compare the number of crests reaching the observer per second in both cases.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: it decreases
- id: b
  en: it stays the same
- id: c
  en: it becomes zero
- id: d
  en: it increases
answer:
  sympy: d
  accept: []
misconception_rules:
