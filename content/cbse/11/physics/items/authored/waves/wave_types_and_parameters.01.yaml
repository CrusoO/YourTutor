id: A.11.physics.waves.wave_types_and_parameters.01
skill_ids:
- SK.A.11.physics.wave_types_and_parameters
difficulty: 0.2
pool: practice
role: recall
stem:
  en: 'In a transverse wave, the particles of the medium oscillate:'
hints:
- level: 1
  en: Compare the particle motion with the direction in which the wave moves.
- level: 2
  en: Think of a rope shaken up and down.
- level: 3
  en: Transverse means across the direction of travel.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: parallel to the direction in which the wave travels
- id: b
  en: in circles and never move along a line
- id: c
  en: not at all, since only energy moves
- id: d
  en: perpendicular to the direction in which the wave travels
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.F1212DAB6A8E
  when_answer_equals:
  - a
- id: MC.A.57CA275ACB44
  when_answer_equals:
  - b
- id: MC.A.F71AA8FE690D
  when_answer_equals:
  - c
solution_steps:
- en: In a transverse wave the displacement of the particles is at right angles to the direction of energy transfer, as when a rope is shaken up and down.
- en: The correct option is d.
tier: C
