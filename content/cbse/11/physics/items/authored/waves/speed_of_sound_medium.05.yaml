stem:
  en: The speed of sound in air increases by roughly what percentage when the absolute temperature rises from 273 K to 300 K, given that the speed goes as the square root of absolute temperature?
hints:
- level: 1
  en: Speed in air depends on the square root of the absolute temperature.
- level: 2
  en: Compare absolute temperatures, not the Celsius values.
- level: 3
  en: A square root reduces the size of the percentage change.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
