difficulty: 0.9
pool: practice
role: transfer
stem:
  en: An organ pipe open at both ends is 0.85 m long, and sound travels at 340 m/s in the air inside it. What is its fundamental frequency in hertz?
hints:
- level: 1
  en: A pipe open at both ends has antinodes at both ends.
- level: 2
  en: The fundamental wavelength is twice the length of the pipe.
- level: 3
  en: Divide the speed of sound by the wavelength.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '200'
  accept: []
solution_steps:
- en: An open pipe has its fundamental wavelength equal to twice its length, 1.7 m.
- en: The frequency is 340 / 1.7 = 200 Hz.
- en: The unit of the answer is Hz.
- en: Answer = 200
tier: C
diagram_note: A tube open at both ends drawn horizontally, with a half-wavelength arc inside it. The pipe length of 0.85 m is labelled.
