skill_ids:
- SK.A.11.physics.standing_waves_strings
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A string of length 0.6 m, fixed at both ends, vibrates in its third harmonic at 300 Hz. What is the wave speed on the string in metres per second?
hints:
- level: 1
  en: The third harmonic has three half-wavelengths fitted on the string.
- level: 2
  en: Find the wavelength from the string length first.
- level: 3
  en: Multiply the frequency by the wavelength.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '120'
  accept: []
solution_steps:
- en: The third harmonic has three half-wavelengths on the string, so the wavelength is 2 times 0.6 / 3 = 0.4 m.
- en: The speed is 300 times 0.4 = 120 m/s.
- en: The unit of the answer is m/s.
- en: Answer = 120
tier: C
