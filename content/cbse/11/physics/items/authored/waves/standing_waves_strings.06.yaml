stem:
  en: A string's tension is quadrupled while its length and mass per unit length stay the same. How does its fundamental frequency change?
hints:
- level: 1
  en: Wave speed depends on the tension through a square root.
- level: 2
  en: The fundamental frequency is the speed divided by twice the string length.
- level: 3
  en: Find how a square root responds when its argument is multiplied by four.
prediction_prompt:
