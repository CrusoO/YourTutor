id: A.11.physics.waves.standing_waves_strings.01
skill_ids:
- SK.A.11.physics.standing_waves_strings
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A string fixed at both ends is 1 m long and vibrates in its fundamental mode. What is the wavelength in metres?
hints:
- level: 1
  en: In the fundamental mode the string length is half a wavelength.
- level: 2
  en: Double the string length to get the wavelength.
- level: 3
  en: Keep the answer in metres.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: In the fundamental mode the string length is half a wavelength, so the wavelength is twice the string length, which is 2 m.
- en: The unit of the answer is m.
- en: Answer = 2
tier: C
