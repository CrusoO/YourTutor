id: A.11.physics.waves.speed_of_wave.04
skill_ids:
- SK.A.11.physics.speed_of_wave
difficulty: 0.6
pool: practice
role: apply
stem:
  en: A wave travels from air into water. Which quantity stays unchanged across the boundary?
hints:
- level: 1
  en: The source sets how often oscillations occur.
- level: 2
  en: Speed depends on the medium the wave travels through.
- level: 3
  en: Ask which property belongs to the source rather than to the medium.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: speed
- id: b
  en: frequency
- id: c
  en: all three quantities
- id: d
  en: wavelength
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.FAC69E7863F3
  when_answer_equals:
  - a
- id: MC.A.F9688C60E05C
  when_answer_equals:
  - d
- id: MC.A.66DEAA7CE9DD
  when_answer_equals:
  - c
solution_steps:
- en: Frequency is set by the source and does not change at a boundary.
- en: The speed and the wavelength both change, as speed = frequency times wavelength.
- en: The correct option is b.
tier: C
