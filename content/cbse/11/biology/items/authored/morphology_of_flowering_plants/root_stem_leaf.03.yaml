difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why are the tendrils of a pea plant considered modified leaves rather than modified stems?
hints:
- level: 1
  en: Check where the tendril attaches on the plant.
- level: 2
  en: Think about what the coiling organ is attached to.
- level: 3
  en: Compare the tendril's position with the position of normal leaves.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Tendrils arise from the leaf and coil around supports, which matches a leaf modification
- id: b
  en: Tendrils are always found on monocot stems
- id: c
  en: Tendrils contain chlorophyll and therefore are leaves
- id: d
  en: Tendrils grow underground like roots
answer:
  sympy: a
  accept: []
