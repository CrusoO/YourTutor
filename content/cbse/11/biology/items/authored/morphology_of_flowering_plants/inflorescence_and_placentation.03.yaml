id: A.11.biology.morphology_of_flowering_plants.inflorescence_and_placentation.03
skill_ids:
- SK.A.11.biology.inflorescence_and_placentation
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does an ovary with axile placentation usually have several locules?
hints:
- level: 1
  en: Think about the central axis and what it joins.
- level: 2
  en: Consider which structures divide the ovary into compartments.
- level: 3
  en: The locules are formed by walls rather than by the style.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The style is branched into several parts
- id: b
  en: Each carpel forms a separate fruit
- id: c
  en: The petals fuse to form partitions
- id: d
  en: Ovules are attached to a central axis that is connected to partitions that divide the ovary
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.F270E8BCF89D
  when_answer_equals:
  - a
- id: MC.A.C776F4CBB0A9
  when_answer_equals:
  - b
- id: MC.A.B38135229A19
  when_answer_equals:
  - c
solution_steps:
- en: Axile placentation places ovules on a central axis that connects to the partitions of a multilocular ovary, and this creates the separate locules.
- en: This is common in tomato and lily.
- en: The correct option is d.
tier: C
diagram_note: Draw an ovary in cross section with a central axis and partitions joining it, labelling the locules, the axis and the ovules on the axis.
