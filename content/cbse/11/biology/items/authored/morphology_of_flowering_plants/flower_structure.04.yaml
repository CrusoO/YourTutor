solution_steps:
- en: Going from outside to inside, a flower has the calyx of sepals, the corolla of petals, the androecium of stamens and the gynoecium of carpels.
- en: This order is used when labelling diagrams.
- en: The correct option is c.
tier: C
diagram_note: Draw a flower in cross section as concentric rings, labelling the calyx, corolla, androecium and gynoecium from the outside inwards.
