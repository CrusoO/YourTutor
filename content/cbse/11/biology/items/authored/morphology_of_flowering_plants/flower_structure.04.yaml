difficulty: 0.6
pool: practice
role: procedure
stem:
  en: When drawing a flower for labelling, which order of whorls is correct from the outside inwards?
hints:
- level: 1
  en: Start from the outermost protective whorl.
- level: 2
  en: Move inward through the showy petals before the reproductive whorls.
- level: 3
  en: The innermost whorl is the female one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Calyx, androecium, corolla, gynoecium
- id: b
  en: Androecium, gynoecium, calyx, corolla
- id: c
  en: Calyx, corolla, androecium, gynoecium
- id: d
  en: Corolla, calyx, gynoecium, androecium
answer:
  sympy: c
  accept: []
misconception_rules:
