id: A.11.biology.morphology_of_flowering_plants.flower_structure.03
skill_ids:
- SK.A.11.biology.flower_structure
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why is a flower with both stamens and carpels on the same flower described as bisexual?
hints:
- level: 1
  en: Check whether both sets of reproductive whorls appear in one flower.
- level: 2
  en: Think about whether the flower is on a single plant or spread across plants.
- level: 3
  en: Look at what kinds of organs the flower carries, not at other whorls.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It produces seeds without pollination
- id: b
  en: It grows on two separate plants
- id: c
  en: It bears both male and female reproductive organs in one flower
- id: d
  en: It has no sepals and no petals
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.46EF181ECCCB
  when_answer_equals:
  - d
- id: MC.A.FDFAE400EF73
  when_answer_equals:
  - b
- id: MC.A.1718F9F140B7
  when_answer_equals:
  - a
solution_steps:
- en: A bisexual flower carries both androecium and gynoecium.
- en: Dioecious plants, in contrast, bear male and female flowers on separate plants.
- en: The correct option is c.
tier: C
diagram_note: Draw a single flower in longitudinal section, labelling the stamens in the androecium and the carpel in the gynoecium, to show both sexes in one flower.
