stem:
  en: A cymose inflorescence has a terminal flower on the main axis, and that axis has 2 lateral branches. Each lateral branch ends in a flower and has 3 further lateral branches, each ending in one flower. How many flowers does the whole inflorescence have, counting the terminal flower?
hints:
- level: 1
  en: Count the terminal flower first and then the flowers on the first set of branches.
- level: 2
  en: Each first-level branch produces its own set of further branches.
- level: 3
  en: Add the counts at each level before finishing the total.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
