  original: true
  author: model-draft
type: numeric
answer:
  sympy: '9'
  accept: []
solution_steps:
- en: The terminal flower gives 1.
- en: Two lateral branches each end in a flower, giving 2, and each of those gives 3 further flowers, which is 6.
- en: Adding 1, 2 and 6 gives 9.
- en: Answer = 9
