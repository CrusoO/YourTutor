id: A.11.biology.morphology_of_flowering_plants.flower_structure.06
skill_ids:
- SK.A.11.biology.flower_structure
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A plant bears many small flowers clustered around a central axis with flowers opening from the base upward. Which statement about this flower arrangement is most accurate?
hints:
- level: 1
  en: Ask whether the main axis keeps growing or ends in a flower.
- level: 2
  en: Consider the order in which the flowers open along the axis.
- level: 3
  en: Think about whether the arrangement is a single flower or a cluster of several.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is a cymose inflorescence with the top flower opening first
- id: b
  en: It is a racemose inflorescence, in which the main axis grows on and flowers open from the bottom up
- id: c
  en: It is a fruit cluster after pollination
- id: d
  en: It is a solitary flower with no inflorescence
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.36F23E877B4A
  when_answer_equals:
  - d
- id: MC.A.05D7E6C911A0
  when_answer_equals:
  - a
- id: MC.A.A8A657133593
  when_answer_equals:
  - c
solution_steps:
- en: A racemose inflorescence has an unlimited main axis, and flowers open in order from the base or margin toward the tip.
- en: The arrangement is common in plants with many small flowers.
- en: The correct option is b.
tier: C
diagram_note: Draw a raceme with a central axis, stalked flowers arising in sequence along it, and the youngest flower at the tip, labelling the axis, the pedicels and the flowers.
