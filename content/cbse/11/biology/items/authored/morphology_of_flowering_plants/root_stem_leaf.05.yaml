id: A.11.biology.morphology_of_flowering_plants.root_stem_leaf.05
skill_ids:
- SK.A.11.biology.root_stem_leaf
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A plant has spines that arise from the axil of leaves and protect the stem. Which modification is this, and what is its likely function?
hints:
- level: 1
  en: Look at where the spine sits relative to the leaf.
- level: 2
  en: Think about what a plant gains from sharp protective structures in dry conditions.
- level: 3
  en: Consider whether the spine is a leaf modification or a stem modification.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A modified stem structure, reducing water loss and deterring grazing
- id: b
  en: A floral part for attracting pollinators
- id: c
  en: A modified root for storing water
- id: d
  en: A modified leaf for photosynthesis
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.97179D77A5BC
  when_answer_equals:
  - c
- id: MC.A.32037B86DE7E
  when_answer_equals:
  - d
- id: MC.A.81479CAD5067
  when_answer_equals:
  - b
solution_steps:
- en: Spines arising from leaf axils are modified stem or branch structures, and they reduce water loss and deter grazing animals.
- en: Some cacti and related plants use spines this way.
- en: The correct option is a.
tier: C
diagram_note: Draw a stem with a leaf and a spine arising from the leaf axil, labelling the axil, the spine, the leaf and the stem node.
