id: A.11.biology.morphology_of_flowering_plants.root_stem_leaf.04
skill_ids:
- SK.A.11.biology.root_stem_leaf
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A student wants to decide whether a fleshy swollen organ is a root or a stem. Which feature should the student check first?
hints:
- level: 1
  en: Think about which structures appear only on stems.
- level: 2
  en: Check the surface of the organ for repeated points of attachment.
- level: 3
  en: Look for features that are about structure rather than use or colour.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Whether the organ is above the soil
- id: b
  en: Whether the organ has nodes, buds or scale-like leaves
- id: c
  en: Whether the organ is coloured
- id: d
  en: Whether the organ is edible
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.F14124BCCF38
  when_answer_equals:
  - d
- id: MC.A.9668E1C903DD
  when_answer_equals:
  - c
- id: MC.A.48E6E276242F
  when_answer_equals:
  - a
solution_steps:
- en: Stems bear nodes, buds and leaves, while roots do not, so the presence of nodes is the first decisive check.
- en: Scale-like leaves and buds are typical of stem modifications.
- en: The correct option is b.
tier: C
