solution_steps:
- en: In a pinnately compound leaf, several leaflets lie along a central axis, the rachis, in a feather-like arrangement.
- en: A palmately compound leaf has leaflets arising from a single point.
- en: The correct option is a.
tier: C
diagram_note: Draw a compound leaf with a central rachis and leaflets on both sides, labelling the rachis, the leaflets and the petiole.
