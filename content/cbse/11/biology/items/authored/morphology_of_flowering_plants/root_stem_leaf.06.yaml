difficulty: 0.9
pool: practice
role: apply
stem:
  en: A leaf is pinnately compound, with leaflets arranged on both sides of a central rachis. Which leaf type does this describe?
hints:
- level: 1
  en: Check whether the leaflets arise from one point or along a central axis.
- level: 2
  en: Ask whether the blade is one continuous piece or divided.
- level: 3
  en: Look at the arrangement of the leaflets rather than their edges.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Pinnately compound leaf
- id: b
  en: Simple leaf with a serrated margin
- id: c
  en: Palmately compound leaf
- id: d
  en: Peltate leaf
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.B49DDAE1270B
  when_answer_equals:
  - c
- id: MC.A.15F6EDDFF34E
  when_answer_equals:
