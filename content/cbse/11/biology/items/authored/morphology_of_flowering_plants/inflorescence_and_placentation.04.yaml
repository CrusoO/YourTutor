id: A.11.biology.morphology_of_flowering_plants.inflorescence_and_placentation.04
skill_ids:
- SK.A.11.biology.inflorescence_and_placentation
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A student classifies a plant's inflorescence. The flowers are borne on short stalks along the axis and the terminal flower is absent. Which type should the student record?
hints:
- level: 1
  en: Focus on whether the main axis ends in a flower or continues to grow.
- level: 2
  en: Check whether each flower has its own stalk along the axis.
- level: 3
  en: Ask which type keeps the axis open for new flowers.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Racemose inflorescence
- id: b
  en: Single flower
- id: c
  en: Cymose inflorescence
- id: d
  en: Spike with a fleshy axis
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.B12BFB753743
  when_answer_equals:
  - c
- id: MC.A.D17510248C2E
  when_answer_equals:
  - b
- id: MC.A.E830113ABF96
  when_answer_equals:
  - d
solution_steps:
- en: Stalked flowers along an axis with no terminal flower match a racemose inflorescence, which has an unlimited main axis that keeps growing.
- en: The correct option is a.
tier: C
diagram_note: Draw a stem with stalked flowers arising in sequence along one side of the axis, labelling the main axis, the stalks and the flowers.
