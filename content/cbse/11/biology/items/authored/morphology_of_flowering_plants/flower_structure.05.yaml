id: A.11.biology.morphology_of_flowering_plants.flower_structure.05
skill_ids:
- SK.A.11.biology.flower_structure
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A fruit develops from an ovary wall and contains seeds, but a student notices that the receptacle has also swelled and forms part of the fruit. What type of fruit does this describe?
hints:
- level: 1
  en: Ask which parts of the flower are taking part in forming the fruit.
- level: 2
  en: Think about whether the ovary alone forms the fruit in this case.
- level: 3
  en: The question contrasts the ovary with another flower part that has swelled.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A seed with no ovary contribution
- id: b
  en: A false fruit, in which tissue other than the ovary contributes to the fruit
- id: c
  en: A true fruit formed only from the ovary
- id: d
  en: A dry dehiscent capsule
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.BADB0208C8CF
  when_answer_equals:
  - c
- id: MC.A.C0A02E3263DD
  when_answer_equals:
  - a
- id: MC.A.D4273A773391
  when_answer_equals:
  - d
solution_steps:
- en: A false fruit includes tissue from the receptacle or other flower parts alongside the ovary wall.
- en: The apple is a common member of this kind of fruit.
- en: The correct option is b.
tier: C
diagram_note: Draw a longitudinal section of an apple-like fruit showing the receptacle tissue, the ovary wall and the seeds, labelling each.
