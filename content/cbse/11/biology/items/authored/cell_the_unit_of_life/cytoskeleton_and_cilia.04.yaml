solution_steps:
- en: Sperm move by beating a flagellum built with a nine-plus-two arrangement of microtubules.
- en: The flagellum is therefore the structure to examine for a motility test.
- en: The correct option is c.
tier: C
diagram_note: Draw a sperm cell showing the head, the midpiece with mitochondria and the long flagellum, labelling each part.
