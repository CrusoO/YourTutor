stem:
  en: A researcher wants to test whether a drug blocks the motility of sperm. Which structure should the researcher inspect first?
hints:
- level: 1
  en: Think about the structure that propels the cell through fluid.
- level: 2
  en: Consider which structure has the same internal arrangement as cilia.
- level: 3
  en: Look for the tail that whips to move the sperm.
prediction_prompt:
