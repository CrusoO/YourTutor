id: A.11.biology.cell_the_unit_of_life.cell_theory_and_types.04
skill_ids:
- SK.A.11.biology.cell_theory_and_types
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A student compares a plant cell and an animal cell under a microscope. Which structure is present in the plant cell but absent in the animal cell?
hints:
- level: 1
  en: Consider the outer layer that lies outside the membrane in plant cells.
- level: 2
  en: Think of the layer that gives plants their rigid shape.
- level: 3
  en: Check which structure is absent in animal cells.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A rigid cell wall of cellulose
- id: b
  en: A cell membrane
- id: c
  en: Mitochondria
- id: d
  en: A nucleus
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.9BA10FB52A94
  when_answer_equals:
  - d
- id: MC.A.A25D223A54A9
  when_answer_equals:
  - b
- id: MC.A.7846654CFA81
  when_answer_equals:
  - c
solution_steps:
- en: Plant cells have a rigid cell wall made of cellulose outside the cell membrane.
- en: Animal cells have a nucleus, a membrane and mitochondria as well.
- en: The correct option is a.
tier: C
diagram_note: Draw a plant cell and an animal cell side by side, labelling the nucleus, cell membrane, mitochondria and cell wall, with the cell wall marked only in the plant cell.
