difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does a secretory cell have abundant rough endoplasmic reticulum?
hints:
- level: 1
  en: Think about where the ribosomes are attached in the endoplasmic network.
- level: 2
  en: Consider what the secretory cell produces in large amounts.
- level: 3
  en: Compare the rough and smooth endoplasmic reticulum and their main roles.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is the site where proteins destined for secretion are synthesised and folded
- id: b
  en: It produces the energy currency of the cell
- id: c
  en: It is the site where lipids are stored for later use
- id: d
  en: It breaks down old organelles inside the cell
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.52CFBF5655D2
