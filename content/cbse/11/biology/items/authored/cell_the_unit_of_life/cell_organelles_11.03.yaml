solution_steps:
- en: Ribosomes attached to the rough endoplasmic reticulum make proteins that enter its lumen for folding and modification.
- en: Secretory cells need many such ribosomes to produce large amounts of protein.
- en: The correct option is a.
tier: C
diagram_note: Draw a section of a secretory cell showing rough endoplasmic reticulum with attached ribosomes, a nucleus and a Golgi stack, labelling each.
