id: A.11.biology.cell_the_unit_of_life.cell_organelles_11.05
skill_ids:
- SK.A.11.biology.cell_organelles_11
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A drug disrupts the function of lysosomes in a cell. Which consequence is most likely?
hints:
- level: 1
  en: Think about the digestive function of the organelle.
- level: 2
  en: Consider what happens to worn-out parts when they are not broken down.
- level: 3
  en: Ask which process would fail if the cell cannot recycle its own components.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The cell loses its cell wall immediately
- id: b
  en: Chromosomes are duplicated in larger numbers
- id: c
  en: Damaged organelles and macromolecules accumulate because they are not digested and recycled
- id: d
  en: The cell produces more ATP through glycolysis alone
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.C94437EC4C5B
  when_answer_equals:
  - d
- id: MC.A.EAFCAC9C158A
  when_answer_equals:
  - b
- id: MC.A.F349786A95F9
  when_answer_equals:
  - a
solution_steps:
- en: Lysosomes contain hydrolytic enzymes that digest worn-out organelles and macromolecules.
- en: If they fail, waste accumulates, which can damage the cell.
- en: The correct option is c.
tier: C
