difficulty: 0.9
pool: practice
role: apply
stem:
  en: A patient has cilia that do not beat properly in the airway. Which consequence is most likely?
hints:
- level: 1
  en: Think about the function of cilia in the airway lining.
- level: 2
  en: Consider what happens to mucus when it cannot be moved upward.
- level: 3
  en: Ask what the airway would lose if it cannot clear trapped particles.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The heart beats more slowly
- id: b
  en: Red blood cells lose their haemoglobin
- id: c
  en: Blood clotting becomes faster in the lungs
- id: d
  en: Mucus and trapped particles are not cleared from the airway, increasing infection risk
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.B86EFD1E11F3
  when_answer_equals:
  - c
- id: MC.A.F416538CBEDE
  when_answer_equals:
