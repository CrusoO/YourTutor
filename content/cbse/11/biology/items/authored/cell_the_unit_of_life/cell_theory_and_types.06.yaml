id: A.11.biology.cell_the_unit_of_life.cell_theory_and_types.06
skill_ids:
- SK.A.11.biology.cell_theory_and_types
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A researcher finds a cell with a nucleus but no mitochondria and no chloroplasts. Which conclusion is most defensible?
hints:
- level: 1
  en: Ask which feature is the clearest sign of a eukaryote.
- level: 2
  en: Consider whether missing organelles automatically identify a kingdom.
- level: 3
  en: Think about how many features are needed for a firm classification.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is not a cell because it lacks chloroplasts
- id: b
  en: It must be a bacterium because it has a nucleus
- id: c
  en: It must be a plant because it has no mitochondria
- id: d
  en: It is a eukaryote that lacks typical energy-producing organelles, so it cannot be classified from one feature alone
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.F91AC4F711EF
  when_answer_equals:
  - b
- id: MC.A.D3AEE8C93528
  when_answer_equals:
  - c
- id: MC.A.469A53FE5425
  when_answer_equals:
  - a
solution_steps:
- en: A nucleus shows the cell is eukaryotic, but missing mitochondria and chloroplasts can occur in some specialised or unusual eukaryotes.
- en: A single feature is not enough to classify the cell.
- en: The correct option is d.
tier: C
