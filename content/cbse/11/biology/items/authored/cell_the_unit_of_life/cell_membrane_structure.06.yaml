id: A.11.biology.cell_the_unit_of_life.cell_membrane_structure.06
skill_ids:
- SK.A.11.biology.cell_membrane_structure
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A membrane protein moves freely within the bilayer, and its position varies between cells of the same type. Which model best describes this observation?
hints:
- level: 1
  en: Consider whether the proteins are fixed or able to move sideways.
- level: 2
  en: Think about which model describes a membrane that is flexible and mixed.
- level: 3
  en: Compare the observation with the model that allows movement.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The fluid mosaic model, in which proteins drift laterally within the lipid layer
- id: b
  en: The single-layer model, in which proteins sit on the surface only
- id: c
  en: The helical coil model, in which the membrane is a spiral of protein
- id: d
  en: The static wall model, in which proteins are fixed in a rigid sheet
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.4750C2B7270D
  when_answer_equals:
  - d
- id: MC.A.57A374094215
  when_answer_equals:
  - b
- id: MC.A.29B0408858BE
  when_answer_equals:
  - c
solution_steps:
- en: The fluid mosaic model predicts that membrane proteins can move laterally within the lipid bilayer.
- en: The variation between cells also fits the mosaic idea that the membrane is not identical everywhere.
- en: The correct option is a.
tier: C
diagram_note: Draw a section of the membrane with a few embedded proteins and an arrow showing one protein drifting sideways within the lipid layer, labelling the bilayer and the proteins.
