difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does a cilium beat in a coordinated wave rather than all at once?
hints:
- level: 1
  en: Think about what molecular motor produces the sliding in cilia.
- level: 2
  en: Consider how sliding is coordinated along neighbouring doublets.
- level: 3
  en: The mechanism depends on protein arms sliding past each other.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Dynein arms on neighbouring doublets slide in sequence, producing a coordinated bending
- id: b
  en: Cilia are rigid and bend only when cooled
- id: c
  en: Each cilium is powered by its own separate nucleus
- id: d
  en: Ciliary beating is driven by water pressure only
answer:
  sympy: a
  accept: []
misconception_rules:
