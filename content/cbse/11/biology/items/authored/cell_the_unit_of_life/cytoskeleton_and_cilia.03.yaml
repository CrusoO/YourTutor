solution_steps:
- en: Dynein motor proteins on adjacent microtubule doublets slide against one another in sequence, which bends the cilium and creates a wave that moves fluid or the cell.
- en: The correct option is a.
tier: C
diagram_note: Draw a cross section of a cilium showing the nine doublets around a central pair, with the dynein arms labelled on each doublet.
