  en: Think about what all living things share at the smallest level.
- level: 2
  en: The theory was built from observations on plants and animals.
- level: 3
  en: Consider which statement describes the body of every living organism.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
