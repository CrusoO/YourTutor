options:
- id: a
  en: Cells never divide once formed
- id: b
  en: All living organisms are composed of cells
- id: c
  en: Only plants are made of cells
- id: d
  en: Cells arise from non-living matter spontaneously
answer:
  sympy: b
  accept: []
