stem:
  en: A cell uses microtubules to move vesicles along a track toward the periphery. Which motor protein is most likely involved in this transport toward the cell's edge?
hints:
- level: 1
  en: Think about the motor proteins that walk along microtubules.
- level: 2
  en: Consider which motor moves cargo toward the outer edge of the cell.
- level: 3
  en: Compare the motors that move cargo toward the periphery versus toward the centre.
