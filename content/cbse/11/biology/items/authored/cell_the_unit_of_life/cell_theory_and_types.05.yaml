id: A.11.biology.cell_the_unit_of_life.cell_theory_and_types.05
skill_ids:
- SK.A.11.biology.cell_theory_and_types
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A newly found cell lacks a nucleus, has a circular DNA molecule, and has 70S ribosomes. Which cell type is it most likely to be?
hints:
- level: 1
  en: Check whether the cell is prokaryotic or eukaryotic first.
- level: 2
  en: Ask which cell type lacks a nucleus and also has circular DNA.
- level: 3
  en: Consider the ribosome size as a clue, then compare with known cell groups.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A red blood cell from a mammal
- id: b
  en: A prokaryotic cell such as a bacterium
- id: c
  en: A yeast cell from a fungus
- id: d
  en: A plant cell from a leaf
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.72D38B9A78F2
  when_answer_equals:
  - d
- id: MC.A.FF5099D8AC8F
  when_answer_equals:
  - a
- id: MC.A.A0C3046283E3
  when_answer_equals:
  - c
solution_steps:
- en: The lack of a nucleus, the circular DNA and the 70S ribosomes all point to a prokaryote.
- en: Eukaryotic cells have a nucleus and 80S ribosomes, while mature mammalian red blood cells lack a nucleus but are not prokaryotic.
- en: The correct option is b.
tier: C
diagram_note: Draw a simple prokaryotic cell with a cell wall, a loop of circular DNA in the nucleoid region and small ribosomes, labelling each part.
