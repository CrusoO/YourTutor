id: A.11.biology.cell_the_unit_of_life.cell_membrane_structure.04
skill_ids:
- SK.A.11.biology.cell_membrane_structure
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A student wants to label a membrane diagram correctly. Which feature is shown by the hydrophilic heads of phospholipids?
hints:
- level: 1
  en: Think about which side of a phospholipid interacts with water.
- level: 2
  en: Consider which part faces the cell's surroundings.
- level: 3
  en: The hydrophobic tails face the centre, so the heads must be on the other side.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They face outward toward the watery environments on both sides
- id: b
  en: They are made of nucleic acid
- id: c
  en: They face inward into the lipid core
- id: d
  en: They are embedded only in the protein layer
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.C4E331577F95
  when_answer_equals:
  - c
- id: MC.A.11559FF73BA1
  when_answer_equals:
  - d
- id: MC.A.C22164DE8254
  when_answer_equals:
  - b
solution_steps:
- en: Phospholipid heads are hydrophilic and point outward toward the aqueous environments inside and outside the cell, while the hydrophobic tails face each other in the centre of the bilayer.
- en: The correct option is a.
tier: C
diagram_note: Draw a phospholipid bilayer in section, showing the two layers with hydrophilic heads at the outer surfaces and hydrophobic tails facing inward, with the aqueous sides labelled.
