id: A.11.biology.cell_the_unit_of_life.cell_membrane_structure.05
skill_ids:
- SK.A.11.biology.cell_membrane_structure
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A researcher observes that cholesterol increases in the membranes of cells adapted to fluctuating temperatures. What is the most likely effect?
hints:
- level: 1
  en: Think about how cholesterol sits between the phospholipid tails.
- level: 2
  en: Consider whether cholesterol tends to stiffen or loosen the membrane at high temperature.
- level: 3
  en: Ask how a buffer would behave at both ends of the temperature range.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The membrane loses all proteins
- id: b
  en: The membrane becomes more fluid at low temperatures and less stable at high temperatures
- id: c
  en: The membrane begins to synthesise glucose
- id: d
  en: The membrane becomes less fluid at high temperatures and more stable at low temperatures
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.DA624928352A
  when_answer_equals:
  - b
- id: MC.A.9577592CE48C
  when_answer_equals:
  - a
- id: MC.A.1A3FDFEC2FA5
  when_answer_equals:
  - c
solution_steps:
- en: Cholesterol sits among the phospholipid tails and buffers membrane fluidity, reducing fluidity at high temperatures and maintaining it at low ones.
- en: This stabilising effect helps cells cope with temperature changes.
- en: The correct option is d.
tier: C
