solution_steps:
- en: The Golgi apparatus receives proteins from the endoplasmic reticulum, modifies them, and packages them into vesicles for secretion or delivery to other sites.
- en: The correct option is c.
tier: C
diagram_note: Draw a secretory pathway showing the rough ER, the Golgi apparatus, a vesicle and the plasma membrane, labelling each step.
