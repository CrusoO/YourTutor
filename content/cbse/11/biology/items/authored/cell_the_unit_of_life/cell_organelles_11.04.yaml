difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A student wants to identify the organelle that packages and modifies proteins before they leave the cell. Which organelle should be chosen?
hints:
- level: 1
  en: Think of the stacked membrane organelle that sends material out.
- level: 2
  en: Consider which organelle receives proteins from the endoplasmic reticulum.
- level: 3
  en: The organelle works in sorting and packaging.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Lysosome
- id: b
  en: Nucleolus
- id: c
  en: Golgi apparatus
- id: d
  en: Plasmodesmata
answer:
  sympy: c
  accept: []
misconception_rules:
