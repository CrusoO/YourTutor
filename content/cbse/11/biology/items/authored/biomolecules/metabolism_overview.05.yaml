difficulty: 0.9
pool: practice
role: apply
stem:
  en: A linear pathway has 6 enzyme-catalysed steps. Its end product inhibits the first 2 steps only. How many steps remain uninhibited by this product?
hints:
- level: 1
  en: Subtract the steps named as inhibited from the total number of steps.
- level: 2
  en: Count only the steps that the product does not touch.
- level: 3
  en: Separate the steps that are inhibited from the steps that are not.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: Six steps minus the two inhibited steps leaves four steps that the end product does not control.
- en: Answer = 4
tier: C
