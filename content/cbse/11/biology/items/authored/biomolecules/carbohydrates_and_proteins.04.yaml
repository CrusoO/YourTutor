difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A student is asked to identify the level of protein structure that describes the sequence of amino acids. Which level is correct?
hints:
- level: 1
  en: Start with the level that is simply the order of the building blocks.
- level: 2
  en: Think about which level has no folding information at all.
- level: 3
  en: Consider which level is the first and most basic.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Secondary structure
- id: b
  en: Tertiary structure
- id: c
  en: Quaternary structure
- id: d
  en: Primary structure
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.D26E5672D697
  when_answer_equals:
  - a
- id: MC.A.020E07D6D731
  when_answer_equals:
  - b
- id: MC.A.70CC63A8CE30
  when_answer_equals:
  - c
solution_steps:
- en: The primary structure of a protein is the linear sequence of amino acids joined by peptide bonds.
- en: Secondary, tertiary and quaternary levels arise from folding and assembly.
- en: The correct option is d.
tier: C
