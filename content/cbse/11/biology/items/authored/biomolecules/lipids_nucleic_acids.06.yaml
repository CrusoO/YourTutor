  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A lower melting point, so the lipid is liquid at room temperature
- id: b
  en: A higher melting point, so the lipid is more likely to be solid at room temperature
- id: c
  en: A loss of the glycerol backbone
- id: d
  en: A solubility in water higher than that of unsaturated fats
answer:
  sympy: b
