stem:
  en: A lipid molecule is found in which the fatty acid tails are fully saturated. Which property does this most likely produce in the lipid?
hints:
- level: 1
  en: Think about whether the tails can pack closely together.
- level: 2
  en: Consider what a double bond does to the shape of a fatty acid.
- level: 3
  en: Compare how well saturated and unsaturated tails stack against each other.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
