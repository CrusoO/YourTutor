id: A.11.biology.biomolecules.metabolism_overview.01
skill_ids:
- SK.A.11.biology.metabolism_overview
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is a metabolic pathway?
hints:
- level: 1
  en: Think about reactions that are chained together.
- level: 2
  en: Consider whether the products of one reaction are used by another.
- level: 3
  en: Pathways are organised rather than random.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A physical movement of molecules across a membrane
- id: b
  en: A random set of unrelated reactions in the cell
- id: c
  en: A single reaction that produces energy in one step
- id: d
  en: A series of linked enzyme-catalysed reactions in which the product of one step is the substrate of the next
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.E1886080B274
  when_answer_equals:
  - c
- id: MC.A.3DBA235F853B
  when_answer_equals:
  - a
- id: MC.A.CEE4D5A92C87
  when_answer_equals:
  - b
solution_steps:
- en: A metabolic pathway is a sequence of enzyme-catalysed steps in which each product feeds the next reaction.
- en: Glycolysis and the Krebs cycle are both pathways.
- en: The correct option is d.
tier: C
