difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is the part of an enzyme where the substrate binds called?
hints:
- level: 1
  en: Think about the pocket on the enzyme where the reactant fits.
- level: 2
  en: The site has a shape complementary to the substrate.
- level: 3
  en: Consider the site where catalysis happens, not the site where regulators bind.
prediction_prompt:
