id: A.11.biology.biomolecules.lipids_nucleic_acids.05
skill_ids:
- SK.A.11.biology.lipids_nucleic_acids
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A DNA strand has the base sequence AATTGC. What is the sequence of its complementary strand, read in the same direction?
hints:
- level: 1
  en: Replace each base with its partner from the list of pairing rules.
- level: 2
  en: Pair the bases one by one, starting with the first letter.
- level: 3
  en: Remember that the two strands run in opposite directions, so read the complement carefully.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: AAUUGC
- id: b
  en: TTAACG
- id: c
  en: GCAATT
- id: d
  en: TTGGCA
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.55D4D8BD56A5
