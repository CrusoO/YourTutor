solution_steps:
- en: 'Each base pairs with its partner: A with T, T with A, G with C, C with G.'
- en: Pairing the sequence AATTGC gives TTAACG when read in the same direction, though the strands run antiparallel.
- en: The correct option is b.
tier: C
diagram_note: Write the two antiparallel strands as horizontal rows with pairing lines between matching bases, labelling the 5 prime and 3 prime ends of each strand.
