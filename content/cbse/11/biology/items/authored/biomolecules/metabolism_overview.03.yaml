id: A.11.biology.biomolecules.metabolism_overview.03
skill_ids:
- SK.A.11.biology.metabolism_overview
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why is a regulated metabolic pathway important for a cell?
hints:
- level: 1
  en: Think about what would happen to a cell that made far more of a product than it needed.
- level: 2
  en: Consider whether a cell should run every reaction at full speed all the time.
- level: 3
  en: Ask what kind of control keeps the cell economical.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It stops all enzymes from working permanently
- id: b
  en: It ensures every reaction in the cell runs at the same rate
- id: c
  en: It prevents wasteful overproduction and matches product supply to the cell's needs
- id: d
  en: It removes the need for any enzymes in the cell
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.4C9A22370A6B
  when_answer_equals:
  - b
- id: MC.A.017E75988F48
  when_answer_equals:
  - a
- id: MC.A.409218FA13D9
  when_answer_equals:
  - d
solution_steps:
- en: Regulation keeps pathways in step with the cell's needs.
- en: Feedback inhibition and allosteric control prevent wasteful use of energy and raw materials.
- en: The correct option is c.
tier: C
