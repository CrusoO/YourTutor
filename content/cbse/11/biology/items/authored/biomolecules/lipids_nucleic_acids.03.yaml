stem:
  en: Why are phospholipids amphipathic, and why does this matter in membranes?
hints:
- level: 1
  en: Think about the two different regions of one phospholipid molecule.
- level: 2
  en: Consider which parts interact with water and which avoid it.
- level: 3
  en: Ask how the two regions arrange themselves in water.
prediction_prompt:
