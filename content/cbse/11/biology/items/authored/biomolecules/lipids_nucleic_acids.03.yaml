options:
- id: a
  en: They are entirely hydrophobic, so they float on water
- id: b
  en: They are entirely hydrophilic, so they dissolve in any solvent
- id: c
  en: They are charged positively throughout, so they repel water
- id: d
  en: They have a hydrophilic head and hydrophobic tails, so they form bilayers in water
