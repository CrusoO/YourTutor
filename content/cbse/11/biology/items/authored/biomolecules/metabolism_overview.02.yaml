stem:
  en: What is the term for a reaction pathway that ends in a product that switches off its own early enzyme?
hints:
- level: 1
  en: Think about how the end product of a pathway can control its own production.
- level: 2
  en: Consider the regulatory signal that goes backwards up the pathway.
- level: 3
  en: The term describes a regulation loop that slows the pathway when the product builds up.
