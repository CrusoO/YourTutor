stem:
  en: A student compares the base pairing in DNA. Which pairing is correct?
hints:
- level: 1
  en: Each purine pairs with exactly one pyrimidine.
- level: 2
  en: Adenine pairs with the base that has a similar structure in the other strand.
- level: 3
  en: Check which pairs form two hydrogen bonds and which form three.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
