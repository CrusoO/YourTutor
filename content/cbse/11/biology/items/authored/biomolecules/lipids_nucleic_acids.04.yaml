options:
- id: a
  en: Adenine with guanine, and thymine with cytosine
- id: b
  en: Adenine with uracil, and guanine with cytosine
- id: c
  en: Adenine with thymine, and guanine with cytosine
- id: d
  en: Adenine with cytosine, and guanine with thymine
