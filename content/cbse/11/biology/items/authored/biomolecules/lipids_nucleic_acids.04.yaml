solution_steps:
- en: In DNA, adenine pairs with thymine through two hydrogen bonds and guanine pairs with cytosine through three.
- en: This complementarity keeps the double helix regular.
- en: The correct option is c.
tier: C
diagram_note: Draw a short segment of the DNA double helix as a ladder, labelling the base pairs, the sugar-phosphate backbone and the hydrogen bonds between pairs.
