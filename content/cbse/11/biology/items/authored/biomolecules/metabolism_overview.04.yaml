id: A.11.biology.biomolecules.metabolism_overview.04
skill_ids:
- SK.A.11.biology.metabolism_overview
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A pathway converts A to B, B to C and C to D, and D inhibits the first enzyme. A student adds extra D to a cell. Which change is expected at the first step?
hints:
- level: 1
  en: Look at which product feeds back onto the first enzyme.
- level: 2
  en: Think about what happens to the flow of material when the first step is inhibited.
- level: 3
  en: Consider whether the feedback is positive or negative in this pathway.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The first step is unaffected
- id: b
  en: The first step stops permanently
- id: c
  en: The first step speeds up
- id: d
  en: The first step slows down
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.0968660263A2
  when_answer_equals:
  - c
- id: MC.A.414C075F8131
  when_answer_equals:
  - b
- id: MC.A.31CE243B6105
  when_answer_equals:
  - a
solution_steps:
- en: Extra D inhibits the first enzyme, which reduces the flow through the pathway.
- en: This feedback response is the reason the first step slows down.
- en: The correct option is d.
tier: C
