stem:
  en: A polypeptide chain is made of 5 amino acids joined end to end. How many peptide bonds does the chain contain?
hints:
- level: 1
  en: Consider how many pairs of neighbouring residues exist in a line of residues.
- level: 2
  en: Compare the number of residues with the number of links between them.
- level: 3
  en: A chain of residues has one link fewer than the number of residues.
