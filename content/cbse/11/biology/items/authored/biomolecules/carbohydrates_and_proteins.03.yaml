options:
- id: a
  en: Heat breaks the peptide bonds of the primary structure
- id: b
  en: Heat adds extra amino acids to the chain
- id: c
  en: Heat disrupts the weak bonds that maintain their three-dimensional shape, a process called denaturation
- id: d
  en: Heat converts proteins into carbohydrates
