id: A.11.biology.the_living_world.taxonomic_tools.06
skill_ids:
- SK.A.11.biology.taxonomic_tools
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Two different keys for the same group give different final names for one organism. What is the most likely explanation?
hints:
- level: 1
  en: Consider whether both tools rely on the same current system of names.
- level: 2
  en: Think about the source and date behind each key.
- level: 3
  en: Ask whether the disagreement lies in the tools or in the specimen itself.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: One key uses an older or different classification, so the names do not match
- id: b
  en: The organism changed its name during the observation
- id: c
  en: Keys give random results every time they are used
- id: d
  en: The organism has two genera inside its body
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.03702AA1091A
  when_answer_equals:
  - b
- id: MC.A.61F402815BBD
  when_answer_equals:
  - c
- id: MC.A.9436850498B7
  when_answer_equals:
  - d
solution_steps:
- en: Keys reflect the classification system they were built on, and a name can differ between systems or editions.
- en: The disagreement lies in the tools rather than in the specimen.
- en: The correct option is a.
tier: C
