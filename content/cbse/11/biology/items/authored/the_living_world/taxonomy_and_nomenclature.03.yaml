id: A.11.biology.the_living_world.taxonomy_and_nomenclature.03
skill_ids:
- SK.A.11.biology.taxonomy_and_nomenclature
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Two organisms share the same genus but differ in species. What does this tell us about them?
hints:
- level: 1
  en: Consider how much of the hierarchy the two organisms share.
- level: 2
  en: Think about which rank is the last one before species.
- level: 3
  en: Ask how the second part of the name would change if they were the same kind.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They belong to entirely different families
- id: b
  en: They are closely related but distinct kinds of organism
- id: c
  en: They must share the same order and class but nothing else
- id: d
  en: They are identical in every trait
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.6105FD3BC598
  when_answer_equals:
  - a
- id: MC.A.22B1B77A8967
  when_answer_equals:
  - d
- id: MC.A.27D81B5DD306
  when_answer_equals:
  - c
solution_steps:
- en: Organisms in one genus are closely related, but the species epithet shows they are separate kinds.
- en: Shared genus does not mean shared species or identical traits.
- en: The correct option is b.
tier: C
