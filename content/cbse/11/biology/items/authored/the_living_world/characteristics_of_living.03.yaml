id: A.11.biology.the_living_world.characteristics_of_living.03
skill_ids:
- SK.A.11.biology.characteristics_of_living
difficulty: 0.6
pool: practice
role: explain
stem:
  en: A potted plant bends its stem toward a window over several days. Which characteristic of living things does this best illustrate?
hints:
- level: 1
  en: Look for a change in the organism triggered by light coming from one side.
- level: 2
  en: Think about what the organism does when its surroundings shift.
- level: 3
  en: The trait name describes a reaction to whatever happens outside the body.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Excretion of waste gases
- id: b
  en: Cell division in the root tip
- id: c
  en: Fermentation in the stem
- id: d
  en: Response to environmental change
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.802860B6F093
  when_answer_equals:
  - a
- id: MC.A.172B0FC633E4
  when_answer_equals:
  - b
- id: MC.A.28C173F68265
  when_answer_equals:
  - c
solution_steps:
- en: Plants detect the direction of light and redirect their growth, so the bending is a response.
- en: Responding to surroundings is one of the defining features of life.
- en: The correct option is d.
tier: C
