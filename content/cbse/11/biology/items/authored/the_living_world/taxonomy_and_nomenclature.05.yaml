id: A.11.biology.the_living_world.taxonomy_and_nomenclature.05
skill_ids:
- SK.A.11.biology.taxonomy_and_nomenclature
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A student places a shark and a dolphin in the same class only because both have fins used for swimming. Which error best describes this reasoning?
hints:
- level: 1
  en: Ask whether the shared feature reflects common ancestry or only looks similar.
- level: 2
  en: Think about which features a classifier must weigh more heavily than appearance.
- level: 3
  en: Consider whether the error is about the features chosen or about the rank chosen.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Ignoring the genus when naming them
- id: b
  en: Placing them in different kingdoms
- id: c
  en: Using one superficial trait instead of shared fundamental features
- id: d
  en: Naming them with a single word
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.3803FABD91E1
  when_answer_equals:
  - b
- id: MC.A.A665D3E9B055
  when_answer_equals:
  - d
- id: MC.A.7C3715358575
  when_answer_equals:
  - a
solution_steps:
- en: Fins are a similar-looking adaptation for swimming, and similar appearance can arise independently.
- en: Classification should rest on deeper features such as body plan, development and ancestry.
- en: The correct option is c.
tier: C
