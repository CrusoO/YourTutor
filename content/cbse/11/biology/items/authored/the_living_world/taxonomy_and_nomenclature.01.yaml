stem:
  en: In binomial nomenclature, which two levels form the scientific name of a species?
hints:
- level: 1
  en: The two parts are the two words written in every scientific name.
- level: 2
  en: They are the lowest and the second lowest ranks in the hierarchy.
- level: 3
  en: One part is named first, and the other is the specific epithet that follows it.
