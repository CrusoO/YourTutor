id: A.11.biology.the_living_world.taxonomic_tools.02
skill_ids:
- SK.A.11.biology.taxonomic_tools
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In a dichotomous key, what does each numbered step present?
hints:
- level: 1
  en: Dichotomous means splitting into two parts.
- level: 2
  en: Focus on how many options appear before you move to the next number.
- level: 3
  en: Think about what a choice between two alternatives looks like in a printed tool.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A single drawing of the organism
- id: b
  en: A measurement given in millimetres
- id: c
  en: A pair of contrasting descriptions
- id: d
  en: A complete list of all known species
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.ED6D4729AAD6
  when_answer_equals:
  - a
- id: MC.A.83167E210ED0
  when_answer_equals:
  - d
- id: MC.A.DF244D1C9964
  when_answer_equals:
  - b
solution_steps:
- en: Each numbered step in a dichotomous key gives two contrasting descriptions, and the user picks the one that matches the specimen.
- en: The chosen option points to the next step or to a name.
- en: The correct option is c.
tier: C
