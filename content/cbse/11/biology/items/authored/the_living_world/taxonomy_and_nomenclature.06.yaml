id: A.11.biology.the_living_world.taxonomy_and_nomenclature.06
skill_ids:
- SK.A.11.biology.taxonomy_and_nomenclature
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A researcher labels an organism only with its genus and a number, such as Genus 3. Why does this fail as a scientific name?
hints:
- level: 1
  en: Ask what the second word in a binomial name does for identification.
- level: 2
  en: Think about how many organisms could share the first part alone.
- level: 3
  en: Compare the label with a complete two-part name, and note what is missing.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It uses too few letters to be read
- id: b
  en: Numbers are never allowed in any scientific name
- id: c
  en: It lacks the species epithet that identifies one kind within the genus
- id: d
  en: Genus names may never be used on their own
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.4081F7F246BC
  when_answer_equals:
  - d
- id: MC.A.CA2D6DE0B110
  when_answer_equals:
  - a
- id: MC.A.2E21E5EFE9FF
  when_answer_equals:
  - b
solution_steps:
- en: A binomial name needs both the genus and a species epithet.
- en: Without the epithet the label does not pick out one kind of organism.
- en: The correct option is c.
tier: C
