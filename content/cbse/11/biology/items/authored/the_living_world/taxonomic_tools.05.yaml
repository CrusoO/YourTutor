id: A.11.biology.the_living_world.taxonomic_tools.05
skill_ids:
- SK.A.11.biology.taxonomic_tools
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A key's first pair contrasts leaves present with leaves absent. A specimen has tiny scale-like leaves on its stem. Which choice is most appropriate?
hints:
- level: 1
  en: Ask whether the tiny structures count as leaves for this key's purpose.
- level: 2
  en: Keys are designed so that every specimen reaches one branch.
- level: 3
  en: Use the next pair to refine your choice rather than abandoning the path.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Choose the branch that matches the specimen's colour
- id: b
  en: Follow the leaves present branch and examine the scale-like leaves in the next pair
- id: c
  en: Follow the leaves absent branch because scales are not leaves
- id: d
  en: Stop the key because the specimen fits no choice
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.80EDA98BAAEB
  when_answer_equals:
  - c
- id: MC.A.0E3EEFF1926B
  when_answer_equals:
  - d
- id: MC.A.E3638D2CE293
  when_answer_equals:
  - a
solution_steps:
- en: Keys are built so every specimen reaches a branch, and scale-like leaves count as leaves for the purposes of the key.
- en: The next pair then refines the identification.
- en: The correct option is b.
tier: C
