stem:
  en: Which convention is correct for a scientific name written by hand?
hints:
- level: 1
  en: Think about how the first word differs from the second word in the name.
- level: 2
  en: Consider which word names a broader group.
- level: 3
  en: Marking the name as scientific is done with a line or a slant, and only one word gets a big first letter.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
