options:
- id: a
  en: Both words in lower case with no underline
- id: b
  en: Genus in lower case and species with a capital first letter
- id: c
  en: Genus with a capital first letter, species in lower case, and the whole name underlined or italic
- id: d
  en: Both words with a capital first letter
