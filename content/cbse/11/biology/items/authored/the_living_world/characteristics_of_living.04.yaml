id: A.11.biology.the_living_world.characteristics_of_living.04
skill_ids:
- SK.A.11.biology.characteristics_of_living
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which statement correctly contrasts growth with development in an organism?
hints:
- level: 1
  en: Separate the idea of getting bigger from the idea of becoming more complex.
- level: 2
  en: Ask which word refers to quantity and which refers to organisation.
- level: 3
  en: Check which process describes the body taking on a more elaborate design over time.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Growth and development are the same process observed at different times
- id: b
  en: Growth is an increase in size and mass, while development covers the changes in form and complexity that follow
- id: c
  en: Development is an increase in size, while growth is a change in shape
- id: d
  en: Development occurs only in animals, while growth occurs only in plants
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.1416E8B0D011
  when_answer_equals:
  - c
- id: MC.A.619D4648A995
  when_answer_equals:
  - a
- id: MC.A.A362CA58706A
  when_answer_equals:
  - d
solution_steps:
- en: Growth is a quantitative increase in size, while development is the progressive change in organisation and form.
- en: Both happen throughout the life of many organisms.
- en: The correct option is b.
tier: C
