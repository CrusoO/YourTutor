id: A.11.biology.the_living_world.characteristics_of_living.05
skill_ids:
- SK.A.11.biology.characteristics_of_living
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A newly found organism must be checked for signs of life. Which set of tests would be most informative?
hints:
- level: 1
  en: Focus on what a cell-based body must do to stay alive and continue.
- level: 2
  en: Ignore looks and ask about function.
- level: 3
  en: The right choice covers the features that every known living group shares.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Look for cell-based organisation, energy use, and the ability to reproduce and respond
- id: b
  en: Test whether it glows and whether it has a fixed weight
- id: c
  en: Check for a hard outer shell and the ability to move
- id: d
  en: Measure colour, size and surface shape
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.209B0B8C2653
  when_answer_equals:
  - d
- id: MC.A.BD01C3438487
  when_answer_equals:
  - c
- id: MC.A.6E56F015EE81
  when_answer_equals:
  - b
solution_steps:
- en: Life is recognised by a combination of organisation, metabolism, reproduction and response, not by looks.
- en: The correct set checks each of these functions.
- en: The correct option is a.
tier: C
