id: A.11.biology.the_living_world.characteristics_of_living.06
skill_ids:
- SK.A.11.biology.characteristics_of_living
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A student claims that a growing salt crystal is alive because it enlarges and repairs chipped edges. Which reply is most accurate?
hints:
- level: 1
  en: Ask whether the enlargement uses energy processed inside cells.
- level: 2
  en: Compare the crystal's behaviour with the living features you know, one by one.
- level: 3
  en: Check whether a non-living process could also produce the same change.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Crystals split to reproduce, so they meet the test
- id: b
  en: Its growth comes from physical deposition, not from cell-based metabolism, so it is not alive
- id: c
  en: Repair proves life, so the crystal is alive
- id: d
  en: A crystal responds to heat, so it must be alive
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.6C86ADC4ECB2
  when_answer_equals:
  - c
- id: MC.A.AA030414EA71
  when_answer_equals:
  - a
- id: MC.A.6980761AAEC0
  when_answer_equals:
  - d
solution_steps:
- en: Crystal growth is a physical and chemical deposition process with no cells and no internal energy metabolism.
- en: Growth or repair alone does not make an object alive.
- en: The correct option is b.
tier: C
