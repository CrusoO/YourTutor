id: A.11.biology.body_fluids_and_circulation.ecg_and_blood_pressure.04
skill_ids:
- SK.A.11.biology.ecg_and_blood_pressure
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A blood pressure reading is given as 120 over 80 mmHg. Which value is the systolic pressure?
hints:
- level: 1
  en: The higher reading is taken during contraction.
- level: 2
  en: The first number in the reading is the higher one.
- level: 3
  en: Compare the two numbers with the phases they represent.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 200 mmHg
- id: b
  en: 100 mmHg
- id: c
  en: 80 mmHg
- id: d
  en: 120 mmHg
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.37FD67E09FFB
  when_answer_equals:
  - c
- id: MC.A.1CDD99F9CEB8
  when_answer_equals:
  - b
- id: MC.A.AC0EC79DE4AE
  when_answer_equals:
  - a
solution_steps:
- en: In a blood pressure reading the first, higher value is the systolic pressure and the second is the diastolic pressure.
- en: Here the systolic value is 120 mmHg.
- en: The correct option is d.
tier: C
diagram_note: Draw a blood pressure trace over one cardiac cycle with the peak labelled as systolic and the trough labelled as diastolic.
