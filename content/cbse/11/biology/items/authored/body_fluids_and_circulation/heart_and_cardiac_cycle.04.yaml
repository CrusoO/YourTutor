difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A heart beats 75 times per minute. How many seconds does one complete cardiac cycle last?
hints:
- level: 1
  en: Divide the number of seconds in a minute by the number of beats in that minute.
- level: 2
  en: Each beat takes the same time as one cardiac cycle.
- level: 3
  en: Give the answer as a decimal.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.8'
  accept: []
solution_steps:
- en: One minute is 60 seconds, so each cycle lasts 60 divided by 75, which is 0.8 seconds.
- en: The unit of the answer is s.
- en: Answer = 0.8
tier: C
