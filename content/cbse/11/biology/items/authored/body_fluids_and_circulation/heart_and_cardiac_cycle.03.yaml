id: A.11.biology.body_fluids_and_circulation.heart_and_cardiac_cycle.03
skill_ids:
- SK.A.11.biology.heart_and_cardiac_cycle
difficulty: 0.6
pool: practice
role: explain
stem:
  en: What causes the first heart sound, S1?
hints:
- level: 1
  en: Think about the valves that close when the ventricles begin to contract.
- level: 2
  en: Consider which valves lie between the atria and the ventricles.
- level: 3
  en: The sound comes from the valve flaps being pushed shut by rising pressure.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Closure of the atrioventricular valves at the start of ventricular systole
- id: b
  en: Opening of the atrioventricular valves during diastole
- id: c
  en: Contraction of the atria
- id: d
  en: Closure of the semilunar valves at the end of systole
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.EC0B9BE28E83
  when_answer_equals:
  - d
- id: MC.A.5632E7D3637F
  when_answer_equals:
  - b
- id: MC.A.2568A6B8D538
  when_answer_equals:
  - c
solution_steps:
- en: S1 is produced when the atrioventricular valves close as the ventricles begin to contract.
- en: The closure of the semilunar valves at the end of systole produces S2.
- en: The correct option is a.
tier: C
