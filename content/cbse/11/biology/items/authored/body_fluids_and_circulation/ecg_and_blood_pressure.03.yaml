id: A.11.biology.body_fluids_and_circulation.ecg_and_blood_pressure.03
skill_ids:
- SK.A.11.biology.ecg_and_blood_pressure
difficulty: 0.6
pool: practice
role: explain
stem:
  en: What is the difference between systolic and diastolic blood pressure?
hints:
- level: 1
  en: Think about which phase of the heartbeat produces the higher reading.
- level: 2
  en: Consider which phase corresponds to the heart filling.
- level: 3
  en: The two readings are taken in different phases of the cycle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Diastolic is the pressure during atrial contraction only
- id: b
  en: Systolic is the pressure during ventricular contraction, and diastolic is the pressure when the ventricles relax
- id: c
  en: Systolic is always lower than diastolic
- id: d
  en: Systolic is the pressure in veins and diastolic is the pressure in arteries
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.F3469BD10583
  when_answer_equals:
  - d
- id: MC.A.6CE9E64B419C
  when_answer_equals:
  - c
- id: MC.A.9E8825DAA0A4
  when_answer_equals:
  - a
solution_steps:
- en: Systolic pressure is the peak in the arteries during ventricular contraction, and diastolic pressure is the lower value when the ventricles relax and fill.
- en: The correct option is b.
tier: C
