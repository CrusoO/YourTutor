difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A healthy adult has about 5 litres of blood, and plasma makes up 55 percent of the blood volume. How many litres of plasma are present?
hints:
- level: 1
  en: Multiply the total volume by the fraction that is plasma.
- level: 2
  en: Convert the percentage to a decimal before multiplying.
- level: 3
  en: Check that the answer is smaller than the total volume.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2.75'
  accept: []
solution_steps:
- en: Plasma is 55 percent of 5 litres, which is 0.55 times 5, giving 2.75 litres.
- en: The unit of the answer is L.
- en: Answer = 2.75
tier: C
