stem:
  en: Near which vessels does the main lymphatic duct empty lymph back into the circulation?
hints:
- level: 1
  en: The vessel drains into the upper chest region near the neck.
- level: 2
  en: Think about veins that lie near the collarbone.
- level: 3
  en: The duct empties on the left side close to the heart.
