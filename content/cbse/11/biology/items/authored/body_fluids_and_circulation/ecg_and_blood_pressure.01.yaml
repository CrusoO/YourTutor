stem:
  en: Which ECG wave represents depolarisation of the ventricles?
hints:
- level: 1
  en: This is the large sharp complex in the middle of the trace.
- level: 2
  en: The P wave comes before it and is produced by the atria.
- level: 3
  en: Think about the complex that is the largest on a normal trace.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
