id: A.11.biology.body_fluids_and_circulation.blood_composition.05
skill_ids:
- SK.A.11.biology.blood_composition
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A patient has a very low platelet count. Which problem is most directly expected?
hints:
- level: 1
  en: Think about what platelets do at a wound.
- level: 2
  en: Consider whether the blood can form a plug quickly when the count is low.
- level: 3
  en: Ask which function is affected when clot formation is weak.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Swelling caused by excess plasma proteins
- id: b
  en: Prolonged bleeding and easy bruising from small wounds
- id: c
  en: Shortness of breath from low oxygen transport
- id: d
  en: Fever from a bacterial infection
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.F890837601F3
  when_answer_equals:
  - c
- id: MC.A.F65E4B169794
  when_answer_equals:
  - d
- id: MC.A.B425E97EBDB8
  when_answer_equals:
  - a
solution_steps:
- en: Platelets form the initial plug and supply clotting factors at injury sites.
- en: A low count delays this, so small wounds keep bleeding and bruise easily.
- en: The correct option is b.
tier: C
