difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why is lymph important for absorbing dietary fat in the small intestine?
hints:
- level: 1
  en: Think about the small lymph vessels inside the intestinal villi.
- level: 2
  en: Consider the form in which fat is packaged for transport.
- level: 3
  en: The packages are too large to pass straight into the capillaries.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Lacteals take up fat packaged as chylomicrons, which enter the lymphatic system rather than the blood directly
- id: b
  en: Lymph carries oxygen to the intestinal wall
- id: c
  en: Lymph breaks fats down into fatty acids directly
- id: d
  en: Lymph dissolves fats into glucose inside the gut
answer:
  sympy: a
  accept: []
misconception_rules:
