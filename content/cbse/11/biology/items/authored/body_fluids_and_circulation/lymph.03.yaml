- id: MC.A.400559B57974
  when_answer_equals:
  - c
solution_steps:
- en: Fatty acids and monoglycerides are repackaged into chylomicrons inside intestinal cells.
- en: These particles are too large for capillaries, so they enter the central lacteals and reach the blood through the lymphatic system.
- en: The correct option is a.
tier: C
