stem:
  en: A person has a cardiac output of 6000 mL per minute and a heart rate of 75 beats per minute. What is the stroke volume in mL per beat?
hints:
- level: 1
  en: Divide the output per minute by the number of beats per minute.
- level: 2
  en: Keep the units consistent, using millilitres throughout.
- level: 3
  en: Each beat ejects the same volume in this simplified case.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '80'
  accept: []
solution_steps:
- en: Stroke volume equals cardiac output divided by heart rate, which is 6000 divided by 75, giving 80 mL per beat.
- en: The unit of the answer is mL.
- en: Answer = 80
tier: C
