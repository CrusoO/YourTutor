stem:
  en: Which ECG wave represents depolarisation of the atria?
hints:
- level: 1
  en: It is the small rounded wave that comes first in each beat.
- level: 2
  en: The wave appears before the large spike.
- level: 3
  en: It precedes the ventricular complex on the trace.
