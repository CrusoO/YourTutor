difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A student spins a tube of blood in a centrifuge. Which layer forms at the top of the tube?
hints:
- level: 1
  en: The top layer is the liquid part of the blood.
- level: 2
  en: Think about which component is least dense.
- level: 3
  en: The denser cells settle toward the bottom of the tube.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Plasma
- id: b
  en: Clot
- id: c
  en: Buffy coat
- id: d
  en: Red cell layer
answer:
  sympy: a
  accept: []
