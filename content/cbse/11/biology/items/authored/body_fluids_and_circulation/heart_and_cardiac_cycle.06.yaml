stem:
  en: The pressure in the aorta rises sharply during each heartbeat and then falls. Which event causes the rise?
hints:
- level: 1
  en: Think about the chamber that pushes blood into the aorta.
- level: 2
  en: Consider the phase of the cycle when the ventricle contracts.
- level: 3
  en: The aorta receives blood only when the outflow valve is open.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Closure of the mitral valve during diastole
- id: b
  en: Relaxation of the atria
- id: c
  en: Ejection of blood from the left ventricle during systole
- id: d
  en: Filling of the ventricle during diastole
answer:
  sympy: c
  accept: []
misconception_rules:
