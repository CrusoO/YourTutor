solution_steps:
- en: Contraction of the left ventricle pushes blood through the open aortic valve, raising aortic pressure.
- en: The pressure then falls as blood flows into the body and the valve closes.
- en: The correct option is c.
tier: C
diagram_note: Draw a left ventricle and aorta with the aortic valve open during systole, with arrows showing blood ejected and a pressure trace rising in the aorta.
