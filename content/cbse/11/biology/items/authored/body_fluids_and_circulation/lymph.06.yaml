id: A.11.biology.body_fluids_and_circulation.lymph.06
skill_ids:
- SK.A.11.biology.lymph
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A drug stops lymphocytes from moving through lymph nodes. Which immune response is most likely impaired?
hints:
- level: 1
  en: Think about where lymphocytes meet antigens.
- level: 2
  en: Consider which immune response depends on lymph nodes.
- level: 3
  en: Ask which immune process requires lymphocytes to circulate through lymph.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Adaptive immune responses that depend on lymphocytes meeting antigens in the nodes
- id: b
  en: Bile secretion by the liver
- id: c
  en: Blood clotting at a wound
- id: d
  en: Control of breathing rate
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.898E7D75F6FA
  when_answer_equals:
  - d
- id: MC.A.24CD8A4095C8
  when_answer_equals:
  - c
- id: MC.A.DA304A583119
  when_answer_equals:
  - b
solution_steps:
- en: Lymph nodes are where lymphocytes encounter antigens brought in by lymph and mount adaptive responses.
- en: Blocking their movement weakens these responses.
- en: The correct option is a.
tier: C
