id: A.11.biology.body_fluids_and_circulation.lymph.05
skill_ids:
- SK.A.11.biology.lymph
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A blockage prevents lymph from draining out of one arm, and the arm swells. What is the best explanation?
hints:
- level: 1
  en: Think about where extra tissue fluid normally goes.
- level: 2
  en: Consider what happens when the drainage route is closed.
- level: 3
  en: The accumulation is of a fluid, not of cells.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Red cells are being destroyed in the swollen area
- id: b
  en: Fluid cannot drain away, so interstitial fluid accumulates in the tissue
- id: c
  en: Oxygen levels rise too high in the tissue
- id: d
  en: Blood pressure falls to zero in the tissue
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.7301A235C239
  when_answer_equals:
  - a
- id: MC.A.1FD5FEA30B0D
  when_answer_equals:
  - d
- id: MC.A.FD7BB00F564F
  when_answer_equals:
  - c
solution_steps:
- en: Tissue fluid that is not returned by lymph builds up in the interstitial spaces, producing oedema.
- en: The swelling is fluid accumulation rather than cell damage.
- en: The correct option is b.
tier: C
