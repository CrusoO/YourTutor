id: A.11.biology.body_fluids_and_circulation.heart_and_cardiac_cycle.05
skill_ids:
- SK.A.11.biology.heart_and_cardiac_cycle
difficulty: 0.9
pool: practice
role: apply
stem:
  en: During ventricular systole, which valves are open?
hints:
- level: 1
  en: Think about the valves that open to let blood leave the ventricles.
- level: 2
  en: Consider which valves close when the ventricle contracts.
- level: 3
  en: The outflow valves are on the arterial side of the heart.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Only the valves of the right side
- id: b
  en: All of the valves at the same moment
- id: c
  en: The semilunar valves, the aortic and pulmonary valves
- id: d
  en: The atrioventricular valves only
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.239D91490305
  when_answer_equals:
  - d
- id: MC.A.15F9C29A9F4F
  when_answer_equals:
  - b
- id: MC.A.773DCB98803A
  when_answer_equals:
  - a
solution_steps:
- en: During systole the pressure in the ventricles exceeds the pressure in the aorta and pulmonary trunk, so the semilunar valves open to let blood leave.
- en: The atrioventricular valves close during this phase.
- en: The correct option is c.
tier: C
diagram_note: Draw a heart in section during ventricular systole, with the aortic and pulmonary valves open and the atrioventricular valves closed, labelling each valve and the chamber in contraction.
