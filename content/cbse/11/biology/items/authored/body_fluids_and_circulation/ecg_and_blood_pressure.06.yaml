id: A.11.biology.body_fluids_and_circulation.ecg_and_blood_pressure.06
skill_ids:
- SK.A.11.biology.ecg_and_blood_pressure
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which change would most likely raise blood pressure in a healthy person at rest?
hints:
- level: 1
  en: Think about the diameter of the arterioles and what that does to resistance.
- level: 2
  en: Consider which change narrows the vessels.
- level: 3
  en: Compare the effect of narrow vessels with that of wide vessels on pressure.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: An increase in peripheral resistance caused by narrowing of the arterioles
- id: b
  en: A fall in heart rate and stroke volume together
- id: c
  en: Dilation of arterioles throughout the body
- id: d
  en: Loss of a large volume of blood
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.6A0DEE51687D
  when_answer_equals:
  - c
- id: MC.A.679D7102811D
  when_answer_equals:
  - b
- id: MC.A.65F7EBC007F7
  when_answer_equals:
  - d
solution_steps:
- en: Blood pressure depends on cardiac output and peripheral resistance.
- en: Narrowing the arterioles raises resistance, so pressure rises for the same flow.
- en: The correct option is a.
tier: C
diagram_note: Draw two arterioles side by side, one wide and one narrowed, with arrows showing the resulting rise in peripheral resistance in the narrow one.
