id: A.11.biology.cell_cycle_and_cell_division.mitosis.02
skill_ids:
- SK.A.11.biology.mitosis
difficulty: 0.2
pool: practice
role: recall
stem:
  en: What happens to sister chromatids during anaphase?
hints:
- level: 1
  en: Think about the separation that ensures each daughter cell gets one copy.
- level: 2
  en: The chromatids are pulled by spindle fibres.
- level: 3
  en: The movement is toward the two ends of the cell.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They fuse into one chromosome
- id: b
  en: They disappear and are rebuilt later
- id: c
  en: They replicate again before moving
- id: d
  en: They separate and move toward opposite poles of the cell
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.37FF65521FA1
  when_answer_equals:
  - a
- id: MC.A.679E3C78CC0E
  when_answer_equals:
  - c
- id: MC.A.B7990B8F674B
  when_answer_equals:
  - b
solution_steps:
- en: In anaphase, the centromeres split and spindle fibres pull each sister chromatid to opposite poles.
- en: Each pole receives a full set of chromosomes.
- en: The correct option is d.
tier: C
