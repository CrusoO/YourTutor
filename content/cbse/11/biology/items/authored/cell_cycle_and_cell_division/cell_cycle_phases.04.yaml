type: numeric
answer:
  sympy: '12'
  accept: []
solution_steps:
- en: DNA replication in S phase doubles the DNA content, so 6 pg becomes 12 pg before the cell divides.
- en: The unit of the answer is pg.
- en: Answer = 12
