stem:
  en: A cell contains 6 picograms of DNA in G1. After S phase, how many picograms of DNA does the cell contain?
hints:
- level: 1
  en: Consider what replication does to the amount of DNA.
- level: 2
  en: Multiply the starting value by the factor produced by replication.
- level: 3
  en: The DNA content after S phase is a fixed multiple of the G1 value.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
