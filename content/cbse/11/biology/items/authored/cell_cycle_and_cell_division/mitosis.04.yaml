role: procedure
stem:
  en: Which order of the stages of mitosis is correct?
hints:
- level: 1
  en: Start with the stage in which the chromosomes first condense.
- level: 2
  en: The next stage aligns the chromosomes in the middle of the cell.
- level: 3
  en: Finish with the stage in which the nucleus reforms.
