stem:
  en: In which stage of mitosis do the chromosomes line up at the centre of the cell?
hints:
- level: 1
  en: Look at the stage when the chromosomes sit at the middle of the cell.
- level: 2
  en: Think about the stage just before sister chromatids separate.
- level: 3
  en: The alignment happens in the middle stage of the nuclear division.
