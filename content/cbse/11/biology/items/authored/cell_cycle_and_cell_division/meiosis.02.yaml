difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which event of meiosis I reduces the chromosome number by half?
hints:
- level: 1
  en: Think about which pairs of chromosomes separate first.
- level: 2
  en: The homologous pair is pulled to opposite poles.
- level: 3
  en: Compare the first division with the second division in terms of what separates.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Crossing over in prophase II
- id: b
  en: Separation of sister chromatids in anaphase II
- id: c
  en: Separation of homologous chromosomes in anaphase I
- id: d
  en: Replication of DNA in S phase
answer:
  sympy: c
  accept: []
misconception_rules:
