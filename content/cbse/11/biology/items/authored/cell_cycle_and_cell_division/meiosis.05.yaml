stem:
  en: A diploid cell has 2n = 12 chromosomes and undergoes meiosis. How many chromosomes does each resulting gamete contain?
hints:
- level: 1
  en: Meiosis reduces the chromosome number by a factor of two.
- level: 2
  en: Divide the diploid count by the number of sets in a gamete.
- level: 3
  en: Gametes are haploid, so compare them with the single set of the parent.
