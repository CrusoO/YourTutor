id: A.11.biology.cell_cycle_and_cell_division.meiosis.04
skill_ids:
- SK.A.11.biology.meiosis
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which statement correctly contrasts meiosis with mitosis?
hints:
- level: 1
  en: Count the daughter cells produced by each process.
- level: 2
  en: Check whether the daughter cells keep the parent's chromosome number.
- level: 3
  en: Think about which process creates gametes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Meiosis produces four haploid cells, while mitosis produces two genetically identical cells with the parent's chromosome number
- id: b
  en: Mitosis produces four haploid cells, while meiosis produces two cells
- id: c
  en: Both produce four haploid cells from one diploid cell
- id: d
  en: Meiosis produces two identical diploid cells, just like mitosis
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.B05769D2C80C
  when_answer_equals:
  - b
- id: MC.A.999A433EEFC8
  when_answer_equals:
  - d
- id: MC.A.35AB981747E5
  when_answer_equals:
  - c
solution_steps:
- en: Meiosis yields four genetically varied haploid cells used for gametes, while mitosis yields two identical cells that keep the parent's chromosome number.
- en: The correct option is a.
tier: C
diagram_note: Draw two parallel flow charts, one for meiosis giving four haploid cells and one for mitosis giving two identical diploid cells, labelling the number of divisions and the ploidy of the products.
