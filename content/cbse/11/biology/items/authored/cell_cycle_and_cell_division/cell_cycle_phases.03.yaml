id: A.11.biology.cell_cycle_and_cell_division.cell_cycle_phases.03
skill_ids:
- SK.A.11.biology.cell_cycle_phases
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why do many mature nerve and muscle cells remain in a non-dividing state?
hints:
- level: 1
  en: Think about cells that do their job without dividing.
- level: 2
  en: Consider whether the cell is dead or simply not dividing.
- level: 3
  en: Ask which phase label refers to a resting state outside the active cycle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They have exited the cycle into G0 and stay specialised for their function without dividing
- id: b
  en: They are dead cells that cannot divide
- id: c
  en: They are replicating DNA continuously
- id: d
  en: They have completed mitosis permanently
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.2D5A57EBB75C
  when_answer_equals:
  - b
- id: MC.A.3E8308500807
  when_answer_equals:
  - d
- id: MC.A.2F293F47A6C5
  when_answer_equals:
  - c
solution_steps:
- en: Many differentiated cells leave the active cycle and enter G0, a resting state in which they carry out specialised functions.
- en: They can still be alive and active while not dividing.
- en: The correct option is a.
tier: C
