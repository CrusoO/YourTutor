stem:
  en: A respiring tissue releases 6 mol of CO2 and consumes 8 mol of O2. What is its respiratory quotient, given as a decimal?
hints:
- level: 1
  en: Divide the CO2 released by the O2 consumed.
- level: 2
  en: Give the answer as a decimal rather than a fraction.
- level: 3
  en: Check the two gas amounts before dividing.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
