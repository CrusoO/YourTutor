solution_steps:
- en: Pyruvate is first converted to acetyl CoA by the link reaction, which feeds the Krebs cycle.
- en: The reduced carriers then pass their electrons to the electron transport chain.
- en: The correct option is a.
tier: C
diagram_note: Draw a flow from pyruvate through the link reaction to acetyl CoA, then into the Krebs cycle, then to the electron transport chain, labelling each stage and its location in the mitochondrion.
