difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which order of stages is correct as pyruvate is fully oxidised in aerobic respiration?
hints:
- level: 1
  en: Start with the step that converts pyruvate into acetyl CoA.
- level: 2
  en: The cycle must come after acetyl CoA is formed.
- level: 3
  en: Electrons from the cycle are passed to the chain last.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Link reaction, then Krebs cycle, then electron transport chain
- id: b
  en: Krebs cycle, then link reaction, then electron transport chain
- id: c
  en: Link reaction, then electron transport chain, then Krebs cycle
- id: d
  en: Electron transport chain, then Krebs cycle, then link reaction
answer:
  sympy: a
  accept: []
misconception_rules:
