id: A.11.biology.respiration_in_plants.glycolysis.05
skill_ids:
- SK.A.11.biology.glycolysis
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Glycolysis uses 2 ATP in its investment steps and produces 4 ATP in its payoff steps for each glucose molecule. What is the net ATP gained per glucose molecule?
hints:
- level: 1
  en: Subtract the ATP spent from the ATP made.
- level: 2
  en: The net value is production minus investment.
- level: 3
  en: Count the ATP used in the investment steps before comparing with the payoff.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: 'Net ATP is the ATP produced minus the ATP spent: 4 minus 2 gives 2 ATP per glucose.'
- en: Answer = 2
tier: C
