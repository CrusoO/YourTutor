id: A.11.biology.respiration_in_plants.fermentation_and_respiratory_quotient.05
skill_ids:
- SK.A.11.biology.fermentation_and_respiratory_quotient
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Yeast in a sealed vessel with glucose produces alcohol and releases less energy per glucose than aerobic respiration would. Why is this so?
hints:
- level: 1
  en: Compare how completely glucose is oxidised in each process.
- level: 2
  en: Consider where the remaining carbon ends up in the fermentation products.
- level: 3
  en: Think about the energy still stored in the end product.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Glucose is not fully oxidised, so much of its energy stays locked in the alcohol or acid product
- id: b
  en: Fermentation uses more glucose per ATP than respiration does
- id: c
  en: Fermentation produces more ATP than respiration because it is faster
- id: d
  en: Yeast cannot use glucose in any process that releases energy
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.7B7AEBC12EB9
  when_answer_equals:
  - b
- id: MC.A.28AADFD85D03
  when_answer_equals:
  - c
- id: MC.A.B104C05425E4
  when_answer_equals:
  - d
solution_steps:
- en: Fermentation stops at partly oxidised products such as ethanol, which still hold chemical energy.
- en: Aerobic respiration oxidises glucose completely and yields far more ATP per glucose.
- en: The correct option is a.
tier: C
