difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why can glycolysis continue in the absence of oxygen?
hints:
- level: 1
  en: Think about which molecules glycolysis consumes and releases.
- level: 2
  en: Consider whether any step in the pathway needs gaseous oxygen.
- level: 3
  en: Compare the inputs of glycolysis with those of the Krebs cycle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It requires oxygen to split glucose into pyruvate
- id: b
  en: Its steps do not use oxygen, and NAD+ is regenerated by fermentation when oxygen is absent
- id: c
  en: It takes place inside the mitochondria when oxygen is absent
- id: d
  en: It uses oxygen only at its final step
answer:
  sympy: b
  accept: []
misconception_rules:
