id: A.11.biology.respiration_in_plants.krebs_cycle_etc.06
skill_ids:
- SK.A.11.biology.krebs_cycle_etc
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A poison blocks ATP synthase in the inner mitochondrial membrane, but electron flow along the chain continues. What happens to the proton gradient and to ATP production?
hints:
- level: 1
  en: Think about how protons normally return to the matrix.
- level: 2
  en: Consider whether electron flow depends directly on ATP synthase.
- level: 3
  en: Ask what happens to the gradient if its only return route is closed.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Oxygen consumption rises and ATP is made by glycolysis alone
- id: b
  en: Protons leak freely and ATP production increases
- id: c
  en: The gradient builds up and ATP production falls, because protons cannot flow back through the enzyme
- id: d
  en: Electron flow stops immediately and the gradient disappears
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.3137DD2807DC
  when_answer_equals:
  - b
- id: MC.A.89341DB95D8D
  when_answer_equals:
  - d
- id: MC.A.83FFF2CC97AE
  when_answer_equals:
  - a
solution_steps:
- en: Electron transport keeps pumping protons into the intermembrane space.
- en: With ATP synthase blocked, the protons cannot return through it, so the gradient builds and ATP synthesis falls.
- en: The correct option is c.
tier: C
diagram_note: Draw the inner membrane with the electron transport chain pumping protons outward and ATP synthase blocked with an X, labelling the proton gradient and the matrix side.
