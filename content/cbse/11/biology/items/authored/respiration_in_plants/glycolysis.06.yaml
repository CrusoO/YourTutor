id: A.11.biology.respiration_in_plants.glycolysis.06
skill_ids:
- SK.A.11.biology.glycolysis
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A cell lacks the enzyme that converts pyruvate into acetyl CoA. What is the most direct consequence for the glycolysis products?
hints:
- level: 1
  en: Think about what happens to pyruvate if it cannot enter the next step.
- level: 2
  en: Consider how NAD+ is regenerated when the mitochondria do not take up pyruvate.
- level: 3
  en: Ask which alternative process would keep glycolysis running.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Oxygen consumption rises because pyruvate burns faster
- id: b
  en: Glucose can no longer enter the cell
- id: c
  en: Pyruvate accumulates, and the cell must regenerate NAD+ through fermentation to keep glycolysis running
- id: d
  en: Glycolysis stops at its first step
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.8A1EE967B115
  when_answer_equals:
  - d
- id: MC.A.F44C47FEE84F
  when_answer_equals:
  - b
- id: MC.A.B76581969B5F
  when_answer_equals:
  - a
solution_steps:
- en: Without the link step, pyruvate cannot enter the Krebs cycle and builds up.
- en: NAD+ must then be regenerated by reducing pyruvate, which is the fermentation route.
- en: The correct option is c.
tier: C
diagram_note: Draw the pathway from glucose to pyruvate, then a blocked arrow at the link step to acetyl CoA, with a branch from pyruvate to fermentation products, labelling each step.
