difficulty: 0.6
pool: practice
role: procedure
stem:
  en: 'A student is classifying an unknown animal and checks features in this order: symmetry, body layers, then coelom. Which feature should be checked first?'
hints:
- level: 1
  en: Start with the feature that divides animals into the broadest groups.
- level: 2
  en: Think about whether the body is arranged around a centre or along one axis.
- level: 3
  en: The order in the question already lists the first feature for you to check.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The presence of a coelom
- id: b
  en: The colour of the animal
- id: c
  en: Symmetry of the body
- id: d
  en: The number of germ layers
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.2404BE9FA1A6
  when_answer_equals:
  - a
- id: MC.A.E53EB787326E
  when_answer_equals:
