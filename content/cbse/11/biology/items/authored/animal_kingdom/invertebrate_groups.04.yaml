stem:
  en: Three invertebrate groups are arthropods, molluscs and annelids. How many of these three groups have a body divided into repeated segments?
hints:
- level: 1
  en: Check each of the three groups for segmentation separately.
- level: 2
  en: Think about which of the three has a soft unsegmented body.
- level: 3
  en: Count only the groups whose body is divided into repeated units.
