difficulty: 0.9
pool: practice
role: transfer
stem:
  en: An animal lays eggs with leathery shells on land, has scales and breathes with lungs throughout life. Which conclusion is best supported?
hints:
- level: 1
  en: Check the skin, the breathing method and the egg structure together.
- level: 2
  en: Ask whether the egg-laying feature is shared by more than one class.
- level: 3
  en: Compare the set of features with the reptile group's defining traits.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is a bird because it lays eggs
- id: b
  en: It is an amphibian because it lives on land
- id: c
  en: It most likely belongs to Reptilia, which has scales and land-laid shelled eggs
- id: d
  en: It is a fish because it has scales
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.598026B9EE06
  when_answer_equals:
  - a
- id: MC.A.E51F58CF6771
  when_answer_equals:
  - b
- id: MC.A.723A6BDB6704
  when_answer_equals:
  - d
solution_steps:
- en: Scaly skin, lung breathing throughout life and land-laid shelled eggs are the defining features of reptiles.
- en: Egg-laying alone does not define birds, and scales are not restricted to fish.
- en: The correct option is c.
tier: C
