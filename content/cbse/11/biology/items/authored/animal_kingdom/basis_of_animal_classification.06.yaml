stem:
  en: Two animals look alike, yet one is a bilateral coelomate and the other is a radial animal with no true coelom. Which conclusion is best supported?
hints:
- level: 1
  en: Ask whether appearance or body plan features are the better guide.
- level: 2
  en: Think about which features reflect embryonic development.
- level: 3
  en: Consider whether a resemblance can arise without shared ancestry.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They must have the same germ layers
- id: b
  en: They must both be vertebrates
- id: c
  en: They differ in body plan features, so their overall similarity does not place them together
- id: d
  en: They must be close relatives because they look similar
answer:
  sympy: c
  accept: []
