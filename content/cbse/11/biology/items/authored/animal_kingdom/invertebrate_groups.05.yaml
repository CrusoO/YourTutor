stem:
  en: A newly found invertebrate has a segmented body, jointed legs and a hard external skeleton. Which phylum is the most likely match?
hints:
- level: 1
  en: Check the jointed legs and the hard outer covering first.
- level: 2
  en: Segmented bodies alone do not settle the phylum.
- level: 3
  en: Think about the group whose features include all three described.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
