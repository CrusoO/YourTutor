id: A.11.biology.animal_kingdom.basis_of_animal_classification.05
skill_ids:
- SK.A.11.biology.basis_of_animal_classification
difficulty: 0.9
pool: practice
role: apply
stem:
  en: An animal has bilateral symmetry, three germ layers and a true coelom lined by mesoderm. Which group does it most likely belong to?
hints:
- level: 1
  en: Start by checking the symmetry, then the germ layers, then the cavity.
- level: 2
  en: Sponges and jellyfish do not share the combination of these features.
- level: 3
  en: Think about the group that carries all three features together.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A sponge with no tissues
- id: b
  en: A jellyfish with radial symmetry
- id: c
  en: A flatworm with no body cavity
- id: d
  en: A coelomate bilaterian such as an earthworm or a vertebrate
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.5E590F58B165
  when_answer_equals:
  - a
- id: MC.A.B3DF42DBD431
  when_answer_equals:
  - b
- id: MC.A.C4F375F946B5
  when_answer_equals:
  - c
solution_steps:
- en: Bilateral symmetry, triploblastic development and a true coelom together describe coelomate bilaterians, a group that includes earthworms and vertebrates.
- en: The correct option is d.
tier: C
diagram_note: Draw a cross section of a bilateral animal showing three germ layers and a coelom lined by mesoderm, with labels for ectoderm, mesoderm, endoderm and coelom.
