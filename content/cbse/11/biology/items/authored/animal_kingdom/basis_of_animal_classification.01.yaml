stem:
  en: Which body symmetry is shown by a starfish with five arms radiating from a central disc?
hints:
- level: 1
  en: Imagine cutting the body through the centre in many directions and getting similar halves.
- level: 2
  en: The arms radiate outward from one centre.
- level: 3
  en: Think about the arrangement of parts around a single central point.
