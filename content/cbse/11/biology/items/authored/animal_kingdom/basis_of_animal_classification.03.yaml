difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why are animals with three germ layers called triploblastic?
hints:
- level: 1
  en: Think about the layers formed in the early embryo, not the body parts of the adult.
- level: 2
  en: Consider what the middle layer forms in many animals.
- level: 3
  en: The term is about embryonic tissue layers rather than chromosomes.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Their embryo develops ectoderm, mesoderm and endoderm as distinct layers
- id: b
  en: They reproduce through three separate life stages
- id: c
  en: They have three body segments in every case
- id: d
  en: They have three sets of chromosomes
answer:
  sympy: a
  accept: []
