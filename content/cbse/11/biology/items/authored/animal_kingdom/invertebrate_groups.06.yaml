id: A.11.biology.animal_kingdom.invertebrate_groups.06
skill_ids:
- SK.A.11.biology.invertebrate_groups
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A researcher says that all animals with a shell are molluscs. Which correction is most accurate?
hints:
- level: 1
  en: Ask whether a single external feature is enough to assign a phylum.
- level: 2
  en: Think about how many distinct groups have a protective covering.
- level: 3
  en: Consider which combination of features defines the mollusc body plan.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Shells are a feature of vertebrates only
- id: b
  en: A shell means the animal has a coelom
- id: c
  en: Shells are found only in molluscs in every case
- id: d
  en: Some animals with shells, such as certain arthropods and brachiopods, belong to other groups
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.EBA519F9756A
  when_answer_equals:
  - c
- id: MC.A.87A7736AD039
  when_answer_equals:
  - a
- id: MC.A.56867809E674
  when_answer_equals:
  - b
solution_steps:
- en: Shells evolved in several separate lineages, so a shell alone does not prove molluscan ancestry.
- en: Classification uses a set of features, not a single external structure.
- en: The correct option is d.
tier: C
