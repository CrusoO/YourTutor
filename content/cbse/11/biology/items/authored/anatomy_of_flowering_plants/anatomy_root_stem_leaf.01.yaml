difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which feature is typical of monocot roots rather than dicot roots?
hints:
- level: 1
  en: Think about the root system of grasses compared with that of beans.
- level: 2
  en: Count the number of xylem groups, not their arrangement in the leaf.
- level: 3
  en: Consider whether the root is fibrous or tap-like.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A ring of many xylem and phloem bundles arranged in a fibrous pattern
- id: b
  en: A single central xylem and a secondary growth cambium
- id: c
  en: Vascular bundles scattered randomly in a ground tissue of leaves
- id: d
  en: A tap root with a large central pith region
answer:
  sympy: a
  accept: []
