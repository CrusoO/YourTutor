id: A.11.biology.anatomy_of_flowering_plants.tissues_of_plants.04
skill_ids:
- SK.A.11.biology.tissues_of_plants
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A student is classifying a section of a stem. Which tissue system contains the epidermis, cortex and pith?
hints:
- level: 1
  en: Consider which system includes the cells between the outer skin and the conducting bundles.
- level: 2
  en: The epidermis alone belongs to a different system.
- level: 3
  en: Think about the system that is mainly made of simple, unspecialised cells.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Reproductive tissue system
- id: b
  en: Vascular tissue system
- id: c
  en: Dermal tissue system only
- id: d
  en: Ground tissue system
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.5A6542CE814F
  when_answer_equals:
  - b
- id: MC.A.48347FFAE296
  when_answer_equals:
  - c
- id: MC.A.05B58B002BBA
  when_answer_equals:
  - a
solution_steps:
- en: The ground tissue system includes the cortex and pith, which are mostly parenchyma, while the epidermis belongs to the dermal system.
- en: The question groups the cortex and pith together.
- en: The correct option is d.
tier: C
diagram_note: Draw a stem cross section showing the outer epidermis, the cortex and pith as ground tissue, and the vascular bundles, labelling each system.
