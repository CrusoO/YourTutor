role: explain
stem:
  en: Why do annual rings form in the wood of trees in temperate regions?
hints:
- level: 1
  en: Think about how growth rate changes over the seasons.
- level: 2
  en: Consider the density and width of the wood formed in different seasons.
- level: 3
  en: The pattern of wood layers reflects a yearly cycle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Rings form because the tree sheds one layer of bark each year
- id: b
  en: The cambium stops working entirely in winter and restarts from the pith
- id: c
  en: Seasonal changes produce wide spring xylem and narrow autumn xylem in each year
- id: d
  en: Rings are caused by the number of leaves that fall each year
answer:
  sympy: c
  accept: []
