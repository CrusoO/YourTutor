id: A.11.biology.anatomy_of_flowering_plants.tissues_of_plants.05
skill_ids:
- SK.A.11.biology.tissues_of_plants
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A section shows a bundle of xylem and phloem in which xylem is closer to the centre and phloem is closer to the outside. What is this arrangement called, and in which group is it typical?
hints:
- level: 1
  en: Check whether xylem and phloem sit on the same radius or on separate radii.
- level: 2
  en: Think about which organ usually shows this arrangement.
- level: 3
  en: Compare the arrangement with the stem arrangement you know.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Radial arrangement, typical of roots of dicots
- id: b
  en: Conjoint open arrangement, typical of dicot stems
- id: c
  en: Radial arrangement, typical of monocot stems
- id: d
  en: Concentric arrangement, typical of monocot leaves
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.D4D4C41C1023
  when_answer_equals:
  - b
- id: MC.A.945D92C7C02E
  when_answer_equals:
  - d
- id: MC.A.55840B691396
  when_answer_equals:
  - c
solution_steps:
- en: In a radial vascular bundle xylem and phloem lie on different radii, as in the root, and this is typical of dicot roots.
- en: Conjoint arrangements occur in stems.
- en: The correct option is a.
tier: C
diagram_note: Draw a root cross section with a central xylem star and phloem between its arms, labelling xylem, phloem and the pericycle.
