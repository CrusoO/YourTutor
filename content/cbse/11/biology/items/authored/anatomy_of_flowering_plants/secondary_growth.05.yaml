difficulty: 0.9
pool: practice
role: apply
stem:
  en: A dicot stem has 14 annual rings in its secondary xylem, and the bark has recently been shed. What is the best estimate of the tree's age?
hints:
- level: 1
  en: Think about what one annual ring represents.
- level: 2
  en: Ask whether the shed bark removes the rings from the wood.
- level: 3
  en: Consider why the wood rings might underestimate the true age.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Exactly 7 years
- id: b
  en: About 28 years
- id: c
  en: At least 14 years
- id: d
  en: Younger than 1 year
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.14908D384A18
  when_answer_equals:
  - a
- id: MC.A.311BB90F63A5
  when_answer_equals:
  - b
- id: MC.A.81E42F594FAC
  when_answer_equals:
  - d
solution_steps:
- en: Each ring represents one year of growth, so 14 rings suggest at least 14 years.
- en: Shed bark does not remove the record in the wood, but the innermost rings may be damaged, which is why the answer is a minimum.
- en: The correct option is c.
tier: C
