difficulty: 0.9
pool: practice
role: apply
stem:
  en: A monocot stem has scattered vascular bundles and no ring of cambium. Which statement about its growth in girth is most accurate?
hints:
- level: 1
  en: Ask whether the bundles contain a cambium that can divide.
- level: 2
  en: Think about how dicot stems add tissue each year.
- level: 3
  en: Compare the cambium presence in the two groups.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Its girth increases only by lateral branching
- id: b
  en: It increases girth using a cork cambium in the pith
- id: c
  en: It grows in girth rapidly through a continuous cambium ring
- id: d
  en: It generally does not undergo normal secondary growth, so its girth increases little
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.CFB9907A9A43
  when_answer_equals:
  - c
- id: MC.A.15F78836521C
  when_answer_equals:
  - a
- id: MC.A.94E6B89BCE05
  when_answer_equals:
  - b
solution_steps:
- en: Most monocot stems lack a vascular cambium in their bundles, so they do not produce the extra secondary xylem and phloem that thicken dicot stems.
- en: Their girth changes little after primary growth.
- en: The correct option is d.
tier: C
