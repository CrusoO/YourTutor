stem:
  en: Which feature makes collenchyma suited to support young growing stems?
hints:
- level: 1
  en: Think about support in an organ that is still growing.
- level: 2
  en: Compare whether the cells are alive or dead, and whether their walls are rigid or flexible.
- level: 3
  en: Consider which supporting tissue is living and flexible rather than rigid.
