id: A.11.biology.anatomy_of_flowering_plants.secondary_growth.04
skill_ids:
- SK.A.11.biology.secondary_growth
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A student wants to estimate the age of a tree from a stem cross section. Which feature should be counted?
hints:
- level: 1
  en: Look for the bands of wood in the cross section.
- level: 2
  en: Think about which layer records the yearly growth cycle.
- level: 3
  en: Consider which feature accumulates once each year without being lost.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The number of flowers produced
- id: b
  en: The number of bark layers that have been shed
- id: c
  en: The number of leaves on the branches
- id: d
  en: The number of annual rings in the secondary xylem
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.F099C958F15E
  when_answer_equals:
  - c
- id: MC.A.26C630F7D1B1
  when_answer_equals:
  - a
- id: MC.A.889EA0D4159F
  when_answer_equals:
  - b
solution_steps:
- en: Each year the vascular cambium adds one ring of secondary xylem, so counting the rings gives an estimate of the tree's age in years.
- en: The correct option is d.
tier: C
diagram_note: Draw a trunk cross section with the pith at the centre, annual rings of secondary xylem, the cambium, phloem and bark, labelling each layer.
