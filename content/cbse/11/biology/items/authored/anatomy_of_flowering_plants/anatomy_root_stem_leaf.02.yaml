stem:
  en: In a dicot stem, where is the cambium located?
hints:
- level: 1
  en: Think of the layer that sits between the two conducting tissues.
- level: 2
  en: Consider which tissue the cambium adds to on each side.
- level: 3
  en: The cambium is a thin meristematic layer in the bundle.
