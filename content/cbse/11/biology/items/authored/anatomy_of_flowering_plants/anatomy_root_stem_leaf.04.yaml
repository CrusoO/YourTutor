id: A.11.biology.anatomy_of_flowering_plants.anatomy_root_stem_leaf.04
skill_ids:
- SK.A.11.biology.anatomy_root_stem_leaf
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A student compares a dicot stem and a monocot stem in cross section. Which feature should be checked first to decide which type it is?
hints:
- level: 1
  en: Look at the cross section, not the length or colour.
- level: 2
  en: Think about whether the bundles form a ring or are scattered through the tissue.
- level: 3
  en: Consider which anatomical feature separates the two groups most directly.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The number of flowers on the stem
- id: b
  en: The length of the stem
- id: c
  en: The colour of the stem
- id: d
  en: The arrangement of vascular bundles, whether in a ring or scattered
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.E3C371214972
  when_answer_equals:
  - c
- id: MC.A.C6DC798B54BA
  when_answer_equals:
  - b
- id: MC.A.DA5A3AAE5DED
  when_answer_equals:
  - a
solution_steps:
- en: Dicot stems usually show vascular bundles in a ring, while monocot stems show scattered bundles.
- en: This arrangement is a reliable first check for the two groups.
- en: The correct option is d.
tier: C
diagram_note: Draw two small stem cross sections side by side, one with vascular bundles in a ring and one with scattered bundles, labelling the bundles and the ground tissue.
