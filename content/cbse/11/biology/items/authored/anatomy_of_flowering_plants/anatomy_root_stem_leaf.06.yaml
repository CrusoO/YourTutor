id: A.11.biology.anatomy_of_flowering_plants.anatomy_root_stem_leaf.06
skill_ids:
- SK.A.11.biology.anatomy_root_stem_leaf
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A dicot root and a dicot stem are compared after many years of growth. Which difference is most likely?
hints:
- level: 1
  en: Consider whether the root also has a cambium that adds tissue.
- level: 2
  en: Compare the arrangement of xylem and phloem in the two organs.
- level: 3
  en: Think about which feature reflects the organ's function rather than its growth.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Only the stem thickens and the root never does
- id: b
  en: The root has stomata in its outer layer like a leaf
- id: c
  en: Both lose all their xylem and phloem
- id: d
  en: The root and stem both thicken through a cambium, but their vascular arrangements differ
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.3479D744E578
  when_answer_equals:
  - a
- id: MC.A.542912E3DFE2
  when_answer_equals:
  - c
- id: MC.A.CFA539611399
  when_answer_equals:
  - b
solution_steps:
- en: Dicot roots and stems both undergo secondary growth through a vascular cambium, but the root has a radial arrangement and the stem has a conjoint one.
- en: Both organs thicken.
- en: The correct option is d.
tier: C
diagram_note: Draw a dicot root and a dicot stem in cross section, both with a cambium ring, labelling the xylem, phloem and cambium in each.
