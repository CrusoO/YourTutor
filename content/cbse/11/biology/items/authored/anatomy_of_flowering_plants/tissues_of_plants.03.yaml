stem:
  en: Why are sieve tubes described as living cells with few organelles?
hints:
- level: 1
  en: Think about what the sieve tube keeps and what it loses as it matures.
- level: 2
  en: Consider which neighbouring cells assist the sieve tube.
- level: 3
  en: The tissue is phloem, not xylem.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
