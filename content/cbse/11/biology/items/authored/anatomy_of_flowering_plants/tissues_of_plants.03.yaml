  author: model-draft
type: mcq
options:
- id: a
  en: They have a thick lignified wall and no cytoplasm
- id: b
  en: They are supported by many companion cells in the root
- id: c
  en: They contain large vacuoles only
- id: d
  en: Their nucleus degenerates while companion cells keep them functioning
answer:
