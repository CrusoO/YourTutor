id: A.11.biology.plant_growth_and_development.photoperiodism_vernalisation.03
skill_ids:
- SK.A.11.biology.photoperiodism_vernalisation
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why do short-day plants tend to flower in autumn rather than in long summer days?
hints:
- level: 1
  en: Think about what the plant measures, the light or the dark period.
- level: 2
  en: Consider whether night length is increasing or decreasing in autumn.
- level: 3
  en: The critical feature is the length of the uninterrupted dark period.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They are triggered when the uninterrupted night is longer than a critical length, and autumn nights reach that length
- id: b
  en: They flower in response to continuous light
- id: c
  en: They are not sensitive to day length at all
- id: d
  en: Their flowering is driven by soil nitrogen only
answer:
  sympy: a
  accept: []
misconception_rules:
