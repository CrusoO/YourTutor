id: A.11.biology.plant_growth_and_development.photoperiodism_vernalisation.06
skill_ids:
- SK.A.11.biology.photoperiodism_vernalisation
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A researcher interrupts a long dark period with a brief flash of light in a short-day plant. What flowering response is most likely?
hints:
- level: 1
  en: Think about what the plant measures, which is an uninterrupted dark period.
- level: 2
  en: Consider whether a brief flash of light breaks that period.
- level: 3
  en: Compare the effect with a plant that needs long days.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: No effect, since light does not affect the dark period
- id: b
  en: Flowering is accelerated, because the light adds energy
- id: c
  en: Vernalisation is triggered instantly
- id: d
  en: Flowering is inhibited, because the light flash breaks the critical uninterrupted dark period
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.5FBA4C1CA5FF
  when_answer_equals:
  - b
- id: MC.A.2B0041D22CD2
  when_answer_equals:
  - a
- id: MC.A.1315D2D2AF0D
  when_answer_equals:
  - c
solution_steps:
- en: Short-day plants measure an uninterrupted dark period.
- en: A brief light flash in the middle of the night breaks this period and prevents flowering.
- en: The correct option is d.
tier: C
