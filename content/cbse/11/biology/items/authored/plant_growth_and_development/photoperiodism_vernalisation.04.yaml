stem:
  en: A plant that requires long days is kept under short days only. What result is expected?
hints:
- level: 1
  en: Think about the light condition that the plant needs to start flowering.
- level: 2
  en: Consider whether the required light condition is present.
- level: 3
  en: Ask whether the plant's requirement has been met.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
