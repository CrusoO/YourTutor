id: A.11.biology.plant_growth_and_development.growth_phases.05
skill_ids:
- SK.A.11.biology.growth_phases
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A root tip with its active division zone is removed, while the elongation zone further back is left in place. What is the most likely effect on root growth?
hints:
- level: 1
  en: Think about where the cells that enter the elongation zone come from.
- level: 2
  en: Consider what happens to the zone behind the tip if no new cells arrive.
- level: 3
  en: Ask which region is responsible for supplying new cells to the root.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Root growth increases because the tip was limiting growth
- id: b
  en: Cells in the maturation zone divide faster to compensate
- id: c
  en: The root starts forming flowers instead of growing
- id: d
  en: Root elongation slows or stops because the elongation zone receives no new cells
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.D37BA27F20BA
  when_answer_equals:
  - a
- id: MC.A.B099318565C7
  when_answer_equals:
  - c
- id: MC.A.09768F795EE6
  when_answer_equals:
  - b
solution_steps:
- en: The meristem at the tip supplies new cells that move into the elongation zone.
- en: Without this supply, the elongation zone cannot continue adding length.
- en: The correct option is d.
tier: C
diagram_note: Draw a root tip showing the meristematic zone at the apex, the elongation zone behind it and the maturation zone further back, with arrows showing cell flow, and cut off the apex to show the effect.
