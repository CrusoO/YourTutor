id: A.11.biology.plant_growth_and_development.plant_growth_regulators.03
skill_ids:
- SK.A.11.biology.plant_growth_regulators
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does auxin produced at the shoot tip promote apical dominance?
hints:
- level: 1
  en: Think about where auxin is made in a shoot.
- level: 2
  en: Consider which buds grow when the shoot tip is removed.
- level: 3
  en: The effect is on buds lower on the stem.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is produced only in flowers and affects fruit growth
- id: b
  en: It stops the apical bud from growing at all
- id: c
  en: It is produced at the shoot tip and inhibits the growth of lateral buds lower on the stem
- id: d
  en: It is produced in the roots and promotes growth of lateral buds
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.12745A8CAC6C
  when_answer_equals:
  - d
- id: MC.A.648B03F3873F
  when_answer_equals:
  - b
- id: MC.A.FA131E4B32F9
  when_answer_equals:
  - a
solution_steps:
- en: Auxin moving down from the apical bud suppresses the outgrowth of lateral buds.
- en: Removing the apex lowers auxin in the stem and releases the side buds.
- en: The correct option is c.
tier: C
