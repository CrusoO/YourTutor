id: A.11.biology.plant_growth_and_development.photoperiodism_vernalisation.05
skill_ids:
- SK.A.11.biology.photoperiodism_vernalisation
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A winter cereal is sown in spring and does not flower. Which treatment would most likely induce flowering in this plant?
hints:
- level: 1
  en: Think about the environmental cue that these cereals normally experience before flowering.
- level: 2
  en: Consider which season provides this cue in the natural life cycle.
- level: 3
  en: The requirement is a physical exposure, not a chemical supplement.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Keeping the seeds in a hot, dry store
- id: b
  en: Exposing the seed or young plant to a period of cold before flowering
- id: c
  en: Covering the plants with dark cloth for one day
- id: d
  en: Adding nitrogen fertiliser only
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.3D9241116FD8
  when_answer_equals:
  - a
- id: MC.A.9B501BAC57C5
  when_answer_equals:
  - c
- id: MC.A.021CC7AE3CCB
  when_answer_equals:
  - d
solution_steps:
- en: Winter cereals need vernalisation, a cold period, to acquire the competence to flower.
- en: Without it they remain vegetative even under suitable day lengths.
- en: The correct option is b.
tier: C
