stem:
  en: A plant suffers drought, and its stomata close within hours. Which hormone is most likely responsible for this response?
hints:
- level: 1
  en: Think about the stress hormone that promotes dormancy and closes stomata.
- level: 2
  en: Consider which hormone accumulates during water deficit.
- level: 3
  en: The hormone is named for a process that involves leaves shedding.
