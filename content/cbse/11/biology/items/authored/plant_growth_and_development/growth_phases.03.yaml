id: A.11.biology.plant_growth_and_development.growth_phases.03
skill_ids:
- SK.A.11.biology.growth_phases
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why is the steep part of a growth curve called the exponential phase?
hints:
- level: 1
  en: Think about whether the number of dividing cells grows with time.
- level: 2
  en: Consider what the rate of increase depends on.
- level: 3
  en: Compare the rate at the start with the rate during the steep part.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The number of dividing cells grows in proportion to the current number, so the increase speeds up
- id: b
  en: Growth stops and restarts at regular intervals
- id: c
  en: Cells stop dividing completely during this phase
- id: d
  en: Growth depends only on the amount of light received
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.D9910B92F345
  when_answer_equals:
  - b
- id: MC.A.F397FEC2115D
  when_answer_equals:
  - c
- id: MC.A.97B963FC341A
  when_answer_equals:
  - d
solution_steps:
- en: During the exponential phase each cell division creates more dividing cells, so the population or organism doubles over regular periods.
- en: The rate of increase therefore rises with time.
- en: The correct option is a.
tier: C
