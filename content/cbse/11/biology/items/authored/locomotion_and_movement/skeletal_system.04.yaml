stem:
  en: A student is classifying joints in the skull. Which joint type do the skull sutures represent?
hints:
- level: 1
  en: Sutures in the skull are held by dense connective tissue.
- level: 2
  en: This joint type is immovable or nearly so.
- level: 3
  en: The bones are joined by fibres rather than by a cavity.
