id: A.11.biology.locomotion_and_movement.muscle_contraction.04
skill_ids:
- SK.A.11.biology.muscle_contraction
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: In the sliding filament mechanism, which band of the sarcomere stays the same length during contraction?
hints:
- level: 1
  en: The dark band contains the full length of the thick filaments.
- level: 2
  en: Think about the band that matches the length of the thick filament.
- level: 3
  en: The I band and the H zone shorten as the thin filaments slide inward.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The Z line
- id: b
  en: The H zone only
- id: c
  en: The I band
- id: d
  en: The A band
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.7B67F07C9B24
  when_answer_equals:
  - c
- id: MC.A.AAAA0B50CEAC
  when_answer_equals:
  - a
- id: MC.A.F949C45C39A6
  when_answer_equals:
  - b
solution_steps:
- en: The A band is the length of the thick filaments, which do not change length.
- en: The I band and H zone shorten as the thin filaments slide inward during contraction.
- en: The correct option is d.
tier: C
diagram_note: Draw one sarcomere in resting and contracted states, labelling the Z lines, the I band, the A band and the H zone, and noting which bands shorten.
