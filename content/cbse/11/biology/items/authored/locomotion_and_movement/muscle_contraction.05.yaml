stem:
  en: A sarcomere is 2.4 micrometres long at rest and shortens to 1.6 micrometres when contracted. By how many micrometres does it shorten?
hints:
- level: 1
  en: Subtract the contracted length from the resting length.
- level: 2
  en: Take care with the decimal place in both values.
- level: 3
  en: The result is a small difference between two close lengths.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.8'
  accept: []
solution_steps:
- en: The shortening is the resting length minus the contracted length, which is 2.4 minus 1.6, giving 0.8 micrometres.
- en: The unit of the answer is micrometres.
- en: Answer = 0.8
