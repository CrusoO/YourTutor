id: A.11.biology.locomotion_and_movement.types_of_movement.06
skill_ids:
- SK.A.11.biology.types_of_movement
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Why do cilia lining the trachea beat in one coordinated direction to move mucus upward?
hints:
- level: 1
  en: Think about how a single stroke differs between the forward part and the return part.
- level: 2
  en: Consider whether the beat is symmetric or whether one half is more powerful.
- level: 3
  en: The direction of the sweep depends on the shape of the stroke.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Cilia attach to the air and are pulled along by breathing
- id: b
  en: Cilia move only when nerve signals contract them
- id: c
  en: Each ciliary stroke is asymmetric, with a fast power stroke in one direction and a slower recovery stroke
- id: d
  en: Cilia are moved passively by the blood flow in the airway
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.DC3427B69FE3
  when_answer_equals:
  - d
- id: MC.A.40C1008FD1D2
  when_answer_equals:
  - a
- id: MC.A.66A992DD9785
  when_answer_equals:
  - b
solution_steps:
- en: The power stroke of a cilium sweeps further than its recovery stroke, so the cilia move fluid in a consistent direction.
- en: This asymmetry explains the upward mucus transport in the airway.
- en: The correct option is c.
tier: C
diagram_note: Draw a cilium in two positions, showing the fast power stroke sweeping mucus upward and the slower recovery stroke returning close to the surface, labelling both strokes.
