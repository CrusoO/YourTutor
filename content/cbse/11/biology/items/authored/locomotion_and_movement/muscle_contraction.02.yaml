stem:
  en: What is the role of calcium ions in skeletal muscle contraction?
hints:
- level: 1
  en: Think about the regulatory protein that blocks the binding site on actin at rest.
- level: 2
  en: Consider what happens when calcium is released from the sarcoplasmic reticulum.
- level: 3
  en: Calcium acts as a switch rather than as a source of energy.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
