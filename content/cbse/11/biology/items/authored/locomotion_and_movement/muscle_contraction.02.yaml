  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They relax the sarcomere by pumping sodium out
- id: b
  en: They join actin and myosin permanently
- id: c
  en: They break down ATP to release energy
- id: d
  en: They bind troponin and move tropomyosin to expose myosin-binding sites on actin
answer:
