stem:
  en: A child has 33 vertebrae at birth, and the adult has 26 separate vertebrae. How many of the birth vertebrae have fused or been lost in total?
hints:
- level: 1
  en: Subtract the adult count from the birth count.
- level: 2
  en: Compare the two counts carefully before subtracting.
- level: 3
  en: The difference is the number of vertebrae that have fused during growth.
