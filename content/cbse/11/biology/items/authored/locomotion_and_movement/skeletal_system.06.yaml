id: A.11.biology.locomotion_and_movement.skeletal_system.06
skill_ids:
- SK.A.11.biology.skeletal_system
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A person tears the cartilage pad inside the knee joint. Which function of the joint is most directly reduced?
hints:
- level: 1
  en: Think about the cushioning role of cartilage in a joint.
- level: 2
  en: Consider how the joint absorbs load during walking.
- level: 3
  en: Ask what happens to bone contact when the cartilage pad is damaged.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Shock absorption and smooth gliding between the bones of the joint
- id: b
  en: Control of the heartbeat through the knee
- id: c
  en: Production of red blood cells inside the knee
- id: d
  en: Breakdown of starch within the knee
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.4207F55A1A6C
  when_answer_equals:
  - c
- id: MC.A.16FCB7A513C0
  when_answer_equals:
  - b
- id: MC.A.5D9422C7F435
  when_answer_equals:
  - d
solution_steps:
- en: The meniscus and articular cartilage absorb load and let the bone ends glide without friction.
- en: Tearing the cartilage reduces both shock absorption and smooth movement.
- en: The correct option is a.
tier: C
diagram_note: Draw a knee joint in section, labelling the femur, tibia, the meniscus cartilage and the joint cavity, and marking the torn part of the pad.
