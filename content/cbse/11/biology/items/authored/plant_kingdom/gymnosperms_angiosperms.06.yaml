id: A.11.biology.plant_kingdom.gymnosperms_angiosperms.06
skill_ids:
- SK.A.11.biology.gymnosperms_angiosperms
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A plant produces naked seeds in cones but has broad leaves. Which conclusion is best supported by this evidence?
hints:
- level: 1
  en: Focus on the reproductive structure rather than the leaves.
- level: 2
  en: Ask what the seed is surrounded by.
- level: 3
  en: Some gymnosperms have broad leaves, so leaves alone are not decisive.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The plant must be a fern because it has broad leaves
- id: b
  en: The seed structure points to gymnosperms, while broad leaves do not decide the group
- id: c
  en: The plant is a bryophyte because cones contain spores
- id: d
  en: The plant is an angiosperm because it has broad leaves
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.C9C183A2EF89
  when_answer_equals:
  - d
- id: MC.A.FAC507B314E3
  when_answer_equals:
  - c
- id: MC.A.3A8EB370CB22
  when_answer_equals:
  - a
solution_steps:
- en: Naked seeds in cones are the defining reproductive feature of gymnosperms, and leaf shape varies widely among gymnosperms.
- en: The reproductive structure is the more decisive evidence.
- en: The correct option is b.
tier: C
diagram_note: Show a cone with exposed seeds on its scales next to a flower with an ovary containing seeds. Label the cone scales, the exposed seeds, the ovary and the fruit wall.
