difficulty: 0.9
pool: practice
role: apply
stem:
  en: A plant's gametophyte has 12 chromosomes in each of its cells. How many chromosomes does its sporophyte have?
hints:
- level: 1
  en: The sporophyte forms when two haploid gametes fuse.
- level: 2
  en: Think about how fertilisation changes the chromosome number.
- level: 3
  en: Double the gametophyte count to get the sporophyte count.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: '6'
- id: b
  en: '24'
- id: c
  en: '36'
- id: d
  en: '12'
answer:
  sympy: b
  accept: []
