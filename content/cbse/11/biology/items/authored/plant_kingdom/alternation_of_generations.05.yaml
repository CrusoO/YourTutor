solution_steps:
- en: The sporophyte forms when two haploid gametes fuse, so its cells carry twice the gametophyte number, which is 24 chromosomes.
- en: The correct option is b.
tier: C
diagram_note: Draw a flow from a haploid gametophyte with its gametes, to a zygote, to a diploid sporophyte, labelling the chromosome counts at each stage.
