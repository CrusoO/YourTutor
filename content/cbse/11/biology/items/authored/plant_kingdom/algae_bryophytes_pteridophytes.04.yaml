stem:
  en: Which sequence correctly describes the alternation of generations in a fern?
hints:
- level: 1
  en: Start at the spore, which the mature fern plant produces.
- level: 2
  en: Find which stage makes gametes, since that is the haploid body.
- level: 3
  en: The fern plant you see is the diploid body that produces spores.
prediction_prompt:
