solution_steps:
- en: The fern sporophyte produces spores by meiosis, each spore grows into a haploid gametophyte, which makes gametes.
- en: Fertilisation forms a zygote that develops into the next sporophyte.
- en: The correct option is c.
tier: C
diagram_note: Draw a cycle with two labelled stages, a small haploid prothallus and the large diploid fern. Add arrows for spore production, gamete formation, fertilisation to a zygote, and growth of the new fern.
