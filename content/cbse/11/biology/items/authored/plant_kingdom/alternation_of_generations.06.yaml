id: A.11.biology.plant_kingdom.alternation_of_generations.06
skill_ids:
- SK.A.11.biology.alternation_of_generations
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which statement is accurate about the dominant generation in plant life cycles?
hints:
- level: 1
  en: Think about which generation is the long-lived plant body in mosses and in conifers.
- level: 2
  en: Compare the leafy green body of a moss with the tree form of a conifer.
- level: 3
  en: Consider the differences among the major plant groups rather than a single rule.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The dominant generation differs among plant groups, and it is the long-lived body that is more conspicuous
- id: b
  en: The gametophyte is always the larger generation in every plant
- id: c
  en: Dominance depends only on the number of cells in the plant
- id: d
  en: The sporophyte is always haploid in every group
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.2DF7675EF576
  when_answer_equals:
  - b
- id: MC.A.62E7B868774F
  when_answer_equals:
  - d
- id: MC.A.8097EFF0D92A
  when_answer_equals:
  - c
solution_steps:
- en: In mosses the gametophyte is the conspicuous leafy plant, while in conifers and flowering plants the sporophyte is dominant.
- en: The dominant generation therefore varies among groups.
- en: The correct option is a.
tier: C
diagram_note: Draw a moss with its small sporophyte stalk on the leafy gametophyte beside a pine tree with its large sporophyte, labelling the generation that is dominant in each.
