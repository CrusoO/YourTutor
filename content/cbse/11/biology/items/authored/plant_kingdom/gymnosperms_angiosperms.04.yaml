solution_steps:
- en: Pollen must reach the stigma before fertilisation can occur, and after fertilisation the ovule develops into a seed while the ovary matures into a fruit.
- en: The correct option is b.
tier: C
diagram_note: Draw a flower in section with the stigma, style and ovary labelled, then a simple arrow sequence showing pollen arriving, the pollen tube, the ovule becoming a seed, and the ovary becoming a fruit.
