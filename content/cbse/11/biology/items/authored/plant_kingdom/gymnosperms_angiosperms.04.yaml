difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which order of events leads to seed formation in an angiosperm?
hints:
- level: 1
  en: Start with the transfer of pollen to the stigma.
- level: 2
  en: Fertilisation must happen before the ovule becomes a seed.
- level: 3
  en: Consider which structure becomes the fruit.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Germination, pollination, fertilisation, dispersal
- id: b
  en: Pollination, fertilisation, ovule development into seed, ovary development into fruit
- id: c
  en: Seed formation, pollination, dispersal, fertilisation
- id: d
  en: Fertilisation, pollination, fruit formation, seed development
answer:
  sympy: b
  accept: []
