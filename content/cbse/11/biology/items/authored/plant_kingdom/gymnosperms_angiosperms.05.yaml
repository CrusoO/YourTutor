stem:
  en: A flower has 8 ovules in each of 3 carpels. If every ovule is fertilised and matures into a seed, how many seeds form?
hints:
- level: 1
  en: Count the ovules per carpel, then the number of carpels.
- level: 2
  en: Multiply the two counts together.
- level: 3
  en: Assume every ovule is fertilised and matures.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
