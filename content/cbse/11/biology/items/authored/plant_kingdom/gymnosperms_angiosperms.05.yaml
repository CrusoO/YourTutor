  original: true
  author: model-draft
type: numeric
answer:
  sympy: '24'
  accept: []
solution_steps:
- en: Each carpel holds 8 ovules, so 3 carpels hold 3 times 8, which is 24 ovules.
- en: If all of them mature into seeds, the flower produces 24 seeds.
- en: Answer = 24
