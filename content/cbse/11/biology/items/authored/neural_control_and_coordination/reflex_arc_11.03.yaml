id: A.11.biology.neural_control_and_coordination.reflex_arc_11.03
skill_ids:
- SK.A.11.biology.reflex_arc_11
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why is a reflex response faster than a voluntary action?
hints:
- level: 1
  en: Think about how far the signal must travel before a response occurs.
- level: 2
  en: Consider where the processing happens in a reflex.
- level: 3
  en: Count how many junctions the signal crosses in each pathway.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Voluntary actions travel through the heart
- id: b
  en: Reflexes use no neurons at all
- id: c
  en: Fewer synapses are involved, because the response is processed in the spinal cord rather than the brain
- id: d
  en: Reflex signals travel faster in the brain
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.457AD69A94E3
  when_answer_equals:
  - d
- id: MC.A.39A1406ABBAC
  when_answer_equals:
  - b
- id: MC.A.504CD4329DCB
  when_answer_equals:
  - a
solution_steps:
- en: A reflex is processed in the spinal cord, so the signal makes only a short trip and passes through fewer synapses.
- en: The voluntary pathway must reach the brain and return, which takes longer.
- en: The correct option is c.
tier: C
