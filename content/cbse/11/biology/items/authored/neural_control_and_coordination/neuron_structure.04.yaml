stem:
  en: Which structure insulates the axon in many neurons and allows the impulse to travel faster?
hints:
- level: 1
  en: Think about a fatty layer that wraps the axon in segments.
- level: 2
  en: The gaps in this layer are the nodes of Ranvier.
- level: 3
  en: The sheath is made by glial cells rather than by the neuron itself.
