solution_steps:
- en: Myelin is a fatty layer formed by glial cells that wraps the axon in segments.
- en: The gaps between segments, the nodes of Ranvier, are where the impulse is regenerated.
- en: The correct option is d.
tier: C
diagram_note: Draw a myelinated neuron with the cell body, dendrites, a myelinated axon, nodes of Ranvier and axon terminals, labelled in order.
