id: A.11.biology.neural_control_and_coordination.nerve_impulse.03
skill_ids:
- SK.A.11.biology.nerve_impulse
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does the action potential travel in only one direction along an axon?
hints:
- level: 1
  en: Think about what the membrane just behind the impulse is doing.
- level: 2
  en: Consider the state of the sodium channels in the membrane just behind the wave.
- level: 3
  en: Ask which region cannot be re-excited right after a spike.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Nerves are too short for backward flow to matter
- id: b
  en: Myelin alone blocks the backward signal
- id: c
  en: The membrane behind the wave is still inactivated after the spike and cannot be excited again yet
- id: d
  en: Action potentials travel equally well in both directions
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.D7D5B2B570F0
  when_answer_equals:
  - d
- id: MC.A.2255C0DBA84E
  when_answer_equals:
  - a
- id: MC.A.0C75AAF6F235
  when_answer_equals:
  - b
solution_steps:
- en: After a spike the sodium channels behind the wave are inactivated and the membrane is hyperpolarised, so that region cannot fire again immediately.
- en: The impulse therefore moves forward only.
- en: The correct option is c.
tier: C
