id: A.11.biology.neural_control_and_coordination.nerve_impulse.02
skill_ids:
- SK.A.11.biology.nerve_impulse
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which ion's rapid influx causes the rising phase of an action potential?
hints:
- level: 1
  en: The rising phase is driven by an ion that is much more concentrated outside the cell.
- level: 2
  en: Think about the channels that open first during depolarisation.
- level: 3
  en: The channels for this ion open rapidly and then inactivate.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Magnesium
- id: b
  en: Potassium
- id: c
  en: Chloride
- id: d
  en: Sodium
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.7E5DAF2AAFB5
  when_answer_equals:
  - b
- id: MC.A.C23661300160
  when_answer_equals:
  - c
- id: MC.A.5741B2FC4400
  when_answer_equals:
  - a
solution_steps:
- en: Voltage-gated sodium channels open at threshold and sodium rushes in down its gradient, producing the rising phase.
- en: Potassium efflux later causes repolarisation.
- en: The correct option is d.
tier: C
