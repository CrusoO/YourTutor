id: A.11.biology.neural_control_and_coordination.brain_and_spinal_cord.06
skill_ids:
- SK.A.11.biology.brain_and_spinal_cord
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A patient with cerebellar damage has trouble touching a finger to the nose. Which deficit best explains this?
hints:
- level: 1
  en: Think about what the cerebellum does during an ongoing movement.
- level: 2
  en: Consider what happens to a movement when its error correction is damaged.
- level: 3
  en: Ask whether the fingertip sensation or the strength of the arm is primarily affected.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Impaired coordination, with the movement overshooting or shaking near the target
- id: b
  en: Loss of memory for the movement
- id: c
  en: Loss of sensation in the fingertip
- id: d
  en: Paralysis of the arm from spinal cord damage
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.975CCF2DE799
  when_answer_equals:
  - c
- id: MC.A.AADA811A730E
  when_answer_equals:
  - d
- id: MC.A.2A624D31D278
  when_answer_equals:
  - b
solution_steps:
- en: The cerebellum compares intended and actual movement and corrects errors during the movement.
- en: Damage leads to dysmetria, in which the limb overshoots or trembles near the target.
- en: The correct option is a.
tier: C
diagram_note: Draw the cerebellum beneath the cerebrum with the arm's path to the nose shown as a movement that overshoots the target, labelling the error-correction loop.
