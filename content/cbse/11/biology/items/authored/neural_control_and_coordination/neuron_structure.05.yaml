difficulty: 0.9
pool: practice
role: apply
stem:
  en: A neuron has a resting potential of -70 mV and a firing threshold of -55 mV. By how many mV must the membrane depolarise to reach threshold?
hints:
- level: 1
  en: Subtract the resting value from the threshold value, keeping track of the signs.
- level: 2
  en: Think about the distance between the two values on the voltage scale.
- level: 3
  en: The answer is a positive change in voltage.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '15'
  accept: []
solution_steps:
- en: The change needed is the threshold minus the resting value, which is -55 minus (-70), giving 15 mV of depolarisation.
- en: The unit of the answer is mV.
- en: Answer = 15
tier: C
