id: A.11.biology.neural_control_and_coordination.reflex_arc_11.04
skill_ids:
- SK.A.11.biology.reflex_arc_11
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which order describes a withdrawal reflex after a painful stimulus to the foot?
hints:
- level: 1
  en: Start at the place where the stimulus is detected.
- level: 2
  en: The signal travels inward before it is processed.
- level: 3
  en: The last part of the arc is the muscle that moves the limb.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Sensory neuron, receptor, motor neuron, interneuron, muscle
- id: b
  en: Effector muscle, motor neuron, interneuron, sensory neuron, receptor
- id: c
  en: Receptor, sensory neuron, spinal interneuron, motor neuron, effector muscle
- id: d
  en: Receptor, motor neuron, interneuron, sensory neuron, muscle
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.E11760F21988
  when_answer_equals:
  - b
- id: MC.A.9BAC3DCA3318
  when_answer_equals:
  - d
- id: MC.A.B2CC73111D1B
  when_answer_equals:
  - a
solution_steps:
- en: The stimulus is detected by a receptor, the sensory neuron carries it to the cord, an interneuron integrates it, and a motor neuron signals the muscle to withdraw the foot.
- en: The correct option is c.
tier: C
diagram_note: Draw a reflex arc with a receptor in the foot, a sensory neuron to the spinal cord, an interneuron, a motor neuron to the leg muscle, and an arrow showing the withdrawal.
