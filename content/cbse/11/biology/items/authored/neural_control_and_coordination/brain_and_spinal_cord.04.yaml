stem:
  en: Which brain region contains the reflex centres for visual and auditory reflexes such as turning the head toward a sudden sound?
hints:
- level: 1
  en: The region lies between the forebrain and the hindbrain.
- level: 2
  en: Think about the upper brainstem region with visual and auditory reflex centres.
- level: 3
  en: It contains structures called colliculi.
