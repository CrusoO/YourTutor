id: A.11.biology.neural_control_and_coordination.reflex_arc_11.06
skill_ids:
- SK.A.11.biology.reflex_arc_11
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A person with a brain injury still shows a withdrawal reflex when a foot is pricked. Why does the reflex still occur?
hints:
- level: 1
  en: Think about where this reflex is processed.
- level: 2
  en: Consider whether the integrating centre is in the brain or the spinal cord.
- level: 3
  en: Ask which part of the nervous system is needed for a simple reflex.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The reflex arc is completed in the spinal cord, so it does not require the brain
- id: b
  en: The muscle contracts by itself without any nerves
- id: c
  en: The heart acts as the integration centre for the reflex
- id: d
  en: The brain is not needed for any nerve signals
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.A801D823FC83
  when_answer_equals:
  - d
- id: MC.A.B2DFF01AE83B
  when_answer_equals:
  - c
- id: MC.A.1E54BAC62611
  when_answer_equals:
  - b
solution_steps:
- en: A withdrawal reflex is integrated in the spinal cord, so the arc can run without signals from the brain.
- en: The brain may still be needed for conscious awareness of the stimulus and for voluntary control.
- en: The correct option is a.
tier: C
diagram_note: Draw a reflex arc with the spinal cord highlighted as the integration centre, and the brain shown above with a dashed line to indicate that it is not part of the arc.
