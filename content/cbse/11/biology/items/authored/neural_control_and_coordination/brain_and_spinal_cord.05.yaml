id: A.11.biology.neural_control_and_coordination.brain_and_spinal_cord.05
skill_ids:
- SK.A.11.biology.brain_and_spinal_cord
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A person has a spinal cord injury in the thoracic region. Which effect is most likely?
hints:
- level: 1
  en: Think about which signals travel through the spinal cord to and from the limbs.
- level: 2
  en: Consider the regions of the body below the level of the injury.
- level: 3
  en: The medulla sits above the level of the injury in the brainstem.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Loss of sensation and voluntary movement below the injury, while breathing controlled from the medulla continues
- id: b
  en: Loss of breathing immediately because the medulla is damaged
- id: c
  en: Complete loss of all reflexes everywhere in the body
- id: d
  en: Speech loss because the cerebrum is damaged
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.FD51A59E1482
  when_answer_equals:
  - b
- id: MC.A.C49794D043D2
  when_answer_equals:
  - c
- id: MC.A.634C6A3D0A19
  when_answer_equals:
  - d
solution_steps:
- en: The spinal cord carries sensory and motor pathways to and from the body below the level of injury.
- en: The medulla lies above the injury and continues to control the basic breathing rhythm.
- en: The correct option is a.
tier: C
