id: A.11.biology.structural_organisation_in_animals.animal_tissues_11.05
skill_ids:
- SK.A.11.biology.animal_tissues_11
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A tissue lines the trachea, is made of ciliated cells, and contains goblet cells that secrete mucus. Which tissue type is this?
hints:
- level: 1
  en: Check the shape of the cells in the lining and whether they have hair-like projections.
- level: 2
  en: Consider which epithelium type lines the airways.
- level: 3
  en: Think about the goblet cells that release mucus.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Squamous epithelium
- id: b
  en: Smooth muscle
- id: c
  en: Areolar connective tissue
- id: d
  en: Ciliated columnar epithelium
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.DCEC8F17C464
  when_answer_equals:
  - a
- id: MC.A.C31761AB922E
  when_answer_equals:
  - c
- id: MC.A.FB0B88739B28
  when_answer_equals:
  - b
solution_steps:
- en: The lining of the trachea is ciliated columnar epithelium, where cilia move mucus and the goblet cells supply it.
- en: Squamous and connective tissues do not match the description.
- en: The correct option is d.
tier: C
diagram_note: Draw a section of tracheal lining with ciliated columnar cells, goblet cells and the basement membrane, labelling each.
