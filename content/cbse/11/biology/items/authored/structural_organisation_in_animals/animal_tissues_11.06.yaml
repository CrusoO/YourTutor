difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which property connects skeletal muscle, cardiac muscle and smooth muscle as a group?
hints:
- level: 1
  en: Think about the proteins that generate the contraction in any muscle cell.
- level: 2
  en: Consider what all muscle types have in common rather than how they are controlled.
- level: 3
  en: Compare the internal filaments rather than the places where the muscles are found.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: All three are involuntary
- id: b
  en: All three have a matrix between cells
- id: c
  en: All three are made of nerve cells
- id: d
  en: All three types contract by actin and myosin interaction
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.67FB8F4D63FF
