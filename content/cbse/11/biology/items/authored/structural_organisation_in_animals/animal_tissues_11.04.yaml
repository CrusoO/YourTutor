stem:
  en: A student is sorting tissue slides and must first decide whether a slide shows a tissue that conducts electrical signals. Which tissue type should be checked?
hints:
- level: 1
  en: Look for the tissue made of cells that send long processes to carry messages.
- level: 2
  en: Think about the tissue that forms the brain and spinal cord.
- level: 3
  en: Consider which tissue is specialised for communication.
