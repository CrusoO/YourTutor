stem:
  en: Which organ system of a frog combines digestion and reproduction through a shared chamber at the end of the body?
hints:
- level: 1
  en: Look for a single chamber shared by more than one body system.
- level: 2
  en: Think about the end of the digestive tract, where it meets other openings.
- level: 3
  en: Consider which chamber takes in urine, gametes and faeces together.
