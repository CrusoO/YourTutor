id: A.11.biology.structural_organisation_in_animals.animal_tissues_11.03
skill_ids:
- SK.A.11.biology.animal_tissues_11
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why is cardiac muscle described as involuntary yet striated?
hints:
- level: 1
  en: Think about the banded appearance under the microscope.
- level: 2
  en: Consider whether the heart beats under conscious control.
- level: 3
  en: Compare cardiac muscle with the other two muscle types you know.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It is smooth and under conscious control
- id: b
  en: It has no striations and is controlled by the brain
- id: c
  en: It has striations like skeletal muscle but its contraction is not under conscious control
- id: d
  en: It is made of bone cells that contract
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.C8441DEB0D79
  when_answer_equals:
  - a
- id: MC.A.48F4B8FBBC2A
  when_answer_equals:
  - b
- id: MC.A.99B8FC7F8D21
  when_answer_equals:
  - d
solution_steps:
- en: Cardiac muscle has striations from its organised actin and myosin, like skeletal muscle, but it contracts without conscious control and is found in the heart walls.
- en: The correct option is c.
tier: C
diagram_note: Draw a few branched cardiac muscle cells joined end to end, showing cross-striations and the junctions between cells, labelling the striations, nucleus and junction.
