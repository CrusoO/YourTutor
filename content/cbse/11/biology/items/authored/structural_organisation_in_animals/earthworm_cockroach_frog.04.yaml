difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A student dissects a frog and must identify the organ that stores urine before it is released. Which organ is it?
hints:
- level: 1
  en: Think of the organ that holds the fluid before it is released.
- level: 2
  en: Consider which structures are tubes and which are reservoirs.
- level: 3
  en: The organ lies in the lower abdomen and is hollow.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Renal pelvis
- id: b
  en: Urinary bladder
- id: c
  en: Cloaca
- id: d
  en: Ureter
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.15022C9BDE80
  when_answer_equals:
  - c
- id: MC.A.6B5F5876477F
  when_answer_equals:
  - d
- id: MC.A.8CB5FA701E54
  when_answer_equals:
  - a
solution_steps:
- en: The urinary bladder stores urine temporarily before it passes into the cloaca and out.
- en: The ureters carry urine but do not store it.
- en: The correct option is b.
tier: C
diagram_note: Draw the urinary system of a frog showing the kidneys, ureters, urinary bladder and cloaca, labelling each part.
