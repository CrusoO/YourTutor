id: A.11.biology.excretory_products_and_elimination.urine_formation.06
skill_ids:
- SK.A.11.biology.urine_formation
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A drug blocks active sodium reabsorption in the proximal tubule. What is the most likely result?
hints:
- level: 1
  en: Think about what drives water to move back into the blood in this segment.
- level: 2
  en: Consider whether blocking the transporter changes filtration at the glomerulus.
- level: 3
  en: Ask what happens to the water that follows the sodium.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Urea is reabsorbed more strongly in response
- id: b
  en: Blood pressure falls because the kidney stops making urine
- id: c
  en: More sodium and water remain in the tubular fluid, so urine volume increases
- id: d
  en: Less sodium is filtered at the glomerulus
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.999561DA0887
  when_answer_equals:
  - d
- id: MC.A.74FFF41877AB
  when_answer_equals:
  - b
- id: MC.A.876DAAFE9BAF
  when_answer_equals:
  - a
solution_steps:
- en: Sodium drives water reabsorption in the proximal tubule.
- en: Blocking sodium transport leaves more water in the filtrate, which raises urine output.
- en: The correct option is c.
tier: C
diagram_note: Draw a proximal tubule cell with the sodium pump blocked by an X, and arrows showing sodium and water staying in the lumen.
