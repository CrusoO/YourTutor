id: A.11.biology.excretory_products_and_elimination.excretory_organs.05
skill_ids:
- SK.A.11.biology.excretory_organs
difficulty: 0.9
pool: practice
role: apply
stem:
  en: Several nephrons in a kidney are damaged, so the glomerular filtration rate falls. What is the most likely effect?
hints:
- level: 1
  en: Think about what the glomerulus removes from the blood.
- level: 2
  en: Consider whether wastes would leave the blood more slowly if filtration falls.
- level: 3
  en: Ask which substances the kidney normally clears from the blood.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Blood glucose falls sharply because filtration increases
- id: b
  en: Red blood cells are destroyed in large numbers
- id: c
  en: Waste products such as urea accumulate in the blood
- id: d
  en: The kidney produces more urine than before
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.5148385498D4
  when_answer_equals:
  - a
- id: MC.A.E9BD3658D441
  when_answer_equals:
  - b
- id: MC.A.6F5BFD99C5F7
  when_answer_equals:
  - d
solution_steps:
- en: The glomerulus removes waste from the blood.
- en: When the filtration rate falls, substances such as urea are cleared more slowly and build up in the blood.
- en: The correct option is c.
tier: C
