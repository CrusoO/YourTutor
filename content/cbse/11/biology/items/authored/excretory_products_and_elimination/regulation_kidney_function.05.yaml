id: A.11.biology.excretory_products_and_elimination.regulation_kidney_function.05
skill_ids:
- SK.A.11.biology.regulation_kidney_function
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A person drinks a large volume of water. What happens to ADH secretion and urine volume?
hints:
- level: 1
  en: Think about how water intake changes the concentration of the blood.
- level: 2
  en: Consider how the collecting duct responds when ADH is low.
- level: 3
  en: Ask what happens to the volume of dilute urine when water is in excess.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: ADH falls and urine volume falls too
- id: b
  en: ADH secretion falls and urine volume increases, because the collecting duct becomes less permeable to water
- id: c
  en: ADH rises and urine volume falls sharply
- id: d
  en: ADH rises and urine volume increases
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.C777C4C3B732
  when_answer_equals:
  - c
- id: MC.A.5BF63937F7E0
  when_answer_equals:
  - d
- id: MC.A.334A2D13A8E4
  when_answer_equals:
  - a
solution_steps:
- en: Drinking water dilutes the blood, which lowers ADH secretion.
- en: The collecting duct becomes less permeable, so more dilute urine is produced and the water load is removed.
- en: The correct option is b.
tier: C
