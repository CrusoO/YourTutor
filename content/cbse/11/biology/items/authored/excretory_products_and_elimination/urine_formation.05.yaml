stem:
  en: A person filters 180 L of fluid per day through the glomeruli, and 99 percent of the filtrate is reabsorbed. How many litres of urine are produced per day?
hints:
- level: 1
  en: Calculate the fraction that is not reabsorbed.
- level: 2
  en: Multiply the filtrate volume by the fraction that is left after reabsorption.
- level: 3
  en: Convert the percentage to a decimal first.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.8'
  accept: []
solution_steps:
- en: The unreabsorbed fraction is 1 percent of 180 litres, which is 1.8 litres of urine per day.
- en: The unit of the answer is L.
- en: Answer = 1.8
tier: C
