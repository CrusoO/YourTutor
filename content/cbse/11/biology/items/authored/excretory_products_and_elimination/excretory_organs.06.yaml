id: A.11.biology.excretory_products_and_elimination.excretory_organs.06
skill_ids:
- SK.A.11.biology.excretory_organs
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A surgeon removes one kidney from a healthy adult. What is the most likely outcome?
hints:
- level: 1
  en: Consider whether one kidney can take on more of the workload.
- level: 2
  en: Think about how much reserve a healthy kidney has.
- level: 3
  en: Ask which organ normally does the filtering, and whether it can be done by another.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The person cannot produce any urine at all
- id: b
  en: The blood becomes highly acidic within minutes
- id: c
  en: The bladder begins to filter blood
- id: d
  en: The remaining kidney enlarges its workload, and the person usually keeps normal filtration
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.147B6DA324D0
  when_answer_equals:
  - a
- id: MC.A.9DDC26D9590F
  when_answer_equals:
  - b
- id: MC.A.2531C623D1EB
  when_answer_equals:
  - c
solution_steps:
- en: A healthy person can live with one kidney.
- en: The remaining kidney increases its filtration and tubular work, so overall function is usually maintained.
- en: The correct option is d.
tier: C
diagram_note: Draw a body outline with one kidney removed and the remaining kidney enlarged in proportion, labelling the ureter, bladder and remaining nephrons.
