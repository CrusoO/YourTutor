difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does a fall in blood volume increase renin secretion from the kidney?
hints:
- level: 1
  en: Think about the cells near the glomerulus that sense pressure.
- level: 2
  en: Consider the effect of low blood pressure on the kidney's blood supply.
- level: 3
  en: The cascade ends with a hormone that narrows blood vessels.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Renin directly stops water reabsorption in the collecting duct
- id: b
  en: The liver releases renin in response to high sodium
- id: c
  en: Increased blood volume triggers renin release
- id: d
  en: Reduced perfusion of the kidney triggers juxtaglomerular cells to release renin, which starts the angiotensin pathway
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.F703DBA4AE15
  when_answer_equals:
  - c
- id: MC.A.72F3D72B610B
  when_answer_equals:
