- id: MC.A.DF89C8E0638D
  when_answer_equals:
  - a
solution_steps:
- en: Low renal perfusion stimulates juxtaglomerular cells to secrete renin.
- en: Renin converts angiotensinogen into angiotensin I, which is converted to angiotensin II, a vasoconstrictor that also stimulates aldosterone.
- en: The correct option is d.
tier: C
