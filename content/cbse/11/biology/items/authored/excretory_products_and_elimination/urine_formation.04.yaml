difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which process moves a substance from the blood into the tubular fluid, in addition to filtration?
hints:
- level: 1
  en: Think about the direction of movement, from the blood into the tubule.
- level: 2
  en: The process moves material into the tubular lumen.
- level: 3
  en: The process is active for some ions and for certain drugs.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Reabsorption
- id: b
  en: Osmosis across the capsule
- id: c
  en: Ultrafiltration
- id: d
  en: Tubular secretion
answer:
  sympy: d
  accept: []
