solution_steps:
- en: Tubular secretion actively moves substances such as hydrogen ions, potassium and some drugs from the peritubular blood into the tubular fluid, removing them from the body.
- en: The correct option is d.
tier: C
diagram_note: Draw a nephron tubule beside a peritubular capillary, with arrows showing filtration into the capsule, reabsorption back into the blood, and secretion from the blood into the tubule.
