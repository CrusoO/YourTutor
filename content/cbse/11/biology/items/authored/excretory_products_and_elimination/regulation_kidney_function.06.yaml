stem:
  en: A patient has a tumour that secretes excess ADH. Which clinical picture is most likely?
hints:
- level: 1
  en: Think about what ADH does to water reabsorption in the collecting duct.
- level: 2
  en: Consider how retained water affects the sodium concentration in the blood.
- level: 3
  en: The urine is smaller in volume but more concentrated.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Water retention with low blood sodium, and small volumes of concentrated urine
- id: b
  en: Excessive dilute urine with concentrated blood
- id: c
  en: Raised blood sodium with large volumes of dilute urine
- id: d
  en: Normal water balance with high blood glucose
answer:
  sympy: a
  accept: []
