stem:
  en: What is the effect of atrial natriuretic peptide on the kidney?
hints:
- level: 1
  en: Think about the hormone released by the heart when the atria are stretched.
- level: 2
  en: Consider whether the hormone promotes retention or loss of salt.
- level: 3
  en: The hormone opposes the effect of aldosterone.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
