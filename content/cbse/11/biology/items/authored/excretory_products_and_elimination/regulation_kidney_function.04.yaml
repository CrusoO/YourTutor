options:
- id: a
  en: It stops all urine formation
- id: b
  en: It promotes sodium and water excretion, which lowers blood volume
- id: c
  en: It increases sodium reabsorption and raises blood volume
- id: d
  en: It raises the rate of glucose absorption in the tubules
