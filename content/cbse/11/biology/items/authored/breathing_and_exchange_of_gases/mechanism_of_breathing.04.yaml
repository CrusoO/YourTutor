id: A.11.biology.breathing_and_exchange_of_gases.mechanism_of_breathing.04
skill_ids:
- SK.A.11.biology.mechanism_of_breathing
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which order of events occurs in a normal inspiration?
hints:
- level: 1
  en: Start with the muscle action that begins the breath.
- level: 2
  en: Ask which change causes the pressure inside the lungs to fall.
- level: 3
  en: The airflow is the last event in the sequence.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The diaphragm contracts, thoracic volume increases, pressure falls, and air flows in
- id: b
  en: Air flows in, volume increases, the diaphragm contracts, and pressure falls
- id: c
  en: The diaphragm relaxes, volume increases, pressure rises, and air flows out
- id: d
  en: Pressure falls, the diaphragm contracts, air flows in, and volume increases
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.2DE89A505A75
  when_answer_equals:
  - d
- id: MC.A.03146090017E
  when_answer_equals:
  - b
- id: MC.A.3502C3718D82
  when_answer_equals:
  - c
solution_steps:
- en: Muscle contraction starts the breath, which increases the thoracic volume.
- en: The resulting fall in pressure draws air into the lungs.
- en: The correct option is a.
tier: C
diagram_note: 'Draw a flow chart for inspiration with four boxes in order: diaphragm contracts, thoracic volume increases, intrapulmonary pressure falls, air flows in, with arrows between them.'
