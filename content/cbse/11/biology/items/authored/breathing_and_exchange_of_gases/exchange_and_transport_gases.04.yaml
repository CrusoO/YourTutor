id: A.11.biology.breathing_and_exchange_of_gases.exchange_and_transport_gases.04
skill_ids:
- SK.A.11.biology.exchange_and_transport_gases
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which tissue conditions promote the release of oxygen from haemoglobin during exercise?
hints:
- level: 1
  en: Think about the conditions in active tissues that produce carbon dioxide.
- level: 2
  en: Consider how acid affects the affinity of haemoglobin for oxygen.
- level: 3
  en: The effect is named after the scientist who first described it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Higher oxygen pressure and lower temperature
- id: b
  en: Lower carbon dioxide and higher pH
- id: c
  en: Higher pH and lower temperature together
- id: d
  en: Lower oxygen pressure, higher carbon dioxide and more acidity, which shift the curve to the right
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.A53C4DE2029A
  when_answer_equals:
  - a
- id: MC.A.BDC13B52B971
  when_answer_equals:
  - b
- id: MC.A.24837FB8C801
  when_answer_equals:
  - c
solution_steps:
- en: Active tissues produce carbon dioxide, acid and heat, which reduce the affinity of haemoglobin for oxygen and release more oxygen to the muscle.
- en: This is the Bohr effect.
- en: The correct option is d.
tier: C
diagram_note: Draw the oxygen dissociation curve with two curves, one for normal conditions and one shifted to the right for active tissue, labelling the shift and the conditions that cause it.
