id: A.11.biology.breathing_and_exchange_of_gases.mechanism_of_breathing.02
skill_ids:
- SK.A.11.biology.mechanism_of_breathing
difficulty: 0.2
pool: practice
role: recall
stem:
  en: During normal expiration at rest, what happens to the volume of the thoracic cavity?
hints:
- level: 1
  en: Think about the chest getting smaller during a normal breath out.
- level: 2
  en: Consider what happens to the diaphragm when it relaxes.
- level: 3
  en: The chest returns to a smaller size by a passive recoil.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It increases because the diaphragm contracts
- id: b
  en: It decreases as the muscles relax and the chest recoils
- id: c
  en: It stays constant while the lungs fill
- id: d
  en: It increases as the external intercostal muscles contract
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.9D2C04F05AB3
  when_answer_equals:
  - a
- id: MC.A.9E733CC50D7D
  when_answer_equals:
  - c
- id: MC.A.2AEC33509825
  when_answer_equals:
  - d
solution_steps:
- en: At rest, expiration is passive.
- en: The inspiratory muscles relax, the elastic lung and chest recoil, and the thoracic volume shrinks.
- en: The correct option is b.
tier: C
