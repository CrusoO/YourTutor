difficulty: 0.9
pool: practice
role: apply
stem:
  en: A person breathes very rapidly for several minutes and their blood carbon dioxide falls. What is the most likely consequence?
hints:
- level: 1
  en: Think about what happens to acidity when carbon dioxide is removed from the blood.
- level: 2
  en: Consider how the brain responds to the drop in carbon dioxide.
- level: 3
  en: The change in pH is the key to the symptoms.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Blood pH falls, causing a stronger breathing drive
- id: b
  en: Breathing slows to a very low rate
- id: c
  en: Blood pH rises, and the person may feel dizzy or faint
- id: d
  en: Oxygen delivery increases dramatically
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.40BD3EF0525C
  when_answer_equals:
  - a
- id: MC.A.701B668BAAC1
  when_answer_equals:
  - b
- id: MC.A.54FFA064F98A
  when_answer_equals:
  - d
solution_steps:
- en: Overbreathing removes carbon dioxide faster than it is made, which makes the blood more alkaline.
- en: This can cause dizziness, tingling and fainting.
- en: The correct option is c.
tier: C
