  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: Each breath moves 500 mL, and 12 breaths give 6000 mL per minute, which equals 6 litres.
- en: The unit of the answer is L.
- en: Answer = 6
