stem:
  en: A person has a tidal volume of 500 mL and a breathing rate of 12 breaths per minute. How many litres of air are moved per minute?
hints:
- level: 1
  en: Multiply the volume per breath by the number of breaths in a minute.
- level: 2
  en: Convert the total from millilitres to litres at the end.
- level: 3
  en: Divide the millilitre total by one thousand to get litres.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
