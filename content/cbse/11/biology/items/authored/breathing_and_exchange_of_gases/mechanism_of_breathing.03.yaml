difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does air flow into the lungs during inspiration?
hints:
- level: 1
  en: Think about the pressure difference between the lungs and the outside air.
- level: 2
  en: Consider what a volume increase does to the pressure of the gas inside.
- level: 3
  en: Air moves from a region of higher pressure to one of lower pressure.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The thoracic volume increases, which lowers intrapulmonary pressure below atmospheric pressure
- id: b
  en: The heart pumps air into the lungs
- id: c
  en: The lungs actively pull air in by suction
- id: d
  en: The alveoli produce air as they expand
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.8205B7321ED2
  when_answer_equals:
  - c
- id: MC.A.AAA51A3775A0
  when_answer_equals:
