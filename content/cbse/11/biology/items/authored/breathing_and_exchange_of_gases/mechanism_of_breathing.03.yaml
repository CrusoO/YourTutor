- id: MC.A.538DB10A9B64
  when_answer_equals:
  - b
solution_steps:
- en: Expanding the chest enlarges the lungs and lowers the pressure inside them.
- en: Air then moves from the higher atmospheric pressure into the lungs until the pressures equalise.
- en: The correct option is a.
tier: C
