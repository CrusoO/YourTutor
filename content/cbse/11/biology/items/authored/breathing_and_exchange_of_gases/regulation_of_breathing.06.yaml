stem:
  en: A patient with severe uncontrolled diabetes breathes deeply and rapidly. Why does this occur?
hints:
- level: 1
  en: Think about acids that accumulate in the blood in this condition.
- level: 2
  en: Consider how the body compensates for an acid load by changing carbon dioxide levels.
- level: 3
  en: Ask what the breathing change does to the blood pH.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The lungs are damaged and need faster airflow
- id: b
  en: Acid build-up in the blood stimulates the respiratory centre to increase ventilation and remove CO2
- id: c
  en: The brain needs much more oxygen for its metabolism
- id: d
  en: Insulin stimulates the diaphragm directly
answer:
  sympy: b
  accept: []
