solution_steps:
- en: Ketoacids accumulate in uncontrolled diabetes and lower the blood pH.
- en: The respiratory centre responds by increasing ventilation, which blows off carbon dioxide and partly compensates for the acid load.
- en: The correct option is b.
tier: C
