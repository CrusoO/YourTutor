- id: MC.A.544E79720242
  when_answer_equals:
  - b
solution_steps:
- en: Exercising muscles produce more carbon dioxide, which raises the chemical drive to breathe.
- en: Movement and temperature changes also contribute, but CO2 and pH are the main signals.
- en: The correct option is c.
tier: C
