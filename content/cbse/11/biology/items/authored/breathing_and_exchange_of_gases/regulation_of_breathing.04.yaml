difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A person starts running and their breathing rate rises. Which factor is the main cause of this change?
hints:
- level: 1
  en: Think about what increases the demand for oxygen during activity.
- level: 2
  en: Consider the activity that makes muscles produce more carbon dioxide.
- level: 3
  en: The activity raises the metabolic rate of the body.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Reduced physical activity
- id: b
  en: A warm bath lowering the body temperature
- id: c
  en: Increased carbon dioxide production by exercising muscles, which raises the stimulus to breathe
- id: d
  en: Sleep reducing the body's oxygen demand
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.A7BD21BFC35A
  when_answer_equals:
  - d
- id: MC.A.1C88F522565B
  when_answer_equals:
