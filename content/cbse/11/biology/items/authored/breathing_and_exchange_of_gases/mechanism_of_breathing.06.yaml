id: A.11.biology.breathing_and_exchange_of_gases.mechanism_of_breathing.06
skill_ids:
- SK.A.11.biology.mechanism_of_breathing
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A patient has a weakened diaphragm. Which compensatory change is most likely during quiet breathing?
hints:
- level: 1
  en: Think about which other muscles can enlarge the chest.
- level: 2
  en: Consider which muscles are normally used only during harder breathing.
- level: 3
  en: Ask what happens to the chest when those muscles contract.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Greater use of the external intercostal and accessory muscles to expand the chest
- id: b
  en: No change, because the diaphragm alone drives all breathing
- id: c
  en: The lungs begin to contract on their own to draw in air
- id: d
  en: Expiration becomes active, with the abdomen pulling air in
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.0A4A1EB13BEE
  when_answer_equals:
  - d
- id: MC.A.53197E897994
  when_answer_equals:
  - b
- id: MC.A.4E3A9D9DBAB5
  when_answer_equals:
  - c
solution_steps:
- en: When the diaphragm is weak, other muscles such as the external intercostals and accessory muscles of the neck and chest take on more of the work of enlarging the thoracic cavity.
- en: The correct option is a.
tier: C
diagram_note: Draw a chest wall with the diaphragm, external intercostals and accessory neck muscles labelled, with arrows showing the chest expansion in each case.
