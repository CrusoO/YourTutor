id: A.11.biology.breathing_and_exchange_of_gases.mechanism_of_breathing.05
skill_ids:
- SK.A.11.biology.mechanism_of_breathing
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A person's pleural space is opened to the air, so air enters between the two pleural layers. What is the most likely result for that lung?
hints:
- level: 1
  en: Think about the pressure difference that holds the lung open.
- level: 2
  en: Consider what happens to the lung when the space around it fills with air.
- level: 3
  en: Ask whether the lung can stay open when the pressure outside it equals the pressure inside the space.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The lung collapses because the pressure in the pleural space now equals atmospheric pressure
- id: b
  en: Breathing becomes faster but the lung stays inflated
- id: c
  en: Gas exchange improves because more air is available
- id: d
  en: The lung expands more than usual because pressure rises
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.CEEBE1568BF7
  when_answer_equals:
  - d
- id: MC.A.2EAAF5AE1FB8
  when_answer_equals:
  - b
- id: MC.A.36FA993C5E4C
  when_answer_equals:
  - c
solution_steps:
- en: The lung stays open because the pleural pressure is lower than the pressure inside it.
- en: Air in the pleural space removes this difference, and the elastic lung recoils and collapses.
- en: The correct option is a.
tier: C
