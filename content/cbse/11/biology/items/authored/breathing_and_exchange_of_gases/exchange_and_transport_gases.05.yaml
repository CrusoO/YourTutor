difficulty: 0.9
pool: practice
role: apply
stem:
  en: Arterial blood carries 20 mL of O2 per 100 mL of blood, and venous blood carries 15 mL of O2 per 100 mL. How many mL of O2 are delivered to the tissues per 100 mL of blood?
hints:
- level: 1
  en: Subtract the venous content from the arterial content.
- level: 2
  en: Compare the two values per 100 mL of blood.
- level: 3
  en: The difference is what the tissues take up.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: The tissues take up the difference between arterial and venous oxygen content, which is 20 minus 15, giving 5 mL per 100 mL.
- en: The unit of the answer is mL.
- en: Answer = 5
tier: C
