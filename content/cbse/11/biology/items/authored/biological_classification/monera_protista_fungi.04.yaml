id: A.11.biology.biological_classification.monera_protista_fungi.04
skill_ids:
- SK.A.11.biology.monera_protista_fungi
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: A student needs to decide whether a unicellular organism is a protist or a bacterium. Which feature should the student check first?
hints:
- level: 1
  en: Think about the basic difference between prokaryotic and eukaryotic cells.
- level: 2
  en: Consider which structure is visible under a good microscope and separates the two.
- level: 3
  en: The test focuses on the internal organisation of the cell.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Whether the organism moves in water
- id: b
  en: Whether the organism is coloured
- id: c
  en: Whether the cell has a membrane-bound nucleus
- id: d
  en: Whether the organism lives in soil
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.FCED5FBFFEAC
  when_answer_equals:
  - b
- id: MC.A.9276496EEC0A
  when_answer_equals:
  - a
- id: MC.A.D683CD28925C
  when_answer_equals:
