- id: MC.A.29AB22FB6638
  when_answer_equals:
  - a
solution_steps:
- en: The five-kingdom system uses cell organisation, not size, as a primary criterion.
- en: Bacteria are prokaryotes and fall in Monera.
- en: The correct option is d.
tier: C
