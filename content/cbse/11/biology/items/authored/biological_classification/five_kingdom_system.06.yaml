id: A.11.biology.biological_classification.five_kingdom_system.06
skill_ids:
- SK.A.11.biology.five_kingdom_system
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A student places a bacterium in the protist kingdom because it is microscopic. What is the main error in this reasoning?
hints:
- level: 1
  en: Ask which cell feature is most basic for separating prokaryotes from eukaryotes.
- level: 2
  en: Think about what kind of nucleus the bacterium has.
- level: 3
  en: Check whether the student used the criterion that matters for the kingdom.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Bacteria have chitin walls so they belong in Fungi
- id: b
  en: Bacteria are multicellular so they belong in Plantae
- id: c
  en: Protista includes every microscopic organism
- id: d
  en: Size is not the criterion, and bacteria lack a membrane-bound nucleus so they belong in Monera
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.F62B57825C77
  when_answer_equals:
  - c
- id: MC.A.8E0D296CD264
  when_answer_equals:
