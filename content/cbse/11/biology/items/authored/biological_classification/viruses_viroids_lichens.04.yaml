difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which step correctly describes how a bacteriophage multiplies inside its host?
hints:
- level: 1
  en: Start with how the virus first meets its host.
- level: 2
  en: Think about who makes the proteins during replication.
- level: 3
  en: Consider whether the virus uses its own machinery or the host's to copy itself.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: It attaches to a bacterial cell, injects its genome, and uses the host machinery to make new viruses
- id: b
  en: It fuses with the host nucleus and becomes a plasmid
- id: c
  en: It divides by binary fission inside a bacterium
- id: d
  en: It builds its own ribosomes and grows like a bacterium
answer:
  sympy: a
  accept: []
misconception_rules:
