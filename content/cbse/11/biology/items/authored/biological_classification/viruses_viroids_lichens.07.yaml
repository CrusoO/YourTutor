  en: A colony of bacteria that always lives inside animals
- id: b
  en: A single plant species adapted to dry bark
- id: c
  en: A type of moss that produces spores on its surface
- id: d
  en: A mutualistic partnership of a fungus and an alga or cyanobacterium
