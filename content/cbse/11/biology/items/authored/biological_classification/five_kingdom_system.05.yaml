stem:
  en: A specimen is unicellular, has a nucleus, makes food by photosynthesis, and has a cellulose wall. Which kingdom fits best?
hints:
- level: 1
  en: Note that the specimen is a single cell with a nucleus, so it is not prokaryotic.
- level: 2
  en: Multicellular plants are excluded because this specimen is unicellular.
- level: 3
  en: Look for the kingdom that collects single-celled eukaryotes that are neither fungi, plants nor animals.
