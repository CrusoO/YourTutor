id: A.11.biology.photosynthesis_in_higher_plants.calvin_cycle.06
skill_ids:
- SK.A.11.biology.calvin_cycle
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Why does oxygenation by RuBisCO become more significant in hot, dry leaves that keep their stomata partly closed?
hints:
- level: 1
  en: Think about how partly closed stomata change the internal gas mix.
- level: 2
  en: Consider which gas RuBisCO prefers when the level of the other one is high.
- level: 3
  en: Ask how heat affects the affinity of the enzyme for each gas.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: RuBisCO becomes more selective for CO2 at high temperature
- id: b
  en: Water loss increases the photosynthesis rate directly
- id: c
  en: Closed stomata lower internal CO2 and raise internal O2, which favours the oxygenase reaction
- id: d
  en: Open stomata raise internal O2 and lower oxygenation
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.B4EA0D380BAD
  when_answer_equals:
  - d
- id: MC.A.73340381C99A
  when_answer_equals:
  - a
- id: MC.A.571A98671594
  when_answer_equals:
  - b
solution_steps:
- en: Stomatal closure to save water reduces CO2 entry and allows O2 from photosynthesis to build up inside the leaf.
- en: High temperature also lowers the CO2 affinity of RuBisCO, so oxygenation rises.
- en: The correct option is c.
tier: C
diagram_note: Draw a leaf cross section with a partly closed stoma, arrows showing reduced CO2 entry and built-up O2 inside, and a RuBisCO label at the chloroplast.
