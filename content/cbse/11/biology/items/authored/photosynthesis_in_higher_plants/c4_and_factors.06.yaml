id: A.11.biology.photosynthesis_in_higher_plants.c4_and_factors.06
skill_ids:
- SK.A.11.biology.c4_and_factors
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A C4 plant and a C3 plant grow side by side in hot, dry conditions. Which outcome is most likely?
hints:
- level: 1
  en: Think about which pathway avoids oxygenation under heat.
- level: 2
  en: Consider which plant wastes less water per unit of carbon fixed.
- level: 3
  en: Compare the two pathways under stress rather than at mild conditions.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: The C4 plant stops photosynthesis at high temperature while C3 continues
- id: b
  en: The C3 plant outperforms the C4 plant at high temperature
- id: c
  en: The C4 plant shows higher water-use efficiency and a higher photosynthesis rate
- id: d
  en: Both plants have identical rates regardless of conditions
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.BF2E8770AEA5
  when_answer_equals:
  - b
- id: MC.A.2BB5E87E6EF9
  when_answer_equals:
  - d
- id: MC.A.9F35E3C39685
  when_answer_equals:
  - a
solution_steps:
- en: C4 plants keep CO2 high near RuBisCO and lose less water per unit of carbon fixed, so they usually do better than C3 plants in hot, dry conditions.
- en: The correct option is c.
tier: C
diagram_note: Draw a bar chart with two groups, C3 and C4, showing photosynthesis rate and water-use efficiency at high temperature, with C4 bars taller in both.
