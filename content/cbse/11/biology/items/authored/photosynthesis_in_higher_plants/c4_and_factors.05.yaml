stem:
  en: A leaf has a photosynthetic rate of 2 units. The rate doubles when CO2 is raised, then doubles again when light is doubled. What is the final rate in units?
hints:
- level: 1
  en: Apply each doubling in order, starting from the original rate.
- level: 2
  en: Count how many doublings take place in total.
- level: 3
  en: Multiply the starting value by two for each change.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
