stem:
  en: The Calvin cycle fixes 3 CO2 molecules to make one G3P molecule. Using the usual cost of 3 ATP and 2 NADPH per CO2 fixed, how many ATP plus NADPH molecules in total are needed for one G3P?
hints:
- level: 1
  en: Count how many CO2 molecules are fixed per G3P produced.
- level: 2
  en: Each fixed CO2 consumes three ATP and two NADPH.
- level: 3
  en: Multiply the per-CO2 cost by the CO2 count, then add the two totals.
