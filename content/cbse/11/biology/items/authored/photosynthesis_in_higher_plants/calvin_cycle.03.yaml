id: A.11.biology.photosynthesis_in_higher_plants.calvin_cycle.03
skill_ids:
- SK.A.11.biology.calvin_cycle
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why is the Calvin cycle described as a cyclic pathway?
hints:
- level: 1
  en: Think about whether the starting molecule comes back at the end of a turn.
- level: 2
  en: Consider which molecule is regenerated to start the next turn.
- level: 3
  en: Ask why the cycle would stop if the acceptor were not made again.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Glucose is recycled to form water each turn
- id: b
  en: Oxygen is released and reabsorbed each turn
- id: c
  en: Carbon dioxide circulates back to the air during each turn
- id: d
  en: Ribulose bisphosphate is regenerated at the end of each turn so that the cycle can continue
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.33E56E8633F5
  when_answer_equals:
  - c
- id: MC.A.09CA36DAB9C3
  when_answer_equals:
  - b
- id: MC.A.C44B964793CB
  when_answer_equals:
  - a
solution_steps:
- en: Most of the triose phosphate is used to regenerate ribulose bisphosphate, so the starting acceptor returns and the cycle repeats.
- en: Only a fraction leaves as net product.
- en: The correct option is d.
tier: C
