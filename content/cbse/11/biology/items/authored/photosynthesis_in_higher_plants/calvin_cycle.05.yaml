id: A.11.biology.photosynthesis_in_higher_plants.calvin_cycle.05
skill_ids:
- SK.A.11.biology.calvin_cycle
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A plant grown in hot, dry conditions has high oxygen and low CO2 inside its leaves. RuBisCO then acts as an oxygenase. Which process is this linked to?
hints:
- level: 1
  en: Think about a process that releases carbon dioxide in light and consumes energy.
- level: 2
  en: Consider what RuBisCO does when oxygen is the substrate instead of carbon dioxide.
- level: 3
  en: The process involves chloroplasts, peroxisomes and mitochondria together.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Fermentation in the thylakoid
- id: b
  en: Photorespiration, which wastes fixed carbon and energy
- id: c
  en: Nitrogen fixation in root nodules
- id: d
  en: Glycolysis in the stroma
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.910D6B61E235
  when_answer_equals:
  - d
- id: MC.A.41DD6C3BE630
  when_answer_equals:
  - a
- id: MC.A.4AB0F698A89C
  when_answer_equals:
  - c
solution_steps:
- en: When RuBisCO adds oxygen instead of CO2, phosphoglycolate is made and recycled through photorespiration, which releases CO2 and consumes ATP without making sugar.
- en: The correct option is b.
tier: C
diagram_note: Draw a chloroplast, a peroxisome and a mitochondrion linked by arrows showing phosphoglycolate leaving the chloroplast and CO2 being released in the pathway.
