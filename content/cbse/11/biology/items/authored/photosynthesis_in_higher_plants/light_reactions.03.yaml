stem:
  en: Why is ATP synthesis in the light reactions called photophosphorylation?
hints:
- level: 1
  en: Think about what is added to ADP to form ATP.
- level: 2
  en: The process uses energy captured from light.
- level: 3
  en: Consider the gradient of protons across the thylakoid membrane.
