type: mcq
options:
- id: a
  en: Photosynthesis releases phosphate into water
- id: b
  en: Light phosphorylates glucose directly into a sugar phosphate
- id: c
  en: Light converts ATP back into ADP permanently
- id: d
  en: Light energy drives the addition of a phosphate to ADP using a proton gradient across the thylakoid membrane
