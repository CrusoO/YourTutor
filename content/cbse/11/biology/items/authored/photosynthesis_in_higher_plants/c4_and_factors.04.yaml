id: A.11.biology.photosynthesis_in_higher_plants.c4_and_factors.04
skill_ids:
- SK.A.11.biology.c4_and_factors
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which factor is most likely to limit photosynthesis at very low light intensity?
hints:
- level: 1
  en: Ask which input drives the light-dependent reactions.
- level: 2
  en: Think about the limiting factor when energy input is scarce.
- level: 3
  en: Consider which factor is the bottleneck at low energy input.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Light intensity itself, since the light reactions cannot proceed without enough photons
- id: b
  en: Temperature above the optimum
- id: c
  en: Carbon dioxide concentration only
- id: d
  en: Oxygen concentration in the air
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.0CC678C60610
  when_answer_equals:
  - c
- id: MC.A.C3AA04623EE2
  when_answer_equals:
  - b
- id: MC.A.05B4E756FE8D
  when_answer_equals:
  - d
solution_steps:
- en: When light is scarce, the light-dependent reactions cannot supply enough ATP and NADPH, so light intensity is the bottleneck.
- en: Adding CO2 does not raise the rate much in this range.
- en: The correct option is a.
tier: C
diagram_note: Draw a graph of photosynthesis rate against light intensity, with a steep initial rise that flattens at high light, and mark the light-limited region at low intensity.
