difficulty: 0.2
pool: practice
role: recall
stem:
  en: How do peptide hormones usually act on their target cells?
hints:
- level: 1
  en: The receptor is on the outside of the target cell.
- level: 2
  en: Think about messengers such as cyclic AMP that spread the signal inside.
- level: 3
  en: The hormone does not need to enter the cell to act.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They are converted into steroids inside the target cell
- id: b
  en: They cross the membrane and bind nuclear receptors directly
- id: c
  en: They bind surface receptors and trigger a second messenger cascade inside the cell
- id: d
  en: They act only on blood vessels
answer:
  sympy: c
  accept: []
misconception_rules:
