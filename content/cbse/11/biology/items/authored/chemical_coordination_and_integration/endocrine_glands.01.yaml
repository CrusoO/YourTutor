stem:
  en: One small gland at the base of the brain directs the activity of many other hormone-producing glands. Which gland is it?
hints:
- level: 1
  en: It sits at the base of the brain, below the hypothalamus.
- level: 2
  en: The hypothalamus controls this gland through its own hormones.
- level: 3
  en: It secretes several tropic hormones that act on other glands.
