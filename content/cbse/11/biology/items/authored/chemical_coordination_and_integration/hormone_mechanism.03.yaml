id: A.11.biology.chemical_coordination_and_integration.hormone_mechanism.03
skill_ids:
- SK.A.11.biology.hormone_mechanism
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why do steroid hormones usually take longer to act than peptide hormones?
hints:
- level: 1
  en: Think about what the steroid changes inside the target cell.
- level: 2
  en: Consider the steps needed before a new protein is ready.
- level: 3
  en: Compare the speed of a surface signal with a change in gene expression.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: They have no receptors in the target cell
- id: b
  en: They are slower to be secreted from glands
- id: c
  en: They are destroyed immediately in the blood
- id: d
  en: They must alter gene expression and make new proteins, which takes more time
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.7B32278AB505
  when_answer_equals:
  - b
- id: MC.A.556BB3EBA9C9
  when_answer_equals:
  - a
- id: MC.A.642ED70645AB
  when_answer_equals:
  - c
solution_steps:
- en: Steroid hormones act on gene transcription, so the target cell must make new messenger RNA and then new proteins before the effect appears.
- en: Surface signalling by peptides can act within seconds.
- en: The correct option is d.
tier: C
