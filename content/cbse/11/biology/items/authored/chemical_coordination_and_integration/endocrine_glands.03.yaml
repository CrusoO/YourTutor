difficulty: 0.6
pool: practice
role: explain
stem:
  en: Why does the thyroid gland need a steady dietary supply of iodine?
hints:
- level: 1
  en: Think about the element that the thyroid takes up from the blood.
- level: 2
  en: Consider which hormone the thyroid produces to control metabolism.
- level: 3
  en: The element is built into the structure of that hormone.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Iodine makes insulin active in the blood
- id: b
  en: Iodine reduces the production of thyroxine
- id: c
  en: Iodine is required to form haemoglobin
- id: d
  en: Iodine is needed to build thyroxine, the hormone that regulates the metabolic rate
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.07D2C752F51D
  when_answer_equals:
  - c
- id: MC.A.B6D5EBFD07DA
  when_answer_equals:
  - a
- id: MC.A.D012AB23F0ED
  when_answer_equals:
  - b
solution_steps:
- en: The thyroid takes up iodide from the blood and incorporates it into thyroid hormones.
- en: Without enough iodine, thyroxine cannot be made and the gland may enlarge.
- en: The correct option is d.
tier: C
