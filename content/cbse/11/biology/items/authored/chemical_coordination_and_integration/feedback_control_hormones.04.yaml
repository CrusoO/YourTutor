stem:
  en: A hormone level is 100 units. Negative feedback lowers the level by 30 percent. What is the new level in units?
hints:
- level: 1
  en: Calculate 30 percent of the starting level first.
- level: 2
  en: Subtract the reduction from the starting value.
- level: 3
  en: Give the new level in the same units as the starting value.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '70'
  accept: []
solution_steps:
- en: Thirty percent of 100 is 30 units, so subtracting it from 100 leaves 70 units.
- en: The unit of the answer is units.
- en: Answer = 70
tier: C
