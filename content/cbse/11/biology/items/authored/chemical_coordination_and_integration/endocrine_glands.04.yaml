id: A.11.biology.chemical_coordination_and_integration.endocrine_glands.04
skill_ids:
- SK.A.11.biology.endocrine_glands
difficulty: 0.6
pool: practice
role: procedure
stem:
  en: Which gland is directly controlled by releasing hormones that the hypothalamus sends through a portal blood system?
hints:
- level: 1
  en: The hypothalamus sends its signal through a short portal blood route.
- level: 2
  en: Think about the gland at the base of the brain that secretes tropic hormones.
- level: 3
  en: The posterior pituitary is controlled by nerve fibres instead.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: Thymus
- id: b
  en: Pineal gland
- id: c
  en: Anterior pituitary
- id: d
  en: Adrenal medulla
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.FB9658FB645B
  when_answer_equals:
  - d
- id: MC.A.EB6E7873DD44
  when_answer_equals:
  - b
- id: MC.A.29A43CA7D8E4
  when_answer_equals:
  - a
solution_steps:
- en: Hypothalamic releasing and inhibiting hormones reach the anterior pituitary through the hypophyseal portal vessels, which control its secretion of tropic hormones.
- en: The correct option is c.
tier: C
diagram_note: Draw the hypothalamus above the pituitary, with the hypophyseal portal vessels linking them and the anterior pituitary receiving releasing hormones, labelling each structure.
