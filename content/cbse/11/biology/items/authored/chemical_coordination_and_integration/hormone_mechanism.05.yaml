id: A.11.biology.chemical_coordination_and_integration.hormone_mechanism.05
skill_ids:
- SK.A.11.biology.hormone_mechanism
difficulty: 0.9
pool: practice
role: apply
stem:
  en: A hormone binds a receptor on the cell surface and produces an effect within seconds. Which hormone type is most likely?
hints:
- level: 1
  en: Think about receptors located on the outside of the cell.
- level: 2
  en: Consider which signals act fast enough to produce effects within seconds.
- level: 3
  en: The location of the receptor largely determines the speed of the response.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: A dissolved gas acting through the nucleus
- id: b
  en: A peptide or amine hormone acting through a membrane receptor
- id: c
  en: A steroid hormone acting on gene expression
- id: d
  en: A vitamin acting as a steroid in the nucleus
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.D6F930D8FDF7
  when_answer_equals:
  - c
- id: MC.A.A71732FAB7ED
  when_answer_equals:
  - d
- id: MC.A.8B1E4CDE5A9C
  when_answer_equals:
  - a
solution_steps:
- en: Surface receptor signalling with second messengers produces fast responses, which is typical of peptide and amine hormones.
- en: Steroid effects require transcription and are slower.
- en: The correct option is b.
tier: C
