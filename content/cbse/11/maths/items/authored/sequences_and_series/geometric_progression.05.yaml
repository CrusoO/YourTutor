stem:
  en: What is the sum to infinity of the geometric progression 12, 4, 4 over 3, and so on?
hints:
- level: 1
  en: Check that the common ratio has absolute value less than one before using the formula.
- level: 2
  en: Recall the formula for the sum to infinity of a geometric progression.
- level: 3
  en: Divide the first term by one minus the common ratio.
