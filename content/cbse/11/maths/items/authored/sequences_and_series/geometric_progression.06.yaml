stem:
  en: The first three terms of a geometric progression of positive terms are a, ar and ar squared, with a equal to 3 and their sum equal to 21. What is the common ratio r?
hints:
- level: 1
  en: Write the sum of the three terms in terms of the ratio and substitute the first term.
- level: 2
  en: Simplify the equation into a standard quadratic in the ratio.
- level: 3
  en: Use the requirement that all terms are positive to choose between the two roots.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
