stem:
  en: The sum of the first n terms of an arithmetic progression is 3n squared plus 2n. What is the 10th term?
hints:
- level: 1
  en: Recall that a single term equals the partial sum up to it minus the partial sum before it.
- level: 2
  en: Compute the two partial sums that the difference needs.
- level: 3
  en: Subtract the smaller partial sum from the larger one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
