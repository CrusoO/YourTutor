stem:
  en: What is the 5th term of the geometric progression 2, 6, 18, and so on?
hints:
- level: 1
  en: Find the common ratio by dividing a term by the one before it.
- level: 2
  en: Use the nth term formula with the exponent one less than the position.
- level: 3
  en: Multiply the first term by the power of the ratio.
prediction_prompt:
