stem:
  en: What is the sum of the squares of the odd numbers from 1 to 19, that is 1 squared plus 3 squared plus up to 19 squared?
hints:
- level: 1
  en: Write each odd number as twice a counter minus one, and expand the squares.
- level: 2
  en: Split the expanded expression into sums of squares, sums of counters and a constant.
- level: 3
  en: Use the standard sum formulas for the first ten integers and their squares.
