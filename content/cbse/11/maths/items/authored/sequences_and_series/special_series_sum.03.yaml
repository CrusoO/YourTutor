stem:
  en: What is the sum of the cubes 1 cubed plus 2 cubed plus 3 cubed plus 4 cubed plus 5 cubed?
hints:
- level: 1
  en: Recall that the sum of cubes has a neat relation to the sum of natural numbers.
- level: 2
  en: Compute the sum of the first five natural numbers.
- level: 3
  en: Square that result to get the total of the cubes.
