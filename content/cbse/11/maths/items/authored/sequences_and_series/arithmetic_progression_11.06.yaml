stem:
  en: The sum of the first 5 terms of an arithmetic progression is 40 and its first term is 2. What is the common difference?
hints:
- level: 1
  en: Write the sum formula for a fixed number of terms using the given first term.
- level: 2
  en: Simplify the expression so that the common difference is the only unknown.
- level: 3
  en: Solve the resulting linear equation for the difference.
