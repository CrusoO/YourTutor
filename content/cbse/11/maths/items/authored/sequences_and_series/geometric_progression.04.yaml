stem:
  en: How many terms of the geometric progression 3, 6, 12, and so on, must be added together to reach a total of 189?
hints:
- level: 1
  en: Use the sum formula for a geometric progression with the given first term and ratio.
- level: 2
  en: Divide both sides of the equation to isolate the power of the ratio.
- level: 3
  en: Identify which power of the ratio gives that result.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: The sum is 3 times (2 to the power n minus 1), and setting it to 189 gives 2 to the power n equal to 64, so n is 6.
- en: Answer = 6
tier: C
