id: A.11.maths.permutations_and_combinations.fundamental_principle_counting.02
skill_ids:
- SK.A.11.maths.fundamental_principle_counting
difficulty: 0.2
pool: practice
role: recall
stem:
  en: A password is two letters followed by one digit, with repetition allowed. There are 26 letters and 10 digits available. Which expression counts the possible passwords?
hints:
- level: 1
  en: Consider each position of the password separately.
- level: 2
  en: Check whether a letter used earlier is still available later.
- level: 3
  en: Combine the counts for the positions by multiplying them.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 26 times 10
- id: b
  en: 26 plus 26 plus 10
- id: c
  en: 26 times 26 times 10
- id: d
  en: 26 times 25 times 10
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.57D2E1B968CF
  when_answer_equals:
  - d
- id: MC.A.6F3F63D23379
  when_answer_equals:
  - b
- id: MC.A.16D3C959E79A
  when_answer_equals:
  - a
solution_steps:
- en: Each letter position has 26 options and the digit position has 10, so the product of these counts is the answer.
- en: The correct option is c.
tier: C
