role: recall
stem:
  en: How many different committees of 2 people can be chosen from a group of 5 people?
hints:
- level: 1
  en: Order does not matter for a committee, so pairs that differ only in order count once.
- level: 2
  en: Count the ordered choices first and then remove the duplicates.
- level: 3
  en: Divide the ordered count by the number of ways to arrange the chosen pair.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
