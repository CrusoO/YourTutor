stem:
  en: Which expression gives the value of P(6, 2), the number of ordered arrangements of 2 objects chosen from 6?
hints:
- level: 1
  en: Think about how many choices there are for the first object.
- level: 2
  en: Count the remaining choices for the second object after the first is placed.
- level: 3
  en: Multiply the two counts to get the ordered arrangements.
prediction_prompt:
