stem:
  en: In how many ways can 5 distinct flags be arranged in a single row?
hints:
- level: 1
  en: Each position in the row can be filled by any flag not yet placed.
- level: 2
  en: Count the choices available at the first position, then the second, and so on.
- level: 3
  en: Multiply the decreasing counts to get the total arrangements.
