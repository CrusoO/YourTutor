difficulty: 0.9
pool: practice
role: transfer
stem:
  en: What is the largest integer x that satisfies the inequality (x minus 1) divided by 2 less than (3 minus x) divided by 3?
hints:
- level: 1
  en: Clear the fractions by multiplying through by a suitable common denominator.
- level: 2
  en: Gather the terms in x on one side and the constants on the other.
- level: 3
  en: Consider the integers just below the boundary value you obtain.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1'
  accept: []
solution_steps:
- en: Clearing denominators gives 3x minus 3 less than 6 minus 2x, so 5x is less than 9 and x is less than 1.8, making 1 the largest integer.
- en: Answer = 1
tier: C
diagram_note: Number line with the boundary point marked as an open circle, and the region to its left shaded to show the solution set.
