id: A.11.maths.linear_inequalities.inequalities_one_variable.01
skill_ids:
- SK.A.11.maths.inequalities_one_variable
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which set of real numbers x satisfies the inequality x + 3 > 7?
hints:
- level: 1
  en: Isolate the variable by undoing the constant that is added to it.
- level: 2
  en: Apply the same operation to both sides of the inequality.
- level: 3
  en: Decide whether the boundary value itself satisfies a strict inequality.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: x > 4
- id: b
  en: x >= 4
- id: c
  en: x > 10
- id: d
  en: x < 4
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.E83E40ECFA9E
  when_answer_equals:
  - d
- id: MC.A.5B9699B4BD92
  when_answer_equals:
  - c
- id: MC.A.5D68D059D511
  when_answer_equals:
  - b
solution_steps:
- en: Subtracting 3 from both sides gives x > 4, so every number above 4 works and 4 itself does not.
- en: The correct option is a.
tier: C
