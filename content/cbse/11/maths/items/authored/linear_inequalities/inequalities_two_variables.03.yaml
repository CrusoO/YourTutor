id: A.11.maths.linear_inequalities.inequalities_two_variables.03
skill_ids:
- SK.A.11.maths.inequalities_two_variables
difficulty: 0.6
pool: practice
role: explain
stem:
  en: The region given by x greater than or equal to 0, y greater than or equal to 0 and x plus y less than or equal to 6 is a triangle. What is its area in square units?
hints:
- level: 1
  en: Sketch the lines bounding the region, including the two axes and the line of the sum.
- level: 2
  en: Identify the shape formed by those lines and the axes.
- level: 3
  en: Use the area formula for that shape with the leg lengths you read off.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '18'
  accept: []
solution_steps:
- en: The triangle has legs of length 6 along both axes, so its area is one half times 6 times 6, which is 18.
- en: The unit of the answer is square units.
- en: Answer = 18
tier: C
diagram_note: Coordinate axes in the first quadrant with a line joining the points on each axis, forming a right triangle that is shaded as the feasible region.
