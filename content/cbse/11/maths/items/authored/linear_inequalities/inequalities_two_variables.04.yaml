stem:
  en: Which point is where the lines x plus y equals 4 and x minus y equals 2 intersect?
hints:
- level: 1
  en: Add or subtract the two equations to eliminate one variable.
- level: 2
  en: Solve the resulting single equation for the remaining variable.
- level: 3
  en: Substitute that value back into one of the original equations.
prediction_prompt:
