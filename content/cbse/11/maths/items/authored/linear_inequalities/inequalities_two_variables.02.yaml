id: A.11.maths.linear_inequalities.inequalities_two_variables.02
skill_ids:
- SK.A.11.maths.inequalities_two_variables
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which type of boundary line is drawn for the strict inequality y greater than 2x?
hints:
- level: 1
  en: Ask whether the points exactly on the boundary satisfy the inequality.
- level: 2
  en: Use one style of line for points that are included and another for points that are not.
- level: 3
  en: Check the boundary equation you get by replacing the inequality sign with an equality.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: no boundary line
- id: b
  en: dashed line
- id: c
  en: solid line
- id: d
  en: vertical line
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.F8BC6AA0DB72
  when_answer_equals:
  - c
- id: MC.A.9AAF74847662
  when_answer_equals:
  - d
- id: MC.A.F353BFC51F22
  when_answer_equals:
  - a
solution_steps:
- en: Because the inequality is strict, the points on the line y equals 2x are excluded, so the boundary is drawn dashed.
- en: The correct option is b.
tier: C
