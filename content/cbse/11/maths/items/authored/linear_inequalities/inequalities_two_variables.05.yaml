stem:
  en: Maximise P equal to 3x plus 2y subject to x greater than or equal to 0, y greater than or equal to 0, x plus y less than or equal to 4 and x less than or equal to 3. What is the maximum value of P?
hints:
- level: 1
  en: Identify all the corner points of the feasible region.
- level: 2
  en: Evaluate the objective expression at each corner point.
- level: 3
  en: Pick the largest of the values you obtained.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '11'
  accept: []
solution_steps:
- en: The corner points give P values 0, 8, 11 and 9, so the maximum is 11 at the corner where x is 3 and y is 1.
- en: Answer = 11
tier: C
diagram_note: Feasible region in the first quadrant bounded by the axes, the vertical line at x equal to 3 and the line x plus y equal to 4, with its corner points labelled.
