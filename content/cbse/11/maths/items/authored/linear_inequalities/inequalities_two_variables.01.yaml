difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which point lies in the solution region of the inequality x + y less than or equal to 4?
hints:
- level: 1
  en: Substitute each candidate point into the inequality and simplify.
- level: 2
  en: Compare the resulting sum with the bound given in the inequality.
- level: 3
  en: Check whether the boundary itself is part of the region.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: (4, 1)
- id: b
  en: (1, 2)
- id: c
  en: (2, 4)
- id: d
  en: (3, 3)
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.004FA1A5D82F
  when_answer_equals:
  - d
- id: MC.A.BEC56426CA8B
  when_answer_equals:
  - a
- id: MC.A.E1476B29797A
  when_answer_equals:
