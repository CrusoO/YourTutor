solution_steps:
- en: The point (1, 2) gives a sum of 3, which is at most 4, so it lies in the region.
- en: The correct option is b.
tier: C
diagram_note: Coordinate axes with the boundary line x plus y equal to 4 drawn as a solid line, and a candidate point marked on each side of it.
