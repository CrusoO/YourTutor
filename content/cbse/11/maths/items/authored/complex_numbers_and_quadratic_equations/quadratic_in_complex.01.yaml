stem:
  en: What are the roots of the equation x squared plus 1 equals 0?
hints:
- level: 1
  en: Rearrange the equation so that the squared term stands alone.
- level: 2
  en: Think about which numbers square to a negative result.
- level: 3
  en: Remember that the roots of such an equation come in a conjugate pair.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
