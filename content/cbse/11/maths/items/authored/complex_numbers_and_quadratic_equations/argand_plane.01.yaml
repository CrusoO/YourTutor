id: A.11.maths.complex_numbers_and_quadratic_equations.argand_plane.01
skill_ids:
- SK.A.11.maths.argand_plane
difficulty: 0.2
pool: practice
role: recall
stem:
  en: On an Argand plane, at which point is the complex number 3 plus 4i represented?
hints:
- level: 1
  en: Identify which component of the number runs along the horizontal axis.
- level: 2
  en: The imaginary component is measured along the vertical axis.
- level: 3
  en: Check the sign of each coordinate against the signs in the number.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: at (-3, 4)
- id: b
  en: at (3, 4)
- id: c
  en: at (4, 3)
- id: d
  en: at (3, -4)
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.5A838C168D87
  when_answer_equals:
  - c
- id: MC.A.E4003BCC8D8D
  when_answer_equals:
  - a
- id: MC.A.350048FF34D0
  when_answer_equals:
  - d
solution_steps:
- en: The real part gives the horizontal coordinate and the imaginary part gives the vertical coordinate, so the point is (3, 4).
- en: The correct option is b.
tier: C
diagram_note: Argand plane with a horizontal real axis and a vertical imaginary axis, with a dot to be placed at the point representing the complex number.
