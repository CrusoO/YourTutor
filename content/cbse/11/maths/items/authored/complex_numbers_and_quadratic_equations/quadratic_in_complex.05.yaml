options:
- id: a
  en: 1 + i and 1 - i
- id: b
  en: (-1 + i)/2 and (-1 - i)/2
- id: c
  en: (1 + i)/2 and (1 - i)/2
- id: d
  en: (1 + 2i)/2 and (1 - 2i)/2
