stem:
  en: Solve the equation 2x squared minus 2x plus 1 equals 0.
hints:
- level: 1
  en: Apply the quadratic formula with the correct coefficients.
- level: 2
  en: Find the square root of the discriminant, which is negative, using the imaginary unit.
- level: 3
  en: Divide the whole expression by twice the leading coefficient.
