stem:
  en: Find the positive real number k for which the complex number (1 + k i) squared is purely imaginary.
hints:
- level: 1
  en: Expand the square and separate the real and imaginary parts.
- level: 2
  en: A purely imaginary number has a real part equal to zero.
- level: 3
  en: Solve the equation formed by the real part for k and keep the positive root.
