stem:
  en: Which complex number has modulus 2 and argument 60 degrees?
hints:
- level: 1
  en: Write the number in polar form using the modulus and the argument.
- level: 2
  en: Recall the cosine and sine of the given angle.
- level: 3
  en: Multiply each trigonometric value by the modulus to get the components.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 1 + sqrt(3) i
- id: b
  en: 2 + 2i
- id: c
  en: sqrt(3) + i
- id: d
  en: 2 cos 30 degrees + 2i sin 30 degrees
answer:
  sympy: a
  accept: []
