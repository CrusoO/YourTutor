stem:
  en: What is the imaginary part of 1 divided by (1 + i)?
hints:
- level: 1
  en: Multiply the numerator and denominator by the conjugate of the denominator.
- level: 2
  en: The conjugate changes the sign of the imaginary part of the denominator.
- level: 3
  en: Divide each component of the result by the squared modulus of the denominator.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-0.5'
  accept: []
solution_steps:
- en: Multiplying top and bottom by 1 minus i gives (1 - i) over 2, whose imaginary part is minus one half.
- en: Answer = -0.5
tier: C
