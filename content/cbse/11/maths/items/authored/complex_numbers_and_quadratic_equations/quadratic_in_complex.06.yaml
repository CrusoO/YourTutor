stem:
  en: The quadratic x squared plus p x plus 13 equals 0 has real coefficients, and one of its roots is 2 plus 3i. Find the real value of p.
hints:
- level: 1
  en: Real coefficients force the other root to be the conjugate of the given root.
- level: 2
  en: Use the fact that the sum of the roots equals the negative of the linear coefficient.
- level: 3
  en: Add the two roots and read off the coefficient p from that sum.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-4'
  accept: []
solution_steps:
- en: The other root is the conjugate 2 minus 3i, the roots sum to 4, and that sum equals negative p, so p is minus 4.
- en: Answer = -4
tier: C
