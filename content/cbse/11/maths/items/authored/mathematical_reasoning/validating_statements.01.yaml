stem:
  en: Which method best shows that there is a whole number whose square is greater than 100?
hints:
- level: 1
  en: An existence claim is settled by producing one case that satisfies it.
- level: 2
  en: Try small whole numbers and check their squares against the bound.
- level: 3
  en: Once you find a suitable number, confirm the inequality for it.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
