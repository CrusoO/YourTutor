  author: model-draft
type: mcq
options:
- id: a
  en: exhibit a specific number such as 11
- id: b
  en: proof by induction
- id: c
  en: proof by contradiction
- id: d
  en: argue from a general property without naming any number
answer:
  sympy: a
  accept: []
misconception_rules:
