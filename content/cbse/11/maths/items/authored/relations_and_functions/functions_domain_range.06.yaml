stem:
  en: The function f(x) = 1 divided by (x squared minus 5x plus 6) is defined on real numbers except where the denominator is zero. What is the sum of the excluded real values?
hints:
- level: 1
  en: Factor the quadratic in the denominator before anything else.
- level: 2
  en: The excluded values are the inputs that make the denominator zero.
- level: 3
  en: Add the two roots you find from the factors.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: The denominator factors as (x - 2)(x - 3), so the excluded values are 2 and 3, and their sum is 5.
- en: Answer = 5
tier: C
