id: A.11.maths.relations_and_functions.graphs_of_functions.06
skill_ids:
- SK.A.11.maths.graphs_of_functions
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: Which description fits the graph of y = minus x squared plus 4 over the real numbers?
hints:
- level: 1
  en: Look at the sign in front of the squared term to decide the opening direction.
- level: 2
  en: Find the inputs where the output becomes zero by isolating the square.
- level: 3
  en: Count how many real inputs satisfy the condition you found.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: an upward parabola crossing the x-axis at one point
- id: b
  en: a downward parabola with no crossings of the x-axis
- id: c
  en: a downward parabola crossing the x-axis at two points
- id: d
  en: an upward parabola with its vertex at height 4
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.4EC71DF1D948
  when_answer_equals:
  - d
- id: MC.A.754DA42B5A57
  when_answer_equals:
  - b
- id: MC.A.5836BD283489
  when_answer_equals:
  - a
solution_steps:
- en: The negative leading coefficient opens the parabola downward, and solving minus x squared plus 4 equal to zero gives two real roots.
- en: The correct option is c.
tier: C
diagram_note: Coordinate axes showing a downward opening parabola whose peak lies above the x-axis and whose two arms cross the x-axis.
