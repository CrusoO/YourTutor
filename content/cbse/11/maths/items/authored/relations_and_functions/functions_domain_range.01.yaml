stem:
  en: What is the domain of the function f(x) = x + 5 when the inputs are real numbers?
hints:
- level: 1
  en: Ask which inputs the expression can accept without any breakdown.
- level: 2
  en: A linear rule has no division and no square roots to worry about.
- level: 3
  en: Check whether any real value makes the rule undefined.
