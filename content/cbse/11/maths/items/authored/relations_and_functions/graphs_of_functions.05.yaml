difficulty: 0.9
pool: practice
role: procedure
stem:
  en: A piecewise function equals 2x for x less than 1 and equals x + 3 for x at least 1. What is the value of the function at x equal to 1?
hints:
- level: 1
  en: Check which branch of the definition includes the boundary input.
- level: 2
  en: Use the rule that covers values greater than or equal to the boundary.
- level: 3
  en: Substitute the boundary input into that branch only.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: At x equal to 1 the rule for x at least 1 applies, giving 1 plus 3, which is 4.
- en: Answer = 4
tier: C
diagram_note: Two line segments meeting at x equal to 1; the left segment ends with an open circle at the boundary and the right segment starts with a filled circle there.
