  en: A = {1} and B = {2, 3, 4}
- id: b
  en: A = {1, 2, 3} and B = {3, 4}
- id: c
  en: A = {1, 2} and B = {3, 4}
- id: d
  en: A = {3, 4} and B = {1, 2}
answer:
  sympy: c
  accept: []
