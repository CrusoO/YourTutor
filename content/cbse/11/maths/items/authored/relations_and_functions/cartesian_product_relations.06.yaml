stem:
  en: The Cartesian product A cross B equals {(1, 3), (1, 4), (2, 3), (2, 4)}. Which pair of sets gives this product?
hints:
- level: 1
  en: Collect the distinct first coordinates from the listed pairs.
- level: 2
  en: Collect the distinct second coordinates from the same list.
- level: 3
  en: Verify that every combination of your two collections appears in the product.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
