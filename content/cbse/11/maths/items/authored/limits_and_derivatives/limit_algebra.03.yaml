  author: model-draft
type: numeric
answer:
  sympy: '1.5'
  accept: []
solution_steps:
- en: Writing each sine as its argument times the standard limit gives 3x over 2x, so the limit is 3 over 2, or 1.5.
- en: Answer = 1.5
