stem:
  en: What is the limit of sin(3x) divided by sin(2x) as x approaches 0? Give the answer as a decimal.
hints:
- level: 1
  en: Rewrite each sine so that its argument matches the variable in the standard limit.
- level: 2
  en: Apply the standard limit of sine over its argument to each part.
- level: 3
  en: Combine the resulting constants from the two parts.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
