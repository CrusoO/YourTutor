stem:
  en: What value does (x cubed minus 8) divided by (x squared minus 4) approach as x nears 2?
hints:
- level: 1
  en: Factor the difference of cubes in the numerator.
- level: 2
  en: Factor the difference of squares in the denominator.
- level: 3
  en: Cancel the common factor and then substitute the point into what remains.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: Factoring gives (x minus 2)(x squared plus 2x plus 4) over (x minus 2)(x plus 2), which simplifies to (x squared plus 2x plus 4) over (x plus 2), and at 2 this is 12 over 4, or 3.
- en: Answer = 3
tier: C
