stem:
  en: Differentiate (x plus 1) divided by (x minus 1) and evaluate the derivative at x equal to 2.
hints:
- level: 1
  en: Apply the quotient rule to the fraction with the numerator and denominator labelled.
- level: 2
  en: Simplify the numerator of the quotient rule result.
- level: 3
  en: Substitute the given point into the simplified derivative.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '-2'
  accept: []
solution_steps:
- en: The quotient rule gives ((x minus 1) minus (x plus 1)) over (x minus 1) squared, which is minus 2 over (x minus 1) squared, and at x equal to 2 this equals minus 2.
- en: Answer = -2
tier: C
