stem:
  en: Find the limit of (x cubed minus 1) divided by (x minus 1) as x approaches 1.
hints:
- level: 1
  en: Factor the numerator using the difference of cubes.
- level: 2
  en: Cancel the factor that also appears in the denominator.
- level: 3
  en: Substitute the point into the simplified expression.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: The numerator factors as (x minus 1)(x squared plus x plus 1), leaving x squared plus x plus 1, which at x equal to 1 gives 3.
- en: Answer = 3
tier: C
