stem:
  en: Find the limit of (3x squared plus x) divided by (x squared minus 4) as x tends to infinity.
hints:
- level: 1
  en: Identify the highest power of x in the numerator and the denominator.
- level: 2
  en: Divide every term of the fraction by that highest power.
- level: 3
  en: Let the terms with x in the denominator tend to zero.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
