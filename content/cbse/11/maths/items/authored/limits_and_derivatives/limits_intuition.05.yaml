  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: Dividing numerator and denominator by x squared, the lower terms vanish in the limit, leaving 3 over 1, which is 3.
- en: Answer = 3
