difficulty: 0.9
pool: practice
role: procedure
stem:
  en: Find the limit as x approaches 2 of (x squared minus 4) divided by (x squared plus x minus 6). Give the answer as a decimal.
hints:
- level: 1
  en: Factor both the numerator and the denominator completely.
- level: 2
  en: Cancel the factor that vanishes at the point of approach.
- level: 3
  en: Substitute into the simplified fraction and convert to a decimal.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '0.8'
  accept: []
solution_steps:
- en: Factoring gives (x minus 2)(x plus 2) over (x minus 2)(x plus 3), which simplifies to (x plus 2) over (x plus 3), and at 2 this is 4 over 5, or 0.8.
- en: Answer = 0.8
tier: C
