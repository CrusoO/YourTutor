stem:
  en: Find the limit as x approaches 0 of (1 minus cos 6x) divided by x squared.
hints:
- level: 1
  en: Use a double-angle identity to write one minus the cosine as a squared sine.
- level: 2
  en: Split the expression into a square of a sine ratio and a constant.
- level: 3
  en: Apply the standard sine limit to the ratio after adjusting its argument.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
