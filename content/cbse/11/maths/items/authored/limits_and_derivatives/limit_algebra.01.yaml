stem:
  en: Find the limit as x approaches 3 of (2x plus 1) divided by (x plus 1). Give the answer as a decimal.
hints:
- level: 1
  en: Check that the denominator does not vanish at the point.
- level: 2
  en: Substitute the point into the numerator and the denominator separately.
- level: 3
  en: Divide the two results and express the quotient as a decimal.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
