stem:
  en: What is the derivative with respect to x of x cubed minus 2x squared plus 5x minus 7?
hints:
- level: 1
  en: Differentiate each term of the polynomial separately.
- level: 2
  en: For each power term, multiply by the exponent and reduce the exponent by one.
- level: 3
  en: The constant term has no contribution to the derivative.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
