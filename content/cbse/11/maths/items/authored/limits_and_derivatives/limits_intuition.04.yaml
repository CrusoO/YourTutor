stem:
  en: What is the limit of (x squared plus 2x) divided by x as x approaches 0?
hints:
- level: 1
  en: Divide each term of the numerator by the denominator.
- level: 2
  en: Simplify the expression for values of x that are not zero.
- level: 3
  en: Find the value that the simplified expression approaches.
