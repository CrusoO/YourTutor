id: A.11.maths.conic_sections.circle_equation.06
skill_ids:
- SK.A.11.maths.circle_equation
difficulty: 0.9
pool: practice
role: procedure
stem:
  en: A circle is centred at the origin and passes through the point (3, 4). The tangent to the circle at (3, 4) meets the vertical axis at a point. What is the y-coordinate of that point?
hints:
- level: 1
  en: A tangent is perpendicular to the radius at the point of contact.
- level: 2
  en: Write the equation of the tangent using the point and the perpendicular slope.
- level: 3
  en: Set the horizontal coordinate to zero and solve for the vertical one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6.25'
  accept: []
solution_steps:
- en: The tangent at (3, 4) is 3x plus 4y equal to 25, and setting x to zero gives y equal to 25 over 4, which is 6.25.
- en: Answer = 6.25
tier: C
diagram_note: Coordinate axes with a circle centred at the origin, a radius to a marked point in the first quadrant, and the tangent line at that point extended to meet the vertical axis.
