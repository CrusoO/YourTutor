difficulty: 0.9
pool: practice
role: procedure
stem:
  en: A hyperbola has foci at (plus or minus 5, 0) and vertices at (plus or minus 3, 0). What is the value of b squared?
hints:
- level: 1
  en: Read the focal distance and the vertex distance from the given points.
- level: 2
  en: Use the relation between the focal distance, the transverse semi-axis and the conjugate semi-axis.
- level: 3
  en: Rearrange that relation to isolate the conjugate term.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '16'
  accept: []
solution_steps:
- en: Using c squared equal to a squared plus b squared, b squared is 25 minus 9, which equals 16.
- en: Answer = 16
tier: C
diagram_note: Coordinate axes with a hyperbola opening left and right, its vertices and foci marked on the horizontal axis with the distances labelled.
