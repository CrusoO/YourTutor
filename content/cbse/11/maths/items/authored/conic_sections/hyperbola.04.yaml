stem:
  en: What is the eccentricity of the hyperbola x squared over 16 minus y squared over 9 equals 1? Give the answer as a decimal.
hints:
- level: 1
  en: Find the focal distance from the two denominators using the hyperbola relation.
- level: 2
  en: Eccentricity is the focal distance divided by the transverse semi-axis.
- level: 3
  en: Express the resulting fraction as a decimal.
