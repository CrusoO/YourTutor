difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is the centre of the circle given by (x minus 2) squared plus (y plus 3) squared equals 16?
hints:
- level: 1
  en: Compare the bracketed expressions with the standard form of a circle.
- level: 2
  en: The centre coordinates are the numbers subtracted inside each bracket.
- level: 3
  en: Pay attention to the sign that appears inside each bracket.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
