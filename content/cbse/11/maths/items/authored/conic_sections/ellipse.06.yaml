stem:
  en: What is the area enclosed by the ellipse x squared over 16 plus y squared over 9 equals 1, rounded to one decimal place?
hints:
- level: 1
  en: Recall the formula for the area enclosed by an ellipse in terms of its semi-axes.
- level: 2
  en: Read the semi-axis lengths from the denominators.
- level: 3
  en: Multiply the semi-axes and by pi, then round at the end.
