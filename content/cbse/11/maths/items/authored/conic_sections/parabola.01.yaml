stem:
  en: What is the focus of the parabola y squared equals 8x?
hints:
- level: 1
  en: Compare the given equation with the standard form for a parabola opening along an axis.
- level: 2
  en: The constant multiplying the variable on one side gives four times the focal distance.
- level: 3
  en: Locate the focus on the axis of symmetry at that focal distance from the vertex.
