difficulty: 0.6
pool: practice
role: procedure
stem:
  en: What are the vertices of the hyperbola y squared over 4 minus x squared over 5 equals 1?
hints:
- level: 1
  en: Look at which variable has the positive term to find the transverse axis.
- level: 2
  en: The vertex distance is the square root of the denominator under that variable.
- level: 3
  en: Place the two vertices on the transverse axis symmetrically about the centre.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: (plus or minus 2, 0)
- id: b
  en: (plus or minus sqrt 5, 0)
- id: c
  en: (0, plus or minus 3)
- id: d
  en: (0, plus or minus 2)
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.9999A203A8E5
  when_answer_equals:
  - a
- id: MC.A.AD8AE76A5568
  when_answer_equals:
