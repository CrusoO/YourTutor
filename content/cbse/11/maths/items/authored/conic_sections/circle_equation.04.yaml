solution_steps:
- en: The radius squared is the squared distance from (1, -2) to (4, 2), which is 9 plus 16 equal to 25.
- en: The correct option is b.
tier: C
diagram_note: Coordinate axes with a circle centred at a marked point below the horizontal axis and a second marked point on its circumference connected by a radius.
