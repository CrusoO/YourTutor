difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which equation describes the circle with centre (1, -2) that passes through the point (4, 2)?
hints:
- level: 1
  en: Find the distance from the given centre to the given point on the circle.
- level: 2
  en: The right side of the standard form is the square of that distance.
- level: 3
  en: Write the equation using the centre coordinates with the correct signs.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: (x + 1) squared plus (y - 2) squared equals 25
- id: b
  en: (x - 1) squared plus (y + 2) squared equals 25
- id: c
  en: (x - 1) squared plus (y + 2) squared equals 7
- id: d
  en: (x - 1) squared plus (y + 2) squared equals 5
answer:
  sympy: b
  accept: []
