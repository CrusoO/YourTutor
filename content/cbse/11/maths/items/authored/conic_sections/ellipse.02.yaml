solution_steps:
- en: The focal distance satisfies c squared equal to 25 minus 9, which is 16, so the foci are at (4, 0) and (-4, 0).
- en: The correct option is d.
tier: C
diagram_note: Coordinate axes with an ellipse wider along the horizontal direction, its two foci marked on the horizontal axis symmetric about the centre.
