stem:
  en: A circle has the equation x squared plus y squared minus 4x minus 6y minus 12 equals 0. What is its radius?
hints:
- level: 1
  en: Complete the square separately for the x terms and the y terms.
- level: 2
  en: Add each completed square to both sides to keep the equation balanced.
- level: 3
  en: Take the square root of the constant on the right side.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
