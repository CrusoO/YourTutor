difficulty: 0.6
pool: practice
role: explain
stem:
  en: What is the radius of the circle x squared plus y squared minus 6x plus 4y minus 3 equals 0?
hints:
- level: 1
  en: Group the x terms and the y terms and complete the square in each group.
- level: 2
  en: Remember to add the completed squares to both sides of the equation.
- level: 3
  en: Read the radius from the constant on the right side after simplifying.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '4'
  accept: []
solution_steps:
- en: Completing the square gives (x minus 3) squared plus (y plus 2) squared equal to 16, so the radius is 4.
- en: The unit of the answer is units.
- en: Answer = 4
tier: C
diagram_note: Coordinate axes with a circle drawn whose centre is marked and whose radius is shown as a segment from the centre to the circumference.
