stem:
  en: Which point on the parabola y squared equals 4x lies at distance 5 from its focus?
hints:
- level: 1
  en: Use the focal distance of the parabola to find the focus.
- level: 2
  en: The focal distance formula for a point on the parabola equals its x coordinate plus the focal distance.
- level: 3
  en: Check the candidate points against the parabola equation before measuring distances.
