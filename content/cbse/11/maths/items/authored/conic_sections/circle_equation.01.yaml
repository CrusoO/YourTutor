role: recall
stem:
  en: What is the radius of the circle whose equation is x squared plus y squared equals 49?
hints:
- level: 1
  en: Compare the equation with the standard form for a circle centred at the origin.
- level: 2
  en: The constant on the right side is the square of the radius.
- level: 3
  en: Take the positive square root of that constant.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '7'
  accept: []
solution_steps:
- en: The right side equals the radius squared, so the radius is the square root of 49, which is 7.
- en: The unit of the answer is units.
- en: Answer = 7
tier: C
