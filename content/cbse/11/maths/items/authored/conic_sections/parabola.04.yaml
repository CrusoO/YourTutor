stem:
  en: What is the length of the latus rectum of the parabola y squared equals 16x?
hints:
- level: 1
  en: The latus rectum is the chord through the focus perpendicular to the axis of symmetry.
- level: 2
  en: Its length is four times the focal distance.
- level: 3
  en: Find the focal distance from the given equation first.
