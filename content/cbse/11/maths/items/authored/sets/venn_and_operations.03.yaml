stem:
  en: Set A has 12 elements, set B has 9 elements and the intersection of A and B has 4 elements. How many elements does A union B have?
hints:
- level: 1
  en: Add the sizes of the two sets first.
- level: 2
  en: Remember that the shared elements were counted once in each set.
- level: 3
  en: Subtract the size of the overlap exactly once from your sum.
