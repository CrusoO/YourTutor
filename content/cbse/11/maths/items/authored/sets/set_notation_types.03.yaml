difficulty: 0.6
pool: practice
role: explain
stem:
  en: 'Which roster form is equal to the set written as {x : x is a prime number less than 12}?'
hints:
- level: 1
  en: Recall what makes a whole number prime.
- level: 2
  en: Test each candidate below the upper bound one at a time.
- level: 3
  en: Make sure no composite number has slipped into your list.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: '{1, 3, 5, 7, 9, 11}'
- id: b
  en: '{2, 4, 6, 8, 10}'
- id: c
  en: '{2, 3, 5, 7, 9, 11}'
- id: d
  en: '{2, 3, 5, 7, 11}'
answer:
  sympy: d
  accept: []
misconception_rules:
- id: MC.A.6C0F90BE0715
  when_answer_equals:
  - a
- id: MC.A.E02C773A838B
  when_answer_equals:
  - c
- id: MC.A.F6B2E26CD867
  when_answer_equals:
