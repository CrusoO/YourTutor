role: apply
stem:
  en: Which set is equal to the complement of the union of A and B, as given by De Morgan's law?
hints:
- level: 1
  en: Write the complement of a union in words before using symbols.
- level: 2
  en: Each complement switches the operation that it is applied across.
- level: 3
  en: Check the result against a small example with a few named elements.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: (A union B) intersection A
- id: b
  en: A' union B'
- id: c
  en: A intersection B
- id: d
  en: A' intersection B'
answer:
  sympy: d
  accept: []
misconception_rules:
