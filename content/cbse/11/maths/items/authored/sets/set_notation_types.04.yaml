stem:
  en: Set A holds the letters of the word RATE and set B holds the letters of the word TEAR. What is the relationship between A and B?
hints:
- level: 1
  en: Write out the letters of each word as a separate list.
- level: 2
  en: A set ignores the order in which its members appear.
- level: 3
  en: Check whether each member of one set appears in the other.
