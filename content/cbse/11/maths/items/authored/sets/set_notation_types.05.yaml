stem:
  en: A set has 4 distinct elements. How many proper subsets does it have? A proper subset is any subset other than the set itself.
hints:
- level: 1
  en: Start from the total number of subsets a set can have.
- level: 2
  en: Each element is either included in a subset or left out of it.
- level: 3
  en: Remove the one subset that is the whole set from your running total.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
