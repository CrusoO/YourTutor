id: A.11.maths.sets.set_notation_types.06
skill_ids:
- SK.A.11.maths.set_notation_types
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: 'Set X is written {x : x is a real number and x squared equals -1}. Which statement about X is correct?'
hints:
- level: 1
  en: Ask whether any real number multiplied by itself can give a negative result.
- level: 2
  en: Think about the sign of x squared for every real value of x.
- level: 3
  en: A collection with no members at all has a special name, so match that name to X.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: X contains 1 and -1
- id: b
  en: X is the empty set
- id: c
  en: X is the set {0}
- id: d
  en: X contains the number i
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.9DBFEB5FA373
  when_answer_equals:
  - d
- id: MC.A.49D992C5BD9E
  when_answer_equals:
  - a
- id: MC.A.0F4B8CACCA37
  when_answer_equals:
  - c
solution_steps:
- en: No real number has a negative square, so no real x satisfies the rule and X has no members.
- en: The correct option is b.
tier: C
