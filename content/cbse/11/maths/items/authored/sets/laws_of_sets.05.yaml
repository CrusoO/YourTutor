stem:
  en: For sets A and B, n(A) is 20, n(B) is 15 and n(A union B) is 28. What is n(A intersection B)?
hints:
- level: 1
  en: Start from the formula that links the union size with the two set sizes.
- level: 2
  en: Isolate the overlap term on one side of the equation.
- level: 3
  en: Rearrange the three counts you were given to find the missing one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '7'
  accept: []
solution_steps:
- en: Using n(A union B) equals n(A) plus n(B) minus n(A intersection B), the overlap is 20 plus 15 minus 28, which is 7.
- en: Answer = 7
tier: C
