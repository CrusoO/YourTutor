difficulty: 0.2
pool: practice
role: recall
stem:
  en: Sets A and B are disjoint, with n(A) equal to 7 and n(B) equal to 5. What is n(A union B)?
hints:
- level: 1
  en: Disjoint sets share no elements, so nothing is counted twice.
- level: 2
  en: When there is no overlap, the sizes simply add together.
- level: 3
  en: Add the two given counts to get the size of the union.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '12'
  accept: []
solution_steps:
- en: Because the sets share no elements, the union size is the sum of the two sizes, 7 plus 5.
- en: Answer = 12
