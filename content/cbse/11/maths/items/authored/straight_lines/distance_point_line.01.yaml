difficulty: 0.2
pool: practice
role: recall
stem:
  en: What is the perpendicular distance from the origin to the line 3x plus 4y equals 10?
hints:
- level: 1
  en: Use the standard formula for the distance from a point to a line.
- level: 2
  en: Substitute the coordinates of the point into the left side of the line equation.
- level: 3
  en: Divide the absolute value by the square root of the sum of the squared coefficients.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The distance is the absolute value of minus 10 divided by the square root of 3 squared plus 4 squared, which is 10 over 5.
- en: The unit of the answer is units.
- en: Answer = 2
tier: C
