difficulty: 0.9
pool: practice
role: procedure
stem:
  en: A line passes through the points (2, 1) and (6, 7). Where does this line cross the horizontal axis? Give the x-coordinate as a decimal rounded to two decimal places.
hints:
- level: 1
  en: Find the slope from the two given points first.
- level: 2
  en: Write the equation of the line using one of the points.
- level: 3
  en: Set the vertical coordinate to zero and solve for the horizontal one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.33'
  accept: []
solution_steps:
- en: The slope is 6 over 4, or 3 over 2, and the line y minus 1 equal to 3 over 2 times (x minus 2) meets y equal to zero at x equal to 4 over 3, about 1.33.
- en: Answer = 1.33
tier: C
diagram_note: Coordinate axes with a straight line rising through two marked points and extended to meet the horizontal axis at a labelled point on the left.
