stem:
  en: What is the slope of the straight line passing through the points (1, 2) and (4, 11)?
hints:
- level: 1
  en: Recall the formula for the slope between two points.
- level: 2
  en: Subtract the y coordinates and the x coordinates in the same order.
- level: 3
  en: Divide the change in y by the change in x.
prediction_prompt:
