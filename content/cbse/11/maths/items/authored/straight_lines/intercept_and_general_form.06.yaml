stem:
  en: The line 5x plus k y equals 15 has equal x-intercept and y-intercept. What is the value of k?
hints:
- level: 1
  en: Find the x-intercept by setting y to zero.
- level: 2
  en: Find the y-intercept by setting x to zero and keeping k as a symbol.
- level: 3
  en: Equate the two intercepts and solve for k.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
