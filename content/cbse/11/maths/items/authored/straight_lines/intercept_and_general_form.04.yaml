id: A.11.maths.straight_lines.intercept_and_general_form.04
skill_ids:
- SK.A.11.maths.intercept_and_general_form
difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which intercept form represents the line 4x minus 6y equals 12?
hints:
- level: 1
  en: Divide every term of the equation by the constant on the right side.
- level: 2
  en: Each variable term should end with its coefficient in the denominator.
- level: 3
  en: Keep track of the sign of each term as you divide.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: x over 3 minus y over 2 equals 0
- id: b
  en: x over 3 minus y over 2 equals 1
- id: c
  en: x over 3 plus y over 2 equals 1
- id: d
  en: x over 6 minus y over 4 equals 1
answer:
  sympy: b
  accept: []
misconception_rules:
- id: MC.A.0C3072DADFFB
  when_answer_equals:
  - c
- id: MC.A.7A2CE9ABF3F7
  when_answer_equals:
  - d
- id: MC.A.4C78A2913ADA
  when_answer_equals:
  - a
solution_steps:
- en: Dividing the whole equation by 12 gives x over 3 minus y over 2 equal to 1, which is the intercept form.
- en: The correct option is b.
tier: C
