difficulty: 0.6
pool: practice
role: explain
stem:
  en: A straight line has slope minus 2 and passes through the point (3, 5). What is its y-intercept?
hints:
- level: 1
  en: Write the point-slope form using the given point and slope.
- level: 2
  en: Expand the right side and collect the constant terms.
- level: 3
  en: The constant term that remains after rearranging is the y-intercept.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '11'
  accept: []
solution_steps:
- en: Starting from y minus 5 equal to minus 2 times (x minus 3) gives y equal to minus 2x plus 11, so the intercept is 11.
- en: Answer = 11
tier: C
diagram_note: Coordinate axes with a straight line of negative slope passing through a marked point, and the point where it crosses the vertical axis labelled.
