solution_steps:
- en: The given slope is 3, so the perpendicular slope is minus one third, and x + 3y = 6 has slope minus one third.
- en: The correct option is a.
tier: C
diagram_note: Coordinate axes showing the given line of positive slope and a second line crossing it at a right angle.
