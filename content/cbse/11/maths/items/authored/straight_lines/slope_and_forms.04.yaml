difficulty: 0.6
pool: practice
role: apply
stem:
  en: Which line is perpendicular to the line y equal to 3x minus 4?
hints:
- level: 1
  en: Find the slope of the given line from its equation.
- level: 2
  en: Perpendicular lines have slopes whose product is minus one.
- level: 3
  en: Rearrange each candidate into slope form and test the product.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: x + 3y = 6
- id: b
  en: 3x + y = 2
- id: c
  en: y = 3x + 1
- id: d
  en: x - 3y = 1
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.EAE97308510F
  when_answer_equals:
  - b
- id: MC.A.4AE19E05D53C
  when_answer_equals:
