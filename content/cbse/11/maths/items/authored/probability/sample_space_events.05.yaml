difficulty: 0.9
pool: practice
role: procedure
stem:
  en: How many outcomes of rolling three fair dice have all three faces different?
hints:
- level: 1
  en: Count the choices for each die in order.
- level: 2
  en: Each die must differ from all the earlier dice.
- level: 3
  en: Multiply the number of choices at each stage.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '120'
  accept: []
solution_steps:
- en: The first die has 6 choices, the second must differ from it in 5 ways and the third in 4 ways, giving 6 times 5 times 4 equal to 120.
- en: Answer = 120
tier: C
