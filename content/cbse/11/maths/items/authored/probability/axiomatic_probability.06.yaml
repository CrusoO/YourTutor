stem:
  en: P(A) is 0.5, P(B) is 0.4 and P(A or B) is 0.7. What is the probability that exactly one of the events A and B occurs?
hints:
- level: 1
  en: Find the probability that both events occur using the addition rule.
- level: 2
  en: Exactly one event occurs when the union is taken without the overlap.
- level: 3
  en: Subtract the overlap probability from the union probability.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
