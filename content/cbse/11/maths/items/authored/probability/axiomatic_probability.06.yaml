answer:
  sympy: '0.5'
  accept: []
solution_steps:
- en: P(A and B) is 0.5 plus 0.4 minus 0.7, which is 0.2, and exactly one occurs with probability 0.7 minus 0.2, which is 0.5.
- en: Answer = 0.5
