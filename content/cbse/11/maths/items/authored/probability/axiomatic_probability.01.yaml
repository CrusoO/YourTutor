stem:
  en: If the probability of event A is 0.3, what is the probability of the complement of A?
hints:
- level: 1
  en: Recall the rule that links an event and its complement.
- level: 2
  en: The two probabilities together cover the whole sample space.
- level: 3
  en: Subtract the given probability from the total probability of the sample space.
prediction_prompt:
