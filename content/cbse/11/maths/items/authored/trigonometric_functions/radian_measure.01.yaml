id: A.11.maths.trigonometric_functions.radian_measure.01
skill_ids:
- SK.A.11.maths.radian_measure
difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which expression gives the radian measure of a straight angle of 180 degrees?
hints:
- level: 1
  en: Recall how many radians make up one complete turn around a circle.
- level: 2
  en: A straight angle is half of that complete turn.
- level: 3
  en: Relate the degree measure of a straight angle to the radian measure of half a turn.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 2 pi radians
- id: b
  en: 180 pi radians
- id: c
  en: pi radians
- id: d
  en: pi divided by 180 radians
answer:
  sympy: c
  accept: []
misconception_rules:
- id: MC.A.605AD07D0C1E
  when_answer_equals:
  - a
- id: MC.A.50F6DD6BBC42
  when_answer_equals:
  - d
- id: MC.A.3550C9D2585D
  when_answer_equals:
  - b
solution_steps:
- en: A straight angle is half a full turn, and a full turn is 2 pi radians, so 180 degrees equals pi radians.
- en: The correct option is c.
tier: C
