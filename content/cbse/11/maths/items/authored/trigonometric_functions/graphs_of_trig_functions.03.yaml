role: explain
stem:
  en: What is the period of the function y equal to sin(4x)?
hints:
- level: 1
  en: Recall how the coefficient of the input changes the length of one cycle.
- level: 2
  en: Divide the full period of the basic sine function by that coefficient.
- level: 3
  en: Simplify the resulting fraction in terms of pi.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
