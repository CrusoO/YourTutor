stem:
  en: The function y equal to 3 sin x plus 1 has a maximum value M. What is M?
hints:
- level: 1
  en: Find the largest value the sine term can take.
- level: 2
  en: Scale that maximum by the coefficient in front of the sine.
- level: 3
  en: Add the vertical shift at the end to get the maximum output.
