stem:
  en: For an angle whose terminal side lies in the second quadrant, what is the sign of the tangent?
hints:
- level: 1
  en: Recall which of sine and cosine is positive in the second quadrant.
- level: 2
  en: Tangent is the ratio of sine to cosine.
- level: 3
  en: Work out the sign of that ratio from the two signs you recalled.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
