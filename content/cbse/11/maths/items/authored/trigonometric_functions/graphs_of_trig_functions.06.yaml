difficulty: 0.9
pool: practice
role: transfer
stem:
  en: How many times does the curve y equal to sin x meet the horizontal line y equal to one half over the interval from 0 to 2 pi?
hints:
- level: 1
  en: Solve sine of x equal to the given height to find the meeting points.
- level: 2
  en: Use the standard angle whose sine matches that height, then find its partner in the same half-turn.
- level: 3
  en: Check whether any endpoint of the interval also satisfies the equation.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: 3 times
- id: b
  en: 2 times
- id: c
  en: 1 time
- id: d
  en: 4 times
answer:
  sympy: b
  accept: []
