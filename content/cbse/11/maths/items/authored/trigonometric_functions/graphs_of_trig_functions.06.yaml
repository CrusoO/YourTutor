solution_steps:
- en: Sine equals one half at pi over 6 and 5 pi over 6, and no other point in the interval gives that value.
- en: The correct option is b.
tier: C
diagram_note: Coordinate axes with one full sine wave from 0 to 2 pi and a horizontal line drawn at a height of one half, with each meeting point marked.
