stem:
  en: A circle has radius 6 cm and a central angle of 2 radians. What is the arc length in centimetres?
hints:
- level: 1
  en: Arc length is the radius multiplied by the central angle in radians.
- level: 2
  en: The given angle is already in radians, so no conversion is needed.
- level: 3
  en: Multiply the radius by the angle and keep the unit of length.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
