difficulty: 0.6
pool: practice
role: procedure
stem:
  en: How many solutions does the equation 2 cos x minus 1 equal 0 have in the interval from 0 up to 2 pi?
hints:
- level: 1
  en: Rearrange the equation to isolate the cosine term.
- level: 2
  en: Find the standard angles whose cosine matches the resulting value.
- level: 3
  en: Check which of those angles fall inside the interval.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '2'
  accept: []
solution_steps:
- en: The equation becomes cos x equal to one half, which has solutions pi over 3 and 5 pi over 3 in this interval.
- en: Answer = 2
tier: C
