stem:
  en: Which trigonometric equation has no real solution for x?
hints:
- level: 1
  en: Recall the range of values that the sine function can produce.
- level: 2
  en: Compare the required output with the largest value sine can reach.
- level: 3
  en: Check whether tangent takes every real value on its own branches.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: sin x equal to one half
- id: b
  en: tan x equal to 5
- id: c
  en: sin x equal to 2
- id: d
  en: cos x equal to 0
answer:
  sympy: c
  accept: []
