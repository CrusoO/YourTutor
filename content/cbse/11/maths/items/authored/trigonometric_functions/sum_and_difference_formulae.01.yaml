stem:
  en: Which expression is equal to sin(A + B)?
hints:
- level: 1
  en: Recall the standard addition formula for the sine of a sum.
- level: 2
  en: Each term pairs a sine of one angle with a cosine of the other.
- level: 3
  en: Check that the sign between the two products is a plus.
