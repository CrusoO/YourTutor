difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A sector of a circle with radius 10 cm has an arc length of 15 cm. What is the central angle of the sector in radians?
hints:
- level: 1
  en: Recall the relationship between arc length, radius and the central angle.
- level: 2
  en: Rearrange that relationship to isolate the angle.
- level: 3
  en: Divide the arc length by the radius to find the angle.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '1.5'
  accept: []
solution_steps:
- en: Arc length equals radius times the angle in radians, so the angle is 15 divided by 10, which is 1.5 radians.
- en: The unit of the answer is rad.
- en: Answer = 1.5
tier: C
