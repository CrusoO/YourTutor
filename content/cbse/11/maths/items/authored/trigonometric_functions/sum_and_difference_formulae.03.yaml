stem:
  en: Using the difference formula for sine with 45 degrees and 30 degrees, what is sin 15 degrees rounded to three decimal places?
hints:
- level: 1
  en: Write the target angle as the difference of two standard angles.
- level: 2
  en: Apply the difference formula for sine to those two angles.
- level: 3
  en: Use exact values for the standard angles and round only at the end.
