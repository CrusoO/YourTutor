stem:
  en: The point that divides the segment joining (1, 1, 1) and (7, 7, 13) internally in the ratio 1 to 2, counted from the first point, has what z-coordinate?
hints:
- level: 1
  en: Apply the section formula to the third coordinate.
- level: 2
  en: Weight each endpoint coordinate by the part of the ratio on the opposite side.
- level: 3
  en: Divide by the total of the ratio parts.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '5'
  accept: []
solution_steps:
- en: The section formula gives z equal to (2 times 1 plus 1 times 13) over 3, which is 15 over 3, or 5.
- en: Answer = 5
tier: C
