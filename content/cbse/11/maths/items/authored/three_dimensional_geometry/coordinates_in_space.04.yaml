solution_steps:
- en: Reflection in the xy-plane keeps x and y unchanged and flips the sign of z, giving (2, 5, 1).
- en: The correct option is a.
tier: C
diagram_note: Three axes with a point marked above the xy-plane and its mirror image marked symmetrically below the plane, joined by a dashed perpendicular line.
