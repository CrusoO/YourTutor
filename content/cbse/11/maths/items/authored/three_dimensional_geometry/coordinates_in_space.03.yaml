stem:
  en: What is the distance of the point P(2, -3, 6) from the origin?
hints:
- level: 1
  en: Extend the two-dimensional distance formula by one more squared term.
- level: 2
  en: Square each coordinate, ignoring the signs.
- level: 3
  en: Add the squares and take the square root.
