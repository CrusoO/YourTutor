difficulty: 0.2
pool: practice
role: recall
stem:
  en: Which point is the midpoint of the segment joining (1, 2, 3) and (3, 4, 5)?
hints:
- level: 1
  en: The midpoint is found by averaging each coordinate separately.
- level: 2
  en: Add the first coordinates of the two endpoints and halve the result.
- level: 3
  en: Repeat the averaging for the second and third coordinates.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: (2, 3, 4)
- id: b
  en: (2, 3, 5)
- id: c
  en: (1, 1, 1)
- id: d
  en: (4, 6, 8)
answer:
  sympy: a
  accept: []
