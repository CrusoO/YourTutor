options:
- id: a
  en: all points with y equal to 2, with x and z arbitrary
- id: b
  en: the single point (2, 0, 0)
- id: c
  en: all points with x equal to 2 and y equal to 0
- id: d
  en: all points with x equal to 2, with y and z arbitrary
