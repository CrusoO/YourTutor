stem:
  en: Which set describes all the points on the plane x equal to 2?
hints:
- level: 1
  en: Identify which coordinate is held constant for a plane parallel to the yz-plane.
- level: 2
  en: The other two coordinates on that plane are free to vary.
- level: 3
  en: Describe the set using only the constraint that the fixed coordinate imposes.
prediction_prompt:
