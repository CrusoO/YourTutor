id: A.11.maths.three_dimensional_geometry.distance_and_section_3d.03
skill_ids:
- SK.A.11.maths.distance_and_section_3d
difficulty: 0.6
pool: practice
role: explain
stem:
  en: Point P divides the segment joining A(1, -2, 3) and B(4, 1, 6) internally in the ratio 2 to 1, measured from A. What is the x-coordinate of P?
hints:
- level: 1
  en: Use the section formula with the given internal ratio.
- level: 2
  en: Multiply each endpoint coordinate by the part of the ratio on the opposite side.
- level: 3
  en: Divide the sum by the total of the two ratio parts.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3'
  accept: []
solution_steps:
- en: The section formula gives x equal to (1 times 1 plus 2 times 4) over 3, which is 9 over 3, or 3.
- en: Answer = 3
tier: C
diagram_note: Segment AB in three dimensions with a point P marked between A and B, and the ratio of the two parts labelled 2 to 1 counting from A.
