stem:
  en: Points A(1, 2, 3) and B(3, -2, k) are 6 units apart. Find the positive value of k.
hints:
- level: 1
  en: Write the squared distance formula using the differences in each coordinate.
- level: 2
  en: Simplify the known terms and isolate the squared term involving k.
- level: 3
  en: Take the square root and keep the positive solution.
