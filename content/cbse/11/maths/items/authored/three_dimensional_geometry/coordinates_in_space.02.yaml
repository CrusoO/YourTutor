solution_steps:
- en: The octant with all three coordinates negative is the one diagonally opposite the first octant, where every coordinate is positive.
- en: The correct option is a.
tier: C
diagram_note: Three axes meeting at the origin dividing space into eight regions, with the opposite of the first region marked.
