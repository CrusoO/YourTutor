id: A.11.maths.three_dimensional_geometry.coordinates_in_space.02
skill_ids:
- SK.A.11.maths.coordinates_in_space
difficulty: 0.2
pool: practice
role: recall
stem:
  en: In which octant do all three coordinates of a point have negative signs?
hints:
- level: 1
  en: Think about how the sign of each axis changes as you move through the space.
- level: 2
  en: The first octant has all three coordinates positive.
- level: 3
  en: Find the octant that flips every sign relative to the first one.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: mcq
options:
- id: a
  en: the octant opposite the first octant
- id: b
  en: the first octant
- id: c
  en: the octant where only the z coordinate is negative
- id: d
  en: the octant where only the x and y coordinates are negative
answer:
  sympy: a
  accept: []
misconception_rules:
- id: MC.A.6C40E87F1CBB
  when_answer_equals:
  - b
- id: MC.A.260D22F7C3A2
  when_answer_equals:
