stem:
  en: In Pascal's triangle with rows numbered from zero at the top and entries numbered from zero within each row, what is the entry in row 5, position 2?
hints:
- level: 1
  en: Each entry is a binomial coefficient whose top index is the row number.
- level: 2
  en: The position within the row gives the lower index.
- level: 3
  en: Evaluate the binomial coefficient with those two indices.
