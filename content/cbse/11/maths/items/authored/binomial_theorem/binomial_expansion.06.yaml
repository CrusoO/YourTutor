stem:
  en: The coefficient of x squared in the expansion of (1 + x) to the power n is 15. What is the value of the positive integer n?
hints:
- level: 1
  en: Write the coefficient of x squared in terms of n using the binomial formula.
- level: 2
  en: Set that expression equal to the given coefficient.
- level: 3
  en: Solve the resulting equation for the positive integer.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: The coefficient of x squared is C(n, 2), which equals n times (n minus 1) over 2, and setting this to 15 gives n equal to 6.
- en: Answer = 6
tier: C
