stem:
  en: Find the term that does not contain x in the expansion of (x plus 1 divided by x) to the power 6. What is its numerical coefficient?
hints:
- level: 1
  en: Write the general term and collect the exponents of x from both factors.
- level: 2
  en: Set the total exponent of x equal to zero.
- level: 3
  en: Use the index you find in the binomial coefficient.
