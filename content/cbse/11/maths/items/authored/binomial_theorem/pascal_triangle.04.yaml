stem:
  en: Using Pascal's rule, the entry in row 6 at position 3 is the sum of two entries in row 5. What is the value of that entry in row 6?
hints:
- level: 1
  en: Identify the two entries in the previous row that sit directly above the target.
- level: 2
  en: Recall the rule that each entry equals the sum of the two entries above it.
- level: 3
  en: Look up or compute the two entries you identified and add them.
