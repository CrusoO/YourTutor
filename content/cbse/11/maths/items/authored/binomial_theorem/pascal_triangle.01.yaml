difficulty: 0.2
pool: practice
role: recall
stem:
  en: In Pascal's triangle, which row holds the entries 1, 4, 6, 4 and 1 when rows are numbered from zero at the top?
hints:
- level: 1
  en: Count the rows downward from the top, starting at zero.
- level: 2
  en: Compare the entries with the coefficients of a binomial expansion of the same power.
- level: 3
  en: Check how many entries that row has and match it to its power.
prediction_prompt:
