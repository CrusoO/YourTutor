stem:
  en: In the expansion of (x + 1) cubed, what is the coefficient of x?
hints:
- level: 1
  en: Expand the cube by choosing the x term from some of the factors and the constant from the rest.
- level: 2
  en: Count the ways to pick exactly one x among the three factors.
- level: 3
  en: Make sure you collect every term that has the variable to the first power.
