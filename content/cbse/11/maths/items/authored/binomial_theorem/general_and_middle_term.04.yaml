stem:
  en: What is the coefficient of the middle term in the expansion of (2 + x) to the power 4?
hints:
- level: 1
  en: A power of four produces a total number of terms that has a single central one.
- level: 2
  en: The middle term takes half of the total power from the variable part.
- level: 3
  en: Multiply the binomial coefficient by the constant raised to the matching power.
