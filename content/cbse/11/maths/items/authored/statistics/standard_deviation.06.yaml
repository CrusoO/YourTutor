id: A.11.maths.statistics.standard_deviation.06
skill_ids:
- SK.A.11.maths.standard_deviation
difficulty: 0.9
pool: practice
role: transfer
stem:
  en: A set of 10 values has mean 4 and the sum of their squares is 260. What is the standard deviation, rounded to two decimal places?
hints:
- level: 1
  en: Use the shortcut that expresses variance using the mean of the squares and the square of the mean.
- level: 2
  en: Compute the mean of the squares from the given sum and the number of values.
- level: 3
  en: Subtract the square of the mean and take the square root, rounding at the end.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '3.16'
  accept: []
solution_steps:
- en: The variance is 260 over 10 minus 4 squared, which is 26 minus 16, equal to 10, and its square root is about 3.16.
- en: Answer = 3.16
tier: C
