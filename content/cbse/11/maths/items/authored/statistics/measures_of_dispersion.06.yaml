  author: model-draft
type: mcq
options:
- id: a
  en: the comparison needs the sample sizes
- id: b
  en: they are equally spread out
- id: c
  en: set A
- id: d
  en: set B
answer:
  sympy: d
  accept: []
misconception_rules:
