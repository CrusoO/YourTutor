stem:
  en: Two data sets have the same mean. Set A has variance 4 and set B has variance 9. Which set is more spread out?
hints:
- level: 1
  en: Recall what a larger variance means about the distances from the mean.
- level: 2
  en: The means being equal removes one difference between the sets.
- level: 3
  en: Compare the two variances directly.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
