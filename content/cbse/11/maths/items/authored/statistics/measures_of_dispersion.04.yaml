stem:
  en: For five observations, the sum of the values is 25 and the sum of their squares is 135. What is the variance?
hints:
- level: 1
  en: Use the shortcut that relates variance to the mean of the squares and the square of the mean.
- level: 2
  en: Divide the sum of values and the sum of squares by the number of observations.
- level: 3
  en: Subtract the square of the mean from the mean of the squares.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
