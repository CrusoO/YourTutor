id: A.11.maths.statistics.standard_deviation.03
skill_ids:
- SK.A.11.maths.standard_deviation
difficulty: 0.6
pool: practice
role: explain
stem:
  en: The standard deviation of a data set is 3. If every value is multiplied by 2, what is the new standard deviation?
hints:
- level: 1
  en: Consider how a scale factor on every value affects the deviations from the mean.
- level: 2
  en: The variance scales with the square of the factor, so the standard deviation scales with the factor itself.
- level: 3
  en: Multiply the original standard deviation by the scale factor.
prediction_prompt:
  en: Before you work it out, what do you think the answer will be, and why?
status: draft
provenance:
  original: true
  author: model-draft
type: numeric
answer:
  sympy: '6'
  accept: []
solution_steps:
- en: Multiplying each value by a constant multiplies the standard deviation by the same constant, so 3 times 2 gives 6.
- en: Answer = 6
tier: C
