- id: a
  en: the mean of the squared deviations from the mean
- id: b
  en: the difference between the largest and smallest values
- id: c
  en: the mean of the absolute deviations from the mean
- id: d
  en: the square root of the mean deviation
answer:
  sympy: a
  accept: []
