  - topic: physical_properties_metals
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are metals malleable, meaning they can be hammered into thin sheets?"
    correct: "Layers of atoms can slide over one another while the metallic bonding stays intact"
    unit: ""
    wrong:
      - {text: "Their atoms form rigid covalent chains that cannot move", mistake: "gives metals the structure of non-metals"}
