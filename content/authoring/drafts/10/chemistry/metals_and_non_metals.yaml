      - {text: "It moves into the nucleus of the chlorine atom", mistake: "confuses an electron with a proton"}
    explanation: "Sodium loses its outer electron to form Na+, and chlorine gains it to form Cl-. The opposite charges attract, forming an ionic bond."
    hints:
      - "Consider which atom needs one electron to complete its outer shell."
      - "Think about whether sodium gains or loses electrons."
      - "Ask which particles attract each other in an ionic compound."
