      - {text: "They have a very low density", mistake: "links density with malleability"}
    explanation: "In a metal the bonding is not fixed in one direction. When layers of atoms slide, the free electrons keep them bonded, so the metal changes shape without breaking."
    hints:
      - "Think about how atoms are held together in a metal."
      - "Consider the role of electrons in a metallic structure."
      - "Ask what happens to bonds when layers are pushed past one another."
