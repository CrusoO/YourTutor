class: 10
subject: chemistry
chapter: periodic_classification_of_elements
drafted_by: "claude-haiku-5.5 (unchecked draft)"
items:
  - topic: mendeleev_table
    type: mcq
    difficulty: easy
    role: recall
    stem: "On what basis did Mendeleev first arrange the elements in his periodic table?"
    correct: "Increasing atomic mass, with elements of similar properties placed together"
    unit: ""
    wrong:
      - {text: "Increasing atomic number", mistake: "uses the modern rule, which Mendeleev did not have"}
      - {text: "Alphabetical order of element names", mistake: "assumes the table was arranged for convenience of names"}
      - {text: "Increasing density", mistake: "uses a physical property that was not his basis"}
    explanation: "Mendeleev ordered the elements by atomic mass and grouped those with similar properties in the same column."
    hints:
      - "Think about the property of an atom that was measurable in his time."
      - "Recall what Mendeleev used before the atomic number was known."
      - "Consider the purpose of grouping elements with similar properties."
    diagram: null
    confidence: high

  - topic: mendeleev_table
    type: mcq
    difficulty: easy
    role: recall
    stem: "What did Mendeleev do about the gaps in his table where no known element fitted?"
    correct: "He left the gaps and predicted the properties of the missing elements"
    unit: ""
    wrong:
      - {text: "He filled each gap with an element that was already placed", mistake: "assumes the gaps were errors that repeat known elements"}
      - {text: "He removed the gaps by moving elements into different groups at random", mistake: "thinks random moving was his method"}
      - {text: "He ignored the gaps because they could not be explained", mistake: "assumes the table had no predictive role"}
    explanation: "Mendeleev predicted that undiscovered elements would fill the gaps, and estimated their properties from their neighbours in the table."
    hints:
      - "Think about what a gap in a pattern suggests."
      - "Recall what Mendeleev's table was useful for."
      - "Consider whether a gap reflects missing knowledge."
    diagram: null
    confidence: high

  - topic: mendeleev_table
    type: mcq
    difficulty: medium
    role: explain
    stem: "Mendeleev placed tellurium before iodine in his table, even though tellurium has the higher atomic mass. Why?"
    correct: "Tellurium's chemical properties matched its group better, so properties were given priority over mass"
    unit: ""
    wrong:
      - {text: "Tellurium is a metal, and metals always come first", mistake: "assumes a placement rule that did not exist"}
      - {text: "The atomic mass of iodine was measured incorrectly and so was not used", mistake: "assumes the mass error was the reason for the order"}
      - {text: "Iodine had no known chemical properties", mistake: "assumes there was no information about iodine"}
    explanation: "Mendeleev gave priority to chemical properties where the order by mass conflicted with the pattern of the groups. This is why tellurium was placed before iodine."
    hints:
      - "Think about the rule Mendeleev used when mass and properties disagreed."
      - "Consider which property was most important for grouping elements."
      - "Ask whether his table was based on mass alone."
    diagram: null
    confidence: low

  - topic: mendeleev_table
    type: mcq
    difficulty: medium
    role: recall
    stem: "Mendeleev predicted an element he called eka-silicon. Which element was later discovered to fill this gap?"
    correct: "Germanium"
    unit: ""
    wrong:
      - {text: "Gallium", mistake: "uses the gap predicted for eka-aluminium"}
      - {text: "Scandium", mistake: "uses the gap predicted for eka-boron"}
      - {text: "Silicon", mistake: "assumes the predicted element is already known"}
    explanation: "Germanium was discovered later and matched the properties Mendeleev had predicted for eka-silicon."
    hints:
      - "Think about which element lies directly below silicon in the same group."
      - "Recall the elements discovered later that filled Mendeleev's gaps."
      - "Consider an element that was found after the table was published."
    diagram: null
    confidence: high

  - topic: mendeleev_table
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which limitation of Mendeleev's table was not resolved by his arrangement?"
    correct: "Some elements had to be placed out of order by mass, and no reason for this was given"
    unit: ""
    wrong:
      - {text: "It had no gaps for undiscovered elements", mistake: "forgets that Mendeleev deliberately left gaps"}
      - {text: "It used atomic number to order the elements", mistake: "assumes atomic number was the basis of his table"}
      - {text: "It included the noble gases in their own group", mistake: "assumes the noble gases were known and placed when the table was made"}
    explanation: "Mendeleev reversed some pairs by mass to keep the properties in order. The underlying cause was not known until atomic number was identified."
    hints:
      - "Think about which rule had to be broken to keep elements with similar properties together."
      - "Recall what the modern table has that Mendeleev's table lacked."
      - "Consider whether the table could explain its own exceptions."
    diagram: null
    confidence: medium

  - topic: mendeleev_table
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why was Mendeleev's periodic table considered a success even before the atomic number was known?"
    correct: "Grouping by similar properties let him predict the properties of missing elements, which were later confirmed"
    unit: ""
    wrong:
      - {text: "He measured the masses of all unknown elements directly", mistake: "assumes predictions were based on measuring unknown elements"}
      - {text: "He used a computer to model the gaps before any discovery", mistake: "anachronistically assumes computing was available"}
      - {text: "The gaps were filled by chance, and he simply kept them", mistake: "treats the table as a lucky arrangement"}
    explanation: "The arrangement showed where elements were missing and what their properties should be. When gallium, scandium and germanium were found, their properties matched his predictions."
    hints:
      - "Think about what the gaps told Mendeleev about the elements."
      - "Consider how the later discoveries matched the pattern of the table."
      - "Ask what kind of reasoning a periodic pattern allows."
    diagram: null
    confidence: high

  - topic: modern_periodic_table
    type: mcq
    difficulty: easy
    role: recall
    stem: "The modern periodic table arranges the elements in order of which property?"
    correct: "Increasing atomic number"
    unit: ""
    wrong:
      - {text: "Increasing atomic mass", mistake: "uses Mendeleev's rule, which the modern table replaced"}
      - {text: "Alphabetical order of symbols", mistake: "assumes the table orders elements by their symbols"}
      - {text: "Increasing number of neutrons", mistake: "confuses neutrons with protons"}
    explanation: "The modern table is arranged by atomic number, the number of protons in an atom's nucleus, so each element has a unique place."
    hints:
      - "Recall which particle defines the identity of an element."
      - "Think about how the modern table differs from Mendeleev's rule."
      - "Consider which number is unique to each element."
    diagram: null
    confidence: high

  - topic: modern_periodic_table
    type: mcq
    difficulty: easy
    role: recall
    stem: "How many periods does the modern periodic table have?"
    correct: "Seven"
    unit: ""
    wrong:
      - {text: "Eighteen", mistake: "confuses periods with groups"}
      - {text: "Nine", mistake: "counts the two separate rows of f-block elements as extra periods"}
      - {text: "Six", mistake: "miscounts the horizontal rows"}
    explanation: "The modern table has seven horizontal rows, called periods. The vertical columns are the 18 groups."
    hints:
      - "Think about what the horizontal rows are called."
      - "Recall the difference between a period and a group."
      - "Count the horizontal rows in the table."
    diagram: null
    confidence: high

  - topic: modern_periodic_table
    type: mcq
    difficulty: medium
    role: recall
    stem: "Which group of the modern periodic table contains the noble gases?"
    correct: "Group 18"
    unit: ""
    wrong:
      - {text: "Group 1", mistake: "confuses noble gases with the alkali metals"}
      - {text: "Group 17", mistake: "confuses noble gases with the halogens"}
      - {text: "Group 2", mistake: "assumes the noble gases follow the alkaline earth metals"}
    explanation: "Noble gases such as helium, neon and argon are in the last column, group 18, and have full outer shells."
    hints:
      - "Think about the last column of the table."
      - "Recall which group has the most stable electron arrangement."
      - "Consider which group's elements are very unreactive."
    diagram: null
    confidence: high

  - topic: modern_periodic_table
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do elements in the same group of the modern table show similar chemical properties?"
    correct: "They have the same number of valence electrons"
    unit: ""
    wrong:
      - {text: "They have the same atomic mass", mistake: "uses atomic mass as the basis for chemical similarity"}
      - {text: "They have the same number of neutrons", mistake: "confuses neutrons with the electrons that drive reactions"}
      - {text: "All the elements in every group are metals or all are non-metals", mistake: "assumes a group is uniformly metallic"}
    explanation: "Chemical behaviour depends mainly on the outer electrons, so elements with the same number of valence electrons react in similar ways."
    hints:
      - "Think about which electrons take part in chemical reactions."
      - "Consider what is shared across an entire column of the table."
      - "Ask which particles determine how atoms bond."
    diagram: null
    confidence: high

  - topic: modern_periodic_table
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Element X has atomic number 19. Which group and period does it belong to?"
    correct: "Group 1, period 4"
    unit: ""
    wrong:
      - {text: "Group 19, period 1", mistake: "uses the atomic number as the group number"}
      - {text: "Group 2, period 4", mistake: "miscounts the valence electrons"}
      - {text: "Group 1, period 3", mistake: "miscounts the number of shells"}
    explanation: "Atomic number 19 gives the electron arrangement 2, 8, 8, 1. There is one valence electron, which places it in group 1, and four shells, which places it in period 4."
    hints:
      - "Work out the electron arrangement from the atomic number."
      - "Count how many shells the electrons fill."
      - "The number of valence electrons gives the group for main-group elements."
    diagram: null
    confidence: high

  - topic: modern_periodic_table
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why are isotopes of the same element placed in the same position in the modern periodic table?"
    correct: "Isotopes have the same atomic number, so they have the same chemical behaviour"
    unit: ""
    wrong:
      - {text: "Isotopes have the same mass number", mistake: "uses mass as the basis for placing elements"}
      - {text: "Isotopes have different numbers of protons", mistake: "confuses isotopes with different elements"}
      - {text: "Isotopes are placed in separate groups by their mass", mistake: "assumes the table separates isotopes by mass"}
    explanation: "Isotopes differ only in neutron number, so they share the same electron arrangement and chemistry. The table places elements by atomic number, so they occupy one place."
    hints:
      - "Think about what changes between isotopes and what stays the same."
      - "Recall what determines the identity of an element."
      - "Consider which particle differs between isotopes."
    diagram: null
    confidence: high

  - topic: periodic_trends
    type: mcq
    difficulty: easy
    role: recall
    stem: "Moving down a group of the periodic table, how does atomic size change?"
    correct: "It increases, because each step down adds a new shell"
    unit: ""
    wrong:
      - {text: "It decreases, because the nuclear charge increases", mistake: "assumes the stronger pull dominates down a group"}
      - {text: "It stays the same, because the number of valence electrons is constant", mistake: "assumes equal valence electrons means equal size"}
      - {text: "It increases and then decreases", mistake: "assumes the pattern across a period also applies down a group"}
    explanation: "Going down a group, each element adds an electron shell, which moves the outer electrons further from the nucleus."
    hints:
      - "Think about how many shells an atom has when you go down a column."
      - "Consider how far the outer electrons are from the nucleus."
      - "Ask whether each step adds a new layer of electrons."
    diagram: "Draw three atoms stacked vertically, each with its electron shells drawn as rings. The outer ring of each atom should lie further from the nucleus than the ring of the atom above it."
    confidence: high

  - topic: periodic_trends
    type: mcq
    difficulty: easy
    role: recall
    stem: "Moving from left to right across a period, how does metallic character change?"
    correct: "It decreases"
    unit: ""
    wrong:
      - {text: "It increases", mistake: "assumes atoms with more electrons are more metallic"}
      - {text: "It stays the same across the period", mistake: "assumes metallic character depends only on the period"}
      - {text: "It rises and then falls back to the starting value", mistake: "imagines a symmetrical pattern across a row"}
    explanation: "Across a period the elements change from metals on the left to non-metals on the right, so metallic character falls."
    hints:
      - "Recall where the metals are found in the table."
      - "Think about how readily atoms lose electrons as you move to the right."
      - "Consider the type of element at the far right of a period."
    diagram: null
    confidence: high

  - topic: periodic_trends
    type: mcq
    difficulty: medium
    role: explain
    stem: "Across period 3, from sodium to chlorine, how does atomic size change, and why?"
    correct: "It decreases, because the nuclear charge rises while the electrons stay in the same shell"
    unit: ""
    wrong:
      - {text: "It increases, because more electrons are added", mistake: "assumes more electrons always make a larger atom"}
      - {text: "It stays the same, because all these atoms have three shells", mistake: "assumes the same shell count means the same size"}
      - {text: "It increases and then decreases", mistake: "assumes a pattern in the middle of the period"}
    explanation: "Atoms across a period fill the same shell, but each step adds a proton. The stronger pull of the nucleus draws the electrons in, so the atom gets smaller."
    hints:
      - "Think about how many protons are added across the period."
      - "Consider whether new shells are added across a period."
      - "Ask how the nucleus affects the outer electrons."
    diagram: "Draw a row of atoms from sodium to chlorine, labelled with their symbols, with circles whose size shrinks from left to right."
    confidence: high

  - topic: periodic_trends
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do group 1 elements lose electrons readily?"
    correct: "They have one valence electron, which is easily lost to reach a stable outer shell"
    unit: ""
    wrong:
      - {text: "They have seven valence electrons which they lose", mistake: "miscounts the valence electrons of group 1"}
      - {text: "They already have a full outer shell", mistake: "reverses the outer shell situation"}
      - {text: "They have no electrons in their outer shell", mistake: "misreads the electron count"}
    explanation: "Group 1 elements have a single outer electron far from the nucleus. Losing it is relatively easy and leaves a stable arrangement."
    hints:
      - "Count the valence electrons in a group 1 atom."
      - "Think about how far the outer electron is from the nucleus."
      - "Consider whether losing or gaining electrons gives a stable arrangement."
    diagram: null
    confidence: high

  - topic: periodic_trends
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Among sodium, magnesium and aluminium in period 3, which has the largest atomic radius, and why?"
    correct: "Sodium, because it has the fewest protons and so the weakest pull on its outer electrons"
    unit: ""
    wrong:
      - {text: "Aluminium, because it has the most electrons", mistake: "assumes more electrons always give a larger atom"}
      - {text: "Magnesium, because it has an extra shell", mistake: "assumes magnesium is in a lower period"}
      - {text: "All three are equal, because they share a period", mistake: "assumes atoms in the same period have the same size"}
    explanation: "Across period 3 the nuclear charge increases from sodium to aluminium, pulling the electrons closer. Sodium is therefore the largest of the three."
    hints:
      - "Compare the number of protons in each atom."
      - "Think about the trend in size across a period."
      - "Consider how the nucleus affects the outer electrons."
    diagram: "Draw three atoms in a row labelled sodium, magnesium and aluminium, each with three shells. The circles should get smaller from left to right."
    confidence: high

  - topic: periodic_trends
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Element A lies directly below element B in the same group. Which statement is correct?"
    correct: "A has a larger atomic size and is more metallic than B"
    unit: ""
    wrong:
      - {text: "A has a smaller atomic size and is less metallic than B", mistake: "reverses the trend down a group"}
      - {text: "A has the same size as B and is equally metallic", mistake: "assumes the elements of a group are identical"}
      - {text: "A has fewer shells than B and is less metallic", mistake: "reverses the shell count"}
    explanation: "Moving down a group adds a shell, so the atom is larger. Its outer electrons are lost more easily, so metallic character increases."
    hints:
      - "Think about how many shells the element below has."
      - "Consider how far the outer electrons are from the nucleus."
      - "Ask how easily the outer electrons are lost going down a group."
    diagram: null
    confidence: high
