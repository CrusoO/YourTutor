items:
  - topic: chemical_equations
    type: mcq
    difficulty: easy
    role: recall
    stem: "In a word equation, what do the names written after the arrow stand for?"
    correct: "The products formed in the reaction"
    unit: ""
    wrong:
      - {text: "The reactants used up in the reaction", mistake: "reads the arrow backwards and treats the right side as the starting material"}
      - {text: "The catalysts that speed up the reaction", mistake: "assumes every substance written in an equation is a catalyst"}
      - {text: "The solvents the reaction is carried out in", mistake: "assumes every substance written in an equation is a solvent"}
    explanation: "The arrow points from reactants to products. Substances written after the arrow are the products that are formed."
    hints:
      - "Look at which side of the arrow the starting substances are written on."
      - "Think about the direction the arrow points."
      - "Recall what a catalyst does and whether it is used up."
    diagram: null
    confidence: high

  - topic: chemical_equations
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which skeletal equation correctly represents hydrogen gas reacting with oxygen gas to form water?"
    correct: "H2 + O2 -> H2O"
    unit: ""
    wrong:
      - {text: "H + O -> H2O", mistake: "writes single atoms instead of the diatomic molecules of the gases"}
      - {text: "H2 + O2 -> HO2", mistake: "gets the formula of water wrong by swapping the subscripts"}
      - {text: "H2O -> H2 + O2", mistake: "reverses the direction of the reaction"}
    explanation: "Hydrogen and oxygen exist as diatomic molecules, H2 and O2, and water is H2O. A skeletal equation shows these formulas with an arrow and does not need to be balanced."
    hints:
      - "Recall the diatomic form of each gas."
      - "Check the formula of water."
      - "Make sure the reactants are on the left of the arrow."
    diagram: null
    confidence: high

  - topic: chemical_equations
    type: mcq
    difficulty: medium
    role: explain
    stem: "Which statement about a skeletal chemical equation is correct?"
    correct: "It shows the formulas of the reactants and products but does not yet show the number of atoms of each element on both sides"
    unit: ""
    wrong:
      - {text: "It always has equal numbers of each atom on both sides", mistake: "assumes that writing formulas already means the equation is balanced"}
      - {text: "It names the substances in words instead of formulas", mistake: "confuses a skeletal equation with a word equation"}
      - {text: "It shows the energy change written as a number", mistake: "adds information that is not part of the equation"}
    explanation: "A skeletal equation gives the formulas only. Balancing it, so that each element has the same count on both sides, is a separate step."
    hints:
      - "Think about what the word skeletal suggests."
      - "Ask whether the counts of atoms are shown or checked."
      - "Compare it with a word equation and with a balanced equation."
    diagram: null
    confidence: high

  - topic: chemical_equations
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Calcium carbonate is heated strongly and breaks down into calcium oxide and carbon dioxide. Which word equation represents this?"
    correct: "calcium carbonate -> calcium oxide + carbon dioxide"
    unit: ""
    wrong:
      - {text: "calcium oxide + carbon dioxide -> calcium carbonate", mistake: "reverses the reactants and products"}
      - {text: "calcium -> calcium oxide + carbon dioxide", mistake: "leaves out the carbonate part of the reactant"}
      - {text: "calcium carbonate + carbon dioxide -> calcium oxide", mistake: "treats carbon dioxide as a reactant when it is a product"}
    explanation: "Heating splits one reactant into two products, so calcium carbonate goes before the arrow and the two products go after it."
    hints:
      - "Identify the single substance the reaction starts with."
      - "Write down the substances that the heating produces."
      - "Keep the arrow pointing in the direction the reaction goes."
    diagram: null
    confidence: high

  - topic: chemical_equations
    type: mcq
    difficulty: hard
    role: apply
    stem: "Magnesium burns in nitrogen gas to form magnesium nitride, which contains magnesium and nitrogen in the ratio 3 to 2. Which skeletal equation is correct?"
    correct: "Mg + N2 -> Mg3N2"
    unit: ""
    wrong:
      - {text: "Mg + N2 -> MgN2", mistake: "assumes magnesium and nitrogen combine one to one"}
      - {text: "Mg + N -> Mg3N2", mistake: "uses single nitrogen atoms instead of nitrogen molecules"}
      - {text: "Mg + N2 -> Mg2N3", mistake: "swaps the subscripts in the product formula"}
    explanation: "Magnesium forms Mg2+ and nitride forms N3-, so three magnesium ions balance two nitride ions, giving Mg3N2. Nitrogen gas is the diatomic molecule N2."
    hints:
      - "Nitrogen gas exists as diatomic molecules."
      - "Think about the charges on the magnesium and nitride ions."
      - "The product formula must be electrically neutral overall."
    diagram: null
    confidence: high

  - topic: chemical_equations
    type: mcq
    difficulty: hard
    role: explain
    stem: "In the equation Zn(s) + 2HCl(aq) -> ZnCl2(aq) + H2(g), what does the symbol (aq) tell you about the zinc chloride?"
    correct: "It is dissolved in water"
    unit: ""
    wrong:
      - {text: "It is a gas given off during the reaction", mistake: "confuses the symbol (aq) with the gas symbol (g)"}
      - {text: "It is a solid that settles out of the mixture", mistake: "confuses the symbol (aq) with the solid symbol (s)"}
      - {text: "It is the acid that was used up completely", mistake: "reads the symbol as a note about an excess reagent"}
    explanation: "The state symbol (aq) means aqueous, that is dissolved in water. The symbols (s), (l) and (g) mean solid, liquid and gas."
    hints:
      - "Look up what the letters aq stand for."
      - "Compare with the other state symbols in the equation."
      - "Think about the medium in which the reaction takes place."
    diagram: null
    confidence: high

  - topic: types_of_reactions
    type: mcq
    difficulty: easy
    role: recall
    stem: "What type of reaction is shown by calcium oxide reacting with water to form calcium hydroxide, CaO + H2O -> Ca(OH)2?"
    correct: "Combination"
    unit: ""
    wrong:
      - {text: "Decomposition", mistake: "reads the reaction as one compound splitting, and treats water as a product"}
      - {text: "Double displacement", mistake: "looks for ions swapping partners when only two reactants join"}
      - {text: "Displacement", mistake: "assumes any reaction involving water is a displacement"}
    explanation: "Two reactants join to give a single product, which is a combination reaction."
    hints:
      - "Count how many substances are on the left of the arrow."
      - "Count the products on the right side."
      - "Check whether any element or ion is swapped out."
    diagram: null
    confidence: high

  - topic: types_of_reactions
    type: mcq
    difficulty: easy
    role: recall
    stem: "A reaction in which one substance breaks down into two or more simpler substances is called what?"
    correct: "Decomposition"
    unit: ""
    wrong:
      - {text: "Combination", mistake: "reverses the meaning of breaking down and joining"}
      - {text: "Neutralisation", mistake: "links breakdown with acid-base reactions"}
      - {text: "Displacement", mistake: "thinks any single change must replace an element"}
    explanation: "Decomposition means breaking up: one reactant gives two or more products. Heating a carbonate is a common example."
    hints:
      - "Think about what the prefix de- suggests."
      - "Compare the number of reactants with the number of products."
      - "Recall how a carbonate behaves when it is heated."
    diagram: null
    confidence: high

  - topic: types_of_reactions
    type: mcq
    difficulty: medium
    role: apply
    stem: "Silver nitrate solution reacts with sodium chloride solution to give a white precipitate of silver chloride and sodium nitrate solution: AgNO3(aq) + NaCl(aq) -> AgCl(s) + NaNO3(aq). Which type of reaction is this?"
    correct: "Double displacement"
    unit: ""
    wrong:
      - {text: "Combination", mistake: "sees two reactants and assumes they join into one product"}
      - {text: "Displacement", mistake: "assumes one element must be replaced by another"}
      - {text: "Decomposition", mistake: "treats the precipitate as a breakdown product"}
    explanation: "The silver and sodium ions swap partners, giving two new compounds. Two compounds exchanging ions this way is a double displacement reaction."
    hints:
      - "Note how many compounds are on each side of the arrow."
      - "Check whether the ions exchange partners."
      - "Notice which pairs of ions end up together in the products."
    diagram: null
    confidence: high

  - topic: types_of_reactions
    type: mcq
    difficulty: medium
    role: explain
    stem: "Iron nails placed in copper sulphate solution gradually become coated with reddish copper: Fe + CuSO4 -> FeSO4 + Cu. Why is this called a displacement reaction?"
    correct: "Iron takes the place of copper in the compound, which is set free as the element"
    unit: ""
    wrong:
      - {text: "Copper and iron combine to make a single compound", mistake: "confuses displacement with combination"}
      - {text: "Heat must be supplied before the reaction can start", mistake: "thinks heat is what defines a displacement"}
      - {text: "Both reactants split into simpler substances", mistake: "confuses displacement with decomposition"}
    explanation: "A more reactive metal displaces a less reactive metal from its compound. Iron is more reactive than copper, so copper is set free as the element."
    hints:
      - "Look at which element ends up on its own in the products."
      - "Track which element leaves the compound."
      - "Think about how the two metals compare in reactivity."
    diagram: null
    confidence: high

  - topic: types_of_reactions
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Lead nitrate solution is added to potassium iodide solution, and a yellow solid of lead iodide forms. Which type of reaction is this?"
    correct: "Double displacement"
    unit: ""
    wrong:
      - {text: "Decomposition", mistake: "treats the solid that forms as the product of breaking one compound down"}
      - {text: "Combination", mistake: "assumes two reactants always join to make one product"}
      - {text: "Displacement", mistake: "thinks iodide was pushed out by nitrate, not that the ions swapped partners"}
    explanation: "Lead ions and iodide ions swap partners to form insoluble lead iodide and aqueous potassium nitrate. Exchange of partners between two compounds is double displacement."
    hints:
      - "Count the compounds on each side of the equation."
      - "Track which ions move from one compound into another."
      - "Check whether any single element is set free."
    diagram: null
    confidence: high

  - topic: types_of_reactions
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Calcium carbonate absorbs heat as it breaks into calcium oxide and carbon dioxide. Which feature identifies this as a decomposition reaction?"
    correct: "One reactant gives two or more simpler products"
    unit: ""
    wrong:
      - {text: "Two elements combine into one compound", mistake: "mixes up decomposition with combination"}
      - {text: "A more reactive element takes the place of another in a compound", mistake: "confuses decomposition with displacement"}
      - {text: "Heat is released to the surroundings", mistake: "confuses an endothermic change with an exothermic one"}
    explanation: "The single reactant breaks into two simpler products, which makes it decomposition even though heat is absorbed. Heat change is a separate way of describing a reaction."
    hints:
      - "Count the reactants and the products."
      - "Separate the question of heat from the question of how many substances take part."
      - "Focus on the number of substances on each side."
    diagram: null
    confidence: high

  - topic: oxidation_reduction
    type: mcq
    difficulty: easy
    role: recall
    stem: "In terms of oxygen, what is oxidation?"
    correct: "Gain of oxygen by a substance"
    unit: ""
    wrong:
      - {text: "Loss of oxygen by a substance", mistake: "reverses the definitions of oxidation and reduction"}
      - {text: "Addition of a metal to a compound", mistake: "thinks any addition to a compound is oxidation"}
      - {text: "Gain of hydrogen by a substance", mistake: "mixes up oxidation with reduction, which is gain of hydrogen"}
    explanation: "Oxidation is gain of oxygen, or equivalently loss of hydrogen. Reduction is the opposite: loss of oxygen or gain of hydrogen."
    hints:
      - "Recall the two processes as opposites of each other."
      - "Think about what is being added or removed in each process."
      - "Focus on oxygen first."
    diagram: null
    confidence: high

  - topic: oxidation_reduction
    type: mcq
    difficulty: easy
    role: recall
    stem: "In the reaction CuO + H2 -> Cu + H2O, which substance is reduced?"
    correct: "Copper oxide"
    unit: ""
    wrong:
      - {text: "Hydrogen", mistake: "picks the substance that gains oxygen, which is the one oxidised"}
      - {text: "Water", mistake: "picks the product that contains oxygen"}
      - {text: "Copper", mistake: "names the product instead of the reactant that lost oxygen"}
    explanation: "Copper oxide loses oxygen, so it is reduced. Hydrogen gains oxygen to form water, so it is oxidised."
    hints:
      - "Find which reactant loses oxygen."
      - "Identify which reactant gains oxygen."
      - "Check the reactants rather than the products."
    diagram: null
    confidence: high

  - topic: oxidation_reduction
    type: mcq
    difficulty: medium
    role: apply
    stem: "In the reaction 2Mg + O2 -> 2MgO, which substance is oxidised?"
    correct: "Magnesium"
    unit: ""
    wrong:
      - {text: "Oxygen", mistake: "assumes the non-metal must be the one that is oxidised"}
      - {text: "Magnesium oxide", mistake: "names a product rather than a reactant"}
      - {text: "Neither substance is oxidised", mistake: "thinks oxidation requires a substance to lose oxygen"}
    explanation: "Magnesium gains oxygen to form magnesium oxide, so it is the substance that is oxidised. Oxygen is reduced in the same reaction."
    hints:
      - "Which reactant gains oxygen?"
      - "Check which reactant combines with oxygen."
      - "Ignore the product and look at the reactants."
    diagram: null
    confidence: high

  - topic: oxidation_reduction
    type: mcq
    difficulty: medium
    role: apply
    stem: "A substance loses hydrogen during a reaction. Which process is this?"
    correct: "Oxidation"
    unit: ""
    wrong:
      - {text: "Reduction", mistake: "treats any change involving hydrogen as reduction"}
      - {text: "Displacement", mistake: "confuses a process with a type of reaction"}
      - {text: "Neutralisation", mistake: "links hydrogen removal with acid-base reactions"}
    explanation: "Loss of hydrogen is oxidation. It is the reverse of reduction, which is gain of hydrogen."
    hints:
      - "Recall which process is gain of hydrogen."
      - "Consider the reverse of gain of hydrogen."
      - "Think about whether the substance gains or loses hydrogen."
    diagram: null
    confidence: high

  - topic: oxidation_reduction
    type: mcq
    difficulty: hard
    role: transfer
    stem: "In the reaction ZnO + C -> Zn + CO, which statement is correct?"
    correct: "ZnO is reduced and C is oxidised"
    unit: ""
    wrong:
      - {text: "ZnO is oxidised and C is reduced", mistake: "reverses both definitions"}
      - {text: "Both ZnO and C are reduced", mistake: "thinks every reaction with a metal oxide is a reduction"}
      - {text: "Neither substance takes part in oxidation or reduction", mistake: "thinks oxidation and reduction need free oxygen gas"}
    explanation: "ZnO loses oxygen to become Zn, so it is reduced. Carbon gains oxygen to become CO, so it is oxidised."
    hints:
      - "Track which substance loses oxygen."
      - "Track which substance gains oxygen."
      - "Check each reactant separately."
    diagram: null
    confidence: high

  - topic: oxidation_reduction
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A student says, 'Oxidation and reduction always happen separately, so in a reaction only one substance is either oxidised or reduced.' Which statement corrects this?"
    correct: "Oxidation and reduction always occur together, so whenever one substance is oxidised another is reduced"
    unit: ""
    wrong:
      - {text: "Oxidation can happen alone, without any reduction, in any reaction", mistake: "assumes a substance can gain oxygen without another substance losing it"}
      - {text: "Only metals can be oxidised", mistake: "limits oxidation to metals"}
      - {text: "Reduction only involves gain of oxygen, never hydrogen", mistake: "forgets the hydrogen-based definition of reduction"}
    explanation: "Oxygen given by one substance is taken by another, so the two processes happen together. This is why the term redox covers both."
    hints:
      - "Consider where the oxygen goes in a reaction."
      - "Think about what one substance gives to the other."
      - "Check the definitions you have learned for both processes."
    diagram: null
    confidence: high

  - topic: effects_of_reactions
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is rancidity?"
    correct: "Oxidation of fats and oils, which makes them smell and taste unpleasant"
    unit: ""
    wrong:
      - {text: "Rusting of iron in moist air", mistake: "confuses rancidity with corrosion of metals"}
      - {text: "Fermentation of sugar into alcohol", mistake: "confuses a food spoilage process with fermentation"}
      - {text: "Hardening of liquid vegetable oil into a solid fat", mistake: "confuses rancidity with hydrogenation"}
    explanation: "Rancidity is the slow oxidation of fats and oils in food. It produces compounds with unpleasant smells and tastes."
    hints:
      - "Think about what fats react with in air."
      - "Recall which process affects food rather than metals."
      - "Consider which change spoils the smell of food."
    diagram: null
    confidence: high

  - topic: effects_of_reactions
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which of these is an example of corrosion?"
    correct: "A silver spoon turning black in air over time"
    unit: ""
    wrong:
      - {text: "Milk turning sour", mistake: "treats all spoilage as corrosion"}
      - {text: "Ice melting on a warm day", mistake: "treats a physical change as a chemical reaction"}
      - {text: "A candle burning with a bright flame", mistake: "confuses burning with corrosion"}
    explanation: "Corrosion is the gradual eating away of metals by air, moisture or chemicals. A silver spoon tarnishing in air is one example."
    hints:
      - "Consider which items in the list are made of metal."
      - "Think about slow reactions between metals and air."
      - "Decide whether the change produces a new substance."
    diagram: null
    confidence: high

  - topic: effects_of_reactions
    type: mcq
    difficulty: medium
    role: apply
    stem: "Chips packets are often filled with nitrogen gas before they are sealed. What is the main purpose?"
    correct: "To keep oxygen away so the fats in the food do not become rancid"
    unit: ""
    wrong:
      - {text: "To make the packet feel lighter in the hand", mistake: "thinks the gas is there for the feel of the packet"}
      - {text: "To speed up the ripening of the chips", mistake: "assumes the gas acts as a catalyst"}
      - {text: "To cool the food before the packet is sealed", mistake: "thinks the gas works as a cooling agent"}
    explanation: "Nitrogen is unreactive and pushes out the air. Less oxygen means less oxidation, so rancidity is slowed."
    hints:
      - "Consider which gas in air causes oxidation."
      - "Think about why an unreactive gas would be chosen."
      - "Look for the reaction that spoils fatty food."
    diagram: null
    confidence: high

  - topic: effects_of_reactions
    type: mcq
    difficulty: medium
    role: recall
    stem: "Rusting of iron is one example of corrosion. Which general type of chemical change does rusting belong to?"
    correct: "Oxidation"
    unit: ""
    wrong:
      - {text: "Neutralisation", mistake: "links rust with acids because rust is sometimes described as acidic"}
      - {text: "Decomposition", mistake: "thinks the rust breaks the iron into simpler substances"}
      - {text: "Sublimation", mistake: "confuses the change with a physical change of state"}
    explanation: "Iron combines with oxygen and moisture, so it is oxidised. Corrosion of metals is generally a type of oxidation."
    hints:
      - "Think about what iron combines with when it rusts."
      - "Recall the name of the change in which a substance combines with oxygen."
      - "Decide whether rusting is a chemical change or a physical change."
    diagram: null
    confidence: high

  - topic: effects_of_reactions
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Silver jewellery turns black after some time in air. Which substance is most responsible, and what kind of change is it?"
    correct: "Sulphur-containing gases in air, in a chemical change"
    unit: ""
    wrong:
      - {text: "Dust particles, in a physical change", mistake: "assumes dust sticks to the metal and changes its colour"}
      - {text: "Nitrogen gas, in a physical change", mistake: "thinks the most common gas in air must cause the change"}
      - {text: "Water vapour alone, in a physical change", mistake: "assumes moisture by itself turns silver black"}
    explanation: "Silver reacts with sulphur compounds in the air to form black silver sulphide. A new substance is formed, so it is a chemical change."
    hints:
      - "Consider which gases in air contain an element other than oxygen."
      - "Ask whether a new substance is formed."
      - "Think about what the black layer is made of."
    diagram: null
    confidence: high

  - topic: effects_of_reactions
    type: mcq
    difficulty: hard
    role: explain
    stem: "An iron gate is painted rather than left bare. Which explanation is correct?"
    correct: "The paint keeps oxygen and water away from the iron, so rusting is slowed"
    unit: ""
    wrong:
      - {text: "Paint chemically bonds to the iron and makes it stronger", mistake: "thinks a coating changes the strength of the metal"}
      - {text: "Paint reacts with rust and turns it back into iron", mistake: "assumes the coating reverses rusting"}
      - {text: "Paint warms the iron so that water cannot form on it", mistake: "thinks the paint works through heat"}
    explanation: "Rusting needs both oxygen and water. A layer of paint blocks contact with both, so the iron is protected."
    hints:
      - "Recall what rusting needs from the air."
      - "Think about what a painted layer does to the surface."
      - "Ask which two things must reach the iron for it to rust."
    diagram: null
    confidence: high
