  - topic: covalent_bonding_carbon
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does carbon form covalent rather than ionic bonds?"
    correct: "It has four valence electrons, so gaining or losing four electrons to form ions is difficult"
    unit: ""
    wrong:
      - {text: "It has too few electrons to form any bonds", mistake: "forgets that carbon has valence electrons"}
      - {text: "It loses all four valence electrons easily", mistake: "assumes carbon ionises readily"}
      - {text: "It has no valence electrons in its outer shell", mistake: "misreads carbon's electron count"}
    explanation: "Carbon would need to gain or lose four electrons to get a full outer shell, which is too difficult. Sharing electrons is the practical way for carbon to complete its shell."
    hints:
      - "Count how many electrons carbon would need to gain or lose."
      - "Think about how the energy cost compares with sharing."
      - "Ask what carbon does with its electrons when they are shared."
    diagram: null
    confidence: high

