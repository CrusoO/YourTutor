items:
  - topic: properties_of_acids_bases
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which gas is evolved when dilute hydrochloric acid reacts with zinc metal?"
    correct: "Hydrogen"
    unit: ""
    wrong:
      - {text: "Oxygen", mistake: "thinks acids release oxygen when they react"}
      - {text: "Carbon dioxide", mistake: "confuses this reaction with the reaction of acids and carbonates"}
      - {text: "Chlorine", mistake: "assumes the chloride part of the acid is released as a gas"}
    explanation: "Many metals react with acids to give a salt and hydrogen gas. Zinc with dilute hydrochloric acid gives zinc chloride and hydrogen."
    hints:
      - "Think about what the positive ions in an acid become when they gain electrons."
      - "Recall the gas that burns with a squeaky pop."
      - "Consider which elements are present in the acid."
    diagram: null
    confidence: high

  - topic: properties_of_acids_bases
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which statement describes a property of bases?"
    correct: "They turn red litmus paper blue"
    unit: ""
    wrong:
      - {text: "They turn blue litmus paper red", mistake: "swaps the litmus colours, which describes acids"}
      - {text: "They have a sour taste", mistake: "confuses bases with acids"}
      - {text: "They release hydrogen ions in water", mistake: "uses the acid definition for bases"}
    explanation: "Bases turn red litmus blue and have a bitter taste and a soapy feel. Acids turn blue litmus red."
    hints:
      - "Recall the colours of litmus in an acid and in a base."
      - "Think about how acids and bases taste."
      - "Ask which ions a base releases in water."
    diagram: null
    confidence: high

  - topic: properties_of_acids_bases
    type: mcq
    difficulty: medium
    role: apply
    stem: "What is formed when an acid reacts with a metal carbonate?"
    correct: "A salt, water and carbon dioxide"
    unit: ""
    wrong:
      - {text: "A salt and hydrogen only", mistake: "assumes all acid reactions with metals give hydrogen"}
      - {text: "A salt and oxygen", mistake: "thinks the carbonate breaks down to release oxygen"}
      - {text: "Water only", mistake: "forgets the salt and the gas"}
    explanation: "A metal carbonate reacts with an acid to give a salt, water and carbon dioxide. The carbon dioxide is seen as fizzing."
    hints:
      - "Think about what the fizzing indicates."
      - "Identify the part of the carbonate that reacts with the acid."
      - "Count how many new substances the reaction makes."
    diagram: null
    confidence: high

  - topic: properties_of_acids_bases
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does dilute hydrochloric acid conduct electricity?"
    correct: "It contains mobile ions in solution"
    unit: ""
    wrong:
      - {text: "It contains free electrons that move through it", mistake: "applies the idea of metallic conduction to a solution"}
      - {text: "It is made of molecules that carry charge when they move", mistake: "thinks neutral molecules carry an electric current"}
      - {text: "Only the water in it conducts, not the acid", mistake: "believes the acid is not involved in conduction"}
    explanation: "Acid solutions contain ions that carry charge through the liquid. This is why acids are electrolytes."
    hints:
      - "Consider what happens to hydrogen chloride when it dissolves in water."
      - "Think about what carries charge through a liquid."
      - "Compare with a metal wire, which uses a different carrier."
    diagram: null
    confidence: high

  - topic: properties_of_acids_bases
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Dry hydrogen chloride gas does not turn dry blue litmus paper red, but a solution of hydrogen chloride in water does. What explains this?"
    correct: "Hydrogen ions are formed only when the gas dissolves in water"
    unit: ""
    wrong:
      - {text: "Dry hydrogen chloride is a base", mistake: "reverses the roles of acids and bases"}
      - {text: "Litmus responds only to liquids, not to gases", mistake: "assumes the paper is unaffected by gases in general"}
      - {text: "Hydrogen chloride gas contains no hydrogen", mistake: "forgets that the formula HCl contains hydrogen"}
    explanation: "Acidic behaviour needs hydrogen ions, which form when the gas dissolves in water and ionises. Without water, the gas does not produce them."
    hints:
      - "Think about what is needed for hydrogen ions to form."
      - "Consider what water does to the gas."
      - "Ask which property of an acid needs a solvent."
    diagram: null
    confidence: high

  - topic: properties_of_acids_bases
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why should concentrated acid be added slowly to water during dilution, and not water to the acid?"
    correct: "Dilution releases a lot of heat, so adding acid slowly to a large volume of water spreads the heat safely"
    unit: ""
    wrong:
      - {text: "Water added to acid turns the acid into a base", mistake: "assumes dilution reverses the nature of the acid"}
      - {text: "Acid added to water releases a poisonous gas", mistake: "confuses the heat of dilution with gas evolution"}
      - {text: "Water added to acid makes the mixture more concentrated", mistake: "reverses the meaning of dilute"}
    explanation: "Mixing concentrated acid with water releases a large amount of heat. Adding acid in small portions to water, with stirring, keeps the heating under control and avoids spattering."
    hints:
      - "Think about what happens to temperature when the two liquids mix."
      - "Consider which liquid is in the larger amount during mixing."
      - "Ask what could spatter out of the container if the heat builds up."
    diagram: null
    confidence: high

  - topic: indicators
    type: mcq
    difficulty: easy
    role: recall
    stem: "What colour does litmus turn in an acidic solution?"
    correct: "Red"
    unit: ""
    wrong:
      - {text: "Blue", mistake: "reverses the colour change of litmus"}
      - {text: "Green", mistake: "uses the colour of a universal indicator at neutral pH"}
      - {text: "Colourless", mistake: "assumes litmus is invisible in acids"}
    explanation: "Litmus is red in acidic solutions and blue in basic solutions, so its colour shows whether a solution is acidic or basic."
    hints:
      - "Recall the colour litmus shows in an acid."
      - "Think about the two colours you learned for litmus."
      - "Note which colour is linked with acids."
    diagram: null
    confidence: high

  - topic: indicators
    type: mcq
    difficulty: easy
    role: recall
    stem: "What colour does phenolphthalein show in a basic solution?"
    correct: "Pink"
    unit: ""
    wrong:
      - {text: "Colourless", mistake: "reverses its colour change, which is colourless in acid"}
      - {text: "Red", mistake: "uses the acid colour of a different indicator"}
      - {text: "Yellow", mistake: "confuses phenolphthalein with methyl orange"}
    explanation: "Phenolphthalein is colourless in acidic solutions and turns pink in basic solutions."
    hints:
      - "Recall the colour phenolphthalein shows in an acid first."
      - "Think about which indicator is colourless in acid and changes colour in a base."
      - "Ask what colour the basic side of the pH scale produces."
    diagram: null
    confidence: high

  - topic: indicators
    type: mcq
    difficulty: medium
    role: apply
    stem: "What colour does methyl orange show in a basic solution?"
    correct: "Yellow"
    unit: ""
    wrong:
      - {text: "Red", mistake: "gives the acid colour, reversing the change"}
      - {text: "Pink", mistake: "transfers the phenolphthalein colour to methyl orange"}
      - {text: "Blue", mistake: "assumes all indicators turn blue in a base"}
    explanation: "Methyl orange is red in acidic solutions and yellow in basic solutions."
    hints:
      - "Recall the colour methyl orange shows in an acid."
      - "Think about the change that happens as the solution becomes less acidic."
      - "Recall which indicator turns pink in a base."
    diagram: null
