  - topic: indicators
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why can an extract of turmeric be used as an indicator?"
    correct: "Its pigment changes colour with the acidity or basicity of the solution"
    unit: ""
    wrong:
      - {text: "It releases hydrogen gas in acids, which changes the colour", mistake: "confuses indicator action with gas evolution"}
      - {text: "It reacts with metals and forms salts that colour the solution", mistake: "treats the colour as a product of salt formation"}
      - {text: "It turns into a base when it is added to an acid", mistake: "thinks an indicator changes the acidity of the solution"}
    explanation: "Natural dyes such as turmeric contain pigments whose colour depends on the pH of the solution. This is what makes them indicators."
    hints:
      - "Think about what property of the solution the pigment responds to."
      - "Ask whether the pigment is used up or remains unchanged."
      - "Consider what makes a substance an indicator rather than a reactant."
    diagram: null
    confidence: high

  - topic: indicators
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Red litmus paper is dipped into a solution of sodium chloride, which is a neutral salt. What is observed?"
    correct: "The paper stays red"
    unit: ""
    wrong:
      - {text: "It turns blue because the salt is basic", mistake: "assumes all salts are basic"}
      - {text: "It turns colourless", mistake: "thinks litmus fades in neutral solutions"}
      - {text: "It turns green", mistake: "uses the universal indicator colour for neutral solutions"}
    explanation: "Sodium chloride is a neutral salt, formed from a strong acid and a strong base. It does not make red litmus change colour, so the paper stays red."
    hints:
      - "Recall what red litmus responds to."
      - "Consider whether the salt is acidic, basic or neutral."
      - "Think about how a neutral solution affects litmus."
    diagram: null
    confidence: high

  - topic: indicators
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A solution turns green when universal indicator is added. What can be concluded about its pH?"
    correct: "It is close to pH 7, so it is nearly neutral"
    unit: ""
    wrong:
      - {text: "It is strongly acidic, around pH 1", mistake: "uses the red end of the scale for green"}
      - {text: "It is strongly basic, around pH 13", mistake: "uses the purple end of the scale for green"}
      - {text: "It contains a metal, which turns the indicator green", mistake: "assumes metals change the colour of indicators"}
    explanation: "Universal indicator shows green at about pH 7, the neutral point. Red shows strong acid, while blue and purple show bases."
    hints:
      - "Recall the range of colours on the universal indicator chart."
      - "Think about where green sits between red and purple."
      - "Ask what a strongly acidic or strongly basic reading would look like."
    diagram: null
    confidence: medium

  - topic: preparation_of_salts
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the chemical name of baking soda?"
    correct: "Sodium hydrogencarbonate"
    unit: ""
    wrong:
      - {text: "Sodium carbonate", mistake: "confuses baking soda with washing soda"}
      - {text: "Sodium hydroxide", mistake: "assumes any sodium compound used in cooking is caustic"}
      - {text: "Calcium carbonate", mistake: "confuses baking soda with chalk"}
    explanation: "Baking soda is sodium hydrogencarbonate, NaHCO3. It is used in cooking and as an antacid."
    hints:
      - "Look for the word hydrogen in the possible names."
      - "Think about the sodium compound used in baking."
      - "Recall the difference between a carbonate and a hydrogencarbonate."
    diagram: null
    confidence: high

  - topic: preparation_of_salts
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is plaster of Paris made by heating?"
    correct: "Gypsum"
    unit: ""
    wrong:
      - {text: "Limestone", mistake: "confuses gypsum with the rock used to make lime"}
      - {text: "Quartz", mistake: "thinks the hard mineral is the material for plaster"}
      - {text: "Slaked lime", mistake: "assumes the product is the starting material"}
    explanation: "Gently heating gypsum removes most of its water and forms plaster of Paris, which sets hard again when mixed with water."
    hints:
      - "Think about which calcium sulphate mineral is used in building materials."
      - "Consider what loses water when it is heated."
      - "Recall what plaster sets into when it is mixed with water."
    diagram: null
    confidence: high

  - topic: preparation_of_salts
    type: mcq
    difficulty: medium
    role: apply
    stem: "Common salt is obtained in large amounts by which method?"
    correct: "Evaporating sea water"
    unit: ""
    wrong:
      - {text: "Electrolysis of molten sodium", mistake: "confuses salt production with the extraction of sodium metal"}
      - {text: "Heating limestone in a kiln", mistake: "confuses salt with lime"}
      - {text: "Burning sodium in chlorine in a furnace", mistake: "treats burning elements as the usual industrial method"}
    explanation: "Sea water is left in shallow pans, the water evaporates in the sun, and the salt is collected. This is a common large-scale method."
    hints:
      - "Think about the most abundant natural source of salt."
      - "Consider how water can be removed from a solution."
      - "Ask which physical process separates a dissolved solid from water."
    diagram: null
    confidence: high

  - topic: preparation_of_salts
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is baking soda used to relieve acidity in the stomach?"
    correct: "It neutralises the excess acid"
    unit: ""
    wrong:
      - {text: "It increases the amount of acid so the stomach empties faster", mistake: "reverses the effect of an antacid"}
      - {text: "It removes water from the stomach lining", mistake: "invents a dehydration effect"}
      - {text: "It converts the acid into a gas that is absorbed", mistake: "thinks the gas removes the acid instead of being a product"}
    explanation: "Sodium hydrogencarbonate is a base. It reacts with the excess hydrochloric acid in the stomach to form a salt, water and carbon dioxide."
    hints:
      - "Recall what type of substance baking soda is."
      - "Think about which substance in the stomach is in excess."
      - "Consider what kind of reaction takes place between an acid and a base."
    diagram: null
    confidence: high

  - topic: preparation_of_salts
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Bleaching powder is used to disinfect drinking water. Which explanation best describes how it works?"
    correct: "It releases chlorine when it reacts with water or acid, and the chlorine kills microbes"
    unit: ""
    wrong:
      - {text: "It releases oxygen, which is the only disinfecting agent", mistake: "assumes oxygen is the disinfectant"}
      - {text: "It changes the pH of the water to neutral and nothing more", mistake: "thinks disinfection is only a pH effect"}
      - {text: "It removes dissolved salts from the water", mistake: "confuses disinfection with removing salts"}
    explanation: "Bleaching powder releases chlorine, a strong disinfecting agent, when it reacts with water or acid. The chlorine kills bacteria in the water."
    hints:
      - "Consider which element is released from the compound during the reaction."
      - "Think about what kills microbes in water."
      - "Ask whether the process changes the salt content or the microbes."
    diagram: null
    confidence: medium

  - topic: preparation_of_salts
    type: mcq
    difficulty: hard
    role: explain
    stem: "Plaster of Paris hardens when it is mixed with water. Which statement best describes what happens?"
    correct: "It takes up water and forms a hard crystalline solid of gypsum"
    unit: ""
    wrong:
      - {text: "It reacts with water to form a strong acid", mistake: "assumes setting involves the formation of an acid"}
      - {text: "It melts and cools into a transparent glass", mistake: "confuses setting with melting"}
      - {text: "It loses all its water and turns into quicklime", mistake: "reverses the heating step"}
    explanation: "Plaster of Paris combines with water to re-form gypsum, which sets into a hard solid. This is why it is useful for casts and moulds."
    hints:
      - "Consider whether water is added or removed during setting."
      - "Think about the reverse of the heating step."
      - "Ask what kind of solid the setting produces."
    diagram: null
    confidence: high
