  - topic: tangent_lengths
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A circle has radius 9 cm. Two tangents are drawn from an external point T, each of length 12 cm, touching the circle at P and Q. What is the length PQ in cm?"
    correct: "14.4"
    unit: "cm"
    wrong: []
    explanation: "OT = √(9² + 12²) = 15 cm. The kite OPTQ has area 2 × ½ × 9 × 12 = 108 cm², and its diagonals OT and PQ are perpendicular, so ½ × 15 × PQ = 108 and PQ = 14.4 cm."
    hints:
      - "Find the length OT first using Pythagoras."
      - "Find the area of the kite OPTQ by splitting it into two triangles."
      - "The diagonals of a kite are perpendicular."
    diagram: "A circle of radius 9 cm with centre O and an external point T joined to O. Two tangents from T touch the circle at P and Q, and the chord PQ is drawn between the contact points."
    confidence: high
