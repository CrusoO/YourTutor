  - topic: human_endocrine_system
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which hormone produced by the pancreas lowers the level of glucose in the blood?"
    correct: "Insulin"
    unit: ""
    wrong:
      - {text: "Glucagon", mistake: "reverses the effect of its partner hormone"}
      - {text: "Adrenaline", mistake: "assumes the stress hormone lowers blood sugar"}
      - {text: "Thyroxine", mistake: "confuses the thyroid hormone with the pancreatic hormone"}
    explanation: "Insulin helps cells take up glucose and promotes its storage as glycogen, which lowers blood glucose. Glucagon has the opposite effect of raising it."
    hints:
      - "This hormone is secreted by the beta cells of the pancreas."
      - "Think about the hormone that helps cells take in sugar."
      - "The hormone is the one that reduces blood sugar, not raises it."
    diagram: null
    confidence: high
