  - topic: plant_hormones
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does a shoot bend towards a light source?"
    correct: "Auxin accumulates on the shaded side, causing those cells to elongate more"
    unit: ""
    wrong:
      - {text: "Auxin accumulates on the sunny side, causing those cells to elongate more", mistake: "reverses the distribution of auxin"}
      - {text: "Light destroys auxin on the shaded side, so those cells divide", mistake: "confuses elongation with cell division"}
      - {text: "Cytokinin moves to the sunny side to stop its growth", mistake: "gives the cell division hormone the bending job"}
    explanation: "Light causes auxin to move away from the lit side, so the shaded side has more auxin and its cells grow longer. The unequal growth bends the shoot towards the light."
    hints:
      - "Think about which side of the shoot grows more."
      - "Consider how light changes the position of auxin."
      - "The shaded side is the side that grows faster."
    diagram: null
    confidence: high
  - topic: plant_hormones
    type: mcq
    difficulty: hard
    role: apply
    stem: "When the growing tip of a plant shoot is removed, side buds start to grow. Which hormone is most directly reduced by this removal?"
    correct: "Auxin"
    unit: ""
    wrong:
      - {text: "Cytokinin", mistake: "assumes cytokinin is made at the shoot tip"}
      - {text: "Gibberellin", mistake: "thinks the tip makes a gibberellin that suppresses side buds"}
      - {text: "Abscisic acid", mistake: "assumes the tip makes an inhibitor only for the roots"}
    explanation: "Auxin produced at the shoot tip suppresses the growth of side buds, a effect called apical dominance. Removing the tip lowers this auxin supply, so the buds are released to grow."
    hints:
      - "The growing tip is the main source of this hormone."
      - "Think about the hormone that suppresses lateral buds."
      - "Consider which hormone was linked to bending and elongation in earlier questions."
    diagram: null
    confidence: medium
