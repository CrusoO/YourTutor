  - topic: nervous_system
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the basic functional unit of the nervous system?"
    correct: "Neuron"
    unit: ""
    wrong:
      - {text: "Nephron", mistake: "mixes up the functional unit of the excretory system with the nervous system"}
      - {text: "Nucleus", mistake: "treats the control centre of a cell as the nerve unit"}
      - {text: "Synapse", mistake: "thinks the junction between cells is itself the cell that carries signals"}
    explanation: "A neuron is a nerve cell that receives, conducts and transmits electrical impulses. A nephron is a unit of the kidney, and a synapse is a junction between neurons."
    hints:
      - "Think of the cell type that carries nerve impulses."
      - "The answer is a cell, not a junction or an organ."
      - "It is the cell type that has dendrites and an axon."
    diagram: null
    confidence: high
  - topic: nervous_system
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which part of a neuron usually receives signals from other neurons?"
    correct: "Dendrite"
    unit: ""
    wrong:
      - {text: "Axon", mistake: "thinks the long fibre receives input"}
      - {text: "Myelin sheath", mistake: "treats the insulating layer as a signal source"}
      - {text: "Axon terminal", mistake: "reverses the direction of signal flow at the end of the axon"}
    explanation: "Dendrites are branched extensions that receive impulses and carry them towards the cell body. The axon carries impulses away from the cell body."
    hints:
      - "This part is branched and lies near the cell body."
      - "Think about the part that gathers incoming signals."
      - "It is not the long fibre that carries impulses away."
    diagram: null
    confidence: high
  - topic: nervous_system
    type: mcq
    difficulty: medium
    role: explain
    stem: "What is the role of the myelin sheath around an axon?"
    correct: "It insulates the axon and speeds up the conduction of impulses"
    unit: ""
    wrong:
      - {text: "It produces the chemical messenger that crosses the synapse", mistake: "confuses the insulating layer with the store of neurotransmitter"}
      - {text: "It stops impulses from leaving the cell", mistake: "thinks insulation blocks the signal entirely"}
      - {text: "It joins two neurons together to form a synapse", mistake: "assigns the junction's job to the sheath"}
    explanation: "Myelin is a fatty insulating layer formed by Schwann cells in the peripheral nervous system. It makes the impulse jump between the gaps called nodes of Ranvier, which speeds conduction."
    hints:
      - "Think about why a wire is covered with an insulating material."
      - "Consider what the gaps in the sheath allow the impulse to do."
      - "The sheath affects speed, not the chemical release."
    diagram: "Draw a neuron showing dendrites, the cell body with its nucleus, a long axon with myelin sheath segments and the nodes of Ranvier between them, and the axon terminals at the end."
    confidence: high
  - topic: nervous_system
    type: mcq
    difficulty: medium
    role: apply
    stem: "At a synapse a chemical messenger carries the signal across the narrow gap to the next neuron. What is this messenger called?"
    correct: "Neurotransmitter"
    unit: ""
    wrong:
      - {text: "Hormone", mistake: "uses the endocrine term for chemical messengers in the nervous system"}
      - {text: "Enzyme", mistake: "thinks every chemical in the gap is a catalyst"}
      - {text: "Antibody", mistake: "confuses immune molecules with signalling molecules"}
    explanation: "At a chemical synapse the presynaptic neuron releases neurotransmitters, which diffuse across the cleft and bind to receptors on the next neuron. Hormones travel through the blood, not across a synapse."
    hints:
      - "Think about the name that combines transmit with a chemical root."
      - "Consider which messenger works across a very small gap."
      - "The messenger is released by the nerve, not by the blood."
    diagram: null
    confidence: high
  - topic: nervous_system
    type: mcq
    difficulty: hard
    role: explain
    stem: "During a nerve impulse, why does the inside of the axon membrane become briefly positive?"
    correct: "Sodium ions rush into the axon, reversing the charge at that point"
    unit: ""
    wrong:
      - {text: "Potassium ions rush into the axon from outside", mistake: "confuses the recovery phase with the spike"}
      - {text: "Chloride ions leave, leaving more positive charge inside", mistake: "applies the ionic charge rule incorrectly"}
      - {text: "Water enters the axon through the myelin sheath", mistake: "assumes osmosis causes the charge change"}
    explanation: "Sodium channels open at the point of stimulation, and sodium ions flow in, making the inside positive for a moment. Potassium then leaves the axon to restore the resting state."
    hints:
      - "Think about which ion moves in first during the spike."
      - "Recall the resting state: outside positive, inside negative."
      - "Focus on the ion that enters the cell quickly."
    diagram: "Draw a section of axon membrane in three stages: resting state with the outside positive and inside negative, the local reversal during the impulse, and the recovery. Mark the + and - signs and arrows for the ion movement at each stage."
    confidence: high
  - topic: nervous_system
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A nerve impulse travels 2.0 m along an axon in 0.004 s. What is the speed of the impulse in metres per second?"
    correct: "500"
    unit: "m/s"
    wrong: []
    explanation: "Speed is distance divided by time, so 2.0 m divided by 0.004 s gives 500 m/s. This is a simple illustrative figure, not a measured value for a particular nerve."
    hints:
      - "Speed is distance travelled divided by time taken."
      - "Write down the distance and the time with their units."
      - "Divide the distance by the time."
    diagram: null
    confidence: high
  - topic: reflex_action
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is a reflex action?"
    correct: "A rapid, automatic response to a stimulus that does not need conscious thought"
    unit: ""
    wrong:
      - {text: "A response that is planned after careful thought about the stimulus", mistake: "confuses reflex actions with voluntary actions"}
      - {text: "A slow response carried by hormones in the blood", mistake: "assigns the hormonal route to reflexes"}
      - {text: "A response that happens only in plants", mistake: "ignores reflexes in animals"}
    explanation: "A reflex is a quick, involuntary response that protects the body, such as withdrawing a hand from a hot object. It is carried out along a reflex arc without waiting for conscious processing."
    hints:
      - "Think about a response you do before you realise it."
      - "Consider whether the response is voluntary or automatic."
      - "Reflexes are fast because they bypass deliberate thought."
    diagram: null
    confidence: high
  - topic: reflex_action
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which option gives the correct order of components in a reflex arc?"
    correct: "Receptor, sensory neuron, relay neuron in the spinal cord, motor neuron, effector"
    unit: ""
    wrong:
      - {text: "Effector, motor neuron, relay neuron, sensory neuron, receptor", mistake: "reads the arc backwards starting from the response"}
      - {text: "Receptor, motor neuron, relay neuron, sensory neuron, effector", mistake: "swaps the sensory and motor neurons"}
      - {text: "Receptor, sensory neuron, brain, motor neuron, effector", mistake: "assumes the brain must process every reflex"}
    explanation: "The stimulus is detected by a receptor, carried by a sensory neuron to the spinal cord, passed through a relay neuron, and then sent by a motor neuron to an effector that responds."
    hints:
      - "Start with the part that detects the stimulus."
      - "Remember that the sensory neuron carries impulses towards the spinal cord."
      - "The effector is the last component in the arc."
    diagram: null
    confidence: high
  - topic: reflex_action
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does a knee-jerk reflex happen without the brain directly deciding the response?"
    correct: "The reflex arc passes through the spinal cord, so the response is initiated there"
    unit: ""
    wrong:
      - {text: "The stimulus is processed by the eye before it reaches the leg", mistake: "assumes vision is needed to trigger reflexes"}
      - {text: "The muscle is stimulated directly by the brain through a separate pathway", mistake: "thinks effectors are controlled only from the brain"}
      - {text: "The hormone adrenaline triggers the leg movement", mistake: "mixes reflexes up with hormonal responses"}
    explanation: "In a knee-jerk reflex, the sensory neuron synapses in the spinal cord with a motor neuron, so the response is initiated without going to the brain. The brain is informed afterwards."
    hints:
      - "Think about where the reflex arc turns the impulse around."
      - "Consider which organ is the first point of processing in a reflex."
      - "Reflexes do not need the sight of the stimulus."
    diagram: "Draw a reflex arc for the knee-jerk: a receptor in the tendon below the kneecap, a sensory neuron going up to the spinal cord, a relay or direct synapse in the cord, a motor neuron to the thigh muscle, with arrows showing the direction of the impulse."
    confidence: high
  - topic: reflex_action
    type: mcq
    difficulty: medium
    role: apply
    stem: "When a hand touches a hot object and is withdrawn, which part of the reflex arc is the effector?"
    correct: "The muscle of the arm"
    unit: ""
    wrong:
      - {text: "The receptor in the skin", mistake: "confuses the receptor with the effector"}
      - {text: "The relay neuron in the spinal cord", mistake: "treats the spinal cord as the responding organ"}
      - {text: "The sensory neuron", mistake: "confuses the carrier of the signal with the responder"}
    explanation: "The effector is the organ that carries out the response, here the muscle that pulls the arm away. The skin receptor detects the stimulus and the neurons transmit the signal."
    hints:
      - "Ask what actually moves the arm."
      - "The effector is the last link in the arc."
      - "The receptor detects, it does not respond."
    diagram: null
    confidence: high
  - topic: reflex_action
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why is a reflex action faster than a response that goes through the brain?"
    correct: "It uses a short path with few synapses and does not wait for conscious processing"
    unit: ""
    wrong:
      - {text: "Reflexes travel through the blood, which is quicker than nerves", mistake: "thinks blood carries nerve impulses"}
      - {text: "Impulses travel faster in the brain than in the spinal cord", mistake: "assumes brain tissue conducts impulses faster"}
      - {text: "Muscles respond faster when they receive no hormones", mistake: "invents a rule linking hormones and muscle speed"}
    explanation: "A reflex arc passes through the spinal cord with only a few neurons and synapses, so the impulse is processed quickly. A response routed through the brain adds more synapses and conscious processing."
    hints:
      - "Think about how many neurons and junctions the impulse passes through."
      - "Consider whether the impulse waits for a decision."
      - "Compare the length of the two pathways."
    diagram: "Draw two pathways side by side: a short reflex arc with three neurons through the spinal cord, and a longer pathway going up to the brain and back down, with the synapses marked."
    confidence: high
  - topic: reflex_action
    type: numeric
