  - topic: human_endocrine_system
    type: mcq
    difficulty: hard
    role: explain
    stem: "After a meal, blood glucose rises. Which sequence correctly describes the hormonal response that restores normal levels?"
    correct: "The pancreas releases insulin, the liver and muscles take up glucose and store it as glycogen, and blood glucose falls"
    unit: ""
    wrong:
      - {text: "The pancreas releases glucagon, the liver breaks glycogen down, and blood glucose rises", mistake: "reverses the response meant for a low glucose state"}
      - {text: "The thyroid releases thyroxine, which directly removes glucose from the blood", mistake: "assigns glucose control to the thyroid"}
      - {text: "The adrenal gland releases adrenaline, which stores glucose as fat", mistake: "assumes the stress hormone does the storage job"}
    explanation: "High blood glucose stimulates the beta cells of the pancreas to release insulin. Insulin makes the liver and muscle cells absorb glucose and convert it to glycogen, which lowers the blood glucose level."
    hints:
      - "Start with the gland that responds directly to a change in blood glucose."
      - "Think about what the liver and muscles do with excess glucose."
      - "Consider which hormone is released when glucose is high."
    diagram: "Draw a flowchart: high blood glucose, then the beta cells of the pancreas releasing insulin into the blood, then liver and muscle cells taking up glucose and converting it to glycogen, then blood glucose falling back to normal."
    confidence: high
