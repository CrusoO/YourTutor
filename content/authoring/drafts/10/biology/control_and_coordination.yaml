  - topic: plant_hormones
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which plant hormone is mainly responsible for promoting cell elongation and for bending shoots towards light?"
    correct: "Auxin"
    unit: ""
    wrong:
      - {text: "Gibberellin", mistake: "assumes the stem-elongation hormone also controls the response to light"}
      - {text: "Cytokinin", mistake: "assumes cell division hormones control the direction of growth"}
      - {text: "Ethylene", mistake: "thinks the fruit-ripening gas drives the bending of shoots"}
    explanation: "Auxin moves to the shaded side of a shoot and makes those cells elongate more, bending the shoot towards the light. Gibberellins promote stem growth but are not the main controllers of phototropism."
    hints:
      - "Think about the hormone produced at the growing tip of a shoot."
      - "Consider which hormone responds to light and causes shoot bending."
      - "It is not the hormone that mainly promotes cell division."
    diagram: null
    confidence: high
  - topic: plant_hormones
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which plant hormone is mainly involved in promoting cell division?"
    correct: "Cytokinin"
    unit: ""
    wrong:
      - {text: "Abscisic acid", mistake: "assumes abscisic acid promotes growth because it is called a hormone"}
      - {text: "Auxin", mistake: "gives the elongation hormone the division role"}
      - {text: "Ethylene", mistake: "confuses the ripening gas with the cell division hormone"}
    explanation: "Cytokinins are produced mainly in the roots and promote cell division, especially in shoots and buds. Abscisic acid is an inhibitor, and auxin mainly promotes elongation."
    hints:
      - "Think about hormones that are made in the root tip and move upward."
      - "Consider which hormone is linked to dividing cells."
      - "This hormone is not the gas involved in fruit ripening."
    diagram: null
    confidence: high
  - topic: plant_hormones
    type: mcq
    difficulty: medium
    role: apply
    stem: "Seeds of a plant remain dormant during dry conditions. Which plant hormone most likely maintains this dormancy?"
    correct: "Abscisic acid"
    unit: ""
    wrong:
      - {text: "Gibberellin", mistake: "assumes gibberellins are the dormancy hormone when they usually break dormancy"}
      - {text: "Cytokinin", mistake: "thinks cell division hormones keep seeds inactive"}
      - {text: "Auxin", mistake: "confuses root development with seed dormancy"}
    explanation: "Abscisic acid is an inhibitor that builds up in seeds during dry conditions and keeps them dormant. Gibberellins, by contrast, are used to break dormancy and start germination."
    hints:
      - "Think about the plant hormone that acts as a growth inhibitor."
      - "Consider which hormone rises during stress such as drought."
      - "The hormone you want acts against germination."
