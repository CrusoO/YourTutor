  - topic: asexual_reproduction
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which method of asexual reproduction is seen in yeast?"
    correct: "Budding"
    unit: ""
    wrong:
      - {text: "Fragmentation", mistake: "assigns the splitting-body method to yeast"}
      - {text: "Vegetative propagation", mistake: "uses a plant term for a single-celled organism"}
      - {text: "Conjugation", mistake: "confuses the exchange of genetic material with asexual copying"}
    explanation: "In yeast a small bud forms on the parent cell, grows, and then separates as a new individual. Fragmentation and vegetative propagation are not the process used by yeast."
    hints:
      - "Think about a small outgrowth that forms on the parent cell."
      - "Consider the method in which one body part grows into a new individual while still attached."
      - "The method does not involve two organisms exchanging material."
