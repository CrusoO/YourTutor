  - topic: human_reproductive_system
    type: mcq
    difficulty: easy
    role: recall
    stem: "Where does fertilisation normally take place in the human female?"
    correct: "Fallopian tube (oviduct)"
    unit: ""
    wrong:
      - {text: "Uterus", mistake: "assumes fertilisation happens where the embryo develops"}
      - {text: "Vagina", mistake: "thinks the entry canal is where the egg meets the sperm"}
      - {text: "Ovary", mistake: "confuses the egg source with the fertilisation site"}
    explanation: "After ovulation the egg moves into the fallopian tube, where it can meet a sperm. The fertilised egg then travels to the uterus, where it implants."
    hints:
      - "Think about the tube that carries the egg from the ovary."
      - "The fertilised egg must pass through this tube before reaching the uterus."
      - "The place is not the organ where the embryo grows."
    diagram: null
    confidence: high
  - topic: human_reproductive_system
    type: mcq
    difficulty: medium
    role: explain
    stem: "What is the main function of the placenta during pregnancy?"
    correct: "It exchanges nutrients, oxygen and wastes between mother and fetus without mixing their blood"
    unit: ""
    wrong:
      - {text: "It produces the egg cells that are fertilised", mistake: "confuses the placenta with the ovary"}
      - {text: "It stores urine from the fetus", mistake: "assigns an excretory storage role to the placenta"}
      - {text: "It mixes maternal and fetal blood so that they share immunity", mistake: "assumes the blood of mother and fetus mixes in the placenta"}
    explanation: "The placenta lies in the uterine wall and allows diffusion of oxygen, glucose and other nutrients from the mother to the fetus, while carbon dioxide and wastes pass the other way. The two blood supplies stay separate."
    hints:
      - "Think about how the fetus receives food and oxygen."
      - "Consider how the umbilical cord connects the fetus to the placenta."
      - "Notice that the blood of mother and fetus is kept apart."
    diagram: "Draw the uterus with an embryo attached to the placenta by the umbilical cord, with arrows showing nutrients and oxygen going from mother to fetus and carbon dioxide and wastes going back."
    confidence: high
  - topic: human_reproductive_system
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which hormone maintains the lining of the uterus during pregnancy?"
    correct: "Progesterone"
    unit: ""
    wrong:
      - {text: "Testosterone", mistake: "uses the male hormone for the female uterine lining"}
      - {text: "Adrenaline", mistake: "assigns the stress hormone to pregnancy maintenance"}
      - {text: "Insulin", mistake: "thinks the blood sugar hormone controls the uterine lining"}
    explanation: "Progesterone keeps the uterine lining thick and supportive during pregnancy. Testosterone is a male hormone, adrenaline is a stress hormone and insulin controls blood glucose."
    hints:
      - "This hormone is produced by the corpus luteum after ovulation."
      - "Think about the hormone that prepares the uterus for implantation."
      - "The hormone is a female sex hormone."
    diagram: null
    confidence: high
  - topic: human_reproductive_system
    type: mcq
    difficulty: hard
    role: explain
    stem: "A man has a vasectomy in which the vas deferens is cut and tied. Why does this prevent pregnancy?"
    correct: "Sperms cannot pass from the testes to the urethra, so no sperms are released in semen"
    unit: ""
    wrong:
      - {text: "Testosterone production stops, which prevents ovulation in his partner", mistake: "assumes the surgery acts on hormones that affect another person"}
      - {text: "Eggs are blocked from entering the uterus", mistake: "confuses the male and female reproductive tracts"}
      - {text: "The prostate stops producing fluid so sperms cannot survive", mistake: "assumes the prostate is the only route for sperms"}
    explanation: "The vas deferens carries sperms from the epididymis towards the urethra, so cutting it stops sperms from being mixed into semen. The testes still make sperms, which are reabsorbed by the body."
    hints:
      - "Identify the tube that carries sperms from the testes."
      - "Think about what the surgery stops from being released."
      - "The procedure is performed on the male, not the female."
    diagram: "Draw the male reproductive tract showing the testis, epididymis, vas deferens, urethra and the bladder, with the vas deferens marked as cut and tied."
    confidence: high
