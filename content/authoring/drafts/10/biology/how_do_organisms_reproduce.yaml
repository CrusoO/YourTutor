  - topic: sexual_reproduction_plants
    type: mcq
    difficulty: hard
    role: explain
    stem: "Which statement correctly contrasts the flowers of wind-pollinated and insect-pollinated plants?"
    correct: "Wind-pollinated flowers have large feathery stigmas and light pollen, while insect-pollinated flowers have bright petals and nectar"
    unit: ""
    wrong:
      - {text: "Wind-pollinated flowers have brightly coloured petals to attract the wind", mistake: "assigns insect-pollination traits to wind-pollinated flowers"}
      - {text: "Insect-pollinated flowers produce large amounts of light, dry pollen", mistake: "reverses the pollen types of the two groups"}
      - {text: "Wind-pollinated flowers have no stamens at all", mistake: "thinks wind-pollinated flowers lack male parts"}
    explanation: "Wind pollination needs large, exposed anthers and feathery stigmas to catch air-borne pollen, and the pollen is light and produced in large amounts. Insect-pollinated flowers rely on petals, scent and nectar to attract insects."
    hints:
      - "Consider how pollen moves between flowers in each case."
      - "Think about what features help catch or attract the pollen carrier."
      - "The pollen of wind-pollinated flowers must be light enough to float."
    diagram: "Draw two flowers side by side: one wind-pollinated with large feathery stigmas and dangling anthers, and one insect-pollinated with bright petals and a nectar guide. Label the stigma, anther, petal and nectar."
    confidence: high
