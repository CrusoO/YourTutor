  - topic: asexual_reproduction
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which organism reproduces mainly by binary fission?"
    correct: "Amoeba"
    unit: ""
    wrong:
      - {text: "Hydra", mistake: "confuses budding with fission"}
      - {text: "Bread mould", mistake: "assumes spore-forming fungi divide by fission"}
      - {text: "Rose plant", mistake: "assumes vegetative cuttings divide by fission"}
    explanation: "An amoeba splits into two equal daughter cells after its nucleus divides, which is binary fission. Hydra reproduces by budding, bread mould by spores, and roses by vegetative propagation."
    hints:
      - "The organism is a single-celled animal-like protist."
      - "Think about a single cell that splits into two equal halves."
      - "The method does not involve a bud or a spore."
