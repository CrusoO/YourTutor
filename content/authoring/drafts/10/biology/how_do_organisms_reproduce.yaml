    type: mcq
    difficulty: hard
    role: explain
    stem: "Why does family planning focus on spacing and limiting births as a public health measure?"
    correct: "Spacing births improves maternal health and reduces child mortality"
    unit: ""
    wrong:
      - {text: "It increases the number of children in each family", mistake: "reverses the aim of family planning"}
