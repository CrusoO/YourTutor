    type: mcq
    difficulty: easy
    role: recall
    stem: "Which method of birth control in males is permanent surgery?"
    correct: "Vasectomy"
    unit: ""
    wrong:
      - {text: "Condom", mistake: "thinks barrier methods are permanent"}
      - {text: "Copper-T", mistake: "confuses an intrauterine device with a surgical method"}
      - {text: "Tubectomy", mistake: "assigns the female surgical procedure to males"}
    explanation: "A vasectomy cuts and seals the vas deferens, so sperms no longer reach the semen. Tubectomy is the female equivalent, and condoms and Copper-T are reversible methods."
    hints:
      - "The surgery is performed on the tube that carries sperms."
      - "Think about the male-specific tube in the scrotum."
      - "The answer is a surgical method, not a barrier or device."
