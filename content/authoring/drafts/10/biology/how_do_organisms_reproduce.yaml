  - topic: reproductive_health
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are oral contraceptive pills effective in preventing pregnancy?"
    correct: "They contain hormones that stop ovulation"
    unit: ""
    wrong:
      - {text: "They kill sperms in the vagina", mistake: "confuses hormonal methods with spermicides"}
      - {text: "They block the fallopian tube physically", mistake: "treats hormones as physical blocks"}
      - {text: "They make the uterus lining thicker so the egg cannot leave", mistake: "reverses the hormonal effect on the uterine lining"}
    explanation: "Oral contraceptives contain synthetic oestrogen and progestin, which inhibit the release of the egg and make cervical mucus hostile to sperms. Without ovulation there is no egg to fertilise."
    hints:
      - "Think about what the egg needs in order to be fertilised."
      - "Consider which step of the cycle the hormones suppress."
      - "The hormones act inside the body, not by blocking a path."
