  - topic: asexual_reproduction
    type: mcq
    difficulty: medium
    role: apply
    stem: "A filament of an alga breaks into several pieces, and each piece grows into a new filament. What is this type of asexual reproduction called?"
    correct: "Fragmentation"
    unit: ""
    wrong:
      - {text: "Budding", mistake: "confuses breaking off with an outgrowth that forms a bud"}
      - {text: "Binary fission", mistake: "assumes any splitting into parts is binary fission"}
      - {text: "Spore formation", mistake: "thinks all filaments reproduce by spores"}
    explanation: "In fragmentation the body breaks into pieces and each piece grows into a complete new organism. Binary fission gives two cells of equal size, and budding forms an outgrowth first."
    hints:
      - "Notice that the parent body breaks apart."
      - "Consider whether the pieces are formed by splitting or by outgrowth."
      - "Each piece must grow into a whole organism."
    diagram: null
    confidence: high
  - topic: asexual_reproduction
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are offspring produced by asexual reproduction usually genetically identical to the parent?"
    correct: "Only one parent contributes genetic material and the DNA is copied directly"
    unit: ""
    wrong:
      - {text: "Two gametes fuse, so the offspring copies both parents", mistake: "describes sexual reproduction instead"}
      - {text: "Random mixing of chromosomes produces identical twins", mistake: "assumes random mixing always gives identical results"}
      - {text: "Mutations occur in every offspring so they all match", mistake: "thinks mutations always make offspring identical"}
    explanation: "Asexual reproduction involves only one parent, so there is no mixing of genetic material from two individuals. The offspring are therefore clones of the parent, apart from rare mutations."
    hints:
      - "Count how many parents contribute genetic material."
      - "Think about whether any gametes are involved."
      - "Consider what happens to the DNA before the cell divides."
    diagram: null
    confidence: high
  - topic: asexual_reproduction
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which advantage of asexual reproduction is most useful when the environment stays stable for a long time?"
    correct: "Well-suited genotypes are copied quickly without needing a mate"
    unit: ""
    wrong:
      - {text: "It produces high variation that helps the population adapt quickly", mistake: "credits asexual reproduction with the variation advantage of sexual reproduction"}
      - {text: "It mixes genes from two parents to create new combinations", mistake: "confuses recombination with copying"}
      - {text: "It needs rare gametes, so offspring are few and well cared for", mistake: "wrongly links asexual reproduction with gametes"}
    explanation: "In a stable environment a well-adapted individual can produce many identical copies quickly and without the time and energy spent finding a mate. Variation matters mainly when conditions change."
    hints:
      - "Think about what is gained when the environment does not change much."
      - "Consider whether finding a partner costs time and energy."
      - "The best-adapted type of organism is the one you want to keep copying."
    diagram: null
    confidence: high
  - topic: asexual_reproduction
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A single bacterium divides by binary fission every 20 minutes. If no cells die, how many bacteria are present after 2 hours, starting from one cell?"
    correct: "64"
    unit: ""
    wrong: []
    explanation: "Two hours is 120 minutes, which gives 6 divisions of 20 minutes each. The population doubles each time, so 2 raised to the power 6 gives 64 bacteria."
    hints:
      - "Work out how many 20-minute periods fit into 2 hours."
      - "Each division doubles the number of cells."
      - "Multiply 2 by itself once for each division."
    diagram: null
    confidence: high
  - topic: sexual_reproduction_plants
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which part of a flower produces pollen grains?"
    correct: "Anther"
    unit: ""
    wrong:
      - {text: "Stigma", mistake: "confuses the receiving part with the pollen-producing part"}
      - {text: "Ovary", mistake: "assumes the seed-producing part makes pollen"}
      - {text: "Style", mistake: "thinks the stalk above the ovary makes gametes"}
    explanation: "The anther is the top part of the stamen, and it contains pollen sacs in which male gametes develop. The stigma receives pollen, and the ovary contains ovules."
    hints:
      - "Think about the male part of the flower."
      - "The stamen has two main parts: a stalk and a top part."
      - "The answer is the part at the top of the stamen."
