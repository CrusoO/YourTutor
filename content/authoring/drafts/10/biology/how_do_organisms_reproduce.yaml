    type: mcq
    difficulty: medium
    role: apply
    stem: "Which contraceptive is placed inside the uterus and releases copper or hormones to prevent pregnancy?"
    correct: "Intrauterine device"
    unit: ""
    wrong:
      - {text: "Condom", mistake: "assumes all contraceptives are worn externally"}
      - {text: "Oral pill", mistake: "thinks tablets are placed in the uterus"}
