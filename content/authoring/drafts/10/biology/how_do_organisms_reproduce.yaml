  - topic: human_reproductive_system
    type: mcq
    difficulty: easy
    role: recall
    stem: "In which organ of the human male are sperms produced?"
    correct: "Testes"
    unit: ""
    wrong:
      - {text: "Prostate gland", mistake: "treats an accessory gland as the producing organ"}
      - {text: "Epididymis", mistake: "assumes the storage tube is where sperms are made"}
      - {text: "Scrotum", mistake: "thinks the sac around the testes produces sperms"}
    explanation: "The testes make sperms in the seminiferous tubules and also produce testosterone. The epididymis stores and matures sperms, and the scrotum holds the testes at a slightly lower temperature."
    hints:
      - "Think about the paired organs in the scrotum."
      - "The organ is the one that also makes the male sex hormone."
      - "The answer is not a tube or a sac."
