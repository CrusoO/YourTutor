  - topic: sexual_reproduction_plants
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which part of a flower develops into the fruit after fertilisation?"
    correct: "Ovary"
    unit: ""
    wrong:
      - {text: "Ovule", mistake: "thinks the structure inside the ovary becomes the fruit"}
      - {text: "Petal", mistake: "assumes the coloured part forms the fruit"}
      - {text: "Sepal", mistake: "confuses protective parts with fruit-forming parts"}
    explanation: "After fertilisation the ovary wall develops into the fruit, and the ovules inside it develop into seeds. Petals and sepals usually fall away."
    hints:
      - "Think about the part that contains the ovules."
      - "The fruit grows from the base of the carpel."
      - "The ovules inside this part become seeds."
    diagram: null
    confidence: high
  - topic: sexual_reproduction_plants
    type: mcq
    difficulty: medium
    role: explain
    stem: "After a pollen grain lands on a compatible stigma, what happens to it?"
    correct: "It grows a pollen tube down the style that carries the male gametes to the ovule"
    unit: ""
    wrong:
      - {text: "It moves into the ovary through a petal", mistake: "thinks pollen travels through petals"}
      - {text: "It divides into a new flower", mistake: "assumes a pollen grain develops into a plant on its own"}
      - {text: "It is absorbed directly by the wall of the ovule", mistake: "skips the tube and assumes direct absorption"}
    explanation: "The pollen grain germinates on the stigma and grows a pollen tube through the style. The tube delivers two male gametes to the ovule, where one fertilises the egg."
    hints:
      - "Think about how the male gametes must reach the ovule."
      - "Consider the structure that runs from the stigma to the ovary."
      - "The pollen grain must form a structure to travel down."
    diagram: "Draw a flower in section showing the stamen with the anther on the filament, the stigma, the style, and the ovary containing ovules. Add an arrow showing a pollen tube growing from the stigma down the style to an ovule."
    confidence: high
