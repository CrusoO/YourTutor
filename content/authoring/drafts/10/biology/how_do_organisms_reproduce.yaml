  - topic: reproductive_health
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which contraceptive is a barrier method that also helps protect against sexually transmitted infections?"
    correct: "Condom"
    unit: ""
    wrong:
      - {text: "Oral contraceptive pill", mistake: "thinks pills protect against infections"}
      - {text: "Copper-T", mistake: "assumes the intrauterine device blocks infections"}
      - {text: "Vasectomy", mistake: "assumes a permanent surgery gives protection against infections"}
    explanation: "A condom is a barrier that stops sperms and many infectious agents from passing between partners. Pills and Copper-T do not protect against infections, and vasectomy is a surgical method."
    hints:
      - "Think about a barrier worn over a body part during intercourse."
      - "Consider which method covers the penis."
      - "The method is not hormonal or surgical."
