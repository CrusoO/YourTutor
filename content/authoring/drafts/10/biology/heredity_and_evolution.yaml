items:
  - topic: variation_and_inheritance
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the term for differences among individuals of the same species?"
    correct: "Variation"
    unit: ""
    wrong:
      - {text: "Adaptation", mistake: "uses the word for useful traits as the general term for differences"}
      - {text: "Evolution", mistake: "confuses the long-term process with the observed differences"}
      - {text: "Mutation", mistake: "assumes all differences come from new mutations"}
    explanation: "Variation is the range of differences in traits seen among members of a species. Adaptation is a trait that improves survival, evolution is change in populations over time, and mutation is one source of variation."
    hints:
      - "The word describes how individuals differ from one another."
      - "Think about the general term, not one particular cause."
      - "The answer is a property seen across a population."
    diagram: null
    confidence: high
  - topic: variation_and_inheritance
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which cell structures in the nucleus carry the genes?"
    correct: "Chromosomes"
    unit: ""
    wrong:
      - {text: "Ribosomes", mistake: "confuses the gene carriers with the protein-making sites"}
      - {text: "Vacuoles", mistake: "assumes storage sacs carry hereditary information"}
      - {text: "Lysosomes", mistake: "assumes digestive organelles hold genes"}
    explanation: "Genes are sections of DNA located on chromosomes in the nucleus. Ribosomes make proteins, vacuoles store materials and lysosomes digest waste."
    hints:
      - "These structures are made of DNA wound around proteins."
      - "Think about the structures that appear during cell division."
      - "The answer is found inside the nucleus."
    diagram: null
    confidence: high
  - topic: variation_and_inheritance
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do offspring of the same parents often show different traits?"
    correct: "Each parent gives gametes with different combinations of alleles, and fertilisation mixes them at random"
    unit: ""
    wrong:
      - {text: "The environment alone creates all differences between siblings", mistake: "ignores the genetic differences that arise from inheritance"}
      - {text: "Offspring always inherit the same allele from each parent", mistake: "forgets that a gene can have several alleles"}
      - {text: "Mutations occur in every offspring, so each one differs from its parents", mistake: "assumes mutation happens in every individual every generation"}
    explanation: "Sexual reproduction produces gametes that carry different mixtures of alleles, due to independent assortment and crossing over during meiosis. Random fertilisation then combines them, so siblings differ."
    hints:
      - "Think about how the gametes of one parent are formed."
      - "Consider what happens when a sperm and an egg combine."
      - "Recall that genes can exist in more than one form."
    diagram: null
    confidence: high
  - topic: variation_and_inheritance
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which of these is an example of an inherited variation in humans?"
    correct: "Blood group"
    unit: ""
    wrong:
      - {text: "A scar from a cut", mistake: "confuses changes acquired during life with inherited ones"}
      - {text: "A suntan from long hours in sunlight", mistake: "treats environmental changes as genetic"}
      - {text: "Weight gained from a change in diet", mistake: "treats lifestyle changes as inheritable"}
    explanation: "Blood group is determined by alleles passed from parents to children. A scar, a suntan and weight gain are changes caused by the environment or by injury and are not inherited."
    hints:
      - "Ask whether the trait is determined by genes passed from parents."
      - "Think about which feature a child is born with."
      - "Each wrong option is a change that happens after birth."
    diagram: null
    confidence: high
  - topic: variation_and_inheritance
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why are characteristics acquired during a person's life, such as muscle built by exercise, not passed on to the next generation?"
    correct: "Only changes in the DNA of the gametes can be inherited"
    unit: ""
    wrong:
      - {text: "Acquired characteristics are removed by the body before reproduction", mistake: "assumes the body clears acquired changes"}
      - {text: "Changes in body cells are copied into the sex cells", mistake: "reverses the difference between body cells and sex cells"}
      - {text: "Acquired characteristics only occur in animals, not in humans", mistake: "limits the concept to one group of organisms"}
    explanation: "Inheritance depends on the genetic material passed in gametes. Changes in body cells, such as muscle growth, do not alter the DNA of the sperm or egg, so they are not inherited."
    hints:
      - "Consider which cells the genetic information must pass through."
      - "Ask whether a change in a muscle cell alters the egg or sperm."
      - "Think about the difference between body cells and reproductive cells."
    diagram: null
    confidence: high
  - topic: variation_and_inheritance
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which process is the ultimate source of new alleles in a population?"
    correct: "Mutation, a change in the DNA sequence"
    unit: ""
    wrong:
      - {text: "Crossing over only", mistake: "confuses the reshuffling of existing alleles with the creation of new ones"}
      - {text: "Random fertilisation", mistake: "assumes fertilisation creates new alleles rather than combining them"}
      - {text: "Natural selection", mistake: "credits natural selection with creating variation"}
    explanation: "Mutations change the DNA sequence and produce new alleles. Crossing over, random fertilisation and natural selection rearrange or filter existing alleles."
    hints:
      - "Think about what changes the sequence of the DNA itself."
      - "Consider which process creates a new version of a gene."
      - "The process that rearranges genes does not create them."
    diagram: null
    confidence: high
  - topic: evolution_and_speciation
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the term for the process in which individuals better suited to their environment survive and reproduce more successfully?"
    correct: "Natural selection"
    unit: ""
    wrong:
      - {text: "Artificial selection", mistake: "confuses the natural environment with human breeding choices"}
      - {text: "Genetic drift", mistake: "treats random changes in allele frequency as the same process"}
      - {text: "Mutation", mistake: "confuses the source of variation with the process that selects among it"}
    explanation: "Natural selection favours individuals with traits that suit the environment, so their alleles become more common over generations. Artificial selection is done by humans, genetic drift is random, and mutation is a source of variation."
    hints:
      - "Think about the process that acts through the environment."
      - "Consider which process makes favourable traits more common."
      - "The process is named after a natural agent, not a human one."
    diagram: null
    confidence: high
  - topic: evolution_and_speciation
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is formed when two populations become reproductively isolated and can no longer produce fertile offspring together?"
    correct: "A new species"
    unit: ""
    wrong:
      - {text: "A new ecosystem", mistake: "confuses population separation with a change in ecosystem structure"}
      - {text: "A new food chain", mistake: "treats feeding relationships as the result of speciation"}
      - {text: "An identical gene pool in both populations", mistake: "assumes isolated populations stay the same"}
    explanation: "When populations can no longer interbreed to produce fertile offspring, they are separate species. Ecosystem and food chain changes are not the defining result of speciation."
    hints:
      - "Think about the group of organisms that can breed with each other."
      - "Consider what has changed about the ability to interbreed."
      - "The answer is a biological group, not a feature of the environment."
    diagram: null
    confidence: high
  - topic: evolution_and_speciation
    type: mcq
    difficulty: medium
    role: explain
    stem: "How can geographic isolation contribute to the formation of a new species?"
    correct: "Separated populations accumulate different variations, and selection may act differently in each"
    unit: ""
    wrong:
      - {text: "Isolated populations stop all mutations in their genes", mistake: "assumes isolation stops mutations"}
      - {text: "Isolation makes all members of both populations identical", mistake: "assumes isolation causes uniform traits"}
      - {text: "Isolated populations always become identical to the ancestral population", mistake: "assumes separated groups never change"}
    explanation: "When populations are separated, gene flow stops, so their gene pools drift apart through mutation, drift and different selection pressures. Over time they may become unable to interbreed."
    hints:
      - "Think about what happens to gene flow when populations are separated."
      - "Consider how different environments affect which variants survive."
      - "Separation tends to increase differences between populations."
    diagram: null
    confidence: high
  - topic: evolution_and_speciation
    type: mcq
    difficulty: medium
    role: apply
    stem: "A predator eats the most visible beetles in a population, and the beetles vary in colour. Which outcome is most likely over many generations?"
    correct: "The frequency of camouflaged beetles increases"
    unit: ""
    wrong:
      - {text: "Visible beetles evolve camouflage within their own lifetime", mistake: "believes individuals adapt during their own lifetime"}
      - {text: "All beetles become visible because predation is random", mistake: "assumes predation removes individuals at random"}
      - {text: "The beetle population stops changing because selection ends", mistake: "assumes selection stops in a stable environment"}
    explanation: "Camouflaged beetles survive better and reproduce more, so their alleles become more common. Individuals do not change colour in their lifetime, and selection continues as long as the predation pressure lasts."
    hints:
      - "Ask which beetles are more likely to be eaten."
      - "Think about which colour variant will leave more offspring."
      - "Consider whether any individual can change its inherited colour."
    diagram: null
    confidence: high
  - topic: evolution_and_speciation
    type: mcq
    difficulty: hard
    role: explain
    stem: "Which statement best contrasts Lamarck's idea of evolution with Darwin's?"
    correct: "Lamarck proposed that traits acquired during life are inherited, while Darwin proposed that heritable variations are selected by the environment"
    unit: ""
    wrong:
      - {text: "Darwin proposed that acquired traits are inherited, while Lamarck proposed natural selection", mistake: "swaps the ideas of the two scientists"}
      - {text: "Both proposed that traits arise only through use or disuse of organs", mistake: "assumes both used the same mechanism"}
      - {text: "Both proposed that species do not change over time", mistake: "assumes early theories denied evolution"}
    explanation: "Lamarck suggested that use and disuse of organs during life are passed to offspring. Darwin proposed that individuals differ in heritable traits and that the environment selects those best suited to survive and reproduce."
    hints:
      - "Think about how each scientist explained the origin of new traits."
      - "Consider which idea involves the environment selecting from existing differences."
      - "Notice which scientist proposed inheritance of traits gained during life."
    diagram: null
    confidence: low
  - topic: evolution_and_speciation
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Two bird populations are separated by a mountain range for many generations. When they are reunited, they can no longer interbreed. What is the best explanation?"
    correct: "Reproductive isolation developed through accumulated genetic differences"
    unit: ""
    wrong:
      - {text: "Each population mutated into a different species in a single generation", mistake: "assumes speciation happens in one step"}
      - {text: "The mountain range changed the birds' genes directly", mistake: "treats geography as a direct genetic change"}
      - {text: "The birds lost their ability to fly, which made them different species", mistake: "links one trait with speciation"}
    explanation: "Over many generations, the separated populations accumulate genetic differences that prevent successful interbreeding. Speciation is usually gradual rather than a single event."
    hints:
      - "Think about how long the populations were separated."
      - "Consider whether the mountains change the genes directly."
      - "Ask whether speciation usually happens in one generation."
    diagram: null
    confidence: high
  - topic: fossils_and_evidence
    type: mcq
    difficulty: easy
    role: recall
    stem: "What are fossils?"
    correct: "Preserved remains or traces of organisms that lived in the past"
    unit: ""
    wrong:
      - {text: "Living organisms found in the deep ocean", mistake: "treats modern deep-sea life as fossil material"}
      - {text: "Artificial objects made by early humans", mistake: "confuses fossils with artefacts"}
      - {text: "Rocks formed only from cooled lava", mistake: "mixes fossils up with igneous rock types"}
    explanation: "Fossils are the preserved remains, impressions or traces of past organisms, usually formed in sediments. They give direct evidence of life in earlier times."
    hints:
      - "Think about evidence of life that is no longer alive."
      - "Consider how remains can be preserved in rock."
      - "The answer refers to organisms from the past."
    diagram: null
    confidence: high
  - topic: fossils_and_evidence
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which term describes structures in different animals that have the same basic bone arrangement but may have different functions?"
    correct: "Homologous structures"
    unit: ""
    wrong:
      - {text: "Analogous structures", mistake: "mixes up shared origin with shared function"}
      - {text: "Vestigial organs", mistake: "treats reduced organs as fully functional"}
      - {text: "Fossil records", mistake: "confuses the evidence with the structures themselves"}
    explanation: "Homologous structures share a common underlying anatomy because they were inherited from a common ancestor, even when their functions differ. Analogous structures have similar functions but different origins."
    hints:
      - "Think about shared origin rather than shared function."
      - "The term is the one used for the same bones in a bat wing and a human arm."
      - "Consider which term refers to structures inherited from a common ancestor."
    diagram: null
    confidence: high
  - topic: fossils_and_evidence
    type: mcq
    difficulty: medium
    role: explain
    stem: "The forelimbs of a whale, a bat and a human have a similar bone arrangement, although they are used for different purposes. What does this best suggest?"
    correct: "The three share a common ancestor from which the bone arrangement was inherited"
    unit: ""
    wrong:
      - {text: "The three animals use their forelimbs for the same function", mistake: "assumes similar structure means the same use"}
      - {text: "The forelimb structure is the result of the environment alone", mistake: "ignores inheritance of body plans"}
      - {text: "The bones developed independently in each species for the same purpose", mistake: "treats structural similarity as entirely functional"}
    explanation: "Similar bone arrangements in different species that use the limbs for different purposes point to a common ancestor. This is evidence for evolution by descent with modification."
    hints:
      - "Notice that the function of the limbs is different in the three animals."
      - "Think about why the arrangement of bones would be similar."
      - "Consider what kind of evidence shared anatomy provides."
    diagram: null
    confidence: high
  - topic: fossils_and_evidence
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which fossil evidence best shows a transition between an ancient form and a modern form?"
    correct: "Transitional fossils with features intermediate between the two groups"
    unit: ""
    wrong:
      - {text: "Fossils with features identical to modern animals", mistake: "assumes identical features show change"}
      - {text: "Recent fossils found close to the surface", mistake: "treats the depth or recency of a fossil as proof of transition"}
      - {text: "Living animals with no fossil record at all", mistake: "ignores the value of fossils for showing change over time"}
    explanation: "Transitional fossils display a mix of features from an ancestral and a descendant group, which shows change over time. Identical or very recent fossils do not show a transition."
    hints:
      - "Look for fossils that show a mixture of characteristics."
      - "Think about what a half-way form would look like."
      - "The best evidence compares features, not only dates or depths."
    diagram: null
    confidence: high
  - topic: fossils_and_evidence
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why are fossils in deeper rock layers usually older than fossils in the layers above them?"
    correct: "Sediments settle in layers, so the lower layers were deposited earlier"
    unit: ""
    wrong:
      - {text: "The deeper layers were formed after the upper layers", mistake: "reverses the order in which sediments are laid down"}
      - {text: "Pressure makes deeper fossils younger", mistake: "treats pressure as a measure of age"}
      - {text: "Fossils move downwards through the rock over time", mistake: "assumes fossils migrate through solid rock"}
    explanation: "Undisturbed sedimentary layers are deposited in sequence, so lower layers were laid down before the layers above them. This principle of superposition helps place fossils in time."
    hints:
      - "Think about how sediment builds up over time."
      - "Consider which layer must have been deposited first."
      - "The order is about deposition, not movement."
    diagram: null
    confidence: high
  - topic: fossils_and_evidence
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which statement correctly describes the evidence from embryos for evolution?"
    correct: "Early embryos of different vertebrates look similar, which suggests shared ancestry"
    unit: ""
    wrong:
      - {text: "Embryos of different animals are identical in function at birth", mistake: "confuses early embryonic similarity with adult function"}
      - {text: "Embryos show no relation to the ancestry of the adult animal", mistake: "assumes embryos are unrelated to evolutionary history"}
      - {text: "Embryos show only the adaptations that the adult will later need", mistake: "assumes embryos are simply small adults"}
    explanation: "Vertebrate embryos share features such as gill-like structures and a tail at early stages, which points to a common ancestry. Similarity in early development is evidence that the groups are related."
    hints:
      - "Think about what the embryos of different vertebrates have in common early on."
      - "Consider what the similarity suggests about the ancestors of the adults."
      - "The evidence concerns early development, not the adult function."
    diagram: null
    confidence: medium
