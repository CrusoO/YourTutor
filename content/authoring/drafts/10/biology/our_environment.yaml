  - topic: food_chains_and_webs
    type: mcq
    difficulty: easy
    role: recall
    stem: "In the food chain grass, grasshopper, frog, snake, which organism is the primary consumer?"
    correct: "Grasshopper"
    unit: ""
    wrong:
      - {text: "Grass", mistake: "calls the producer a consumer"}
      - {text: "Frog", mistake: "treats the second consumer as the primary consumer"}
      - {text: "Snake", mistake: "assumes the top predator is the primary consumer"}
    explanation: "The primary consumer is the herbivore that eats the producer, here the grasshopper. Grass is the producer, the frog is a secondary consumer and the snake is a tertiary consumer."
    hints:
      - "Count the steps from the producer."
      - "The first organism that eats the producer is the one you want."
      - "Herbivores are the primary consumers."
    diagram: null
    confidence: high
  - topic: food_chains_and_webs
    type: mcq
    difficulty: easy
    role: recall
    stem: "In a food chain diagram, which way does the arrow point?"
    correct: "From the organism being eaten to the organism that eats it"
    unit: ""
    wrong:
      - {text: "From the predator to its prey", mistake: "reverses the direction of energy flow"}
      - {text: "From the decomposer to the producer", mistake: "assumes decomposers feed producers directly"}
      - {text: "Between organisms of the same trophic level", mistake: "treats the arrows as showing competition"}
    explanation: "Arrows show the flow of energy and matter, so they point from the food to the consumer. This means the arrow points in the direction energy moves."
    hints:
      - "Think about the direction in which the food energy travels."
      - "Consider which organism receives the energy."
      - "The arrow shows the flow of energy, not the hunting direction."
    diagram: null
    confidence: high
  - topic: food_chains_and_webs
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is a food web more stable than a single food chain?"
    correct: "If one species declines, other feeding links can supply alternative food"
    unit: ""
    wrong:
      - {text: "It has only one path of energy flow, which is safer", mistake: "assumes a single path is safer than many paths"}
      - {text: "It removes the need for producers in the ecosystem", mistake: "assumes consumers can do without producers"}
      - {text: "It makes every organism eat the same food", mistake: "assumes a food web means uniform diets"}
    explanation: "A food web has many interconnected feeding links, so a consumer can switch to other prey if one species declines. This makes the community more resistant to change than a single chain."
    hints:
      - "Think about what happens when one food source becomes scarce."
      - "Consider how many links connect the organisms in a web."
      - "A web has more routes than a chain."
    diagram: "Draw a food web with at least five organisms, for example grass, rabbit, deer, fox and snake, with arrows from each food to its consumer and multiple arrows leaving some organisms."
    confidence: high
  - topic: food_chains_and_webs
    type: mcq
    difficulty: medium
    role: apply
    stem: "In the food chain grass, grasshopper, frog, hawk, which organism is the secondary consumer?"
    correct: "Frog"
    unit: ""
    wrong:
