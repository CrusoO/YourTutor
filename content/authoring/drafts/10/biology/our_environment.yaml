      - {text: "Grasshopper", mistake: "counts the herbivore as the secondary consumer"}
      - {text: "Hawk", mistake: "treats the top predator as the secondary consumer"}
    explanation: "Grass is the producer, the grasshopper is the primary consumer, the frog is the secondary consumer and the hawk is the tertiary consumer."
    hints:
      - "Count the steps from the producer."
      - "The primary consumer is one step above the producer."
      - "The secondary consumer is one step above the primary consumer."
