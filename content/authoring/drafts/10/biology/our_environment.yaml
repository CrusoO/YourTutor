  - topic: ecosystem_components
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are decomposers essential in an ecosystem?"
    correct: "They break down dead matter and return nutrients to the soil for producers to use"
    unit: ""
    wrong:
      - {text: "They make food for producers using light", mistake: "treats decomposers as producers"}
      - {text: "They eat herbivores to keep their numbers under control", mistake: "confuses decomposers with predators"}
      - {text: "They store water in the ecosystem for the dry season", mistake: "assigns a water-storage role to decomposers"}
    explanation: "Decomposers such as bacteria and fungi break dead organisms and waste into simple substances. This recycles nutrients so that producers can use them again."
    hints:
      - "Think about what happens to a dead leaf on the forest floor."
      - "Consider how nutrients get back into the soil."
      - "The role is recycling, not feeding on living animals."
    diagram: null
    confidence: high
  - topic: ecosystem_components
    type: mcq
    difficulty: hard
    role: explain
    stem: "Which statement correctly relates the biotic and abiotic components of a pond?"
    correct: "Abiotic factors such as temperature and oxygen limit which organisms can survive in the pond"
    unit: ""
    wrong:
      - {text: "Abiotic factors are unaffected by the organisms living in the pond", mistake: "ignores that organisms change oxygen and nutrient levels"}
      - {text: "Biotic components do not need abiotic factors to survive", mistake: "treats life as independent of water and light"}
      - {text: "Only producers depend on abiotic factors", mistake: "limits the dependence on abiotic factors to plants"}
    explanation: "Abiotic factors set the conditions that determine which species can live in an ecosystem. Organisms also influence abiotic factors, for example by using oxygen and producing waste."
    hints:
      - "Think about conditions that affect every living thing in the pond."
      - "Consider whether organisms change their surroundings."
      - "All organisms depend on some abiotic factors, not only plants."
    diagram: null
    confidence: high
