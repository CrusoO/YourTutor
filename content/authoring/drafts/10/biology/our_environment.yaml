  - topic: ozone_layer
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why is the ozone hole most visible over Antarctica in spring?"
    correct: "Polar stratospheric clouds and returning sunlight speed up ozone destruction by chlorine"
    unit: ""
    wrong:
      - {text: "Antarctica has the most CFC factories in the world", mistake: "assumes local production causes the hole"}
      - {text: "Ozone is produced only in winter over Antarctica", mistake: "assumes ozone formation alone explains the pattern"}
      - {text: "The ozone layer is naturally thinnest at the equator", mistake: "reverses the latitude pattern of ozone"}
    explanation: "Very cold conditions form polar stratospheric clouds that convert chlorine compounds into reactive forms. When sunlight returns in spring, these forms destroy ozone quickly, creating the Antarctic ozone hole."
    hints:
      - "Think about the conditions that form in very cold stratospheric air."
      - "Consider what happens when sunlight returns after the polar night."
      - "The cause is chemical and seasonal, not a matter of local factories."
    diagram: null
    confidence: medium
  - topic: ozone_layer
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which statement about ozone depletion by chlorine is correct?"
    correct: "A single chlorine atom can destroy many ozone molecules before it is removed"
    unit: ""
    wrong:
      - {text: "Chlorine is used up in each ozone molecule it destroys", mistake: "misreads a catalyst as a reactant that is consumed"}
      - {text: "Ozone is destroyed only by sunlight and not by chlorine", mistake: "ignores the catalytic role of chlorine"}
      - {text: "CFCs add ozone to the stratosphere, which thickens the layer", mistake: "reverses the effect of CFCs on ozone"}
    explanation: "Chlorine acts as a catalyst, so one atom can break down many thousands of ozone molecules in a repeating cycle. It is removed only slowly by other reactions."
    hints:
      - "Think about whether chlorine is consumed in each reaction."
      - "Consider what a catalyst does in a chemical reaction."
      - "Ask whether the chlorine atom comes back out of the cycle."
    diagram: null
    confidence: high
  - topic: waste_management
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which of the three Rs means using an item again without first processing it?"
    correct: "Reuse"
    unit: ""
    wrong:
      - {text: "Reduce", mistake: "mixes up cutting down use with using an item again"}
      - {text: "Recycle", mistake: "thinks recycling means using without processing"}
      - {text: "Restore", mistake: "assumes restoring a habitat is one of the waste-management Rs"}
    explanation: "Reuse means using an item again for the same or a different purpose without reprocessing it, such as refilling a bottle. Reduce means using less, and recycle means processing waste into new material."
    hints:
      - "Think about using a bottle again for water."
      - "The word refers to the same item being used a second time."
      - "Recycling involves processing, so it is not this option."
    diagram: null
