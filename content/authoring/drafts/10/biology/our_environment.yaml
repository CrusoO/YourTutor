    confidence: high
  - topic: ecosystem_components
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which group of biotic components makes its own food from simple inorganic substances?"
    correct: "Producers"
    unit: ""
    wrong:
      - {text: "Consumers", mistake: "thinks feeding on other organisms makes an organism self-sufficient"}
      - {text: "Decomposers", mistake: "confuses breaking down dead matter with making food"}
      - {text: "Scavengers", mistake: "assumes scavengers produce their own food"}
    explanation: "Producers, mainly green plants and some bacteria, make food by photosynthesis or chemosynthesis. Consumers and decomposers obtain their food from other organisms."
    hints:
      - "Think of the group that forms the base of a food chain."
      - "Consider which group captures energy from sunlight."
      - "The group is autotrophic."
