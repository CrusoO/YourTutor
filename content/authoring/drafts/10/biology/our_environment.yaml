    confidence: high
  - topic: ecosystem_components
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which pair consists of two abiotic components of a pond?"
    correct: "Temperature and dissolved oxygen"
    unit: ""
    wrong:
