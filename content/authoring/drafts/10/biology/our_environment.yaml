  - topic: waste_management
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the main purpose of composting biodegradable kitchen waste?"
    correct: "To turn it into nutrient-rich soil conditioner through decomposition"
    unit: ""
    wrong:
