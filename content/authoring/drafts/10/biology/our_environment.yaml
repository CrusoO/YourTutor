      - {text: "Air and bacteria", mistake: "treats microbes as non-living"}
      - {text: "Rocks and grass", mistake: "treats plants as abiotic because they grow on rocks"}
    explanation: "Temperature and dissolved oxygen are physical and chemical factors, so both are abiotic. Mushrooms and bacteria are living organisms, and grass is a plant."
    hints:
      - "Check each option for anything that is alive."
      - "Think about physical or chemical conditions of the water."
      - "The pair should contain no living thing."
