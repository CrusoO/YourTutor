    explanation: "The ozone layer in the stratosphere absorbs most of the harmful ultraviolet radiation from the Sun. Carbon dioxide, nitrogen and water vapour do not form a comparable shield."
    hints:
      - "Think about the gas that absorbs ultraviolet light in the upper atmosphere."
      - "Consider which form of oxygen has three atoms."
