  - topic: food_chains_and_webs
    type: mcq
    difficulty: hard
    role: explain
    stem: "In a pond food web containing algae, small fish, large fish and herons, pesticide levels are rising. Which organism is likely to have the highest concentration of the pesticide?"
    correct: "Heron"
    unit: ""
    wrong:
      - {text: "Algae", mistake: "assumes producers accumulate the most because they are in contact with the water"}
      - {text: "Small fish", mistake: "treats the middle level as the most exposed"}
      - {text: "Large fish", mistake: "stops the chain one level below the top predator"}
    explanation: "Persistent pesticides accumulate along the food chain, so the organism at the top, the heron, usually has the highest concentration. Algae hold the lowest concentration because they are at the bottom of the chain."
    hints:
      - "Think about which organism eats the most other organisms over time."
      - "Consider the level of the chain at which the pesticide is stored."
      - "The top predator is the one you should consider."
    diagram: "Draw a pond food web with algae at the base, small fish and large fish in the middle, and herons at the top, with arrows showing energy flow and a column beside showing rising pesticide concentration at each level."
    confidence: medium
  - topic: food_chains_and_webs
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Two species in the same food web eat the same food source. What is this relationship called?"
    correct: "Competition"
    unit: ""
    wrong:
      - {text: "Mutualism", mistake: "assumes sharing a food source is a cooperative relationship"}
      - {text: "Parasitism", mistake: "confuses sharing food with living on another organism"}
      - {text: "Predation", mistake: "treats any eating as predation"}
    explanation: "When two species use the same limited resource, they compete for it and each may be harmed by the other's use. Mutualism benefits both species, parasitism benefits one at the expense of the other, and predation involves killing and eating prey."
    hints:
      - "Think about what happens when a resource is limited and shared."
      - "Ask whether either species gains from the other."
      - "The relationship is about a shared resource, not a predator and prey."
    diagram: null
    confidence: high
  - topic: energy_flow_and_biomagnification
    type: mcq
    difficulty: easy
    role: recall
    stem: "About what percentage of energy is passed from one trophic level to the next in a food chain?"
    correct: "About 10 percent"
    unit: ""
    wrong:
      - {text: "About 90 percent", mistake: "assumes most energy is passed on"}
      - {text: "About 50 percent", mistake: "uses halving as the rule for energy transfer"}
      - {text: "All of it", mistake: "assumes energy is conserved along the chain without loss"}
    explanation: "Only about 10 percent of the energy at one level is transferred to the next, while the rest is lost as heat, used in respiration or left as undigested matter. This is why food chains are usually short."
    hints:
      - "Think about how much energy is lost as heat at each step."
      - "Consider the small fraction that is stored in the body."
      - "The rule is a tenth, not a half."
    diagram: null
    confidence: high
  - topic: energy_flow_and_biomagnification
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which type of substance accumulates in the bodies of top predators in a food chain?"
    correct: "A persistent toxic chemical such as DDT"
    unit: ""
    wrong:
      - {text: "Carbon dioxide", mistake: "treats the gas from respiration as a persistent toxin"}
      - {text: "Glucose", mistake: "confuses food energy with a toxin"}
      - {text: "Oxygen", mistake: "treats the gas needed for respiration as a pollutant"}
    explanation: "Persistent chemicals such as DDT are stored in fat and are not broken down quickly, so their concentration rises at each step of the chain. This process is called biomagnification."
    hints:
      - "Think about a chemical that is hard to break down."
      - "Consider which substance is harmful and passed on in food."
      - "The substance is a pollutant, not a nutrient or respiratory gas."
    diagram: null
    confidence: high
  - topic: energy_flow_and_biomagnification
    type: mcq
    difficulty: medium
    role: apply
    stem: "In a grassland food chain, the producers capture 10000 kJ of energy. Assuming the usual 10 percent transfer at each step, how much energy is available to the primary consumers?"
    correct: "1000 kJ"
    unit: ""
    wrong:
      - {text: "5000 kJ", mistake: "assumes half the energy passes on at each step"}
      - {text: "100 kJ", mistake: "applies the 10 percent rule twice for one step"}
      - {text: "10000 kJ", mistake: "assumes no energy is lost between levels"}
    explanation: "Ten percent of 10000 kJ is 1000 kJ, which is the energy available to the primary consumers. The remaining energy is lost as heat or used in life processes."
    hints:
      - "Work out what 10 percent of the producer energy is."
      - "Only one transfer step is needed to reach the primary consumers."
      - "Multiply 10000 by 0.1."
    diagram: "Draw an energy pyramid with four levels labelled producers, primary consumers, secondary consumers and tertiary consumers, with the width decreasing towards the top and the values 10000, 1000, 100 and 10 kJ written on the levels."
    confidence: high
  - topic: energy_flow_and_biomagnification
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are there usually fewer top predators than herbivores in an ecosystem?"
    correct: "Only a small fraction of energy reaches the higher levels to support large numbers"
    unit: ""
    wrong:
      - {text: "Top predators reproduce less often than producers", mistake: "explains the pattern only by reproduction rates"}
      - {text: "Top predators are always smaller than herbivores", mistake: "assumes size determines population size"}
      - {text: "Herbivores eat the predators in the food chain", mistake: "reverses the direction of feeding"}
    explanation: "Each step up the food chain receives much less energy, so the energy available cannot support as many top predators as herbivores. This is why food pyramids narrow towards the top."
    hints:
      - "Think about how much energy is passed to each level."
      - "Consider what a higher level can support given less energy."
      - "The pattern is about energy, not about body size."
    diagram: null
    confidence: high
  - topic: energy_flow_and_biomagnification
    type: mcq
    difficulty: hard
    role: explain
    stem: "A persistent pesticide is found at much higher concentration in a hawk than in the grass where it started. What is the best explanation?"
    correct: "Each feeding step concentrates the chemical because the animal retains it while eating many prey"
    unit: ""
    wrong:
      - {text: "The chemical is produced by the hawk's own metabolism", mistake: "assumes top predators manufacture the toxin"}
      - {text: "The substance breaks down faster in plants than in animals", mistake: "reverses which organisms retain the chemical"}
      - {text: "Energy moving up the chain carries the toxin upward without any loss", mistake: "confuses energy flow with chemical retention"}
    explanation: "Persistent chemicals are stored in fat and are not excreted quickly, so each animal that eats many contaminated prey ends up with a higher total amount in its body. This is biomagnification."
    hints:
      - "Think about whether the animal can get rid of the chemical quickly."
      - "Consider how many contaminated prey one predator eats."
      - "Ask where the chemical is stored in the body."
    diagram: "Draw a food chain of grass, grasshopper, frog and hawk, with a column beside showing the pesticide concentration rising at each level."
    confidence: high
  - topic: energy_flow_and_biomagnification
    type: numeric
    difficulty: hard
    role: transfer
    stem: "In a food chain the producers store 50000 kJ of energy. Assuming 10 percent is passed on at each step, how many kJ reach the tertiary consumers?"
    correct: "50"
    unit: "kJ"
    wrong: []
    explanation: "The energy passes from producers to primary consumers (5000 kJ), then to secondary consumers (500 kJ), then to tertiary consumers (50 kJ). That is three transfer steps of 10 percent each."
