  - topic: ozone_layer
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is ozone depletion a concern for human health?"
    correct: "More ultraviolet radiation reaches the surface, increasing the risk of skin cancer and eye damage"
    unit: ""
    wrong:
      - {text: "Less ultraviolet light makes skin produce more ozone", mistake: "reverses the link between ultraviolet light and ozone"}
      - {text: "Ozone stops oxygen reaching the lungs", mistake: "confuses ozone with the gas needed for breathing"}
      - {text: "Depletion makes the air heavier and causes drought", mistake: "links ozone depletion with weight of air"}
    explanation: "Ozone absorbs harmful ultraviolet B radiation. When the layer thins, more of this radiation reaches the ground, raising the risk of skin cancer, cataracts and damage to the immune system."
    hints:
      - "Think about what the ozone layer blocks from reaching the ground."
      - "Consider which type of radiation damages skin cells."
      - "The health concern is about the radiation, not about the gas itself."
    diagram: null
    confidence: high
  - topic: ozone_layer
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which international agreement was made to phase out the production of ozone-depleting substances?"
    correct: "Montreal Protocol"
    unit: ""
    wrong:
      - {text: "Kyoto Protocol", mistake: "mixes up the ozone agreement with the climate change agreement"}
      - {text: "Paris Agreement", mistake: "assumes all environmental agreements cover ozone depletion"}
      - {text: "Ramsar Convention", mistake: "confuses wetland protection with ozone protection"}
    explanation: "The Montreal Protocol, agreed in 1987, set schedules for phasing out CFCs and other ozone-depleting chemicals. The Kyoto and Paris agreements deal with greenhouse gases and climate change, and the Ramsar Convention deals with wetlands."
    hints:
      - "Think about the agreement signed in the Canadian city after which it is named."
      - "Consider which agreement focuses on the protection of the ozone layer."
