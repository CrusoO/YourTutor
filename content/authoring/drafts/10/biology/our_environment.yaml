  - topic: ozone_layer
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which group of chemicals is mainly responsible for the depletion of the ozone layer?"
    correct: "Chlorofluorocarbons (CFCs)"
    unit: ""
    wrong:
      - {text: "Oxygen", mistake: "assumes the element that makes ozone also destroys it"}
      - {text: "Carbon monoxide", mistake: "assumes any gas from combustion depletes ozone"}
      - {text: "Methane", mistake: "confuses greenhouse gases with ozone-depleting chemicals"}
    explanation: "CFCs were used in refrigerants, aerosols and foams. When they reach the stratosphere, they release chlorine that breaks down ozone. Oxygen is the element that forms ozone and is not the cause of depletion."
    hints:
      - "Think about man-made chemicals used in refrigeration and aerosols."
      - "Consider which chemicals release chlorine in the upper atmosphere."
      - "The answer is a group of human-made compounds that contain fluorine."
