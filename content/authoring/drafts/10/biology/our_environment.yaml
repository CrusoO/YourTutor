  - topic: ecosystem_components
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which of these is an abiotic component of an ecosystem?"
    correct: "Sunlight"
    unit: ""
    wrong:
      - {text: "Earthworm", mistake: "treats soil animals as non-living"}
      - {text: "Fungus", mistake: "classifies decomposers as non-living"}
      - {text: "Grass", mistake: "treats plants as abiotic because they are rooted in soil"}
    explanation: "Abiotic components are non-living factors such as light, temperature, water, air and soil. Earthworms, fungi and grass are all living and so are biotic."
    hints:
      - "Abiotic means not alive."
      - "Think about the physical factor that plants need to make food."
      - "Eliminate any option that is an organism."
