    confidence: high
  - topic: electromagnetic_induction
    type: mcq
    difficulty: easy
    role: recall
    stem: "The direction of an induced current in a moving conductor is found by which rule?"
    correct: "The right-hand rule, with the thumb showing the motion, the forefinger the field and the middle finger the induced current"
    unit: ""
    wrong:
      - {text: "The left-hand rule for the motor effect", mistake: "uses the motor rule for a generator"}
      - {text: "The right-hand thumb rule for the field around a wire", mistake: "applies the rule for the field around a wire to an induced current"}
      - {text: "The rule that like poles repel", mistake: "applies the rule for electric charges to magnets"}
    explanation: "For a conductor moving in a magnetic field, the right-hand rule gives the direction of the induced current. The thumb points along the motion, the forefinger along the field, and the middle finger along the induced current. This is the generator counterpart of the left-hand motor rule."
    hints:
      - "Recall which hand is used for generators and which for motors."
      - "Think about the three quantities involved: motion, field and induced current."
      - "Ask which of the two hands is used when the conductor moves rather than carries current."
    diagram: null
    confidence: high
  - topic: electromagnetic_induction
    type: mcq
    difficulty: medium
    role: explain
    stem: "A bar magnet is pushed into a coil connected to a galvanometer, and the needle deflects in one direction. The magnet is then pulled out of the coil. What happens to the direction of the deflection?"
    correct: "It is in the opposite direction"
    unit: ""
    wrong:
      - {text: "It is in the same direction", mistake: "assumes the induced current depends only on the position of the magnet, not on the change"}
      - {text: "It is zero", mistake: "assumes only pushing the magnet in can induce a current"}
      - {text: "It is larger and steady", mistake: "confuses a steady field with a changing flux"}
    explanation: "Pushing the magnet in increases the flux through the coil, and pulling it out decreases the flux. The induced current opposes the change in each case, so the current, and the deflection, reverses. A steady magnet held still gives no deflection."
    hints:
      - "Think about whether the magnetic flux through the coil is increasing or decreasing in each case."
      - "Ask how the induced current responds to a change in the flux."
      - "Consider whether the galvanometer needle deflects when the magnet is still."
    diagram: "Coil drawn as several loops connected to a galvanometer. A bar magnet is shown above the coil with its north pole pointing down. Draw one arrow showing the magnet being pushed into the coil and a second arrow showing it being withdrawn."
    confidence: high
  - topic: electromagnetic_induction
    type: mcq
    difficulty: medium
    role: apply
    stem: "A rectangular coil is rotated in a uniform magnetic field. At which position of the coil is the induced emf the largest?"
    correct: "When the plane of the coil is parallel to the field"
    unit: ""
    wrong:
      - {text: "When the plane of the coil is perpendicular to the field", mistake: "confuses the maximum flux with the maximum rate of change of flux"}
      - {text: "When the plane of the coil is at 45 degrees to the field", mistake: "assumes the midpoint of the rotation gives the largest emf"}
      - {text: "The emf is the same in every position", mistake: "thinks the induced emf does not depend on the angle of the coil"}
    explanation: "The induced emf depends on how fast the flux changes. When the plane of the coil is parallel to the field, the flux is zero but changing at its fastest rate, so the emf is largest. When the plane is perpendicular to the field, the flux is largest but momentarily not changing, so the emf is zero."
    hints:
      - "Consider whether the emf depends on the flux itself or on how fast it changes."
      - "Think about the flux when the coil is perpendicular to the field."
      - "Ask at which position the flux is changing most rapidly."
    diagram: null
    confidence: high
  - topic: electromagnetic_induction
    type: mcq
    difficulty: hard
    role: transfer
    stem: "The coil of an AC generator is rotated faster. What happens to the output?"
    correct: "The peak induced emf increases and the frequency of the output also increases"
    unit: ""
    wrong:
      - {text: "The frequency decreases while the peak emf stays the same", mistake: "thinks faster rotation lowers the frequency of the output"}
      - {text: "The current changes direction less often", mistake: "assumes faster rotation reduces how often the current alternates"}
      - {text: "The output becomes direct current", mistake: "confuses the speed of rotation with the use of a commutator"}
    explanation: "Faster rotation means the flux changes more rapidly, so the peak induced emf is larger. The output also completes more cycles each second, so its frequency increases. The current still alternates, because the slip rings do not reverse its direction in an AC generator."
    hints:
      - "Think about how the rate of change of flux depends on the speed of rotation."
      - "Ask how many complete cycles the coil makes in a second when it turns faster."
      - "Consider whether an AC generator uses a commutator or slip rings."
    diagram: null
    confidence: high
  - topic: electromagnetic_induction
    type: mcq
    difficulty: hard
    role: apply
    stem: "A straight conductor moves at right angles to a uniform magnetic field and produces an induced emf. If its speed is doubled and everything else is kept the same, the induced emf:"
    correct: "Doubles"
    unit: ""
    wrong:
      - {text: "Halves", mistake: "treats the emf as inversely proportional to the speed"}
      - {text: "Quadruples", mistake: "assumes the emf depends on the square of the speed"}
      - {text: "Is unchanged", mistake: "thinks the emf depends only on the field and not on the speed"}
    explanation: "For a conductor of length L moving at speed v perpendicular to a field B, the induced emf is BLv. The emf is directly proportional to the speed, so doubling the speed doubles the emf."
    hints:
      - "Recall how the induced emf in a moving conductor depends on its speed."
