items:
  - topic: magnetic_field_lines
    type: mcq
    difficulty: easy
    role: recall
    stem: "Outside a bar magnet, the magnetic field lines run:"
    correct: "From the north pole to the south pole"
    unit: ""
    wrong:
      - {text: "From the south pole to the north pole", mistake: "reverses the direction of the field outside the magnet"}
      - {text: "In circles around the magnet", mistake: "uses the field pattern of a straight current-carrying wire for a bar magnet"}
      - {text: "Outward from the centre of the magnet", mistake: "treats the poles as separate sources at the centre"}
    explanation: "By convention, magnetic field lines point from the north pole to the south pole outside a bar magnet. They form closed loops, continuing from the south pole back to the north pole inside the magnet. The direction is the direction a free north pole would move."
    hints:
      - "Recall the direction in which a compass needle points near a magnet."
      - "Ask whether the field lines are closed loops or open lines."
      - "Think about which pole a field line leaves from when it comes out of the magnet."
    diagram: "Bar magnet drawn in the middle of the page with N and S labelled. Several closed loops are drawn: outside the magnet they run from N to S, and inside the magnet they return from S to N. Add arrowheads on every line to show the direction."
    confidence: high
  - topic: magnetic_field_lines
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which statement about magnetic field lines is FALSE?"
    correct: "Two field lines can cross each other at a point where the field is strong"
    unit: ""
    wrong:
      - {text: "Field lines form closed loops around a magnet", mistake: "treats field lines as open paths that start and stop at the poles"}
      - {text: "Field lines are closer together where the field is stronger", mistake: "confuses the density of lines with their direction"}
      - {text: "Field lines start at the north pole and end at the south pole only inside the magnet", mistake: "confines the field to the inside of the magnet"}
    explanation: "Magnetic field lines never cross each other, because at any point the field has a single direction. They form closed loops and are closer together where the field is stronger. Field lines do not end at the poles of a magnet, so the statement about crossing is the false one."
    hints:
      - "Consider what a single point in space can have for the direction of the field."
      - "Think about what closeness of the lines tells you about the strength of the field."
      - "Ask whether field lines are closed curves or open ones."
    diagram: null
    confidence: high
  - topic: magnetic_field_lines
    type: mcq
    difficulty: medium
    role: explain
    stem: "A long straight wire carries current upward through the page, perpendicular to the page. Which pattern do the magnetic field lines form around the wire?"
    correct: "Concentric circles around the wire, in a plane perpendicular to the wire"
    unit: ""
    wrong:
      - {text: "Straight lines parallel to the wire", mistake: "assumes the field runs along the direction of the current"}
      - {text: "Radial lines pointing outwards from the wire", mistake: "confuses magnetic field lines with electric field lines from a charge"}
      - {text: "A single loop enclosing the wire on one side only", mistake: "treats the field as existing on only one side of the wire"}
    explanation: "A straight current-carrying wire produces a magnetic field whose lines are concentric circles in a plane perpendicular to the wire. The direction of the circles is given by the right-hand thumb rule. The field gets weaker as the distance from the wire increases."
    hints:
      - "Consider the plane in which the field lines lie relative to the wire."
      - "Think about how the field changes around the wire rather than along it."
      - "Use the right-hand thumb rule to decide the shape and direction of the lines."
    diagram: "Top view of a straight wire drawn as a dot, with the current coming out of the page towards the reader. Draw several concentric circles around the dot with arrowheads showing the counterclockwise direction."
    confidence: high
  - topic: magnetic_field_lines
    type: mcq
    difficulty: medium
    role: apply
    stem: "A wire carries a current going into the page. A point is directly above the wire on the page. Using the right-hand thumb rule, the magnetic field at this point points:"
    correct: "To the right of the page"
    unit: ""
    wrong:
      - {text: "To the left of the page", mistake: "reverses the curl of the field lines"}
      - {text: "Into the page", mistake: "treats the field as lying along the direction of the current"}
      - {text: "Out of the page", mistake: "confuses the direction of the thumb with the direction of the field"}
    explanation: "With the thumb pointing in the direction of the current, into the page, the fingers curl around the wire in a clockwise sense as seen from the front. At the point directly above the wire, the field therefore points to the right. Reversing the current would reverse this direction."
    hints:
      - "Imagine your thumb pointing into the page along the wire."
      - "Ask which way your fingers curl around the wire when you look at the point above it."
      - "Think about whether the field is parallel or perpendicular to the wire."
    diagram: "Front view of a wire drawn as a dot with a cross inside it to show the current going into the page. A point is marked directly above the dot. Draw a short arrow at that point showing the direction of the magnetic field."
    confidence: high
  - topic: magnetic_field_lines
    type: mcq
    difficulty: hard
    role: transfer
    stem: "The magnetic field at a fixed distance from a long straight current-carrying wire is to be made stronger. Which change does this?"
    correct: "Increasing the current in the wire"
    unit: ""
    wrong:
      - {text: "Moving the point farther away from the wire", mistake: "reverses the way the field depends on distance"}
      - {text: "Using a thinner wire of the same current", mistake: "thinks the thickness of the wire changes the field at a distance"}
      - {text: "Reversing the direction of the current", mistake: "assumes reversing the current makes the field stronger, when it only reverses the direction"}
    explanation: "The magnetic field at a distance r from a long straight wire is proportional to the current and inversely proportional to the distance. Increasing the current therefore strengthens the field. Reversing the current only reverses the direction of the field."
    hints:
      - "Recall which quantities the field at a distance from a wire depends on."
      - "Ask how the field changes as you move farther from the wire."
      - "Consider which property of the current, its magnitude or its direction, affects the strength."
    diagram: null
    confidence: high
  - topic: magnetic_field_lines
    type: mcq
    difficulty: hard
    role: apply
    stem: "Inside a long solenoid carrying a steady current, the magnetic field is:"
    correct: "Nearly uniform and parallel to the axis of the solenoid"
    unit: ""
    wrong:
      - {text: "Zero, because the coils cancel the field inside", mistake: "thinks the coils cancel each other's field inside the solenoid"}
      - {text: "Radial and increasing towards the axis", mistake: "confuses the solenoid with a straight current-carrying wire"}
      - {text: "Strongest at the centre and weakest at the ends", mistake: "reverses which parts of the field are strong and which are weak"}
    explanation: "A long solenoid is a coil of wire. The fields from all the turns add up inside the coil, giving a nearly uniform field that runs parallel to the axis. The field outside is weak and spreads out, so the field lines inside are the most useful part for a magnetic effect."
    hints:
      - "Think about whether the magnetic fields of the turns add up or cancel inside the coil."
      - "Consider the direction of the field lines inside the coil compared with the axis."
      - "Ask where the field lines are most closely spaced in a solenoid."
    diagram: "Solenoid drawn as a row of loops of wire with the current direction marked on one loop. Show the magnetic field lines inside the coil running parallel to the axis and spreading out and returning around the outside of the coil."
    confidence: high
  - topic: force_on_current_carrying_conductor
    type: mcq
    difficulty: easy
    role: recall
    stem: "In the left-hand rule for a current-carrying conductor in a magnetic field, the forefinger shows the field and the middle finger shows the current. What does the thumb show?"
    correct: "The direction of the force on the conductor"
    unit: ""
    wrong:
      - {text: "The direction of the induced current in a coil", mistake: "confuses the left-hand rule for force with the right-hand rule for induced current"}
      - {text: "The direction of the magnetic field around the wire", mistake: "mixes up the field rule with the force rule"}
      - {text: "The speed of the conductor", mistake: "treats the thumb as showing a velocity"}
    explanation: "In the left-hand rule for a motor, the forefinger points along the field, the middle finger points along the conventional current, and the thumb points along the force on the conductor. The rule works for a conductor that is at right angles to the field."
    hints:
      - "Recall which quantity the force depends on, field and current."
      - "Think about which hand is used for the motor effect and which for generation."
      - "Ask what the three fingers stand for in the motor effect."
    diagram: null
    confidence: high
  - topic: force_on_current_carrying_conductor
    type: mcq
    difficulty: easy
    role: recall
    stem: "A straight wire carries a current and lies in a uniform magnetic field. For a given current and field, the force on the wire is largest when the wire is:"
    correct: "Perpendicular to the magnetic field"
    unit: ""
    wrong:
      - {text: "Parallel to the magnetic field", mistake: "assumes the force is always greatest when the wire lies along the field"}
      - {text: "Carrying no current", mistake: "thinks a wire with no current still feels a force"}
      - {text: "At any angle, since the angle has no effect", mistake: "ignores the angle between the current and the field"}
    explanation: "The force on a straight conductor is given by F = BIL sin(theta), where theta is the angle between the current and the field. The force is largest when theta is 90 degrees, and it is zero when the wire is parallel to the field."
    hints:
      - "Think about the angle between the wire and the field lines."
      - "Ask for which orientation the wire is pushed most sideways by the field."
      - "Recall whether a current-carrying wire along a field line experiences any push."
    diagram: null
    confidence: high
  - topic: force_on_current_carrying_conductor
    type: mcq
    difficulty: medium
    role: explain
    stem: "A horizontal wire carries current from left to right in the plane of the page. The magnetic field points into the page. In which direction is the force on the wire?"
    correct: "Upwards, in the plane of the page"
    unit: ""
    wrong:
      - {text: "Downwards, in the plane of the page", mistake: "reverses the order of the current and the field in the rule"}
      - {text: "Out of the page", mistake: "treats the force as acting along the direction of the field"}
      - {text: "Into the page", mistake: "assumes the force is parallel to the field"}
    explanation: "Using the left-hand rule, the forefinger points into the page along the field, and the middle finger points to the right along the current. The thumb then points upwards, which is the direction of the force on the wire."
    hints:
      - "Set your forefinger in the direction of the field and your middle finger in the direction of the current."
      - "Ask which direction your thumb points when the other two fingers are set this way."
      - "Remember that the force is perpendicular to both the field and the current."
    diagram: "Horizontal wire drawn in the plane of the page with an arrow to the right showing the current direction. Crosses drawn around the wire to show that the magnetic field points into the page. Label the force direction to be found as the question asks."
    confidence: high
  - topic: force_on_current_carrying_conductor
    type: mcq
    difficulty: medium
    role: apply
    stem: "A wire in a fixed magnetic field carries a current. If the current is doubled and nothing else changes, the force on the wire becomes:"
    correct: "Twice as large"
    unit: ""
    wrong:
      - {text: "Half as large", mistake: "reverses the proportionality between force and current"}
      - {text: "Four times as large", mistake: "assumes the force depends on the square of the current"}
      - {text: "Unchanged", mistake: "assumes the force depends on the field alone"}
    explanation: "The force on a current-carrying conductor is directly proportional to the current, when the length and the field are fixed. Doubling the current doubles the force."
    hints:
      - "Recall how the force formula depends on the current."
      - "Ask whether the current appears as a square or as a simple multiplier in the formula."
      - "Think about whether a change in current changes the force at all."
