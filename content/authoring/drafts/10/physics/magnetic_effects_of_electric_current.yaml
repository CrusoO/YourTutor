  - topic: force_on_current_carrying_conductor
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Two long parallel straight wires carry currents in the same direction. Each wire lies in the magnetic field of the other. What is the force between the wires?"
    correct: "Attractive"
    unit: ""
    wrong:
      - {text: "Repulsive", mistake: "applies the rule for like electric charges to parallel currents"}
      - {text: "Zero, because the wires do not feel each other's field", mistake: "assumes a wire does not respond to the field of another wire"}
      - {text: "Perpendicular to the wires, pushing them sideways", mistake: "confuses the direction of the force with the direction of the field"}
    explanation: "Each wire lies in the magnetic field produced by the other. When the currents are in the same direction, the wires attract each other. When the currents are opposite, they repel. This is the basis of the definition of the ampere."
    hints:
      - "Think about the field that one wire produces at the position of the other."
      - "Ask whether the force on each wire points towards or away from the other wire."
      - "Consider how the direction of the current in the two wires is related."
    diagram: "Two long parallel wires drawn side by side in the page plane, each drawn as a dot with an arrow showing the current, both arrows pointing up. Draw the circular field lines around each wire and mark the direction of the force on each wire."
    confidence: high
  - topic: force_on_current_carrying_conductor
    type: mcq
    difficulty: hard
    role: apply
    stem: "A straight conductor carries a current in a uniform magnetic field. For which angle between the conductor and the field is the force largest?"
    correct: "90 degrees"
    unit: ""
    wrong:
      - {text: "0 degrees", mistake: "confuses zero force with maximum force"}
      - {text: "45 degrees", mistake: "assumes the force peaks halfway between the parallel and perpendicular cases"}
      - {text: "Any angle gives the same force", mistake: "thinks the angle has no effect on the force"}
    explanation: "The force on a conductor is F = BIL sin(theta), where theta is the angle between the conductor and the field. Since sin(theta) is largest at 90 degrees, the force is greatest when the conductor is perpendicular to the field. The force falls to zero when the conductor is parallel to the field."
    hints:
      - "Recall the trigonometric factor in the force formula."
      - "Ask which angle makes that factor equal to its largest value."
      - "Consider what happens to the force when the conductor lies along the field."
    diagram: null
    confidence: high
  - topic: electric_motor
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the function of the commutator in a simple DC motor?"
    correct: "To reverse the direction of the current in the coil every half turn, so the coil keeps rotating in the same direction"
    unit: ""
    wrong:
      - {text: "To increase the strength of the magnetic field", mistake: "confuses the commutator with the magnet"}
      - {text: "To store energy for a sudden start", mistake: "treats the commutator as a store of energy"}
      - {text: "To supply the current to the magnet", mistake: "mixes up the power supply with the commutator"}
    explanation: "The split-ring commutator changes the connection of the coil to the battery every half turn. This reverses the current in the coil at the right moment, so the torque keeps turning the coil in the same direction. Without it, the coil would swing back and forth."
    hints:
      - "Think about what would happen to the coil if the current never reversed."
      - "Ask at what point in the rotation the current must change direction."
      - "Consider which part of the motor touches the brushes."
    diagram: null
    confidence: high
  - topic: electric_motor
    type: mcq
    difficulty: easy
    role: recall
    stem: "A direct current electric motor converts:"
    correct: "Electrical energy into mechanical energy"
    unit: ""
    wrong:
      - {text: "Mechanical energy into electrical energy", mistake: "reverses the function of a motor with that of a generator"}
      - {text: "Chemical energy into thermal energy", mistake: "treats the battery as the output of the motor"}
      - {text: "Heat energy into light energy", mistake: "confuses a motor with a bulb"}
    explanation: "A motor takes electrical energy from the supply and converts it into mechanical energy of rotation. A generator does the reverse, converting mechanical energy into electrical energy."
    hints:
      - "Think about the input and output of a motor."
      - "Ask what the motor does to the current it receives."
      - "Compare the motor with a generator and decide which direction of conversion each does."
    diagram: null
    confidence: high
  - topic: electric_motor
    type: mcq
    difficulty: medium
    role: explain
    stem: "A rectangular coil in a magnetic field is placed so that its two long sides are perpendicular to the field. The current flows in opposite directions in these two sides. What is the resulting force on the two sides?"
    correct: "Equal and opposite, which produces a turning effect (torque) on the coil"
    unit: ""
    wrong:
      - {text: "In the same direction, pushing the coil sideways", mistake: "treats the two sides as if the current flowed in the same direction"}
      - {text: "Zero, because the forces cancel completely in every position", mistake: "assumes the forces cancel at all positions, not only at some"}
      - {text: "Parallel to the axis of the coil", mistake: "confuses the direction of the force with the direction of the field"}
    explanation: "The current in the two long sides flows in opposite directions, so the forces on them are equal in size and opposite in direction. These forces form a couple, which produces a torque that turns the coil. The turning effect is what drives the motor."
    hints:
      - "Think about the direction of the current in the two long sides."
      - "Ask whether the two forces act along the same line or in opposite directions."
      - "Consider whether two equal and opposite forces that are not along one line can turn an object."
    diagram: "Rectangular coil drawn in the page plane between the N and S poles of a magnet. Mark the current direction in the two long sides, with one going up and the other going down. Draw an arrow for the force on each long side and show the coil in a vertical position."
    confidence: high
  - topic: electric_motor
    type: mcq
    difficulty: medium
    role: apply
    stem: "The number of turns in the coil of a motor is increased, keeping the current and the magnetic field the same. What happens to the turning effect on the coil?"
    correct: "It increases"
    unit: ""
    wrong:
      - {text: "It decreases", mistake: "assumes extra turns only add resistance and reduce the effect"}
      - {text: "It stays the same", mistake: "treats the coil as a single loop regardless of the turns"}
      - {text: "The direction of rotation reverses", mistake: "thinks the number of turns sets the direction of rotation"}
    explanation: "Each turn of the coil experiences a force, so the total turning effect is proportional to the number of turns. Increasing the turns, with the same current and field, increases the torque. The direction of rotation is not changed by the number of turns."
    hints:
      - "Think about whether each turn of the coil feels a force."
      - "Ask whether the forces on the turns add up or cancel."
      - "Consider which quantities decide the direction of rotation."
    diagram: null
    confidence: high
  - topic: electric_motor
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A motor turns clockwise. Which change will make it turn anticlockwise?"
    correct: "Reversing either the current or the magnetic field, but not both"
    unit: ""
    wrong:
      - {text: "Reversing both the current and the magnetic field", mistake: "thinks two reversals cancel, so the direction is kept"}
      - {text: "Increasing the current without any reversal", mistake: "assumes the current alone controls the direction of rotation"}
      - {text: "Using a stronger magnet without any reversal", mistake: "conflates the speed or strength of the motor with its direction"}
    explanation: "The direction of the force on the coil depends on both the current and the field. Reversing only one of them reverses the force and therefore the rotation. Reversing both leaves the direction of the force, and so the rotation, unchanged."
    hints:
      - "Recall what determines the direction of the force on a conductor."
      - "Ask what happens to that direction when one quantity is reversed."
      - "Consider what happens when both quantities are reversed together."
    diagram: null
    confidence: high
  - topic: electric_motor
    type: mcq
    difficulty: hard
    role: apply
    stem: "Why does a motor with a soft iron core in the coil give a larger turning effect?"
    correct: "The iron core concentrates the magnetic field lines and strengthens the field through the coil"
    unit: ""
    wrong:
      - {text: "The iron core supplies extra energy to the coil", mistake: "treats the core as a source of energy"}
      - {text: "The iron stops the current from reversing", mistake: "confuses the core with the commutator"}
      - {text: "The iron reduces the resistance of the coil, so more current flows", mistake: "thinks the iron lowers the resistance of the coil"}
    explanation: "Soft iron is easily magnetised, and placed inside the coil it strengthens the magnetic field through the coil. A stronger field gives a larger force on each turn, and so a larger turning effect. The iron itself does not supply energy or change the current."
    hints:
      - "Think about what the force on the coil depends on besides the current and the number of turns."
      - "Ask what happens to the magnetic field lines when a soft iron core is placed inside the coil."
      - "Consider whether the iron changes the resistance or the energy supply."
    diagram: "Side view of a simple DC motor: a rectangular coil wound around a soft iron core, placed between the N and S poles of a magnet. Label the core, the coil, the poles and the field lines that pass through the core, and mark the direction of the current in the two long sides of the coil."
    confidence: high
  - topic: electromagnetic_induction
    type: mcq
    difficulty: easy
    role: recall
    stem: "Electromagnetic induction occurs when:"
    correct: "The magnetic flux linked with a coil changes"
    unit: ""
    wrong:
      - {text: "A steady current flows in a coil", mistake: "confuses a steady current with a changing magnetic field"}
      - {text: "A magnet is held still beside a coil", mistake: "assumes a stationary magnet always induces a current"}
      - {text: "A coil is connected to a battery", mistake: "treats connection to a battery as induction"}
    explanation: "An emf is induced in a coil when the magnetic flux linked with it changes. This can happen when the magnet moves, when the coil moves, or when the current in another coil changes. A steady field gives no induced emf."
    hints:
      - "Think about what the induced emf depends on: a steady value or a change."
      - "Ask whether a magnet that is not moving can change the flux through a coil."
      - "Consider whether a battery produces a changing magnetic field."
