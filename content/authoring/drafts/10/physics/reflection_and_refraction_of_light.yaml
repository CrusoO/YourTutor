items:
  - topic: spherical_mirror_images
    type: mcq
    difficulty: easy
    role: recall
    stem: "A concave mirror forms an image of an object placed beyond its centre of curvature. Which statement describes this image?"
    correct: "Real, inverted and smaller than the object, lying between the focus and the centre of curvature"
    unit: ""
    wrong:
      - {text: "Virtual, erect and magnified, behind the mirror", mistake: "assumes an object beyond the focus always gives a virtual image, as in a shaving mirror"}
      - {text: "Real, inverted and larger than the object", mistake: "thinks every object beyond the centre gives a magnified image"}
      - {text: "Virtual, inverted and the same size as the object", mistake: "mixes up the image of a plane mirror with that of a curved mirror"}
    explanation: "An object placed beyond the centre of curvature of a concave mirror forms a real image. The image is inverted, smaller than the object, and lies between the focus and the centre of curvature. Real images can be caught on a screen placed in front of the mirror."
    hints:
      - "Think about where the reflected rays actually meet, not where they appear to come from."
      - "Compare the object's distance with the focus and with the centre of curvature."
      - "Ask whether a screen placed in front of the mirror could catch this image."
    diagram: "Concave mirror drawn with its principal axis horizontal. Mark the pole P, focus F and centre of curvature C. Place an object arrow beyond C and draw two rays from its tip: one parallel to the axis that reflects through F, and one through F that reflects parallel to the axis. Show where the reflected rays cross."
    confidence: high
  - topic: spherical_mirror_images
    type: mcq
    difficulty: easy
    role: recall
    stem: "A convex mirror is used as a rear-view mirror. Which statement describes the image of a real object it forms?"
    correct: "Virtual, erect and diminished"
    unit: ""
    wrong:
      - {text: "Real, inverted and magnified", mistake: "treats a convex mirror as if it behaved like a concave mirror"}
      - {text: "Virtual, erect and magnified", mistake: "assumes curved mirrors always enlarge the image"}
      - {text: "Real, erect and diminished", mistake: "thinks the diverging reflected rays meet at a real point"}
    explanation: "A convex mirror bulges outwards, so the reflected rays diverge. Their backward extensions meet behind the mirror, which makes the image virtual. The image is erect and smaller than the object, which is why it gives a wide field of view."
    hints:
      - "Consider whether the reflected rays spread out or come together."
      - "Think about which side of the mirror the image appears on."
      - "A wide field of view is one reason this mirror is chosen for vehicles."
    diagram: null
    confidence: high
  - topic: spherical_mirror_images
    type: mcq
    difficulty: medium
    role: explain
    stem: "An object is placed between the pole and the focus of a concave mirror. Which statement describes the image?"
    correct: "Virtual, erect and magnified, located behind the mirror"
    unit: ""
    wrong:
      - {text: "Real, inverted and magnified, in front of the mirror", mistake: "applies the rule for objects beyond the focus to an object inside the focus"}
      - {text: "Real, erect and diminished, between the focus and the pole", mistake: "confuses which quantity decides whether an image is real"}
      - {text: "Virtual, inverted and diminished, behind the mirror", mistake: "mixes up the inversion rule for virtual images"}
    explanation: "When the object is inside the focus of a concave mirror, the reflected rays diverge. Extending them backwards behind the mirror gives a virtual image that is erect and larger than the object. This is the principle of a shaving or make-up mirror."
    hints:
      - "Start by asking whether the reflected rays converge or diverge."
      - "Trace the two rays backwards behind the mirror to find where they seem to start."
      - "Compare the object's distance from the mirror with the focal length."
    diagram: "Concave mirror with pole P and focus F marked on the principal axis. Place an object arrow between P and F. Draw a ray from its tip parallel to the axis that reflects through F, and a second ray that reflects off the mirror surface near P. Extend both reflected rays backwards with dashed lines behind the mirror and mark where they meet as the image."
    confidence: high
  - topic: spherical_mirror_images
    type: mcq
    difficulty: medium
    role: apply
    stem: "A narrow beam of light parallel to the principal axis strikes a concave mirror. After reflection, the beam:"
    correct: "passes through the focus"
    unit: ""
    wrong:
      - {text: "travels back along its own incoming path", mistake: "treats the mirror as flat, so every ray reflects straight back"}
      - {text: "passes through the pole of the mirror", mistake: "takes the point where the axis meets the mirror as the converging point"}
      - {text: "passes through the centre of curvature", mistake: "confuses the focus with the centre of curvature, which is twice as far away"}
    explanation: "A ray parallel to the principal axis reflects from a concave mirror and passes through the principal focus F. The focus lies halfway between the pole and the centre of curvature. This is the basis of the focal length of a spherical mirror."
    hints:
      - "Recall which point on the axis the reflected rays converge to."
      - "Remember that the focal length is half the radius of curvature."
      - "Think about the path of a ray that meets the mirror at a slant versus parallel to the axis."
    diagram: null
    confidence: high
  - topic: spherical_mirror_images
    type: mcq
    difficulty: hard
    role: transfer
    stem: "An object is placed exactly at the focus of a concave mirror. Where is its image formed?"
    correct: "At infinity, because the reflected rays are parallel"
    unit: ""
    wrong:
      - {text: "Very close to the pole of the mirror", mistake: "assumes an image is always formed near the mirror surface"}
      - {text: "At the centre of curvature", mistake: "moves the image to the centre of curvature without checking the rays"}
      - {text: "Just behind the mirror, as a virtual image", mistake: "takes the focus as a point that always gives a virtual image"}
    explanation: "Rays leaving the object at the focus reflect parallel to the principal axis, so they never meet at a finite point. The image is therefore formed at infinity. This is why a point source at the focus of a concave reflector gives a parallel beam."
    hints:
      - "Trace a ray from the object through the focus and reflect it; where does it go?"
      - "Ask whether the reflected rays from this object are parallel, converging or diverging."
      - "A parallel beam is used in headlights, so think about where the source sits."
    diagram: null
    confidence: medium
  - topic: spherical_mirror_images
    type: mcq
    difficulty: hard
    role: apply
    stem: "A concave mirror forms a real image of an object that is the same size as the object and inverted. Where is the object?"
    correct: "At the centre of curvature"
    unit: ""
    wrong:
      - {text: "At the focus", mistake: "confuses the focal point with the centre of curvature"}
      - {text: "Between the focus and the pole", mistake: "assumes a same-size image needs a nearby object"}
      - {text: "Beyond the centre of curvature", mistake: "assumes any object beyond the centre gives a same-size image, when the image is smaller"}
    explanation: "For a concave mirror, an object at the centre of curvature forms a real, inverted image of the same size, located at the centre of curvature on the other side. Objects beyond the centre give smaller images, and objects between the centre and the focus give larger ones. So the same-size case pins the object at C."
    hints:
      - "Consider the magnification of an image formed when the object and image are equidistant from the mirror."
      - "Compare how far the object lies from the mirror with the radius of curvature."
      - "Ask which special point on the axis gives an image of the same size and the same distance."
    diagram: null
    confidence: high
  - topic: lens_image_formation
    type: mcq
    difficulty: easy
    role: recall
    stem: "A converging lens is used as a magnifying glass. The object is placed between the optical centre and the focus. The image is:"
    correct: "Virtual, erect and magnified, on the same side as the object"
    unit: ""
    wrong:
      - {text: "Real, inverted and magnified, on the far side of the lens", mistake: "applies the rule for objects beyond the focus to an object inside the focus"}
      - {text: "Virtual, inverted and diminished", mistake: "mixes up the nature of the image with its size"}
      - {text: "Real, erect and diminished", mistake: "thinks a converging lens always forms real images"}
    explanation: "A converging lens with the object inside its focal length forms a virtual, erect and magnified image on the same side as the object. This is the working principle of a magnifying glass. The image cannot be caught on a screen."
    hints:
      - "Ask whether the refracted rays actually meet on the far side of the lens."
      - "Think about the position of the object relative to the focus."
      - "A magnifying glass lets you look through it at an enlarged, upright picture."
    diagram: null
    confidence: high
  - topic: lens_image_formation
    type: mcq
    difficulty: easy
    role: recall
    stem: "A diverging lens forms the image of a real object. Which statement describes the image in every case?"
    correct: "Virtual, erect and diminished"
    unit: ""
    wrong:
      - {text: "Real, inverted and magnified", mistake: "treats a diverging lens as if it were converging"}
      - {text: "Virtual, erect and magnified", mistake: "assumes virtual images are always enlarged"}
      - {text: "Real, inverted and diminished", mistake: "assumes all lenses form real images"}
    explanation: "A diverging lens spreads out the refracted rays, so their backward extensions meet on the same side as the object. The image is therefore virtual and erect, and it is always smaller than the object. This holds wherever the object is placed."
    hints:
      - "Ask whether the refracted rays converge or spread out after the lens."
      - "Think about which side of the lens the image appears on."
      - "Compare the size of the image with that of the object for a diverging lens."
    diagram: null
    confidence: high
  - topic: lens_image_formation
    type: mcq
    difficulty: medium
    role: explain
    stem: "A converging lens forms an image of an object placed beyond twice its focal length. Where is the image formed and what is its nature?"
    correct: "Between F and 2F on the opposite side, real and inverted"
    unit: ""
    wrong:
      - {text: "Beyond 2F on the opposite side, real and inverted", mistake: "assumes the image sits as far from the lens as the object does"}
      - {text: "At the focus on the opposite side, virtual", mistake: "assumes the image always forms at the focal point"}
      - {text: "On the same side as the object, virtual", mistake: "takes the image of a converging lens to be virtual for every object"}
    explanation: "For a converging lens with the object beyond 2F, the image forms between F and 2F on the opposite side. The image is real, inverted and smaller than the object. Because the rays really meet, a screen can catch it."
    hints:
      - "Draw the two principal rays and see where they cross on the far side."
      - "Compare the image distance with the focal length and with twice the focal length."
      - "Ask whether the image can be caught on a screen placed on the far side."
    diagram: "Converging lens drawn as a vertical double-headed arrow with the optical centre O at the middle. Mark the focal points F and the points 2F at equal distances on both sides. Place an object arrow on the left beyond 2F. Draw a ray from its tip parallel to the axis that refracts through F on the right, and a ray through O that goes straight. Show the image where they cross."
    confidence: high
  - topic: lens_image_formation
    type: mcq
    difficulty: medium
    role: apply
    stem: "A ray of light passes through the optical centre of a thin lens. What happens to this ray?"
    correct: "It goes through without bending"
    unit: ""
    wrong:
      - {text: "It bends towards the principal axis", mistake: "applies the refraction rule for a parallel ray to a ray through the centre"}
      - {text: "It is reflected straight back along its path", mistake: "treats the lens as if it were a mirror"}
      - {text: "It bends away from the principal axis", mistake: "assumes every ray behaves like a ray through a diverging lens"}
    explanation: "The optical centre of a thin lens is a point where the two faces act like a thin slab with parallel surfaces, so a ray through it emerges without any net deviation. This ray is one of the principal rays used to locate an image."
    hints:
      - "Think about the thin slab at the middle of the lens."
      - "Ask what happens to a ray that goes through the centre of a glass slab with parallel faces."
      - "Compare this with the rays that travel parallel to the axis."
    diagram: null
    confidence: high
  - topic: lens_image_formation
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A converging lens forms a real image of an object that is the same size as the object and inverted. Where is the object placed?"
    correct: "At twice the focal length (2F) from the lens"
    unit: ""
    wrong:
      - {text: "At the focus of the lens", mistake: "assumes the image is the same size as the object whenever the object is at the focus"}
      - {text: "At the optical centre of the lens", mistake: "places the object where the lens has no focusing effect"}
      - {text: "Between the focus and the lens", mistake: "assumes a nearby object gives a same-size real image"}
    explanation: "When the object is at 2F, the real image is also formed at 2F on the other side, and the image is the same size as the object. For a converging lens this is the only position that gives a same-size inverted real image. Moving the object closer gives a larger image, and moving it farther gives a smaller one."
    hints:
      - "Recall how the image distance and object distance are related for a converging lens."
      - "Consider the case where the object and image are symmetric about the lens."
      - "Ask at which special distance the magnification is exactly one."
    diagram: "Converging lens with the optical centre O, focal points F and the points 2F marked on both sides at equal distances. Place an object arrow exactly on the 2F mark on the left. Draw two rays from its tip to the lens, and show where the refracted rays meet on the right as the image."
    confidence: high
  - topic: lens_image_formation
    type: mcq
    difficulty: hard
    role: apply
    stem: "Light from a very distant star is focused by a converging lens onto a screen. Which statement describes the image on the screen?"
    correct: "It is real, inverted and point-like, formed at the focal point"
    unit: ""
    wrong:
      - {text: "It is virtual, erect and formed at the lens itself", mistake: "takes a distant object to form a virtual image close to the lens"}
      - {text: "It is real, magnified and formed at twice the focal length", mistake: "assumes the image of a distant object sits at 2F"}
      - {text: "It is formed at the optical centre of the lens", mistake: "places the focus at the optical centre"}
    explanation: "A distant object sends almost parallel rays to the lens. These converge to the focal point on the far side, forming a real, inverted, point-like image. The screen must be placed at the focus to catch it sharply."
    hints:
      - "Consider the direction of the rays coming from a very distant object."
      - "Ask where parallel rays meet after passing through a converging lens."
      - "Think about why the screen must be moved to a particular position."
    diagram: null
    confidence: high
