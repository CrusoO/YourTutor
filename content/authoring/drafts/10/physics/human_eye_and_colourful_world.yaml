  - topic: dispersion_of_light
    type: mcq
    difficulty: easy
    role: recall
    stem: "A narrow beam of white light passes through a glass prism and emerges as a spectrum. Which colour is deviated the most?"
    correct: "Violet"
    unit: ""
    wrong:
      - {text: "Red", mistake: "assumes red bends the most because it appears first in the spectrum"}
      - {text: "Green", mistake: "thinks the middle colour of the spectrum is deviated the most"}
      - {text: "Yellow", mistake: "confuses dispersion with the colour that the source happens to show"}
    explanation: "Violet light has the highest refractive index in glass, so it is bent the most at each face of the prism. Red is bent the least, and the other colours lie between them. The order of the colours in the spectrum follows this deviation."
    hints:
      - "Think about which end of the spectrum bends more strongly."
      - "Consider the refractive index of glass for each colour."
      - "Ask which colour lies on the side of the spectrum that bends more."
    diagram: "Triangular glass prism with a white light ray entering one face and emerging as a fan of colours. Label the red end of the spectrum as the least deviated and the violet end as the most deviated."
    confidence: high
  - topic: dispersion_of_light
    type: mcq
    difficulty: easy
    role: recall
    stem: "Why does a glass prism split white light into a spectrum?"
    correct: "Different colours have different refractive indices in glass, so they bend by different amounts"
    unit: ""
    wrong:
      - {text: "The prism absorbs some colours and transmits the rest", mistake: "treats dispersion as the absorption of colours"}
      - {text: "The prism reflects every colour at the same angle", mistake: "ignores the refraction that happens at both faces"}
      - {text: "White light is itself a single colour that splits in two", mistake: "treats white light as one pure colour"}
    explanation: "White light is a mixture of colours, and glass slows each colour by a different amount. Because the refractive index depends on colour, each colour bends by a different angle. This separation of colours is called dispersion."
    hints:
      - "Think about whether all colours bend by the same amount in glass."
      - "Ask what property of glass changes from one colour to another."
      - "Consider whether white light is a mixture or a single colour."
    diagram: null
    confidence: high
  - topic: dispersion_of_light
    type: mcq
    difficulty: medium
    role: explain
    stem: "A narrow beam of white light enters a glass prism through one face. Which statement describes the emergent light?"
    correct: "It spreads into colours, with violet deviated more than red"
    unit: ""
    wrong:
      - {text: "All colours emerge parallel and the beam stays white", mistake: "assumes the prism only shifts the beam without separating colours"}
      - {text: "Red is deviated more than violet", mistake: "reverses the order of deviation"}
      - {text: "It emerges as a single lighter colour", mistake: "thinks the prism mixes the colours into one"}
    explanation: "Each colour of the incident white light bends by a different amount at the faces of the prism. Violet bends the most and red the least, so the emergent light is spread into a spectrum. This is the same result as dispersion."
    hints:
      - "Ask whether the emergent colours travel in the same direction."
      - "Think about which colour has the higher refractive index in glass."
      - "Compare the emergent beam with the incident white beam."
    diagram: "Triangular glass prism with the incident white ray labelled on one face. Show the emergent rays fanning out with red at the top and violet at the bottom, each labelled with its colour."
    confidence: high
  - topic: dispersion_of_light
    type: mcq
    difficulty: medium
    role: apply
    stem: "A glass prism separates white light into colours. Which quantity differs from one colour to another inside the glass?"
    correct: "The refractive index of the glass"
    unit: ""
    wrong:
      - {text: "The speed of the colour in vacuum", mistake: "forgets that light of every colour travels at the same speed in vacuum"}
      - {text: "The frequency of the colour inside the prism", mistake: "thinks the frequency of light changes when it enters glass"}
      - {text: "The speed of the colour in vacuum after leaving the prism", mistake: "assumes colours travel at different speeds once they leave the glass"}
    explanation: "The refractive index of glass depends on the colour of the light. Light of every colour has the same speed in vacuum, and its frequency does not change when it enters glass. It is the change in speed inside the glass that makes the colours bend differently."
    hints:
      - "Ask whether the speed of light in vacuum depends on its colour."
      - "Think about which property of the glass depends on the colour of light."
      - "Consider what stays the same when light enters a different medium."
    diagram: null
    confidence: high
  - topic: dispersion_of_light
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A white light beam enters a rectangular glass block through its top face and leaves through its bottom face, with the two faces parallel. Does the emergent light show a spectrum?"
    correct: "No, the emergent beam is white and only shifted sideways, because the parallel faces cancel the spreading"
    unit: ""
    wrong:
      - {text: "Yes, with the same spread as a prism", mistake: "assumes any piece of glass splits white light into a spectrum of the same spread"}
      - {text: "Yes, with red on the inner side of the spectrum", mistake: "reverses the order of colours in a glass block"}
      - {text: "No, but the light is deviated by ninety degrees", mistake: "takes the sideways shift of a block for the deviation of a prism"}
    explanation: "In a rectangular glass block the faces are parallel, so each colour bends on entry and bends back on exit. The emergent rays are parallel to the incident ray, and the beam is shifted sideways. The spreading of colours cancels out, so the emergent light stays white."
    hints:
      - "Trace a single ray of each colour through the top face and then the bottom face."
      - "Ask whether the two faces of the block are inclined to each other as they are in a prism."
      - "Compare the direction of the emergent beam with that of the incident beam."
    diagram: "Rectangular glass block with a white light ray entering the top face and leaving the bottom face. Show the emergent ray parallel to the incident ray but displaced sideways, with the two faces labelled as parallel."
    confidence: medium
  - topic: dispersion_of_light
    type: mcq
    difficulty: hard
    role: apply
    stem: "Which statement correctly explains why violet light is deviated more than red light by a prism?"
    correct: "Glass has a higher refractive index for violet than for red, so violet bends more at each face"
    unit: ""
    wrong:
      - {text: "Violet carries more energy, so the glass pushes it more strongly", mistake: "ascribes the deviation to the energy of photons rather than to the refractive index"}
      - {text: "Red has a higher refractive index, so it bends more", mistake: "reverses the comparison of refractive indices"}
      - {text: "The angle of the prism is different for each colour", mistake: "thinks the geometry of the prism varies with colour"}
    explanation: "The refractive index of glass is larger for violet than for red. A larger index means a larger change of direction at each face, so violet is deviated more. The prism angle is the same for every colour, so it does not cause the difference."
    hints:
      - "Think about which property of the glass changes with colour."
      - "Ask whether a higher refractive index bends light more or less."
      - "Consider whether the prism itself is different for each colour."
    diagram: null
    confidence: high
  - topic: atmospheric_phenomena
    type: mcq
    difficulty: easy
    role: recall
    stem: "Why is the clear daytime sky blue?"
    correct: "Air molecules scatter the shorter wavelengths, such as blue, much more strongly than the longer ones"
    unit: ""
    wrong:
      - {text: "The sky reflects the blue colour of the ocean", mistake: "thinks the sky reflects the water below"}
      - {text: "Air absorbs red light and gives out blue light", mistake: "treats scattering as absorption followed by emission"}
      - {text: "Blue is the most intense colour in sunlight", mistake: "assumes the colour of the sky simply matches the most intense colour of sunlight"}
    explanation: "Sunlight contains all colours, and air molecules scatter the shorter wavelengths more strongly. Blue light is scattered in all directions and reaches our eyes from every part of the sky. This scattering is why the sky looks blue."
    hints:
      - "Think about which wavelengths are scattered most by small particles."
      - "Consider why scattered light reaches your eye from all parts of the sky."
      - "Ask whether the sky is reflecting something or scattering light."
    diagram: null
    confidence: high
  - topic: atmospheric_phenomena
    type: mcq
    difficulty: easy
    role: recall
    stem: "The sun is seen slightly above the horizon a few minutes before it actually rises. What is the main reason?"
    correct: "Atmospheric refraction bends the sunlight downwards towards the observer"
    unit: ""
    wrong:
      - {text: "The sun moves faster across the sky in the morning", mistake: "confuses the apparent position with a change in the sun's speed"}
      - {text: "Light always travels in a straight line, so the sun is seen before it rises", mistake: "assumes that light from the sun is never bent"}
      - {text: "The earth's rotation delays the light from the sun", mistake: "treats the rotation of the earth as a delay of light"}
    explanation: "Light from the sun is refracted as it passes through the atmosphere, which gets denser towards the earth. The light bends downwards, so the sun appears higher than it really is. This makes the sun visible slightly before it has actually risen above the horizon."
    hints:
      - "Think about whether light travels in a straight line through the atmosphere."
      - "Ask what happens to light that passes from thinner to denser air."
      - "Consider whether the sun appears higher or lower than its true position."
    diagram: null
    confidence: high
  - topic: atmospheric_phenomena
    type: mcq
    difficulty: medium
    role: explain
    stem: "At sunset the sun looks red. Which explanation is correct?"
    correct: "Light from the setting sun passes through more air, so most of the blue is scattered away and mainly red reaches the eye"
    unit: ""
    wrong:
      - {text: "The sun emits only red light at sunset", mistake: "thinks the colour of the sun changes intrinsically"}
      - {text: "Red light is refracted more than blue light at sunset", mistake: "reverses the effect of dispersion over a longer path"}
      - {text: "Air molecules absorb all the blue light only at sunset", mistake: "thinks scattering happens only at sunset"}
    explanation: "At sunset, sunlight travels through a much longer path of air. Most of the blue and violet light is scattered out of the beam, so the light that reaches the eye is rich in red and orange. The sun itself does not change colour."
    hints:
      - "Think about how far sunlight travels through the air at sunset compared with noon."
      - "Ask which colours are scattered out along a longer path."
      - "Consider whether the sun actually changes colour or only the light reaching you does."
    diagram: null
    confidence: high
  - topic: atmospheric_phenomena
    type: mcq
    difficulty: medium
    role: apply
    stem: "Clouds look white. Which explanation is correct?"
    correct: "Water droplets and ice crystals of many sizes scatter all colours of light almost equally"
    unit: ""
    wrong:
      - {text: "Clouds emit white light of their own", mistake: "treats clouds as sources of light"}
      - {text: "Clouds reflect the sunlight like a plane mirror", mistake: "treats the cloud as a smooth reflecting surface"}
      - {text: "Clouds absorb blue light and transmit only red", mistake: "assumes clouds filter out colours in the same way as coloured glass"}
    explanation: "Cloud droplets and ice crystals are much larger than air molecules and come in many sizes. They scatter all wavelengths almost equally, so the scattered light looks white. This is different from the scattering by air molecules that makes the clear sky blue."
    hints:
      - "Consider the size of cloud droplets compared with air molecules."
      - "Ask whether the scattering by droplets depends strongly on the colour of light."
      - "Think about whether clouds produce their own light."
    diagram: null
    confidence: high
  - topic: atmospheric_phenomena
    type: mcq
    difficulty: hard
    role: transfer
    stem: "The sun looks slightly flattened, with its lower edge raised more than its upper edge, when it is near the horizon. Which explanation is correct?"
    correct: "Air refracts light from the lower edge more than light from the upper edge, so the disc appears squashed vertically"
    unit: ""
    wrong:
      - {text: "The sun's disc is naturally oval in shape", mistake: "treats the sun as a non-spherical body"}
      - {text: "Dispersion stretches the disc into a spectrum", mistake: "confuses dispersion with the flattening of the disc"}
      - {text: "Scattering removes light from the upper edge only", mistake: "assumes that scattering changes the shape of the sun's disc"}
    explanation: "Light from the lower edge of the sun crosses more of the dense lower atmosphere at a steeper angle, so it is refracted more than light from the upper edge. The lower edge is therefore raised more, and the disc looks flattened. The sun is in fact almost perfectly round."
    hints:
      - "Think about how the atmosphere changes with height and how that affects the bending of light."
      - "Ask whether light from the top and bottom of the sun are bent by the same amount."
      - "Consider whether the sun itself is round or oval."
    diagram: null
    confidence: medium
  - topic: atmospheric_phenomena
    type: mcq
    difficulty: hard
    role: apply
    stem: "Which factor increases the amount of blue light scattered by air molecules?"
    correct: "Scattering particles much smaller than the wavelength of the light, since shorter wavelengths are then scattered most"
    unit: ""
    wrong:
      - {text: "Larger droplets, such as those in clouds", mistake: "applies the rule for small molecules to large droplets"}
      - {text: "Lower density of the air", mistake: "assumes less gas always means more scattering"}
      - {text: "Using a longer wavelength of light", mistake: "reverses the dependence of scattering on wavelength"}
    explanation: "Scattering by small particles is strongest when the particle size is much smaller than the wavelength of light. The scattered intensity rises steeply as the wavelength gets shorter, which is why blue is scattered more than red. Large droplets do not show this strong colour dependence."
    hints:
      - "Compare the size of air molecules with the wavelength of visible light."
      - "Ask how the scattered intensity changes when the wavelength gets shorter."
      - "Consider whether large droplets show the same colour dependence as air molecules."
    diagram: null
    confidence: medium
