items:
  - topic: eye_structure
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which part of the eye changes its focal length so that both near and distant objects are focused on the retina?"
    correct: "The eye lens, whose curvature is changed by the ciliary muscles"
    unit: ""
    wrong:
      - {text: "The cornea, which is pushed in and out by the iris", mistake: "assumes the cornea is the main part that adjusts focus"}
      - {text: "The retina, which moves forward and back", mistake: "confuses the light-sensing screen with the focusing part"}
      - {text: "The iris, which widens and narrows the lens", mistake: "thinks the iris changes the focus, when it controls the amount of light"}
    explanation: "The eye lens is flexible, and the ciliary muscles change its curvature. A thicker lens gives a shorter focal length for near objects, and a thinner lens gives a longer focal length for distant ones. This adjustment is called accommodation."
    hints:
      - "Think about which part of the eye is flexible and transparent."
      - "Ask which structure is attached to muscles that control focusing."
      - "The iris controls something different; decide what that is first."
    diagram: "Side view of the human eye with the cornea, pupil, eye lens, ciliary muscles, retina and optic nerve labelled. Draw a short arrow from the ciliary muscle to the eye lens to show the muscle changing its shape."
    confidence: high
  - topic: eye_structure
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which part of the eye is the light-sensitive layer on which the image is formed?"
    correct: "Retina"
    unit: ""
    wrong:
      - {text: "Sclera", mistake: "takes the tough white outer coat as the sensing layer"}
      - {text: "Cornea", mistake: "assumes the transparent front surface is the sensor"}
      - {text: "Pupil", mistake: "treats the pupil, which is only an opening, as the image-forming layer"}
    explanation: "The retina is a layer of light-sensitive cells at the back of the eye. It converts the image into electrical signals that travel along the optic nerve to the brain. The image on the retina is real and inverted."
    hints:
      - "Think about where the light finally lands inside the eyeball."
      - "Ask which layer connects to the optic nerve."
      - "Consider which part is a sensor rather than a window or an opening."
    diagram: null
    confidence: high
  - topic: eye_structure
    type: mcq
    difficulty: medium
    role: explain
    stem: "Light from a distant object enters a normal eye and reaches the retina. Which statement describes the image formed on the retina?"
    correct: "Real, inverted and smaller than the object"
    unit: ""
    wrong:
      - {text: "Virtual, erect and magnified", mistake: "treats the retina like a magnifying glass"}
      - {text: "Real and erect", mistake: "forgets that a single converging lens inverts the image"}
      - {text: "Virtual and inverted", mistake: "mixes up real and virtual images"}
    explanation: "The eye lens is a converging lens, so it forms a real, inverted and smaller image on the retina. The brain interprets the image as upright, so we see objects the right way up. The image is real because the rays actually meet on the retina."
    hints:
      - "Think about what kind of lens the eye lens behaves like."
      - "Ask whether the rays meet on the retina or only appear to come from a point."
      - "Consider the orientation of the image that the lens produces before the brain corrects it."
    diagram: "Schematic side view of the eye with the cornea, pupil, eye lens, retina and optic nerve labelled. Draw a ray from the top of a distant object entering the cornea, converging through the eye lens, and meeting the retina below the axis. Label the point on the retina as the image."
    confidence: high
  - topic: eye_structure
    type: mcq
    difficulty: medium
    role: apply
    stem: "The ciliary muscles relax as the eye looks at a distant object. As a result, the eye lens becomes:"
    correct: "Thinner, with a longer focal length"
    unit: ""
    wrong:
      - {text: "Thicker, with a shorter focal length", mistake: "uses the state for a near object when the question is about a distant one"}
      - {text: "Unchanged, with a fixed focal length", mistake: "thinks the eye lens has a fixed focus"}
      - {text: "Thicker, with a longer focal length", mistake: "takes thickening to lengthen the focal length, which is the opposite of what happens"}
    explanation: "When the ciliary muscles relax, the suspensory ligaments pull the eye lens thinner. A thinner lens has a longer focal length, which suits distant objects. Near objects need the opposite change."
    hints:
      - "Think about what the ciliary muscles do when they relax."
      - "Ask how a thin lens bends light compared with a thick one."
      - "Consider which of the two states suits a faraway object."
    diagram: null
    confidence: high
  - topic: eye_structure
    type: mcq
    difficulty: hard
    role: transfer
    stem: "The eye lens must change its shape for objects at different distances. Why is this change needed?"
    correct: "To vary the focal length so that objects at different distances are focused on the retina"
    unit: ""
    wrong:
      - {text: "To keep the image the right way up on the retina", mistake: "thinks the lens sets the orientation of the image on the retina"}
      - {text: "To control how much light enters the eye", mistake: "confuses the eye lens with the iris"}
      - {text: "To convert light into nerve signals", mistake: "confuses the eye lens with the retina, which does the conversion"}
    explanation: "The distance of an object changes where the rays would meet if the eye lens did not adjust. By changing its focal length, the eye lens keeps the image sharply on the fixed retina. This is why the lens must change shape."
    hints:
      - "Consider where the image would fall if the lens did not change for a near object."
      - "Ask what is fixed in the eye and what must change to keep the image sharp."
      - "The retina does not move, so decide which part of the eye must adjust instead."
    diagram: null
    confidence: high
  - topic: eye_structure
    type: mcq
    difficulty: hard
    role: apply
    stem: "Which sequence correctly lists the parts that light passes through, in order, from outside the eye to the retina?"
    correct: "Cornea, pupil, eye lens, vitreous humour, retina"
    unit: ""
    wrong:
      - {text: "Pupil, cornea, eye lens, retina, vitreous humour", mistake: "places the pupil in front of the cornea"}
      - {text: "Cornea, eye lens, pupil, retina, vitreous humour", mistake: "places the eye lens in front of the pupil"}
      - {text: "Retina, eye lens, cornea, pupil, vitreous humour", mistake: "reverses the direction of travel of the light"}
    explanation: "Light enters through the cornea, passes through the pupil, is focused by the eye lens and then travels through the vitreous humour, a clear jelly-like fluid. It finally reaches the retina at the back of the eye."
    hints:
      - "Start from the outermost transparent surface of the eye."
      - "Then find the opening that the light goes through before the lens."
      - "Finish with the light-sensitive layer at the back of the eyeball."
    diagram: "Side view of the eye with the cornea, pupil, eye lens, vitreous humour and retina labelled in the eye. Draw a dotted arrow showing light entering from the front and travelling to the retina."
    confidence: high
  - topic: defects_of_vision
    type: mcq
    difficulty: easy
    role: recall
    stem: "A person can see nearby objects clearly but cannot see distant objects clearly. This defect of vision is called:"
    correct: "Myopia (short-sightedness)"
    unit: ""
    wrong:
      - {text: "Hypermetropia (long-sightedness)", mistake: "reverses which objects are near and which are far"}
      - {text: "Presbyopia", mistake: "treats any loss of focusing with age as near-sightedness"}
      - {text: "Astigmatism", mistake: "takes any blur of distant objects as astigmatism"}
    explanation: "In myopia, the eye can see nearby objects but not distant ones, because the image of a distant object forms in front of the retina. It is corrected with a diverging lens."
    hints:
      - "Think about which objects are seen clearly, near or far."
      - "Ask where the image forms when the eye cannot focus a distant object on the retina."
      - "Consider the common name for this defect."
    diagram: null
    confidence: high
  - topic: defects_of_vision
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which lens is used to correct hypermetropia?"
    correct: "A converging (convex) lens"
    unit: ""
    wrong:
      - {text: "A diverging (concave) lens", mistake: "uses the lens for myopia, which is the opposite defect"}
      - {text: "A cylindrical lens", mistake: "treats the lens for astigmatism as the correction for hypermetropia"}
      - {text: "A plane glass sheet", mistake: "thinks a flat sheet of glass can change where the image forms"}
    explanation: "In hypermetropia, the eye cannot focus near objects, because the image forms behind the retina. A converging lens adds extra convergence so that the rays meet on the retina for near objects."
    hints:
      - "Consider which way the lens must bend the light."
      - "Ask where the image forms in hypermetropia, before or after the retina."
      - "Compare this with the lens used for the opposite defect."
    diagram: null
    confidence: high
  - topic: defects_of_vision
    type: mcq
    difficulty: medium
    role: explain
    stem: "In myopia, where is the image of a distant object formed when the eye is not corrected?"
    correct: "In front of the retina"
    unit: ""
    wrong:
      - {text: "Behind the retina", mistake: "reverses the positions of the myopia and hypermetropia images"}
      - {text: "Exactly on the retina", mistake: "assumes the eye is correctly focused for distant objects by default"}
      - {text: "At the surface of the cornea", mistake: "places the image on the outermost surface of the eye"}
    explanation: "In myopia, the eye lens is too convergent or the eyeball is too long. Rays from a distant object meet in front of the retina, so the retina receives a blurred image. A diverging lens is used to move the image back onto the retina."
    hints:
      - "Think about whether the rays converge too early or too late."
      - "Ask where the retina is relative to the point where the rays meet."
      - "Compare with the case where a near object is blurred in hypermetropia."
    diagram: "Side view of an eye with the retina drawn as a curved line at the back. Parallel rays from a distant object enter the eye and meet at a point in front of the retina. Label that point as the image and mark the retina with a dotted line."
    confidence: high
  - topic: defects_of_vision
    type: mcq
    difficulty: medium
    role: apply
    stem: "A diverging lens is used to correct myopia. What does the lens do to the light from a distant object?"
    correct: "It spreads the rays out so that the image moves back onto the retina"
    unit: ""
    wrong:
      - {text: "It converges the rays so that the image moves forward", mistake: "reverses the action of the lens"}
      - {text: "It makes the eyeball longer", mistake: "thinks spectacles change the size of the eyeball"}
      - {text: "It absorbs part of the light so the image is less bright", mistake: "treats corrective lenses as filters"}
    explanation: "A diverging lens makes the rays from a distant object spread out a little before they enter the eye. The eye then focuses them further back, so the image lands on the retina. This corrects the short-sighted eye."
    hints:
      - "Ask whether the lens needs to converge or diverge the rays to move the image backwards."
      - "Think about the direction in which the image needs to move."
      - "Compare the effect of the lens with the natural focusing of the eye."
    diagram: null
    confidence: high
  - topic: defects_of_vision
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A person cannot see nearby objects clearly, though distant objects are seen well. A converging lens is prescribed. Why does this lens work?"
    correct: "It adds convergence so that the rays from a near object meet on the retina"
    unit: ""
    wrong:
      - {text: "It spreads the rays so that near objects appear farther away", mistake: "applies the myopia correction to hypermetropia"}
      - {text: "It removes the need for the eye lens to change shape", mistake: "assumes the eye can always adjust without help"}
      - {text: "It corrects an uneven cornea so the image is sharper", mistake: "confuses hypermetropia with astigmatism"}
    explanation: "A person who cannot see near objects clearly has a hypermetropic eye, where the image of a near object forms behind the retina. A converging lens bends the rays inward before they enter the eye. The rays then meet on the retina for near objects."
    hints:
      - "Ask where the image of a near object forms in this defect."
      - "Think about whether the lens must bend the rays inward or outward."
      - "Compare the effect of the lens with what the eye needs for a near object."
    diagram: "Side view of an eye with the retina drawn at the back. Rays from a nearby book enter the eye and would meet behind the retina. Mark the retina, the point behind it where the rays meet, and a converging lens placed in front of the eye with an arrow showing the rays bending inward."
    confidence: high
  - topic: defects_of_vision
    type: mcq
    difficulty: hard
    role: explain
    stem: "Which statement correctly compares myopia and hypermetropia?"
    correct: "In myopia the image of a distant object forms in front of the retina, while in hypermetropia the image of a near object forms behind it"
    unit: ""
    wrong:
      - {text: "Both defects are caused by the eye lens being too thin", mistake: "uses a single cause for two different defects"}
      - {text: "In myopia the image forms behind the retina, and in hypermetropia it forms in front", mistake: "swaps the two defects"}
      - {text: "Both are corrected with converging lenses", mistake: "forgets that myopia needs a diverging lens"}
    explanation: "Myopia makes distant objects blurred, because their images form in front of the retina. Hypermetropia makes near objects blurred, because their images form behind the retina. Myopia is corrected by a diverging lens and hypermetropia by a converging lens."
    hints:
      - "Think about which objects each defect makes blurred."
      - "For each defect, ask whether the image lies before or after the retina."
      - "Recall which kind of lens corrects each defect."
