    stem: "Which of these is a fossil fuel?"
    correct: "Coal"
    unit: ""
    wrong:
      - {text: "Wind", mistake: "thinks renewable sources are fossil fuels"}
      - {text: "Uranium", mistake: "confuses nuclear fuel with fossil fuel"}
      - {text: "Water stored behind a dam", mistake: "treats hydroelectric energy as a fossil fuel"}
    explanation: "Fossil fuels such as coal, petroleum and natural gas formed from the remains of plants and animals over millions of years. Wind, uranium and stored water are not fossil fuels, so they are not in this group."
    hints:
      - "Think about what the fuel was made from and how long ago."
      - "Ask whether the source is a fuel that is burned or an energy flow such as wind or water."
      - "Consider which of these is a material mined from the earth's crust."
    diagram: null
