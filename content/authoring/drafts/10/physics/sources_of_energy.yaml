  - topic: conventional_sources
    type: mcq
    difficulty: easy
    role: recall
    stem: "A major drawback of burning fossil fuels for power is:"
    correct: "The release of carbon dioxide and other pollutants into the atmosphere"
    unit: ""
    wrong:
      - {text: "They produce no waste at all", mistake: "assumes that burning fuel is a clean process"}
      - {text: "They are unlimited and regenerate quickly", mistake: "thinks fossil fuels form again on a human timescale"}
      - {text: "They need no mining or transport", mistake: "ignores the mining and transport that fossil fuels need"}
    explanation: "Burning fossil fuels releases carbon dioxide, which adds to global warming, along with oxides of sulphur and nitrogen and particulate matter. Fossil fuels are also limited in supply, since they take millions of years to form."
    hints:
      - "Think about what is produced when a fuel is burned."
      - "Ask whether fossil fuels can be replaced at the rate they are used."
      - "Consider the steps needed to get the fuel to a power station."
    diagram: null
    confidence: high
  - topic: conventional_sources
    type: mcq
    difficulty: medium
    role: explain
    stem: "Which statement about a hydroelectric power plant is most accurate?"
    correct: "It uses the flow of water and has low running emissions, but building the dam can submerge land and disturb habitats"
    unit: ""
    wrong:
      - {text: "It produces large amounts of carbon dioxide during operation", mistake: "treats hydroelectric power as a combustion process"}
      - {text: "It needs no water source to run", mistake: "forgets that the flow of water is the energy input"}
      - {text: "It produces radioactive waste", mistake: "confuses hydroelectric power with nuclear power"}
    explanation: "A hydroelectric plant uses falling water to turn turbines, so it produces little carbon dioxide while it runs. The dam can flood large areas of land, displacing people and affecting wildlife and river ecosystems. Both points are needed for a fair assessment."
    hints:
      - "Think about what drives the turbines in a hydroelectric plant."
      - "Ask what the construction of a large dam does to the land around it."
      - "Compare the emissions of running this plant with those of a fossil fuel plant."
    diagram: null
    confidence: high
  - topic: conventional_sources
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which statement correctly describes the main advantage and the main drawback of nuclear power?"
    correct: "It emits little carbon dioxide while operating, but the radioactive waste must be stored safely for a long time"
    unit: ""
    wrong:
      - {text: "It burns uranium and releases a large amount of carbon dioxide", mistake: "confuses nuclear fission with combustion"}
      - {text: "It produces no waste at all", mistake: "ignores the spent fuel that the plant produces"}
      - {text: "It depends on sunlight to produce its power", mistake: "confuses nuclear power with solar power"}
    explanation: "Nuclear power releases very little carbon dioxide during operation, since it uses fission rather than burning. Its spent fuel stays radioactive for a very long time and must be stored and handled with great care. These are the central advantage and the central drawback."
    hints:
      - "Think about whether nuclear power involves burning a fuel."
      - "Ask what remains after the fuel has been used in a reactor."
      - "Consider which of the two points, emissions or waste, is the major drawback."
    diagram: null
    confidence: high
  - topic: conventional_sources
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Among the common fossil fuels, which releases the most carbon dioxide for each unit of energy it supplies?"
    correct: "Coal"
    unit: ""
    wrong:
      - {text: "Natural gas", mistake: "assumes the lightest fuel gives the most carbon dioxide per unit energy"}
      - {text: "Uranium", mistake: "treats nuclear fuel as a source of carbon dioxide"}
      - {text: "Water stored in a reservoir", mistake: "confuses a hydroelectric supply with a fossil fuel"}
    explanation: "Coal has the highest carbon content per unit of energy among the common fossil fuels, so it releases the most carbon dioxide when burned. Natural gas releases less. Uranium and stored water do not produce carbon dioxide in operation."
    hints:
      - "Think about how much carbon each fuel carries per unit of heat it gives."
      - "Ask which fuel is the most solid of the three fossil fuels."
      - "Consider which of these sources is a fuel that is burned."
    diagram: null
    confidence: medium
  - topic: conventional_sources
    type: mcq
    difficulty: hard
    role: apply
    stem: "Fossil fuels are called non-renewable. Why?"
    correct: "They form over millions of years, far more slowly than they are being consumed"
    unit: ""
    wrong:
      - {text: "They cannot be burned in an engine", mistake: "misreads non-renewable as meaning non-combustible"}
      - {text: "They are always present in the air around us", mistake: "confuses the fuel with the air it burns in"}
      - {text: "They can be made in a laboratory in a few days", mistake: "assumes fossil fuels can be produced quickly"}
    explanation: "Fossil fuels formed from buried plant and animal remains over geological time. Human use takes place on a timescale of decades or centuries, so the stock cannot be replaced fast enough. This is why they are called non-renewable."
    hints:
      - "Think about how long it took for the fuel to form."
      - "Ask whether the rate of formation is comparable with the rate of use."
      - "Consider whether the word renewable refers to the fuel itself or to the oxygen it needs."
    diagram: null
    confidence: high
  - topic: non_conventional_sources
    type: mcq
    difficulty: easy
    role: recall
    stem: "A solar cell converts:"
    correct: "Sunlight into electrical energy"
    unit: ""
    wrong:
      - {text: "Electrical energy into light", mistake: "reverses the function of a solar cell with that of a bulb"}
      - {text: "Chemical energy into heat", mistake: "treats a solar cell as a fuel-burning device"}
      - {text: "Mechanical energy into electrical energy", mistake: "confuses a solar cell with a wind turbine"}
    explanation: "A solar photovoltaic cell converts the energy of sunlight directly into electrical energy. It does not need moving parts or burning fuel, and its output depends on the intensity of the light falling on it."
    hints:
      - "Think about the input that a solar cell receives."
      - "Ask what the cell delivers to the circuit it is connected to."
      - "Consider whether any moving parts are involved in a solar cell."
    diagram: null
    confidence: high
  - topic: non_conventional_sources
    type: mcq
    difficulty: easy
    role: recall
    stem: "Wind energy is harnessed by:"
    correct: "A turbine whose blades turn a generator"
    unit: ""
    wrong:
      - {text: "A water wheel placed in the sea", mistake: "confuses wind energy with tidal energy"}
      - {text: "A boiler that burns wood", mistake: "treats wind as a fuel"}
      - {text: "A lens that focuses sunlight", mistake: "confuses wind energy with solar concentrators"}
    explanation: "Moving air turns the blades of a wind turbine. The rotating shaft drives a generator that produces electrical energy. The power in the wind depends on the speed of the air, so sites with steady strong winds are chosen."
    hints:
      - "Think about what moves when the wind blows against a structure."
      - "Ask what the moving part connects to in order to make electricity."
      - "Consider which device turns the motion of air into a rotation."
    diagram: null
    confidence: high
  - topic: non_conventional_sources
    type: mcq
    difficulty: medium
    role: explain
    stem: "A tidal barrage is built across the mouth of an estuary. Why does it produce electrical energy?"
    correct: "Water flows in and out as the tide rises and falls, and the flow turns turbines as it passes through them"
    unit: ""
    wrong:
      - {text: "Waves heat the water, and the steam turns a generator", mistake: "confuses tidal energy with thermal energy"}
      - {text: "The moon emits energy that is collected directly", mistake: "treats the moon as a source of energy"}
      - {text: "The sea level stays constant, so the turbines run continuously", mistake: "assumes the water level does not change"}
    explanation: "The rise and fall of the tide creates a difference in water level across the barrage. Water flowing through the barrage turns turbines connected to generators. The energy comes from the gravitational pull that produces the tides."
    hints:
      - "Think about what changes across the barrage as the tide rises and falls."
      - "Ask what makes the water move through the turbines."
      - "Consider whether the sea level is steady or changing over a day."
    diagram: null
    confidence: high
  - topic: non_conventional_sources
    type: mcq
    difficulty: medium
    role: apply
    stem: "A solar panel supplies power during the day only. Which statement is correct about its output at night?"
    correct: "The output is almost zero, so storage or another source is needed to supply power at night"
    unit: ""
    wrong:
      - {text: "The panel stores energy overnight and releases it at night", mistake: "assumes a solar panel stores energy like a battery"}
      - {text: "The panel reverses its polarity and produces the same output", mistake: "confuses day and night operation of the panel"}
      - {text: "The panel generates heat instead of electricity", mistake: "thinks a solar panel switches to producing heat"}
    explanation: "A solar cell only produces electricity when sunlight falls on it. At night its output is nearly zero, so a battery or another source is needed to provide a continuous supply. This is one of the main limitations of solar energy."
    hints:
      - "Think about what the panel needs in order to produce electricity."
      - "Ask whether a solar panel can hold energy like a battery."
      - "Consider how the variation over a day can be handled in practice."
    diagram: null
    confidence: high
  - topic: non_conventional_sources
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Compared with a coal-fired power station, what is the main environmental advantage of a wind farm during its operation?"
    correct: "It emits no carbon dioxide while generating electricity"
    unit: ""
    wrong:
      - {text: "It needs no land at all", mistake: "ignores the land use of wind farms"}
      - {text: "It never needs any maintenance", mistake: "assumes turbines run forever without service"}
      - {text: "It stores its energy for use later", mistake: "confuses a wind farm with a battery"}
    explanation: "Wind turbines produce electricity from moving air without burning anything, so they emit no carbon dioxide while operating. They still use land and can affect birds and nearby communities, and they need maintenance. These points are separate from the emissions advantage."
    hints:
      - "Think about what is burned or released in each type of station during operation."
      - "Ask what the wind farm uses as its energy input."
      - "Consider which of the two options deals with emissions during operation."
    diagram: null
    confidence: high
  - topic: non_conventional_sources
    type: mcq
    difficulty: hard
    role: apply
    stem: "The output of a solar power plant changes through the day. Which arrangement is best for supplying a steady power?"
    correct: "Pairing the plant with energy storage or a backup source"
    unit: ""
    wrong:
      - {text: "Using only panels facing north", mistake: "assumes panel orientation alone removes the variation through the day"}
      - {text: "Raising the temperature of the panels", mistake: "thinks heating the panels improves their output"}
      - {text: "Connecting all the panels only in parallel", mistake: "thinks the wiring of the panels fixes the variation with time"}
    explanation: "Solar output varies with the time of day and the weather. Storage, such as batteries, or a backup source fills the gap when sunlight is weak or absent. This gives a steadier supply than the panels could give alone."
    hints:
      - "Think about what the plant can do when the sun is not shining."
      - "Ask whether changing the wiring or the orientation can change the time at which the sun shines."
      - "Consider which kind of component can hold energy for later."
    diagram: null
    confidence: high
  - topic: energy_sustainability
    type: mcq
    difficulty: easy
    role: recall
    stem: "Sustainable use of energy means:"
    correct: "Meeting present needs without reducing the options available to future generations"
    unit: ""
    wrong:
      - {text: "Using as much energy as is available today", mistake: "ignores the effect of today's use on future supply"}
      - {text: "Using only fossil fuels, because they are plentiful", mistake: "assumes fossil fuels will last forever"}
      - {text: "Switching off all power plants to save resources", mistake: "treats sustainability as stopping all energy use"}
    explanation: "Sustainable use of energy meets the needs of today without damaging the environment or depleting resources needed in the future. It favours efficient use and renewable sources, which can be replaced naturally."
    hints:
      - "Think about what would happen to resources if they are used up quickly."
      - "Ask whether sustainability means stopping energy use or using it wisely."
      - "Consider whether the energy source can be replaced over time."
    diagram: null
    confidence: high
  - topic: energy_sustainability
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which of these is a simple way of conserving energy at home?"
    correct: "Switching off lights and fans when leaving a room"
    unit: ""
    wrong:
      - {text: "Leaving the television on standby overnight", mistake: "thinks standby mode uses no energy"}
      - {text: "Running the washing machine with only a few clothes", mistake: "ignores that a partly filled load uses nearly the same energy per wash"}
      - {text: "Keeping the refrigerator door open while deciding what to take", mistake: "assumes the refrigerator is not affected by the open door"}
    explanation: "Switching off devices that are not needed saves the energy they would otherwise use. Standby power, washing machines run for small loads and open refrigerator doors all waste energy, so they are the opposite of conservation."
    hints:
      - "Think about whether a device uses energy when it is not in use."
      - "Ask what happens to the energy used by a light when no one is in the room."
      - "Consider which action reduces energy waste rather than adding to it."
    diagram: null
    confidence: high
  - topic: energy_sustainability
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are renewable sources generally considered better for the environment?"
    correct: "They release little or no greenhouse gas while operating and are replenished naturally"
    unit: ""
    wrong:
      - {text: "They have no installation cost", mistake: "confuses the cost of building a plant with its environmental impact"}
      - {text: "They need no land at all", mistake: "ignores the land that some renewable plants use"}
      - {text: "They never affect wildlife or ecosystems", mistake: "assumes renewable sources have zero ecological impact"}
    explanation: "Renewable sources such as solar, wind and hydro release little or no greenhouse gas during operation, and their supply is replenished naturally. They still have impacts on land, wildlife and manufacture, so the comparison should consider all of these."
    hints:
      - "Think about what is released while the plant is running."
      - "Ask whether the energy source can be replaced by natural processes."
      - "Consider whether any energy source is free of all environmental effects."
    diagram: null
    confidence: high
  - topic: energy_sustainability
    type: mcq
    difficulty: medium
    role: apply
    stem: "A town wants to reduce air pollution from its electricity supply. Which change would help most?"
    correct: "Replacing some coal-fired generation with solar and wind power"
    unit: ""
    wrong:
      - {text: "Adding more diesel generators", mistake: "treats diesel generators as cleaner than the coal they replace"}
      - {text: "Burning more wood in homes", mistake: "ignores the smoke and pollution from burning wood"}
      - {text: "Building coal plants farther away from the town", mistake: "assumes distance removes the emissions from a plant"}
    explanation: "Coal-fired generation is a major source of air pollution and greenhouse gases. Replacing part of it with solar and wind generation reduces both emissions. Moving the plant or adding diesel generation does not reduce the total pollution."
    hints:
      - "Think about which source of electricity gives the most pollution."
      - "Ask whether moving a polluting plant reduces the total emissions."
      - "Consider which option replaces a fuel that is burned with an energy source that is not."
    diagram: null
    confidence: high
  - topic: energy_sustainability
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which statement about making sustainable energy choices is most defensible?"
    correct: "The best choice weighs local land use, emissions and reliability, rather than one factor alone"
    unit: ""
    wrong:
      - {text: "The source with the lowest upfront cost should always be chosen", mistake: "ignores lifetime costs and the environmental impact"}
      - {text: "The source that uses the most land should be chosen to save energy", mistake: "confuses land use with energy saving"}
      - {text: "No energy source should be used, to protect the environment", mistake: "treats not using energy as the only sustainable option"}
    explanation: "A sustainable choice looks at several factors together, including the land affected, the emissions produced, the reliability of supply and the lifetime cost. Relying on one factor alone can lead to a poor decision in a particular place."
    hints:
      - "Think about how many different factors affect the impact of a power source."
      - "Ask whether a single factor can settle the choice in every location."
      - "Consider whether energy use can be avoided altogether."
    diagram: null
    confidence: medium
  - topic: energy_sustainability
    type: mcq
    difficulty: hard
    role: apply
    stem: "Why is energy efficiency counted as a sustainable measure?"
    correct: "It does the same task with less energy, which reduces the need for generation and its impacts"
    unit: ""
    wrong:
      - {text: "It creates extra energy from nothing", mistake: "confuses energy efficiency with energy generation"}
      - {text: "It moves all demand from the day to the night", mistake: "confuses efficiency with shifting the time of demand"}
      - {text: "It guarantees that fuel supplies will never run out", mistake: "assumes efficiency adds to the supply of fuel"}
    explanation: "Energy efficiency means using less energy for the same service. This reduces the amount of energy that must be generated, and so reduces the fuel burned and the impacts of generation. It is one of the most direct ways to use energy sustainably."
    hints:
      - "Think about whether efficiency changes the amount of energy available or the amount used."
      - "Ask what happens to the need for generation if less energy is used for the same task."
      - "Consider whether efficiency creates any new energy."
    diagram: null
    confidence: high
