items:
  - topic: glycolysis
    type: mcq
    difficulty: easy
    role: recall
    stem: "Where in the cell does glycolysis take place?"
    correct: "Cytoplasm"
    unit: ""
    wrong:
      - {text: "Mitochondrial matrix", mistake: "moves glycolysis into the mitochondria"}
      - {text: "Thylakoid membrane", mistake: "confuses respiration with photosynthesis"}
      - {text: "Nucleus", mistake: "places a metabolic pathway in the genetic compartment"}
    explanation: "Glycolysis splits one glucose molecule into two pyruvate molecules in the cytoplasm. It does not need membrane-bound organelles or oxygen."
    hints:
      - "Think about the fluid region outside the organelles where glucose is first broken down."
      - "This is the one stage of respiration that does not need an organelle."
      - "The pathway does not require oxygen, so it happens in the general cell fluid."
    diagram: null
    confidence: high
  - topic: glycolysis
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which three-carbon compound is the end product of glycolysis that enters the link reaction under aerobic conditions?"
    correct: "Pyruvate"
    unit: ""
    wrong:
      - {text: "Lactate", mistake: "assumes lactate is the aerobic product"}
      - {text: "Acetyl CoA", mistake: "skips the step that converts pyruvate into acetyl CoA"}
      - {text: "Ethanol", mistake: "assigns a fermentation product to aerobic conditions"}
    explanation: "Glycolysis ends with two molecules of pyruvate per glucose. Under aerobic conditions pyruvate is transported into the mitochondria for the link reaction."
    hints:
      - "Think about the three-carbon compound produced from glucose at the end of glycolysis."
      - "The compound is made at the end of glycolysis and is then transported into the mitochondria."
      - "Consider the molecule that enters the mitochondria before the link reaction."
    diagram: null
    confidence: high
  - topic: glycolysis
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why can glycolysis continue in the absence of oxygen?"
    correct: "Its steps do not use oxygen, and NAD+ is regenerated by fermentation when oxygen is absent"
    unit: ""
    wrong:
      - {text: "It uses oxygen only at its final step", mistake: "assigns oxygen use to the wrong stage"}
      - {text: "It takes place inside the mitochondria when oxygen is absent", mistake: "moves glycolysis into the mitochondria"}
      - {text: "It requires oxygen to split glucose into pyruvate", mistake: "assumes oxygen is needed for the first split"}
    explanation: "The reactions of glycolysis are oxygen-independent. Because NAD+ must be regenerated, cells without oxygen reduce pyruvate in fermentation so that glycolysis can keep running."
    hints:
      - "Think about which molecules glycolysis consumes and releases."
      - "Consider whether any step in the pathway needs gaseous oxygen."
      - "Compare the inputs of glycolysis with those of the Krebs cycle."
    diagram: null
    confidence: high
  - topic: glycolysis
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which molecule is phosphorylated first in glycolysis, starting the energy investment phase?"
    correct: "Glucose"
    unit: ""
    wrong:
      - {text: "Pyruvate", mistake: "assumes the end product is phosphorylated first"}
      - {text: "Fructose bisphosphate", mistake: "assumes the cleavage product is the first phosphorylated molecule"}
      - {text: "Acetyl CoA", mistake: "confuses a later molecule with the starting sugar"}
    explanation: "The first step of glycolysis phosphorylates glucose to glucose 6-phosphate using ATP. Later steps rearrange the sugar and form fructose bisphosphate."
    hints:
      - "Think about the starting sugar of the pathway."
      - "The first investment step adds a phosphate to the starting sugar."
      - "The molecule is the one entering the cell from the blood or the medium."
    diagram: "Draw the first stages of glycolysis as a flow, showing glucose receiving a phosphate from ATP to form glucose 6-phosphate, then fructose bisphosphate, labelling each compound."
    confidence: high
  - topic: glycolysis
    type: numeric
    difficulty: hard
    role: apply
    stem: "Glycolysis uses 2 ATP in its investment steps and produces 4 ATP in its payoff steps for each glucose molecule. What is the net ATP gained per glucose molecule?"
    correct: "2"
    unit: ""
    wrong: []
    explanation: "Net ATP is the ATP produced minus the ATP spent: 4 minus 2 gives 2 ATP per glucose."
    hints:
      - "Subtract the ATP spent from the ATP made."
      - "The net value is production minus investment."
      - "Count the ATP used in the investment steps before comparing with the payoff."
    diagram: null
    confidence: high
  - topic: glycolysis
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A cell lacks the enzyme that converts pyruvate into acetyl CoA. What is the most direct consequence for the glycolysis products?"
    correct: "Pyruvate accumulates, and the cell must regenerate NAD+ through fermentation to keep glycolysis running"
    unit: ""
    wrong:
      - {text: "Glycolysis stops at its first step", mistake: "assumes the first step depends on the link enzyme"}
      - {text: "Glucose can no longer enter the cell", mistake: "confuses the link enzyme with a transporter"}
      - {text: "Oxygen consumption rises because pyruvate burns faster", mistake: "assumes unused pyruvate increases oxygen use"}
    explanation: "Without the link step, pyruvate cannot enter the Krebs cycle and builds up. NAD+ must then be regenerated by reducing pyruvate, which is the fermentation route."
    hints:
      - "Think about what happens to pyruvate if it cannot enter the next step."
      - "Consider how NAD+ is regenerated when the mitochondria do not take up pyruvate."
      - "Ask which alternative process would keep glycolysis running."
    diagram: "Draw the pathway from glucose to pyruvate, then a blocked arrow at the link step to acetyl CoA, with a branch from pyruvate to fermentation products, labelling each step."
    confidence: medium
  - topic: krebs_cycle_etc
    type: mcq
    difficulty: easy
    role: recall
    stem: "In which membrane of the mitochondrion is the electron transport chain located?"
    correct: "Inner mitochondrial membrane"
    unit: ""
    wrong:
      - {text: "Outer mitochondrial membrane", mistake: "places the chain on the outermost membrane"}
      - {text: "Matrix", mistake: "places the chain in the soluble interior"}
      - {text: "Intermembrane space", mistake: "places the chain in the narrow gap between the membranes"}
    explanation: "The electron transport chain and ATP synthase are embedded in the folded inner membrane, whose folds are called cristae."
    hints:
      - "The chain is embedded in a folded membrane."
      - "The folds of this membrane are called cristae."
      - "It sits in the membrane that is not the outermost one."
    diagram: null
    confidence: high
  - topic: krebs_cycle_etc
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which molecule is the final electron acceptor in aerobic respiration?"
    correct: "Oxygen"
    unit: ""
    wrong:
      - {text: "Carbon dioxide", mistake: "confuses the product of the cycle with the acceptor"}
      - {text: "NADH", mistake: "treats a carrier as the final acceptor"}
      - {text: "Water", mistake: "mistakes the product of the reduction for the acceptor"}
    explanation: "At the end of the electron transport chain, oxygen accepts electrons and protons to form water. Without oxygen, the chain cannot keep running."
    hints:
      - "Think about the gas that combines with electrons and protons at the end of the chain."
      - "The reduction of this molecule yields the product used as the chain's end point."
      - "It is the gas that most organisms breathe in."
    diagram: null
    confidence: high
  - topic: krebs_cycle_etc
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do the Krebs cycle and the electron transport chain depend on each other?"
    correct: "The Krebs cycle supplies NADH and FADH2, which feed electrons into the chain that regenerates NAD+ and FAD"
    unit: ""
    wrong:
      - {text: "The chain supplies acetyl CoA to the Krebs cycle", mistake: "reverses the direction of supply"}
      - {text: "The Krebs cycle makes the oxygen that the chain consumes", mistake: "assigns oxygen production to the cycle"}
      - {text: "Neither needs the other because both produce ATP directly in the matrix", mistake: "assumes the two stages are independent"}
    explanation: "The cycle reduces NAD+ and FAD to NADH and FADH2, and the chain reoxidises them. Without the chain, the carriers stay reduced and the cycle stops."
    hints:
      - "Think about which carriers the Krebs cycle reduces."
      - "Consider what happens to NAD+ if it is not regenerated."
      - "Ask where the electrons from the cycle go next."
    diagram: null
    confidence: high
  - topic: krebs_cycle_etc
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which order of stages is correct as pyruvate is fully oxidised in aerobic respiration?"
    correct: "Link reaction, then Krebs cycle, then electron transport chain"
    unit: ""
    wrong:
      - {text: "Krebs cycle, then link reaction, then electron transport chain", mistake: "places the cycle before pyruvate is converted"}
      - {text: "Electron transport chain, then Krebs cycle, then link reaction", mistake: "reverses the whole sequence"}
      - {text: "Link reaction, then electron transport chain, then Krebs cycle", mistake: "swaps the last two stages"}
    explanation: "Pyruvate is first converted to acetyl CoA by the link reaction, which feeds the Krebs cycle. The reduced carriers then pass their electrons to the electron transport chain."
    hints:
      - "Start with the step that converts pyruvate into acetyl CoA."
      - "The cycle must come after acetyl CoA is formed."
      - "Electrons from the cycle are passed to the chain last."
    diagram: "Draw a flow from pyruvate through the link reaction to acetyl CoA, then into the Krebs cycle, then to the electron transport chain, labelling each stage and its location in the mitochondrion."
    confidence: high
  - topic: krebs_cycle_etc
    type: numeric
    difficulty: hard
    role: apply
    stem: "How many molecules of CO2 are released in one complete turn of the Krebs cycle per molecule of acetyl CoA that enters it?"
    correct: "2"
    unit: ""
    wrong: []
    explanation: "Two decarboxylation steps occur in each turn of the Krebs cycle, and each releases one molecule of CO2 from the acetyl group entering it."
    hints:
      - "Count the decarboxylation steps in a single turn for one acetyl CoA."
      - "Consider how the carbon atoms of the acetyl group leave the cycle."
      - "Think about how many carbon atoms leave the cycle as gas."
    diagram: null
    confidence: high
  - topic: krebs_cycle_etc
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A poison blocks ATP synthase in the inner mitochondrial membrane, but electron flow along the chain continues. What happens to the proton gradient and to ATP production?"
    correct: "The gradient builds up and ATP production falls, because protons cannot flow back through the enzyme"
    unit: ""
    wrong:
      - {text: "Protons leak freely and ATP production increases", mistake: "assumes blocking the enzyme increases proton flow"}
      - {text: "Electron flow stops immediately and the gradient disappears", mistake: "assumes electron flow depends on ATP synthase"}
      - {text: "Oxygen consumption rises and ATP is made by glycolysis alone", mistake: "assumes glycolysis can replace the chain's whole yield"}
    explanation: "Electron transport keeps pumping protons into the intermembrane space. With ATP synthase blocked, the protons cannot return through it, so the gradient builds and ATP synthesis falls."
    hints:
      - "Think about how protons normally return to the matrix."
      - "Consider whether electron flow depends directly on ATP synthase."
      - "Ask what happens to the gradient if its only return route is closed."
    diagram: "Draw the inner membrane with the electron transport chain pumping protons outward and ATP synthase blocked with an X, labelling the proton gradient and the matrix side."
    confidence: medium
  - topic: fermentation_and_respiratory_quotient
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which product is formed in lactic acid fermentation in animal muscle during oxygen debt?"
    correct: "Lactic acid"
    unit: ""
    wrong:
      - {text: "Ethanol", mistake: "assigns yeast fermentation to muscle cells"}
      - {text: "Carbon dioxide only", mistake: "omits the acid that is formed in muscle"}
      - {text: "Acetyl CoA", mistake: "confuses an intermediate of respiration with a fermentation product"}
    explanation: "In lactic acid fermentation, pyruvate is reduced to lactic acid, which regenerates NAD+ so that glycolysis can continue during oxygen debt."
    hints:
      - "Think about the product that builds up during intense exercise."
      - "The fermentation regenerates NAD+ by reducing pyruvate directly."
      - "Consider the three-carbon acid that results from pyruvate reduction."
    diagram: null
    confidence: high
  - topic: fermentation_and_respiratory_quotient
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which products are formed in alcoholic fermentation carried out by yeast?"
    correct: "Ethanol and carbon dioxide"
    unit: ""
    wrong:
      - {text: "Lactic acid only", mistake: "assigns muscle fermentation to yeast"}
      - {text: "Acetone and oxygen", mistake: "invents products and a gas that are not formed"}
      - {text: "Water and glucose", mistake: "treats the starting sugar as a product"}
    explanation: "Yeast converts pyruvate into acetaldehyde, which is reduced to ethanol, and the release of carbon dioxide makes bread rise and beer foam."
    hints:
      - "Yeast is used in bread making and brewing."
      - "The fermentation gives off a gas that makes dough rise."
      - "Think about the alcohol produced in brewing."
    diagram: null
    confidence: high
  - topic: fermentation_and_respiratory_quotient
    type: mcq
    difficulty: medium
    role: explain
    stem: "What is the respiratory quotient, and what does a value of exactly one suggest about the substrate?"
    correct: "RQ is the volume of CO2 released divided by the volume of O2 consumed, and a value of exactly one suggests carbohydrate is the substrate"
    unit: ""
    wrong:
      - {text: "RQ is the O2 released divided by the CO2 consumed, and the value suggests fat", mistake: "inverts the ratio and the substrate"}
      - {text: "RQ is the ATP produced divided by the O2 used, and the value suggests protein", mistake: "uses an energy ratio instead of a gas ratio"}
      - {text: "RQ is the glucose used divided by the pyruvate formed, and the value suggests fermentation only", mistake: "uses sugar amounts instead of gases"}
    explanation: "The respiratory quotient compares CO2 produced with O2 consumed. A value near one points to carbohydrate, while fats give lower values and proteins give values in between."
    hints:
      - "Think about the ratio of the two gases exchanged."
      - "Consider which gas is released and which is taken in."
      - "Compare the ratio expected from carbohydrates with the ratios from fats and proteins."
    diagram: null
    confidence: high
  - topic: fermentation_and_respiratory_quotient
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A respiring tissue releases 6 mol of CO2 and consumes 8 mol of O2. What is its respiratory quotient, given as a decimal?"
    correct: "0.75"
    unit: ""
    wrong: []
    explanation: "The respiratory quotient is CO2 released divided by O2 consumed, which is 6 divided by 8, giving 0.75."
    hints:
      - "Divide the CO2 released by the O2 consumed."
      - "Give the answer as a decimal rather than a fraction."
      - "Check the two gas amounts before dividing."
    diagram: null
    confidence: high
  - topic: fermentation_and_respiratory_quotient
    type: mcq
    difficulty: hard
    role: apply
    stem: "Yeast in a sealed vessel with glucose produces alcohol and releases less energy per glucose than aerobic respiration would. Why is this so?"
    correct: "Glucose is not fully oxidised, so much of its energy stays locked in the alcohol or acid product"
    unit: ""
    wrong:
      - {text: "Fermentation uses more glucose per ATP than respiration does", mistake: "reverses the efficiency of the two processes"}
      - {text: "Fermentation produces more ATP than respiration because it is faster", mistake: "equates speed with energy yield"}
      - {text: "Yeast cannot use glucose in any process that releases energy", mistake: "denies that fermentation releases energy"}
    explanation: "Fermentation stops at partly oxidised products such as ethanol, which still hold chemical energy. Aerobic respiration oxidises glucose completely and yields far more ATP per glucose."
    hints:
      - "Compare how completely glucose is oxidised in each process."
      - "Consider where the remaining carbon ends up in the fermentation products."
      - "Think about the energy still stored in the end product."
    diagram: null
    confidence: high
  - topic: fermentation_and_respiratory_quotient
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A muscle cell in oxygen debt keeps contracting for some time. Which process explains the continued ATP supply, and what happens to the lactate later?"
    correct: "Lactic acid fermentation regenerates NAD+ for glycolysis, and the lactate is later carried to the liver and reconverted or oxidised"
    unit: ""
    wrong:
      - {text: "Aerobic respiration speeds up and lactate is converted into starch in muscle", mistake: "assigns starch synthesis to muscle cells"}
      - {text: "Photosynthesis in muscle supplies ATP and lactate is excreted as CO2", mistake: "assigns photosynthesis to animal muscle"}
      - {text: "The Krebs cycle stops and ethanol builds up in the blood", mistake: "assigns ethanol production to animal muscle"}
    explanation: "Without enough oxygen, glycolysis continues and lactic acid fermentation regenerates NAD+. The lactate is transported to the liver, where it can be converted back to glucose or oxidised."
    hints:
      - "Think about which molecule must be regenerated for glycolysis to continue."
      - "Consider where lactate goes after it leaves the muscle."
      - "Ask whether the muscle has enough oxygen to run full aerobic respiration during the debt."
    diagram: null
    confidence: medium
