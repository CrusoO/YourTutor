items:
  - topic: cell_theory_and_types
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which cell type lacks a membrane-bound nucleus and membrane-bound organelles?"
    correct: "Prokaryotic cell"
    unit: ""
    wrong:
      - {text: "Eukaryotic cell", mistake: "assumes all cells have a nucleus"}
      - {text: "Plant cell", mistake: "confuses cell wall presence with nuclear organisation"}
      - {text: "Animal cell", mistake: "assumes animal cells lack organelles"}
    explanation: "Prokaryotic cells such as bacteria have no membrane-bound nucleus or organelles. Their genetic material lies in a nucleoid region."
    hints:
      - "Think about the simplest cell type, such as a bacterium."
      - "Look for the cell type whose genetic material is not enclosed by a membrane."
      - "The type is the one that lacks compartments inside the cell."
    diagram: null
    confidence: high
  - topic: cell_theory_and_types
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which statement is part of the modern cell theory?"
    correct: "All living organisms are composed of cells"
    unit: ""
    wrong:
      - {text: "Cells arise from non-living matter spontaneously", mistake: "keeps an outdated idea rejected by the theory"}
      - {text: "Only plants are made of cells", mistake: "restricts cells to one kingdom"}
      - {text: "Cells never divide once formed", mistake: "denies cell division"}
    explanation: "Cell theory states that all living organisms are made of cells, that cells are the basic unit of structure and function, and that cells arise from pre-existing cells."
    hints:
      - "Think about what all living things share at the smallest level."
      - "The theory was built from observations on plants and animals."
      - "Consider which statement describes the body of every living organism."
    diagram: null
    confidence: high
  - topic: cell_theory_and_types
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are eukaryotic cells considered more complex than prokaryotic cells?"
    correct: "They have membrane-bound organelles and a defined nucleus that compartmentalise functions"
    unit: ""
    wrong:
      - {text: "They are always larger than any prokaryote in size", mistake: "treats size as the defining complexity"}
      - {text: "They lack a cell membrane altogether", mistake: "denies the membrane in eukaryotes"}
      - {text: "They store genetic material outside the cell", mistake: "reverses the location of genetic material"}
    explanation: "Eukaryotic cells divide their work among membrane-bound organelles, and a nucleus holds the DNA. This compartmentalisation allows more specialised functions."
    hints:
      - "Think about compartments inside the cell and what they hold."
      - "Consider whether the cell has a membrane-bound nucleus."
      - "Compare the internal organisation rather than the size of the cell."
    diagram: null
    confidence: high
  - topic: cell_theory_and_types
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student compares a plant cell and an animal cell under a microscope. Which structure is present in the plant cell but absent in the animal cell?"
    correct: "A rigid cell wall of cellulose"
    unit: ""
    wrong:
      - {text: "A nucleus", mistake: "assumes the nucleus is a plant-only feature"}
      - {text: "A cell membrane", mistake: "assumes the membrane is absent in animal cells"}
      - {text: "Mitochondria", mistake: "assumes energy-producing organelles are plant-only"}
    explanation: "Plant cells have a rigid cell wall made of cellulose outside the cell membrane. Animal cells have a nucleus, a membrane and mitochondria as well."
    hints:
      - "Consider the outer layer that lies outside the membrane in plant cells."
      - "Think of the layer that gives plants their rigid shape."
      - "Check which structure is absent in animal cells."
    diagram: "Draw a plant cell and an animal cell side by side, labelling the nucleus, cell membrane, mitochondria and cell wall, with the cell wall marked only in the plant cell."
    confidence: high
  - topic: cell_theory_and_types
    type: mcq
    difficulty: hard
    role: apply
    stem: "A newly found cell lacks a nucleus, has a circular DNA molecule, and has 70S ribosomes. Which cell type is it most likely to be?"
    correct: "A prokaryotic cell such as a bacterium"
    unit: ""
    wrong:
      - {text: "A plant cell from a leaf", mistake: "assigns a eukaryotic plant cell to the description"}
      - {text: "A red blood cell from a mammal", mistake: "assigns a specialised animal cell with no nucleus to the description"}
      - {text: "A yeast cell from a fungus", mistake: "assigns a eukaryotic fungal cell to the description"}
    explanation: "The lack of a nucleus, the circular DNA and the 70S ribosomes all point to a prokaryote. Eukaryotic cells have a nucleus and 80S ribosomes, while mature mammalian red blood cells lack a nucleus but are not prokaryotic."
    hints:
      - "Check whether the cell is prokaryotic or eukaryotic first."
      - "Ask which cell type lacks a nucleus and also has circular DNA."
      - "Consider the ribosome size as a clue, then compare with known cell groups."
    diagram: "Draw a simple prokaryotic cell with a cell wall, a loop of circular DNA in the nucleoid region and small ribosomes, labelling each part."
    confidence: medium
  - topic: cell_theory_and_types
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A researcher finds a cell with a nucleus but no mitochondria and no chloroplasts. Which conclusion is most defensible?"
    correct: "It is a eukaryote that lacks typical energy-producing organelles, so it cannot be classified from one feature alone"
    unit: ""
    wrong:
      - {text: "It must be a bacterium because it has a nucleus", mistake: "reverses the nucleus-based classification"}
      - {text: "It must be a plant because it has no mitochondria", mistake: "treats the absence of mitochondria as proof of plant identity"}
      - {text: "It is not a cell because it lacks chloroplasts", mistake: "denies that cells can lack chloroplasts"}
    explanation: "A nucleus shows the cell is eukaryotic, but missing mitochondria and chloroplasts can occur in some specialised or unusual eukaryotes. A single feature is not enough to classify the cell."
    hints:
      - "Ask which feature is the clearest sign of a eukaryote."
      - "Consider whether missing organelles automatically identify a kingdom."
      - "Think about how many features are needed for a firm classification."
    diagram: null
    confidence: low
  - topic: cell_membrane_structure
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which molecules form the basic framework of the fluid mosaic cell membrane?"
    correct: "Phospholipids arranged in a bilayer"
    unit: ""
    wrong:
      - {text: "Starch granules", mistake: "confuses a storage carbohydrate with a membrane component"}
      - {text: "Cellulose fibres", mistake: "assigns a wall polysaccharide to the membrane"}
      - {text: "Ribosomal RNA", mistake: "assigns a ribosome component to the membrane"}
    explanation: "The membrane is a bilayer of phospholipids, with embedded proteins and cholesterol in animal cells. The phospholipids give the basic framework of the fluid mosaic model."
    hints:
      - "Think about molecules with a water-loving head and a water-hating tail."
      - "Consider the molecule type that forms two layers in the membrane."
      - "The framework is built from lipids."
    diagram: null
    confidence: high
  - topic: cell_membrane_structure
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the name of the model that describes the cell membrane as a mosaic of proteins and lipids that move laterally?"
    correct: "Fluid mosaic model"
    unit: ""
    wrong:
      - {text: "Lock and key model", mistake: "uses an enzyme model instead of a membrane model"}
      - {text: "Central dogma model", mistake: "uses a genetic information model"}
      - {text: "Double helix model", mistake: "uses a DNA structure model"}
    explanation: "The fluid mosaic model describes the membrane as a flexible bilayer of lipids in which proteins are embedded and can move sideways."
    hints:
      - "Think about a model that combines the words for movement and pattern."
      - "The model describes the membrane as a flexible structure with mixed components."
      - "Consider which model describes the membrane's dynamic structure."
    diagram: null
    confidence: high
  - topic: cell_membrane_structure
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does the cell membrane allow small nonpolar molecules to pass through more easily than large polar molecules?"
    correct: "The lipid core of the bilayer is hydrophobic, so it lets nonpolar molecules dissolve and cross"
    unit: ""
    wrong:
      - {text: "The membrane is made of sugar that dissolves polar molecules", mistake: "assigns a sugar composition to the membrane"}
      - {text: "The membrane contains no proteins at all", mistake: "denies that membranes have transport proteins"}
      - {text: "The membrane is charged positively throughout", mistake: "assumes the membrane is charged all over"}
    explanation: "The interior of the bilayer is hydrophobic, so small nonpolar molecules pass through it readily. Large or charged polar molecules usually need transport proteins."
    hints:
      - "Think about the interior of the bilayer and whether it mixes with water."
      - "Consider which types of molecules dissolve in the membrane's core."
      - "Compare how polar and nonpolar molecules interact with the lipid tails."
    diagram: null
    confidence: high
  - topic: cell_membrane_structure
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student wants to label a membrane diagram correctly. Which feature is shown by the hydrophilic heads of phospholipids?"
    correct: "They face outward toward the watery environments on both sides"
    unit: ""
    wrong:
      - {text: "They face inward into the lipid core", mistake: "reverses the orientation of the heads"}
      - {text: "They are embedded only in the protein layer", mistake: "places the heads inside the proteins"}
      - {text: "They are made of nucleic acid", mistake: "assigns nucleic acid to the membrane heads"}
    explanation: "Phospholipid heads are hydrophilic and point outward toward the aqueous environments inside and outside the cell, while the hydrophobic tails face each other in the centre of the bilayer."
    hints:
      - "Think about which side of a phospholipid interacts with water."
      - "Consider which part faces the cell's surroundings."
      - "The hydrophobic tails face the centre, so the heads must be on the other side."
    diagram: "Draw a phospholipid bilayer in section, showing the two layers with hydrophilic heads at the outer surfaces and hydrophobic tails facing inward, with the aqueous sides labelled."
    confidence: high
  - topic: cell_membrane_structure
    type: mcq
    difficulty: hard
    role: apply
    stem: "A researcher observes that cholesterol increases in the membranes of cells adapted to fluctuating temperatures. What is the most likely effect?"
    correct: "The membrane becomes less fluid at high temperatures and more stable at low temperatures"
    unit: ""
    wrong:
      - {text: "The membrane becomes more fluid at low temperatures and less stable at high temperatures", mistake: "reverses the effect of cholesterol on fluidity"}
      - {text: "The membrane loses all proteins", mistake: "assigns protein loss to cholesterol"}
      - {text: "The membrane begins to synthesise glucose", mistake: "assigns a metabolic role to cholesterol"}
    explanation: "Cholesterol sits among the phospholipid tails and buffers membrane fluidity, reducing fluidity at high temperatures and maintaining it at low ones. This stabilising effect helps cells cope with temperature changes."
    hints:
      - "Think about how cholesterol sits between the phospholipid tails."
      - "Consider whether cholesterol tends to stiffen or loosen the membrane at high temperature."
      - "Ask how a buffer would behave at both ends of the temperature range."
    diagram: null
    confidence: medium
  - topic: cell_membrane_structure
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A membrane protein moves freely within the bilayer, and its position varies between cells of the same type. Which model best describes this observation?"
    correct: "The fluid mosaic model, in which proteins drift laterally within the lipid layer"
    unit: ""
    wrong:
      - {text: "The static wall model, in which proteins are fixed in a rigid sheet", mistake: "denies the lateral movement of proteins"}
      - {text: "The single-layer model, in which proteins sit on the surface only", mistake: "assumes proteins lie outside the lipid layer"}
      - {text: "The helical coil model, in which the membrane is a spiral of protein", mistake: "confuses membrane structure with a DNA-like helix"}
    explanation: "The fluid mosaic model predicts that membrane proteins can move laterally within the lipid bilayer. The variation between cells also fits the mosaic idea that the membrane is not identical everywhere."
    hints:
      - "Consider whether the proteins are fixed or able to move sideways."
      - "Think about which model describes a membrane that is flexible and mixed."
      - "Compare the observation with the model that allows movement."
    diagram: "Draw a section of the membrane with a few embedded proteins and an arrow showing one protein drifting sideways within the lipid layer, labelling the bilayer and the proteins."
    confidence: medium
  - topic: cell_organelles_11
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which organelle is the site of protein synthesis in the cell?"
    correct: "Ribosome"
    unit: ""
    wrong:
      - {text: "Golgi apparatus", mistake: "confuses the packaging body with the site of protein assembly"}
      - {text: "Lysosome", mistake: "confuses the digestive vesicle with the synthesis site"}
      - {text: "Vacuole", mistake: "assigns a storage compartment as the protein site"}
    explanation: "Ribosomes read messenger RNA and link amino acids into polypeptide chains. They can be free in the cytoplasm or attached to the rough endoplasmic reticulum."
    hints:
      - "Think about the small particles that read the messenger RNA."
      - "The structure is made of ribosomal RNA and protein."
      - "Consider which organelle assembles amino acids into chains."
    diagram: null
    confidence: high
  - topic: cell_organelles_11
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which organelle is the main site of aerobic respiration and produces most of the cell's ATP?"
    correct: "Mitochondrion"
    unit: ""
    wrong:
      - {text: "Chloroplast", mistake: "confuses the photosynthesis organelle with the respiration organelle"}
      - {text: "Peroxisome", mistake: "assigns a detoxifying organelle the energy role"}
      - {text: "Centrosome", mistake: "assigns a division organelle the energy role"}
    explanation: "Mitochondria carry out the Krebs cycle and oxidative phosphorylation, producing most of the ATP in an aerobic cell. They have an inner membrane folded into cristae."
    hints:
      - "Think about the organelle with an inner membrane folded into shelves."
      - "This organelle is often described as the powerhouse of the cell."
      - "Consider which organelle releases the energy of food in a usable form."
    diagram: null
    confidence: high
  - topic: cell_organelles_11
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does a secretory cell have abundant rough endoplasmic reticulum?"
    correct: "It is the site where proteins destined for secretion are synthesised and folded"
    unit: ""
    wrong:
      - {text: "It is the site where lipids are stored for later use", mistake: "assigns storage to the rough ER"}
      - {text: "It breaks down old organelles inside the cell", mistake: "assigns autophagy to the rough ER"}
      - {text: "It produces the energy currency of the cell", mistake: "assigns ATP production to the rough ER"}
    explanation: "Ribosomes attached to the rough endoplasmic reticulum make proteins that enter its lumen for folding and modification. Secretory cells need many such ribosomes to produce large amounts of protein."
    hints:
      - "Think about where the ribosomes are attached in the endoplasmic network."
      - "Consider what the secretory cell produces in large amounts."
      - "Compare the rough and smooth endoplasmic reticulum and their main roles."
    diagram: "Draw a section of a secretory cell showing rough endoplasmic reticulum with attached ribosomes, a nucleus and a Golgi stack, labelling each."
    confidence: high
  - topic: cell_organelles_11
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student wants to identify the organelle that packages and modifies proteins before they leave the cell. Which organelle should be chosen?"
    correct: "Golgi apparatus"
    unit: ""
    wrong:
      - {text: "Nucleolus", mistake: "confuses the site of ribosome assembly with the packaging organelle"}
      - {text: "Lysosome", mistake: "confuses the digestive organelle with the packaging organelle"}
      - {text: "Plasmodesmata", mistake: "confuses intercellular channels with an organelle"}
    explanation: "The Golgi apparatus receives proteins from the endoplasmic reticulum, modifies them, and packages them into vesicles for secretion or delivery to other sites."
    hints:
      - "Think of the stacked membrane organelle that sends material out."
      - "Consider which organelle receives proteins from the endoplasmic reticulum."
      - "The organelle works in sorting and packaging."
    diagram: "Draw a secretory pathway showing the rough ER, the Golgi apparatus, a vesicle and the plasma membrane, labelling each step."
    confidence: high
  - topic: cell_organelles_11
    type: mcq
    difficulty: hard
    role: apply
    stem: "A drug disrupts the function of lysosomes in a cell. Which consequence is most likely?"
    correct: "Damaged organelles and macromolecules accumulate because they are not digested and recycled"
    unit: ""
    wrong:
      - {text: "The cell produces more ATP through glycolysis alone", mistake: "assigns energy gain to a digestion failure"}
      - {text: "Chromosomes are duplicated in larger numbers", mistake: "links lysosomes with DNA replication"}
      - {text: "The cell loses its cell wall immediately", mistake: "assigns wall loss to lysosomes"}
    explanation: "Lysosomes contain hydrolytic enzymes that digest worn-out organelles and macromolecules. If they fail, waste accumulates, which can damage the cell."
    hints:
      - "Think about the digestive function of the organelle."
      - "Consider what happens to worn-out parts when they are not broken down."
      - "Ask which process would fail if the cell cannot recycle its own components."
    diagram: null
    confidence: medium
  - topic: cell_organelles_11
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A cell has a large central vacuole and is very turgid. Which role is this vacuole most likely playing?"
    correct: "Maintaining turgor pressure and storing water, ions and wastes"
    unit: ""
    wrong:
      - {text: "Synthesising the cell's lipid membranes", mistake: "assigns membrane synthesis to the vacuole"}
      - {text: "Carrying out cell division", mistake: "assigns division to the vacuole"}
      - {text: "Producing light energy for photosynthesis", mistake: "assigns light capture to the vacuole"}
    explanation: "Large central vacuoles in plant cells hold water, ions and wastes and push against the cell wall to maintain turgor, which keeps the cell firm."
    hints:
      - "Think about what fills most of a mature plant cell."
      - "Consider which process keeps the cell rigid when it is full of water."
      - "Ask what the central storage organelle contributes to turgidity."
    diagram: null
    confidence: medium
  - topic: cytoskeleton_and_cilia
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which component of the cytoskeleton is the thinnest and is made of actin?"
    correct: "Microfilament"
    unit: ""
    wrong:
      - {text: "Microtubule", mistake: "confuses the thicker tubular filament with the thinnest one"}
      - {text: "Intermediate filament", mistake: "confuses the middle-sized filament with the thinnest one"}
      - {text: "Centriole", mistake: "uses an organelle name for a filament"}
    explanation: "Microfilaments are the thinnest cytoskeletal fibres and are built from actin. Microtubules are thicker and made of tubulin, and intermediate filaments are in between."
    hints:
      - "Think about the thinnest fibre in the cytoskeleton, built from actin."
      - "Compare the thickness of the three cytoskeletal fibre types."
      - "The fibre is related to muscle contraction and cell shape."
    diagram: null
    confidence: high
  - topic: cytoskeleton_and_cilia
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which structure is built with a nine-plus-two arrangement of microtubules?"
    correct: "Cilium or flagellum"
    unit: ""
    wrong:
      - {text: "Centriole", mistake: "uses a nine-triplet arrangement and mistakes it for cilia"}
      - {text: "Microvillus", mistake: "confuses a membrane projection with a motile structure"}
      - {text: "Nucleolus", mistake: "assigns a nuclear structure to the motile arrangement"}
    explanation: "Cilia and flagella have a central pair of microtubules surrounded by nine doublets, which is the nine-plus-two arrangement that drives their beating or whipping."
    hints:
      - "Think about the hair-like structures that beat or whip to move a cell."
      - "The arrangement involves a central pair of microtubules."
      - "Consider the structures used for locomotion by some protists and sperm cells."
    diagram: null
    confidence: high
  - topic: cytoskeleton_and_cilia
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does a cilium beat in a coordinated wave rather than all at once?"
    correct: "Dynein arms on neighbouring doublets slide in sequence, producing a coordinated bending"
    unit: ""
    wrong:
      - {text: "Each cilium is powered by its own separate nucleus", mistake: "assigns a nucleus to each cilium"}
      - {text: "Ciliary beating is driven by water pressure only", mistake: "removes the motor protein from the mechanism"}
      - {text: "Cilia are rigid and bend only when cooled", mistake: "denies the motile mechanism of cilia"}
    explanation: "Dynein motor proteins on adjacent microtubule doublets slide against one another in sequence, which bends the cilium and creates a wave that moves fluid or the cell."
    hints:
      - "Think about what molecular motor produces the sliding in cilia."
      - "Consider how sliding is coordinated along neighbouring doublets."
      - "The mechanism depends on protein arms sliding past each other."
    diagram: "Draw a cross section of a cilium showing the nine doublets around a central pair, with the dynein arms labelled on each doublet."
    confidence: medium
  - topic: cytoskeleton_and_cilia
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A researcher wants to test whether a drug blocks the motility of sperm. Which structure should the researcher inspect first?"
    correct: "The flagellum"
    unit: ""
    wrong:
      - {text: "The nucleus", mistake: "examines the genetic store instead of the motility structure"}
      - {text: "The acrosome", mistake: "examines the enzyme cap instead of the propulsion structure"}
      - {text: "The mitochondrial sheath", mistake: "assumes energy supply alone determines motility"}
    explanation: "Sperm move by beating a flagellum built with a nine-plus-two arrangement of microtubules. The flagellum is therefore the structure to examine for a motility test."
    hints:
      - "Think about the structure that propels the cell through fluid."
      - "Consider which structure has the same internal arrangement as cilia."
      - "Look for the tail that whips to move the sperm."
    diagram: "Draw a sperm cell showing the head, the midpiece with mitochondria and the long flagellum, labelling each part."
    confidence: medium
  - topic: cytoskeleton_and_cilia
    type: mcq
    difficulty: hard
    role: apply
    stem: "A patient has cilia that do not beat properly in the airway. Which consequence is most likely?"
    correct: "Mucus and trapped particles are not cleared from the airway, increasing infection risk"
    unit: ""
    wrong:
      - {text: "Blood clotting becomes faster in the lungs", mistake: "assigns clotting to cilia"}
      - {text: "Red blood cells lose their haemoglobin", mistake: "links cilia with haemoglobin"}
      - {text: "The heart beats more slowly", mistake: "links airway cilia with heart rhythm"}
    explanation: "Airway cilia sweep mucus upward to clear particles and microbes. If they fail, mucus stagnates and the risk of infection rises."
    hints:
      - "Think about the function of cilia in the airway lining."
      - "Consider what happens to mucus when it cannot be moved upward."
      - "Ask what the airway would lose if it cannot clear trapped particles."
    diagram: null
    confidence: high
  - topic: cytoskeleton_and_cilia
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A cell uses microtubules to move vesicles along a track toward the periphery. Which motor protein is most likely involved in this transport toward the cell's edge?"
    correct: "Kinesin"
    unit: ""
    wrong:
      - {text: "Actin", mistake: "uses a filament name instead of a motor protein"}
      - {text: "Tubulin", mistake: "uses a microtubule building block instead of a motor"}
      - {text: "Collagen", mistake: "uses an extracellular protein for intracellular transport"}
    explanation: "Kinesin usually moves cargo toward the plus end of microtubules, which lies toward the periphery of the cell. Dynein moves cargo in the opposite direction."
    hints:
      - "Think about the motor proteins that walk along microtubules."
      - "Consider which motor moves cargo toward the outer edge of the cell."
      - "Compare the motors that move cargo toward the periphery versus toward the centre."
    diagram: null
    confidence: medium
