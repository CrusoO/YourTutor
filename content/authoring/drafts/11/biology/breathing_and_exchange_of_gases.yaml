  - topic: respiratory_organs
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is the pleural membrane important for breathing?"
    correct: "It forms a sealed space with fluid that lets the lungs follow the movement of the chest wall"
    unit: ""
    wrong:
