  - topic: regulation_of_breathing
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A person starts running and their breathing rate rises. Which factor is the main cause of this change?"
    correct: "Increased carbon dioxide production by exercising muscles, which raises the stimulus to breathe"
    unit: ""
    wrong:
