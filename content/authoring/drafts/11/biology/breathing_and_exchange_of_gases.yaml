  - topic: regulation_of_breathing
    type: mcq
    difficulty: hard
    role: apply
    stem: "A person breathes very rapidly for several minutes and their blood carbon dioxide falls. What is the most likely consequence?"
    correct: "Blood pH rises, and the person may feel dizzy or faint"
    unit: ""
    wrong:
      - {text: "Blood pH falls, causing a stronger breathing drive", mistake: "reverses the carbon dioxide effect"}
      - {text: "Breathing slows to a very low rate", mistake: "assumes low carbon dioxide slows breathing"}
      - {text: "Oxygen delivery increases dramatically", mistake: "assumes lower carbon dioxide raises oxygen supply"}
    explanation: "Overbreathing removes carbon dioxide faster than it is made, which makes the blood more alkaline. This can cause dizziness, tingling and fainting."
    hints:
      - "Think about what happens to acidity when carbon dioxide is removed from the blood."
      - "Consider how the brain responds to the drop in carbon dioxide."
      - "The change in pH is the key to the symptoms."
    diagram: null
    confidence: medium
  - topic: regulation_of_breathing
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A patient with severe uncontrolled diabetes breathes deeply and rapidly. Why does this occur?"
    correct: "Acid build-up in the blood stimulates the respiratory centre to increase ventilation and remove CO2"
    unit: ""
    wrong:
      - {text: "The brain needs much more oxygen for its metabolism", mistake: "assigns oxygen demand as the sole cause"}
      - {text: "The lungs are damaged and need faster airflow", mistake: "assigns lung damage as the cause"}
      - {text: "Insulin stimulates the diaphragm directly", mistake: "assigns a hormone a direct muscle role"}
    explanation: "Ketoacids accumulate in uncontrolled diabetes and lower the blood pH. The respiratory centre responds by increasing ventilation, which blows off carbon dioxide and partly compensates for the acid load."
    hints:
      - "Think about acids that accumulate in the blood in this condition."
      - "Consider how the body compensates for an acid load by changing carbon dioxide levels."
      - "Ask what the breathing change does to the blood pH."
    diagram: null
    confidence: medium
