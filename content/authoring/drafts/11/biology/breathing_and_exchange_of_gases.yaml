      - {text: "Biceps", mistake: "assigns a limb muscle to breathing"}
      - {text: "Pectoralis major", mistake: "assigns a chest muscle the main inspiratory role"}
    explanation: "The diaphragm is a dome-shaped sheet of muscle that flattens when it contracts, increasing the chest volume during a normal inspiration."
    hints:
      - "This dome-shaped muscle separates the chest from the abdomen."
      - "It contracts and flattens during a normal breath in."
      - "It is supplied by a nerve that runs down from the neck."
    diagram: null
    confidence: high
  - topic: mechanism_of_breathing
    type: mcq
    difficulty: easy
    role: recall
    stem: "During normal expiration at rest, what happens to the volume of the thoracic cavity?"
    correct: "It decreases as the muscles relax and the chest recoils"
    unit: ""
    wrong:
      - {text: "It increases because the diaphragm contracts", mistake: "reverses the effect of inspiration"}
      - {text: "It stays constant while the lungs fill", mistake: "ignores the volume change in the chest"}
      - {text: "It increases as the external intercostal muscles contract", mistake: "assigns the inspiratory muscles to expiration"}
    explanation: "At rest, expiration is passive. The inspiratory muscles relax, the elastic lung and chest recoil, and the thoracic volume shrinks."
    hints:
      - "Think about the chest getting smaller during a normal breath out."
      - "Consider what happens to the diaphragm when it relaxes."
      - "The chest returns to a smaller size by a passive recoil."
    diagram: null
    confidence: high
  - topic: mechanism_of_breathing
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does air flow into the lungs during inspiration?"
    correct: "The thoracic volume increases, which lowers intrapulmonary pressure below atmospheric pressure"
    unit: ""
    wrong:
      - {text: "The lungs actively pull air in by suction", mistake: "assigns active suction to the lungs"}
      - {text: "The alveoli produce air as they expand", mistake: "treats air as being made in the lungs"}
      - {text: "The heart pumps air into the lungs", mistake: "assigns air movement to circulation"}
    explanation: "Expanding the chest enlarges the lungs and lowers the pressure inside them. Air then moves from the higher atmospheric pressure into the lungs until the pressures equalise."
    hints:
      - "Think about the pressure difference between the lungs and the outside air."
      - "Consider what a volume increase does to the pressure of the gas inside."
      - "Air moves from a region of higher pressure to one of lower pressure."
    diagram: null
    confidence: high
  - topic: mechanism_of_breathing
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which order of events occurs in a normal inspiration?"
    correct: "The diaphragm contracts, thoracic volume increases, pressure falls, and air flows in"
    unit: ""
    wrong:
      - {text: "Pressure falls, the diaphragm contracts, air flows in, and volume increases", mistake: "reverses the causal chain"}
      - {text: "Air flows in, volume increases, the diaphragm contracts, and pressure falls", mistake: "places airflow before the muscle action"}
      - {text: "The diaphragm relaxes, volume increases, pressure rises, and air flows out", mistake: "describes expiration instead"}
    explanation: "Muscle contraction starts the breath, which increases the thoracic volume. The resulting fall in pressure draws air into the lungs."
    hints:
      - "Start with the muscle action that begins the breath."
      - "Ask which change causes the pressure inside the lungs to fall."
      - "The airflow is the last event in the sequence."
    diagram: "Draw a flow chart for inspiration with four boxes in order: diaphragm contracts, thoracic volume increases, intrapulmonary pressure falls, air flows in, with arrows between them."
    confidence: high
  - topic: mechanism_of_breathing
    type: mcq
    difficulty: hard
    role: apply
    stem: "A person's pleural space is opened to the air, so air enters between the two pleural layers. What is the most likely result for that lung?"
    correct: "The lung collapses because the pressure in the pleural space now equals atmospheric pressure"
    unit: ""
    wrong:
      - {text: "The lung expands more than usual because pressure rises", mistake: "reverses the pressure effect"}
      - {text: "Breathing becomes faster but the lung stays inflated", mistake: "ignores the loss of the pressure difference"}
      - {text: "Gas exchange improves because more air is available", mistake: "assumes extra air space improves exchange"}
    explanation: "The lung stays open because the pleural pressure is lower than the pressure inside it. Air in the pleural space removes this difference, and the elastic lung recoils and collapses."
    hints:
      - "Think about the pressure difference that holds the lung open."
      - "Consider what happens to the lung when the space around it fills with air."
      - "Ask whether the lung can stay open when the pressure outside it equals the pressure inside the space."
    diagram: null
    confidence: high
  - topic: mechanism_of_breathing
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A patient has a weakened diaphragm. Which compensatory change is most likely during quiet breathing?"
    correct: "Greater use of the external intercostal and accessory muscles to expand the chest"
    unit: ""
    wrong:
      - {text: "Expiration becomes active, with the abdomen pulling air in", mistake: "reverses the roles of expiration and inspiration"}
      - {text: "No change, because the diaphragm alone drives all breathing", mistake: "denies the role of accessory muscles"}
      - {text: "The lungs begin to contract on their own to draw in air", mistake: "assigns active contraction to the lungs"}
    explanation: "When the diaphragm is weak, other muscles such as the external intercostals and accessory muscles of the neck and chest take on more of the work of enlarging the thoracic cavity."
    hints:
      - "Think about which other muscles can enlarge the chest."
      - "Consider which muscles are normally used only during harder breathing."
      - "Ask what happens to the chest when those muscles contract."
    diagram: "Draw a chest wall with the diaphragm, external intercostals and accessory neck muscles labelled, with arrows showing the chest expansion in each case."
    confidence: medium
  - topic: exchange_and_transport_gases
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which iron-containing pigment in red blood cells carries most of the oxygen?"
    correct: "Haemoglobin"
    unit: ""
    wrong:
      - {text: "Myoglobin", mistake: "assigns the muscle storage pigment to blood"}
      - {text: "Chlorophyll", mistake: "assigns a plant pigment to animal blood"}
      - {text: "Carbonic anhydrase", mistake: "uses an enzyme name for a pigment"}
    explanation: "Haemoglobin binds oxygen in the lungs and releases it in tissues. Each molecule carries four oxygen binding sites, and the iron atoms bind the oxygen."
    hints:
      - "Think about the iron-containing protein in red blood cells."
      - "The pigment gives blood its red colour."
      - "The protein binds oxygen in the lungs and releases it in the tissues."
