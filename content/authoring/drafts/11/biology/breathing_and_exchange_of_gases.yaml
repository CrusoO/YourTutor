  - topic: exchange_and_transport_gases
    type: mcq
    difficulty: easy
    role: recall
    stem: "In what form is most carbon dioxide carried in the blood?"
    correct: "Bicarbonate ions"
    unit: ""
    wrong:
      - {text: "Dissolved carbon dioxide only", mistake: "assumes the small dissolved fraction is the main form"}
      - {text: "Carbaminohaemoglobin only", mistake: "assumes one bound form carries most of the gas"}
      - {text: "Carbon monoxide", mistake: "confuses carbon dioxide with carbon monoxide"}
    explanation: "Most carbon dioxide enters red cells, where carbonic anhydrase converts it to carbonic acid and then to bicarbonate, which moves into the plasma."
    hints:
      - "Think about the ion formed when carbon dioxide reacts with water in red cells."
      - "The reaction is catalysed by carbonic anhydrase."
      - "The ion is formed in the red cell and then moves out into the plasma."
    diagram: null
    confidence: high
  - topic: exchange_and_transport_gases
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does the oxygen dissociation curve of haemoglobin have a sigmoid shape?"
    correct: "Binding one oxygen increases the affinity of the remaining sites, a cooperative effect"
    unit: ""
    wrong:
      - {text: "Each oxygen molecule blocks the next binding site", mistake: "reverses cooperativity"}
      - {text: "Oxygen binds only at high temperature", mistake: "links binding to temperature alone"}
      - {text: "Haemoglobin has no binding sites for oxygen", mistake: "denies the binding function of haemoglobin"}
    explanation: "The four subunits of haemoglobin show cooperative binding, so each oxygen that binds makes the next one easier to bind. This produces the steep middle part of the curve."
    hints:
      - "Think about how the first oxygen molecule affects the others."
      - "Consider whether each binding event is independent of the last."
      - "The shape of the curve reflects a feature of how the molecule behaves."
    diagram: null
    confidence: high
  - topic: exchange_and_transport_gases
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which tissue conditions promote the release of oxygen from haemoglobin during exercise?"
    correct: "Lower oxygen pressure, higher carbon dioxide and more acidity, which shift the curve to the right"
    unit: ""
    wrong:
      - {text: "Higher oxygen pressure and lower temperature", mistake: "reverses the release conditions"}
      - {text: "Lower carbon dioxide and higher pH", mistake: "reverses the acidity effect"}
      - {text: "Higher pH and lower temperature together", mistake: "reverses the effect of acidity and heat"}
    explanation: "Active tissues produce carbon dioxide, acid and heat, which reduce the affinity of haemoglobin for oxygen and release more oxygen to the muscle. This is the Bohr effect."
    hints:
      - "Think about the conditions in active tissues that produce carbon dioxide."
      - "Consider how acid affects the affinity of haemoglobin for oxygen."
      - "The effect is named after the scientist who first described it."
    diagram: "Draw the oxygen dissociation curve with two curves, one for normal conditions and one shifted to the right for active tissue, labelling the shift and the conditions that cause it."
    confidence: high
  - topic: exchange_and_transport_gases
    type: numeric
    difficulty: hard
    role: apply
    stem: "Arterial blood carries 20 mL of O2 per 100 mL of blood, and venous blood carries 15 mL of O2 per 100 mL. How many mL of O2 are delivered to the tissues per 100 mL of blood?"
    correct: "5"
    unit: "mL"
    wrong: []
    explanation: "The tissues take up the difference between arterial and venous oxygen content, which is 20 minus 15, giving 5 mL per 100 mL."
    hints:
      - "Subtract the venous content from the arterial content."
      - "Compare the two values per 100 mL of blood."
      - "The difference is what the tissues take up."
    diagram: null
    confidence: high
  - topic: exchange_and_transport_gases
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A patient with carbon monoxide poisoning breathes normally but shows poor oxygen delivery to the tissues. Why?"
    correct: "Carbon monoxide binds haemoglobin with much higher affinity than oxygen, blocking oxygen transport"
    unit: ""
    wrong:
      - {text: "Carbon monoxide destroys the alveoli directly", mistake: "assigns structural damage as the mechanism"}
      - {text: "Carbon monoxide prevents the diaphragm from contracting", mistake: "assigns a muscle effect as the cause"}
      - {text: "Carbon monoxide makes the lungs produce less air", mistake: "treats air production as a lung function"}
    explanation: "Carbon monoxide competes for the oxygen binding sites on haemoglobin and binds far more tightly. The oxygen carried by the blood then falls, even though breathing and the airways are normal."
    hints:
      - "Think about what carbon monoxide competes with at the haemoglobin binding site."
      - "Consider which gas binds haemoglobin more strongly than oxygen does."
      - "The poisoning affects transport of oxygen rather than the airway."
    diagram: "Draw a haemoglobin molecule with four binding sites, showing oxygen molecules on some sites and carbon monoxide blocking the others, labelled to show the blocked transport."
    confidence: high
