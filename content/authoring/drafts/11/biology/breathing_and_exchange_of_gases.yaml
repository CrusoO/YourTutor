  - topic: respiratory_organs
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which tiny thin-walled sacs in the human lungs are the sites of gas exchange?"
    correct: "Alveoli"
    unit: ""
    wrong:
      - {text: "Bronchioles", mistake: "assigns the conducting tubes the exchange role"}
      - {text: "Trachea", mistake: "assigns the windpipe the exchange role"}
      - {text: "Larynx", mistake: "assigns the voice box the exchange role"}
    explanation: "Alveoli are clusters of microscopic air sacs surrounded by capillaries, and their thin walls allow oxygen and carbon dioxide to diffuse between air and blood."
    hints:
      - "These structures sit at the end of the airways and are surrounded by capillaries."
      - "Think about the tiny sacs at the end of the smallest airway branches."
      - "The thin walls of these sacs are what allow gases to pass."
