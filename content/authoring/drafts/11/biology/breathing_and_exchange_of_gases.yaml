      - {text: "It exchanges gases directly with the blood", mistake: "assigns gas exchange to the membrane"}
    explanation: "The two pleural layers enclose a thin fluid film, and the fluid lets the lungs slide smoothly as the chest wall expands and contracts. The pressure relationship keeps the lungs inflated."
    hints:
      - "Think about the two layers that surround each lung."
      - "Consider how the lungs follow the movement of the chest wall."
      - "The fluid between the layers reduces friction during breathing."
