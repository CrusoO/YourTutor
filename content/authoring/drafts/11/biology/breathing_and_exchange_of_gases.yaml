      - {text: "Rising sodium levels", mistake: "assigns an electrolyte the breathing role"}
    explanation: "Carbon dioxide dissolves and forms carbonic acid, lowering the pH. Chemoreceptors in the brain and arteries detect this change and increase ventilation."
    hints:
      - "Think about the gas produced by respiring tissues."
      - "The change makes the blood more acidic."
      - "The central chemoreceptors respond to changes in the fluid around the brain."
