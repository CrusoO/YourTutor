    explanation: "The trachea is held open by incomplete C-shaped rings of hyaline cartilage. The open side of each ring faces the oesophagus, which lets food pass."
    hints:
      - "The rings are incomplete at the back, next to the food tube."
      - "Think about a firm tissue in the airway that is not bone."
      - "The incomplete rings are visible in a cross section of the windpipe."
