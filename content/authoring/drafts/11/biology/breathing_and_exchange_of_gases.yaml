  - topic: regulation_of_breathing
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which change in the blood is the most important stimulus for increasing the rate of breathing?"
    correct: "Rising carbon dioxide and falling pH"
    unit: ""
    wrong:
      - {text: "Falling oxygen levels only", mistake: "assumes oxygen is the main stimulus in healthy people"}
