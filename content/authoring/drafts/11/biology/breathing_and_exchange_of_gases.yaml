  - topic: respiratory_organs
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A bronchiole in one lung becomes blocked, so gas exchange in that lung falls. Which region is most directly affected?"
    correct: "The alveoli supplied by that blocked bronchiole"
    unit: ""
    wrong:
      - {text: "The trachea in both lungs", mistake: "assumes a local blockage affects the whole airway"}
      - {text: "The larynx only", mistake: "places the blockage in the voice box"}
      - {text: "The nasal cavity", mistake: "places the blockage at the entrance of the airway"}
    explanation: "Each bronchiole feeds a group of alveoli. Blocking it stops air reaching those alveoli, so exchange falls in that section of lung rather than across the whole airway."
    hints:
      - "Think about which structures receive air through the blocked tube."
      - "Consider whether the trachea is downstream or upstream of the blockage."
      - "Ask which part of the lung is fed by that airway branch."
    diagram: "Draw a bronchial tree branching into a bronchiole with a blocked point, and mark the alveoli downstream of the blockage in a cluster."
    confidence: medium
  - topic: mechanism_of_breathing
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which muscle is the main muscle of inspiration in humans?"
    correct: "Diaphragm"
    unit: ""
    wrong:
