  - topic: respiratory_organs
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which pathway does inhaled air take from outside the body to the alveoli?"
    correct: "Nasal cavity, pharynx, larynx, trachea, bronchi, bronchioles, alveoli"
    unit: ""
    wrong:
      - {text: "Trachea, nasal cavity, larynx, pharynx, bronchi, alveoli", mistake: "scrambles the upper airway"}
      - {text: "Pharynx, larynx, nasal cavity, bronchi, trachea, bronchioles", mistake: "places the nose after the throat"}
      - {text: "Bronchi, trachea, larynx, pharynx, nasal cavity, alveoli", mistake: "reverses the whole pathway"}
    explanation: "Air enters through the nose, passes the pharynx and larynx into the trachea, divides into bronchi and bronchioles, and finally reaches the alveoli for gas exchange."
    hints:
      - "Start at the nose, the first opening air passes."
      - "The air passes through the throat before reaching the windpipe."
      - "The last part of the pathway is a set of tiny sacs."
    diagram: "Draw the airway from the nasal cavity down through the pharynx, larynx, trachea and bronchi to the branching bronchioles and alveoli, labelling each structure in order."
    confidence: high
