  - topic: ecg_and_blood_pressure
    type: mcq
    difficulty: medium
    role: explain
    stem: "What is the difference between systolic and diastolic blood pressure?"
    correct: "Systolic is the pressure during ventricular contraction, and diastolic is the pressure when the ventricles relax"
    unit: ""
    wrong:
      - {text: "Systolic is the pressure in veins and diastolic is the pressure in arteries", mistake: "assigns the vessel types the wrong way round"}
      - {text: "Systolic is always lower than diastolic", mistake: "reverses the usual relation between the two readings"}
      - {text: "Diastolic is the pressure during atrial contraction only", mistake: "limits diastolic pressure to a single event"}
    explanation: "Systolic pressure is the peak in the arteries during ventricular contraction, and diastolic pressure is the lower value when the ventricles relax and fill."
    hints:
      - "Think about which phase of the heartbeat produces the higher reading."
      - "Consider which phase corresponds to the heart filling."
      - "The two readings are taken in different phases of the cycle."
    diagram: null
    confidence: high
  - topic: ecg_and_blood_pressure
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A blood pressure reading is given as 120 over 80 mmHg. Which value is the systolic pressure?"
    correct: "120 mmHg"
    unit: ""
    wrong:
      - {text: "80 mmHg", mistake: "assigns the lower reading to systolic"}
      - {text: "100 mmHg", mistake: "averages the two readings instead of reading them"}
      - {text: "200 mmHg", mistake: "adds the two readings together"}
    explanation: "In a blood pressure reading the first, higher value is the systolic pressure and the second is the diastolic pressure. Here the systolic value is 120 mmHg."
    hints:
      - "The higher reading is taken during contraction."
      - "The first number in the reading is the higher one."
      - "Compare the two numbers with the phases they represent."
    diagram: "Draw a blood pressure trace over one cardiac cycle with the peak labelled as systolic and the trough labelled as diastolic."
    confidence: high
  - topic: ecg_and_blood_pressure
    type: numeric
