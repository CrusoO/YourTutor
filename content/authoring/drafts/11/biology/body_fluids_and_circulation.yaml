  - topic: ecg_and_blood_pressure
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which change would most likely raise blood pressure in a healthy person at rest?"
    correct: "An increase in peripheral resistance caused by narrowing of the arterioles"
    unit: ""
    wrong:
      - {text: "Dilation of arterioles throughout the body", mistake: "reverses the effect of vessel narrowing on resistance"}
      - {text: "A fall in heart rate and stroke volume together", mistake: "assumes a lower cardiac output raises pressure"}
      - {text: "Loss of a large volume of blood", mistake: "assumes blood loss raises pressure"}
    explanation: "Blood pressure depends on cardiac output and peripheral resistance. Narrowing the arterioles raises resistance, so pressure rises for the same flow."
    hints:
      - "Think about the diameter of the arterioles and what that does to resistance."
      - "Consider which change narrows the vessels."
      - "Compare the effect of narrow vessels with that of wide vessels on pressure."
    diagram: "Draw two arterioles side by side, one wide and one narrowed, with arrows showing the resulting rise in peripheral resistance in the narrow one."
    confidence: medium
