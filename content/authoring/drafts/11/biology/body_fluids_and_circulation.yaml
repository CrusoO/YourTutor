  - topic: blood_composition
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which small cell fragments gather at a wound and release factors that start blood clotting?"
    correct: "Platelets"
    unit: ""
    wrong:
      - {text: "Erythrocytes", mistake: "assigns oxygen transport to the clotting step"}
      - {text: "Lymphocytes", mistake: "assigns immune defence to clot formation"}
      - {text: "Neutrophils", mistake: "confuses phagocytes with clotting cells"}
    explanation: "Platelets are small fragments of megakaryocytes that adhere to damaged vessel walls, aggregate and release factors that drive clot formation."
    hints:
      - "These are small fragments released from large cells in the bone marrow."
      - "They gather at a wound and release factors that help form a clot."
      - "They do not have a nucleus."
    diagram: null
    confidence: high
  - topic: blood_composition
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which blood cells are the most numerous and carry oxygen bound to haemoglobin?"
    correct: "Red blood cells"
    unit: ""
    wrong:
      - {text: "White blood cells", mistake: "assumes the defence cells carry oxygen"}
      - {text: "Platelets", mistake: "assigns oxygen transport to cell fragments"}
      - {text: "Plasma proteins", mistake: "treats the liquid component as cells"}
    explanation: "Red blood cells are packed with haemoglobin, which binds oxygen in the lungs and releases it in tissues. Mature human red cells lack a nucleus and are the most abundant blood cells."
    hints:
      - "Think about cells packed with an iron-containing pigment."
      - "Mature cells of this type lack a nucleus in humans."
      - "They are the most common cell type in blood."
    diagram: null
    confidence: high
  - topic: blood_composition
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does plasma contain large dissolved proteins such as albumin?"
    correct: "They help maintain osmotic pressure that keeps water inside the blood vessels"
    unit: ""
    wrong:
      - {text: "They carry oxygen to the tissues", mistake: "assigns oxygen transport to plasma proteins"}
      - {text: "They are the main energy store of blood", mistake: "assigns a storage role to plasma proteins"}
      - {text: "They destroy bacteria directly", mistake: "assigns the antibody role to albumin"}
    explanation: "Plasma proteins are too large to leave the capillaries easily, so they keep the osmotic pressure of the blood high. This pulls water back into the vessels from the tissues."
    hints:
      - "Think about what keeps water inside the vessels."
      - "Consider the pressure that draws fluid back into the capillaries."
      - "The effect depends on the concentration of large molecules that stay in the blood."
    diagram: null
    confidence: high
  - topic: blood_composition
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student spins a tube of blood in a centrifuge. Which layer forms at the top of the tube?"
    correct: "Plasma"
    unit: ""
    wrong:
      - {text: "Buffy coat", mistake: "places the thin white layer at the top"}
      - {text: "Red cell layer", mistake: "places the densest layer at the top"}
      - {text: "Clot", mistake: "assumes a clot forms on top of the tube"}
    explanation: "Centrifugation separates blood by density. The liquid plasma is the least dense part and forms the top layer, below which lie the buffy coat and the packed red cells."
    hints:
      - "The top layer is the liquid part of the blood."
      - "Think about which component is least dense."
      - "The denser cells settle toward the bottom of the tube."
    diagram: null
    confidence: high
  - topic: blood_composition
    type: mcq
    difficulty: hard
    role: apply
    stem: "A patient has a very low platelet count. Which problem is most directly expected?"
    correct: "Prolonged bleeding and easy bruising from small wounds"
    unit: ""
    wrong:
      - {text: "Shortness of breath from low oxygen transport", mistake: "assigns oxygen transport to platelets"}
      - {text: "Fever from a bacterial infection", mistake: "assigns infection defence to platelets"}
      - {text: "Swelling caused by excess plasma proteins", mistake: "assigns swelling to protein excess"}
    explanation: "Platelets form the initial plug and supply clotting factors at injury sites. A low count delays this, so small wounds keep bleeding and bruise easily."
    hints:
      - "Think about what platelets do at a wound."
      - "Consider whether the blood can form a plug quickly when the count is low."
      - "Ask which function is affected when clot formation is weak."
    diagram: null
    confidence: high
  - topic: blood_composition
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A healthy adult has about 5 litres of blood, and plasma makes up 55 percent of the blood volume. How many litres of plasma are present?"
    correct: "2.75"
    unit: "L"
    wrong: []
    explanation: "Plasma is 55 percent of 5 litres, which is 0.55 times 5, giving 2.75 litres."
    hints:
      - "Multiply the total volume by the fraction that is plasma."
      - "Convert the percentage to a decimal before multiplying."
      - "Check that the answer is smaller than the total volume."
    diagram: null
    confidence: high
  - topic: lymph
    type: mcq
    difficulty: easy
    role: recall
    stem: "Near which vessels does the main lymphatic duct empty lymph back into the circulation?"
    correct: "The subclavian veins near the neck"
    unit: ""
    wrong:
      - {text: "The pulmonary arteries", mistake: "assigns lymph return to the lung vessels"}
      - {text: "The hepatic portal vein", mistake: "assigns lymph return to the gut vessel"}
      - {text: "The aorta just above the kidneys", mistake: "assigns lymph return to the main artery at the kidneys"}
    explanation: "The thoracic duct collects lymph from most of the body and empties it into the junction of the left subclavian and internal jugular veins near the neck."
    hints:
      - "The vessel drains into the upper chest region near the neck."
      - "Think about veins that lie near the collarbone."
      - "The duct empties on the left side close to the heart."
    diagram: null
    confidence: medium
  - topic: lymph
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the main function of the lymph nodes?"
    correct: "Filtering lymph and trapping pathogens so immune responses can start"
    unit: ""
    wrong:
      - {text: "Producing red blood cells in adults", mistake: "assigns bone marrow work to lymph nodes"}
      - {text: "Storing glucose as glycogen", mistake: "assigns a liver role to lymph nodes"}
      - {text: "Pumping lymph through the heart", mistake: "assigns pumping to lymph nodes"}
    explanation: "Lymph nodes are small structures along the lymphatic vessels that filter lymph and house lymphocytes and macrophages, which respond to antigens carried in the fluid."
    hints:
      - "Think about where immune cells gather along the lymph vessels."
      - "These structures contain lymphocytes and macrophages."
      - "The structures filter the fluid as it passes through."
    diagram: null
    confidence: high
  - topic: lymph
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is lymph important for absorbing dietary fat in the small intestine?"
    correct: "Lacteals take up fat packaged as chylomicrons, which enter the lymphatic system rather than the blood directly"
    unit: ""
    wrong:
      - {text: "Lymph dissolves fats into glucose inside the gut", mistake: "assigns sugar conversion to lymph"}
      - {text: "Lymph carries oxygen to the intestinal wall", mistake: "assigns oxygen transport to lymph"}
      - {text: "Lymph breaks fats down into fatty acids directly", mistake: "assigns digestion to lymph"}
    explanation: "Fatty acids and monoglycerides are repackaged into chylomicrons inside intestinal cells. These particles are too large for capillaries, so they enter the central lacteals and reach the blood through the lymphatic system."
    hints:
      - "Think about the small lymph vessels inside the intestinal villi."
      - "Consider the form in which fat is packaged for transport."
      - "The packages are too large to pass straight into the capillaries."
    diagram: null
    confidence: high
  - topic: lymph
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which fluid returns the extra tissue fluid that capillaries do not reabsorb?"
    correct: "Lymph"
    unit: ""
    wrong:
      - {text: "Plasma", mistake: "assumes plasma returns tissue fluid directly"}
      - {text: "Cerebrospinal fluid", mistake: "assigns the brain fluid to the tissues"}
      - {text: "Bile", mistake: "assigns a digestive fluid to tissue drainage"}
    explanation: "Lymph capillaries are blind-ended vessels that collect the leftover tissue fluid and return it to the bloodstream, which keeps tissues from swelling."
    hints:
      - "Think about the system of vessels that collects the leftover fluid."
      - "The fluid is a clear fluid rich in lymphocytes."
      - "Consider the vessels that begin as blind tubes in the tissues."
    diagram: null
    confidence: high
  - topic: lymph
    type: mcq
    difficulty: hard
    role: apply
    stem: "A blockage prevents lymph from draining out of one arm, and the arm swells. What is the best explanation?"
    correct: "Fluid cannot drain away, so interstitial fluid accumulates in the tissue"
    unit: ""
    wrong:
      - {text: "Red cells are being destroyed in the swollen area", mistake: "assigns the swelling to cell destruction"}
      - {text: "Blood pressure falls to zero in the tissue", mistake: "assigns the swelling to a pressure collapse"}
      - {text: "Oxygen levels rise too high in the tissue", mistake: "assigns the swelling to oxygen excess"}
    explanation: "Tissue fluid that is not returned by lymph builds up in the interstitial spaces, producing oedema. The swelling is fluid accumulation rather than cell damage."
    hints:
      - "Think about where extra tissue fluid normally goes."
      - "Consider what happens when the drainage route is closed."
      - "The accumulation is of a fluid, not of cells."
    diagram: null
    confidence: high
  - topic: lymph
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A drug stops lymphocytes from moving through lymph nodes. Which immune response is most likely impaired?"
    correct: "Adaptive immune responses that depend on lymphocytes meeting antigens in the nodes"
    unit: ""
    wrong:
      - {text: "Control of breathing rate", mistake: "assigns respiratory control to immunity"}
      - {text: "Blood clotting at a wound", mistake: "assigns clotting to lymphocyte movement"}
      - {text: "Bile secretion by the liver", mistake: "assigns bile production to lymph nodes"}
    explanation: "Lymph nodes are where lymphocytes encounter antigens brought in by lymph and mount adaptive responses. Blocking their movement weakens these responses."
    hints:
      - "Think about where lymphocytes meet antigens."
      - "Consider which immune response depends on lymph nodes."
      - "Ask which immune process requires lymphocytes to circulate through lymph."
    diagram: null
    confidence: medium
  - topic: heart_and_cardiac_cycle
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which heart chamber pumps oxygenated blood into the systemic circulation?"
    correct: "Left ventricle"
    unit: ""
    wrong:
      - {text: "Right atrium", mistake: "confuses the receiving chamber on the right with the pump on the left"}
      - {text: "Right ventricle", mistake: "sends blood to the lungs rather than the body"}
      - {text: "Left atrium", mistake: "assigns the receiving chamber the pumping role"}
    explanation: "The left ventricle has the thickest muscular wall and pumps oxygenated blood through the aorta to the body. The left atrium receives blood from the lungs before it passes into this chamber."
    hints:
      - "Think about the thickest-walled chamber on the left side."
      - "This chamber pumps blood into the aorta."
      - "It receives blood from the lungs before pumping."
    diagram: null
    confidence: high
  - topic: heart_and_cardiac_cycle
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which valve lies between the left atrium and the left ventricle?"
    correct: "Bicuspid valve"
    unit: ""
    wrong:
      - {text: "Tricuspid valve", mistake: "places the right-side valve on the left"}
      - {text: "Aortic valve", mistake: "confuses the outlet valve with the inlet valve"}
      - {text: "Pulmonary valve", mistake: "confuses the right outlet valve with the left inlet valve"}
    explanation: "The bicuspid, or mitral, valve sits between the left atrium and left ventricle and has two flaps. It prevents backflow into the atrium when the ventricle contracts."
    hints:
      - "This valve has two flaps."
      - "It is on the left side of the heart."
      - "Think about the valve that stops blood flowing back into the atrium during ventricular contraction."
    diagram: null
    confidence: high
  - topic: heart_and_cardiac_cycle
    type: mcq
    difficulty: medium
    role: explain
    stem: "What causes the first heart sound, S1?"
    correct: "Closure of the atrioventricular valves at the start of ventricular systole"
    unit: ""
    wrong:
      - {text: "Closure of the semilunar valves at the end of systole", mistake: "assigns the second sound event to the first sound"}
      - {text: "Opening of the atrioventricular valves during diastole", mistake: "reverses the valve action"}
      - {text: "Contraction of the atria", mistake: "assigns the sound to atrial contraction"}
    explanation: "S1 is produced when the atrioventricular valves close as the ventricles begin to contract. The closure of the semilunar valves at the end of systole produces S2."
    hints:
      - "Think about the valves that close when the ventricles begin to contract."
      - "Consider which valves lie between the atria and the ventricles."
      - "The sound comes from the valve flaps being pushed shut by rising pressure."
    diagram: null
    confidence: high
  - topic: heart_and_cardiac_cycle
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A heart beats 75 times per minute. How many seconds does one complete cardiac cycle last?"
    correct: "0.8"
    unit: "s"
    wrong: []
    explanation: "One minute is 60 seconds, so each cycle lasts 60 divided by 75, which is 0.8 seconds."
    hints:
      - "Divide the number of seconds in a minute by the number of beats in that minute."
      - "Each beat takes the same time as one cardiac cycle."
      - "Give the answer as a decimal."
    diagram: null
    confidence: high
  - topic: heart_and_cardiac_cycle
    type: mcq
    difficulty: hard
    role: apply
    stem: "During ventricular systole, which valves are open?"
    correct: "The semilunar valves, the aortic and pulmonary valves"
    unit: ""
    wrong:
      - {text: "The atrioventricular valves only", mistake: "assumes the inlet valves stay open during contraction"}
      - {text: "All of the valves at the same moment", mistake: "assumes every valve is open together"}
      - {text: "Only the valves of the right side", mistake: "assigns the valve action to one side only"}
    explanation: "During systole the pressure in the ventricles exceeds the pressure in the aorta and pulmonary trunk, so the semilunar valves open to let blood leave. The atrioventricular valves close during this phase."
    hints:
      - "Think about the valves that open to let blood leave the ventricles."
      - "Consider which valves close when the ventricle contracts."
      - "The outflow valves are on the arterial side of the heart."
    diagram: "Draw a heart in section during ventricular systole, with the aortic and pulmonary valves open and the atrioventricular valves closed, labelling each valve and the chamber in contraction."
    confidence: high
  - topic: heart_and_cardiac_cycle
    type: mcq
    difficulty: hard
    role: transfer
    stem: "The pressure in the aorta rises sharply during each heartbeat and then falls. Which event causes the rise?"
    correct: "Ejection of blood from the left ventricle during systole"
    unit: ""
    wrong:
      - {text: "Closure of the mitral valve during diastole", mistake: "assigns the aortic rise to a diastolic event"}
      - {text: "Filling of the ventricle during diastole", mistake: "assigns filling to the aortic pressure rise"}
      - {text: "Relaxation of the atria", mistake: "assigns the aortic rise to the atria"}
    explanation: "Contraction of the left ventricle pushes blood through the open aortic valve, raising aortic pressure. The pressure then falls as blood flows into the body and the valve closes."
    hints:
      - "Think about the chamber that pushes blood into the aorta."
      - "Consider the phase of the cycle when the ventricle contracts."
      - "The aorta receives blood only when the outflow valve is open."
    diagram: "Draw a left ventricle and aorta with the aortic valve open during systole, with arrows showing blood ejected and a pressure trace rising in the aorta."
    confidence: high
