    stem: "A person has a cardiac output of 6000 mL per minute and a heart rate of 75 beats per minute. What is the stroke volume in mL per beat?"
    correct: "80"
    unit: "mL"
    wrong: []
    explanation: "Stroke volume equals cardiac output divided by heart rate, which is 6000 divided by 75, giving 80 mL per beat."
    hints:
      - "Divide the output per minute by the number of beats per minute."
      - "Keep the units consistent, using millilitres throughout."
      - "Each beat ejects the same volume in this simplified case."
