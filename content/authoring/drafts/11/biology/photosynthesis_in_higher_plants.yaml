  - topic: calvin_cycle
    type: mcq
    difficulty: hard
    role: apply
    stem: "A plant grown in hot, dry conditions has high oxygen and low CO2 inside its leaves. RuBisCO then acts as an oxygenase. Which process is this linked to?"
    correct: "Photorespiration, which wastes fixed carbon and energy"
    unit: ""
    wrong:
      - {text: "Glycolysis in the stroma", mistake: "assigns a respiration pathway to the stroma"}
      - {text: "Fermentation in the thylakoid", mistake: "assigns an anaerobic process to the light membranes"}
      - {text: "Nitrogen fixation in root nodules", mistake: "confuses a nitrogen process with the oxygenase reaction"}
    explanation: "When RuBisCO adds oxygen instead of CO2, phosphoglycolate is made and recycled through photorespiration, which releases CO2 and consumes ATP without making sugar."
    hints:
      - "Think about a process that releases carbon dioxide in light and consumes energy."
      - "Consider what RuBisCO does when oxygen is the substrate instead of carbon dioxide."
      - "The process involves chloroplasts, peroxisomes and mitochondria together."
    diagram: "Draw a chloroplast, a peroxisome and a mitochondrion linked by arrows showing phosphoglycolate leaving the chloroplast and CO2 being released in the pathway."
    confidence: high
  - topic: calvin_cycle
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why does oxygenation by RuBisCO become more significant in hot, dry leaves that keep their stomata partly closed?"
    correct: "Closed stomata lower internal CO2 and raise internal O2, which favours the oxygenase reaction"
    unit: ""
    wrong:
      - {text: "Open stomata raise internal O2 and lower oxygenation", mistake: "reverses the stomatal effect on gas levels"}
      - {text: "RuBisCO becomes more selective for CO2 at high temperature", mistake: "denies that heat favours oxygenation"}
      - {text: "Water loss increases the photosynthesis rate directly", mistake: "assumes transpiration boosts carboxylation"}
    explanation: "Stomatal closure to save water reduces CO2 entry and allows O2 from photosynthesis to build up inside the leaf. High temperature also lowers the CO2 affinity of RuBisCO, so oxygenation rises."
    hints:
      - "Think about how partly closed stomata change the internal gas mix."
      - "Consider which gas RuBisCO prefers when the level of the other one is high."
      - "Ask how heat affects the affinity of the enzyme for each gas."
    diagram: "Draw a leaf cross section with a partly closed stoma, arrows showing reduced CO2 entry and built-up O2 inside, and a RuBisCO label at the chloroplast."
    confidence: medium
