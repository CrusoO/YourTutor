    type: mcq
    difficulty: easy
    role: recall
    stem: "In a C4 leaf, which cells first fix carbon dioxide?"
    correct: "Mesophyll cells"
    unit: ""
    wrong:
      - {text: "Bundle sheath cells", mistake: "reverses the two cell roles in C4 leaves"}
