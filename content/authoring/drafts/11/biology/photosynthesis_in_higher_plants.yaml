    stem: "A C4 plant and a C3 plant grow side by side in hot, dry conditions. Which outcome is most likely?"
    correct: "The C4 plant shows higher water-use efficiency and a higher photosynthesis rate"
    unit: ""
    wrong:
      - {text: "The C3 plant outperforms the C4 plant at high temperature", mistake: "reverses the advantage of the C4 pathway"}
