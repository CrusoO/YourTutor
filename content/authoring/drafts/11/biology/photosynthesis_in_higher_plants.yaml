    explanation: "Fixing 3 CO2 costs 9 ATP and 6 NADPH, giving 15 molecules in total for one G3P."
    hints:
      - "Count how many CO2 molecules are fixed per G3P produced."
      - "Each fixed CO2 consumes three ATP and two NADPH."
      - "Multiply the per-CO2 cost by the CO2 count, then add the two totals."
