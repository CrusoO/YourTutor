  - topic: light_reactions
    type: mcq
    difficulty: easy
    role: recall
    stem: "Where do the light-dependent reactions of photosynthesis take place inside a chloroplast?"
    correct: "Thylakoid membranes"
    unit: ""
    wrong:
      - {text: "Stroma", mistake: "places the light reactions in the Calvin cycle compartment"}
      - {text: "Mitochondrial matrix", mistake: "confuses photosynthesis with respiration"}
      - {text: "Cytoplasm of the cell", mistake: "places the reactions outside the chloroplast"}
    explanation: "The light-dependent reactions occur on the thylakoid membranes, which are stacked into grana. The stroma is the fluid outside these membranes, where the Calvin cycle runs."
    hints:
      - "Think about the membrane system inside the chloroplast."
      - "The stacked membranes are called grana."
      - "The fluid around the membranes is where the light-independent steps happen."
    diagram: null
    confidence: high
  - topic: light_reactions
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which gas is released as a by-product when water is split in the light reactions?"
    correct: "Oxygen"
    unit: ""
    wrong:
      - {text: "Carbon dioxide", mistake: "confuses the gas fixed in the Calvin cycle with the photolysis product"}
      - {text: "Glucose", mistake: "assumes sugars are formed in the light step"}
      - {text: "Nitrogen", mistake: "confuses the gas of the air with a photosynthesis product"}
    explanation: "Photolysis splits water into electrons, protons and oxygen. The oxygen is released to the air, and the electrons enter the electron transport chain."
    hints:
      - "Think about the gas released into the air during photosynthesis."
      - "The gas comes from the splitting of water molecules."
      - "Animals need this gas for respiration, and plants release it into the air."
    diagram: null
    confidence: high
  - topic: light_reactions
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is ATP synthesis in the light reactions called photophosphorylation?"
    correct: "Light energy drives the addition of a phosphate to ADP using a proton gradient across the thylakoid membrane"
    unit: ""
    wrong:
      - {text: "Light phosphorylates glucose directly into a sugar phosphate", mistake: "assigns phosphorylation to glucose instead of ADP"}
      - {text: "Photosynthesis releases phosphate into water", mistake: "reverses the phosphate movement"}
      - {text: "Light converts ATP back into ADP permanently", mistake: "reverses the direction of ATP synthesis"}
    explanation: "Light energy pumps protons into the thylakoid lumen, and their flow back through ATP synthase makes ATP from ADP and inorganic phosphate. Phosphorylation driven by light gives the name."
    hints:
      - "Think about what is added to ADP to form ATP."
      - "The process uses energy captured from light."
      - "Consider the gradient of protons across the thylakoid membrane."
    diagram: null
    confidence: high
  - topic: light_reactions
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which order describes electron flow in non-cyclic photophosphorylation?"
    correct: "Water to photosystem II, then photosystem I, then NADP+ to NADPH"
    unit: ""
    wrong:
      - {text: "NADP+ to photosystem I, then photosystem II, then water", mistake: "reverses the whole electron flow"}
      - {text: "Photosystem I to water, then photosystem II", mistake: "sends electrons back to water"}
      - {text: "Water directly to NADP+ without any photosystem", mistake: "removes the photosystems from the pathway"}
    explanation: "Electrons from split water enter photosystem II, pass along the transport chain to photosystem I, and finally reduce NADP+ to NADPH. Each photosystem is energised by light in turn."
    hints:
      - "Electrons come from the splitting of water."
      - "Electrons move through photosystem II before photosystem I."
      - "The final acceptor of the electrons is a carrier that becomes reduced."
    diagram: "Draw a Z-scheme with water splitting at photosystem II on the left, electrons passing through the transport chain to photosystem I, and then to NADP+ on the right, labelling each carrier."
    confidence: high
