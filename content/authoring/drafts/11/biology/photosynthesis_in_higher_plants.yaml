    explanation: "Mesophyll cells in C4 plants fix CO2 into a four-carbon acid using PEP carboxylase, and the acid is then moved to bundle sheath cells where it releases CO2 for the Calvin cycle."
    hints:
      - "Think about the cells that lie between the epidermis and the bundle sheath."
      - "These cells are the outer photosynthetic layer of the leaf."
      - "The cells that release CO2 later are deeper in the leaf."
