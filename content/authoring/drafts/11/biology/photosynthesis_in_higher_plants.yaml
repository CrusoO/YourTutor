  - topic: light_reactions
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A mutant plant cannot make NADPH but still produces ATP normally. Which process would be most directly affected?"
    correct: "Reduction of 3-phosphoglycerate in the Calvin cycle"
    unit: ""
    wrong:
      - {text: "Splitting of water in photosystem II", mistake: "assumes water splitting requires NADPH"}
      - {text: "Absorption of light by chlorophyll", mistake: "assumes light absorption depends on the reducing power"}
      - {text: "Opening of the stomata", mistake: "links guard cell movement to NADPH directly"}
    explanation: "The Calvin cycle needs both ATP and NADPH to reduce 3-phosphoglycerate, so a lack of NADPH blocks this reduction step while ATP is still supplied."
    hints:
      - "Think about which step uses both ATP and reducing power."
      - "Consider which step is run by the light reactions' products downstream."
      - "Ask which process needs NADPH but not directly the light-absorbing pigments."
    diagram: "Draw the Calvin cycle with an arrow pointing to the reduction of 3-phosphoglycerate, showing ATP and NADPH entering that step."
    confidence: medium
  - topic: calvin_cycle
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which enzyme fixes carbon dioxide onto a five-carbon sugar in the Calvin cycle?"
    correct: "RuBisCO"
    unit: ""
    wrong:
      - {text: "Pyruvate kinase", mistake: "confuses a glycolysis enzyme with the fixing enzyme"}
      - {text: "ATP synthase", mistake: "assigns the ATP-making enzyme to carbon fixation"}
      - {text: "Hexokinase", mistake: "confuses a sugar-phosphorylating enzyme with the fixing enzyme"}
    explanation: "RuBisCO catalyses the addition of CO2 to ribulose bisphosphate, the five-carbon acceptor, to start the Calvin cycle."
    hints:
      - "Think about the enzyme that adds CO2 to a five-carbon sugar."
      - "Consider the enzyme that acts on ribulose bisphosphate."
      - "This enzyme is the first step of the cycle, where carbon enters the cycle."
    diagram: null
    confidence: high
  - topic: calvin_cycle
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the first stable product of carbon fixation in C3 plants?"
    correct: "3-phosphoglycerate"
    unit: ""
    wrong:
      - {text: "Oxaloacetate", mistake: "assigns the C4 product to C3 plants"}
      - {text: "Ribulose bisphosphate", mistake: "confuses the acceptor molecule with the product"}
      - {text: "Pyruvate", mistake: "confuses fixation with glycolysis"}
    explanation: "CO2 fixed by RuBisCO forms an unstable six-carbon intermediate that splits into two molecules of 3-phosphoglycerate, a three-carbon compound. This is the origin of the name C3."
    hints:
      - "The product is a three-carbon compound with a phosphate group."
      - "Think about the molecule whose name reflects its carbon number."
      - "It is the compound that gives the C3 pathway its name."
    diagram: null
    confidence: high
  - topic: calvin_cycle
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is the Calvin cycle described as a cyclic pathway?"
    correct: "Ribulose bisphosphate is regenerated at the end of each turn so that the cycle can continue"
    unit: ""
    wrong:
      - {text: "Carbon dioxide circulates back to the air during each turn", mistake: "assumes CO2 is recycled to the atmosphere within the cycle"}
      - {text: "Oxygen is released and reabsorbed each turn", mistake: "assigns oxygen to the Calvin cycle"}
      - {text: "Glucose is recycled to form water each turn", mistake: "reverses the products of the cycle"}
    explanation: "Most of the triose phosphate is used to regenerate ribulose bisphosphate, so the starting acceptor returns and the cycle repeats. Only a fraction leaves as net product."
    hints:
      - "Think about whether the starting molecule comes back at the end of a turn."
      - "Consider which molecule is regenerated to start the next turn."
      - "Ask why the cycle would stop if the acceptor were not made again."
    diagram: null
    confidence: high
