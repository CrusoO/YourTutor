  - topic: c4_and_factors
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do C4 plants usually outperform C3 plants under high light and high temperature?"
    correct: "They concentrate CO2 around RuBisCO, which reduces photorespiration"
    unit: ""
    wrong:
      - {text: "They have no stomata and so lose no water", mistake: "denies that C4 plants have stomata"}
      - {text: "They fix nitrogen in their leaves", mistake: "assigns nitrogen fixation to the photosynthetic pathway"}
      - {text: "They photosynthesise only at night", mistake: "reverses the timing of photosynthesis"}
    explanation: "The C4 pathway pumps CO2 into bundle sheath cells, keeping its level high near RuBisCO. This suppresses oxygenation and photorespiration, which matters most in hot, bright conditions."
    hints:
      - "Think about how the C4 pathway raises CO2 levels near the Calvin enzyme."
      - "Consider the process that wastes energy when oxygen levels are high."
      - "Compare how each pathway handles oxygen near RuBisCO."
    diagram: null
    confidence: high
  - topic: c4_and_factors
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which factor is most likely to limit photosynthesis at very low light intensity?"
    correct: "Light intensity itself, since the light reactions cannot proceed without enough photons"
    unit: ""
    wrong:
      - {text: "Carbon dioxide concentration only", mistake: "assumes CO2 is the limiting factor at low light"}
      - {text: "Temperature above the optimum", mistake: "confuses limiting factors at different ranges"}
      - {text: "Oxygen concentration in the air", mistake: "assumes oxygen drives the light-limited steps"}
    explanation: "When light is scarce, the light-dependent reactions cannot supply enough ATP and NADPH, so light intensity is the bottleneck. Adding CO2 does not raise the rate much in this range."
    hints:
      - "Ask which input drives the light-dependent reactions."
      - "Think about the limiting factor when energy input is scarce."
      - "Consider which factor is the bottleneck at low energy input."
    diagram: "Draw a graph of photosynthesis rate against light intensity, with a steep initial rise that flattens at high light, and mark the light-limited region at low intensity."
    confidence: high
