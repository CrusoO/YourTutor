items:
  - topic: animal_tissues_11
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which of the four basic animal tissue types covers body surfaces and lines body cavities?"
    correct: "Epithelial tissue"
    unit: ""
    wrong:
      - {text: "Connective tissue", mistake: "confuses the surface covering with the supporting tissue"}
      - {text: "Muscular tissue", mistake: "confuses the surface layer with the contractile tissue"}
      - {text: "Nervous tissue", mistake: "confuses the lining with the signalling tissue"}
    explanation: "Epithelial tissue forms sheets of closely packed cells that cover surfaces and line cavities and ducts. It also forms glands."
    hints:
      - "Think about the tissue that makes up skin and the lining of the gut."
      - "This tissue is made of closely packed sheets of cells."
      - "The tissue is the covering layer of the body and its internal surfaces."
    diagram: null
    confidence: high
  - topic: animal_tissues_11
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which tissue binds and supports other tissues and includes blood, bone and adipose tissue?"
    correct: "Connective tissue"
    unit: ""
    wrong:
      - {text: "Epithelial tissue", mistake: "confuses the covering tissue with supporting tissues"}
      - {text: "Striated muscle", mistake: "names a contractile tissue instead of a binding one"}
      - {text: "Neuroglia", mistake: "uses a nervous-system support cell name for the whole group"}
    explanation: "Connective tissues have a matrix between cells and include blood, bone, cartilage and adipose tissue. They bind, support and protect other tissues."
    hints:
      - "The tissue has a matrix between its cells rather than tightly packed sheets."
      - "Blood and bone are members of this tissue type."
      - "Think about the tissue that binds and supports the other tissues."
    diagram: null
    confidence: high
  - topic: animal_tissues_11
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is cardiac muscle described as involuntary yet striated?"
    correct: "It has striations like skeletal muscle but its contraction is not under conscious control"
    unit: ""
    wrong:
      - {text: "It is smooth and under conscious control", mistake: "swaps the cardiac and smooth muscle properties"}
      - {text: "It has no striations and is controlled by the brain", mistake: "denies the striation of cardiac muscle"}
      - {text: "It is made of bone cells that contract", mistake: "confuses muscle with bone tissue"}
    explanation: "Cardiac muscle has striations from its organised actin and myosin, like skeletal muscle, but it contracts without conscious control and is found in the heart walls."
    hints:
      - "Think about the banded appearance under the microscope."
      - "Consider whether the heart beats under conscious control."
      - "Compare cardiac muscle with the other two muscle types you know."
    diagram: "Draw a few branched cardiac muscle cells joined end to end, showing cross-striations and the junctions between cells, labelling the striations, nucleus and junction."
    confidence: high
  - topic: animal_tissues_11
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student is sorting tissue slides and must first decide whether a slide shows a tissue that conducts electrical signals. Which tissue type should be checked?"
    correct: "Nervous tissue"
    unit: ""
    wrong:
      - {text: "Connective tissue", mistake: "assumes all tissues conduct signals"}
      - {text: "Epithelial tissue", mistake: "confuses sheets of cells with signalling cells"}
      - {text: "Adipose tissue", mistake: "confuses fat storage with signal conduction"}
    explanation: "Nervous tissue contains neurons that generate and conduct electrical impulses, along with supporting glial cells. Identifying it is the first step for a signalling question."
    hints:
      - "Look for the tissue made of cells that send long processes to carry messages."
      - "Think about the tissue that forms the brain and spinal cord."
      - "Consider which tissue is specialised for communication."
    diagram: null
    confidence: high
  - topic: animal_tissues_11
    type: mcq
    difficulty: hard
    role: apply
    stem: "A tissue lines the trachea, is made of ciliated cells, and contains goblet cells that secrete mucus. Which tissue type is this?"
    correct: "Ciliated columnar epithelium"
    unit: ""
    wrong:
      - {text: "Squamous epithelium", mistake: "ignores the ciliated and columnar features"}
      - {text: "Areolar connective tissue", mistake: "confuses a lining with a loose supporting tissue"}
      - {text: "Smooth muscle", mistake: "confuses a lining with a contractile layer"}
    explanation: "The lining of the trachea is ciliated columnar epithelium, where cilia move mucus and the goblet cells supply it. Squamous and connective tissues do not match the description."
    hints:
      - "Check the shape of the cells in the lining and whether they have hair-like projections."
      - "Consider which epithelium type lines the airways."
      - "Think about the goblet cells that release mucus."
    diagram: "Draw a section of tracheal lining with ciliated columnar cells, goblet cells and the basement membrane, labelling each."
    confidence: medium
  - topic: animal_tissues_11
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which property connects skeletal muscle, cardiac muscle and smooth muscle as a group?"
    correct: "All three types contract by actin and myosin interaction"
    unit: ""
    wrong:
      - {text: "All three are made of nerve cells", mistake: "confuses muscle cells with neurons"}
      - {text: "All three have a matrix between cells", mistake: "assigns a connective tissue feature to muscle"}
      - {text: "All three are involuntary", mistake: "assumes every muscle is under involuntary control"}
    explanation: "Every muscle type contracts by the sliding of actin and myosin filaments, although their organisation and control differ. This shared mechanism unites the group."
    hints:
      - "Think about the proteins that generate the contraction in any muscle cell."
      - "Consider what all muscle types have in common rather than how they are controlled."
      - "Compare the internal filaments rather than the places where the muscles are found."
    diagram: null
    confidence: medium
  - topic: earthworm_cockroach_frog
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which organ of an earthworm removes nitrogenous waste by a pair of tubular structures in each segment?"
    correct: "Nephridia"
    unit: ""
    wrong:
      - {text: "Malpighian tubules", mistake: "assigns the insect excretory tubules to the earthworm"}
      - {text: "Kidneys", mistake: "assumes earthworms have vertebrate kidneys"}
      - {text: "Gills", mistake: "confuses excretion with gas exchange"}
    explanation: "Earthworms excrete through paired nephridia in most segments, which filter body fluid and release waste through a nephridiopore."
    hints:
      - "Think about the paired tubular organs repeated along the body segments."
      - "These structures are excretory and not found in vertebrate kidneys."
      - "The name refers to a small tube that opens to the outside."
    diagram: "Draw one segment of an earthworm showing the paired nephridia, the nerve cord and the gut, labelling each structure."
    confidence: high
  - topic: earthworm_cockroach_frog
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which structure carries out gas exchange in an adult frog that lives in water?"
    correct: "Skin and lungs"
    unit: ""
    wrong:
      - {text: "Tracheae only", mistake: "assigns the insect respiratory system to the frog"}
      - {text: "Book lungs", mistake: "assigns arachnid structures to the frog"}
      - {text: "Gills of an adult", mistake: "assumes adult frogs keep the larval gills"}
    explanation: "Adult frogs breathe through their moist skin and their lungs, with the skin doing much of the gas exchange when the animal is in water."
    hints:
      - "Think about the moist surface of the frog's body."
      - "Consider the organs that work together with the body surface."
      - "The answer involves two respiratory surfaces, not one."
    diagram: null
    confidence: medium
  - topic: earthworm_cockroach_frog
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do cockroaches have an open circulatory system with a haemolymph rather than closed blood vessels?"
    correct: "Their body fluid bathes the tissues directly, which is typical of an open system"
    unit: ""
    wrong:
      - {text: "Their blood is carried only in a single closed tube", mistake: "describes a closed system instead"}
      - {text: "They have no tissues to supply", mistake: "denies that tissues need circulation"}
      - {text: "They use the tracheal system to move blood", mistake: "confuses gas exchange with circulation"}
    explanation: "In an open circulatory system, haemolymph flows through body cavities and bathes organs directly, which is the arrangement in cockroaches."
    hints:
      - "Think about whether the fluid travels entirely inside vessels."
      - "Consider how the fluid reaches the organs."
      - "Compare with the closed system in the earthworm."
    diagram: null
    confidence: medium
  - topic: earthworm_cockroach_frog
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student dissects a frog and must identify the organ that stores urine before it is released. Which organ is it?"
    correct: "Urinary bladder"
    unit: ""
    wrong:
      - {text: "Cloaca", mistake: "confuses the common chamber with the storage organ"}
      - {text: "Ureter", mistake: "confuses the transport tube with the storage organ"}
      - {text: "Renal pelvis", mistake: "confuses the collecting part of the kidney with a storage organ"}
    explanation: "The urinary bladder stores urine temporarily before it passes into the cloaca and out. The ureters carry urine but do not store it."
    hints:
      - "Think of the organ that holds the fluid before it is released."
      - "Consider which structures are tubes and which are reservoirs."
      - "The organ lies in the lower abdomen and is hollow."
    diagram: "Draw the urinary system of a frog showing the kidneys, ureters, urinary bladder and cloaca, labelling each part."
    confidence: high
  - topic: earthworm_cockroach_frog
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which organ system of a frog combines digestion and reproduction through a shared chamber at the end of the body?"
    correct: "Cloaca, which receives digestive, urinary and reproductive products"
    unit: ""
    wrong:
      - {text: "Pharynx, which collects gametes and food", mistake: "places the common chamber in the throat"}
      - {text: "Gall bladder, which stores gametes", mistake: "assigns a storage role for gametes to the gall bladder"}
      - {text: "Stomach, which receives urine and eggs", mistake: "sends urine and eggs to the stomach"}
    explanation: "The cloaca in frogs is a common chamber that receives the digestive, urinary and reproductive products before they leave the body, a feature shared with other vertebrates such as birds."
    hints:
      - "Look for a single chamber shared by more than one body system."
      - "Think about the end of the digestive tract, where it meets other openings."
      - "Consider which chamber takes in urine, gametes and faeces together."
    diagram: "Draw the posterior end of a frog showing the rectum, the urinary bladder and the oviduct or vas deferens meeting in the cloaca, labelling each opening."
    confidence: medium
  - topic: earthworm_cockroach_frog
    type: mcq
    difficulty: hard
    role: apply
    stem: "A cockroach has a hard exoskeleton, jointed legs and a segmented body with three pairs of legs on the thorax. What class of animals does this belong to?"
    correct: "Insecta"
    unit: ""
    wrong:
      - {text: "Arachnida", mistake: "confuses the number of pairs of legs with the arachnid body plan"}
      - {text: "Crustacea", mistake: "assigns aquatic crustaceans to a land insect"}
      - {text: "Chilopoda", mistake: "confuses the many-legged arthropods with insects"}
    explanation: "Cockroaches have three pairs of jointed legs on the thorax, a head with antennae and an exoskeleton, which places them in the class Insecta."
    hints:
      - "Count the leg pairs on the thorax and check for antennae on the head."
      - "Think about the arthropod class whose adults have three pairs of legs."
      - "Consider the class that includes most of the known arthropod species."
    diagram: null
    confidence: high
