items:
  - topic: tissues_of_plants
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which plant tissue conducts water and dissolved minerals upward from the roots?"
    correct: "Xylem"
    unit: ""
    wrong:
      - {text: "Phloem", mistake: "confuses the food-conducting tissue with the water-conducting one"}
      - {text: "Collenchyma", mistake: "names a supporting tissue instead of a conducting one"}
      - {text: "Epidermis", mistake: "confuses the outer protective layer with a conducting tissue"}
    explanation: "Xylem conducts water and minerals upward through the plant, mainly through dead, lignified vessels and tracheids. Phloem moves food in the opposite direction."
    hints:
      - "Think about the tissue that moves water from the soil to the leaves."
      - "The tissue is made of lignified vessels and tracheids."
      - "Consider which tissue conducts upward and which conducts food."
    diagram: null
    confidence: high
  - topic: tissues_of_plants
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which type of meristem is found at the tips of roots and shoots and causes increase in length?"
    correct: "Apical meristem"
    unit: ""
    wrong:
      - {text: "Lateral meristem", mistake: "confuses increase in girth with increase in length"}
      - {text: "Intercalary meristem", mistake: "confuses meristem positions in the middle of stems"}
      - {text: "Permanent tissue", mistake: "confuses dividing tissue with mature tissue"}
    explanation: "Apical meristems sit at growing tips and are responsible for primary growth, which increases the length of the root and shoot. Lateral meristems produce girth."
    hints:
      - "Look for the region right at the growing tip of a root or stem."
      - "The meristem's position is at the apex."
      - "This tissue causes primary growth, which makes the plant longer."
    diagram: null
    confidence: high
  - topic: tissues_of_plants
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are sieve tubes described as living cells with few organelles?"
    correct: "Their nucleus degenerates while companion cells keep them functioning"
    unit: ""
    wrong:
      - {text: "They have a thick lignified wall and no cytoplasm", mistake: "assigns the wall features of dead xylem to phloem"}
      - {text: "They contain large vacuoles only", mistake: "confuses the content of a mature sieve tube with a vacuole cell"}
      - {text: "They are supported by many companion cells in the root", mistake: "places companion cell support in the wrong organ"}
    explanation: "Mature sieve tube elements lose their nucleus and most organelles but stay alive in function, with help from adjacent companion cells. This allows efficient transport of food."
    hints:
      - "Think about what the sieve tube keeps and what it loses as it matures."
      - "Consider which neighbouring cells assist the sieve tube."
      - "The tissue is phloem, not xylem."
    diagram: null
    confidence: medium
  - topic: tissues_of_plants
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student is classifying a section of a stem. Which tissue system contains the epidermis, cortex and pith?"
    correct: "Ground tissue system"
    unit: ""
    wrong:
      - {text: "Vascular tissue system", mistake: "confuses the conducting system with the ground tissue"}
      - {text: "Dermal tissue system only", mistake: "treats the epidermis as the whole group"}
      - {text: "Reproductive tissue system", mistake: "confuses plant tissues with reproductive organs"}
    explanation: "The ground tissue system includes the cortex and pith, which are mostly parenchyma, while the epidermis belongs to the dermal system. The question groups the cortex and pith together."
    hints:
      - "Consider which system includes the cells between the outer skin and the conducting bundles."
      - "The epidermis alone belongs to a different system."
      - "Think about the system that is mainly made of simple, unspecialised cells."
    diagram: "Draw a stem cross section showing the outer epidermis, the cortex and pith as ground tissue, and the vascular bundles, labelling each system."
    confidence: medium
  - topic: tissues_of_plants
    type: mcq
    difficulty: hard
    role: apply
    stem: "A section shows a bundle of xylem and phloem in which xylem is closer to the centre and phloem is closer to the outside. What is this arrangement called, and in which group is it typical?"
    correct: "Radial arrangement, typical of roots of dicots"
    unit: ""
    wrong:
      - {text: "Conjoint open arrangement, typical of dicot stems", mistake: "mixes up root and stem vascular arrangements"}
      - {text: "Concentric arrangement, typical of monocot leaves", mistake: "assigns a stem arrangement to leaves"}
      - {text: "Radial arrangement, typical of monocot stems", mistake: "pairs the right name with the wrong group"}
    explanation: "In a radial vascular bundle xylem and phloem lie on different radii, as in the root, and this is typical of dicot roots. Conjoint arrangements occur in stems."
    hints:
      - "Check whether xylem and phloem sit on the same radius or on separate radii."
      - "Think about which organ usually shows this arrangement."
      - "Compare the arrangement with the stem arrangement you know."
    diagram: "Draw a root cross section with a central xylem star and phloem between its arms, labelling xylem, phloem and the pericycle."
    confidence: medium
  - topic: tissues_of_plants
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which feature makes collenchyma suited to support young growing stems?"
    correct: "Unevenly thickened cell walls that are flexible and living"
    unit: ""
    wrong:
      - {text: "Heavy lignin deposits and dead cells", mistake: "assigns sclerenchyma features to collenchyma"}
      - {text: "Air spaces between cells in every layer", mistake: "assigns aerenchyma features to collenchyma"}
      - {text: "Cells with a thin wall and no cytoplasm", mistake: "describes a dead cell type instead"}
    explanation: "Collenchyma cells are living, with thickened cellulose-pectin walls, and they give flexible support to young stems and petioles without restricting growth."
    hints:
      - "Think about support in an organ that is still growing."
      - "Compare whether the cells are alive or dead, and whether their walls are rigid or flexible."
      - "Consider which supporting tissue is living and flexible rather than rigid."
    diagram: null
    confidence: medium
  - topic: anatomy_root_stem_leaf
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which feature is typical of monocot roots rather than dicot roots?"
    correct: "A ring of many xylem and phloem bundles arranged in a fibrous pattern"
    unit: ""
    wrong:
      - {text: "A single central xylem and a secondary growth cambium", mistake: "describes a dicot root pattern"}
      - {text: "A tap root with a large central pith region", mistake: "describes a dicot root feature"}
      - {text: "Vascular bundles scattered randomly in a ground tissue of leaves", mistake: "describes a monocot stem feature"}
    explanation: "Monocot roots typically show a fibrous root system with many xylem and phloem groups arranged in a ring around a central pith. Dicot roots usually have a tap root and a few xylem arms."
    hints:
      - "Think about the root system of grasses compared with that of beans."
      - "Count the number of xylem groups, not their arrangement in the leaf."
      - "Consider whether the root is fibrous or tap-like."
    diagram: null
    confidence: medium
  - topic: anatomy_root_stem_leaf
    type: mcq
    difficulty: easy
    role: recall
    stem: "In a dicot stem, where is the cambium located?"
    correct: "Between the xylem and the phloem in the vascular bundle"
    unit: ""
    wrong:
      - {text: "Outside the epidermis", mistake: "places the cambium in the outer protective layer"}
      - {text: "At the centre of the pith", mistake: "confuses cambium with pith"}
      - {text: "Inside the xylem vessels", mistake: "places a meristem inside dead vessels"}
    explanation: "The vascular cambium sits between the xylem and phloem in dicot stems, and it produces secondary xylem inward and secondary phloem outward."
    hints:
      - "Think of the layer that sits between the two conducting tissues."
      - "Consider which tissue the cambium adds to on each side."
      - "The cambium is a thin meristematic layer in the bundle."
    diagram: null
    confidence: high
  - topic: anatomy_root_stem_leaf
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why can the internal leaf tissue of some monocots look less differentiated than that of most dicot leaves?"
    correct: "Mesophyll organisation varies among species, and some monocot leaves have a more uniform tissue"
    unit: ""
    wrong:
      - {text: "Monocots never photosynthesise in their leaves", mistake: "denies photosynthesis in monocot leaves"}
      - {text: "Monocot leaves have no stomata at all", mistake: "denies that monocot leaves have stomata"}
      - {text: "The leaves are made entirely of xylem", mistake: "confuses leaf tissues with conducting tissue"}
    explanation: "Mesophyll organisation varies among monocots, and some species show a more uniform arrangement adapted to their habitat. Monocot leaves still photosynthesise and have stomata."
    hints:
      - "Think about whether monocot leaves still carry out photosynthesis."
      - "Consider how the internal leaf tissues differ among species, not only between two groups."
      - "Ask what the mesophyll is for, and whether all leaves need the same layers."
    diagram: null
    confidence: low
  - topic: anatomy_root_stem_leaf
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student compares a dicot stem and a monocot stem in cross section. Which feature should be checked first to decide which type it is?"
    correct: "The arrangement of vascular bundles, whether in a ring or scattered"
    unit: ""
    wrong:
      - {text: "The colour of the stem", mistake: "uses colour, which varies within every group"}
      - {text: "The length of the stem", mistake: "uses size, which is not an anatomical feature"}
      - {text: "The number of flowers on the stem", mistake: "uses reproductive output rather than anatomy"}
    explanation: "Dicot stems usually show vascular bundles in a ring, while monocot stems show scattered bundles. This arrangement is a reliable first check for the two groups."
    hints:
      - "Look at the cross section, not the length or colour."
      - "Think about whether the bundles form a ring or are scattered through the tissue."
      - "Consider which anatomical feature separates the two groups most directly."
    diagram: "Draw two small stem cross sections side by side, one with vascular bundles in a ring and one with scattered bundles, labelling the bundles and the ground tissue."
    confidence: high
  - topic: anatomy_root_stem_leaf
    type: mcq
    difficulty: hard
    role: apply
    stem: "A monocot stem has scattered vascular bundles and no ring of cambium. Which statement about its growth in girth is most accurate?"
    correct: "It generally does not undergo normal secondary growth, so its girth increases little"
    unit: ""
    wrong:
      - {text: "It grows in girth rapidly through a continuous cambium ring", mistake: "assigns dicot cambium behaviour to monocots"}
      - {text: "Its girth increases only by lateral branching", mistake: "confuses branching with girth"}
      - {text: "It increases girth using a cork cambium in the pith", mistake: "places cork cambium in the pith"}
    explanation: "Most monocot stems lack a vascular cambium in their bundles, so they do not produce the extra secondary xylem and phloem that thicken dicot stems. Their girth changes little after primary growth."
    hints:
      - "Ask whether the bundles contain a cambium that can divide."
      - "Think about how dicot stems add tissue each year."
      - "Compare the cambium presence in the two groups."
    diagram: null
    confidence: medium
  - topic: anatomy_root_stem_leaf
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A dicot root and a dicot stem are compared after many years of growth. Which difference is most likely?"
    correct: "The root and stem both thicken through a cambium, but their vascular arrangements differ"
    unit: ""
    wrong:
      - {text: "Only the stem thickens and the root never does", mistake: "assumes roots never thicken in dicots"}
      - {text: "Both lose all their xylem and phloem", mistake: "assumes the conducting tissue disappears"}
      - {text: "The root has stomata in its outer layer like a leaf", mistake: "gives the root a leaf feature"}
    explanation: "Dicot roots and stems both undergo secondary growth through a vascular cambium, but the root has a radial arrangement and the stem has a conjoint one. Both organs thicken."
    hints:
      - "Consider whether the root also has a cambium that adds tissue."
      - "Compare the arrangement of xylem and phloem in the two organs."
      - "Think about which feature reflects the organ's function rather than its growth."
    diagram: "Draw a dicot root and a dicot stem in cross section, both with a cambium ring, labelling the xylem, phloem and cambium in each."
    confidence: medium
  - topic: secondary_growth
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the name of the lateral meristem that produces cork cells in a woody stem?"
    correct: "Cork cambium"
    unit: ""
    wrong:
      - {text: "Vascular cambium", mistake: "confuses the inner lateral meristem with the outer one"}
      - {text: "Apical meristem", mistake: "confuses lateral growth with tip growth"}
      - {text: "Intercalary meristem", mistake: "places the cork-forming tissue in the middle of stems"}
    explanation: "Cork cambium, also called phellogen, produces the protective outer bark and cork. The vascular cambium produces secondary xylem and phloem."
    hints:
      - "Think of the meristem that forms the outer protective layer of the stem."
      - "Consider which lateral meristem is outside the vascular cambium."
      - "The tissue it produces is cork, which makes bark."
    diagram: null
    confidence: high
  - topic: secondary_growth
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which tissue is produced by the vascular cambium on its inner side?"
    correct: "Secondary xylem"
    unit: ""
    wrong:
      - {text: "Secondary phloem", mistake: "assigns the outward tissue to the inward side"}
      - {text: "Cork", mistake: "confuses the vascular cambium with the cork cambium"}
      - {text: "Primary phloem", mistake: "confuses secondary growth with primary tissue"}
    explanation: "The vascular cambium adds secondary xylem to the inside, which is the wood of the stem, and secondary phloem to the outside."
    hints:
      - "Think about which tissue forms the wood of a tree trunk."
      - "Consider the side of the cambium that faces the pith."
      - "The inward product is the water-conducting tissue of the wood."
    diagram: null
    confidence: high
  - topic: secondary_growth
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do annual rings form in the wood of trees in temperate regions?"
    correct: "Seasonal changes produce wide spring xylem and narrow autumn xylem in each year"
    unit: ""
    wrong:
      - {text: "Rings form because the tree sheds one layer of bark each year", mistake: "confuses bark shedding with wood formation"}
      - {text: "The cambium stops working entirely in winter and restarts from the pith", mistake: "assigns restart from the pith to the cambium"}
      - {text: "Rings are caused by the number of leaves that fall each year", mistake: "links leaf loss directly to ring formation"}
    explanation: "Spring xylem has wide vessels with a fast rate of growth, while late-season xylem is denser and narrower. Together these bands form one annual ring."
    hints:
      - "Think about how growth rate changes over the seasons."
      - "Consider the density and width of the wood formed in different seasons."
      - "The pattern of wood layers reflects a yearly cycle."
    diagram: null
    confidence: medium
  - topic: secondary_growth
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student wants to estimate the age of a tree from a stem cross section. Which feature should be counted?"
    correct: "The number of annual rings in the secondary xylem"
    unit: ""
    wrong:
      - {text: "The number of leaves on the branches", mistake: "counts a feature that changes with the season"}
      - {text: "The number of flowers produced", mistake: "counts reproductive output rather than growth layers"}
      - {text: "The number of bark layers that have been shed", mistake: "counts a loss rather than a record"}
    explanation: "Each year the vascular cambium adds one ring of secondary xylem, so counting the rings gives an estimate of the tree's age in years."
    hints:
      - "Look for the bands of wood in the cross section."
      - "Think about which layer records the yearly growth cycle."
      - "Consider which feature accumulates once each year without being lost."
    diagram: "Draw a trunk cross section with the pith at the centre, annual rings of secondary xylem, the cambium, phloem and bark, labelling each layer."
    confidence: high
  - topic: secondary_growth
    type: mcq
    difficulty: hard
    role: apply
    stem: "A dicot stem has 14 annual rings in its secondary xylem, and the bark has recently been shed. What is the best estimate of the tree's age?"
    correct: "At least 14 years"
    unit: ""
    wrong:
      - {text: "Exactly 7 years", mistake: "halves the ring count arbitrarily"}
      - {text: "About 28 years", mistake: "doubles the ring count by mistake"}
      - {text: "Younger than 1 year", mistake: "treats the number of rings as a count of days"}
    explanation: "Each ring represents one year of growth, so 14 rings suggest at least 14 years. Shed bark does not remove the record in the wood, but the innermost rings may be damaged, which is why the answer is a minimum."
    hints:
      - "Think about what one annual ring represents."
      - "Ask whether the shed bark removes the rings from the wood."
      - "Consider why the wood rings might underestimate the true age."
    diagram: null
    confidence: medium
  - topic: secondary_growth
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why does secondary growth not occur in most monocots, while it is common in dicots?"
    correct: "Monocots generally lack a vascular cambium in their stems, so they cannot add a ring of secondary tissue"
    unit: ""
    wrong:
      - {text: "Monocots have too many stomata for secondary growth", mistake: "links stomata with the cambium"}
      - {text: "Monocots have only dead cells in their stems", mistake: "assumes every monocot stem tissue is dead"}
      - {text: "Monocots flower too early to grow thicker", mistake: "links flowering time with growth in girth"}
    explanation: "Most monocots lack the vascular cambium that drives secondary growth in dicots. Some monocot groups, such as palms, grow in girth by a different pattern, but the typical stem does not add secondary xylem."
    hints:
      - "Think about which meristem drives the thickening in dicots."
      - "Ask whether monocots have that same meristem in their bundles."
      - "Consider the difference in cambium presence between the two groups."
    diagram: null
    confidence: medium
