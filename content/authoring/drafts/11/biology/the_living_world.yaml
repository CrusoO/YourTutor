items:
  - topic: characteristics_of_living
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which life process lets a living thing keep its internal conditions steady even when the outside environment changes?"
    correct: "Homeostasis"
    unit: ""
    wrong:
      - {text: "Crystallisation", mistake: "confuses an ordered physical arrangement with a regulated internal state"}
      - {text: "Erosion", mistake: "treats the wearing away of rock as a life process"}
      - {text: "Fossilisation", mistake: "thinks preserved remains show current life processes"}
    explanation: "Living organisms regulate temperature, pH and water content so that their cells work within a narrow range. This regulated balance is called homeostasis."
    hints:
      - "Think about a body keeping its temperature steady on a cold morning."
      - "Look for one word that names a steady internal balance."
      - "The process is one that every cell-based body needs in order to keep working."
    diagram: null
    confidence: high
  - topic: characteristics_of_living
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which process ensures that a species continues from one generation to the next?"
    correct: "Reproduction"
    unit: ""
    wrong:
      - {text: "Excretion", mistake: "confuses removing wastes with producing offspring"}
      - {text: "Absorption", mistake: "treats taking in water as the defining process for a species"}
      - {text: "Dormancy", mistake: "treats a resting stage as a way of passing on the species"}
    explanation: "A species persists only if its members produce offspring. Reproduction, whether sexual or asexual, passes genetic information forward."
    hints:
      - "Think about how a new individual comes from an existing one."
      - "Consider the process that produces the next generation."
      - "The process starts with a parent and ends with offspring."
    diagram: null
    confidence: high
  - topic: characteristics_of_living
    type: mcq
    difficulty: medium
    role: explain
    stem: "A potted plant bends its stem toward a window over several days. Which characteristic of living things does this best illustrate?"
    correct: "Response to environmental change"
    unit: ""
    wrong:
      - {text: "Excretion of waste gases", mistake: "links a visible bending to gas removal"}
      - {text: "Cell division in the root tip", mistake: "confuses a growth process with the response"}
      - {text: "Fermentation in the stem", mistake: "assumes anaerobic energy release causes bending"}
    explanation: "Plants detect the direction of light and redirect their growth, so the bending is a response. Responding to surroundings is one of the defining features of life."
    hints:
      - "Look for a change in the organism triggered by light coming from one side."
      - "Think about what the organism does when its surroundings shift."
      - "The trait name describes a reaction to whatever happens outside the body."
    diagram: null
    confidence: high
  - topic: characteristics_of_living
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which statement correctly contrasts growth with development in an organism?"
    correct: "Growth is an increase in size and mass, while development covers the changes in form and complexity that follow"
    unit: ""
    wrong:
      - {text: "Development is an increase in size, while growth is a change in shape", mistake: "swaps the two terms"}
      - {text: "Growth and development are the same process observed at different times", mistake: "assumes the two are identical"}
      - {text: "Development occurs only in animals, while growth occurs only in plants", mistake: "limits each process to one kingdom"}
    explanation: "Growth is a quantitative increase in size, while development is the progressive change in organisation and form. Both happen throughout the life of many organisms."
    hints:
      - "Separate the idea of getting bigger from the idea of becoming more complex."
      - "Ask which word refers to quantity and which refers to organisation."
      - "Check which process describes the body taking on a more elaborate design over time."
    diagram: null
    confidence: high
  - topic: characteristics_of_living
    type: mcq
    difficulty: hard
    role: apply
    stem: "A newly found organism must be checked for signs of life. Which set of tests would be most informative?"
    correct: "Look for cell-based organisation, energy use, and the ability to reproduce and respond"
    unit: ""
    wrong:
      - {text: "Measure colour, size and surface shape", mistake: "relies on appearance rather than function"}
      - {text: "Check for a hard outer shell and the ability to move", mistake: "treats movement alone as proof of life"}
      - {text: "Test whether it glows and whether it has a fixed weight", mistake: "uses unrelated physical traits"}
    explanation: "Life is recognised by a combination of organisation, metabolism, reproduction and response, not by looks. The correct set checks each of these functions."
    hints:
      - "Focus on what a cell-based body must do to stay alive and continue."
      - "Ignore looks and ask about function."
      - "The right choice covers the features that every known living group shares."
    diagram: null
    confidence: medium
  - topic: characteristics_of_living
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A student claims that a growing salt crystal is alive because it enlarges and repairs chipped edges. Which reply is most accurate?"
    correct: "Its growth comes from physical deposition, not from cell-based metabolism, so it is not alive"
    unit: ""
    wrong:
      - {text: "Repair proves life, so the crystal is alive", mistake: "treats repair as the defining feature"}
      - {text: "Crystals split to reproduce, so they meet the test", mistake: "counts simple splitting as reproduction"}
      - {text: "A crystal responds to heat, so it must be alive", mistake: "treats any response as evidence of life"}
    explanation: "Crystal growth is a physical and chemical deposition process with no cells and no internal energy metabolism. Growth or repair alone does not make an object alive."
    hints:
      - "Ask whether the enlargement uses energy processed inside cells."
      - "Compare the crystal's behaviour with the living features you know, one by one."
      - "Check whether a non-living process could also produce the same change."
    diagram: null
    confidence: medium
  - topic: taxonomy_and_nomenclature
    type: mcq
    difficulty: easy
    role: recall
    stem: "In binomial nomenclature, which two levels form the scientific name of a species?"
    correct: "Genus and species"
    unit: ""
    wrong:
      - {text: "Family and order", mistake: "uses higher ranks of the hierarchy"}
      - {text: "Kingdom and phylum", mistake: "confuses the two top-level ranks"}
      - {text: "Class and species", mistake: "mixes a higher rank with the lowest level"}
    explanation: "A scientific name is made of a genus name followed by a species epithet, so the two lowest ranks give the name. The genus is the broader of the two."
    hints:
      - "The two parts are the two words written in every scientific name."
      - "They are the lowest and the second lowest ranks in the hierarchy."
      - "One part is named first, and the other is the specific epithet that follows it."
    diagram: null
    confidence: high
  - topic: taxonomy_and_nomenclature
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which convention is correct for a scientific name written by hand?"
    correct: "Genus with a capital first letter, species in lower case, and the whole name underlined or italic"
    unit: ""
    wrong:
      - {text: "Both words with a capital first letter", mistake: "applies title case to every word"}
      - {text: "Genus in lower case and species with a capital first letter", mistake: "reverses the convention"}
      - {text: "Both words in lower case with no underline", mistake: "ignores the capital letter rule for the genus"}
    explanation: "A binomial name uses a capitalised genus, a lower-case species epithet, and it is underlined or italicised to show it is a scientific name."
    hints:
      - "Think about how the first word differs from the second word in the name."
      - "Consider which word names a broader group."
      - "Marking the name as scientific is done with a line or a slant, and only one word gets a big first letter."
    diagram: null
    confidence: high
  - topic: taxonomy_and_nomenclature
    type: mcq
    difficulty: medium
    role: explain
    stem: "Two organisms share the same genus but differ in species. What does this tell us about them?"
    correct: "They are closely related but distinct kinds of organism"
    unit: ""
    wrong:
      - {text: "They belong to entirely different families", mistake: "reads the genus as a higher rank than it is"}
      - {text: "They are identical in every trait", mistake: "assumes the same genus means the same species"}
      - {text: "They must share the same order and class but nothing else", mistake: "treats the genus as the highest shared rank"}
    explanation: "Organisms in one genus are closely related, but the species epithet shows they are separate kinds. Shared genus does not mean shared species or identical traits."
    hints:
      - "Consider how much of the hierarchy the two organisms share."
      - "Think about which rank is the last one before species."
      - "Ask how the second part of the name would change if they were the same kind."
    diagram: null
    confidence: high
  - topic: taxonomy_and_nomenclature
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which order of ranks is correct when moving from the broadest group down to the most specific one?"
    correct: "Kingdom, phylum, class, order, family, genus, species"
    unit: ""
    wrong:
      - {text: "Kingdom, class, phylum, order, genus, family, species", mistake: "shuffles the middle ranks"}
      - {text: "Phylum, kingdom, order, class, family, species, genus", mistake: "scrambles the top ranks"}
      - {text: "Kingdom, order, class, phylum, family, genus, species", mistake: "places order above class and phylum"}
    explanation: "The taxonomic hierarchy narrows from kingdom to species, and each step groups fewer and more similar organisms. The standard sequence has seven main ranks in this order."
    hints:
      - "Start at the broadest rank, which contains all the others."
      - "Check that each step narrows the group further than the step before."
      - "Use a memory phrase built from the first letters of each rank, and test it against the order you know."
    diagram: null
    confidence: high
  - topic: taxonomy_and_nomenclature
    type: mcq
    difficulty: hard
    role: apply
    stem: "A student places a shark and a dolphin in the same class only because both have fins used for swimming. Which error best describes this reasoning?"
    correct: "Using one superficial trait instead of shared fundamental features"
    unit: ""
    wrong:
      - {text: "Placing them in different kingdoms", mistake: "overcorrects by splitting groups that share a kingdom"}
      - {text: "Naming them with a single word", mistake: "misreads the rule for binomial names"}
      - {text: "Ignoring the genus when naming them", mistake: "treats the genus as optional for classification"}
    explanation: "Fins are a similar-looking adaptation for swimming, and similar appearance can arise independently. Classification should rest on deeper features such as body plan, development and ancestry."
    hints:
      - "Ask whether the shared feature reflects common ancestry or only looks similar."
      - "Think about which features a classifier must weigh more heavily than appearance."
      - "Consider whether the error is about the features chosen or about the rank chosen."
    diagram: null
    confidence: medium
  - topic: taxonomy_and_nomenclature
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A researcher labels an organism only with its genus and a number, such as Genus 3. Why does this fail as a scientific name?"
    correct: "It lacks the species epithet that identifies one kind within the genus"
    unit: ""
    wrong:
      - {text: "Genus names may never be used on their own", mistake: "invents a rule that does not exist"}
      - {text: "It uses too few letters to be read", mistake: "measures length rather than structure"}
      - {text: "Numbers are never allowed in any scientific name", mistake: "overgeneralises a formatting rule"}
    explanation: "A binomial name needs both the genus and a species epithet. Without the epithet the label does not pick out one kind of organism."
    hints:
      - "Ask what the second word in a binomial name does for identification."
      - "Think about how many organisms could share the first part alone."
      - "Compare the label with a complete two-part name, and note what is missing."
    diagram: null
    confidence: medium
  - topic: taxonomic_tools
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is a taxonomic key mainly used for?"
    correct: "Identifying an unknown organism through a sequence of paired choices"
    unit: ""
    wrong:
      - {text: "Measuring the growth rate of a population", mistake: "confuses identification tools with ecological measurements"}
      - {text: "Storing preserved specimens in a drawer", mistake: "treats storage methods as identification"}
      - {text: "Recording the genetic code of a cell", mistake: "mixes identification with sequencing"}
    explanation: "A taxonomic key presents pairs of contrasting statements, and each choice leads to the next pair until the organism is named. It is a tool for identification."
    hints:
      - "Think about a series of yes or no questions that narrow down the possibilities."
      - "The tool leads you to a name step by step."
      - "Each pair of statements splits the candidates into two groups."
    diagram: null
    confidence: high
  - topic: taxonomic_tools
    type: mcq
    difficulty: easy
    role: recall
    stem: "In a dichotomous key, what does each numbered step present?"
    correct: "A pair of contrasting descriptions"
    unit: ""
    wrong:
      - {text: "A single drawing of the organism", mistake: "expects an image instead of a choice"}
      - {text: "A complete list of all known species", mistake: "confuses the key with a catalogue"}
      - {text: "A measurement given in millimetres", mistake: "thinks every step needs a number"}
    explanation: "Each numbered step in a dichotomous key gives two contrasting descriptions, and the user picks the one that matches the specimen. The chosen option points to the next step or to a name."
    hints:
      - "Dichotomous means splitting into two parts."
      - "Focus on how many options appear before you move to the next number."
      - "Think about what a choice between two alternatives looks like in a printed tool."
    diagram: null
    confidence: high
  - topic: taxonomic_tools
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does a key use paired statements that are mutually exclusive?"
    correct: "So that each organism fits only one branch at each step"
    unit: ""
    wrong:
      - {text: "So that the key can be printed in two colours", mistake: "assumes the design of the key is about colour"}
      - {text: "So that the organism can be measured twice", mistake: "confuses the logic of the key with repeated measurement"}
      - {text: "So that every step leads to the same name", mistake: "assumes the key gives one answer no matter what"}
    explanation: "If both statements in a pair could match one organism, the path would split ambiguously. Mutually exclusive pairs keep the route through the key clear and unique."
    hints:
      - "Imagine two statements that could both be true for one animal."
      - "Think about how a clear choice helps you move forward cleanly."
      - "The answer relates to avoiding ambiguity in the path."
    diagram: null
    confidence: high
  - topic: taxonomic_tools
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which action is the right first step when using a key on an unknown plant?"
    correct: "Read the first pair of statements and choose the one that matches the plant"
    unit: ""
    wrong:
      - {text: "Guess the family from the flower colour alone", mistake: "skips the key and relies on a single trait"}
      - {text: "Skip the key and search for a picture online", mistake: "abandons the method the key provides"}
      - {text: "Read the last step to find the final name", mistake: "reverses the direction of the key"}
    explanation: "A key is always followed from the first step onward, each decision narrowing the path. Starting at the first pair is what keeps the identification systematic."
    hints:
      - "Keys always begin at the top of the list."
      - "Compare the plant with the first option before reading further."
      - "Do not jump to the end, because the path is built one decision at a time."
    diagram: null
    confidence: high
  - topic: taxonomic_tools
    type: mcq
    difficulty: hard
    role: apply
    stem: "A key's first pair contrasts leaves present with leaves absent. A specimen has tiny scale-like leaves on its stem. Which choice is most appropriate?"
    correct: "Follow the leaves present branch and examine the scale-like leaves in the next pair"
    unit: ""
    wrong:
      - {text: "Follow the leaves absent branch because scales are not leaves", mistake: "assumes scale-like leaves are never counted as leaves"}
      - {text: "Stop the key because the specimen fits no choice", mistake: "gives up instead of reading the next level"}
      - {text: "Choose the branch that matches the specimen's colour", mistake: "uses a trait the key does not ask about"}
    explanation: "Keys are built so every specimen reaches a branch, and scale-like leaves count as leaves for the purposes of the key. The next pair then refines the identification."
    hints:
      - "Ask whether the tiny structures count as leaves for this key's purpose."
      - "Keys are designed so that every specimen reaches one branch."
      - "Use the next pair to refine your choice rather than abandoning the path."
    diagram: null
    confidence: medium
  - topic: taxonomic_tools
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Two different keys for the same group give different final names for one organism. What is the most likely explanation?"
    correct: "One key uses an older or different classification, so the names do not match"
    unit: ""
    wrong:
      - {text: "The organism changed its name during the observation", mistake: "treats names as changing during life"}
      - {text: "Keys give random results every time they are used", mistake: "assumes keys are unreliable by design"}
      - {text: "The organism has two genera inside its body", mistake: "confuses genus with anatomy"}
    explanation: "Keys reflect the classification system they were built on, and a name can differ between systems or editions. The disagreement lies in the tools rather than in the specimen."
    hints:
      - "Consider whether both tools rely on the same current system of names."
      - "Think about the source and date behind each key."
      - "Ask whether the disagreement lies in the tools or in the specimen itself."
    diagram: null
    confidence: medium
