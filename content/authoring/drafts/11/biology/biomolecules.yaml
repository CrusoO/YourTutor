    confidence: high
  - topic: carbohydrates_and_proteins
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the bond that links amino acids together in a polypeptide chain?"
    correct: "Peptide bond"
    unit: ""
    wrong:
      - {text: "Glycosidic bond", mistake: "uses the bond between sugar units"}
      - {text: "Phosphodiester bond", mistake: "uses the bond of nucleic acid backbones"}
      - {text: "Hydrogen bond only", mistake: "treats a weak interaction as the covalent link"}
    explanation: "Amino acids are joined by peptide bonds formed through a condensation reaction that releases water. Glycosidic bonds join sugars, and phosphodiester bonds join nucleotides."
    hints:
      - "Think about the covalent link formed between the amino group of one residue and the carboxyl group of the next."
      - "Consider which bond is named after the amino acid chain."
      - "The bond forms by losing one molecule of water."
    diagram: null
    confidence: high
  - topic: carbohydrates_and_proteins
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do most proteins lose their function when they are heated beyond a certain temperature?"
    correct: "Heat disrupts the weak bonds that maintain their three-dimensional shape, a process called denaturation"
    unit: ""
    wrong:
      - {text: "Heat breaks the peptide bonds of the primary structure", mistake: "assumes heat breaks the backbone bonds first"}
      - {text: "Heat converts proteins into carbohydrates", mistake: "assigns a chemical conversion to heating"}
      - {text: "Heat adds extra amino acids to the chain", mistake: "assumes heating synthesises new residues"}
    explanation: "Denaturation unfolds a protein by disrupting hydrogen bonds, ionic bonds and hydrophobic interactions, which changes its shape and usually its function. The peptide backbone is often intact."
    hints:
      - "Think about which bonds hold the folded shape rather than the chain backbone."
      - "Consider whether heating changes the sequence of residues."
      - "Ask what happens to the folding when weak interactions are disturbed."
    diagram: null
    confidence: high
  - topic: carbohydrates_and_proteins
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student is asked to identify the level of protein structure that describes the sequence of amino acids. Which level is correct?"
    correct: "Primary structure"
    unit: ""
    wrong:
      - {text: "Secondary structure", mistake: "confuses local folding patterns with the sequence"}
      - {text: "Tertiary structure", mistake: "confuses overall folding with the sequence"}
      - {text: "Quaternary structure", mistake: "confuses multi-chain assembly with the sequence"}
    explanation: "The primary structure of a protein is the linear sequence of amino acids joined by peptide bonds. Secondary, tertiary and quaternary levels arise from folding and assembly."
    hints:
      - "Start with the level that is simply the order of the building blocks."
      - "Think about which level has no folding information at all."
      - "Consider which level is the first and most basic."
    diagram: null
    confidence: high
  - topic: carbohydrates_and_proteins
    type: numeric
    difficulty: hard
    role: apply
    stem: "A polypeptide chain is made of 5 amino acids joined end to end. How many peptide bonds does the chain contain?"
    correct: "4"
    unit: ""
    wrong: []
    explanation: "Each peptide bond joins two adjacent amino acids, so a linear chain of five residues has one fewer bond than residues, which gives four peptide bonds."
    hints:
      - "Consider how many pairs of neighbouring residues exist in a line of residues."
      - "Compare the number of residues with the number of links between them."
      - "A chain of residues has one link fewer than the number of residues."
    diagram: null
    confidence: high
  - topic: carbohydrates_and_proteins
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A researcher finds that two proteins with the same primary sequence fold differently in different cells. What is the most likely explanation?"
    correct: "Differences in the surrounding environment or post-translational modifications change how the chain folds"
    unit: ""
    wrong:
      - {text: "The two proteins have different primary sequences after all", mistake: "contradicts the premise of the question"}
      - {text: "Primary structure is always determined by the cell type", mistake: "assigns sequence control to the cell type"}
      - {text: "Folding is unrelated to the protein's function", mistake: "denies the link between shape and function"}
    explanation: "Protein folding depends on the environment and on chemical modifications such as glycosylation or phosphorylation, which can change the final shape even when the primary sequence is identical."
    hints:
      - "Ask which factors other than the sequence can influence the final shape."
      - "Consider whether the premise of the question has been met."
      - "Think about how chemical changes after synthesis can alter folding."
    diagram: null
    confidence: medium
  - topic: lipids_nucleic_acids
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which sugar is present in the backbone of DNA?"
    correct: "Deoxyribose"
    unit: ""
    wrong:
      - {text: "Ribose", mistake: "assigns the RNA sugar to DNA"}
      - {text: "Glucose", mistake: "assigns a free sugar to the nucleic acid backbone"}
      - {text: "Fructose", mistake: "assigns a fruit sugar to the backbone"}
    explanation: "DNA contains deoxyribose, which lacks an oxygen atom at the 2' position compared with ribose. RNA contains ribose instead."
    hints:
      - "Compare the sugar in DNA with the sugar in RNA."
      - "Think about the sugar that is missing one oxygen compared with ribose."
      - "The name of the sugar begins with a word for a missing component."
    diagram: null
    confidence: high
  - topic: lipids_nucleic_acids
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which nitrogenous base is found in RNA but not in DNA?"
    correct: "Uracil"
    unit: ""
    wrong:
      - {text: "Thymine", mistake: "assigns the DNA-specific base to RNA"}
      - {text: "Adenine", mistake: "assumes adenine is missing from RNA"}
      - {text: "Cytosine", mistake: "assumes cytosine is specific to RNA"}
    explanation: "RNA uses uracil in place of thymine. Adenine, guanine and cytosine are present in both DNA and RNA."
    hints:
      - "Compare the bases of RNA with those of DNA."
      - "Think about the base that replaces thymine in RNA."
      - "The base is a pyrimidine that pairs with adenine."
    diagram: null
    confidence: high
  - topic: lipids_nucleic_acids
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are phospholipids amphipathic, and why does this matter in membranes?"
    correct: "They have a hydrophilic head and hydrophobic tails, so they form bilayers in water"
    unit: ""
    wrong:
      - {text: "They are entirely hydrophobic, so they float on water", mistake: "ignores the polar head"}
      - {text: "They are entirely hydrophilic, so they dissolve in any solvent", mistake: "ignores the nonpolar tails"}
      - {text: "They are charged positively throughout, so they repel water", mistake: "assigns a uniform charge to the whole molecule"}
    explanation: "A phospholipid has a polar head that interacts with water and two nonpolar fatty acid tails that avoid it. This dual nature causes them to arrange into bilayers in aqueous environments."
    hints:
      - "Think about the two different regions of one phospholipid molecule."
      - "Consider which parts interact with water and which avoid it."
      - "Ask how the two regions arrange themselves in water."
    diagram: null
    confidence: high
  - topic: lipids_nucleic_acids
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student compares the base pairing in DNA. Which pairing is correct?"
    correct: "Adenine with thymine, and guanine with cytosine"
    unit: ""
    wrong:
      - {text: "Adenine with guanine, and thymine with cytosine", mistake: "pairs purines with purines"}
      - {text: "Adenine with cytosine, and guanine with thymine", mistake: "mixes up the pairing partners"}
      - {text: "Adenine with uracil, and guanine with cytosine", mistake: "uses the RNA base in DNA"}
    explanation: "In DNA, adenine pairs with thymine through two hydrogen bonds and guanine pairs with cytosine through three. This complementarity keeps the double helix regular."
    hints:
      - "Each purine pairs with exactly one pyrimidine."
      - "Adenine pairs with the base that has a similar structure in the other strand."
      - "Check which pairs form two hydrogen bonds and which form three."
    diagram: "Draw a short segment of the DNA double helix as a ladder, labelling the base pairs, the sugar-phosphate backbone and the hydrogen bonds between pairs."
    confidence: high
  - topic: lipids_nucleic_acids
    type: mcq
    difficulty: hard
    role: apply
    stem: "A DNA strand has the base sequence AATTGC. What is the sequence of its complementary strand, read in the same direction?"
    correct: "TTAACG"
    unit: ""
    wrong:
      - {text: "GCAATT", mistake: "copies the strand instead of pairing its bases"}
      - {text: "TTGGCA", mistake: "pairs adenine with guanine"}
      - {text: "AAUUGC", mistake: "uses uracil in a DNA complement"}
    explanation: "Each base pairs with its partner: A with T, T with A, G with C, C with G. Pairing the sequence AATTGC gives TTAACG when read in the same direction, though the strands run antiparallel."
    hints:
      - "Replace each base with its partner from the list of pairing rules."
      - "Pair the bases one by one, starting with the first letter."
      - "Remember that the two strands run in opposite directions, so read the complement carefully."
    diagram: "Write the two antiparallel strands as horizontal rows with pairing lines between matching bases, labelling the 5 prime and 3 prime ends of each strand."
    confidence: medium
  - topic: lipids_nucleic_acids
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A lipid molecule is found in which the fatty acid tails are fully saturated. Which property does this most likely produce in the lipid?"
    correct: "A higher melting point, so the lipid is more likely to be solid at room temperature"
    unit: ""
    wrong:
      - {text: "A lower melting point, so the lipid is liquid at room temperature", mistake: "reverses the effect of saturation"}
      - {text: "A solubility in water higher than that of unsaturated fats", mistake: "assumes saturation increases water solubility"}
      - {text: "A loss of the glycerol backbone", mistake: "links saturation with backbone loss"}
    explanation: "Saturated fatty acid tails pack tightly because they lack double bonds, which raises the melting point. Unsaturated tails bend and pack less tightly, so they are often liquid."
    hints:
      - "Think about whether the tails can pack closely together."
      - "Consider what a double bond does to the shape of a fatty acid."
      - "Compare how well saturated and unsaturated tails stack against each other."
    diagram: null
    confidence: medium
  - topic: enzymes
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the part of an enzyme where the substrate binds called?"
    correct: "Active site"
    unit: ""
    wrong:
      - {text: "Allosteric site", mistake: "confuses the regulatory site with the catalytic site"}
      - {text: "Cofactor pocket", mistake: "confuses a helper molecule with the binding region"}
      - {text: "Peptide bond", mistake: "uses a chemical bond name for a region"}
    explanation: "The active site is a region of the enzyme with a shape and chemical environment that fit the substrate. Binding there forms the enzyme-substrate complex."
    hints:
      - "Think about the pocket on the enzyme where the reactant fits."
      - "The site has a shape complementary to the substrate."
      - "Consider the site where catalysis happens, not the site where regulators bind."
    diagram: null
    confidence: high
  - topic: enzymes
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which statement correctly describes how a catalyst affects a chemical reaction?"
    correct: "It lowers the activation energy so the reaction proceeds faster"
    unit: ""
    wrong:
      - {text: "It is consumed in the reaction and must be replenished", mistake: "assumes enzymes are used up"}
      - {text: "It changes the equilibrium position of the reaction", mistake: "assumes catalysts shift equilibrium"}
      - {text: "It adds energy to the reactants", mistake: "assumes catalysts supply energy"}
    explanation: "An enzyme catalyst lowers the activation energy of a reaction without being used up, so the reaction proceeds faster. It does not change the position of the equilibrium."
    hints:
      - "Think about the energy barrier that reactants must cross."
      - "Consider whether the catalyst is consumed in the reaction."
      - "Ask whether a catalyst changes the end result or only the rate."
    diagram: null
    confidence: high
  - topic: enzymes
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does an enzyme-catalysed reaction slow down at very high temperatures?"
    correct: "The enzyme denatures, changing the shape of the active site"
    unit: ""
    wrong:
      - {text: "The substrate becomes a catalyst at high temperatures", mistake: "reverses the roles of enzyme and substrate"}
      - {text: "The enzyme absorbs more substrate than it needs", mistake: "assumes binding increases with heat"}
      - {text: "The reaction stops because energy is no longer produced", mistake: "treats energy production as the enzyme's job"}
    explanation: "Excess heat disrupts the weak bonds that maintain the enzyme's three-dimensional shape. The active site is then distorted, and the substrate no longer fits well."
    hints:
      - "Think about the shape of the enzyme and whether heat can alter it."
      - "Consider what happens to the fit between enzyme and substrate."
      - "Compare the effect of heat on enzymes with its effect on other proteins."
    diagram: null
    confidence: high
  - topic: enzymes
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student measures reaction rate at increasing substrate concentration with a fixed enzyme amount. Which pattern is expected at high substrate levels?"
    correct: "The rate levels off because the enzyme is saturated"
    unit: ""
    wrong:
      - {text: "The rate increases in direct proportion without limit", mistake: "ignores enzyme saturation"}
      - {text: "The rate falls steadily to zero", mistake: "assumes substrate inhibits the enzyme at every level"}
      - {text: "The rate doubles each time the substrate doubles", mistake: "assumes linear doubling at all levels"}
    explanation: "At high substrate concentration, nearly all enzyme molecules are occupied, so adding more substrate does not raise the rate. The rate then plateaus at the maximum for that enzyme amount."
    hints:
      - "Think about how many enzyme molecules are free at very high substrate."
      - "Consider what limits the reaction once every active site is busy."
      - "Ask whether the rate can keep rising when the enzyme is fully occupied."
    diagram: "Draw a graph of reaction rate on the vertical axis against substrate concentration on the horizontal axis, showing a rising curve that levels off at a plateau marked as the maximum rate."
    confidence: high
  - topic: enzymes
    type: mcq
    difficulty: hard
    role: apply
    stem: "A competitive inhibitor is added to an enzyme solution. What happens to the apparent affinity of the enzyme for its substrate, and can high substrate levels overcome the effect?"
    correct: "Apparent affinity falls, and high substrate concentrations can overcome the inhibition"
    unit: ""
    wrong:
      - {text: "Apparent affinity rises, and high substrate concentrations make the inhibition stronger", mistake: "reverses the effect of a competitive inhibitor"}
      - {text: "Apparent affinity is unchanged, and substrate levels have no effect", mistake: "assumes the inhibitor does not compete"}
      - {text: "The enzyme is permanently destroyed, so substrate cannot restore activity", mistake: "confuses competitive with irreversible inhibition"}
    explanation: "A competitive inhibitor binds the active site and competes with the substrate, so the apparent affinity falls. Raising the substrate concentration can outcompete the inhibitor and restore the rate."
    hints:
      - "Think about what the inhibitor and the substrate both bind to."
      - "Consider which of the two molecules is more likely to occupy the active site when its concentration is high."
      - "Ask whether a competitive inhibitor binds permanently or only briefly."
    diagram: null
    confidence: medium
  - topic: enzymes
    type: mcq
    difficulty: hard
    role: transfer
    stem: "An allosteric inhibitor binds a site away from the active site of an enzyme in a metabolic pathway. Which effect is most likely?"
    correct: "It changes the enzyme shape so the active site activity is reduced, and high substrate levels do not fully reverse it"
    unit: ""
    wrong:
      - {text: "It binds the active site and is overcome by more substrate", mistake: "describes a competitive inhibitor instead"}
      - {text: "It increases the activation energy of the substrate only", mistake: "assigns a catalytic-energy role to the regulator"}
      - {text: "It breaks the peptide bonds of the enzyme", mistake: "assigns hydrolysis to a regulatory binding event"}
    explanation: "Allosteric inhibitors bind elsewhere on the enzyme and change its conformation, lowering the activity of the active site. This regulation does not depend on competing with the substrate."
    hints:
      - "Ask where the inhibitor binds compared with the active site."
      - "Think about whether the inhibitor competes with the substrate."
      - "Consider how a change at a distant site can alter the active site."
    diagram: "Draw an enzyme with its active site and a separate regulatory site, showing an allosteric inhibitor bound at the regulatory site and the shape change of the active site."
    confidence: medium
  - topic: metabolism_overview
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is a metabolic pathway?"
    correct: "A series of linked enzyme-catalysed reactions in which the product of one step is the substrate of the next"
    unit: ""
    wrong:
      - {text: "A single reaction that produces energy in one step", mistake: "treats a pathway as one step"}
      - {text: "A physical movement of molecules across a membrane", mistake: "confuses a pathway with transport"}
      - {text: "A random set of unrelated reactions in the cell", mistake: "denies the linked nature of pathways"}
    explanation: "A metabolic pathway is a sequence of enzyme-catalysed steps in which each product feeds the next reaction. Glycolysis and the Krebs cycle are both pathways."
    hints:
      - "Think about reactions that are chained together."
      - "Consider whether the products of one reaction are used by another."
      - "Pathways are organised rather than random."
    diagram: null
    confidence: high
  - topic: metabolism_overview
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the term for a reaction pathway that ends in a product that switches off its own early enzyme?"
    correct: "Feedback inhibition"
    unit: ""
    wrong:
      - {text: "Feed-forward activation", mistake: "reverses the direction of the regulatory signal"}
      - {text: "Competitive binding", mistake: "uses a binding term instead of a regulatory term"}
      - {text: "Denaturation", mistake: "confuses regulation with protein unfolding"}
    explanation: "Feedback inhibition occurs when the end product of a pathway inhibits an early enzyme in that pathway, which slows production when the product is abundant."
    hints:
      - "Think about how the end product of a pathway can control its own production."
      - "Consider the regulatory signal that goes backwards up the pathway."
      - "The term describes a regulation loop that slows the pathway when the product builds up."
    diagram: null
    confidence: high
  - topic: metabolism_overview
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is a regulated metabolic pathway important for a cell?"
    correct: "It prevents wasteful overproduction and matches product supply to the cell's needs"
    unit: ""
    wrong:
      - {text: "It ensures every reaction in the cell runs at the same rate", mistake: "assumes uniform rates are the goal"}
      - {text: "It stops all enzymes from working permanently", mistake: "reverses the purpose of regulation"}
      - {text: "It removes the need for any enzymes in the cell", mistake: "denies that pathways use enzymes"}
    explanation: "Regulation keeps pathways in step with the cell's needs. Feedback inhibition and allosteric control prevent wasteful use of energy and raw materials."
    hints:
      - "Think about what would happen to a cell that made far more of a product than it needed."
      - "Consider whether a cell should run every reaction at full speed all the time."
      - "Ask what kind of control keeps the cell economical."
    diagram: null
    confidence: high
  - topic: metabolism_overview
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A pathway converts A to B, B to C and C to D, and D inhibits the first enzyme. A student adds extra D to a cell. Which change is expected at the first step?"
    correct: "The first step slows down"
    unit: ""
    wrong:
      - {text: "The first step speeds up", mistake: "reverses the direction of feedback"}
      - {text: "The first step stops permanently", mistake: "assumes feedback inhibition is irreversible"}
      - {text: "The first step is unaffected", mistake: "ignores the feedback loop"}
    explanation: "Extra D inhibits the first enzyme, which reduces the flow through the pathway. This feedback response is the reason the first step slows down."
    hints:
      - "Look at which product feeds back onto the first enzyme."
      - "Think about what happens to the flow of material when the first step is inhibited."
      - "Consider whether the feedback is positive or negative in this pathway."
    diagram: null
    confidence: high
  - topic: metabolism_overview
    type: numeric
    difficulty: hard
    role: apply
    stem: "A linear pathway has 6 enzyme-catalysed steps. Its end product inhibits the first 2 steps only. How many steps remain uninhibited by this product?"
    correct: "4"
    unit: ""
    wrong: []
    explanation: "Six steps minus the two inhibited steps leaves four steps that the end product does not control."
    hints:
      - "Subtract the steps named as inhibited from the total number of steps."
      - "Count only the steps that the product does not touch."
      - "Separate the steps that are inhibited from the steps that are not."
    diagram: null
    confidence: high
  - topic: metabolism_overview
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A cell has two pathways that both make the same product, and that product inhibits only one of the two pathways. What does this arrangement allow the cell to do?"
    correct: "Adjust the output of each pathway separately to fine-tune supply"
    unit: ""
    wrong:
      - {text: "Stop all synthesis of the product permanently", mistake: "assumes one inhibition shuts down every route"}
      - {text: "Make the product only inside the nucleus", mistake: "assigns a location rule that the pathways do not set"}
      - {text: "Remove the need for enzymes in both pathways", mistake: "denies that the pathways use enzymes"}
    explanation: "Because only one pathway is inhibited, the other keeps producing the compound. The cell can therefore tune each route independently to match its needs."
    hints:
      - "Think about whether the cell can control the two routes independently."
      - "Consider what a partial inhibition gives the cell."
      - "Ask whether one route keeps running when the other is shut down."
    diagram: null
    confidence: medium
    confidence: high
