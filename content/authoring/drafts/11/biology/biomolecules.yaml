  - topic: carbohydrates_and_proteins
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which carbohydrate is the main storage polysaccharide of plants?"
    correct: "Starch"
    unit: ""
    wrong:
      - {text: "Glycogen", mistake: "assigns the animal storage carbohydrate to plants"}
      - {text: "Cellulose", mistake: "confuses a structural wall polymer with a storage molecule"}
      - {text: "Chitin", mistake: "assigns the fungal and arthropod structural polymer to plants"}
    explanation: "Starch is a glucose polymer that plants store in granules. Glycogen plays the same storage role in animals, while cellulose is structural."
    hints:
      - "Think about the carbohydrate found in potatoes and grains."
      - "The molecule is a polymer of glucose stored in plastids."
      - "Consider which polysaccharide is stored rather than used for structure."
