items:
  - topic: root_stem_leaf
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which root modification stores food in a swollen form, as in a carrot or a radish?"
    correct: "Taproot"
    unit: ""
    wrong:
      - {text: "Prop root", mistake: "confuses a support root with a storage root"}
      - {text: "Adventitious root", mistake: "assumes any root arising from the stem is a storage root"}
      - {text: "Stilt root", mistake: "treats aerial support roots as storage organs"}
    explanation: "A taproot is the main root that grows down from the radicle and can become swollen with stored food, as in carrot and radish. Prop and stilt roots are supports, not storage organs."
    hints:
      - "Think about the main root that grows straight down from the seed."
      - "The root is thick and fleshy in the vegetables you commonly eat."
      - "The structure is one main downward root with side branches."
    diagram: null
    confidence: high
  - topic: root_stem_leaf
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which stem modification is a horizontal underground stem with nodes and buds, as in ginger?"
    correct: "Rhizome"
    unit: ""
    wrong:
      - {text: "Runner", mistake: "confuses an above-ground horizontal stem with an underground one"}
      - {text: "Tuber", mistake: "confuses a swollen storage stem with a horizontal one"}
      - {text: "Thorn", mistake: "treats a sharp protective stem as an underground structure"}
    explanation: "A rhizome grows horizontally underground, bears nodes and buds, and sends up shoots. Ginger and turmeric are common examples."
    hints:
      - "The stem grows horizontally, but below the soil surface."
      - "Look for nodes and buds on the underground stem."
      - "Think of a spice that is sold as a knobby underground stem."
    diagram: null
    confidence: high
  - topic: root_stem_leaf
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are the tendrils of a pea plant considered modified leaves rather than modified stems?"
    correct: "Tendrils arise from the leaf and coil around supports, which matches a leaf modification"
    unit: ""
    wrong:
      - {text: "Tendrils contain chlorophyll and therefore are leaves", mistake: "uses chlorophyll as the only sign of a leaf"}
      - {text: "Tendrils grow underground like roots", mistake: "places the tendril below the soil"}
      - {text: "Tendrils are always found on monocot stems", mistake: "assigns tendrils to a single group"}
    explanation: "In pea, the tendril is a modified leaf or leaflet that coils around a support. Its position on the leaf axis supports this classification."
    hints:
      - "Check where the tendril attaches on the plant."
      - "Think about what the coiling organ is attached to."
      - "Compare the tendril's position with the position of normal leaves."
    diagram: null
    confidence: medium
  - topic: root_stem_leaf
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student wants to decide whether a fleshy swollen organ is a root or a stem. Which feature should the student check first?"
    correct: "Whether the organ has nodes, buds or scale-like leaves"
    unit: ""
    wrong:
      - {text: "Whether the organ is edible", mistake: "uses human use as a classification test"}
      - {text: "Whether the organ is coloured", mistake: "uses colour, which varies within every group"}
      - {text: "Whether the organ is above the soil", mistake: "assumes all stems grow above ground"}
    explanation: "Stems bear nodes, buds and leaves, while roots do not, so the presence of nodes is the first decisive check. Scale-like leaves and buds are typical of stem modifications."
    hints:
      - "Think about which structures appear only on stems."
      - "Check the surface of the organ for repeated points of attachment."
      - "Look for features that are about structure rather than use or colour."
    diagram: null
    confidence: high
  - topic: root_stem_leaf
    type: mcq
    difficulty: hard
    role: apply
    stem: "A plant has spines that arise from the axil of leaves and protect the stem. Which modification is this, and what is its likely function?"
    correct: "A modified stem structure, reducing water loss and deterring grazing"
    unit: ""
    wrong:
      - {text: "A modified root for storing water", mistake: "assigns a storage role to a protective organ"}
      - {text: "A modified leaf for photosynthesis", mistake: "assumes all spiny structures are leaves"}
      - {text: "A floral part for attracting pollinators", mistake: "confuses protection with pollination"}
    explanation: "Spines arising from leaf axils are modified stem or branch structures, and they reduce water loss and deter grazing animals. Some cacti and related plants use spines this way."
    hints:
      - "Look at where the spine sits relative to the leaf."
      - "Think about what a plant gains from sharp protective structures in dry conditions."
      - "Consider whether the spine is a leaf modification or a stem modification."
    diagram: "Draw a stem with a leaf and a spine arising from the leaf axil, labelling the axil, the spine, the leaf and the stem node."
    confidence: medium
  - topic: flower_structure
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which whorl of a flower contains the female reproductive organ?"
    correct: "Gynoecium"
    unit: ""
    wrong:
      - {text: "Androecium", mistake: "confuses the male whorl with the female one"}
      - {text: "Calyx", mistake: "treats the protective outer whorl as reproductive"}
      - {text: "Corolla", mistake: "confuses the showy petals with reproductive organs"}
    explanation: "The gynoecium is the innermost whorl and consists of one or more carpels, each with a stigma, style and ovary. The androecium holds the stamens."
    hints:
      - "This whorl is at the centre of the flower."
      - "Think about the whorl that contains the stigma and ovary."
      - "The female parts are grouped under a single term."
    diagram: null
    confidence: high
  - topic: flower_structure
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which part of a stamen produces pollen grains?"
    correct: "Anther"
    unit: ""
    wrong:
      - {text: "Filament", mistake: "confuses the stalk of the stamen with the pollen-producing part"}
      - {text: "Stigma", mistake: "confuses the pollen receiver with the pollen producer"}
      - {text: "Ovule", mistake: "confuses male and female reproductive parts"}
    explanation: "The anther is the pollen-bearing part at the top of the stamen, and it contains pollen sacs. The filament is the stalk that holds the anther."
    hints:
      - "This part sits on top of the stalk of the stamen."
      - "Think about the swollen tip of the stamen."
      - "Pollen sacs develop inside this structure."
    diagram: null
    confidence: high
  - topic: flower_structure
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is a flower with both stamens and carpels on the same flower described as bisexual?"
    correct: "It bears both male and female reproductive organs in one flower"
    unit: ""
    wrong:
      - {text: "It has no sepals and no petals", mistake: "confuses sex with the absence of other whorls"}
      - {text: "It grows on two separate plants", mistake: "confuses bisexual with dioecious"}
      - {text: "It produces seeds without pollination", mistake: "assigns seed formation without pollination"}
    explanation: "A bisexual flower carries both androecium and gynoecium. Dioecious plants, in contrast, bear male and female flowers on separate plants."
    hints:
      - "Check whether both sets of reproductive whorls appear in one flower."
      - "Think about whether the flower is on a single plant or spread across plants."
      - "Look at what kinds of organs the flower carries, not at other whorls."
    diagram: "Draw a single flower in longitudinal section, labelling the stamens in the androecium and the carpel in the gynoecium, to show both sexes in one flower."
    confidence: high
  - topic: flower_structure
    type: mcq
    difficulty: medium
    role: procedure
    stem: "When drawing a flower for labelling, which order of whorls is correct from the outside inwards?"
    correct: "Calyx, corolla, androecium, gynoecium"
    unit: ""
    wrong:
      - {text: "Corolla, calyx, gynoecium, androecium", mistake: "reverses the outer whorls and the inner whorls"}
      - {text: "Androecium, gynoecium, calyx, corolla", mistake: "places reproductive whorls outside the perianth"}
      - {text: "Calyx, androecium, corolla, gynoecium", mistake: "places the stamens between the sepals and petals"}
    explanation: "Going from outside to inside, a flower has the calyx of sepals, the corolla of petals, the androecium of stamens and the gynoecium of carpels. This order is used when labelling diagrams."
    hints:
      - "Start from the outermost protective whorl."
      - "Move inward through the showy petals before the reproductive whorls."
      - "The innermost whorl is the female one."
    diagram: "Draw a flower in cross section as concentric rings, labelling the calyx, corolla, androecium and gynoecium from the outside inwards."
    confidence: high
  - topic: flower_structure
    type: mcq
    difficulty: hard
    role: apply
    stem: "A fruit develops from an ovary wall and contains seeds, but a student notices that the receptacle has also swelled and forms part of the fruit. What type of fruit does this describe?"
    correct: "A false fruit, in which tissue other than the ovary contributes to the fruit"
    unit: ""
    wrong:
      - {text: "A true fruit formed only from the ovary", mistake: "ignores the contribution of the receptacle"}
      - {text: "A seed with no ovary contribution", mistake: "confuses fruit with seed"}
      - {text: "A dry dehiscent capsule", mistake: "classifies by texture rather than origin"}
    explanation: "A false fruit includes tissue from the receptacle or other flower parts alongside the ovary wall. The apple is a common member of this kind of fruit."
    hints:
      - "Ask which parts of the flower are taking part in forming the fruit."
      - "Think about whether the ovary alone forms the fruit in this case."
      - "The question contrasts the ovary with another flower part that has swelled."
    diagram: "Draw a longitudinal section of an apple-like fruit showing the receptacle tissue, the ovary wall and the seeds, labelling each."
    confidence: medium
  - topic: flower_structure
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A plant bears many small flowers clustered around a central axis with flowers opening from the base upward. Which statement about this flower arrangement is most accurate?"
    correct: "It is a racemose inflorescence, in which the main axis grows on and flowers open from the bottom up"
    unit: ""
    wrong:
      - {text: "It is a solitary flower with no inflorescence", mistake: "treats a cluster as a single flower"}
      - {text: "It is a cymose inflorescence with the top flower opening first", mistake: "reverses the opening order of a racemose cluster"}
      - {text: "It is a fruit cluster after pollination", mistake: "confuses flowers with fruits"}
    explanation: "A racemose inflorescence has an unlimited main axis, and flowers open in order from the base or margin toward the tip. The arrangement is common in plants with many small flowers."
    hints:
      - "Ask whether the main axis keeps growing or ends in a flower."
      - "Consider the order in which the flowers open along the axis."
      - "Think about whether the arrangement is a single flower or a cluster of several."
    diagram: "Draw a raceme with a central axis, stalked flowers arising in sequence along it, and the youngest flower at the tip, labelling the axis, the pedicels and the flowers."
    confidence: medium
  - topic: inflorescence_and_placentation
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which type of inflorescence has a main axis that ends in a single flower?"
    correct: "Cymose"
    unit: ""
    wrong:
      - {text: "Racemose", mistake: "assumes all inflorescences have an unlimited main axis"}
      - {text: "Spadix", mistake: "confuses a fleshy spike with an axis that ends in a flower"}
      - {text: "Capitulum", mistake: "confuses a flower head with a terminal single flower"}
    explanation: "In a cymose inflorescence the main axis terminates in a flower, and growth continues from lateral branches. This is the opposite of the racemose pattern."
    hints:
      - "Compare whether the main axis keeps growing or stops at a flower."
      - "This type is contrasted with the unlimited pattern."
      - "Think about a branching cluster that ends with a single flower at each branch tip."
    diagram: null
    confidence: high
  - topic: inflorescence_and_placentation
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which placentation type has ovules attached to a central column with no partitions in the ovary?"
    correct: "Free central placentation"
    unit: ""
    wrong:
      - {text: "Marginal placentation", mistake: "confuses the position of ovules along a suture with a central column"}
      - {text: "Axile placentation", mistake: "assumes a central column always has partitions"}
      - {text: "Basal placentation", mistake: "places ovules at the base of the ovary"}
    explanation: "In free central placentation, ovules are attached to a central column that is not connected to partitions, which is seen in plants such as the dianthus family."
    hints:
      - "Think about where ovules sit and whether the ovary has partitions."
      - "The column stands in the middle of the ovary."
      - "The ovary in this case is not divided by walls."
    diagram: null
    confidence: medium
  - topic: inflorescence_and_placentation
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does an ovary with axile placentation usually have several locules?"
    correct: "Ovules are attached to a central axis that is connected to partitions that divide the ovary"
    unit: ""
    wrong:
      - {text: "The style is branched into several parts", mistake: "confuses style branching with locule formation"}
      - {text: "Each carpel forms a separate fruit", mistake: "assumes separate carpels always mean separate fruits"}
      - {text: "The petals fuse to form partitions", mistake: "assigns partition formation to the corolla"}
    explanation: "Axile placentation places ovules on a central axis that connects to the partitions of a multilocular ovary, and this creates the separate locules. This is common in tomato and lily."
    hints:
      - "Think about the central axis and what it joins."
      - "Consider which structures divide the ovary into compartments."
      - "The locules are formed by walls rather than by the style."
    diagram: "Draw an ovary in cross section with a central axis and partitions joining it, labelling the locules, the axis and the ovules on the axis."
    confidence: medium
  - topic: inflorescence_and_placentation
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student classifies a plant's inflorescence. The flowers are borne on short stalks along the axis and the terminal flower is absent. Which type should the student record?"
    correct: "Racemose inflorescence"
    unit: ""
    wrong:
      - {text: "Cymose inflorescence", mistake: "assumes a terminal flower is always present"}
      - {text: "Single flower", mistake: "treats a cluster as a single flower"}
      - {text: "Spike with a fleshy axis", mistake: "confuses the stalk arrangement with a fleshy axis"}
    explanation: "Stalked flowers along an axis with no terminal flower match a racemose inflorescence, which has an unlimited main axis that keeps growing."
    hints:
      - "Focus on whether the main axis ends in a flower or continues to grow."
      - "Check whether each flower has its own stalk along the axis."
      - "Ask which type keeps the axis open for new flowers."
    diagram: "Draw a stem with stalked flowers arising in sequence along one side of the axis, labelling the main axis, the stalks and the flowers."
    confidence: high
  - topic: inflorescence_and_placentation
    type: numeric
    difficulty: hard
    role: apply
    stem: "A cymose inflorescence has a terminal flower on the main axis, and that axis has 2 lateral branches. Each lateral branch ends in a flower and has 3 further lateral branches, each ending in one flower. How many flowers does the whole inflorescence have, counting the terminal flower?"
    correct: "9"
    unit: ""
    wrong: []
    explanation: "The terminal flower gives 1. Two lateral branches each end in a flower, giving 2, and each of those gives 3 further flowers, which is 6. Adding 1, 2 and 6 gives 9."
    hints:
      - "Count the terminal flower first and then the flowers on the first set of branches."
      - "Each first-level branch produces its own set of further branches."
      - "Add the counts at each level before finishing the total."
    diagram: null
    confidence: medium
  - topic: inflorescence_and_placentation
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A dense spike with many tiny flowers on a fleshy central axis is found in some plants. What is this inflorescence called?"
    correct: "Spadix"
    unit: ""
    wrong:
      - {text: "Umbel", mistake: "confuses a fleshy axis with flowers on equal stalks from one point"}
      - {text: "Corymb", mistake: "confuses a flat-topped cluster with a fleshy spike"}
      - {text: "Verticillaster", mistake: "confuses a whorled cluster with a fleshy spike"}
    explanation: "A spadix is a fleshy spike with tiny flowers crowded around a thick axis, often enclosed in a spathe. Arum and palm inflorescences are typical members of this type."
    hints:
      - "Look at the thickness and texture of the central axis."
      - "Think about spikes that have a fleshy main axis."
      - "Consider the cluster that is enclosed in a large leaf-like bract."
    diagram: null
    confidence: medium
  - topic: root_stem_leaf
    type: mcq
    difficulty: hard
    role: apply
    stem: "A leaf is pinnately compound, with leaflets arranged on both sides of a central rachis. Which leaf type does this describe?"
    correct: "Pinnately compound leaf"
    unit: ""
    wrong:
      - {text: "Palmately compound leaf", mistake: "confuses leaflets arising from one point with leaflets along an axis"}
      - {text: "Simple leaf with a serrated margin", mistake: "ignores the division of the blade into leaflets"}
      - {text: "Peltate leaf", mistake: "confuses a shield-like attachment with compound structure"}
    explanation: "In a pinnately compound leaf, several leaflets lie along a central axis, the rachis, in a feather-like arrangement. A palmately compound leaf has leaflets arising from a single point."
    hints:
      - "Check whether the leaflets arise from one point or along a central axis."
      - "Ask whether the blade is one continuous piece or divided."
      - "Look at the arrangement of the leaflets rather than their edges."
    diagram: "Draw a compound leaf with a central rachis and leaflets on both sides, labelling the rachis, the leaflets and the petiole."
    confidence: high
