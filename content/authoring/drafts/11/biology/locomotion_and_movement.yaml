    explanation: "Paramecium is a ciliate, and its surface is covered with many short cilia that beat in coordinated waves to propel the cell through water."
    hints:
      - "These are many short hair-like projections over the surface of the cell."
      - "Think about structures that beat in coordinated waves."
      - "The organism is a single-celled protist that lives in pond water."
