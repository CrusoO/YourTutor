    confidence: high
  - topic: muscle_contraction
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the role of calcium ions in skeletal muscle contraction?"
    correct: "They bind troponin and move tropomyosin to expose myosin-binding sites on actin"
    unit: ""
    wrong:
      - {text: "They break down ATP to release energy", mistake: "assigns the energy role to calcium"}
      - {text: "They join actin and myosin permanently", mistake: "assumes binding is permanent rather than switched"}
      - {text: "They relax the sarcomere by pumping sodium out", mistake: "assigns a sodium role to calcium"}
    explanation: "A nerve impulse releases calcium from the sarcoplasmic reticulum. Calcium binds troponin, which shifts tropomyosin away from the binding sites on actin so that cross-bridges can form."
    hints:
      - "Think about the regulatory protein that blocks the binding site on actin at rest."
      - "Consider what happens when calcium is released from the sarcoplasmic reticulum."
      - "Calcium acts as a switch rather than as a source of energy."
    diagram: null
    confidence: high
  - topic: muscle_contraction
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is ATP needed for muscle relaxation, even though no active pulling is happening then?"
    correct: "ATP detaches myosin from actin, so the cross-bridge can break and the filaments can slide apart"
    unit: ""
    wrong:
      - {text: "ATP is consumed to pull the Z lines apart", mistake: "assigns active stretching to ATP"}
      - {text: "ATP makes the sarcomere longer by itself", mistake: "assigns the lengthening to ATP alone"}
      - {text: "ATP is needed only to store calcium in the cell", mistake: "limits ATP's role to calcium storage"}
    explanation: "Relaxation requires myosin to let go of actin. Binding of a fresh ATP to the myosin head detaches it from actin, which is needed before the cycle can reset."
    hints:
      - "Think about what must happen to a cross-bridge before it can release."
      - "Consider what the myosin head is bound to after the power stroke."
      - "Ask what separates myosin from actin in the cycle."
    diagram: null
    confidence: high
  - topic: muscle_contraction
    type: mcq
    difficulty: medium
    role: procedure
    stem: "In the sliding filament mechanism, which band of the sarcomere stays the same length during contraction?"
    correct: "The A band"
    unit: ""
    wrong:
      - {text: "The I band", mistake: "assumes the light band keeps its length"}
      - {text: "The Z line", mistake: "assumes the boundary of the sarcomere is fixed"}
      - {text: "The H zone only", mistake: "assumes the H zone is the only constant band"}
    explanation: "The A band is the length of the thick filaments, which do not change length. The I band and H zone shorten as the thin filaments slide inward during contraction."
    hints:
      - "The dark band contains the full length of the thick filaments."
      - "Think about the band that matches the length of the thick filament."
      - "The I band and the H zone shorten as the thin filaments slide inward."
    diagram: "Draw one sarcomere in resting and contracted states, labelling the Z lines, the I band, the A band and the H zone, and noting which bands shorten."
    confidence: high
