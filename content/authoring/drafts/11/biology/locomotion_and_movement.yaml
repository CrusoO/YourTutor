  - topic: muscle_contraction
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which protein forms the thin filaments of a sarcomere?"
    correct: "Actin"
    unit: ""
    wrong:
      - {text: "Myosin", mistake: "assigns the thick filament protein to the thin filaments"}
      - {text: "Tropomyosin alone", mistake: "treats a regulatory protein as the whole filament"}
      - {text: "Collagen", mistake: "assigns a connective tissue protein to the contractile filament"}
    explanation: "Thin filaments are built mainly from actin, with tropomyosin and troponin lying along them. Thick filaments are made of myosin."
    hints:
      - "This protein is also the main component of the thinnest cytoskeletal fibre."
      - "Think about the protein that myosin heads bind to during contraction."
      - "Troponin and tropomyosin sit on this filament and regulate binding."
