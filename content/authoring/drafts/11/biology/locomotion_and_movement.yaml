  - topic: types_of_movement
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why do cilia lining the trachea beat in one coordinated direction to move mucus upward?"
    correct: "Each ciliary stroke is asymmetric, with a fast power stroke in one direction and a slower recovery stroke"
    unit: ""
    wrong:
      - {text: "Cilia are moved passively by the blood flow in the airway", mistake: "assigns movement to blood flow rather than the cilia"}
      - {text: "Cilia attach to the air and are pulled along by breathing", mistake: "assigns movement to the air passing by"}
      - {text: "Cilia move only when nerve signals contract them", mistake: "assigns all cilia movement to direct nerve control"}
    explanation: "The power stroke of a cilium sweeps further than its recovery stroke, so the cilia move fluid in a consistent direction. This asymmetry explains the upward mucus transport in the airway."
    hints:
      - "Think about how a single stroke differs between the forward part and the return part."
      - "Consider whether the beat is symmetric or whether one half is more powerful."
      - "The direction of the sweep depends on the shape of the stroke."
    diagram: "Draw a cilium in two positions, showing the fast power stroke sweeping mucus upward and the slower recovery stroke returning close to the surface, labelling both strokes."
    confidence: medium
  - topic: skeletal_system
