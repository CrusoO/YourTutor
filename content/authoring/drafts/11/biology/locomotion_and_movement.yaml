  - topic: types_of_movement
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which mode of locomotion does an earthworm use to move through soil?"
    correct: "Peristalsis, with waves of contraction passing along circular and longitudinal muscles"
    unit: ""
    wrong:
      - {text: "Jumping with powerful hind legs", mistake: "assigns jumping to an animal without legs"}
      - {text: "Ciliary beating along the body surface", mistake: "assigns cilia as the main locomotor organ"}
      - {text: "Amoeboid flow of the body", mistake: "assigns cytoplasmic flow to a multicellular animal"}
    explanation: "The earthworm's body is divided into segments, each with circular and longitudinal muscles. Waves of contraction pass along the body, and bristles called setae grip the soil as the segments move."
    hints:
      - "Think about waves of contraction that pass along the body."
      - "The earthworm has two layers of muscle in each segment."
      - "The body is divided into segments that contract in turn."
    diagram: null
    confidence: high
  - topic: types_of_movement
    type: mcq
    difficulty: hard
    role: apply
    stem: "A flagellate is observed with one long tail that beats in a corkscrew-like wave. Which mechanism is most likely driving its movement?"
    correct: "Flagellar movement of a single whip-like structure"
    unit: ""
    wrong:
      - {text: "Amoeboid movement with temporary extensions", mistake: "assigns pseudopodia to a flagellated cell"}
      - {text: "Ciliary beating of many short hairs", mistake: "confuses a single tail with many cilia"}
      - {text: "Peristalsis along a muscular tube", mistake: "assigns a tube-based mechanism to a single cell"}
    explanation: "A single long tail with a helical wave is characteristic of flagellar propulsion. Flagella move by bending along their length, unlike cilia which are numerous and short."
    hints:
      - "Count how many hair-like structures are present on the cell."
      - "Think about a single long structure with a wave travelling along it."
      - "Compare the shape of the movement with the action of a whip."
    diagram: null
