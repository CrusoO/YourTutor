    stem: "A sarcomere is 2.4 micrometres long at rest and shortens to 1.6 micrometres when contracted. By how many micrometres does it shorten?"
    correct: "0.8"
    unit: "micrometres"
    wrong: []
    explanation: "The shortening is the resting length minus the contracted length, which is 2.4 minus 1.6, giving 0.8 micrometres."
    hints:
