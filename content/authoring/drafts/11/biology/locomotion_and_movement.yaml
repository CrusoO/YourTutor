  - topic: skeletal_system
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are synovial joints such as the knee described as freely movable?"
    correct: "They have a fluid-filled joint cavity and articular cartilage, which allow a wide range of motion"
    unit: ""
    wrong:
      - {text: "They are fused with bone and cannot move", mistake: "assigns fused joints to the synovial type"}
      - {text: "They are held together only by hair-like structures", mistake: "invents a holding structure for joints"}
      - {text: "They contain no cartilage at all", mistake: "denies that cartilage covers the bone ends"}
    explanation: "Synovial joints have a joint capsule with synovial fluid that lubricates the articular cartilage covering the bone ends. This arrangement allows smooth and extensive movement."
    hints:
      - "Think about the fluid-filled space between the bones of a joint."
      - "Consider whether the bones are fused or separated by a cavity."
      - "The lubrication helps the bones glide smoothly."
    diagram: null
    confidence: high
