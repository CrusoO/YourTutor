      - {text: "Flagella are used mainly for digestion in the gut", mistake: "assigns a digestive role to the flagellum"}
    explanation: "A sperm flagellum beats with a wave that travels along its length and pushes the cell forward. This single structure is enough for propulsion in the fluid of the reproductive tract."
    hints:
      - "Think about how the tail moves the cell through fluid."
      - "Consider whether one long structure or many short ones drives a single cell forward."
      - "The structure is found at the back of the cell."
