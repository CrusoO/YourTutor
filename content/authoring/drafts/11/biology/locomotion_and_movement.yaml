      - {text: "Pectoral girdle only", mistake: "treats one girdle as the whole group"}
    explanation: "The axial skeleton forms the central axis of the body and includes the skull, vertebral column, ribs and sternum. The appendicular skeleton includes the limbs and their girdles."
    hints:
