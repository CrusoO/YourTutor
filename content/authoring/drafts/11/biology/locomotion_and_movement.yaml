  - topic: muscle_contraction
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A poison stops calcium from being released into the sarcoplasm of a muscle fibre. What is the most likely effect?"
    correct: "The muscle cannot contract, because troponin keeps the binding sites on actin blocked"
    unit: ""
    wrong:
      - {text: "Contraction becomes faster and stronger", mistake: "assumes calcium blockage speeds up contraction"}
      - {text: "The muscle contracts but can never relax", mistake: "assigns the relaxation step to calcium release"}
      - {text: "ATP production in the muscle stops immediately", mistake: "assigns ATP production to calcium"}
    explanation: "Without calcium release, troponin keeps tropomyosin in the blocking position, so myosin cannot bind actin. The fibre stays relaxed even when the nerve signal arrives."
    hints:
      - "Think about what keeps the binding sites on actin covered in a resting fibre."
      - "Consider what calcium does when it reaches troponin."
      - "Ask whether a stimulus can produce a contraction if the switch is not turned on."
    diagram: "Draw a sarcomere with the sarcoplasmic reticulum releasing calcium, showing troponin and tropomyosin on the thin filament, and mark the blocked release with an X."
    confidence: medium
