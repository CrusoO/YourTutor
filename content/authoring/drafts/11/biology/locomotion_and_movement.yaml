  - topic: types_of_movement
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does a human sperm cell rely on a single long flagellum rather than many cilia to move?"
    correct: "A single whip-like flagellum with a wave along its length produces the thrust needed to swim through fluid"
    unit: ""
    wrong:
      - {text: "Cilia are too weak to exist in animal cells", mistake: "denies that cilia occur in animals"}
