items:
  - topic: algae_bryophytes_pteridophytes
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which group of plants lacks true vascular tissue, has a dominant gametophyte, and needs water for sperm to swim to the egg?"
    correct: "Bryophytes"
    unit: ""
    wrong:
      - {text: "Pteridophytes", mistake: "assumes all spore-producing plants share the same dominant generation"}
      - {text: "Gymnosperms", mistake: "forgets that gymnosperms are seed plants with pollen"}
      - {text: "Green algae", mistake: "treats algae as land plants with a dominant body"}
    explanation: "Bryophytes such as mosses and liverworts are non-vascular land plants whose gametophyte is the leafy, long-lived body. Their sperm need a film of water to reach the egg."
    hints:
      - "Think of small green plants that grow in damp places, such as mosses and liverworts."
      - "They lack true vascular tissue, which is a key clue."
      - "Water is needed for fertilisation, so the group stays close to moisture."
    diagram: null
    confidence: high
  - topic: algae_bryophytes_pteridophytes
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which group of plants first has true vascular tissue but still reproduces by spores rather than seeds?"
    correct: "Pteridophytes"
    unit: ""
    wrong:
      - {text: "Bryophytes", mistake: "credits mosses with vascular tissue"}
      - {text: "Angiosperms", mistake: "confuses seeds with spores"}
      - {text: "Brown algae", mistake: "treats seaweeds as vascular land plants"}
    explanation: "Pteridophytes such as ferns and horsetails have xylem and phloem, which bryophytes lack, yet they disperse by spores and do not form seeds."
    hints:
      - "Ferns are the typical members of this group."
      - "The plant has roots, stems and leaves but does not form seeds."
      - "Think of ferns and horsetails and what they release to reproduce."
    diagram: null
    confidence: high
  - topic: algae_bryophytes_pteridophytes
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do bryophytes remain small and close to moist habitats?"
    correct: "Their sperm need water to swim to the egg and they lack efficient vascular transport"
    unit: ""
    wrong:
      - {text: "They are too heavy to grow tall in wind", mistake: "uses body weight as the main constraint"}
      - {text: "They lack chlorophyll so they need shade", mistake: "denies that bryophytes photosynthesise"}
      - {text: "They produce seeds that need flooding to germinate", mistake: "assigns seed production to bryophytes"}
    explanation: "Fertilisation in bryophytes requires swimming sperm in a film of water, and their lack of xylem limits the height they can transport water to. Both features keep them small and moist-loving."
    hints:
      - "Think about how fertilisation happens in these plants."
      - "Consider how water moves through their tissues."
      - "Their life cycle depends on a thin film of water for part of its stage."
    diagram: null
    confidence: high
  - topic: algae_bryophytes_pteridophytes
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which sequence correctly describes the alternation of generations in a fern?"
    correct: "Spore, gametophyte, gametes, zygote, sporophyte, spore"
    unit: ""
    wrong:
      - {text: "Zygote, sporophyte, gametes, gametophyte, spore", mistake: "reverses the whole sequence"}
      - {text: "Sporophyte, zygote, spore, gametophyte, gametes", mistake: "drops the meiosis step from the cycle"}
      - {text: "Gametes, spore, zygote, sporophyte, gametophyte", mistake: "places gametes before the spore stage"}
    explanation: "The fern sporophyte produces spores by meiosis, each spore grows into a haploid gametophyte, which makes gametes. Fertilisation forms a zygote that develops into the next sporophyte."
    hints:
      - "Start at the spore, which the mature fern plant produces."
      - "Find which stage makes gametes, since that is the haploid body."
      - "The fern plant you see is the diploid body that produces spores."
    diagram: "Draw a cycle with two labelled stages, a small haploid prothallus and the large diploid fern. Add arrows for spore production, gamete formation, fertilisation to a zygote, and growth of the new fern."
    confidence: high
  - topic: algae_bryophytes_pteridophytes
    type: numeric
    difficulty: hard
    role: apply
    stem: "In a fern life cycle, 8 prothalli each form 3 zygotes after fertilisation. How many sporophytes start from these zygotes?"
    correct: "24"
    unit: ""
    wrong: []
    explanation: "Eight prothalli, each forming three zygotes, give 8 times 3 equals 24 zygotes. Each zygote develops into one new sporophyte."
    hints:
      - "Count the zygotes first, then ask how many sporophytes each zygote gives."
      - "Each zygote develops into one new sporophyte."
      - "Multiply the number of prothalli by the zygotes each one forms."
    diagram: null
    confidence: high
  - topic: algae_bryophytes_pteridophytes
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why are bryophytes placed in a separate group from algae even though both lack roots?"
    correct: "Bryophytes have a multicellular life cycle that forms a protected embryo, which algae lack"
    unit: ""
    wrong:
      - {text: "Algae have flowers, while bryophytes do not", mistake: "uses a reproductive structure that algae never have"}
      - {text: "Bryophytes photosynthesise and algae do not", mistake: "reverses the pattern of photosynthesis among these groups"}
      - {text: "Algae reproduce only by seeds", mistake: "assumes algae produce seeds"}
    explanation: "Bryophytes retain the zygote inside a protective structure where an embryo develops, a feature that places them among the land plants. Algae do not form this protected embryo."
    hints:
      - "Think about how the young stage is protected after fertilisation."
      - "Consider how the plant body is built after the zygote forms."
      - "Compare the life cycles rather than the outward appearance of the plants."
    diagram: "Show two columns, one for an alga with no protected embryo and one for a moss with a sporophyte growing from the gametophyte. Label the embryo, the gametophyte and the sporophyte."
    confidence: medium
  - topic: gymnosperms_angiosperms
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which feature distinguishes angiosperms from gymnosperms among seed plants?"
    correct: "Seeds enclosed within a fruit"
    unit: ""
    wrong:
      - {text: "Seeds exposed on cone scales", mistake: "reverses the feature that defines gymnosperms"}
      - {text: "Absence of any seeds", mistake: "forgets that both groups are seed plants"}
      - {text: "Spores as the only reproductive unit", mistake: "assigns a spore-only life cycle to seed plants"}
    explanation: "Angiosperms develop their ovules into seeds inside an ovary that becomes a fruit. Gymnosperms have naked seeds that are not enclosed in a fruit."
    hints:
      - "Think about what surrounds the seed in a flowering plant."
      - "Consider the structure in which the fruit develops."
      - "The fruit protects the seed and often helps it spread."
    diagram: null
    confidence: high
  - topic: gymnosperms_angiosperms
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which group of seed plants is typically woody and bears its seeds on cones?"
    correct: "Gymnosperms"
    unit: ""
    wrong:
      - {text: "Angiosperms", mistake: "assumes all woody seed plants are flowering plants"}
      - {text: "Pteridophytes", mistake: "confuses spores with seeds"}
      - {text: "Bryophytes", mistake: "applies the non-vascular group to woody plants"}
    explanation: "Gymnosperms such as pines and cycads have naked seeds, often borne on cones, and their wood is typically well developed."
    hints:
      - "Pine trees are a common member of this group."
      - "Look for seeds that are not enclosed in a fruit."
      - "Think about seed plants that do not produce flowers."
    diagram: null
    confidence: high
  - topic: gymnosperms_angiosperms
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is double fertilisation considered a key feature of angiosperms?"
    correct: "It forms the embryo and a nutritive endosperm from two separate fusions"
    unit: ""
    wrong:
      - {text: "It produces seeds without any embryo", mistake: "assumes the endosperm replaces the embryo"}
      - {text: "It occurs only in gymnosperms", mistake: "reverses the group in which it occurs"}
      - {text: "It produces spores instead of seeds", mistake: "confuses the product of fertilisation with spores"}
    explanation: "In angiosperms, one sperm fuses with the egg to form the zygote, and a second sperm fuses with two polar nuclei to form the endosperm. The endosperm provides food for the developing embryo."
    hints:
      - "Count how many sperm nuclei are delivered by one pollen tube."
      - "Think about what the second fusion produces."
      - "The second product feeds the developing embryo."
    diagram: null
    confidence: high
  - topic: gymnosperms_angiosperms
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which order of events leads to seed formation in an angiosperm?"
    correct: "Pollination, fertilisation, ovule development into seed, ovary development into fruit"
    unit: ""
    wrong:
      - {text: "Fertilisation, pollination, fruit formation, seed development", mistake: "places fertilisation before pollination"}
      - {text: "Germination, pollination, fertilisation, dispersal", mistake: "places germination before the seed exists"}
      - {text: "Seed formation, pollination, dispersal, fertilisation", mistake: "moves seed formation to the start"}
    explanation: "Pollen must reach the stigma before fertilisation can occur, and after fertilisation the ovule develops into a seed while the ovary matures into a fruit."
    hints:
      - "Start with the transfer of pollen to the stigma."
      - "Fertilisation must happen before the ovule becomes a seed."
      - "Consider which structure becomes the fruit."
    diagram: "Draw a flower in section with the stigma, style and ovary labelled, then a simple arrow sequence showing pollen arriving, the pollen tube, the ovule becoming a seed, and the ovary becoming a fruit."
    confidence: high
  - topic: gymnosperms_angiosperms
    type: numeric
    difficulty: hard
    role: apply
    stem: "A flower has 8 ovules in each of 3 carpels. If every ovule is fertilised and matures into a seed, how many seeds form?"
    correct: "24"
    unit: ""
    wrong: []
    explanation: "Each carpel holds 8 ovules, so 3 carpels hold 3 times 8, which is 24 ovules. If all of them mature into seeds, the flower produces 24 seeds."
    hints:
      - "Count the ovules per carpel, then the number of carpels."
      - "Multiply the two counts together."
      - "Assume every ovule is fertilised and matures."
    diagram: null
    confidence: high
  - topic: gymnosperms_angiosperms
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A plant produces naked seeds in cones but has broad leaves. Which conclusion is best supported by this evidence?"
    correct: "The seed structure points to gymnosperms, while broad leaves do not decide the group"
    unit: ""
    wrong:
      - {text: "The plant is an angiosperm because it has broad leaves", mistake: "uses leaf shape as the key trait"}
      - {text: "The plant is a bryophyte because cones contain spores", mistake: "confuses cones with a spore-only structure"}
      - {text: "The plant must be a fern because it has broad leaves", mistake: "assigns leaves to the wrong group"}
    explanation: "Naked seeds in cones are the defining reproductive feature of gymnosperms, and leaf shape varies widely among gymnosperms. The reproductive structure is the more decisive evidence."
    hints:
      - "Focus on the reproductive structure rather than the leaves."
      - "Ask what the seed is surrounded by."
      - "Some gymnosperms have broad leaves, so leaves alone are not decisive."
    diagram: "Show a cone with exposed seeds on its scales next to a flower with an ovary containing seeds. Label the cone scales, the exposed seeds, the ovary and the fruit wall."
    confidence: medium
  - topic: alternation_of_generations
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which phase of the plant life cycle is haploid and produces gametes?"
    correct: "Gametophyte"
    unit: ""
    wrong:
      - {text: "Sporophyte", mistake: "assumes the large fern plant is the haploid phase"}
      - {text: "Zygote", mistake: "treats the fertilised cell as a haploid stage"}
      - {text: "Endosperm", mistake: "confuses a food tissue with a gamete-producing phase"}
    explanation: "The gametophyte is the haploid generation and makes gametes by mitosis. The sporophyte is the diploid generation that produces spores by meiosis."
    hints:
      - "The haploid body produces gametes by mitosis."
      - "Compare the stage that produces spores with the one that makes gametes."
      - "In mosses, this stage is the leafy green body you see on the ground."
    diagram: null
    confidence: high
  - topic: alternation_of_generations
    type: mcq
    difficulty: easy
    role: recall
    stem: "Where are spores produced in a fern?"
    correct: "In sporangia on the undersides of fronds"
    unit: ""
    wrong:
      - {text: "Inside the prothallus", mistake: "assigns spore production to the haploid body"}
      - {text: "On the roots", mistake: "places reproductive structures underground"}
      - {text: "In the pollen tube", mistake: "confuses a pollen structure with a spore structure"}
    explanation: "Fern sporangia are small sacs grouped in clusters on the fronds, and meiosis inside them produces the haploid spores."
    hints:
      - "Look at the structures on the leaf-like parts of the plant."
      - "Spores form inside small sacs."
      - "The sacs are on the frond, not in the soil."
    diagram: null
    confidence: high
  - topic: alternation_of_generations
    type: mcq
    difficulty: medium
    role: explain
    stem: "What event switches the life cycle from the haploid phase back to the diploid phase?"
    correct: "Fertilisation of two gametes forming a zygote"
    unit: ""
    wrong:
      - {text: "Mitosis of spores only", mistake: "confuses cell division with a change in chromosome number"}
      - {text: "Division of the zygote into two identical cells", mistake: "treats zygote division as the switch"}
      - {text: "Growth of new roots from the gametophyte", mistake: "confuses growth with the change in phase"}
    explanation: "Two haploid gametes fuse to form a diploid zygote, which develops into the sporophyte. Meiosis later returns the cycle to haploid spores."
    hints:
      - "Think about how the chromosome number is halved and then restored."
      - "One process halves the count and another restores it."
      - "Consider which two events alternate in this life cycle."
    diagram: null
    confidence: high
