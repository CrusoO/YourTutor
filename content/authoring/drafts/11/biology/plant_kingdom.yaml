  - topic: alternation_of_generations
    type: mcq
    difficulty: hard
    role: apply
    stem: "A plant's gametophyte has 12 chromosomes in each of its cells. How many chromosomes does its sporophyte have?"
    correct: "24"
    unit: ""
    wrong:
      - {text: "12", mistake: "assumes the sporophyte matches the gametophyte"}
      - {text: "6", mistake: "halves the sporophyte count by mistake"}
      - {text: "36", mistake: "triples the count instead of doubling it"}
    explanation: "The sporophyte forms when two haploid gametes fuse, so its cells carry twice the gametophyte number, which is 24 chromosomes."
    hints:
      - "The sporophyte forms when two haploid gametes fuse."
      - "Think about how fertilisation changes the chromosome number."
      - "Double the gametophyte count to get the sporophyte count."
    diagram: "Draw a flow from a haploid gametophyte with its gametes, to a zygote, to a diploid sporophyte, labelling the chromosome counts at each stage."
