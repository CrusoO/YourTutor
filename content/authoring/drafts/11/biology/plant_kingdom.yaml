    type: numeric
    difficulty: medium
    role: procedure
    stem: "A moss sporophyte has 14 chromosomes in its diploid cells. How many chromosomes does each haploid spore have?"
    correct: "7"
    unit: ""
    wrong: []
    explanation: "Spores are produced by meiosis, which halves the chromosome number from 14 to 7."
    hints:
      - "Spores are produced by meiosis, which halves the number."
      - "Divide the diploid count by the factor that meiosis uses."
      - "Use the chromosome number of the sporophyte as your starting value."
