  - topic: alternation_of_generations
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which statement is accurate about the dominant generation in plant life cycles?"
    correct: "The dominant generation differs among plant groups, and it is the long-lived body that is more conspicuous"
    unit: ""
    wrong:
      - {text: "The gametophyte is always the larger generation in every plant", mistake: "assumes one pattern holds for all plant groups"}
      - {text: "The sporophyte is always haploid in every group", mistake: "assigns the wrong ploidy to the sporophyte"}
      - {text: "Dominance depends only on the number of cells in the plant", mistake: "uses cell count as the definition of dominance"}
    explanation: "In mosses the gametophyte is the conspicuous leafy plant, while in conifers and flowering plants the sporophyte is dominant. The dominant generation therefore varies among groups."
    hints:
      - "Think about which generation is the long-lived plant body in mosses and in conifers."
      - "Compare the leafy green body of a moss with the tree form of a conifer."
      - "Consider the differences among the major plant groups rather than a single rule."
    diagram: "Draw a moss with its small sporophyte stalk on the leafy gametophyte beside a pine tree with its large sporophyte, labelling the generation that is dominant in each."
    confidence: medium
