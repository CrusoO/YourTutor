items:
  - topic: growth_phases
    type: mcq
    difficulty: easy
    role: recall
    stem: "In which phase of plant growth does most of the increase in cell size occur through water uptake and vacuole expansion?"
    correct: "Elongation phase"
    unit: ""
    wrong:
      - {text: "Meristematic phase", mistake: "assigns cell division to the enlargement stage"}
      - {text: "Maturation phase", mistake: "confuses specialisation with enlargement"}
      - {text: "Dormancy phase", mistake: "assumes enlargement only happens in a resting state"}
    explanation: "After division, cells in the elongation zone take up water into their vacuoles and expand greatly. This phase produces most of the length increase of a root or shoot."
    hints:
      - "The cells are no longer dividing at this stage."
      - "Think about the phase that comes after division and before specialisation."
      - "Water enters the vacuole and pushes the cell to grow."
    diagram: null
    confidence: high
  - topic: growth_phases
    type: mcq
    difficulty: easy
    role: recall
    stem: "What shape does the growth curve of a plant population or organism usually show when size is plotted against time?"
    correct: "Sigmoid"
    unit: ""
    wrong:
      - {text: "Linear", mistake: "assumes growth continues at a constant rate forever"}
      - {text: "Exponential only", mistake: "ignores the plateau that appears as resources run short"}
      - {text: "Flat", mistake: "denies that growth occurs at all"}
    explanation: "A typical growth curve is sigmoid, with a lag phase, a rapid exponential phase and a plateau where growth levels off as limits are reached."
    hints:
      - "The curve starts slowly, speeds up, and then levels off."
      - "Think of an S-shaped line."
      - "The curve has a lag, a steep part and a plateau."
    diagram: null
    confidence: high
  - topic: growth_phases
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is the steep part of a growth curve called the exponential phase?"
    correct: "The number of dividing cells grows in proportion to the current number, so the increase speeds up"
    unit: ""
    wrong:
      - {text: "Growth stops and restarts at regular intervals", mistake: "confuses the phase with periodic dormancy"}
      - {text: "Cells stop dividing completely during this phase", mistake: "reverses the cell activity in the phase"}
      - {text: "Growth depends only on the amount of light received", mistake: "limits growth to a single factor"}
    explanation: "During the exponential phase each cell division creates more dividing cells, so the population or organism doubles over regular periods. The rate of increase therefore rises with time."
    hints:
      - "Think about whether the number of dividing cells grows with time."
      - "Consider what the rate of increase depends on."
      - "Compare the rate at the start with the rate during the steep part."
    diagram: null
    confidence: high
  - topic: growth_phases
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A cell culture grows from 100 cells to 800 cells by repeated doubling. How many doublings occur?"
    correct: "3"
    unit: ""
    wrong: []
    explanation: "Starting at 100, the count doubles to 200, then 400, then 800, which takes three doublings."
    hints:
      - "Keep doubling the starting count until you reach the final count."
      - "Count the number of times you multiply by the same factor."
      - "Each doubling multiplies the count by a fixed value starting from the initial number."
    diagram: null
    confidence: high
  - topic: growth_phases
    type: mcq
    difficulty: hard
    role: apply
    stem: "A root tip with its active division zone is removed, while the elongation zone further back is left in place. What is the most likely effect on root growth?"
    correct: "Root elongation slows or stops because the elongation zone receives no new cells"
    unit: ""
    wrong:
      - {text: "Root growth increases because the tip was limiting growth", mistake: "assumes removal of a growth source helps growth"}
      - {text: "The root starts forming flowers instead of growing", mistake: "assigns a reproductive switch to tip removal"}
      - {text: "Cells in the maturation zone divide faster to compensate", mistake: "reverses the division behaviour of mature cells"}
    explanation: "The meristem at the tip supplies new cells that move into the elongation zone. Without this supply, the elongation zone cannot continue adding length."
    hints:
      - "Think about where the cells that enter the elongation zone come from."
      - "Consider what happens to the zone behind the tip if no new cells arrive."
      - "Ask which region is responsible for supplying new cells to the root."
    diagram: "Draw a root tip showing the meristematic zone at the apex, the elongation zone behind it and the maturation zone further back, with arrows showing cell flow, and cut off the apex to show the effect."
    confidence: high
  - topic: growth_phases
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A plant grows under continuous light and never enters dormancy, yet its growth curve still levels off. What causes this plateau?"
    correct: "Limitation of resources and space, which slows the rate of new cell production"
    unit: ""
    wrong:
      - {text: "The plant stops growing at a fixed age set by genes alone", mistake: "assumes age alone determines the plateau"}
      - {text: "The plateau results from excessive photosynthesis", mistake: "assigns a surplus to the plateau cause"}
      - {text: "Cells switch to meiosis at the plateau and stop dividing", mistake: "confuses the plateau with a reproductive switch"}
    explanation: "As nutrients, water, light and space become limiting, the rate of new cell production falls and the curve flattens. The plateau reflects these environmental limits rather than a fixed programme."
    hints:
      - "Think about what a growing plant needs and what can run out."
      - "Consider whether the plateau would happen even without any dormancy."
      - "Ask what limits the rate of production when resources are finite."
    diagram: "Draw a sigmoid growth curve with a plateau at the top, labelling the lag, exponential and plateau phases, and noting the resource limit near the plateau."
    confidence: medium
  - topic: plant_growth_regulators
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which plant hormone promotes stem elongation and is involved in breaking seed dormancy?"
    correct: "Gibberellin"
    unit: ""
    wrong:
      - {text: "Abscisic acid", mistake: "assigns a stress-related inhibitor the elongation role"}
      - {text: "Ethylene", mistake: "assigns a ripening gas the elongation role"}
      - {text: "Cytokinin", mistake: "assigns a cell-division hormone the elongation role"}
    explanation: "Gibberellins promote stem elongation, seed germination and the breaking of dormancy. Abscisic acid acts in the opposite direction in many responses."
    hints:
      - "Think about hormones that make stems grow taller."
      - "Consider the hormone first discovered from a fungal infection that caused excessive growth in rice."
      - "The hormone also helps seeds start to germinate."
    diagram: null
    confidence: high
  - topic: plant_growth_regulators
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which plant hormone, in gaseous form, is known for promoting fruit ripening?"
    correct: "Ethylene"
    unit: ""
    wrong:
      - {text: "Auxin", mistake: "assigns ripening to the main elongation hormone"}
      - {text: "Cytokinin", mistake: "assigns ripening to a division hormone"}
      - {text: "Gibberellin", mistake: "assigns ripening to a growth-promoting hormone"}
    explanation: "Ethylene is a simple gas produced by plant tissues, and it triggers ripening and other responses such as leaf abscission. Fruits release more of it as they mature."
    hints:
      - "This hormone is a simple gas released by plant tissues."
      - "Think about the hormone released by fruit as it ripens."
      - "Consider the gas that causes bananas to ripen faster when kept together."
    diagram: null
    confidence: high
  - topic: plant_growth_regulators
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does auxin produced at the shoot tip promote apical dominance?"
    correct: "It is produced at the shoot tip and inhibits the growth of lateral buds lower on the stem"
    unit: ""
    wrong:
      - {text: "It is produced in the roots and promotes growth of lateral buds", mistake: "reverses the source and the effect"}
      - {text: "It stops the apical bud from growing at all", mistake: "reverses the target of the hormone"}
      - {text: "It is produced only in flowers and affects fruit growth", mistake: "assigns production to flowers alone"}
    explanation: "Auxin moving down from the apical bud suppresses the outgrowth of lateral buds. Removing the apex lowers auxin in the stem and releases the side buds."
    hints:
      - "Think about where auxin is made in a shoot."
      - "Consider which buds grow when the shoot tip is removed."
      - "The effect is on buds lower on the stem."
    diagram: null
    confidence: high
  - topic: plant_growth_regulators
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which hormone is most useful for delaying senescence of detached leaves kept in a dish?"
    correct: "Cytokinin"
    unit: ""
    wrong:
      - {text: "Abscisic acid", mistake: "assigns a senescence-promoting hormone the delaying role"}
      - {text: "Ethylene", mistake: "assigns the ripening gas the delaying role"}
      - {text: "Gibberellin", mistake: "treats elongation as the delaying step"}
    explanation: "Cytokinins promote cell division and delay the breakdown of chlorophyll and proteins in leaves, so applying them keeps detached leaves green for longer."
    hints:
      - "Think about the hormone that promotes cell division and delays ageing."
      - "This hormone is used to keep cut greens fresh in some horticultural practice."
      - "Consider which hormone works against the stress hormone in its effect on ageing."
    diagram: null
    confidence: high
  - topic: plant_growth_regulators
    type: mcq
    difficulty: hard
    role: apply
    stem: "A plant suffers drought, and its stomata close within hours. Which hormone is most likely responsible for this response?"
    correct: "Abscisic acid"
    unit: ""
    wrong:
      - {text: "Gibberellin", mistake: "assigns a growth-promoting hormone to a stress response"}
      - {text: "Cytokinin", mistake: "assigns a division hormone to stomatal closure"}
      - {text: "Auxin", mistake: "assigns the shoot hormone to water-stress signalling"}
    explanation: "Water deficit raises abscisic acid in leaves, which causes guard cells to lose turgor and the stomata to close. This conserves water during drought."
    hints:
      - "Think about the stress hormone that promotes dormancy and closes stomata."
      - "Consider which hormone accumulates during water deficit."
      - "The hormone is named for a process that involves leaves shedding."
    diagram: null
    confidence: high
  - topic: plant_growth_regulators
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Applying auxin to the cut surface of a stem promotes root formation. What does this result demonstrate?"
    correct: "Auxin can stimulate root initiation, which is the basis for rooting hormone use in horticulture"
    unit: ""
    wrong:
      - {text: "Auxin inhibits root formation at every concentration", mistake: "reverses the root-promoting effect"}
      - {text: "Auxin acts only on flowers and never on roots", mistake: "restricts auxin to flower development"}
      - {text: "Auxin is found only in animal tissues", mistake: "assigns the hormone to animals"}
    explanation: "Auxin promotes adventitious root initiation at the cut surface. Commercial rooting powders use synthetic auxins for this reason."
    hints:
      - "Think about the purpose of rooting powders in gardening."
      - "Consider the effect of the hormone on root initiation."
      - "Compare this effect with the role of auxin in shoot growth."
    diagram: null
    confidence: medium
  - topic: photoperiodism_vernalisation
    type: mcq
    difficulty: easy
    role: recall
    stem: "What term describes the response of a plant to the relative length of day and night?"
    correct: "Photoperiodism"
    unit: ""
    wrong:
      - {text: "Vernalisation", mistake: "confuses a cold treatment with a light response"}
      - {text: "Phototropism", mistake: "confuses day length with the direction of light"}
      - {text: "Geotropism", mistake: "assigns a gravity response to day length"}
    explanation: "Photoperiodism is the response of an organism to the length of the day or the dark period, and it controls flowering in many plants."
    hints:
      - "Think about the response to the length of the dark period."
      - "Consider the response that depends on how long the day lasts."
      - "The word combines a term for light and a term for a period of time."
    diagram: null
    confidence: high
  - topic: photoperiodism_vernalisation
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is vernalisation?"
    correct: "A cold treatment that promotes flowering in some plants"
    unit: ""
    wrong:
      - {text: "A heat treatment that delays flowering", mistake: "reverses the temperature requirement"}
      - {text: "Stem growth caused by shade", mistake: "confuses vernalisation with shade avoidance"}
      - {text: "Breaking of dormancy by light alone", mistake: "assigns a light cue to the cold treatment"}
    explanation: "Vernalisation is exposure to a period of low temperature that makes some plants, such as winter cereals, competent to flower."
    hints:
      - "Think about exposure to low temperature."
      - "The treatment is needed for some winter cereals to flower."
      - "The requirement is a period of cold rather than of light."
    diagram: null
    confidence: high
  - topic: photoperiodism_vernalisation
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do short-day plants tend to flower in autumn rather than in long summer days?"
    correct: "They are triggered when the uninterrupted night is longer than a critical length, and autumn nights reach that length"
    unit: ""
    wrong:
      - {text: "They flower in response to continuous light", mistake: "reverses the light requirement"}
      - {text: "They are not sensitive to day length at all", mistake: "denies photoperiodic control"}
      - {text: "Their flowering is driven by soil nitrogen only", mistake: "assigns flowering to soil chemistry alone"}
    explanation: "Short-day plants measure the uninterrupted dark period. Autumn nights become longer than the critical length, which triggers flowering."
    hints:
      - "Think about what the plant measures, the light or the dark period."
      - "Consider whether night length is increasing or decreasing in autumn."
      - "The critical feature is the length of the uninterrupted dark period."
    diagram: null
    confidence: medium
  - topic: photoperiodism_vernalisation
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A plant that requires long days is kept under short days only. What result is expected?"
    correct: "It fails to flower"
    unit: ""
    wrong:
      - {text: "It flowers early", mistake: "reverses the effect of the day length"}
      - {text: "It forms twice as many flowers", mistake: "assumes the flowering signal is quantitative"}
      - {text: "It switches to vernalisation to flower", mistake: "confuses environmental triggers"}
    explanation: "Long-day plants need a day length above a critical value to initiate flowering. Under short days alone, the flowering requirement is not met."
    hints:
      - "Think about the light condition that the plant needs to start flowering."
      - "Consider whether the required light condition is present."
      - "Ask whether the plant's requirement has been met."
    diagram: null
    confidence: high
  - topic: photoperiodism_vernalisation
    type: mcq
    difficulty: hard
    role: apply
    stem: "A winter cereal is sown in spring and does not flower. Which treatment would most likely induce flowering in this plant?"
    correct: "Exposing the seed or young plant to a period of cold before flowering"
    unit: ""
    wrong:
      - {text: "Keeping the seeds in a hot, dry store", mistake: "assumes heat is the flowering trigger"}
      - {text: "Covering the plants with dark cloth for one day", mistake: "assumes darkness alone induces flowering in all plants"}
      - {text: "Adding nitrogen fertiliser only", mistake: "assumes nutrients replace the cold requirement"}
    explanation: "Winter cereals need vernalisation, a cold period, to acquire the competence to flower. Without it they remain vegetative even under suitable day lengths."
    hints:
      - "Think about the environmental cue that these cereals normally experience before flowering."
      - "Consider which season provides this cue in the natural life cycle."
      - "The requirement is a physical exposure, not a chemical supplement."
    diagram: null
    confidence: high
  - topic: photoperiodism_vernalisation
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A researcher interrupts a long dark period with a brief flash of light in a short-day plant. What flowering response is most likely?"
    correct: "Flowering is inhibited, because the light flash breaks the critical uninterrupted dark period"
    unit: ""
    wrong:
      - {text: "Flowering is accelerated, because the light adds energy", mistake: "assumes light energy drives the flowering signal"}
      - {text: "No effect, since light does not affect the dark period", mistake: "denies that the light can interrupt the dark period"}
      - {text: "Vernalisation is triggered instantly", mistake: "assigns a cold response to a light flash"}
    explanation: "Short-day plants measure an uninterrupted dark period. A brief light flash in the middle of the night breaks this period and prevents flowering."
    hints:
      - "Think about what the plant measures, which is an uninterrupted dark period."
      - "Consider whether a brief flash of light breaks that period."
      - "Compare the effect with a plant that needs long days."
    diagram: null
    confidence: medium
