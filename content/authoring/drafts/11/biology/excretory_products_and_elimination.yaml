  - topic: excretory_organs
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the structural and functional unit of the kidney?"
    correct: "Nephron"
    unit: ""
    wrong:
      - {text: "Alveolus", mistake: "confuses the lung unit with the kidney unit"}
      - {text: "Glomerulus only", mistake: "treats one part of the unit as the whole unit"}
      - {text: "Ureter", mistake: "confuses the transport duct with the functional unit"}
    explanation: "Each kidney contains many nephrons. Each nephron has a glomerulus and a capsule, followed by tubules that reabsorb and secrete substances into the collecting duct."
    hints:
      - "Each kidney contains many of these microscopic units."
      - "Think of a tubule that starts with a cup-shaped capsule."
      - "The unit begins with a tuft of capillaries inside that capsule."
    diagram: null
    confidence: high
  - topic: excretory_organs
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which paired tube carries urine from each kidney down to the urinary bladder?"
    correct: "Ureter"
    unit: ""
    wrong:
      - {text: "Urethra", mistake: "confuses the outlet tube with the transport tube"}
      - {text: "Renal pelvis only", mistake: "treats the kidney collecting cavity as the transport tube"}
      - {text: "Cloaca", mistake: "uses a common chamber of other animals for the transport tube"}
    explanation: "Each kidney drains into its own ureter, which carries urine by peristalsis to the bladder. The urethra is the single tube that carries urine out of the body."
    hints:
      - "There is one of these tubes for each kidney."
      - "It carries urine downward toward the bladder."
      - "It connects the kidney to the bladder rather than to the outside."
    diagram: null
    confidence: high
  - topic: excretory_organs
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does the ascending limb of the loop of Henle help create a concentrated medulla?"
    correct: "Salt is actively pumped out of the ascending limb, which is impermeable to water, so the surrounding medulla becomes concentrated"
    unit: ""
    wrong:
      - {text: "Water is actively pumped into the descending limb", mistake: "assigns active water transport to the descending limb"}
      - {text: "Glucose is secreted into the medulla from the ascending limb", mistake: "assigns glucose secretion to the loop"}
      - {text: "Urea is absorbed from the collecting duct only", mistake: "reverses the role of urea in the gradient"}
    explanation: "The ascending limb is impermeable to water but actively transports sodium and chloride out. This leaves the interstitial fluid of the medulla concentrated, which lets the collecting duct recover water."
    hints:
      - "Think about which limb of the loop is impermeable to water."
      - "Consider which ions are pumped out to build the gradient."
      - "The gradient is created in the surrounding interstitial fluid."
    diagram: null
    confidence: high
  - topic: excretory_organs
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which sequence correctly traces the path of urine after it leaves the nephron?"
    correct: "Collecting duct, renal pelvis, ureter, urinary bladder, urethra"
    unit: ""
    wrong:
      - {text: "Ureter, collecting duct, renal pelvis, urethra, urinary bladder", mistake: "scrambles the sequence of the outflow tubes"}
      - {text: "Renal pelvis, collecting duct, urinary bladder, ureter, urethra", mistake: "places the bladder before the ureter"}
      - {text: "Urinary bladder, ureter, renal pelvis, collecting duct, urethra", mistake: "reverses the flow from the bladder back to the nephron"}
    explanation: "Urine leaves the nephron through the collecting duct into the renal pelvis, then passes down the ureter to the bladder, and finally leaves the body through the urethra."
    hints:
      - "The collecting duct drains into a central cavity in the kidney."
      - "Urine then moves down a tube toward the bladder."
      - "The last part of the path is the outlet to the outside."
    diagram: "Draw the urinary tract as a sequence of labelled structures: collecting duct, renal pelvis, ureter, urinary bladder and urethra, with arrows showing the direction of urine flow."
    confidence: high
  - topic: excretory_organs
    type: mcq
    difficulty: hard
    role: apply
    stem: "Several nephrons in a kidney are damaged, so the glomerular filtration rate falls. What is the most likely effect?"
    correct: "Waste products such as urea accumulate in the blood"
    unit: ""
    wrong:
      - {text: "Blood glucose falls sharply because filtration increases", mistake: "reverses the effect of reduced filtration"}
      - {text: "Red blood cells are destroyed in large numbers", mistake: "assigns cell destruction to filtration loss"}
      - {text: "The kidney produces more urine than before", mistake: "assumes lower filtration raises urine output"}
    explanation: "The glomerulus removes waste from the blood. When the filtration rate falls, substances such as urea are cleared more slowly and build up in the blood."
    hints:
      - "Think about what the glomerulus removes from the blood."
      - "Consider whether wastes would leave the blood more slowly if filtration falls."
      - "Ask which substances the kidney normally clears from the blood."
    diagram: null
    confidence: high
  - topic: excretory_organs
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A surgeon removes one kidney from a healthy adult. What is the most likely outcome?"
    correct: "The remaining kidney enlarges its workload, and the person usually keeps normal filtration"
    unit: ""
    wrong:
      - {text: "The person cannot produce any urine at all", mistake: "assumes one kidney is needed entirely for urine"}
      - {text: "The blood becomes highly acidic within minutes", mistake: "assumes instant failure after one kidney is removed"}
      - {text: "The bladder begins to filter blood", mistake: "assigns filtration to the bladder"}
    explanation: "A healthy person can live with one kidney. The remaining kidney increases its filtration and tubular work, so overall function is usually maintained."
    hints:
      - "Consider whether one kidney can take on more of the workload."
      - "Think about how much reserve a healthy kidney has."
      - "Ask which organ normally does the filtering, and whether it can be done by another."
    diagram: "Draw a body outline with one kidney removed and the remaining kidney enlarged in proportion, labelling the ureter, bladder and remaining nephrons."
    confidence: medium
  - topic: urine_formation
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the first step of urine formation in the nephron?"
    correct: "Ultrafiltration in the glomerulus"
    unit: ""
    wrong:
      - {text: "Reabsorption in the proximal convoluted tubule", mistake: "places reabsorption before filtration"}
      - {text: "Secretion in the collecting duct", mistake: "places secretion at the start of the process"}
      - {text: "Concentration in the medulla", mistake: "places the final concentrating step first"}
    explanation: "Ultrafiltration forces plasma through the glomerular capillary wall into Bowman's capsule, producing the filtrate. Reabsorption and secretion come afterwards in the tubules."
    hints:
      - "Think about the step where blood is pushed through a fine filter."
      - "This step takes place at the start of the nephron."
      - "The filter is the capillary wall together with the cells that line the capsule."
    diagram: null
    confidence: high
  - topic: urine_formation
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which part of the nephron reabsorbs most of the filtered glucose and water?"
    correct: "Proximal convoluted tubule"
    unit: ""
    wrong:
      - {text: "Distal convoluted tubule", mistake: "places bulk reabsorption in a later segment"}
      - {text: "Collecting duct", mistake: "places bulk reabsorption in the final duct"}
      - {text: "Bowman's capsule", mistake: "assigns reabsorption to the filtering structure"}
    explanation: "The proximal convoluted tubule has microvilli and a large surface area, and it reabsorbs most of the glucose, amino acids, sodium and water that were filtered."
    hints:
      - "Think about the first tubule that follows the capsule."
      - "This segment is highly folded and has many microvilli."
      - "It reabsorbs most of what was filtered from the blood."
    diagram: null
    confidence: high
  - topic: urine_formation
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does glucose appearing in urine indicate a problem?"
    correct: "Glucose is normally fully reabsorbed, so its presence suggests blood glucose exceeds the reabsorption capacity"
    unit: ""
    wrong:
      - {text: "Glucose is normally secreted into the urine in large amounts", mistake: "reverses the normal handling of glucose"}
      - {text: "Glucose in urine shows that the kidney is making insulin", mistake: "confuses glucose excretion with hormone production"}
      - {text: "Glucose is a waste product that should always be present in urine", mistake: "treats glucose as a waste product"}
    explanation: "Under normal conditions the proximal tubule reabsorbs all filtered glucose. When blood glucose is high enough to exceed the transport capacity, glucose spills into the urine."
    hints:
      - "Think about what normal reabsorption should remove from the filtrate."
      - "Consider which blood level would exceed the reabsorption capacity."
      - "The problem is a blood sugar level that is too high for the kidneys to handle."
    diagram: null
    confidence: high
  - topic: urine_formation
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which process moves a substance from the blood into the tubular fluid, in addition to filtration?"
    correct: "Tubular secretion"
    unit: ""
    wrong:
      - {text: "Ultrafiltration", mistake: "assigns the filtering step to the tubule"}
      - {text: "Osmosis across the capsule", mistake: "assigns a passive water movement as the transfer"}
      - {text: "Reabsorption", mistake: "reverses the direction of movement"}
    explanation: "Tubular secretion actively moves substances such as hydrogen ions, potassium and some drugs from the peritubular blood into the tubular fluid, removing them from the body."
    hints:
      - "Think about the direction of movement, from the blood into the tubule."
      - "The process moves material into the tubular lumen."
      - "The process is active for some ions and for certain drugs."
    diagram: "Draw a nephron tubule beside a peritubular capillary, with arrows showing filtration into the capsule, reabsorption back into the blood, and secretion from the blood into the tubule."
    confidence: high
  - topic: urine_formation
    type: numeric
    difficulty: hard
    role: apply
    stem: "A person filters 180 L of fluid per day through the glomeruli, and 99 percent of the filtrate is reabsorbed. How many litres of urine are produced per day?"
    correct: "1.8"
    unit: "L"
    wrong: []
    explanation: "The unreabsorbed fraction is 1 percent of 180 litres, which is 1.8 litres of urine per day."
    hints:
      - "Calculate the fraction that is not reabsorbed."
      - "Multiply the filtrate volume by the fraction that is left after reabsorption."
      - "Convert the percentage to a decimal first."
    diagram: null
    confidence: high
  - topic: urine_formation
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A drug blocks active sodium reabsorption in the proximal tubule. What is the most likely result?"
    correct: "More sodium and water remain in the tubular fluid, so urine volume increases"
    unit: ""
    wrong:
      - {text: "Less sodium is filtered at the glomerulus", mistake: "assumes the drug blocks filtration"}
      - {text: "Blood pressure falls because the kidney stops making urine", mistake: "assumes the kidney stops producing urine"}
      - {text: "Urea is reabsorbed more strongly in response", mistake: "assumes a compensatory change in urea handling"}
    explanation: "Sodium drives water reabsorption in the proximal tubule. Blocking sodium transport leaves more water in the filtrate, which raises urine output."
    hints:
      - "Think about what drives water to move back into the blood in this segment."
      - "Consider whether blocking the transporter changes filtration at the glomerulus."
      - "Ask what happens to the water that follows the sodium."
    diagram: "Draw a proximal tubule cell with the sodium pump blocked by an X, and arrows showing sodium and water staying in the lumen."
    confidence: medium
  - topic: regulation_kidney_function
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which pituitary hormone increases water reabsorption in the collecting duct?"
    correct: "Antidiuretic hormone"
    unit: ""
    wrong:
      - {text: "Insulin", mistake: "assigns a blood sugar hormone to water balance"}
      - {text: "Thyroxine", mistake: "assigns a metabolic hormone to water balance"}
      - {text: "Oxytocin", mistake: "assigns a labour hormone to water balance"}
    explanation: "ADH, also called vasopressin, is released from the posterior pituitary and makes the collecting duct more permeable to water, which concentrates the urine."
    hints:
      - "This hormone is released from the posterior pituitary."
      - "Think about the hormone that makes the collecting duct more permeable to water."
      - "It is also called vasopressin."
    diagram: null
    confidence: high
  - topic: regulation_kidney_function
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which steroid hormone from the adrenal cortex increases sodium reabsorption in the distal tubule?"
    correct: "Aldosterone"
    unit: ""
    wrong:
      - {text: "Antidiuretic hormone", mistake: "assigns the water hormone to the sodium step"}
      - {text: "Oxytocin", mistake: "assigns a pituitary hormone with a different role"}
      - {text: "Glucagon", mistake: "assigns a pancreatic glucose hormone to sodium control"}
    explanation: "Aldosterone acts on the distal tubule and collecting duct to increase sodium reabsorption and potassium secretion, which helps retain salt and water when blood pressure is low."
    hints:
      - "This steroid hormone is released from the adrenal cortex."
      - "It acts on the distal tubule and collecting duct to retain salt."
      - "Think about the hormone that increases sodium retention when blood pressure falls."
    diagram: null
    confidence: high
  - topic: regulation_kidney_function
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does a fall in blood volume increase renin secretion from the kidney?"
    correct: "Reduced perfusion of the kidney triggers juxtaglomerular cells to release renin, which starts the angiotensin pathway"
    unit: ""
    wrong:
      - {text: "Increased blood volume triggers renin release", mistake: "reverses the stimulus for renin"}
      - {text: "The liver releases renin in response to high sodium", mistake: "assigns renin production to the liver"}
      - {text: "Renin directly stops water reabsorption in the collecting duct", mistake: "assigns renin a direct water-blocking role"}
    explanation: "Low renal perfusion stimulates juxtaglomerular cells to secrete renin. Renin converts angiotensinogen into angiotensin I, which is converted to angiotensin II, a vasoconstrictor that also stimulates aldosterone."
    hints:
      - "Think about the cells near the glomerulus that sense pressure."
      - "Consider the effect of low blood pressure on the kidney's blood supply."
      - "The cascade ends with a hormone that narrows blood vessels."
    diagram: null
    confidence: high
  - topic: regulation_kidney_function
    type: mcq
    difficulty: medium
    role: procedure
    stem: "What is the effect of atrial natriuretic peptide on the kidney?"
    correct: "It promotes sodium and water excretion, which lowers blood volume"
    unit: ""
    wrong:
      - {text: "It increases sodium reabsorption and raises blood volume", mistake: "reverses the action of the hormone"}
      - {text: "It raises the rate of glucose absorption in the tubules", mistake: "assigns a glucose role to the peptide"}
      - {text: "It stops all urine formation", mistake: "assumes the hormone halts filtration completely"}
    explanation: "The heart releases atrial natriuretic peptide when the atria are stretched by high volume. It reduces sodium reabsorption and dilates the afferent arterioles, so more sodium and water are lost in urine."
    hints:
      - "Think about the hormone released by the heart when the atria are stretched."
      - "Consider whether the hormone promotes retention or loss of salt."
      - "The hormone opposes the effect of aldosterone."
    diagram: null
    confidence: medium
  - topic: regulation_kidney_function
    type: mcq
    difficulty: hard
    role: apply
    stem: "A person drinks a large volume of water. What happens to ADH secretion and urine volume?"
    correct: "ADH secretion falls and urine volume increases, because the collecting duct becomes less permeable to water"
    unit: ""
    wrong:
      - {text: "ADH rises and urine volume falls sharply", mistake: "reverses the osmotic response to water intake"}
      - {text: "ADH rises and urine volume increases", mistake: "pairs an increased hormone with the wrong urine change"}
      - {text: "ADH falls and urine volume falls too", mistake: "pairs a lower hormone with reduced urine output"}
    explanation: "Drinking water dilutes the blood, which lowers ADH secretion. The collecting duct becomes less permeable, so more dilute urine is produced and the water load is removed."
    hints:
      - "Think about how water intake changes the concentration of the blood."
      - "Consider how the collecting duct responds when ADH is low."
      - "Ask what happens to the volume of dilute urine when water is in excess."
    diagram: null
    confidence: high
  - topic: regulation_kidney_function
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A patient has a tumour that secretes excess ADH. Which clinical picture is most likely?"
    correct: "Water retention with low blood sodium, and small volumes of concentrated urine"
    unit: ""
    wrong:
      - {text: "Excessive dilute urine with concentrated blood", mistake: "reverses the action of ADH"}
      - {text: "Raised blood sodium with large volumes of dilute urine", mistake: "reverses both the sodium and the urine changes"}
      - {text: "Normal water balance with high blood glucose", mistake: "assigns the problem to glucose rather than water"}
    explanation: "Excess ADH causes water retention, which dilutes the blood and lowers its sodium concentration. The urine becomes concentrated and its volume falls."
    hints:
      - "Think about what ADH does to water reabsorption in the collecting duct."
      - "Consider how retained water affects the sodium concentration in the blood."
      - "The urine is smaller in volume but more concentrated."
    diagram: null
    confidence: medium
