  - topic: neuron_structure
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the approximate resting membrane potential of a typical neuron?"
    correct: "-70 mV"
    unit: ""
    wrong:
      - {text: "+40 mV", mistake: "confuses resting potential with the peak of an impulse"}
      - {text: "0 mV", mistake: "assumes the membrane is electrically neutral at rest"}
      - {text: "-20 mV", mistake: "uses a value near the firing threshold instead of rest"}
    explanation: "At rest the inside of the neuron is about 70 mV negative relative to the outside, maintained by the sodium-potassium pump and leaky potassium channels."
    hints:
      - "At rest the inside of the membrane is negative relative to the outside."
      - "Think about the potassium leak that helps make the inside negative."
      - "The value lies in the negative tens of millivolts."
