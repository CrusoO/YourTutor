  - topic: neuron_structure
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is the axon membrane at rest more permeable to potassium than to sodium?"
    correct: "Open potassium leak channels let K+ leave down its gradient more readily than Na+ can enter, so the inside becomes negative"
    unit: ""
    wrong:
      - {text: "Sodium channels are fully open at rest", mistake: "reverses the resting permeability of the two ions"}
      - {text: "Potassium is actively pumped into the axon at rest", mistake: "assigns active potassium pumping inward at rest"}
      - {text: "Resting membranes have no ion channels at all", mistake: "denies the channels that set resting permeability"}
    explanation: "At rest the membrane contains many open potassium leak channels and few open sodium channels. Potassium leaves the cell down its gradient, which makes the inside negative."
    hints:
      - "Think about which ion channels are open at rest."
      - "Consider which ion is more abundant inside the cell and how it leaks out."
      - "Compare the permeability of the membrane to each of the two ions."
    diagram: null
    confidence: high
  - topic: neuron_structure
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which structure insulates the axon in many neurons and allows the impulse to travel faster?"
    correct: "Myelin sheath"
    unit: ""
    wrong:
      - {text: "Dendritic spine", mistake: "assigns insulation to the receiving branches"}
      - {text: "Synaptic cleft", mistake: "assigns insulation to the gap between neurons"}
      - {text: "Cell wall", mistake: "assigns a plant structure to the neuron"}
    explanation: "Myelin is a fatty layer formed by glial cells that wraps the axon in segments. The gaps between segments, the nodes of Ranvier, are where the impulse is regenerated."
    hints:
      - "Think about a fatty layer that wraps the axon in segments."
      - "The gaps in this layer are the nodes of Ranvier."
      - "The sheath is made by glial cells rather than by the neuron itself."
    diagram: "Draw a myelinated neuron with the cell body, dendrites, a myelinated axon, nodes of Ranvier and axon terminals, labelled in order."
    confidence: high
  - topic: neuron_structure
    type: numeric
    difficulty: hard
    role: apply
    stem: "A neuron has a resting potential of -70 mV and a firing threshold of -55 mV. By how many mV must the membrane depolarise to reach threshold?"
    correct: "15"
    unit: "mV"
    wrong: []
    explanation: "The change needed is the threshold minus the resting value, which is -55 minus (-70), giving 15 mV of depolarisation."
    hints:
      - "Subtract the resting value from the threshold value, keeping track of the signs."
      - "Think about the distance between the two values on the voltage scale."
      - "The answer is a positive change in voltage."
    diagram: null
    confidence: high
  - topic: neuron_structure
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A drug keeps voltage-gated sodium channels in an open state in an axon. What is the most likely effect?"
    correct: "The membrane stays depolarised, so it cannot repolarise and normal signalling is disrupted"
    unit: ""
    wrong:
      - {text: "The axon becomes permanently hyperpolarised", mistake: "reverses the direction of sodium flow"}
      - {text: "The neuron fires more often with no change in the spike", mistake: "ignores the failure to repolarise"}
      - {text: "Potassium channels close immediately in response", mistake: "assumes the drug triggers potassium closure"}
    explanation: "Sodium channels must inactivate for the membrane to repolarise. Holding them open keeps sodium flowing in, so the membrane cannot return to rest and the neuron cannot send normal impulses."
    hints:
      - "Think about what must happen to sodium channels for the membrane to return to rest."
      - "Consider whether the sodium channels can close again under the drug."
      - "Ask what the membrane does when sodium keeps entering."
    diagram: "Draw the membrane voltage over time for a normal spike and for a spike with persistently open sodium channels, labelling the failure to return to rest."
    confidence: medium
  - topic: nerve_impulse
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the name of the all-or-none electrical event that travels along an axon?"
    correct: "Action potential"
    unit: ""
    wrong:
      - {text: "Resting potential", mistake: "confuses the steady state with the travelling impulse"}
      - {text: "Synaptic delay", mistake: "confuses the transmission pause with the impulse"}
      - {text: "Graded potential only", mistake: "assumes graded potentials are all-or-none events"}
    explanation: "An action potential is a rapid reversal of the membrane voltage that is all-or-none and regenerates along the axon, so the signal does not weaken as it travels."
    hints:
      - "Think about the rapid reversal of the membrane voltage."
      - "The event is all-or-none and regenerates along the axon."
      - "It is the signal that moves along a nerve fibre."
    diagram: null
    confidence: high
  - topic: nerve_impulse
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which ion's rapid influx causes the rising phase of an action potential?"
    correct: "Sodium"
    unit: ""
    wrong:
      - {text: "Potassium", mistake: "assigns the falling phase ion to the rising phase"}
      - {text: "Chloride", mistake: "assigns an anion with a different role to the rising phase"}
      - {text: "Magnesium", mistake: "assigns an unrelated divalent ion to the impulse"}
    explanation: "Voltage-gated sodium channels open at threshold and sodium rushes in down its gradient, producing the rising phase. Potassium efflux later causes repolarisation."
    hints:
      - "The rising phase is driven by an ion that is much more concentrated outside the cell."
      - "Think about the channels that open first during depolarisation."
      - "The channels for this ion open rapidly and then inactivate."
    diagram: null
    confidence: high
  - topic: nerve_impulse
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does the action potential travel in only one direction along an axon?"
    correct: "The membrane behind the wave is still inactivated after the spike and cannot be excited again yet"
    unit: ""
    wrong:
      - {text: "Action potentials travel equally well in both directions", mistake: "assumes conduction is symmetric"}
      - {text: "Nerves are too short for backward flow to matter", mistake: "assigns directionality to nerve length"}
      - {text: "Myelin alone blocks the backward signal", mistake: "assigns the directional role to myelin only"}
    explanation: "After a spike the sodium channels behind the wave are inactivated and the membrane is hyperpolarised, so that region cannot fire again immediately. The impulse therefore moves forward only."
    hints:
      - "Think about what the membrane just behind the impulse is doing."
      - "Consider the state of the sodium channels in the membrane just behind the wave."
      - "Ask which region cannot be re-excited right after a spike."
    diagram: null
    confidence: high
  - topic: nerve_impulse
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which order describes the events at one point on the membrane during an action potential?"
    correct: "Depolarisation by sodium influx, then repolarisation by potassium efflux, then hyperpolarisation"
    unit: ""
    wrong:
      - {text: "Repolarisation, then depolarisation, then hyperpolarisation", mistake: "places repolarisation before depolarisation"}
      - {text: "Potassium influx, then sodium efflux, then depolarisation", mistake: "reverses the ions and the direction of flow"}
      - {text: "Hyperpolarisation, then depolarisation, then repolarisation", mistake: "places the overshoot first"}
    explanation: "The membrane first depolarises as sodium enters, then repolarises as potassium leaves, and often overshoots slightly into hyperpolarisation before returning to rest."
    hints:
      - "Start with the event that makes the inside less negative."
      - "Next consider the event in which potassium leaves the cell."
      - "The final event is an overshoot below the resting potential."
    diagram: "Draw one spike of the membrane voltage over time, labelling depolarisation, repolarisation and the hyperpolarisation overshoot, with the ion flow for each phase."
    confidence: high
  - topic: nerve_impulse
    type: mcq
    difficulty: hard
    role: apply
    stem: "Local anaesthetics block voltage-gated sodium channels in a nerve. What is the most direct consequence for nerve conduction?"
    correct: "Action potentials fail to start or to propagate, so the pain signal is blocked"
    unit: ""
    wrong:
      - {text: "Potassium channels open to stop the impulse", mistake: "assigns the stopping role to potassium"}
      - {text: "The nerve fires twice as fast", mistake: "reverses the effect of blocking the channel"}
      - {text: "Myelin thickens rapidly to compensate", mistake: "assigns a rapid structural change to the drug effect"}
    explanation: "Sodium entry is needed to generate an action potential. Blocking the channels prevents the depolarising phase, so the impulse cannot start or travel, and the sensation is not transmitted."
    hints:
      - "Think about which channel the anaesthetic targets."
      - "Consider whether an impulse can be generated without sodium entry."
      - "Ask what the nerve needs in order to carry a signal along the axon."
    diagram: null
    confidence: high
  - topic: nerve_impulse
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A myelinated axon conducts impulses faster than an unmyelinated axon of the same diameter. What is the main reason?"
    correct: "Saltatory conduction lets the impulse jump from one node of Ranvier to the next"
    unit: ""
    wrong:
      - {text: "Myelin has a higher sodium content than the axon membrane", mistake: "assigns ion content to myelin as the cause"}
      - {text: "Unmyelinated axons have no ion channels", mistake: "denies channels in unmyelinated fibres"}
      - {text: "Myelin releases a neurotransmitter that speeds the impulse", mistake: "assigns a chemical signal to myelin"}
    explanation: "Myelin insulates the axon so that the impulse regenerates only at the nodes of Ranvier. This saltatory conduction covers the axon faster than a continuous spread along the membrane."
    hints:
      - "Think about where the voltage-gated channels are concentrated in a myelinated fibre."
      - "Consider how the impulse moves between the gaps in the sheath."
      - "The movement is discontinuous rather than step by step along the membrane."
    diagram: "Draw a myelinated axon with nodes of Ranvier marked, showing the impulse jumping from node to node with arrows, and label the insulated internodes."
    confidence: high
