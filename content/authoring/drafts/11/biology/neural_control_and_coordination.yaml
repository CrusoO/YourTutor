  - topic: brain_and_spinal_cord
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A patient with cerebellar damage has trouble touching a finger to the nose. Which deficit best explains this?"
    correct: "Impaired coordination, with the movement overshooting or shaking near the target"
    unit: ""
    wrong:
      - {text: "Loss of sensation in the fingertip", mistake: "assigns touch loss to the cerebellum"}
      - {text: "Paralysis of the arm from spinal cord damage", mistake: "assigns a spinal cause to a cerebellar signs"}
      - {text: "Loss of memory for the movement", mistake: "assigns memory storage to the cerebellum"}
    explanation: "The cerebellum compares intended and actual movement and corrects errors during the movement. Damage leads to dysmetria, in which the limb overshoots or trembles near the target."
    hints:
      - "Think about what the cerebellum does during an ongoing movement."
      - "Consider what happens to a movement when its error correction is damaged."
      - "Ask whether the fingertip sensation or the strength of the arm is primarily affected."
