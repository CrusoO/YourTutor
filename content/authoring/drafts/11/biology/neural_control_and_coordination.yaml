  - topic: reflex_arc_11
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is a reflex response faster than a voluntary action?"
    correct: "Fewer synapses are involved, because the response is processed in the spinal cord rather than the brain"
    unit: ""
    wrong:
      - {text: "Reflex signals travel faster in the brain", mistake: "places the reflex in the brain"}
      - {text: "Reflexes use no neurons at all", mistake: "denies that reflexes involve neurons"}
      - {text: "Voluntary actions travel through the heart", mistake: "assigns voluntary signals to the circulation"}
    explanation: "A reflex is processed in the spinal cord, so the signal makes only a short trip and passes through fewer synapses. The voluntary pathway must reach the brain and return, which takes longer."
    hints:
      - "Think about how far the signal must travel before a response occurs."
      - "Consider where the processing happens in a reflex."
