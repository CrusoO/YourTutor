  - topic: reflex_arc_11
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which order describes a withdrawal reflex after a painful stimulus to the foot?"
    correct: "Receptor, sensory neuron, spinal interneuron, motor neuron, effector muscle"
    unit: ""
    wrong:
      - {text: "Effector muscle, motor neuron, interneuron, sensory neuron, receptor", mistake: "reverses the whole arc"}
      - {text: "Receptor, motor neuron, interneuron, sensory neuron, muscle", mistake: "swaps the sensory and motor neurons"}
      - {text: "Sensory neuron, receptor, motor neuron, interneuron, muscle", mistake: "places the receptor after the neuron"}
    explanation: "The stimulus is detected by a receptor, the sensory neuron carries it to the cord, an interneuron integrates it, and a motor neuron signals the muscle to withdraw the foot."
    hints:
