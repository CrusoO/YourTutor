  - topic: vertebrate_groups
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student compares a shark, a frog and a lizard. Which feature should be used first to place the shark in its class?"
    correct: "Presence of a cartilaginous skeleton and gill slits"
    unit: ""
    wrong:
      - {text: "The length of the animal", mistake: "uses size, which varies within every class"}
      - {text: "The colour of the animal", mistake: "uses colour, which is not a diagnostic class feature"}
      - {text: "The place where it was caught", mistake: "uses habitat rather than anatomy"}
    explanation: "Sharks belong to the class of cartilaginous fishes, identified by a skeleton made of cartilage and gill openings. These anatomical features separate them from the amphibians and reptiles."
    hints:
      - "Start with the skeleton and the breathing structures."
      - "Think about what the animal's body is supported by."
      - "Look for anatomical features rather than size or habitat."
    diagram: null
    confidence: high
  - topic: vertebrate_groups
    type: mcq
    difficulty: hard
    role: apply
    stem: "A vertebrate has moist skin, lungs and eggs laid without a shell in water. Which class is most consistent with these features?"
    correct: "Amphibia"
    unit: ""
    wrong:
      - {text: "Reptilia", mistake: "assumes all lung-breathing vertebrates are reptiles"}
      - {text: "Aves", mistake: "associates lungs with birds without considering the skin"}
      - {text: "Mammalia", mistake: "assumes all vertebrates with lungs are mammals"}
    explanation: "Amphibians combine moist skin, lungs in adults, and eggs without a hard shell laid in water. Reptiles have dry scaly skin and shelled eggs, which do not fit this set."
    hints:
      - "Check the skin first, since moist skin narrows the choice quickly."
      - "Ask whether the eggs have a shell and where they are laid."
      - "Compare the features with the classes whose skin is dry or covered in feathers."
    diagram: null
    confidence: high
  - topic: vertebrate_groups
    type: mcq
    difficulty: hard
    role: transfer
    stem: "An animal lays eggs with leathery shells on land, has scales and breathes with lungs throughout life. Which conclusion is best supported?"
    correct: "It most likely belongs to Reptilia, which has scales and land-laid shelled eggs"
    unit: ""
    wrong:
      - {text: "It is a bird because it lays eggs", mistake: "treats egg-laying as a bird-only feature"}
      - {text: "It is an amphibian because it lives on land", mistake: "links habitat to amphibian status"}
      - {text: "It is a fish because it has scales", mistake: "assigns scales to fish alone"}
    explanation: "Scaly skin, lung breathing throughout life and land-laid shelled eggs are the defining features of reptiles. Egg-laying alone does not define birds, and scales are not restricted to fish."
    hints:
      - "Check the skin, the breathing method and the egg structure together."
      - "Ask whether the egg-laying feature is shared by more than one class."
      - "Compare the set of features with the reptile group's defining traits."
    diagram: null
    confidence: medium
