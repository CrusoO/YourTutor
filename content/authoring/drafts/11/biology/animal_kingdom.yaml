items:
  - topic: basis_of_animal_classification
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which body symmetry is shown by a starfish with five arms radiating from a central disc?"
    correct: "Radial symmetry"
    unit: ""
    wrong:
      - {text: "Bilateral symmetry", mistake: "treats a symmetrical arrangement around one plane as the same thing"}
      - {text: "Asymmetry", mistake: "assumes an animal with several arms has no symmetry"}
      - {text: "Spiral symmetry", mistake: "confuses the shape of a shell with the body arrangement"}
    explanation: "Starfish show radial symmetry, with parts arranged around a central axis. Bilateral animals instead have a single plane dividing them into mirror halves."
    hints:
      - "Imagine cutting the body through the centre in many directions and getting similar halves."
      - "The arms radiate outward from one centre."
      - "Think about the arrangement of parts around a single central point."
    diagram: "Draw a starfish from above with five arms radiating from a central disc, marking the central axis and the arms."
    confidence: high
  - topic: basis_of_animal_classification
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which term describes the body cavity that is completely lined by mesoderm?"
    correct: "Coelom"
    unit: ""
    wrong:
      - {text: "Pseudocoelom", mistake: "confuses a partly lined cavity with a fully lined one"}
      - {text: "Haemocoel", mistake: "uses the name of an open blood cavity"}
      - {text: "Vacuole", mistake: "uses a plant cell structure instead of a body cavity"}
    explanation: "A coelom is a true body cavity completely lined by mesoderm, which is found in many higher invertebrates and vertebrates."
    hints:
      - "The cavity is fully lined by a layer that comes from the middle germ layer."
      - "Think about the cavity that organs sit inside in many animals."
      - "The term refers to a true body cavity rather than an open space around the blood."
    diagram: null
    confidence: high
  - topic: basis_of_animal_classification
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are animals with three germ layers called triploblastic?"
    correct: "Their embryo develops ectoderm, mesoderm and endoderm as distinct layers"
    unit: ""
    wrong:
      - {text: "They have three body segments in every case", mistake: "confuses germ layers with body segments"}
      - {text: "They have three sets of chromosomes", mistake: "mixes up germ layers with genetic ploidy"}
      - {text: "They reproduce through three separate life stages", mistake: "confuses germ layers with life stages"}
    explanation: "Triploblastic animals develop three embryonic germ layers that give rise to their tissues and organs. The middle layer is the mesoderm, which often forms muscles and the coelom lining."
    hints:
      - "Think about the layers formed in the early embryo, not the body parts of the adult."
      - "Consider what the middle layer forms in many animals."
      - "The term is about embryonic tissue layers rather than chromosomes."
    diagram: null
    confidence: high
  - topic: basis_of_animal_classification
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student is classifying an unknown animal and checks features in this order: symmetry, body layers, then coelom. Which feature should be checked first?"
    correct: "Symmetry of the body"
    unit: ""
    wrong:
      - {text: "The presence of a coelom", mistake: "starts with the most advanced feature"}
      - {text: "The number of germ layers", mistake: "skips the broadest level of body plan"}
      - {text: "The colour of the animal", mistake: "uses an external trait that is not a classification feature"}
    explanation: "Classification of body plan starts with symmetry, which separates the broad groups, and then the number of germ layers and coelom presence refine the placement."
    hints:
      - "Start with the feature that divides animals into the broadest groups."
      - "Think about whether the body is arranged around a centre or along one axis."
      - "The order in the question already lists the first feature for you to check."
    diagram: null
    confidence: medium
  - topic: basis_of_animal_classification
    type: mcq
    difficulty: hard
    role: apply
    stem: "An animal has bilateral symmetry, three germ layers and a true coelom lined by mesoderm. Which group does it most likely belong to?"
    correct: "A coelomate bilaterian such as an earthworm or a vertebrate"
    unit: ""
    wrong:
      - {text: "A sponge with no tissues", mistake: "assumes all complex animals are simple sponge-like forms"}
      - {text: "A jellyfish with radial symmetry", mistake: "ignores the bilateral symmetry in the description"}
      - {text: "A flatworm with no body cavity", mistake: "assumes all worms lack a coelom"}
    explanation: "Bilateral symmetry, triploblastic development and a true coelom together describe coelomate bilaterians, a group that includes earthworms and vertebrates."
    hints:
      - "Start by checking the symmetry, then the germ layers, then the cavity."
      - "Sponges and jellyfish do not share the combination of these features."
      - "Think about the group that carries all three features together."
    diagram: "Draw a cross section of a bilateral animal showing three germ layers and a coelom lined by mesoderm, with labels for ectoderm, mesoderm, endoderm and coelom."
    confidence: medium
  - topic: basis_of_animal_classification
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Two animals look alike, yet one is a bilateral coelomate and the other is a radial animal with no true coelom. Which conclusion is best supported?"
    correct: "They differ in body plan features, so their overall similarity does not place them together"
    unit: ""
    wrong:
      - {text: "They must be close relatives because they look similar", mistake: "uses external appearance as proof of relationship"}
      - {text: "They must have the same germ layers", mistake: "assumes appearance reflects embryonic structure"}
      - {text: "They must both be vertebrates", mistake: "assumes similar shape implies vertebrate status"}
    explanation: "Classification relies on structural features such as symmetry, germ layers and the coelom. Two animals that look alike can still differ in these basic plan features."
    hints:
      - "Ask whether appearance or body plan features are the better guide."
      - "Think about which features reflect embryonic development."
      - "Consider whether a resemblance can arise without shared ancestry."
    diagram: null
    confidence: medium
  - topic: invertebrate_groups
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which invertebrate phylum has a jointed body with an exoskeleton and many jointed legs?"
    correct: "Arthropoda"
    unit: ""
    wrong:
      - {text: "Mollusca", mistake: "confuses a soft body with a jointed one"}
      - {text: "Annelida", mistake: "confuses segmentation with jointed legs"}
      - {text: "Porifera", mistake: "assumes all invertebrates have jointed bodies"}
    explanation: "Arthropods have a chitinous exoskeleton, segmented bodies and jointed appendages, which includes insects, spiders and crustaceans."
    hints:
      - "Think of insects and spiders, which share the same group."
      - "The group name refers to jointed appendages."
      - "The hard outer covering is made of a material that fungi also use in their walls."
    diagram: null
    confidence: high
  - topic: invertebrate_groups
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which phylum is characterised by a soft body, a mantle, and often a shell, as in snails and mussels?"
    correct: "Mollusca"
    unit: ""
    wrong:
      - {text: "Echinodermata", mistake: "confuses a spiny skin with a mantle and shell"}
      - {text: "Platyhelminthes", mistake: "assumes flat bodies always carry shells"}
      - {text: "Nematoda", mistake: "confuses a round body with a shelled body"}
    explanation: "Molluscs have a soft unsegmented body, a muscular foot and a mantle that often secretes a shell. Snails, clams and octopuses belong to this phylum."
    hints:
      - "Snails and mussels are common members of the group."
      - "The body is soft and often protected by an external covering."
      - "Think about a flexible layer that secretes the shell."
    diagram: null
    confidence: high
  - topic: invertebrate_groups
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do echinoderms show radial symmetry as adults even though their larvae are bilateral?"
    correct: "Their adult body plan changes during development from bilateral larva to radial adult"
    unit: ""
    wrong:
      - {text: "They are not animals at all", mistake: "denies that echinoderms are animals"}
      - {text: "Their larvae are always radial too", mistake: "reverses the larval symmetry"}
      - {text: "Radial symmetry is a result of living in water", mistake: "assigns symmetry to habitat alone"}
    explanation: "Echinoderm larvae are bilaterally symmetrical, but the adult form develops a radial arrangement of arms around a central axis. This shift is one feature used to place echinoderms in their own phylum."
    hints:
      - "Compare the larval form with the adult form."
      - "Think about how the body changes during growth."
      - "Consider whether symmetry can change during the life cycle."
    diagram: null
    confidence: medium
  - topic: invertebrate_groups
    type: numeric
    difficulty: medium
    role: procedure
    stem: "Three invertebrate groups are arthropods, molluscs and annelids. How many of these three groups have a body divided into repeated segments?"
    correct: "2"
    unit: ""
    wrong: []
    explanation: "Arthropods and annelids are both segmented, while molluscs have an unsegmented soft body. That gives two segmented groups."
    hints:
      - "Check each of the three groups for segmentation separately."
      - "Think about which of the three has a soft unsegmented body."
      - "Count only the groups whose body is divided into repeated units."
