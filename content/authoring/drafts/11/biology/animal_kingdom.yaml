    confidence: high
  - topic: invertebrate_groups
    type: mcq
    difficulty: hard
    role: apply
    stem: "A newly found invertebrate has a segmented body, jointed legs and a hard external skeleton. Which phylum is the most likely match?"
    correct: "Arthropoda"
    unit: ""
    wrong:
      - {text: "Annelida", mistake: "ignores the jointed legs and hard exoskeleton"}
      - {text: "Cnidaria", mistake: "assumes stinging animals are segmented"}
      - {text: "Platyhelminthes", mistake: "assumes flat bodies match every invertebrate"}
    explanation: "Jointed appendages together with a hard exoskeleton and a segmented body are the defining features of arthropods. Annelids are segmented but lack jointed legs."
    hints:
      - "Check the jointed legs and the hard outer covering first."
      - "Segmented bodies alone do not settle the phylum."
      - "Think about the group whose features include all three described."
    diagram: null
    confidence: high
  - topic: invertebrate_groups
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A researcher says that all animals with a shell are molluscs. Which correction is most accurate?"
    correct: "Some animals with shells, such as certain arthropods and brachiopods, belong to other groups"
    unit: ""
    wrong:
      - {text: "Shells are found only in molluscs in every case", mistake: "assumes shells are unique to one phylum"}
      - {text: "Shells are a feature of vertebrates only", mistake: "moves a shell feature to the wrong animal group"}
      - {text: "A shell means the animal has a coelom", mistake: "links a shell with the body cavity"}
    explanation: "Shells evolved in several separate lineages, so a shell alone does not prove molluscan ancestry. Classification uses a set of features, not a single external structure."
    hints:
      - "Ask whether a single external feature is enough to assign a phylum."
      - "Think about how many distinct groups have a protective covering."
      - "Consider which combination of features defines the mollusc body plan."
    diagram: null
    confidence: medium
  - topic: vertebrate_groups
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which vertebrate class has skin covered with feathers and forelimbs modified into wings?"
    correct: "Aves"
    unit: ""
    wrong:
      - {text: "Reptilia", mistake: "confuses scaly skin with feathers"}
      - {text: "Mammalia", mistake: "assumes that flying animals are mammals"}
      - {text: "Amphibia", mistake: "treats moist skin as a feather feature"}
    explanation: "Birds form the class Aves. They have feathers, a beak and forelimbs modified as wings, and most species can fly."
    hints:
      - "Think about the animals that have feathers and lay hard-shelled eggs."
      - "The group includes sparrows and eagles."
      - "Look for the class whose skin is covered with a structure that is light and flight-related."
    diagram: null
    confidence: high
  - topic: vertebrate_groups
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which vertebrate class is characterised by skin with moist glands and a larval stage that lives in water?"
    correct: "Amphibia"
    unit: ""
    wrong:
      - {text: "Pisces", mistake: "confuses water-living larvae with fish that live in water all their lives"}
      - {text: "Reptilia", mistake: "confuses dry scaly skin with moist skin"}
      - {text: "Aves", mistake: "assumes all water-living animals are birds"}
    explanation: "Amphibians such as frogs and salamanders have moist permeable skin and typically pass through an aquatic larval stage before metamorphosing."
    hints:
      - "Frogs and salamanders are typical members of this class."
      - "Think about animals that develop from a water-living stage into an adult that can live on land."
      - "The skin of these animals is moist rather than scaly."
    diagram: null
    confidence: high
  - topic: vertebrate_groups
    type: mcq
    difficulty: medium
    role: explain
    stem: "Which pair of traits is typical of the class Mammalia as a whole?"
    correct: "A four-chambered heart and mammary glands that produce milk"
    unit: ""
    wrong:
      - {text: "Feathers and a four-chambered heart", mistake: "mixes a bird feature with a mammal heart"}
      - {text: "Scales and a three-chambered heart", mistake: "uses the features of reptiles instead"}
      - {text: "Moist skin and gills in the adult", mistake: "uses the features of amphibians instead"}
    explanation: "Mammals share a four-chambered heart and mammary glands that produce milk, along with hair and a neocortex. These traits together define the class."
    hints:
      - "Think about which features set mammals apart from the other vertebrate classes."
      - "Consider whether a feature is shared by every member or only some."
      - "Look for the traits that are part of the core definition of the class."
