    type: mcq
    difficulty: hard
    role: apply
    stem: "A plant disease is caused by a short circular molecule of RNA that has no protein coat at all. What is this infectious agent most likely called?"
    correct: "Viroid"
    unit: ""
    wrong:
      - {text: "Prion", mistake: "confuses protein-only infectious agents with RNA ones"}
      - {text: "Virion", mistake: "treats a complete virus particle as the same thing"}
      - {text: "Lichen", mistake: "confuses an infectious agent with a symbiotic partnership"}
    explanation: "A viroid is a small infectious agent made only of a short circular RNA, with no capsid. Viruses carry a protein coat, which is what separates them from viroids."
    hints:
      - "Compare its size and components with a virus that has a protein coat."
      - "Think of an infectious molecule that is nucleic acid alone."
      - "The name is close to the word for virus but refers to a simpler molecule."
