  - topic: viruses_viroids_lichens
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A lichen is green and grows on tree bark. Which statement best describes its biology?"
    correct: "A mutualistic partnership of a fungus and an alga or cyanobacterium"
    unit: ""
    wrong:
      - {text: "A single plant species adapted to dry bark", mistake: "treats lichens as ordinary plants"}
      - {text: "A colony of bacteria that always lives inside animals", mistake: "assigns the wrong habitat and kind of organism"}
      - {text: "A type of moss that produces spores on its surface", mistake: "confuses lichens with bryophytes"}
    explanation: "A lichen is a close partnership between a fungus and a photosynthetic partner, usually an alga or a cyanobacterium. Both partners benefit from the arrangement."
    hints:
      - "Look for two different kinds of organisms working together."
      - "Consider which partners can photosynthesise and which can absorb water and minerals."
      - "The partners live in a close relationship in which both gain something."
    diagram: null
    confidence: medium
