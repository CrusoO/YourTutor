    type: numeric
    difficulty: hard
    role: apply
    stem: "A fungal colony spreads 3 mm per hour for 4 hours, then 1.5 mm per hour for 2 hours. What total distance in millimetres does it cover?"
    correct: "15"
    unit: "mm"
    wrong: []
    explanation: "The first stage covers 3 mm per hour times 4 hours, which is 12 mm. The second stage covers 1.5 mm per hour times 2 hours, which is 3 mm, giving a total of 15 mm."
    hints:
      - "Calculate each stage separately before adding them together."
      - "Multiply the rate by the time for the first stage, then do the same for the second stage."
      - "Add the two stage distances at the end."
