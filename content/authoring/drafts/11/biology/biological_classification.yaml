  - topic: monera_protista_fungi
    type: mcq
    difficulty: hard
    role: apply
    stem: "A slide shows a cell with no membrane around its genetic material, no mitochondria, and a single flagellum for swimming. Which group best fits?"
    correct: "Bacteria"
    unit: ""
    wrong:
      - {text: "Diatoms", mistake: "treats silica shells as the key feature"}
      - {text: "Yeasts", mistake: "confuses unicellular fungi with flagellated cells"}
      - {text: "Ciliates", mistake: "assumes every motile protist has cilia"}
    explanation: "A cell without a membrane-bound nucleus or mitochondria is a prokaryote, and bacteria are the group of prokaryotes that matches this description. The swimming structure is consistent with a bacterial flagellum."
    hints:
      - "Start with the nuclear organisation before looking at movement."
      - "The absence of mitochondria narrows the choice to a particular kind of cell."
      - "Eliminate eukaryotic groups first, since this cell lacks a membrane-bound nucleus."
