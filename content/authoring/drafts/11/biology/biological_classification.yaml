    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which evidence best shows that ciliates and amoebas belong to different protist groups?"
    correct: "Ciliates move with hair-like cilia while amoebas extend pseudopodia to move"
    unit: ""
    wrong:
      - {text: "Both live in pond water", mistake: "uses habitat as a classification feature"}
