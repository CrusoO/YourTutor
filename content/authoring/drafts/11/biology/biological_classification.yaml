  - topic: viruses_viroids_lichens
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which molecule forms the genetic material of a virus, present as either single or double strands?"
    correct: "Nucleic acid"
    unit: ""
    wrong:
      - {text: "Polysaccharide", mistake: "treats sugar polymers as genetic material"}
      - {text: "Lipid bilayer", mistake: "confuses the outer envelope with the genome"}
      - {text: "Peptide chain", mistake: "confuses the protein coat with the genome"}
    explanation: "A viral genome is made of either DNA or RNA, which are both nucleic acids, and it may be single-stranded or double-stranded. The protein coat protects this genome."
    hints:
      - "Think about the molecule type that stores instructions in a sequence."
      - "The class includes DNA and RNA."
      - "Proteins build the coat, but a different class of molecule carries the instructions."
    diagram: null
    confidence: high
  - topic: viruses_viroids_lichens
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the name of the protein coat that surrounds the genome of a virus?"
    correct: "Capsid"
    unit: ""
    wrong:
      - {text: "Cell wall", mistake: "assumes viruses have cell walls"}
      - {text: "Flagellum", mistake: "confuses viral parts with motile structures"}
      - {text: "Cristae", mistake: "uses a term from the inside of mitochondria"}
    explanation: "The capsid is the protein shell made of repeated subunits, and it encloses and protects the viral nucleic acid. Some viruses have an additional lipid envelope outside it."
    hints:
      - "The coat is made of identical protein subunits arranged in a repeated pattern."
      - "It protects the genetic material outside a host."
      - "Think about the shell that encloses the nucleic acid like a case."
    diagram: null
    confidence: high
  - topic: viruses_viroids_lichens
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do many biologists consider viruses non-living when they are outside a host?"
    correct: "They cannot carry out metabolism or reproduce outside a host cell"
    unit: ""
    wrong:
      - {text: "They are too large to be seen under any microscope", mistake: "confuses size with the presence of life"}
      - {text: "They have a nucleus but no cell membrane", mistake: "misreads viral structure"}
      - {text: "They photosynthesise only in darkness", mistake: "assigns a process that viruses lack"}
    explanation: "Outside a host, a virus has no metabolism of its own and cannot copy itself. This dependence is the main reason many biologists treat viruses as non-living particles."
    hints:
      - "Think about whether a virus can make energy or copies of itself alone."
      - "Consider where a virus must be to reproduce."
      - "The answer relates to needing another organism's cellular machinery."
    diagram: null
    confidence: high
  - topic: viruses_viroids_lichens
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which step correctly describes how a bacteriophage multiplies inside its host?"
    correct: "It attaches to a bacterial cell, injects its genome, and uses the host machinery to make new viruses"
    unit: ""
    wrong:
      - {text: "It divides by binary fission inside a bacterium", mistake: "applies bacterial division to viruses"}
      - {text: "It fuses with the host nucleus and becomes a plasmid", mistake: "assumes viruses never replicate on their own"}
      - {text: "It builds its own ribosomes and grows like a bacterium", mistake: "gives the virus a cell body it does not have"}
    explanation: "A bacteriophage binds to a bacterium, injects its nucleic acid, and the host synthesises viral parts that assemble into new particles. The virus itself has no ribosomes or division machinery."
    hints:
      - "Start with how the virus first meets its host."
      - "Think about who makes the proteins during replication."
      - "Consider whether the virus uses its own machinery or the host's to copy itself."
    diagram: null
    confidence: high
