      - {text: "Both are multicellular", mistake: "assumes protists are multicellular"}
    explanation: "Ciliates and amoebas differ in their locomotion structures, which are a structural feature used in protist classification. Shared habitat or size does not separate the groups."
    hints:
      - "Compare the structures each group uses for moving and feeding."
      - "Ask which features are structural rather than where the organisms live."
      - "Think about which structure each group uses to move across a surface."
