items:
  - topic: five_kingdom_system
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which kingdom groups eukaryotic organisms that absorb dissolved food from their surroundings and have cell walls made of chitin?"
    correct: "Fungi"
    unit: ""
    wrong:
      - {text: "Plantae", mistake: "assumes every eukaryote with a cell wall is a plant"}
      - {text: "Protista", mistake: "lumps all unicellular eukaryotes together"}
      - {text: "Monera", mistake: "treats chitin as a bacterial feature"}
    explanation: "Fungi are eukaryotes that digest food outside their body and absorb it, and their cell walls contain chitin rather than cellulose. Moulds and mushrooms are typical members."
    hints:
      - "Think about organisms that release enzymes outside their body to digest food."
      - "The group includes moulds and mushrooms."
      - "Chitin is a clue about the wall material, so consider which kingdom has this feature."
    diagram: null
    confidence: high
  - topic: five_kingdom_system
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which kingdom contains organisms that lack a well-defined nucleus and have cell walls made of peptidoglycan?"
    correct: "Monera"
    unit: ""
    wrong:
      - {text: "Animalia", mistake: "thinks animals have rigid cell walls too"}
      - {text: "Protista", mistake: "confuses unicellular eukaryotes with prokaryotes"}
      - {text: "Fungi", mistake: "mixes up the wall material of fungi with peptidoglycan"}
    explanation: "Monera are prokaryotes, so their genetic material is not enclosed in a membrane, and their walls contain peptidoglycan. Bacteria are the best-known members."
    hints:
      - "These organisms are prokaryotic, so their genetic material is not enclosed in a membrane."
      - "Bacteria are the best-known members of this group."
      - "Think about the simplest cell type and which kingdom it belongs to."
    diagram: null
    confidence: high
  - topic: five_kingdom_system
    type: mcq
    difficulty: medium
    role: explain
    stem: "Which criteria does the five-kingdom system use most heavily to separate the groups?"
    correct: "Cell structure, body organisation and mode of nutrition"
    unit: ""
    wrong:
      - {text: "Colour and habitat alone", mistake: "uses surface appearance instead of cell features"}
      - {text: "Size of the organism only", mistake: "ranks organisms by size rather than structure"}
      - {text: "Number of legs and wings", mistake: "uses external appendages as the main test"}
    explanation: "The five-kingdom system separates organisms by whether their cells have a nucleus, whether they are unicellular or multicellular, and how they obtain food. These are structural and functional criteria."
    hints:
      - "Think about whether cells have a nucleus and whether they are single or many."
      - "Consider how each organism gets its food."
      - "The criteria are structural and functional, not about appearance."
    diagram: null
    confidence: high
  - topic: five_kingdom_system
    type: numeric
    difficulty: medium
    role: procedure
    stem: "In the five-kingdom system, how many kingdoms contain only eukaryotic organisms?"
    correct: "4"
    unit: ""
    wrong: []
    explanation: "Monera is the only prokaryotic kingdom, so the other four kingdoms of Protista, Fungi, Plantae and Animalia contain eukaryotes only."
    hints:
      - "Monera is the only kingdom with prokaryotes."
      - "Remove the prokaryotic kingdom from the full list, then count what is left."
      - "The remaining groups are the ones whose cells have a membrane-bound nucleus."
    diagram: null
    confidence: high
  - topic: five_kingdom_system
    type: mcq
    difficulty: hard
    role: apply
    stem: "A specimen is unicellular, has a nucleus, makes food by photosynthesis, and has a cellulose wall. Which kingdom fits best?"
    correct: "Protista"
    unit: ""
    wrong:
      - {text: "Plantae", mistake: "assumes every photosynthetic eukaryote with cellulose is a plant"}
      - {text: "Monera", mistake: "treats photosynthesis as a prokaryotic trait"}
      - {text: "Fungi", mistake: "associates cellulose walls with fungi"}
    explanation: "A single-celled photosynthetic eukaryote with a nucleus is placed among the protists in the five-kingdom system. Multicellular plants are excluded by the unicellular body."
    hints:
      - "Note that the specimen is a single cell with a nucleus, so it is not prokaryotic."
      - "Multicellular plants are excluded because this specimen is unicellular."
      - "Look for the kingdom that collects single-celled eukaryotes that are neither fungi, plants nor animals."
    diagram: null
    confidence: medium
  - topic: five_kingdom_system
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A student places a bacterium in the protist kingdom because it is microscopic. What is the main error in this reasoning?"
    correct: "Size is not the criterion, and bacteria lack a membrane-bound nucleus so they belong in Monera"
    unit: ""
    wrong:
      - {text: "Protista includes every microscopic organism", mistake: "treats size as sufficient for the protist group"}
      - {text: "Bacteria are multicellular so they belong in Plantae", mistake: "invents a multicellular body for bacteria"}
      - {text: "Bacteria have chitin walls so they belong in Fungi", mistake: "mixes up the wall materials of different kingdoms"}
    explanation: "The five-kingdom system uses cell organisation, not size, as a primary criterion. Bacteria are prokaryotes and fall in Monera."
    hints:
      - "Ask which cell feature is most basic for separating prokaryotes from eukaryotes."
      - "Think about what kind of nucleus the bacterium has."
      - "Check whether the student used the criterion that matters for the kingdom."
    diagram: null
    confidence: high
  - topic: monera_protista_fungi
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which group of protists moves using hair-like structures that beat in waves and has two kinds of nuclei?"
    correct: "Ciliates"
    unit: ""
    wrong:
      - {text: "Diatoms", mistake: "assumes glass-like shells are a feature of moving protists"}
      - {text: "Euglenoids", mistake: "confuses a single whip-like flagellum with cilia"}
      - {text: "Dinoflagellates", mistake: "confuses a two-whip arrangement with cilia"}
    explanation: "Ciliates are protists that swim by beating many short cilia, and they carry a large macronucleus alongside a smaller micronucleus."
    hints:
      - "Look at the surface of the cell, where hair-like structures beat in waves."
      - "Think about protists that swim with many short hair-like structures."
      - "Two different nuclei are a useful identifying detail for this group."
    diagram: null
    confidence: high
  - topic: monera_protista_fungi
    type: mcq
    difficulty: easy
    role: recall
    stem: "What structure do most fungi use as their main body, made of thread-like filaments?"
    correct: "Hyphae"
    unit: ""
    wrong:
      - {text: "Pseudopodia", mistake: "confuses fungal filaments with the temporary extensions of amoeboid protists"}
      - {text: "Rhizoids", mistake: "uses a term for anchoring threads that is not the main body"}
      - {text: "Stolons", mistake: "confuses a runner structure in plants with the fungal body"}
    explanation: "Fungal bodies are built from branching thread-like hyphae, and together they form a network called a mycelium. The network spreads through the food source."
    hints:
      - "The filaments together form a network called a mycelium."
      - "Think about thread-like cell chains that spread through a food source."
      - "The term is the plural of a word meaning a single thread of the fungal body."
    diagram: null
    confidence: high
  - topic: monera_protista_fungi
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are fungi placed in a separate kingdom from plants in the five-kingdom system?"
    correct: "They absorb food externally and have chitin in their cell walls, unlike plants which photosynthesise"
    unit: ""
    wrong:
      - {text: "They are always unicellular", mistake: "assumes all fungi are single-celled"}
      - {text: "They produce their own food by photosynthesis", mistake: "reverses the nutrition mode of fungi"}
      - {text: "They are the only organisms with a nucleus", mistake: "assumes fungi are the only eukaryotes"}
    explanation: "Fungi are heterotrophic, absorbing digested food through their body surface, while plants make their own food. Their cell wall chemistry also differs, which supports separate kingdoms."
    hints:
      - "Compare how each group takes in food."
      - "Think about what the cell walls are made from."
      - "Consider whether each group makes its own food."
    diagram: null
    confidence: high
  - topic: monera_protista_fungi
    type: mcq
    difficulty: medium
    role: procedure
    stem: "A student needs to decide whether a unicellular organism is a protist or a bacterium. Which feature should the student check first?"
    correct: "Whether the cell has a membrane-bound nucleus"
    unit: ""
    wrong:
      - {text: "Whether the organism is coloured", mistake: "uses colour, which varies within every group"}
      - {text: "Whether the organism moves in water", mistake: "treats movement as decisive"}
      - {text: "Whether the organism lives in soil", mistake: "uses habitat rather than cell structure"}
    explanation: "The first test separates prokaryotes from eukaryotes, and a membrane-bound nucleus is the clearest sign of a eukaryote. Only after this test does the student need the other features."
    hints:
      - "Think about the basic difference between prokaryotic and eukaryotic cells."
      - "Consider which structure is visible under a good microscope and separates the two."
      - "The test focuses on the internal organisation of the cell."
    diagram: null
    confidence: high
