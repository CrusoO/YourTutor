items:
  - topic: cell_cycle_phases
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which phase of the cell cycle is the period of DNA replication?"
    correct: "S phase"
    unit: ""
    wrong:
      - {text: "G1 phase", mistake: "assumes the first growth phase copies the DNA"}
      - {text: "G2 phase", mistake: "places replication after the division preparation"}
      - {text: "M phase", mistake: "confuses the division phase with synthesis"}
    explanation: "During the S phase of interphase the cell replicates its DNA, so each chromosome becomes two sister chromatids. The G1 and G2 phases are gap phases for growth and preparation."
    hints:
      - "Think about the phase letter that stands for synthesis."
      - "It lies between two growth phases in interphase."
      - "Consider which phase doubles the amount of genetic material."
    diagram: null
    confidence: high
  - topic: cell_cycle_phases
    type: mcq
    difficulty: easy
    role: recall
    stem: "In which phase do cells check DNA integrity and synthesise proteins needed for division, just before mitosis?"
    correct: "G2 phase"
    unit: ""
    wrong:
      - {text: "S phase", mistake: "places the preparation step during DNA synthesis"}
      - {text: "G0 phase", mistake: "treats a resting state as the preparation step"}
      - {text: "Prophase", mistake: "confuses the start of division with preparation"}
    explanation: "G2 follows DNA replication and is the final gap before mitosis. Cells check the replicated DNA and make the proteins they need for division during this phase."
    hints:
      - "This is the gap that follows DNA replication."
      - "The phase comes right before the division phase."
      - "Think about the second growth period in the cycle."
    diagram: null
    confidence: high
  - topic: cell_cycle_phases
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do many mature nerve and muscle cells remain in a non-dividing state?"
    correct: "They have exited the cycle into G0 and stay specialised for their function without dividing"
    unit: ""
    wrong:
      - {text: "They are dead cells that cannot divide", mistake: "treats quiescence as death"}
      - {text: "They have completed mitosis permanently", mistake: "assumes division ends forever after one cycle"}
      - {text: "They are replicating DNA continuously", mistake: "assumes replication never stops"}
    explanation: "Many differentiated cells leave the active cycle and enter G0, a resting state in which they carry out specialised functions. They can still be alive and active while not dividing."
    hints:
      - "Think about cells that do their job without dividing."
      - "Consider whether the cell is dead or simply not dividing."
      - "Ask which phase label refers to a resting state outside the active cycle."
    diagram: null
    confidence: high
  - topic: cell_cycle_phases
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A cell contains 6 picograms of DNA in G1. After S phase, how many picograms of DNA does the cell contain?"
    correct: "12"
    unit: "pg"
    wrong: []
    explanation: "DNA replication in S phase doubles the DNA content, so 6 pg becomes 12 pg before the cell divides."
    hints:
      - "Consider what replication does to the amount of DNA."
      - "Multiply the starting value by the factor produced by replication."
      - "The DNA content after S phase is a fixed multiple of the G1 value."
    diagram: null
    confidence: high
  - topic: cell_cycle_phases
    type: mcq
    difficulty: hard
    role: apply
    stem: "A drug blocks cells at the checkpoint that controls entry into S phase. Which consequence is most likely?"
    correct: "Cells cannot enter S phase, so DNA replication does not begin"
    unit: ""
    wrong:
      - {text: "Cells complete mitosis without replicating DNA", mistake: "assigns the block to a later checkpoint"}
      - {text: "Cells replicate DNA but never divide", mistake: "reverses the checkpoint position"}
      - {text: "Cells enter meiosis instead of mitosis", mistake: "confuses the cell cycle with the meiotic pathway"}
    explanation: "The checkpoint before S phase verifies that conditions are suitable for replication. Blocking it prevents the cell from starting DNA synthesis, so it stays in the earlier phase."
    hints:
      - "Think about what the checkpoint controls at the start of synthesis."
      - "Consider which phase follows the checkpoint."
      - "Ask whether replication can happen without entering the phase that performs it."
    diagram: "Draw a cell cycle circle with G1, S, G2 and M, marking the checkpoint at the entry to S phase with an arrow and an X to show the block."
    confidence: high
  - topic: cell_cycle_phases
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A cell has replicated its DNA but its cytoplasm does not divide after nuclear division. Which phase is most likely affected?"
    correct: "Cytokinesis at the end of M phase"
    unit: ""
    wrong:
      - {text: "G0 phase", mistake: "treats quiescence as the step that failed"}
      - {text: "S phase", mistake: "assumes replication is the failed step"}
      - {text: "G1 phase", mistake: "assumes growth is responsible for splitting the cell"}
    explanation: "DNA replication and nuclear division are complete, so the failure lies in cytokinesis, which divides the cytoplasm at the end of M phase. The result can be a binucleate cell."
    hints:
      - "Think about the last part of division, which separates the cytoplasm."
      - "Consider which phase follows nuclear division."
      - "Check whether the failure happened before or after the DNA was copied."
    diagram: "Draw a cell after nuclear division, showing two nuclei within one undivided cytoplasm with a cleavage furrow missing, and label the cytokinesis step."
    confidence: medium
  - topic: mitosis
    type: mcq
    difficulty: easy
    role: recall
    stem: "In which stage of mitosis do the chromosomes line up at the centre of the cell?"
    correct: "Metaphase"
    unit: ""
    wrong:
      - {text: "Anaphase", mistake: "places alignment after sister chromatids separate"}
      - {text: "Prophase", mistake: "assumes chromosomes align when they condense"}
      - {text: "Telophase", mistake: "assigns nuclear reformation to the alignment step"}
    explanation: "In metaphase the chromosomes attach to spindle fibres and line up on the metaphase plate at the centre of the cell. Sister chromatids separate only in anaphase."
    hints:
      - "Look at the stage when the chromosomes sit at the middle of the cell."
      - "Think about the stage just before sister chromatids separate."
      - "The alignment happens in the middle stage of the nuclear division."
    diagram: null
    confidence: high
  - topic: mitosis
    type: mcq
    difficulty: easy
    role: recall
    stem: "What happens to sister chromatids during anaphase?"
    correct: "They separate and move toward opposite poles of the cell"
    unit: ""
    wrong:
      - {text: "They fuse into one chromosome", mistake: "reverses the process of separation"}
      - {text: "They replicate again before moving", mistake: "assumes DNA copies in anaphase"}
      - {text: "They disappear and are rebuilt later", mistake: "assumes chromosomes vanish during division"}
    explanation: "In anaphase, the centromeres split and spindle fibres pull each sister chromatid to opposite poles. Each pole receives a full set of chromosomes."
    hints:
      - "Think about the separation that ensures each daughter cell gets one copy."
      - "The chromatids are pulled by spindle fibres."
      - "The movement is toward the two ends of the cell."
    diagram: null
    confidence: high
  - topic: mitosis
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is mitosis important for the growth and repair of a multicellular body?"
    correct: "It produces genetically identical cells that replace and add to existing tissues"
    unit: ""
    wrong:
      - {text: "It creates genetic variation through crossing over", mistake: "assigns crossing over to mitosis"}
      - {text: "It halves the chromosome number for gamete formation", mistake: "assigns meiotic reduction to mitosis"}
      - {text: "It produces spores only in plants", mistake: "limits mitosis to spore production"}
    explanation: "Mitosis gives daughter cells with the same genetic content as the parent, which is what growth and tissue repair require. Variation is produced by meiosis instead."
    hints:
      - "Think about why a body needs more cells of the same type."
      - "Consider whether the daughter cells should be genetically identical to the parent."
      - "The process is used for growth and healing."
    diagram: null
    confidence: high
  - topic: mitosis
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which order of the stages of mitosis is correct?"
    correct: "Prophase, metaphase, anaphase, telophase"
    unit: ""
    wrong:
      - {text: "Metaphase, prophase, telophase, anaphase", mistake: "scrambles the early stages"}
      - {text: "Anaphase, telophase, prophase, metaphase", mistake: "places division before the chromosomes condense"}
      - {text: "Prophase, anaphase, metaphase, telophase", mistake: "swaps metaphase and anaphase"}
    explanation: "Mitosis runs through prophase, metaphase, anaphase and telophase in that order, followed by cytokinesis. Each stage sets up the next one."
    hints:
      - "Start with the stage in which the chromosomes first condense."
      - "The next stage aligns the chromosomes in the middle of the cell."
      - "Finish with the stage in which the nucleus reforms."
    diagram: "Draw the four stages of mitosis in a row, showing condensed chromosomes, alignment at the centre, separation to the poles and two nuclei, labelling each stage."
    confidence: high
  - topic: mitosis
    type: numeric
    difficulty: hard
    role: apply
    stem: "A cell with 6 chromosomes undergoes mitosis. How many chromosomes does each daughter cell receive?"
    correct: "6"
    unit: ""
    wrong: []
    explanation: "Mitosis preserves the chromosome number, so each daughter cell gets the full set of 6 chromosomes."
    hints:
      - "Mitosis produces two daughter cells, each with the same chromosome number as the parent."
      - "Think about whether mitosis halves or preserves the chromosome count."
      - "Each daughter cell is genetically identical to the parent cell."
    diagram: null
    confidence: high
  - topic: mitosis
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A mutation disables the spindle checkpoint, so cells enter anaphase while some chromosomes are still unattached to the spindle. Which outcome is most likely?"
    correct: "Daughter cells with unequal chromosome numbers"
    unit: ""
    wrong:
      - {text: "Identical daughter cells with normal chromosome numbers", mistake: "assumes the checkpoint is unnecessary for accurate division"}
      - {text: "Cells that stop dividing and enter G0 permanently", mistake: "assigns quiescence as the direct result"}
      - {text: "Cells that produce gametes instead of daughter cells", mistake: "confuses a mitotic error with meiosis"}
    explanation: "The spindle checkpoint delays anaphase until all chromosomes are attached. Without it, unattached chromosomes may be lost or sent to the wrong pole, creating daughter cells with unequal numbers of chromosomes."
    hints:
      - "Ask what the spindle checkpoint is meant to protect."
      - "Consider what happens to a chromosome that is not attached when the poles pull apart."
      - "Think about whether the two daughter cells would receive the same genetic content."
    diagram: "Draw an anaphase cell in which one chromosome lags at the centre while the others move to the poles, labelling the lagging chromosome and the spindle fibres."
    confidence: medium
  - topic: meiosis
    type: mcq
    difficulty: easy
    role: recall
    stem: "How many haploid daughter cells are produced when one diploid cell completes meiosis?"
    correct: "Four"
    unit: ""
    wrong:
      - {text: "Two", mistake: "assumes meiosis gives the same number as mitosis"}
      - {text: "Eight", mistake: "doubles the cells again without reducing ploidy"}
      - {text: "One", mistake: "assumes the cell does not divide in meiosis"}
    explanation: "Meiosis has two successive divisions after one round of DNA replication, so one diploid cell gives four haploid cells."
    hints:
      - "Meiosis includes two divisions in a row."
      - "Each division splits the cell, and the second division applies to both halves."
      - "Count the cells after the second division is complete, starting from one."
    diagram: null
    confidence: high
  - topic: meiosis
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which event of meiosis I reduces the chromosome number by half?"
    correct: "Separation of homologous chromosomes in anaphase I"
    unit: ""
    wrong:
      - {text: "Separation of sister chromatids in anaphase II", mistake: "assumes the second division halves the number"}
      - {text: "Crossing over in prophase II", mistake: "assigns crossing over to the reduction step"}
      - {text: "Replication of DNA in S phase", mistake: "assigns replication as the reduction event"}
    explanation: "In anaphase I, homologous chromosomes are pulled to opposite poles, so each daughter nucleus receives one chromosome from each pair. This halves the chromosome number."
    hints:
      - "Think about which pairs of chromosomes separate first."
      - "The homologous pair is pulled to opposite poles."
      - "Compare the first division with the second division in terms of what separates."
    diagram: null
    confidence: high
  - topic: meiosis
    type: mcq
    difficulty: medium
    role: explain
    stem: "How does crossing over contribute to genetic variation?"
    correct: "It exchanges segments between non-sister chromatids of homologous chromosomes during prophase I"
    unit: ""
    wrong:
      - {text: "It duplicates whole chromosomes in anaphase II", mistake: "assigns duplication to the second division"}
      - {text: "It joins two gametes during fertilisation", mistake: "confuses crossing over with fertilisation"}
      - {text: "It removes genes from the cell permanently", mistake: "assumes exchange deletes genetic material"}
    explanation: "Crossing over during prophase I swaps corresponding segments between non-sister chromatids of a homologous pair. The resulting chromosomes carry new combinations of alleles."
    hints:
      - "Think about which chromatids swap material."
      - "The event happens while homologues are paired closely together."
      - "Consider the stage when the homologous chromosomes are in close association."
    diagram: null
    confidence: high
  - topic: meiosis
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which statement correctly contrasts meiosis with mitosis?"
    correct: "Meiosis produces four haploid cells, while mitosis produces two genetically identical cells with the parent's chromosome number"
    unit: ""
    wrong:
      - {text: "Mitosis produces four haploid cells, while meiosis produces two cells", mistake: "swaps the outcomes of the two processes"}
      - {text: "Meiosis produces two identical diploid cells, just like mitosis", mistake: "assumes meiosis is simply mitosis"}
      - {text: "Both produce four haploid cells from one diploid cell", mistake: "gives mitosis the outcome of meiosis"}
    explanation: "Meiosis yields four genetically varied haploid cells used for gametes, while mitosis yields two identical cells that keep the parent's chromosome number."
    hints:
      - "Count the daughter cells produced by each process."
      - "Check whether the daughter cells keep the parent's chromosome number."
      - "Think about which process creates gametes."
    diagram: "Draw two parallel flow charts, one for meiosis giving four haploid cells and one for mitosis giving two identical diploid cells, labelling the number of divisions and the ploidy of the products."
    confidence: high
  - topic: meiosis
    type: numeric
    difficulty: hard
    role: apply
    stem: "A diploid cell has 2n = 12 chromosomes and undergoes meiosis. How many chromosomes does each resulting gamete contain?"
    correct: "6"
    unit: ""
    wrong: []
    explanation: "Meiosis halves the diploid count of 12, so each haploid gamete contains 6 chromosomes."
    hints:
      - "Meiosis reduces the chromosome number by a factor of two."
      - "Divide the diploid count by the number of sets in a gamete."
      - "Gametes are haploid, so compare them with the single set of the parent."
    diagram: null
    confidence: high
  - topic: meiosis
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A gamete carries an extra chromosome because of non-disjunction in meiosis I. What is the likely result after fertilisation with a normal gamete?"
    correct: "A zygote with an abnormal chromosome number, a condition called aneuploidy"
    unit: ""
    wrong:
      - {text: "A normal diploid zygote", mistake: "assumes the extra chromosome is corrected"}
      - {text: "A haploid zygote with half the chromosomes", mistake: "assumes fertilisation halves the chromosome number"}
      - {text: "An identical copy of the parent cell", mistake: "assumes meiosis behaves like mitosis"}
    explanation: "Non-disjunction gives a gamete with one extra or missing chromosome. Fertilisation with a normal gamete produces a zygote with an abnormal count, which is aneuploidy."
    hints:
      - "Ask whether the extra chromosome can be removed by fertilisation."
      - "Consider what the normal gamete contributes to the zygote's chromosome count."
      - "Think about whether the zygote's count matches the parent's count."
    diagram: "Draw two gametes, one normal and one with an extra chromosome, joining to form a zygote, and label the resulting chromosome number as abnormal."
    confidence: medium
