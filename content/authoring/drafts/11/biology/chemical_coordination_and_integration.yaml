items:
  - topic: endocrine_glands
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which gland is often called the master gland because it controls several other endocrine glands?"
    correct: "Pituitary gland"
    unit: ""
    wrong:
      - {text: "Thyroid gland", mistake: "assigns the master role to a gland it does not control"}
      - {text: "Adrenal gland", mistake: "assigns the master role to a stress gland"}
      - {text: "Pineal gland", mistake: "assigns the master role to a gland that regulates rhythms"}
    explanation: "The pituitary gland secretes tropic hormones that regulate the thyroid, adrenal cortex and gonads, and it is itself controlled by the hypothalamus."
    hints:
      - "It sits at the base of the brain, below the hypothalamus."
      - "The hypothalamus controls this gland through its own hormones."
      - "It secretes several tropic hormones that act on other glands."
    diagram: null
    confidence: high
  - topic: endocrine_glands
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which hormone is secreted by the beta cells of the islets of Langerhans and lowers blood glucose?"
    correct: "Insulin"
    unit: ""
    wrong:
      - {text: "Glucagon", mistake: "assigns the alpha cell hormone to the beta cells"}
      - {text: "Somatostatin", mistake: "assigns a delta cell hormone to the beta cells"}
      - {text: "Adrenaline", mistake: "assigns an adrenal hormone to the islets"}
    explanation: "Insulin is made by the beta cells of the pancreatic islets. It promotes glucose uptake and storage, which lowers blood glucose after a meal."
    hints:
      - "The hormone lowers blood glucose after a meal."
      - "It is produced in the pancreas."
      - "Think about the islet cells that respond to high blood glucose."
    diagram: null
    confidence: high
  - topic: endocrine_glands
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does the thyroid gland need a steady dietary supply of iodine?"
    correct: "Iodine is needed to build thyroxine, the hormone that regulates the metabolic rate"
    unit: ""
    wrong:
      - {text: "Iodine is required to form haemoglobin", mistake: "assigns the iron role to iodine"}
      - {text: "Iodine makes insulin active in the blood", mistake: "assigns insulin activation to iodine"}
      - {text: "Iodine reduces the production of thyroxine", mistake: "reverses the role of iodine in thyroxine synthesis"}
    explanation: "The thyroid takes up iodide from the blood and incorporates it into thyroid hormones. Without enough iodine, thyroxine cannot be made and the gland may enlarge."
    hints:
      - "Think about the element that the thyroid takes up from the blood."
      - "Consider which hormone the thyroid produces to control metabolism."
      - "The element is built into the structure of that hormone."
    diagram: null
    confidence: high
  - topic: endocrine_glands
    type: mcq
    difficulty: medium
    role: procedure
    stem: "Which gland is directly controlled by releasing hormones that the hypothalamus sends through a portal blood system?"
    correct: "Anterior pituitary"
    unit: ""
    wrong:
      - {text: "Adrenal medulla", mistake: "assigns hypothalamic portal control to a gland with nerve control"}
      - {text: "Pineal gland", mistake: "assigns portal control to a gland not linked this way"}
      - {text: "Thymus", mistake: "assigns hypothalamic control to an immune organ"}
    explanation: "Hypothalamic releasing and inhibiting hormones reach the anterior pituitary through the hypophyseal portal vessels, which control its secretion of tropic hormones."
    hints:
      - "The hypothalamus sends its signal through a short portal blood route."
      - "Think about the gland at the base of the brain that secretes tropic hormones."
      - "The posterior pituitary is controlled by nerve fibres instead."
    diagram: "Draw the hypothalamus above the pituitary, with the hypophyseal portal vessels linking them and the anterior pituitary receiving releasing hormones, labelling each structure."
    confidence: high
  - topic: endocrine_glands
    type: numeric
    difficulty: hard
    role: apply
    stem: "An endocrine gland secretes 12 units of a hormone each day. How many units are secreted in total over 7 days?"
    correct: "84"
    unit: "units"
    wrong: []
    explanation: "Seven days at 12 units per day gives 7 times 12, which equals 84 units."
    hints:
      - "Multiply the daily amount by the number of days."
      - "Count each day in the time period carefully."
      - "Give the total for the whole period, not for one day."
    diagram: null
    confidence: high
  - topic: endocrine_glands
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A tumour destroys the beta cells of the pancreas. Which change in blood glucose is most likely, and why?"
    correct: "Blood glucose rises, because too little insulin is available to drive glucose uptake and storage"
    unit: ""
    wrong:
      - {text: "Blood glucose falls, because glucagon is no longer produced", mistake: "reverses the role of glucagon"}
      - {text: "Blood glucose stays normal, because the liver makes insulin", mistake: "assigns insulin production to the liver"}
      - {text: "Blood glucose rises, because the adrenal gland stops working", mistake: "assigns the cause to the adrenal gland"}
    explanation: "Beta cells produce insulin, which lets body cells take up and store glucose. Without insulin, glucose stays in the blood, so blood glucose rises after a meal."
    hints:
      - "Think about what insulin does to glucose after a meal."
      - "Consider which hormone normally lowers blood glucose."
      - "Ask what happens to glucose uptake when that hormone is missing."
    diagram: "Draw the pancreatic islet with beta cells destroyed and an arrow showing blood glucose rising in the blood, labelling the missing insulin signal to the body cells."
    confidence: high
  - topic: hormone_mechanism
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which class of hormones is lipid-soluble, crosses the plasma membrane, and binds receptors inside the cell?"
    correct: "Steroid hormones"
    unit: ""
    wrong:
      - {text: "Peptide hormones", mistake: "assumes peptides enter the cell and bind nuclear receptors"}
      - {text: "Catecholamines", mistake: "assumes all hormones act inside the cell"}
      - {text: "Amino acid neurotransmitters", mistake: "confuses neural messengers with hormones"}
    explanation: "Steroid hormones are derived from cholesterol and are lipid-soluble, so they cross the membrane and bind intracellular receptors that act on gene transcription."
    hints:
      - "These hormones are derived from cholesterol."
      - "Think about hormones like oestrogen that pass through the membrane."
      - "They bind a receptor inside the cell rather than on the surface."
    diagram: null
    confidence: high
  - topic: hormone_mechanism
    type: mcq
    difficulty: easy
    role: recall
    stem: "How do peptide hormones usually act on their target cells?"
    correct: "They bind surface receptors and trigger a second messenger cascade inside the cell"
    unit: ""
    wrong:
      - {text: "They cross the membrane and bind nuclear receptors directly", mistake: "assigns steroid-type entry to peptides"}
      - {text: "They are converted into steroids inside the target cell", mistake: "assumes peptides become steroids"}
      - {text: "They act only on blood vessels", mistake: "restricts peptide hormones to vessel effects"}
    explanation: "Peptide hormones are too polar to cross the membrane easily. They bind receptors on the cell surface, and the signal is relayed inside by second messengers such as cyclic AMP."
    hints:
      - "The receptor is on the outside of the target cell."
      - "Think about messengers such as cyclic AMP that spread the signal inside."
      - "The hormone does not need to enter the cell to act."
    diagram: null
    confidence: high
  - topic: hormone_mechanism
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do steroid hormones usually take longer to act than peptide hormones?"
    correct: "They must alter gene expression and make new proteins, which takes more time"
    unit: ""
    wrong:
      - {text: "They are slower to be secreted from glands", mistake: "assigns the delay to secretion"}
      - {text: "They have no receptors in the target cell", mistake: "denies that steroids have receptors"}
      - {text: "They are destroyed immediately in the blood", mistake: "assumes steroids are unstable in the blood"}
    explanation: "Steroid hormones act on gene transcription, so the target cell must make new messenger RNA and then new proteins before the effect appears. Surface signalling by peptides can act within seconds."
    hints:
      - "Think about what the steroid changes inside the target cell."
      - "Consider the steps needed before a new protein is ready."
      - "Compare the speed of a surface signal with a change in gene expression."
    diagram: null
    confidence: high
  - topic: hormone_mechanism
    type: mcq
    difficulty: medium
    role: procedure
    stem: "What does a second messenger such as cyclic AMP do in a target cell?"
    correct: "It relays the hormone signal inside the cell and activates enzymes such as protein kinases"
    unit: ""
    wrong:
      - {text: "It binds the hormone on the outer surface of the cell", mistake: "assigns the receptor role to the messenger"}
      - {text: "It is the hormone that the gland secretes", mistake: "confuses the messenger with the first messenger"}
      - {text: "It forms the structure of the plasma membrane", mistake: "assigns a structural role to the messenger"}
    explanation: "After a peptide hormone binds its receptor, cyclic AMP is made inside the cell and activates protein kinases. This cascade amplifies the signal and changes many target proteins."
    hints:
      - "Think about a molecule made inside the cell after the hormone binds the surface."
      - "Consider which enzymes are activated downstream of the signal."
      - "The messenger amplifies the original signal."
    diagram: null
    confidence: high
  - topic: hormone_mechanism
    type: mcq
    difficulty: hard
    role: apply
    stem: "A hormone binds a receptor on the cell surface and produces an effect within seconds. Which hormone type is most likely?"
    correct: "A peptide or amine hormone acting through a membrane receptor"
    unit: ""
    wrong:
      - {text: "A steroid hormone acting on gene expression", mistake: "assumes all hormones act slowly through genes"}
      - {text: "A vitamin acting as a steroid in the nucleus", mistake: "assigns a nuclear route to a surface signal"}
      - {text: "A dissolved gas acting through the nucleus", mistake: "assigns a nuclear route to a gas signal"}
    explanation: "Surface receptor signalling with second messengers produces fast responses, which is typical of peptide and amine hormones. Steroid effects require transcription and are slower."
    hints:
      - "Think about receptors located on the outside of the cell."
      - "Consider which signals act fast enough to produce effects within seconds."
      - "The location of the receptor largely determines the speed of the response."
    diagram: null
    confidence: medium
  - topic: hormone_mechanism
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A synthetic steroid is given to a patient, and its effect on gene transcription in a target tissue appears only after a long delay. Why does the drug act slowly?"
    correct: "It must enter the cell and alter transcription, and the effect then requires new protein synthesis"
    unit: ""
    wrong:
      - {text: "It acts on the cell surface only, which is slow by nature", mistake: "assigns slowness to surface receptors"}
      - {text: "Steroids are destroyed on contact with membranes", mistake: "assumes steroids cannot reach their targets"}
      - {text: "It must travel through the nervous system first", mistake: "assigns a nervous route to a hormone"}
    explanation: "A steroid enters the cell and binds an intracellular receptor, which then changes transcription. The resulting proteins must be made before the tissue responds, so the effect is delayed."
    hints:
      - "Think about how the steroid reaches its target."
      - "Consider what must be made before the target tissue changes."
      - "The effect follows a chain of steps inside the cell."
    diagram: null
    confidence: medium
  - topic: feedback_control_hormones
    type: mcq
    difficulty: easy
    role: recall
    stem: "What type of feedback is most common in hormone control systems?"
    correct: "Negative feedback"
    unit: ""
    wrong:
      - {text: "Positive feedback", mistake: "assumes hormone levels usually amplify themselves"}
      - {text: "Feedforward only", mistake: "assumes control is set only in advance"}
      - {text: "No feedback at all", mistake: "denies that hormone systems are regulated"}
    explanation: "In negative feedback the output of a pathway reduces the stimulus that produced it. This stabilises hormone levels around a set point."
    hints:
      - "The response reduces the stimulus that started it."
      - "Think about how a thermostat switches a heater off once a room warms."
      - "The most common mechanism is the one that stabilises the system."
    diagram: null
    confidence: high
  - topic: feedback_control_hormones
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which hormone raises blood calcium when the level falls, by increasing bone resorption and calcium absorption?"
    correct: "Parathyroid hormone"
    unit: ""
    wrong:
      - {text: "Calcitonin", mistake: "assigns the lowering hormone to the raising role"}
      - {text: "Thyroxine", mistake: "assigns a metabolic hormone to calcium control"}
      - {text: "Oxytocin", mistake: "assigns a labour hormone to calcium control"}
    explanation: "Parathyroid hormone is released when blood calcium falls. It increases bone resorption, calcium reabsorption in the kidney and intestinal calcium absorption, which raises blood calcium."
    hints:
      - "It is secreted from small glands on the back of the thyroid."
      - "Think about the hormone that acts opposite to calcitonin."
      - "It works on bone, kidney and gut to raise the calcium level."
    diagram: null
    confidence: high
  - topic: feedback_control_hormones
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is the release of thyroxine described as following a negative feedback loop?"
    correct: "High thyroxine inhibits the release of TRH and TSH, which lowers further thyroxine production"
    unit: ""
    wrong:
      - {text: "High thyroxine stimulates more TSH, which raises output further", mistake: "reverses the direction of the feedback"}
      - {text: "Thyroxine is released only at night", mistake: "links feedback to a timing rule"}
      - {text: "Thyroxine has no effect on the pituitary or hypothalamus", mistake: "denies the feedback link"}
    explanation: "Thyroxine acts on the hypothalamus and pituitary to reduce TRH and TSH. Less TSH means less thyroxine is produced, which brings the level back toward the set point."
    hints:
      - "Think about how the hypothalamus and pituitary respond to high hormone levels."
      - "Consider what a loop that reduces its own initial signal does."
      - "Trace the signal from the hypothalamus to the pituitary to the thyroid and back."
    diagram: null
    confidence: high
  - topic: feedback_control_hormones
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A hormone level is 100 units. Negative feedback lowers the level by 30 percent. What is the new level in units?"
    correct: "70"
    unit: "units"
    wrong: []
    explanation: "Thirty percent of 100 is 30 units, so subtracting it from 100 leaves 70 units."
    hints:
      - "Calculate 30 percent of the starting level first."
      - "Subtract the reduction from the starting value."
      - "Give the new level in the same units as the starting value."
    diagram: null
    confidence: high
  - topic: feedback_control_hormones
    type: mcq
    difficulty: hard
    role: apply
    stem: "A person has an overactive thyroid producing high levels of thyroxine. Which change in TSH is expected, and why?"
    correct: "TSH falls, because high thyroxine feeds back to suppress the pituitary"
    unit: ""
    wrong:
      - {text: "TSH rises, because thyroxine stimulates the pituitary", mistake: "reverses the feedback"}
      - {text: "TSH stays the same, because the thyroid does not respond to it", mistake: "denies that TSH acts on the thyroid"}
      - {text: "TSH rises to match the thyroid activity", mistake: "assumes the pituitary copies the thyroid's output"}
    explanation: "Thyroxine at high levels inhibits TRH and TSH secretion. Blood TSH therefore falls, which is the expected pattern in primary hyperthyroidism."
    hints:
      - "Think about what the pituitary responds to when thyroxine is high."
      - "Consider the direction in which the feedback loop pushes TSH."
      - "Compare what happens to TSH with what happens to thyroxine."
    diagram: "Draw the hypothalamus, pituitary and thyroid in a loop, with the high thyroxine arrow feeding back to suppress TSH, labelling the direction of each effect."
    confidence: high
  - topic: feedback_control_hormones
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why does a person with an underactive thyroid often have a raised TSH level?"
    correct: "Low thyroxine removes feedback inhibition, so the pituitary releases more TSH"
    unit: ""
    wrong:
      - {text: "Low thyroxine stops the pituitary from making TSH at all", mistake: "assumes TSH is lost when thyroxine is low"}
      - {text: "The thyroid sends TSH to the pituitary to raise thyroxine", mistake: "reverses the direction of TSH"}
      - {text: "Excess iodine produces TSH directly in the blood", mistake: "assigns TSH production to iodine"}
    explanation: "When thyroxine is low, the hypothalamus and pituitary are no longer inhibited, so TRH and TSH rise in an attempt to stimulate the thyroid. This is the usual pattern in primary hypothyroidism."
    hints:
      - "Think about what happens to the feedback signal when thyroxine is low."
      - "Consider which gland is trying to compensate for the low output."
      - "Ask what the pituitary does when it stops receiving the inhibitory signal."
    diagram: "Draw the thyroid-pituitary feedback loop with low thyroxine, showing the removed inhibition and the resulting rise in TSH, labelling each arrow."
    confidence: high
