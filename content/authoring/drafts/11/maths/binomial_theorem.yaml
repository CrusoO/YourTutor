  - topic: pascal_triangle
    type: mcq
    difficulty: medium
    role: explain
    stem: "Which identity is expressed by Pascal's rule for binomial coefficients?"
    correct: "C(n, r) = C(n-1, r-1) + C(n-1, r)"
    unit: ""
    wrong:
      - {text: "C(n, r) = C(n-1, r) times C(n-1, r-1)", mistake: "multiplies the entries instead of adding them"}
      - {text: "C(n, r) = C(n, n-r) + 1", mistake: "confuses the symmetry property with an addition rule"}
      - {text: "C(n, r) = C(n+1, r)", mistake: "uses the wrong row index in the relation"}
    explanation: "Each entry is the sum of the two entries directly above it in the previous row, which is the content of Pascal's rule."
    hints:
      - "Look at which two entries of the previous row lie above an entry."
      - "Think about whether the rule adds or multiplies those two entries."
      - "Check the identity on a small row that you can write out fully."
    diagram: "A small section of Pascal's triangle with one entry highlighted and the two entries above it joined to it by arrows."
    confidence: high
