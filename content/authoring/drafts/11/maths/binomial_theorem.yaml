  - topic: general_and_middle_term
    type: mcq
    difficulty: easy
    role: recall
    stem: "For the expansion of (x + y) to the power 5, which expression is the general term T(r+1)?"
    correct: "C(5, r) x to the power (5 minus r) y to the power r"
    unit: ""
    wrong:
      - {text: "C(5, r) x to the power r y to the power (5 minus r)", mistake: "swaps the powers of x and y"}
      - {text: "C(5, r+1) x to the power (5 minus r) y to the power r", mistake: "shifts the binomial index by one"}
      - {text: "C(5, r) x to the power (5 minus r) y to the power (r+1)", mistake: "raises the power of y by an extra one"}
    explanation: "The general term takes r copies of y and the remaining 5 minus r copies of x, weighted by C(5, r)."
    hints:
      - "Think about how many factors supply y and how many supply x in each term."
      - "The binomial coefficient uses the number of y factors as its lower index."
      - "Check that the exponents of x and y add up to the overall power."
    diagram: null
    confidence: high
