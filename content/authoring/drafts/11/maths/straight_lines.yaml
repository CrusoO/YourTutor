    stem: "The line 5x plus k y equals 15 has equal x-intercept and y-intercept. What is the value of k?"
    correct: "5"
    unit: ""
    wrong: []
    explanation: "The x-intercept is 3, so the y-intercept 15 over k must also be 3, giving k equal to 5."
    hints:
      - "Find the x-intercept by setting y to zero."
