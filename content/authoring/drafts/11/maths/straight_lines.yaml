    stem: "Find the positive value of c for which the distance from the point (2, 1) to the line 3x minus 4y plus c equals 0 is 1."
    correct: "3"
    unit: ""
    wrong: []
    explanation: "Substituting the point gives the absolute value of 2 plus c over 5 equal to 1, so 2 plus c equals 5 for the positive solution, giving c equal to 3."
    hints:
      - "Substitute the point into the left side of the line equation."
      - "Set the absolute value of the result divided by the normal length equal to the given distance."
      - "Remove the absolute value by considering both signs and keep the solution that is positive."
