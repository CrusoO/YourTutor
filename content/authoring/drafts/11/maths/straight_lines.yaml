  - topic: slope_and_forms
    type: numeric
    difficulty: easy
    role: recall
    stem: "What is the slope of the straight line passing through the points (1, 2) and (4, 11)?"
    correct: "3"
    unit: ""
    wrong: []
    explanation: "The slope is the change in y, 11 minus 2, divided by the change in x, 4 minus 1, which gives 9 over 3, or 3."
    hints:
      - "Recall the formula for the slope between two points."
      - "Subtract the y coordinates and the x coordinates in the same order."
      - "Divide the change in y by the change in x."
    diagram: null
    confidence: high
  - topic: slope_and_forms
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which equation is the point-slope form of the line through (2, -1) with slope 4?"
    correct: "y + 1 = 4(x - 2)"
    unit: ""
    wrong:
      - {text: "y - 1 = 4(x + 2)", mistake: "flips the signs of both coordinates of the point"}
      - {text: "y + 1 = 4(x + 2)", mistake: "gets the sign of the x coordinate wrong"}
      - {text: "y - 1 = 4(x - 2)", mistake: "gets the sign of the y coordinate wrong"}
    explanation: "The point-slope form is y minus y1 equals m times (x minus x1), and with (2, -1) this becomes y + 1 = 4(x - 2)."
    hints:
      - "Write the point-slope form using a general point on the line."
      - "Subtract the coordinates of the given point, keeping their signs in mind."
      - "Substitute the slope into the form you wrote."
    diagram: null
    confidence: high
  - topic: slope_and_forms
    type: numeric
    difficulty: medium
    role: explain
    stem: "A straight line has slope minus 2 and passes through the point (3, 5). What is its y-intercept?"
    correct: "11"
    unit: ""
    wrong: []
    explanation: "Starting from y minus 5 equal to minus 2 times (x minus 3) gives y equal to minus 2x plus 11, so the intercept is 11."
    hints:
      - "Write the point-slope form using the given point and slope."
      - "Expand the right side and collect the constant terms."
      - "The constant term that remains after rearranging is the y-intercept."
    diagram: "Coordinate axes with a straight line of negative slope passing through a marked point, and the point where it crosses the vertical axis labelled."
    confidence: high
  - topic: slope_and_forms
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which line is perpendicular to the line y equal to 3x minus 4?"
    correct: "x + 3y = 6"
    unit: ""
    wrong:
      - {text: "3x + y = 2", mistake: "takes the negative of the slope without taking its reciprocal"}
      - {text: "y = 3x + 1", mistake: "keeps the same slope, which gives a parallel line"}
      - {text: "x - 3y = 1", mistake: "takes the reciprocal but keeps the wrong sign"}
    explanation: "The given slope is 3, so the perpendicular slope is minus one third, and x + 3y = 6 has slope minus one third."
    hints:
      - "Find the slope of the given line from its equation."
      - "Perpendicular lines have slopes whose product is minus one."
      - "Rearrange each candidate into slope form and test the product."
    diagram: "Coordinate axes showing the given line of positive slope and a second line crossing it at a right angle."
    confidence: high
  - topic: slope_and_forms
    type: numeric
    difficulty: hard
    role: procedure
    stem: "A line passes through the points (2, 1) and (6, 7). Where does this line cross the horizontal axis? Give the x-coordinate as a decimal rounded to two decimal places."
    correct: "1.33"
    unit: ""
    wrong: []
    explanation: "The slope is 6 over 4, or 3 over 2, and the line y minus 1 equal to 3 over 2 times (x minus 2) meets y equal to zero at x equal to 4 over 3, about 1.33."
    hints:
      - "Find the slope from the two given points first."
      - "Write the equation of the line using one of the points."
      - "Set the vertical coordinate to zero and solve for the horizontal one."
    diagram: "Coordinate axes with a straight line rising through two marked points and extended to meet the horizontal axis at a labelled point on the left."
    confidence: high
  - topic: slope_and_forms
    type: mcq
    difficulty: hard
    role: transfer
    stem: "What is the slope of the line through the point (1, 3) that is perpendicular to a line with slope 2?"
    correct: "minus one half"
    unit: ""
    wrong:
      - {text: "2", mistake: "copies the slope of the given line"}
      - {text: "one half", mistake: "takes the reciprocal but drops the sign"}
      - {text: "minus 2", mistake: "keeps the magnitude and only flips the sign"}
    explanation: "Perpendicular slopes multiply to minus one, so 2 times the new slope equals minus one, giving minus one half."
    hints:
      - "Recall the relationship between the slopes of two perpendicular lines."
      - "Set the product of the two slopes equal to minus one."
      - "Solve that equation for the unknown slope."
    diagram: null
    confidence: high
  - topic: intercept_and_general_form
    type: numeric
    difficulty: easy
    role: recall
    stem: "What is the x-intercept of the line 3x plus 4y equals 12?"
    correct: "4"
    unit: ""
    wrong: []
    explanation: "Setting y to zero gives 3x equal to 12, so the x-intercept is 4."
    hints:
      - "The x-intercept is where the line meets the horizontal axis."
      - "On that axis the vertical coordinate is zero, so set y to zero."
      - "Solve the remaining equation for x."
    diagram: null
    confidence: high
  - topic: intercept_and_general_form
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which equation is the general form of the line with intercepts 2 on the x-axis and 5 on the y-axis?"
    correct: "5x + 2y - 10 = 0"
    unit: ""
    wrong:
      - {text: "5x + 2y + 10 = 0", mistake: "flips the sign of the constant term"}
      - {text: "2x + 5y - 10 = 0", mistake: "swaps the intercept values between the variables"}
      - {text: "5x - 2y - 10 = 0", mistake: "changes the sign of the y term"}
    explanation: "The intercept form x over 2 plus y over 5 equals 1, multiplied by 10, gives 5x plus 2y equal to 10."
    hints:
      - "Start from the intercept form, with each variable divided by its intercept."
      - "Clear the fractions by multiplying through by the product of the intercepts."
      - "Move every term to one side to get the general form."
    diagram: null
    confidence: high
  - topic: intercept_and_general_form
    type: numeric
    difficulty: medium
    role: procedure
    stem: "What is the y-intercept of the line 2x minus 3y plus 9 equals 0?"
    correct: "3"
    unit: ""
    wrong: []
    explanation: "Setting x to zero gives minus 3y plus 9 equal to 0, so y equals 3."
    hints:
      - "The y-intercept is where the line crosses the vertical axis, so set the other variable to zero."
      - "Substitute that value and solve the resulting equation for the remaining variable."
      - "Take care with the sign when moving the constant term."
    diagram: null
    confidence: high
  - topic: intercept_and_general_form
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which intercept form represents the line 4x minus 6y equals 12?"
    correct: "x over 3 minus y over 2 equals 1"
    unit: ""
    wrong:
      - {text: "x over 3 plus y over 2 equals 1", mistake: "drops the sign of the y term when dividing"}
      - {text: "x over 6 minus y over 4 equals 1", mistake: "divides the x term by 2 instead of by 12"}
      - {text: "x over 3 minus y over 2 equals 0", mistake: "forgets to divide the constant on the right side"}
    explanation: "Dividing the whole equation by 12 gives x over 3 minus y over 2 equal to 1, which is the intercept form."
    hints:
      - "Divide every term of the equation by the constant on the right side."
      - "Each variable term should end with its coefficient in the denominator."
      - "Keep track of the sign of each term as you divide."
    diagram: null
    confidence: high
