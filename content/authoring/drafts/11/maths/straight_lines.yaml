  - topic: distance_point_line
    type: numeric
    difficulty: easy
    role: recall
    stem: "What is the perpendicular distance from the origin to the line 3x plus 4y equals 10?"
    correct: "2"
    unit: "units"
    wrong: []
    explanation: "The distance is the absolute value of minus 10 divided by the square root of 3 squared plus 4 squared, which is 10 over 5."
    hints:
      - "Use the standard formula for the distance from a point to a line."
      - "Substitute the coordinates of the point into the left side of the line equation."
      - "Divide the absolute value by the square root of the sum of the squared coefficients."
    diagram: null
    confidence: high
  - topic: distance_point_line
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which expression gives the perpendicular distance from the point (x1, y1) to the line ax plus by plus c equals 0?"
    correct: "|a x1 + b y1 + c| / sqrt(a^2 + b^2)"
    unit: ""
    wrong:
      - {text: "|a x1 + b y1 + c| / (a + b)", mistake: "adds the coefficients instead of their squares under a root"}
      - {text: "(a x1 + b y1 + c) / sqrt(a^2 + b^2)", mistake: "drops the absolute value that keeps the distance positive"}
      - {text: "|a x1 - b y1 + c| / sqrt(a^2 + b^2)", mistake: "flips the sign of the y term when substituting"}
    explanation: "The distance formula divides the absolute value of the substituted expression by the square root of the sum of squared coefficients."
    hints:
      - "Substitute the point into the left side of the line equation."
      - "Think about why the distance must always be non-negative."
      - "The denominator uses the length of the normal vector of the line."
    diagram: null
    confidence: high
  - topic: distance_point_line
    type: numeric
    difficulty: medium
    role: explain
    stem: "What is the perpendicular distance from the point (1, 2) to the line y equal to 2x plus 1? Give the answer as a decimal rounded to three places."
    correct: "0.447"
    unit: "units"
    wrong: []
    explanation: "Writing the line as 2x minus y plus 1 equal to 0 gives an absolute value of 1 over the square root of 5, which is about 0.447."
    hints:
      - "Rewrite the line in the general form with all terms on one side."
      - "Substitute the point into the general form and take the absolute value."
      - "Divide by the square root of the sum of squared coefficients and round at the end."
    diagram: "Coordinate axes with a straight line of slope 2 and a marked point above it, with a perpendicular segment dropped from the point to the line."
    confidence: high
  - topic: distance_point_line
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which point lies on the line x minus y equals 3?"
    correct: "(5, 2)"
    unit: ""
    wrong:
      - {text: "(2, 5)", mistake: "swaps the coordinates before substituting"}
      - {text: "(0, 0)", mistake: "uses the origin as a default answer without substituting"}
      - {text: "(4, 2)", mistake: "subtracts incorrectly when testing the point"}
    explanation: "Substituting (5, 2) gives 5 minus 2, which equals 3, so the point lies on the line and its distance from the line is zero."
    hints:
      - "A point lies on a line when its coordinates satisfy the line equation."
      - "Substitute each candidate point and evaluate the left side."
      - "Check whether the result equals the constant on the right side."
    diagram: "Coordinate axes with the line x minus y equals 3 drawn as a straight line and several candidate points marked, one of them on the line."
    confidence: high
