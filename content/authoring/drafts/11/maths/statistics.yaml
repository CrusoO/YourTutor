items:
  - topic: measures_of_dispersion
    type: numeric
    difficulty: easy
    role: recall
    stem: "What is the mean deviation about the mean of the data values 2, 4, 6 and 8?"
    correct: "2"
    unit: ""
    wrong: []
    explanation: "The mean is 5, the absolute deviations are 3, 1, 1 and 3, which total 8, and dividing by 4 gives 2."
    hints:
      - "Find the mean of the data first."
      - "Take the distance of each value from that mean, ignoring the direction."
      - "Average those distances over the number of values."
    diagram: null
    confidence: high
  - topic: measures_of_dispersion
    type: mcq
    difficulty: easy
    role: recall
    stem: "How is the variance of a data set defined?"
    correct: "the mean of the squared deviations from the mean"
    unit: ""
    wrong:
      - {text: "the mean of the absolute deviations from the mean", mistake: "uses absolute values where squares are required"}
      - {text: "the square root of the mean deviation", mistake: "confuses variance with the standard deviation"}
      - {text: "the difference between the largest and smallest values", mistake: "confuses spread with the range"}
    explanation: "Variance averages the squares of the deviations of each value from the mean."
    hints:
      - "Think about how each value differs from the mean and what is done to those differences."
      - "Recall why squaring is used instead of taking absolute values."
      - "Average the quantities you formed from the differences."
    diagram: null
    confidence: high
  - topic: measures_of_dispersion
    type: numeric
    difficulty: medium
    role: procedure
    stem: "What is the variance of the data values 2, 4, 6 and 8?"
    correct: "5"
    unit: ""
