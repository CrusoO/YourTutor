    stem: "Which statement about the values of C(10, 3) and C(10, 7) is true?"
    correct: "they are equal"
    unit: ""
    wrong:
      - {text: "C(10, 3) is ten times larger than C(10, 7)", mistake: "treats the lower index as a multiplier"}
      - {text: "C(10, 7) is greater than C(10, 3)", mistake: "assumes a larger lower index always gives a larger count"}
      - {text: "they differ by 7", mistake: "subtracts the lower indices to compare the values"}
    explanation: "Choosing 3 objects to include is the same as choosing 7 to leave out, so C(10, 3) and C(10, 7) are equal."
    hints:
      - "Think about what it means to choose a group to include versus to leave out."
      - "Compare the number of objects in the chosen group with the number left behind."
      - "Consider whether the two selections can be paired one to one."
