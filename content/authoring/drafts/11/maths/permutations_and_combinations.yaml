  - topic: fundamental_principle_counting
    type: mcq
    difficulty: medium
    role: apply
    stem: "In how many ways can 4 people sit in a row if two specific people must sit next to each other?"
    correct: "12"
    unit: ""
    wrong:
      - {text: "24", mistake: "ignores the requirement that the two people sit together"}
      - {text: "6", mistake: "forgets the two possible orders of the pair inside the block"}
      - {text: "8", mistake: "counts only the positions of the block without arranging the others"}
    explanation: "Treat the pair as one block, giving 3 units to arrange in 3 times 2 ways, so there are 6 times 2 equal 12 arrangements."
    hints:
      - "Glue the two specific people together as one unit."
      - "Arrange the units that remain, then consider the order inside the glued unit."
      - "Multiply the arrangements of the units by the internal orders."
    diagram: null
    confidence: high
