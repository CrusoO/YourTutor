    stem: "In how many ways can 5 distinct flags be arranged in a single row?"
    correct: "120"
    unit: ""
    wrong: []
    explanation: "The five positions can be filled with 5, 4, 3, 2 and 1 choices, and the product of these is 120."
    hints:
      - "Each position in the row can be filled by any flag not yet placed."
      - "Count the choices available at the first position, then the second, and so on."
      - "Multiply the decreasing counts to get the total arrangements."
