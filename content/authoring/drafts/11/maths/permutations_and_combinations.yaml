  - topic: combinations
    type: numeric
    difficulty: easy
    role: recall
    stem: "How many different committees of 2 people can be chosen from a group of 5 people?"
    correct: "10"
    unit: ""
    wrong: []
    explanation: "The number of ways to choose 2 from 5 is 5 times 4 divided by 2, which is 10."
    hints:
      - "Order does not matter for a committee, so pairs that differ only in order count once."
      - "Count the ordered choices first and then remove the duplicates."
      - "Divide the ordered count by the number of ways to arrange the chosen pair."
    diagram: null
    confidence: high
  - topic: combinations
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which expression equals the number of ways to choose r objects from n distinct objects?"
    correct: "n factorial over (r factorial times (n minus r) factorial)"
    unit: ""
    wrong:
      - {text: "n factorial over (n minus r) factorial", mistake: "forgets the division by the factorial of the chosen count"}
      - {text: "n factorial over r factorial", mistake: "forgets the factorial of the unchosen count"}
      - {text: "r factorial over n factorial", mistake: "inverts the fraction"}
    explanation: "Selections are ordered arrangements divided by the orderings of the chosen and unchosen groups, giving n factorial over r factorial times (n minus r) factorial."
    hints:
      - "Start from the count of ordered selections and remove the orderings inside the chosen group."
      - "The unchosen objects also need their own factorial in the denominator."
      - "Check the formula on a very small case where the answer is obvious."
    diagram: null
    confidence: high
