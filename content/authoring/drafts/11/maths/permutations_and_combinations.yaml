  - topic: permutations
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which expression gives the value of P(6, 2), the number of ordered arrangements of 2 objects chosen from 6?"
    correct: "6 times 5"
    unit: ""
    wrong:
      - {text: "6 times 4", mistake: "reduces the second factor by two instead of one"}
      - {text: "6 plus 5", mistake: "adds the factors instead of multiplying them"}
      - {text: "6 factorial over 2 factorial", mistake: "uses the wrong denominator in the factorial formula"}
    explanation: "The first object has 6 choices and the second has 5, so P(6, 2) equals 6 times 5, which is 30."
    hints:
      - "Think about how many choices there are for the first object."
      - "Count the remaining choices for the second object after the first is placed."
      - "Multiply the two counts to get the ordered arrangements."
    diagram: null
    confidence: high
  - topic: permutations
    type: numeric
    difficulty: medium
    role: procedure
    stem: "How many distinct arrangements are there of the letters of the word BANANA?"
    correct: "60"
    unit: ""
    wrong: []
    explanation: "The word has 6 letters including 3 As and 2 Ns, so the count is 6 factorial divided by 3 factorial times 2 factorial, which is 60."
    hints:
      - "First count the arrangements as if all the letters were different."
      - "Identify how many copies of each letter the word contains."
      - "Divide by the number of orderings of each group of identical letters."
