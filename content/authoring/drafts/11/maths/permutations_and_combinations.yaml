  - topic: fundamental_principle_counting
    type: mcq
    difficulty: easy
    role: recall
    stem: "A password is two letters followed by one digit, with repetition allowed. There are 26 letters and 10 digits available. Which expression counts the possible passwords?"
    correct: "26 times 26 times 10"
    unit: ""
    wrong:
      - {text: "26 times 25 times 10", mistake: "assumes the letters cannot repeat when repetition is allowed"}
      - {text: "26 plus 26 plus 10", mistake: "adds the choices at each position instead of multiplying"}
      - {text: "26 times 10", mistake: "leaves out one of the letter positions"}
    explanation: "Each letter position has 26 options and the digit position has 10, so the product of these counts is the answer."
    hints:
      - "Consider each position of the password separately."
      - "Check whether a letter used earlier is still available later."
      - "Combine the counts for the positions by multiplying them."
    diagram: null
    confidence: high
  - topic: fundamental_principle_counting
    type: numeric
    difficulty: medium
    role: explain
    stem: "How many three-digit numbers can be formed using the digits 1 to 5 with no digit repeated?"
    correct: "60"
    unit: ""
    wrong: []
    explanation: "There are 5 choices for the hundreds, 4 for the tens and 3 for the units, giving 5 times 4 times 3."
    hints:
      - "Fill the three positions one at a time, starting from the hundreds place."
      - "Each position loses one digit that was already used in an earlier place."
      - "Multiply the number of choices at the three positions."
