    confidence: high
  - topic: laws_of_sets
    type: mcq
    difficulty: hard
    role: transfer
    stem: "For finite sets A and B, n(A) equals n(B) and A union B has the same size as A. Which statement must hold?"
    correct: "A equals B"
    unit: ""
    wrong:
      - {text: "A is a proper subset of B", mistake: "assumes equal sizes make one set strictly smaller than the other"}
      - {text: "A and B are disjoint", mistake: "assumes that sets of equal size cannot share members"}
      - {text: "A intersection B is empty", mistake: "reads the union condition as meaning no shared elements"}
    explanation: "The union not growing forces B to lie inside A, and equal sizes then force the two sets to coincide."
    hints:
      - "Use the union condition to decide where the members of B must sit."
      - "Combine that containment with the fact that the two sizes agree."
      - "Ask whether a strict containment is possible when the sizes match."
