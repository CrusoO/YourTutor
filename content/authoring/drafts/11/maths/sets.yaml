  - topic: venn_and_operations
    type: mcq
    difficulty: easy
    role: recall
    stem: "In a Venn diagram of sets A and B, which elements does the intersection of A and B represent?"
    correct: "elements common to the two sets"
    unit: ""
    wrong:
      - {text: "elements in A or B but not in both", mistake: "confuses intersection with the symmetric difference"}
      - {text: "elements in A but not in B", mistake: "uses the difference operation instead of intersection"}
      - {text: "elements belonging to either A or B", mistake: "confuses intersection with union"}
    explanation: "The intersection is the overlap of the two circles, holding only the elements that belong to both sets."
    hints:
      - "Picture the region where the two circles overlap."
      - "Ask which elements are shared by both sets at once."
      - "Compare this with a region that collects everything in either circle."
    diagram: "Two overlapping circles labelled A and B placed inside a rectangle labelled U, with the overlap region marked."
    confidence: high
