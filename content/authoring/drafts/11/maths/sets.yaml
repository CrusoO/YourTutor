    type: numeric
    difficulty: hard
    role: procedure
    stem: "For sets A and B, n(A) is 20, n(B) is 15 and n(A union B) is 28. What is n(A intersection B)?"
    correct: "7"
    unit: ""
    wrong: []
    explanation: "Using n(A union B) equals n(A) plus n(B) minus n(A intersection B), the overlap is 20 plus 15 minus 28, which is 7."
    hints:
      - "Start from the formula that links the union size with the two set sizes."
      - "Isolate the overlap term on one side of the equation."
      - "Rearrange the three counts you were given to find the missing one."
