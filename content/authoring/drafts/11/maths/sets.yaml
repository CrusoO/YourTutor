  - topic: set_notation_types
    type: mcq
    difficulty: medium
    role: apply
    stem: "Set A holds the letters of the word RATE and set B holds the letters of the word TEAR. What is the relationship between A and B?"
    correct: "A equals B"
    unit: ""
    wrong:
      - {text: "A is a proper subset of B", mistake: "assumes order of listing decides set size"}
      - {text: "A and B have no common elements", mistake: "compares letters by position instead of by membership"}
      - {text: "A is a superset of B only", mistake: "assumes the first listed word always gives the larger set"}
    explanation: "Both words use exactly the letters R, A, T and E, so both sets contain the same four elements."
    hints:
      - "Write out the letters of each word as a separate list."
      - "A set ignores the order in which its members appear."
      - "Check whether each member of one set appears in the other."
    diagram: null
    confidence: high
