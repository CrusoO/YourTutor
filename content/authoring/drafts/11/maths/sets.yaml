  - topic: set_notation_types
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Set X is written {x : x is a real number and x squared equals -1}. Which statement about X is correct?"
    correct: "X is the empty set"
    unit: ""
    wrong:
      - {text: "X contains the number i", mistake: "treats the imaginary unit as a real solution"}
      - {text: "X contains 1 and -1", mistake: "takes the square root of negative one as if it were positive one"}
      - {text: "X is the set {0}", mistake: "assumes zero is the only real value to check"}
    explanation: "No real number has a negative square, so no real x satisfies the rule and X has no members."
    hints:
      - "Ask whether any real number multiplied by itself can give a negative result."
      - "Think about the sign of x squared for every real value of x."
      - "A collection with no members at all has a special name, so match that name to X."
