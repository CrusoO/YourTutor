      - {text: "pi divided by 180 radians", mistake: "inverts the conversion factor"}
      - {text: "180 pi radians", mistake: "multiplies by pi instead of relating the two units"}
    explanation: "A straight angle is half a full turn, and a full turn is 2 pi radians, so 180 degrees equals pi radians."
    hints:
      - "Recall how many radians make up one complete turn around a circle."
      - "A straight angle is half of that complete turn."
      - "Relate the degree measure of a straight angle to the radian measure of half a turn."
