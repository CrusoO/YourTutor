items:
  - topic: cartesian_product_relations
    type: numeric
    difficulty: easy
    role: recall
    stem: "Set A has 2 elements and set B has 3 elements. How many ordered pairs does the Cartesian product A cross B contain?"
    correct: "6"
    unit: ""
    wrong: []
    explanation: "Each ordered pair takes one element from A and one from B, so there are 2 times 3 pairs."
    hints:
      - "Each ordered pair takes one choice from the first set and one from the second."
      - "Count the choices available for the first position."
      - "Multiply the number of choices in the two positions together."
    diagram: null
    confidence: high
  - topic: cartesian_product_relations
    type: mcq
    difficulty: easy
    role: recall
    stem: "Let A have the single element x and let B have the two elements y and z. Which ordered pair belongs to the Cartesian product of A with B?"
    correct: "(x, y)"
    unit: ""
    wrong:
      - {text: "(y, x)", mistake: "swaps the order of the coordinates"}
      - {text: "(x, x)", mistake: "takes the first set twice"}
      - {text: "(z, y)", mistake: "takes the first coordinate from the second set"}
    explanation: "The first coordinate must come from {x} and the second from {y, z}, so (x, y) is valid and the others are not."
    hints:
      - "The first slot of every pair must come from the first set."
      - "The second slot must come from the second set."
      - "Check each candidate pair against both of those rules."
    diagram: null
    confidence: high
  - topic: cartesian_product_relations
    type: numeric
    difficulty: medium
    role: explain
    stem: "A relation R from A = {1, 2, 3} to B = {2, 4} pairs a with b whenever b equals double a. How many ordered pairs are in R?"
    correct: "2"
    unit: ""
    wrong: []
    explanation: "The pairs (1, 2) and (2, 4) satisfy the rule, while the doubled value 6 for a equal to 3 is not in B."
    hints:
      - "Test each element of the first set against the rule."
      - "Check whether the doubled value is actually an element of the second set."
      - "Count only the pairs that pass both checks."
    diagram: null
    confidence: high
  - topic: cartesian_product_relations
    type: mcq
    difficulty: medium
    role: apply
    stem: "Let A = {1, 2} and B = {1, 2, 3}. Which of these sets is a relation from A to B?"
    correct: "{(1, 1), (2, 3)}"
    unit: ""
    wrong:
      - {text: "{(1, 4), (2, 1)}", mistake: "uses an element that is not in B"}
      - {text: "{(3, 1)}", mistake: "takes the first coordinates from B instead of A"}
      - {text: "{(1, 2, 3)}", mistake: "writes triples where ordered pairs are required"}
    explanation: "Every first coordinate must lie in A and every second coordinate in B, and only the set with (1, 1) and (2, 3) meets both conditions."
    hints:
      - "Check the first coordinate of every pair against the first set."
      - "Check the second coordinate of every pair against the second set."
      - "Reject any candidate that contains an entry which is not a pair."
    diagram: null
    confidence: high
  - topic: cartesian_product_relations
    type: numeric
    difficulty: hard
    role: transfer
    stem: "Set A has 3 elements and set B has 4 elements. How many different relations can be formed from A to B?"
    correct: "4096"
    unit: ""
    wrong: []
    explanation: "A and B produce 12 possible ordered pairs, and each pair is either included or excluded, giving 2 to the power 12."
    hints:
      - "Count the total number of ordered pairs that can be formed from A to B."
      - "Each possible pair is either in the relation or left out of it."
      - "Raise a base of two to the power of the pair count you found."
    diagram: null
    confidence: high
  - topic: cartesian_product_relations
    type: mcq
    difficulty: hard
    role: transfer
    stem: "The Cartesian product A cross B equals {(1, 3), (1, 4), (2, 3), (2, 4)}. Which pair of sets gives this product?"
    correct: "A = {1, 2} and B = {3, 4}"
    unit: ""
    wrong:
      - {text: "A = {1, 2, 3} and B = {3, 4}", mistake: "adds an extra element to A without checking the pairs"}
      - {text: "A = {3, 4} and B = {1, 2}", mistake: "swaps the order of the Cartesian product"}
      - {text: "A = {1} and B = {2, 3, 4}", mistake: "reads only the first pair to find the sets"}
    explanation: "The first coordinates are 1 and 2 and the second coordinates are 3 and 4, so A is {1, 2} and B is {3, 4}."
    hints:
      - "Collect the distinct first coordinates from the listed pairs."
      - "Collect the distinct second coordinates from the same list."
      - "Verify that every combination of your two collections appears in the product."
    diagram: null
    confidence: high
  - topic: functions_domain_range
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the domain of the function f(x) = x + 5 when the inputs are real numbers?"
    correct: "all real numbers"
    unit: ""
    wrong:
      - {text: "all positive real numbers", mistake: "assumes inputs must be positive"}
      - {text: "all integers", mistake: "restricts real inputs to whole numbers"}
      - {text: "all real numbers except 5", mistake: "treats the added constant as a value to exclude"}
    explanation: "A linear expression can be evaluated at every real number, so the domain is the whole real line."
    hints:
      - "Ask which inputs the expression can accept without any breakdown."
      - "A linear rule has no division and no square roots to worry about."
      - "Check whether any real value makes the rule undefined."
    diagram: null
    confidence: high
  - topic: functions_domain_range
    type: numeric
    difficulty: easy
    role: recall
    stem: "For the function f(x) = 2x + 3, what is the value of f(4)?"
    correct: "11"
    unit: ""
    wrong: []
    explanation: "Substituting 4 gives 2 times 4 plus 3, which equals 11."
    hints:
      - "Substitute the given input into the rule in place of the variable."
      - "Multiply the input by the coefficient first."
      - "Add the constant term to that product."
    diagram: null
    confidence: high
  - topic: functions_domain_range
    type: numeric
    difficulty: medium
    role: procedure
    stem: "The function f(x) = 5 - x squared is defined for all real numbers. What is the maximum value of f?"
    correct: "5"
    unit: ""
    wrong: []
    explanation: "The square term is never negative and is smallest at zero, so subtracting it from 5 gives the largest output 5."
    hints:
      - "Think about the smallest value the square term can take."
      - "A square of a real number is never negative."
      - "Subtract that smallest square from the constant term."
    diagram: null
    confidence: high
  - topic: functions_domain_range
    type: mcq
    difficulty: medium
    role: apply
    stem: "For f(x) = 1 divided by (x - 2), with real inputs, which set is the domain of f?"
    correct: "all real numbers except 2"
    unit: ""
    wrong:
      - {text: "all real numbers except 1", mistake: "shifts the excluded point in the wrong direction"}
      - {text: "all real numbers except 0", mistake: "forgets the shift and sets the denominator equal to x"}
      - {text: "all real numbers greater than 2", mistake: "treats the denominator as a positivity condition"}
    explanation: "The denominator is zero only when x equals 2, so that single input must be removed from the domain."
    hints:
      - "Find which input would make the denominator equal to zero."
      - "Solve the denominator set equal to zero for x."
      - "Any input that breaks the rule is left out of the domain."
    diagram: null
    confidence: high
  - topic: functions_domain_range
    type: mcq
    difficulty: hard
    role: procedure
    stem: "For f(x) = square root of (x - 3), with real inputs, which set is the range of f?"
    correct: "all non-negative real numbers"
    unit: ""
    wrong:
      - {text: "all real numbers", mistake: "ignores that the square root gives only one sign of output"}
      - {text: "all real numbers from 3 onwards", mistake: "reads the domain as if it were the range"}
      - {text: "all positive real numbers", mistake: "excludes the output zero that is actually attained"}
    explanation: "The input must be at least 3, where the root is 0, and the root then grows without bound, so outputs cover all non-negative reals."
    hints:
      - "Ask which input makes the quantity under the square root equal to zero."
      - "A square root symbol produces outputs of only one sign."
      - "Compare the output at the smallest allowed input with the outputs that follow it."
    diagram: null
    confidence: high
  - topic: functions_domain_range
    type: numeric
    difficulty: hard
    role: transfer
    stem: "The function f(x) = 1 divided by (x squared minus 5x plus 6) is defined on real numbers except where the denominator is zero. What is the sum of the excluded real values?"
    correct: "5"
    unit: ""
    wrong: []
    explanation: "The denominator factors as (x - 2)(x - 3), so the excluded values are 2 and 3, and their sum is 5."
    hints:
      - "Factor the quadratic in the denominator before anything else."
      - "The excluded values are the inputs that make the denominator zero."
      - "Add the two roots you find from the factors."
    diagram: null
    confidence: high
  - topic: graphs_of_functions
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which description matches the graph of the identity function f(x) = x over the real numbers?"
    correct: "a straight line through the origin with slope 1"
    unit: ""
    wrong:
      - {text: "a horizontal line at height 1", mistake: "confuses the slope with a constant output value"}
      - {text: "a parabola opening upward", mistake: "confuses a linear rule with a quadratic one"}
      - {text: "a straight line through the origin with slope 2", mistake: "doubles the slope when reading the rule"}
    explanation: "Each output equals its input, so the graph passes through the origin and rises one unit for every unit moved right."
    hints:
      - "Pick a few inputs and find their outputs under the rule."
      - "Notice how the output changes when the input increases by one."
      - "Plot the points you computed and see whether they lie on a single line."
    diagram: "Coordinate axes with a straight line passing through the origin at a 45 degree angle, labelled y equals x."
    confidence: high
  - topic: graphs_of_functions
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the shape of the graph of the absolute value function f(x) = |x| over the real numbers?"
    correct: "a V shape with its vertex at the origin"
    unit: ""
    wrong:
      - {text: "a U shape with its vertex at (1, 0)", mistake: "moves the vertex away from the origin"}
      - {text: "a straight line with slope -1", mistake: "ignores the absolute value and keeps only the sign"}
      - {text: "a horizontal line through the origin", mistake: "treats the output as constant"}
    explanation: "Outputs are always non-negative, falling to zero at the origin and rising on both sides, which forms a V."
    hints:
      - "Compare the outputs for a positive input and its negative partner."
      - "Notice where the output is smallest."
      - "Think about how the two arms of the graph meet."
    diagram: null
    confidence: high
  - topic: graphs_of_functions
    type: mcq
    difficulty: medium
    role: explain
    stem: "The graph of y = x squared is shifted 3 units to the left. Which equation describes the shifted graph?"
    correct: "y = (x + 3) squared"
    unit: ""
    wrong:
      - {text: "y = (x - 3) squared", mistake: "moves the graph in the opposite horizontal direction"}
      - {text: "y = x squared + 3", mistake: "shifts the graph vertically instead of horizontally"}
      - {text: "y = (x + 3) squared + 3", mistake: "applies a horizontal shift and a vertical shift together"}
    explanation: "A leftward shift by h replaces x with x plus h, so the shifted parabola is y equals (x + 3) squared."
    hints:
      - "Recall how replacing the input with a shifted expression moves the graph."
      - "A move to the left corresponds to adding inside the bracket."
      - "Check that the vertex of the new parabola sits at the expected horizontal position."
    diagram: "A parabola y equals x squared with its vertex at the origin, and a second copy whose vertex has moved left along the x axis."
    confidence: high
  - topic: graphs_of_functions
    type: numeric
    difficulty: medium
    role: procedure
    stem: "The graph of f(x) = |x| is reflected in the x-axis. What is the output of the reflected graph at x equal to 4?"
    correct: "-4"
    unit: ""
    wrong: []
    explanation: "The original output at 4 is 4, and reflecting in the x-axis flips its sign to give negative 4."
    hints:
      - "Find the original output of the absolute value function at the given input."
      - "A reflection in the x-axis changes the sign of every output."
      - "Apply the sign change to the original value you found."
    diagram: null
    confidence: medium
  - topic: graphs_of_functions
    type: numeric
    difficulty: hard
    role: procedure
    stem: "A piecewise function equals 2x for x less than 1 and equals x + 3 for x at least 1. What is the value of the function at x equal to 1?"
    correct: "4"
    unit: ""
    wrong: []
    explanation: "At x equal to 1 the rule for x at least 1 applies, giving 1 plus 3, which is 4."
    hints:
      - "Check which branch of the definition includes the boundary input."
      - "Use the rule that covers values greater than or equal to the boundary."
      - "Substitute the boundary input into that branch only."
    diagram: "Two line segments meeting at x equal to 1; the left segment ends with an open circle at the boundary and the right segment starts with a filled circle there."
    confidence: high
  - topic: graphs_of_functions
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which description fits the graph of y = minus x squared plus 4 over the real numbers?"
    correct: "a downward parabola crossing the x-axis at two points"
    unit: ""
    wrong:
      - {text: "an upward parabola with its vertex at height 4", mistake: "ignores the negative sign in front of the square"}
      - {text: "a downward parabola with no crossings of the x-axis", mistake: "misjudges where the graph meets zero"}
      - {text: "an upward parabola crossing the x-axis at one point", mistake: "reads the parabola as opening upward with a double root"}
    explanation: "The negative leading coefficient opens the parabola downward, and solving minus x squared plus 4 equal to zero gives two real roots."
    hints:
      - "Look at the sign in front of the squared term to decide the opening direction."
      - "Find the inputs where the output becomes zero by isolating the square."
      - "Count how many real inputs satisfy the condition you found."
    diagram: "Coordinate axes showing a downward opening parabola whose peak lies above the x-axis and whose two arms cross the x-axis."
    confidence: medium
