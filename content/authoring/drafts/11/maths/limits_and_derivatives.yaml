  - topic: limit_algebra
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which statement is a correct rule for limits when each limit exists?"
    correct: "the limit of a sum equals the sum of the limits"
    unit: ""
    wrong:
      - {text: "the limit of a product equals the sum of the limits", mistake: "confuses the rule for products with the rule for sums"}
      - {text: "the limit of a quotient equals the quotient of the limits even when the denominator limit is zero", mistake: "ignores the condition that the denominator limit must be nonzero"}
      - {text: "the limit of a sum always exists", mistake: "forgets that the individual limits must exist first"}
    explanation: "When each individual limit exists, the limit of a sum is the sum of the individual limits, which is one of the basic algebra rules."
    hints:
      - "Think about what the rule says when a function is split into two pieces that are added."
      - "Check the required conditions under which each rule applies."
      - "Test the rule with two simple functions whose limits you already know."
