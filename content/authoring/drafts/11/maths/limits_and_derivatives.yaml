  - topic: limits_intuition
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the limit of (x squared minus 9) divided by (x minus 3) as x approaches 3?"
    correct: "6"
    unit: ""
    wrong:
      - {text: "0", mistake: "substitutes and stops at the zero numerator without simplifying"}
      - {text: "9", mistake: "takes the numerator's value at the point as the limit"}
      - {text: "undefined", mistake: "treats the zero over zero form as a final answer"}
    explanation: "The numerator factors as (x minus 3)(x plus 3), so the common factor cancels and the limit is 3 plus 3, which is 6."
    hints:
      - "Direct substitution gives an indeterminate form, so simplify first."
      - "Factor the numerator as a difference of two squares."
      - "Cancel the common factor and then substitute the point into what remains."
    diagram: null
    confidence: high
