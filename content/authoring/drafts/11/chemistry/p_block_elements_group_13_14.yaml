    stem: "Which type of bonding links the two boron atoms in diborane, B2H6?"
    correct: "three-centre two-electron bonds"
    unit: ""
    wrong:
      - {text: "normal two-centre two-electron bonds only", mistake: "assumes boron forms only simple bonds like carbon"}
      - {text: "ionic bonds between boron ions", mistake: "treats boron as forming ions in a covalent hydride"}
      - {text: "metallic bonds", mistake: "treats the electron-deficient boron compound as a metal"}
    explanation: "Diborane is electron deficient, so hydrogen atoms bridge the two borons through three-centre two-electron bonds that share one pair of electrons over three atoms."
    hints:
      - "Electron-deficient compounds of boron bridge two atoms with a shared pair."
      - "Consider whether there are enough electrons to give each pair of atoms its own bond."
      - "Look for the bonding that involves three atoms sharing two electrons."
