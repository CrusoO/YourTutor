  - topic: "group14_carbon_family"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Why does silicon not form pi-bonded networks as readily as carbon does?"
    correct: "its larger atoms overlap poorly in side-on pi bonds"
    unit: ""
    wrong:
      - {text: "silicon has fewer valence electrons than carbon", mistake: "miscounts the valence electrons of silicon"}
      - {text: "silicon atoms always form ionic bonds", mistake: "assumes all group 14 elements are ionic"}
      - {text: "silicon forms only triple bonds", mistake: "invents a bonding pattern that does not match silicon compounds"}
    explanation: "The 3p orbitals of silicon are more diffuse than the 2p orbitals of carbon, so side-on overlap for pi bonds is weak, and silicon prefers single bonds."
    hints:
      - "Compare the size of the valence orbitals of silicon and carbon and how well they overlap."
      - "Think about how far the outer orbitals extend from the nucleus."
      - "Consider which overlap between p orbitals is needed for a pi bond."
    diagram: "Two side-by-side p orbitals on adjacent atoms, drawn once for a compact carbon pair with a large sideways overlap and once for a larger silicon pair with a smaller sideways overlap."
    confidence: "high"
