    explanation: "Each carbon in a graphite layer forms three sigma bonds in a plane using sp2 orbitals, and its remaining p electron delocalises over the layer."
    hints:
      - "Count the sigma bonds in the plane and match that count to a hybrid set."
      - "Think about the leftover p orbital that lies perpendicular to the layer."
      - "Consider how many electrons are not used in sigma bonding."
