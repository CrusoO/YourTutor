    stem: "In graphite, what is the hybridisation of each carbon atom in a layer and how many delocalised electrons does each carbon contribute?"
    correct: "sp2 hybridised with one delocalised electron"
    unit: ""
    wrong:
      - {text: "sp3 hybridised with no delocalised electron", mistake: "copies the bonding picture of diamond"}
