  - topic: "group13_boron_family"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Why does aluminium chloride exist as a dimer, Al2Cl6, in the vapour phase?"
    correct: "it is electron deficient and chlorine atoms bridge between the aluminium atoms"
    unit: ""
    wrong:
      - {text: "it forms a stronger ionic lattice in the vapour", mistake: "treats the halide as fully ionic even in the gas phase"}
      - {text: "chlorine forms double bonds to aluminium", mistake: "invents double bonds that are not needed to complete the octet"}
      - {text: "aluminium has no valence electrons to share", mistake: "miscounts the valence electrons of aluminium"}
    explanation: "Aluminium has only six electrons in its valence shell, so chlorine atoms donate lone pairs to bridge two aluminium centres and complete their octets in the dimer."
    hints:
      - "Aluminium has an incomplete octet, so think about how neighbouring atoms can share lone pairs with it."
      - "Consider which atoms can act as bridges between two metal centres."
      - "Look for the option describing a bridging arrangement that completes the octet."
