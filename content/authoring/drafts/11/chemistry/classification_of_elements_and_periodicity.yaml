items:
  - topic: "modern_periodic_law"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "On what property are elements arranged in order in the modern periodic table?"
    correct: "increasing atomic number"
    unit: ""
    wrong:
      - {text: "increasing atomic mass", mistake: "keeps the older ordering by mass even though it is not the basis of the modern table"}
      - {text: "increasing number of neutrons", mistake: "uses the neutron count as the ordering basis"}
      - {text: "decreasing electronegativity", mistake: "orders the elements by a periodic property instead of the quantity that defines them"}
    explanation: "The modern periodic law arranges elements by increasing atomic number, which is the number of protons and so defines each element."
    hints:
      - "Think about the number that defines the identity of an element."
      - "The ordering follows a whole number that counts protons in the nucleus."
      - "Mass can vary between isotopes, so it cannot be the defining order."
    diagram: null
    confidence: "high"
  - topic: "modern_periodic_law"
    type: "numeric"
    difficulty: "easy"
    role: "recall"
    stem: "How many periods are there in the modern periodic table?"
    correct: "7"
    unit: ""
    wrong: []
    explanation: "The seven horizontal rows of the table are the periods, each one corresponding to a principal shell in use."
    hints:
      - "Periods are the horizontal rows of the table."
      - "Each period ends with a noble gas."
      - "Count the rows from the first row down to the last one in the main table and the detached rows."
    diagram: null
    confidence: "high"
  - topic: "modern_periodic_law"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "An element has its last electron entering a 4p subshell and its outer shell holds three electrons in that subshell. Which block and group is it in?"
    correct: "p block, group 15"
    unit: ""
    wrong:
      - {text: "p block, group 13", mistake: "counts the electrons in the p subshell from the wrong end"}
      - {text: "d block, group 5", mistake: "treats an electron entering a p subshell as one entering a d subshell"}
      - {text: "s block, group 2", mistake: "reads the final subshell as an s subshell"}
    explanation: "An element whose last electron enters a p subshell is in the p block, and with three electrons in that subshell it belongs to group 15."
    hints:
      - "Find the subshell letter where the last electron enters to decide the block."
      - "Count the electrons in the outer subshells to decide the group."
      - "Groups of the p block run from 13 to 18 across the right side of the table."
    diagram: "Outline of the periodic table with the p block on the right side, showing the six columns from group 13 to group 18 and the last electron position labelled in the p block."
    confidence: "high"
  - topic: "modern_periodic_law"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which element is in period 3 and in group 17 of the periodic table?"
    correct: "chlorine"
    unit: ""
    wrong:
      - {text: "fluorine", mistake: "uses the halogen from period 2 instead of period 3"}
      - {text: "argon", mistake: "confuses group 18 with group 17 in the same period"}
      - {text: "sulphur", mistake: "shifts the group by one column to the left"}
    explanation: "Chlorine is the halogen in the third period, located in group 17 directly below fluorine."
    hints:
      - "Halogens sit one column to the left of the noble gases in each period."
      - "Start from the noble gas of the third period and move one column left."
      - "Check the period number by counting shells in the element's electron configuration."
    diagram: null
    confidence: "high"
  - topic: "modern_periodic_law"
    type: "mcq"
    difficulty: "hard"
    role: "apply"
    stem: "In the modern periodic table, which block contains the lanthanoid and actinoid series?"
    correct: "f block"
    unit: ""
    wrong:
      - {text: "d block", mistake: "groups the inner transition series with the transition metals in the main body"}
      - {text: "p block", mistake: "places the heavy metals of the lower rows in the p block"}
      - {text: "s block", mistake: "treats the lanthanoids as alkali-like metals"}
    explanation: "The lanthanoids and actinoids fill f subshells, so they form the f block, which is placed as two detached rows below the main table."
    hints:
      - "They are placed below the main table so that the main body stays narrow."
      - "Think about which subshell letter is filled in these inner transition series."
      - "The block letter is the subshell that the last electron enters."
    diagram: "Standard periodic table outline with the two detached rows below the main body, labelled as the lanthanoid series in the upper detached row and the actinoid series in the lower one."
    confidence: "high"
  - topic: "modern_periodic_law"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "The element with atomic number 37 is placed in which period and group of the modern periodic table?"
    correct: "period 5, group 1"
    unit: ""
    wrong:
      - {text: "period 4, group 1", mistake: "counts the shells as one fewer than the element actually occupies"}
      - {text: "period 5, group 2", mistake: "adds one to the group number when the outer electron is a single s electron"}
      - {text: "period 6, group 1", mistake: "miscounts the shells and assigns the element to the next period down"}
    explanation: "Atomic number 37 gives the configuration ending in 5s1, so the element is in period 5 and in group 1 with a single outer s electron."
    hints:
      - "Work out the electron configuration first and count the highest shell number."
      - "The group is set by the number of outer electrons in the s block."
      - "Compare the element with the noble gas that ends the previous period."
    diagram: null
    confidence: "high"
  - topic: "periodic_trends_11"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Across a period from left to right, how does atomic radius change?"
    correct: "decreases"
    unit: ""
    wrong:
      - {text: "increases", mistake: "reverses the effect of increasing nuclear attraction"}
      - {text: "stays constant", mistake: "assumes elements in the same shell have the same size"}
      - {text: "increases and then decreases", mistake: "thinks the trend reverses at the middle of the period"}
    explanation: "Moving across a period adds protons to the nucleus while electrons enter the same shell, so the nuclear pull increases and the radius shrinks."
    hints:
      - "The nucleus gains protons while the electrons enter the same shell."
      - "Consider how strongly the nucleus attracts the outer electrons as protons are added."
      - "Think about whether the outer electrons are pulled closer to the nucleus."
    diagram: null
    confidence: "high"
  - topic: "periodic_trends_11"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Why does ionisation enthalpy generally increase from left to right across a period?"
    correct: "nuclear charge rises while shielding changes little"
    unit: ""
    wrong:
      - {text: "shielding increases sharply across each period", mistake: "overstates the shielding that the added electrons provide"}
      - {text: "atoms gain a new shell with each step", mistake: "adds a shell at every element instead of within one shell"}
      - {text: "electrons repel the nucleus more strongly", mistake: "reverses the sign of the attraction between electrons and nucleus"}
    explanation: "As protons are added within one shell, the outer electron feels a stronger pull with little extra shielding, so more energy is needed to remove it."
    hints:
      - "Consider how the pull on the outer electron changes as protons are added within one shell."
      - "Think about how well the inner electrons block the charge of the nucleus."
      - "Compare the change in nuclear charge with the change in shielding across the period."
    diagram: null
    confidence: "high"
  - topic: "periodic_trends_11"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which species has the largest radius: Na, Na+, Mg or Mg2+?"
    correct: "Na"
    unit: ""
    wrong:
      - {text: "Na+", mistake: "assumes that a positive ion must be larger than its parent atom"}
      - {text: "Mg", mistake: "thinks a higher nuclear charge always gives a bigger atom"}
      - {text: "Mg2+", mistake: "treats a doubly charged cation as bigger than the neutral atoms"}
    explanation: "Sodium is larger than magnesium in the same period, and removing an electron from sodium makes Na+ smaller than Na, so Na has the largest radius."
    hints:
      - "Compare atoms in the same period first and then consider the effect of losing electrons."
      - "Losing electrons from an atom shrinks the ion compared with the neutral atom."
      - "Look for the atom that sits furthest to the left in the period."
    diagram: "Four labelled spheres representing Na, Na+, Mg and Mg2+, drawn at sizes that show the relative radii, with Na drawn largest."
    confidence: "high"
  - topic: "periodic_trends_11"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which halogen has the most negative electron gain enthalpy among fluorine, chlorine and bromine?"
    correct: "chlorine"
    unit: ""
    wrong:
      - {text: "fluorine", mistake: "assumes the smallest atom must accept an electron most readily"}
      - {text: "bromine", mistake: "assumes larger atoms accept electrons more readily"}
      - {text: "all three are equal", mistake: "thinks the halogens share the same electron gain enthalpy"}
    explanation: "Chlorine releases more energy on gaining an electron than fluorine, because the small fluorine atom repels the incoming electron strongly."
    hints:
      - "Fluorine's small size means the added electron meets strong repulsion from the crowded valence shell."
      - "Compare the three elements by their position within the group."
      - "The trend within the group is not simply monotonic for the first member."
    diagram: null
    confidence: "medium"
  - topic: "periodic_trends_11"
    type: "mcq"
    difficulty: "hard"
    role: "apply"
    stem: "The first ionisation enthalpy of beryllium is higher than that of boron. Which statement explains this?"
    correct: "beryllium has a filled 2s subshell that is more stable"
    unit: ""
    wrong:
      - {text: "boron has a larger nuclear charge than beryllium", mistake: "reverses the direction of the trend across the period"}
      - {text: "beryllium has more unpaired electrons than boron", mistake: "ignores electron pairing and treats unpaired electrons as the cause"}
      - {text: "boron's outer electron is shielded less than beryllium's", mistake: "assumes the outer electron of boron is less shielded"}
    explanation: "Beryllium has a completely filled 2s subshell, and removing an electron from its stable configuration needs more energy than removing the 2p electron of boron."
    hints:
      - "Compare the orbital the electron is removed from in each atom."
      - "Think about whether a full subshell has extra stability."
      - "Look at which electron is lost first in each element."
    diagram: "Two orbital box diagrams side by side, one for beryllium showing a filled 2s pair and one for boron showing a single 2p electron in a higher subshell."
    confidence: "high"
  - topic: "periodic_trends_11"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Which statement correctly describes the trend in properties down a group of the periodic table?"
    correct: "ionisation enthalpy decreases as atomic radius increases"
    unit: ""
    wrong:
      - {text: "electronegativity increases as atomic size increases", mistake: "reverses the relation between size and the pull on bonding electrons"}
      - {text: "atomic radius decreases as shells are added", mistake: "thinks each new shell shrinks the atom"}
      - {text: "ionisation enthalpy increases as shells are added", mistake: "confuses greater distance from the nucleus with stronger attraction"}
    explanation: "Moving down a group adds shells, so the outer electron sits farther from the nucleus, the radius grows, and the energy needed to remove the electron falls."
    hints:
      - "Consider how the distance from the nucleus to the outer electron changes as shells are added."
      - "Think about whether a greater distance strengthens or weakens the attraction."
      - "Relate the size of the atom to how easily its outer electron is removed."
    diagram: null
    confidence: "high"
  - topic: "electronegativity_valency"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which element is the most electronegative on the Pauling scale?"
    correct: "fluorine"
    unit: ""
    wrong:
      - {text: "oxygen", mistake: "picks the second most electronegative element as the top one"}
      - {text: "chlorine", mistake: "assumes the halogen with more electrons must be the most electronegative"}
      - {text: "nitrogen", mistake: "treats the nearest element in period two as the strongest electron attractor"}
    explanation: "Fluorine has the highest electronegativity on the Pauling scale because it has the strongest pull on shared electrons."
    hints:
      - "It is the top element of the group that has the strongest tendency to attract shared electrons."
      - "Look at the upper right corner of the table, where small nonmetals sit."
      - "The element in the second period of the halogen group is the answer."
    diagram: null
    confidence: "high"
  - topic: "electronegativity_valency"
    type: "numeric"
    difficulty: "easy"
    role: "recall"
    stem: "How many bonds does a carbon atom usually form in its compounds such as methane?"
    correct: "4"
    unit: ""
    wrong: []
    explanation: "Carbon has four valence electrons and forms four covalent bonds, as in methane, CH4."
    hints:
      - "Count the shared electron pairs that carbon typically forms with other atoms."
      - "Use the number of electrons carbon needs to fill its outer shell."
      - "Think of the outer shell of carbon as needing a set number of electrons to be complete, which it gets by sharing."
    diagram: null
    confidence: "high"
  - topic: "electronegativity_valency"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which bond is the most polar among H-F, H-Cl, H-Br and H-I?"
    correct: "H-F"
    unit: ""
    wrong:
      - {text: "H-Cl", mistake: "assumes chlorine is the most electronegative halogen"}
      - {text: "H-I", mistake: "assumes heavier atoms create more polar bonds"}
      - {text: "H-Br", mistake: "picks a middle member of the series without comparing values"}
    explanation: "Fluorine has the largest electronegativity difference from hydrogen in this series, so the H-F bond is the most polar."
    hints:
      - "The larger the difference in electronegativity between two atoms, the more polar the bond."
      - "Compare the electronegativity of each halogen with that of hydrogen."
      - "Look for the halogen that is most electronegative."
    diagram: null
    confidence: "high"
  - topic: "electronegativity_valency"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "The Pauling electronegativity of chlorine is 3.0 and that of hydrogen is 2.1. What is the difference between them?"
    correct: "0.9"
    unit: ""
    wrong: []
    explanation: "Subtracting 2.1 from 3.0 gives a difference of 0.9."
    hints:
      - "Subtract the smaller electronegativity from the larger one."
      - "Keep the decimal place when you subtract."
      - "The difference is always taken as a positive value."
    diagram: null
    confidence: "high"
  - topic: "electronegativity_valency"
    type: "mcq"
    difficulty: "hard"
    role: "apply"
    stem: "Which compound has the largest electronegativity difference between its two atoms, given Pauling values Li 1.0, Na 0.9, Cs 0.7, F 4.0, Cl 3.0 and I 2.5?"
    correct: "CsF"
    unit: ""
    wrong:
      - {text: "LiF", mistake: "chooses the metal with the smallest atom as the most ionic partner"}
      - {text: "LiCl", mistake: "ranks compounds by the size of the anion rather than by the value difference"}
      - {text: "NaI", mistake: "assumes iodide gives the largest difference because it is the largest halide"}
    explanation: "Caesium has the lowest value at 0.7 and fluorine the highest at 4.0, giving a difference of 3.3, which is larger than the other pairs listed."
    hints:
      - "Compare the value of the metal with the value of the halogen in each pair."
      - "Find the metal with the lowest electronegativity and the halogen with the highest."
      - "Subtract the metal value from the halogen value for each pair and compare."
    diagram: null
    confidence: "high"
  - topic: "electronegativity_valency"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Why does electronegativity increase from left to right across period 2 of the periodic table?"
    correct: "nuclear charge rises while the valence shell stays the same"
    unit: ""
    wrong:
      - {text: "the valence shell gets larger at each step", mistake: "adds a shell at every element instead of keeping the same shell"}
      - {text: "electrons pair less across the period", mistake: "invents a pairing cause unrelated to the pull on bonding electrons"}
      - {text: "atoms lose more electrons across the period", mistake: "reverses the direction of electron transfer across the period"}
    explanation: "Adding protons while keeping the same valence shell raises the effective pull on bonding electrons, so electronegativity grows along the period."
    hints:
      - "Focus on what changes as protons are added within the same shell."
      - "Think about how strongly the nucleus draws in the electrons of a bond."
      - "Compare the number of shells across the period."
    diagram: null
    confidence: "high"
