    stem: "Which form is the van der Waals equation for n moles of a real gas?"
    correct: "(P + a n^2/V^2)(V - n b) = nRT"
    unit: ""
    wrong:
      - {text: "PV = nRT", mistake: "uses the ideal gas law without any correction for real behaviour"}
      - {text: "(P - a n^2/V^2)(V + n b) = nRT", mistake: "reverses the sign of both corrections"}
      - {text: "P(V + n b) = nRT", mistake: "keeps the size correction but drops the attraction term"}
    explanation: "The pressure term is increased by the attraction correction and the volume is reduced by the excluded volume, giving the equation with the pressure plus a n squared over V squared and the volume minus n b."
    hints:
      - "Attraction between molecules raises the pressure measured at the walls."
      - "The molecules occupy part of the container, so the free volume is smaller."
      - "Check the signs of both corrections against these two effects."
    diagram: "Plot of PV divided by RT against pressure for a real gas, with a curve that dips below the ideal line at moderate pressures and rises above it at high pressures."
