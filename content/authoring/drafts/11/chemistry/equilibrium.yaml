  - topic: "equilibrium_concept"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "What is the unit of Kc for the reaction N2(g) + 3 H2(g) <=> 2 NH3(g)?"
    correct: "L^2 mol^-2"
    unit: ""
    wrong:
      - {text: "mol^2 L^-2", mistake: "inverts the units of the equilibrium constant"}
