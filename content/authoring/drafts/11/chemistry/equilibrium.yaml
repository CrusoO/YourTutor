  - topic: "le_chatelier"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What does Le Chatelier's principle state?"
    correct: "a system at equilibrium shifts to oppose an applied change"
    unit: ""
    wrong:
      - {text: "a system always shifts toward the products", mistake: "assumes every disturbance favours the products"}
      - {text: "the equilibrium constant changes with every change in concentration", mistake: "treats the equilibrium constant as variable with composition"}
      - {text: "the reaction stops when a change is applied", mistake: "thinks equilibrium halts when a disturbance is applied"}
    explanation: "When a condition such as concentration, pressure or temperature is changed, the equilibrium moves in the direction that partly counteracts that change."
    hints:
      - "Think about the direction the reaction moves to counteract the disturbance."
      - "Consider how the system responds when one of its conditions is changed."
      - "Look for the option describing a counteracting shift rather than a fixed direction."
