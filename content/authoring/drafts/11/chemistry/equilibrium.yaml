    explanation: "Kc equals the squared ammonia concentration over the product of the nitrogen and cubed hydrogen concentrations, giving a net power of minus two in mol/L, which is L^2 mol^-2."
    hints:
      - "Work out the net power of concentration from the coefficients of products and reactants."
      - "Subtract the total reactant coefficients from the total product coefficients."
      - "Write the units of each concentration term before combining them."
