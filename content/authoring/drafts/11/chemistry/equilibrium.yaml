    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What characterises a system that has reached dynamic equilibrium?"
    correct: "forward and reverse rates are equal and concentrations stay constant"
    unit: ""
    wrong:
      - {text: "the reactions have stopped completely", mistake: "confuses equilibrium with a reaction that has stopped"}
      - {text: "all the reactants have been used up", mistake: "assumes equilibrium means the reaction has gone to completion"}
      - {text: "only the products are present", mistake: "ignores that reactants remain in the mixture at equilibrium"}
    explanation: "At dynamic equilibrium the forward and reverse processes continue at equal rates, so the macroscopic amounts of each species do not change."
    hints:
      - "Think about whether molecules are still reacting even though the overall amounts do not change."
      - "Consider what it means for two opposing processes to balance."
      - "Look for the option that describes unchanging amounts with continuing reactions."
