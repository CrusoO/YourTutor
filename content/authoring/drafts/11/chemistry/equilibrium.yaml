    confidence: "high"
  - topic: "equilibrium_constant_calc"
    type: "numeric"
    difficulty: "easy"
    role: "recall"
    stem: "For A + B <=> C + D at equilibrium, [A] = 1, [B] = 1, [C] = 2 and [D] = 2, all in mol/L. What is Kc?"
    correct: "4"
    unit: ""
    wrong: []
    explanation: "Kc equals [C][D] divided by [A][B], which is 2 times 2 divided by 1 times 1, equal to 4."
    hints:
      - "Write the products over the reactants, each raised to its coefficient."
      - "All coefficients here are one, so each concentration appears once."
      - "Multiply the product concentrations and divide by the product of the reactant concentrations."
