  - topic: "equilibrium_concept"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "For a reaction at equilibrium, the reaction quotient Q is less than the equilibrium constant K. Which direction does the reaction proceed to reach equilibrium?"
    correct: "forward, so that products increase"
    unit: ""
    wrong:
      - {text: "reverse, so that reactants increase", mistake: "reverses the comparison between Q and K"}
      - {text: "the equilibrium constant falls to match Q", mistake: "assumes the constant adjusts to the mixture rather than the mixture to the constant"}
      - {text: "no direction, because the reaction is already at equilibrium", mistake: "assumes any mixture with Q not equal to K is at equilibrium"}
    explanation: "When Q is below K the ratio of products to reactants is too small, so the reaction moves forward and the products increase until Q equals K."
    hints:
      - "Think about whether the ratio of products to reactants is too small or too large compared with K."
      - "A mixture that needs more products to reach the constant must move in one direction."
      - "Compare the two numbers before deciding on the direction."
