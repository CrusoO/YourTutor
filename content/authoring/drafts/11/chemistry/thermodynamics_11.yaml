  - topic: "first_law_enthalpy"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "In the first law written as delta U = q + w, what sign is taken for work done on the system?"
    correct: "positive"
    unit: ""
    wrong:
      - {text: "negative", mistake: "mixes the sign convention for work done on the system with work done by it"}
      - {text: "zero", mistake: "assumes work is zero at constant pressure"}
      - {text: "dependent only on temperature", mistake: "treats work as a state function that depends on temperature"}
    explanation: "With this convention, work done on the system is positive because it adds energy to the system and raises its internal energy."
    hints:
      - "Think about whether the energy supplied to the system raises its internal energy."
      - "Consider the sign used for energy that enters the system."
      - "Look for the option that matches energy entering the system."
