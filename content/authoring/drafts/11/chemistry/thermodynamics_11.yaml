  - topic: "first_law_enthalpy"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "For a reaction in which the number of moles of gas decreases by 2 at 298 K, which statement about delta H and delta U is correct?"
    correct: "delta H is less than delta U"
    unit: ""
    wrong:
      - {text: "delta H is greater than delta U", mistake: "reverses the sign of the change in gas moles"}
      - {text: "delta H is always equal to delta U", mistake: "ignores the gas moles in the relation between enthalpy and internal energy"}
      - {text: "delta H is zero", mistake: "assumes a reaction with no net gas change has no enthalpy change"}
    explanation: "delta H equals delta U plus delta n times RT, and a decrease in gas moles makes delta n negative, so delta H is smaller than delta U."
    hints:
      - "Work out whether the gas moles are increasing or decreasing across the reaction."
      - "Use the relation between enthalpy and internal energy that includes the gas moles."
      - "Check the sign of the correction term before comparing the two values."
