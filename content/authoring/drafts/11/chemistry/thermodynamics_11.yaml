    explanation: "Gas molecules have far more positions and motions available than liquid molecules, so evaporation sharply increases the entropy of the system."
    hints:
      - "Think about which change gives molecules more freedom of position and motion."
      - "Consider whether the particles become more or less spread out."
      - "Look for the change that moves particles from a more confined phase to a freer one."
