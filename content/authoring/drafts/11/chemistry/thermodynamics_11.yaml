  - topic: "system_surroundings_state"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "For a system that is taken through a cyclic process and returns to its starting state, which quantity has a change of zero?"
    correct: "internal energy change"
    unit: ""
    wrong:
      - {text: "heat absorbed", mistake: "assumes heat exchanged over a cycle must also be zero"}
      - {text: "work done", mistake: "confuses the net work of a cycle with the change of a state property"}
      - {text: "entropy of the surroundings", mistake: "treats the surroundings as part of the cycle"}
    explanation: "Internal energy is a state function, so over a complete cycle that returns the system to its starting state its net change is zero, even though heat and work are not zero."
    hints:
      - "A cycle returns the system to its starting state."
      - "Think about which kinds of quantity depend only on the state of the system."
      - "Only state functions have zero net change around a closed loop."
