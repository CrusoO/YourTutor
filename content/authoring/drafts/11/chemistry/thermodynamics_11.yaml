    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "How many kilojoules of heat are needed to raise the temperature of 50 g of water by 10 K? The specific heat capacity of water is 4.18 J/g/K."
    correct: "2.09"
    unit: "kJ"
    wrong: []
    explanation: "Heat equals mass times specific heat times temperature change, which is 50 times 4.18 times 10 equal to 2090 J, or 2.09 kJ."
    hints:
      - "Multiply the mass, the specific heat capacity and the temperature change."
      - "Be careful to use the same units for the mass and the specific heat."
      - "Convert the final value from joules into kilojoules."
