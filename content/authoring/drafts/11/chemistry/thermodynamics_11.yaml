    correct: "-111"
    unit: "kJ"
    wrong: []
    explanation: "Subtracting the second equation from the first gives C + 1/2 O2 -> CO, with delta H equal to -394 minus (-283), which is -111 kJ."
    hints:
      - "Reverse the second equation and add it to the first."
      - "When you reverse an equation, change the sign of its enthalpy change."
      - "Cancel the species that appear on both sides before adding the values."
