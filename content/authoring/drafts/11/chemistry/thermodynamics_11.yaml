  - topic: "system_surroundings_state"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which of the following is a state function?"
    correct: "enthalpy"
    unit: ""
    wrong:
      - {text: "work done", mistake: "treats a path-dependent quantity as a state function"}
      - {text: "heat absorbed", mistake: "confuses heat exchanged in a process with a property of the state"}
      - {text: "the path followed", mistake: "assumes the route taken is a property of the system"}
    explanation: "Enthalpy depends only on the state of the system, so its change depends only on the initial and final states and not on the route."
    hints:
      - "A state function depends only on the initial and final conditions, not on the route."
      - "Quantities that describe the condition of the system itself are state functions."
      - "Heat and work depend on how the change is carried out."
