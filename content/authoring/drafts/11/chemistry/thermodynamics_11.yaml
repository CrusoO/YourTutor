  - topic: "entropy_gibbs"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "A reaction has positive delta H and positive delta S. At which temperatures is it spontaneous?"
    correct: "above a certain temperature"
    unit: ""
    wrong:
