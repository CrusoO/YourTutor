      - {text: "at low temperature only", mistake: "treats the entropy term as negligible when the temperature is low"}
      - {text: "at all temperatures", mistake: "treats the entropy change as the only factor that decides spontaneity"}
    explanation: "Delta G equals delta H minus T delta S, and the entropy term grows with temperature, so the reaction becomes spontaneous once T delta S exceeds delta H."
    hints:
      - "Compare the enthalpy term with the entropy term multiplied by temperature."
      - "Consider how the entropy term changes as the temperature rises."
      - "Find the temperature at which the sign of delta G changes."
