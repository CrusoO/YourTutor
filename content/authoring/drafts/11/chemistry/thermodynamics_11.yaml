  - topic: "system_surroundings_state"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which type of system can exchange energy with its surroundings but not matter?"
    correct: "closed system"
    unit: ""
    wrong:
      - {text: "open system", mistake: "assumes energy transfer requires matter to cross the boundary as well"}
      - {text: "isolated system", mistake: "says that no energy can cross the boundary of the system"}
      - {text: "adiabatic system", mistake: "confuses heat insulation with the type of system defined by exchange"}
    explanation: "A closed system can exchange energy, such as heat and work, with its surroundings, but it cannot exchange matter across its boundary."
    hints:
      - "Think about whether matter can cross the boundary while energy still can."
      - "The boundary type is set by what it allows to pass, matter or energy."
      - "Compare the three systems by what each one lets across its boundary."
