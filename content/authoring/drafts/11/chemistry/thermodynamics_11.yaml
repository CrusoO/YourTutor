  - topic: "first_law_enthalpy"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "A gas expands against a constant external pressure of 0.5 atm from 2 L to 4 L. Taking 1 atm L as 101 J, what is the work done by the gas in joules? Report it as a positive number."
    correct: "101"
    unit: "J"
    wrong: []
    explanation: "Work against a constant pressure is P times the volume change, which is 0.5 atm times 2 L, or 1 atm L, equal to 101 J."
    hints:
      - "Multiply the constant external pressure by the change in volume."
      - "Work done by the gas during expansion equals pressure times the volume change."
      - "Convert the result using the conversion factor given in the question."
