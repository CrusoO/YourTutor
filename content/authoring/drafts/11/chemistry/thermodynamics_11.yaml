    confidence: "high"
  - topic: "hess_law"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Hess's law is based on which principle?"
    correct: "enthalpy is a state function, so the total change depends only on the initial and final states"
    unit: ""
    wrong:
      - {text: "mass is conserved in every chemical reaction", mistake: "uses mass conservation as the basis instead of the state-function argument"}
      - {text: "the reaction rate depends on the number of steps", mistake: "treats the number of steps as a factor in the enthalpy change"}
      - {text: "entropy of the universe always increases", mistake: "mixes Hess's law with the second law of thermodynamics"}
    explanation: "Because enthalpy is a state function, the overall enthalpy change of a reaction is the same whatever route is taken, so separate steps can be added together."
    hints:
      - "Think about whether the enthalpy change depends on the route taken."
      - "Consider what happens to the total change when you add steps that form a cycle."
      - "Look for the principle that allows you to add reaction equations."
    diagram: null
    confidence: "high"
  - topic: "hess_law"
