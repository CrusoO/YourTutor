    confidence: "high"
  - topic: "system_surroundings_state"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which thermodynamic variable is an extensive property?"
    correct: "internal energy"
    unit: ""
    wrong:
      - {text: "temperature", mistake: "confuses intensive properties with extensive ones"}
      - {text: "pressure", mistake: "assumes pressure scales with the amount of matter"}
      - {text: "density", mistake: "treats density as growing with the amount of matter"}
    explanation: "Internal energy doubles when the amount of matter doubles, so it is extensive, while temperature, pressure and density do not depend on the amount."
    hints:
      - "An extensive property changes in proportion to the amount of matter in the system."
      - "Check whether doubling the sample would double the quantity."
      - "Intensive properties stay the same when the sample is divided."
