    confidence: "high"
  - topic: "first_law_enthalpy"
    type: "numeric"
    difficulty: "easy"
    role: "recall"
    stem: "A system absorbs 100 J of heat and does 40 J of work on the surroundings. What is the change in its internal energy in joules?"
    correct: "60"
    unit: "J"
    wrong: []
    explanation: "Using delta U equal to q minus w, with q = +100 J and work done by the system w = 40 J, gives a change of 60 J."
    hints:
      - "Use the first law with heat added as positive and work done by the system subtracted."
      - "Identify which quantity is the heat and which is the work before substituting."
      - "Compute the difference between the heat and the work."
