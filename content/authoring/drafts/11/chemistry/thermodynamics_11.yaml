    confidence: "high"
  - topic: "first_law_enthalpy"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "For a reaction with an increase of 1 mol in gaseous moles, delta U is 20 kJ at 300 K. What is delta H in kJ? Use R = 8.314 J/mol/K."
    correct: "22.5"
    unit: "kJ"
    wrong: []
    explanation: "delta H equals delta U plus delta n times RT, which is 20 kJ plus 1 times 8.314 times 300 J, about 2.49 kJ, giving 22.5 kJ."
    hints:
      - "Multiply the change in gas moles by R and by the temperature."
      - "Add that product to the internal energy change."
      - "Keep units consistent by converting joules to kilojoules at the end."
    diagram: null
    confidence: "high"
