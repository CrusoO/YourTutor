  - topic: "air_and_water_pollution"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "What does biochemical oxygen demand (BOD) measure in water?"
    correct: "the oxygen used by microorganisms to decompose organic matter in the water"
    unit: ""
    wrong:
      - {text: "the total dissolved salt concentration", mistake: "confuses BOD with the total dissolved solids measure"}
      - {text: "the amount of heavy metal in the sediment", mistake: "treats BOD as a test for metals"}
      - {text: "the pH of the wastewater", mistake: "treats the oxygen demand as a measure of acidity"}
    explanation: "BOD is the amount of dissolved oxygen that bacteria consume while decomposing organic waste, so a high BOD signals heavy pollution."
    hints:
      - "Think about the oxygen consumed by bacteria when they break down waste."
      - "Consider whether the measure relates to living organisms and their food supply."
      - "Look for the option describing oxygen consumption rather than a chemical composition."
    diagram: null
    confidence: "high"
  - topic: "air_and_water_pollution"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which treatment removes the hardness ions from water by exchanging them for other ions?"
    correct: "ion exchange"
    unit: ""
    wrong:
      - {text: "boiling only", mistake: "treats boiling as a complete removal of all hardness"}
      - {text: "ozonation", mistake: "treats disinfection as a method of softening water"}
      - {text: "chlorination", mistake: "confuses disinfection with the removal of hardness"}
    explanation: "Ion exchange resins swap calcium and magnesium ions for sodium or hydrogen ions, which removes the hardness from the water."
    hints:
      - "The method swaps unwanted cations for sodium or hydrogen ions on a resin."
      - "Think about a process that uses a solid material to capture certain ions."
      - "Look for the treatment that substitutes one ion for another."
