  - topic: "ozone_and_greenhouse"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "In which layer of the atmosphere is the ozone layer found?"
    correct: "stratosphere"
    unit: ""
    wrong:
      - {text: "troposphere", mistake: "places the ozone layer in the weather layer near the ground"}
      - {text: "mesosphere", mistake: "assigns the ozone layer to the layer above the stratosphere"}
      - {text: "thermosphere", mistake: "confuses the outermost layer with the ozone layer's location"}
    explanation: "The ozone layer lies in the stratosphere, roughly 15 to 35 km above the surface, where ozone absorbs most of the harmful ultraviolet radiation."
    hints:
      - "This layer lies above the weather layer and below the mesosphere."
      - "Ozone forms in the layer where ultraviolet light splits oxygen molecules."
      - "The layer sits between the troposphere and the mesosphere."
