    stem: "Which oxide, together with sulphur dioxide, is mainly responsible for acid rain?"
    correct: "nitrogen dioxide"
    unit: ""
    wrong:
      - {text: "carbon monoxide", mistake: "associates a toxic gas with acid formation"}
      - {text: "methane", mistake: "treats greenhouse gases as the precursors of acid rain"}
      - {text: "helium", mistake: "assumes inert gases can form acids in rain"}
    explanation: "Nitrogen dioxide and sulphur dioxide both dissolve in rainwater after oxidation to form nitric and sulphuric acids, which lower the pH of rain."
    hints:
      - "Look for oxides of a common nonmetal that dissolve in rain to make an acid."
      - "Think about which pollutant is released by vehicle engines as well as combustion."
