    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which water pollutant is linked to methaemoglobinaemia, sometimes called blue baby syndrome, in infants?"
    correct: "nitrate"
    unit: ""
    wrong:
      - {text: "lead", mistake: "confuses heavy metal toxicity with this infant condition"}
      - {text: "fluoride", mistake: "associates fluoride with a condition affecting infant teeth"}
      - {text: "chloride", mistake: "treats salinity as the cause of the infant condition"}
    explanation: "Nitrate in drinking water is reduced in the infant gut to nitrite, which converts haemoglobin to a form that cannot carry oxygen effectively."
    hints:
      - "The ion is common in fertilisers that drain into groundwater."
      - "Think about the ion that the body can reduce to a more harmful form."
      - "Look for the anion that is often present in agricultural runoff."
