  - topic: "ozone_and_greenhouse"
    type: "mcq"
    difficulty: "hard"
    role: "apply"
    stem: "Why does carbon dioxide absorb infrared radiation?"
    correct: "its bending and stretching vibrations change the dipole moment"
    unit: ""
    wrong:
      - {text: "it is a strong oxidising agent", mistake: "confuses chemical reactivity with infrared absorption"}
      - {text: "its molecules are polar and rotate freely as a gas", mistake: "treats free rotation as the source of infrared absorption in a linear molecule"}
      - {text: "its carbon double bonds break easily on heating", mistake: "associates bond breaking with absorption of heat radiation"}
    explanation: "The linear CO2 molecule has no permanent dipole, but its bending and asymmetric stretching vibrations create a changing dipole, which lets it absorb infrared radiation."
    hints:
      - "A molecule absorbs infrared when its vibration changes how its charge is distributed."
      - "Think about a vibration that makes the molecule's dipole change."
      - "Consider the motions of a linear three-atom molecule."
    diagram: "A linear O=C=O molecule with arrows along its axis for the asymmetric stretch and with bending motions drawn above and below the axis."
    confidence: "medium"
  - topic: "ozone_and_greenhouse"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Which action most directly reduces the depletion of the ozone layer?"
    correct: "phasing out the use of chlorofluorocarbons under an international agreement"
    unit: ""
    wrong:
      - {text: "increasing the use of aerosol sprays", mistake: "treats aerosol propellants as protective of the ozone layer"}
      - {text: "burning more coal to produce electricity", mistake: "confuses ozone depletion with the control of carbon dioxide emissions"}
      - {text: "adding more nitrogen oxides to the air", mistake: "treats nitrogen oxides as a source of stratospheric ozone"}
    explanation: "Removing the main human-made source of chlorine in the stratosphere stops the catalytic cycle from continuing, which is the most direct way to protect the ozone layer."
    hints:
      - "Think about which human-made source released the chlorine in the cycle."
      - "Consider which action stops the source rather than treating the effect."
      - "Look for the option that targets the chemical that breaks down ozone."
    diagram: null
    confidence: "high"
