  - topic: "ozone_and_greenhouse"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which group of synthetic compounds releases chlorine atoms that destroy ozone in the stratosphere?"
    correct: "chlorofluorocarbons"
    unit: ""
    wrong:
      - {text: "carbon dioxide", mistake: "associates carbon dioxide with ozone destruction rather than with warming"}
      - {text: "molecular nitrogen", mistake: "treats an inert gas as a destroyer of ozone"}
      - {text: "molecular oxygen", mistake: "confuses the reactant oxygen with the destroying species"}
    explanation: "Chlorofluorocarbons are stable enough to reach the stratosphere, where ultraviolet light releases chlorine atoms that catalyse the breakdown of ozone."
    hints:
      - "These synthetic compounds are stable enough to reach the upper atmosphere."
      - "Think about compounds that contain carbon, chlorine and fluorine."
      - "Look for the human-made group that was once used as refrigerants and aerosol propellants."
    diagram: null
    confidence: "high"
  - topic: "ozone_and_greenhouse"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which sequence correctly describes the catalytic cycle of ozone destruction by chlorine atoms?"
    correct: "Cl + O3 gives ClO + O2, then ClO + O gives Cl + O2"
    unit: ""
    wrong:
      - {text: "O3 + O2 gives O4, and chlorine stays inert", mistake: "invents an O4 species and leaves chlorine out of the cycle"}
      - {text: "Cl + O2 gives ClO2, and ozone reforms", mistake: "adds oxygen instead of removing ozone"}
      - {text: "CFC gives O and CO2 only", mistake: "treats the CFC as a source of carbon dioxide rather than chlorine"}
    explanation: "A chlorine atom removes an ozone molecule to form ClO, which then reacts with an oxygen atom to regenerate chlorine, so one chlorine atom destroys many ozone molecules."
    hints:
      - "The chlorine atom is regenerated at the end, so it can repeat the cycle."
      - "Look for the species that is consumed in the first step and produced again in the second."
      - "Check that the atoms balance across the two steps."
    diagram: "A two-step cycle drawn as a loop: a chlorine atom plus ozone gives chlorine monoxide plus oxygen, and chlorine monoxide plus an oxygen atom gives chlorine plus oxygen again."
    confidence: "high"
