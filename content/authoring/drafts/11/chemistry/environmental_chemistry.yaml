    confidence: "medium"
  - topic: "air_and_water_pollution"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A water sample has a dissolved oxygen of 8 mg/L when first measured and 3 mg/L after 5 days of bacterial action. What is its biochemical oxygen demand in mg/L?"
    correct: "5"
    unit: "mg/L"
    wrong: []
    explanation: "The oxygen consumed by the bacteria is the initial value minus the final value, which is 8 minus 3, equal to 5 mg/L."
    hints:
      - "Subtract the final dissolved oxygen from the initial value."
      - "The oxygen used up by the bacteria is the drop in dissolved oxygen."
      - "Keep the units as mg/L in the final answer."
    diagram: null
    confidence: "medium"
  - topic: "air_and_water_pollution"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Why is chlorine added to drinking water even though it can form harmful by-products?"
    correct: "to kill pathogenic microorganisms"
    unit: ""
    wrong:
      - {text: "to increase the hardness of the water", mistake: "treats chlorine as a water softener that adds hardness"}
      - {text: "to lower the pH of the water to acidic levels", mistake: "assumes disinfection is achieved by strong acidification"}
      - {text: "to remove the dissolved oxygen from the water", mistake: "reverses the role of chlorine with that of oxygen"}
    explanation: "Chlorine disinfects water by killing bacteria and viruses that cause waterborne disease, and the benefit outweighs the risk from low levels of by-products."
    hints:
      - "Think about the microorganisms that cause waterborne illness."
      - "Consider which process makes water safe to drink from a health standpoint."
      - "Look for the purpose that is a biological one."
