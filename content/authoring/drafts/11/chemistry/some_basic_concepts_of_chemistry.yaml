  - topic: "mole_concept_11"
    type: "numeric"
    difficulty: "easy"
    role: "recall"
    stem: "How many moles are present in 36 g of water? The molar mass of water is 18 g/mol."
    correct: "2"
    unit: "mol"
    wrong: []
    explanation: "Moles equal mass divided by molar mass, so 36 g divided by 18 g/mol gives 2 mol."
    hints:
      - "Recall how mass, molar mass and number of moles are related."
      - "Divide the mass of the sample by the molar mass of the substance."
      - "Check that the units cancel to leave moles."
    diagram: null
    confidence: "high"
  - topic: "mole_concept_11"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which quantity contains the same number of entities as one mole of any substance?"
    correct: "6.022 x 10^23 entities"
    unit: ""
    wrong:
      - {text: "1 gram of the substance", mistake: "confuses the mole with a unit of mass"}
      - {text: "22.4 litres at any temperature", mistake: "applies the molar volume at standard conditions to every state and temperature"}
      - {text: "1 kilogram of the substance", mistake: "treats the mole as a mass quantity"}
    explanation: "One mole of any substance contains the Avogadro number of entities, which is 6.022 x 10^23 particles."
    hints:
      - "Consider which unit counts particles rather than weighing them."
      - "The same count applies to atoms, molecules or ions alike."
      - "Think about a fixed count of entities that does not depend on the substance."
    diagram: null
    confidence: "high"
  - topic: "mole_concept_11"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "How many molecules are present in 0.1 mol of oxygen gas?"
    correct: "6.022 x 10^22"
    unit: ""
    wrong:
      - {text: "6.022 x 10^23", mistake: "forgets the factor of one tenth when multiplying by the Avogadro number"}
      - {text: "6.022 x 10^21", mistake: "moves the exponent in the wrong direction"}
      - {text: "3.011 x 10^22", mistake: "halves the count because the gas is diatomic, which counts atoms instead of molecules"}
    explanation: "Multiply 0.1 mol by 6.022 x 10^23 molecules per mole to get 6.022 x 10^22 molecules."
    hints:
      - "Start from the number of particles in one mole."
      - "Scale that number by the amount of gas given."
      - "The question asks for molecules, so do not split the molecules into atoms."
    diagram: null
    confidence: "high"
  - topic: "mole_concept_11"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "What is the mass, in grams, of 0.25 mol of carbon dioxide? The molar mass of carbon dioxide is 44 g/mol."
    correct: "11"
    unit: "g"
    wrong: []
    explanation: "Mass equals moles times molar mass, so 0.25 mol multiplied by 44 g/mol gives 11 g."
    hints:
      - "Mass is found by multiplying the amount in moles by the molar mass."
      - "Use the molar mass given in the question for carbon dioxide."
      - "Keep track of the unit so that moles cancel and grams remain."
    diagram: null
    confidence: "high"
  - topic: "mole_concept_11"
    type: "mcq"
    difficulty: "hard"
    role: "apply"
    stem: "Each sample is one mole of a substance. Which sample contains the greatest total number of atoms?"
    correct: "1 mol of methane"
    unit: ""
    wrong:
      - {text: "1 mol of ozone", mistake: "counts each molecule as a single atom"}
      - {text: "1 mol of helium", mistake: "assumes a monatomic gas has the largest count because it is lightest"}
      - {text: "1 mol of nitrogen", mistake: "counts molecules as atoms and forgets that each molecule has two atoms"}
    explanation: "Methane has five atoms per molecule, so one mole gives five moles of atoms, more than ozone with three, nitrogen with two or helium with one."
    hints:
      - "Count the atoms in each molecular formula rather than the molecules."
      - "Multiply the number of atoms per molecule by one mole for each sample."
      - "Compare the totals for all the samples before choosing."
    diagram: null
    confidence: "high"
