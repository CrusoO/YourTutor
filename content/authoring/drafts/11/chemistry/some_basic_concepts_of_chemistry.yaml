    confidence: "high"
  - topic: "stoichiometry"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "In N2 + 3 H2 -> 2 NH3, 6 mol of hydrogen reacts with excess nitrogen. How many moles of ammonia can form?"
    correct: "4 mol"
    unit: ""
    wrong:
      - {text: "2 mol", mistake: "uses the nitrogen coefficient instead of the ratio with hydrogen"}
      - {text: "6 mol", mistake: "assumes one mole of product forms per mole of hydrogen"}
      - {text: "3 mol", mistake: "takes the hydrogen coefficient as the amount of ammonia"}
    explanation: "Each 3 mol of hydrogen gives 2 mol of ammonia, so 6 mol of hydrogen gives 4 mol of ammonia."
    hints:
      - "Find the ratio of ammonia to hydrogen from the coefficients."
      - "Hydrogen is the species that limits the reaction here, so use its amount."
      - "Multiply the hydrogen amount by the ratio and check the answer against the equation."
