  - topic: "concentration_terms"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which concentration term is defined as moles of solute per kilogram of solvent?"
    correct: "molality"
    unit: ""
    wrong:
      - {text: "molarity", mistake: "uses litres of solution instead of kilograms of solvent"}
      - {text: "mole fraction", mistake: "treats the ratio of moles as a ratio of masses"}
      - {text: "mass percent", mistake: "divides the mass of solute by the mass of the whole solution"}
    explanation: "Molality is moles of solute divided by the mass of solvent in kilograms, so it does not depend on the volume of the solution."
    hints:
      - "Look for the term whose denominator is a mass of the solvent, not a volume."
      - "The solvent mass is measured in kilograms for this definition."
      - "Compare how each term uses the solvent in its definition."
