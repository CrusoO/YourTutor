    unit: "mol/L"
    wrong: []
    explanation: "250 mL is 0.25 L, so 0.5 mol divided by 0.25 L gives 2 mol/L."
    hints:
      - "Molarity is the amount of solute divided by the volume of solution."
      - "Convert the volume into litres before dividing."
