  - topic: "stoichiometry"
    type: "numeric"
    difficulty: "easy"
    role: "recall"
    stem: "In the reaction 2 H2 + O2 -> 2 H2O, how many moles of water form from 4 mol of hydrogen?"
    correct: "4"
    unit: "mol"
    wrong: []
    explanation: "The coefficients of hydrogen and water are equal, so 4 mol of hydrogen gives 4 mol of water."
    hints:
      - "Use the ratio of coefficients for the two species of interest."
      - "Read the balanced equation to find the mole ratio between hydrogen and water."
      - "Apply that ratio to the amount of hydrogen given."
    diagram: null
    confidence: "high"
  - topic: "stoichiometry"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which term describes the reactant that is used up first and so limits the amount of product formed?"
    correct: "limiting reagent"
    unit: ""
    wrong:
      - {text: "excess reagent", mistake: "confuses the reactant left over with the one that runs out"}
      - {text: "catalyst", mistake: "thinks any reactant that speeds the reaction is the one that limits it"}
      - {text: "spectator ion", mistake: "mixes ideas from ionic equations into stoichiometry"}
    explanation: "The limiting reagent is consumed first, and the amount of product depends on how much of it is present."
    hints:
      - "Think about which reactant runs out first when the materials are mixed."
      - "The product amount is decided by the species that is fully used."
      - "Leftover material is not the one that controls the yield."
    diagram: null
    confidence: "high"
  - topic: "stoichiometry"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "Magnesium reacts with hydrochloric acid: Mg + 2 HCl -> MgCl2 + H2. How many moles of hydrogen gas form from 0.3 mol of magnesium?"
    correct: "0.3"
    unit: "mol"
    wrong: []
    explanation: "Magnesium and hydrogen are formed in a one to one mole ratio, so 0.3 mol of magnesium gives 0.3 mol of hydrogen."
    hints:
      - "Compare the coefficients of magnesium and hydrogen in the balanced equation."
      - "Only the two species named in the question matter for the ratio."
      - "Multiply the given amount by the ratio you found."
