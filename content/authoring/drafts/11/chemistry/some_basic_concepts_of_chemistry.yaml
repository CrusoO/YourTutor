  - topic: "empirical_molecular_formula"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What is the empirical formula of a compound whose molecular formula is C6H12O6?"
    correct: "CH2O"
    unit: ""
    wrong:
      - {text: "C6H12O6", mistake: "confuses the molecular formula with the empirical formula"}
      - {text: "C3H6O3", mistake: "divides only one element's subscript by the common factor"}
      - {text: "C2H4O2", mistake: "divides by a factor that is too small to reach the simplest whole-number ratio"}
    explanation: "The subscripts 6, 12 and 6 share a highest common factor of 6, so dividing by 6 gives CH2O."
    hints:
      - "Find the largest number that divides every subscript exactly."
      - "Divide each subscript by that common factor."
      - "The empirical formula shows the simplest whole-number ratio of atoms."
