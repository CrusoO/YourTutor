  - topic: "oxidation_number"
    type: "numeric"
    difficulty: "easy"
    role: "recall"
    stem: "What is the oxidation number of sulphur in the sulphate ion, SO4 2-?"
    correct: "6"
    unit: ""
    wrong: []
    explanation: "Each oxygen is assigned minus two, giving minus eight in total, so sulphur must be plus six for the ion to have a charge of minus two."
    hints:
      - "Oxygen is usually assigned a value of minus two in its compounds."
      - "The sum of all oxidation numbers equals the charge on the ion."
      - "Solve for the unknown oxidation number of the central atom."
    diagram: null
    confidence: "high"
  - topic: "oxidation_number"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What is the oxidation number of hydrogen in sodium hydride, NaH?"
    correct: "-1"
    unit: ""
    wrong:
      - {text: "+1", mistake: "treats hydrogen as always positive whatever it is bonded to"}
      - {text: "0", mistake: "assumes the hydrogen here is in its elemental form"}
      - {text: "-2", mistake: "copies the rule for oxygen onto hydrogen"}
    explanation: "In metal hydrides hydrogen takes the negative state because it is the more electronegative partner, so its oxidation number is -1."
    hints:
      - "Compare hydrogen's usual value with the rule for bonding to a metal."
      - "Consider which atom is more electronegative in the bond with sodium."
      - "Remember that the metal is given its usual positive value."
    diagram: null
    confidence: "high"
  - topic: "oxidation_number"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "What is the oxidation number of manganese in potassium permanganate, KMnO4?"
    correct: "7"
    unit: ""
    wrong: []
    explanation: "Potassium is plus one and each of the four oxygens is minus two, so manganese must be plus seven for the neutral compound."
    hints:
      - "Potassium is assigned its usual positive value in this compound."
      - "Oxygen has its usual negative value, and the total must sum to zero."
      - "Solve the balance for the one unknown oxidation number."
    diagram: null
    confidence: "high"
  - topic: "oxidation_number"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "What is the oxidation number of chromium in the dichromate ion, Cr2O7 2-?"
    correct: "+6"
    unit: ""
    wrong:
      - {text: "+3", mistake: "divides the total charge among the atoms incorrectly"}
      - {text: "+7", mistake: "copies the value found for manganese in permanganate"}
      - {text: "+12", mistake: "forgets to divide the total among the two chromium atoms"}
    explanation: "Seven oxygens contribute minus fourteen in total, and the ion has minus two, so the two chromium atoms share plus twelve, giving plus six each."
    hints:
      - "Fix the oxidation number of oxygen first and find the total for the chromium atoms."
      - "Share the remaining charge equally among the chromium atoms in the ion."
      - "Divide the total for the metal by the number of metal atoms."
    diagram: null
    confidence: "high"
  - topic: "oxidation_number"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "What is the oxidation number of the carbon atom bonded to oxygen in methanol, CH3OH?"
    correct: "-2"
    unit: ""
    wrong: []
    explanation: "The carbon has three bonds to hydrogen, each counted as minus one for carbon, and one bond to the more electronegative oxygen, counted as plus one, so its total is -3 + 1 = -2."
    hints:
      - "Assign the electrons in each bond to the more electronegative atom and sum them."
      - "Count the bonds to hydrogen and the bond to oxygen separately."
      - "Add the contributions to get the oxidation number of the carbon."
    diagram: null
    confidence: "high"
  - topic: "oxidation_number"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Which species contains nitrogen with the highest oxidation number?"
    correct: "NO3-"
    unit: ""
    wrong:
      - {text: "NO2-", mistake: "undercounts the oxygen atoms and so lowers the nitrogen value"}
      - {text: "NH3", mistake: "assumes bonding to hydrogen makes nitrogen positive"}
      - {text: "N2", mistake: "treats the elemental form as holding the highest oxidation state"}
    explanation: "In nitrate each oxygen is minus two and the ion is minus one, so nitrogen is plus five, the highest value in this list."
    hints:
      - "Use the rule that oxygen is usually negative and that the total charge is fixed."
      - "Compare the total oxygen contribution in each ion with the charge on the ion."
      - "Check each species one at a time before comparing the results."
    diagram: null
    confidence: "high"
  - topic: "balancing_redox"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "In a redox reaction, what does the oxidising agent do?"
    correct: "gains electrons"
    unit: ""
    wrong:
      - {text: "loses electrons", mistake: "swaps the roles of oxidation and reduction"}
      - {text: "releases oxygen", mistake: "uses oxygen loss as the definition of the oxidising agent"}
      - {text: "is always a metal", mistake: "associates the oxidising agent with metals only"}
    explanation: "The oxidising agent accepts electrons from another species, and in doing so its own oxidation number decreases."
    hints:
      - "Think about the species whose oxidation number decreases during the reaction."
      - "The species that is reduced is the one that accepts electrons."
      - "Consider which direction the electrons move for the oxidising agent."
    diagram: null
    confidence: "high"
  - topic: "balancing_redox"
    type: "numeric"
    difficulty: "easy"
    role: "recall"
    stem: "How many electrons are transferred in the half reaction Fe2+ -> Fe3+?"
    correct: "1"
    unit: ""
    wrong: []
    explanation: "Iron goes from plus two to plus three, so each iron ion loses one electron."
    hints:
      - "Compare the charge on the iron ion before and after the change."
      - "The size of the change in oxidation number gives the electrons per ion."
      - "Write the half equation with the electron on the product side."
    diagram: null
    confidence: "high"
  - topic: "balancing_redox"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "In acidic solution, the half reaction MnO4- -> Mn2+ needs how many electrons on the reactant side to balance the charge?"
    correct: "5 electrons"
    unit: ""
    wrong:
      - {text: "3 electrons", mistake: "miscounts the change in the oxidation number of manganese"}
      - {text: "7 electrons", mistake: "uses the starting oxidation number of manganese as the number of electrons"}
      - {text: "8 electrons", mistake: "counts the hydrogen ions used in balancing as electrons"}
    explanation: "Manganese goes from plus seven to plus two, a gain of five electrons, so the balanced half equation has five electrons on the reactant side."
    hints:
      - "Compare the manganese oxidation number before and after the change."
      - "The number of electrons equals the change in oxidation number for one manganese atom."
      - "Balance the charge after adding the water and hydrogen ions."
    diagram: null
    confidence: "high"
  - topic: "balancing_redox"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "In acidic solution, balancing MnO4- -> Mn2+ requires how many hydrogen ions on the reactant side?"
    correct: "8"
    unit: ""
    wrong: []
    explanation: "Four water molecules are added on the product side to balance oxygen, which requires eight hydrogen ions on the reactant side to balance hydrogen."
    hints:
      - "Balance oxygen with water first, then balance hydrogen with hydrogen ions."
      - "Count the hydrogen atoms in the water molecules you added."
      - "Hydrogen ions are added on the side that needs more hydrogen."
    diagram: null
    confidence: "high"
  - topic: "balancing_redox"
    type: "mcq"
    difficulty: "hard"
    role: "apply"
    stem: "Which species is the reducing agent in the reaction 2 Al + 3 Cu2+ -> 2 Al3+ + 3 Cu?"
    correct: "Al"
    unit: ""
    wrong:
      - {text: "Cu2+", mistake: "chooses the species that is reduced rather than the one that is oxidised"}
      - {text: "Cu", mistake: "treats a product of the reaction as the reducing agent"}
      - {text: "Al3+", mistake: "confuses the product with the reactant that supplies the electrons"}
    explanation: "Aluminium goes from zero to plus three, so it is oxidised and supplies electrons, which makes it the reducing agent."
    hints:
      - "The reducing agent is the species that is oxidised, so find the atom whose oxidation number rises."
      - "Look for the reactant that loses electrons to the other species."
      - "The reducing agent appears as a reactant, not a product."
    diagram: null
    confidence: "high"
  - topic: "balancing_redox"
    type: "numeric"
    difficulty: "hard"
    role: "transfer"
    stem: "In the balanced acidic equation 2 MnO4- + 16 H+ + 10 Cl- -> 2 Mn2+ + x Cl2 + 8 H2O, what is the value of x?"
    correct: "5"
    unit: ""
    wrong: []
    explanation: "Ten chloride ions each lose one electron, giving ten electrons that the two permanganate ions use, and this forms five chlorine molecules."
    hints:
      - "Balance the electron transfer first, so that the manganese gain matches the chloride loss."
      - "Each chloride ion loses one electron when it becomes a chlorine atom in Cl2."
      - "Count the chloride ions and pair them up to form the chlorine molecules."
