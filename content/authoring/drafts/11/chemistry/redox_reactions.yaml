  - topic: "redox_types_series"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What type of reaction is 2 H2 + O2 -> 2 H2O?"
    correct: "combination"
    unit: ""
    wrong:
      - {text: "decomposition", mistake: "reverses the direction of the equation in the mind of the learner"}
      - {text: "displacement", mistake: "thinks an element must displace another in any redox change"}
      - {text: "disproportionation", mistake: "treats both reactants as changing to two different products"}
    explanation: "Two or more reactants join to give a single product, which is the definition of a combination reaction."
    hints:
      - "Several reactants join together to form a single product."
      - "Count how many substances appear on the reactant side and how many on the product side."
      - "Look for the type in which the reactants merge into one compound."
    diagram: null
    confidence: "high"
  - topic: "redox_types_series"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What is a disproportionation reaction?"
    correct: "a single element is simultaneously oxidised and reduced"
    unit: ""
    wrong:
      - {text: "an element displaces another element from a compound", mistake: "confuses disproportionation with displacement"}
      - {text: "a compound splits into simpler substances with no change in oxidation numbers", mistake: "treats decomposition as disproportionation"}
      - {text: "a metal reacts with a halogen to form a salt", mistake: "generalises a common reaction type to all disproportionations"}
    explanation: "In disproportionation one species acts as both the oxidising agent and the reducing agent, so it ends up in both a higher and a lower oxidation state."
    hints:
      - "The same element appears in both an oxidised product and a reduced product."
      - "Look for one species that changes in two opposite directions at once."
      - "Consider whether the reactant is also a product in a different form."
    diagram: null
    confidence: "high"
  - topic: "redox_types_series"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which reaction is an example of disproportionation?"
    correct: "2 Cu+ -> Cu + Cu2+"
    unit: ""
    wrong:
      - {text: "Zn + CuSO4 -> ZnSO4 + Cu", mistake: "calls a displacement reaction a disproportionation"}
      - {text: "2 KClO3 -> 2 KCl + 3 O2", mistake: "treats any decomposition with a change in oxidation number as disproportionation"}
      - {text: "CaCO3 -> CaO + CO2", mistake: "assumes all decompositions are disproportionation reactions"}
    explanation: "In the reaction 2 Cu+ -> Cu + Cu2+ one copper species is both oxidised to plus two and reduced to the metal, which is disproportionation."
    hints:
      - "Look for one species on the reactant side that is both oxidised and reduced."
      - "Find the element that appears on both the product side in a lower and a higher state."
      - "Check the oxidation numbers of that element on each side."
    diagram: null
    confidence: "high"
  - topic: "redox_types_series"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which metal from the reactivity series displaces hydrogen from dilute hydrochloric acid?"
    correct: "zinc"
    unit: ""
    wrong:
      - {text: "copper", mistake: "assumes every metal displaces hydrogen from acid"}
      - {text: "silver", mistake: "confuses the reactivity of noble metals with that of the more reactive metals"}
      - {text: "gold", mistake: "assumes precious metals react readily with acids"}
    explanation: "Zinc lies above hydrogen in the reactivity series, so it can displace hydrogen ions from dilute acid, while copper, silver and gold lie below hydrogen."
    hints:
      - "Use the reactivity series and check whether the metal lies above hydrogen."
      - "Metals below hydrogen cannot displace it from acid."
      - "Compare the position of each listed metal in the series."
    diagram: null
    confidence: "high"
  - topic: "redox_types_series"
    type: "mcq"
    difficulty: "hard"
    role: "apply"
    stem: "Which reaction is a displacement redox reaction?"
    correct: "Cl2 + 2 KBr -> 2 KCl + Br2"
    unit: ""
    wrong:
      - {text: "NaOH + HCl -> NaCl + H2O", mistake: "treats neutralisation as a redox process"}
      - {text: "CaO + H2O -> Ca(OH)2", mistake: "treats hydration of an oxide as a redox process"}
      - {text: "NH4Cl -> NH3 + HCl", mistake: "treats a decomposition as if it were a displacement"}
    explanation: "Chlorine displaces bromine from potassium bromide, and the oxidation numbers of chlorine and bromine change, so the reaction is a displacement redox reaction."
    hints:
      - "Look for a halogen atom that takes the place of another halogen in a salt."
      - "Check which element is reduced and which is oxidised in each equation."
      - "Consider whether any element changes its oxidation number in the reaction."
    diagram: null
    confidence: "high"
  - topic: "redox_types_series"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Why is the decomposition of hydrogen peroxide, 2 H2O2 -> 2 H2O + O2, classed as a disproportionation reaction?"
    correct: "oxygen goes from minus one to minus two and to zero"
    unit: ""
    wrong:
      - {text: "oxygen is both a reactant and a product", mistake: "confuses the presence of an element on both sides with a change in its state"}
      - {text: "hydrogen changes its oxidation number", mistake: "assumes hydrogen takes part in the redox change"}
      - {text: "no element changes its oxidation number", mistake: "assumes that all decompositions are non-redox"}
    explanation: "Oxygen in peroxide is at minus one and is simultaneously reduced to minus two in water and oxidised to zero in the gas, which is disproportionation."
    hints:
      - "Compare the oxidation number of oxygen in the reactant with its values in the two products."
      - "Check whether one element is found in both a higher and a lower oxidation state."
      - "Look at which species carries the oxygen atoms in each product."
    diagram: null
    confidence: "high"
