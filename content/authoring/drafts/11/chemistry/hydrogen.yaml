  - topic: "preparation_properties_h"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Why does hydrogen have a very high ionisation enthalpy compared with the alkali metals below it in group 1?"
    correct: "its single electron is close to the nucleus with no shielding"
    unit: ""
    wrong:
      - {text: "it has many inner electron shells", mistake: "assumes a large number of shells is the reason for the high energy"}
      - {text: "it has a very large atomic radius", mistake: "reverses the effect of atomic size on ionisation enthalpy"}
      - {text: "it is a metal with weak metallic bonding", mistake: "treats metals as having low ionisation enthalpies"}
    explanation: "Hydrogen has a single shell with no inner electrons to shield its electron, so the nuclear attraction is strong and the ionisation enthalpy is large."
    hints:
      - "Consider the number of electron shells and how much the inner electrons shield the outer one."
      - "Compare the size of the atom with the strength of the pull on its outer electron."
      - "Think about what shields the electron from the nucleus in each atom."
    diagram: null
