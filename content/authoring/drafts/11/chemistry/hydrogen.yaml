    unit: "u"
    wrong: []
    explanation: "The average is 0.90 times 1.00783 plus 0.10 times 2.0141, which is about 1.1085, or 1.11 u to three significant figures."
    hints:
      - "Weight each isotope mass by its fraction in the sample."
      - "Add the two weighted contributions together."
      - "Round the final result to the number of significant figures asked for."
