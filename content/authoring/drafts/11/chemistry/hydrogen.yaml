  - topic: "preparation_properties_h"
    type: "mcq"
    difficulty: "hard"
    role: "apply"
    stem: "Why is hydrogen gas collected by downward displacement of water rather than by displacement of air?"
    correct: "it is much less dense than air"
    unit: ""
    wrong:
      - {text: "it reacts strongly with water", mistake: "assumes hydrogen dissolves in water and reacts with it"}
      - {text: "it is denser than air", mistake: "reverses the comparison of densities between hydrogen and air"}
      - {text: "it is a liquid at room temperature", mistake: "treats hydrogen as a liquid under ordinary conditions"}
    explanation: "Hydrogen is far less dense than air, so it rises and would escape from a container of air, which is why the downward displacement method is not used for it."
    hints:
      - "Compare the molar mass of hydrogen with the average molar mass of air."
      - "Think about how a light gas behaves in a container open at the top."
      - "Consider the density relationship that decides which gas stays in the vessel."
