    stem: "Where is hydrogen placed in the modern periodic table?"
    correct: "above lithium in group 1"
    unit: ""
    wrong:
      - {text: "above fluorine in group 17", mistake: "copies the placement of the halogens because hydrogen is also short of one electron"}
      - {text: "in group 14 with carbon", mistake: "uses the four-electron count of carbon for hydrogen"}
      - {text: "in group 18 with helium", mistake: "assumes the filled pair of electrons makes hydrogen a noble gas"}
    explanation: "Hydrogen has one valence electron like the alkali metals, so it is commonly placed at the top of group 1, although it also shows halogen-like behaviour."
    hints:
      - "Think about its single valence electron and which column that matches."
      - "Consider which element sits directly beneath it in the same column."
      - "Its placement is a convention, since its behaviour differs from the column it shares."
