  - topic: "position_and_isotopes_h"
    type: "mcq"
    difficulty: "hard"
    role: "apply"
    stem: "Which hydrogen isotope is radioactive?"
    correct: "tritium"
    unit: ""
    wrong:
      - {text: "protium", mistake: "assumes all isotopes of an element are unstable"}
      - {text: "deuterium", mistake: "confuses the heavy stable isotope with a radioactive one"}
      - {text: "helium-3", mistake: "treats an isotope of a different element as a hydrogen isotope"}
    explanation: "Tritium decays by beta emission with a half life of about twelve years, so it is the radioactive isotope of hydrogen, while protium and deuterium are stable."
    hints:
