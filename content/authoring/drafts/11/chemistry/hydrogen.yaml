  - topic: "position_and_isotopes_h"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which property links hydrogen with the alkali metals?"
    correct: "it forms a unipositive ion H+ with one valence electron"
    unit: ""
    wrong:
      - {text: "it is a solid metal at room temperature", mistake: "treats hydrogen as physically similar to the alkali metals"}
      - {text: "it has seven valence electrons", mistake: "copies the valence count of the halogens onto hydrogen"}
      - {text: "it forms ions of charge minus two", mistake: "assigns hydrogen the charge of oxygen"}
    explanation: "Like the alkali metals, hydrogen loses its single valence electron to form a positive ion, which is the basis for the link between the two groups."
    hints:
      - "Count the valence electrons that hydrogen has and think about what it gives away."
      - "Compare the ion it forms with the ions of the first group."
      - "Look for the property tied to losing a single electron."
