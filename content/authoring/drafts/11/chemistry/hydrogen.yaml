    difficulty: "easy"
    role: "recall"
    stem: "Which hydrogen isotope has one proton and two neutrons?"
    correct: "tritium"
    unit: ""
    wrong:
      - {text: "protium", mistake: "confuses the neutron count of the common isotope"}
      - {text: "deuterium", mistake: "assumes deuterium has two neutrons instead of one"}
      - {text: "helium-3", mistake: "treats any nucleus with a mass number of three as hydrogen"}
    explanation: "Tritium has one proton and two neutrons, giving a mass number of three, and it is the heaviest naturally occurring isotope of hydrogen."
    hints:
      - "Mass number is the total of protons and neutrons, so look for the isotope whose mass number is the largest of the three."
      - "Protium has no neutrons at all."
      - "Deuterium carries a single neutron in its nucleus."
