    explanation: "Zinc is divalent, so it combines with two chloride ions to form zinc chloride, and the hydrogen ions are released as hydrogen gas."
    hints:
      - "Zinc is divalent so it pairs with two chloride ions."
      - "Check that the number of hydrogen atoms on each side of the equation matches."
