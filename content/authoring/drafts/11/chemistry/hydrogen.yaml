      - {text: "about 1.5 percent", mistake: "shifts the decimal point by one place"}
      - {text: "about 99.9 percent", mistake: "takes the abundance of protium as the abundance of deuterium"}
    explanation: "Protium makes up nearly all natural hydrogen, and deuterium is present at roughly 0.015 percent, so the heavy isotope is very rare."
    hints:
      - "Most hydrogen is the lightest isotope, so the heavy isotope must be rare."
      - "Consider the ratio of deuterium to protium in ordinary water."
      - "The answer is a very small percentage."
