    stem: "Why are terminal alkynes acidic?"
    correct: "the sp carbon holds its bonding electrons closer to the nucleus"
    unit: ""
    wrong:
      - {text: "sp3 carbons in the chain are acidic", mistake: "assumes sp3 carbons carry the acidic hydrogen"}
      - {text: "every hydrogen in an organic compound is acidic", mistake: "generalises from carboxylic acids to all hydrogens"}
      - {text: "the triple bond donates electrons to the hydrogen", mistake: "reverses the direction in which electron density shifts"}
    explanation: "The sp hybrid orbital has 50 percent s character, so the electrons in the C-H bond are held closer to carbon, making the terminal hydrogen acidic."
    hints:
      - "Consider how much s character the hybrid orbital contains and how that affects electron density."
      - "Think about how close the bonding electrons are held to the carbon nucleus."
      - "Compare the acidity of hydrogens on sp, sp2 and sp3 carbons."
