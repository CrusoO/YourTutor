    stem: "In simple harmonic motion, the acceleration of the particle is:"
    correct: "proportional to the displacement and directed toward the mean position"
    unit: ""
    wrong:
      - {text: "constant in magnitude and direction", mistake: "assumes the acceleration is uniform, as in projectile motion"}
      - {text: "proportional to the velocity", mistake: "confuses acceleration with velocity"}
      - {text: "zero at the extreme positions", mistake: "assumes the acceleration vanishes at the ends of the motion"}
    explanation: "In SHM the restoring acceleration is proportional to the displacement from the mean position and points back toward that position."
    hints:
      - "Think about the restoring force in a stretched spring."
      - "The acceleration changes as the particle moves."
      - "Compare where the restoring effect is greatest."
