  - topic: orbital_velocity_escape
    type: numeric
    difficulty: easy
    role: recall
    stem: "A planet has surface gravity 4 m/s^2 and radius 9 m. What is the orbital speed of a satellite circling just above its surface, in metres per second?"
    correct: "6"
    unit: "m/s"
    wrong: []
    explanation: "For a close orbit, gravity supplies the centripetal force, so v^2 / R = g and v = square root of g R = square root of 36 = 6 m/s."
    hints:
      - "For a close orbit, gravity supplies the centripetal force."
      - "Set the centripetal acceleration v squared over the radius equal to the surface gravity."
      - "Solve for the speed and take the square root."
