    stem: "The gravitational potential energy of a 4 kg mass is 196 J relative to the ground. Taking g = 9.8 m/s^2, what is its height above the ground in metres?"
    correct: "5"
    unit: "m"
    wrong: []
    explanation: "Potential energy relative to the ground is m g h, so h = 196 / (4 times 9.8) = 196 / 39.2 = 5 m."
    hints:
      - "Potential energy relative to the ground is mass times gravity times height."
      - "Divide the given energy by the mass and by the field strength."
      - "Solve for the height as the final step."
