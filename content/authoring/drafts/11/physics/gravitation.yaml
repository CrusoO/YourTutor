  - topic: gravitational_field_potential
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Taking the potential to be zero at infinity, which expression describes the gravitational potential at distance r from a point mass M?"
    correct: "negative, equal to minus G M divided by r"
    unit: ""
    wrong:
      - {text: "positive, equal to G M divided by r squared", mistake: "confuses the potential with the field strength"}
      - {text: "zero at every distance", mistake: "assumes the potential vanishes everywhere away from the mass"}
      - {text: "positive, equal to G M divided by r", mistake: "forgets the negative sign that marks a bound state"}
    explanation: "Gravity is attractive, so bringing a mass in from infinity releases energy. The potential is therefore negative and equals minus G M over r."
    hints:
      - "Potential is the work per unit mass needed to bring a mass in from infinity."
      - "Gravity is attractive, so the field itself does work as the mass is brought in."
      - "Compare the sign of the potential with its value at infinity, where it is zero."
