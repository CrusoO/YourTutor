    explanation: "The second law says the area swept by the radius vector is the same in equal intervals of time, which means the planet moves faster when it is closer to the Sun."
    hints:
      - "The law concerns the area swept, which depends on how long the motion takes."
      - "Think about how fast a planet moves when it is near the Sun."
