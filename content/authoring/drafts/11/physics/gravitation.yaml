    stem: "A planet has an orbital period of 8 years, while Earth's is 1 year. Using Kepler's third law, by what factor is the planet's orbital radius larger than Earth's?"
    correct: "4"
    unit: ""
    wrong: []
    explanation: "Kepler's third law gives T^2 proportional to r^3, so r is proportional to T^(2/3). The ratio 8^(2/3) equals 4."
    hints:
      - "Kepler's third law relates the square of the period to the cube of the orbital radius."
      - "Find the number whose cube root is the square of the period ratio."
      - "Compare the given periods, not the distances."
