    confidence: high
  - topic: thermodynamic_processes
    type: mcq
    difficulty: easy
    role: recall
    stem: "In an isochoric process, which quantity stays constant?"
    correct: "volume"
    unit: ""
    wrong:
      - {text: "pressure", mistake: "assumes the pressure is fixed in every process"}
      - {text: "temperature", mistake: "confuses isochoric with isothermal"}
      - {text: "internal energy", mistake: "assumes internal energy cannot change in any process"}
    explanation: "An isochoric process keeps the volume constant, so the gas does no work and its pressure and temperature can change."
    hints:
      - "Iso means the same, and the root points to the space the gas fills."
      - "Think of a rigid container being heated."
      - "The gas cannot expand or contract in this process."
    diagram: "A pressure-volume diagram with a vertical line segment at a fixed volume, going from a lower pressure to a higher pressure."
    confidence: high
  - topic: thermodynamic_processes
    type: numeric
    difficulty: medium
    role: procedure
    stem: "An ideal gas is compressed adiabatically, and 200 J of work is done on it. What is the change in its internal energy in joules?"
    correct: "200"
    unit: "J"
    wrong: []
    explanation: "In an adiabatic process Q = 0. With work done on the gas as positive, delta U = W = 200 J."
    hints:
      - "No heat enters or leaves the gas in an adiabatic process."
      - "Apply the first law with the heat term set to zero."
      - "Work done on the gas increases its internal energy."
    diagram: null
