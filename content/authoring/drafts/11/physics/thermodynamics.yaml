    confidence: high
  - topic: thermal_equilibrium_state
    type: numeric
    difficulty: hard
    role: transfer
    stem: "An ideal monatomic gas sample of 0.2 mol has internal energy 1.5 n R T. Using R = 8.31 J/mol K, what is the change in its internal energy in joules, to the nearest joule, when its temperature rises from 300 K to 400 K?"
    correct: "249"
    unit: "J"
    wrong: []
    explanation: "The change is 1.5 times 0.2 times 8.31 times 100 = 249.3 J, which rounds to 249 J."
    hints:
      - "For an ideal monatomic gas, the internal energy depends only on the temperature."
      - "Multiply the factor three halves, the moles, the gas constant and the temperature change."
      - "Keep the moles and the gas constant in consistent units."
    diagram: null
    confidence: high
  - topic: thermal_equilibrium_state
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which of these quantities is NOT a state function of a gas?"
    correct: "work done in a process"
    unit: ""
    wrong:
      - {text: "pressure", mistake: "treats a state variable as path dependent"}
      - {text: "temperature", mistake: "treats a state variable as path dependent"}
      - {text: "entropy", mistake: "treats entropy as a path-dependent quantity"}
    explanation: "Work depends on the path followed between two states, so it is not a state function. Pressure, temperature and entropy depend only on the state."
    hints:
      - "Ask which of these depends on how the process was carried out."
      - "Work is exchanged during a process rather than stored in the system."
      - "State functions have the same value for the same end conditions, whatever the path."
    diagram: null
    confidence: high
  - topic: first_law
    type: mcq
    difficulty: easy
    role: recall
    stem: "The first law of thermodynamics is a statement of which principle?"
    correct: "conservation of energy"
    unit: ""
    wrong:
      - {text: "conservation of momentum", mistake: "confuses the first law with a mechanics conservation law"}
      - {text: "increase of entropy", mistake: "confuses the first law with the second law"}
      - {text: "equal temperatures in equilibrium", mistake: "confuses the first law with the zeroth law"}
    explanation: "The first law states that the change in internal energy equals the heat added minus the work done by the system, which is energy conservation applied to thermal systems."
    hints:
      - "Energy can change form but cannot be created or destroyed."
      - "Heat and work are two ways energy crosses the boundary of a system."
      - "Think of an energy balance sheet for the system."
    diagram: null
    confidence: high
  - topic: first_law
    type: numeric
    difficulty: easy
    role: recall
    stem: "A gas absorbs 300 J of heat and does 120 J of work on its surroundings. Taking work done by the gas as positive, what is the change in its internal energy in joules?"
    correct: "180"
    unit: "J"
    wrong: []
    explanation: "Using delta U = Q - W with Q = 300 J and W = 120 J gives delta U = 180 J."
    hints:
      - "Apply the first law with heat received as positive and work done by the gas as positive."
      - "Subtract the work done by the system from the heat received."
      - "Keep the sign of the result."
    diagram: "A cylinder with a piston containing a gas. An arrow shows heat entering the gas from a flame below, and another arrow shows work leaving the piston upward."
    confidence: high
  - topic: first_law
    type: numeric
    difficulty: medium
    role: procedure
    stem: "One mole of ideal gas expands isothermally at 300 K from 1 litre to 2 litres. Using R = 8.31 J/mol K, what is the work done by the gas in joules, to the nearest joule?"
    correct: "1728"
    unit: "J"
    wrong: []
    explanation: "For isothermal expansion, W = nRT ln(V2/V1) = 1 times 8.31 times 300 times ln 2 = 2493 times 0.6931, which is about 1728 J."
    hints:
      - "For isothermal expansion the work equals n R T times the logarithm of the volume ratio."
      - "The natural logarithm of the ratio two is a standard value."
      - "Multiply the constants and the logarithm together."
    diagram: null
    confidence: high
  - topic: first_law
    type: mcq
    difficulty: medium
    role: apply
    stem: "In an adiabatic process of an ideal gas, which quantity is zero?"
    correct: "heat exchanged with the surroundings"
    unit: ""
    wrong:
      - {text: "work done by the gas", mistake: "assumes an insulated process does no work"}
      - {text: "change in internal energy", mistake: "assumes the internal energy cannot change without heat"}
      - {text: "change in pressure", mistake: "assumes an adiabatic change must keep the pressure fixed"}
    explanation: "An adiabatic process has no heat exchange with the surroundings, so Q is zero. Work and internal energy can still change."
    hints:
      - "Adiabatic means there is no thermal contact with the surroundings."
      - "Apply the first law with the appropriate term set to zero."
      - "Think about which term of the first law vanishes in this process."
    diagram: null
    confidence: high
  - topic: first_law
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A gas is heated at a constant pressure of 100 kPa while its volume increases from 0.002 m^3 to 0.005 m^3, and 900 J of heat enters the gas. What is the change in internal energy in joules?"
    correct: "600"
    unit: "J"
    wrong: []
    explanation: "The work done by the gas is P delta V = 100000 times 0.003 = 300 J. Then delta U = Q - W = 900 - 300 = 600 J."
    hints:
      - "Find the work done by the gas first, using the constant pressure relation."
      - "Then apply the first law with heat entering as positive."
      - "Subtract the work from the heat to get the change in internal energy."
    diagram: "A pressure-volume plot with a horizontal line at 100 kPa, running between the two volume values in cubic metres. The rectangle under the line is shaded."
    confidence: high
  - topic: first_law
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A gas undergoes a full cyclic process and returns to its starting state. Which statement is correct?"
    correct: "net heat absorbed equals net work done by the gas"
    unit: ""
    wrong:
      - {text: "net heat absorbed is zero but net work is not zero", mistake: "assumes one of the two terms must vanish on a cycle"}
      - {text: "net work done is always zero", mistake: "confuses the net work with the net internal energy change"}
      - {text: "net internal energy change is positive", mistake: "assumes energy keeps accumulating over a cycle"}
    explanation: "Over a full cycle the internal energy returns to its starting value, so the net heat absorbed equals the net work done by the gas, as the first law requires."
    hints:
      - "Internal energy returns to its starting value after one full cycle."
      - "Apply the first law across the whole cycle."
      - "Whatever net heat enters the gas must leave as net work over a full cycle."
    diagram: null
    confidence: high
  - topic: thermodynamic_processes
    type: mcq
    difficulty: easy
    role: recall
    stem: "In an isothermal process, which quantity stays constant?"
    correct: "temperature"
    unit: ""
    wrong:
      - {text: "pressure", mistake: "assumes isothermal means isobaric"}
      - {text: "volume", mistake: "confuses isothermal with isochoric"}
      - {text: "heat", mistake: "assumes no heat flows at all during the process"}
    explanation: "An isothermal process keeps the temperature constant, which requires heat exchange with the surroundings as the gas expands or compresses."
    hints:
      - "Iso means the same, and the root word refers to heat."
      - "Think about which property of the gas the prefix iso refers to."
      - "The gas stays in thermal balance with its surroundings through the whole process."
