items:
  - topic: thermal_equilibrium_state
    type: mcq
    difficulty: easy
    role: explain
    stem: "The zeroth law of thermodynamics is about which relation?"
    correct: "if A is in equilibrium with C and B is in equilibrium with C, then A is in equilibrium with B"
    unit: ""
    wrong:
      - {text: "energy is conserved in every process", mistake: "confuses the zeroth law with the first law"}
      - {text: "entropy never decreases in an isolated system", mistake: "confuses the zeroth law with the second law"}
      - {text: "heat only flows from hot bodies to cold bodies", mistake: "restates the second law instead of the zeroth law"}
    explanation: "The zeroth law states that thermal equilibrium is transitive. A third body acts as a common reference, which is why thermometers work."
    hints:
      - "Think about what it means for two bodies to share a temperature."
      - "Use a third body as a go-between."
      - "The statement is about whether equilibrium carries over from one pair to another."
    diagram: null
    confidence: high
  - topic: thermal_equilibrium_state
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which of these is a state variable of a gas?"
    correct: "internal energy"
    unit: ""
    wrong:
      - {text: "heat supplied", mistake: "treats a quantity that depends on the process as a state variable"}
      - {text: "work done by the gas", mistake: "treats a path-dependent quantity as a state variable"}
      - {text: "length of the path taken", mistake: "confuses the process path with the state of the system"}
    explanation: "Internal energy depends only on the current state of the gas, such as its temperature and amount, not on how the gas got there."
    hints:
      - "A state variable depends only on the current condition of the system."
      - "Path quantities depend on how the change was carried out."
      - "The energy stored inside the system is set by its current state."
    diagram: null
    confidence: high
