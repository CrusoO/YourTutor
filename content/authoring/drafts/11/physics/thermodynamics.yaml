  - topic: thermodynamic_processes
    type: mcq
    difficulty: medium
    role: apply
    stem: "A fixed amount of ideal gas is heated at constant pressure. What happens to its volume?"
    correct: "it increases in proportion to its absolute temperature"
    unit: ""
    wrong:
      - {text: "it decreases", mistake: "assumes heating always compresses a gas"}
      - {text: "it stays the same", mistake: "confuses isobaric with isochoric"}
      - {text: "it increases in proportion to the pressure", mistake: "swaps the roles of pressure and temperature"}
    explanation: "At constant pressure, V over T is constant for a fixed amount of gas, so the volume grows in proportion to the absolute temperature."
    hints:
      - "Use the relation between volume and temperature for a fixed amount of gas at fixed pressure."
      - "Keep the pressure fixed in mind."
      - "The absolute temperature scale is the relevant one here."
    diagram: "A pressure-volume plot with a horizontal isobaric line at a fixed pressure. Two volume points on the line are marked, and the temperature at each point is labelled."
    confidence: high
  - topic: thermodynamic_processes
    type: numeric
    difficulty: hard
    role: transfer
    stem: "Two moles of an ideal monatomic gas are cooled at constant pressure from 400 K to 300 K. Its molar heat capacity at constant pressure is 2.5 R, with R = 8.31 J/mol K. How many joules of heat are removed?"
    correct: "4155"
    unit: "J"
    wrong: []
    explanation: "At constant pressure the heat exchanged is n Cp delta T = 2 times 2.5 times 8.31 times 100 = 4155 J. The gas gives this amount up while it cools."
    hints:
      - "At constant pressure, the heat exchanged equals moles times molar heat capacity times the temperature change."
      - "The molar heat capacity at constant pressure is given in the question."
      - "Multiply the moles, the heat capacity factor, the gas constant and the temperature change, then report the magnitude."
    diagram: null
    confidence: high
  - topic: thermodynamic_processes
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which thermodynamic process involves zero work done by the gas?"
    correct: "isochoric process"
    unit: ""
    wrong:
      - {text: "isothermal process", mistake: "assumes constant temperature means no work"}
      - {text: "adiabatic process", mistake: "assumes insulation stops the gas from doing work"}
      - {text: "isobaric process", mistake: "assumes a constant pressure means no work"}
    explanation: "Work is the area under the P-V curve. In an isochoric process the volume does not change, so the work done by the gas is zero."
    hints:
      - "Work is pressure times a volume change in many processes."
      - "Check which process keeps the volume unchanged."
      - "If the volume does not change, the area under the P-V curve has no width."
    diagram: null
    confidence: high
  - topic: second_law_heat_engines
    type: mcq
    difficulty: easy
    role: explain
    stem: "The second law of thermodynamics implies that:"
    correct: "no heat engine can convert all of its heat input into work"
    unit: ""
    wrong:
      - {text: "all energy supplied to an engine can become useful work", mistake: "ignores the waste heat any real cycle must reject"}
      - {text: "heat can flow from a cold body to a hot body with no external work", mistake: "ignores the need for external work to move heat uphill"}
      - {text: "the efficiency of an engine can reach one hundred percent", mistake: "assumes a cyclic engine can avoid rejecting heat"}
    explanation: "A cyclic heat engine must reject some heat to a cold reservoir, so its efficiency is always below one hundred percent."
    hints:
      - "Think about the waste heat that a real engine must reject."
      - "Heat cannot be completely turned into work in a repeating cycle."
      - "Consider how the cold reservoir limits the output of an engine."
    diagram: null
    confidence: high
  - topic: second_law_heat_engines
    type: numeric
    difficulty: easy
    role: recall
    stem: "A heat engine absorbs 500 J of heat each cycle and does 150 J of work. What is its efficiency as a percentage?"
    correct: "30"
    unit: "%"
    wrong: []
    explanation: "Efficiency is work out divided by heat in, so 150 / 500 = 0.30, which is 30 percent."
    hints:
      - "Efficiency is useful work output divided by heat input."
      - "Divide the work by the heat absorbed."
      - "Multiply the fraction by one hundred to get a percentage."
    diagram: "A block representing the engine, with an arrow of heat entering from a hot reservoir, an arrow of work leaving, and a second arrow of heat rejected to a cold reservoir."
    confidence: high
  - topic: second_law_heat_engines
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A Carnot engine operates between a hot reservoir at 500 K and a cold reservoir at 300 K. What is its efficiency as a percentage?"
    correct: "40"
    unit: "%"
    wrong: []
    explanation: "The Carnot efficiency is 1 - T_cold / T_hot = 1 - 300/500 = 0.4, which is 40 percent."
    hints:
      - "Carnot efficiency depends only on the two absolute temperatures."
      - "Divide the cold temperature by the hot temperature."
      - "Subtract that ratio from one, then convert to a percentage."
    diagram: null
    confidence: high
  - topic: second_law_heat_engines
    type: mcq
    difficulty: medium
    role: apply
    stem: "A refrigerator removes heat from its cold interior. Which statement correctly describes how it works?"
    correct: "it needs external work input to move heat from the cold region to the warm room"
    unit: ""
    wrong:
      - {text: "it converts heat completely into work", mistake: "reverses the purpose of a refrigerator"}
      - {text: "it moves heat from cold to hot spontaneously", mistake: "ignores the need for work input"}
      - {text: "it works without any energy input", mistake: "assumes heat can be moved uphill for free"}
    explanation: "Heat does not flow from cold to hot by itself. A refrigerator uses external work, usually from an electric motor, to pump heat against the temperature gradient."
    hints:
      - "Heat flows naturally only from hot to cold."
      - "Reversing that natural flow requires an external energy supply."
      - "Think about what the compressor adds to the system."
    diagram: null
    confidence: high
  - topic: second_law_heat_engines
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A heat engine has efficiency 25 percent and produces 200 J of work per cycle. How many joules of heat are rejected to the cold reservoir each cycle?"
    correct: "600"
    unit: "J"
    wrong: []
    explanation: "The heat input is 200 / 0.25 = 800 J. The rejected heat is 800 - 200 = 600 J."
    hints:
      - "The work output equals efficiency times the heat input."
      - "Find the heat input first, then subtract the work to get the rejected heat."
      - "Energy conservation links the heat input, the work output and the rejected heat."
    diagram: "An energy flow diagram. Heat input arrow goes into the engine from the hot reservoir, a work output arrow leaves the engine, and a heat rejected arrow goes down to the cold reservoir."
    confidence: high
  - topic: second_law_heat_engines
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A Carnot refrigerator operates between a cold reservoir at 250 K and a hot reservoir at 300 K. What is its coefficient of performance?"
    correct: "5"
    unit: ""
    wrong:
      - {text: "6", mistake: "uses the hot temperature in the numerator"}
      - {text: "0.2", mistake: "divides the temperature gap by the cold temperature instead of the reverse"}
      - {text: "1.2", mistake: "uses the ratio of hot to cold temperatures and ignores the gap"}
    explanation: "The coefficient of performance of a Carnot refrigerator is T_cold / (T_hot - T_cold), which is 250 / 50 = 5."
    hints:
      - "The coefficient of performance of a refrigerator puts the cold temperature in the numerator."
      - "The denominator is the temperature gap between the two reservoirs."
      - "Use absolute temperatures in kelvin, not degrees Celsius."
    diagram: null
    confidence: high
