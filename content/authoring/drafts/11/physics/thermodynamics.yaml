  - topic: thermal_equilibrium_state
    type: mcq
    difficulty: medium
    role: apply
    stem: "Two systems are in thermal equilibrium with each other. What do they have in common?"
    correct: "the same temperature"
    unit: ""
    wrong:
      - {text: "the same internal energy", mistake: "assumes equal energy means equal temperature"}
      - {text: "the same volume", mistake: "assumes thermal equilibrium requires equal volumes"}
      - {text: "equal heat capacities", mistake: "confuses thermal equilibrium with equal heat capacities"}
    explanation: "Thermal equilibrium means there is no net heat flow between the systems, which happens exactly when their temperatures are equal."
    hints:
      - "Equilibrium means no net heat flows between the two systems."
      - "Think about the quantity that decides the direction of heat flow."
      - "Equal values of the intensive quantity that controls heat flow decide equilibrium."
