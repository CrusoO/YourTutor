  - topic: temperature_and_thermal_expansion
    type: numeric
    difficulty: easy
    role: recall
    stem: "A steel rod of length 2 m is heated through 100 K. Its coefficient of linear expansion is 12 times 10 to the power minus six per kelvin. What is its increase in length in millimetres?"
    correct: "2.4"
    unit: "mm"
    wrong: []
    explanation: "The change in length is L alpha delta T = 2 times 12 times 10^-6 times 100 = 0.0024 m, which is 2.4 mm."
    hints:
      - "The change in length is the original length times the coefficient times the temperature change."
      - "Keep all quantities in metres and kelvin until the end."
      - "Convert metres to millimetres as the final step."
    diagram: null
    confidence: high
  - topic: temperature_and_thermal_expansion
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A glass vessel of volume 500 cm^3 is filled with mercury at 20 degrees Celsius. When heated through 50 K, how many cubic centimetres of mercury overflow? The volume expansion coefficient of mercury is 1.8 times 10^-4 per K, and glass expansion is ignored."
    correct: "4.5"
    unit: "cm^3"
    wrong: []
    explanation: "The expansion of the mercury is V beta delta T = 500 times 1.8 times 10^-4 times 50 = 4.5 cm^3."
    hints:
      - "Volume expansion uses the volume coefficient, not the linear coefficient."
      - "Multiply the original volume by the coefficient and by the temperature rise."
      - "Glass expansion is ignored in this question."
    diagram: null
    confidence: high
  - topic: temperature_and_thermal_expansion
    type: mcq
    difficulty: medium
    role: apply
    stem: "A bimetallic strip made of two bonded metal layers bends when it is heated. The bending happens because:"
    correct: "the two metals expand by different amounts"
    unit: ""
    wrong:
      - {text: "one metal melts before the other", mistake: "confuses melting with expansion"}
      - {text: "both metals contract when heated", mistake: "reverses the sign of thermal expansion"}
      - {text: "heat flows through only the top layer", mistake: "ignores the mismatch in expansion between the layers"}
    explanation: "Each metal has its own expansion coefficient. Because the layers are bonded together, the mismatch in their expansion forces the strip to curve."
    hints:
      - "Compare the expansion coefficients of the two layers."
      - "The strip is bonded, so one layer cannot slip freely past the other."
      - "Mismatched growth between bonded layers produces curvature."
