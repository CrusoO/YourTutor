    type: numeric
    difficulty: hard
    role: transfer
    stem: "0.2 kg of ice at -10 degrees Celsius is heated until it becomes water at 20 degrees Celsius. Ice has specific heat 2100 J/kg K, water has specific heat 4200 J/kg K, and the latent heat of fusion is 336 kJ/kg. What is the total heat required, in kilojoules?"
