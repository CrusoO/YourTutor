  - topic: change_of_state_latent
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A liquid boils at constant pressure and turns into vapour at its boiling point. Which statement about its internal energy is correct?"
    correct: "internal energy increases while the temperature stays the same"
    unit: ""
    wrong:
      - {text: "internal energy decreases while the temperature stays the same", mistake: "thinks vaporisation releases energy"}
      - {text: "internal energy stays constant while the temperature rises", mistake: "reverses the logic of the phase change"}
      - {text: "temperature falls while internal energy stays fixed", mistake: "assumes evaporation cools everything in the system"}
    explanation: "During vaporisation the absorbed heat breaks intermolecular bonds, so the internal energy rises while the temperature stays fixed at the boiling point."
    hints:
      - "Energy is needed to overcome the attraction between molecules during vaporisation."
      - "Temperature is linked to the average molecular kinetic energy."
      - "Separate the energy going into bonds from the energy in molecular motion."
