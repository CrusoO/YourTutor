  - topic: specific_heat_calorimetry
    type: numeric
    difficulty: hard
    role: transfer
    stem: "In an insulated container, 50 g of ice at 0 degrees Celsius is added to 200 g of water at 25 degrees Celsius. Latent heat of fusion is 336 J/g and water's specific heat is 4.2 J/g K. What is the final temperature in degrees Celsius?"
    correct: "4"
    unit: "degrees Celsius"
    wrong: []
    explanation: "The water releases 21000 J on cooling to 0 degrees, but melting the ice needs only 16800 J. The remaining 4200 J warms the 250 g of water by 4 degrees."
    hints:
      - "First check whether the heat given up by the water can melt all of the ice."
      - "Compare the heat needed to melt the ice with the heat the water can give up."
      - "After melting, treat the whole liquid as one sample of water and find its warming."
