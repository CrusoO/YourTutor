    unit: "kJ"
    wrong: []
    explanation: "The stages are warming the ice from -10 to 0 degrees, 4.2 kJ; melting, 67.2 kJ; and warming the water from 0 to 20 degrees, 16.8 kJ. The total is 88.2 kJ."
    hints:
      - "Split the process into three stages, each with its own formula."
      - "The first stage warms the ice up to its melting temperature."
      - "Melting happens at constant temperature, and the last stage warms the water."
