  - topic: change_of_state_latent
    type: mcq
    difficulty: medium
    role: apply
    stem: "Why does evaporation from a liquid cool the liquid that remains?"
    correct: "fast molecules escape and carry away more than the average energy"
    unit: ""
    wrong:
      - {text: "the liquid gives heat to the surrounding air", mistake: "reverses the direction of heat flow"}
      - {text: "the vapour pressure lowers the temperature directly", mistake: "invents a pressure-based cooling mechanism"}
      - {text: "molecules slow down from collisions with the container", mistake: "ignores the escape of the fastest molecules"}
    explanation: "Only the most energetic molecules tend to leave the surface, so the molecules left behind have less average kinetic energy and the liquid cools."
    hints:
      - "Only the most energetic molecules tend to leave the surface."
      - "Consider the average energy of the molecules that stay behind."
      - "Escaping molecules take their energy away with them."
