  - topic: specific_heat_calorimetry
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Two equal masses of different substances receive the same amount of heat. The substance with the larger specific heat capacity shows:"
    correct: "a smaller temperature rise"
    unit: ""
    wrong:
      - {text: "a larger temperature rise", mistake: "inverts the relation between specific heat and temperature change"}
      - {text: "the same temperature rise", mistake: "ignores the specific heat capacity"}
      - {text: "a temperature rise that depends only on the time taken", mistake: "confuses heat with the time over which it is supplied"}
    explanation: "The temperature rise equals Q divided by m c. A larger specific heat makes the denominator bigger, so the temperature rise is smaller."
    hints:
      - "The temperature change equals heat divided by mass times specific heat."
      - "Compare the denominators of the two cases."
      - "A larger denominator makes the quotient smaller."
    diagram: null
    confidence: high
  - topic: change_of_state_latent
    type: mcq
    difficulty: easy
    role: recall
    stem: "During melting at constant pressure, the temperature of a pure substance:"
    correct: "remains constant while latent heat is absorbed"
    unit: ""
    wrong:
      - {text: "rises steadily", mistake: "assumes heat always raises the temperature"}
      - {text: "falls steadily", mistake: "confuses melting with cooling"}
      - {text: "rises and then falls", mistake: "invents a curved temperature profile for the phase change"}
    explanation: "During a phase change at constant pressure, the absorbed heat goes into breaking intermolecular bonds, so the temperature stays fixed until melting is complete."
    hints:
      - "Heat goes into breaking bonds during a phase change."
      - "Think of the energy going into the structure rather than into the motion of the molecules."
      - "The question is about the flat section of the heating curve during the change."
