  - topic: heat_transfer
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which mode of heat transfer needs no material medium and can occur through a vacuum?"
    correct: "radiation"
    unit: ""
    wrong:
      - {text: "conduction", mistake: "assumes all heat transfer needs solid contact"}
      - {text: "convection", mistake: "confuses bulk fluid motion with transfer through empty space"}
      - {text: "diffusion", mistake: "treats the mixing of molecules as a heat transfer mode"}
    explanation: "Radiation carries energy as electromagnetic waves, so it needs no medium and reaches us from the Sun through the vacuum of space."
    hints:
      - "Heat from the Sun reaches the Earth across empty space."
      - "Think about waves that carry energy."
      - "This mode is based on electromagnetic waves."
