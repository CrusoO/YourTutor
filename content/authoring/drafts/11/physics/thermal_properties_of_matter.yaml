    type: mcq
    difficulty: easy
    role: recall
    stem: "When a metal rod is heated, its length increases because:"
    correct: "its atoms vibrate with larger amplitude and sit farther apart on average"
    unit: ""
    wrong:
      - {text: "its mass increases with temperature", mistake: "confuses density changes with changes in mass"}
      - {text: "it absorbs extra atoms from the surrounding air", mistake: "invents a mass gain from the environment"}
      - {text: "its density increases as it is heated", mistake: "gets the direction of the density change wrong"}
    explanation: "Heating increases the amplitude of atomic vibrations, which pushes neighbouring atoms farther apart on average and lengthens the rod."
    hints:
      - "Consider what heating does to the motion of the atoms."
      - "Think about the average separation between atoms in a solid."
      - "Stronger vibrations push neighbouring atoms apart."
