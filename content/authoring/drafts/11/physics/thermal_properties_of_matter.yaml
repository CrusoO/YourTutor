    confidence: high
  - topic: change_of_state_latent
    type: numeric
    difficulty: easy
    role: recall
    stem: "The latent heat of fusion of ice is 336 kJ/kg. How many kilojoules are needed to melt 2 kg of ice at 0 degrees Celsius?"
    correct: "672"
    unit: "kJ"
    wrong: []
    explanation: "Heat for a phase change equals mass times latent heat, so Q = 2 times 336 = 672 kJ."
    hints:
      - "Heat for a phase change equals mass times latent heat."
      - "Multiply the mass by the latent heat per kilogram."
      - "Keep track of kilojoules throughout the calculation."
