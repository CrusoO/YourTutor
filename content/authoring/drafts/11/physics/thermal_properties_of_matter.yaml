    type: numeric
    difficulty: medium
    role: procedure
    stem: "Latent heat of vaporisation of water is 2.26 MJ/kg. How many kilojoules are needed to turn 0.5 kg of water at 100 degrees Celsius into steam at 100 degrees Celsius?"
    correct: "1130"
    unit: "kJ"
    wrong: []
    explanation: "No temperature change occurs in this phase change, so Q = m L = 0.5 times 2.26 MJ = 1.13 MJ, which is 1130 kJ."
    hints:
      - "No temperature change occurs during this phase change."
      - "Use mass times latent heat."
      - "Convert megajoules to kilojoules at the end."
