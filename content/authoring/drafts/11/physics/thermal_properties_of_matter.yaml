  - topic: heat_transfer
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A body cools from 80 degrees Celsius to 60 degrees Celsius in 5 minutes in surroundings at 20 degrees Celsius. Using Newton's law of cooling, how many minutes does it take to cool from 60 degrees to 50 degrees in the same surroundings? Give one decimal place."
    correct: "3.5"
    unit: "min"
    wrong: []
    explanation: "The excess temperature decays exponentially with a constant k. From 60 to 40 excess in 5 min, k = ln(1.5) / 5. Going from 40 to 30 excess takes ln(4/3) / k = 5 ln(4/3) / ln(1.5), about 3.5 min."
    hints:
      - "Newton's law makes the temperature difference decay exponentially with time."
      - "Find the decay constant from the first cooling interval."
      - "Use the second temperature difference with the same constant."
    diagram: "A cooling curve with temperature falling over time. A horizontal dashed line marks the surroundings temperature, and points are marked on the curve at the 80, 60 and 50 degree levels."
    confidence: high
