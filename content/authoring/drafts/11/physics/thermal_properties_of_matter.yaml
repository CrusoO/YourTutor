  - topic: heat_transfer
    type: mcq
    difficulty: easy
    role: recall
    stem: "A metal rod is heated at one end. Heat travels to the far end mainly by which mode?"
    correct: "conduction"
    unit: ""
    wrong:
      - {text: "radiation", mistake: "assumes a rod radiates heat along its length"}
      - {text: "convection", mistake: "assumes the hot metal moves like a fluid"}
      - {text: "evaporation", mistake: "mixes up a phase change with heat flow along the rod"}
    explanation: "In a solid, energy passes from particle to particle through contact, which is conduction. The metal rod does not flow, so convection is not the main mode."
    hints:
      - "Energy passes from one particle to the next through contact."
      - "No fluid flows inside a solid rod."
      - "Think of the mode that needs matter in contact."
    diagram: "A horizontal metal rod with one end labelled hot and a flame beneath that end. Arrows along the rod show heat moving toward the cooler end."
    confidence: high
  - topic: heat_transfer
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A slab of area 2 m^2 and thickness 2 m has a temperature difference of 20 K across it. Its thermal conductivity is 400 W/m K. What is the rate of heat flow through it in watts?"
    correct: "8000"
    unit: "W"
    wrong: []
    explanation: "Conduction rate is P = k A delta T / d = 400 times 2 times 20 / 2 = 8000 W."
    hints:
