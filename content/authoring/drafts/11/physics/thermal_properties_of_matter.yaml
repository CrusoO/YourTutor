  - topic: temperature_and_thermal_expansion
    type: numeric
    difficulty: hard
    role: transfer
    stem: "An aluminium sheet has area 2 m^2 at 20 degrees Celsius. Its coefficient of area expansion is 4.6 times 10^-5 per K. Its temperature rises by 80 K. What is the increase in area in square centimetres, to one decimal place?"
    correct: "73.6"
    unit: "cm^2"
    wrong: []
    explanation: "The increase in area is A beta delta T = 2 times 4.6 times 10^-5 times 80 = 7.36 times 10^-3 m^2. One square metre is ten thousand square centimetres, so the increase is 73.6 cm^2."
    hints:
      - "The area coefficient is given directly, so you do not need to double anything."
      - "Multiply the original area, the coefficient and the temperature change."
      - "Convert square metres to square centimetres at the end."
    diagram: null
    confidence: high
  - topic: temperature_and_thermal_expansion
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Water has a density maximum near 4 degrees Celsius. As water cools from 10 degrees Celsius down to 4 degrees Celsius, what happens to it?"
    correct: "it contracts and its density increases"
    unit: ""
    wrong:
      - {text: "it expands and its density decreases", mistake: "applies the normal expansion rule across the whole range"}
      - {text: "it contracts and its density decreases", mistake: "gets the sign of the density change wrong"}
      - {text: "it stays the same size and density", mistake: "treats water as if it had no anomaly"}
    explanation: "Between 10 and 4 degrees Celsius water contracts as it cools, so its density rises toward the maximum found near 4 degrees Celsius."
    hints:
      - "Most substances become denser as they cool."
      - "Water behaves differently only in a narrow temperature range near its density maximum."
      - "Watch how the volume trend changes on either side of that special temperature."
    diagram: null
    confidence: high
  - topic: specific_heat_calorimetry
    type: mcq
    difficulty: easy
    role: recall
    stem: "The specific heat capacity of a substance is the heat needed to raise the temperature of:"
    correct: "one kilogram of it by one kelvin"
    unit: ""
    wrong:
      - {text: "one kilogram of it to its boiling point", mistake: "confuses specific heat with latent heat"}
      - {text: "its entire mass by one kelvin", mistake: "forgets that the definition is normalised per unit mass"}
      - {text: "one mole of it by one kelvin", mistake: "uses the molar basis instead of the mass basis"}
    explanation: "Specific heat capacity is the heat required per unit mass for a one-unit rise in temperature, so its unit is joules per kilogram per kelvin."
    hints:
      - "The definition is given per unit of mass."
      - "Specific means per unit of something."
      - "The unit involves joules, kilograms and kelvin."
    diagram: null
    confidence: high
  - topic: specific_heat_calorimetry
    type: numeric
    difficulty: easy
    role: recall
    stem: "Water has specific heat capacity 4200 J/kg K. How many kilojoules are needed to warm 2 kg of water by 10 K?"
    correct: "84"
    unit: "kJ"
    wrong: []
    explanation: "Heat equals mass times specific heat times temperature change, so Q = 2 times 4200 times 10 = 84000 J, which is 84 kJ."
    hints:
      - "Heat equals mass times specific heat times the temperature change."
      - "Multiply the three quantities together."
      - "Divide the joules by one thousand at the end."
    diagram: null
    confidence: high
  - topic: specific_heat_calorimetry
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A 0.5 kg metal block at 100 degrees Celsius is dropped into 1 kg of water at 20 degrees Celsius. The final common temperature is 30 degrees Celsius, with no heat lost. Water has specific heat 4200 J/kg K. What is the specific heat of the metal in J/kg K?"
    correct: "1200"
    unit: "J/kg K"
    wrong: []
    explanation: "Heat lost by the metal, 0.5 times c times 70, equals heat gained by the water, 1 times 4200 times 10. So c = 42000 / 35 = 1200 J/kg K."
    hints:
      - "Heat lost by the hot body equals heat gained by the cold one."
      - "Write each heat as mass times specific heat times the temperature change."
      - "Solve the equality for the unknown specific heat."
    diagram: null
    confidence: high
  - topic: specific_heat_calorimetry
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which is the SI unit of specific heat capacity?"
    correct: "joule per kilogram kelvin"
    unit: ""
    wrong:
      - {text: "joule per kelvin", mistake: "forgets the mass in the denominator"}
      - {text: "joule per kilogram", mistake: "omits the temperature unit"}
      - {text: "watt per kelvin", mistake: "uses a power unit instead of an energy unit"}
    explanation: "Specific heat capacity is heat per unit mass per unit temperature change, so its SI unit is joule per kilogram kelvin."
    hints:
      - "Heat is measured in joules."
      - "Specific means per unit mass and per unit temperature change."
      - "The denominator needs one mass unit and one temperature unit."
