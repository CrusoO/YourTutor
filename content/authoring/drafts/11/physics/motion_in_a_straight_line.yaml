  - topic: kinematic_equations
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which equation relates final velocity v, initial velocity u, acceleration a and displacement s without using time?"
    correct: "v^2 = u^2 + 2as"
    unit: ""
    wrong:
      - {text: "v = u + at", mistake: "uses the equation that needs time"}
      - {text: "s = ut + (1/2)at^2", mistake: "uses the displacement equation that needs time"}
      - {text: "v = at^2 + u", mistake: "squares the time in the velocity equation"}
    explanation: "The equation v^2 = u^2 + 2as is the time-free relation between velocity, acceleration and displacement for constant acceleration."
    hints:
      - "Look for the equation that contains displacement but not time."
      - "Check each option for whether time appears in it."
      - "Squared velocities pair naturally with displacement in this relation."
    diagram: null
    confidence: high
