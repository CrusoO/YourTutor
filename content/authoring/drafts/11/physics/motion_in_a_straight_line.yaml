      - {text: "slope of the tangent at the start", mistake: "uses the instantaneous velocity at one point"}
    explanation: "Average velocity is the change in position divided by the change in time, which is the slope of the straight chord between the two points on the graph."
    hints:
      - "Average velocity is displacement divided by time."
      - "Compare the rise and the run between the two marked points."
      - "A tangent touches the curve at only one instant."
