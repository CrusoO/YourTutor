    stem: "Which statement is Newton's second law of motion?"
    correct: "net force equals mass times acceleration"
    unit: ""
    wrong:
      - {text: "every action has an equal and opposite reaction acting on a different body", mistake: "states the third law instead of the second"}
      - {text: "a force is needed to keep an object moving at constant speed", mistake: "believes motion at constant speed requires a force"}
      - {text: "an object at rest stays at rest unless acted on by a net force", mistake: "states the first law instead of the second"}
    explanation: "The second law links the net force on a body to its mass and the acceleration it produces, in the form F = m a."
    hints:
      - "The law links three quantities: a net force, a mass and an acceleration."
      - "Think about how a push changes the speed of a heavy object compared with a light one."
      - "Decide which quantity the net force is set equal to in the law."
