    stem: "A 5 kg block on a rough horizontal floor is pulled by a rope at 60 degrees above the horizontal with a tension of 40 N. The coefficient of kinetic friction is 0.2. Taking g = 9.8 m/s^2, what is the acceleration in metres per second squared, to two decimal places?"
    correct: "3.43"
    unit: "m/s^2"
    wrong: []
    explanation: "The horizontal pull is 40 cos 60 = 20 N. The normal force is 49 - 40 sin 60 = 14.36 N, so the friction is 2.87 N. The net force is 17.13 N, giving a = 3.43 m/s^2."
    hints:
      - "Resolve the rope tension into horizontal and vertical parts."
      - "The vertical part of the tension reduces the normal force on the floor."
      - "Find the net horizontal force, then divide by the mass."
