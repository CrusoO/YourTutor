  - topic: circular_motion_dynamics
    type: numeric
    difficulty: easy
    role: recall
    stem: "A 1.2 kg ball is whirled on a string of length 0.5 m in a horizontal circle at a speed of 2 m/s. What is the tension in the string in newtons?"
    correct: "9.6"
    unit: "N"
    wrong: []
    explanation: "In a horizontal circle the tension supplies the whole centripetal force, T = m v^2 / r = 1.2 times 4 divided by 0.5, which is 9.6 N."
    hints:
      - "In this setup the tension supplies the entire centripetal force."
      - "Centripetal force equals mass times speed squared divided by the radius."
      - "Square the speed before you multiply by the mass."
    diagram: "A top-down view of a circular path with a ball on a string. The string is drawn as a radius to the centre, and the tension arrow points along the string toward the centre."
    confidence: high
  - topic: circular_motion_dynamics
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A car of mass 800 kg goes round a flat bend of radius 50 m at 10 m/s without skidding. Taking g = 9.8 m/s^2, what is the minimum coefficient of static friction needed, to two decimal places?"
    correct: "0.20"
    unit: ""
    wrong: []
    explanation: "Static friction provides the centripetal force, so mu m g must be at least m v^2 / r. That gives mu = v^2 / (r g) = 100 / 490, about 0.20."
    hints:
      - "Static friction provides the sideways force that bends the path."
      - "Friction cannot exceed the coefficient times the normal force."
      - "Set the maximum friction equal to the required centripetal force and cancel the mass."
    diagram: null
    confidence: high
