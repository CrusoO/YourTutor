    stem: "A 20 kg crate is pushed along a horizontal floor at constant speed by a horizontal force of 49 N. Taking g = 9.8 m/s^2, what is the coefficient of kinetic friction?"
    correct: "0.25"
    unit: ""
    wrong: []
    explanation: "Constant speed means the net force is zero, so the kinetic friction equals the 49 N push. The normal force is 196 N, so the coefficient is 49 / 196 = 0.25."
    hints:
      - "Constant speed means the net force on the crate is zero."
      - "Kinetic friction then balances the applied force exactly."
      - "Divide the friction by the normal force, which equals the weight on a horizontal floor."
