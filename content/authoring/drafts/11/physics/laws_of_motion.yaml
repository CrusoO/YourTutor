  - topic: friction
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A block slides down a rough incline. If the incline angle is increased while the block keeps sliding, what happens to the kinetic friction force on the block?"
    correct: "it decreases in magnitude"
    unit: ""
    wrong:
      - {text: "it increases with the angle", mistake: "assumes friction grows with the steepness of the slope"}
      - {text: "it stays the same", mistake: "treats friction as independent of the normal force"}
      - {text: "it reverses direction", mistake: "believes friction always points up the slope in every case"}
    explanation: "Kinetic friction equals mu times the normal force, and the normal force is mg cos theta. As the angle grows, cos theta falls, so the friction decreases."
    hints:
      - "Friction depends on the normal force pressing the two surfaces together."
      - "Find how the component of weight perpendicular to the slope changes with the angle."
      - "Consider how the cosine of the incline angle behaves as the angle grows."
    diagram: "A block on an incline with the perpendicular normal force and the weight components marked. A second, steeper incline is drawn beside it for comparison."
    confidence: high
