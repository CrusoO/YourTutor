  - topic: newtons_laws_11
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A 2 kg block on a smooth incline of 30 degrees is held in place by a string parallel to the slope. Taking g = 9.8 m/s^2, what is the tension in the string in newtons?"
    correct: "9.8"
    unit: "N"
    wrong: []
    explanation: "The component of weight along the slope is mg sin 30 degrees, which is 2 times 9.8 times 0.5 = 9.8 N. The string balances this component."
    hints:
      - "Resolve the weight into a component along the slope and one perpendicular to it."
      - "The component along the slope is the one the string must balance."
      - "Use the sine of the incline angle for the part along the slope."
    diagram: "An inclined plane at 30 degrees with a block resting on the slope. Weight acts vertically downward, the normal force is perpendicular to the slope, and the string acts along the slope upward."
    confidence: high
