    explanation: "On a flat road the centripetal force points toward the centre of the bend and is supplied by the sideways friction between the tyres and the road surface."
    hints:
      - "Centripetal force points toward the centre of the circle."
      - "Which contact between the car and the road can push or pull sideways?"
      - "Consider the force that acts along the road surface."
