    stem: "What provides the centripetal force for a car turning on a flat, unbanked road?"
    correct: "friction between the tyres and the road"
    unit: ""
    wrong:
      - {text: "the weight of the car", mistake: "believes gravity pulls the car sideways in a turn"}
