    stem: "A bob of mass 2 kg on a string of length 1.5 m moves in a vertical circle. At the lowest point the tension is 60 N. Taking g = 9.8 m/s^2, what is its speed at the lowest point in metres per second, to one decimal place?"
    correct: "5.5"
    unit: "m/s"
    wrong: []
    explanation: "At the bottom, T - mg = m v^2 / r, so 60 - 19.6 = 2 v^2 / 1.5. This gives v^2 = 30.3 and v = 5.5 m/s."
    hints:
      - "At the bottom of the circle the tension acts upward and the weight acts downward."
      - "The net upward force is the centripetal force that keeps the bob on the circle."
      - "Subtract the weight from the tension before solving for the speed."
    diagram: "A vertical circle with the bob at its lowest point. Tension acts upward along the string toward the centre, and weight acts downward from the bob."
    confidence: high
