  - topic: newtons_laws_11
    type: numeric
    difficulty: easy
    role: recall
    stem: "A 4 kg block rests on a smooth table and is pulled by a horizontal force of 12 N. What is its acceleration in metres per second squared?"
    correct: "3"
    unit: "m/s^2"
    wrong: []
    explanation: "With no friction, the net horizontal force is the applied 12 N. Dividing by the mass 4 kg gives 3 m/s^2."
    hints:
      - "A smooth table means there is no friction acting on the block."
      - "Apply Newton's second law along the horizontal direction."
      - "Divide the net force by the mass."
    diagram: "Free-body diagram of a block on a table. Weight acts downward, the normal force acts upward, a horizontal applied force acts to the right, and no friction arrow is drawn."
    confidence: high
  - topic: newtons_laws_11
    type: numeric
    difficulty: medium
    role: procedure
    stem: "Two blocks of masses 3 kg and 5 kg are joined by a light string on a frictionless floor. A horizontal force of 16 N pulls the 3 kg block. What is the tension in the string in newtons?"
    correct: "10"
    unit: "N"
    wrong: []
    explanation: "The whole system has mass 8 kg, so a = 16 / 8 = 2 m/s^2. The string must accelerate the 5 kg block, so T = 5 times 2 = 10 N."
    hints:
      - "Treat both blocks together first to find the common acceleration."
      - "The string pulls the far block and transmits the accelerating force."
      - "Apply Newton's second law to the far block alone using that acceleration."
    diagram: "Two blocks in a line on a frictionless floor. A force arrow on the left block points right, and a string links the left block to the right block."
    confidence: high
  - topic: newtons_laws_11
    type: mcq
    difficulty: medium
    role: apply
    stem: "A lift of mass 500 kg accelerates upward at 2 m/s^2. Taking g = 9.8 m/s^2, what is the tension in the supporting cable?"
    correct: "5900 N"
    unit: ""
    wrong:
      - {text: "4900 N", mistake: "ignores the acceleration of the lift"}
      - {text: "1000 N", mistake: "uses the acceleration alone as the force"}
      - {text: "3900 N", mistake: "subtracts the acceleration instead of adding it"}
    explanation: "The cable must support the weight and also provide the extra upward force for the acceleration. T = m(g + a) = 500 times 11.8 = 5900 N."
    hints:
      - "The cable supports the weight and also supplies the extra push for the acceleration."
      - "Write the net upward force on the lift as tension minus weight."
      - "Solve the net force equation for the tension."
