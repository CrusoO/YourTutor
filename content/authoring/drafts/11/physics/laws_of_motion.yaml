    stem: "A 10 kg block rests on a horizontal floor where the coefficient of static friction is 0.4. Taking g = 9.8 m/s^2, what is the maximum static friction force in newtons?"
    correct: "39.2"
    unit: "N"
    wrong: []
    explanation: "On a horizontal floor the normal force equals the weight, 98 N. The maximum static friction is 0.4 times 98, which is 39.2 N."
    hints:
      - "Maximum static friction equals the coefficient times the normal force."
      - "On a horizontal floor the normal force equals the weight of the block."
      - "Multiply the coefficient, the mass and gravity together."
