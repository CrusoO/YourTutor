  - topic: vectors_and_components
    type: numeric
    difficulty: hard
    role: transfer
    stem: "Two forces of 3 N each act at a point, with an angle of 120 degrees between their directions. What is the magnitude of the resultant in newtons?"
    correct: "3"
    unit: "N"
    wrong: []
    explanation: "Using the law of cosines, R squared equals 9 + 9 + 2 times 9 times cos 120 degrees, which is 18 minus 9 = 9. So R = 3 N."
    hints:
      - "Use the law of cosines for the resultant of two vectors."
      - "The cosine of 120 degrees is negative, which reduces the resultant."
      - "Compute the squared resultant first, then take the square root."
    diagram: "A single point with two arrows of equal length leaving it at 120 degrees to each other. A dashed line shows their resultant as the diagonal of the shape they form."
    confidence: high
