  - topic: projectile_motion
    type: numeric
    difficulty: easy
    role: recall
    stem: "A ball is thrown horizontally from the top of a building 19.6 m high. Taking g = 9.8 m/s^2, how many seconds does it take to reach the ground?"
    correct: "2"
    unit: "s"
    wrong: []
    explanation: "The vertical motion starts from zero vertical velocity, so 19.6 = 0.5 times 9.8 times t squared. This gives t^2 = 4 and t = 2 s."
    hints:
      - "Vertical motion starts with zero vertical velocity for a horizontal throw."
      - "Use the displacement equal to half of g times time squared."
      - "Solve for the time from the height, then take the square root."
    diagram: "A side view of a building edge with a horizontal arrow leaving the top. A vertical dimension line marks the height from the top down to the ground."
    confidence: high
  - topic: projectile_motion
    type: mcq
