    stem: "A stone tied to a string of length 0.5 m moves in a horizontal circle, making 2 revolutions per second. Using pi as 3.14, what is its centripetal acceleration in metres per second squared, to one decimal place?"
    correct: "78.9"
    unit: "m/s^2"
    wrong: []
    explanation: "The angular speed is 2 pi f, which is 12.56 rad/s. Then a = omega squared times r = 157.75 times 0.5, about 78.9 m/s^2."
    hints:
      - "Convert the revolutions per second into an angular speed first."
      - "Angular speed is two pi times the frequency."
      - "Centripetal acceleration equals the square of the angular speed times the radius."
