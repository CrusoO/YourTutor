    type: mcq
    difficulty: medium
    role: apply
    stem: "A particle moves in a circle of radius 2 m and completes one revolution every 4 s. What is its speed?"
    correct: "3.14 m/s"
    unit: ""
    wrong:
      - {text: "6.28 m/s", mistake: "uses the diameter in place of the radius"}
      - {text: "1.57 m/s", mistake: "uses double the period"}
      - {text: "12.56 m/s", mistake: "forgets to divide the distance by the period"}
    explanation: "The speed is the circumference 2 pi r divided by the period 4 s. That is 2 pi times 2 over 4, which is pi, or 3.14 m/s."
    hints:
      - "Speed in circular motion equals the distance covered divided by the time taken."
      - "The distance covered in one period is the circumference of the circle."
      - "Divide the circumference by the period."
    diagram: null
    confidence: high
