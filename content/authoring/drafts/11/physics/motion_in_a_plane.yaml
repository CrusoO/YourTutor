  - topic: uniform_circular_motion_11
    type: numeric
    difficulty: easy
    role: recall
    stem: "A car moves round a circular track of radius 50 m at a constant speed of 10 m/s. What is its centripetal acceleration in metres per second squared?"
    correct: "2"
    unit: "m/s^2"
    wrong: []
    explanation: "The centripetal acceleration is v squared over r, which is 100 divided by 50, giving 2 m/s^2."
    hints:
      - "Centripetal acceleration depends on the speed squared and the radius."
      - "Divide the square of the speed by the radius."
      - "Compute the speed squared before dividing."
    diagram: "A circle with the car marked on its circumference. A radius line runs from the centre to the car, and a velocity arrow touches the circle at that point, perpendicular to the radius."
    confidence: high
