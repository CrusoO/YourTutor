    stem: "Two perpendicular forces of 3 N and 4 N act at a point. What is the magnitude of their resultant in newtons?"
    correct: "5"
    unit: "N"
    wrong: []
    explanation: "Perpendicular vectors form the two legs of a right triangle, so the resultant is the hypotenuse, with magnitude the square root of 9 plus 16, which is 5 N."
    hints:
      - "Perpendicular vectors form the two legs of a right triangle."
      - "Use the relation between the squares of the legs and the hypotenuse."
      - "Take the square root of the sum of the squares."
