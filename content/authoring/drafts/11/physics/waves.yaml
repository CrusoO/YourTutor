    explanation: "The speed ratio is the square root of 300 / 273, which is about 1.048. That is an increase of roughly 5 percent."
    hints:
      - "Speed in air depends on the square root of the absolute temperature."
      - "Compare absolute temperatures, not the Celsius values."
