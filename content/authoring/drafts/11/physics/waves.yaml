  - topic: beats_and_doppler
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A source emits 500 Hz and moves toward a stationary listener at 20 m/s. Taking the speed of sound as 340 m/s, what frequency in hertz does the listener hear, to the nearest hertz?"
    correct: "531"
    unit: "Hz"
    wrong: []
    explanation: "For an approaching source the observed frequency is f v / (v - v_s) = 500 times 340 / 320 = 531.25 Hz, which rounds to 531 Hz."
    hints:
      - "An approaching source compresses the wavelengths ahead of it."
      - "Use the observed frequency formula with the speed of sound minus the source speed in the denominator."
      - "Multiply the source frequency by the speed of sound, then divide."
    diagram: null
    confidence: high
