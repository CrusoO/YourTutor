  - topic: speed_of_wave
    type: mcq
    difficulty: easy
    role: recall
    stem: "What determines the speed of a mechanical wave in a uniform medium?"
    correct: "the properties of the medium, such as its tension and density"
    unit: ""
    wrong:
      - {text: "the amplitude of the source", mistake: "assumes louder waves travel faster"}
      - {text: "the frequency chosen by the source", mistake: "assumes the frequency sets the speed"}
      - {text: "the wavelength chosen by the source", mistake: "assumes the source selects the speed directly"}
    explanation: "In a given medium the wave speed is fixed by the medium's properties. The source controls the frequency, and the wavelength then follows from the speed."
    hints:
      - "Ask what the medium is like rather than what the source is doing."
      - "The source sets how often the oscillations occur."
      - "Consider which properties of the rope or the air govern how fast a disturbance spreads."
    diagram: null
    confidence: high
  - topic: speed_of_wave
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A string under a tension of 80 N has a mass of 0.02 kg per metre. What is the speed of transverse waves on it in metres per second, to one decimal place?"
    correct: "63.2"
    unit: "m/s"
    wrong: []
    explanation: "The wave speed on a string is the square root of T divided by mu, which is the square root of 80 / 0.02 = 4000, or about 63.2 m/s."
    hints:
      - "Wave speed on a string depends on the tension and the mass per unit length."
      - "Divide the tension by the mass per unit length."
      - "Take the square root last."
    diagram: null
    confidence: high
  - topic: speed_of_wave
    type: mcq
    difficulty: medium
    role: apply
    stem: "A wave travels from air into water. Which quantity stays unchanged across the boundary?"
    correct: "frequency"
    unit: ""
    wrong:
      - {text: "speed", mistake: "assumes the speed is set by the source"}
      - {text: "wavelength", mistake: "assumes the wavelength is fixed when the medium changes"}
      - {text: "all three quantities", mistake: "ignores the change of speed in the new medium"}
    explanation: "Frequency is set by the source and does not change at a boundary. The speed and the wavelength both change, as speed = frequency times wavelength."
    hints:
      - "The source sets how often oscillations occur."
      - "Speed depends on the medium the wave travels through."
      - "Ask which property belongs to the source rather than to the medium."
