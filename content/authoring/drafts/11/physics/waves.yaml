  - topic: speed_of_wave
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A rope is made heavier per metre, but the tension in it is kept the same. What happens to the speed of transverse waves on the rope?"
    correct: "it decreases"
    unit: ""
    wrong:
      - {text: "it increases", mistake: "assumes a heavier rope carries waves faster"}
      - {text: "it stays the same", mistake: "assumes speed does not depend on mass per unit length"}
      - {text: "it doubles", mistake: "assumes speed scales directly with the mass"}
    explanation: "The wave speed is the square root of tension over mass per unit length. Increasing the mass per unit length with the same tension lowers the speed."
    hints:
      - "Speed depends on tension divided by mass per unit length, under a square root."
      - "A larger denominator makes the quotient smaller."
      - "Think about which way the speed moves when the denominator grows."
    diagram: null
    confidence: high
