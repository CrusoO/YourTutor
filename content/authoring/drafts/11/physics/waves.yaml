    confidence: high
  - topic: speed_of_wave
    type: numeric
    difficulty: hard
    role: transfer
    stem: "Transverse waves on a string travel at 40 m/s when the tension is 50 N. What tension in newtons gives a wave speed of 80 m/s on the same string?"
    correct: "200"
    unit: "N"
    wrong: []
    explanation: "The speed is proportional to the square root of the tension, so T is proportional to v squared. The new tension is 50 times (80/40)^2 = 200 N."
    hints:
      - "Wave speed squared is proportional to tension for a fixed string."
      - "Find the ratio of the two speeds and square it."
      - "Multiply the original tension by that squared ratio."
