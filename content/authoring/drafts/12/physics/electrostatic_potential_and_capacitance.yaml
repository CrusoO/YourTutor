  - topic: equipotential_surfaces
    type: mcq
    difficulty: easy
    role: recall
    stem: "Why are equipotential surfaces always perpendicular to electric field lines?"
    correct: "No work is needed to move a charge along an equipotential surface"
    unit: ""
    wrong:
      - {text: "Field lines always bend at right angles to each other", mistake: "assumes field lines have a fixed geometry that forces right angles"}
      - {text: "Potential is highest where field lines start", mistake: "confuses where the potential is largest with where the lines begin"}
      - {text: "Equipotential surfaces carry the electric field", mistake: "thinks surfaces of constant potential are where the field is stored"}
    explanation: "Moving a charge along an equipotential needs no work, so the field has no component along the surface. Field lines therefore meet equipotentials at right angles."
    hints:
      - "Consider the work done when a charge moves along a surface of constant potential."
      - "Think about whether the field has any component along that surface."
      - "Relate the field direction to the direction in which the potential changes most."
    diagram: null
    confidence: high
  - topic: equipotential_surfaces
    type: mcq
