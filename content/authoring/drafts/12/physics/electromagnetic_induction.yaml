  - topic: ac_generator_eddy
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why is the core of a transformer built from thin laminated sheets instead of a solid block?"
    correct: "To reduce eddy current losses"
    unit: ""
    wrong:
      - {text: "To increase eddy currents that heat the core", mistake: "confuses transformers with induction heating devices"}
      - {text: "To make the core heavier and more stable", mistake: "assumes the core's mass is the design goal"}
      - {text: "To store magnetic energy between each cycle", mistake: "assumes the core stores energy in the way a capacitor does"}
    explanation: "Thin insulated laminations limit the size of the induced current loops, so the energy wasted as heat in the core is much smaller than in a solid block."
    hints:
      - "Think about the currents induced in a solid core by a changing flux."
      - "Consider how thin sheets limit the size of those induced loops."
      - "Recall what those induced currents do to the energy supplied to the transformer."
    diagram: null
    confidence: high
