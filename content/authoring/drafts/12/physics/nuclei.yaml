  - topic: radioactivity
    type: mcq
    difficulty: easy
    role: recall
    stem: "By how much does the mass number of a nucleus change in alpha decay?"
    correct: "It decreases by four"
    unit: ""
    wrong:
      - {text: "It decreases by two", mistake: "counts the alpha particle as two nucleons instead of four"}
      - {text: "It stays the same", mistake: "assumes alpha decay does not change the number of nucleons"}
      - {text: "It increases by four", mistake: "reverses the direction of the change"}
    explanation: "An alpha particle is a helium nucleus with four nucleons, so emitting one lowers the mass number of the parent by four."
    hints:
      - "Think about how many nucleons an alpha particle carries."
      - "Consider how the mass number of the remaining nucleus compares with the parent."
      - "Recall the composition of an alpha particle."
    diagram: null
    confidence: high
  - topic: radioactivity
    type: mcq
    difficulty: easy
    role: recall
    stem: "In beta minus decay, a neutron inside the nucleus is converted into what?"
    correct: "A proton, an electron and an antineutrino"
    unit: ""
    wrong:
      - {text: "A proton only", mistake: "forgets the particles that are emitted in the process"}
      - {text: "An alpha particle", mistake: "confuses beta decay with alpha decay"}
      - {text: "A positron and a neutrino", mistake: "confuses beta minus decay with beta plus decay"}
    explanation: "In beta minus decay a neutron becomes a proton, emitting an electron and an antineutrino to conserve charge, energy and lepton number."
    hints:
      - "Think about the charge that must be conserved when the nucleon changes."
      - "Consider which particles must be emitted to balance charge and lepton number."
      - "Compare beta minus decay with beta plus decay."
    diagram: null
    confidence: high
  - topic: radioactivity
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A radioactive sample has a half-life of 10 days. What fraction of the original nuclei remains after 30 days?"
    correct: "0.125"
    unit: ""
    wrong: []
    explanation: "Thirty days is three half-lives. Each half-life halves the number of nuclei, so the fraction remaining is one half cubed, which is 0.125."
    hints:
      - "Count how many half-lives fit into 30 days."
      - "Each half-life halves the number of nuclei remaining."
      - "Multiply one half by itself once for each half-life."
    diagram: "A decay curve of the number of nuclei against time, with markers at 10, 20 and 30 days showing the number halving at each marker."
    confidence: high
  - topic: radioactivity
    type: numeric
    difficulty: medium
    role: explain
    stem: "A nuclide has a half-life of 6.93 hours. What is its decay constant in per hour? Use ln 2 equal to 0.693."
    correct: "0.1"
    unit: "per hour"
    wrong: []
    explanation: "The decay constant equals ln 2 divided by the half-life. Dividing 0.693 by 6.93 hours gives 0.1 per hour."
    hints:
      - "The decay constant equals ln 2 divided by the half-life."
      - "Use the given value of ln 2."
      - "Divide that value by the half-life."
    diagram: null
    confidence: high
  - topic: radioactivity
    type: mcq
    difficulty: hard
    role: explain
    stem: "Which quantity is measured in becquerel?"
    correct: "The activity, the number of decays per second"
    unit: ""
    wrong:
      - {text: "The half-life of the nuclide", mistake: "confuses a unit of rate with a unit of time"}
      - {text: "The energy of each emitted particle", mistake: "confuses activity with the energy of the radiation"}
      - {text: "The absorbed dose in the body", mistake: "confuses activity with absorbed dose, which uses a different unit"}
    explanation: "One becquerel is one decay per second. Activity is the rate of decay of a sample, and it falls as the number of undecayed nuclei falls."
    hints:
      - "Think about the rate at which the sample emits radiation."
      - "Consider which quantity is expressed per second."
      - "Compare the rate of decay with the energy or dose delivered by the radiation."
    diagram: null
    confidence: high
  - topic: radioactivity
    type: numeric
    difficulty: hard
    role: transfer
    stem: "The activity of a sample falls from 800 Bq to 100 Bq. How many half-lives have elapsed?"
    correct: "3"
    unit: ""
    wrong: []
    explanation: "Activity follows the same halving rule as the number of nuclei. Going from 800 to 400, then 200, then 100 takes three halvings."
    hints:
      - "Activity follows the same halving rule as the number of nuclei."
      - "Find how many times 800 must be halved to reach 100."
      - "Count the halvings step by step."
    diagram: "A decay curve with activity on the vertical axis, points marked at 800 Bq and 100 Bq, and the halving steps between them shown."
    confidence: high
  - topic: nuclear_fission_fusion
    type: mcq
    difficulty: easy
    role: recall
    stem: "In nuclear fission, where does the released energy come from?"
    correct: "The increase in binding energy per nucleon as the nucleus splits into lighter nuclei"
    unit: ""
    wrong:
      - {text: "Mass is created from nothing during the split", mistake: "assumes energy can appear without a corresponding change in binding"}
      - {text: "Electrons are emitted with very high energy", mistake: "confuses fission energy with beta emission"}
      - {text: "The nucleus is compressed into a smaller electron cloud", mistake: "confuses nuclear fission with changes in the electron cloud"}
    explanation: "The fragments are more tightly bound per nucleon than the original heavy nucleus, and the difference in binding energy is released as kinetic energy of the fragments and radiation."
    hints:
      - "Think about how tightly bound the nucleons are after the split compared with before."
      - "Consider where the energy released in fission ends up."
      - "Recall what binding energy per nucleon means for a nucleus."
    diagram: null
    confidence: high
  - topic: nuclear_fission_fusion
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which nuclear process provides the energy that powers the Sun?"
    correct: "Fusion of light nuclei such as hydrogen into helium"
    unit: ""
    wrong:
      - {text: "Fission of heavy uranium nuclei", mistake: "confuses the Sun with a fission reactor"}
      - {text: "Chemical combustion of hydrogen gas", mistake: "assumes the Sun burns fuel in a chemical reaction"}
      - {text: "Radioactive decay of carbon nuclei", mistake: "assumes the Sun's energy comes from decay of a common element"}
    explanation: "In the core of the Sun, hydrogen nuclei fuse into helium, converting a small amount of mass into a large amount of energy."
    hints:
      - "Think about which light nuclei fuse inside the core of a star."
      - "Consider whether the Sun's energy comes from splitting or joining nuclei."
      - "Compare the amount of energy released by chemistry with that from nuclear reactions."
    diagram: null
    confidence: high
  - topic: nuclear_fission_fusion
    type: mcq
    difficulty: medium
    role: explain
    stem: "What makes a self-sustaining chain reaction possible in nuclear fission?"
    correct: "Each fission releases neutrons that can cause further fissions"
    unit: ""
    wrong:
      - {text: "Each fission releases only alpha particles", mistake: "assumes alpha particles are the agents that split nuclei"}
      - {text: "Each fission produces electrons that trigger new fissions", mistake: "assumes electrons drive the splitting of nuclei"}
      - {text: "Each fission releases photons that split other nuclei", mistake: "assumes photons are the particles that cause fission"}
    explanation: "Fission releases several neutrons, and some of these can strike other heavy nuclei and cause them to fission, which sustains the reaction."
    hints:
      - "Think about which particles can strike and split another heavy nucleus."
      - "Consider what the products of one fission event can do to other nuclei."
      - "Recall the particle that has no charge and can penetrate nuclei easily."
    diagram: null
    confidence: high
  - topic: nuclear_fission_fusion
    type: numeric
    difficulty: medium
    role: procedure
    stem: "Each fission releases 200 MeV. A reactor undergoes 5 x 10^6 fissions per second. What is its power in MeV per second?"
    correct: "1000000000"
    unit: "MeV/s"
    wrong: []
    explanation: "The power is the energy per fission times the number of fissions per second. That is 200 times 5 x 10^6, which equals 1 x 10^9 MeV/s."
    hints:
      - "The power is the energy per fission multiplied by the number of fissions per second."
      - "Multiply 200 by 5 and then by 10 to the sixth."
      - "Keep the unit as MeV per second."
    diagram: null
    confidence: high
  - topic: nuclear_fission_fusion
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why do fusion reactions need a very high temperature to occur?"
    correct: "To overcome the electrostatic repulsion between positively charged nuclei"
    unit: ""
    wrong:
      - {text: "To break the nuclei apart before they can fuse", mistake: "reverses the purpose of the heating"}
      - {text: "To increase the mass of the nuclei before they fuse", mistake: "assumes fusion requires nuclei to gain mass first"}
      - {text: "To make the nuclei decay faster into lighter particles", mistake: "confuses fusion with radioactive decay"}
    explanation: "Nuclei carry positive charge and repel each other. Very high kinetic energies are needed for them to approach close enough for the short range strong force to bind them."
    hints:
      - "Think about what force acts between two positively charged nuclei as they approach."
      - "Consider how the kinetic energy of the nuclei relates to temperature."
      - "Recall the range over which the strong nuclear force acts."
    diagram: null
    confidence: high
