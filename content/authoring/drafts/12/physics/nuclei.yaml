items:
  - topic: nuclear_size_density
    type: mcq
    difficulty: easy
    role: recall
    stem: "How does the radius of a nucleus depend on its mass number A?"
    correct: "The radius is proportional to A to the power one third"
    unit: ""
    wrong:
      - {text: "The radius is proportional to A", mistake: "assumes radius grows linearly with the number of nucleons"}
      - {text: "The radius is proportional to A squared", mistake: "assumes the radius grows with the square of the nucleon number"}
      - {text: "The radius is the same for all nuclei", mistake: "assumes all nuclei have the same size"}
    explanation: "Nuclear density is roughly constant, so the volume is proportional to A. Since volume scales as R cubed, the radius is proportional to A to the one third."
    hints:
      - "Think about how the volume of a nucleus depends on the number of nucleons when density is roughly constant."
      - "Recall the relation between a sphere's volume and its radius."
      - "Work backwards from volume to radius."
    diagram: null
    confidence: high
  - topic: nuclear_size_density
    type: numeric
    difficulty: easy
    role: apply
    stem: "Using R equal to 1.2 times A to the power one third fm, what is the radius of a nucleus with mass number 27, in fm?"
    correct: "3.6"
    unit: "fm"
    wrong: []
    explanation: "The cube root of 27 is 3, so the radius is 1.2 times 3, which equals 3.6 fm."
    hints:
      - "Use R equal to R0 times A to the one third, with R0 equal to 1.2 fm."
      - "Find the cube root of the mass number first."
      - "Multiply the cube root by 1.2 fm."
    diagram: null
    confidence: high
  - topic: nuclear_size_density
    type: numeric
    difficulty: medium
    role: procedure
    stem: "What is the ratio of the radius of a nucleus with mass number 64 to the radius of a nucleus with mass number 8?"
    correct: "2"
    unit: ""
    wrong: []
    explanation: "The radius is proportional to the cube root of the mass number. The cube root of 64 is 4 and the cube root of 8 is 2, so the ratio is 2."
    hints:
      - "Use the cube root relation for the nuclear radius."
      - "Compare the cube roots of the two mass numbers."
      - "Take the ratio of the two cube roots."
    diagram: null
    confidence: high
  - topic: nuclear_size_density
    type: numeric
    difficulty: medium
    role: explain
    stem: "Assuming constant nuclear density, how many times greater is the volume of a nucleus with mass number 216 than that of a nucleus with mass number 8?"
    correct: "27"
    unit: ""
    wrong: []
    explanation: "With constant density the volume is proportional to the mass number. The ratio 216 divided by 8 is 27."
    hints:
      - "Volume is proportional to the mass number when density is constant."
      - "Divide the larger mass number by the smaller one."
      - "Check the answer against the cube of the ratio of the radii."
    diagram: null
    confidence: high
  - topic: nuclear_size_density
    type: mcq
    difficulty: hard
    role: explain
    stem: "Experiments show that nuclear density is nearly the same for all nuclei. Why is this so?"
    correct: "Nuclear forces are short ranged and saturate, so each nucleon interacts only with its neighbours"
    unit: ""
    wrong:
      - {text: "Protons and neutrons have identical masses", mistake: "assumes equal nucleon masses explain the density alone"}
      - {text: "Electrons confine the nucleus to a fixed size", mistake: "assumes the orbital electrons set the size of the nucleus"}
      - {text: "Heavier nuclei are more tightly packed in space", mistake: "reverses the observed trend of nuclear density"}
    explanation: "The strong force saturates, so each nucleon only binds to a fixed number of close neighbours. The volume therefore grows in proportion to the number of nucleons."
    hints:
      - "Think about how many nucleons a given nucleon can interact with."
      - "Consider whether the volume grows in proportion to the number of nucleons."
      - "Recall the range of the strong nuclear force."
    diagram: null
    confidence: high
  - topic: nuclear_size_density
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A nucleus has a radius of 6 fm. Using R equal to 1.2 times A to the power one third fm, what is its mass number?"
    correct: "125"
    unit: ""
    wrong: []
    explanation: "Dividing 6 by 1.2 gives 5, which is the cube root of A. Cubing 5 gives A equal to 125."
    hints:
      - "Divide the radius by R0 first to get the cube root of A."
      - "Cube the result to remove the one third power."
      - "The mass number is a whole number, so check that your result is close to one."
    diagram: null
    confidence: high
  - topic: mass_defect_binding_energy
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the binding energy of a nucleus?"
    correct: "The energy equivalent of its mass defect"
    unit: ""
    wrong:
      - {text: "The energy needed to remove an electron from the atom", mistake: "confuses nuclear binding energy with atomic ionisation energy"}
      - {text: "The kinetic energy of the nucleons inside it", mistake: "confuses binding energy with the motion of the nucleons"}
      - {text: "The mass of the nucleus expressed in energy units", mistake: "treats the total mass rather than the mass defect as the energy"}
    explanation: "The mass of a bound nucleus is less than the sum of its nucleons. The lost mass, the mass defect, is the energy that was released when the nucleus formed, given by E equal to mc squared."
    hints:
      - "Compare the mass of the nucleus with the sum of the masses of its free nucleons."
      - "Think about what happens to the missing mass when the nucleus forms."
      - "Recall the link between mass and energy."
    diagram: null
    confidence: high
  - topic: mass_defect_binding_energy
    type: numeric
    difficulty: easy
    role: apply
    stem: "A nucleus has a mass defect of 0.1 u. Using 1 u equal to 931 MeV, what is its binding energy in MeV?"
    correct: "93.1"
    unit: "MeV"
    wrong: []
    explanation: "The binding energy is the mass defect times 931 MeV per u. That is 0.1 times 931, which is 93.1 MeV."
    hints:
      - "Binding energy is the mass defect multiplied by 931 MeV per u."
      - "Multiply 0.1 by 931."
      - "Keep the answer in MeV."
    diagram: null
    confidence: high
  - topic: mass_defect_binding_energy
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A nucleus of mass number 56 has a total binding energy of 504 MeV. What is its binding energy per nucleon in MeV?"
    correct: "9"
    unit: "MeV"
    wrong: []
    explanation: "Binding energy per nucleon is the total binding energy divided by the mass number. That is 504 divided by 56, which is 9 MeV."
    hints:
      - "Binding energy per nucleon is the total binding energy divided by the mass number."
      - "Divide 504 by 56."
      - "Keep the unit as MeV."
    diagram: "A curve of binding energy per nucleon plotted against mass number, with a peak near mass number 56 marked and the axes labelled."
    confidence: high
  - topic: mass_defect_binding_energy
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does nuclear fission of a heavy nucleus release energy?"
    correct: "The fission products have higher binding energy per nucleon than the original heavy nucleus"
    unit: ""
    wrong:
      - {text: "The fission products have lower binding energy per nucleon than the original nucleus", mistake: "reverses the trend of binding energy per nucleon for heavy nuclei"}
      - {text: "Mass is created from nothing during the split", mistake: "assumes energy comes from creating mass rather than from the binding energy change"}
      - {text: "Electrons are converted into energy as the nucleus splits", mistake: "confuses fission with electron emission"}
    explanation: "Heavy nuclei sit on the falling side of the binding energy curve. Splitting them into medium mass nuclei moves nucleons to a more tightly bound state, releasing the difference as energy."
    hints:
      - "Think about how binding energy per nucleon changes for heavy nuclei."
      - "Consider where the peak of the binding energy curve lies."
      - "Ask which side of that peak the heavy nuclei sit on."
    diagram: null
    confidence: high
