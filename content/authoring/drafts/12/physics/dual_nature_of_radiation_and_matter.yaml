items:
  - topic: photoelectric_effect
    type: mcq
    difficulty: easy
    role: recall
    stem: "In the photoelectric effect, what does increasing the intensity of light of a fixed frequency above threshold increase?"
    correct: "The number of photoelectrons emitted per second"
    unit: ""
    wrong:
      - {text: "The maximum kinetic energy of each photoelectron", mistake: "assumes intensity raises the energy of each individual electron"}
      - {text: "The threshold frequency of the metal", mistake: "assumes intensity shifts the threshold, which is a property of the metal"}
      - {text: "The stopping potential", mistake: "assumes the stopping potential depends on intensity instead of frequency"}
    explanation: "Intensity counts photons per second. Each photon ejects at most one electron, so more intensity means more photoelectrons per second, while the energy of each electron depends only on frequency."
    hints:
      - "Think about what intensity measures in terms of photons."
      - "Consider whether one photon can give more than one electron energy."
      - "Recall which property of the light sets the energy of each photon."
    diagram: null
    confidence: high
  - topic: photoelectric_effect
    type: numeric
    difficulty: easy
    role: apply
    stem: "What is the energy in electronvolt of a photon of wavelength 620 nm? Use hc equal to 1240 eV nm."
    correct: "2"
    unit: "eV"
    wrong: []
    explanation: "The photon energy is hc over the wavelength. Dividing 1240 eV nm by 620 nm gives 2 eV."
    hints:
      - "Use the photon energy equal to hc divided by the wavelength."
      - "Divide the constant 1240 by the wavelength in nanometre."
      - "Check that the unit of your answer is electronvolt."
    diagram: null
    confidence: high
  - topic: photoelectric_effect
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A metal has work function 2.0 eV. Light whose photons each carry 3.5 eV falls on it. What is the maximum kinetic energy of the emitted electrons in electronvolt?"
    correct: "1.5"
    unit: "eV"
    wrong: []
    explanation: "Einstein's equation gives the maximum kinetic energy as the photon energy minus the work function. That is 3.5 eV minus 2.0 eV, which equals 1.5 eV."
    hints:
      - "Use Einstein's photoelectric equation for the maximum kinetic energy."
      - "Subtract the work function from the photon energy."
      - "Keep the answer in electronvolt."
    diagram: "An energy level sketch with a photon arrow striking a metal surface, a horizontal line marking the work function, and the leftover energy shown as the kinetic energy of the emitted electron."
    confidence: high
  - topic: photoelectric_effect
    type: numeric
    difficulty: medium
    role: explain
    stem: "Light of wavelength 310 nm falls on a metal of work function 2 eV. What is the stopping potential in volt? Use hc equal to 1240 eV nm."
    correct: "2"
    unit: "V"
    wrong: []
    explanation: "The photon energy is 1240 divided by 310, which is 4 eV. The maximum kinetic energy is 4 minus 2, which is 2 eV, and the stopping potential in volt has the same numerical value."
    hints:
      - "First find the photon energy from the wavelength."
      - "Subtract the work function from the photon energy to get the maximum kinetic energy."
      - "The stopping potential in volt is numerically equal to the maximum kinetic energy in electronvolt."
    diagram: null
    confidence: high
  - topic: photoelectric_effect
    type: mcq
    difficulty: hard
    role: apply
    stem: "The threshold wavelength of a metal is 620 nm. What is the work function of the metal? Use hc equal to 1240 eV nm."
    correct: "2 eV"
    unit: ""
    wrong:
      - {text: "1 eV", mistake: "halves the photon energy when finding the work function"}
      - {text: "4 eV", mistake: "doubles the photon energy when finding the work function"}
      - {text: "620 eV", mistake: "uses the wavelength as if it were an energy"}
    explanation: "At threshold the photon energy equals the work function. Dividing 1240 eV nm by 620 nm gives 2 eV."
    hints:
      - "At threshold the photon energy is exactly equal to the work function."
      - "Convert the threshold wavelength into a photon energy using hc."
      - "Repeat the wavelength to energy step you used in the earlier steps."
    diagram: null
    confidence: high
  - topic: photoelectric_effect
    type: numeric
    difficulty: hard
    role: transfer
    stem: "Light of wavelength 400 nm gives a stopping potential of 1.2 V on a metal surface. What is the work function of the metal in electronvolt? Use hc equal to 1240 eV nm."
    correct: "1.9"
    unit: "eV"
    wrong: []
    explanation: "The photon energy is 1240 divided by 400, which is 3.1 eV. The maximum kinetic energy is 1.2 eV, so the work function is 3.1 minus 1.2, which is 1.9 eV."
    hints:
      - "The photon energy comes from hc divided by the wavelength."
      - "The stopping potential gives the maximum kinetic energy in electronvolt."
      - "Subtract the maximum kinetic energy from the photon energy to get the work function."
    diagram: "A graph of stopping potential against frequency showing a straight line, with its intercept on the frequency axis labelled as the threshold frequency and its slope labelled with the constant h over e."
    confidence: high
  - topic: de_broglie_wavelength
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which expression gives the de Broglie wavelength of a particle with momentum p?"
    correct: "h divided by p"
    unit: ""
    wrong:
      - {text: "h multiplied by p", mistake: "multiplies instead of dividing by the momentum"}
      - {text: "p divided by h", mistake: "inverts the relation between wavelength and momentum"}
      - {text: "h divided by the mass", mistake: "uses the mass instead of the momentum"}
    explanation: "The de Broglie wavelength is Planck's constant divided by the momentum of the particle, lambda equal to h over p."
    hints:
      - "Think about how the wavelength changes when the momentum gets larger."
      - "Consider which quantity should appear in the denominator."
      - "Recall the constant that links wavelength and momentum for any particle."
    diagram: null
    confidence: high
  - topic: de_broglie_wavelength
    type: numeric
    difficulty: easy
    role: apply
    stem: "A particle has momentum 3 x 10^-23 kg m/s. Taking h equal to 6 x 10^-34 J s, what is its de Broglie wavelength in picometre?"
    correct: "20"
    unit: "pm"
    wrong: []
    explanation: "The wavelength is h over p, which is 6 x 10^-34 divided by 3 x 10^-23, equal to 2 x 10^-11 m. That is 20 pm."
    hints:
      - "Use the de Broglie formula with the momentum in the denominator."
      - "Divide the constant by the momentum, keeping the powers of ten exact."
      - "Convert the answer from metre to picometre at the end."
    diagram: null
    confidence: high
  - topic: de_broglie_wavelength
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A proton and an alpha particle move at the same speed. The alpha particle has four times the mass of the proton. What is the ratio of the alpha particle's de Broglie wavelength to the proton's?"
    correct: "0.25"
    unit: ""
    wrong: []
    explanation: "At equal speeds the momentum is proportional to mass, so the wavelength is inversely proportional to mass. The ratio is 1 divided by 4, which is 0.25."
    hints:
      - "At equal speeds the momentum is proportional to the mass."
      - "The wavelength is inversely proportional to the momentum."
      - "Take the reciprocal of the mass ratio."
    diagram: null
    confidence: high
  - topic: de_broglie_wavelength
    type: numeric
    difficulty: medium
    role: explain
    stem: "A particle of mass 1 x 10^-27 kg moves at 2 x 10^3 m/s. Taking h equal to 6 x 10^-34 J s, what is its de Broglie wavelength in nanometre?"
    correct: "0.3"
    unit: "nm"
    wrong: []
    explanation: "The momentum is 1 x 10^-27 times 2 x 10^3, which is 2 x 10^-24 kg m/s. The wavelength is 6 x 10^-34 divided by 2 x 10^-24, which is 3 x 10^-10 m, or 0.3 nm."
    hints:
      - "Find the momentum from the mass and the speed first."
      - "Divide the constant h by the momentum."
      - "Convert the result from metre to nanometre at the end."
    diagram: null
    confidence: high
  - topic: de_broglie_wavelength
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why are electron beams used in electron microscopes instead of visible light to see very fine structures?"
    correct: "Electron wavelengths are much shorter, which allows finer resolution"
    unit: ""
    wrong:
      - {text: "Electrons are heavier and penetrate samples more easily", mistake: "confuses the mass of the electron with its wavelength"}
      - {text: "Electrons travel faster than light in any medium", mistake: "assumes electrons outrun light, which is not the reason for resolution"}
      - {text: "Electrons reflect from surfaces more strongly than light", mistake: "ignores wavelength as the factor that limits resolution"}
    explanation: "Resolution is limited by wavelength, and electrons at typical energies have wavelengths far shorter than visible light, so they reveal much finer detail."
    hints:
      - "Think about what limits the smallest detail that a microscope can resolve."
      - "Consider the de Broglie wavelength of electrons at moderate energies."
      - "Compare the scale of visible light wavelengths with the size of atoms."
    diagram: null
    confidence: high
  - topic: de_broglie_wavelength
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A particle of mass 4 x 10^-30 kg has a de Broglie wavelength of 3 x 10^-10 m. Taking h equal to 6 x 10^-34 J s, what is its speed in m/s?"
    correct: "500000"
    unit: "m/s"
    wrong: []
    explanation: "The speed is h divided by m times lambda. That is 6 x 10^-34 divided by 1.2 x 10^-39, which equals 5 x 10^5 m/s."
    hints:
      - "Rearrange the de Broglie relation to find the speed."
      - "Multiply the mass by the wavelength before dividing the constant by that product."
      - "Keep the powers of ten exact in the division."
    diagram: null
    confidence: high
