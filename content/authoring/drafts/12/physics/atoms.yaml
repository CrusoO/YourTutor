items:
  - topic: rutherford_model_12
    type: mcq
    difficulty: easy
    role: recall
    stem: "What did Rutherford's alpha particle scattering experiment establish about the atom?"
    correct: "Most of the mass and positive charge are concentrated in a tiny central nucleus"
    unit: ""
    wrong:
      - {text: "The atom is a uniform sphere of positive charge with electrons embedded in it", mistake: "keeps the uniform positive sphere picture that the scattering results ruled out"}
      - {text: "Electrons move in fixed orbits with specific energies", mistake: "confuses the nuclear model with the later quantised orbit idea"}
      - {text: "Most alpha particles are absorbed by the atoms they hit", mistake: "assumes the foil stops most of the incident particles"}
    explanation: "Most alpha particles passed straight through the foil while a few were deflected by large angles. This showed that the positive charge sits in a very small nucleus."
    hints:
      - "Think about how most alpha particles behaved when they hit the foil."
      - "Consider what a few large deflections would require of the charge distribution."
      - "Compare the uniform sphere picture with the observed number of large deflections."
    diagram: null
    confidence: high
  - topic: rutherford_model_12
    type: mcq
    difficulty: easy
    role: explain
    stem: "In alpha scattering, why do only a very small fraction of alpha particles get deflected through large angles?"
    correct: "The positive charge is concentrated in a very small nucleus"
    unit: ""
    wrong:
      - {text: "Alpha particles are too heavy to be deflected easily", mistake: "assumes mass alone prevents large deflections"}
      - {text: "The gold foil is so thin that it absorbs the alpha particles", mistake: "confuses the thickness of the foil with absorption"}
      - {text: "Electrons repel the alpha particles away from the atom", mistake: "assumes the light electrons cause the large deflections"}
    explanation: "A large deflection needs a close encounter with a concentrated positive charge. Because the nucleus is tiny, only a few alpha particles come close enough."
    hints:
      - "Think about how close an alpha particle must come to a charge to be strongly deflected."
      - "Consider the size of the region that holds the positive charge."
      - "Compare the chance of a close encounter with the size of the target."
    diagram: "A thin gold foil with alpha particle paths drawn through it: most paths pass straight through, while one path is drawn deflected at a large angle near a small central nucleus."
    confidence: high
  - topic: rutherford_model_12
    type: numeric
    difficulty: medium
    role: procedure
    stem: "The diameter of an atom is about 10^-10 m, and its nucleus has a diameter of about 10^-14 m. How many times larger is the atom's diameter than the nucleus's?"
    correct: "10000"
    unit: ""
    wrong: []
    explanation: "Dividing 10^-10 by 10^-14 gives 10^4, so the atom is about 10000 times wider than its nucleus."
    hints:
      - "Divide the atom's diameter by the nuclear diameter."
      - "Subtract the powers of ten to get the power of ten in the ratio."
      - "Write the final ratio as a plain number."
    diagram: null
    confidence: high
  - topic: rutherford_model_12
    type: numeric
    difficulty: medium
    role: explain
    stem: "An alpha particle approaches a nucleus head-on. If its initial kinetic energy is doubled, by what factor does its distance of closest approach change?"
    correct: "0.5"
    unit: ""
    wrong: []
    explanation: "At closest approach the kinetic energy is converted to electric potential energy, which varies as one over the distance. Doubling the energy halves the distance of closest approach."
    hints:
      - "At closest approach the kinetic energy has been converted into electric potential energy."
      - "Think about whether the distance goes up or down as the energy goes up."
      - "Compare the new closest approach with the old one as a ratio."
    diagram: "A nucleus at the centre with an alpha particle path approaching head-on, and the distance of closest approach marked on the path."
    confidence: high
  - topic: rutherford_model_12
    type: mcq
    difficulty: hard
    role: explain
    stem: "Classical physics predicted that the nuclear model of the atom would be unstable. What was the main problem?"
    correct: "An orbiting electron should radiate energy and spiral into the nucleus"
    unit: ""
    wrong:
      - {text: "The nucleus could not be located at the centre of the atom", mistake: "assumes the nuclear model had no evidence for a central nucleus"}
      - {text: "Alpha particles were deflected too little at small angles", mistake: "confuses the large angle issue with the stability issue"}
      - {text: "The scattering of alpha particles could not be measured", mistake: "assumes the experiment itself was not measurable"}
    explanation: "An electron in a circular orbit is accelerating, and classical electromagnetism says it should radiate and lose energy, which would make atoms collapse."
    hints:
      - "Think about what an accelerating electric charge should do according to classical electromagnetism."
      - "Consider what happens to an orbiting electron that keeps losing energy."
      - "Ask whether the nuclear model by itself can explain the stability of atoms."
    diagram: null
    confidence: high
  - topic: rutherford_model_12
    type: numeric
    difficulty: hard
    role: transfer
    stem: "An alpha particle of kinetic energy 5.76 MeV approaches head-on a nucleus of atomic number 2. What is its distance of closest approach in femtometre? Use k = 9 x 10^9 N m^2 C^-2, e = 1.6 x 10^-19 C and 1 MeV = 1.6 x 10^-13 J."
    correct: "1"
    unit: "fm"
    wrong: []
    explanation: "At closest approach the kinetic energy equals k times the product of the two charges over r. The alpha has charge 2e and the nucleus has charge 2e, so r equals 9 x 10^9 times 4 times 2.56 x 10^-38 divided by 9.216 x 10^-13, which is 10^-15 m, or 1 fm."
    hints:
      - "At closest approach all the kinetic energy has become electric potential energy."
      - "Find the charge of the alpha particle and the charge of the nucleus in terms of e."
      - "Convert the energy to joule before you solve for the distance."
    diagram: null
    confidence: medium
  - topic: bohr_model_12
    type: mcq
    difficulty: easy
    role: recall
    stem: "According to Bohr's model, what happens to an electron while it is in a permitted stationary orbit?"
    correct: "It does not radiate energy while it stays in that orbit"
    unit: ""
    wrong:
      - {text: "It radiates energy continuously as it orbits", mistake: "keeps classical radiation for electrons in stationary states"}
      - {text: "It can have any energy value it likes", mistake: "ignores the quantisation of the orbits"}
      - {text: "Its orbit grows as its energy increases", mistake: "reverses the relation between orbit size and energy"}
    explanation: "Bohr postulated that electrons in stationary orbits do not radiate, and that only specific orbits with quantised angular momentum are allowed."
    hints:
      - "Think about the postulates Bohr added to the classical picture."
      - "Consider whether the energy of an electron in an orbit can take any value."
      - "Recall what happens when an electron changes from one orbit to another."
    diagram: null
    confidence: high
  - topic: bohr_model_12
    type: numeric
    difficulty: easy
    role: apply
    stem: "Using E_n equal to minus 13.6 eV divided by n squared, what is the energy in eV of the n equal to 2 level of hydrogen?"
    correct: "-3.4"
    unit: "eV"
    wrong: []
    explanation: "Substituting n equal to 2 gives minus 13.6 divided by 4, which is minus 3.4 eV."
    hints:
      - "Use the level energy formula with n equal to 2."
      - "Square n before dividing into 13.6."
      - "Keep the negative sign in the final answer."
    diagram: null
    confidence: high
  - topic: bohr_model_12
    type: numeric
    difficulty: medium
    role: procedure
    stem: "What energy in eV must a hydrogen atom absorb to move an electron from the n equal to 1 level to the n equal to 2 level?"
    correct: "10.2"
    unit: "eV"
    wrong: []
    explanation: "The level energies are minus 13.6 eV for n equal to 1 and minus 3.4 eV for n equal to 2. The difference is 10.2 eV, so that much energy must be absorbed."
    hints:
      - "Find the energy of each of the two levels using minus 13.6 over n squared."
      - "Subtract the lower level energy from the higher level energy."
      - "Report the energy absorbed as a positive number."
    diagram: "An energy level diagram of hydrogen showing the n equal to 1 and n equal to 2 levels, with an upward arrow between them labelled with the energy absorbed."
    confidence: high
  - topic: bohr_model_12
    type: numeric
    difficulty: medium
    role: explain
    stem: "The first Bohr radius of hydrogen is 0.53 angstrom. What is the radius in angstrom of the n equal to 2 orbit?"
    correct: "2.12"
    unit: "angstrom"
    wrong: []
    explanation: "The orbit radius scales as n squared, so the n equal to 2 orbit has radius 4 times 0.53 angstrom, which is 2.12 angstrom."
    hints:
      - "The orbit radius scales as the square of the principal quantum number."
      - "Multiply the first Bohr radius by the square of n."
      - "Keep the answer in angstrom."
    diagram: "Concentric circles around a central nucleus representing the n equal to 1 and n equal to 2 orbits, with each radius labelled."
    confidence: high
  - topic: bohr_model_12
    type: mcq
    difficulty: hard
    role: transfer
    stem: "In hydrogen, a photon is emitted when an electron falls from the n equal to 3 level to the n equal to 1 level. Which statement about its energy is correct? Use E_n equal to minus 13.6 eV divided by n squared."
    correct: "The photon energy is the difference of the two level energies, about 12.1 eV"
    unit: ""
    wrong:
      - {text: "The photon energy equals the ionisation energy of 13.6 eV", mistake: "uses the ionisation energy instead of the energy difference of this transition"}
      - {text: "The photon energy equals the magnitude of the n equal to 3 level, about 1.5 eV", mistake: "uses only the energy of the starting level"}
      - {text: "The photon energy is negative because the electron loses energy", mistake: "treats the energy of the emitted photon as negative"}
    explanation: "The photon energy equals E3 minus E1, which is minus 1.51 minus minus 13.6, giving about 12.1 eV."
    hints:
      - "The photon energy equals the energy of the starting level minus the energy of the final level."
      - "Find the two level energies using minus 13.6 over n squared."
      - "Use the difference between the levels, not the energy of either level alone."
    diagram: null
    confidence: high
  - topic: bohr_model_12
    type: numeric
    difficulty: hard
    role: transfer
    stem: "In a hydrogen atom, what is the ratio of the electron's potential energy to its total energy, in any stationary orbit?"
    correct: "2"
    unit: ""
    wrong: []
    explanation: "In a Bohr orbit the potential energy is twice the total energy, with both negative, so the ratio of potential energy to total energy is 2."
    hints:
      - "Write the potential energy and the total energy of a Bohr orbit, each in terms of n."
      - "Consider the sign convention for energies of an electron bound to the nucleus."
      - "Take the ratio of the potential energy to the total energy, keeping the signs."
    diagram: "A hydrogen energy level diagram with the n equal to 1, 2 and 3 levels drawn and an arrow marking the transition from n equal to 3 to n equal to 1."
    confidence: high
  - topic: hydrogen_spectrum_series
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which series of spectral lines of hydrogen lies in the visible region?"
    correct: "Balmer series"
    unit: ""
    wrong:
      - {text: "Lyman series", mistake: "confuses the ultraviolet series with the visible one"}
      - {text: "Paschen series", mistake: "assumes the infrared series is visible"}
      - {text: "Brackett series", mistake: "confuses the far infrared series with the visible one"}
    explanation: "The Balmer series ends on the n equal to 2 level and includes the visible red, blue-green and violet lines of hydrogen."
    hints:
      - "Think about which series ends on the second energy level."
      - "Consider which series is named after a visible-region set of lines."
      - "Recall which series is the ultraviolet one."
    diagram: null
    confidence: high
  - topic: hydrogen_spectrum_series
    type: numeric
    difficulty: easy
    role: apply
    stem: "A photon has energy 10 eV. Using hc equal to 1240 eV nm, what is its wavelength in nanometre?"
    correct: "124"
    unit: "nm"
    wrong: []
    explanation: "The wavelength is hc divided by the photon energy, which is 1240 divided by 10, giving 124 nm."
    hints:
      - "Use wavelength equal to hc divided by the photon energy."
      - "Divide the constant 1240 by the energy in eV."
      - "Check that the unit is nanometre."
    diagram: null
    confidence: high
  - topic: hydrogen_spectrum_series
    type: numeric
    difficulty: medium
    role: procedure
    stem: "An electron in a hydrogen atom drops from the n equal to 4 level to the n equal to 1 level in one step. What is the energy of the emitted photon in eV?"
    correct: "12.75"
    unit: "eV"
    wrong: []
    explanation: "The photon energy is 13.6 times one minus one over 16, which equals 13.6 times 15 over 16, giving 12.75 eV."
    hints:
      - "Use E equal to 13.6 eV times one over n1 squared minus one over n2 squared, with the lower level as n1."
      - "Put the lower final level as n1 equal to 1."
      - "Evaluate the bracketed difference first."
    diagram: null
    confidence: high
  - topic: hydrogen_spectrum_series
    type: mcq
    difficulty: medium
    role: explain
    stem: "Which level is the final level for all lines of the Lyman series in hydrogen?"
    correct: "n equal to 1"
    unit: ""
    wrong:
      - {text: "n equal to 2", mistake: "confuses the Lyman series with the Balmer series"}
      - {text: "n equal to 3", mistake: "assumes the Lyman series ends on the Paschen level"}
      - {text: "n equal to 4", mistake: "assumes the series ends on a higher level than the ground state"}
    explanation: "Lyman lines are transitions that end on the ground state, n equal to 1. They lie in the ultraviolet region."
    hints:
      - "Think about the ultraviolet series of hydrogen lines."
      - "Consider which level is the lowest energy level of hydrogen."
      - "Recall which series ends on the ground state."
    diagram: null
