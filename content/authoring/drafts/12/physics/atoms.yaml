  - topic: hydrogen_spectrum_series
    type: numeric
    difficulty: hard
    role: transfer
    stem: "How many distinct spectral lines can a hydrogen atom emit when an electron starting at n equal to 4 falls through all possible transitions down to the ground state?"
    correct: "6"
    unit: ""
    wrong: []
    explanation: "Each pair of the four levels n equal to 1, 2, 3 and 4 gives one transition. Choosing 2 of 4 levels gives 6 distinct lines."
    hints:
      - "Each pair of levels among the four gives one transition."
      - "Count the number of pairs that can be chosen from four levels."
      - "Include transitions that skip over intermediate levels."
    diagram: "An energy level diagram with the levels n equal to 1, 2, 3 and 4 drawn, and arrows drawn between every pair of levels."
    confidence: high
  - topic: hydrogen_spectrum_series
    type: numeric
    difficulty: hard
    role: explain
    stem: "What is the ionisation energy in eV of a hydrogen electron that is initially in the n equal to 2 level?"
    correct: "3.4"
    unit: "eV"
    wrong: []
    explanation: "Ionisation from a level requires energy equal to the magnitude of that level's energy. For n equal to 2 that is 13.6 divided by 4, which is 3.4 eV."
    hints:
      - "Ionisation from a level needs energy equal to the magnitude of that level's energy."
      - "Use minus 13.6 over n squared for the level energy."
      - "Take the magnitude of the energy as your answer."
    diagram: "An energy level diagram of hydrogen with the n equal to 2 level marked and an upward arrow from that level to the zero energy line, labelled as ionisation."
    confidence: high
