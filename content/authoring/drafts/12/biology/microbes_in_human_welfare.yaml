  - topic: "biocontrol_biofertilisers"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A biocontrol agent is found to harm a beneficial insect that is not a pest. What is the best next step before wider use?"
    correct: "Assess the impact on non-target species in trials before wider use"
    unit: ""
    wrong:
      - {text: "Apply it to all fields immediately", mistake: "ignores the effects on non-target species"}
      - {text: "Stop all pest control entirely", mistake: "treats one harmful effect as a reason to drop all control"}
      - {text: "Add a chemical pesticide to boost its effect", mistake: "reverses the goal by adding a broader chemical"}
    explanation: "Non-target effects must be measured in controlled trials before a biocontrol agent is released widely. This protects beneficial species and the wider ecosystem."
    hints:
      - "Think about what a limited field trial can show before wider use."
      - "Consider the effect on species beyond the target pest."
      - "Ask which step gathers evidence before a decision on wider use."
