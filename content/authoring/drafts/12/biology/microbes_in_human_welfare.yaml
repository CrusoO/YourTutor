  - topic: "sewage_and_biogas"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "On a diagram of a biogas plant, which microbes produce the methane in the anaerobic digester?"
    correct: "Methanogenic archaea"
    unit: ""
    wrong:
      - {text: "Aerobic Pseudomonas", mistake: "assumes aerobic bacteria make methane"}
      - {text: "Green algae", mistake: "confuses photosynthetic microbes with methane producers"}
      - {text: "Yeast only", mistake: "assumes yeast is the sole methane producer"}
    explanation: "Methanogenic archaea grow without oxygen and convert acetate and hydrogen into methane. Aerobic bacteria and algae are not the methane producers in the digester."
    hints:
      - "Think about the group of microbes that grows without oxygen."
      - "Consider which microbe group releases methane as a waste product."
      - "Separate aerobic microbes from anaerobic ones."
    diagram: "Draw a biogas plant with a slurry inlet, a digester tank holding anaerobic microbes, a gas outlet at the top and a slurry outlet, labelled."
    confidence: "high"
  - topic: "sewage_and_biogas"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A biogas plant produces little methane. Which change is most likely to improve its output?"
    correct: "Keeping the digester at a suitable temperature for the microbes"
    unit: ""
    wrong:
      - {text: "Exposing the digester to direct sunlight only", mistake: "treats light as the main driver of methane production"}
      - {text: "Adding more oxygen to the digester", mistake: "assumes oxygen speeds methane production"}
      - {text: "Cooling the digester to near freezing", mistake: "assumes cold helps the microbes work faster"}
    explanation: "Methanogens are sensitive to temperature and work best within a suitable range, so keeping the digester warm and stable raises gas output. Oxygen inhibits these anaerobic microbes."
    hints:
      - "Think about the conditions that keep the microbes active."
      - "Consider which factor the microbes need to stay productive."
      - "Ask which conditions would harm anaerobic microbes."
    diagram: null
    confidence: "high"
