  - topic: "biocontrol_biofertilisers"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "How do biofertilisers improve plant nutrition?"
    correct: "They fix atmospheric nitrogen or make phosphate available to roots"
    unit: ""
    wrong:
      - {text: "They release chemical fertilisers into the soil", mistake: "confuses biological inputs with chemical fertilisers"}
      - {text: "They absorb sunlight to feed the roots", mistake: "assigns photosynthesis to soil microbes"}
      - {text: "They kill all other soil microbes", mistake: "reverses the effect of beneficial soil microbes"}
    explanation: "Biofertilisers include nitrogen fixing bacteria and phosphate solubilising microbes or mycorrhizal fungi, which make nutrients accessible to plants. They do not supply chemical fertilisers."
    hints:
      - "Think about nutrients that plants struggle to get from the air or soil."
      - "Consider microbes that live in association with roots."
      - "Focus on how the microbe makes a nutrient usable by the plant."
    diagram: null
    confidence: "high"
