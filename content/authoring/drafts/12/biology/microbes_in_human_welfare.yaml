    explanation: "Bacillus thuringiensis produces a toxin that is harmful to certain insect larvae, including many caterpillars. The other bacteria are nitrogen fixers rather than pest controls."
    hints:
      - "Think about a bacterium that makes a toxin harmful to insect larvae."
      - "Consider a soil bacterium used in sprays against pests."
      - "Separate pest control microbes from nitrogen fixing microbes."
