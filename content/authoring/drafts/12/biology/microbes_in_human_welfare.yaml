    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which pairing correctly matches a biofertiliser with its function?"
    correct: "Rhizobium in root nodules of legumes fixing nitrogen"
    unit: ""
    wrong:
      - {text: "Nostoc in root nodules fixing phosphate", mistake: "swaps the nutrient that the microbe supplies"}
