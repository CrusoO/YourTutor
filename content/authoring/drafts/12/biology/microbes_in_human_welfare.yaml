  - topic: "household_industrial_microbes"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "In industrial production of ethanol from sugar, which process converts the sugar into alcohol?"
    correct: "Anaerobic fermentation by yeast"
    unit: ""
    wrong:
      - {text: "Aerobic respiration by moulds", mistake: "assumes oxygen is needed for alcohol production"}
      - {text: "Photosynthesis by algae", mistake: "treats algae as the converters of sugar to alcohol"}
      - {text: "Nitrogen fixation by bacteria", mistake: "confuses nitrogen fixation with sugar conversion"}
    explanation: "Yeast carries out anaerobic fermentation, converting sugar into ethanol and carbon dioxide. Oxygen is excluded to keep the process fermentative."
    hints:
      - "Think about the process that occurs without oxygen."
      - "Consider which organism converts sugar into ethanol."
      - "Separate fermentation from respiration and photosynthesis."
    diagram: null
    confidence: "high"
