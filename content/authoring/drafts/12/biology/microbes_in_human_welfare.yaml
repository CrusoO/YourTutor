    stem: "A digester produces 40 cubic metres of biogas per day, and 60 percent of that gas is methane. How many cubic metres of methane are produced per day? Give the number only."
    correct: "24"
    unit: "cubic metres"
    wrong: []
    explanation: "Sixty percent of 40 cubic metres is 24 cubic metres of methane."
    hints:
