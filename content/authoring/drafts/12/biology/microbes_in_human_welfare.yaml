    stem: "Which bacterium is used as a biocontrol agent against caterpillar pests?"
    correct: "Bacillus thuringiensis"
    unit: ""
    wrong:
      - {text: "Rhizobium", mistake: "confuses a nitrogen fixer with a pest control agent"}
      - {text: "Azotobacter", mistake: "assigns a free living nitrogen fixer to pest control"}
