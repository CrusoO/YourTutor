  - topic: "household_industrial_microbes"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which microbe makes bread dough rise by producing carbon dioxide?"
    correct: "Saccharomyces cerevisiae"
    unit: ""
    wrong:
      - {text: "Lactobacillus", mistake: "confuses dairy bacteria with the yeast used in bread"}
      - {text: "Penicillium", mistake: "assigns an antibiotic producing mould to bread rising"}
      - {text: "Clostridium", mistake: "uses an anaerobic spore former for baking"}
    explanation: "Baker's yeast ferments the sugars in dough and releases carbon dioxide, which makes the dough rise. Lactobacillus is used in dairy and some doughs for acidity rather than rising."
    hints:
      - "Think about a fungus that produces carbon dioxide during fermentation."
      - "Consider which microbe is used as baker's yeast."
      - "Separate the yeast from the bacteria and moulds."
