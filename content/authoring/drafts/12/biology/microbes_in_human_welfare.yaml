  - topic: "sewage_and_biogas"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What is the main purpose of primary treatment of sewage?"
    correct: "Removing large solid particles by screening and sedimentation"
    unit: ""
    wrong:
      - {text: "Adding oxygen to kill all pathogens", mistake: "assigns the disinfection role to the first stage"}
      - {text: "Producing biogas from the sludge", mistake: "assigns biogas production to the first stage"}
      - {text: "Adding chemicals to produce salt", mistake: "treats chemical salt production as a sewage step"}
    explanation: "Primary treatment screens out large debris and lets heavier solids settle as primary sludge. Biological treatment and disinfection come later."
    hints:
      - "Think about how large solids are separated from the flow."
      - "Consider which stage uses screens and settling tanks."
      - "Ask which step comes before any biological breakdown."
    diagram: null
    confidence: "high"
  - topic: "sewage_and_biogas"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which microbes break down organic matter in the aeration tank during secondary treatment?"
    correct: "Aerobic bacteria that form flocs"
    unit: ""
    wrong:
      - {text: "Anaerobic methanogens", mistake: "uses the microbes of the digester in an aerated tank"}
      - {text: "Viruses only", mistake: "assumes viruses do most of the decomposition"}
      - {text: "Algae that cause eutrophication only", mistake: "limits the decomposers to algae"}
    explanation: "Aerobic bacteria in the aeration tank consume organic matter in the presence of oxygen and clump into flocs that settle out. Methanogens work in anaerobic digesters, not in aerated tanks."
    hints:
      - "Think about the conditions inside an aerated tank."
      - "Consider which microbes need oxygen to break down matter."
      - "Separate aerobic processes from anaerobic ones."
    diagram: null
    confidence: "high"
