    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which microbe is mainly responsible for converting milk into curd?"
    correct: "Lactobacillus"
    unit: ""
    wrong:
      - {text: "Saccharomyces", mistake: "uses a yeast for dairy fermentation"}
      - {text: "Aspergillus", mistake: "confuses a mould with lactic acid bacteria"}
      - {text: "Rhizobium", mistake: "uses a nitrogen fixing bacterium for milk fermentation"}
    explanation: "Lactobacillus ferments the sugar in milk into lactic acid, which sets the milk into curd. The other microbes have roles in other foods or in soil."
    hints:
      - "Think about a lactic acid producing bacterium."
      - "Consider which microbe lowers the pH of milk."
      - "Separate dairy bacteria from yeasts and moulds."
