items:
  - topic: "flower_and_gametogenesis"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which part of the stamen produces pollen grains?"
    correct: "Anther"
    unit: ""
    wrong:
      - {text: "Filament", mistake: "confuses the stalk that holds the anther with the pollen producer"}
      - {text: "Stigma", mistake: "mixes up the receiving part of the pistil with the stamen"}
      - {text: "Ovary", mistake: "assigns the pollen role to the ovule-bearing part"}
    explanation: "The anther is the top portion of the stamen and holds pollen sacs where pollen grains develop. The filament only supports it."
    hints:
      - "Think about the sac-like tip at the top of the stamen."
      - "Pollen grains form inside a structure at the top of the stalk."
      - "Recall which part of the stamen holds the pollen sacs."
    diagram: null
    confidence: "high"
  - topic: "flower_and_gametogenesis"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which cell inside the ovule undergoes meiosis to begin the female gametophyte?"
    correct: "Megaspore mother cell"
    unit: ""
    wrong:
      - {text: "Egg cell", mistake: "takes the final gamete for the cell that starts the process"}
      - {text: "Synergid", mistake: "mixes up a helper cell with the cell that starts meiosis"}
      - {text: "Antipodal cell", mistake: "confuses a late cell of the sac with the starting cell"}
    explanation: "The megaspore mother cell is diploid and divides by meiosis to give four haploid megaspores, and only one of them develops into the female gametophyte."
    hints:
      - "Start from the diploid cell found in the nucellus."
      - "Meiosis in this cell produces four haploid products."
      - "Only one of those four products survives to form the sac."
    diagram: null
    confidence: "high"
  - topic: "flower_and_gametogenesis"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "A pollen mother cell has 24 chromosomes in its diploid state. How many chromosomes does each pollen grain contain? Give the count only."
    correct: "12"
    unit: ""
    wrong: []
    explanation: "Meiosis halves the chromosome number, so each haploid pollen grain carries half the parent's count."
    hints:
      - "Pollen grains are formed by meiosis in the mother cell."
      - "Meiosis halves the chromosome number of the parent cell."
      - "Check that a pollen grain is haploid after meiosis."
    diagram: null
    confidence: "high"
  - topic: "flower_and_gametogenesis"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "On a labelled diagram of an anatropous ovule, which point marks where the funicle joins the body of the ovule?"
    correct: "Hilum"
    unit: ""
    wrong:
      - {text: "Micropyle", mistake: "picks the pore opening instead of the attachment point"}
      - {text: "Nucellus", mistake: "chooses the tissue that holds the embryo sac instead of the joint"}
      - {text: "Egg apparatus", mistake: "confuses the cell group at the sac with a structure of the ovule wall"}
    explanation: "The hilum is the point where the funicle attaches to the ovule, and it later becomes the scar on the seed. The micropyle is the opening at the opposite end."
    hints:
      - "Trace the stalk that attaches the ovule to the placenta."
      - "Compare this point with the small opening at the other end."
      - "Locate where the funicle meets the ovule body rather than the pore."
    diagram: "Draw a labelled anatropous ovule showing the funicle, hilum, micropyle, nucellus and embryo sac; mark the hilum where the funicle joins the ovule body."
    confidence: "medium"
  - topic: "flower_and_gametogenesis"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A mutant anther never releases pollen, yet its ovules develop normally. Which stage of the sexual cycle is most directly disrupted?"
    correct: "Development of male gametes from microspores"
    unit: ""
    wrong:
      - {text: "Formation of the embryo sac", mistake: "assigns the female process to the male defect"}
      - {text: "Fusion of the polar nuclei", mistake: "ties polar nuclei to pollen release"}
      - {text: "Germination of the pollen tube", mistake: "assumes tube growth happens before any pollen is released"}
    explanation: "Pollen release depends on microspores maturing into male gametes inside the anther. Since the female side develops normally, the fault lies on the male side of this development."
    hints:
      - "Trace the path from the pollen sacs to a mature pollen grain."
      - "The female side develops normally, so focus on the male side."
      - "Ask which step turns microspores into male cells."
    diagram: null
    confidence: "high"
  - topic: "flower_and_gametogenesis"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "An anther has 4 pollen sacs. Each sac contains 100 pollen mother cells, and each mother cell gives 4 pollen grains. How many pollen grains form in total? Give the count only."
    correct: "1600"
    unit: ""
    wrong: []
    explanation: "Four sacs of 100 mother cells give 400 mother cells, and 400 times 4 grains equals 1600."
    hints:
      - "Start with the number of pollen sacs in the anther."
      - "Multiply by the number of mother cells in each sac."
      - "Apply the number of grains per mother cell last."
    diagram: "Sketch a transverse section of an anther showing four pollen sacs, each containing many pollen mother cells, with the connective and wall layers labelled."
    confidence: "high"
  - topic: "pollination_types"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which pollination type transfers pollen between two different flowers on the same plant?"
    correct: "Geitonogamy"
    unit: ""
    wrong:
      - {text: "Xenogamy", mistake: "uses the term for transfer between different plants"}
      - {text: "Autogamy", mistake: "confuses transfer within one flower with transfer between flowers"}
      - {text: "Cleistogamy", mistake: "treats a closed-flower condition as a transfer type"}
    explanation: "Geitonogamy is pollen moving between flowers of the same plant, so it is genetically like self-pollination. Xenogamy involves a different plant."
    hints:
      - "Compare the donor flower with the receiving flower."
      - "Both flowers belong to the same plant in this case."
      - "Note whether the pollen comes from the same flower or a separate one."
    diagram: null
    confidence: "high"
  - topic: "pollination_types"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which agent most commonly carries pollen in grasses and many trees?"
    correct: "Wind"
    unit: ""
    wrong:
      - {text: "Water in most land plants", mistake: "generalises aquatic pollination to land plants"}
      - {text: "Birds in all flowering plants", mistake: "assumes birds are the main pollen carrier everywhere"}
      - {text: "Insects that feed on pollen only", mistake: "treats a narrow feeding habit as the only pollen carrier"}
    explanation: "Grasses and many trees have small, dry, feathery flowers that release light pollen into the air. Wind is the carrier for this pattern."
    hints:
      - "Think about light, dry pollen released from flowers without showy colour."
      - "Consider which agent needs no reward from the flower to move pollen."
      - "Recall the non-living agent that moves pollen in this group."
    diagram: null
    confidence: "high"
  - topic: "pollination_types"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "A plant has 60 flowers, and 15 of them were self-pollinated. What percentage of the flowers were self-pollinated? Give the number only."
    correct: "25"
    unit: "%"
    wrong: []
    explanation: "Fifteen out of sixty is one quarter, which is 25 percent."
    hints:
      - "Divide the self-pollinated count by the total number of flowers."
      - "Convert the resulting fraction into a percentage."
      - "Multiply by one hundred at the end."
    diagram: null
    confidence: "high"
  - topic: "pollination_types"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Some species rarely self-pollinate. Which feature of a flower is most directly responsible for limiting self-pollination in such species?"
    correct: "Stamens and stigma maturing at different times"
    unit: ""
    wrong:
      - {text: "Bright petals that attract insects", mistake: "links petal colour to self-fertility instead of timing"}
      - {text: "Large quantities of nectar", mistake: "confuses a reward for visitors with a timing barrier"}
      - {text: "Sticky pollen grains only", mistake: "treats pollen texture as the timing mechanism"}
    explanation: "When the stamens shed pollen before the stigma is receptive, or the reverse, a flower cannot easily pollinate itself. This is a timing barrier rather than an attraction feature."
    hints:
      - "Think about a barrier that stops a flower pollinating itself."
      - "Consider which feature separates the male and female parts in time."
      - "Ask whether the feature relates to timing or to attraction."
    diagram: null
    confidence: "high"
  - topic: "pollination_types"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A plant rejects pollen from its own flowers but accepts pollen from other plants. Which mechanism is most likely responsible?"
    correct: "The stigma recognises and rejects pollen of the same plant through chemical signals"
    unit: ""
    wrong:
      - {text: "Anthers release pollen before the stigma is receptive", mistake: "confuses a timing barrier with recognition"}
      - {text: "The pollen tube grows too slowly in the style", mistake: "blames growth speed rather than recognition"}
      - {text: "The ovule degenerates before pollen arrives", mistake: "assumes the ovule fails before pollination occurs"}
    explanation: "Self-incompatibility works by chemical recognition on the stigma, which accepts or rejects pollen according to its genetic identity. This selectivity distinguishes it from timing or growth barriers."
    hints:
      - "Consider a chemical signal passing between the pollen and the receiving surface."
      - "Think about a reaction that rejects some pollen but accepts other pollen."
      - "Focus on the surface of the receiving organ rather than the tube."
    diagram: null
    confidence: "high"
  - topic: "pollination_types"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A wind-pollinated plant releases 50000 pollen grains per flower, and 0.1 percent of them land on a stigma. How many grains land on stigmas per flower? Give the count only."
    correct: "50"
    unit: ""
    wrong: []
    explanation: "Zero point one percent of 50000 is 50 grains per flower."
    hints:
      - "Convert the percentage into a decimal."
      - "Apply that decimal to the total grain count."
      - "Check that your result is a count of grains."
    diagram: null
    confidence: "high"
  - topic: "double_fertilisation"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What is the name of the fusion between one male gamete and the two polar nuclei in the embryo sac?"
    correct: "Triple fusion"
    unit: ""
    wrong:
      - {text: "Syngamy", mistake: "uses the name of the egg fusion for the second event"}
      - {text: "Plasmogamy", mistake: "treats fusion of cytoplasm alone as the whole event"}
      - {text: "Budding", mistake: "picks an asexual process for a sexual fusion"}
    explanation: "Triple fusion joins one sperm nucleus with two polar nuclei, producing a triploid primary endosperm nucleus. Syngamy is the separate fusion of gametes that forms the zygote."
    hints:
      - "Count how many nuclei take part in this fusion."
      - "Think about three nuclei combining into one."
      - "The result is a triploid nucleus."
    diagram: null
    confidence: "high"
  - topic: "double_fertilisation"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What does the primary endosperm nucleus develop into in an angiosperm seed?"
    correct: "Endosperm tissue"
    unit: ""
    wrong:
      - {text: "Embryo sac wall", mistake: "uses the nucleus name as if it labelled a wall"}
      - {text: "Seed coat", mistake: "assigns the outer covering to the fate of the nucleus"}
      - {text: "Zygote only", mistake: "assumes only the zygote develops after fertilisation"}
    explanation: "The primary endosperm nucleus divides to form the endosperm, a nutritive tissue that feeds the developing embryo. The seed coat comes from the integuments of the ovule."
    hints:
      - "Think about the tissue that stores food for the embryo."
      - "Consider the ploidy of the primary endosperm nucleus."
      - "Ask which tissue supplies food to the developing embryo."
    diagram: null
    confidence: "high"
  - topic: "double_fertilisation"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "A flowering plant has a diploid chromosome number of 16. How many chromosomes does its primary endosperm nucleus contain? Give the count only."
    correct: "24"
    unit: ""
    wrong: []
    explanation: "The primary endosperm nucleus is triploid, with one haploid sperm contribution of 8 and two haploid polar nucleus contributions of 8 each, giving 24."
    hints:
      - "Check where each haploid contribution comes from."
      - "Each polar nucleus is haploid, the same as a sperm nucleus."
      - "Add the haploid contributions from the sperm and both polar nuclei."
    diagram: null
    confidence: "high"
  - topic: "double_fertilisation"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "On a labelled diagram of a mature embryo sac, which cell holds two polar nuclei that fuse with a sperm nucleus?"
    correct: "Central cell"
    unit: ""
    wrong:
      - {text: "Egg apparatus", mistake: "picks the cell group that holds the egg for the cell with polar nuclei"}
      - {text: "Antipodal cells", mistake: "uses the cells at the far end of the sac instead of the large central cell"}
      - {text: "Synergids", mistake: "assumes the helper cells hold the polar nuclei"}
    explanation: "The large central cell contains the two polar nuclei, which fuse with a sperm nucleus to form the triploid endosperm nucleus. The egg apparatus and antipodals sit at other ends of the sac."
    hints:
      - "Locate the large central region of the sac."
      - "Count how many nuclei each cell group holds."
      - "Two nuclei sit in one large cell rather than in the small cells."
    diagram: "Draw an eight-nucleate embryo sac with the egg, two synergids and three antipodal cells at the ends and the large central cell holding two polar nuclei; label each group."
    confidence: "high"
  - topic: "double_fertilisation"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A mutant plant forms a normal egg and zygote, but the second fertilisation event fails. What is the most likely consequence for the seed?"
    correct: "No endosperm forms, so the embryo lacks stored food"
    unit: ""
    wrong:
      - {text: "The embryo develops with twice the normal chromosome number", mistake: "assumes the failed fusion changes the ploidy of the embryo"}
      - {text: "The seed becomes a fruit without any embryo", mistake: "confuses the absence of endosperm with fruit formation"}
      - {text: "Pollination fails completely", mistake: "ties the endosperm fusion to pollen capture"}
    explanation: "The second fusion produces the triploid endosperm, which feeds the young embryo. Without it the zygote can still form but has no stored food supply."
    hints:
      - "Identify which product of the second fusion is missing."
      - "Think about what a young seed needs for early growth."
      - "The zygote can still form, so focus on the triploid tissue."
    diagram: null
    confidence: "high"
  - topic: "double_fertilisation"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A pistil has 12 ovules, and each ovule holds one embryo sac with 8 nuclei. How many nuclei are present in all the embryo sacs together? Give the count only."
    correct: "96"
    unit: ""
    wrong: []
    explanation: "Twelve sacs with 8 nuclei each give 96 nuclei in total."
    hints:
      - "Multiply the number of ovules by the nuclei in one sac."
      - "Check how many nuclei one mature sac holds."
      - "Keep the answer as a total count."
    diagram: "Sketch a longitudinal section of an ovule showing the micropyle, the nucellus and an embryo sac with its eight nuclei, labelled."
    confidence: "high"
