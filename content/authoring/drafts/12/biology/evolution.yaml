items:
  - topic: "origin_of_life"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which experiment showed that amino acids can form from simple gases under conditions meant to mimic early Earth?"
    correct: "Miller and Urey experiment"
    unit: ""
    wrong:
      - {text: "Redi's jar experiment", mistake: "confuses a test of spontaneous generation with chemical synthesis"}
      - {text: "Pasteur's swan-neck flask experiment", mistake: "confuses a test of microbial contamination with synthesis"}
      - {text: "Spallanzani's broth test", mistake: "treats broth sterilisation as evidence of chemical synthesis"}
    explanation: "Miller and Urey circulated a mix of gases and passed electric sparks through it, producing amino acids. The other experiments tested contamination or spontaneous generation rather than synthesis."
    hints:
      - "Think about an apparatus that circulated gases and passed sparks through them."
      - "The set-up imitated a reducing atmosphere with electric discharges."
      - "Focus on the experiment that produced biological building blocks."
    diagram: null
    confidence: "high"
  - topic: "origin_of_life"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What does the RNA world hypothesis propose?"
    correct: "RNA carried genetic information and catalysed reactions before DNA and proteins"
    unit: ""
    wrong:
      - {text: "DNA formed first and directly produced proteins", mistake: "reverses the order in which the molecules appeared in the hypothesis"}
      - {text: "Proteins alone produced the first self-replicating systems", mistake: "omits the genetic molecule from the early stage"}
      - {text: "Viruses seeded life on Earth from elsewhere", mistake: "assigns the origin to an external source instead of chemistry"}
    explanation: "The RNA world hypothesis proposes that RNA stored genetic information and acted as a catalyst before DNA and proteins took over those roles. It explains how a molecule could both copy itself and drive reactions."
    hints:
      - "Think about a molecule that can both store information and act as a catalyst."
      - "Consider which molecule the model places before DNA."
      - "Compare the sequence of molecules proposed in the model with the options."
    diagram: null
    confidence: "high"
  - topic: "origin_of_life"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which property would an early self-replicating molecule need for natural selection to begin acting on it?"
    correct: "Heritable variation in the copies it makes"
    unit: ""
    wrong:
      - {text: "A fixed sequence that never changes", mistake: "assumes stability alone drives change in a population"}
      - {text: "A membrane that protects it from light", mistake: "treats a membrane as the required trait for selection"}
      - {text: "A large size that allows it to be read", mistake: "assumes size, not variation, drives selection"}
    explanation: "Selection needs differences among copies that are passed on, so the copies must vary in ways that are inherited. Without heritable variation, nothing can be selected."
    hints:
      - "Think about what differences between copies would let some survive better."
      - "Consider whether copies must differ to be selected at all."
      - "Focus on differences that are passed to the next copies."
    diagram: null
    confidence: "high"
  - topic: "origin_of_life"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "A protocell model assumes that one molecule doubles every 2 hours. Starting from one molecule, how many molecules exist after 10 hours? Give the count only."
    correct: "32"
    unit: ""
    wrong: []
    explanation: "Ten hours contains five doublings of two hours each, and two to the power five is 32."
    hints:
      - "Count how many doublings fit into 10 hours."
      - "Each doubling multiplies the count by two."
      - "Keep the answer as a count of molecules."
    diagram: null
    confidence: "high"
  - topic: "origin_of_life"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Hydrothermal vents are proposed as a site where early life may have begun. Which argument supports this idea?"
    correct: "Chemical gradients and mineral surfaces could concentrate molecules and drive early chemistry"
    unit: ""
    wrong:
      - {text: "Vents supply no energy or chemicals at all", mistake: "reverses the energy argument for vent environments"}
      - {text: "Vents are cold and dark, which prevents any chemistry", mistake: "treats cold and darkness as favourable to chemistry"}
      - {text: "Vents exist only on land far from water", mistake: "misplaces the environment the hypothesis describes"}
    explanation: "Vents release chemicals and create steep gradients, and their mineral surfaces may have helped concentrate and link molecules. These features make them plausible settings for early chemistry."
    hints:
      - "Consider what energy and materials a vent supplies to its surroundings."
      - "Think about how surfaces and gradients could concentrate molecules."
      - "Ask which feature of a vent would favour building larger molecules."
