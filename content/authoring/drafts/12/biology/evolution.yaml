  - topic: "natural_selection_hardy_weinberg"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which condition is NOT required for a population to remain in Hardy-Weinberg equilibrium?"
    correct: "Mutations occur frequently in every generation"
    unit: ""
    wrong:
      - {text: "Random mating in the population", mistake: "assumes random mating is optional for equilibrium"}
      - {text: "No gene flow between populations", mistake: "treats isolation as irrelevant to allele frequencies"}
      - {text: "A very large population size", mistake: "assumes genetic drift does not change allele frequencies in small groups"}
    explanation: "Equilibrium requires no mutation, no selection, no migration, no drift and random mating. Frequent mutation would itself change allele frequencies, so it is the one listed condition that breaks the model."
    hints:
      - "Think about what would change allele frequencies from one generation to the next."
      - "Compare which conditions keep frequencies constant."
      - "Identify the factor that introduces new alleles over time."
    diagram: null
    confidence: "high"
  - topic: "natural_selection_hardy_weinberg"
    type: "numeric"
    difficulty: "easy"
    role: "explain"
    stem: "In a population at equilibrium, the frequency of allele p is 0.6. What is the frequency of allele q? Give the number only."
    correct: "0.4"
    unit: ""
    wrong: []
    explanation: "The two allele frequencies add to 1, so q equals 1 minus 0.6, which is 0.4."
    hints:
      - "The two allele frequencies add to one."
      - "Subtract the known frequency from one."
      - "Check that p and q together give one."
    diagram: null
    confidence: "high"
