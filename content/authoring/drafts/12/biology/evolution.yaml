  - topic: "evidence_for_evolution"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which pair of structures illustrates homologous structures?"
    correct: "Forelimbs of a bat and a human"
    unit: ""
    wrong:
      - {text: "Wings of a bird and a butterfly", mistake: "treats similar function as evidence of common ancestry"}
      - {text: "Eyes of an octopus and a human", mistake: "confuses independently evolved organs with homology"}
      - {text: "Thorns and tendrils of plants", mistake: "counts modified plant parts with different origins as homologous"}
    explanation: "The bat wing and human arm share the same bone plan inherited from a common ancestor, even though they are used differently. Bird and insect wings are analogous instead."
    hints:
      - "Think about common ancestry rather than similar function."
      - "Consider which structures share the same underlying bone arrangement."
      - "Separate structures inherited from an ancestor from those that evolved separately."
    diagram: null
    confidence: "high"
  - topic: "evidence_for_evolution"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What do analogous structures indicate about the organisms that have them?"
    correct: "Similar function arising from convergent evolution rather than shared ancestry"
    unit: ""
    wrong:
      - {text: "Shared ancestry through a common bone plan", mistake: "swaps analogous structures with homologous ones"}
      - {text: "Descent from the same fossil ancestor only", mistake: "limits the evidence to a single fossil lineage"}
      - {text: "That the structure is vestigial and no longer used", mistake: "treats a shared function as a sign of a vestige"}
    explanation: "Analogous structures do similar jobs but evolved separately under similar pressures, which is convergent evolution. Their similarity does not show a shared ancestral form."
    hints:
      - "Think about the pressure that favours a shared function in unrelated groups."
      - "Consider whether the structure is inherited from a common ancestor or evolved separately."
      - "Ask whether the shared feature reflects a common plan or a common job."
    diagram: null
    confidence: "high"
