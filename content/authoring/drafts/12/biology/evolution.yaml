  - topic: "human_evolution"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which evidence best establishes the age of early hominin fossils?"
    correct: "Radiometric dating of volcanic layers surrounding the fossils"
    unit: ""
    wrong:
      - {text: "Counting the number of teeth in a fossil jaw", mistake: "treats tooth count as a measure of time"}
      - {text: "Measuring the colour of the skull", mistake: "assumes skull colour reflects the age of the fossil"}
      - {text: "Comparing only the diet of living apes", mistake: "uses living animals rather than the fossil deposits to date fossils"}
    explanation: "Volcanic ash layers above and below fossils contain isotopes that decay at known rates, so their ages bracket the fossils. This gives a direct date for the fossil layer."
    hints:
      - "Think about how rock layers can be dated using isotopes."
      - "Consider evidence drawn from the deposits around the fossil."
