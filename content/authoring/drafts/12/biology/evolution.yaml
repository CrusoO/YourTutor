  - topic: "human_evolution"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A fossil hominin has a small brain but a fully bipedal walking gait. What is the best inference about the order of these traits?"
    correct: "Bipedalism evolved before large brain expansion"
    unit: ""
    wrong:
      - {text: "Brain expansion came first, followed by bipedalism", mistake: "reverses the order of the two traits"}
      - {text: "Bipedalism was lost in all later hominins", mistake: "assumes bipedalism disappeared after its first appearance"}
      - {text: "Tool use appeared before any bipedalism", mistake: "assumes tools must come before walking"}
    explanation: "The fossil already walks upright while its brain is still small, so bipedalism came before the large brain expansion seen later in Homo. Upright walking is recorded in the skeleton, while brain size is a separate trait."
    hints:
      - "Think about which traits the fossil already shows."
      - "Consider which trait is missing from the fossil."
      - "Ask which trait is recorded in the skeleton and which in the skull."
