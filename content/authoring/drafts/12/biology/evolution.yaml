  - topic: "evidence_for_evolution"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Limb diagrams show the same bone arrangement in a whale flipper and a human arm. What does this best indicate?"
    correct: "Common ancestry with the same skeletal plan adapted to different uses"
    unit: ""
    wrong:
      - {text: "Independent evolution of flippers from fish fins", mistake: "invents convergence for a shared bone plan"}
      - {text: "Whales are descended from humans", mistake: "reverses the direction of descent"}
      - {text: "The flipper is a vestigial form of the arm", mistake: "confuses homology with vestigial structures"}
    explanation: "The same bones in the same arrangement, adapted for swimming in one case and grasping in the other, point to shared ancestry. This is the defining mark of homology."
    hints:
      - "Compare the arrangement of the bones rather than the outside shape of the limb."
      - "Think about the inheritance pattern that would produce the same bone plan."
      - "Ask whether the similarity is in the skeletal plan or only in the function."
    diagram: "Draw a human arm and a whale flipper side by side showing the humerus, radius, ulna, carpals and phalanges, with matching bones colour coded."
    confidence: "high"
  - topic: "evidence_for_evolution"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Two species have wings used for flight, but their skeletons differ strongly. Which conclusion is best supported?"
    correct: "Their wings are analogous, with a similar function from different origins"
    unit: ""
    wrong:
      - {text: "Their wings are homologous, showing recent common ancestry", mistake: "treats a shared function as a recent shared origin"}
      - {text: "Their wings are vestigial and no longer used for flight", mistake: "misreads the function of the wings"}
      - {text: "Their skeletons prove they belong to the same species", mistake: "reads structural difference as a sign of species identity"}
    explanation: "Similar function with different skeletal plans suggests convergent evolution, so the wings are analogous. Homology would require the same underlying bone plan."
    hints:
      - "Compare the bone structure with the function of the wing."
      - "Ask whether the shared feature comes from a common plan or from similar pressures."
      - "Check whether the skeletons follow the same bone pattern."
