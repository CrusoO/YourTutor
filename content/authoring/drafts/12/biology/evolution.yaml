    stem: "In a population of 1000 individuals, 360 are homozygous recessive for allele a. What is the frequency of allele a? Give the number only."
    correct: "0.6"
    unit: ""
    wrong: []
    explanation: "The recessive genotype frequency is 0.36, and its square root gives q equal to 0.6."
    hints:
