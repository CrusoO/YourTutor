  - topic: "air_water_pollution_12"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which gas released by burning coal is the main contributor to acid rain?"
    correct: "Sulphur dioxide"
    unit: ""
    wrong:
      - {text: "Methane", mistake: "confuses a greenhouse gas with an acid rain precursor"}
      - {text: "Oxygen", mistake: "assumes a common gas of the air causes acidity"}
      - {text: "Argon", mistake: "assumes an inert gas reacts to form acids"}
    explanation: "Sulphur dioxide from burning sulphur-containing coal reacts with water and oxygen in the air to form sulphuric acid, which falls as acid rain. Nitrogen oxides contribute as well."
    hints:
      - "Think about the gas that burning coal releases."
      - "Consider a gas that contains sulphur."
      - "Separate greenhouse gases from gases that form acids."
    diagram: null
    confidence: "high"
  - topic: "air_water_pollution_12"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What is the main effect of excess nutrients such as nitrates and phosphates in a lake?"
    correct: "Algal blooms that deplete oxygen when they die and decay"
    unit: ""
    wrong:
      - {text: "They increase oxygen levels permanently", mistake: "reverses the oxygen effect of an algal bloom"}
      - {text: "They make the water sterile", mistake: "assumes nutrients remove all microbes"}
      - {text: "They reduce plant growth in the lake", mistake: "reverses the effect of nutrients on plants"}
    explanation: "Excess nutrients cause rapid algal growth, and when the algae die, decomposers use up dissolved oxygen. This eutrophication can kill fish and other aquatic life."
    hints:
      - "Think about what the algae do to the oxygen in the water when they decay."
      - "Consider how a sudden population boom of algae ends."
      - "Ask which process uses up oxygen after the bloom."
    diagram: null
    confidence: "high"
  - topic: "air_water_pollution_12"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which water quality measure indicates how much oxygen microbes use to break down organic matter?"
    correct: "Biochemical oxygen demand"
    unit: ""
    wrong:
      - {text: "Dissolved salt content", mistake: "confuses salinity with oxygen consumption"}
      - {text: "Turbidity", mistake: "measures cloudiness rather than oxygen use"}
      - {text: "pH", mistake: "measures acidity rather than oxygen use"}
    explanation: "Biochemical oxygen demand measures the oxygen consumed by microbes while they decompose organic matter in a water sample over a set time. High values indicate heavy organic pollution."
    hints:
      - "Think about how much oxygen microbes consume."
      - "Consider the test that measures oxygen used during breakdown of organic matter."
      - "Separate oxygen use from clarity or acidity."
    diagram: null
    confidence: "high"
  - topic: "air_water_pollution_12"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which control measure reduces air pollution from vehicle exhaust?"
    correct: "Catalytic converters that change harmful gases into less harmful ones"
    unit: ""
    wrong:
      - {text: "Taller chimneys for vehicles", mistake: "treats chimney height as an exhaust control for vehicles"}
      - {text: "Burning more fuel to finish combustion", mistake: "assumes extra fuel reduces pollutant emissions"}
      - {text: "Removing exhaust filters", mistake: "reverses the purpose of exhaust control"}
    explanation: "A catalytic converter uses catalysts to change carbon monoxide, hydrocarbons and nitrogen oxides into less harmful gases before they leave the exhaust. Taller chimneys spread pollution rather than reduce it."
    hints:
      - "Think about the device in the exhaust that changes the chemicals."
      - "Consider a device that converts harmful gases into less harmful ones."
      - "Ask which device treats the exhaust rather than dispersing it."
    diagram: null
    confidence: "high"
  - topic: "air_water_pollution_12"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A river shows a sudden fish kill after a sewage spill. Which mechanism most likely caused the deaths?"
    correct: "Microbial decomposition of the sewage used up the dissolved oxygen"
    unit: ""
    wrong:
      - {text: "The sewage raised the water temperature to lethal levels only", mistake: "assumes temperature is the only cause of a fish kill"}
      - {text: "The sewage added chlorine that fish cannot breathe", mistake: "assumes chlorine is the main pollutant in sewage"}
      - {text: "The sewage blocked sunlight permanently", mistake: "assumes shading alone kills fish quickly"}
    explanation: "Decomposing sewage consumes large amounts of dissolved oxygen, which can fall to levels that suffocate fish. This is the usual cause of a rapid fish kill after organic pollution."
    hints:
      - "Think about what the decomposing sewage consumes in the water."
      - "Consider what fish need to survive in water."
      - "Ask which change in the water would cause fish to suffocate quickly."
    diagram: null
    confidence: "high"
  - topic: "air_water_pollution_12"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A water sample has a biochemical oxygen demand of 60 mg per litre. After treatment, this falls by 75 percent. What is the new value in mg per litre? Give the number only."
    correct: "15"
    unit: "mg per litre"
    wrong: []
    explanation: "A 75 percent reduction of 60 mg per litre removes 45 mg per litre, leaving 15 mg per litre."
    hints:
      - "Find the amount removed by applying the percentage to the original value."
      - "Subtract the removed amount from the original value."
      - "Check that the unit is mg per litre."
    diagram: null
    confidence: "high"
  - topic: "solid_waste_management"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which waste management method converts organic waste into compost?"
    correct: "Composting"
    unit: ""
    wrong:
      - {text: "Landfill without any treatment", mistake: "treats untreated disposal as a conversion method"}
      - {text: "Incineration of plastic", mistake: "assigns a combustion method to organic waste conversion"}
      - {text: "Open burning of mixed waste", mistake: "treats uncontrolled burning as a way to make compost"}
    explanation: "Composting lets aerobic microbes break organic waste into a stable humus rich material. The other methods do not produce compost."
    hints:
      - "Think about microbes breaking organic waste down into humus."
      - "Consider a method that uses aerobic decomposition."
      - "Separate biological conversion from burning and burial."
    diagram: null
    confidence: "high"
  - topic: "solid_waste_management"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Why is the 3R approach recommended for managing waste?"
    correct: "It reduces waste at the source, reuses items and recycles materials"
    unit: ""
    wrong:
      - {text: "It increases the volume of waste sent to landfill", mistake: "reverses the purpose of the approach"}
      - {text: "It requires the most land of any waste method", mistake: "assigns a land cost that the approach avoids"}
      - {text: "It always produces toxic gas", mistake: "assumes the approach creates pollution"}
    explanation: "Reduce, reuse and recycle cut the amount of waste produced and the resources used, which eases the load on landfills and incinerators. Reduction at the source is the most effective step."
    hints:
      - "Think about the stages that come before any waste is produced."
      - "Consider which step prevents waste from being created in the first place."
      - "Ask which option describes a set of actions that lower waste volume."
    diagram: null
    confidence: "high"
  - topic: "solid_waste_management"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which step separates waste into biodegradable and non-biodegradable components?"
    correct: "Segregation at the source"
    unit: ""
    wrong:
      - {text: "Final landfill disposal", mistake: "places the sorting step at the end of the process"}
      - {text: "Incineration of the whole load", mistake: "burns the mixed load without sorting"}
      - {text: "Dumping waste in water bodies", mistake: "treats dumping as a sorting step"}
    explanation: "Segregating waste at the source into wet and dry or biodegradable and non-biodegradable streams makes composting and recycling practical. Sorting after mixing is much harder."
    hints:
      - "Think about the earliest point at which waste can be sorted."
      - "Consider the step that happens before the waste is mixed."
      - "Ask which step is carried out at the house or workplace."
    diagram: null
    confidence: "high"
  - topic: "solid_waste_management"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which product of anaerobic digestion of organic waste can be used as fuel?"
    correct: "Biogas"
    unit: ""
    wrong:
      - {text: "Compost", mistake: "treats the solid residue as a fuel"}
      - {text: "Ash", mistake: "treats the residue of burning as the digestion product"}
      - {text: "Leachate", mistake: "treats the liquid drained from waste as a fuel"}
    explanation: "Anaerobic digestion produces biogas, a mixture rich in methane that can be burned for cooking or electricity. The solid and liquid residues are used as fertiliser or treated further."
    hints:
      - "Think about the gas produced by anaerobic microbes."
      - "Consider a gas mixture that contains methane."
      - "Separate the gas product from the solid and liquid residues."
    diagram: null
    confidence: "high"
  - topic: "solid_waste_management"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A landfill produces liquid that threatens groundwater. Which design feature best reduces this risk?"
    correct: "A lined base with a leachate collection system"
    unit: ""
    wrong:
      - {text: "A deeper unlined pit", mistake: "assumes depth alone prevents liquid from reaching groundwater"}
      - {text: "Stacking waste directly over surface water", mistake: "places the source of contamination near the water"}
      - {text: "Leaving the waste uncovered", mistake: "increases the infiltration of rain into the waste"}
    explanation: "A lined base stops the liquid from seeping into the soil, and a collection system drains the leachate for treatment. Together they keep contaminants out of groundwater."
    hints:
      - "Think about how liquid can be kept from moving into the soil."
      - "Consider a barrier and a drain for the liquid."
      - "Ask which design feature blocks and collects the leachate."
    diagram: null
    confidence: "high"
