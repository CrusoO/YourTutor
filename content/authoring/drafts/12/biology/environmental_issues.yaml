  - topic: "greenhouse_and_ozone"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which long-lived greenhouse gas is released in the largest amount by burning fossil fuels?"
    correct: "Carbon dioxide"
    unit: ""
    wrong:
      - {text: "Ozone in the stratosphere", mistake: "treats protective stratospheric ozone as a fuel emission"}
      - {text: "Nitrogen", mistake: "assumes nitrogen traps heat as a greenhouse gas"}
      - {text: "Helium", mistake: "assumes an inert gas is released by combustion in large amounts"}
    explanation: "Burning fossil fuels releases large amounts of carbon dioxide, which stays in the atmosphere for centuries and traps outgoing heat. Stratospheric ozone is a different layer with a protective role."
    hints:
      - "Think about the gas produced when fuels are burned."
      - "Consider the gas that accumulates in the air over centuries."
      - "Separate fuel emissions from natural atmospheric layers."
    diagram: null
    confidence: "high"
  - topic: "greenhouse_and_ozone"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Why does the ozone layer protect life on Earth?"
    correct: "It absorbs much of the ultraviolet radiation from the sun"
    unit: ""
    wrong:
      - {text: "It produces oxygen for animals directly", mistake: "confuses the ozone layer with photosynthesis"}
      - {text: "It traps heat near the ground", mistake: "assigns the ozone layer the greenhouse role"}
      - {text: "It blocks visible light from reaching plants", mistake: "assumes the ozone layer blocks visible light"}
    explanation: "Ozone in the stratosphere absorbs most of the harmful ultraviolet B radiation, which would otherwise damage DNA and cells. It does not block visible light needed for photosynthesis."
    hints:
      - "Think about the part of sunlight that damages DNA."
      - "Consider which band of radiation the layer absorbs."
      - "Ask which kind of radiation the ozone layer shields the surface from."
    diagram: null
    confidence: "high"
  - topic: "greenhouse_and_ozone"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which group of chemicals is primarily responsible for ozone depletion in the stratosphere?"
    correct: "Chlorofluorocarbons"
    unit: ""
    wrong:
      - {text: "Methane", mistake: "treats a greenhouse gas as the main ozone destroyer"}
      - {text: "Carbon monoxide", mistake: "assumes a combustion gas is the main ozone destroyer"}
      - {text: "Water vapour", mistake: "assumes water vapour is the main ozone destroyer"}
    explanation: "Chlorofluorocarbons release chlorine atoms in the stratosphere, and each chlorine atom can destroy many ozone molecules. Phasing them out under international agreement has been a major success."
    hints:
      - "Think about synthetic compounds once used as refrigerants."
      - "Consider compounds that release chlorine in the stratosphere."
      - "Ask which group of synthetic chemicals has been phased out by treaty."
    diagram: null
    confidence: "high"
  - topic: "greenhouse_and_ozone"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "In a greenhouse effect diagram, which arrow represents heat re-emitted from Earth that is trapped by gases?"
    correct: "Infrared radiation leaving the surface and absorbed by gases in the atmosphere"
    unit: ""
    wrong:
      - {text: "Visible light reflected by clouds straight back to space", mistake: "confuses reflected sunlight with re-emitted heat"}
      - {text: "Ultraviolet light blocked by the ozone layer", mistake: "assigns the ozone role to the greenhouse effect"}
      - {text: "Heat conducted into the deep ocean", mistake: "treats conduction into water as the trapping pathway"}
    explanation: "Earth's surface re-emits energy as infrared radiation, and greenhouse gases absorb and re-emit part of it back toward the surface. That trapping is the greenhouse effect."
    hints:
      - "Think about the wavelength of heat radiated from the warm surface."
      - "Consider which kind of radiation the greenhouse gases absorb."
      - "Separate reflected sunlight from heat that leaves the surface."
    diagram: "Draw Earth with incoming sunlight arrows, reflected arrows, outgoing infrared arrows from the surface, and gas molecules in the atmosphere absorbing and re-emitting the infrared."
    confidence: "high"
  - topic: "greenhouse_and_ozone"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Old refrigerants were replaced by a non-CFC alternative. What is the main environmental benefit of this change?"
    correct: "Less damage to the stratospheric ozone layer"
    unit: ""
    wrong:
      - {text: "Complete removal of all greenhouse gases", mistake: "assumes replacing one refrigerant cancels all warming effects"}
      - {text: "Immediate full restoration of the ozone layer within a year", mistake: "assumes ozone recovers quickly after the change"}
      - {text: "Higher ozone production at ground level", mistake: "confuses stratospheric ozone with ground level ozone production"}
    explanation: "Replacing chlorofluorocarbons stops the release of ozone destroying chlorine, allowing the stratospheric ozone to recover slowly over decades. The change does not remove all greenhouse effects."
    hints:
      - "Think about the gas that the old refrigerants were destroying."
      - "Consider which layer of the atmosphere the damage occurs in."
      - "Ask which benefit is directly linked to stopping chlorine release."
    diagram: null
    confidence: "high"
  - topic: "greenhouse_and_ozone"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A city emits 500000 tonnes of carbon dioxide per year, and one tree absorbs about 20 kg per year. How many trees would be needed to absorb all of it? Give the count only."
    correct: "25000000"
    unit: ""
    wrong: []
    explanation: "Five hundred thousand tonnes is 500 million kg, and dividing by 20 kg per tree gives 25 million trees."
    hints:
      - "Convert tonnes to kilograms before dividing."
      - "Divide the total absorbed amount by the absorption per tree."
      - "Keep the answer as a count of trees."
    diagram: "Draw a bar of annual emissions in tonnes beside a single tree labelled as absorbing 20 kg per year."
    confidence: "medium"
