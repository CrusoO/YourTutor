  - topic: "menstrual_cycle"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which hormone surge from the pituitary triggers ovulation in the middle of the cycle?"
    correct: "Luteinising hormone surge"
    unit: ""
    wrong:
      - {text: "Progesterone surge", mistake: "assumes the hormone of the later phase triggers release"}
