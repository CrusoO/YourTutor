  - topic: "gametogenesis_humans"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which cells nourish developing sperm inside the seminiferous tubules?"
    correct: "Sertoli cells"
    unit: ""
    wrong:
      - {text: "Leydig cells", mistake: "assigns the hormone-making cells the nourishing role"}
      - {text: "Granulosa cells", mistake: "uses a female follicle cell name for male tissue"}
      - {text: "Theca cells", mistake: "picks a female cell type for a male process"}
    explanation: "Sertoli cells line the seminiferous tubules, support developing germ cells and supply them with nutrients. Leydig cells lie outside the tubules and make testosterone."
    hints:
      - "Think about the supporting cells that line the tubule wall."
      - "Consider the cells that bind and nourish germ cells inside the tubule."
      - "Separate the nourishing cells from the cells that make hormones."
    diagram: null
    confidence: "high"
  - topic: "gametogenesis_humans"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "One primary oocyte completes meiosis and yields one functional ovum. How many polar bodies are formed from that oocyte? Give the count only."
    correct: "3"
    unit: ""
    wrong: []
    explanation: "Oogenesis is unequal in cytoplasm, so three small polar bodies are formed alongside the one functional ovum."
    hints:
      - "Oogenesis divides the cytoplasm unequally."
      - "Count the small cells that do not become the functional ovum."
      - "Each division sends one small cell away from the ovum."
