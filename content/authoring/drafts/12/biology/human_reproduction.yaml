  - topic: "menstrual_cycle"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which phase of the menstrual cycle is the period in which the uterine lining is rebuilt after menstruation?"
    correct: "Proliferative phase"
    unit: ""
    wrong:
      - {text: "Secretory phase", mistake: "swaps the two uterine phases in the cycle"}
