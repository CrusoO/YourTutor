  - topic: "male_female_reproductive_system"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "On a labelled diagram of the male tract, which duct carries mature sperm from the epididymis towards the urethra?"
    correct: "Vas deferens"
    unit: ""
    wrong:
      - {text: "Ejaculatory duct", mistake: "chooses the duct nearest the urethra instead of the one before it"}
      - {text: "Seminiferous tubule", mistake: "picks the site of sperm production instead of the transport route"}
      - {text: "Efferent duct", mistake: "chooses the duct between the testis and the epididymis"}
    explanation: "The vas deferens is a long muscular duct that carries sperm from the epididymis up into the abdomen and onward to the urethra. The seminiferous tubules are where sperm are formed."
    hints:
      - "Follow the route from the epididymis onward."
      - "Consider which tube is long and runs up into the abdomen."
      - "The duct passes over the bladder before the gland ducts join it."
    diagram: "Draw the male reproductive tract with testis, seminiferous tubules, epididymis, vas deferens, seminal vesicle, prostate, urethra and penis; label each and draw arrows showing the sperm route."
    confidence: "high"
  - topic: "male_female_reproductive_system"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A man has a blockage only in the vas deferens. Which function is most directly affected?"
    correct: "Transport of mature sperm out of the body"
    unit: ""
    wrong:
      - {text: "Production of testosterone by Leydig cells", mistake: "assumes any duct blockage stops hormone production"}
      - {text: "Nourishment of developing germ cells by Sertoli cells", mistake: "confuses the support cells in the tubules with the transport route"}
      - {text: "Secretion of prostatic fluid", mistake: "ties the prostate gland to the blocked duct"}
    explanation: "A blockage of the vas deferens stops mature sperm from reaching the urethra, though hormone production and sperm formation in the testis continue. The question concerns the transport step only."
    hints:
      - "Consider which steps happen before the duct and which happen after it."
      - "Hormone production occurs in a separate tissue of the testis."
      - "Ask what the duct physically carries."
    diagram: null
    confidence: "high"
