  - topic: "gametogenesis_humans"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "A diagram of oogenesis traces the cell from oogonium to ovum. At which stage is the female germ cell arrested until puberty?"
    correct: "Primary oocyte in prophase I"
    unit: ""
    wrong:
      - {text: "Oogonium in mitosis", mistake: "assumes the arrest occurs at the earliest cell type"}
      - {text: "Secondary oocyte in metaphase II", mistake: "picks the stage reached after ovulation"}
      - {text: "Ovum after fertilisation", mistake: "confuses the final product with the arrest point"}
    explanation: "The primary oocyte starts meiosis I during fetal life and stays arrested in prophase I until puberty. Meiosis resumes in each cycle and is completed only after fertilisation."
    hints:
      - "Think about when the first meiotic division starts in the female fetus."
      - "Consider which division is completed only after ovulation."
      - "The arrest point comes before the first meiotic division finishes."
    diagram: "Draw a flow diagram of oogenesis from oogonium to primary oocyte, secondary oocyte, ovum and polar bodies, marking where each division occurs and where the cell is arrested."
    confidence: "high"
  - topic: "gametogenesis_humans"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A male carries a gene defect that stops the Sertoli cells from working. Which outcome is most likely?"
    correct: "Germ cells fail to mature, so sperm production is reduced"
    unit: ""
    wrong:
      - {text: "Testosterone production stops completely", mistake: "assigns hormone production to the supporting cells"}
      - {text: "Sperm form but cannot leave the testis", mistake: "assumes sperm transport depends on the supporting cells"}
      - {text: "Oocytes begin forming in the male gonad", mistake: "confuses the two sexes' gamete types"}
    explanation: "Sertoli cells nourish and support developing germ cells, so their failure reduces sperm maturation. Testosterone is made by Leydig cells, which are a separate population."
    hints:
      - "Consider the job of the cells that support developing germ cells."
      - "Separate the roles of the supporting cells and the hormone-making cells."
      - "Think about what happens to developing sperm without nourishment."
    diagram: null
    confidence: "high"
