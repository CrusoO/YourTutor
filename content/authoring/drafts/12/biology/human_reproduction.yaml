    explanation: "After menstruation, rising oestrogen rebuilds the endometrium during the proliferative phase. The secretory phase follows ovulation and prepares the lining further."
    hints:
      - "Think about the hormone that dominates the first half of the cycle."
      - "Ask which phase comes right after the shedding of the lining."
      - "Compare the building phase with the phase that prepares the lining after ovulation."
