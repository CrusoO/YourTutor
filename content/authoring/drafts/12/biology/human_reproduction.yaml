  - topic: "male_female_reproductive_system"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which gland adds a fructose-rich fluid to semen that nourishes sperm?"
    correct: "Seminal vesicle"
    unit: ""
    wrong:
      - {text: "Prostate gland", mistake: "gives the prostate the nourishing role of a different gland"}
      - {text: "Cowper's gland", mistake: "picks a gland that secretes before ejaculation as the sugar source"}
      - {text: "Testis", mistake: "assumes the sperm-producing organ also adds the nourishing fluid"}
    explanation: "The seminal vesicles open into the vas deferens and secrete a fluid rich in fructose that fuels sperm. The testis produces sperm but does not add this fluid."
    hints:
      - "Think about the glands that open into the vas deferens."
      - "Look for the gland that adds a sugar-rich fluid to semen."
      - "The sperm-producing organ itself is not the source of this fluid."
    diagram: null
    confidence: "high"
  - topic: "male_female_reproductive_system"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Where does fertilisation normally take place in the human female reproductive tract?"
    correct: "Ampulla of the fallopian tube"
    unit: ""
    wrong:
      - {text: "Uterine lining", mistake: "assumes the implantation site is also the fertilisation site"}
      - {text: "Surface of the ovary", mistake: "places fertilisation where the egg is released"}
      - {text: "Cervix", mistake: "routes sperm to the egg only through the neck of the uterus"}
    explanation: "After release from the ovary, the egg is swept into the fallopian tube, and fertilisation happens in its wide ampulla. The embryo then travels to the uterus."
    hints:
      - "Trace the path the egg takes after it leaves the ovary."
      - "Think about the wide part of the tube that lies near the ovary."
      - "Fertilisation happens before the embryo reaches the uterus."
    diagram: null
    confidence: "high"
