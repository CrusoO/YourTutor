  - topic: "gametogenesis_humans"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "How many haploid spermatids does one primary spermatocyte produce after meiosis?"
    correct: "Four"
    unit: ""
    wrong:
      - {text: "Two", mistake: "stops meiosis after the first division only"}
      - {text: "One large ovum and three polar bodies", mistake: "transfers the female pattern of unequal division to spermatogenesis"}
      - {text: "Eight", mistake: "doubles the number again as if a third division occurred"}
    explanation: "Meiosis of a primary spermatocyte gives four haploid spermatids of equal size, which mature into sperm. No further division follows."
    hints:
      - "Count how many cells come out of meiosis for each primary spermatocyte."
      - "Consider the ploidy of the cells that meiosis produces."
      - "Spermatids mature into sperm without dividing further."
    diagram: null
