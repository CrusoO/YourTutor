  - topic: "menstrual_cycle"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "A graph plots hormone levels over days 1 to 28. Which hormone is secreted by the corpus luteum after ovulation?"
    correct: "Progesterone"
    unit: ""
    wrong:
      - {text: "Follicle-stimulating hormone", mistake: "confuses a pituitary hormone with an ovarian one"}
      - {text: "Oxytocin", mistake: "links the uterine contraction hormone with the cycle"}
      - {text: "Oestrogen from the pituitary", mistake: "assigns an ovarian steroid to the brain"}
    explanation: "After ovulation the corpus luteum secretes progesterone, which keeps the uterine lining ready for an embryo. The pituitary releases FSH and LH rather than the steroid hormones of the ovary."
    hints:
      - "Trace the structure left behind in the ovary after the egg leaves."
      - "Think about which hormone that structure makes to prepare the lining."
      - "Consider the hormone that rises in the second half of the cycle."
    diagram: "Draw a line graph over days 1 to 28 with LH, FSH, oestrogen and progesterone curves, marking the LH peak near day 14."
    confidence: "high"
  - topic: "menstrual_cycle"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A drug stops the pituitary from releasing FSH. What is the most likely effect on the menstrual cycle?"
    correct: "Follicles would not mature, so ovulation would not occur"
    unit: ""
    wrong:
      - {text: "The corpus luteum would grow larger", mistake: "reverses the roles of pituitary and ovarian hormones"}
      - {text: "The uterine lining would thicken without limit", mistake: "assumes the lining grows independently of ovarian hormones"}
      - {text: "Menstruation would begin on day one regardless", mistake: "ignores that the lining depends on ovarian hormones"}
    explanation: "FSH drives follicle growth, and without it follicles do not mature enough to release an egg. The rest of the cycle depends on that ovarian step."
    hints:
      - "Think about what FSH normally does to the follicles."
      - "Consider whether ovulation can occur without a mature follicle."
      - "Ask what happens to the cycle when the first step is missing."
    diagram: null
    confidence: "high"
