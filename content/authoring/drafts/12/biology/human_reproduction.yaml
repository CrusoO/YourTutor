    explanation: "A sharp rise in pituitary LH near mid-cycle triggers the release of the mature egg from the follicle. Progesterone rises later and maintains the lining."
    hints:
      - "Think about which pituitary hormone peaks just before the egg is released."
      - "Consider which hormone rises most steeply in the middle of the cycle."
      - "Compare the timing of each hormone relative to mid-cycle."
