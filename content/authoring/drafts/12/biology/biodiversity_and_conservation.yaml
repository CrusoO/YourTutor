  - topic: "conservation_strategies"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which is an example of in situ conservation?"
    correct: "A national park protecting wild tigers in their natural habitat"
    unit: ""
    wrong:
      - {text: "A seed bank storing crop seeds", mistake: "uses an ex situ method for an in situ label"}
      - {text: "A zoo breeding programme for an endangered bird", mistake: "treats captive breeding as in situ protection"}
      - {text: "A cryopreserved sperm bank", mistake: "treats frozen genetic material as in situ conservation"}
    explanation: "In situ conservation protects species in their natural habitats, as national parks, sanctuaries and reserves do. Seed banks, zoos and sperm banks are ex situ methods."
    hints:
      - "Think about protecting species where they naturally live."
      - "Consider whether the species stays in its natural environment."
      - "Separate protection in the wild from storage or captivity."
    diagram: null
    confidence: "high"
  - topic: "conservation_strategies"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What is the main advantage of ex situ conservation?"
    correct: "It keeps species alive when their wild habitats are lost"
    unit: ""
    wrong:
      - {text: "It restores habitats without any species", mistake: "confuses restoring habitat with keeping species"}
      - {text: "It avoids all human involvement", mistake: "assumes ex situ methods need no human work"}
      - {text: "It replaces the need for national parks", mistake: "assumes storage removes the need for habitat protection"}
    explanation: "Ex situ methods such as seed banks, captive breeding and cryopreservation keep a species or its genetic material safe outside the wild. This is a safeguard if the wild population is lost."
    hints:
      - "Think about what happens to a species if its habitat is destroyed."
      - "Consider how a species can be kept alive outside its home."
      - "Ask which benefit matters most when wild populations are at risk."
    diagram: null
    confidence: "high"
  - topic: "conservation_strategies"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which is an example of a gene bank?"
    correct: "A seed bank storing crop varieties at low temperature"
    unit: ""
    wrong:
      - {text: "A protected forest with wildlife", mistake: "treats an in situ reserve as a gene bank"}
      - {text: "A marine reserve for fish stocks", mistake: "treats a habitat reserve as a gene bank"}
      - {text: "A sanctuary for migrating birds", mistake: "treats a bird sanctuary as stored genetic material"}
    explanation: "A gene bank stores genetic material, such as seeds, in controlled conditions for later use. A protected forest or reserve protects a living habitat instead."
    hints:
      - "Think about storage of genetic material away from the field."
      - "Consider which option stores material rather than protecting a living area."
      - "Separate stored samples from protected habitats."
    diagram: null
    confidence: "high"
  - topic: "conservation_strategies"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "A sanctuary keeps animals inside a fenced area near their natural range. Which category does this belong to?"
    correct: "In situ conservation"
    unit: ""
    wrong:
      - {text: "Ex situ conservation", mistake: "assumes any fenced enclosure is ex situ"}
      - {text: "Cryopreservation", mistake: "treats a living enclosure as frozen storage"}
      - {text: "Seed storage", mistake: "treats a living animal enclosure as a seed store"}
    explanation: "A sanctuary near the natural range protects animals in or near their natural habitat, which makes it in situ conservation. Ex situ methods move the species out of its habitat."
    hints:
      - "Consider whether the animals remain near their natural range."
      - "Think about the difference between protecting a place and moving a population out of it."
      - "Ask whether the animals are kept in the environment they normally live in."
    diagram: null
    confidence: "high"
  - topic: "conservation_strategies"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A rare plant has only a few wild populations, and its habitat is being drained. Which combined approach would be most sensible?"
    correct: "Protect the remaining wild sites and store seeds in a gene bank"
    unit: ""
    wrong:
      - {text: "Only store seeds and abandon the wild sites", mistake: "gives up in situ protection of the species"}
      - {text: "Grow it in a single greenhouse and do nothing else", mistake: "assumes one method covers all risks"}
      - {text: "Remove the plant from the wild to make room for crops", mistake: "treats removal from the wild as a conservation step"}
    explanation: "Protecting the wild sites keeps the species evolving in place, while seed storage guards against further loss. Using both approaches covers different risks."
    hints:
      - "Think about combining protection in place with storage elsewhere."
      - "Consider how each approach covers a different kind of risk."
      - "Ask which option uses both in situ and ex situ methods."
    diagram: null
    confidence: "high"
