items:
  - topic: "biodiversity_patterns"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which level of biodiversity refers to the variety of species within a region?"
    correct: "Species diversity"
    unit: ""
    wrong:
      - {text: "Genetic diversity", mistake: "uses the level of variation within a species for the species count"}
      - {text: "Ecosystem diversity", mistake: "uses the level of habitats for the count of species"}
      - {text: "Cultural diversity", mistake: "treats human cultural variety as an ecological level"}
    explanation: "Species diversity counts the number and relative abundance of different species in a region. Genetic diversity concerns variation within species, and ecosystem diversity concerns habitats."
    hints:
      - "Think about counting the kinds of organisms present."
      - "Consider the level that sits between genes and ecosystems."
      - "Separate variation within a species from the count of species."
    diagram: null
    confidence: "high"
  - topic: "biodiversity_patterns"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What is the latitudinal gradient in species richness?"
    correct: "Species richness generally increases toward the tropics"
    unit: ""
    wrong:
      - {text: "Species richness increases toward the poles", mistake: "reverses the direction of the gradient"}
      - {text: "Species richness is uniform everywhere", mistake: "assumes richness does not vary with latitude"}
      - {text: "Only deserts show high species richness", mistake: "assigns high richness to the driest regions"}
    explanation: "Most groups of organisms are richer near the equator, where warm and stable climates and high productivity support more species. Richness declines toward the poles."
    hints:
      - "Think about how species numbers change from the poles to the equator."
      - "Consider which climate tends to support the most species."
      - "Ask which direction of the gradient fits warm and productive regions."
    diagram: null
    confidence: "high"
  - topic: "biodiversity_patterns"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "A survey finds 80 species in an area, and 20 of them are endemic. What percentage of the species are endemic? Give the number only."
    correct: "25"
    unit: "%"
    wrong: []
    explanation: "Twenty out of 80 species is one quarter, which is 25 percent endemic."
    hints:
      - "Divide the endemic count by the total number of species."
      - "Multiply the result by one hundred."
      - "Check that the percentage is a share of the total species."
    diagram: null
    confidence: "high"
  - topic: "biodiversity_patterns"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "On a graph of species number against island area, which pattern is most typical?"
    correct: "Species number rises with area, at a decreasing rate"
    unit: ""
    wrong:
      - {text: "Species number falls as island area grows", mistake: "reverses the species area relationship"}
      - {text: "Species number is independent of area", mistake: "assumes area has no effect on the number of species"}
      - {text: "Species number rises linearly without any limit", mistake: "assumes the rise continues at a constant rate forever"}
    explanation: "Larger areas hold more habitats and more species, but each extra unit of area adds fewer new species, so the curve bends and levels off. This is the species area relationship."
    hints:
      - "Think about whether a larger area holds more kinds of habitat."
      - "Consider whether the curve bends as the area grows."
      - "Ask whether each added area gives the same number of new species."
    diagram: "Draw a plot of species number on the vertical axis against island area on the horizontal axis, with a curve rising and levelling off."
    confidence: "high"
  - topic: "biodiversity_patterns"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A region has many species but little genetic variation within each species. Which concern follows?"
    correct: "Low genetic diversity may reduce the ability to adapt to change"
    unit: ""
    wrong:
      - {text: "Species are now immune to disease", mistake: "assumes low variation brings immunity"}
      - {text: "Genetic diversity is at its maximum", mistake: "reverses the meaning of low variation"}
      - {text: "Ecosystem diversity is irrelevant to the species", mistake: "dismisses the habitat level of diversity"}
    explanation: "Populations with little genetic variation have fewer options when conditions change, such as new diseases or a warmer climate. Species richness alone does not capture this risk."
    hints:
      - "Think about what variation allows populations to respond to new conditions."
      - "Consider the link between genes within a species and its resilience."
      - "Ask what a population can do when a new disease appears if all its members are alike."
    diagram: null
    confidence: "high"
  - topic: "biodiversity_patterns"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "Area A has 240 species and area B has 60 species. How many times more species does area A have than area B? Give the number only."
    correct: "4"
    unit: ""
    wrong: []
    explanation: "Dividing 240 by 60 gives 4, so area A has four times as many species."
    hints:
      - "Divide the larger count by the smaller count."
      - "Keep the answer as a multiple, not a percentage."
      - "Check that the answer is greater than one."
    diagram: "Draw two regions of different sizes with species points marked, labelling the species counts for each region."
    confidence: "high"
  - topic: "loss_of_biodiversity"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which factor is the most important cause of biodiversity loss worldwide?"
    correct: "Habitat destruction"
    unit: ""
    wrong:
      - {text: "Natural volcanic eruptions only", mistake: "treats rare natural events as the main cause of loss"}
      - {text: "Growth of native forests", mistake: "treats forest growth as a driver of loss"}
      - {text: "Introduction of native species", mistake: "confuses native species with invasive ones"}
    explanation: "Destroying, fragmenting and degrading habitats removes the places species need, and it is the leading driver of biodiversity loss. Invasive species, pollution, overexploitation and climate change also contribute."
    hints:
      - "Think about what most often removes the places where species live."
      - "Consider the change in land use that leads to the loss of species."
      - "Ask which human activity most often removes habitat."
    diagram: null
    confidence: "high"
  - topic: "loss_of_biodiversity"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What does an invasive alien species typically do in a new area?"
    correct: "It outcompetes native species and disrupts local food webs"
    unit: ""
    wrong:
      - {text: "It always increases native species richness", mistake: "assumes new species always add to native richness"}
      - {text: "It remains harmless to native species", mistake: "assumes new species never affect natives"}
      - {text: "It affects only pest species", mistake: "limits the effect of invaders to pests"}
    explanation: "Invasive alien species without natural predators or competitors can spread quickly and displace native species, which alters the food web. This is a major cause of local extinctions."
    hints:
      - "Think about how new species compete for resources with native ones."
      - "Consider the effect on the food web when a new species spreads."
      - "Ask what happens to natives when a species has no natural controls in the area."
    diagram: null
    confidence: "high"
  - topic: "loss_of_biodiversity"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "A habitat of 500 hectares loses 15 percent of its area to clearance. How many hectares remain? Give the number only."
    correct: "425"
    unit: "hectares"
    wrong: []
    explanation: "Fifteen percent of 500 hectares is 75 hectares, which leaves 425 hectares."
    hints:
      - "Find the area lost by applying the percentage to the total."
      - "Subtract the lost area from the original area."
      - "Check that the unit is hectares."
    diagram: null
    confidence: "high"
  - topic: "loss_of_biodiversity"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "What is a biodiversity hotspot?"
    correct: "A region with high endemic species richness that is under threat"
    unit: ""
    wrong:
      - {text: "A region with the highest total number of species of any kind", mistake: "ignores endemism and the threat level"}
      - {text: "An area with no species at all", mistake: "reverses the meaning of a biodiversity hotspot"}
      - {text: "A desert with no plant life", mistake: "assigns a barren area the hotspot label"}
    explanation: "A hotspot holds many species found nowhere else and has lost most of its original habitat. Both high endemism and threat must be present for an area to qualify."
    hints:
      - "Think about endemism and threat together."
      - "Consider whether the area is rich in species found nowhere else and under pressure."
      - "Separate total species counts from endemism and threat."
    diagram: null
    confidence: "high"
  - topic: "loss_of_biodiversity"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "An area is rich in endemic species but has little legal protection. Which action is most useful?"
    correct: "Establishing protected areas that cover the endemic habitat"
    unit: ""
    wrong:
      - {text: "Introducing a new exotic species to add diversity", mistake: "assumes adding species always increases diversity"}
      - {text: "Clearing more forest to expand agriculture", mistake: "treats habitat loss as a way to protect species"}
      - {text: "Reducing monitoring because the area is important", mistake: "assumes importance removes the need for oversight"}
    explanation: "Legal protection of the habitat keeps the endemic species in place, which addresses the main threat. Introducing exotic species or clearing habitat would increase the threat."
    hints:
      - "Think about tools that protect habitats directly."
      - "Consider which action keeps the endemic species in their home habitat."
      - "Ask which option removes the main threat to the species."
    diagram: null
    confidence: "high"
