items:
  - topic: "population_control"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which contraceptive method works by physically blocking sperm from reaching the egg?"
    correct: "Condom"
    unit: ""
    wrong:
      - {text: "Oral pill", mistake: "treats hormonal methods as physical barriers"}
      - {text: "Intrauterine device", mistake: "groups a device that acts inside the uterus with barriers"}
      - {text: "Tubectomy", mistake: "considers a surgical method to be a barrier method"}
    explanation: "A condom is a barrier method worn over the penis, and it stops sperm from entering the female tract. Hormonal and surgical methods work by other mechanisms."
    hints:
      - "Think of a method that covers the penis or the cervix."
      - "The method is worn or placed at the time of intercourse."
      - "Barrier methods do not involve hormones."
    diagram: null
    confidence: "high"
  - topic: "population_control"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which contraceptive method is generally considered permanent?"
    correct: "Vasectomy"
    unit: ""
    wrong:
      - {text: "Copper-T", mistake: "treats a reversible device as a permanent method"}
      - {text: "Lactational amenorrhoea", mistake: "treats a temporary natural pattern as permanent"}
      - {text: "Withdrawal method", mistake: "confuses a behavioural method with a surgical one"}
    explanation: "Vasectomy is a surgical procedure that cuts or seals the vas deferens and is usually considered permanent. The other methods are reversible or temporary."
    hints:
      - "Consider surgical options rather than devices or natural methods."
      - "Think about the male duct that is cut or tied in the procedure."
      - "The procedure is done on the male side of the tract."
    diagram: null
    confidence: "high"
  - topic: "population_control"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "A contraceptive method has a failure rate of 2 pregnancies per 100 woman-years of use. How many pregnancies are expected among 250 woman-years of use? Give the number only."
    correct: "5"
    unit: ""
    wrong: []
    explanation: "A rate of 2 per 100 is 0.02 per woman-year, and 250 times 0.02 equals 5 expected pregnancies."
    hints:
      - "Convert the rate into pregnancies per woman-year."
      - "Multiply the rate by the total woman-years of use."
      - "Check that the expected count is a small number."
    diagram: null
    confidence: "high"
  - topic: "population_control"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which pairing correctly matches a natural family planning method with its basis?"
    correct: "Calendar method: avoiding intercourse during the fertile window"
    unit: ""
    wrong:
      - {text: "Withdrawal: using a hormone to stop ovulation", mistake: "confuses a behavioural method with a hormonal one"}
      - {text: "Barrier: using a copper coil to block sperm", mistake: "groups a device with barrier methods"}
      - {text: "Surgery: blocking hormone release in the uterus", mistake: "mixes sterilisation with hormonal control"}
    explanation: "The calendar method relies on tracking the cycle and avoiding intercourse around the days when conception is most likely. The other pairings mix up the basis of the methods."
    hints:
      - "Think about which days in a cycle are most likely for conception."
      - "Consider whether a method changes hormone levels or changes behaviour."
      - "Focus on the mechanism rather than the name of the method."
    diagram: null
    confidence: "high"
  - topic: "population_control"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A person wants reliable protection and cannot manage a daily routine. Which method suits this need best?"
    correct: "A long-acting implant placed under the skin"
    unit: ""
    wrong:
      - {text: "A daily oral pill taken at the same time", mistake: "ignores that a daily pill depends on routine"}
      - {text: "A condom used at each intercourse", mistake: "treats per-act use as equal in reliability to a set and forget method"}
      - {text: "Withdrawal used when remembered", mistake: "treats an unreliable behaviour as dependable"}
    explanation: "A long-acting implant releases hormones for an extended period after a single placement, so it needs no daily action. The other choices all depend on routine or consistent behaviour."
    hints:
      - "Consider which method needs no daily action from the user."
      - "Think about how long a single placement can last."
      - "Weigh the need for routine against the level of reliability."
    diagram: null
    confidence: "medium"
  - topic: "population_control"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A method has a 0.5 percent annual failure rate and is used by 200 women. How many failures are expected per year? Give the count only."
    correct: "1"
    unit: ""
    wrong: []
    explanation: "Half a percent of 200 women is 1 expected failure per year."
    hints:
      - "Convert the percentage into a decimal fraction."
      - "Multiply the fraction by the number of users."
      - "Check that the expected count is per year."
    diagram: null
    confidence: "high"
  - topic: "sti_and_infertility"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which sexually transmitted infection is caused by a bacterium and responds to antibiotics?"
    correct: "Syphilis"
    unit: ""
    wrong:
      - {text: "Genital herpes", mistake: "treats a viral infection as bacterial"}
      - {text: "AIDS", mistake: "assumes all sexually transmitted infections are bacterial"}
      - {text: "Genital warts", mistake: "confuses a viral infection with a bacterial one"}
    explanation: "Syphilis is caused by a bacterium, Treponema pallidum, and is treated with antibiotics. Herpes, warts and HIV infection are caused by viruses."
    hints:
      - "Think about the type of organism that antibiotics target."
      - "Consider which of these infections is caused by a viral pathogen."
      - "Recall which group of sexually transmitted infections responds to antibiotics."
    diagram: null
    confidence: "high"
  - topic: "sti_and_infertility"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What causes AIDS?"
    correct: "A retrovirus that attacks helper T cells"
    unit: ""
    wrong:
      - {text: "A bacterium that releases toxins into the blood", mistake: "applies a bacterial cause to a viral disease"}
      - {text: "A protozoan that enters red blood cells", mistake: "copies the cause of malaria onto an immune disease"}
      - {text: "A fungus that spreads through the genital tract", mistake: "assumes fungi are the usual cause of sexually transmitted infections"}
    explanation: "HIV is a retrovirus that infects and destroys helper T cells, weakening the immune system and leading to AIDS. None of the other pathogens described cause this disease."
    hints:
      - "Think about which pathogen group needs host cells to multiply."
      - "Consider which immune cells the infection targets."
      - "Consider how the pathogen's genetic material is copied inside host cells."
    diagram: null
    confidence: "high"
  - topic: "sti_and_infertility"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which assisted reproduction technique transfers unfertilised gametes into the fallopian tube?"
    correct: "GIFT"
    unit: ""
    wrong:
      - {text: "IVF", mistake: "assumes the embryo is always placed in the tube rather than the uterus"}
      - {text: "ICSI", mistake: "treats injection of a single sperm as a transfer into the tube"}
      - {text: "AI", mistake: "assumes donor insemination places gametes into the tube"}
    explanation: "GIFT, or gamete intrafallopian transfer, places eggs and sperm into the fallopian tube so that fertilisation occurs inside the body. IVF fertilises outside the body and transfers the embryo to the uterus."
    hints:
      - "Think about where the gametes are placed rather than where fertilisation is done in a dish."
      - "The technique transfers gametes, not embryos, into the tube."
      - "Compare the options by where the gametes are placed."
    diagram: null
    confidence: "high"
  - topic: "sti_and_infertility"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "In which assisted reproduction method is a single sperm injected directly into an egg?"
    correct: "ICSI"
    unit: ""
    wrong:
      - {text: "IUI", mistake: "uses washed sperm placed in the uterus instead of direct injection"}
      - {text: "ZIFT", mistake: "places zygotes in the tube rather than injecting sperm into the egg"}
      - {text: "Surrogacy", mistake: "treats carrying a pregnancy for another person as a fertilisation technique"}
    explanation: "Intracytoplasmic sperm injection places one sperm directly inside an egg, which helps when sperm count or motility is very low. The other options describe different procedures or arrangements."
    hints:
      - "Think about a technique that works at the single cell level."
      - "Consider the method used when sperm numbers are very low."
      - "Compare which steps involve fertilisation in a dish."
    diagram: null
    confidence: "high"
  - topic: "sti_and_infertility"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A woman has a blocked fallopian tube and seeks assisted conception. Which approach avoids needing a working tube for fertilisation?"
    correct: "In vitro fertilisation with uterine embryo transfer"
    unit: ""
    wrong:
      - {text: "GIFT", mistake: "assumes gamete transfer into the tube works with a blocked tube"}
      - {text: "ZIFT", mistake: "places zygotes into the blocked tube"}
      - {text: "Surgical reconnection of the tube with no other help", mistake: "assumes surgery is always the first choice"}
    explanation: "In vitro fertilisation fertilises the egg in a dish and transfers the embryo into the uterus, so the tube is bypassed. GIFT and ZIFT both rely on the tube."
    hints:
      - "Think about where fertilisation happens in each option."
      - "Consider which approach skips the tube entirely."
      - "Check which options put the gametes or zygote into the tube."
    diagram: null
    confidence: "high"
  - topic: "sti_and_infertility"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A test has 99 percent sensitivity. Among 300 infected people tested, how many would be expected to test positive? Give the count only."
    correct: "297"
    unit: ""
    wrong: []
    explanation: "Ninety-nine percent of 300 is 297 people who test positive."
    hints:
      - "Convert the percentage into a decimal."
      - "Multiply the number of infected people by that decimal."
      - "Check that the answer is less than the total tested."
    diagram: null
    confidence: "high"
