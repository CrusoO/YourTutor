items:
  - topic: "plant_breeding"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which step in plant breeding brings two selected parents together to combine their desirable traits?"
    correct: "Hybridisation"
    unit: ""
    wrong:
      - {text: "Mutation induction", mistake: "confuses induced variation with the crossing step"}
      - {text: "Tissue culture", mistake: "assumes micropropagation is a crossing method"}
      - {text: "Pasteurisation", mistake: "picks a food preservation process for a breeding step"}
    explanation: "Hybridisation crosses two selected parental lines so that their favourable traits combine in the offspring. The later steps select the best offspring."
    hints:
      - "Think about the step that brings two parental lines together."
      - "Consider the step that produces offspring carrying the desired traits."
      - "Separate crossing from induced variation and cloning."
    diagram: null
    confidence: "high"
  - topic: "plant_breeding"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Why are hybrid crop varieties often higher yielding than their parents?"
    correct: "Heterosis, where the cross combines favourable traits and vigour"
    unit: ""
    wrong:
      - {text: "They are always polyploid", mistake: "assumes hybrid vigour always comes from extra chromosome sets"}
      - {text: "They breed true for every trait", mistake: "assumes hybrids are pure lines for all traits"}
      - {text: "They lack all genetic variation", mistake: "assumes a hybrid is uniform in every way"}
    explanation: "Crossing two distinct lines often gives heterosis, a boost in vigour and yield in the first generation. Seed from these hybrids does not breed true, which is why farmers buy fresh seed each season."
    hints:
      - "Think about what happens when two different lines are crossed."
      - "Consider whether hybrid offspring stay uniform in the next generation."
      - "Ask which option describes the boost in vigour seen in the first cross."
    diagram: null
    confidence: "high"
  - topic: "plant_breeding"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "Two traits are each controlled by one dominant allele that assorts independently. In an F2 generation of 160 plants, how many show both dominant traits? Give the count only."
    correct: "90"
    unit: ""
    wrong: []
    explanation: "Nine of every sixteen F2 plants show both dominant traits, and nine sixteenths of 160 is 90."
    hints:
      - "Find the fraction showing dominance for each trait separately."
      - "Multiply the two fractions and apply the result to the total."
      - "Check that the answer is a whole number of plants."
    diagram: null
    confidence: "high"
  - topic: "plant_breeding"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which technique produces many genetically identical plants quickly from a single parent plant?"
    correct: "Micropropagation"
    unit: ""
    wrong:
      - {text: "Hybridisation", mistake: "assumes crossing gives identical plants"}
      - {text: "Mutagenesis", mistake: "treats random mutation as a way to clone plants uniformly"}
      - {text: "Cross-pollination by bees", mistake: "assumes pollinators produce clones"}
    explanation: "Micropropagation grows small pieces of tissue on nutrient medium to give many clonal plantlets. This preserves the parent's genotype, unlike crossing, which creates new combinations."
    hints:
      - "Think about culturing small pieces of tissue on a nutrient medium."
      - "Consider a method that gives clones rather than new combinations."
      - "Separate cloning from crossing or mutation."
    diagram: null
    confidence: "high"
  - topic: "plant_breeding"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A breeder wants resistance to a disease found only in a wild relative of the crop. Which approach is most suitable?"
    correct: "Crossing the crop with the wild relative and selecting resistant progeny"
    unit: ""
    wrong:
      - {text: "Growing the crop in sterile soil only", mistake: "treats an environmental change as a genetic one"}
      - {text: "Using only clones of the crop", mistake: "assumes cloning brings in new resistance genes"}
      - {text: "Applying an antibiotic to kill the disease", mistake: "treats a plant disease as a bacterial infection"}
    explanation: "Crossing transfers the resistance gene from the wild relative into the crop, and selection among the progeny keeps the plants that carry it. Clones or environmental changes cannot add a new gene."
    hints:
      - "Think about how to move a gene from a relative into the crop."
      - "Consider how selection works on the offspring."
      - "Ask which option introduces new genetic material into the crop."
    diagram: null
    confidence: "high"
  - topic: "plant_breeding"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A breeder selects 12 plants from 240 F2 offspring that show the trait. What percentage was selected? Give the number only."
    correct: "5"
    unit: "%"
    wrong: []
    explanation: "Twelve out of 240 is 0.05, which is 5 percent."
    hints:
      - "Divide the selected count by the total number of offspring."
      - "Multiply the fraction by one hundred."
      - "Check that the percentage is a small value."
    diagram: null
    confidence: "high"
  - topic: "animal_breeding_poultry_fish"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What is outbreeding in animal husbandry?"
    correct: "Mating animals that are not closely related"
    unit: ""
    wrong:
      - {text: "Mating close relatives to fix traits", mistake: "confuses outbreeding with inbreeding"}
      - {text: "Mating only within one breed", mistake: "treats breed purity as outbreeding"}
      - {text: "Using artificial insemination for every mating", mistake: "confuses a technique with a breeding strategy"}
    explanation: "Outbreeding pairs animals that are unrelated or distantly related, which increases heterozygosity and often vigour. Inbreeding pairs close relatives instead."
    hints:
      - "Think about how closely related the mates are."
      - "Consider how genetically distant parents affect vigour in offspring."
      - "Separate the relationship between mates from the method of mating."
    diagram: null
    confidence: "high"
  - topic: "animal_breeding_poultry_fish"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Why is inbreeding used in some animal breeding programmes?"
    correct: "To fix desirable traits in pure lines, even though vigour falls"
    unit: ""
    wrong:
      - {text: "To increase heterosis in the first generation", mistake: "reverses the vigour effect of close mating"}
      - {text: "To create many genetic variants quickly", mistake: "assumes close mating increases variation"}
      - {text: "To reduce the time to sexual maturity", mistake: "links a breeding method to a development timing"}
    explanation: "Close mating makes animals homozygous, which fixes the desired traits in a pure line. The cost is reduced vigour and fitness, which is why outbreeding is used to restore it."
    hints:
      - "Think about what happens to genetic diversity when relatives mate."
      - "Consider the trade-off between uniformity and vigour."
      - "Ask whether close mating makes animals more or less uniform."
    diagram: null
    confidence: "high"
