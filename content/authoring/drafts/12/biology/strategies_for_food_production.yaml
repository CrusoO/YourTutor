    explanation: "1200 hens times 240 eggs each gives 288000 eggs per year."
    hints:
      - "Multiply the number of hens by the eggs laid by each hen."
      - "Keep the answer as a plain count of eggs."
      - "Check that the result is in the hundreds of thousands."
