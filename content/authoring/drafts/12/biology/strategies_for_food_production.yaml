  - topic: "single_cell_protein"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "An apiculture operation wants to improve pollination of nearby crops. Which action is most suitable?"
    correct: "Placing hives near the crop fields during flowering"
    unit: ""
    wrong:
      - {text: "Removing all flowers near the hives", mistake: "reverses the goal by removing the nectar sources bees need"}
      - {text: "Keeping hives sealed until harvest", mistake: "stops bees from reaching the crop during flowering"}
      - {text: "Spraying insecticide inside the hive", mistake: "treats an insecticide as a pollinator aid"}
    explanation: "Bees forage on flowers near their hive, so placing hives close to the crop during flowering raises pollination. Actions that remove flowers or harm bees work against the goal."
    hints:
      - "Think about where bees need to forage."
      - "Consider the timing of flowering relative to the hive location."
      - "Ask which option brings the pollinators to the flowers when they bloom."
    diagram: null
    confidence: "high"
