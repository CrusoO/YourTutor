  - topic: "animal_breeding_poultry_fish"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which poultry approach aims to increase egg yield rather than meat?"
    correct: "Selecting layer breeds for high egg count"
    unit: ""
    wrong:
      - {text: "Selecting broiler breeds for rapid weight gain", mistake: "uses a meat breed for an egg target"}
      - {text: "Using dual-purpose birds only for meat", mistake: "assumes a dual-purpose bird is chosen for meat alone"}
      - {text: "Cross-breeding with a wild pheasant", mistake: "treats a wild species cross as a route to higher egg yield"}
    explanation: "Layer breeds are selected for high egg production, while broilers are selected for fast meat growth. Matching the breed to the product is the main principle."
    hints:
      - "Think about the trait that a layer bird is selected for."
      - "Consider the breed type used for eggs rather than meat."
      - "Separate meat breeds from egg breeds."
    diagram: null
    confidence: "high"
  - topic: "animal_breeding_poultry_fish"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A fish hatchery wants faster growth in its stock. Which strategy is best suited to this aim?"
    correct: "Selecting fast growing lines and breeding them over several generations"
    unit: ""
    wrong:
      - {text: "Raising fish in dark tanks", mistake: "treats light as a growth factor for fish"}
      - {text: "Feeding fish only once a month", mistake: "reverses the feeding needs that support growth"}
      - {text: "Keeping fish in very cold water only", mistake: "assumes cold water raises growth rate"}
    explanation: "Repeated selection of the fastest growing lines shifts the population toward faster growth over generations. Environmental changes such as light or feed alone do not alter the inherited growth potential."
    hints:
      - "Think about a selection method that is repeated across generations."
      - "Consider which trait the breeding goal targets."
      - "Ask whether the change is genetic or only environmental."
    diagram: null
    confidence: "high"
