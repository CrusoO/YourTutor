    difficulty: "medium"
    role: "procedure"
    stem: "A fish farm holds 500 fish, and 40 percent of them are females. How many females are there? Give the count only."
    correct: "200"
    unit: ""
    wrong: []
    explanation: "Forty percent of 500 is 200 females."
    hints:
      - "Convert the percentage into a fraction."
      - "Multiply that fraction by the total count."
      - "Check that the answer is a count of fish."
    diagram: null
