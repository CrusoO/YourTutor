  - topic: "single_cell_protein"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which photosynthetic microbe is commonly grown as a source of single cell protein?"
    correct: "Spirulina"
    unit: ""
    wrong:
      - {text: "Lactobacillus", mistake: "assumes a fermenting bacterium is a protein source"}
      - {text: "Penicillium", mistake: "confuses an antibiotic producing fungus with a protein source"}
      - {text: "Methanogenic archaea", mistake: "assumes gas producing microbes are used for protein"}
    explanation: "Spirulina is a cyanobacterium that is grown in ponds and harvested as a protein rich biomass. The other microbes are used for different purposes."
    hints:
      - "Think about a photosynthetic microbe sold as a food supplement."
      - "Consider a blue green microbe that is grown in ponds."
      - "Separate fermenting microbes from photosynthetic ones."
    diagram: null
    confidence: "high"
  - topic: "single_cell_protein"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What makes single cell protein a useful food source?"
    correct: "Microbes grow quickly and yield protein rich biomass"
    unit: ""
    wrong:
      - {text: "Microbes contain no protein at all", mistake: "assumes microbial cells have no protein"}
      - {text: "Microbes produce fat but no protein", mistake: "confuses single cell protein with lipid production"}
      - {text: "Microbes provide only sugar and no other nutrients", mistake: "limits microbial biomass to sugar"}
    explanation: "Microbes multiply in hours and can be grown on cheap substrates, producing biomass with a high protein content. This makes them efficient food sources."
    hints:
      - "Think about how quickly microbes can multiply."
      - "Consider the nutrient content of microbial cells."
      - "Compare the output of microbes with that of larger crops."
    diagram: null
    confidence: "high"
