  - topic: "single_cell_protein"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which product from honeybees is used as a health supplement and comes from worker bee glands?"
    correct: "Royal jelly"
    unit: ""
    wrong:
      - {text: "Beeswax", mistake: "treats structural wax as a nutrient"}
      - {text: "Silk", mistake: "confuses insect silk with a bee product"}
      - {text: "Shellac", mistake: "uses a resin from lac insects for a bee product"}
    explanation: "Royal jelly is secreted by glands in worker bees to feed larvae and is sold as a supplement. Beeswax is a structural material, and shellac comes from lac insects rather than honeybees."
    hints:
      - "Think about a secretion that worker bees make to feed larvae."
      - "Consider a product from the glands of worker bees."
      - "Separate structural materials from secretions."
