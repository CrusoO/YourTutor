  - topic: "mendels_laws"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which law states that the two alleles of a gene separate into different gametes during gamete formation?"
    correct: "Law of segregation"
    unit: ""
    wrong:
      - {text: "Law of independent assortment", mistake: "uses the rule for two gene pairs to describe a single pair"}
      - {text: "Law of dominance", mistake: "treats which trait appears as the rule for separation"}
      - {text: "Law of linkage", mistake: "assumes linked genes always separate in every gamete"}
    explanation: "The law of segregation says each gamete receives only one allele of each gene, because the pair separates during meiosis. Independent assortment concerns different gene pairs."
    hints:
      - "Think about what happens to the two copies of a gene during meiosis."
      - "This law describes the split of allele pairs into different gametes."
      - "Compare with the law that deals with two different gene pairs."
