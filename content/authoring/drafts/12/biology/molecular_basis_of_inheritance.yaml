  - topic: "dna_replication"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "In a replication bubble, which enzyme adds nucleotides to the 3-prime end of a growing strand?"
    correct: "DNA polymerase"
    unit: ""
    wrong:
      - {text: "Primase", mistake: "assigns the primer-making role to the chain-building enzyme"}
      - {text: "DNA gyrase", mistake: "confuses supercoil relief with chain growth"}
      - {text: "Reverse transcriptase", mistake: "uses a viral enzyme for bacterial replication"}
    explanation: "DNA polymerase adds deoxyribonucleotides to the 3-prime end of a primed strand, so the new strand grows in the 5-prime to 3-prime direction. Primase only makes the short RNA primer."
    hints:
      - "Think about which enzyme requires a primer to start."
      - "Focus on the enzyme that extends the chain in the 5-prime to 3-prime direction."
      - "Ask which enzyme is the main builder of new DNA."
    diagram: "Draw a replication fork with helicase, leading and lagging strands, Okazaki fragments, primase and DNA ligase labelled, and mark the 5-prime and 3-prime ends on each strand."
    confidence: "high"
  - topic: "dna_replication"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A mutant cell lacks active DNA ligase. Which product is most likely to accumulate during replication?"
    correct: "Unjoined Okazaki fragments on the lagging strand"
    unit: ""
    wrong:
      - {text: "Unwound single strands at the leading strand only", mistake: "assigns the unwinding role to ligase"}
      - {text: "Extra supercoiling ahead of the fork", mistake: "confuses ligase with the enzyme that relieves supercoiling"}
      - {text: "Complete double strands with no nicks", mistake: "assumes ligase is not needed for finished DNA"}
    explanation: "Without ligase the short Okazaki fragments on the lagging strand cannot be sealed, so nicks remain. The leading strand is made continuously and does not need ligation as often."
    hints:
      - "Think about which step seals the gaps between newly made pieces."
      - "Consider which strand is made in pieces."
      - "Look at the strand that needs many joins."
    diagram: null
    confidence: "high"
  - topic: "dna_replication"
    type: "numeric"
    difficulty: "hard"
