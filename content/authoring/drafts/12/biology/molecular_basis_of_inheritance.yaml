  - topic: "dna_structure_packaging"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "In a labelled nucleosome diagram, how many histone protein molecules form the core that DNA wraps around?"
    correct: "Eight histone proteins, two each of H2A, H2B, H3 and H4"
    unit: ""
    wrong:
      - {text: "Four histone proteins, one of each type", mistake: "counts one copy per histone type instead of two"}
      - {text: "Two histone proteins", mistake: "counts only one pair of the core histones"}
      - {text: "Twelve histone proteins including the linker", mistake: "adds the linker histone to the core count"}
    explanation: "The nucleosome core is an octamer made of two copies each of H2A, H2B, H3 and H4, giving eight histone molecules. The linker histone H1 sits outside the core and is not counted in the octamer."
    hints:
      - "Count how many histone types form the core."
      - "Each core histone type appears in pairs within the core."
      - "Think about the symmetric pairing of the core."
    diagram: "Draw a nucleosome as a disc-shaped histone core with DNA wrapping around it in about two turns, with linker DNA extending out, and label the core and linker."
    confidence: "high"
  - topic: "dna_structure_packaging"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Chromatin in a cell is highly condensed, and its genes are poorly expressed. Which change would most likely increase expression of those genes?"
    correct: "Histone acetylation that loosens the packing of chromatin"
    unit: ""
    wrong:
      - {text: "Increased methylation of histone tails that tightens packing", mistake: "assumes methylation always activates genes"}
      - {text: "Addition of extra linker histone H1 to each nucleosome", mistake: "treats more linker histone as opening the chromatin"}
      - {text: "Coiling of DNA into a tighter superhelix", mistake: "confuses tighter coiling with a looser, accessible state"}
    explanation: "Acetylation neutralises the positive charge on histone tails, which weakens their grip on DNA and makes it more accessible. Tighter packing and extra linker histone make the chromatin less accessible."
    hints:
      - "Think about what the positive histone tails do to the negative DNA."
      - "Consider how adding a chemical group to histone tails changes their charge."
      - "Ask which change would make the DNA more accessible to enzymes."
    diagram: null
    confidence: "high"
