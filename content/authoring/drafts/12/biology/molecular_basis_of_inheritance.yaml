  - topic: "dna_replication"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which enzyme unwinds the DNA helix at the replication fork?"
    correct: "Helicase"
    unit: ""
    wrong:
      - {text: "DNA ligase", mistake: "assigns the joining role to the unwinding enzyme"}
      - {text: "RNA polymerase", mistake: "uses the transcription enzyme for replication"}
      - {text: "Topoisomerase", mistake: "assumes every enzyme that relaxes strain also unwinds the helix"}
    explanation: "Helicase breaks hydrogen bonds between base pairs and moves along the fork to separate the strands. Topoisomerase relieves the strain this creates but does not separate the strands."
    hints:
      - "Think about an enzyme that breaks hydrogen bonds between the bases."
      - "The enzyme moves along the fork ahead of the polymerase."
      - "Separate the enzymes that unwind from those that join fragments."
    diagram: null
    confidence: "high"
  - topic: "dna_replication"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which strand is synthesised as short fragments that are later joined?"
    correct: "Lagging strand"
    unit: ""
    wrong:
      - {text: "Leading strand", mistake: "assumes both strands are made continuously"}
      - {text: "Template strand", mistake: "treats the template as a newly made strand"}
      - {text: "Primer strand", mistake: "confuses primers with the fragments of the new strand"}
    explanation: "The lagging strand is made in short Okazaki fragments because polymerase can only extend in one direction, away from the fork. The fragments are then joined by ligase."
    hints:
      - "Consider which strand is made in the direction away from the fork."
      - "Think about which strand must be made in the opposite orientation to the fork."
      - "Separate the strand made continuously from the strand made in pieces."
    diagram: null
    confidence: "high"
