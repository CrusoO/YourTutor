  - topic: "dna_structure_packaging"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What is the role of histone proteins in chromatin?"
    correct: "They wrap DNA into nucleosome units to compact it"
    unit: ""
    wrong:
      - {text: "They copy DNA during replication", mistake: "assigns the copying role to packaging proteins"}
      - {text: "They cut DNA at specific sites", mistake: "confuses packaging proteins with restriction enzymes"}
      - {text: "They carry amino acids to ribosomes", mistake: "swaps histones for the adaptor molecules of translation"}
    explanation: "Histones are basic proteins around which DNA wraps to form nucleosomes, which compact the long molecule into the nucleus. They do not copy or cut DNA."
    hints:
      - "Think about how a very long molecule fits inside a small nucleus."
      - "Consider which proteins are positively charged and bind the negatively charged DNA."
      - "Compare the role with the enzymes that make copies of DNA."
