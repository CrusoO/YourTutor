items:
  - topic: "organism_environment"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which of the following is an abiotic factor in a pond?"
    correct: "Dissolved oxygen concentration"
    unit: ""
    wrong:
      - {text: "Predatory fish", mistake: "treats living predators as abiotic"}
      - {text: "Parasitic worm load", mistake: "treats living parasites as abiotic"}
      - {text: "Pollinator visits to aquatic plants", mistake: "treats living pollinators as abiotic"}
    explanation: "Dissolved oxygen is a non-living chemical factor that shapes which organisms can live in the pond. The other options involve living organisms and are biotic."
    hints:
      - "Think about non-living components of the environment."
      - "Consider which option does not involve other living things."
      - "Separate chemical and physical conditions from living neighbours."
    diagram: null
    confidence: "high"
  - topic: "organism_environment"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "How does temperature affect the distribution of organisms?"
    correct: "It shapes enzyme activity and metabolic rates, which limit where species can survive"
    unit: ""
    wrong:
      - {text: "It has no effect on organisms", mistake: "assumes organisms are unaffected by heat or cold"}
      - {text: "It only affects plants", mistake: "limits temperature effects to one kingdom"}
      - {text: "It determines the genetic code", mistake: "confuses an environmental factor with a molecular code"}
    explanation: "Temperature changes the speed of enzyme reactions and metabolic processes, so each species has a range it can tolerate. This range helps determine where it lives."
    hints:
      - "Think about how heat changes the speed of chemical reactions."
      - "Consider what limits the geographic range of a species."
      - "Focus on how the environment limits the metabolism of organisms."
    diagram: null
    confidence: "high"
  - topic: "organism_environment"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which adaptation helps a desert plant conserve water?"
    correct: "A thick waxy cuticle and reduced leaf surface"
    unit: ""
    wrong:
      - {text: "Large broad leaves for shade", mistake: "assumes large leaves reduce water loss"}
      - {text: "Constantly shallow roots", mistake: "assumes shallow roots improve water conservation"}
      - {text: "Continuous flowering with thin stems", mistake: "links flowering pattern with water saving"}
    explanation: "A waxy cuticle and small leaves reduce transpiration from the surface, which saves water in dry conditions. Broad leaves and shallow roots increase water loss or access the wrong water."
    hints:
      - "Think about how the plant reduces water loss from its surface."
      - "Consider a feature that limits evaporation from the leaves."
      - "Separate structural features that conserve water from those that increase its loss."
    diagram: null
    confidence: "high"
  - topic: "organism_environment"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which adaptation helps an aquatic animal obtain oxygen from water with low oxygen levels?"
    correct: "Gills with a large surface area for gas exchange"
    unit: ""
    wrong:
      - {text: "Lungs that filter water", mistake: "confuses the function of lungs with that of gills"}
      - {text: "Thin unprotected skin only", mistake: "assumes thin skin alone supplies enough oxygen"}
      - {text: "Wings that catch oxygen from the surface", mistake: "assigns a flight organ to gas exchange in water"}
    explanation: "Gills provide a large moist surface where oxygen diffuses from water into blood, and their large area helps when oxygen is scarce. Lungs cannot filter oxygen from water."
    hints:
      - "Think about the organ that exchanges gases with water."
      - "Consider how the surface area of an exchange organ affects oxygen uptake."
      - "Compare how the organ extracts gas from water rather than air."
    diagram: null
    confidence: "high"
  - topic: "organism_environment"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A lake warms because of climate change, and a cold adapted fish species is affected. What is the most likely population response?"
    correct: "Its range shifts toward cooler deeper or higher latitude waters"
    unit: ""
    wrong:
      - {text: "Its range expands into warmer shallow areas only", mistake: "assumes a cold adapted species tolerates heat"}
      - {text: "It stops reproducing completely", mistake: "assumes any temperature change ends reproduction"}
      - {text: "It turns into a different species of plant", mistake: "invents a change of kingdom for an animal"}
    explanation: "A cold adapted species tends to move toward the parts of its habitat that remain within its tolerance, such as deeper or cooler water or higher latitudes. Expansion into warm areas usually fails."
    hints:
      - "Think about where a cold adapted species can persist as temperatures rise."
      - "Consider the direction a population moves to track its preferred temperature."
      - "Ask which option is consistent with a species that tolerates only a narrow range."
    diagram: null
    confidence: "high"
  - topic: "organism_environment"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A species survives only between 10 C and 30 C. What is the width of its tolerance range in degrees Celsius? Give the number only."
    correct: "20"
    unit: "C"
    wrong: []
    explanation: "The width of the tolerance range is 30 minus 10, which is 20 degrees."
    hints:
      - "Subtract the minimum from the maximum."
      - "Check that the unit is degrees Celsius."
      - "Keep the answer as a width, not as either limit."
    diagram: null
    confidence: "high"
  - topic: "population_attributes"
    type: "numeric"
    difficulty: "easy"
    role: "recall"
    stem: "A population of 500 individuals occupies 25 square kilometres. What is its density in individuals per square kilometre? Give the number only."
    correct: "20"
    unit: "individuals per square kilometre"
    wrong: []
    explanation: "Dividing 500 individuals by 25 square kilometres gives a density of 20 individuals per square kilometre."
    hints:
      - "Divide the number of individuals by the area."
      - "Keep the units as individuals per square kilometre."
      - "Check the result is a density, not a total."
    diagram: null
    confidence: "high"
  - topic: "population_attributes"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which factor increases the size of a population most directly?"
    correct: "Natality exceeding mortality"
    unit: ""
    wrong:
      - {text: "Mortality exceeding natality", mistake: "reverses the balance that adds individuals"}
      - {text: "Emigration only", mistake: "assumes leaving the population adds individuals"}
      - {text: "A constant density over time", mistake: "treats a constant density as a source of growth"}
    explanation: "When more individuals are born than die, the population grows, provided there is no large net loss through migration. Emigration removes individuals rather than adding them."
    hints:
      - "Think about what adds new individuals to the population."
      - "Consider which rates appear in the balance of growth."
      - "Separate births and deaths from movement in and out."
    diagram: null
    confidence: "high"
  - topic: "population_attributes"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "A population of 1200 individuals has 150 births and 90 deaths in a year, with no migration. What is the per capita growth rate? Give the number only."
    correct: "0.05"
    unit: ""
    wrong: []
    explanation: "The net change is 150 minus 90, which is 60, and 60 divided by 1200 gives 0.05 per individual per year."
    hints:
      - "Compute the net change from births and deaths first."
      - "Divide the net change by the starting population."
      - "Keep the answer as a rate per individual."
    diagram: null
    confidence: "high"
  - topic: "population_attributes"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "Natality is 40 per 1000 individuals per year and mortality is 25 per 1000 per year. What is the natural increase in individuals per 1000 per year? Give the number only."
    correct: "15"
    unit: "per 1000 per year"
    wrong: []
    explanation: "Natural increase is natality minus mortality, which is 40 minus 25, giving 15 per 1000 per year."
    hints:
      - "Subtract mortality from natality."
      - "Keep the units as per 1000 individuals per year."
      - "Check that the answer is a rate, not a count."
    diagram: null
    confidence: "high"
  - topic: "population_attributes"
    type: "numeric"
    difficulty: "hard"
    role: "transfer"
    stem: "A population starts at 400 with 40 births and 20 deaths in a year. Immigration adds 30 individuals and emigration removes 10. What is the final population? Give the count only."
    correct: "440"
    unit: ""
    wrong: []
    explanation: "400 plus 40 minus 20 plus 30 minus 10 gives 440 individuals at the end of the year."
    hints:
      - "Add every incoming individual and subtract every outgoing one."
      - "Check that each event is counted once."
      - "Keep the answer as a count of individuals."
    diagram: null
    confidence: "high"
  - topic: "population_attributes"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A population of 800 has a birth rate of 0.05 per individual per year and a death rate of 0.03 per individual per year. What is the expected number of births minus deaths in one year? Give the count only."
    correct: "16"
    unit: ""
    wrong: []
    explanation: "The net per capita rate is 0.02, and 0.02 times 800 gives 16 individuals."
    hints:
      - "Compute the net per capita rate first."
      - "Apply the net rate to the starting population."
      - "Keep the answer as a count of individuals."
    diagram: null
    confidence: "high"
  - topic: "population_growth_models"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which growth model assumes unlimited resources and produces a J-shaped curve?"
    correct: "Exponential growth"
    unit: ""
    wrong:
      - {text: "Logistic growth", mistake: "assumes logistic growth has no upper limit"}
      - {text: "Random walk", mistake: "treats random change as a growth model"}
      - {text: "Stable equilibrium", mistake: "assumes a stable population is also growing without limit"}
    explanation: "Exponential growth assumes a constant per capita rate with no limit, which gives a J-shaped curve. Logistic growth flattens near the carrying capacity."
    hints:
      - "Think about growth with a constant per capita rate and no limit."
      - "Consider the shape of the curve that results from unlimited growth."
      - "Separate the models with a limit from those without one."
    diagram: null
    confidence: "high"
  - topic: "population_growth_models"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What determines the carrying capacity K in logistic growth?"
    correct: "The resources and environment that limit the maximum population"
    unit: ""
    wrong:
      - {text: "The initial population size only", mistake: "assumes the starting size sets the upper limit"}
      - {text: "The birth rate alone", mistake: "ignores the environmental limits on population"}
      - {text: "The age of the first individual", mistake: "links the upper limit to age rather than resources"}
    explanation: "Carrying capacity is the largest population the habitat can support over time, set by food, space, water and other limiting resources."
    hints:
      - "Think about what sets the upper limit a habitat can support."
      - "Consider which resources the environment supplies in limited amounts."
      - "Ask what determines the maximum rather than the starting point."
    diagram: null
    confidence: "high"
  - topic: "population_growth_models"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "A population doubles every year in a discrete model. It starts at 100 individuals. How many individuals are present after 4 years? Give the count only."
    correct: "1600"
    unit: ""
    wrong: []
    explanation: "Four doublings of 100 give 100 times 16, which is 1600 individuals."
    hints:
      - "Each year doubles the population."
      - "Apply the doubling four times in turn."
      - "Keep the answer as a count of individuals."
    diagram: null
    confidence: "high"
  - topic: "population_growth_models"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "A logistic population has N equal to 300 and carrying capacity K equal to 1000. What is the value of 1 minus N divided by K? Give the number only."
    correct: "0.7"
    unit: ""
    wrong: []
    explanation: "N divided by K is 0.3, and 1 minus 0.3 is 0.7."
    hints:
      - "Divide the population by the carrying capacity first."
      - "Subtract that ratio from one."
      - "Keep the answer as a decimal fraction."
    diagram: "Sketch a sigmoid logistic curve with a horizontal carrying capacity line K and mark the point where N equals 300."
    confidence: "high"
  - topic: "population_growth_models"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Two populations start at the same size. One follows logistic growth toward K of 500, and the other grows exponentially. What is the key difference after many generations?"
    correct: "The logistic population levels off near K, while the exponential one keeps increasing"
    unit: ""
    wrong:
      - {text: "Both populations level off at the same value", mistake: "assumes the exponential model also has a limit"}
      - {text: "The exponential population declines as it reaches K", mistake: "reverses the trend of the exponential model"}
      - {text: "Both populations grow at equal rates forever", mistake: "assumes the logistic model has no limit"}
    explanation: "The logistic model slows as the population approaches K, so the curve flattens. The exponential model has no limit and keeps rising at an increasing absolute rate."
    hints:
      - "Think about what limits growth in the logistic model."
      - "Consider the long term trend of the exponential model."
      - "Compare how the two curves behave as the population becomes large."
    diagram: "Draw two curves on the same axes: a J-shaped exponential curve rising steeply and a sigmoid logistic curve approaching a horizontal line at K."
    confidence: "high"
  - topic: "population_growth_models"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A logistic population has r equal to 0.5, N equal to 200 and K equal to 1000. What is the growth rate r times N times (1 minus N divided by K)? Give the number only."
    correct: "80"
    unit: "individuals per year"
    wrong: []
    explanation: "The fraction still available is 0.8, and 0.5 times 200 times 0.8 gives 80 individuals per year."
    hints:
      - "Compute the fraction of carrying capacity still available."
      - "Multiply r, N and that fraction together."
      - "Keep the answer in individuals per year."
    diagram: "Sketch a sigmoid curve and mark the current population on the lower part of the curve with its slope indicated by a short tangent line."
    confidence: "high"
  - topic: "species_interactions"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "In predation, what happens to the prey?"
    correct: "It is killed and eaten by the predator"
    unit: ""
    wrong:
      - {text: "It lives on the predator's body without harm", mistake: "confuses predation with commensalism"}
      - {text: "It gives nutrients to the predator without being harmed", mistake: "assumes prey benefit from being consumed"}
      - {text: "It is unaffected in any way", mistake: "assumes predation has no effect on the prey"}
    explanation: "In predation the predator benefits by consuming the prey, and the prey is harmed, usually fatally. This is one of the main ways species interact in communities."
    hints:
      - "Think about the effect on the individual being consumed."
      - "Consider which species benefits and which is harmed in predation."
      - "Separate predation from relationships where neither species is consumed."
    diagram: null
    confidence: "high"
  - topic: "species_interactions"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What is mutualism?"
    correct: "An interaction in which both species benefit"
    unit: ""
    wrong:
      - {text: "An interaction in which one benefits and the other is unaffected", mistake: "uses the definition of commensalism for mutualism"}
      - {text: "An interaction in which both species are harmed", mistake: "reverses the meaning of mutualism"}
      - {text: "An interaction in which one species consumes the other", mistake: "uses the definition of predation for mutualism"}
    explanation: "Mutualism is a relationship in which both partners gain. Lichens, root nodule bacteria and pollinating insects are familiar cases."
    hints:
      - "Count how many partners gain from the interaction."
      - "Consider whether the interaction helps both species."
      - "Separate interactions with one beneficiary from those with two."
    diagram: null
    confidence: "high"
  - topic: "species_interactions"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Lichens are a partnership between a fungus and an alga. Which interaction does this describe?"
    correct: "Mutualism"
    unit: ""
    wrong:
      - {text: "Parasitism", mistake: "assumes the fungus harms the alga"}
      - {text: "Competition", mistake: "assumes both partners fight for the same resource"}
      - {text: "Amensalism", mistake: "assumes one partner is harmed while the other is unaffected"}
    explanation: "The fungus gets water and minerals while the alga gets a protected environment and some food from its photosynthesis, so both partners benefit. This is the defining feature of mutualism."
    hints:
      - "Think about whether both partners gain from the association."
      - "Consider which interaction describes a partnership with reciprocal benefit."
      - "Separate reciprocal partnerships from interactions where one partner is harmed."
    diagram: null
    confidence: "high"
  - topic: "species_interactions"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Two species use the same limited food, and both populations decline. Which interaction does this describe?"
    correct: "Competition"
    unit: ""
    wrong:
      - {text: "Predation", mistake: "assumes one species consumes the other"}
      - {text: "Mutualism", mistake: "assumes both species gain from the interaction"}
      - {text: "Commensalism", mistake: "assumes one species benefits while the other is unaffected"}
    explanation: "When two species share a limited resource, each reduces the availability for the other, and both can decline. This is competition, which can be interspecific."
    hints:
      - "Think about both species being harmed by shared resource use."
      - "Consider which interaction causes harm to both species."
      - "Separate interactions that harm both partners from those that help or harm only one."
    diagram: null
    confidence: "high"
  - topic: "species_interactions"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A cuckoo lays its eggs in the nest of another bird, which then raises the cuckoo's chick. Which interaction is this?"
    correct: "Brood parasitism"
    unit: ""
    wrong:
      - {text: "Mutualism", mistake: "assumes the host bird gains from raising the chick"}
      - {text: "Commensalism", mistake: "assumes the host bird is unaffected"}
      - {text: "Amensalism", mistake: "assumes the host is harmed but the cuckoo is unaffected"}
    explanation: "Brood parasitism is a form of parasitism in which the parasite uses the host's parental care at the host's cost. The cuckoo gains, while the host bird's own young are reduced in fitness."
    hints:
      - "Consider whether the host bird is harmed by the interaction."
      - "Think about which species gains and at what cost."
      - "Separate interactions where one species raises the other's young from those where both benefit."
    diagram: null
    confidence: "high"
  - topic: "species_interactions"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A community of 80 species includes 20 predator species and 60 other species. What percentage of the species are predators? Give the number only."
    correct: "25"
    unit: "%"
    wrong: []
    explanation: "Twenty out of 80 species is one quarter, which is 25 percent."
    hints:
      - "Divide the predator count by the total number of species."
      - "Multiply the result by one hundred."
      - "Check the answer is a percentage of the whole community."
