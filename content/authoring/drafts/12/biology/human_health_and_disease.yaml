items:
  - topic: "pathogens_and_diseases"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which pathogen causes malaria?"
    correct: "Plasmodium"
    unit: ""
    wrong:
      - {text: "Wuchereria", mistake: "uses a filarial worm for a protozoan disease"}
      - {text: "Salmonella", mistake: "confuses a bacterial gut pathogen with the malaria agent"}
      - {text: "Rhinovirus", mistake: "assumes malaria is caused by a virus"}
    explanation: "Malaria is caused by protozoans of the genus Plasmodium, which are carried by female Anopheles mosquitoes. The other pathogens cause different diseases."
    hints:
      - "Think about a protozoan parasite that a mosquito transmits."
      - "Consider the mosquito that carries the malaria parasite."
      - "Separate protozoan diseases from bacterial and viral ones."
    diagram: null
    confidence: "high"
  - topic: "pathogens_and_diseases"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which vector transmits the pathogen that causes filariasis?"
    correct: "Culex mosquito"
    unit: ""
    wrong:
      - {text: "Anopheles mosquito", mistake: "assigns the malaria vector to filariasis"}
      - {text: "Housefly", mistake: "treats flies as the vector of a worm disease"}
      - {text: "Tsetse fly", mistake: "uses the vector of sleeping sickness for filariasis"}
    explanation: "Culex mosquitoes transmit the filarial worm Wuchereria bancrofti, which lodges in the lymphatic system. Anopheles carries malaria, and tsetse flies carry trypanosomes."
    hints:
      - "Think about the mosquito genus linked with filarial worms."
      - "Compare with the malaria vector to rule out one option."
      - "Consider which insect group transmits the trypanosome causing sleeping sickness."
    diagram: null
    confidence: "high"
  - topic: "pathogens_and_diseases"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which disease is caused by a bacterium and spread mainly through contaminated water?"
    correct: "Cholera"
    unit: ""
    wrong:
      - {text: "Dengue", mistake: "uses a mosquito-borne viral disease as a waterborne bacterial one"}
      - {text: "Ringworm", mistake: "confuses a fungal skin infection with a waterborne bacterial disease"}
      - {text: "Amoebiasis", mistake: "assumes every waterborne infection is bacterial"}
    explanation: "Cholera is caused by the bacterium Vibrio cholerae and spreads through water contaminated with faeces. Amoebiasis is protozoan, and dengue and ringworm have other causes."
    hints:
      - "Think about a bacterium that spreads through contaminated drinking water."
      - "Consider a disease that causes severe diarrhoea and dehydration."
      - "Exclude the viral, fungal and protozoan options."
    diagram: null
    confidence: "high"
  - topic: "pathogens_and_diseases"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which disease is caused by a fungus?"
    correct: "Ringworm"
    unit: ""
    wrong:
      - {text: "Typhoid", mistake: "assigns a bacterial cause to a fungal infection"}
      - {text: "Hepatitis A", mistake: "uses a viral liver disease as a fungal one"}
      - {text: "Filariasis", mistake: "treats a parasitic worm infection as fungal"}
    explanation: "Ringworm is a fungal skin infection that is not caused by a worm, despite its name. Typhoid is bacterial, hepatitis A is viral and filariasis is caused by a worm."
    hints:
      - "Think about skin infections that are not caused by bacteria or viruses."
      - "Consider the name of this infection and what the organism actually is."
      - "Remember that a worm is not a fungus."
    diagram: null
    confidence: "high"
  - topic: "pathogens_and_diseases"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A new disease spreads through contaminated food and is caused by a toxin-producing bacterium. Which feature is most likely?"
    correct: "Symptoms can appear from a preformed toxin even when live bacteria are absent"
    unit: ""
    wrong:
      - {text: "Symptoms appear only after a vector bite", mistake: "treats a food-borne route as a vector-borne route"}
      - {text: "Only fungi can produce this type of toxin", mistake: "assumes toxins come only from fungi"}
      - {text: "The disease spreads only through the air to the lungs", mistake: "confuses the route of exposure with an airborne route"}
    explanation: "Some bacteria release toxins into food, and eating the food causes symptoms even if the bacteria are no longer alive. This is a food poisoning pattern rather than an infection that establishes itself in the body."
    hints:
      - "Think about the route by which the pathogen reaches the person."
      - "Consider whether the damage requires the organism to grow in the body."
      - "Ask whether the harm could come from a substance rather than a living organism."
    diagram: null
    confidence: "high"
  - topic: "pathogens_and_diseases"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "In a community of 2000 people, 50 are infected with a disease. What percentage of the community is infected? Give the number only."
    correct: "2.5"
    unit: "%"
    wrong: []
    explanation: "Fifty out of 2000 is 0.025, which is 2.5 percent of the community."
    hints:
      - "Divide the number of infected people by the total population."
      - "Multiply the result by one hundred at the end."
      - "Check that the percentage is a small number."
    diagram: null
    confidence: "high"
  - topic: "immunity_types"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which of the following is an example of passive immunity?"
    correct: "Antibodies received from the mother across the placenta"
    unit: ""
    wrong:
      - {text: "Recovery from measles leaves lasting protection", mistake: "treats protection from natural infection as passive"}
      - {text: "Protection after vaccination with a killed bacterium", mistake: "confuses vaccine induced immunity with passive transfer"}
      - {text: "The skin barrier against pathogens", mistake: "counts an innate barrier as passive immunity"}
    explanation: "Passive immunity is conferred by antibodies made by another individual, such as those passed from mother to foetus. The body did not produce these antibodies itself."
    hints:
      - "Think about immunity that is given rather than produced by the body itself."
      - "Consider whether the person's own immune system made the antibodies."
      - "Separate transferred antibodies from those the body makes after infection or vaccination."
    diagram: null
    confidence: "high"
  - topic: "immunity_types"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What is the main feature of innate immunity?"
    correct: "It responds in the same way each time and does not improve with repeated exposure"
    unit: ""
    wrong:
      - {text: "It improves with memory after each infection", mistake: "gives innate immunity the memory of adaptive immunity"}
      - {text: "It requires prior exposure before it can work", mistake: "treats the adaptive requirement as an innate one"}
      - {text: "It is found only in vertebrates", mistake: "limits innate defences to a single animal group"}
    explanation: "Innate immunity is the non-specific first line of defence, such as skin, mucus, phagocytes and inflammation. It does not form memory, so the response does not strengthen with repeated exposure."
    hints:
      - "Consider whether the response becomes stronger after repeated exposure."
      - "Think about whether the defence is aimed at a specific pathogen."
      - "Compare innate defences with the responses that build memory."
    diagram: null
    confidence: "high"
  - topic: "immunity_types"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which white blood cells produce antibodies?"
    correct: "B lymphocytes"
    unit: ""
    wrong:
      - {text: "Macrophages", mistake: "confuses phagocytes with antibody producing cells"}
      - {text: "Platelets", mistake: "assigns a clotting cell the antibody role"}
      - {text: "Red blood cells", mistake: "assumes oxygen carriers produce immune proteins"}
    explanation: "B lymphocytes mature into plasma cells that secrete large amounts of antibody. Macrophages engulf pathogens but do not make antibodies, and platelets and red blood cells have other roles."
    hints:
      - "Think about the white blood cell type that matures into plasma cells."
      - "Consider the lymphocyte class that carries antibodies on its surface."
      - "Separate phagocytes from lymphocytes."
    diagram: null
    confidence: "high"
  - topic: "immunity_types"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "The first response to a pathogen takes 10 days. A memory response takes one tenth of that time. How many days does the memory response take? Give the number only."
    correct: "1"
    unit: "days"
    wrong: []
    explanation: "One tenth of 10 days is 1 day for the memory response."
    hints:
      - "Find one tenth of the first response time."
      - "Keep the unit as days."
      - "Check that the memory response is shorter than the first."
    diagram: null
    confidence: "high"
  - topic: "immunity_types"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A patient has a severe infection that needs immediate protection, and there is no time for the body to make its own antibodies. Which treatment fits best?"
    correct: "Injection of ready-made antibodies"
    unit: ""
    wrong:
      - {text: "A booster vaccine given now", mistake: "assumes a vaccine gives protection within hours"}
      - {text: "A live attenuated vaccine given now", mistake: "assumes a vaccine acts faster than the body can respond"}
      - {text: "Antibiotics that stimulate memory cells", mistake: "treats antibiotics as immune stimulants"}
    explanation: "Passive immunisation gives ready-made antibodies that act immediately, which is useful when the patient cannot wait for an active response. Vaccines train the immune system but take time to work."
    hints:
      - "Think about immunity that does not depend on the patient's own response."
      - "Consider which treatment provides antibodies directly."
      - "Compare how quickly each option gives protection."
    diagram: null
    confidence: "high"
  - topic: "immunity_types"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A child receives 3 doses of a vaccine, and each dose gives 40 units of antibody. What is the total number of units after all doses, assuming no loss? Give the number only."
    correct: "120"
    unit: ""
    wrong: []
    explanation: "Three doses of 40 units each give 120 units in total when none is lost."
    hints:
      - "Multiply the number of doses by the units from each dose."
      - "Check that the answer is a total of units."
      - "Assume that no antibody is lost between doses."
    diagram: null
    confidence: "high"
  - topic: "vaccines_and_antibodies"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What is an antigen?"
    correct: "A molecule that triggers an immune response"
    unit: ""
    wrong:
      - {text: "A protein made only by antibodies", mistake: "confuses an antigen with the antibody that binds it"}
      - {text: "A type of white blood cell", mistake: "treats a cell type as a molecule that triggers immunity"}
      - {text: "A drug that suppresses immunity", mistake: "assigns an immunosuppressive role to antigens"}
    explanation: "An antigen is any molecule that the immune system recognises as foreign and responds to. Antibodies bind antigens but are not antigens themselves."
    hints:
      - "Think about what the immune system recognises as foreign."
      - "The molecule can be found on the surface of a pathogen."
      - "Separate the molecule that triggers a response from the molecule that responds."
    diagram: null
    confidence: "high"
  - topic: "vaccines_and_antibodies"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "How does a vaccine provide protection?"
    correct: "It exposes the immune system to an antigen so that memory cells form"
    unit: ""
    wrong:
      - {text: "It directly kills pathogens in the blood", mistake: "treats vaccines as drugs that kill pathogens"}
      - {text: "It replaces the immune system permanently", mistake: "assumes a vaccine substitutes for the immune system"}
      - {text: "It destroys antibodies that are already present", mistake: "reverses the effect of a vaccine on existing antibodies"}
    explanation: "A vaccine presents a harmless form of an antigen, so the immune system makes antibodies and memory cells that respond faster to the real pathogen later."
    hints:
      - "Think about what the immune system learns from a vaccine."
      - "Consider which cells remember an antigen for a later encounter."
      - "Focus on the lasting change a vaccine makes in the immune system."
    diagram: null
    confidence: "high"
  - topic: "vaccines_and_antibodies"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which class of antibody is found in the largest amount in the blood?"
    correct: "IgG"
    unit: ""
    wrong:
      - {text: "IgE", mistake: "assumes the allergy antibody is the most abundant"}
      - {text: "IgM", mistake: "treats the first antibody made as the most abundant"}
      - {text: "IgA", mistake: "picks the mucosal antibody as the blood's main antibody"}
    explanation: "IgG is the most abundant antibody class in blood and is the one that crosses the placenta. IgE is present in very small amounts and is linked to allergy."
    hints:
      - "Think about the antibody class that crosses the placenta."
      - "Consider which class is the most common in circulation."
      - "Separate allergy antibodies from the general circulating antibodies."
    diagram: null
    confidence: "high"
  - topic: "vaccines_and_antibodies"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "What distinguishes a monoclonal antibody from a polyclonal antibody mixture?"
    correct: "All copies come from one B cell clone and bind one epitope"
    unit: ""
    wrong:
      - {text: "It is produced by many different B cell clones", mistake: "describes the polyclonal mixture instead"}
      - {text: "It is always a viral protein", mistake: "confuses an antibody with an antigen from a virus"}
      - {text: "It cannot bind any antigen", mistake: "assumes an antibody must be inactive to be uniform"}
    explanation: "A monoclonal antibody is identical in every copy because it comes from one clone of B cells and recognises one epitope. A polyclonal mixture is made by many clones and can bind several epitopes."
    hints:
      - "Think about how many lineages of cells make the antibody."
      - "Consider how many distinct epitopes the product recognises."
      - "Compare a uniform product with a mixture from many sources."
    diagram: null
    confidence: "high"
  - topic: "vaccines_and_antibodies"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A vaccine uses an inactivated toxin rather than live bacteria. What is the main advantage of this approach?"
    correct: "It triggers an antibody response to the toxin without causing the disease"
    unit: ""
    wrong:
      - {text: "It grants lifelong immunity without any boosters", mistake: "assumes every vaccine needs no further doses"}
      - {text: "It replaces antibodies with T cells only", mistake: "assumes the toxin vaccine removes the antibody response"}
      - {text: "It kills bacteria in the bloodstream directly", mistake: "treats a toxin vaccine as an antibiotic"}
    explanation: "A toxin vaccine presents the harmful product in a form that cannot cause the disease, so the immune system learns to neutralise the toxin. The live bacteria are not needed for protection."
    hints:
      - "Think about which part of the pathogen causes the harm."
      - "Consider whether the vaccine contains active living bacteria."
      - "Focus on what the immune system must neutralise to prevent disease."
    diagram: null
    confidence: "high"
  - topic: "vaccines_and_antibodies"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "In a herd of 400 people, immunity is needed in 80 percent to reach herd protection. How many people need to be immune? Give the count only."
    correct: "320"
    unit: ""
    wrong: []
    explanation: "Eighty percent of 400 is 320 people who need immunity."
    hints:
      - "Convert the percentage into a fraction of the herd."
      - "Apply that fraction to the total number of people."
      - "Check that the answer is a count of people."
    diagram: null
    confidence: "high"
  - topic: "cancer_and_drugs"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What defines a malignant tumour?"
    correct: "It invades nearby tissues and can spread to distant sites"
    unit: ""
    wrong:
      - {text: "It stays in one place and is enclosed by a capsule", mistake: "describes a benign tumour instead"}
      - {text: "It is always caused by a virus", mistake: "assumes every tumour has a viral cause"}
      - {text: "It forms only in the blood", mistake: "limits tumours to the blood"}
    explanation: "Malignant tumours invade surrounding tissue and can metastasise to distant organs. Benign tumours usually stay localised and encapsulated."
    hints:
      - "Think about the difference between growing in one place and spreading."
      - "Consider which type of tumour can metastasise."
      - "Separate the local growth pattern from the spreading pattern."
    diagram: null
    confidence: "high"
  - topic: "cancer_and_drugs"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which substance found in cigarette smoke is a known carcinogen?"
    correct: "Tobacco tar"
    unit: ""
    wrong:
      - {text: "Vitamin C", mistake: "treats an antioxidant nutrient as a carcinogen"}
      - {text: "Drinking water", mistake: "assumes ordinary water can cause cancer"}
      - {text: "Table salt", mistake: "assumes a common seasoning is a carcinogen"}
    explanation: "Tobacco tar contains many carcinogenic compounds that damage DNA and raise the risk of lung and other cancers. The other options are not carcinogens in ordinary use."
    hints:
      - "Think about a substance inhaled during smoking."
      - "Consider a substance that builds up in the lungs of smokers."
      - "Separate nutrients and everyday substances from smoke components."
    diagram: null
    confidence: "high"
  - topic: "cancer_and_drugs"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which group of drugs is used to reduce the symptoms of allergic reactions?"
    correct: "Antihistamines"
    unit: ""
    wrong:
      - {text: "Opioids", mistake: "treats pain relief drugs as allergy treatments"}
      - {text: "Anticoagulants", mistake: "assumes blood thinners treat allergies"}
      - {text: "Diuretics", mistake: "picks drugs that remove fluid as allergy treatments"}
    explanation: "Antihistamines block histamine receptors, which reduces the swelling, itching and runny nose of an allergic reaction. The other groups act on pain, clotting or fluid balance."
    hints:
      - "Think about the chemical released during an allergic reaction."
      - "Consider the drug type that blocks the receptors for that chemical."
      - "Separate allergy drugs from drugs for pain or clotting."
    diagram: null
    confidence: "high"
  - topic: "cancer_and_drugs"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which effect is a common consequence of drug abuse on the nervous system?"
    correct: "Altered perception and reduced coordination"
    unit: ""
    wrong:
      - {text: "Improved memory of all events", mistake: "assumes stimulant drugs always help memory"}
      - {text: "Increased bone density", mistake: "links a nervous system effect to a skeletal benefit"}
      - {text: "Lowered blood sugar only", mistake: "limits drug effects to blood sugar"}
    explanation: "Many drugs of abuse change the signals that neurons send, which can alter perception, judgement and motor coordination. Memory and other functions can also be impaired."
    hints:
      - "Consider how drugs change the signals between neurons."
      - "Think about functions that depend on normal brain signalling."
      - "Focus on effects that impair the nervous system rather than strengthen it."
    diagram: null
    confidence: "high"
  - topic: "cancer_and_drugs"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A patient has a severe allergic reaction to a drug and is having difficulty breathing. What is the most urgent step?"
    correct: "Give adrenaline and seek emergency care"
    unit: ""
    wrong:
      - {text: "Continue the drug to test the reaction", mistake: "treats a severe allergy as safe to challenge"}
      - {text: "Wait for the reaction to pass without treatment", mistake: "assumes a severe reaction always resolves alone"}
      - {text: "Give a stronger antibiotic", mistake: "confuses an allergy with an infection"}
    explanation: "Severe allergic reactions can block the airway quickly, and adrenaline is the first line treatment that reverses this, followed by urgent medical care. Delay can be fatal."
    hints:
      - "Think about a treatment that acts quickly across the whole body."
      - "Consider whether the reaction could become life threatening."
      - "Focus on the step that opens the airway quickly."
    diagram: null
    confidence: "high"
  - topic: "cancer_and_drugs"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A tumour's volume doubles every 3 months. Starting from 2 cubic centimetres, what is its volume after 9 months? Give the number only."
    correct: "16"
    unit: "cm3"
    wrong: []
    explanation: "Nine months holds three doublings, and 2 times two cubed is 16 cubic centimetres."
    hints:
      - "Count how many doublings occur in nine months."
      - "Double the volume once for each three month interval."
      - "Check that the unit is cubic centimetres."
    diagram: null
    confidence: "high"
