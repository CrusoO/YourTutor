items:
  - topic: "modes_of_reproduction"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which mode of reproduction involves only one parent and produces offspring that are genetically identical to that parent?"
    correct: "Asexual reproduction"
    unit: ""
    wrong:
      - {text: "Sexual reproduction", mistake: "assumes two parents are always needed for any reproduction"}
      - {text: "Cross-fertilisation", mistake: "confuses a fertilisation pattern with a mode of reproduction"}
      - {text: "Gametic fusion between unlike gametes", mistake: "thinks gamete fusion is required for every form of reproduction"}
    explanation: "Asexual reproduction copies the genome of one parent, so offspring are clones apart from rare mutations. Sexual reproduction mixes genetic material from two parents through gametes."
    hints:
      - "Ask how many parents contribute genetic material to each offspring."
      - "Consider whether gametes are formed and fused in this mode."
      - "Think about where the offspring's genes come from."
    diagram: null
    confidence: "high"
  - topic: "modes_of_reproduction"
    type: "numeric"
    difficulty: "easy"
    role: "explain"
    stem: "A single bacterium divides by binary fission every 20 minutes and none die. How many bacteria are present after 2 hours? Give the count only."
    correct: "64"
    unit: ""
    wrong: []
    explanation: "Two hours is 120 minutes, which holds six intervals of 20 minutes. Each division doubles the number, so the count after six divisions is two to the power six."
    hints:
      - "Count how many 20 minute intervals fit into two hours."
      - "Each division doubles the number of cells present."
      - "Multiply the starting number by two once for every division."
    diagram: null
    confidence: "high"
  - topic: "modes_of_reproduction"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "A hydra regenerates a complete new organism from a small cut piece of its body. Which asexual mode does this most closely match?"
    correct: "Regeneration"
    unit: ""
    wrong:
      - {text: "Binary fission", mistake: "picks a division mode of single-celled organisms for a multicellular animal"}
      - {text: "Conjugation", mistake: "confuses transfer of genetic material between cells with reproduction"}
      - {text: "Sporulation", mistake: "assumes every asexual mode must release spores"}
    explanation: "In regeneration, a fragment of the body grows into a whole new individual, which is a form of asexual reproduction in some animals. The other options describe cell division or gene transfer rather than rebuilding a whole body from a piece."
    hints:
      - "Focus on how a whole body forms again from a small fragment."
      - "Compare the process with cell division in single-celled organisms."
      - "Eliminate modes that involve gametes or genetic exchange between cells."
    diagram: null
    confidence: "high"
  - topic: "modes_of_reproduction"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "A plant spreads by runners. Each existing plant produces 3 new plants per month, and no plant dies. Starting with 1 plant, how many plants exist at the end of 2 months? Give the count only."
    correct: "16"
    unit: ""
    wrong: []
    explanation: "After month one there are 1 plus 3 equals 4 plants. In month two each of the 4 plants adds 3 more, giving 4 plus 12 equals 16."
    hints:
      - "Work out the total at the end of month one first."
      - "Each plant that exists at the start of a month adds three new ones."
      - "Carry the month one total forward into month two."
    diagram: null
    confidence: "high"
  - topic: "modes_of_reproduction"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A filament of the alga Spirogyra breaks into several pieces, and each piece grows into a new filament. Which method of reproduction does this describe?"
    correct: "Fragmentation"
    unit: ""
    wrong:
      - {text: "Budding", mistake: "expects a new outgrowth on the parent body instead of separate pieces"}
      - {text: "Spore formation", mistake: "assumes a resting spore must form before any new individual appears"}
      - {text: "Syngamy", mistake: "confuses the fusion of two gametes with splitting of a body"}
    explanation: "When a filament breaks into pieces that each regrow, the method is fragmentation, a form of asexual reproduction. No gametes or spores are involved."
    hints:
      - "Look at what happens to the body of the filament."
      - "Check whether a bud or a spore is involved in this process."
      - "Ask whether any gamete fusion takes place."
    diagram: null
    confidence: "high"
  - topic: "modes_of_reproduction"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A plant produces 1200 seeds per season. Each seed has a 0.5 percent chance of establishing a new plant. On average, how many new plants establish per season? Give the count only."
    correct: "6"
    unit: ""
    wrong: []
    explanation: "Half a percent is 0.005, and 1200 times 0.005 equals 6 established plants on average."
    hints:
      - "Convert the percentage into a decimal before using it."
      - "Multiply the seed count by that decimal."
      - "Check that the result is a small count of plants, not a percentage."
    diagram: null
    confidence: "high"
  - topic: "life_span_and_strategies"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Organisms that produce many small offspring with little parental care are often suited to which kind of environment?"
    correct: "Unstable environments where many offspring die young"
    unit: ""
    wrong:
      - {text: "Stable environments with few competitors", mistake: "assumes stable habitats always favour producing many offspring"}
      - {text: "Environments with long-lived adults and slow growth", mistake: "attaches the slow-growth pattern to the environment instead of the strategy"}
      - {text: "Only aquatic environments", mistake: "links the strategy to habitat type rather than predictability"}
    explanation: "Species that produce many cheap offspring tend to succeed where survival is unpredictable and most young die. Few costly offspring with long care suit stable, crowded habitats."
    hints:
      - "Think about how many offspring survive when conditions change unpredictably."
      - "Consider how much energy a parent can put into each young one."
      - "Compare the cost of many cheap offspring with few costly ones."
    diagram: null
    confidence: "high"
  - topic: "life_span_and_strategies"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Why do many annual plants put heavy investment into producing large numbers of seeds?"
    correct: "A single season of life means seeds must carry the species forward"
    unit: ""
    wrong:
      - {text: "Seeds can only germinate after several years", mistake: "adds an unrelated timing constraint to seed germination"}
      - {text: "Annuals reproduce asexually every season", mistake: "assumes all annual plants reproduce without seeds"}
      - {text: "Large seeds guarantee survival of every seedling", mistake: "assumes seed size ensures survival rather than seed number"}
    explanation: "An annual plant dies after one season, so its seeds are its only route to the next generation. Producing many seeds raises the chance that some find suitable ground."
    hints:
      - "Consider how long the parent plant lives."
      - "Think about what the seed has to do before the parent dies."
      - "Match the options against a plant with a one-season life cycle."
    diagram: null
    confidence: "high"
  - topic: "life_span_and_strategies"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "A species produces 200 offspring per year, and 2 percent of them survive to reproduce. How many offspring survive to reproduce per year? Give the count only."
    correct: "4"
    unit: ""
    wrong: []
    explanation: "Two percent of 200 is 4 surviving offspring per year."
    hints:
      - "Convert the percentage into a fraction first."
      - "Multiply the number of offspring by that fraction."
      - "Check whether the result is a whole number of individuals."
    diagram: null
    confidence: "high"
  - topic: "life_span_and_strategies"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "A fish lays 10000 eggs and gives no care. A mammal bears one young per year and cares for it for years. Which statement correctly contrasts their strategies?"
    correct: "The fish follows a many-offspring strategy and the mammal a few-offspring strategy"
    unit: ""
    wrong:
      - {text: "Both follow the same strategy because both reproduce sexually", mistake: "uses the mode of reproduction to decide the strategy"}
      - {text: "The mammal follows a many-offspring strategy because it lives longer", mistake: "reverses the link between life span and offspring number"}
      - {text: "The fish invests more energy in each egg than the mammal does", mistake: "reads egg count as energy invested per offspring"}
    explanation: "The fish spreads its investment across thousands of eggs with no care, which is a many-offspring pattern. The mammal puts heavy investment into one young with long parental care."
    hints:
      - "Count how many young each animal produces and what care it gives."
      - "Compare how much each offspring receives from its parent."
      - "Decide which pattern fits each animal rather than comparing their modes of reproduction."
    diagram: null
    confidence: "high"
  - topic: "life_span_and_strategies"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A bacterium divides every 20 minutes under good conditions, yet a closed culture stops growing after a while. Which factor best explains this limit?"
    correct: "Nutrients are used up and waste builds up, capping the population size"
    unit: ""
    wrong:
      - {text: "Bacteria stop dividing after a fixed number of divisions", mistake: "assumes a built-in division limit that is not present"}
      - {text: "Their genome mutates after every division", mistake: "confuses the mutation rate with the limit on population size"}
      - {text: "Parental care keeps their numbers low", mistake: "applies a parental care idea to a single-celled organism"}
    explanation: "In a closed culture the food supply is finite and wastes accumulate, so growth slows and levels off. This is the carrying capacity idea applied to a microbe."
    hints:
      - "Think about what a growing population consumes from its surroundings."
      - "Consider what a closed flask can supply over time and what the cells keep using up."
      - "Ask what changes as the population becomes dense."
    diagram: null
    confidence: "high"
  - topic: "life_span_and_strategies"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A long-lived species keeps 80 percent of its adults each year, with no births or immigration. Starting with 500 adults, how many adults remain after 2 years? Give the count only."
    correct: "320"
    unit: ""
    wrong: []
    explanation: "Each year keeps 80 percent, so 500 adults fall to 400 after one year and to 320 after two."
    hints:
      - "Apply the survival fraction once for each year."
      - "Use the surviving count from year one as the start of year two."
      - "Keep the answer as a count of adults."
    diagram: null
    confidence: "high"
