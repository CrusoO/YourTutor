items:
  - topic: "ecosystem_structure"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which components of an ecosystem include producers, consumers and decomposers?"
    correct: "Biotic components"
    unit: ""
    wrong:
      - {text: "Abiotic components", mistake: "assigns living organisms to the non-living category"}
      - {text: "Climate only", mistake: "treats climate as the group containing organisms"}
      - {text: "Soil minerals only", mistake: "limits the ecosystem to its mineral content"}
    explanation: "Biotic components are the living parts of an ecosystem, including producers, consumers and decomposers. Abiotic components are the non-living factors such as light, water and soil chemistry."
    hints:
      - "Think about the living organisms in an ecosystem."
      - "Consider which category contains the living parts of the system."
      - "Separate the living parts from the non-living factors."
    diagram: null
    confidence: "high"
  - topic: "ecosystem_structure"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What is the role of producers in an ecosystem?"
    correct: "They capture solar energy and fix it into organic compounds"
    unit: ""
    wrong:
      - {text: "They break down dead matter into nutrients", mistake: "assigns the decomposer role to producers"}
      - {text: "They feed on primary consumers", mistake: "reverses the feeding relationship in the food chain"}
      - {text: "They regulate the climate directly", mistake: "assumes producers control climate as their main role"}
    explanation: "Producers, mainly green plants and algae, use photosynthesis to convert light energy into chemical energy in organic compounds. This energy then flows to the rest of the food web."
    hints:
      - "Think about how energy first enters the food web."
      - "Consider which organisms use light to make food."
      - "Separate the energy capture step from the breakdown step."
    diagram: null
    confidence: "high"
  - topic: "ecosystem_structure"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "In a grassland food chain, which trophic level do grasshoppers occupy?"
    correct: "Primary consumers"
    unit: ""
    wrong:
      - {text: "Producers", mistake: "assumes all animals are producers"}
      - {text: "Secondary consumers", mistake: "moves the grasshopper one level too high"}
      - {text: "Decomposers", mistake: "assigns a feeding on living plants role to decomposers"}
    explanation: "Grasshoppers eat grass, which is a producer, so they are primary consumers. Their predators, such as birds, occupy higher levels."
    hints:
      - "Think about what the grasshopper feeds on."
      - "Consider which trophic level the food source belongs to."
      - "Count how many transfers separate the grasshopper from the producers."
    diagram: null
    confidence: "high"
  - topic: "ecosystem_structure"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "A tree supports many insects, and those insects feed one bird. In a pyramid of numbers, what shape does this produce?"
    correct: "Inverted pyramid"
    unit: ""
    wrong:
      - {text: "Upright pyramid", mistake: "assumes the producer level always has the most organisms"}
      - {text: "Diamond with equal bases", mistake: "assumes numbers are equal at each level"}
      - {text: "Flat line of equal levels", mistake: "assumes organism counts are the same at every level"}
    explanation: "A single tree supports many insects, and many insects support one bird, so the base is small and the upper levels are larger. This gives an inverted pyramid of numbers."
    hints:
      - "Count the organisms at the base level, which is the tree here."
      - "Compare that count with the number at the top."
      - "Think about what happens when one producer feeds many consumers."
    diagram: null
    confidence: "high"
  - topic: "ecosystem_structure"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A pyramid of energy always has a broad base and narrows upward. Which principle explains this?"
    correct: "Energy lost as heat at each level limits the energy available to the next level"
    unit: ""
    wrong:
      - {text: "Each level stores more energy than the one below", mistake: "reverses the direction of energy loss"}
      - {text: "Energy is created anew at every trophic level", mistake: "assumes energy is generated at each level"}
      - {text: "Decomposers gain energy from consumers", mistake: "reverses the flow of energy between the decomposers and consumers"}
    explanation: "Only about a tenth of the energy at one level is passed on, with the rest lost as heat and used in metabolism. This loss at each step limits the energy available to higher levels."
    hints:
      - "Think about what happens to energy at each transfer."
      - "Consider which law of physics explains the loss of usable energy."
      - "Ask why the energy at the top must be smaller than at the base."
    diagram: null
    confidence: "high"
  - topic: "ecosystem_structure"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "Producers hold 1000 kJ of energy. Primary consumers receive 10 percent of that energy, and secondary consumers receive 10 percent of what the primary consumers get. How many kJ reach the secondary consumers? Give the number only."
    correct: "10"
    unit: "kJ"
    wrong: []
    explanation: "Ten percent of 1000 kJ is 100 kJ for primary consumers, and 10 percent of 100 kJ is 10 kJ for secondary consumers."
    hints:
      - "Apply the transfer percentage at each step."
      - "Multiply the energy by the fraction twice."
      - "Check that the unit is kilojoules."
    diagram: null
    confidence: "high"
  - topic: "productivity_energy_flow"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What is gross primary productivity?"
    correct: "The total rate at which producers fix energy through photosynthesis"
    unit: ""
    wrong:
      - {text: "The energy left after the producers' own respiration", mistake: "gives the definition of net productivity instead"}
      - {text: "The rate of decomposition of dead matter", mistake: "confuses productivity with decomposition"}
      - {text: "The total biomass of all consumers", mistake: "measures consumer biomass rather than producer energy capture"}
    explanation: "Gross primary productivity is the total energy fixed by producers in a given time, before the energy used in their own respiration is subtracted."
    hints:
      - "Think about the total energy captured by the producers."
      - "Consider the energy that remains after the producers' own respiration."
      - "Ask which option describes the total before any energy is spent."
    diagram: null
    confidence: "high"
  - topic: "productivity_energy_flow"
    type: "numeric"
    difficulty: "easy"
    role: "explain"
    stem: "Gross primary productivity is 800 and respiration by producers is 300, in the same units. What is the net primary productivity? Give the number only."
    correct: "500"
    unit: ""
    wrong: []
    explanation: "Net primary productivity equals gross productivity minus respiration, so 800 minus 300 gives 500."
    hints:
      - "Net productivity is what remains after respiration."
      - "Subtract respiration from gross productivity."
      - "Keep the same units as the inputs."
    diagram: null
    confidence: "high"
  - topic: "productivity_energy_flow"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "A lake has net primary productivity of 450 and respiration of 350, both in kcal per square metre. What is its gross primary productivity? Give the number only."
    correct: "800"
    unit: "kcal per square metre"
    wrong: []
    explanation: "Gross productivity equals net productivity plus respiration, so 450 plus 350 gives 800."
    hints:
      - "Add respiration back to the net productivity."
      - "Keep the same units throughout."
      - "Check that gross productivity is larger than net productivity."
    diagram: null
    confidence: "high"
  - topic: "productivity_energy_flow"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "Herbivores assimilate 5000 kJ of energy, and 10 percent of it passes to carnivores. How many kJ reach the carnivores? Give the number only."
    correct: "500"
    unit: "kJ"
    wrong: []
    explanation: "Ten percent of 5000 kJ is 500 kJ passed to carnivores."
    hints:
      - "Apply the transfer percentage once for this step."
      - "Use the herbivore energy as the starting value."
      - "Check that the unit is kilojoules."
    diagram: "Draw an energy pyramid with producer, herbivore and carnivore levels, labelled with their energy values, and arrows showing the 10 percent transfer and the heat loss."
    confidence: "high"
  - topic: "productivity_energy_flow"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "In a stream, gross primary productivity is high but net primary productivity is low. What is the most likely explanation?"
    correct: "Producers use a large share of the fixed energy for their own respiration"
    unit: ""
    wrong:
      - {text: "The producers do not photosynthesise at all", mistake: "contradicts the high gross productivity"}
      - {text: "The consumers are absent from the stream", mistake: "treats consumer absence as the cause of low net productivity"}
      - {text: "The light is excessive and damages the producers", mistake: "assumes light excess lowers net productivity directly"}
    explanation: "Net productivity is gross productivity minus producer respiration, so a large respiration cost leaves little net gain. This explains high gross but low net values."
    hints:
      - "Think about what is subtracted from gross productivity to give net."
      - "Consider how much of the fixed energy the producers use for themselves."
      - "Focus on the cost that the producers pay from the energy they capture."
    diagram: null
    confidence: "high"
  - topic: "productivity_energy_flow"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "Herbivores eat 100 kg of plant matter, and 10 percent of it becomes herbivore biomass. A carnivore eats 20 percent of that herbivore biomass. How many kg of carnivore biomass result? Give the number only."
    correct: "2"
    unit: "kg"
    wrong: []
    explanation: "Ten percent of 100 kg is 10 kg of herbivore biomass, and 20 percent of that is 2 kg of carnivore biomass."
    hints:
      - "Apply the first transfer percentage to the plant matter."
      - "Apply the second percentage to the herbivore biomass."
      - "Check that the unit is kilograms."
    diagram: "Sketch a biomass pyramid with producers, herbivores and carnivores, with the transfer percentages marked on the arrows between levels."
    confidence: "high"
  - topic: "decomposition"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which organisms are the main decomposers of dead leaves in the soil?"
    correct: "Fungi and bacteria"
    unit: ""
    wrong:
      - {text: "Only large vertebrates", mistake: "assumes large animals drive most decomposition"}
      - {text: "Only autotrophs", mistake: "assumes producers decompose dead matter"}
      - {text: "Viruses alone", mistake: "assumes viruses are the main decomposers"}
    explanation: "Fungi and bacteria secrete enzymes that break complex organic molecules in dead leaves into simpler forms. They are the main decomposers in most soils."
    hints:
      - "Think about microbes that break down complex organic matter."
      - "Consider which groups secrete enzymes onto dead material."
      - "Separate the main microbial decomposers from larger animals."
    diagram: null
    confidence: "high"
  - topic: "decomposition"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What is the first step in the decomposition of dead organic matter?"
    correct: "Fragmentation of the litter by detritivores such as earthworms"
    unit: ""
    wrong:
      - {text: "Mineralisation into inorganic nutrients", mistake: "reverses the order of the decomposition steps"}
      - {text: "Leaching of all salts from the soil", mistake: "treats a later loss process as the first step"}
      - {text: "Release of methane before any breakdown", mistake: "assumes methane is released before the matter is broken down"}
    explanation: "Detritivores physically break litter into smaller pieces, which increases the surface area for microbes. Microbial breakdown and mineralisation follow this fragmentation."
    hints:
      - "Consider which organisms physically break up litter first."
      - "Think about animals that feed on dead matter and move through soil."
      - "Ask which step in decomposition comes before the microbial breakdown."
    diagram: null
    confidence: "high"
  - topic: "decomposition"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which step converts organic nitrogen in dead matter into ammonium during decomposition?"
    correct: "Ammonification"
    unit: ""
    wrong:
      - {text: "Nitrification", mistake: "treats the oxidation of ammonium as the first conversion"}
      - {text: "Denitrification", mistake: "assumes nitrogen gas loss is the first conversion"}
      - {text: "Nitrogen fixation", mistake: "treats fixation of atmospheric nitrogen as the conversion of organic nitrogen"}
    explanation: "Ammonification is carried out by decomposers that release ammonium from organic nitrogen compounds. Nitrification then converts ammonium to nitrate, and denitrification returns nitrogen gas to the air."
    hints:
      - "Think about microbes that release ammonia from organic matter."
      - "Consider the step that comes before nitrification."
      - "Separate the release of ammonium from its later oxidation."
    diagram: null
    confidence: "high"
  - topic: "decomposition"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "In a carbon cycle diagram, carbon moves from dead matter back to the air. Which process releases this carbon?"
    correct: "Respiration by decomposers"
    unit: ""
    wrong:
      - {text: "Photosynthesis by producers", mistake: "assumes fixation releases carbon into the air"}
      - {text: "Pollination by insects", mistake: "links a reproductive process with carbon release"}
      - {text: "Transpiration by leaves", mistake: "confuses water loss with carbon release"}
    explanation: "Decomposers respire organic carbon from dead matter and release carbon dioxide to the atmosphere. Photosynthesis removes carbon dioxide from the air instead."
    hints:
      - "Think about the process in decomposers that releases carbon dioxide."
      - "Consider the living process that uses oxygen and gives off carbon dioxide."
      - "Separate processes that remove carbon dioxide from those that release it."
    diagram: "Draw a carbon cycle showing atmospheric carbon dioxide, producers, consumers, dead matter and decomposers, with arrows for photosynthesis, respiration and combustion."
    confidence: "high"
  - topic: "decomposition"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A field shows a very low decomposition rate. Which environmental condition is most likely limiting decomposition?"
    correct: "Low oxygen and cold temperatures that slow microbial activity"
    unit: ""
    wrong:
      - {text: "High moisture and warmth in the soil", mistake: "assumes these conditions slow decay"}
      - {text: "Excess sunlight on the soil surface", mistake: "assumes light controls decomposer activity"}
      - {text: "High carbon dioxide in the soil air only", mistake: "assumes the product of decay limits decay"}
    explanation: "Decomposers need oxygen and warmth to respire and grow, so waterlogged, cold or low oxygen conditions slow decomposition. Warm, moist, aerated soil generally speeds it up."
    hints:
      - "Think about the conditions that microbes need for their activity."
      - "Consider which factor slows enzyme driven breakdown."
      - "Compare the conditions in soils with fast and slow decay."
    diagram: null
    confidence: "high"
  - topic: "decomposition"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A litter bag starts at 50 g and loses 40 percent of its mass in 6 months. How many grams remain? Give the number only."
    correct: "30"
    unit: "g"
    wrong: []
    explanation: "Forty percent of 50 g is 20 g lost, which leaves 30 g of litter."
    hints:
      - "Find the portion that remains after the loss."
      - "Multiply the starting mass by the remaining fraction."
      - "Check that the unit is grams."
    diagram: "Sketch a litter bag placed in soil with its starting mass and a 6 month time marker labelled."
    confidence: "high"
