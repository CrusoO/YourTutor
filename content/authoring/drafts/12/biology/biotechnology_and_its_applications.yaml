items:
  - topic: "bt_crops"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "In which part of the insect's gut does the inactive Bt protoxin become an active toxin?"
    correct: "The alkaline midgut of the larva"
    unit: ""
    wrong:
      - {text: "Inside the leaf cells of the plant", mistake: "assumes activation happens in the plant rather than in the pest"}
      - {text: "Under direct sunlight on the leaf surface", mistake: "treats light as the activating step"}
      - {text: "In the acidic stomach of a bird", mistake: "assumes the toxin acts in a different animal group"}
    explanation: "Bt protoxin is dissolved and cleaved in the alkaline midgut of susceptible insect larvae, which converts it into the active toxin. This is why it harms the target pests and not most other animals."
    hints:
      - "Think about the pH of the insect gut."
      - "Consider where the inactive form becomes active."
      - "Ask which part of the digestive tract of the larva does this."
    diagram: null
    confidence: "high"
  - topic: "bt_crops"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "How does a Bt cotton plant resist bollworm attack?"
    correct: "Its cells produce a Cry protein that damages the insect gut"
    unit: ""
    wrong:
      - {text: "It emits a scent that repels all insects", mistake: "invents a repellent scent as the resistance mechanism"}
      - {text: "It produces a wax layer that traps larvae", mistake: "assigns a physical trap to a gene product"}
      - {text: "It blocks sunlight to the pest", mistake: "treats shading as a pest control mechanism"}
    explanation: "A gene from Bacillus thuringiensis is inserted into the cotton, and the Cry protein it encodes is toxic to the bollworm after ingestion. The plant itself makes the toxin in its tissues."
    hints:
      - "Think about how the product of an inserted gene affects the pest's digestion."
      - "Consider what the toxin does to the insect's gut lining."
      - "Ask how the plant's own cells contribute to pest resistance."
    diagram: null
    confidence: "high"
  - topic: "bt_crops"
    type: "numeric"
    difficulty: "medium"
    role: "procedure"
    stem: "A Bt crop field has 400 plants, and 2 percent of them are attacked by pests despite the toxin. How many plants are attacked? Give the count only."
    correct: "8"
    unit: ""
    wrong: []
    explanation: "Two percent of 400 plants is 8 plants that are attacked."
    hints:
      - "Convert the percentage into a fraction."
      - "Apply that fraction to the total number of plants."
      - "Check that the answer is a count of plants."
    diagram: null
    confidence: "high"
  - topic: "bt_crops"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Why do Bt crops reduce the need for chemical sprays against their target pests?"
    correct: "The toxin acts on target insects, so fewer broad sprays are needed"
    unit: ""
    wrong:
      - {text: "The toxin kills all insects, including predators", mistake: "assumes the toxin is broad spectrum"}
      - {text: "The toxin replaces the need for water", mistake: "links a pest control trait to irrigation"}
      - {text: "The plant grows without soil", mistake: "confuses Bt crops with a soilless growing method"}
    explanation: "Because the Cry toxin is selective for certain larvae, the crop protects itself against those pests without repeated chemical sprays. Non-target species are much less affected."
    hints:
      - "Think about whether the toxin acts widely or narrowly."
      - "Consider which insects the crop protection is aimed at."
      - "Ask how much spraying is needed when the plant already carries the protection."
    diagram: null
    confidence: "high"
  - topic: "bt_crops"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A Bt crop loses its effectiveness after several seasons. Which management practice would best delay this loss?"
    correct: "Planting refuge areas of non-Bt crops nearby"
    unit: ""
    wrong:
      - {text: "Spraying more toxin at higher concentrations", mistake: "assumes a higher dose stops resistance from developing"}
      - {text: "Planting only the Bt variety everywhere", mistake: "assumes uniform use of the trait slows resistance"}
      - {text: "Removing all natural predators of the pest", mistake: "removes control agents without addressing resistance"}
    explanation: "Refuges let susceptible pests survive and mate with any resistant survivors, which dilutes the resistance gene in the population. This delays the spread of resistance."
    hints:
      - "Think about how resistant insects mate with susceptible ones."
      - "Consider how to keep susceptible pests in the population."
      - "Ask which practice keeps a source of susceptible individuals available."
    diagram: null
    confidence: "high"
  - topic: "bt_crops"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A field has a potential yield of 60 tonnes, and pests would take 25 percent of it without protection. How many tonnes are lost without protection? Give the number only."
    correct: "15"
    unit: "tonnes"
    wrong: []
    explanation: "Twenty-five percent of 60 tonnes is 15 tonnes lost without protection."
    hints:
      - "Convert the loss percentage into a fraction."
      - "Apply that fraction to the potential yield."
      - "Check that the unit is tonnes."
    diagram: null
    confidence: "high"
  - topic: "gene_therapy"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What is the aim of gene therapy?"
    correct: "Correcting a defective gene or adding a working copy of it"
    unit: ""
    wrong:
      - {text: "Killing all cells that carry a mutation", mistake: "treats gene therapy as a way to remove affected cells"}
      - {text: "Permanently removing the immune system", mistake: "confuses gene therapy with immunosuppression"}
      - {text: "Changing the protein shape without touching DNA", mistake: "assumes gene therapy works only on proteins"}
    explanation: "Gene therapy aims to treat a disorder by correcting the faulty gene or supplying a functional copy so that the cells make the needed protein. It works at the level of the genetic material."
    hints:
      - "Think about what is wrong at the level of the gene."
      - "Consider the outcome of adding a working copy of a gene."
      - "Ask whether the treatment changes DNA or only the protein."
    diagram: null
    confidence: "high"
  - topic: "gene_therapy"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "Which disorder was among the first to be treated by human gene therapy?"
    correct: "Adenosine deaminase deficiency"
    unit: ""
    wrong:
      - {text: "Colour blindness", mistake: "picks a sensory trait as a gene therapy target"}
      - {text: "Pattern baldness", mistake: "treats a common trait as an early disorder for therapy"}
      - {text: "Acne", mistake: "assumes skin conditions were the first targets"}
    explanation: "An early human trial treated a severe immune deficiency caused by adenosine deaminase deficiency. The other options are not typical early targets of gene therapy."
    hints:
      - "Think about a severe inherited disorder of the immune system."
      - "Consider which disorder was treated in an early trial with a viral vector."
      - "Separate severe inherited disorders from common traits and skin conditions."
    diagram: null
    confidence: "low"
  - topic: "gene_therapy"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "In ex vivo gene therapy, where is the gene introduced?"
    correct: "Into cells removed from the patient, which are then returned"
    unit: ""
    wrong:
      - {text: "Directly into the bloodstream without any carrier", mistake: "assumes naked DNA always reaches target cells"}
      - {text: "Only onto the skin surface of the patient", mistake: "limits gene therapy to surface treatment"}
      - {text: "Into sperm before the patient is born", mistake: "confuses somatic gene therapy with germline modification"}
    explanation: "In ex vivo therapy, cells are taken from the patient, the gene is added in the laboratory, and the modified cells are infused back. In vivo therapy delivers the gene directly into the body."
    hints:
      - "Think about whether the cells are treated outside or inside the body."
      - "Consider the step that happens before the cells are returned."
      - "Separate the laboratory step from the direct delivery step."
    diagram: null
    confidence: "high"
  - topic: "gene_therapy"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "A gene therapy vector transfers the gene to 60 percent of 2000 cells. How many cells carry the gene? Give the count only."
    correct: "1200"
    unit: ""
    wrong: []
    explanation: "Sixty percent of 2000 cells is 1200 cells that carry the gene."
    hints:
      - "Convert the transfer percentage into a fraction."
      - "Apply the fraction to the total cell count."
      - "Check that the answer is a count of cells."
    diagram: null
    confidence: "high"
  - topic: "gene_therapy"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A transgenic animal produces a human protein in its milk. What is the main practical benefit?"
    correct: "The protein can be collected easily from the milk in large amounts"
    unit: ""
    wrong:
      - {text: "The animal creates a new gene for its milk", mistake: "assumes the transgene changes the milk's own genes"}
      - {text: "The milk loses all its natural nutrients", mistake: "assumes producing a protein removes the milk's nutrients"}
      - {text: "The protein stops being made after one day", mistake: "assumes the transgene is switched off after the first milking"}
    explanation: "Milk is easy to collect in quantity, so a transgenic animal that secretes a human protein into milk is a convenient production system. The protein is extracted and purified from the milk."
    hints:
      - "Think about where the protein ends up in the animal."
      - "Consider how easily milk can be collected from the animal."
      - "Ask which feature of milk makes it useful for producing a protein."
    diagram: null
    confidence: "high"
  - topic: "gene_therapy"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A transgenic herd has 40 goats, and 35 percent of them produce the human protein. How many goats produce it? Give the count only."
    correct: "14"
    unit: ""
    wrong: []
    explanation: "Thirty-five percent of 40 goats is 14 goats that produce the protein."
    hints:
      - "Convert the percentage into a fraction."
      - "Apply the fraction to the herd size."
      - "Check that the answer is a count of goats."
    diagram: null
    confidence: "high"
  - topic: "ethical_issues_biotech"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What does biosafety primarily aim to prevent in genetically modified research?"
    correct: "Accidental release of harmful organisms or genes into the environment"
    unit: ""
    wrong:
      - {text: "Lower crop yields on all farms", mistake: "treats a yield outcome as the purpose of biosafety"}
      - {text: "The loss of every plant species on Earth", mistake: "exaggerates the scope of biosafety concerns"}
      - {text: "An increase in the use of antibiotics", mistake: "reverses the aim of containment rules"}
    explanation: "Biosafety rules aim to contain modified organisms and prevent harm to people and ecosystems from accidental release. They include containment levels and risk assessment."
    hints:
      - "Think about the risk of an organism escaping containment."
      - "Consider who could be harmed by a released gene product or organism."
      - "Ask what the containment rules are designed to stop."
    diagram: null
    confidence: "high"
  - topic: "ethical_issues_biotech"
    type: "mcq"
    difficulty: "easy"
    role: "explain"
    stem: "What is a major ethical concern about genetically modified crops?"
    correct: "Uncertainty about long-term effects on ecosystems and food safety"
    unit: ""
    wrong:
      - {text: "They always produce identical yields in every season", mistake: "states a false claim about yields"}
      - {text: "They cannot carry any foreign genes", mistake: "states a false claim about the biology of GM crops"}
      - {text: "They never need any water to grow", mistake: "states a false claim about crop water needs"}
    explanation: "Debate about GM crops centres on the uncertain long-term effects on ecosystems, gene flow to wild relatives and food safety. These concerns are reviewed case by case."
    hints:
      - "Think about effects that may only show over many years."
      - "Consider which effects are hard to predict for the wider ecosystem."
      - "Separate proven facts about crops from questions still under study."
    diagram: null
    confidence: "high"
  - topic: "ethical_issues_biotech"
    type: "mcq"
    difficulty: "medium"
    role: "procedure"
    stem: "Which regulatory step checks a genetically modified product before its release?"
    correct: "Risk assessment by an approved regulatory body"
    unit: ""
    wrong:
      - {text: "Public voting on every crop batch", mistake: "replaces formal assessment with a popular vote"}
      - {text: "Random tasting by a farmer", mistake: "treats an informal test as a regulatory check"}
      - {text: "Export without any testing", mistake: "reverses the purpose of pre-release checks"}
    explanation: "Regulators evaluate environmental and health risks before a GM product is released, using scientific data and review. This step is central to safe approval."
    hints:
      - "Think about who evaluates environmental and health risks."
      - "Consider a formal evaluation carried out before wider use."
      - "Separate formal risk checks from informal or commercial steps."
    diagram: null
    confidence: "high"
  - topic: "ethical_issues_biotech"
    type: "mcq"
    difficulty: "medium"
    role: "apply"
    stem: "Which concern relates to patenting of biological materials taken from communities?"
    correct: "Access and benefit sharing for traditional knowledge and genetic resources"
    unit: ""
    wrong:
      - {text: "Patents make seeds free of cost", mistake: "assumes patents lower the price of seeds"}
      - {text: "Patents guarantee better taste in food", mistake: "links patents to a quality outcome"}
      - {text: "Patenting stops all diseases", mistake: "overstates what patents can achieve"}
    explanation: "Patenting a biological resource or a traditional use raises questions of fair access and benefit sharing with the communities that provided the knowledge or material. These questions form part of biosafety and bioethics debate."
    hints:
      - "Think about who owns a biological resource and who benefits from it."
      - "Consider the communities that provided the original resource."
      - "Separate the question of ownership from the question of product quality."
    diagram: null
    confidence: "high"
  - topic: "ethical_issues_biotech"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "A proposed genetically modified animal may suffer welfare harm. Which principle best guides the decision?"
    correct: "Weigh the benefit against the animal's suffering through independent review"
    unit: ""
    wrong:
      - {text: "Approve it if the benefit goes only to the company", mistake: "ignores the harm to the animal and the wider public"}
      - {text: "Skip review because the animal is not human", mistake: "assumes animal welfare needs no oversight"}
      - {text: "Ignore welfare if the trait is only cosmetic", mistake: "treats welfare as irrelevant for cosmetic traits"}
    explanation: "Animal use in research and modification requires a balance of expected benefits against harms to the animal, judged by an independent committee. Harm to the animal must be justified, not overlooked."
    hints:
      - "Think about who checks the balance of benefits and harms."
      - "Consider whether the welfare cost has been weighed against the aim."
      - "Ask which option keeps an independent check in place."
    diagram: null
    confidence: "high"
  - topic: "ethical_issues_biotech"
    type: "numeric"
    difficulty: "hard"
    role: "apply"
    stem: "A biosafety committee reviews 48 applications and approves 3 of every 4. How many applications are approved? Give the count only."
    correct: "36"
    unit: ""
    wrong: []
    explanation: "Three quarters of 48 applications is 36 approvals."
    hints:
      - "Convert the approval ratio into a fraction."
      - "Apply the fraction to the total number of applications."
      - "Check that the answer is a count of applications."
    diagram: null
    confidence: "high"
