items:
  - topic: alcohol_preparation_reactions
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which reagent oxidises a primary alcohol to an aldehyde without over-oxidation to an acid?"
    correct: "Pyridinium chlorochromate"
    unit: ""
    wrong:
      - {text: "Acidified potassium dichromate", mistake: "over-oxidises the aldehyde to an acid"}
      - {text: "Concentrated nitric acid", mistake: "uses a strong acid that gives carboxylic acids"}
      - {text: "Sodium borohydride", mistake: "reduces rather than oxidises"}
    explanation: "Pyridinium chlorochromate is a mild oxidant that works in a non-aqueous solvent, so the reaction stops at the aldehyde."
    hints:
      - "Choose a mild oxidant that works in a non-aqueous solvent."
      - "Think about which oxidant avoids adding oxygen to the aldehyde."
      - "Eliminate reagents that are reductants."
    diagram: null
    confidence: high
  - topic: alcohol_preparation_reactions
    type: mcq
    difficulty: easy
    role: recall
    stem: "In the Lucas test, which type of alcohol becomes cloudy fastest?"
    correct: "Tertiary alcohol"
    unit: ""
    wrong:
      - {text: "Primary alcohol", mistake: "assumes the least hindered alcohol reacts fastest"}
      - {text: "Secondary alcohol", mistake: "places the middle case as the fastest"}
      - {text: "Phenol", mistake: "treats a phenol as an alcohol in this test"}
    explanation: "The Lucas reagent reacts by forming a carbocation. Tertiary alcohols give the most stable carbocation and react fastest, producing a turbidity almost at once."
    hints:
      - "Think about which carbocation is most stabilised."
      - "Consider which class of alcohol forms the most stable intermediate."
      - "Compare the rate at which each class becomes cloudy."
    diagram: null
    confidence: high
  - topic: alcohol_preparation_reactions
    type: mcq
    difficulty: medium
    role: apply
    stem: "What is the main product when ethanol is heated with concentrated sulphuric acid at about 443 K?"
    correct: "Ethene"
    unit: ""
    wrong:
      - {text: "Diethyl ether", mistake: "uses the lower temperature product"}
      - {text: "Acetaldehyde", mistake: "assumes an oxidation takes place"}
      - {text: "Ethane", mistake: "reduces the alcohol"}
    explanation: "At the higher temperature ethanol undergoes intramolecular dehydration, eliminating water to form ethene. At lower temperature the ether forms instead."
    hints:
      - "Think about dehydration of an alcohol at a high temperature."
      - "Consider which product results from removing water within one molecule."
      - "Compare the product at high and low temperature in this reaction."
    diagram: null
    confidence: high
  - topic: alcohol_preparation_reactions
    type: mcq
    difficulty: medium
    role: explain
    stem: "Which reagent reduces a carboxylic acid all the way to a primary alcohol?"
    correct: "Lithium aluminium hydride"
    unit: ""
    wrong:
      - {text: "Sodium borohydride", mistake: "is too weak to reduce carboxylic acids"}
      - {text: "Zinc amalgam with hydrochloric acid", mistake: "is the reagent for reducing a carbonyl to an alkane"}
      - {text: "Hydrogen with nickel at room temperature", mistake: "assumes mild hydrogenation reduces acids"}
    explanation: "Lithium aluminium hydride is a strong hydride donor that reduces the carboxyl group through the aldehyde stage to the primary alcohol."
    hints:
      - "Think about the number of hydride additions a carboxyl group takes to reach the alcohol."
      - "Consider which reducing agent is strong enough to attack a carboxyl group."
      - "Compare the strength of the reductants in the options."
    diagram: null
    confidence: high
  - topic: alcohol_preparation_reactions
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which mechanism applies when a secondary alcohol reacts with concentrated HBr?"
    correct: "SN1 via a carbocation"
    unit: ""
    wrong:
      - {text: "SN2 at the oxygen only", mistake: "places the attack on oxygen"}
      - {text: "Radical chain substitution", mistake: "assumes free radicals are involved"}
      - {text: "Electrophilic addition to a double bond", mistake: "assumes an alkene is present"}
    explanation: "The hydroxyl is protonated and leaves as water, giving a secondary carbocation that bromide attacks. The step is SN1 in character."
    hints:
      - "Think about the leaving group, which is water after protonation, and the carbon's ability to stabilise a positive charge."
      - "Consider whether the carbon forms an intermediate cation."
      - "Compare the substrate with a primary alcohol, which reacts differently."
    diagram: null
    confidence: high
  - topic: alcohol_preparation_reactions
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why does 1-propanol give no turbidity in the Lucas test at room temperature?"
    correct: "A primary carbocation is too unstable to form readily"
    unit: ""
    wrong:
      - {text: "Primary alcohols cannot dissolve in acid", mistake: "assumes solubility stops the reaction"}
      - {text: "Primary alcohols are solids at room temperature", mistake: "links physical state with reactivity"}
      - {text: "Primary alcohols react with water too fast", mistake: "reverses the reaction rate"}
    explanation: "Primary alcohols would need a primary carbocation, which is too unstable to form under these conditions, so the chloroalkane does not separate quickly."
    hints:
      - "Compare the stability of carbocations formed from primary and tertiary structures."
      - "Think about the intermediate needed for the Lucas reaction."
      - "Consider why the reaction is slow for the least hindered alcohol."
    diagram: null
    confidence: high
  - topic: phenol_properties
    type: mcq
    difficulty: easy
    role: explain
    stem: "Why is phenol more acidic than ethanol?"
    correct: "The phenoxide ion is stabilised by resonance with the ring"
    unit: ""
    wrong:
      - {text: "The ethoxide ion is stabilised by the ring", mistake: "assigns the ring to the wrong conjugate base"}
      - {text: "Phenol has more hydroxyl groups than ethanol", mistake: "miscounts the functional groups"}
      - {text: "Ethanol is aromatic", mistake: "reverses the aromaticity"}
    explanation: "The negative charge of phenoxide spreads into the benzene ring by resonance. Ethoxide has no such delocalisation, so ethanol is much less acidic."
    hints:
      - "Compare the conjugate bases and how their negative charge is spread out."
      - "Think about whether the negative charge can move onto the ring."
      - "Consider which conjugate base is more stable."
    diagram: null
    confidence: high
  - topic: phenol_properties
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which reagent converts phenol into a salt and water?"
    correct: "Sodium hydroxide"
    unit: ""
    wrong:
      - {text: "Sodium chloride", mistake: "assumes salts react with phenol"}
      - {text: "Hydrogen gas", mistake: "reduces the ring"}
      - {text: "Hydrochloric acid", mistake: "protonates instead of deprotonating"}
    explanation: "Phenol is weakly acidic, so a strong base removes its hydroxyl proton and forms sodium phenoxide and water."
    hints:
      - "Phenol is weakly acidic, so a strong base can remove its hydroxyl proton."
      - "Think about which reagent is a base rather than an acid or a reductant."
      - "Consider the salt formed from the phenol and the reagent."
    diagram: null
    confidence: high
  - topic: phenol_properties
    type: mcq
    difficulty: medium
    role: apply
    stem: "What product forms when phenol is treated with bromine water at room temperature?"
    correct: "2,4,6-tribromophenol"
    unit: ""
    wrong:
      - {text: "Monobromophenol only", mistake: "assumes a single substitution"}
      - {text: "Bromobenzene", mistake: "loses the hydroxyl group"}
      - {text: "1,2-dibromobenzene", mistake: "ignores the activating para position"}
    explanation: "The hydroxyl group strongly activates the ring at its ortho and para positions, so all three activated positions are brominated to give the tribromo product."
    hints:
      - "The hydroxyl group activates the positions ortho and para to it."
      - "Count how many activated positions are available on the ring."
      - "Consider how strongly a hydroxyl group activates the ring compared with a single halogen."
    diagram: null
    confidence: high
  - topic: phenol_properties
    type: mcq
    difficulty: medium
    role: apply
    stem: "Kolbe's reaction converts sodium phenoxide and carbon dioxide into which product?"
    correct: "Salicylic acid"
    unit: ""
    wrong:
      - {text: "Benzoic acid", mistake: "omits the hydroxyl group"}
      - {text: "Phthalic acid", mistake: "adds a second carboxyl group"}
      - {text: "Benzaldehyde", mistake: "reduces the carboxyl carbon"}
    explanation: "Carbon dioxide adds to the ring at the position ortho to the phenoxide oxygen, giving a product with both a carboxyl group and a hydroxyl group on the ring."
    hints:
      - "The product has a carboxyl group and a hydroxyl group on the same ring."
      - "Think about which ring position receives the carboxyl group."
      - "Consider the position the phenoxide directs the electrophile to."
    diagram: null
    confidence: high
  - topic: phenol_properties
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which reagents are used in the Reimer-Tiemann reaction of phenol?"
    correct: "Chloroform and sodium hydroxide"
    unit: ""
    wrong:
      - {text: "Carbon tetrachloride and water", mistake: "uses a reagent that does not generate the carbene"}
      - {text: "Acetyl chloride and pyridine", mistake: "describes an acylation instead"}
      - {text: "Ethanoic anhydride and an acid", mistake: "describes an esterification instead"}
    explanation: "Chloroform in strong base generates dichlorocarbene, which attacks the phenoxide ring to give an ortho hydroxybenzaldehyde after hydrolysis."
    hints:
      - "Think about which reagent generates a reactive carbene species in strong base."
      - "Consider the halomethane that reacts with base to form a carbon electrophile."
      - "Compare the reagents with those for acylation and esterification."
    diagram: null
    confidence: high
  - topic: phenol_properties
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why does phenol give a violet colour with aqueous ferric chloride?"
    correct: "It forms a coloured complex with iron(III) ions"
    unit: ""
    wrong:
      - {text: "It oxidises the iron to a higher state", mistake: "reverses the redox roles"}
      - {text: "It reduces the iron to iron(II)", mistake: "reverses the redox roles"}
      - {text: "It precipitates iron hydroxide", mistake: "assumes a base precipitates the iron"}
    explanation: "The phenolic oxygen coordinates to iron(III), giving a coloured complex. This colour test is used to detect phenols."
    hints:
      - "Consider how the oxygen of an aromatic hydroxyl can bind to a metal ion."
      - "Think about whether a complex or a redox change gives the colour."
      - "Compare this test with a precipitation test."
    diagram: null
    confidence: high
  - topic: ether_preparation
    type: mcq
    difficulty: easy
    role: recall
    stem: "What reactants are used in the Williamson synthesis of an ether?"
    correct: "Sodium alkoxide and an alkyl halide"
    unit: ""
    wrong:
      - {text: "Alcohol and concentrated sulphuric acid only", mistake: "describes dehydration instead"}
      - {text: "Phenol and nitric acid", mistake: "describes nitration"}
      - {text: "Ethene and water", mistake: "describes hydration of an alkene"}
    explanation: "The alkoxide ion attacks a primary alkyl halide in an SN2 step, forming the C-O-C linkage of the ether."
    hints:
      - "Think about a nucleophile that attacks a haloalkane in an SN2 step."
      - "Consider which reactant supplies the oxygen nucleophile."
      - "Compare the reactants with those used in acid dehydration."
    diagram: null
    confidence: high
  - topic: ether_preparation
    type: mcq
    difficulty: easy
    role: apply
    stem: "Which ether forms from sodium ethoxide and methyl iodide by the Williamson synthesis?"
    correct: "Ethyl methyl ether"
    unit: ""
    wrong:
      - {text: "Dimethyl ether", mistake: "uses methoxide instead of ethoxide"}
      - {text: "Diethyl ether", mistake: "copies the ethyl group twice"}
      - {text: "Methanol", mistake: "reports the alcohol byproduct"}
    explanation: "The ethoxide oxygen bonds to the methyl carbon, giving an ethyl group and a methyl group on either side of the oxygen."
    hints:
      - "Identify both alkyl groups attached to the oxygen after the reaction."
      - "Note which alkyl group came from the alkoxide and which from the halide."
      - "Compare the two alkyl groups with the names of the ether options."
    diagram: null
    confidence: high
  - topic: ether_preparation
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is a tertiary alkyl halide unsuitable as the halide in a Williamson synthesis?"
    correct: "It undergoes elimination, giving an alkene instead of the ether"
    unit: ""
    wrong:
      - {text: "It is too polar to react", mistake: "misjudges the polarity"}
      - {text: "It gives an ester instead", mistake: "confuses ether with ester"}
      - {text: "It dissolves water and stops the reaction", mistake: "treats solubility as the problem"}
    explanation: "The alkoxide is a strong base, and a tertiary halide is hindered for SN2. Elimination dominates, so an alkene forms instead of the ether."
    hints:
      - "Consider the competing reaction when a strong base meets a hindered substrate."
      - "Think about whether the alkoxide acts as a base or as a nucleophile on a tertiary carbon."
      - "Compare the expected product with what the strong base produces on a hindered halide."
    diagram: null
    confidence: high
  - topic: ether_preparation
    type: mcq
    difficulty: medium
    role: apply
    stem: "Acid catalysed dehydration of two ethanol molecules gives which ether?"
    correct: "Diethyl ether"
    unit: ""
    wrong:
      - {text: "Ethyl methyl ether", mistake: "mixes two different alkyl groups"}
      - {text: "Dimethyl ether", mistake: "shortens the alkyl chains"}
      - {text: "Vinyl ether", mistake: "introduces a double bond"}
    explanation: "Two ethanol molecules lose one water between them, linking their ethyl groups through an oxygen to form diethyl ether."
    hints:
      - "Count the carbons in each ethyl group that join through the oxygen."
      - "Think about which two molecules combine and what is lost between them."
      - "Check that the number of carbons in the product matches the reactants."
    diagram: null
    confidence: high
  - topic: ether_preparation
    type: mcq
    difficulty: hard
    role: transfer
    stem: "What is formed when an ether such as methyl ethyl ether is cleaved with hot concentrated HI?"
    correct: "An alcohol and an alkyl iodide"
    unit: ""
    wrong:
      - {text: "Two alcohols only", mistake: "assumes both C-O bonds break to alcohols"}
      - {text: "Two alkenes", mistake: "assumes elimination occurs"}
      - {text: "An ester and water", mistake: "confuses cleavage with esterification"}
    explanation: "Iodide attacks the less hindered alkyl carbon, releasing an alcohol and an alkyl iodide. With excess HI the alcohol may also convert to an iodide."
    hints:
      - "Think about the iodide attacking the less hindered alkyl carbon."
      - "Consider which two products form when one C-O bond breaks."
      - "Compare cleavage with esterification as possible reactions."
    diagram: null
    confidence: high
  - topic: ether_preparation
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why does anisole react with HI to give phenol and methyl iodide rather than the reverse cleavage?"
    correct: "The aryl oxygen bond is stronger, so the methyl carbon is attacked"
    unit: ""
    wrong:
      - {text: "The benzene ring is attacked first", mistake: "assumes the ring undergoes addition"}
      - {text: "Iodine oxidises the methyl group", mistake: "treats the reaction as an oxidation"}
      - {text: "Methanol forms in the first step", mistake: "misreads the sequence of steps"}
    explanation: "The bond between the sp2 aryl carbon and oxygen is stronger than the bond to the methyl carbon, so iodide attacks the methyl group and phenol is left behind."
    hints:
      - "Compare the bond strengths of the aryl carbon to oxygen and the methyl carbon to oxygen."
      - "Think about which carbon is more easily attacked by the iodide ion."
      - "Consider which carbon is sp3 hybridised and which is sp2."
    diagram: null
    confidence: high
