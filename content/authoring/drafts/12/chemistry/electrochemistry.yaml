    type: mcq
    difficulty: medium
    role: explain
    stem: "How does a sacrificial anode of zinc protect an iron structure from rusting?"
    correct: "It is oxidised preferentially, so the iron is not"
    unit: ""
    wrong:
      - {text: "It is reduced in place of the iron", mistake: "reverses the protection mechanism"}
      - {text: "It acts as a salt bridge", mistake: "gives the metal a bridge role"}
      - {text: "It raises the pH of the water", mistake: "attributes protection to a pH change"}
    explanation: "Zinc is more reactive than iron, so it is oxidised first and corrodes in place of the iron. The iron then stays reduced and protected."
    hints:
      - "Compare the standard potentials of the protecting metal and iron."
      - "Think about which metal is more easily oxidised in contact with iron."
      - "Decide which metal becomes the anode in the corrosion cell."
