    stem: "A tin coating on iron is scratched and the iron is exposed to moist air. Which statement explains why the iron then rusts faster than it would without the coating?"
    correct: "Tin is less active than iron, so iron becomes the anode and oxidises"
    unit: ""
    wrong:
      - {text: "Tin is more active than iron and dissolves first", mistake: "reverses the activity order"}
      - {text: "Tin releases oxygen that attacks the iron", mistake: "assigns a gas-releasing role to the coating"}
      - {text: "Tin forms a salt bridge that carries electrons", mistake: "treats the coating as an electron conductor in solution"}
    explanation: "Tin is less reactive than iron. Once the coating is broken, the exposed iron acts as the anode of a corrosion cell and is oxidised."
    hints:
      - "Compare the reactivity of tin and iron in the electrochemical series."
      - "Decide which metal is oxidised when the two are in contact in water."
      - "Think about which metal acts as the anode in the corrosion cell."
