  - topic: batteries_corrosion
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why is a primary cell not practically rechargeable?"
    correct: "Its electrode reactions are largely irreversible in the cell"
    unit: ""
    wrong:
      - {text: "Its electrolyte evaporates completely each cycle", mistake: "assumes evaporation is the main limit"}
      - {text: "Its anode dissolves as a gas", mistake: "confuses metal dissolution with gas formation"}
      - {text: "It produces too high a voltage to be recharged", mistake: "links voltage with rechargeability"}
    explanation: "The reactions in a primary cell cannot be easily reversed, because the products do not re-form the original reactants at the electrodes. Recharging therefore fails or damages the cell."
    hints:
      - "Think about whether the chemical change can be run in reverse inside the cell."
      - "Consider the products formed at the electrodes during discharge."
      - "Compare the reversibility of the electrode reactions in primary and secondary cells."
    diagram: null
