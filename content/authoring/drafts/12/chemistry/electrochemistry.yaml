  - topic: conductance_electrolysis
    type: numeric
    difficulty: medium
    role: apply
    stem: "A salt solution of concentration 0.02 mol/L has a specific conductance of 0.0025 S/cm. What is its molar conductivity in S cm2/mol?"
    correct: "125"
    unit: "S cm2/mol"
    wrong: []
    explanation: "Molar conductivity equals the specific conductance times 1000 divided by the concentration in mol/L. That gives 0.0025 times 1000 divided by 0.02, which is 125."
    hints:
      - "Multiply the conductivity by one thousand and divide by the concentration in mol/L."
      - "The factor of one thousand converts the volume unit from cubic centimetres to litres."
      - "Keep track of the units through the calculation."
