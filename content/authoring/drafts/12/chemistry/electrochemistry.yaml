  - topic: nernst_equation
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A cell has a standard EMF of 0.46 V and transfers two electrons per reaction at 298 K. What is log K for the cell reaction? Give two decimal places."
    correct: "15.57"
    unit: ""
    wrong: []
    explanation: "At equilibrium the EMF is zero, so log K equals n times E divided by 0.0591. That gives 2 times 0.46 over 0.0591, which is about 15.57."
    hints:
      - "At equilibrium the cell EMF is zero, so the Nernst relation can be solved for the logarithm of the constant."
      - "Rearrange so that n times E sits on one side and the factor 0.0591 on the other."
      - "Keep enough decimal places during division before rounding."
    diagram: null
    confidence: high
