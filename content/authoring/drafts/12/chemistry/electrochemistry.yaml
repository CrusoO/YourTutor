  - topic: conductance_electrolysis
    type: numeric
    difficulty: hard
    role: transfer
    stem: "At infinite dilution the limiting molar conductivities of Na+ and Cl- are 50.1 and 76.3 S cm2/mol. What is the limiting molar conductivity of NaCl in S cm2/mol?"
    correct: "126.4"
    unit: "S cm2/mol"
    wrong: []
    explanation: "By Kohlrausch's law the limiting molar conductivity of a salt is the sum of the limiting ionic contributions. Adding 50.1 and 76.3 gives 126.4."
    hints:
      - "Add the limiting ionic contributions of the two ions."
      - "Each ion contributes independently at infinite dilution."
      - "Check the units carried by each contribution."
