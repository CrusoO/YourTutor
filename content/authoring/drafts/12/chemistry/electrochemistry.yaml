  - topic: electrochemical_cells
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the function of the salt bridge in a galvanic cell?"
    correct: "It completes the circuit by letting ions move and keeps the solutions neutral"
    unit: ""
    wrong:
      - {text: "It supplies electrons to the cathode", mistake: "treats the bridge as an electron conductor"}
      - {text: "It removes gases formed at the electrodes", mistake: "assigns a gas removal role to the bridge"}
      - {text: "It converts chemical energy into heat", mistake: "confuses the bridge with a heating element"}
    explanation: "The salt bridge lets ions migrate between the half cells so that charge balances, which keeps the circuit closed and the solutions neutral."
    hints:
      - "Think about what must move through the solution for the charge to balance."
      - "Consider why the two half cells would become charged without a link between them."
      - "Identify whether the bridge carries electrons or ions."
    diagram: null
    confidence: high
  - topic: electrochemical_cells
    type: mcq
    difficulty: medium
    role: apply
    stem: "In the cell Zn | Zn2+ || Cu2+ | Cu, which electrode is the positive terminal?"
    correct: "Copper"
    unit: ""
    wrong:
      - {text: "Zinc", mistake: "assumes the anode is always the positive terminal"}
      - {text: "Both electrodes are neutral", mistake: "ignores the charge that builds up in a working cell"}
      - {text: "The salt bridge", mistake: "treats the bridge as an electrode"}
    explanation: "Zinc is oxidised at the anode, which is the negative terminal. Copper ions are reduced at the cathode, which is the positive terminal."
    hints:
      - "Find the electrode where reduction happens."
      - "The cathode in a galvanic cell is where electrons are consumed."
      - "Compare the standard potentials of the two couples."
    diagram: "Left beaker holds a zinc rod in zinc sulphate solution, right beaker holds a copper rod in copper sulphate solution, a salt bridge joins the beakers, and a voltmeter is wired between the two rods."
    confidence: high
  - topic: electrochemical_cells
    type: numeric
    difficulty: medium
    role: procedure
    stem: "The standard EMF of the Daniell cell is 1.10 V and two electrons are transferred per reaction. Using F = 96500 C/mol, what is the magnitude of the standard Gibbs energy change in kJ/mol? Give one decimal place."
    correct: "212.3"
    unit: "kJ/mol"
    wrong: []
    explanation: "Delta G equals minus n F E. With n = 2, F = 96500 C/mol and E = 1.10 V, the magnitude is 212300 J/mol, or 212.3 kJ/mol."
    hints:
      - "Use the relation between the Gibbs energy change, the number of electrons, the Faraday constant and the cell EMF."
      - "Keep the EMF in volts and the charge in coulombs per mole."
      - "Convert joules to kilojoules at the end."
    diagram: null
    confidence: high
  - topic: electrochemical_cells
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A galvanic cell has a magnesium anode and a silver cathode. Which description of electron flow is correct?"
    correct: "From magnesium to silver through the external wire"
    unit: ""
    wrong:
      - {text: "From silver to magnesium through the external wire", mistake: "reverses the direction of flow"}
      - {text: "Through the salt bridge from magnesium to silver", mistake: "routes electrons through the solution"}
      - {text: "From magnesium to silver through the solution", mistake: "confuses ionic and electronic paths"}
    explanation: "Electrons leave the anode where magnesium is oxidised and travel through the external wire to the silver cathode. Ions, not electrons, move through the solution and bridge."
    hints:
      - "Electrons leave the electrode where oxidation happens."
      - "Trace the path of electrons only through the metal conductor."
      - "Ions move through the bridge while electrons do not."
    diagram: "Two beakers: a magnesium rod in magnesium salt solution on the left and a silver rod in silver salt solution on the right, joined by a salt bridge, with a wire and voltmeter connecting the two rods."
    confidence: high
  - topic: electrochemical_cells
    type: numeric
    difficulty: hard
    role: apply
    stem: "The standard reduction potential of the cathode half cell is 0.34 V and that of the anode half cell is -0.76 V. What is the cell EMF in volts? Give two decimal places."
    correct: "1.10"
    unit: "V"
    wrong: []
    explanation: "The cell EMF is the cathode reduction potential minus the anode reduction potential. Subtracting -0.76 from 0.34 gives 1.10 V."
    hints:
      - "Subtract the anode reduction potential from the cathode reduction potential."
      - "Subtracting a negative number adds its magnitude."
      - "Report the answer with two decimal places."
    diagram: null
    confidence: high
  - topic: nernst_equation
    type: numeric
    difficulty: easy
    role: recall
    stem: "A cell has a standard EMF of 0.50 V and its reaction quotient equals 1 at 298 K. What is the cell EMF in volts?"
    correct: "0.5"
    unit: "V"
    wrong: []
    explanation: "When Q equals 1 the logarithm term vanishes, so the cell EMF equals the standard EMF."
    hints:
      - "When the reaction quotient equals one, the logarithm term in the equation disappears."
      - "Identify which term is left in the equation."
      - "Compare the cell EMF with the standard EMF under these conditions."
    diagram: null
    confidence: high
  - topic: nernst_equation
    type: mcq
    difficulty: easy
    role: recall
    stem: "At 298 K, what is the coefficient multiplying log Q in the Nernst equation for a reaction with n electrons, in volts?"
    correct: "0.0591 divided by n"
    unit: ""
    wrong:
      - {text: "0.0591 multiplied by n", mistake: "inverts the role of n"}
      - {text: "8.314 times 298", mistake: "uses the gas constant and temperature without the Faraday constant"}
      - {text: "0.0821 divided by n", mistake: "uses gas constant units from litre atmospheres"}
    explanation: "The coefficient is 2.303 times R times T divided by n times F. At 298 K this evaluates to about 0.0591 divided by n volts."
    hints:
      - "The coefficient comes from 2.303 times R times T, divided by n times F."
      - "Evaluate that group at 298 K and express the result in volts."
      - "Check whether the number of electrons sits in the numerator or the denominator."
    diagram: null
    confidence: high
  - topic: nernst_equation
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A cell has a standard EMF of 1.10 V, transfers two electrons, and has reaction quotient 0.1 at 298 K. What is the cell EMF in volts? Give two decimal places."
    correct: "1.13"
    unit: "V"
    wrong: []
    explanation: "E equals E standard minus 0.0591 over n times log Q. With log 0.1 equal to minus 1, the correction adds 0.0296 V, giving 1.13 V."
    hints:
      - "Apply the Nernst equation with the coefficient for two electrons."
      - "Find the logarithm of the reaction quotient before multiplying."
      - "Subtract the correction term from the standard EMF with its sign kept."
    diagram: null
    confidence: high
  - topic: nernst_equation
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does changing the concentration of ions alter the EMF of a cell?"
    correct: "It shifts the reaction quotient away from equilibrium and changes the Gibbs energy"
    unit: ""
    wrong:
      - {text: "It changes the standard electrode potentials", mistake: "confuses the EMF with the standard value"}
      - {text: "It alters the number of electrons transferred", mistake: "treats concentration as if it changed the stoichiometry"}
      - {text: "It replaces the function of the salt bridge", mistake: "links concentration with the bridge function"}
    explanation: "Concentrations enter the reaction quotient. Changing them changes the Gibbs energy and hence the EMF, while the standard potentials stay fixed."
    hints:
      - "Think about what the logarithm term in the Nernst equation accounts for."
      - "Recall how a reaction quotient is built from product and reactant concentrations."
      - "Consider whether standard potentials depend on the concentrations used."
    diagram: null
    confidence: high
