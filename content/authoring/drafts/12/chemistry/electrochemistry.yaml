    role: recall
    stem: "Which unit is used for molar conductivity?"
    correct: "S cm2 mol-1"
    unit: ""
    wrong:
      - {text: "S cm-1", mistake: "gives the unit of specific conductance instead"}
      - {text: "ohm mol", mistake: "drops the area term from the unit"}
