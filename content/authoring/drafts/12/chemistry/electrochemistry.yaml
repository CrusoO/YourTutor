    role: transfer
    stem: "A silver concentration cell has electrodes in 0.001 M and 0.1 M silver ion solutions at 298 K. What is its EMF in volts? Give two decimal places."
    correct: "0.12"
    unit: "V"
    wrong: []
    explanation: "Both half cells have the same standard potential, so only the logarithm term remains. The ratio of concentrations is 100, giving 0.0591 times 2, or 0.12 V."
    hints:
      - "A concentration cell has zero standard EMF, so only the logarithm term remains."
      - "Take the ratio of the two concentrations, with the more dilute one in the denominator."
      - "Use one electron for silver in the coefficient."
