  - topic: electrochemical_cells
    type: mcq
    difficulty: easy
    role: recall
    stem: "In a galvanic cell, where does oxidation occur?"
    correct: "At the anode"
    unit: ""
    wrong:
      - {text: "At the cathode", mistake: "swaps the roles of the two electrodes"}
      - {text: "At the salt bridge", mistake: "assigns electrode reactions to the bridge"}
      - {text: "In the external wire only", mistake: "confuses electron flow with the reaction site"}
    explanation: "Oxidation happens where electrons are released, which is the anode of a galvanic cell. Reduction happens at the cathode."
    hints:
      - "Recall which electrode loses electrons in a spontaneous cell."
      - "Consider where electrons leave the cell."
      - "Think about the electrode where a species is oxidised."
