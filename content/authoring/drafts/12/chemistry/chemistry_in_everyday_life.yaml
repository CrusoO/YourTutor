  - topic: drugs_and_medicines
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which class of drug relieves pain without causing loss of consciousness?"
    correct: "Analgesic"
    unit: ""
    wrong:
      - {text: "Antiseptic", mistake: "is applied to living tissue to kill germs"}
      - {text: "Antibiotic", mistake: "treats bacterial infections"}
      - {text: "Antacid", mistake: "neutralises excess stomach acid"}
    explanation: "Analgesics act on pain pathways and reduce pain while leaving consciousness intact. Antiseptics, antibiotics and antacids have different roles."
    hints:
      - "Think about drugs that act on pain signals."
      - "Consider which drug class is used for pain relief rather than infection."
      - "Eliminate the classes that target germs or stomach acid."
    diagram: null
    confidence: high
  - topic: drugs_and_medicines
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which antibiotic is described as broad spectrum, acting on both gram positive and gram negative bacteria?"
    correct: "Chloramphenicol"
    unit: ""
    wrong:
      - {text: "Penicillin", mistake: "is mainly narrow spectrum"}
      - {text: "Aspirin", mistake: "is an analgesic and not an antibiotic"}
      - {text: "Morphine", mistake: "is an opioid analgesic"}
    explanation: "Chloramphenicol is a broad spectrum antibiotic. The other options are an analgesic and an opioid, so they are not antibiotics."
    hints:
      - "Think about an antibiotic that works against many kinds of bacteria, not one narrow group."
      - "Eliminate the options that are not antibiotics."
      - "Consider which antibiotic is known for its wide range of activity."
    diagram: null
    confidence: medium
  - topic: drugs_and_medicines
    type: mcq
    difficulty: medium
    role: apply
    stem: "Ranitidine belongs to which class of drugs?"
    correct: "H2 receptor antagonists"
    unit: ""
    wrong:
      - {text: "Antiseptics", mistake: "are used on wounds rather than in the stomach"}
      - {text: "Tranquillisers", mistake: "act on the nervous system"}
      - {text: "Analgesics", mistake: "relieve pain"}
    explanation: "Ranitidine blocks histamine H2 receptors in the stomach lining, which reduces acid secretion. It is therefore an H2 receptor antagonist."
    hints:
      - "Think about the receptor type that stimulates acid release in the stomach."
      - "Consider which receptor blocker reduces acid secretion."
      - "Compare the drug's site of action with the other classes in the options."
    diagram: null
    confidence: medium
  - topic: drugs_and_medicines
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are tranquillisers prescribed?"
    correct: "To reduce stress and anxiety"
    unit: ""
    wrong:
      - {text: "To lower body temperature", mistake: "describes antipyretics"}
      - {text: "To kill bacteria", mistake: "describes antibiotics"}
      - {text: "To replace lost blood", mistake: "describes a different treatment"}
    explanation: "Tranquillisers calm the central nervous system and reduce anxiety and stress. They are used with care because of dependence risks."
    hints:
      - "Think about drugs that calm the nervous system."
      - "Consider the condition a calming drug is meant to treat."
      - "Eliminate treatments for fever, infection and blood loss."
    diagram: null
    confidence: high
  - topic: drugs_and_medicines
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why are sulpha drugs used less widely today than in the past?"
    correct: "Resistance has developed in many bacteria"
    unit: ""
    wrong:
      - {text: "They dissolve too strongly in body fat", mistake: "uses fat solubility as the cause"}
      - {text: "They are radioactive", mistake: "assumes drugs are radioactive"}
      - {text: "They are always toxic to humans", mistake: "overgeneralises toxicity"}
    explanation: "Many bacteria have evolved resistance to sulpha drugs through use over decades. Newer antibiotics are often preferred for this reason."
    hints:
      - "Think about how bacteria change over time when a drug is used widely."
      - "Consider the evolutionary response of microbes to repeated exposure."
      - "Compare the effect of resistance with the other reasons offered."
    diagram: null
    confidence: medium
  - topic: drugs_and_medicines
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why are competitive inhibitors called competitive?"
    correct: "They compete with the natural substrate for the active site"
    unit: ""
    wrong:
      - {text: "They destroy the enzyme permanently", mistake: "describes irreversible inhibition"}
      - {text: "They bind only to the drug's own molecules", mistake: "misreads the term"}
      - {text: "They increase the enzyme's rate", mistake: "describes an activator"}
    explanation: "A competitive inhibitor binds the same active site as the substrate. Raising the substrate concentration can overcome the inhibition."
    hints:
      - "Think about what the inhibitor must occupy to block the enzyme's usual binding."
      - "Consider whether the inhibitor and the substrate can bind the same site."
      - "Compare the reversible competition with a permanent inactivation."
    diagram: null
    confidence: high
  - topic: food_additives_chemicals
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which of these is an artificial sweetener?"
    correct: "Saccharin"
    unit: ""
    wrong:
      - {text: "Sucrose", mistake: "is a natural sugar"}
      - {text: "Glucose", mistake: "is a natural sugar"}
      - {text: "Fructose", mistake: "is a natural sugar"}
    explanation: "Saccharin is a synthetic compound that is many times sweeter than sugar and contributes almost no energy."
    hints:
