  - topic: food_additives_chemicals
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which compound is used as a food preservative?"
    correct: "Sodium benzoate"
    unit: ""
    wrong:
      - {text: "Sodium bicarbonate", mistake: "is used as a leavening agent"}
      - {text: "Calcium carbonate", mistake: "is an antacid and a firming agent"}
      - {text: "Potassium iodide", mistake: "is a nutritional supplement"}
    explanation: "Sodium benzoate is the salt of a weak acid. Its undissociated acid form inhibits the growth of yeasts, moulds and some bacteria in acidic foods."
    hints:
      - "Think about a salt of a weak acid that stops microbes growing."
      - "Consider which additive is chosen to slow spoilage."
      - "Eliminate additives used for leavening, antacids and supplements."
    diagram: null
    confidence: medium
  - topic: food_additives_chemicals
    type: mcq
    difficulty: medium
    role: recall
    stem: "How is soap prepared?"
    correct: "Saponification of fats with an alkali"
    unit: ""
    wrong:
      - {text: "Hydrogenation of oils", mistake: "makes margarine instead"}
      - {text: "Esterification of acids with alcohols", mistake: "makes esters"}
      - {text: "Oxidation of alcohols", mistake: "makes aldehydes or acids"}
    explanation: "Heating a fat or oil with a strong alkali hydrolyses its ester bonds, giving the sodium or potassium salt of the fatty acids, which is soap, and glycerol."
    hints:
      - "Think about the reaction of a fat with a strong base."
      - "Consider which reaction breaks ester bonds to release glycerol."
      - "Eliminate reactions that make esters or add hydrogen."
    diagram: null
    confidence: high
  - topic: food_additives_chemicals
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do soaps work poorly in hard water?"
    correct: "Calcium and magnesium ions form insoluble salts with soap"
    unit: ""
    wrong:
      - {text: "Hard water contains no ions", mistake: "misreads what hard water is"}
      - {text: "Soap turns into an acid in hard water", mistake: "reverses the chemistry"}
      - {text: "Hard water evaporates faster", mistake: "links evaporation with cleaning"}
    explanation: "Calcium and magnesium ions in hard water react with the fatty acid anions of soap to form insoluble scum, which wastes soap and leaves residue."
    hints:
      - "Think about the metal ions present in hard water and what they do with fatty acid salts."
      - "Consider which ions form precipitates with the soap anion."
      - "Compare the ions in hard water with the ions in soft water."
    diagram: null
    confidence: high
  - topic: food_additives_chemicals
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why are detergents preferred to soaps in hard water?"
    correct: "Their calcium salts remain soluble"
    unit: ""
    wrong:
      - {text: "They contain no salts at all", mistake: "misreads the composition"}
      - {text: "They increase the hardness of water", mistake: "reverses the effect"}
      - {text: "They are made from fats", mistake: "describes soaps instead"}
    explanation: "Detergents are often sodium alkyl sulphonates, whose calcium and magnesium salts stay dissolved in water. They therefore clean well in hard water without forming scum."
    hints:
      - "Consider whether the calcium salts of the detergent anions stay dissolved in water."
      - "Think about the anion type in a sulphonate detergent compared with a carboxylate soap."
      - "Compare the solubility of the metal salts formed by each cleaning agent."
    diagram: null
    confidence: high
  - topic: food_additives_chemicals
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which additive is the sodium salt of an amino acid used as a flavour enhancer?"
    correct: "Monosodium glutamate"
    unit: ""
    wrong:
      - {text: "Sodium nitrite", mistake: "is a preservative and colour fixer"}
      - {text: "Tartrazine", mistake: "is a colouring agent"}
      - {text: "Ascorbic acid", mistake: "is an antioxidant"}
    explanation: "Monosodium glutamate is the sodium salt of glutamic acid, an amino acid. It enhances savoury flavour in foods."
    hints:
      - "Think of the amino acid whose sodium salt makes savoury foods taste stronger."
      - "Consider which additive is used for flavour rather than for colour or preservation."
      - "Eliminate additives that are colours, preservatives or antioxidants."
