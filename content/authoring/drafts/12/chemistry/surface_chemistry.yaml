    confidence: high
  - topic: colloids_emulsions
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which property of colloidal particles is related to Brownian motion?"
    correct: "Random zig-zag movement caused by collisions with solvent molecules"
    unit: ""
    wrong:
      - {text: "Steady drift in one direction under an electric field", mistake: "confuses Brownian motion with electrophoresis"}
      - {text: "Settling to the bottom within a few seconds", mistake: "treats sedimentation as the same motion"}
      - {text: "Bending of a light beam as it passes through", mistake: "confuses motion with refraction"}
    explanation: "Brownian motion is the random movement of colloidal particles caused by unbalanced impacts from solvent molecules."
    hints:
      - "Think about the motion caused by impacts from the surrounding solvent molecules."
      - "Consider whether the motion has a net direction or is random."
      - "Separate random motion from motion driven by an external field."
    diagram: null
    confidence: high
  - topic: colloids_emulsions
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why is the Tyndall effect weaker in a true solution than in a colloid?"
    correct: "Solute particles are too small to scatter visible light efficiently"
    unit: ""
    wrong:
      - {text: "Solute particles absorb all visible light", mistake: "assumes true solutions are opaque"}
      - {text: "Solutions are denser, so light is refracted away", mistake: "links density with scattering"}
      - {text: "Solutions contain no particles at all", mistake: "assumes a solution is empty of matter"}
    explanation: "Scattering of visible light is strong only when particles are comparable to the wavelength of light, as in colloids. Dissolved molecules are far smaller, so they scatter very little."
    hints:
      - "Compare particle size in a solution and in a colloid with the wavelength of visible light."
      - "Think about which size range scatters light strongly."
      - "Consider whether the dissolved particles are large enough to deflect the beam."
    diagram: null
    confidence: high
