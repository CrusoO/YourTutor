    confidence: high
  - topic: colloids_emulsions
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which electrolyte is most effective in coagulating a negatively charged sol?"
    correct: "Aluminium chloride"
    unit: ""
    wrong:
      - {text: "Potassium chloride", mistake: "assumes monovalent ions are the strongest coagulants"}
      - {text: "Glucose", mistake: "treats a non-ionic solute as a coagulant"}
      - {text: "Sodium sulphate", mistake: "focuses on the anion instead of the cation charge"}
    explanation: "The coagulating power depends on the charge of the ion that neutralises the sol particles. A trivalent cation is far more effective than a monovalent one."
    hints:
      - "Consider the charge on the ion that neutralises the negatively charged particles."
      - "Compare the charge of the coagulating ion across the options."
      - "Think about which ion carries the highest positive charge."
