    confidence: high
  - topic: catalysis
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why does a trace of arsenic compound poison the iron catalyst used in the Haber process?"
    correct: "It binds strongly to active sites and blocks them"
    unit: ""
    wrong:
      - {text: "It increases the surface area of the iron", mistake: "assumes any added material enlarges the surface"}
      - {text: "It converts the iron into a gas", mistake: "assumes the catalyst evaporates"}
      - {text: "It supplies extra hydrogen to the reaction", mistake: "treats the poison as a reactant"}
    explanation: "Strongly bound poison molecules occupy the active sites that reactant molecules need, so the catalyst loses activity even though its mass is unchanged."
    hints:
      - "Consider what happens to surface sites when a foreign substance binds strongly to the catalyst."
      - "Think about whether the poison leaves room for reactant molecules to adsorb."
      - "Compare the activity of the catalyst before and after the poison is present."
    diagram: null
    confidence: high
  - topic: colloids_emulsions
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which property of colloids is shown by the Tyndall effect?"
    correct: "Scattering of light by dispersed particles"
    unit: ""
    wrong:
      - {text: "Absorption of light by the solvent", mistake: "reverses the roles of solvent and dispersed phase"}
      - {text: "Reflection of heat by the solutes", mistake: "confuses light with heat"}
      - {text: "Bending of light by dissolved ions", mistake: "treats refraction by ions as the effect"}
    explanation: "The Tyndall effect is the scattering of a light beam by particles of a colloid, which makes the beam path visible."
    hints:
      - "Think about what a beam of light does when it passes through a fine dispersion."
      - "Consider whether the particles in the path send light sideways."
      - "Compare what a true solution does to a light beam with what a colloid does."
    diagram: null
    confidence: high
  - topic: colloids_emulsions
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which of these is an emulsion?"
    correct: "Milk"
    unit: ""
    wrong:
      - {text: "Sugar solution", mistake: "treats a true solution as a colloid"}
      - {text: "Smoke", mistake: "assumes every dispersion is an emulsion"}
      - {text: "Gold sol", mistake: "treats a solid dispersed in a liquid as an emulsion"}
    explanation: "An emulsion is a liquid dispersed in another liquid. Milk is an emulsion of fat droplets in water."
    hints:
      - "An emulsion is one liquid dispersed in another liquid."
      - "Think about which of these contains two liquids."
      - "Eliminate the options that are solid particles or true solutions."
