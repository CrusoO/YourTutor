items:
  - topic: adsorption
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which type of adsorption is characterised by weak van der Waals forces between the adsorbed species and the surface?"
    correct: "Physisorption"
    unit: ""
    wrong:
      - {text: "Chemisorption", mistake: "assumes all adsorption involves chemical bonds"}
      - {text: "Catalytic adsorption", mistake: "uses a term that does not name the binding force"}
      - {text: "Ion exchange", mistake: "confuses surface binding with the exchange of ions"}
    explanation: "Physisorption involves weak van der Waals forces and is easily reversed. Chemisorption involves chemical bonds and is much stronger."
    hints:
      - "Think about the force holding the adsorbed species when no chemical bond forms."
      - "Consider which type of adsorption is easily reversed on lowering pressure."
      - "Compare the strength of the binding in the two adsorption types."
    diagram: null
    confidence: high
  - topic: adsorption
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which empirical relation describes the adsorption of a gas on a solid over a range of pressures?"
    correct: "Freundlich adsorption isotherm"
    unit: ""
    wrong:
      - {text: "Michaelis-Menten equation", mistake: "copies a relation from enzyme kinetics"}
      - {text: "Arrhenius equation", mistake: "uses a temperature rate law for adsorption"}
      - {text: "Raoult's law", mistake: "applies a vapour pressure law to surfaces"}
    explanation: "The Freundlich isotherm relates the mass adsorbed per gram to pressure with a power law. It is an empirical relation that fits many gas adsorption data."
    hints:
      - "Consider the empirical isotherm that relates the mass adsorbed to pressure through an exponent."
      - "Recall the form of that relation, with the exponent written as one over n."
      - "Think about which isotherm is named after a scientist and used for solids."
    diagram: null
    confidence: high
  - topic: adsorption
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does chemisorption initially increase as the temperature rises?"
    correct: "It needs activation energy to form bonds at the surface"
    unit: ""
    wrong:
      - {text: "The gas expands and fills more of the surface", mistake: "treats gas volume as the cause"}
      - {text: "Physical forces grow stronger with heat", mistake: "reverses the trend of the physical forces"}
      - {text: "The adsorbent melts and exposes more surface", mistake: "assumes a phase change is needed for adsorption"}
    explanation: "Chemisorption requires an activation energy to form chemical bonds at the surface, so the rate of adsorption rises with temperature at first."
    hints:
      - "Consider whether forming bonds at a surface requires an energy barrier to be crossed."
      - "Compare chemisorption with physisorption, which weakens as temperature rises."
      - "Think about what the added heat supplies to the molecules arriving at the surface."
    diagram: null
    confidence: high
  - topic: adsorption
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which property is typical of a good adsorbent?"
    correct: "A large surface area per gram"
    unit: ""
    wrong:
      - {text: "A small surface area", mistake: "confuses surface area with bulk size"}
      - {text: "A high solubility in the gas", mistake: "mixes up absorption with adsorption"}
      - {text: "A smooth, nonporous surface", mistake: "assumes smoothness increases binding"}
    explanation: "Adsorption happens at the surface, so a finely divided or porous material with a large area per gram adsorbs the most gas."
    hints:
      - "Adsorption happens only at the surface, so the amount depends on how much surface is available."
      - "Consider how porous and finely divided materials compare with bulk pieces."
      - "Think about the total area per unit mass that can bind molecules."
    diagram: null
    confidence: high
  - topic: adsorption
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Gas adsorption on a solid has a negative entropy change. What must hold for the process to be spontaneous at a given temperature?"
    correct: "The enthalpy change must be negative and large enough to outweigh the entropy loss"
    unit: ""
    wrong:
      - {text: "The entropy must increase, which it cannot do on a surface", mistake: "assumes entropy must rise for any spontaneous process"}
      - {text: "The enthalpy change must be positive", mistake: "assumes heat absorption drives adsorption"}
      - {text: "The temperature must be zero", mistake: "treats absolute zero as a requirement"}
    explanation: "Spontaneity requires a negative Gibbs energy change. With a negative entropy change, the enthalpy change must be negative and sufficiently large to make the Gibbs energy negative."
    hints:
      - "Write the Gibbs energy as the enthalpy change minus the temperature times the entropy change."
      - "Consider the sign of the term that involves the entropy change."
      - "Compare the size of the enthalpy term with the size of the entropy term."
    diagram: null
    confidence: high
  - topic: adsorption
    type: mcq
    difficulty: hard
    role: transfer
    stem: "In the Langmuir monolayer model, what limits the amount adsorbed as the pressure keeps increasing?"
    correct: "All surface sites are occupied, so adsorption levels off"
    unit: ""
    wrong:
      - {text: "The gas dissolves into the bulk of the solid", mistake: "confuses adsorption with absorption"}
      - {text: "Adsorption rises without any limit", mistake: "ignores the finite number of surface sites"}
      - {text: "The temperature falls as the pressure rises", mistake: "links pressure with a temperature change"}
    explanation: "The Langmuir model assumes one layer of sites. Once every site is covered, further pressure cannot add more adsorbed molecules, so the amount levels off."
    hints:
      - "Think about how many sites are available on the surface."
      - "Consider what happens once every available site holds a molecule."
      - "Compare the adsorbed amount at high pressure with the amount at low pressure."
    diagram: null
    confidence: high
  - topic: catalysis
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which pair describes a homogeneous catalytic process?"
    correct: "Dilute acid catalysing the hydrolysis of an ester in water"
    unit: ""
    wrong:
      - {text: "Iron powder used in ammonia synthesis", mistake: "treats a solid catalyst as homogeneous"}
      - {text: "Platinum gauze used in ammonia oxidation", mistake: "mixes up the phase of the catalyst"}
      - {text: "Nickel powder hydrogenating an oil", mistake: "assumes all metal catalysts are homogeneous"}
    explanation: "In homogeneous catalysis the catalyst and reactants are in the same phase, as with an acid dissolved in the aqueous reaction mixture."
    hints:
      - "Check whether the catalyst and the reactants are in the same phase."
      - "Think about whether the catalyst is a solid, a gas or dissolved in the same liquid."
      - "Look for a catalyst that is an aqueous species in an aqueous reaction."
    diagram: null
    confidence: high
  - topic: catalysis
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which catalyst is used in the step that oxidises sulphur dioxide in the contact process for sulphuric acid?"
    correct: "Vanadium pentoxide"
    unit: ""
    wrong:
      - {text: "Nickel", mistake: "uses a hydrogenation catalyst"}
      - {text: "Iron oxide", mistake: "uses the catalyst from the ammonia synthesis"}
      - {text: "Sulphuric acid itself", mistake: "treats the product as the catalyst"}
    explanation: "Vanadium pentoxide catalyses the oxidation of sulphur dioxide to sulphur trioxide in the contact process."
    hints:
      - "Think about the metal oxide used to speed up the oxidation of sulphur dioxide."
      - "Recall which oxide of a Group 5 metal is used in this industrial step."
      - "Eliminate catalysts used in hydrogenation and in ammonia synthesis."
    diagram: null
    confidence: high
  - topic: catalysis
    type: mcq
    difficulty: medium
    role: explain
    stem: "How does a catalyst increase the rate of a reaction?"
    correct: "It lowers the activation energy by providing an alternative pathway"
    unit: ""
    wrong:
      - {text: "It raises the equilibrium constant", mistake: "confuses the rate with the equilibrium position"}
      - {text: "It supplies extra energy to the molecules", mistake: "treats the catalyst as a heat source"}
      - {text: "It changes the enthalpy of the reaction", mistake: "assumes the enthalpy depends on the path taken"}
    explanation: "A catalyst opens a route with a lower energy barrier. Both the forward and reverse reactions speed up, and the equilibrium position is unchanged."
    hints:
      - "Compare the energy barrier with and without the catalyst."
      - "Think about whether the catalyst changes where the reaction ends up or only how fast it gets there."
      - "Consider which energy quantity the catalyst alters."
    diagram: null
    confidence: high
  - topic: catalysis
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which kind of catalysis uses zeolites to convert alcohols selectively into hydrocarbons of a particular shape?"
    correct: "Shape-selective catalysis"
    unit: ""
    wrong:
      - {text: "Enzyme catalysis", mistake: "confuses zeolites with biological catalysts"}
      - {text: "Auto-catalysis", mistake: "assumes a product speeds up the reaction"}
      - {text: "Photocatalysis", mistake: "assumes light is required"}
    explanation: "Zeolites have pores of fixed size, so only molecules of a suitable shape can enter and react. This restricts which products form."
    hints:
      - "Think about how the pore structure of a solid restricts which molecules can react."
      - "Consider whether the selectivity comes from the size of the openings in the catalyst."
      - "Compare the cases where a product speeds the reaction with the case where the pore size matters."
    diagram: null
    confidence: high
  - topic: catalysis
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why are enzymes highly specific for their substrates?"
    correct: "Their active site has a shape that fits a particular substrate"
    unit: ""
    wrong:
      - {text: "They are built from a single amino acid", mistake: "assumes enzymes are simple chains"}
      - {text: "They work only at extreme pH values", mistake: "links specificity with pH"}
      - {text: "They react with every molecule at the same rate", mistake: "reverses the meaning of specificity"}
    explanation: "An enzyme's active site is shaped to bind one substrate or a narrow group of substrates, so only those molecules are processed efficiently."
    hints:
      - "Think about the shape and binding site of the protein."
      - "Consider how a key fits a lock in describing the binding."
      - "Compare how selective the binding is with how broadly a simple surface binds molecules."
