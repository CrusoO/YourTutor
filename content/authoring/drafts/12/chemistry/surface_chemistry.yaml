  - topic: colloids_emulsions
    type: mcq
    difficulty: medium
    role: recall
    stem: "What is the process called when a freshly formed precipitate is converted back into a colloidal sol by adding a small amount of electrolyte?"
    correct: "Peptisation"
    unit: ""
    wrong:
      - {text: "Electrophoresis", mistake: "confuses movement in a field with dispersal"}
      - {text: "Dialysis", mistake: "treats removal of ions as the same process"}
      - {text: "Coagulation", mistake: "reverses the direction of the change"}
    explanation: "Peptisation disperses a precipitate into colloidal particles, helped by an adsorbed common ion that gives the particles a charge."
    hints:
      - "Think about the process that disperses a precipitate back into fine particles."
      - "Consider which process restores the sol state after coagulation."
      - "Compare the process with its reverse, the one that makes particles settle."
