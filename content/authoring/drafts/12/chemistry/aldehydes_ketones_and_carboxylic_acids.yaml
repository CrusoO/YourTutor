  - topic: carboxylic_acid_reactions
    type: mcq
    difficulty: easy
    role: explain
    stem: "Why is ethanoic acid more acidic than ethanol?"
    correct: "Its carboxylate anion is stabilised by resonance"
    unit: ""
    wrong:
      - {text: "Ethanol has a larger molecular mass", mistake: "uses molecular mass as the cause"}
      - {text: "Ethanoic acid has no hydrogen bonds", mistake: "reverses the hydrogen bonding effect"}
      - {text: "Ethanol is more electronegative", mistake: "miscounts the electronegativity"}
    explanation: "The carboxylate ion shares its negative charge between two oxygens by resonance. Ethoxide has no such delocalisation, so ethanoic acid is far more acidic."
    hints:
      - "Compare the conjugate bases and the number of resonance structures they have."
      - "Think about how the negative charge spreads over the two oxygens."
      - "Consider which conjugate base is more stable."
    diagram: null
    confidence: high
