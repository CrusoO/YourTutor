    role: transfer
    stem: "Which factor favours hydrate formation from formaldehyde more than from acetone?"
    correct: "Fewer alkyl groups make the carbonyl carbon less crowded and more positive"
    unit: ""
    wrong:
      - {text: "Formaldehyde has stronger hydrogen bonds to the solvent", mistake: "assumes hydrogen bonding is the sole factor"}
      - {text: "Acetone has a larger dipole moment", mistake: "uses a dipole argument that does not decide the equilibrium"}
      - {text: "Formaldehyde is a solid at room temperature", mistake: "links physical state with hydrate formation"}
    explanation: "Hydrate formation depends on how easily water adds to the carbonyl carbon. Formaldehyde has two hydrogens there, so it is less hindered and more electrophilic, and its hydrate is favoured."
    hints:
      - "Compare how many groups surround the carbonyl carbon in each compound."
      - "Think about the electrophilicity of the carbonyl carbon and how crowded it is."
      - "Consider how the equilibrium of water addition depends on steric crowding."
    diagram: "Two carbonyl drawings side by side: formaldehyde with two hydrogens on the carbonyl carbon, and acetone with two methyl groups; arrows show water approaching the carbon."
    confidence: high
