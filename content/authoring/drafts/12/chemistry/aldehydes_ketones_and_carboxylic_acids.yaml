  - topic: nucleophilic_addition
    type: mcq
    difficulty: medium
    role: explain
    stem: "In the addition of HCN to an aldehyde, which atom of the carbonyl group is attacked first by the nucleophile?"
    correct: "The carbon"
    unit: ""
    wrong:
      - {text: "The oxygen", mistake: "assumes the more electronegative atom is attacked"}
      - {text: "The hydrogen", mistake: "assumes the aldehyde hydrogen is the electrophile"}
      - {text: "The nitrogen of the cyanide", mistake: "confuses the cyanide nitrogen with the carbonyl"}
    explanation: "The carbonyl carbon is electron poor because the C=O bond is polarised towards oxygen. The cyanide ion attacks this carbon, and oxygen then picks up a proton."
    hints:
      - "Consider which atom is electron poor because of the polar carbon oxygen bond."
      - "Think about the site where a nucleophile is attracted."
      - "Track where the electron pair of the new bond ends up."
    diagram: "Carbonyl group drawn as carbon double bonded to oxygen, with a curved arrow from a cyanide ion pointing to the carbon and the oxygen bearing a partial negative charge."
    confidence: high
  - topic: nucleophilic_addition
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is an aldehyde more reactive than a ketone towards nucleophilic addition?"
    correct: "Ketones have two electron donating alkyl groups that reduce the positive charge on carbon"
    unit: ""
    wrong:
      - {text: "Aldehydes have more oxygen atoms", mistake: "counts atoms instead of electronic effects"}
      - {text: "Ketones are protonated more easily", mistake: "reverses the protonation effect"}
      - {text: "Ketones are aromatic", mistake: "assumes ketones contain a ring"}
    explanation: "Two alkyl groups donate electron density to the carbonyl carbon, lowering its positive charge and crowding the approach of a nucleophile. Aldehydes are therefore more reactive."
    hints:
      - "Count the groups attached to the carbonyl carbon in each compound."
      - "Think about how an alkyl group changes the charge on the carbonyl carbon."
      - "Consider the steric effect of the groups around the carbonyl."
    diagram: null
    confidence: high
