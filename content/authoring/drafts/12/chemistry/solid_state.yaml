items:
  - topic: crystalline_and_amorphous
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which property separates a crystalline solid from an amorphous solid?"
    correct: "Sharp, definite melting point"
    unit: ""
    wrong:
      - {text: "Softens across a range of temperatures", mistake: "assigns the amorphous behaviour to the crystal"}
      - {text: "Always transparent to light", mistake: "treats transparency as the defining feature"}
      - {text: "Lower density than its liquid form", mistake: "assumes solids are always less dense than liquids"}
    explanation: "Crystalline solids have a long-range repeating arrangement, so they melt at one temperature. Amorphous solids lack that order and soften over a range."
    hints:
      - "Think about what happens to a solid when enough heat is supplied to melt it."
      - "Consider whether the change of state happens at one temperature or over several."
      - "Recall which kind of solid has its particles in a repeating pattern."
    diagram: null
    confidence: high
  - topic: crystalline_and_amorphous
    type: mcq
    difficulty: easy
    role: recall
    stem: "Glass and rubber belong to which class of solids?"
    correct: "Amorphous solids"
    unit: ""
    wrong:
      - {text: "Ionic crystals", mistake: "assumes all hard solids are ionic"}
      - {text: "Molecular crystals", mistake: "treats any solid built from molecules as crystalline"}
      - {text: "Metallic crystals", mistake: "links shiny solids with metal lattices"}
    explanation: "Glass and rubber have no long-range order in their particles, so they are amorphous. Crystals have a regular repeating pattern throughout."
    hints:
      - "Ask whether the particles in these materials follow a repeating pattern across the whole solid."
      - "Compare how these materials soften with how a salt melts."
      - "Sort the solid types by whether they have an ordered lattice."
    diagram: null
    confidence: high
  - topic: crystalline_and_amorphous
    type: mcq
    difficulty: medium
    role: apply
    stem: "A solid has a sharp melting point and cleaves along flat planes when struck. Which class does it belong to?"
    correct: "Crystalline solid"
    unit: ""
    wrong:
      - {text: "Amorphous solid", mistake: "treats cleavage along planes as a sign of disorder"}
      - {text: "Glassy solid", mistake: "uses glass as a general word for any hard solid"}
      - {text: "Colloidal solid", mistake: "confuses the solid with a dispersed system"}
    explanation: "A sharp melting point and cleavage along planes both point to an ordered, repeating lattice. Amorphous solids lack this order."
    hints:
      - "List which two properties in the stem point to an ordered internal arrangement."
      - "Consider what flat cleavage planes say about how the particles are arranged."
      - "Compare the stated melting behaviour with the melting over a range seen in disordered solids."
    diagram: null
    confidence: high
  - topic: crystalline_and_amorphous
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is a crystalline solid described as having long-range order?"
    correct: "Its particles repeat in a fixed pattern throughout the whole solid"
    unit: ""
    wrong:
      - {text: "Its particles move freely, as in a liquid", mistake: "treats solids as fluids"}
      - {text: "Its particles are arranged at random", mistake: "reverses the amorphous description"}
      - {text: "It contains only one type of atom", mistake: "equates order with composition"}
    explanation: "Long-range order means the same pattern repeats over large distances in every direction. This repeating arrangement is what gives crystals their sharp melting point."
    hints:
      - "Think about whether the pattern is local or extends across the entire solid."
      - "Compare how far the arrangement continues in a crystal with how far it continues in a liquid."
      - "Ask whether the word order refers to particle positions or to particle types."
    diagram: null
    confidence: high
  - topic: crystalline_and_amorphous
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A solid is isotropic and melts over a range of temperatures. Which statement about its particles is most consistent with this?"
    correct: "They have short-range order only, with no repeating pattern across the solid"
    unit: ""
    wrong:
      - {text: "They form a face-centred cubic lattice", mistake: "assumes isotropy implies a specific cubic lattice"}
      - {text: "They are arranged in a repeating hexagonal pattern", mistake: "links isotropy with a particular lattice"}
      - {text: "They are held by ionic bonds in a layered array", mistake: "assumes every solid is layered"}
    explanation: "Isotropy and melting over a range both indicate an amorphous solid. Its particles keep only local order and have no repeating unit cell."
    hints:
      - "Isotropic means the same in every direction, so ask which solid type behaves this way."
      - "Consider whether a range of melting temperatures suggests a regular repeating pattern."
      - "Eliminate options that describe a specific repeating lattice."
    diagram: null
    confidence: high
  - topic: crystalline_and_amorphous
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Quartz glass and crystalline quartz both have the formula SiO2. What most clearly separates their properties?"
    correct: "The long-distance arrangement of their silicon and oxygen atoms"
    unit: ""
    wrong:
      - {text: "Their chemical formulas differ", mistake: "assumes a different structure changes the formula"}
      - {text: "One contains oxygen and the other does not", mistake: "misreads the formula"}
      - {text: "Their molar masses are unequal", mistake: "treats molar mass as a structural property"}
    explanation: "Both forms have the same SiO2 composition and molar mass, but quartz glass lacks the long-range lattice of crystalline quartz. Structure, not composition, separates them."
    hints:
      - "Both materials share one formula, so look for a property that depends on something other than the formula."
      - "Think about what the word amorphous says about particle positions."
      - "Consider which feature a crystal has that a disordered glass does not."
    diagram: null
    confidence: high
  - topic: unit_cells_and_lattices
    type: numeric
    difficulty: easy
    role: recall
    stem: "How many atoms belong to one simple cubic unit cell when atoms sit only at the corners?"
    correct: "1"
    unit: ""
    wrong: []
    explanation: "Each corner atom is shared by eight neighbouring cells, so it contributes one eighth to a single cell. Eight such fractions add up to one atom per cell."
    hints:
      - "Each corner atom is shared among the cells that meet at that corner."
      - "Work out what fraction of a corner atom lies inside the single cell."
      - "Add up the fractions contributed by all the corners."
    diagram: "Cube drawn with one atom at each of its eight corners and no atom at the centre or on the faces."
    confidence: high
  - topic: unit_cells_and_lattices
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which lattice type places lattice points only at the corners of the cubic cell?"
    correct: "Primitive cubic"
    unit: ""
    wrong:
      - {text: "Body-centred cubic", mistake: "adds a point at the centre that is not present"}
      - {text: "Face-centred cubic", mistake: "adds points on the faces of the cube"}
      - {text: "Diamond-type cubic", mistake: "confuses a bonding pattern with a lattice type"}
    explanation: "A primitive cubic lattice has points only at the eight corners of the cell. The other cubic lattices add extra points at the centre or on the faces."
    hints:
      - "Count the lattice points that sit inside the cube as well as at its vertices."
      - "Look at whether any points lie at the centre or on the faces."
      - "Compare the positions of points in each named cubic type."
    diagram: null
    confidence: high
  - topic: unit_cells_and_lattices
    type: numeric
    difficulty: medium
    role: procedure
    stem: "How many atoms belong to one face-centred cubic unit cell in total?"
    correct: "4"
    unit: ""
    wrong: []
    explanation: "Eight corner atoms each contribute one eighth, giving one atom. Six face atoms each contribute one half, giving three. The total is four."
    hints:
      - "Each corner atom is shared by eight cells, so it contributes only a fraction."
      - "Each atom on a face is shared between two cells."
      - "Sum the fractional contributions from the corners and from the faces."
    diagram: null
    confidence: high
  - topic: unit_cells_and_lattices
    type: mcq
    difficulty: medium
    role: apply
    stem: "What is the coordination number of each atom in a body-centred cubic structure?"
    correct: "8"
    unit: ""
    wrong:
      - {text: "6", mistake: "copies the simple cubic value"}
      - {text: "12", mistake: "copies the close packed value"}
      - {text: "4", mistake: "counts only the neighbours at the corners"}
    explanation: "In a body-centred cubic structure the central atom touches all the corner atoms, which are the nearest neighbours. Counting them gives the coordination number."
    hints:
      - "Count the nearest touching atoms of the atom placed at the body centre."
      - "Consider the neighbours that lie along the body diagonal."
      - "The nearest neighbours are all at the same distance from the central atom."
    diagram: null
    confidence: high
  - topic: unit_cells_and_lattices
    type: numeric
    difficulty: hard
    role: apply
    stem: "A metal forms a body-centred cubic lattice with edge length 287 pm. If atoms touch along the body diagonal, what is the atomic radius in pm? Give the nearest whole number."
    correct: "124"
    unit: "pm"
    wrong: []
    explanation: "The body diagonal equals the square root of three times the edge, and it spans four atomic radii. Dividing the diagonal by four gives the radius."
    hints:
      - "Relate the body diagonal to the edge using the Pythagoras theorem twice."
      - "The body diagonal passes through the central atom and two corner atoms."
      - "Equate the length of the body diagonal to the sum of the radii it spans."
    diagram: "Cube with atoms at the eight corners and one at the centre; a straight line runs from one corner through the centre to the opposite corner."
    confidence: high
  - topic: unit_cells_and_lattices
    type: mcq
    difficulty: hard
    role: transfer
    stem: "In a face-centred cubic cell, atoms touch along a face diagonal. Which relation links the edge length a with the atomic radius r?"
    correct: "a = 2 x sqrt(2) x r"
    unit: ""
    wrong:
      - {text: "a = 2 x r", mistake: "copies the simple cubic relation"}
      - {text: "a = 4 x r / sqrt(3)", mistake: "uses the body-centred relation"}
      - {text: "a = r / sqrt(2)", mistake: "inverts the ratio of radius to edge"}
    explanation: "The face diagonal equals sqrt(2) times the edge and spans four atomic radii. Equating the two gives a equal to 2 times sqrt(2) times r."
    hints:
      - "The face diagonal of the cube is sqrt(2) times the edge length."
      - "Four radii span the length of the face diagonal."
      - "Set the face diagonal equal to the total length covered by the touching atoms along it."
    diagram: "Square face of a cube with atoms at the four corners and one at the face centre; the diagonal passes through a corner atom, the face-centre atom and the opposite corner atom."
    confidence: high
  - topic: close_packing
    type: numeric
    difficulty: easy
    role: recall
    stem: "How many nearest neighbours surround each atom in a hexagonal close packed structure?"
    correct: "12"
    unit: ""
    wrong: []
    explanation: "Each sphere in hexagonal close packing touches six spheres in its own layer, three in the layer above and three in the layer below. That gives twelve nearest neighbours."
    hints:
      - "Count the touching spheres in the layer that sits in the same plane first."
      - "Then count the spheres touching it in the layer above and in the layer below."
      - "Compare the arrangement with the layer pattern of close packing."
    diagram: null
    confidence: high
  - topic: close_packing
    type: mcq
    difficulty: easy
    role: recall
    stem: "How many tetrahedral voids are present per sphere in a close packed structure?"
    correct: "2"
    unit: ""
    wrong:
      - {text: "1", mistake: "counts the octahedral voids as the tetrahedral type"}
      - {text: "4", mistake: "copies the count of octahedral voids"}
      - {text: "8", mistake: "counts voids per unit cell corner instead of per sphere"}
    explanation: "A close packed structure with N spheres has N octahedral voids and twice as many tetrahedral voids, so there are two tetrahedral voids per sphere."
    hints:
      - "Compare the number of tetrahedral voids with the number of octahedral voids."
      - "Tetrahedral voids form where a sphere sits above three spheres of the layer below."
      - "Count the voids per sphere rather than per unit cell."
    diagram: null
    confidence: high
  - topic: close_packing
    type: numeric
    difficulty: medium
    role: procedure
    stem: "What is the percentage packing efficiency of face-centred cubic close packing? Give the nearest whole number."
    correct: "74"
    unit: "%"
    wrong: []
    explanation: "Four spheres fill about 74 percent of the volume of a face-centred cubic cell, leaving the rest as empty space."
    hints:
      - "Compare the volume of the spheres inside one cell with the volume of the cell itself."
      - "Relate the number of atoms per cell to the cube edge through the face diagonal."
      - "The volume of one sphere is four thirds times pi times the radius cubed."
    diagram: null
    confidence: high
  - topic: close_packing
    type: mcq
    difficulty: medium
    role: explain
    stem: "Which stacking sequence of layers describes hexagonal close packing?"
    correct: "ABAB"
    unit: ""
    wrong:
      - {text: "ABCABC", mistake: "uses the cubic close packed sequence"}
      - {text: "AAAA", mistake: "assumes layers sit directly on top of each other"}
      - {text: "ABCD", mistake: "adds a fourth layer type that the structure does not need"}
    explanation: "In hexagonal close packing the third layer lies directly over the first, so the pattern repeats every two layers. Cubic close packing repeats every three layers."
    hints:
      - "Find the sequence that repeats after only two layers."
      - "Each layer nests in the hollows of the layer below it."
      - "Check where the third layer sits relative to the first."
    diagram: "Three stacked triangular layers drawn offset, with the second layer in the hollows of the first and the third layer exactly above the first."
    confidence: high
  - topic: close_packing
    type: numeric
    difficulty: hard
    role: apply
    stem: "A cubic close packed lattice is built from 150 anions, and every octahedral void is available. How many octahedral voids does the lattice contain?"
    correct: "150"
    unit: ""
    wrong: []
    explanation: "A close packed arrangement of N spheres has N octahedral voids, one for each sphere, so the count equals the anion count."
    hints:
      - "Compare the number of octahedral voids with the number of close packed spheres."
      - "Count the voids per sphere, not per unit cell."
      - "Think about how the octahedral voids relate to the spheres that form the lattice."
    diagram: null
    confidence: high
  - topic: close_packing
    type: mcq
    difficulty: hard
    role: transfer
    stem: "In a cubic close packed lattice built from layers labelled A, B and C, where do the spheres of the third layer sit?"
    correct: "Over hollows that the first two layers do not occupy"
    unit: ""
    wrong:
      - {text: "Directly above the first layer, giving an AB pattern", mistake: "repeats the hexagonal stacking"}
      - {text: "In the centre of the cube as a body centre", mistake: "treats the cell centre as a lattice site"}
      - {text: "Directly above the second layer, giving an AA pattern", mistake: "stacks a layer directly on a layer of the same kind"}
    explanation: "The third layer fills the remaining hollows, which differ from those used by the first two layers. This produces the ABC repeat of cubic close packing."
    hints:
      - "Look at which hollows of the first layer the second layer already covers."
      - "Consider whether the third layer repeats the position of the first."
      - "Compare the two kinds of hollow available to the layer above."
    diagram: "Three stacked layers of spheres drawn as triangular arrangements labelled A, B and C, with the C layer shown in hollows that differ from both A and B."
    confidence: high
  - topic: crystal_defects
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which defect appears when an ion leaves its normal lattice site and settles into a gap between lattice sites?"
    correct: "Frenkel defect"
    unit: ""
    wrong:
      - {text: "Schottky defect", mistake: "assumes the ions leave the crystal entirely"}
      - {text: "Vacancy defect", mistake: "treats a displaced ion as a simple empty site"}
      - {text: "Substitutional impurity", mistake: "assumes a foreign atom always takes a gap"}
    explanation: "In a Frenkel defect an ion moves from its site into an interstitial gap, so the crystal keeps all its ions and its composition is unchanged."
    hints:
      - "Ask whether the ion stays inside the crystal or leaves it."
      - "Consider where the displaced ion ends up."
      - "Think about which site becomes occupied rather than empty."
    diagram: "Ionic lattice drawn as a grid of alternating plus and minus symbols, with one cation shown in an empty gap between sites and a vacant site beside it."
    confidence: high
  - topic: crystal_defects
    type: mcq
    difficulty: easy
    role: explain
    stem: "What effect does a Schottky defect have on the density of an ionic crystal?"
    correct: "It lowers the density"
    unit: ""
    wrong:
      - {text: "It keeps the density unchanged", mistake: "ignores the mass lost from the crystal"}
      - {text: "It raises the density", mistake: "assumes vacancies add mass"}
      - {text: "It raises the density only at the surface", mistake: "limits the effect to one region of the crystal"}
    explanation: "A Schottky defect removes equal numbers of cations and anions, so the crystal loses mass while its volume stays about the same. The density therefore falls."
    hints:
      - "Think about how much mass remains in the same volume after ions are removed."
      - "Recall that a vacancy means one particle fewer in that space."
      - "Compare the mass per unit volume before and after the defect forms."
    diagram: null
    confidence: high
  - topic: crystal_defects
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does a Frenkel defect leave the density of an ionic solid essentially unchanged?"
    correct: "No ion is removed, so the number of ions per unit volume stays the same"
    unit: ""
    wrong:
      - {text: "Two ions are removed for each defect", mistake: "confuses the Frenkel defect with the Schottky defect"}
      - {text: "Extra electrons fill the gaps and add mass", mistake: "imports the metal excess model"}
      - {text: "The crystal gains a whole new layer of ions", mistake: "assumes a displaced ion adds to the lattice"}
    explanation: "A Frenkel defect only moves an ion from its site into a nearby gap. The number of ions and the volume are both unchanged, so the density stays about the same."
    hints:
      - "Ask whether any ion leaves the crystal or only changes its position."
      - "Count the ions before and after the defect forms."
      - "Consider the volume the crystal occupies once the ion has moved."
    diagram: "Ionic grid of plus and minus symbols showing one cation moved into a gap beside its original empty site, with the outline of the crystal unchanged."
    confidence: high
  - topic: crystal_defects
    type: mcq
    difficulty: medium
    role: apply
    stem: "Why can a Schottky defect allow an ionic crystal to conduct electricity?"
    correct: "Neighbouring ions can hop into the vacant sites and carry charge"
    unit: ""
    wrong:
      - {text: "Electrons are released from the vacant sites", mistake: "mixes ionic and electronic conduction"}
      - {text: "The lattice expands so ions flow in bulk", mistake: "attributes conduction to expansion"}
      - {text: "Ions escape into the vapour phase", mistake: "links conductivity with sublimation"}
    explanation: "Vacant sites let neighbouring ions move through the crystal, and this ionic movement carries charge. The defect therefore gives the crystal ionic conductivity."
    hints:
      - "Think about what a neighbouring ion needs in order to move a short distance."
      - "Consider where an ion can go when a site next to it is empty."
      - "Identify whether the carrier of charge is an ion or an electron."
    diagram: null
    confidence: high
  - topic: crystal_defects
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A crystal of AB has equal numbers of cation and anion vacancies and no displaced ions. Which defect name and density effect apply?"
    correct: "Schottky defect, lowering density"
    unit: ""
    wrong:
      - {text: "Frenkel defect, density unchanged", mistake: "uses the Frenkel definition for vacancies"}
      - {text: "Schottky defect, raising density", mistake: "assumes vacancies add mass"}
      - {text: "Interstitial defect, lowering density", mistake: "confuses vacancies with interstitial ions"}
    explanation: "Equal numbers of cation and anion vacancies with no displaced ions is the Schottky pattern. Mass is removed while the volume stays about the same, so the density falls."
    hints:
      - "Count how many ions of each type are missing from the lattice."
      - "Check whether any ion has been pushed into a gap."
      - "Think about the mass lost compared with the volume that remains."
    diagram: null
    confidence: high
