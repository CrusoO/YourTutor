    stem: "What is the IUPAC name of K4[Fe(CN)6]?"
    correct: "potassium hexacyanoferrate(II)"
    unit: ""
    wrong:
      - {text: "potassium hexacyanoferrate(III)", mistake: "miscounts the iron oxidation state"}
      - {text: "tetrapotassium iron hexacyanide(II)", mistake: "uses the wrong naming order"}
      - {text: "potassium iron cyanide", mistake: "omits the oxidation state"}
    explanation: "The complex anion is [Fe(CN)6]4-, so iron is +2. The cation is named first, and the anionic iron complex ends in -ate with the metal name ferrate."
    hints:
      - "Find the oxidation state of iron from the overall charge of the complex."
      - "Cyanide is a ligand with charge minus one, so count its total contribution."
      - "Name the cation first, then the anion, ending the metal with the -ate suffix."
