  - topic: isomerism_coordination
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which type of isomerism is shown by [Co(NH3)5Br]SO4 and [Co(NH3)5SO4]Br?"
    correct: "Ionisation isomerism"
    unit: ""
    wrong:
      - {text: "Linkage isomerism", mistake: "confuses swapping ions with changing the donor atom"}
      - {text: "Geometrical isomerism", mistake: "looks for cis and trans arrangements"}
      - {text: "Optical isomerism", mistake: "assumes any two isomers are mirror images"}
    explanation: "The two compounds differ in which ion sits inside the coordination sphere and which sits outside. Bromide and sulphate swap places, which is ionisation isomerism."
    hints:
      - "Ask whether the ion outside the coordination sphere swaps places with a ligand."
      - "Compare which anion sits inside the square brackets in each formula."
      - "Consider whether the donor atoms of the ligands change."
    diagram: null
