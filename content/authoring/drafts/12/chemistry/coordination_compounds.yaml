  - topic: isomerism_coordination
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which ligand can give linkage isomers because it can bond through two different atoms?"
    correct: "Thiocyanate"
    unit: ""
    wrong:
      - {text: "Ammonia", mistake: "assumes every ligand is ambidentate"}
      - {text: "Chloride", mistake: "treats a monodentate halide as ambidentate"}
      - {text: "Ethylenediamine", mistake: "confuses ambidentate with chelating"}
    explanation: "Thiocyanate can bond through sulphur or through nitrogen, so its complexes can show linkage isomerism. Ethylenediamine is a chelating ligand instead."
    hints:
      - "Look for an ambidentate ligand that can coordinate through two different donor atoms."
      - "Think about which ion has two atoms that can each bond to a metal."
      - "Separate ambidentate ligands from chelating ligands."
