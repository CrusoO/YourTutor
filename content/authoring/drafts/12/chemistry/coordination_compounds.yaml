      - {text: "tetracarbonylnickel(IV)", mistake: "miscounts the metal oxidation state"}
    explanation: "Carbonyl is a neutral ligand, and the complex is neutral, so nickel is in the zero oxidation state. The name uses the prefix tetra with carbonyl and the metal's oxidation state in parentheses."
    hints:
      - "Work out the metal oxidation state from the overall charge, since the ligands are neutral."
      - "Use the prefix that gives the number of carbonyl ligands."
      - "Write the metal name with its oxidation state at the end."
