    stem: "Calculate the spin-only magnetic moment in Bohr magnetons of the high spin d6 Fe2+ ion. Give two decimal places."
    correct: "4.90"
    unit: "BM"
    wrong: []
    explanation: "With four unpaired electrons the spin-only moment is the square root of n times n plus two, which is the square root of 24, or about 4.90 BM."
    hints:
      - "Use the spin-only formula with n equal to the number of unpaired electrons."
      - "Compute n times n plus two before taking the square root."
      - "Round the final result to two decimal places."
