  - topic: stability_and_uses
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is a chelate?"
    correct: "A ligand that binds to the metal through two or more donor atoms"
    unit: ""
    wrong:
      - {text: "A ligand bonded through one donor atom only", mistake: "confuses a chelate with a monodentate ligand"}
      - {text: "A metal ion with no ligands attached", mistake: "treats the metal alone as a chelate"}
      - {text: "A salt that is insoluble in water", mistake: "links the word chelate with solubility"}
    explanation: "A chelating ligand grips the metal at two or more points, forming a ring. Chelates form more stable complexes than similar monodentate ligands."
    hints:
      - "Think about the number of donor atoms that hold the metal together."
      - "Consider whether the ligand forms a ring with the metal."
      - "Compare a chelating ligand with a monodentate one."
