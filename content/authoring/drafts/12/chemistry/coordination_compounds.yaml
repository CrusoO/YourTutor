  - topic: bonding_crystal_field
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the d electron count of the Fe2+ ion?"
    correct: "6"
    unit: ""
    wrong:
      - {text: "4", mistake: "removes only one electron"}
      - {text: "8", mistake: "uses the group number of iron"}
      - {text: "2", mistake: "counts only the outer s electrons"}
    explanation: "Neutral iron has 3d6 4s2. Losing two electrons from the 4s level leaves 3d6, so Fe2+ has six d electrons."
    hints:
      - "Start from the neutral atom's electron count and remove electrons according to the charge."
      - "Think about which subshell loses electrons first when a transition metal is ionised."
      - "Count only the d electrons remaining after the ion forms."
