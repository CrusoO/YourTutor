    stem: "What is the IUPAC name of [Co(NH3)6]Cl3?"
    correct: "hexaamminecobalt(III) chloride"
    unit: ""
    wrong:
      - {text: "hexamminecobalt(II) chloride", mistake: "miscounts the metal charge"}
      - {text: "cobalt hexammine trichloride", mistake: "uses an informal naming order"}
      - {text: "hexaaminecobalt(III) chloride", mistake: "misspells the ligand name"}
    explanation: "Ammonia is neutral and the three chloride ions balance a +3 cobalt. The ammine ligand is named ammine and the prefix hexa gives six of them."
    hints:
      - "The chloride ions outside the complex balance the charge, so the cobalt oxidation state follows from that."
