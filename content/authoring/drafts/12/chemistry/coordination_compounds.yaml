  - topic: isomerism_coordination
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which type of isomerism does the square planar complex [Pt(NH3)2Cl2] show?"
    correct: "Geometrical isomerism"
    unit: ""
    wrong:
      - {text: "Ionisation isomerism", mistake: "mixes up the inside and outside ions"}
      - {text: "Hydrate isomerism", mistake: "assumes water must be present"}
      - {text: "No isomerism is possible", mistake: "assumes a square planar complex has only one arrangement"}
    explanation: "The two chloride ligands can sit next to each other, which is the cis isomer, or on opposite corners, which is the trans isomer. Cis and trans forms are geometrical isomers."
    hints:
      - "Consider whether the two chloride ligands can be placed next to each other or opposite each other."
      - "Think about the arrangement of the two ammine ligands relative to the chlorides."
      - "Compare the arrangements that differ only in the position of identical ligands."
    diagram: "Two square planar drawings of platinum with two ammine ligands and two chloride ligands; in one drawing the two chlorides are next to each other, and in the other they sit on opposite corners."
    confidence: high
  - topic: isomerism_coordination
    type: mcq
    difficulty: medium
    role: apply
    stem: "How many stereoisomers does the octahedral complex [Co(en)2Cl2]+ have in total?"
    correct: "3"
    unit: ""
    wrong:
      - {text: "2", mistake: "counts only the cis or only the trans arrangement"}
      - {text: "1", mistake: "assumes one symmetric structure"}
      - {text: "4", mistake: "counts an extra pair of enantiomers that does not exist"}
    explanation: "The trans form is achiral. The cis form is chiral and exists as a pair of mirror images, so there are three stereoisomers in total."
    hints:
      - "Consider the cis arrangement, which can exist as a pair of mirror images."
      - "Consider the trans arrangement and whether it has a mirror plane."
      - "Add the distinct forms, counting each mirror image pair appropriately."
    diagram: null
    confidence: medium
