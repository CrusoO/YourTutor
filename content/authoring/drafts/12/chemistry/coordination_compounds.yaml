  - topic: stability_and_uses
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are chelates more stable than similar non-chelated complexes?"
    correct: "Ring formation increases entropy"
    unit: ""
    wrong:
      - {text: "Chelates have larger metal ions", mistake: "misplaces the cause"}
      - {text: "Chelates have no electrical charge", mistake: "assumes chelates are neutral"}
      - {text: "Chelates have fewer bonds to the metal", mistake: "reverses the number of bonds"}
    explanation: "When one chelating ligand replaces several monodentate ligands, more particles are released into solution. The rise in entropy makes the chelate more stable, which is the chelate effect."
    hints:
      - "Consider how many particles are released when a chelating ligand replaces several monodentate ligands."
      - "Think about the change in disorder when a ring is formed."
      - "Compare the number of molecules on each side of the complex formation equation."
