  - topic: werner_theory_nomenclature
    type: mcq
    difficulty: medium
    role: explain
    stem: "In Werner's theory, what does the principal valency of a metal correspond to?"
    correct: "Its oxidation state"
    unit: ""
    wrong:
      - {text: "The number of ligands attached", mistake: "confuses principal with secondary valency"}
      - {text: "The charge on the complex ion", mistake: "mixes the complex charge with the metal valency"}
      - {text: "The number of unpaired electrons", mistake: "adds a magnetic property to the definition"}
    explanation: "Werner's principal valency is the ionisable valency, which we now call the oxidation state. The secondary valency is the number of ligands bonded to the metal."
    hints:
      - "Werner separated two kinds of valency, and the primary one is the one that can be ionised."
      - "Think about which valency is satisfied by anions that appear outside the complex."
      - "Compare the primary valency with the secondary valency in his description."
    diagram: null
    confidence: high
