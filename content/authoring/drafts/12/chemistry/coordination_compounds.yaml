    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which feature is required for optical isomerism in an octahedral complex?"
    correct: "The complex must be non-superimposable on its mirror image"
    unit: ""
    wrong:
      - {text: "A square planar geometry", mistake: "assumes planar complexes are chiral"}
      - {text: "Two identical ligands in trans positions", mistake: "assumes symmetry creates chirality"}
      - {text: "A high coordination number alone", mistake: "assumes the number of ligands determines chirality"}
    explanation: "An optically active complex is chiral. Its mirror image cannot be rotated onto it, which happens when the arrangement of ligands lacks a plane of symmetry."
    hints:
      - "Compare the complex with its reflection in a mirror."
      - "Check whether the complex has a plane of symmetry."
      - "Consider whether the arrangement can be rotated onto its reflection."
