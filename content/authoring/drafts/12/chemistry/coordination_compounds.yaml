  - topic: bonding_crystal_field
    type: mcq
    difficulty: easy
    role: recall
    stem: "What does the crystal field splitting parameter, delta o, represent?"
    correct: "The energy gap between the t2g and eg sets of orbitals in an octahedral field"
    unit: ""
    wrong:
      - {text: "The energy needed to remove an electron from the metal", mistake: "confuses splitting with ionisation energy"}
      - {text: "The metal to ligand bond length", mistake: "confuses energy with distance"}
      - {text: "The stability constant of the complex", mistake: "confuses splitting with thermodynamic stability"}
    explanation: "In an octahedral field the five d orbitals split into a lower t2g triplet and an upper eg pair. The difference in energy between these sets is delta o."
    hints:
      - "Think about two groups of d orbitals whose energies separate in an octahedral environment."
      - "Consider which quantity describes the separation between these two groups."
      - "Compare the splitting with the ionisation energy of the metal."
    diagram: null
    confidence: high
  - topic: bonding_crystal_field
    type: mcq
    difficulty: medium
    role: apply
    stem: "An octahedral d6 complex with a strong field ligand is in which spin state?"
    correct: "Low spin, with all six electrons paired in the lower orbitals"
    unit: ""
    wrong:
      - {text: "High spin with four unpaired electrons", mistake: "assumes weak field behaviour"}
      - {text: "Tetrahedral with no d orbital splitting", mistake: "changes the geometry of the complex"}
      - {text: "Square planar with a d8 geometry", mistake: "changes the electron count"}
    explanation: "A strong field ligand makes the splitting larger than the pairing energy, so electrons pair in the lower t2g set. A d6 low spin ion has all six electrons in t2g and none unpaired."
    hints:
      - "Compare the splitting energy with the energy cost of pairing two electrons in one orbital."
      - "Decide whether electrons fill the lower set fully before using the upper set."
      - "Consider how many electrons would sit in the upper eg orbitals in this case."
    diagram: "Energy level sketch: five d orbitals split into a lower set of three and an upper set of two in an octahedral field, with electron arrows filled into the lower set."
    confidence: high
