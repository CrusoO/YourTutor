      - {text: "+1", mistake: "uses only one chloride contribution"}
      - {text: "+4", mistake: "adds the ammine contributions"}
    explanation: "Ammine ligands are neutral, and each chloride carries minus one, giving -2 in total. The complex has a +1 charge, so cobalt must be +3."
    hints:
      - "Ammine ligands are neutral and each chloride is minus one."
      - "Subtract the total ligand charge from the overall charge of the ion."
      - "Solve for the oxidation state of cobalt."
