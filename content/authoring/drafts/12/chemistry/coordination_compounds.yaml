    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which aqueous complex is coloured because of a d to d transition?"
    correct: "[Ti(H2O)6]3+"
    unit: ""
    wrong:
      - {text: "[Sc(H2O)6]3+", mistake: "assumes a d0 ion absorbs visible light"}
      - {text: "[Zn(H2O)6]2+", mistake: "ignores that a full d shell cannot undergo d to d transitions"}
      - {text: "[Ag(NH3)2]+", mistake: "links the colour of silver complexes with d to d transitions"}
    explanation: "Ti3+ has one d electron, which can be promoted between the split t2g and eg levels by visible light. The d0 and d10 ions in the other options cannot make this transition."
    hints:
      - "Count the d electrons of the metal ion in each complex."
      - "Check whether the d subshell is empty, full or partly filled."
      - "Consider whether an electron can move between two split levels."
