    explanation: "In SN1 the leaving group departs first to give a carbocation, which is then attacked by the nucleophile."
    hints:
      - "Think about which mechanism has the leaving group depart before the nucleophile arrives."
      - "Consider the two-step pathway with an ionic intermediate."
      - "Check which mechanism is described as unimolecular in the slow step."
