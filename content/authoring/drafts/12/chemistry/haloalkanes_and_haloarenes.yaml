  - topic: elimination_haloalkanes
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does a bulky base give more of the less substituted alkene?"
    correct: "It reaches hydrogens on less crowded carbons more easily"
    unit: ""
    wrong:
      - {text: "It is a weak nucleophile that favours substitution", mistake: "confuses bulk with weakness"}
      - {text: "It removes the double bond from the product", mistake: "reverses the elimination"}
      - {text: "It stabilises the more substituted alkene", mistake: "reverses the steric effect"}
    explanation: "A bulky base cannot easily reach the hydrogen on the crowded carbon, so it removes a hydrogen from the less hindered side. This gives the less substituted Hofmann product."
    hints:
      - "Consider how a bulky base reaches the hydrogens that are less hindered."
      - "Think about which hydrogen is the easiest for a large base to approach."
      - "Compare the steric hindrance at the two sites that could lose a hydrogen."
    diagram: null
    confidence: high
