      - {text: "Temperature only", mistake: "ignores the concentration dependence"}
    explanation: "The slow step of SN1 is the ionisation of the haloalkane, so the rate depends only on its concentration."
    hints:
      - "Consider which species appears in the slowest step."
      - "Think about whether the nucleophile is involved in the rate determining step."
      - "Compare the rate law of SN1 with that of SN2."
