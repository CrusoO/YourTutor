  - topic: sn1_sn2
    type: mcq
    difficulty: medium
    role: explain
    stem: "What is the stereochemical outcome at a chiral carbon in an SN2 reaction of a primary haloalkane with hydroxide?"
    correct: "Inversion of configuration at the carbon"
    unit: ""
    wrong:
      - {text: "Retention of configuration", mistake: "assumes the nucleophile enters from the same side as the leaving group"}
      - {text: "A racemic mixture only", mistake: "assumes the SN1 outcome"}
      - {text: "Elimination with no stereochemistry", mistake: "confuses substitution with elimination"}
    explanation: "The hydroxide attacks from the side opposite the bromine, so the three other groups flip like an umbrella. The configuration is inverted."
    hints:
      - "Think about the geometry of the backside attack."
      - "Ask what happens to the other three groups when the nucleophile comes in."
      - "Compare the stereochemistry with that of an SN1 path."
    diagram: "Reaction arrow with hydroxide attacking the carbon from the side opposite the bromine, and the other three groups on the carbon flipping like an umbrella in the product."
    confidence: high
