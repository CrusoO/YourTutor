  - topic: sn1_sn2
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Tertiary bromides react mainly by SN1. Which factor explains this preference?"
    correct: "The tertiary carbocation is stabilised by hyperconjugation and alkyl groups"
    unit: ""
    wrong:
      - {text: "Steric hindrance is lowest at the tertiary carbon", mistake: "reverses the steric effect"}
      - {text: "The nucleophile attacks from the back more easily", mistake: "reverses the backside attack problem"}
      - {text: "Bromine is a poor leaving group", mistake: "reverses leaving group ability"}
    explanation: "Three alkyl groups donate electron density and stabilise the positive charge of the carbocation. That makes the ionisation step easy, so SN1 dominates."
    hints:
      - "Compare the stability of the intermediate formed from primary and tertiary structures."
      - "Think about which groups around the carbon can donate electron density to a positive centre."
      - "Consider how crowded the carbon is for a backside attack."
    diagram: "Central carbon bonded to three alkyl groups and to a bromine atom; a bracket shows the planar cation formed when bromine leaves."
    confidence: high
  - topic: sn1_sn2
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why does SN1 substitution of a chiral haloalkane give an almost racemic product?"
    correct: "The planar carbocation is attacked from both faces"
    unit: ""
    wrong:
      - {text: "The leaving group stays bonded to the carbon", mistake: "confuses the intermediate with the starting material"}
      - {text: "The nucleophile is achiral", mistake: "treats the nucleophile as the source of chirality"}
      - {text: "Only half of the substrate reacts", mistake: "ignores the stereochemistry of the intermediate"}
    explanation: "The carbocation is planar, so the nucleophile can approach from either face with similar ease. Equal amounts of the two enantiomers form."
    hints:
      - "Think about the geometry of the carbocation intermediate."
      - "Consider which faces of the intermediate the nucleophile can reach."
      - "Compare the outcome with the single inversion seen in SN2."
