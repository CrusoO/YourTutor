    stem: "5 g of a non-volatile solute dissolved in 100 g of benzene lowers the freezing point by 1.28 K. The freezing point constant of benzene is 5.12 K kg/mol. What is the molar mass of the solute in g/mol?"
    correct: "200"
    unit: "g/mol"
    wrong: []
    explanation: "Rearranging the depression formula gives molar mass equal to Kf times the mass of solute divided by the depression times the solvent mass in kg. That gives 200 g/mol."
    hints:
      - "Rearrange the freezing point relation so that molar mass is the subject."
      - "Express the mass of solvent in kilograms before substituting."
      - "Recall that molality equals moles of solute divided by kilograms of solvent."
