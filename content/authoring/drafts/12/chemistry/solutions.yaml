  - topic: concentration_terms_12
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which concentration term is defined using the mass of the solvent rather than the volume of the solution?"
    correct: "Molality"
    unit: ""
    wrong:
      - {text: "Molarity", mistake: "assumes the denominator is always the solution volume"}
      - {text: "Normality", mistake: "treats normality as a mass based term"}
      - {text: "Percentage by volume", mistake: "uses the volume of the solution in the denominator"}
    explanation: "Molality is moles of solute per kilogram of solvent. The other terms use the volume of the solution."
    hints:
      - "Look at what the denominator refers to in each definition."
      - "Think about whether the term uses a volume or a mass."
      - "Find the term whose denominator is the mass of the liquid that dissolves the solute."
