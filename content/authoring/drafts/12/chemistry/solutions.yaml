  - topic: concentration_terms_12
    type: numeric
    difficulty: easy
    role: procedure
    stem: "5 g of NaOH (molar mass 40 g/mol) is dissolved in 250 g of water. What is the molality of the solution in mol/kg?"
    correct: "0.5"
    unit: "mol/kg"
    wrong: []
    explanation: "5 g of NaOH is 0.125 mol. Dividing by 0.25 kg of water gives a molality of 0.5 mol/kg."
    hints:
      - "Convert the mass of solute to moles first."
      - "Convert the mass of the solvent to kilograms before dividing."
      - "Molality uses the mass of the solvent, not the volume of the solution."
    diagram: null
