    type: numeric
    difficulty: medium
    role: procedure
    stem: "The freezing point depression constant of water is 1.86 K kg/mol. What is the freezing point depression in K when 0.5 mol/kg of a non-electrolyte is dissolved in water?"
    correct: "0.93"
    unit: "K"
    wrong: []
    explanation: "The depression equals the constant times the molality. Multiplying 1.86 by 0.5 gives 0.93 K."
    hints:
      - "Multiply the freezing point constant by the molality."
      - "The solute is a non-electrolyte, so each formula unit gives one particle."
      - "Keep track of the units in kelvin."
