  - topic: colligative_properties
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Two solutions have equal molality. One contains a non-electrolyte and the other a salt that dissociates completely into two ions. Which solution has the lower freezing point?"
    correct: "The electrolyte solution, since it gives more particles"
    unit: ""
    wrong:
      - {text: "The non-electrolyte solution, because its molecules are larger", mistake: "uses molecular size as the criterion"}
      - {text: "Both freeze at the same temperature, since the molality is equal", mistake: "forgets that the salt dissociates"}
      - {text: "The electrolyte solution, because its molar mass is lower", mistake: "uses molar mass to predict the freezing point"}
    explanation: "The depression depends on the total particle concentration. The dissociated salt gives twice as many particles, so its freezing point is lower."
    hints:
      - "Count the solute particles in each solution rather than the solute formula units added."
      - "Consider how dissociation changes the number of particles."
      - "Recall that freezing point depression depends on the particle count per kilogram of solvent."
    diagram: null
    confidence: high
  - topic: abnormal_molar_mass
    type: numeric
    difficulty: easy
    role: recall
    stem: "A solute dissociates completely into two ions when dissolved. What is its van't Hoff factor?"
    correct: "2"
    unit: ""
    wrong: []
    explanation: "Complete dissociation into two ions gives two particles per formula unit, so the van't Hoff factor is 2."
    hints:
      - "Count the particles that form from one formula unit when it dissolves completely."
      - "The van't Hoff factor is the ratio of the actual particle count to the formula unit count."
      - "Check that every ion counts as one particle."
