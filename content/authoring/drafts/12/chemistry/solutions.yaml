  - topic: colligative_properties
    type: numeric
    difficulty: medium
    role: apply
    stem: "A solution has concentration 0.1 mol/L of a non-electrolyte at 300 K. Using R = 8.314 J/mol/K, what is its osmotic pressure in kPa? Give one decimal place."
    correct: "249.4"
    unit: "kPa"
    wrong: []
    explanation: "Osmotic pressure is the concentration times R times T. Converting 0.1 mol/L to 100 mol/m cubed and multiplying by 8.314 and 300 gives about 249.4 kPa."
    hints:
      - "Convert the concentration to mol per cubic metre before using the gas constant in SI units."
      - "Osmotic pressure is the product of the concentration, R and the temperature."
      - "Convert the result from pascals to kilopascals at the end."
