    stem: "What is the elevation of the boiling point of water, in K, when 1 mol/kg of a non-volatile non-electrolyte is dissolved? The ebullioscopic constant of water is 0.52 K kg/mol."
    correct: "0.52"
    unit: "K"
    wrong: []
    explanation: "The boiling point elevation equals the constant times the molality. With molality 1 mol/kg, the elevation is 0.52 K."
    hints:
      - "Use the relation between molality and the boiling point elevation constant."
      - "Multiply the constant by the molality of the solution."
      - "Check the units so that the molality cancels."
