  - topic: raoults_law
    type: mcq
    difficulty: medium
    role: explain
    stem: "For an ideal binary solution, what shape does a plot of total vapour pressure against the mole fraction of component A take?"
    correct: "A straight line joining the two pure component pressures"
    unit: ""
    wrong:
      - {text: "A curve that dips below both pure values", mistake: "assumes negative deviation is the default"}
      - {text: "A horizontal line at the higher pure pressure", mistake: "ignores the contribution of the less volatile component"}
      - {text: "A vertical line at zero mole fraction", mistake: "reads the axes the wrong way round"}
    explanation: "Total pressure is the sum of two terms that each vary linearly with mole fraction, so the plot is a straight line between the two pure values."
    hints:
      - "Write the total pressure as the sum of two partial pressures, each linear in mole fraction."
      - "Check the pressure at the two ends of the axis where the mole fraction is zero and one."
      - "Consider whether a sum of linear terms can bend."
    diagram: "Graph with mole fraction of A from zero to one on the horizontal axis and total vapour pressure on the vertical axis; a straight line runs between the pure pressure of B at one end and the pure pressure of A at the other."
    confidence: high
  - topic: raoults_law
    type: numeric
    difficulty: hard
    role: transfer
    stem: "Two volatile liquids A and B form an ideal solution. Pure A has a vapour pressure of 300 mm Hg and pure B has 100 mm Hg at the same temperature. If the mole fraction of A in the liquid is 0.4, what is the total vapour pressure in mm Hg?"
    correct: "180"
    unit: "mm Hg"
    wrong: []
    explanation: "The partial pressure of A is 0.4 times 300, which is 120 mm Hg. The partial pressure of B is 0.6 times 100, which is 60 mm Hg. The total is 180 mm Hg."
    hints:
      - "Find the mole fraction of B from the mole fraction of A."
      - "Calculate each partial pressure separately using Raoult's law."
      - "Add the two partial pressures to get the total."
    diagram: null
    confidence: high
  - topic: raoults_law
    type: mcq
    difficulty: hard
    role: transfer
    stem: "In an ideal binary solution, the vapour above the liquid is richer in which component than the liquid itself?"
    correct: "The more volatile component"
    unit: ""
    wrong:
      - {text: "The less volatile component", mistake: "reverses the volatility effect"}
      - {text: "Both components in exactly the liquid ratio", mistake: "assumes vapour and liquid always have the same composition"}
      - {text: "Only the solvent", mistake: "ignores the contribution of the solute"}
    explanation: "The more volatile component contributes a larger partial pressure, so it makes up a larger share of the vapour than of the liquid."
    hints:
      - "Consider which component escapes to the vapour more easily."
      - "Think about how the partial pressure of each component relates to its vapour composition."
      - "Compare the composition of the vapour with the composition of the liquid, not with the pure liquid."
    diagram: "Two stacked boxes: the lower box shows a liquid mixture of components A and B with their mole fractions labelled, and the upper box shows the vapour above it with a larger share of component A."
    confidence: high
