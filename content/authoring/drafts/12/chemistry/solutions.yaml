    type: numeric
    difficulty: medium
    role: apply
    stem: "Pure water has a vapour pressure of 31.8 mm Hg at a temperature. In an ideal solution the mole fraction of water is 0.9. What is the vapour pressure of water above the solution in mm Hg?"
    correct: "28.62"
    unit: "mm Hg"
    wrong: []
    explanation: "Multiplying the pure vapour pressure 31.8 mm Hg by the mole fraction 0.9 gives 28.62 mm Hg."
    hints:
      - "Multiply the pure vapour pressure by the mole fraction of the water in the mixture."
      - "Keep the two decimal places in the product."
      - "Do not use the mole fraction of the solute."
