  - topic: colligative_properties
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which of these is a colligative property?"
    correct: "Freezing point depression"
    unit: ""
    wrong:
      - {text: "Density of the solution", mistake: "treats any measured property as colligative"}
      - {text: "Colour of the solution", mistake: "treats appearance as dependent on the number of particles"}
      - {text: "Refractive index of the solvent", mistake: "assumes a solvent property changes with the solute identity"}
    explanation: "Colligative properties depend on the number of solute particles, not on their identity. Freezing point depression is one of them."
    hints:
      - "Colligative means the property depends on how many particles are present, not on what they are."
      - "Think about which property changes in a predictable way with the particle count."
      - "Eliminate properties that depend mainly on the identity or colour of the particles."
