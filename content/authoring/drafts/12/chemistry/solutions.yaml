  - topic: raoults_law
    type: numeric
    difficulty: easy
    role: recall
    stem: "Pure benzene has a vapour pressure of 100 mm Hg at a given temperature. In an ideal solution its mole fraction is 0.5. What is its partial vapour pressure in mm Hg?"
    correct: "50"
    unit: "mm Hg"
    wrong: []
    explanation: "Raoult's law says the partial pressure equals the mole fraction times the pure vapour pressure. That gives 0.5 times 100 mm Hg."
    hints:
      - "Apply Raoult's law: partial pressure equals mole fraction times pure vapour pressure."
      - "Use the pure vapour pressure given in the stem."
      - "Multiply the two values together."
    diagram: null
    confidence: high
  - topic: raoults_law
    type: mcq
    difficulty: easy
    role: recall
    stem: "According to Raoult's law, what does the partial vapour pressure of a component in an ideal solution depend on?"
    correct: "Its mole fraction and its pure vapour pressure"
    unit: ""
    wrong:
      - {text: "Only the molar mass of the solvent", mistake: "uses molar mass in place of composition"}
      - {text: "Only the volume of the container", mistake: "ignores the composition of the liquid"}
      - {text: "Only the osmotic pressure of the solute", mistake: "mixes up two different colligative ideas"}
    explanation: "Raoult's law multiplies the pure vapour pressure of a component by its mole fraction in the liquid. Both quantities are needed."
    hints:
      - "Think about how much of the component is present in the liquid."
      - "Consider how volatile the component is when it is pure."
      - "Combine the two quantities that describe the liquid and the pure component."
    diagram: null
    confidence: high
