    confidence: high
  - topic: abnormal_molar_mass
    type: mcq
    difficulty: easy
    role: recall
    stem: "What does a van't Hoff factor greater than 1 indicate?"
    correct: "Dissociation of the solute into more particles"
    unit: ""
    wrong:
      - {text: "Association of solute molecules into fewer particles", mistake: "reverses the direction of the effect"}
      - {text: "No change in the number of particles", mistake: "assumes ideal behaviour always applies"}
      - {text: "The solute is insoluble in the solvent", mistake: "links the factor with solubility"}
    explanation: "A factor above 1 means the solute produces more particles than its formula units, which happens on dissociation."
    hints:
      - "Ask whether the number of particles in solution goes up or down compared with the formula units added."
      - "Think about what a salt does when it separates into ions in water."
      - "Consider the direction in which the particle count changes."
