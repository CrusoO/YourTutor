    explanation: "AB2 gives three ions when it dissociates. The factor is one plus alpha times the number of ions minus one, which gives 1 plus 0.8 times 2, or 2.6."
    hints:
      - "Use the relation i equals one plus alpha times the number of ions minus one."
      - "First count how many ions one formula unit produces on complete dissociation."
