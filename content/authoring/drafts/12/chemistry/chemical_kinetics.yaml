items:
  - topic: rate_of_reaction
    type: numeric
    difficulty: easy
    role: procedure
    stem: "The concentration of reactant A falls from 0.80 mol/L to 0.40 mol/L in 20 s. What is the average rate of disappearance of A in mol/L/s?"
    correct: "0.02"
    unit: "mol/L/s"
    wrong: []
    explanation: "The concentration change is 0.40 mol/L over 20 s, giving an average rate of 0.02 mol/L/s."
    hints:
      - "Divide the change in concentration by the time interval."
      - "Take the size of the change, since disappearance is reported as a positive rate."
      - "Check the units of the answer."
    diagram: null
    confidence: high
  - topic: rate_of_reaction
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which change raises the rate of a gas phase reaction most directly by increasing the collision frequency?"
    correct: "Raising the concentration of a reactant"
    unit: ""
    wrong:
      - {text: "Adding an inert gas at constant volume", mistake: "treats any gas as a reactant"}
      - {text: "Lowering the temperature", mistake: "assumes slower molecules collide more often"}
      - {text: "Removing the catalyst", mistake: "assumes the catalyst is consumed as a reactant"}
    explanation: "More reactant molecules in the same volume means more collisions per second, so the rate rises."
    hints:
      - "Consider which change puts more reacting particles into the same space."
      - "Think about whether the added substance takes part in the reaction."
      - "Compare the number of collisions before and after the change."
    diagram: null
    confidence: high
  - topic: rate_of_reaction
    type: numeric
    difficulty: medium
    role: apply
    stem: "For the reaction 2A gives B, the rate of disappearance of A is 0.6 mol/L/s. What is the rate of formation of B in mol/L/s?"
    correct: "0.3"
    unit: "mol/L/s"
    wrong: []
    explanation: "Two moles of A disappear for each mole of B formed, so B forms at half the rate at which A disappears."
    hints:
      - "Use the stoichiometric coefficients to relate the rates of the two species."
      - "Divide the rate of A by its coefficient and multiply by the coefficient of B."
      - "Compare the number of moles of each species in the balanced equation."
    diagram: null
    confidence: high
  - topic: rate_of_reaction
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does the rate of a reaction usually slow down as it proceeds?"
    correct: "Reactant concentrations fall, so collisions become less frequent"
    unit: ""
    wrong:
      - {text: "Product molecules absorb the activation energy", mistake: "gives the products a barrier role"}
      - {text: "The rate constant rises as products build up", mistake: "assumes the rate constant depends on the amount of product"}
      - {text: "Products act as a catalyst that inhibits the reaction", mistake: "assigns a catalytic role to the products"}
    explanation: "As reactants are used up, their concentrations fall and the rate drops, because fewer reacting particles meet each second."
    hints:
      - "Track how the concentrations of the reactants change during the reaction."
      - "Consider how the number of collisions depends on the reactant concentration."
      - "Think about what happens to the rate when the reactants become dilute."
    diagram: null
    confidence: high
  - topic: rate_of_reaction
    type: numeric
    difficulty: hard
    role: apply
    stem: "A reaction has rate = k[A]^2 with k = 0.05 L/mol/s. What is the initial rate in mol/L/s when [A] is 0.4 mol/L?"
    correct: "0.008"
    unit: "mol/L/s"
    wrong: []
    explanation: "Squaring 0.4 gives 0.16, and multiplying by 0.05 gives 0.008 mol/L/s."
    hints:
      - "Square the concentration before multiplying by the rate constant."
      - "Keep the units of k consistent with the order of the reaction."
      - "Check that the final units are mol/L/s."
    diagram: null
    confidence: high
  - topic: rate_of_reaction
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A reaction has rate = k[A][B]^2. At a certain point the rate is 0.9 mol/L/s. What is the new rate in mol/L/s if [A] is doubled and [B] is tripled?"
    correct: "16.2"
    unit: "mol/L/s"
    wrong: []
    explanation: "Doubling [A] multiplies the rate by 2, and tripling [B] multiplies it by 9. The combined factor is 18, so the new rate is 16.2 mol/L/s."
    hints:
      - "Each concentration contributes a factor equal to its ratio raised to its exponent."
      - "Multiply the factors contributed by [A] and [B] together."
      - "Apply the combined factor to the original rate."
    diagram: null
    confidence: high
  - topic: rate_law_order
    type: numeric
    difficulty: easy
    role: recall
    stem: "When the concentration of a reactant doubles and the rate also doubles, what is the order of the reaction with respect to that reactant?"
    correct: "1"
    unit: ""
    wrong: []
    explanation: "A rate that changes in the same ratio as the concentration indicates a first order dependence."
    hints:
      - "Compare the factor by which the rate changes with the factor by which the concentration changes."
      - "The order is the exponent that links the two factors."
      - "Think about which exponent makes the two factors equal."
    diagram: null
    confidence: high
  - topic: rate_law_order
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which statement about the order of a reaction is correct?"
    correct: "It must be found experimentally and need not match the stoichiometric coefficients"
    unit: ""
    wrong:
      - {text: "It always equals the sum of the stoichiometric coefficients", mistake: "assumes the balanced equation sets the rate law"}
      - {text: "It is always a whole number", mistake: "assumes orders are limited to integers"}
      - {text: "It is fixed by the enthalpy of the reaction", mistake: "links the order with the energy change"}
    explanation: "The order comes from experimental data on how the rate depends on concentration. It is not read directly from the balanced equation."
    hints:
      - "Think about whether the order comes from the rate law or from the balanced equation."
      - "Consider how the rate law is determined in the laboratory."
      - "Check whether the order is linked to the energy change of the reaction."
    diagram: null
    confidence: high
  - topic: rate_law_order
    type: numeric
    difficulty: medium
    role: apply
    stem: "When the concentration of a reactant is doubled, the rate becomes four times larger. What is the order of the reaction with respect to that reactant?"
    correct: "2"
    unit: ""
    wrong: []
    explanation: "Doubling the concentration multiplies the rate by 2 raised to the order. Since 2 squared equals 4, the order is 2."
    hints:
      - "Write the rate ratio as the concentration ratio raised to the order."
      - "Take logarithms of both sides to find the exponent."
      - "Solve for the exponent that gives the observed rate ratio."
    diagram: null
    confidence: high
  - topic: rate_law_order
    type: mcq
    difficulty: medium
    role: apply
    stem: "For a rate law rate = k[A]^2 with concentration in mol/L and time in s, what are the units of k?"
    correct: "L mol-1 s-1"
    unit: ""
    wrong:
      - {text: "mol L-1 s-1", mistake: "copies the units of the rate"}
      - {text: "s-1", mistake: "assumes first order units"}
      - {text: "mol-1 L s", mistake: "inverts the units"}
    explanation: "Units of k equal the units of rate divided by the units of concentration squared, which gives litres per mole per second."
    hints:
      - "Divide the units of rate by the units of concentration raised to the order."
      - "Write each unit with its exponent and combine the powers."
      - "Keep the units of concentration in the denominator when the order is two."
    diagram: null
    confidence: high
  - topic: rate_law_order
    type: numeric
    difficulty: hard
    role: apply
    stem: "A reaction has rate = k[A]^2[B]. At 0.005 mol/L/s with [A] = 0.1 mol/L and [B] = 0.1 mol/L, what is the rate in mol/L/s when [A] is 0.2 mol/L and [B] is 0.3 mol/L?"
    correct: "0.06"
    unit: "mol/L/s"
    wrong: []
    explanation: "Doubling [A] multiplies the rate by 4, and tripling [B] multiplies it by 3. The combined factor of 12 applied to 0.005 gives 0.06 mol/L/s."
    hints:
      - "Find the factor by which each concentration changes and raise it to the matching order."
      - "Multiply the factors from each reactant together."
      - "Apply the combined factor to the given starting rate."
    diagram: null
    confidence: high
  - topic: rate_law_order
    type: mcq
    difficulty: hard
    role: transfer
    stem: "The rate law of a reaction is rate = k[A]^0[B]^1. Which statement is correct?"
    correct: "Changing [A] has no effect on the rate"
    unit: ""
    wrong:
      - {text: "Doubling [A] doubles the rate", mistake: "treats a zero order dependence as first order"}
      - {text: "Doubling [B] quadruples the rate", mistake: "squares the exponent of B"}
      - {text: "The overall order of the reaction is zero", mistake: "ignores the exponent on B"}
    explanation: "A concentration raised to the power zero does not affect the rate. The rate depends only on [B] with first order dependence, so the overall order is one."
    hints:
      - "Think about what a concentration raised to the power zero does to the rate."
      - "Add the exponents of all reactants to find the overall order."
      - "Compare the exponent of each reactant with the effect it has on the rate."
    diagram: null
    confidence: high
  - topic: integrated_rate_laws
    type: numeric
    difficulty: easy
    role: recall
    stem: "A first order reaction has a rate constant of 0.693 per second. What is its half-life in seconds?"
    correct: "1"
    unit: "s"
    wrong: []
    explanation: "For a first order reaction the half-life equals 0.693 divided by k. With k equal to 0.693 per second, the half-life is 1 s."
    hints:
      - "For a first order reaction the half-life is ln 2 divided by the rate constant."
      - "Use the value of ln 2 as about 0.693."
      - "Check the units of the half-life."
    diagram: null
    confidence: high
  - topic: integrated_rate_laws
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which plot gives a straight line for a first order reaction?"
    correct: "Natural logarithm of concentration against time"
    unit: ""
    wrong:
      - {text: "Concentration against time", mistake: "assumes the decay is linear"}
      - {text: "Reciprocal of concentration against time", mistake: "uses the second order plot"}
      - {text: "Concentration squared against time", mistake: "uses a higher order plot"}
    explanation: "The integrated first order rate law gives ln [A] as a linear function of time, with slope equal to minus k."
    hints:
      - "Recall the integrated rate equation for first order decay."
      - "Identify which function of concentration appears linearly in that equation."
      - "Consider the plot that gives a straight line with slope minus k."
    diagram: null
    confidence: high
  - topic: integrated_rate_laws
    type: numeric
    difficulty: medium
    role: procedure
    stem: "A first order reaction has a rate constant of 0.0231 per minute. What is its half-life in minutes? Give the nearest whole number."
    correct: "30"
    unit: "min"
    wrong: []
    explanation: "Dividing 0.693 by 0.0231 per minute gives a half-life of about 30 minutes."
    hints:
      - "Use the relation between the half-life and the rate constant for first order decay."
      - "Divide the natural logarithm of two by the rate constant."
      - "Round the result to the nearest whole number."
    diagram: null
    confidence: high
  - topic: integrated_rate_laws
    type: numeric
    difficulty: medium
    role: apply
    stem: "For a first order reaction with k = 0.1 per minute, how many minutes does the concentration take to fall from 0.8 mol/L to 0.1 mol/L? Give one decimal place."
    correct: "20.8"
    unit: "min"
    wrong: []
    explanation: "The time is ln of the ratio of initial to final concentration divided by k. The ratio is 8, and ln 8 divided by 0.1 gives about 20.8 minutes."
    hints:
      - "Use the natural logarithm of the ratio of initial to final concentration divided by the rate constant."
      - "Compute the ratio of the two concentrations first."
      - "Round the final answer to one decimal place."
    diagram: null
    confidence: high
  - topic: integrated_rate_laws
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A zero order reaction starts with [A] = 0.5 mol/L and has k = 0.02 mol/L/min. How many minutes does it take for [A] to reach zero?"
    correct: "25"
    unit: "min"
    wrong: []
    explanation: "For zero order the concentration falls by k each minute, so the time to consume 0.5 mol/L is 0.5 divided by 0.02, which is 25 minutes."
    hints:
      - "For zero order the concentration falls by a fixed amount each unit of time."
      - "Divide the starting concentration by the rate constant."
      - "Check the units so that the time comes out in minutes."
    diagram: null
    confidence: high
  - topic: integrated_rate_laws
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A second order reaction has k = 0.05 L/mol/s and starts at 0.2 mol/L. How many seconds does it take for the concentration to reach 0.1 mol/L?"
    correct: "100"
    unit: "s"
    wrong: []
    explanation: "For second order, 1/[A] minus 1/[A]0 equals kt. The reciprocals are 10 and 5 L/mol, and their difference of 5 divided by 0.05 gives 100 s."
    hints:
      - "For second order reactions a plot of the reciprocal of concentration against time is linear."
      - "Find the reciprocal of each concentration before subtracting."
      - "Divide the difference of reciprocals by the rate constant."
    diagram: null
    confidence: high
  - topic: arrhenius_collision
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which term in the Arrhenius equation gives the fraction of collisions with energy at least equal to the activation energy?"
    correct: "exp(-Ea/RT)"
    unit: ""
    wrong:
      - {text: "A, the frequency factor", mistake: "confuses the pre-exponential term with the fraction"}
      - {text: "Ea/R", mistake: "treats a constant ratio as the fraction"}
      - {text: "RT", mistake: "uses the temperature term as the fraction"}
    explanation: "The exponential term exp(-Ea/RT) is the fraction of molecular collisions that carry enough energy to react. The frequency factor A is a separate term."
    hints:
      - "Look for the factor that depends on both the activation energy and the temperature."
      - "The frequency factor does not depend on the energy barrier."
      - "Find the exponential term in the equation."
    diagram: null
    confidence: high
  - topic: arrhenius_collision
    type: numeric
    difficulty: easy
    role: recall
    stem: "An activation energy is given as 50 kJ/mol. What is it in J/mol?"
    correct: "50000"
    unit: "J/mol"
    wrong: []
    explanation: "One kilojoule is one thousand joules, so 50 kJ/mol equals 50000 J/mol."
    hints:
      - "Multiply by one thousand to convert kilojoules into joules."
      - "Check that the unit prefix kilo means one thousand."
      - "Keep the per mole part of the unit unchanged."
    diagram: null
    confidence: high
  - topic: arrhenius_collision
    type: numeric
    difficulty: medium
    role: apply
    stem: "A reaction has activation energy 50 kJ/mol. How many times larger is the rate constant at 310 K than at 300 K? Use R = 8.314 J/mol/K and give two decimal places."
    correct: "1.91"
    unit: ""
    wrong: []
    explanation: "The two-point Arrhenius form gives ln of the ratio of rate constants equal to Ea over R times the difference of reciprocal temperatures. Exponentiating gives a ratio of about 1.91."
    hints:
      - "Use the two-point form of the Arrhenius equation with the difference of reciprocal temperatures."
      - "Convert the activation energy to J/mol before dividing by R."
      - "Exponentiate the result to get the ratio of the rate constants."
    diagram: null
    confidence: high
  - topic: arrhenius_collision
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does the rate of a reaction increase steeply when the temperature rises by a modest amount?"
    correct: "More molecules have energy above the activation barrier"
    unit: ""
    wrong:
      - {text: "The activation energy falls as temperature rises", mistake: "confuses the barrier with the number of molecules able to cross it"}
      - {text: "Collisions become exactly twice as frequent for every 10 K", mistake: "treats a rule of thumb as the cause"}
      - {text: "Products are removed faster from the mixture", mistake: "links product removal with the rate of formation"}
    explanation: "A small rise in temperature shifts the energy distribution, so a much larger fraction of molecules exceeds the activation barrier. The barrier itself stays the same."
    hints:
      - "Consider how the energy distribution of the molecules changes when temperature rises."
      - "Think about how many molecules have enough energy to cross the barrier."
      - "Decide whether the barrier itself changes with temperature."
    diagram: "Axes with temperature on the horizontal axis and rate constant on the vertical axis; a curve rises steeply and bends upward as the temperature increases."
    confidence: high
  - topic: arrhenius_collision
    type: numeric
    difficulty: hard
    role: transfer
    stem: "The rate constant of a reaction is 0.002 per second at 300 K and 0.008 per second at 320 K. Using R = 8.314 J/mol/K, what is the activation energy in kJ/mol? Give one decimal place."
    correct: "55.3"
    unit: "kJ/mol"
    wrong: []
    explanation: "The ratio of rate constants is 4, so ln 4 equals Ea over R times the difference of reciprocal temperatures. Solving gives an activation energy of about 55.3 kJ/mol."
    hints:
      - "Take the natural logarithm of the ratio of the two rate constants."
      - "Use the difference between the reciprocals of the two temperatures."
      - "Solve for the activation energy and convert joules to kilojoules."
    diagram: null
    confidence: high
  - topic: arrhenius_collision
    type: mcq
    difficulty: hard
    role: transfer
    stem: "The energy profile of a reaction is drawn with and without a second curve. Which change lowers the energy barrier without altering the energy of the reactants or products?"
    correct: "Adding a catalyst"
    unit: ""
    wrong:
      - {text: "Raising the temperature", mistake: "treats heat as a change in the barrier itself"}
      - {text: "Diluting the reactants", mistake: "treats concentration as an energy term"}
      - {text: "Increasing the volume of the vessel", mistake: "assumes volume changes the energy profile"}
    explanation: "A catalyst provides an alternative pathway with a lower peak. It is not consumed and it leaves the start and end energies unchanged."
    hints:
      - "Compare what changes in the diagram with what stays the same."
      - "Think about which species speeds up the reaction without being used up."
      - "Focus on the height of the peak rather than the starting level."
    diagram: "Energy against reaction coordinate: reactants on a starting level, a peak for the transition state, and products on a lower final level; a dashed second curve has a lower peak with the same start and end levels."
    confidence: high
