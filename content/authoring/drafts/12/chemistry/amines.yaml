  - topic: amine_basicity
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why is trimethylamine less basic in water than dimethylamine?"
    correct: "Solvation of the trimethylammonium ion is reduced by steric crowding of hydrogen bonds"
    unit: ""
    wrong:
      - {text: "Methyl groups are electron withdrawing", mistake: "reverses the inductive effect"}
      - {text: "Trimethylamine has a higher pKa", mistake: "reverses the meaning of pKa"}
      - {text: "Trimethylamine cannot accept protons", mistake: "assumes no lone pair is present"}
    explanation: "In water the protonated amine is stabilised by hydrogen bonds to water. A trimethylammonium ion has only one N-H, so it is less solvated than the dimethylammonium ion, and trimethylamine is the weaker base in water."
    hints:
      - "Think about how many N-H hydrogens the protonated amine has available to bond with water."
      - "Consider how solvation of the cation in water affects basicity."
      - "Compare the effect of solvation with the effect of alkyl groups alone."
    diagram: null
    confidence: high
  - topic: amine_basicity
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why is pyridine a weaker base than piperidine?"
    correct: "Its lone pair lies in an sp2 orbital with more s character"
    unit: ""
    wrong:
      - {text: "Pyridine has no lone pair", mistake: "misreads the structure"}
      - {text: "Piperidine is aromatic", mistake: "misreads the ring"}
      - {text: "Pyridine is a gas at room temperature", mistake: "links physical state with basicity"}
    explanation: "The nitrogen in pyridine is sp2 hybridised, and its lone pair sits in an orbital with more s character that is held closer to the nucleus. Piperidine's sp3 lone pair is more available to accept a proton."
    hints:
      - "Compare the hybridisation of the nitrogen in each ring."
      - "Think about how much s character a lone pair in an sp2 orbital has."
      - "Consider which lone pair is more available for protonation."
    diagram: null
    confidence: high
