    type: mcq
    difficulty: medium
    role: apply
    stem: "In the gas phase, which of these is the most basic amine?"
    correct: "Triethylamine"
    unit: ""
    wrong:
      - {text: "Ammonia", mistake: "assumes solvation is needed for basicity"}
      - {text: "Aniline", mistake: "assumes the ring increases basicity"}
      - {text: "Methylamine", mistake: "is a primary amine with fewer alkyl groups"}
    explanation: "In the gas phase there is no solvent to stabilise the ammonium ion, so the electron donating alkyl groups decide the order. Triethylamine has the most of them."
    hints:
      - "In the gas phase there is no solvent to stabilise the ammonium ion, so inductive effects matter most."
