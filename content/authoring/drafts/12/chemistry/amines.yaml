  - topic: amine_basicity
    type: mcq
    difficulty: easy
    role: explain
    stem: "Which of these is the strongest base in aqueous solution?"
    correct: "Dimethylamine"
    unit: ""
    wrong:
      - {text: "Aniline", mistake: "assumes aromatic amines are the strongest bases"}
      - {text: "Ammonia", mistake: "assumes the simplest base is the strongest"}
      - {text: "Triphenylamine", mistake: "assumes more substituents always add basicity"}
    explanation: "Alkyl groups donate electron density to nitrogen and raise its basicity. Dimethylamine is more basic than ammonia, and aryl amines are much weaker."
    hints:
      - "Consider the inductive effect of alkyl groups and the steric hindrance to protonation."
      - "Think about whether the groups on nitrogen push electrons towards it."
      - "Compare the effect of aryl groups with that of alkyl groups."
    diagram: null
    confidence: high
  - topic: amine_basicity
    type: mcq
    difficulty: easy
    role: explain
    stem: "Why is aniline a weaker base than cyclohexylamine?"
    correct: "The nitrogen lone pair is delocalised into the benzene ring"
    unit: ""
    wrong:
      - {text: "The nitrogen is more electronegative in aniline", mistake: "treats electronegativity as the main factor"}
      - {text: "Aniline has more hydrogen atoms", mistake: "counts atoms rather than electron effects"}
      - {text: "Cyclohexylamine is aromatic", mistake: "misreads the structure of cyclohexane"}
    explanation: "The lone pair on nitrogen in aniline overlaps with the pi system of the ring, so it is less available to take a proton."
    hints:
      - "Think about where the nitrogen lone pair sits when it is next to an aromatic system."
      - "Consider whether the lone pair is localised or shared with the ring."
      - "Compare the availability of the lone pair in the two amines."
    diagram: null
    confidence: high
