  - topic: amine_classification_nomenclature
    type: mcq
    difficulty: hard
    role: transfer
    stem: "In the Hinsberg test, which statement about the product of a primary amine is correct?"
    correct: "Its sulphonamide dissolves in alkali"
    unit: ""
    wrong:
      - {text: "Its sulphonamide is insoluble in alkali", mistake: "reverses the Hinsberg result for primary amines"}
      - {text: "It forms no product with benzenesulphonyl chloride", mistake: "assumes primary amines do not react"}
      - {text: "It gives a gas on mixing", mistake: "confuses the test with gas evolution"}
    explanation: "A primary amine gives an N-substituted sulphonamide whose N-H is acidic. It dissolves in aqueous alkali as its salt."
    hints:
      - "Recall which Hinsberg product has an acidic N-H and dissolves in alkali."
      - "Think about how many hydrogens are left on nitrogen after the reaction."
      - "Consider the solubility of the sulphonamide in an alkaline solution."
