    role: transfer
    stem: "Why does benzenediazonium couple with phenol mainly at the para position?"
    correct: "The para position is activated by the hydroxyl group and is less crowded"
    unit: ""
    wrong:
      - {text: "Phenol has no para position", mistake: "misreads the ring"}
