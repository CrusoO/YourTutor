    role: apply
    stem: "Which amine is the least basic in aqueous solution?"
    correct: "Triphenylamine"
    unit: ""
    wrong:
      - {text: "Methylamine", mistake: "assumes the smallest amine is the weakest"}
      - {text: "Ammonia", mistake: "assumes ammonia is the weakest base"}
      - {text: "Diethylamine", mistake: "assumes secondary amines are weak bases"}
    explanation: "Three phenyl groups delocalise the nitrogen lone pair strongly and crowd the site of protonation, so triphenylamine is extremely weakly basic."
