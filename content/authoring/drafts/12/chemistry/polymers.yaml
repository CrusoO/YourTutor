  - topic: polymer_classification
    type: mcq
    difficulty: easy
    role: recall
    stem: "What property defines a thermoplastic polymer?"
    correct: "It softens on heating and hardens again on cooling"
    unit: ""
    wrong:
      - {text: "It is permanently cross linked after the first heating", mistake: "describes thermosetting polymers"}
      - {text: "It is insoluble in every solvent", mistake: "overgeneralises the solubility of polymers"}
      - {text: "It cannot be remoulded once made", mistake: "describes thermosetting polymers"}
    explanation: "Thermoplastics have linear or branched chains held by weak forces. They soften on heating and can be remoulded many times."
    hints:
      - "Compare with thermosetting polymers that set once and cannot be softened again."
      - "Think about whether the chains are held together by weak forces or by permanent cross links."
      - "Consider how the polymer responds to repeated heating."
    diagram: null
    confidence: high
  - topic: polymer_classification
    type: mcq
    difficulty: medium
    role: apply
    stem: "How is Bakelite classified?"
    correct: "Thermosetting polymer made by condensation"
    unit: ""
    wrong:
      - {text: "Thermoplastic made by addition", mistake: "uses the wrong category for both properties"}
      - {text: "Natural rubber", mistake: "confuses a synthetic resin with a natural elastomer"}
      - {text: "Elastomer made by addition", mistake: "uses an unrelated class"}
    explanation: "Bakelite is made by condensing phenol with formaldehyde and is cross linked on setting, so it is a thermosetting condensation polymer."
    hints:
      - "Think about whether it is cross linked and how it is made from its monomers."
      - "Consider whether a small molecule is lost when the monomers link."
      - "Decide whether the polymer softens on heating."
    diagram: null
    confidence: high
  - topic: polymer_classification
    type: mcq
    difficulty: medium
    role: apply
    stem: "Buna-S is classified as which type of polymer?"
    correct: "Synthetic elastomer from copolymerisation"
    unit: ""
    wrong:
      - {text: "Natural elastomer", mistake: "assumes it comes from plant latex"}
      - {text: "Thermosetting resin", mistake: "assumes all synthetic polymers set"}
      - {text: "Fibre from condensation", mistake: "assumes a fibre class"}
    explanation: "Buna-S is a copolymer of butadiene and styrene. It is a synthetic rubber, an elastomer made by addition copolymerisation."
    hints:
      - "Think about the two monomers used and whether the product stretches like rubber."
      - "Consider whether the polymer is made by a single monomer or by two."
      - "Decide whether the material is natural or synthetic."
    diagram: null
    confidence: high
  - topic: polymer_classification
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why do thermosetting polymers not soften on heating?"
    correct: "Their chains are cross linked into a rigid network"
    unit: ""
    wrong:
      - {text: "Their monomers are gases", mistake: "links the monomer state with polymer behaviour"}
      - {text: "They have no carbon chains", mistake: "misreads the structure"}
      - {text: "They are always ionic", mistake: "assumes a bond type for all polymers"}
    explanation: "Cross links make a single network that cannot slide past itself, so heating cannot soften the material. Heating beyond a point decomposes it."
    hints:
      - "Think about the bonds between chains in a set resin."
      - "Consider whether the chains can slide past one another when heated."
      - "Compare the network of a set resin with the separate chains of a thermoplastic."
    diagram: null
    confidence: high
  - topic: polymer_classification
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which property best describes a condensation polymer?"
    correct: "Loss of a small molecule such as water at each linking step"
    unit: ""
    wrong:
      - {text: "No byproduct is formed", mistake: "describes addition polymers"}
      - {text: "Only double bonds open during growth", mistake: "describes addition polymers"}
      - {text: "Only one monomer type is used", mistake: "assumes one monomer is always used"}
    explanation: "Condensation polymerisation joins monomers through functional groups, releasing a small molecule such as water or HCl at each step."
    hints:
      - "Think about what a step growth reaction releases as two monomers link."
      - "Consider which functional groups react together to join the monomers."
      - "Compare with addition polymerisation, which joins monomers without losing anything."
    diagram: null
    confidence: high
