  - topic: important_polymers
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why is nylon-6 classified as a polyamide?"
    correct: "It has repeating amide linkages from one monomer with amine and acid groups"
    unit: ""
    wrong:
      - {text: "It contains only carbon and hydrogen", mistake: "ignores the nitrogen in the chain"}
      - {text: "It has ester bonds throughout", mistake: "confuses amides with esters"}
      - {text: "It is a natural protein", mistake: "confuses synthetic with natural polymers"}
    explanation: "Nylon-6 is made by ring opening polymerisation of caprolactam. The repeat unit contains amide groups, which is the defining feature of a polyamide."
    hints:
      - "Look at the bond that links the monomer units and the groups that form it."
      - "Think about whether the repeating unit contains an N-C=O link."
      - "Compare the chain linkage with that of a polyester."
