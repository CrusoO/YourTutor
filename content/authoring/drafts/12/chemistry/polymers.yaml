  - topic: addition_condensation
    type: mcq
    difficulty: easy
    role: recall
    stem: "What are the monomers of nylon-6,6?"
    correct: "Hexamethylenediamine and adipic acid"
    unit: ""
    wrong:
      - {text: "Caprolactam only", mistake: "is the monomer of nylon-6"}
      - {text: "Ethylene glycol and terephthalic acid", mistake: "are the monomers of a polyester"}
      - {text: "Styrene and butadiene", mistake: "are the monomers of a rubber"}
    explanation: "Hexamethylenediamine has amine groups at both ends and adipic acid has acid groups at both ends. Their condensation gives the polyamide nylon-6,6."
    hints:
      - "Nylon-6,6 uses two monomers, one with amine groups at both ends and one with acid groups at both ends."
      - "Count the carbons in each monomer, since both have six."
      - "Think about which pair of monomers forms amide links."
    diagram: null
    confidence: high
