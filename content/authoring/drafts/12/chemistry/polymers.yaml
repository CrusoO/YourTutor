    difficulty: easy
    role: recall
    stem: "Which of these is a natural polymer?"
    correct: "Cellulose"
    unit: ""
    wrong:
      - {text: "Nylon-6,6", mistake: "is a synthetic polyamide"}
      - {text: "Polythene", mistake: "is a synthetic addition polymer"}
      - {text: "Bakelite", mistake: "is a synthetic resin"}
    explanation: "Cellulose is made by plants from glucose units. The other options are made in factories from petrochemical monomers."
    hints:
      - "Think about a polymer made by plants rather than in a factory."
      - "Consider which of these is built from sugar units."
      - "Eliminate the options that are made from petrochemical monomers."
