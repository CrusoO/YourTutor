items:
  - topic: carbohydrate_classes
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which disaccharide is a reducing sugar?"
    correct: "Maltose"
    unit: ""
    wrong:
      - {text: "Sucrose", mistake: "assumes both anomeric carbons are free in every disaccharide"}
      - {text: "Trehalose", mistake: "assumes all disaccharides reduce Fehling's solution"}
      - {text: "Starch", mistake: "treats a polysaccharide as a disaccharide"}
    explanation: "Maltose has one free anomeric carbon that can open to an aldehyde, so it reduces. Sucrose has both anomeric carbons tied in the glycosidic link and does not reduce."
    hints:
      - "Check whether the anomeric carbon of each unit is free to open into an aldehyde."
      - "Consider which disaccharide has a free hemiacetal group."
      - "Think about how the two units are linked in each disaccharide."
    diagram: null
    confidence: high
  - topic: carbohydrate_classes
    type: mcq
    difficulty: easy
    role: recall
    stem: "Glucose is classified as which type of sugar?"
    correct: "Aldohexose"
    unit: ""
    wrong:
      - {text: "Ketohexose", mistake: "uses the carbonyl type of fructose"}
      - {text: "Disaccharide", mistake: "confuses a monosaccharide with a disaccharide"}
      - {text: "Pentose", mistake: "miscounts the carbons"}
    explanation: "Glucose has six carbons and an aldehyde group, so it is an aldohexose."
    hints:
      - "Count the carbons and identify the carbonyl type the sugar carries."
      - "Think about whether the carbonyl sits at the end or in the middle of the chain."
      - "Combine the carbon count with the carbonyl type in the name."
    diagram: null
    confidence: high
  - topic: carbohydrate_classes
    type: mcq
    difficulty: medium
    role: recall
    stem: "In open chain glucose, which carbon carries the aldehyde group?"
    correct: "C1"
    unit: ""
    wrong:
      - {text: "C6", mistake: "picks the terminal CH2OH carbon"}
      - {text: "C2", mistake: "picks the carbon next to the aldehyde"}
      - {text: "C5", mistake: "picks the carbon that closes the ring"}
    explanation: "Numbering starts at the aldehyde carbon, so C1 is the carbonyl carbon. C6 is the terminal CH2OH group."
    hints:
      - "Number the chain from the end nearest the carbonyl group."
      - "Check which end of the chain carries the carbonyl."
      - "Count along the chain from that end."
    diagram: "Open chain of six carbons drawn vertically with the top carbon double bonded to oxygen, an OH group on each of the middle carbons, and a CH2OH group at the bottom."
    confidence: high
  - topic: carbohydrate_classes
    type: mcq
    difficulty: medium
    role: recall
    stem: "Which polysaccharide is the main storage form of glucose in plants?"
    correct: "Starch"
    unit: ""
    wrong:
      - {text: "Cellulose", mistake: "is the structural polysaccharide of plant walls"}
      - {text: "Chitin", mistake: "is a structural polymer of arthropods"}
      - {text: "Glycogen", mistake: "is the storage form in animals"}
    explanation: "Plants store glucose as starch, a mixture of amylose and amylopectin. Cellulose is the structural polymer of plant cell walls."
    hints:
      - "Think about the form in which plants store glucose for later use."
      - "Consider which polysaccharide plants use for energy storage rather than structure."
      - "Compare the storage role of each polysaccharide with its structural role."
    diagram: null
    confidence: high
  - topic: carbohydrate_classes
    type: mcq
    difficulty: medium
    role: explain
    stem: "The two anomers of glucose differ at which carbon?"
    correct: "C1 in the cyclic hemiacetal form"
    unit: ""
    wrong:
      - {text: "C4, which carries the glycosidic oxygen", mistake: "confuses the glycosidic link with the anomeric carbon"}
      - {text: "C5 in the open chain form", mistake: "assigns the open chain to the wrong carbon"}
      - {text: "C6, which carries the hydroxymethyl group", mistake: "picks the exocyclic carbon"}
    explanation: "Ring closure makes C1 a new stereocentre, with its OH either below or above the ring plane. These two forms are the alpha and beta anomers."
    hints:
      - "Find the carbon that becomes a new stereocentre after ring closure."
      - "Think about which carbon in the ring bears the hemiacetal OH."
      - "Compare the carbon that changes configuration with the carbons that stay fixed."
    diagram: "Pyranose ring drawn as a hexagon with oxygen at one corner; the carbon next to the ring oxygen carries an OH drawn either up or down."
    confidence: high
  - topic: carbohydrate_classes
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why is sucrose a non-reducing sugar?"
    correct: "Both anomeric carbons are tied up in the glycosidic bond"
    unit: ""
    wrong:
      - {text: "It has no hydroxyl groups", mistake: "misreads the structure"}
      - {text: "It is a polymer of many units", mistake: "confuses a disaccharide with a polysaccharide"}
      - {text: "It contains no carbon", mistake: "misreads the formula"}
    explanation: "Sucrose joins glucose and fructose through both anomeric carbons. Neither ring can open to a free aldehyde or ketone, so sucrose does not reduce."
    hints:
      - "Consider whether both monosaccharide units have a free hemiacetal group."
      - "Think about which carbons are used to link the two units."
      - "Compare how sucrose and maltose link their units."
    diagram: null
    confidence: high
