    stem: "Which pairs of bases are formed by hydrogen bonding in DNA?"
    correct: "Adenine with thymine and guanine with cytosine"
    unit: ""
    wrong:
      - {text: "Adenine with cytosine and guanine with thymine", mistake: "swaps the pairing partners"}
      - {text: "Adenine with guanine and thymine with cytosine", mistake: "pairs two purines together"}
      - {text: "Uracil with adenine in DNA", mistake: "uses an RNA base in DNA"}
    explanation: "Adenine pairs with thymine through two hydrogen bonds, and guanine pairs with cytosine through three."
    hints:
