  - topic: proteins_amino_acids
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which bond links amino acids together in a protein chain?"
    correct: "Peptide bond"
    unit: ""
    wrong:
      - {text: "Glycosidic bond", mistake: "links sugar units"}
      - {text: "Ester bond", mistake: "links an acid to an alcohol"}
      - {text: "Disulphide bond", mistake: "is a side chain link rather than the backbone link"}
    explanation: "A peptide bond is an amide link formed when the amino group of one amino acid condenses with the carboxyl group of the next, releasing water."
    hints:
      - "Think about the bond formed between an amino group and a carboxyl group with loss of water."
      - "Consider which functional group pairs give amides."
      - "Compare the backbone link with the links between side chains."
    diagram: null
    confidence: high
  - topic: proteins_amino_acids
    type: mcq
    difficulty: medium
    role: explain
    stem: "Which level of protein structure is the alpha helix?"
    correct: "Secondary structure"
    unit: ""
    wrong:
      - {text: "Primary structure", mistake: "is the sequence only"}
      - {text: "Tertiary structure", mistake: "describes the whole three dimensional fold"}
      - {text: "Quaternary structure", mistake: "describes the assembly of subunits"}
    explanation: "The alpha helix is local folding of the backbone, stabilised by hydrogen bonds between the N-H and C=O groups of residues several places apart. That is secondary structure."
    hints:
      - "Consider whether the level involves local folding stabilised by hydrogen bonds along the backbone."
      - "Think about how far along the chain the stabilising bonds connect."
      - "Compare the local folding with the overall three dimensional shape."
    diagram: "A coiled ribbon drawn as a right handed spiral with dashed hydrogen bonds between turns."
    confidence: high
  - topic: proteins_amino_acids
    type: mcq
    difficulty: medium
    role: apply
    stem: "What is the net charge of an amino acid at its isoelectric point?"
    correct: "Zero, because positive and negative charges balance"
    unit: ""
    wrong:
      - {text: "Only a positive charge", mistake: "ignores the carboxylate group"}
      - {text: "Only a negative charge", mistake: "ignores the ammonium group"}
      - {text: "A charge that depends on the side chain only", mistake: "ignores the charged backbone groups"}
    explanation: "At the isoelectric point the amino acid exists as a zwitterion with an ammonium and a carboxylate group, so the net charge is zero."
    hints:
      - "Recall the charges carried on the amino and carboxyl groups of a zwitterion."
      - "Consider which pH gives no net movement in an electric field."
      - "Think about the two charged groups present on the backbone."
    diagram: null
    confidence: high
  - topic: proteins_amino_acids
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why does denaturation destroy the tertiary structure of a protein without breaking its peptide bonds?"
    correct: "Heat or pH changes disrupt the non-covalent interactions that hold the fold"
    unit: ""
    wrong:
      - {text: "Peptide bonds are broken by mild heat", mistake: "assumes peptide bonds are weak"}
      - {text: "Amino acids change into sugars", mistake: "misreads the chemistry"}
      - {text: "The primary sequence becomes branched", mistake: "assumes denaturation changes the chain connectivity"}
    explanation: "The fold is held by hydrogen bonds, salt bridges and hydrophobic contacts, which are weaker than covalent bonds. Heat or pH change breaks these and the chain unfolds while the backbone stays intact."
    hints:
      - "Consider which bonds are strong covalent links and which are weaker interactions."
      - "Think about which interactions hold a folded protein in shape."
      - "Compare the energy needed to break a covalent bond with that needed to disrupt the fold."
    diagram: "Folded protein drawn as a tangled ribbon, with arrows showing heat and acid breaking hydrogen bonds and salt bridges while the backbone remains a continuous chain."
    confidence: high
  - topic: proteins_amino_acids
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which amino acid has a thiol group in its side chain?"
    correct: "Cysteine"
    unit: ""
    wrong:
      - {text: "Methionine", mistake: "has a thioether rather than a thiol"}
      - {text: "Tyrosine", mistake: "has a phenol group"}
