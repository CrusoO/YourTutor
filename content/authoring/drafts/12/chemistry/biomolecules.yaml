    explanation: "Cysteine carries a sulphur bonded to hydrogen in its side chain, which is a thiol. Two cysteines can form a disulphide cross link."
    hints:
      - "Look for a sulphur atom bonded to hydrogen in the side chain."
      - "Think about which side chain can be oxidised to form a disulphide bridge."
      - "Compare the sulphur containing side chains of the options."
    diagram: null
    confidence: high
