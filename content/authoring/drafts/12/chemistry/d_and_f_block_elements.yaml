items:
  - topic: transition_properties
    type: mcq
    difficulty: easy
    role: recall
    stem: "Why are most transition metal ions coloured?"
    correct: "They absorb visible light to promote d electrons between split d orbitals"
    unit: ""
    wrong:
      - {text: "They have filled s orbitals only", mistake: "assigns colour to s electrons"}
      - {text: "They emit light when heated", mistake: "confuses colour with emission"}
      - {text: "Their nuclei absorb light", mistake: "places the effect in the nucleus"}
    explanation: "Ligands split the d orbitals into groups of different energy. Electrons absorb visible light to move between these levels, and the colour seen is the complementary colour."
    hints:
      - "Think about electrons moving between energy levels split by the surrounding ligands."
      - "Consider which subshell of the metal is involved in the absorption."
      - "Compare the colour of an ion with the light it absorbs."
    diagram: null
    confidence: high
  - topic: transition_properties
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which element of the first transition series shows the highest common oxidation state?"
    correct: "Manganese"
    unit: ""
    wrong:
      - {text: "Chromium", mistake: "uses the dichromate state as the maximum"}
      - {text: "Iron", mistake: "assumes the common iron states are the highest"}
      - {text: "Scandium", mistake: "assumes the first element of the row has the most states"}
    explanation: "Manganese reaches +7 in permanganate, using all its outer s and d electrons in bonding. No other first row element reaches that state commonly."
    hints:
      - "Count the outer electrons available for bonding across the row."
      - "Think about which element in the middle of the row has the most valence electrons available."
      - "Compare the highest states of the elements from chromium to iron."
    diagram: null
    confidence: high
  - topic: transition_properties
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do transition metal compounds with unpaired d electrons show paramagnetism?"
    correct: "The unpaired d electrons give a net magnetic moment"
    unit: ""
    wrong:
      - {text: "Paired s electrons align in a magnetic field", mistake: "uses s electrons instead of d electrons"}
      - {text: "Free protons in the nucleus produce a field", mistake: "misreads the source of magnetism"}
      - {text: "The ionic charge alone creates a magnetic moment", mistake: "assumes charge alone causes magnetism"}
    explanation: "Each unpaired electron has a spin magnetic moment. When unpaired d electrons are present, these moments do not cancel and the substance is attracted to a magnetic field."
    hints:
      - "Count how many electrons in the d subshell are unpaired."
      - "Think about what happens to the spin of electrons that occupy the same orbital."
      - "Consider which electrons generate the magnetic moment."
    diagram: null
    confidence: high
  - topic: transition_properties
    type: mcq
    difficulty: medium
    role: apply
    stem: "Why do transition metals form interstitial compounds with small atoms such as hydrogen, carbon and nitrogen?"
    correct: "Small atoms fit into the gaps of the metal lattice"
    unit: ""
    wrong:
      - {text: "Metals have excess electrons that bond with the small atoms", mistake: "assumes free electrons form the bonds"}
      - {text: "The small atoms replace the metal atoms in the lattice", mistake: "confuses interstitial with substitutional"}
      - {text: "The compounds are simple ionic salts", mistake: "assumes all metal compounds are ionic"}
    explanation: "The small atoms occupy the holes between metal atoms in the close packed lattice without displacing them. This gives hard, high melting compounds."
    hints:
      - "Think about the size of the small atoms compared with the spaces between metal atoms."
      - "Consider whether the small atoms take the place of metal atoms or sit between them."
      - "Compare the structure of these compounds with that of simple salts."
    diagram: null
    confidence: high
  - topic: transition_properties
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which statement about copper(I) compounds is correct?"
    correct: "Cu(I) compounds are diamagnetic because all its electrons are paired"
    unit: ""
    wrong:
      - {text: "Cu(I) compounds are strongly paramagnetic", mistake: "assumes all copper compounds have unpaired electrons"}
      - {text: "Cu(I) has unpaired 4s electrons", mistake: "misplaces the electron count"}
      - {text: "Cu(I) compounds are always deeply coloured", mistake: "assumes all copper compounds are coloured"}
    explanation: "Cu+ has a full 3d10 subshell, so all its electrons are paired and it is diamagnetic. Its compounds are often colourless because no d to d transitions are possible."
    hints:
      - "Write the electron configuration of the Cu+ ion and check for unpaired electrons."
      - "Consider whether a completely filled d subshell can allow transitions between levels."
      - "Compare the magnetism of a full d shell with that of a partly filled one."
    diagram: null
    confidence: high
  - topic: transition_properties
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why are zinc(II) compounds usually colourless?"
    correct: "Its d orbitals are completely filled, so no d to d transitions occur"
    unit: ""
    wrong:
      - {text: "Zinc has no d electrons in any of its states", mistake: "misreads the electron configuration"}
      - {text: "Zinc(II) absorbs only in the ultraviolet", mistake: "assumes ultraviolet absorption explains the colour"}
      - {text: "Zinc is a noble metal that does not react", mistake: "confuses reactivity with colour"}
    explanation: "Zn2+ has a completely filled 3d10 subshell. With no partly filled d level, visible light cannot promote an electron, so the ion is colourless."
    hints:
      - "Count the d electrons in the Zn2+ ion and consider whether they can move between levels."
      - "Think about whether a full d subshell has a gap to absorb into."
      - "Compare Zn2+ with an ion that has partly filled d orbitals."
    diagram: null
    confidence: high
  - topic: transition_reactions
    type: mcq
    difficulty: easy
    role: recall
    stem: "What colour change occurs when acidified dichromate is reduced by a reducing agent?"
    correct: "Orange to green"
    unit: ""
    wrong:
      - {text: "Green to purple", mistake: "reverses the starting colour"}
      - {text: "Purple to colourless", mistake: "uses the permanganate colours"}
      - {text: "Yellow to red", mistake: "confuses dichromate with chromate colours"}
    explanation: "Dichromate ions are orange and contain chromium in the +6 state. Reduction lowers this to Cr3+, which is green."
    hints:
      - "Chromium in dichromate starts at a high oxidation state and is reduced to a lower one."
      - "Consider the colour of the chromium(III) ion formed after reduction."
      - "Compare the colours of the chromium species before and after reduction."
    diagram: null
    confidence: high
  - topic: transition_reactions
    type: mcq
    difficulty: easy
    role: recall
    stem: "In which medium is potassium permanganate usually used as a strong oxidant?"
    correct: "Acidic medium"
    unit: ""
    wrong:
      - {text: "Basic medium only", mistake: "assumes the strongest oxidation needs a base"}
      - {text: "Neutral medium only", mistake: "assumes water alone gives the best result"}
      - {text: "Molten state only", mistake: "assumes it must be molten to react"}
    explanation: "In acid permanganate is reduced to Mn2+ with the largest change in oxidation state, which makes it the strongest oxidant."
    hints:
      - "Consider which medium supplies the hydrogen ions needed for the reduction half reaction."
      - "Think about which condition gives the largest number of electrons gained per ion."
      - "Compare the products of permanganate reduction in different media."
    diagram: null
    confidence: high
  - topic: transition_reactions
    type: mcq
    difficulty: medium
    role: apply
    stem: "In acidic medium, the permanganate ion is reduced to which manganese species?"
    correct: "Mn2+"
    unit: ""
    wrong:
      - {text: "MnO2", mistake: "uses the product of reduction in neutral medium"}
      - {text: "MnO4 2-", mistake: "uses the intermediate manganate ion"}
      - {text: "Manganese metal", mistake: "assumes full reduction to the element"}
    explanation: "In acid MnO4- is reduced to Mn2+, a change from +7 to +2 that involves five electrons per manganese."
    hints:
      - "Count the electrons gained when the manganese oxidation state falls from its starting value in acid."
      - "Consider the oxidation state of manganese in the ion formed in acid."
      - "Compare the products formed in acid and in neutral media."
    diagram: null
    confidence: high
  - topic: transition_reactions
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is potassium dichromate used as a primary standard in titrations?"
    correct: "It is stable, not hygroscopic and available in high purity"
    unit: ""
    wrong:
      - {text: "It is strongly deliquescent", mistake: "uses a property that makes weighing hard"}
      - {text: "It decomposes in water", mistake: "assumes it breaks down in solution"}
      - {text: "It is a liquid at room temperature", mistake: "confuses the salt with a liquid reagent"}
    explanation: "A primary standard must be pure, stable and easy to weigh accurately. Potassium dichromate meets these requirements, so a known mass gives an exact solution."
    hints:
      - "Think about the properties a standard solid needs for accurate weighing."
      - "Consider whether the solid absorbs moisture from air during weighing."
      - "Compare the stability of the compound in air and in solution."
    diagram: null
    confidence: high
  - topic: transition_reactions
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why does the reaction between acidified permanganate and oxalic acid speed up after the first few drops?"
    correct: "The Mn2+ formed acts as an autocatalyst"
    unit: ""
    wrong:
      - {text: "Oxalic acid dissolves the manganese in the flask", mistake: "assumes the reaction is a dissolution"}
      - {text: "The reaction releases heat, so it speeds up", mistake: "treats heat from the reaction as the sole cause"}
      - {text: "Permanganate becomes a stronger oxidant on dilution", mistake: "links dilution with oxidising strength"}
    explanation: "Mn2+ is one of the products, and it catalyses the same reaction. Once a little is formed, the rate rises sharply, which is autocatalysis."
    hints:
      - "Consider which product of the reaction could speed up the same reaction."
      - "Think about whether a species formed during the reaction can increase its own rate."
      - "Compare the rate at the start with the rate after some product has formed."
    diagram: null
    confidence: high
  - topic: transition_reactions
    type: mcq
    difficulty: hard
    role: transfer
    stem: "What is the equivalent mass of KMnO4 when it acts as an oxidant in acidic solution?"
    correct: "Molar mass divided by five"
    unit: ""
    wrong:
      - {text: "Molar mass divided by one", mistake: "assumes one electron is gained per ion"}
      - {text: "Molar mass divided by three", mistake: "uses a different reduced state"}
      - {text: "Molar mass divided by seven", mistake: "uses the oxidation state rather than the electrons gained"}
    explanation: "Equivalent mass is molar mass divided by the number of electrons gained per formula unit. Reduction to Mn2+ gains five electrons, so the divisor is five."
    hints:
      - "Count the electrons gained per permanganate ion when it is reduced to manganese(II) in acid."
      - "Equivalent mass depends on the number of electrons exchanged, not on the oxidation state."
      - "Write the reduction half reaction to find the electrons gained."
    diagram: null
    confidence: high
  - topic: lanthanoids_actinoids
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is lanthanoid contraction?"
    correct: "A steady decrease in ionic radii across the lanthanoid series"
    unit: ""
    wrong:
      - {text: "An increase in atomic size across the series", mistake: "reverses the direction of the change"}
      - {text: "Shrinking of the crystal lattice at low temperatures", mistake: "confuses it with thermal contraction"}
      - {text: "Contraction of d block atoms across a period", mistake: "moves the effect to another block"}
    explanation: "Because the 4f electrons shield poorly, the nuclear charge pulls the electrons inward as atomic number rises. The radii therefore fall steadily across the lanthanoids."
    hints:
      - "Think about the direction in which the radii change as the atomic number rises in the f block."
      - "Consider how poorly the 4f electrons shield the increasing nuclear charge."
      - "Compare the change in size with the change in nuclear charge along the series."
    diagram: null
    confidence: high
  - topic: lanthanoids_actinoids
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which lanthanoid is the most common element to show a +4 oxidation state?"
    correct: "Cerium"
    unit: ""
    wrong:
      - {text: "Lanthanum", mistake: "assumes all lanthanoids reach the same state"}
      - {text: "Europium", mistake: "confuses the +2 state with +4"}
      - {text: "Gadolinium", mistake: "assumes the middle of the series shows the highest state"}
    explanation: "Cerium forms the stable Ce4+ ion, which has an empty 4f shell. Most other lanthanoids are almost exclusively +3."
    hints:
      - "Consider which lanthanoid ion becomes stable when its f shell is empty."
      - "Think about the lanthanoid that is used as an oxidant in analysis."
      - "Compare the common states of the lanthanoids with the one that reaches +4."
    diagram: null
    confidence: high
  - topic: lanthanoids_actinoids
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why do actinoids show a wider range of oxidation states than lanthanoids?"
    correct: "Their 5f and 6d energy levels are close, so more electrons can take part in bonding"
    unit: ""
    wrong:
      - {text: "They have no f electrons at all", mistake: "misreads the electron configuration"}
      - {text: "Their nuclei are less highly charged", mistake: "misplaces the cause"}
      - {text: "They form only fluoride compounds", mistake: "generalises from a single compound type"}
    explanation: "The 5f and 6d levels of the early actinoids lie close in energy, so several electrons can be involved in bonding. Lanthanoid 4f electrons are held more tightly and rarely take part."
    hints:
      - "Compare the energies of the 5f and 6d electrons in the actinoids."
      - "Think about whether the outer f electrons are close in energy to the d electrons."
      - "Consider how tightly the 4f electrons of the lanthanoids are held."
    diagram: null
    confidence: high
  - topic: lanthanoids_actinoids
    type: mcq
    difficulty: medium
    role: recall
    stem: "Why is mischmetal used in lighter flints?"
    correct: "It contains lanthanoid metals that give sparks when struck"
    unit: ""
    wrong:
      - {text: "It melts at a very high temperature", mistake: "links the flint use with a melting point"}
      - {text: "It is a strong magnet", mistake: "assumes the lighter needs magnetism"}
      - {text: "It dissolves gold instantly", mistake: "assumes a reactive alloy dissolves noble metals"}
    explanation: "Mischmetal is an alloy of lanthanoid metals. It is pyrophoric and produces sparks when scratched, which is why it is used in flints."
    hints:
      - "Think about a property that makes certain metal alloys produce sparks when scratched."
      - "Consider the class of metals in mischmetal."
      - "Compare the flint use with other uses of reactive metal alloys."
    diagram: null
    confidence: high
  - topic: lanthanoids_actinoids
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Why are zirconium and hafnium so similar in their chemistry?"
    correct: "The lanthanoid contraction makes hafnium almost the same size as zirconium"
    unit: ""
    wrong:
      - {text: "Both have identical electron counts in every shell", mistake: "assumes the two elements are isotopes"}
      - {text: "Both are radioactive", mistake: "links similarity with radioactivity"}
      - {text: "Both are lanthanoids", mistake: "misclassifies the two elements"}
    explanation: "Hafnium follows the lanthanoids, and the lanthanoid contraction shrinks its radius to nearly match zirconium. Their similar sizes and charges give very similar chemistry."
    hints:
      - "Consider how the size of the second and third row transition metals changes across the lanthanoid series."
      - "Think about why the third row element is not larger than expected."
      - "Compare the atomic radii of the two elements in the same group."
    diagram: null
    confidence: high
  - topic: lanthanoids_actinoids
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why is the magnetic moment of lanthanoid ions harder to predict than that of d block ions?"
    correct: "The 4f electrons are well shielded, and orbital contributions are not quenched by the ligands"
    unit: ""
    wrong:
      - {text: "The f electrons are always paired", mistake: "assumes all f electrons pair up"}
      - {text: "Their nuclei are magnetic", mistake: "places the effect in the nucleus"}
      - {text: "f orbitals are absent in these ions", mistake: "denies that the orbitals exist"}
    explanation: "The 4f electrons are shielded from the ligand field, so orbital angular momentum survives and contributes to the magnetic moment. This makes the moment depend on both spin and orbital effects."
    hints:
      - "Compare how strongly the surrounding ligands affect 4f electrons with their effect on 3d electrons."
      - "Think about whether the orbital contribution to the moment survives in the complex."
      - "Consider how shielding changes the influence of the environment."
    diagram: null
    confidence: medium
