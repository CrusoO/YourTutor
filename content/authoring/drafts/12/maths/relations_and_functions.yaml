  - topic: "composition_of_functions"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Let f: R to R be f(x) = x + 2 and g: R to R be g(x) = x - 2. Which statement about f o g is correct?"
    correct: "f o g = g o f = identity on R"
    unit: ""
    wrong:
      - {text: "f o g(x) = x + 4", mistake: "adds the constants instead of letting them cancel"}
      - {text: "f o g is not defined on R", mistake: "thinks composition needs a restriction of the domain"}
      - {text: "f o g is a constant function", mistake: "treats the two linear terms as removing the variable"}
    explanation: "Substituting g(x) = x - 2 into f gives (x - 2) + 2, which equals x. The same holds in the other order, so both composites are the identity on R."
    hints:
      - "Write f(g(x)) by substituting g(x) into f."
      - "Track the constants that appear after the substitution."
      - "Compare the simplified result with the simplest function on R."
    diagram: null
    confidence: high

