  - topic: "composition_of_functions"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "Let f(x) = x^2 and g(x) = x - 1 on the real numbers. Which expression equals (g o f)(x)?"
    correct: "x^2 - 1"
    unit: ""
    wrong:
      - {text: "(x - 1)^2", mistake: "applies f after g instead of applying g to the output of f"}
      - {text: "x^2 + 1", mistake: "changes the sign of the constant when substituting"}
      - {text: "x^2 + x - 1", mistake: "adds the two functions instead of substituting one into the other"}
    explanation: "Substituting f(x) = x^2 into g wherever g has its variable gives x^2 minus 1."
    hints:
      - "Substitute f(x) into g wherever g has its variable."
      - "The variable in g is replaced by the whole expression for f."
      - "Write the substitution first before simplifying anything."
    diagram: null
    confidence: high

