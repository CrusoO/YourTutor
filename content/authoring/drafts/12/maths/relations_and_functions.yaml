  - topic: "composition_of_functions"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Let f(x) = x + 1 and g(x) = 2x. What is (f o g)(3)?"
    correct: "7"
    unit: ""
    wrong:
      - {text: "8", mistake: "reverses the order of composition"}
      - {text: "10", mistake: "adds the two functions instead of composing them"}
      - {text: "6", mistake: "applies only the inner function and forgets the outer one"}
    explanation: "g(3) = 6, and then f(6) = 7, so (f o g)(3) = 7."
    hints:
      - "Start with the inner function and evaluate it at 3."
      - "Feed that result into the outer function."
      - "Check the order: the function written on the right acts first."
    diagram: null
    confidence: high

