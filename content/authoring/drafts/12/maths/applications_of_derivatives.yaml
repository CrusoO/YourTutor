  - topic: "increasing_decreasing"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "For f(x) = x^3 - 6x^2 + 9x, find the length of the interval on which f is decreasing."
    correct: "2"
    unit: ""
    wrong: []
    explanation: "f'(x) = 3(x - 1)(x - 3), which is negative between 1 and 3, so f decreases on an interval of length 2."
    hints:
      - "Find f' and factor it."
      - "Determine the sign of f' between its two roots."
      - "Measure the distance between the two endpoints of that interval."
    diagram: "Cubic curve with two turning points marked on the horizontal axis, and the stretch between them shaded to show where the curve falls."
    confidence: high

  - topic: "increasing_decreasing"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "For f(x) = x + 1/x with x greater than 0, on which set is f increasing?"
    correct: "(1, infinity) only"
    unit: ""
    wrong:
      - {text: "(0, 1) only", mistake: "reverses the sign of the derivative"}
      - {text: "(0, infinity)", mistake: "assumes a sum of positive terms is always increasing"}
      - {text: "(-1, 1)", mistake: "ignores the condition that x must be positive"}
    explanation: "The derivative 1 - 1/x^2 is positive only when x is greater than 1, so f is increasing on (1, infinity)."
    hints:
      - "Differentiate f and write the derivative as a single fraction."
      - "Find when the numerator and denominator have the same sign."
      - "Check a test value on each side of the critical point."
    diagram: null
    confidence: high

  - topic: "increasing_decreasing"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "For f(x) = e^x - e x on the real numbers, which describes the behaviour of f?"
    correct: "Decreasing on (-infinity, 1) and increasing on (1, infinity)"
    unit: ""
    wrong:
      - {text: "Increasing everywhere", mistake: "takes the growth of e^x to dominate for all x"}
      - {text: "Decreasing on (1, infinity)", mistake: "reverses the sign analysis of the derivative"}
      - {text: "Increasing on (-infinity, 1)", mistake: "reads the sign of the derivative backwards for x below the critical point"}
    explanation: "The derivative e^x - e is negative for x less than 1 and positive for x greater than 1, so f decreases first and then increases."
    hints:
      - "Find the derivative and the single point where it vanishes."
      - "Test the sign of the derivative on each side of that point."
      - "Relate the sign of the derivative to whether the function rises or falls."
    diagram: "Curve of e^x minus e times x drawn on axes, with its lowest point marked at x = 1 and the curve falling on the left of it and rising on the right."
    confidence: high

