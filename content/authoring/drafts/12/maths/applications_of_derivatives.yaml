      - {text: "50", mistake: "adds the two numbers instead of multiplying them"}
      - {text: "100", mistake: "squares the sum instead of finding the product"}
    explanation: "Write the numbers as x and 10 minus x, so the product is x(10 - x). This is largest at x = 5, giving 25."
    hints:
      - "Write one number as x and express the other in terms of x."
      - "Form the product as a function of x."
      - "Find the maximum of that function using the derivative."
    diagram: null
    confidence: high

  - topic: "maxima_minima"
    type: "numeric"
    difficulty: "hard"
    role: "transfer"
    stem: "Find the minimum value of f(x) = x + 4/x for x greater than 0."
    correct: "4"
    unit: ""
    wrong: []
    explanation: "f'(x) = 1 - 4/x^2 vanishes at x = 2, where f(2) = 2 + 2 = 4, and f is decreasing before and increasing after this point, so 4 is the minimum."
    hints:
      - "Differentiate the function and set the derivative equal to zero."
      - "Solve for x, keeping in mind that x must be positive."
      - "Evaluate the function at that point."
    diagram: "Graph of x plus 4 over x for positive x, a curve with a single lowest point marked and two branches approaching the axes."
    confidence: high

  - topic: "maxima_minima"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "What is the maximum value of f(x) = sin x + cos x on the closed interval from 0 to pi/2, and where is it attained?"
    correct: "square root of 2, attained at x = pi/4"
    unit: ""
    wrong:
      - {text: "1, attained at x = 0", mistake: "takes an endpoint value as the maximum without checking the interior"}
      - {text: "2, attained at x = pi/4", mistake: "adds the amplitudes of the two terms incorrectly"}
      - {text: "square root of 2, attained at x = pi/2", mistake: "confuses the location of the maximum with an endpoint"}
    explanation: "The derivative cos x - sin x vanishes at x = pi/4, where f equals square root of 2. The endpoint values are 1, so the interior point gives the maximum."
    hints:
      - "Differentiate and find the critical point inside the interval."
      - "Compare the value at that point with the values at the endpoints."
      - "Consider the identity that writes the sum as a single sine."
    diagram: null
    confidence: high

