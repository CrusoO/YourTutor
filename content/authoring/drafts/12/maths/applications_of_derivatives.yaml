  - topic: "maxima_minima"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "Find the maximum value of f(x) = x^3 - 3x^2 + 1 on the closed interval from 0 to 3."
    correct: "1"
    unit: ""
    wrong: []
    explanation: "f'(x) = 3x(x - 2) gives the critical point x = 2 in the interval, with f(2) = -3, while f(0) = 1 and f(3) = 1, so the maximum is 1."
    hints:
      - "Find the critical points that lie inside the interval."
      - "Compare the values at those points with the values at both endpoints."
      - "Substitute each candidate into the function."
    diagram: "Cubic curve drawn over the interval from 0 to 3, with a turning point inside the interval marked and both endpoints labelled."
    confidence: high

  - topic: "maxima_minima"
