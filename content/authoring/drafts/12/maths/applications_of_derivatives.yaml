items:
  - topic: "rate_of_change"
    type: "numeric"
    difficulty: "easy"
    role: "procedure"
    stem: "The volume of a cube is V = s^3, where s is the side length. When s = 2 and ds/dt = 1, find dV/dt."
    correct: "12"
    unit: ""
    wrong: []
    explanation: "dV/dt = 3s^2 times ds/dt, which at s = 2 with ds/dt = 1 equals 3 times 4, giving 12."
    hints:
      - "Differentiate the volume with respect to time using the chain rule."
      - "Substitute the side length and the given rate of change of the side."
      - "Multiply the results carefully at the end."
    diagram: "A cube whose side s is labelled and whose edges have arrows showing that the side is growing at a steady rate."
    confidence: high

  - topic: "rate_of_change"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What is the equation of the tangent to y = x^2 at the point where x = 1?"
    correct: "y = 2x - 1"
    unit: ""
    wrong:
      - {text: "y = x - 1", mistake: "uses the function value as the slope"}
      - {text: "y = 2x + 1", mistake: "makes a sign error in the point-slope form"}
      - {text: "y = x + 1", mistake: "takes the slope to be 1 without differentiating"}
    explanation: "At x = 1 the point is (1, 1) and the slope is the derivative 2x, which equals 2, so the tangent is y - 1 = 2(x - 1), which is y = 2x - 1."
    hints:
      - "Find the point of tangency first by evaluating the function."
      - "The slope of the tangent is the derivative at that point."
      - "Use the point-slope form with the point and the slope."
    diagram: null
    confidence: high

  - topic: "rate_of_change"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "The area of a circle is A = pi r^2. When the radius is 3 units and is increasing at 2 units per second, find dA/dt, rounded to 3 significant figures."
    correct: "37.7"
    unit: ""
    wrong: []
    explanation: "dA/dt = 2 pi r dr/dt, which at r = 3 and dr/dt = 2 is 12 pi, about 37.7."
    hints:
      - "Differentiate the area with respect to time using the chain rule."
      - "Substitute the radius and the rate at which the radius grows."
      - "Keep pi exact until the final step, then round."
    diagram: "A circle with radius r marked, and an arrow on the radius showing it lengthening over time."
    confidence: high

  - topic: "rate_of_change"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "What is the equation of the normal to the curve y = x^3 at the point (1, 1)?"
    correct: "3y + x = 4"
    unit: ""
    wrong:
      - {text: "y = 3x - 2", mistake: "uses the tangent slope instead of the normal slope"}
      - {text: "y = -3x + 4", mistake: "takes the negative of the slope instead of the negative reciprocal"}
      - {text: "y = x/3 + 2/3", mistake: "takes the reciprocal of the slope without changing its sign"}
    explanation: "The tangent slope at (1, 1) is 3, so the normal slope is minus one third, and the line through (1, 1) with that slope is 3y + x = 4."
    hints:
      - "Find the slope of the tangent at the point first."
      - "A normal line is perpendicular to the tangent at the point of contact."
      - "Write the line through the point using the perpendicular slope."
    diagram: null
    confidence: high

  - topic: "rate_of_change"
    type: "numeric"
    difficulty: "hard"
    role: "transfer"
    stem: "A ladder of length 5 m leans against a vertical wall. Its foot slides away from the wall at 2 m/s. When the foot is 3 m from the wall, find the rate of change of the height of the top of the ladder in m/s."
    correct: "-1.5"
    unit: ""
    wrong: []
    explanation: "With x^2 + y^2 = 25, dy/dt = minus (x/y) dx/dt. At x = 3 and y = 4 with dx/dt = 2, this gives minus 1.5, so the top slides down at 1.5 m/s."
    hints:
      - "Write the relation between the foot distance, the height and the ladder length."
      - "Differentiate that relation with respect to time."
      - "Substitute the height from the relation and then the given rates."
    diagram: "A ladder leaning against a vertical wall, with its foot on the ground moving away from the wall and its top sliding down the wall, the three lengths labelled."
    confidence: high

  - topic: "rate_of_change"
    type: "numeric"
    difficulty: "hard"
    role: "transfer"
    stem: "A sphere has radius increasing at 0.5 cm per second. When the radius is 2 cm, find the rate of change of its surface area in square cm per second, rounded to 1 decimal place."
    correct: "25.1"
    unit: ""
    wrong: []
    explanation: "The surface area is 4 pi r^2, so dS/dt = 8 pi r dr/dt. At r = 2 and dr/dt = 0.5 this equals 8 pi, about 25.1."
    hints:
      - "Differentiate the surface area formula with respect to time."
      - "Substitute the radius and the given rate before multiplying."
      - "Keep pi exact until the last step."
    diagram: null
    confidence: high

  - topic: "increasing_decreasing"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "For f(x) = x^3 - 3x, on which set is f increasing?"
    correct: "(-infinity, -1) and (1, infinity)"
    unit: ""
    wrong:
      - {text: "(-1, 1) only", mistake: "uses the interval where the derivative is negative"}
      - {text: "(-infinity, 0) only", mistake: "assumes the sign change happens at zero"}
      - {text: "(0, infinity) only", mistake: "ignores the negative branch of the derivative"}
    explanation: "The derivative 3x^2 - 3 is positive when the absolute value of x exceeds 1, so f increases on those two outer intervals."
    hints:
      - "Find the derivative of f."
      - "Solve where the derivative is positive."
      - "Remember that a positive derivative means the function is increasing."
    diagram: "Cubic curve y = x^3 - 3x drawn on axes, with its local maximum and local minimum marked at x = -1 and x = 1."
    confidence: high

