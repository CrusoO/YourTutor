  - topic: "maxima_minima"
    type: "numeric"
    difficulty: "easy"
    role: "procedure"
    stem: "Find the minimum value of f(x) = x^2 - 6x + 10 on the real numbers."
    correct: "1"
    unit: ""
    wrong: []
    explanation: "The derivative 2x - 6 vanishes at x = 3, where f(3) = 9 - 18 + 10 = 1, and the second derivative is positive, so this is the minimum."
    hints:
      - "Differentiate and find the stationary point."
      - "Check the sign of the second derivative at that point."
      - "Substitute the stationary point back into the function."
    diagram: "Upward opening parabola drawn on axes, with its lowest point marked and labelled as the minimum."
    confidence: high

  - topic: "maxima_minima"
