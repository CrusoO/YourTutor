    stem: "A vector of magnitude 6 makes equal angles with the three coordinate axes. What is each of its components?"
    correct: "2 times the square root of 3"
    unit: ""
    wrong:
      - {text: "2", mistake: "divides the magnitude by 3 instead of by the square root of 3"}
      - {text: "6", mistake: "uses the magnitude itself as each component"}
      - {text: "3", mistake: "divides the magnitude by 2 instead of by the square root of 3"}
    explanation: "Equal angles give equal components, and the sum of the squares of the three components equals 36, so each component is 6 over the square root of 3, which equals 2 times the square root of 3."
    hints:
      - "Equal angles with the axes give equal components."
      - "The sum of the squares of the components equals the squared magnitude."
      - "Solve for one component."
