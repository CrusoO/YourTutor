  - topic: "vector_basics"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "A vector has components (1, square root of 3). Find the angle it makes with the positive x-axis, in degrees."
    correct: "60"
    unit: "degrees"
    wrong: []
    explanation: "The tangent of the angle equals the ratio of the components, square root of 3 over 1, so the angle is 60 degrees."
    hints:
      - "Use the tangent of the angle as the ratio of the vertical component to the horizontal component."
      - "Recall the angle whose tangent equals the square root of 3."
      - "Give the answer in degrees."
