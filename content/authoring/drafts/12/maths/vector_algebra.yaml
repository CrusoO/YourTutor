  - topic: "vector_basics"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "A point P divides the segment from A = (1, 2, 3) to B = (4, 5, 6) internally in the ratio 2:1, with P closer to B. What are the coordinates of P?"
    correct: "(3, 4, 5)"
    unit: ""
    wrong:
      - {text: "(2, 3, 4)", mistake: "swaps the weights of the two endpoints"}
      - {text: "(2.5, 3.5, 4.5)", mistake: "takes the midpoint instead of the weighted point"}
      - {text: "(4, 5, 6)", mistake: "returns the endpoint B instead of the division point"}
    explanation: "For internal division in the ratio m:n, the position vector is (nA + mB)/(m + n). With m = 2 and n = 1 this gives (A + 2B)/3, which is (3, 4, 5)."
    hints:
      - "Write the section formula for internal division in the ratio m:n."
      - "Identify which endpoint gets which weight."
      - "Divide the weighted sum by the total of the ratio parts."
    diagram: null
    confidence: high

