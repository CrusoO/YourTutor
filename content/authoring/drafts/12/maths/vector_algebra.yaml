      - {text: "i + j", mistake: "treats the cross product as vector addition"}
      - {text: "0", mistake: "believes the cross product of perpendicular vectors vanishes"}
    explanation: "By the right-hand rule and the standard cyclic order i, j, k, the cross product i x j equals k."
    hints:
      - "Recall the cyclic order of the standard unit vectors."
      - "Apply the right-hand rule to the first two vectors."
      - "Remember that the cross product gives a vector perpendicular to both inputs."
