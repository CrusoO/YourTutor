  - topic: "angles_and_distances_3d"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Line L1 passes through the origin with direction (1, 0, 0), and line L2 passes through (0, 0, 1) with direction (0, 1, 0). What is the shortest distance between them?"
    correct: "1"
    unit: ""
    wrong:
      - {text: "0", mistake: "treats the two lines as intersecting"}
      - {text: "square root of 2", mistake: "adds the lengths of the two direction vectors"}
      - {text: "1/2", mistake: "divides by the squared length of the common perpendicular"}
    explanation: "The cross product of the directions is (0, 0, 1), and the vector joining the two points is (0, 0, 1). Their dot product divided by the length of (0, 0, 1) gives 1."
    hints:
      - "Find a vector perpendicular to both direction vectors."
      - "Project the vector joining a point on each line onto that common perpendicular."
      - "Divide by the length of the perpendicular vector."
    diagram: "Two skew lines in space, one along the x-direction through the origin and one along the y-direction at height one on the z-axis, with the shortest connecting segment marked."
    confidence: high
