  - topic: "order_and_degree"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What is the order of the differential equation d^2y/dx^2 + 3(dy/dx)^3 = 0?"
    correct: "2"
    unit: ""
    wrong:
      - {text: "3", mistake: "takes the power on the first derivative as the order"}
      - {text: "1", mistake: "reads only the first derivative"}
      - {text: "6", mistake: "adds the orders of the derivatives"}
    explanation: "The order is the order of the highest derivative present, which here is the second derivative d^2y/dx^2."
    hints:
      - "The order is the highest derivative that appears in the equation."
      - "Look for the derivative with the largest number of primes."
      - "Ignore the powers when you decide the order."
    diagram: null
    confidence: high

  - topic: "order_and_degree"
    type: "numeric"
    difficulty: "easy"
    role: "procedure"
    stem: "What is the degree of the differential equation (d^2y/dx^2)^3 + (dy/dx)^2 = x?"
    correct: "3"
    unit: ""
    wrong: []
    explanation: "The highest order derivative is d^2y/dx^2, and it appears raised to the power 3, so the degree is 3."
    hints:
      - "Identify the highest order derivative in the equation."
      - "Find the power to which that derivative is raised."
      - "Make sure the equation is a polynomial in the derivatives before reading the degree."
    diagram: null
