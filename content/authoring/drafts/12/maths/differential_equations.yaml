  - topic: "order_and_degree"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "What is the degree of d^2y/dx^2 = square root of (1 + (dy/dx)^2)?"
    correct: "2"
    unit: ""
    wrong:
      - {text: "1", mistake: "reads the square root as making the degree one"}
      - {text: "1/2", mistake: "takes the power of the root as the degree"}
      - {text: "The degree is not defined", mistake: "assumes the radical sign prevents any degree from being defined"}
    explanation: "Squaring both sides removes the radical and gives (d^2y/dx^2)^2 = 1 + (dy/dx)^2, where the highest order derivative appears to the power 2."
    hints:
      - "Rewrite the equation so that no radical sign remains."
      - "Look at the highest order derivative and the power it carries."
      - "Square both sides carefully before reading the degree."
    diagram: null
    confidence: high

