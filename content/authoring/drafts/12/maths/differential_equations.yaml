  - topic: "linear_de"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "Solve dy/dx + y/x = x with y(1) = 1. Find y(2), rounded to 3 decimal places."
    correct: "1.667"
    unit: ""
    wrong: []
    explanation: "The integrating factor is x, so d(xy)/dx = x^2 and xy = x^3/3 + C. With y(1) = 1, C = 2/3, so y(2) = (8/3 + 2/3)/2 = 5/3, about 1.667."
    hints:
      - "Find the integrating factor from the coefficient of y, which is 1 over x."
      - "Multiply through and write the left side as the derivative of a product."
      - "Integrate, then apply the initial condition before evaluating at x equal to 2."
    diagram: null
    confidence: high

  - topic: "linear_de"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "What is the general solution of dy/dx - y = e^x?"
    correct: "y = (x + C) e^x"
    unit: ""
    wrong:
      - {text: "y = e^x + C e^x", mistake: "integrates the right side without accounting for the integrating factor"}
      - {text: "y = x e^x", mistake: "drops the constant of integration"}
      - {text: "y = (x + C) e^(-x)", mistake: "uses the wrong sign in the integrating factor"}
    explanation: "The integrating factor is e^(-x), and multiplying through gives d(y e^(-x))/dx = 1, so y e^(-x) = x + C, which means y = (x + C) e^x."
    hints:
      - "Find the integrating factor from the coefficient of y."
      - "Multiply both sides and check that the left side is a derivative."
      - "Integrate and multiply back to solve for y."
    diagram: null
    confidence: high

  - topic: "linear_de"
    type: "numeric"
    difficulty: "hard"
    role: "transfer"
    stem: "Solve dy/dx + y tan x = sin x with y(0) = 0. Find y(pi/3), rounded to 3 decimal places."
    correct: "0.347"
    unit: ""
    wrong: []
    explanation: "The integrating factor is sec x, which gives y sec x = minus ln|cos x| + C. With y(0) = 0 we get C = 0, so y = minus cos x times ln(cos x), and at pi/3 this is (1/2) times 0.693, about 0.347."
    hints:
      - "The integrating factor is the secant of x."
      - "Multiply through and integrate the right side, which gives a logarithm."
      - "Use y(0) = 0 to fix the constant before evaluating at pi/3."
    diagram: null
    confidence: high

  - topic: "linear_de"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "What is the general solution of x dy/dx + 2y = x^3 for x not equal to 0?"
    correct: "y = x^3/5 + C/x^2"
    unit: ""
    wrong:
      - {text: "y = x^3/5 + C x^2", mistake: "uses the wrong sign in the integrating factor"}
      - {text: "y = x^2/5 + C/x^2", mistake: "lowers the power on the right side incorrectly"}
      - {text: "y = x^3/3 + C/x^2", mistake: "integrates x to the fourth with the wrong divisor"}
    explanation: "Dividing by x gives dy/dx + 2y/x = x^2, with integrating factor x^2. Then d(x^2 y)/dx = x^4, so x^2 y = x^5/5 + C, which gives y = x^3/5 + C/x^2."
    hints:
      - "Divide through by x to write the equation in standard linear form."
      - "Find the integrating factor from the coefficient of y."
      - "Multiply out, integrate and then divide by the integrating factor."
    diagram: null
    confidence: high
