      - {text: "Order 1, degree 1", mistake: "ignores the second derivative"}
      - {text: "Order 2, degree 2", mistake: "counts the second derivative twice"}
    explanation: "The highest derivative is of order 2. Because the first derivative appears inside a sine, the equation is not a polynomial in the derivatives, so the degree is not defined."
    hints:
      - "Find the highest order derivative that occurs in the equation."
      - "Ask whether the equation is a polynomial in the derivatives."
