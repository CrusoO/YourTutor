  - topic: "variable_separable"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What is the general solution of dy/dx = x?"
    correct: "y = x^2/2 + C"
    unit: ""
    wrong:
      - {text: "y = x + C", mistake: "integrates the right side as if it were a constant"}
      - {text: "y = x^2 + C", mistake: "forgets to divide by the new power"}
      - {text: "y = 2x^2 + C", mistake: "multiplies by the new power instead of dividing"}
    explanation: "Separating gives dy = x dx, and integrating both sides gives y = x^2/2 plus a constant."
    hints:
      - "Separate the y terms and the x terms on opposite sides."
      - "Integrate each side with respect to its own variable."
      - "Add the constant of integration once at the end."
    diagram: null
    confidence: high

  - topic: "variable_separable"
    type: "numeric"
    difficulty: "easy"
    role: "procedure"
    stem: "Solve dy/dx = 2y with y(0) = 1. Find y(1), rounded to 3 decimal places."
    correct: "7.389"
    unit: ""
    wrong: []
    explanation: "Separating gives dy/y = 2 dx, so y = C e^(2x). The condition y(0) = 1 gives C = 1, and y(1) = e squared, about 7.389."
    hints:
      - "Separate the variables and integrate both sides."
      - "Use the initial condition to find the constant."
      - "Solve for y and evaluate at x equal to 1."
    diagram: null
    confidence: high

  - topic: "variable_separable"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "Solve dy/dx = x y with y(0) = 2. Find y(2), rounded to 3 decimal places."
    correct: "14.778"
    unit: ""
    wrong: []
    explanation: "Separating gives dy/y = x dx, so y = 2 e^(x^2/2). At x = 2 this gives 2e^2, about 14.778."
    hints:
      - "Separate the variables with y on one side and x on the other."
      - "Integrate the function of x on the right side."
      - "Apply the initial condition, then evaluate at x equal to 2."
    diagram: null
    confidence: high

  - topic: "variable_separable"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "What is the general solution of dy/dx = 1 + y^2?"
    correct: "y = tan(x + C)"
    unit: ""
    wrong:
      - {text: "y = sec(x + C)", mistake: "confuses the antiderivative of one plus a square with a different trigonometric function"}
      - {text: "y = x + y^2 + C", mistake: "integrates both sides without separating the variables"}
      - {text: "y = arctan(x) + C", mistake: "inverts the relation between x and y"}
    explanation: "Separating gives dy/(1 + y^2) = dx, so arctan y = x + C, and taking the tangent of both sides gives y = tan(x + C)."
    hints:
      - "Separate the variables first."
      - "Recall the integral of one over one plus a square."
      - "Solve for y at the end using the inverse of that function."
    diagram: null
    confidence: high

  - topic: "variable_separable"
    type: "numeric"
    difficulty: "hard"
    role: "transfer"
    stem: "Solve y^2 dy/dx = x with y(0) = 1. Find y(2), rounded to 3 decimal places."
    correct: "1.913"
    unit: ""
    wrong: []
    explanation: "Separating gives y^2 dy = x dx, so y^3/3 = x^2/2 + C. From y(0) = 1, C = 1/3, and at x = 2 we get y^3 = 7, so y is the cube root of 7, about 1.913."
    hints:
      - "Separate and integrate both sides."
      - "Use the initial value to find the constant."
      - "Solve for y by taking the cube root."
    diagram: null
    confidence: high

  - topic: "variable_separable"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "What is the general solution of dy/dx = e^(x + y)?"
    correct: "e^(-y) + e^x = C"
    unit: ""
    wrong:
      - {text: "e^y + e^x = C", mistake: "flips the sign of the exponent in y while separating"}
      - {text: "e^(x + y) = C", mistake: "treats the separated form as if it were already integrated"}
      - {text: "y = ln x + C", mistake: "treats the exponential as a function of x alone"}
    explanation: "Writing e^(x + y) as e^x times e^y gives e^(-y) dy = e^x dx, and integrating both sides gives -e^(-y) = e^x + constant, which can be written as e^(-y) + e^x = C."
    hints:
      - "Write e^(x + y) as a product of two exponentials."
      - "Separate the terms involving y from those involving x."
      - "Integrate both sides and combine the constants."
    diagram: null
    confidence: high

  - topic: "homogeneous_de"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which substitution is used to solve a homogeneous differential equation of the form dy/dx = F(y/x)?"
    correct: "y = vx"
    unit: ""
    wrong:
      - {text: "y = v + x", mistake: "adds the variables where the substitution needs a product"}
      - {text: "v = x + y", mistake: "uses a sum instead of the ratio of the variables"}
      - {text: "y = x^2", mistake: "uses a power substitution that does not reduce the ratio"}
    explanation: "Putting y = vx turns the ratio y/x into the new variable v, which makes the equation separable in v and x."
    hints:
      - "Think about the ratio y over x appearing in the equation."
      - "Choose a substitution that makes that ratio a single new variable."
      - "Check that your choice leads to a separable equation."
    diagram: null
    confidence: high

  - topic: "homogeneous_de"
    type: "numeric"
    difficulty: "easy"
    role: "procedure"
    stem: "Solve dy/dx = y/x with y(1) = 2. Find y(3)."
    correct: "6"
    unit: ""
