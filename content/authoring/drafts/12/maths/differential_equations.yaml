    explanation: "Separating gives dy/y = dx/x, so y = Cx, and y(1) = 2 gives C = 2, so y(3) = 6."
    hints:
      - "Substitute y = vx and simplify the equation."
      - "Separate the resulting equation in v and x."
      - "Use the initial condition to fix the constant before evaluating."
    diagram: null
    confidence: high

  - topic: "homogeneous_de"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "Solve dy/dx = (x + y)/x with y(1) = 2. Find y(e), rounded to 3 decimal places."
    correct: "8.155"
    unit: ""
    wrong: []
    explanation: "With y = vx the equation becomes x dv/dx = 1, so v = ln x + C. From y(1) = 2 we get C = 2, so y = x(ln x + 2) and at x = e the value is 3e, about 8.155."
    hints:
      - "Put y = vx and differentiate using the product rule."
      - "Simplify until the terms in v cancel."
      - "Integrate in terms of v and apply the initial condition before evaluating."
    diagram: null
    confidence: high

  - topic: "homogeneous_de"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "Which of the following differential equations is homogeneous?"
    correct: "dy/dx = (x^2 + y^2)/(xy)"
    unit: ""
    wrong:
      - {text: "dy/dx = (x + 1)/y", mistake: "allows a constant term in a homogeneous equation"}
      - {text: "dy/dx = x^2 + y", mistake: "accepts terms of different degree in the same expression"}
      - {text: "dy/dx = sin x + y", mistake: "treats a trigonometric term as homogeneous"}
    explanation: "The numerator and the denominator are both of degree 2 in x and y, so the right side is a function of y/x and the equation is homogeneous."
    hints:
      - "Check the total degree of each term in the numerator and the denominator."
      - "A homogeneous expression scales by a fixed power when x and y are multiplied by the same constant."
      - "Constant terms and mixed degrees break this pattern."
    diagram: null
    confidence: high

  - topic: "homogeneous_de"
    type: "numeric"
    difficulty: "hard"
    role: "transfer"
    stem: "Solve dy/dx = (y^2 + xy)/x^2 with y(1) = 1/2. Find y(e), rounded to 3 decimal places."
    correct: "2.718"
    unit: ""
    wrong: []
    explanation: "With y = vx, x dv/dx = v^2, so -1/v = ln x + C. From v(1) = 1/2 we get C = -2, which gives v = 1/(2 - ln x), so y(e) = e, about 2.718."
    hints:
      - "Put y = vx and simplify the equation for v."
      - "Separate the equation in v and x and integrate."
      - "Apply the initial condition before evaluating at the requested point."
    diagram: null
    confidence: high

  - topic: "homogeneous_de"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "What is the general solution of dy/dx = y/x + tan(y/x)?"
    correct: "sin(y/x) = Cx"
    unit: ""
    wrong:
      - {text: "sin(y/x) = C/x", mistake: "inverts the dependence on x when integrating"}
      - {text: "cos(y/x) = Cx", mistake: "confuses sine and cosine in the separated form"}
      - {text: "y = Cx tan(y/x)", mistake: "skips the separation step and writes the solution directly"}
    explanation: "With y = vx, the equation becomes x dv/dx = tan v, so cot v dv = dx/x, which integrates to ln|sin v| = ln|x| + constant, giving sin(y/x) = Cx."
    hints:
      - "Substitute y = vx and cancel the common term."
      - "Separate v and x in the resulting equation."
      - "Integrate both sides and rewrite the logarithm as an exponential."
    diagram: null
    confidence: high

  - topic: "linear_de"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What is the integrating factor of dy/dx + y = x?"
    correct: "e^x"
    unit: ""
    wrong:
      - {text: "e^(-x)", mistake: "takes the negative of the coefficient of y"}
      - {text: "x", mistake: "uses the right-hand side as the integrating factor"}
      - {text: "1/x", mistake: "treats the coefficient of y as a function that divides x"}
    explanation: "The integrating factor is e raised to the integral of the coefficient of y, which is 1, so the factor is e^x."
    hints:
      - "Write the equation in the standard form dy/dx + P y = Q."
      - "The integrating factor is e to the power of the integral of P."
      - "Find the integral of the coefficient of y."
    diagram: null
    confidence: high

