  - topic: "area_under_curve"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "What is the area bounded by y = x^3, the x-axis and the line x = 2?"
    correct: "4"
    unit: ""
    wrong:
      - {text: "16", mistake: "forgets to divide by the new power when integrating"}
      - {text: "2", mistake: "evaluates the integrand at the upper limit only"}
      - {text: "8", mistake: "uses the height at x = 2 as the area"}
    explanation: "The integral of x cubed from 0 to 2 is x to the fourth over 4 evaluated from 0 to 2, which is 16/4 = 4."
    hints:
      - "Set up the integral with the correct lower and upper limits."
      - "Find an antiderivative of x cubed."
      - "Evaluate at the upper limit and subtract the value at the lower limit."
    diagram: "Cubic curve y = x^3 between x = 0 and x = 2 with the region under it and above the horizontal axis shaded."
    confidence: high

