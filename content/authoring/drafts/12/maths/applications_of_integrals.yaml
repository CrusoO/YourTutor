  - topic: "area_under_curve"
    type: "numeric"
    difficulty: "easy"
    role: "procedure"
    stem: "Find the area under the curve y = x^2 above the x-axis between x = 0 and x = 2, rounded to 3 decimal places."
    correct: "2.667"
    unit: ""
    wrong: []
    explanation: "The integral of x squared from 0 to 2 is 8/3, which is about 2.667."
    hints:
      - "Set up the integral of the function between the two given x values."
      - "Find an antiderivative of the function."
      - "Evaluate it at both ends and subtract."
    diagram: "Parabola y = x^2 drawn from x = 0 to x = 2, with the region between the curve and the horizontal axis shaded."
    confidence: high

  - topic: "area_under_curve"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What is the area of the region bounded by y = 4 - x^2 and the x-axis?"
    correct: "32/3"
    unit: ""
    wrong:
      - {text: "16/3", mistake: "counts only one half of the region"}
      - {text: "16", mistake: "integrates only the constant part of the function"}
      - {text: "4/3", mistake: "uses the wrong upper limit for the integral"}
    explanation: "The curve meets the axis at x = -2 and x = 2, and the region is symmetric, so the area is the integral of 4 - x^2 from -2 to 2, which is 32/3."
    hints:
      - "Find where the curve meets the x-axis to set the limits."
      - "Notice whether the region is symmetric about the vertical axis."
      - "Use twice the area on one side if that simplifies the work."
    diagram: "Downward opening parabola y = 4 - x^2 drawn on axes, with the region between the curve and the horizontal axis from minus 2 to 2 shaded."
    confidence: high

  - topic: "area_under_curve"
