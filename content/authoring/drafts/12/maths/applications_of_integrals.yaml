    type: "numeric"
    difficulty: "hard"
    role: "transfer"
    stem: "Find the area between the parabola y = x^2 and the line y = 3x - 2, rounded to 3 decimal places."
    correct: "0.167"
    unit: ""
    wrong: []
    explanation: "The curves meet at x = 1 and x = 2, and the line is above the parabola between them. The area is the integral of (3x - 2 - x^2) from 1 to 2, which is 1/6, about 0.167."
    hints:
      - "Find the intersection points of the two curves."
      - "Determine which function is larger between them."
      - "Integrate the larger function minus the smaller one over that interval."
    diagram: "Parabola y = x squared and straight line y = 3x - 2 crossing at two points, with the region between them shaded."
    confidence: high

  - topic: "area_between_curves"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "What is the total area enclosed between the cubic y = x^3 and the line y = x?"
    correct: "1/2"
    unit: ""
    wrong:
      - {text: "1/4", mistake: "counts only the region on the positive side of the axis"}
      - {text: "0", mistake: "cancels the two symmetric regions against each other"}
      - {text: "1", mistake: "doubles the area without subtracting the curves correctly"}
    explanation: "The curves meet at x = -1, 0 and 1. On [0, 1] the line is above the cubic, and by symmetry the region on [-1, 0] has the same area, so the total is 2 times the integral of (x - x^3) from 0 to 1, which is 1/2."
    hints:
      - "Find all points where the two curves meet."
      - "Split the region into parts where each curve lies on top."
      - "Use the symmetry of the picture about the origin to simplify the work."
    diagram: "Cubic y = x cubed and straight line y = x meeting at x = minus 1, 0 and 1, with the two enclosed regions shaded."
    confidence: high
