  - topic: "area_under_curve"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "What is the area bounded by y = 1/x, the x-axis, and the lines x = 1 and x = e?"
    correct: "1"
    unit: ""
    wrong:
      - {text: "e", mistake: "integrates the function without using a logarithm"}
      - {text: "e - 1", mistake: "subtracts the limits directly from the function values"}
      - {text: "ln 2", mistake: "uses the wrong upper limit in the logarithm"}
    explanation: "The integral of 1/x from 1 to e is ln e minus ln 1, which is 1 minus 0, giving 1."
    hints:
      - "Set up a definite integral of the reciprocal function over the given limits."
      - "Recall the antiderivative of the reciprocal function."
      - "Evaluate the logarithm at the two x values."
    diagram: "Hyperbola y = 1/x between x = 1 and x = e, with the region between the curve and the horizontal axis shaded."
    confidence: high

  - topic: "area_between_curves"
    type: "numeric"
    difficulty: "easy"
    role: "procedure"
    stem: "Find the area between the curves y = x and y = x^2 for x from 0 to 1, rounded to 3 decimal places."
    correct: "0.167"
    unit: ""
    wrong: []
    explanation: "On [0, 1] the line lies above the parabola, so the area is the integral of x minus x^2, which is 1/2 minus 1/3, equal to 1/6, about 0.167."
    hints:
      - "Decide which curve is higher on the interval."
      - "Subtract the lower function from the upper one."
      - "Integrate that difference between the two limits."
    diagram: "Straight line y = x and parabola y = x squared on the interval from 0 to 1, with the region between them shaded."
    confidence: high

  - topic: "area_between_curves"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which integral gives the area between y = 4 - x^2 and y = x + 2?"
    correct: "The integral from -2 to 1 of (2 - x - x^2)"
    unit: ""
    wrong:
      - {text: "The integral from -1 to 2 of (2 - x - x^2)", mistake: "uses the wrong intersection points"}
      - {text: "The integral from -2 to 1 of (x^2 + x - 2)", mistake: "subtracts the curves in the wrong order"}
      - {text: "The integral from -2 to 2 of (4 - x^2)", mistake: "ignores the straight line completely"}
    explanation: "The curves meet where x^2 + x - 2 = 0, so x = -2 and x = 1. On that interval the parabola is above the line, so the integrand is (4 - x^2) minus (x + 2), which is 2 - x - x^2."
    hints:
      - "Find where the two curves intersect by solving for x."
      - "Decide which curve is higher between those intersection points."
      - "Write the integral of upper minus lower."
    diagram: "Parabola y = 4 - x^2 and straight line y = x + 2 crossing at two points, with the region between them shaded."
    confidence: high

  - topic: "area_between_curves"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "Find the area between the curves y = 2x and y = x^2, rounded to 3 decimal places."
    correct: "1.333"
    unit: ""
    wrong: []
    explanation: "The curves meet at x = 0 and x = 2, and between them y = 2x is above y = x^2, so the area is the integral of 2x - x^2 from 0 to 2, which is 4 - 8/3 = 4/3."
    hints:
      - "Find the points where the two curves intersect."
      - "Determine which curve lies on top between the intersection points."
      - "Integrate the top curve minus the bottom curve."
    diagram: "Parabola y = x squared and straight line y = 2x meeting at the origin and at x = 2, with the enclosed region shaded."
    confidence: high

  - topic: "area_between_curves"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "Which integral with respect to y gives the area between x = y^2 and x = y + 2?"
    correct: "The integral from -1 to 2 of (y + 2 - y^2)"
    unit: ""
    wrong:
      - {text: "The integral from -1 to 2 of (y^2 - y - 2)", mistake: "reverses which curve is on the right"}
      - {text: "The integral from 0 to 2 of (y + 2 - y^2)", mistake: "uses zero instead of the intersection point"}
      - {text: "The integral from -2 to 1 of (y + 2 - y^2)", mistake: "solves the intersection equation with a sign error"}
    explanation: "The curves meet where y^2 = y + 2, so y = -1 and y = 2. Between these values the line x = y + 2 lies to the right, so the area is the integral of (y + 2 - y^2) from -1 to 2."
    hints:
      - "Find where the two curves intersect by solving for y."
      - "Decide which curve is further to the right between those values."
      - "Integrate the right curve minus the left curve with respect to y."
    diagram: "Parabola x = y squared opening to the right and straight line x = y + 2 crossing it at two points, with the enclosed region shaded."
    confidence: high

