    stem: "Which statement about three events A, B and C is correct?"
    correct: "Pairwise independence does not guarantee that P(A and B and C) equals P(A) P(B) P(C)"
    unit: ""
    wrong:
      - {text: "Pairwise independence always implies the triple product rule", mistake: "assumes that checking pairs is enough for three events"}
