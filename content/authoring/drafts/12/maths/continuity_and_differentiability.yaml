  - topic: "chain_rule_implicit"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "For y = x^x with x greater than 0, which expression gives dy/dx?"
    correct: "x^x times (1 + ln x)"
    unit: ""
    wrong:
      - {text: "x^x times ln x", mistake: "differentiates as if the exponent were a constant"}
      - {text: "x times x^(x - 1)", mistake: "applies the power rule and treats the exponent as constant"}
      - {text: "x^x times (ln x)^2", mistake: "squares the logarithm term instead of adding one"}
    explanation: "Taking logarithms gives ln y = x ln x, and differentiating implicitly gives dy/dx equal to y times (ln x + 1), which is x^x times (1 + ln x)."
    hints:
      - "Take the natural logarithm of both sides first."
      - "Differentiate the logarithm of y using the product rule."
      - "Solve for dy/dx and substitute y back in terms of x."
    diagram: null
    confidence: high

