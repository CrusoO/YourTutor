  - topic: "continuity_check"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Let f(x) = x|x|. Which statement about f at x = 0 is correct?"
    correct: "Differentiable at 0 with derivative 0"
    unit: ""
    wrong:
      - {text: "Continuous but not differentiable at 0", mistake: "assumes any corner-like shape fails differentiability"}
      - {text: "Not continuous at 0", mistake: "treats the change of sign as a jump"}
      - {text: "Differentiable at 0 with derivative 1", mistake: "uses the slope of one branch only"}
    explanation: "For h not equal to 0 the difference quotient (f(h) minus f(0)) divided by h equals |h|, which tends to 0, so the derivative at 0 exists and equals 0."
    hints:
      - "Write f separately for positive and negative values of x."
      - "Compute the limit of the difference quotient at 0 from both sides."
      - "Check whether the two one-sided limits agree."
    diagram: null
    confidence: high

  - topic: "differentiability"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Which statement about continuity and differentiability is correct?"
    correct: "Every differentiable function is continuous, but a continuous function need not be differentiable"
    unit: ""
    wrong:
      - {text: "Every continuous function is differentiable", mistake: "assumes continuity already implies smoothness"}
      - {text: "A differentiable function can have a jump", mistake: "thinks a derivative can exist across a break"}
      - {text: "Continuity and differentiability are unrelated", mistake: "treats the two properties as independent"}
    explanation: "Differentiability forces continuity, but the converse fails, as the graph of the absolute value at zero shows."
    hints:
      - "Consider whether a derivative can exist at a point where the function is broken."
      - "Think about the graph of the absolute value at zero."
      - "Decide which property is the stronger requirement."
    diagram: null
    confidence: high

  - topic: "differentiability"
    type: "numeric"
    difficulty: "easy"
    role: "procedure"
    stem: "Let f(x) = x^2 for x at most 1, and f(x) = 2x + c for x greater than 1. Find c so that f is continuous at x = 1."
    correct: "-1"
    unit: ""
    wrong: []
    explanation: "At x equal to 1 the first rule gives 1 and the second gives 2 plus c, so continuity requires 1 equal to 2 plus c, giving c equal to minus 1."
    hints:
      - "Compare the two formulas at the point where they meet."
      - "Set the value from the left equal to the value from the right at x equal to 1."
      - "Solve the resulting equation for the constant."
    diagram: null
    confidence: high

