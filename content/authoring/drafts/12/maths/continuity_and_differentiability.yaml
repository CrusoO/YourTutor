items:
  - topic: "continuity_check"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Let f(x) = x^2 for x not equal to 2, and f(2) = 5. Is f continuous at x = 2?"
    correct: "No, because the limit at 2 is 4 but f(2) is 5"
    unit: ""
    wrong:
      - {text: "Yes, because the rule is a polynomial", mistake: "assumes a piecewise definition keeps polynomial continuity"}
      - {text: "Yes, because f(2) has a value", mistake: "confuses having a value with equalling the limit"}
      - {text: "No, because f is not defined at 2", mistake: "reads the given value at 2 as missing"}
    explanation: "The limit of x squared as x approaches 2 is 4, but f(2) is defined as 5, so the two values differ and f is not continuous at 2."
    hints:
      - "Compute the limit of the rule for x near 2 but not equal to 2."
      - "Compare that limit with the value the function is given at 2."
      - "Continuity needs the limit and the value to agree."
    diagram: null
    confidence: high

