  - topic: "continuity_check"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "Let f(x) = |x|. Which statement about f is correct?"
    correct: "Continuous at 0 but not differentiable at 0"
    unit: ""
    wrong:
      - {text: "Differentiable everywhere", mistake: "assumes the absolute value is smooth at every point"}
      - {text: "Not continuous at 0", mistake: "reads the corner at zero as a break in the graph"}
      - {text: "Differentiable at 0 with derivative 0", mistake: "averages the two one-sided slopes"}
    explanation: "The left and right limits of |x| at 0 both equal 0, so f is continuous there. The one-sided slopes are minus 1 and 1, which differ, so f has no derivative at 0."
    hints:
      - "Check the one-sided limits of f at 0 first."
      - "Compare the left and right slopes of the graph at x equal to zero."
      - "Ask whether the graph has a corner or a break at that point."
    diagram: null
    confidence: high

