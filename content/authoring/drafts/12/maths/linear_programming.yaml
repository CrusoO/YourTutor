    confidence: high

  - topic: "graphical_solution_lpp"
    type: "numeric"
    difficulty: "easy"
    role: "procedure"
    stem: "Maximise Z = x + y subject to x <= 4, y <= 3 and x, y >= 0. Find the maximum value of Z."
    correct: "7"
    unit: ""
    wrong: []
    explanation: "The feasible region is the rectangle with corners (0, 0), (4, 0), (4, 3) and (0, 3). Z equals 7 at (4, 3), which is the largest of the corner values."
    hints:
      - "Sketch the feasible region bounded by the constraints."
      - "List the corner points of the region."
      - "Evaluate the objective at each corner and compare."
    diagram: "Rectangle in the first quadrant with corners at (0, 0), (4, 0), (4, 3) and (0, 3) and its sides labelled by the constraints."
    confidence: high

  - topic: "graphical_solution_lpp"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "Over the region x >= 0, y >= 0, x + y <= 4, where is the maximum of Z = 2x + y attained?"
    correct: "At (4, 0), with value 8"
    unit: ""
    wrong:
      - {text: "At (0, 4), with value 4", mistake: "uses the coefficient of x where the coefficient of y should apply"}
      - {text: "At (2, 2), with value 6", mistake: "picks the midpoint of the boundary instead of a corner"}
      - {text: "At (0, 0), with value 0", mistake: "assumes the origin gives the maximum"}
    explanation: "The corners of the triangle are (0, 0), (4, 0) and (0, 4), with Z values 0, 8 and 4, so the maximum 8 is at (4, 0)."
    hints:
      - "Identify the corner points of the feasible region."
      - "Evaluate the objective at each corner point."
      - "Compare the values to find the largest one."
    diagram: "Triangle in the first quadrant bounded by the two axes and the line x + y = 4, with its three corners labelled."
    confidence: high

  - topic: "graphical_solution_lpp"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "Minimise Z = 2x + 3y subject to x + y >= 5, x >= 0 and y >= 0. Find the minimum value of Z."
    correct: "10"
    unit: ""
    wrong: []
    explanation: "The feasible region is unbounded, with corner points (5, 0) and (0, 5). Z is 10 at (5, 0) and 15 at (0, 5), so the minimum is 10."
    hints:
      - "Sketch the region above the line x + y = 5 in the first quadrant."
      - "The region is unbounded, so check the corner points where it meets the axes."
      - "Compare the objective values at those corner points."
    diagram: "First quadrant with the line x + y = 5 drawn, the feasible region above it shaded, and the points where the line meets the axes marked."
    confidence: high

  - topic: "graphical_solution_lpp"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "Maximise Z = 5x + 4y subject to 2x + y <= 8, x + 2y <= 8, x >= 0 and y >= 0. Where is the maximum attained?"
    correct: "24 at (8/3, 8/3)"
    unit: ""
    wrong:
      - {text: "20 at (4, 0)", mistake: "stops at the corner on the x-axis without checking the interior intersection"}
      - {text: "16 at (0, 4)", mistake: "ignores the coefficient of x"}
      - {text: "32 at (4, 4)", mistake: "uses a point that violates the constraints"}
    explanation: "The two constraint lines meet at (8/3, 8/3). Z there is 5 times 8/3 plus 4 times 8/3, which equals 24, and this exceeds the values 20 and 16 at the axis corners."
    hints:
      - "Find where the two constraint lines intersect."
      - "Include the intercepts on the axes as corner points too."
      - "Evaluate the objective at every corner point and compare."
    diagram: null
    confidence: high

  - topic: "graphical_solution_lpp"
    type: "numeric"
    difficulty: "hard"
    role: "transfer"
    stem: "Maximise Z = 3x + 2y subject to x + y <= 4, x + 3y <= 6, x >= 0 and y >= 0. Find the maximum value of Z."
    correct: "12"
    unit: ""
    wrong: []
    explanation: "The corners are (0, 0), (4, 0), (3, 1) and (0, 2). Z equals 12 at (4, 0), 11 at (3, 1) and 4 at (0, 2), so the maximum is 12."
    hints:
      - "Find the intersection point of the two constraint lines."
      - "Check each candidate corner against all the constraints."
      - "Evaluate the objective only at the corners that are feasible."
    diagram: "Feasible quadrilateral in the first quadrant with corners at the origin, on the x-axis, at the intersection of the two constraint lines, and on the y-axis, all labelled."
    confidence: high

  - topic: "graphical_solution_lpp"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "For the region x >= 0, y >= 0 and x + y >= 3, what can be said about the maximum of Z = x + y?"
    correct: "The maximum does not exist because Z is unbounded"
    unit: ""
    wrong:
      - {text: "The maximum is 3 at (3, 0)", mistake: "reads a corner of the boundary line as the answer for a maximum"}
      - {text: "The maximum is 0 at the origin", mistake: "tests only the origin, which is outside the region"}
      - {text: "The maximum is 6 at (3, 3)", mistake: "picks an arbitrary feasible point as the optimum"}
    explanation: "Points with x + y arbitrarily large lie in the region, so Z has no upper bound and no maximum exists."
    hints:
      - "Check whether you can keep increasing x + y while staying in the region."
      - "Sketch the region and see whether it extends without bound."
      - "Consider the direction in which the objective increases."
    diagram: "Unbounded region in the first quadrant lying above the line x + y = 3, with arrows showing it extends outward."
    confidence: high
