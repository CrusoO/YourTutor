items:
  - topic: "lpp_formulation"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "A factory makes x chairs and y tables. Each chair gives a profit of 50 and each table a profit of 80. Which is the objective function?"
    correct: "Maximise Z = 50x + 80y"
    unit: ""
    wrong:
      - {text: "Minimise Z = 50x + 80y", mistake: "reverses the direction of optimisation"}
      - {text: "Maximise Z = 50x - 80y", mistake: "subtracts one of the profit terms"}
      - {text: "Maximise Z = x + y", mistake: "counts the number of items instead of the profit"}
    explanation: "The objective is the total profit, which is 50 per chair times x plus 80 per table times y, and the factory wants to maximise it."
    hints:
      - "The objective is the quantity to be optimised, here the total profit."
      - "Multiply the profit per item by the number of that item made."
      - "Check whether the problem asks for a maximum or a minimum."
    diagram: null
    confidence: high

  - topic: "lpp_formulation"
    type: "numeric"
    difficulty: "easy"
    role: "procedure"
    stem: "Each chair needs 2 hours of labour and each table needs 3 hours. How many hours of labour do 4 chairs and 2 tables need in total?"
    correct: "14"
    unit: "hours"
    wrong: []
    explanation: "The chairs need 2 times 4 = 8 hours and the tables need 3 times 2 = 6 hours, giving 14 hours in total."
    hints:
      - "Multiply the hours per chair by the number of chairs."
      - "Multiply the hours per table by the number of tables."
      - "Add the two amounts."
    diagram: null
    confidence: high

  - topic: "lpp_formulation"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "A diet must provide at least 10 units of protein. Food X gives 2 units of protein per kg and food Y gives 3 units per kg. If x kg of X and y kg of Y are used, which constraint is correct?"
    correct: "2x + 3y >= 10"
    unit: ""
    wrong:
      - {text: "2x + 3y <= 10", mistake: "reverses the inequality for a minimum requirement"}
      - {text: "2x + 3y = 10", mistake: "turns an at-least requirement into an exact amount"}
      - {text: "x + y >= 10", mistake: "uses the quantities of food as if each gave one unit of protein"}
    explanation: "The protein supplied is 2x + 3y, and since the diet needs at least 10 units, the constraint is 2x + 3y greater than or equal to 10."
    hints:
      - "Translate the phrase at least into the direction of the inequality."
      - "Write the protein from each food as its rate times its quantity."
      - "Add the two contributions to get the total protein."
    diagram: null
    confidence: high

  - topic: "lpp_formulation"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "In a blend, the mass of ingredient A must be at least 40 percent of the total mass of the blend. If x kg of A and y kg of B are used, which constraint is correct?"
    correct: "3x - 2y >= 0"
    unit: ""
    wrong:
      - {text: "3x + 2y >= 0", mistake: "drops the sign of the term in y"}
      - {text: "x <= 0.4(x + y)", mistake: "reverses the requirement on ingredient A"}
      - {text: "x - 0.4y >= 0", mistake: "takes the 40 percent only against the second ingredient"}
    explanation: "The requirement is x >= 0.4(x + y), which simplifies to 0.6x - 0.4y >= 0, and multiplying by 5 gives 3x - 2y >= 0."
    hints:
      - "Write the total mass as x plus y and state the 40 percent requirement for A."
      - "Move all terms to one side and collect the coefficients."
      - "Clear any decimals by multiplying the inequality by a suitable number."
    diagram: null
    confidence: high

  - topic: "lpp_formulation"
    type: "numeric"
    difficulty: "hard"
    role: "transfer"
    stem: "A bakery must make at least three times as many small loaves as large loaves. If x is the number of small loaves and y the number of large loaves, what constant c makes the constraint x >= c y?"
    correct: "3"
    unit: ""
    wrong: []
    explanation: "Making at least three times as many small loaves as large loaves means x is at least 3y, so c is 3."
    hints:
      - "Translate the phrase three times as many into a multiple of y."
      - "Decide which side of the inequality the multiple belongs on."
      - "Read off the constant that multiplies y."
    diagram: null
    confidence: high

  - topic: "lpp_formulation"
    type: "numeric"
    difficulty: "medium"
    role: "apply"
    stem: "Product P needs 4 kg of material per unit and product Q needs 6 kg per unit, with 120 kg available. How many kg of material do 10 units of P and 5 units of Q use in total?"
    correct: "70"
    unit: "kg"
    wrong: []
    explanation: "The material used is 4 times 10 plus 6 times 5, which is 40 plus 30, giving 70 kg."
    hints:
