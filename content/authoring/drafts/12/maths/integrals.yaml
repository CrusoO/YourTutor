    stem: "What is the partial fraction decomposition of 1 divided by (x - 1)(x + 2)?"
    correct: "(1/3)/(x - 1) - (1/3)/(x + 2)"
    unit: ""
    wrong:
      - {text: "1/(x - 1) + 1/(x + 2)", mistake: "splits the numerator equally without solving for the constants"}
