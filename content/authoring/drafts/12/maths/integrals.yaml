    role: "recall"
    stem: "What is the integral of x^2 with respect to x?"
    correct: "x^3/3 + C"
    unit: ""
    wrong:
      - {text: "x^3 + C", mistake: "forgets to divide by the new power"}
      - {text: "x^2/2 + C", mistake: "divides by the old power instead of the new one"}
      - {text: "3x^3 + C", mistake: "multiplies by the new power instead of dividing"}
    explanation: "The power rule raises the exponent by one and divides by the new exponent, so x squared becomes x cubed over 3, plus a constant."
    hints:
      - "Use the power rule for integration."
      - "Increase the exponent by one first."
      - "Divide by the new exponent and then add the constant of integration."
    diagram: null
    confidence: high

