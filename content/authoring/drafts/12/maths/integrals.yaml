      - {text: "(1/3)/(x + 1) - (1/3)/(x + 2)", mistake: "misplaces the root of the first factor"}
    explanation: "Writing 1/((x - 1)(x + 2)) as A/(x - 1) + B/(x + 2) and substituting x = 1 and x = -2 gives A = 1/3 and B = -1/3."
    hints:
      - "Write the expression as A over (x - 1) plus B over (x + 2)."
      - "Multiply through by the product of the denominators."
      - "Substitute the two roots of the denominator to find A and B."
