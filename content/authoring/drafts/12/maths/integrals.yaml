  - topic: "indefinite_integral_basics"
    type: "mcq"
    difficulty: "medium"
    role: "explain"
    stem: "What is the integral of 1/x with respect to x?"
    correct: "ln|x| + C"
    unit: ""
    wrong:
      - {text: "-1/x^2 + C", mistake: "applies the power rule to x to the power minus one"}
      - {text: "x ln x - x + C", mistake: "confuses the result with integration by parts"}
      - {text: "2 ln|x| + C", mistake: "doubles the logarithm"}
    explanation: "The antiderivative of 1/x is the natural logarithm of the absolute value of x, because the power rule does not apply at exponent minus one."
    hints:
      - "Think about which function has derivative 1 over x."
      - "Recall that the power rule fails for exponent minus one."
      - "Remember that the integrand is defined for negative values of x as well."
