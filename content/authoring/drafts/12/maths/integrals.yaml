  - topic: "integration_by_parts"
    type: "mcq"
    difficulty: "easy"
    role: "recall"
    stem: "What is the integral of x times e^x with respect to x?"
    correct: "(x - 1)e^x + C"
    unit: ""
    wrong:
      - {text: "x e^x + C", mistake: "treats the integral of the product as the product of the integrals"}
      - {text: "e^x + C", mistake: "drops the factor x"}
      - {text: "(x + 1)e^x + C", mistake: "makes a sign error when applying the formula"}
    explanation: "Take u = x and dv = e^x dx, so the integral is x e^x minus the integral of e^x, which is (x - 1) e^x plus a constant."
    hints:
      - "Choose the factor that becomes simpler when differentiated as u."
      - "Apply the parts formula with u and dv."
      - "Differentiate your answer to check it."
    diagram: null
    confidence: high

