    confidence: high

  - topic: "indefinite_integral_basics"
    type: "mcq"
    difficulty: "hard"
    role: "transfer"
    stem: "Find the indefinite integral of sin^2 x dx."
    correct: "x/2 - sin(2x)/4 + C"
    unit: ""
    wrong:
      - {text: "sin^3(x)/3 + C", mistake: "applies the power rule as if sin squared were the variable"}
      - {text: "x/2 + sin(2x)/4 + C", mistake: "gets the sign wrong in the double angle identity"}
      - {text: "-cos^2(x) + C", mistake: "integrates sine squared as the derivative of cosine squared"}
    explanation: "Using sin^2 x = (1 - cos 2x)/2, the integral is x/2 minus (sin 2x)/4, plus a constant."
    hints:
      - "Rewrite sin squared using a double angle identity."
      - "Integrate the resulting terms separately."
      - "Check your answer by differentiating it."
