      - {text: "-ln|sin x| + C", mistake: "flips the sign of the substitution"}
      - {text: "1/sin^2 x + C", mistake: "integrates the denominator as if it were a power"}
    explanation: "Let u = sin x, so du = cos x dx, and the integral becomes the integral of du over u, which is ln|u|."
    hints:
      - "Let u be the denominator."
      - "Compute du and match it with the numerator."
      - "Integrate the simple function of u that results."
