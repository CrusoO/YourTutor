items:
  - topic: basis_of_classification
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the main reason organisms are grouped together in classification?"
    correct: "They share fundamental features"
    unit: ""
    wrong:
      - {text: "They live in the same habitat", mistake: "classifies by where organisms live rather than by their structure"}
      - {text: "They are roughly the same size", mistake: "uses size as a main grouping feature"}
      - {text: "They eat the same food", mistake: "uses diet alone as the grouping basis"}
    explanation: "Classification groups organisms by shared features such as body design, cell structure and reproduction, which reflect how closely they are related. Habitat or size alone can mislead."
    hints:
      - "Think about what makes organisms similar at a deeper level than where they live."
      - "Consider which characteristics come from ancestry and body design."
      - "Eliminate options based on size or location alone."
    diagram: null
    confidence: high
  - topic: basis_of_classification
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which rank is the broadest group in the hierarchy of classification?"
    correct: "Kingdom"
    unit: ""
    wrong:
      - {text: "Species", mistake: "assumes the narrowest group is the broadest"}
      - {text: "Genus", mistake: "confuses the genus rank with the top-level group"}
      - {text: "Family", mistake: "treats a middle rank as the highest one"}
    explanation: "The ranks run from broad to narrow: kingdom, phylum, class, order, family, genus and species. A kingdom is the largest group."
    hints:
      - "Think about the top rank in the hierarchy."
      - "Recall the first step when ranks are listed from broad to narrow."
      - "Eliminate the most specific ranks."
    diagram: null
    confidence: high
  - topic: basis_of_classification
    type: mcq
    difficulty: medium
    role: explain
    stem: "Two plants look alike, but one makes its seeds in cones and the other makes seeds inside flowers. Why are they placed in different groups?"
    correct: "Their reproductive structures are fundamentally different, which reflects distinct lineages"
    unit: ""
    wrong:
      - {text: "They differ in colour, so colour decides the group", mistake: "treats a minor visible feature as decisive"}
      - {text: "They grow in different soils, so they belong to different kingdoms", mistake: "uses habitat as the main test"}
      - {text: "They have the same leaves, so they must be grouped together", mistake: "counts one shared outward feature as proof of relatedness"}
    explanation: "Reproductive structures are deep, inherited features that reflect ancestry, so differences there signal distinct lineages. Appearance and habitat can be misleading."
    hints:
      - "Think about which part of the plant produces the seed."
      - "Consider which features reflect shared ancestry rather than appearance."
      - "Eliminate options that rely on colour or habitat alone."
    diagram: null
    confidence: medium
  - topic: basis_of_classification
    type: mcq
    difficulty: medium
    role: apply
    stem: "A biologist wants to place an unknown organism into a broad group. Which set of features is most useful for this purpose?"
    correct: "Body organisation, cell type and mode of nutrition"
    unit: ""
    wrong:
      - {text: "Colour and approximate size", mistake: "uses easily seen but variable traits"}
      - {text: "Only the place where it was found", mistake: "relies on location alone"}
      - {text: "Its name in a local language", mistake: "confuses naming with classification"}
    explanation: "Broad groups rest on stable features such as cell type, body organisation and nutrition. Colour, size and location vary too much within a group to be reliable."
    hints:
      - "Think about features that are shared across many related species."
      - "Consider characteristics that go beyond outward appearance."
      - "Eliminate options based on visible but variable features."
    diagram: null
    confidence: high
  - topic: basis_of_classification
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Two organisms have similar wings, yet they differ strongly in internal skeleton and genetic code. What is the best approach for deciding how to classify them?"
    correct: "Wings alone are not enough, so compare many features before grouping"
    unit: ""
    wrong:
      - {text: "Wings are decisive, so they belong in one group", mistake: "uses one outward feature as proof of relatedness"}
      - {text: "Internal features are irrelevant once wings are seen", mistake: "ignores deeper evidence"}
      - {text: "They must go in different kingdoms because they differ at all", mistake: "treats any difference as a reason for different kingdoms"}
    explanation: "Similar wings can evolve independently, so a single outward feature is weak evidence. Classification compares many features, including internal structure and genetic information."
    hints:
      - "Think about whether one outward feature can prove shared ancestry."
      - "Consider what the internal features and genetic code add to the comparison."
      - "Eliminate options that rely on a single feature alone."
    diagram: null
    confidence: medium
  - topic: basis_of_classification
    type: mcq
    difficulty: hard
    role: apply
    stem: "A field guide offers a sequence of paired choices about leaves, flowers and seeds, each choice leading to the next. What is the main purpose of such a tool?"
    correct: "To identify an unknown organism by a series of choices"
    unit: ""
    wrong:
      - {text: "To measure the age of an organism", mistake: "confuses identification tools with dating methods"}
      - {text: "To produce new varieties through breeding", mistake: "assumes identification tools are breeding guides"}
      - {text: "To count how many individuals live in a field", mistake: "mixes identification with population counting"}
    explanation: "A dichotomous key offers paired choices about observable features and leads the user step by step to a name or group. It is a tool for identification."
    hints:
      - "Think about how a sequence of yes or no choices narrows down a match."
      - "Consider what a tool built from questions about visible parts is used for."
      - "Eliminate purposes unrelated to naming or sorting."
    diagram: null
    confidence: medium
  - topic: plant_groups
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which plant group has no true roots, stems or leaves and lives mostly in water?"
    correct: "Algae"
    unit: ""
    wrong:
      - {text: "Bryophytes", mistake: "thinks non-vascular land plants live in water"}
      - {text: "Pteridophytes", mistake: "assumes ferns lack true roots"}
      - {text: "Gymnosperms", mistake: "associates cones with having no roots"}
    explanation: "Algae are simple photosynthetic organisms without true roots, stems or leaves. Most live in water, from seaweeds to the green growth in ponds."
    hints:
      - "Think about the simplest plants that often live in water."
      - "Consider which group is often green in ponds and lacks true body parts."
      - "Eliminate groups that have true roots and vascular tissue."
    diagram: null
    confidence: high
  - topic: plant_groups
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which plant group produces naked seeds that are not enclosed in a fruit?"
    correct: "Gymnosperms"
    unit: ""
    wrong:
      - {text: "Angiosperms", mistake: "assumes all seed plants form fruits"}
      - {text: "Pteridophytes", mistake: "thinks ferns have naked seeds"}
      - {text: "Algae", mistake: "confuses simple water plants with seed plants"}
    explanation: "Gymnosperms bear naked seeds, usually on cones, with no fruit around them. Pines and cycads are common examples."
    hints:
      - "Think about seeds that sit exposed on the scales of cones."
      - "Consider the group where seeds have no fruit wall."
      - "Eliminate flowering plants, since they form fruits."
    diagram: null
    confidence: high
  - topic: plant_groups
    type: mcq
    difficulty: medium
    role: explain
    stem: "A moss-like plant needs a film of water so that its male cells can swim to the egg. What does this requirement show about its reproduction?"
    correct: "Fertilisation depends on external water"
    unit: ""
    wrong:
      - {text: "Spores are dispersed by animals", mistake: "confuses spore dispersal with animal-dependent seed dispersal"}
      - {text: "Seeds form inside a fruit", mistake: "assigns fruit formation to a group without seeds"}
      - {text: "The plant has a true vascular system for transport", mistake: "links water dependence with vascular tissue"}
    explanation: "Bryophytes have motile male gametes that swim through a film of water to reach the egg, so fertilisation depends on external water. They reproduce by spores rather than seeds."
    hints:
      - "Think about how the male cells move toward the female part."
      - "Consider whether this group produces seeds or spores."
      - "Eliminate options about fruits or vascular systems."
    diagram: null
    confidence: medium
  - topic: plant_groups
    type: mcq
    difficulty: medium
    role: recall
    stem: "Which plant group has true vascular tissue and reproduces by spores but does not form seeds?"
    correct: "Pteridophytes"
    unit: ""
    wrong:
      - {text: "Bryophytes", mistake: "thinks non-vascular plants also have xylem and phloem"}
      - {text: "Gymnosperms", mistake: "assumes seed plants reproduce by spores"}
      - {text: "Algae", mistake: "gives algae vascular tissue"}
    explanation: "Pteridophytes such as ferns have true vascular tissue and produce spores. They lack seeds and flowers."
    hints:
      - "Think about ferns and the tissues that conduct water."
      - "Consider which group has xylem and phloem but no seed stage."
      - "Eliminate groups with no conducting tissue."
    diagram: null
    confidence: high
  - topic: plant_groups
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A plant has roots, stems and leaves with vascular tissue, and it produces naked seeds on cones. Which plant group does it belong to?"
    correct: "Gymnosperms"
    unit: ""
    wrong:
      - {text: "Pteridophytes", mistake: "ignores the seed trait and places the plant with spore producers"}
      - {text: "Angiosperms", mistake: "assumes all seed plants have flowers"}
      - {text: "Bryophytes", mistake: "assigns a rooted plant with vascular tissue to the non-vascular group"}
    explanation: "Naked seeds on cones together with vascular tissue point to gymnosperms. Pteridophytes make spores rather than seeds, and angiosperms enclose their seeds in fruits."
    hints:
      - "Think about which group has naked seeds borne on cones."
      - "Consider how the seeds are exposed compared with seeds inside fruits."
      - "Eliminate groups whose members reproduce only by spores."
    diagram: null
    confidence: high
  - topic: plant_groups
    type: mcq
    difficulty: hard
    role: apply
    stem: "Which plant group contains the flowering plants, whose seeds develop inside a fruit?"
    correct: "Angiosperms"
    unit: ""
    wrong:
      - {text: "Gymnosperms", mistake: "assumes all seed plants produce fruit"}
      - {text: "Pteridophytes", mistake: "confuses fern spores with fruit"}
      - {text: "Algae", mistake: "adds flowers to simple aquatic organisms"}
    explanation: "Angiosperms are flowering plants whose ovules develop into seeds inside an ovary wall that becomes a fruit."
    hints:
      - "Think about the group whose seeds are protected by a fruit wall."
      - "Consider which group produces flowers."
      - "Eliminate groups that produce naked seeds or spores only."
    diagram: null
    confidence: high
  - topic: animal_groups
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which animal group has a segmented body with jointed legs covered by a hard exoskeleton?"
    correct: "Arthropods"
    unit: ""
    wrong:
      - {text: "Molluscs", mistake: "confuses soft bodies with jointed limbs"}
      - {text: "Annelids", mistake: "assumes segmentation alone means jointed legs"}
      - {text: "Echinoderms", mistake: "places spiny-skinned animals with insects"}
    explanation: "Arthropods have jointed appendages and a hard exoskeleton, often made of chitin. Insects, spiders and crabs all belong to this group."
    hints:
      - "Think about the group that includes insects and crabs."
      - "Consider which group has an external skeleton made of chitin."
      - "Eliminate groups with soft, unsegmented bodies."
    diagram: null
    confidence: high
  - topic: animal_groups
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which animal group has a soft body, often protected by a shell, and includes snails and octopuses?"
    correct: "Molluscs"
    unit: ""
    wrong:
      - {text: "Arthropods", mistake: "assumes shelled animals always have jointed legs"}
      - {text: "Porifera", mistake: "thinks sponges have the same kind of shell"}
      - {text: "Cnidarians", mistake: "assumes stinging animals have shells"}
    explanation: "Molluscs have a soft body, usually with a muscular foot and often a calcium carbonate shell. Octopuses and squids have a reduced or internal shell."
    hints:
      - "Think about the group whose name fits snails and octopuses."
      - "Consider which group has a muscular foot in many members."
      - "Eliminate groups that have jointed limbs or stinging cells."
    diagram: null
    confidence: high
  - topic: animal_groups
    type: mcq
    difficulty: medium
    role: explain
    stem: "An animal has many pores through its body wall, no true tissues and is often attached to a surface. Which group does it belong to?"
    correct: "Porifera"
    unit: ""
    wrong:
      - {text: "Cnidaria", mistake: "assumes all simple animals have stinging cells"}
      - {text: "Platyhelminthes", mistake: "treats flattened bodies as the defining feature"}
      - {text: "Nematoda", mistake: "confuses body pores with the body shape of roundworms"}
    explanation: "Porifera are sessile filter feeders with pores through the body wall. They lack true tissues and organs, which sets them apart from other animal groups."
    hints:
      - "Think about the group whose members are attached to surfaces and filter water."
      - "Consider which group has a body with many pores and no true tissue layers."
      - "Eliminate groups with stinging cells or flattened bodies."
    diagram: null
    confidence: high
  - topic: animal_groups
    type: mcq
    difficulty: medium
    role: apply
    stem: "A jellyfish captures prey with tentacles that fire stinging cells. Which animal group does it belong to?"
    correct: "Cnidarians"
    unit: ""
    wrong:
      - {text: "Echinoderms", mistake: "assumes spiny-looking animals have stinging cells"}
      - {text: "Annelids", mistake: "treats tentacles as segmented bodies"}
      - {text: "Molluscs", mistake: "assumes soft-bodied animals include jellyfish"}
    explanation: "Cnidarians have stinging cells called cnidocytes and show radial symmetry. Jellyfish, sea anemones and corals are members of this group."
    hints:
      - "Think about the group with stinging cells called cnidocytes."
      - "Consider the group with radial body symmetry and a single body opening."
      - "Eliminate groups with segmented bodies or spiny skin."
    diagram: null
    confidence: high
  - topic: animal_groups
    type: mcq
    difficulty: hard
    role: transfer
    stem: "An animal has a notochord at some stage of its life, a hollow nerve cord along its back, and gill slits. Which group does it belong to?"
    correct: "Chordates"
    unit: ""
    wrong:
      - {text: "Arthropods", mistake: "assumes a hard exoskeleton is the main defining feature"}
      - {text: "Echinoderms", mistake: "uses radial symmetry to place an animal with a backbone"}
      - {text: "Annelids", mistake: "treats segmented bodies as the key feature"}
    explanation: "Chordates possess a notochord, a dorsal hollow nerve cord and pharyngeal gill slits at some stage of life. Vertebrates form one subgroup of chordates."
    hints:
      - "Think about the group that includes vertebrates and some simpler animals."
      - "Consider the features that run along the back of the animal."
      - "Eliminate groups whose defining traits are exoskeletons or spiny skin."
    diagram: null
    confidence: high
  - topic: animal_groups
    type: mcq
    difficulty: hard
    role: apply
    stem: "A starfish and a sea urchin are compared. Which feature do adults of both animals share that sets them apart from worms and insects?"
    correct: "Five-part radial symmetry in adults"
    unit: ""
    wrong:
      - {text: "Segmented body rings", mistake: "applies a worm feature to spiny animals"}
      - {text: "Jointed legs", mistake: "confuses echinoderms with arthropods"}
      - {text: "Stinging tentacles", mistake: "assumes all radially symmetric animals sting"}
    explanation: "Echinoderms such as starfish and sea urchins show five-part radial symmetry as adults, although their larvae are bilaterally symmetric. They also have spiny skin."
    hints:
      - "Think about the body symmetry shown by both animals."
      - "Consider the skin texture that is typical of this group."
      - "Eliminate features linked to worms or insects."
    diagram: null
    confidence: medium
  - topic: binomial_nomenclature
    type: mcq
    difficulty: easy
    role: recall
    stem: "In the scientific name Panthera leo, which part is the genus?"
    correct: "Panthera"
    unit: ""
    wrong:
      - {text: "leo", mistake: "treats the species epithet as the genus"}
      - {text: "Panthera leo", mistake: "thinks the full name is the genus"}
      - {text: "Felidae", mistake: "uses the family name in place of the genus"}
    explanation: "In binomial nomenclature the first word is the genus, written with a capital letter. The second word is the species epithet, written in lower case."
    hints:
      - "The genus is the first part of the name."
      - "Look for the word that is capitalised."
      - "Eliminate options that are the family name or the whole name."
    diagram: null
    confidence: high
  - topic: binomial_nomenclature
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which language is traditionally used for the scientific names of organisms?"
    correct: "Latin"
    unit: ""
    wrong:
      - {text: "English", mistake: "assumes names follow the everyday language of the writer"}
      - {text: "Greek", mistake: "confuses the classical source of many terms with the naming language"}
      - {text: "Sanskrit", mistake: "assumes any classical language is used for naming"}
    explanation: "Scientific names are written in a Latinised form so that they are the same in every country. Many of the terms are Latin or Greek in origin."
    hints:
      - "Think about the language used for formal naming in old scholarly texts."
      - "Consider a classical language that many scientific terms come from."
      - "Eliminate modern everyday languages."
    diagram: null
    confidence: high
  - topic: binomial_nomenclature
    type: mcq
    difficulty: medium
    role: explain
    stem: "A student writes the scientific name as Homo Sapiens. Which correction makes the name follow the rules?"
    correct: "Homo sapiens, with the capital only on the genus"
    unit: ""
    wrong:
      - {text: "homo sapiens, with both words in lower case", mistake: "thinks the genus must be lower case"}
      - {text: "Homo Sapiens, with both words capitalised", mistake: "believes both words need capital letters"}
      - {text: "HOMO SAPIENS, written in capitals", mistake: "uses capitals for emphasis"}
    explanation: "The genus is capitalised and the species epithet is in lower case. Both words are italicised in print or underlined when handwritten."
    hints:
      - "Think about which word gets the capital letter."
      - "Consider how the second word should be written."
      - "Eliminate spellings where every letter has the same case."
    diagram: null
    confidence: high
  - topic: binomial_nomenclature
    type: mcq
    difficulty: medium
    role: apply
    stem: "Mangifera indica is the scientific name of the mango. Which part of this name identifies the particular species within the genus?"
    correct: "indica"
    unit: ""
    wrong:
      - {text: "Mangifera", mistake: "gives the genus name as if it were the species"}
      - {text: "Mangifera indica", mistake: "treats the whole name as a single part"}
      - {text: "mango", mistake: "uses the common name instead of the scientific part"}
    explanation: "In a binomial name the species epithet after the genus identifies the particular species. Here the genus is Mangifera and the epithet indica picks out the mango."
    hints:
      - "Look at the second word of the scientific name."
      - "Think about which part names the particular species."
      - "Eliminate the genus and the common name."
    diagram: null
    confidence: high
  - topic: binomial_nomenclature
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Two different species belong to the same genus and so share the first word of their names. What does this shared word tell you?"
    correct: "They are closely related and belong to the same genus"
    unit: ""
    wrong:
      - {text: "They are the same species with two names", mistake: "treats two names as synonyms for one species"}
      - {text: "They belong to different kingdoms", mistake: "assumes the name shows the kingdom"}
      - {text: "They live in the same habitat", mistake: "uses habitat as the shared meaning of the name"}
    explanation: "The first word is the genus, so organisms sharing it are placed in the same genus and are closely related. They remain different species because their second words differ."
    hints:
      - "Think about what the first word of a binomial name represents."
      - "Consider whether a shared genus means the organisms are the same species."
      - "Eliminate statements about habitats or kingdoms."
    diagram: null
    confidence: high
  - topic: binomial_nomenclature
    type: mcq
    difficulty: hard
    role: apply
    stem: "A scientist names a newly found frog that belongs to the genus Rana. Which written name follows the rules?"
    correct: "Genus word capitalised first, species word in lower case: Rana sylvestris"
    unit: ""
    wrong:
      - {text: "Both words in lower case: rana sylvestris", mistake: "gets the case wrong on both words"}
      - {text: "Species word written first, then the genus word: Sylvestris Rana", mistake: "reverses the genus and species order"}
      - {text: "Both words capitalised: Rana Sylvestris", mistake: "capitalises the species epithet"}
    explanation: "The genus comes first with a capital letter, followed by the lower-case species epithet. Rana sylvestris follows this format."
    hints:
      - "Check which word is written first and what case it uses."
      - "Consider how the second word should be written."
      - "Eliminate names where the order of the two words is reversed."
    diagram: null
    confidence: high
