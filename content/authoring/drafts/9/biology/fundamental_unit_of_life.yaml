items:
  - topic: cell_discovery
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which statement is part of the cell theory?"
    correct: "All cells arise from pre-existing cells"
    unit: ""
    wrong:
      - {text: "Cells can only be seen with the naked eye", mistake: "believes cells are always large and visible without magnification"}
      - {text: "Viruses are the smallest unit of all life", mistake: "confuses viruses with cells"}
      - {text: "Only plants are made of cells", mistake: "thinks animals and microbes are not built from cells"}
    explanation: "The cell theory has three parts: all living things are made of cells, the cell is the basic unit of structure and function, and new cells come only from existing cells."
    hints:
      - "Think about how a new cell comes into existence."
      - "Consider whether every cell can be seen without a magnifying tool."
      - "Recall which living things the theory covers."
    diagram: null
    confidence: high
  - topic: cell_discovery
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which scientist first described cells by looking at a thin slice of dead cork under a simple microscope?"
    correct: "Robert Hooke"
    unit: ""
    wrong:
      - {text: "Anton van Leeuwenhoek", mistake: "credits the later observer of living microbes with the first sighting of cork cells"}
      - {text: "Rudolf Virchow", mistake: "assigns the famous division principle to the first observer"}
      - {text: "Theodor Schwann", mistake: "confuses animal tissue studies with plant cork observations"}
    explanation: "Hooke examined a thin slice of cork and saw small empty compartments, which he named cells. These were dead plant walls, not living cells."
    hints:
      - "The observation used a simple microscope and a thin slice of plant material."
      - "Think about the earliest observer of cell walls rather than of living organisms."
      - "Eliminate scientists known mainly for later ideas about cell division or animal tissues."
    diagram: null
    confidence: high
  - topic: cell_discovery
    type: mcq
    difficulty: medium
    role: explain
    stem: "A student claims that a new cell can form spontaneously from non-living material in a sealed flask. Which part of the cell theory does this claim contradict?"
    correct: "All cells arise from pre-existing cells"
    unit: ""
    wrong:
      - {text: "The cell is the basic unit of structure and function", mistake: "assumes the claim is about structure rather than origin"}
      - {text: "All living things are made of cells", mistake: "thinks the claim is about which organisms are made of cells"}
      - {text: "Cells can only be seen with a microscope", mistake: "treats visibility as the point of the theory"}
    explanation: "The theory states that every cell comes from an earlier cell by division, so spontaneous formation from non-living material would contradict it. The other parts describe structure, not origin."
    hints:
      - "Ask where the theory says new cells come from."
      - "Compare the claim with the origin of cells that the theory describes."
      - "Check which statement concerns how cells originate."
    diagram: null
    confidence: high
  - topic: cell_discovery
    type: numeric
    difficulty: medium
    role: apply
    stem: "A cell has a diameter of 20 micrometres. How many such cells would fit end to end in a line 1 millimetre long, ignoring gaps?"
    correct: "50"
    unit: ""
    wrong: []
    explanation: "One millimetre is 1000 micrometres, and 1000 divided by 20 gives 50 cells in a line."
    hints:
      - "Convert the millimetre into micrometres first."
      - "Then divide the total length by the size of one cell."
      - "Ignore the gaps between cells, as the question says."
    diagram: null
    confidence: high
  - topic: cell_discovery
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A cell is 0.05 mm across. Given that 1 mm equals 1000 micrometres, what is its diameter in micrometres?"
    correct: "50"
    unit: "micrometres"
    wrong: []
    explanation: "Multiplying 0.05 mm by 1000 gives 50 micrometres, which is the size of a small cell."
    hints:
      - "Multiply the length in millimetres by the conversion factor."
      - "Keep track of the units as you convert."
      - "Check whether the new unit is smaller or larger than the original one."
    diagram: null
    confidence: high
  - topic: cell_discovery
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which observation most directly supports the idea that every cell comes from an earlier cell rather than from non-living matter?"
    correct: "Cells in a growing root tip divide and produce new cells with the same structure"
    unit: ""
    wrong:
      - {text: "Dead cork cells keep their walls after death", mistake: "treats the structure of dead cells as evidence of their origin"}
      - {text: "Cells can be stained to show their internal parts", mistake: "confuses a staining method with evidence about origin"}
      - {text: "Some bacteria are much smaller than animal cells", mistake: "uses size differences as proof of how cells arise"}
    explanation: "Dividing cells in a root tip show new cells arising from older cells during growth. The other options describe structure, staining or size, which do not show where cells come from."
    hints:
      - "Focus on what happens to a cell during growth."
      - "Ask which observation shows new cells being made from existing ones."
      - "Eliminate statements about size or staining."
    diagram: null
    confidence: medium
  - topic: cell_organelles
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which organelle is the site of aerobic respiration that releases energy for the cell?"
    correct: "Mitochondrion"
    unit: ""
    wrong:
      - {text: "Ribosome", mistake: "confuses the site of protein making with the energy-releasing site"}
      - {text: "Golgi apparatus", mistake: "mixes up packaging of materials with energy release"}
      - {text: "Vacuole", mistake: "thinks the storage sac is where energy is made"}
    explanation: "Mitochondria carry out aerobic respiration, breaking down food with oxygen to release energy as ATP. This is why they are often called the powerhouse of the cell."
    hints:
      - "Recall which organelle is the energy-releasing centre of the cell."
      - "Think about the organelle that carries out respiration."
      - "Consider the organelle with a folded inner membrane."
    diagram: null
    confidence: high
  - topic: cell_organelles
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which organelle controls the activities of the cell and contains the genetic material?"
    correct: "Nucleus"
    unit: ""
    wrong:
      - {text: "Cell membrane", mistake: "thinks the outer boundary controls the internal activities"}
      - {text: "Cytoplasm", mistake: "confuses the jelly-like matrix with the control centre"}
      - {text: "Chloroplast", mistake: "assumes the green organelle holds the main genetic control in all cells"}
    explanation: "The nucleus is enclosed by a nuclear membrane and holds chromosomes made of DNA. It directs growth, metabolism and cell division."
    hints:
      - "Think about the organelle that acts like a control room."
      - "Consider which organelle is usually the largest and most visible in stained cells."
      - "Ask which structure holds the chromosomes."
    diagram: null
    confidence: high
  - topic: cell_organelles
    type: mcq
    difficulty: medium
    role: explain
    stem: "A cell is treated with a substance that stops its ribosomes from working. Which process would be most directly affected?"
    correct: "Making proteins"
    unit: ""
    wrong:
      - {text: "Releasing energy from glucose", mistake: "assumes ribosomes are needed for respiration"}
      - {text: "Packaging materials for secretion", mistake: "mixes up the ribosome role with the Golgi role"}
      - {text: "Digesting worn-out parts", mistake: "assigns the lysosome job to ribosomes"}
    explanation: "Ribosomes are the site of protein synthesis, so blocking them stops new proteins being made. Respiration happens in mitochondria, packaging in the Golgi apparatus and digestion in lysosomes."
    hints:
      - "Recall what ribosomes are made to do in the cell."
      - "Think about which molecules are built from amino acids."
      - "Ask which process would stop first if the building units were no longer assembled."
    diagram: "Draw a cell with labels pointing to ribosomes scattered in the cytoplasm and attached to the rough endoplasmic reticulum, with an arrow showing a finished protein leaving the endoplasmic reticulum."
    confidence: high
  - topic: cell_organelles
    type: mcq
    difficulty: medium
    role: recall
    stem: "Which plastid contains chlorophyll and is the site where photosynthesis takes place in a plant cell?"
    correct: "Chloroplast"
    unit: ""
    wrong:
      - {text: "Ribosome", mistake: "assumes the protein-making site also captures light"}
      - {text: "Leucoplast", mistake: "thinks colourless plastids are the photosynthesis site"}
      - {text: "Golgi body", mistake: "confuses the packaging organelle with a light-capturing one"}
    explanation: "Chloroplasts contain chlorophyll, which absorbs light energy to drive photosynthesis. Animal cells lack chloroplasts and cannot make food this way."
    hints:
      - "Think about the green pigment that captures light."
      - "Consider the organelle where photosynthesis takes place."
      - "Eliminate sites that make proteins or package materials."
    diagram: null
    confidence: high
  - topic: cell_organelles
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A cell with no working mitochondria is placed in an oxygen-rich environment. Compared with a normal cell, what is the most likely outcome?"
    correct: "Less ATP is made through aerobic respiration"
    unit: ""
    wrong:
      - {text: "Faster protein synthesis on the ribosomes", mistake: "assumes an energy shortage speeds up protein making"}
      - {text: "Greater chlorophyll production in the cytoplasm", mistake: "links energy loss with pigment production"}
      - {text: "Thicker cell wall formation", mistake: "assumes an animal-like cell builds a wall when short of energy"}
    explanation: "Mitochondria use oxygen in aerobic respiration to release most of the cell's usable energy as ATP. Without working mitochondria the cell makes much less ATP, so its energy supply falls."
    hints:
      - "Identify the organelle that uses oxygen to release energy."
      - "Think about what aerobic respiration produces."
      - "Eliminate options about structures that are not involved in energy release."
    diagram: "Draw a cell with a few small oval mitochondria marked with folded inner membranes, an arrow showing oxygen entering, and an arrow showing energy leaving as ATP."
    confidence: medium
  - topic: cell_organelles
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which sequence correctly traces the path of a newly made protein that is meant to leave the cell?"
    correct: "Ribosome, endoplasmic reticulum, Golgi apparatus, cell membrane"
    unit: ""
    wrong:
      - {text: "Nucleus, ribosome, lysosome, cell membrane", mistake: "skips the transport organelles and places a digestive organelle in the route"}
      - {text: "Cell membrane, Golgi apparatus, ribosome, endoplasmic reticulum", mistake: "reverses the direction of movement"}
      - {text: "Vacuole, mitochondrion, nucleus, cell membrane", mistake: "treats the energy organelle as a transport station"}
    explanation: "Proteins are made on ribosomes, enter the endoplasmic reticulum, and are modified and packaged in the Golgi apparatus. Vesicles then carry them to the cell membrane for release."
    hints:
      - "Start where proteins are first assembled."
      - "Follow the membrane network that carries materials to the packaging stage."
      - "Eliminate sequences that place a digestive organelle in the route."
    diagram: null
    confidence: high
  - topic: plasma_membrane_transport
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the name for the movement of water molecules across a semi-permeable membrane?"
    correct: "Osmosis"
    unit: ""
    wrong:
      - {text: "Active transport", mistake: "assumes all movement across membranes needs energy"}
      - {text: "Phagocytosis", mistake: "confuses taking in water with engulfing solid particles"}
      - {text: "Filtration", mistake: "treats pressure-driven flow as the water-only process"}
    explanation: "Osmosis is the net movement of water through a semi-permeable membrane from a region of higher water concentration to a region of lower water concentration. It needs no energy input."
    hints:
      - "Think about the direction water moves when the concentration differs on each side."
      - "Consider the special membrane that lets only some particles pass."
      - "Ask which process is specific to water alone."
    diagram: null
    confidence: high
  - topic: plasma_membrane_transport
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which statement describes diffusion?"
    correct: "Particles move from a region of higher concentration to a region of lower concentration"
    unit: ""
    wrong:
      - {text: "Water moves only through pumps that use ATP", mistake: "confuses diffusion with active transport"}
      - {text: "Particles move from low to high concentration without energy", mistake: "reverses the concentration gradient"}
      - {text: "Only large molecules can cross the membrane by this route", mistake: "assumes size alone decides whether movement happens"}
    explanation: "Diffusion is the spreading of particles down their concentration gradient until they are evenly distributed. It is passive, so no metabolic energy is needed."
    hints:
      - "Think about where the particles start out most crowded."
      - "Consider which way particles spread when there is room to move."
      - "Eliminate statements that mention energy-using pumps."
    diagram: null
    confidence: high
  - topic: plasma_membrane_transport
    type: mcq
    difficulty: medium
    role: explain
    stem: "A cell is placed in pure water. Its cytoplasm contains more dissolved solute than the water outside. In which direction will water move across the membrane?"
    correct: "Into the cell"
    unit: ""
    wrong:
      - {text: "Out of the cell", mistake: "reverses the direction, thinking water flows toward the higher solute concentration"}
      - {text: "No movement, because the outside water is pure", mistake: "believes equilibrium is reached whenever one side is pure"}
      - {text: "Only the dissolved solute moves out", mistake: "forgets that osmosis is about the movement of water"}
    explanation: "Pure water has a higher water concentration than the cytoplasm, so water moves across the semi-permeable membrane into the cell by osmosis. The cell swells as a result."
    hints:
      - "Compare how much water is present on each side of the membrane."
      - "Remember that pure water has the highest water concentration."
      - "Water moves from high water concentration toward low water concentration."
    diagram: "Draw two compartments separated by a dotted membrane line: one labelled pure water, the other labelled cell cytoplasm with dissolved particles. Add an arrow across the membrane showing the water direction."
    confidence: high
  - topic: plasma_membrane_transport
    type: mcq
    difficulty: medium
    role: apply
    stem: "Oxygen moves into a leaf cell from the air around it without any energy input. Which process is responsible for this movement?"
    correct: "Diffusion"
    unit: ""
    wrong:
      - {text: "Active transport", mistake: "assumes gases need energy to enter cells"}
      - {text: "Osmosis", mistake: "applies a water-only term to a gas"}
      - {text: "Endocytosis", mistake: "thinks the cell engulfs the gas in a vesicle"}
    explanation: "Oxygen is more concentrated in the air than inside the cell, so it moves down its gradient by diffusion. No energy is spent, and the molecule is a gas rather than water, so osmosis does not apply."
    hints:
      - "Ask whether the gas moves down a concentration gradient."
      - "Consider whether the cell must spend energy for this movement."
      - "Eliminate processes that apply only to water."
    diagram: "Draw a leaf cell beside an air space, with arrows showing oxygen moving from the air through the cell membrane into the cell, and labels for high and low oxygen concentration."
    confidence: high
  - topic: plasma_membrane_transport
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A red blood cell is placed in a salt solution that is more concentrated than its cytoplasm. What change is most likely to be seen in the cell after some time?"
    correct: "The cell shrinks as water leaves it"
    unit: ""
    wrong:
      - {text: "The cell bursts as water enters it", mistake: "reverses the direction of osmosis"}
      - {text: "The cell grows larger as solute leaves it", mistake: "assumes solutes drive the change in size"}
      - {text: "The cell stays the same because membranes block all water movement", mistake: "believes membranes stop water completely"}
    explanation: "The outside solution has less water per unit volume than the cytoplasm, so water leaves the cell by osmosis and the cell shrinks. Cells without a rigid wall are most affected."
    hints:
      - "Work out which side has more water in this case."
      - "Water moves toward the side with lower water concentration."
      - "Consider what happens to the volume of a cell that loses water."
    diagram: null
    confidence: high
  - topic: plasma_membrane_transport
    type: mcq
    difficulty: hard
    role: explain
    stem: "What feature of a semi-permeable membrane allows water to pass while blocking larger dissolved sugar molecules?"
    correct: "Pores too small for sugar molecules but large enough for water"
    unit: ""
    wrong:
      - {text: "Pores large enough for every dissolved particle", mistake: "assumes the membrane is freely permeable"}
      - {text: "A layer of lipids that dissolves water", mistake: "confuses the membrane structure with a solvent"}
      - {text: "Active pumps that move sugar molecules outward", mistake: "thinks every selective step needs a pump"}
    explanation: "A semi-permeable membrane has pores or channels sized so that small molecules like water pass while larger dissolved molecules do not. This selection is passive and needs no energy."
    hints:
      - "Compare the size of a water molecule with the size of a sugar molecule."
      - "Think about what a sieve-like barrier does."
      - "Eliminate features that let everything pass freely."
    diagram: null
    confidence: medium
  - topic: plant_vs_animal_cells
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which structure is present in plant cells but generally absent in animal cells?"
    correct: "Cell wall"
    unit: ""
    wrong:
      - {text: "Cell membrane", mistake: "thinks only the wall forms an outer boundary in plants"}
      - {text: "Nucleus", mistake: "assumes nuclei are unique to animals"}
      - {text: "Mitochondrion", mistake: "believes energy organelles are found only in plants"}
    explanation: "Plant cells have a rigid cell wall, mainly of cellulose, outside the membrane. Animal cells lack this wall and rely on the membrane alone for their outer boundary."
    hints:
      - "Think about the rigid outer layer that gives plant cells their shape."
      - "Consider which structure lies outside the membrane in plants."
      - "Eliminate structures that both cell types share."
    diagram: null
    confidence: high
  - topic: plant_vs_animal_cells
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which organelle is typically large and central in a mature plant cell and stores water?"
    correct: "Large central vacuole"
    unit: ""
    wrong:
      - {text: "Small scattered vacuoles", mistake: "assumes all plant vacuoles are small"}
      - {text: "Lysosome", mistake: "thinks lysosomes are the water store"}
      - {text: "Centrosome", mistake: "confuses water storage with the cell division organelle"}
    explanation: "Mature plant cells often have one large central vacuole filled with cell sap. It stores water and keeps the cell turgid and firm."
    hints:
      - "Think about the large sac that fills most of the cell interior."
      - "Consider which organelle keeps the cell firm when it is full of water."
      - "Eliminate options that are small or linked to digestion."
    diagram: "Draw a plant cell as a rectangle with a thick outer wall, one large central sac labelled, and a small nucleus pushed to one side. Label the chloroplasts near the wall."
    confidence: high
  - topic: plant_vs_animal_cells
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why are plant cells usually more regular and box-like in shape than animal cells?"
    correct: "The rigid cell wall maintains a fixed shape"
    unit: ""
    wrong:
      - {text: "Plant cells are always dividing and so become flattened", mistake: "treats cell division as a cause of shape"}
      - {text: "Animal cells contain more chloroplasts that stretch them", mistake: "links chloroplasts with cell stretching"}
      - {text: "The nucleus of a plant cell is what keeps it square", mistake: "assumes the nucleus controls the cell's outline"}
    explanation: "The cellulose wall is strong and fixed, so it holds the plant cell in a defined shape. Animal cells with only a flexible membrane can change shape more easily."
    hints:
      - "Think about what the outer layer of a plant cell is made of."
      - "Consider what happens to shape when a cell has no wall."
      - "Eliminate statements about division or the nucleus."
    diagram: null
    confidence: medium
  - topic: plant_vs_animal_cells
    type: mcq
    difficulty: medium
    role: recall
    stem: "Which organelle that captures light energy for food making is absent from an animal cell?"
    correct: "Chloroplast"
    unit: ""
    wrong:
      - {text: "Mitochondrion", mistake: "assumes both cell types need the same energy organelles, so it is absent from animals too"}
      - {text: "Nucleus", mistake: "treats the control centre as a food-making organelle"}
      - {text: "Lysosome", mistake: "assumes digestive organelles are the light-capturing ones"}
    explanation: "Chloroplasts hold chlorophyll and make food by photosynthesis. Animal cells do not have them, so they must obtain food from outside."
    hints:
      - "Think about the green organelle used for photosynthesis."
      - "Ask which cell type makes its own food by photosynthesis."
      - "Eliminate organelles that both cell types share."
    diagram: null
    confidence: high
  - topic: plant_vs_animal_cells
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A student sees a cell under a microscope. It has no cell wall, a nucleus, mitochondria and no green plastids. Which conclusion is best supported?"
    correct: "It is most likely an animal cell"
    unit: ""
    wrong:
      - {text: "It must be a bacterium", mistake: "treats the presence of a nucleus as a bacterial feature"}
      - {text: "It is a plant cell that has lost its chloroplasts", mistake: "ignores that plant cells keep a wall"}
      - {text: "It cannot respire, because it has no chloroplasts", mistake: "links respiration with chloroplasts"}
    explanation: "A nucleus and mitochondria fit a eukaryotic cell, and the lack of a wall and of chloroplasts fits an animal cell. Bacteria lack a true nucleus, so that option is ruled out."
    hints:
      - "Compare the features shown with the list of plant-only structures."
      - "Ask which structures are absent and which are shared by both cell types."
      - "Ask whether the missing wall alone is enough to rule out a plant cell."
    diagram: "Draw a cell outline with no outer wall, a round nucleus, and a few small oval mitochondria, with no green plastids. Label each structure."
    confidence: high
  - topic: plant_vs_animal_cells
    type: mcq
    difficulty: hard
    role: apply
    stem: "A cell from a leaf has a thick outer wall, green plastids and one large central sac. What best explains why the leaf stays firm when the plant is well watered?"
    correct: "The central sac is full of water that presses the cell wall outward"
    unit: ""
    wrong:
      - {text: "The chloroplasts store water inside the cell", mistake: "assigns water storage to the pigment organelles"}
      - {text: "The nucleus pushes the membrane against the wall", mistake: "gives the nucleus a mechanical role"}
      - {text: "Mitochondria stiffen the membrane during respiration", mistake: "gives respiration a structural role"}
    explanation: "Water pressure from the central vacuole pushes the membrane against the cell wall, which keeps the tissue firm. Chloroplasts make food, nuclei control activity, and mitochondria release energy."
    hints:
      - "Think about which structure holds the water in the cell."
      - "Consider how a full water sac affects the wall around it."
      - "Eliminate options that give storage or pressure roles to organelles that do not hold much water."
    diagram: null
    confidence: high
