  - topic: infectious_diseases
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Cholera spreads through contaminated water and causes severe watery diarrhoea. Which group of microbes causes cholera?"
    correct: "A bacterium"
    unit: ""
    wrong:
      - {text: "A fungus", mistake: "assumes watery diarrhoea is a fungal infection"}
      - {text: "A protozoan", mistake: "links water-borne illness with single-celled parasites only"}
      - {text: "A virus", mistake: "assumes all water-borne illness is viral"}
    explanation: "Cholera is caused by the bacterium Vibrio cholerae, which releases toxins in the intestine and causes watery diarrhoea. Clean water and sanitation prevent its spread."
    hints:
      - "Think about the microbe group that causes this disease inside the gut."
      - "Consider the cell structure of the causative organism, which lacks a true nucleus."
      - "Eliminate groups whose members are multicellular."
    diagram: null
    confidence: low
  - topic: infectious_diseases
    type: mcq
    difficulty: hard
    role: explain
    stem: "Which feature best distinguishes an infectious disease from a non-infectious disease?"
    correct: "It is caused by a pathogen that can be transmitted to others"
    unit: ""
    wrong:
      - {text: "It always causes a fever", mistake: "uses a symptom to define the category"}
      - {text: "It can only be treated with surgery", mistake: "confuses treatment with cause"}
      - {text: "It is always visible on the skin", mistake: "assumes diseases must show on the surface"}
    explanation: "Infectious diseases are caused by pathogens such as bacteria, viruses, fungi or protozoa that can pass to other people. Non-infectious diseases lack this transmissible cause."
    hints:
      - "Think about what causes the disease rather than what it feels like."
      - "Consider whether the cause can move from one host to another."
      - "Eliminate options that describe symptoms or treatments."
    diagram: null
    confidence: low
  - topic: transmission_and_prevention
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which everyday action most directly reduces the spread of an airborne infection when someone is coughing?"
    correct: "Covering the mouth when coughing"
    unit: ""
    wrong:
      - {text: "Sharing a water bottle with friends", mistake: "assumes sharing items is harmless"}
      - {text: "Skipping hand washing before meals", mistake: "believes hands do not carry germs"}
      - {text: "Keeping windows shut in a crowded room", mistake: "thinks closed air reduces spread"}
    explanation: "Coughing releases droplets that can carry microbes to other people. Covering the mouth with a tissue or the elbow reduces that spread."
    hints:
      - "Think about how droplets leave the body when a person coughs."
      - "Consider which action blocks droplets from reaching others."
      - "Eliminate actions that share items or cut off ventilation."
    diagram: null
    confidence: low
  - topic: transmission_and_prevention
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which step is the most effective everyday way to prevent waterborne disease in a household?"
    correct: "Drinking boiled or filtered water"
    unit: ""
    wrong:
      - {text: "Drinking water from any open pond", mistake: "assumes clear water is safe"}
      - {text: "Washing vegetables with a dry cloth only", mistake: "believes dirt is removed without water"}
      - {text: "Leaving cooked food uncovered near flies", mistake: "underestimates how insects carry germs to food"}
    explanation: "Boiling or filtering water removes or kills pathogens before drinking. Untreated water from unclear sources can carry bacteria and parasites."
    hints:
      - "Think about how to make water free of pathogens before drinking it."
      - "Consider the simple heat-based and filter-based methods."
      - "Eliminate choices that leave water untreated or food exposed."
    diagram: null
    confidence: low
  - topic: transmission_and_prevention
    type: mcq
    difficulty: medium
    role: explain
    stem: "A community removes standing water where mosquito larvae grow. Which kind of control does this action illustrate?"
    correct: "Controlling the vector"
    unit: ""
    wrong:
      - {text: "Treating the patient with drugs", mistake: "confuses vector control with treatment of the sick"}
      - {text: "Vaccinating the population", mistake: "confuses removing breeding sites with immunity"}
      - {text: "Quarantining the infected people", mistake: "thinks isolation targets the insects"}
    explanation: "A vector is an organism that carries a pathogen from one host to another. Removing breeding water reduces the vector population and breaks the route of spread."
    hints:
      - "Think about whether the action targets the disease-carrying organism or the sick person."
      - "Consider which step breaks the route between the carrier and people."
      - "Eliminate options that act on people's bodies rather than on the carrier."
    diagram: null
    confidence: low
  - topic: transmission_and_prevention
    type: mcq
    difficulty: medium
    role: apply
    stem: "A village wants to stop a stomach infection that spreads through its shared water source. Which combined action would be most effective?"
    correct: "Treating the water source and keeping toilets away from it"
    unit: ""
    wrong:
      - {text: "Giving everyone antibiotics without testing the water", mistake: "ignores the route of spread"}
      - {text: "Distributing face masks to children only", mistake: "assumes the route is airborne"}
      - {text: "Banning all travel between neighbouring villages", mistake: "treats a local water route as a travel problem"}
    explanation: "Treating the water and keeping waste away from it cut off the route from faeces to drinking water. This targets the actual transmission path."
    hints:
      - "Think about breaking the route from waste to drinking water."
      - "Consider how the water source can be kept free of waste."
      - "Eliminate actions that target only one group or the wrong route."
    diagram: null
    confidence: low
  - topic: transmission_and_prevention
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Vaccination protects a community even when a few people are not vaccinated. Which concept explains this wider protection?"
    correct: "Herd immunity"
    unit: ""
    wrong:
      - {text: "Antigenic variation", mistake: "assumes pathogens always change to avoid vaccines"}
      - {text: "Passive transport", mistake: "confuses the term with membrane transport"}
      - {text: "Vector control", mistake: "treats insect control as the same thing as vaccination"}
    explanation: "Herd immunity arises when a large share of a population is immune, so an infection has fewer chances to spread and people who are not immune are protected too."
    hints:
      - "Think about what happens when most people in a group are protected."
      - "Consider how a shared barrier limits the chance a pathogen finds a new host."
      - "Eliminate terms about cell transport or insect control."
    diagram: null
    confidence: low
  - topic: transmission_and_prevention
    type: mcq
    difficulty: hard
    role: apply
    stem: "A disease spreads only when an infected person has direct contact with healthy people. Which preventive step addresses this route most directly?"
    correct: "Isolating infected people until they are no longer contagious"
    unit: ""
    wrong:
      - {text: "Improving the filter at the village tap", mistake: "targets a route the disease does not use"}
      - {text: "Spraying insecticide across the fields", mistake: "assumes all diseases are carried by insects"}
      - {text: "Adding vitamins to the daily diet", mistake: "treats transmission as a nutrition problem"}
    explanation: "Isolating infected people stops them from meeting healthy people while they can still pass the infection on. This directly breaks the contact route."
    hints:
      - "Think about breaking contact between infected and healthy people."
      - "Consider which step stops the infected from meeting others."
      - "Eliminate actions aimed at water, insects or nutrition."
    diagram: null
    confidence: low
  - topic: immunity
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which type of blood cell is mainly responsible for fighting infection?"
    correct: "White blood cells"
    unit: ""
    wrong:
      - {text: "Red blood cells", mistake: "assumes oxygen carriers also fight pathogens"}
      - {text: "Platelets", mistake: "credits clotting cells with the defence role"}
      - {text: "Plasma proteins only", mistake: "ignores the cells in the blood entirely"}
    explanation: "White blood cells, including phagocytes and lymphocytes, detect and destroy pathogens. Red cells carry oxygen and platelets help blood clot."
    hints:
      - "Think about the cells that move through the blood to find invaders."
      - "Consider the colourless cells in the blood."
      - "Eliminate cells that carry gases or help with clotting."
    diagram: null
    confidence: low
  - topic: immunity
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the main purpose of a vaccine?"
    correct: "To train the immune system to recognise a pathogen"
    unit: ""
    wrong:
      - {text: "To kill bacteria already present in the blood", mistake: "treats vaccines as antibiotics"}
      - {text: "To replace damaged red blood cells", mistake: "mixes vaccines up with blood transfusion"}
      - {text: "To make the skin produce antibodies directly", mistake: "assumes skin cells are the main antibody source"}
    explanation: "A vaccine contains a harmless form or part of a pathogen. It prompts the immune system to make memory cells, so that a later real infection is met quickly."
    hints:
      - "Think about how the body learns to respond before meeting the real germ."
      - "Consider what kind of memory the immune system builds."
      - "Eliminate options that describe killing germs directly or transfusions."
    diagram: null
    confidence: low
  - topic: immunity
    type: mcq
    difficulty: medium
    role: explain
    stem: "A person who recovers from chickenpox seldom gets it again. Which feature of the immune system explains this?"
    correct: "Memory cells remember the pathogen and respond quickly"
    unit: ""
    wrong:
      - {text: "The virus is destroyed completely and never leaves any trace", mistake: "assumes an infection always clears every trace"}
      - {text: "The body stops making white blood cells after one illness", mistake: "believes immune cell production shuts down after an infection"}
      - {text: "Skin cells lose their receptor for the virus permanently", mistake: "assumes infection permanently changes host receptors"}
    explanation: "After an infection, memory lymphocytes persist and recognise the same pathogen on a later encounter, triggering a faster and stronger response. This is why second infections are often prevented."
    hints:
      - "Think about what the body keeps after the first infection is over."
      - "Consider how a second meeting with the same pathogen differs from the first."
      - "Eliminate options that claim the body loses its defences."
    diagram: null
    confidence: low
  - topic: immunity
    type: mcq
    difficulty: medium
    role: apply
    stem: "Antibodies are proteins that bind to a specific part of a pathogen. What is the name of the molecule on the pathogen that an antibody recognises?"
    correct: "Antigen"
    unit: ""
    wrong:
      - {text: "Enzyme", mistake: "confuses recognition molecules with catalysts"}
      - {text: "Hormone", mistake: "mixes up chemical messengers with recognition molecules"}
      - {text: "Vitamin", mistake: "treats immune molecules as nutrients"}
    explanation: "An antigen is a molecule on a pathogen that triggers an immune response. Antibodies bind specific antigens and mark the pathogen for destruction."
    hints:
      - "Think about the molecule that the immune system marks as foreign."
      - "Consider the term for a substance that provokes an antibody response."
      - "Eliminate chemical classes that do not provoke immune responses."
    diagram: null
    confidence: low
  - topic: immunity
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Phagocytes surround and engulf invading bacteria in the body. Which description best matches this defence?"
    correct: "Non-specific engulfing and digestion of invaders"
    unit: ""
    wrong:
      - {text: "Antibody-based neutralisation of one specific toxin", mistake: "assumes every defence is antibody-based"}
      - {text: "Release of clotting factors to seal a wound", mistake: "confuses engulfing with clotting"}
      - {text: "Production of memory cells against one particular strain", mistake: "credits a specific memory response to a general defence"}
    explanation: "Phagocytes are a first-line defence that engulf and digest pathogens without needing prior exposure. This innate response is non-specific."
    hints:
      - "Think about whether this defence needs earlier exposure to recognise the invader."
      - "Consider how a cell surrounds and breaks down a particle."
      - "Eliminate options that involve clotting or memory."
    diagram: null
    confidence: low
  - topic: immunity
    type: mcq
    difficulty: hard
    role: apply
    stem: "A child recovers from measles and is then protected against a later measles infection. What type of immunity is this?"
    correct: "Naturally acquired active immunity"
    unit: ""
    wrong:
      - {text: "Passive immunity from the mother's antibodies", mistake: "confuses transfer of antibodies at birth with infection"}
      - {text: "Vaccine-induced passive immunity", mistake: "mixes up the origin of the defence with its active nature"}
      - {text: "Artificially acquired passive immunity from an injection of serum", mistake: "treats injected antibodies as the same as the body's own immunity"}
    explanation: "The child's own immune system responded to the infection and formed memory cells, which is natural active immunity. Passive immunity comes from antibodies received from another source."
    hints:
      - "Think about whether the child's own body made the defence."
      - "Consider how the immunity was acquired and whether it was given to the child."
      - "Eliminate options where antibodies were given or passed from another person."
    diagram: null
    confidence: low
