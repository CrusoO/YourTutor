    confidence: low
  - topic: health_and_disease
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which of these is a disease rather than a normal state or process of the body?"
    correct: "Malaria"
    unit: ""
    wrong:
      - {text: "Mild tiredness after a long day", mistake: "treats temporary tiredness as a disease"}
      - {text: "Growing taller during adolescence", mistake: "counts normal growth as a disorder"}
      - {text: "Feeling hungry before lunch", mistake: "treats a normal body signal as an illness"}
    explanation: "Malaria disturbs normal body function and is caused by a parasite spread by mosquitoes. Tiredness, growth and hunger are normal states."
    hints:
      - "Think of a condition that disturbs the normal working of the body."
      - "Consider which option is caused by a microbe."
      - "Eliminate normal body processes and everyday feelings."
