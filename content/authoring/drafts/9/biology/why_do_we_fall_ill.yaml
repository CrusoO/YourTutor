items:
  - topic: health_and_disease
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which description best defines health?"
    correct: "A state of complete physical, mental and social well-being"
    unit: ""
    wrong:
      - {text: "Having no symptoms for a single day", mistake: "equates health with feeling fine at one moment"}
      - {text: "Having a strong body that never needs rest", mistake: "ignores mental and social aspects"}
      - {text: "Living for many years without a doctor's visit", mistake: "uses lifespan or contact with doctors as the definition"}
    explanation: "Health is a state of complete physical, mental and social well-being, not merely the absence of disease. Disease is a condition that disturbs normal functioning."
    hints:
      - "Think about more than the body alone when judging whether someone is well."
      - "Consider whether a person's mind and relationships count."
      - "Eliminate definitions based on one short time period or one visit."
