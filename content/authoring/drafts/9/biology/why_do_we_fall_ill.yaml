  - topic: health_and_disease
    type: mcq
    difficulty: medium
    role: explain
    stem: "A person has persistently high blood pressure that is not caused by any microbe. How is this condition best classified?"
    correct: "A non-infectious disease"
    unit: ""
    wrong:
      - {text: "An infectious disease spread by contact", mistake: "assumes every disease comes from germs"}
      - {text: "A healthy state with no symptoms", mistake: "treats a silent disorder as health"}
      - {text: "A trait that cannot be treated", mistake: "confuses a disease with an inherited trait"}
    explanation: "Persistently high blood pressure is a disorder without a microbial cause, so it is non-infectious. Such disorders develop over time from lifestyle, genetic or body factors."
    hints:
      - "Think about whether a microbe is the cause of this condition."
      - "Consider whether the condition can spread from person to person."
      - "Eliminate options that describe health or contact spread."
    diagram: null
    confidence: low
  - topic: health_and_disease
    type: mcq
    difficulty: medium
    role: apply
    stem: "A student has a cough that lasts two weeks and passes to several classmates. Which category best describes this illness?"
    correct: "Infectious disease"
    unit: ""
    wrong:
      - {text: "Non-infectious disease", mistake: "ignores that the illness passes between people"}
      - {text: "Deficiency disease", mistake: "assumes any lasting illness is a nutrient shortage"}
      - {text: "Genetic disorder", mistake: "links spread between people with inherited causes"}
    explanation: "An illness that passes between people is caused by a pathogen and is infectious. A cough spreading through a class fits this pattern."
    hints:
      - "Think about whether the illness spreads from one person to another."
      - "Consider whether a microbe is involved."
      - "Eliminate categories based on inherited traits or nutrient shortage."
    diagram: null
    confidence: low
  - topic: health_and_disease
    type: mcq
    difficulty: hard
    role: transfer
    stem: "In a village, an illness appears only in households that drink from a contaminated well, and it does not pass directly from person to person. Which statement best fits?"
    correct: "It is waterborne and spreads through the water supply, not directly between people"
    unit: ""
    wrong:
      - {text: "It is caused by an inherited gene shared in the community", mistake: "ignores the environmental source of the problem"}
      - {text: "It is a nutrient deficiency from a poor diet", mistake: "links water contamination with diet alone"}
      - {text: "It is a healthy state caused by harmless bacteria", mistake: "treats contamination as a sign of health"}
    explanation: "Waterborne pathogens reach people through a contaminated shared source, so the illness is infectious without passing directly between people. Clean supply and treatment reduce it."
    hints:
      - "Think about how a pathogen reaches people through a shared resource."
      - "Consider the route of transmission when there is no direct contact."
      - "Eliminate causes that are inherited or purely dietary."
    diagram: null
    confidence: low
  - topic: health_and_disease
    type: mcq
    difficulty: hard
    role: apply
    stem: "Which pairing correctly matches a disease with its causative agent?"
    correct: "Typhoid and bacterium"
    unit: ""
    wrong:
      - {text: "Common cold and bacterium", mistake: "assumes respiratory infections are bacterial"}
      - {text: "Ringworm and virus", mistake: "confuses skin fungal infections with viruses"}
      - {text: "Malaria and fungus", mistake: "treats the protozoan parasite illness as a fungal one"}
    explanation: "Typhoid is caused by a bacterium, Salmonella typhi. The common cold is viral, ringworm is a fungal skin infection and malaria is caused by a protozoan parasite."
    hints:
      - "Sort the causative agents into bacteria, viruses, fungi and protozoa before comparing."
      - "Consider which group contains simple single-celled organisms with no true nucleus."
      - "Eliminate pairs where the agent group is clearly wrong for the disease you know."
    diagram: null
    confidence: low
  - topic: infectious_diseases
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which of these is a non-infectious disease?"
    correct: "Diabetes"
    unit: ""
    wrong:
      - {text: "Tuberculosis", mistake: "assumes long-lasting illnesses are non-infectious"}
      - {text: "Cholera", mistake: "confuses severe illness with non-infectious disease"}
      - {text: "Dengue", mistake: "treats mosquito-borne illness as non-infectious"}
    explanation: "Diabetes arises from problems with insulin and blood sugar control and is not caused by a pathogen. Tuberculosis, cholera and dengue are all infectious."
    hints:
      - "Think about whether the condition can be spread by a germ."
      - "Consider a condition linked to hormones or metabolism rather than to a germ."
      - "Eliminate the illnesses that a germ causes."
    diagram: null
    confidence: low
  - topic: infectious_diseases
    type: mcq
    difficulty: easy
    role: recall
    stem: "What type of organism causes tuberculosis?"
    correct: "A bacterium"
    unit: ""
    wrong:
      - {text: "A virus", mistake: "assumes all lung infections are viral"}
      - {text: "A protozoan", mistake: "confuses it with the parasite that causes malaria"}
      - {text: "A fungus", mistake: "links lung infections with moulds"}
    explanation: "Tuberculosis is caused by a bacterium that mainly infects the lungs and spreads through airborne droplets. Specific antibiotics are used in treatment."
    hints:
      - "Think about the microbe group whose cells are simple and have no true nucleus."
      - "Consider the group of microbes that is usually treated with antibiotics."
      - "Eliminate groups that cause malaria or skin infections."
    diagram: null
    confidence: low
  - topic: infectious_diseases
    type: mcq
    difficulty: medium
    role: explain
    stem: "Ringworm is a skin condition that spreads through contact with infected surfaces and towels. Which group of organisms causes it?"
    correct: "Fungi"
    unit: ""
    wrong:
      - {text: "Bacteria", mistake: "assumes skin infections are always bacterial"}
      - {text: "Viruses", mistake: "treats contagious skin conditions as viral"}
      - {text: "Protozoa", mistake: "links water-borne parasites with skin infections"}
    explanation: "Ringworm is a fungal infection, not caused by a worm despite its name. It spreads through direct contact and shared items."
    hints:
      - "Think about organisms that grow as thread-like filaments on moist skin."
      - "Consider which group the common mould belongs to."
      - "Eliminate groups that are mostly single-celled animal-like parasites or that work through viruses."
