  - topic: infectious_diseases
    type: mcq
    difficulty: medium
    role: apply
    stem: "A feverish illness spreads by the bite of a certain mosquito and is caused by a virus. Which disease fits this description?"
    correct: "Dengue"
    unit: ""
    wrong:
      - {text: "Malaria", mistake: "assumes all mosquito-borne diseases are caused by protozoa"}
      - {text: "Typhoid", mistake: "links a feverish illness with contaminated food only"}
      - {text: "Ringworm", mistake: "assumes skin fungi spread through insect bites"}
    explanation: "Dengue is caused by a virus carried by a mosquito and produces fever and body aches. Malaria is also carried by mosquitoes but is caused by a protozoan."
    hints:
      - "Think about the group of microbes that is smaller than bacteria."
      - "Consider which disease spreads through mosquito bites and produces fever."
      - "Eliminate diseases spread through food or skin contact."
    diagram: null
