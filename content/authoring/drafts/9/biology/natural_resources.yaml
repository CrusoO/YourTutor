items:
  - topic: water_cycle
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which process turns liquid water from oceans and lakes into water vapour?"
    correct: "Evaporation"
    unit: ""
    wrong:
      - {text: "Condensation", mistake: "reverses the direction of the change of state"}
      - {text: "Precipitation", mistake: "confuses falling water with the formation of vapour"}
      - {text: "Infiltration", mistake: "assumes water soaking into the ground creates vapour"}
    explanation: "Evaporation converts liquid water into vapour, driven mainly by heat from the sun. Transpiration from plants adds further vapour to the air."
    hints:
      - "Think about the process driven by the sun's heat on lakes and oceans."
      - "Consider which change of state turns a liquid into a gas."
      - "Eliminate processes where water falls or gathers into droplets."
    diagram: null
    confidence: low
  - topic: water_cycle
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the name for water that returns to the Earth as rain, snow, sleet or hail?"
    correct: "Precipitation"
    unit: ""
    wrong:
      - {text: "Transpiration", mistake: "confuses water loss from leaves with falling water"}
      - {text: "Evaporation", mistake: "treats the vapour stage as the falling stage"}
      - {text: "Runoff", mistake: "assumes water flowing over land is the falling stage"}
    explanation: "Precipitation is any water that falls from clouds, including rain, snow, sleet and hail. It returns water to land and seas."
    hints:
      - "Think about the stage where water leaves the clouds."
      - "Consider the process that delivers water from the air to the ground."
      - "Eliminate processes that move water upward into the air."
    diagram: null
    confidence: low
  - topic: water_cycle
    type: mcq
    difficulty: medium
    role: explain
    stem: "Water vapour rises, cools high in the atmosphere, and forms tiny droplets that gather into clouds. Which process is described?"
    correct: "Condensation"
    unit: ""
    wrong:
      - {text: "Sublimation", mistake: "confuses vapour turning into droplets with vapour turning directly into ice"}
      - {text: "Transpiration", mistake: "credits plant water loss with cloud formation"}
      - {text: "Infiltration", mistake: "treats soil absorption as the cause of cloud formation"}
    explanation: "When rising vapour cools it loses energy and changes back into liquid, forming droplets that cluster into clouds. This change of state is condensation."
    hints:
      - "Think about what happens to vapour when it loses heat."
      - "Consider which change of state turns a gas back into a liquid."
      - "Eliminate processes that involve leaves or soil."
    diagram: "Draw a simple water cycle with the sun over a sea, arrows for rising vapour, a cloud at high altitude, and labels for each stage."
    confidence: low
  - topic: water_cycle
    type: mcq
    difficulty: medium
    role: apply
    stem: "Plants release water vapour into the air through tiny pores on their leaves. Which process is this?"
    correct: "Transpiration"
    unit: ""
    wrong:
      - {text: "Infiltration", mistake: "assumes water entering leaves is soil absorption"}
      - {text: "Precipitation", mistake: "confuses water leaving plants with water falling from clouds"}
      - {text: "Condensation", mistake: "credits leaf vapour with forming clouds"}
    explanation: "Transpiration is water loss from plants, mainly through stomata on the leaves. It adds water vapour to the atmosphere and helps draw water up through the roots."
    hints:
      - "Think about the pores on leaves."
      - "Consider which process moves water through a plant and out into the air."
      - "Eliminate processes that do not involve living organisms."
    diagram: "Draw a leaf with stomata on its lower surface and arrows showing water vapour leaving the pores and water moving up from the roots."
    confidence: low
  - topic: water_cycle
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A forest is cleared and, after heavy rain, the soil dries out faster than before. Which change in the water cycle best explains the reduced return of vapour to the air?"
    correct: "Less transpiration from fewer plants"
    unit: ""
    wrong:
      - {text: "More infiltration into deep rock layers", mistake: "assumes soil always gains water when trees are removed"}
      - {text: "Higher condensation at ground level", mistake: "places cloud formation at the ground"}
      - {text: "Greater groundwater recharge through the roots", mistake: "credits roots with adding rainfall"}
    explanation: "Trees release large amounts of vapour by transpiration. With fewer plants less vapour returns to the atmosphere, and more rain runs off instead of being cycled back."
    hints:
      - "Think about which living stage returns water vapour from plants."
      - "Consider how many leaves are left to release water after clearing."
      - "Eliminate options that add water to the soil or describe cloud formation."
    diagram: "Draw two side-by-side scenes: a forest with trees releasing vapour upward through leaves, and cleared land with bare soil and runoff arrows. Label transpiration and runoff."
    confidence: low
  - topic: water_cycle
    type: mcq
    difficulty: hard
    role: procedure
    stem: "Which sequence correctly orders the main stages of the water cycle, starting from the sea?"
    correct: "Evaporation, condensation, precipitation, runoff back to the sea"
    unit: ""
    wrong:
      - {text: "Precipitation, evaporation, condensation, runoff", mistake: "starts with rainfall and skips the vapour stage"}
      - {text: "Condensation, runoff, evaporation, precipitation", mistake: "places water flow before vapour formation"}
      - {text: "Runoff, precipitation, condensation, evaporation", mistake: "reverses the whole cycle"}
    explanation: "Solar heat evaporates sea water, the vapour condenses into clouds, precipitation returns water to land, and runoff carries it back to the sea."
    hints:
      - "Begin with the heat from the sun acting on the sea."
      - "Think about what follows once vapour has formed."
      - "Eliminate sequences that start with rain or runoff."
    diagram: null
    confidence: low
  - topic: nutrient_cycles
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which gas makes up the largest share of the air around us?"
    correct: "Nitrogen"
    unit: ""
    wrong:
      - {text: "Oxygen", mistake: "assumes the gas living things need most is also the most common"}
      - {text: "Carbon dioxide", mistake: "confuses the cycling gas with the most common one"}
      - {text: "Hydrogen", mistake: "confuses the air's gases with the most abundant element in the universe"}
    explanation: "About 78 percent of dry air is nitrogen gas. Most organisms cannot use it directly, so bacteria must fix it into usable compounds first."
    hints:
      - "Think about the gas that makes up most of the air around us."
      - "Consider the gas that plants cannot use directly from the air."
      - "Eliminate gases that are needed in small amounts or released mainly by respiration."
    diagram: null
    confidence: high
  - topic: nutrient_cycles
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which process removes carbon dioxide from the air during the carbon cycle?"
    correct: "Photosynthesis"
    unit: ""
    wrong:
      - {text: "Respiration", mistake: "reverses the direction of carbon flow"}
      - {text: "Combustion", mistake: "assumes burning takes carbon out of the air"}
      - {text: "Decomposition", mistake: "confuses breakdown of dead matter with carbon uptake"}
    explanation: "Plants take in carbon dioxide during photosynthesis and fix it into sugars and other carbon compounds. This draws carbon out of the atmosphere."
    hints:
      - "Think about the process plants use to build food from carbon dioxide."
      - "Consider which process uses sunlight to make sugars."
      - "Eliminate processes that release carbon dioxide into the air."
    diagram: null
    confidence: low
  - topic: nutrient_cycles
    type: mcq
    difficulty: medium
    role: explain
    stem: "Bacteria living in root nodules of legumes convert nitrogen gas from the air into a form that plants can absorb. What is this process called?"
    correct: "Nitrogen fixation"
    unit: ""
    wrong:
      - {text: "Nitrification", mistake: "confuses the first conversion of gas with a later conversion of ammonia"}
      - {text: "Denitrification", mistake: "reverses the step by returning nitrogen to the air"}
      - {text: "Ammonification", mistake: "assumes decay is the step that brings in nitrogen gas"}
    explanation: "Nitrogen fixation converts atmospheric nitrogen into ammonia or related compounds. Root nodule bacteria and some free-living microbes carry it out, and plants then absorb these forms."
    hints:
      - "Think about how nitrogen gas becomes a compound that can be used."
      - "Consider the first step in which the gas enters the living world."
      - "Eliminate processes that return nitrogen to the air or convert nitrates."
    diagram: "Draw a root with a nodule, an arrow from nitrogen gas in the air to the bacteria in the nodule, and a second arrow showing the compounds passing into the plant. Label each step."
    confidence: low
  - topic: nutrient_cycles
    type: mcq
    difficulty: medium
    role: apply
    stem: "Decomposers break down dead leaves in the soil. What role does this decomposition play in the carbon cycle?"
    correct: "It releases carbon dioxide into the atmosphere"
    unit: ""
    wrong:
      - {text: "It locks carbon permanently into fossil fuel today", mistake: "assumes decomposition forms fossil fuels in a short time"}
      - {text: "It stops carbon from moving through the soil", mistake: "believes decomposition halts the flow of carbon"}
      - {text: "It removes carbon dioxide through photosynthesis", mistake: "confuses decomposers with plants"}
    explanation: "Decomposers respire while breaking down dead matter, releasing carbon dioxide and returning nutrients to the soil. Fossil fuels form only over very long periods."
    hints:
      - "Think about what decomposers do with the carbon in dead matter."
      - "Consider whether the decomposers' respiration returns a gas to the environment."
      - "Eliminate options that describe photosynthesis or fossil formation."
    diagram: null
    confidence: low
  - topic: nutrient_cycles
    type: mcq
    difficulty: hard
    role: transfer
    stem: "After harvest, a farmer leaves the roots of a legume crop in the soil. How does this practice improve the fertility of the soil for a later crop?"
    correct: "Nodule bacteria leave fixed nitrogen in the soil for later crops"
    unit: ""
    wrong:
      - {text: "Roots release oxygen that fixes nitrogen gas into the soil", mistake: "assumes roots directly fix nitrogen"}
      - {text: "Roots absorb extra nitrates that the next crop needs", mistake: "reverses the flow of nutrients"}
      - {text: "Roots store carbon dioxide permanently in the soil", mistake: "ignores nitrogen and overstates carbon storage"}
    explanation: "Legume root nodules fix nitrogen. As roots and plant residues decay, nitrogen compounds enrich the soil for subsequent crops, which reduces the need for added fertiliser."
    hints:
      - "Think about what happens to nitrogen held in root nodules when plant parts decay."
      - "Consider which nutrient the legume adds to the soil rather than removes."
      - "Eliminate options where a gas is stored or roots absorb more nutrients."
    diagram: "Draw a legume root system with nodules, an arrow from the nodules into the soil showing nitrogen compounds, and a second arrow to a following crop."
    confidence: low
  - topic: nutrient_cycles
    type: mcq
    difficulty: hard
    role: apply
    stem: "Which process most directly returns nitrogen from soil compounds back to the atmosphere as a gas?"
    correct: "Denitrification by certain bacteria"
    unit: ""
    wrong:
      - {text: "Nitrification", mistake: "confuses the oxidation of ammonia with the release of gas"}
      - {text: "Ammonification", mistake: "assumes decay releases nitrogen gas"}
      - {text: "Photosynthesis", mistake: "assumes plants release nitrogen gas"}
    explanation: "Denitrifying bacteria reduce nitrates in waterlogged or poorly aerated soil to nitrogen gas, which escapes to the atmosphere. Nitrification and ammonification are other steps in the nitrogen cycle."
    hints:
      - "Think about bacteria that convert nitrates into gaseous nitrogen."
      - "Consider a step that reverses the fixing of nitrogen into compounds."
      - "Eliminate steps that make nitrates or release ammonia."
    diagram: null
    confidence: low
