class: 9
subject: biology
chapter: tissues
drafted_by: "claude-haiku-5.5 (unchecked draft)"
items:
  - topic: plant_tissues
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which plant tissue transports water and minerals from the roots to the rest of the plant?"
    correct: "Xylem"
    unit: ""
    wrong:
      - {text: "Phloem", mistake: "swaps water transport with food transport"}
      - {text: "Parenchyma", mistake: "assumes the storage tissue also moves water"}
      - {text: "Epidermis", mistake: "thinks the outer layer carries materials internally"}
    explanation: "Xylem conducts water and dissolved minerals upward from the roots. At maturity its vessels and tracheids are dead cells with lignified walls."
    hints:
      - "Think about the tissue that carries materials upward from the roots."
      - "Consider which tissue is made of dead, hollow cells with thick walls."
      - "Eliminate tissues that move food or only cover the surface."
    diagram: null
    confidence: high
  - topic: plant_tissues
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which tissue forms the growing tips of roots and stems and keeps dividing to make new cells?"
    correct: "Meristematic tissue"
    unit: ""
    wrong:
      - {text: "Sclerenchyma", mistake: "assumes the hard tissues are the ones that divide"}
      - {text: "Collenchyma", mistake: "confuses flexible support tissue with dividing tissue"}
      - {text: "Phloem", mistake: "thinks the food-carrying tissue is where growth happens"}
    explanation: "Meristematic tissue has young, thin-walled cells that divide repeatedly. It is found at root and shoot tips and in the cambium, and it gives rise to the permanent tissues."
    hints:
      - "Think about the tissue present wherever a plant keeps lengthening."
      - "Consider which tissue has cells that are actively dividing."
      - "Eliminate mature support and transport tissues."
    diagram: null
    confidence: high
  - topic: plant_tissues
    type: mcq
    difficulty: medium
    role: explain
    stem: "A plant needs stems that bend in the wind without breaking. Which living permanent tissue, with unevenly thickened corners, gives this flexible support?"
    correct: "Collenchyma"
    unit: ""
    wrong:
      - {text: "Sclerenchyma", mistake: "picks the dead, rigid tissue that cannot bend"}
      - {text: "Parenchyma", mistake: "assumes thin-walled cells give strength"}
      - {text: "Xylem", mistake: "chooses the water-conducting tissue as the main support"}
    explanation: "Collenchyma is a living permanent tissue whose cell walls are thickened unevenly, mainly at the corners. It gives flexible support to growing stems and leaves."
    hints:
      - "Consider which permanent tissue has living cells."
      - "Think about tissues whose walls are thickened unevenly at the corners."
      - "Eliminate tissues made only of dead cells."
    diagram: "Draw a cross-section of a young stem showing the outer cortex with cells whose corners are thickened. Label the thick corners and the central vascular bundles."
    confidence: high
  - topic: plant_tissues
    type: mcq
    difficulty: medium
    role: recall
    stem: "Which phloem element is joined end to end with perforated end walls and carries sugary sap through the plant?"
    correct: "Sieve tubes"
    unit: ""
    wrong:
      - {text: "Tracheids", mistake: "moves food with the water-conducting cells"}
      - {text: "Companion cells", mistake: "assumes the helper cells carry the main load"}
      - {text: "Xylem vessels", mistake: "uses the xylem name for food transport"}
    explanation: "Sieve tube elements are stacked end to end with perforated sieve plates and carry sap rich in sugars. Companion cells beside them support their activity."
    hints:
      - "Think about the long tubes with perforated end walls."
      - "Consider which phloem cells lack a nucleus when mature."
      - "Eliminate cell types that belong only to the xylem."
    diagram: null
    confidence: high
  - topic: plant_tissues
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A ring of bark is removed all the way around a woody stem. Within a few weeks the tissue just above the ring swells. Which tissue was cut, causing this buildup?"
    correct: "Phloem"
    unit: ""
    wrong:
      - {text: "Xylem", mistake: "assumes the water channel was blocked and water pressure caused the swelling"}
      - {text: "Epidermis", mistake: "thinks only the outer protective layer carries food"}
      - {text: "Meristem", mistake: "assumes growth itself caused the swelling"}
    explanation: "Removing a ring of bark cuts the phloem that carries sugars downward from the leaves. Sugars pile up above the ring, which causes the swelling."
    hints:
      - "Think about which tissue carries food downward from the leaves."
      - "Consider what happens above a block in the movement of food."
      - "Eliminate water-only tissues, since the ring affected food movement."
    diagram: null
    confidence: high
  - topic: plant_tissues
    type: mcq
    difficulty: hard
    role: apply
    stem: "Two bean-shaped cells control a small pore on the leaf surface and close it when they lose water. Which tissue layer of the leaf contains these cells?"
    correct: "Epidermis"
    unit: ""
    wrong:
      - {text: "Mesophyll", mistake: "places the gas-exchange pores inside the photosynthetic layer"}
      - {text: "Xylem", mistake: "assumes guard cells belong to the water channel"}
      - {text: "Cambium", mistake: "confuses pore-controlling cells with growth tissue"}
    explanation: "Stomata are pores bounded by guard cells in the epidermis, the outer protective layer of the leaf. When the guard cells lose water they become limp and the pore closes."
    hints:
      - "Think about the outermost layer of the leaf."
      - "Consider which layer is exposed to air and contains the pores."
      - "Eliminate the layers that lie inside the leaf."
    diagram: "Draw a leaf cross-section with the upper and lower outer layers labelled, a small pore between two bean-shaped guard cells, and the green cells below labelled as the inner layer."
    confidence: high
  - topic: animal_tissues
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which animal tissue carries signals in the form of electrical impulses throughout the body?"
    correct: "Nervous tissue"
    unit: ""
    wrong:
      - {text: "Muscular tissue", mistake: "thinks contraction is the signal-carrying job"}
      - {text: "Epithelial tissue", mistake: "assumes a lining tissue also conducts impulses"}
      - {text: "Connective tissue", mistake: "credits blood with carrying nerve impulses"}
    explanation: "Nervous tissue is made of neurons that receive stimuli and transmit impulses rapidly. It is found in the brain, spinal cord and nerves."
    hints:
      - "Think about the cells built to send messages quickly."
      - "Consider which tissue includes neurons."
      - "Eliminate tissues whose main job is covering the body or moving it."
    diagram: null
    confidence: high
  - topic: animal_tissues
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which tissue forms the thin sheets that cover the outer surface of the body and line the inside of the mouth?"
    correct: "Epithelial tissue"
    unit: ""
    wrong:
      - {text: "Connective tissue", mistake: "assumes the skin is mainly made of fat and fibres"}
      - {text: "Muscular tissue", mistake: "thinks surface layers are made of contractile cells"}
      - {text: "Nervous tissue", mistake: "links skin sensation with the type of surface tissue"}
    explanation: "Epithelial tissue forms continuous sheets of tightly packed cells. It covers body surfaces, lines cavities and tubes, and is involved in protection, absorption and secretion."
    hints:
      - "Think about the tissue that forms sheets covering body surfaces."
      - "Consider which tissue lines cavities and tubes and protects them."
      - "Eliminate tissues mainly built for signalling or pulling."
    diagram: null
    confidence: high
  - topic: animal_tissues
    type: mcq
    difficulty: medium
    role: explain
    stem: "Blood, bone and fat tissue differ from covering tissue in one main way. Which feature is this?"
    correct: "A large amount of non-living matrix between the cells"
    unit: ""
    wrong:
      - {text: "Cells that contract to produce movement", mistake: "assigns a muscle feature to these tissues"}
      - {text: "Cells packed in tight sheets with almost no material between them", mistake: "assumes the covering-tissue pattern applies to all tissues"}
      - {text: "Cells that send electrical impulses along long fibres", mistake: "credits the nerve feature to blood and bone"}
    explanation: "Connective tissues have cells scattered within an abundant extracellular matrix, such as the plasma of blood or the mineral matrix of bone. Covering epithelium has cells packed closely with little matrix between them."
    hints:
      - "Think about the material that fills the spaces between cells in these tissues."
      - "Compare how tightly the cells in these tissues are packed."
      - "Eliminate options that describe contraction or impulse conduction."
    diagram: "Draw two small panels: on the left, scattered cells sitting in a broad matrix with fibres, labelled as connective tissue; on the right, a sheet of tightly packed cells labelled as covering tissue."
    confidence: medium
  - topic: animal_tissues
    type: mcq
    difficulty: medium
    role: recall
    stem: "Which type of muscle is found in the walls of the stomach and intestines and works without conscious control?"
    correct: "Smooth muscle"
    unit: ""
    wrong:
      - {text: "Skeletal muscle", mistake: "assumes all muscles are under conscious control"}
      - {text: "Cardiac muscle", mistake: "treats heart muscle as the type found in digestive walls"}
      - {text: "Striated connective tissue", mistake: "confuses muscle with a supporting tissue"}
    explanation: "Smooth muscle has unstriated, spindle-shaped cells and contracts involuntarily. It is found in the walls of the digestive tract, blood vessels and other internal organs."
    hints:
      - "Think about muscle that does not look striped under the microscope."
      - "Consider the muscles of internal organs that work without will."
      - "Eliminate voluntary muscle types."
    diagram: null
    confidence: high
  - topic: animal_tissues
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A tissue in the heart contracts strongly, looks striped under the microscope, and keeps working continuously without tiring. Which tissue is this?"
    correct: "Cardiac muscle"
    unit: ""
    wrong:
      - {text: "Smooth muscle", mistake: "assumes all involuntary muscle is the same type"}
      - {text: "Skeletal muscle", mistake: "credits voluntary striated muscle with continuous action"}
      - {text: "Nervous tissue", mistake: "mixes up impulse conduction with contraction"}
    explanation: "Cardiac muscle is striated like skeletal muscle but involuntary like smooth muscle. Its branched cells are interconnected, which lets the heart beat continuously."
    hints:
      - "Think about the striped muscle found in only one organ."
      - "Consider which muscle type is involuntary yet striated."
      - "Eliminate types that are not found in the heart."
    diagram: null
    confidence: high
  - topic: animal_tissues
    type: mcq
    difficulty: hard
    role: apply
    stem: "A tendon joins a muscle to a bone and must carry strong pulls without stretching much. Which tissue is the tendon mainly made of?"
    correct: "Dense fibrous connective tissue"
    unit: ""
    wrong:
      - {text: "Loose connective tissue", mistake: "ignores the strength needed to transmit pulling force"}
      - {text: "Cardiac muscle", mistake: "assumes tendons are contracting tissue"}
      - {text: "Epithelial tissue", mistake: "treats a tendon as a protective lining"}
    explanation: "Tendons are made of dense fibrous connective tissue, with collagen fibres arranged in parallel. This gives them strength to transmit force from muscle to bone."
    hints:
      - "Think about which tissue type holds structures together and is rich in fibres."
      - "Consider whether a tendon is mainly made of contracting cells."
      - "Eliminate tissues whose main role is covering or signalling."
    diagram: "Draw a tendon connecting a muscle block to a bone block, with a magnified inset showing parallel fibres labelled as dense fibrous connective tissue."
    confidence: medium
