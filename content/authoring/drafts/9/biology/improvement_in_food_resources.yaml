items:
  - topic: crop_improvement
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the main aim of crop improvement programmes?"
    correct: "Higher yield with better quality and resistance to pests and disease"
    unit: ""
    wrong:
      - {text: "Making crops taller only for appearance", mistake: "treats looks as the goal"}
      - {text: "Reducing the number of crops grown", mistake: "thinks fewer crops improve the food supply"}
      - {text: "Replacing all local crops with imported varieties", mistake: "assumes imports always suit local conditions"}
    explanation: "Crop improvement aims to raise yield and quality while building resistance to pests, diseases and stress. Breeding and selection are the main tools."
    hints:
      - "Think about what farmers want from a crop beyond its looks."
      - "Consider the goals of plant breeding for food supply."
      - "Eliminate aims that reduce food or ignore yield."
    diagram: null
    confidence: low
  - topic: crop_improvement
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which method crosses two plants with desirable traits so that the offspring can carry both traits?"
    correct: "Hybridisation"
    unit: ""
    wrong:
      - {text: "Mutation breeding", mistake: "assumes random changes work the same way as crossing"}
      - {text: "Tissue culture", mistake: "confuses cloning with crossing two parents"}
      - {text: "Grafting", mistake: "treats joining plant parts as sexual crossing"}
    explanation: "Hybridisation crosses two genetically different parents to combine useful traits. Selection among the offspring then picks the best combination."
    hints:
      - "Think about combining the genetic material of two parents."
      - "Consider the cross-breeding method used in many crops."
      - "Eliminate methods that rely on random changes or cloning."
    diagram: null
    confidence: low
  - topic: crop_improvement
    type: mcq
    difficulty: medium
    role: explain
    stem: "A wheat variety is bred to resist a fungal disease. Why is disease resistance valued in crop improvement?"
    correct: "Resistant plants lose less of the harvest to disease"
    unit: ""
    wrong:
      - {text: "Resistant plants never need water", mistake: "confuses disease resistance with drought tolerance"}
      - {text: "Resistant plants produce no seeds", mistake: "reverses the reproductive effect of the trait"}
      - {text: "Resistant plants need more pesticide, which raises yield", mistake: "reverses the benefit of resistance"}
    explanation: "Resistant varieties keep more of the crop alive and productive when disease strikes, which stabilises yields. They can also reduce the need for chemical sprays."
    hints:
      - "Think about what happens to the harvest when a crop is infected."
      - "Consider how much of the crop survives an outbreak."
      - "Eliminate options about water, seeds or extra chemicals."
    diagram: null
    confidence: low
  - topic: crop_improvement
    type: mcq
    difficulty: medium
    role: apply
    stem: "Farmers in a dry region want a crop variety that keeps yielding with less water. Which trait should breeders select for?"
    correct: "Drought tolerance"
    unit: ""
    wrong:
      - {text: "Greater plant height", mistake: "assumes tall plants are better suited to dry land"}
      - {text: "Smaller seed size", mistake: "uses smaller seeds as a sign of water saving"}
      - {text: "Thinner leaves that lose more water", mistake: "confuses leaf area with water saving"}
    explanation: "Drought tolerance lets a variety keep growing and yielding when water is scarce, through deep roots, efficient water use or resilient tissues. Breeders select for this in dry regions."
    hints:
      - "Think about a trait that helps a plant survive and produce under limited moisture."
      - "Consider which quality is named after dry conditions."
      - "Eliminate traits that increase water loss or change only the size of the plant."
    diagram: null
    confidence: low
  - topic: crop_improvement
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A breeder crosses a high-yield variety with a disease-resistant one, but the offspring have poor yield. What is the best next step?"
    correct: "Select and backcross offspring to recover high yield with resistance"
    unit: ""
    wrong:
      - {text: "Discard the cross because hybrids never combine traits", mistake: "assumes crosses cannot combine useful traits"}
      - {text: "Keep only the low-yield offspring because they are stable", mistake: "treats low yield as a benefit"}
      - {text: "Clone the disease-prone parent instead", mistake: "ignores the resistance trait"}
    explanation: "Selecting offspring that show both resistance and good yield, then backcrossing them to the high-yield parent, can recover yield while keeping resistance. This is standard breeding practice."
    hints:
      - "Think about how repeated crossing with one parent can restore a lost trait."
      - "Consider whether the offspring of one cross can be screened for both traits."
      - "Eliminate options that abandon the useful trait or keep only the weak plants."
    diagram: null
    confidence: low
  - topic: crop_improvement
    type: mcq
    difficulty: hard
    role: apply
    stem: "Which method would most quickly produce many genetically identical, disease-free plants of an improved variety?"
    correct: "Tissue culture"
    unit: ""
    wrong:
      - {text: "Crossing two wild species", mistake: "assumes crossing gives identical offspring"}
      - {text: "Random seed mixing in a field", mistake: "treats mixing seeds as a way to get uniform plants"}
      - {text: "Waiting for natural mutations in the field", mistake: "assumes mutations are fast and uniform"}
    explanation: "Tissue culture grows many plantlets from a small piece of tissue under sterile conditions. The plantlets are genetically identical to the parent and are often free of pathogens."
    hints:
      - "Think about growing plants from small pieces of tissue in a sterile medium."
      - "Consider which method produces clones quickly."
      - "Eliminate methods that mix genetic material or rely on chance changes."
    diagram: null
    confidence: low
  - topic: animal_husbandry
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the term for the scientific rearing and breeding of livestock and poultry for food and products?"
    correct: "Animal husbandry"
    unit: ""
    wrong:
      - {text: "Horticulture", mistake: "confuses animal care with growing garden plants"}
      - {text: "Sericulture", mistake: "assumes silk farming covers all livestock"}
      - {text: "Forestry", mistake: "treats tree management as animal management"}
    explanation: "Animal husbandry covers the breeding, feeding, housing and health care of livestock, poultry and fish. Its aim is to produce food and other products efficiently."
    hints:
      - "Think about the field that covers the rearing and breeding of livestock."
      - "Consider the field concerned with animal breeding for food and products."
      - "Eliminate fields that deal with plants or trees."
    diagram: null
    confidence: low
  - topic: animal_husbandry
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which type of poultry farming focuses mainly on producing eggs?"
    correct: "Egg-laying poultry"
    unit: ""
    wrong:
      - {text: "Broiler poultry", mistake: "assumes meat birds lay the most eggs"}
      - {text: "Duck rearing for feathers only", mistake: "ignores egg production altogether"}
      - {text: "Turkey farming for meat", mistake: "treats a meat-focused flock as an egg flock"}
    explanation: "Layer birds are bred for high egg production, while broilers are bred for meat. Each type is managed differently."
    hints:
      - "Think about birds whose main product is eggs."
      - "Consider the type of flock that is raised for laying."
      - "Eliminate options that focus mainly on meat."
    diagram: null
    confidence: low
  - topic: animal_husbandry
    type: mcq
    difficulty: medium
    role: explain
    stem: "A dairy farm improves its cattle by crossing local breeds with exotic breeds. Why might a farmer choose this approach?"
    correct: "To gain higher milk yield while keeping some local hardiness"
    unit: ""
    wrong:
      - {text: "To make the cattle grow wool", mistake: "confuses dairy breeding with wool production"}
      - {text: "To remove the need for feeding", mistake: "believes breeding removes the need for feed"}
      - {text: "To lower milk quality for a cheaper sale", mistake: "assumes lower quality is an aim of breeding"}
    explanation: "Crossing exotic and indigenous cattle can combine high milk yield with heat tolerance and disease resistance from local stock. Breeding programmes balance these traits."
    hints:
      - "Think about the trade-off between productivity and survival in the local environment."
      - "Consider the traits that exotic animals usually bring into a cross."
      - "Eliminate options about wool, feeding or lower quality."
    diagram: null
    confidence: low
  - topic: animal_husbandry
    type: mcq
    difficulty: medium
    role: apply
    stem: "A fish farmer keeps a large number of fish in a small pond. Which practice would most help keep the fish healthy?"
    correct: "Monitoring water quality and oxygen levels regularly"
    unit: ""
    wrong:
      - {text: "Adding extra feed to speed up growth without checks", mistake: "assumes more feed is always better"}
      - {text: "Stocking the pond with predatory species only", mistake: "treats predators as a cure for crowding"}
      - {text: "Keeping the water still and unchanged", mistake: "assumes stillness keeps fish healthy"}
    explanation: "Dense stocking can lower dissolved oxygen and raise waste levels, so regular monitoring lets the farmer act early. Good management protects fish health."
    hints:
      - "Think about what fish need from the water in order to breathe."
      - "Consider how crowding can use up something important in the pond."
      - "Eliminate choices that add food without checks or leave the water unmanaged."
    diagram: null
    confidence: low
  - topic: animal_husbandry
    type: mcq
    difficulty: hard
    role: procedure
    stem: "A poultry farm sees a sudden drop in egg output and birds with signs of breathing distress. Which action should be taken first?"
    correct: "Isolate affected birds and contact a veterinarian"
    unit: ""
    wrong:
      - {text: "Increase lighting to boost laying", mistake: "ignores the health signs and treats the problem as a lighting issue"}
      - {text: "Add more birds to dilute the sick flock", mistake: "assumes extra birds reduce disease"}
      - {text: "Switch the whole flock to grain only for a week", mistake: "treats a breathing problem as a diet problem"}
    explanation: "Breathing distress with a sudden drop in laying may signal disease, so isolating affected birds limits spread. Expert advice then identifies the cause and the right treatment."
    hints:
      - "Think about how to stop illness spreading through the flock while getting expert advice."
      - "Consider which step protects healthy birds before the cause is known."
      - "Eliminate options that ignore the health signs or add birds to the flock."
    diagram: null
    confidence: low
  - topic: animal_husbandry
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Which practice in animal husbandry improves the health of livestock and the quality of their products at the same time?"
    correct: "Vaccination and balanced feeding of herds"
    unit: ""
    wrong:
      - {text: "Keeping animals in crowded sheds to save land", mistake: "assumes space savings carry no health cost"}
      - {text: "Using only one feed ingredient all year", mistake: "assumes a single feed meets every nutrient need"}
      - {text: "Breeding only the largest animals regardless of health", mistake: "confuses size with health"}
    explanation: "Vaccination prevents specific diseases, and balanced feeding supports growth and milk or egg output. Together they improve both health and productivity."
    hints:
      - "Think about measures that prevent disease and meet nutritional needs together."
      - "Consider which practice protects against illness through a known method."
      - "Eliminate options that crowd, starve or ignore health in breeding."
    diagram: null
    confidence: low
