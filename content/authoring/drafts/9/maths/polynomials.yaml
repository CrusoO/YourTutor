  - topic: polynomial_basics
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Two non-zero polynomials in one variable are added. Which statement about the degree of the sum is always correct?"
    correct: "The degree of the sum is at most the larger of the two degrees."
    unit: ""
    wrong:
      - {text: "The degree of the sum is always the product of the two degrees.", mistake: "applies the product rule to addition"}
      - {text: "The degree of the sum is always the smaller of the two degrees.", mistake: "assumes the lower degree dominates"}
      - {text: "The degree of the sum is always exactly the larger of the two degrees.", mistake: "ignores cancellation of the leading terms"}
    explanation: "Adding polynomials combines like terms, and the leading terms may cancel, which can lower the degree but never raise it above the larger of the two degrees."
    hints:
      - "Think about what happens to the highest power when you add terms."
      - "Consider whether two leading terms can cancel each other."
      - "Compare the degree of the sum with the two original degrees."
