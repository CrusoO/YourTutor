items:
  - topic: cartesian_plane
    type: mcq
    difficulty: easy
    role: recall
    stem: "In the Cartesian plane, in which quadrant does a point with a negative x-coordinate and a positive y-coordinate lie?"
    correct: "Second quadrant"
    unit: ""
    wrong:
      - {text: "First quadrant", mistake: "ignores the sign of the x-coordinate"}
      - {text: "Third quadrant", mistake: "reads both signs as negative"}
      - {text: "Fourth quadrant", mistake: "swaps the roles of the two coordinates"}
    explanation: "Quadrant II has negative x and positive y values, following the anticlockwise numbering that starts at the top right."
    hints:
      - "Recall how the quadrants are numbered anticlockwise, starting from the top right."
      - "Check the sign of the horizontal coordinate first."
      - "The vertical coordinate decides between the top and the bottom half."
    diagram: "Coordinate axes with origin O, the four quadrants labelled with their numbers, and a point marked in the upper left region."
    confidence: high
  - topic: cartesian_plane
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which name is given to the point where the horizontal and vertical axes meet?"
    correct: "Origin"
    unit: ""
    wrong:
      - {text: "Vertex", mistake: "borrows a term from polygon geometry"}
      - {text: "Abscissa", mistake: "uses the name of the horizontal coordinate for the meeting point"}
      - {text: "Ordinate", mistake: "confuses the vertical coordinate with the meeting point"}
    explanation: "The point where the two axes cross is called the origin, and its coordinates are both zero."
    hints:
      - "Think about the reference point from which all distances are measured."
      - "It is the starting point of both number lines."
      - "Its name is a word for the beginning of something."
    diagram: null
    confidence: high
  - topic: cartesian_plane
    type: mcq
    difficulty: medium
    role: apply
    stem: "A point lies on the x-axis, four units to the left of the origin. What are its coordinates?"
    correct: "(-4, 0)"
    unit: ""
    wrong:
      - {text: "(4, 0)", mistake: "ignores the direction of the movement"}
      - {text: "(0, -4)", mistake: "moves along the wrong axis"}
      - {text: "(-4, 4)", mistake: "moves in both directions"}
    explanation: "A point on the horizontal axis has a y-coordinate of zero, and moving left gives a negative x-coordinate of minus 4."
    hints:
      - "A point on the horizontal axis has no vertical displacement."
      - "Moving left means decreasing the horizontal value."
      - "Write the horizontal value first in the ordered pair."
    diagram: "Horizontal x-axis with the origin marked and a point four units to its left, labelled."
    confidence: high
  - topic: cartesian_plane
    type: numeric
    difficulty: medium
    role: apply
    stem: "The point P with coordinates (3, -4) is reflected in the x-axis. What is the y-coordinate of its image?"
    correct: "4"
    unit: ""
    wrong: []
    explanation: "Reflection in the x-axis keeps the x-coordinate and flips the sign of the y-coordinate, so minus four becomes 4."
    hints:
      - "Reflection in the horizontal axis keeps the horizontal value unchanged."
      - "Think about how the vertical value changes sign."
      - "Read the result from the new vertical position."
    diagram: "Point P in the fourth quadrant and its mirror image across the horizontal axis."
    confidence: high
  - topic: cartesian_plane
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A point has coordinates (a, b) with a less than zero and a times b greater than zero. In which quadrant does it lie?"
    correct: "Third quadrant"
    unit: ""
    wrong:
      - {text: "Second quadrant", mistake: "reads the negative a as the vertical sign"}
      - {text: "Fourth quadrant", mistake: "treats the product condition as requiring a positive b"}
      - {text: "First quadrant", mistake: "ignores the sign of a"}
    explanation: "Since a is negative and the product is positive, b must also be negative, which places the point in the third quadrant."
    hints:
      - "Use the sign of a first."
      - "A positive product requires two signs that match."
      - "Then decide which quadrant has both coordinates negative."
    diagram: "Four-quadrant grid with the quadrants labelled and the region where both coordinates are negative shaded."
    confidence: high
  - topic: cartesian_plane
    type: mcq
    difficulty: hard
    role: transfer
    stem: "The point (-2, 5) is reflected in the line y = x. Which ordered pair is its image?"
    correct: "(5, -2)"
    unit: ""
    wrong:
      - {text: "(-5, 2)", mistake: "reflects through the origin instead of across the line"}
      - {text: "(2, -5)", mistake: "changes the sign of both coordinates"}
      - {text: "(-2, -5)", mistake: "keeps x and changes only the sign of y"}
    explanation: "Reflection in the line y equals x swaps the two coordinates, so (-2, 5) becomes (5, -2)."
    hints:
      - "Think about which line the mirror is."
      - "On that mirror line, each point keeps its position relative to it."
      - "Try swapping the two coordinates in the ordered pair."
    diagram: null
    confidence: high
  - topic: plotting_points
    type: numeric
    difficulty: easy
    role: recall
    stem: "A point is plotted at (2, 5). What is the sum of its two coordinates?"
    correct: "7"
    unit: ""
    wrong: []
    explanation: "The coordinates are 2 and 5, and their sum is 7."
    hints:
      - "Read the horizontal and the vertical values separately."
      - "Add the two readings together."
      - "Check the signs of both values before adding."
    diagram: "Grid with the point marked two units right of the origin and five units up."
    confidence: high
  - topic: plotting_points
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which ordered pair is plotted by moving 3 units left and 1 unit down from the origin?"
    correct: "(-3, -1)"
    unit: ""
    wrong:
      - {text: "(3, -1)", mistake: "ignores the direction of the horizontal move"}
      - {text: "(-1, -3)", mistake: "swaps the horizontal and vertical readings"}
      - {text: "(-3, 1)", mistake: "reverses the direction of the vertical move"}
    explanation: "Moving left gives x equal to minus 3 and moving down gives y equal to minus 1, so the point is (-3, -1)."
    hints:
      - "The horizontal reading comes first in the ordered pair."
      - "Left and down both give negative values."
      - "Write the horizontal value, then the vertical value."
    diagram: null
    confidence: high
  - topic: plotting_points
    type: numeric
    difficulty: medium
    role: apply
    stem: "The points A(1, 3) and B(4, 7) are plotted. What is the horizontal distance between them, in units?"
    correct: "3"
    unit: "units"
    wrong: []
    explanation: "The horizontal distance is the difference of the x-coordinates, 4 minus 1, which is 3."
    hints:
      - "Subtract the horizontal readings of the two points."
      - "Ignore the vertical values for this distance."
      - "Take the positive difference."
    diagram: "Two plotted points on a grid joined by a horizontal dashed segment."
    confidence: high
  - topic: plotting_points
    type: mcq
    difficulty: medium
    role: apply
    stem: "A rectangle has corners at (0, 0), (5, 0), (5, 2) and (0, 2). Which pair is the midpoint of the diagonal from (0, 0) to (5, 2)?"
    correct: "(2.5, 1)"
    unit: ""
    wrong:
      - {text: "(5, 2)", mistake: "reads the far vertex instead of the midpoint"}
      - {text: "(2, 1)", mistake: "rounds the midpoint to whole numbers"}
      - {text: "(2.5, 2)", mistake: "averages only the horizontal coordinates"}
    explanation: "The midpoint averages the coordinates: 0 and 5 give 2.5, and 0 and 2 give 1."
    hints:
      - "Average the horizontal values of the two ends."
      - "Average the vertical values of the two ends separately."
      - "Keep decimals if the average is not a whole number."
    diagram: "Rectangle with corners at the origin, (5, 0), (5, 2) and (0, 2), with the diagonal from the origin to (5, 2) drawn and its midpoint marked."
    confidence: high
  - topic: plotting_points
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A point P lies in the second quadrant, 3 units from the vertical axis and 4 units from the horizontal axis. What is its distance from the origin, in units?"
    correct: "5"
    unit: "units"
    wrong: []
    explanation: "The distance from the origin is the square root of 3 squared plus 4 squared, which is 5 by Pythagoras."
    hints:
      - "Form a right triangle with the origin and the point's projections on the axes."
      - "Square the two perpendicular distances."
      - "Take the square root of their sum."
    diagram: "Second-quadrant point joined to the origin, with a right triangle whose legs are parallel to the axes."
    confidence: high
  - topic: plotting_points
    type: numeric
    difficulty: hard
    role: transfer
    stem: "Three points are plotted at (1, 2), (5, 2) and (1, 8). What is the area of the right triangle they form, in square units?"
    correct: "12"
    unit: "square units"
    wrong: []
    explanation: "The legs are 4 units horizontal and 6 units vertical, so the area is half of 24, which is 12 square units."
    hints:
      - "Find the horizontal side from the two points that share a vertical value."
      - "Find the vertical side from the two points that share a horizontal value."
      - "Use half the product of the two perpendicular sides."
    diagram: "Grid with three plotted points forming a right triangle, with its legs drawn parallel to the axes."
    confidence: high
