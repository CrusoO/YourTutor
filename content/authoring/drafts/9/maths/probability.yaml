    confidence: high
  - topic: theoretical_probability
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A letter is picked at random from the word SCHOOL. What is the probability that it is a vowel?"
    correct: "1/3"
    unit: ""
    wrong:
      - {text: "1/2", mistake: "treats the consonants as if they were vowels"}
      - {text: "1/6", mistake: "counts only one of the two O letters"}
      - {text: "1/5", mistake: "counts the distinct letters instead of every letter"}
    explanation: "The word has six letters, two of which are O, so the probability is 2 out of 6, which simplifies to 1/3."
    hints:
      - "Count the total letters, including repeated ones."
      - "Identify which letters count as vowels."
      - "Count every occurrence of those letters carefully."
    diagram: null
    confidence: high
