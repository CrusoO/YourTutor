items:
  - topic: experimental_probability
    type: numeric
    difficulty: easy
    role: procedure
    stem: "A die is rolled 60 times and a 6 comes up 12 times. What is the experimental probability of rolling a 6, as a decimal?"
    correct: "0.2"
    unit: ""
    wrong: []
    explanation: "The experimental probability is the favourable count over the total number of trials, which is 12 out of 60, giving 0.2."
    hints:
      - "Divide the favourable outcomes by the total number of trials."
      - "Use the count of the outcome you want and the number of rolls."
      - "Write the result as a decimal."
    diagram: null
    confidence: high
  - topic: experimental_probability
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which statement about experimental probability is correct?"
    correct: "It can change when the trials are repeated."
    unit: ""
    wrong:
      - {text: "It is always exactly one sixth for a die.", mistake: "replaces the observed result with the theoretical value"}
      - {text: "It equals the number of trials divided by the favourable outcomes.", mistake: "inverts the ratio"}
      - {text: "It is never written as a decimal.", mistake: "believes results must be written as whole fractions"}
    explanation: "Experimental probability is based on observed results, so it varies between sets of trials and tends towards the theoretical value as the number of trials grows."
    hints:
      - "Think about whether repeated experiments always give the same count."
      - "Consider how the estimate behaves as the number of trials grows."
      - "Compare an experimental result with the theoretical value."
    diagram: null
    confidence: high
  - topic: experimental_probability
    type: numeric
    difficulty: medium
    role: apply
    stem: "A coin is tossed 200 times and lands heads 84 times. What is the experimental probability of heads, as a decimal?"
    correct: "0.42"
    unit: ""
    wrong: []
    explanation: "84 divided by 200 equals 0.42."
    hints:
      - "Divide the number of heads by the total number of tosses."
      - "Simplify the fraction before converting it."
      - "Convert the fraction into a decimal."
    diagram: null
    confidence: high
  - topic: experimental_probability
    type: mcq
    difficulty: medium
    role: apply
    stem: "A spinner landed on red in 18 of its 60 spins. What is the experimental probability of landing on red?"
    correct: "0.3"
    unit: ""
    wrong:
      - {text: "0.33", mistake: "divides 18 by 54 by mistake"}
      - {text: "0.6", mistake: "divides the total spins by the red count"}
      - {text: "3.3", mistake: "shifts the decimal point"}
    explanation: "Red occurred 18 times in 60 spins, and 18 divided by 60 equals 0.3."
    hints:
      - "Count the red outcomes and the total number of spins."
      - "The probability is the red count divided by the total."
      - "Check the size of your answer: it must lie between 0 and 1."
    diagram: null
    confidence: high
  - topic: experimental_probability
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A ball is drawn from a bag 120 times, with replacement, and the outcome blue has an experimental probability of 0.25. How many draws gave blue?"
    correct: "30"
    unit: ""
    wrong: []
    explanation: "The number of blue draws is 0.25 times 120, which equals 30."
    hints:
      - "Multiply the experimental probability by the number of trials."
      - "Use the definition of experimental probability as a ratio of counts."
      - "Check that the count you get is a whole number."
    diagram: null
    confidence: high
  - topic: experimental_probability
    type: mcq
    difficulty: hard
    role: explain
    stem: "A pin is tossed 400 times and lands point up 240 times. Which statement is best supported by this experiment?"
    correct: "The estimate for point up is 0.6, but one experiment does not fix the probability exactly."
    unit: ""
    wrong:
      - {text: "The probability of point up is exactly 0.6 for every pin.", mistake: "treats one experiment as a fixed law"}
      - {text: "The probability of point up is 0.4.", mistake: "reads the count for point down as the point up result"}
      - {text: "The experiment proves that the pin is biased.", mistake: "draws a firm conclusion from one set of trials"}
    explanation: "The estimate is 240 divided by 400, which is 0.6, but it is only an estimate from one experiment, so it does not establish an exact probability."
    hints:
      - "Compute the ratio of point up results to all tosses."
      - "Consider whether a single experiment establishes a fixed value."
      - "Distinguish an estimate from an exact probability."
    diagram: null
    confidence: high
  - topic: theoretical_probability
    type: numeric
    difficulty: easy
    role: recall
    stem: "A fair die is rolled once. What is the probability of getting an even number, as a decimal?"
    correct: "0.5"
    unit: ""
    wrong: []
    explanation: "The even outcomes are 2, 4 and 6, so 3 favourable outcomes out of 6 equally likely outcomes gives 0.5."
    hints:
      - "List the equally likely outcomes of one roll."
      - "Count the outcomes that are even."
      - "Divide the favourable count by the total number of outcomes."
    diagram: null
    confidence: high
  - topic: theoretical_probability
    type: mcq
    difficulty: easy
    role: recall
    stem: "Two fair coins are tossed. What is the probability of getting exactly one head?"
    correct: "1/2"
    unit: ""
    wrong:
      - {text: "1/4", mistake: "counts only one of the four outcomes"}
      - {text: "1/3", mistake: "treats the outcomes as three categories"}
      - {text: "3/4", mistake: "counts every outcome that has at least one head"}
    explanation: "The outcomes are HH, HT, TH and TT, and two of the four have exactly one head, so the probability is 1/2."
    hints:
      - "List all the equally likely outcomes of two tosses."
      - "Identify which outcomes have exactly one head."
      - "Divide the favourable count by the total."
    diagram: null
    confidence: high
