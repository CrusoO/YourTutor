  - topic: theoretical_probability
    type: mcq
    difficulty: medium
    role: apply
    stem: "A card is drawn from a standard pack of 52 cards. What is the probability that it is a king?"
    correct: "1/13"
    unit: ""
    wrong:
      - {text: "1/4", mistake: "uses the number of suits instead of the number of kings"}
      - {text: "4/13", mistake: "divides the kings by the number of ranks"}
      - {text: "1/52", mistake: "treats the event as one specific card"}
    explanation: "There are 4 kings among 52 equally likely cards, and 4 out of 52 simplifies to 1 in 13."
    hints:
      - "Count the kings in the pack."
      - "Count all the cards in the pack."
      - "Simplify the fraction you get."
    diagram: null
    confidence: high
  - topic: theoretical_probability
    type: numeric
    difficulty: hard
    role: transfer
    stem: "Two fair dice are rolled together. What is the probability that the two faces add up to 7, written as a decimal to three decimal places?"
    correct: "0.167"
    unit: ""
    wrong: []
    explanation: "Six of the 36 equally likely pairs give a sum of 7, and 6 divided by 36 is about 0.167."
    hints:
      - "List the pairs of faces whose sum is seven."
      - "Count all the equally likely pairs of faces."
      - "Write the fraction and round to the required places."
