    stem: "A chord of a circle subtends an angle of 130 degrees at the centre. What angle does the same chord subtend at a point on the major arc?"
    correct: "65 degrees"
    unit: ""
    wrong:
      - {text: "130 degrees", mistake: "copies the central angle"}
      - {text: "50 degrees", mistake: "subtracts the central angle from a straight angle"}
