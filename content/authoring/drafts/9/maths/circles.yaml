  - topic: angles_subtended_by_chords
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A chord of a circle subtends an angle of 110 degrees at a point on the minor arc. What angle does the same chord subtend at a point on the major arc, in degrees?"
    correct: "70"
    unit: "degrees"
    wrong: []
    explanation: "Angles at points on opposite arcs of a chord are supplementary, so 180 minus 110 is 70 degrees."
    hints:
      - "Points on opposite arcs of the chord form a cyclic quadrilateral."
      - "Opposite angles of a cyclic quadrilateral are supplementary."
      - "Subtract the given angle from a straight angle."
    diagram: "Circle with a chord, a point on the minor arc and a point on the major arc, both joined to the ends of the chord."
    confidence: high
  - topic: cyclic_quadrilaterals
    type: numeric
    difficulty: easy
    role: recall
    stem: "In a cyclic quadrilateral ABCD, angle A is 75 degrees. What is the opposite angle C, in degrees?"
    correct: "105"
    unit: "degrees"
    wrong: []
    explanation: "Opposite angles of a cyclic quadrilateral are supplementary, so C is 180 minus 75, which is 105 degrees."
    hints:
      - "Opposite angles of a cyclic quadrilateral add up to a known total."
      - "Subtract the given angle from that total."
      - "Check that the two opposite angles together fit the total."
    diagram: "Cyclic quadrilateral ABCD inscribed in a circle, with angle A labelled and angle C unknown."
    confidence: high
  - topic: cyclic_quadrilaterals
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which statement about a cyclic quadrilateral is correct?"
    correct: "Opposite angles add up to 180 degrees."
    unit: ""
    wrong:
      - {text: "Adjacent angles are always equal.", mistake: "assumes all quadrilaterals have equal adjacent angles"}
      - {text: "All four angles are equal.", mistake: "treats every cyclic quadrilateral as a square"}
      - {text: "The four angles add up to 270 degrees.", mistake: "uses the angle total of a different figure"}
    explanation: "A quadrilateral with all four vertices on a circle has opposite angles that are supplementary."
    hints:
      - "Think about which pairs of angles sit opposite each other."
      - "Use the total for the angles of a quadrilateral."
      - "Consider which relation the opposite pairs satisfy."
    diagram: "Quadrilateral with all four vertices on a circle, with the opposite angles marked."
    confidence: high
