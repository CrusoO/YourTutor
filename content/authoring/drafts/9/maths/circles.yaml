items:
  - topic: circle_terms
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which term names a straight line segment whose two ends both lie on the circle?"
    correct: "chord"
    unit: ""
    wrong:
      - {text: "arc", mistake: "confuses a curved part of the circle with a straight segment"}
      - {text: "sector", mistake: "names the region between two radii instead of a segment"}
      - {text: "radius", mistake: "uses the term for a segment that starts at the centre"}
    explanation: "A chord joins two points on the circle with a straight segment, while an arc is a curved part of the circle itself."
    hints:
      - "Think about whether the segment bends or stays straight."
      - "Both ends of the segment must lie on the circle."
      - "Separate the straight segments from the curved boundary."
    diagram: "Circle with a straight segment joining two points on its boundary, and a curved part labelled separately."
    confidence: high
  - topic: circle_terms
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which region is bounded by two radii and the arc between their ends?"
    correct: "sector"
    unit: ""
    wrong:
      - {text: "segment", mistake: "uses a region bounded by a chord instead of two radii"}
      - {text: "chord", mistake: "names a line rather than a region"}
      - {text: "annulus", mistake: "takes a ring-shaped region for a region bounded by radii"}
    explanation: "A sector is bounded by two radii and the arc between their ends, like a slice cut from a round shape."
    hints:
      - "Count the boundary pieces: two straight radii and one curve."
      - "Think of a slice cut from a round object."
      - "The region is not bounded by a straight chord."
    diagram: null
    confidence: high
  - topic: circle_terms
    type: numeric
    difficulty: medium
    role: apply
    stem: "A chord of a circle with radius 13 cm lies 5 cm from the centre. What is the length of the chord, in cm?"
    correct: "24"
    unit: "cm"
    wrong: []
    explanation: "Half the chord is the square root of 169 minus 25, which is 12 cm, so the full chord is 24 cm."
    hints:
      - "Draw the perpendicular from the centre to the chord, which bisects the chord."
      - "Form a right triangle with the radius as the hypotenuse."
      - "Apply Pythagoras to find half the chord, then double it."
    diagram: "Circle with a chord drawn, the perpendicular from the centre to the chord marked, and the radius to one end of the chord."
    confidence: high
  - topic: circle_terms
    type: mcq
    difficulty: medium
    role: explain
    stem: "Which pair of terms names the boundary curve of a circle and the flat region enclosed by that boundary?"
    correct: "circumference and disc"
    unit: ""
    wrong:
      - {text: "arc and sector", mistake: "pairs parts of the boundary with a region"}
      - {text: "radius and diameter", mistake: "names straight segments rather than a curve and a region"}
      - {text: "chord and segment", mistake: "confuses the chord with the boundary curve"}
    explanation: "The circumference is the boundary curve and the disc is the flat region inside it."
    hints:
      - "One term names the length of the boundary, and the other names the flat shape inside."
      - "Look for a term for the flat region covering the inside of the circle."
      - "Separate the terms for curves from the terms for straight segments."
    diagram: null
    confidence: high
  - topic: circle_terms
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A chord AB of a circle cuts off a region between itself and the arc. Which term names that region?"
    correct: "segment"
    unit: ""
    wrong:
      - {text: "sector", mistake: "uses the region bounded by two radii instead"}
      - {text: "annulus", mistake: "chooses a ring-shaped region for a region cut off by a chord"}
      - {text: "arc", mistake: "names only the curved boundary"}
    explanation: "The segment is the region between a chord and the arc it cuts off, while a sector needs two radii as its straight edges."
    hints:
      - "The chord is a straight line, so the region has one straight edge."
      - "Compare with the region bounded by two radii."
      - "Identify the term for a region cut off by a chord."
    diagram: "Circle with a chord drawn and the minor region between the chord and the arc shaded."
    confidence: high
  - topic: circle_terms
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A line from the centre of a circle meets a chord at right angles. Which statement is always true?"
    correct: "It cuts the chord into two equal parts."
    unit: ""
    wrong:
      - {text: "It is equal in length to the radius.", mistake: "confuses the perpendicular from the centre with a radius"}
      - {text: "It touches the circle at exactly one point.", mistake: "confuses this line with a tangent"}
      - {text: "It is twice the length of the chord.", mistake: "doubles the chord instead of comparing the two lines correctly"}
    explanation: "The perpendicular from the centre to a chord bisects the chord, a standard property that follows from the symmetry of the circle."
    hints:
      - "Consider how the perpendicular interacts with the two ends of the chord."
      - "A tangent touches the circle at only one point, so compare that idea."
      - "Think about the symmetry of the circle about that line."
    diagram: "Circle with a chord and a perpendicular from the centre meeting the chord at its midpoint."
    confidence: high
  - topic: angles_subtended_by_chords
    type: mcq
    difficulty: easy
    role: recall
    stem: "An arc subtends an angle of 70 degrees at the centre. What angle does the same arc subtend at a point on the remaining part of the circle?"
    correct: "35 degrees"
    unit: ""
    wrong:
      - {text: "70 degrees", mistake: "copies the central angle to the circumference"}
      - {text: "140 degrees", mistake: "doubles the central angle"}
      - {text: "110 degrees", mistake: "uses a supplementary angle instead of the relation"}
    explanation: "The angle at the centre is twice the angle at the circumference on the same arc, so 70 halves to 35 degrees."
    hints:
      - "Recall how the central angle compares with the angle at the circumference."
      - "Divide the central angle by the factor that relates the two angles."
      - "Check that the factor is applied in the right direction."
    diagram: "Circle with a central angle and an angle at the circumference both standing on the same arc."
    confidence: high
  - topic: angles_subtended_by_chords
    type: numeric
    difficulty: easy
    role: recall
    stem: "A chord subtends an angle of 40 degrees at a point on the circumference. What is the angle that the same chord subtends at the centre, in degrees?"
    correct: "80"
    unit: "degrees"
    wrong: []
    explanation: "The central angle is twice the angle at the circumference, so 2 times 40 is 80 degrees."
    hints:
      - "The central angle is related to the angle at the circumference by a fixed factor."
      - "Multiply the circumference angle by that factor."
      - "Check that the answer is larger than the circumference angle."
    diagram: "Circle with a chord, the centre marked, and the angles at the centre and at the circumference drawn."
    confidence: high
  - topic: angles_subtended_by_chords
    type: numeric
    difficulty: medium
    role: apply
    stem: "Two points on the same arc of a circle subtend angles of 3x degrees and x + 30 degrees. What is x?"
    correct: "15"
    unit: ""
    wrong: []
    explanation: "Equal angles in the same segment give 3x equal to x plus 30, so 2x equals 30 and x is 15."
    hints:
      - "Angles in the same segment on the same chord are equal."
      - "Set the two expressions equal to each other."
      - "Collect the letter terms and solve."
    diagram: "Circle with a chord and two points on the same side of it, each joined to the chord ends and the angles labelled."
    confidence: high
  - topic: angles_subtended_by_chords
    type: mcq
