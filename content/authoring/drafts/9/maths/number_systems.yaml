  - topic: laws_of_exponents
    type: mcq
    difficulty: hard
    role: transfer
    stem: "For a positive real number a and whole numbers m and n, which statement about nested powers is correct?"
    correct: "(a to the power m) to the power n equals a to the power m times n."
    unit: ""
    wrong:
      - {text: "(a to the power m) to the power n equals a to the power m plus n.", mistake: "adds the exponents when powers are nested"}
      - {text: "(a to the power m) to the power n equals a to the power m minus n.", mistake: "subtracts the exponents of nested powers"}
      - {text: "(a to the power m) to the power n equals a to the power m divided by n.", mistake: "divides the exponents"}
    explanation: "Raising a power to another power multiplies the exponents, so the nested form equals a raised to the product of the two exponents."
    hints:
      - "Write out the nested power as repeated multiplication of the base."
      - "Count the total number of copies of the base."
      - "Relate that count to the two exponents."
    diagram: null
    confidence: high
