  - topic: rational_irrational
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A rational number is added to an irrational number. Which statement about the sum is always true?"
    correct: "The sum is irrational."
    unit: ""
    wrong:
      - {text: "The sum is rational.", mistake: "assumes the irrational part cancels out"}
      - {text: "The sum is always an integer.", mistake: "confuses sums with products of integers"}
      - {text: "The sum is rational only when the rational part is zero.", mistake: "treats zero as the only case without checking the argument"}
    explanation: "If the sum were rational, subtracting the rational part would leave the irrational number equal to a difference of two rationals, which is rational. That contradiction means the sum must be irrational."
    hints:
      - "Suppose the sum is rational and then subtract the rational part."
      - "Check whether a rational number minus a rational number stays rational."
      - "Think about what that subtraction does to the irrational term."
    diagram: null
    confidence: high
  - topic: rational_irrational
    type: numeric
    difficulty: hard
    role: procedure
    stem: "The decimal 0.272727 with the two-digit block 27 repeating forever is written as a fraction p over q in lowest terms. What is q?"
    correct: "11"
    unit: ""
    wrong: []
    explanation: "Let x equal the repeating decimal, so multiplying by one hundred and subtracting x gives 99x equal to 27. The fraction 27 over 99 reduces to 3 over 11, so q is 11."
    hints:
      - "Let the number be a letter and multiply it by a power of ten that shifts one full block."
      - "Subtract the original number to remove the repeating part."
      - "Simplify the resulting fraction by its greatest common factor."
    diagram: null
    confidence: high
  - topic: irrationals_number_line
    type: mcq
    difficulty: easy
    role: recall
    stem: "A point must be placed exactly at the square root of two on a number line. Which construction does this correctly?"
    correct: "Draw a right triangle with two unit legs and use its hypotenuse as the radius of an arc from zero."
    unit: ""
    wrong:
      - {text: "Divide the segment from zero to two into two equal parts.", mistake: "treats the root as the midpoint of two integers"}
      - {text: "Mark the point at one point four by eye and call it the root.", mistake: "accepts an approximation as the exact position"}
      - {text: "Draw a right triangle with legs of two units and use its hypotenuse directly.", mistake: "forgets that a triangle with legs of two has a hypotenuse that is not the root of two"}
    explanation: "A right triangle with two unit legs has a hypotenuse of root two by Pythagoras. An arc centred at zero with that radius meets the number line at the exact point."
    hints:
      - "Think about a right triangle whose two shorter sides are both one unit."
      - "Let the longest side of that triangle set the radius of a compass arc."
      - "The construction must keep the length exact rather than estimated."
    diagram: "Number line from zero to two with a unit square drawn above the segment from zero to one; its diagonal is marked and an arc is drawn from zero to meet the line."
    confidence: high
  - topic: irrationals_number_line
    type: numeric
    difficulty: easy
    role: recall
    stem: "Two legs of a right triangle are each one unit long. Give the length of the hypotenuse in units, rounded to two decimal places."
    correct: "1.41"
    unit: "units"
    wrong: []
    explanation: "The hypotenuse is the square root of two, which is about 1.4142 and rounds to 1.41."
    hints:
      - "Apply the relation between the squares of the legs and the square of the hypotenuse."
      - "Add the squares of the two known sides."
      - "Take the square root and round at the second decimal place."
    diagram: "Right triangle with two equal legs each marked one unit, and the hypotenuse labelled as the unknown side."
    confidence: high
  - topic: irrationals_number_line
    type: mcq
    difficulty: medium
    role: explain
    stem: "Which number lies strictly between two and three and cannot be written as a fraction of two integers?"
    correct: "sqrt(5)"
    unit: ""
    wrong:
      - {text: "2.5", mistake: "takes any decimal between the two endpoints as irrational"}
      - {text: "sqrt(9)", mistake: "counts the endpoint three as strictly inside the interval"}
      - {text: "sqrt(4)", mistake: "takes the endpoint two as inside the interval"}
    explanation: "The square root of five is about 2.236, which lies between two and three, and five is not a perfect square, so the root is irrational."
    hints:
      - "Find the squares of the two endpoints first."
      - "Look for a number whose square falls between those squares."
      - "Check whether the number is a perfect square before deciding."
