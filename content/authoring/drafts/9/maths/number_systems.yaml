  - topic: irrationals_number_line
    type: mcq
    difficulty: hard
    role: transfer
    stem: "To mark the square root of five on a number line, a right triangle with legs of one and two is drawn. What length must the hypotenuse have?"
    correct: "sqrt(5)"
    unit: ""
    wrong:
      - {text: "3", mistake: "adds the legs instead of using the squares of the legs"}
      - {text: "sqrt(3)", mistake: "takes the root of the sum of the legs rather than of the sum of their squares"}
      - {text: "2.5", mistake: "averages the two legs"}
    explanation: "The squares of the legs are one and four, which add to five, so the hypotenuse is the square root of five."
    hints:
      - "Square each leg before adding anything."
      - "The squares of the legs add up to the square of the hypotenuse."
      - "Take the square root of the total only at the end."
    diagram: "Right triangle with a horizontal leg of length two and a vertical leg of length one, placed at the origin of a number line, with the hypotenuse arc drawn to the line."
    confidence: high
  - topic: irrationals_number_line
    type: numeric
