  - topic: rational_irrational
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which of the following numbers has a decimal expansion that neither terminates nor repeats?"
    correct: "sqrt(7)"
    unit: ""
    wrong:
      - {text: "1/3", mistake: "confuses a repeating decimal with a non-repeating one"}
      - {text: "2.75", mistake: "treats a terminating decimal as irrational"}
      - {text: "sqrt(16)", mistake: "does not simplify the root before classifying the number"}
    explanation: "The square root of a prime is irrational, so its decimal form goes on forever without a repeating block. One third repeats, two point seven five terminates, and the square root of sixteen simplifies to four, so all three are rational."
    hints:
      - "Ask whether the number can be written as a fraction of two whole numbers."
      - "Simplify any root first, then look at its decimal form."
      - "Recall which kinds of decimals terminate or repeat."
    diagram: null
    confidence: high
