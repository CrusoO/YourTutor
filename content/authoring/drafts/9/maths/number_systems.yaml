  - topic: rational_irrational
    type: mcq
    difficulty: medium
    role: explain
    stem: "A decimal starts 0.1010010001 and continues so that each block of zeros grows by one. How should this number be classified?"
    correct: "irrational, because the pattern never settles into a repeating block"
    unit: ""
    wrong:
      - {text: "rational, because it shows a visible pattern", mistake: "takes any visible pattern as proof of repetition"}
      - {text: "rational, because it never ends", mistake: "confuses non-terminating with non-repeating"}
      - {text: "terminating, because each block is finite", mistake: "reads each finite block as a finite decimal"}
    explanation: "Each block of zeros is longer than the one before, so no block of digits repeats forever. A decimal that neither terminates nor repeats is irrational."
    hints:
      - "Check whether any block of digits repeats forever."
      - "Compare the length of the zero blocks from one step to the next."
      - "A rational number's decimal must eventually either stop or repeat."
    diagram: null
    confidence: high
  - topic: rational_irrational
    type: numeric
    difficulty: medium
    role: procedure
    stem: "The decimal 0.6 is written as a fraction in lowest terms. What is the denominator of that fraction?"
    correct: "5"
    unit: ""
    wrong: []
    explanation: "Point six is six tenths, which reduces to three fifths, so the denominator is 5."
    hints:
      - "Write the decimal as a fraction over a power of ten."
      - "Cancel the common factor from the top and the bottom."
      - "Check that the top and bottom share no further factor."
    diagram: null
