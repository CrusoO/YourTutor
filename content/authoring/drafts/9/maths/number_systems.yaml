    stem: "A right triangle has one leg of one unit, and its hypotenuse must equal the square root of ten units. What length, in units, must the other leg be?"
    correct: "3"
    unit: "units"
    wrong: []
    explanation: "Subtract the square of the known leg from the square of the hypotenuse: ten minus one gives nine, whose root is three."
    hints:
