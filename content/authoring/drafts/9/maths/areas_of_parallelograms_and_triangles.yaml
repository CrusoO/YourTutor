    stem: "A triangle has a base of 10 cm and a height of 6 cm. What is its area, in square cm?"
    correct: "30"
    unit: "cm^2"
    wrong: []
    explanation: "The area is half of base times height, which is half of 60, giving 30 square cm."
    hints:
