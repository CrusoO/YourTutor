  - topic: triangles_same_base
    type: numeric
    difficulty: medium
    role: apply
    stem: "Triangle ABC has an area of 36 square cm and a base BC of 12 cm. A second triangle DBC shares the base BC and lies between the same parallel lines. What is the height of triangle DBC, in cm?"
    correct: "6"
    unit: "cm"
    wrong: []
    explanation: "The area formula gives 36 equal to half of 12 times the height, so the height is 6 cm, and triangle DBC shares that height."
    hints:
      - "Both triangles share the base and the height between the parallel lines."
      - "Use the area of triangle ABC to find the common height."
      - "The second triangle has that same height."
    diagram: "Triangles ABC and DBC on the common base BC, with apexes A and D on a line parallel to BC."
    confidence: high
  - topic: triangles_same_base
    type: mcq
    difficulty: medium
    role: apply
    stem: "A triangle lies between two parallel lines that are 9 cm apart, and its base of 4 cm lies on the lower line. What is its area?"
    correct: "18 square cm"
    unit: ""
    wrong:
      - {text: "36 square cm", mistake: "omits the halving in the triangle formula"}
      - {text: "9 square cm", mistake: "uses the height alone without the base"}
      - {text: "13 square cm", mistake: "adds the base and the height"}
    explanation: "The height is the distance between the parallels, 9 cm, so the area is half of 4 times 9, which is 18 square cm."
    hints:
      - "The apex lies on the other parallel, so the height is the given distance."
      - "Write the triangle area formula with its base and height."
      - "Halve the product of the base and the height."
    diagram: "Triangle with its base on the lower parallel line and its apex on the upper parallel line, with the distance marked."
    confidence: high
  - topic: triangles_same_base
    type: numeric
    difficulty: hard
    role: transfer
    stem: "Triangles XYZ and XYW share the base XY, which is 12 cm long. Triangle XYZ has an area of 42 square cm and triangle XYW has an area of 30 square cm. What is the difference between their heights, in cm?"
    correct: "2"
    unit: "cm"
    wrong: []
    explanation: "The height of XYZ is 7 cm and the height of XYW is 5 cm, so the difference is 2 cm."
    hints:
      - "Use each area together with the shared base to find that triangle's height."
      - "Area equals half of base times height for both triangles."
      - "Subtract the smaller height from the larger one."
    diagram: "Common base XY with two triangles whose apexes Z and W lie at different heights above XY."
    confidence: high
  - topic: triangles_same_base
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Triangles PQR and PQS have the same base PQ, and the area of PQR is three times the area of PQS. Which statement about their apexes is correct?"
    correct: "R is three times as far from line PQ as S."
    unit: ""
    wrong:
      - {text: "R and S are the same distance from line PQ.", mistake: "assumes equal bases mean equal heights and ignores the area difference"}
      - {text: "S is three times as far from line PQ as R.", mistake: "reverses the ratio"}
      - {text: "R is nine times as far from line PQ as S.", mistake: "squares the ratio of areas"}
    explanation: "With a shared base, area is proportional to height, so an area ratio of 3 to 1 means R is three times as far from PQ as S."
    hints:
      - "Keep the base fixed and compare only the heights."
      - "Area is proportional to the height when the base is the same."
      - "Use the ratio of the areas directly."
    diagram: "Triangles on a shared base PQ with the apexes R and S at different heights above it."
    confidence: high
