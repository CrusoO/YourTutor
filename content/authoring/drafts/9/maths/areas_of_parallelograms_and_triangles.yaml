items:
  - topic: parallelograms_same_base
    type: mcq
    difficulty: easy
    role: recall
    stem: "Two parallelograms share a base and lie between the same pair of parallel lines. How do their areas compare?"
    correct: "They are equal."
    unit: ""
    wrong:
      - {text: "The one with the longer slanted side is larger.", mistake: "uses the slanted side length instead of the height"}
      - {text: "One is always twice the other.", mistake: "assumes any two different shapes differ by a factor of two"}
      - {text: "The areas depend only on the angle between the sides.", mistake: "confuses area with the appearance of the shape"}
    explanation: "Parallelograms on a common base between the same parallels have the same base and the same height, so their areas are equal."
    hints:
      - "Ask what stays the same for both shapes."
      - "Consider the perpendicular distance between the parallel lines."
      - "Think about the base that the two shapes share."
    diagram: "Two parallelograms drawn on a common base between two horizontal parallel lines, with different slants."
    confidence: high
  - topic: parallelograms_same_base
    type: numeric
    difficulty: easy
    role: recall
    stem: "A parallelogram has a base of 8 cm and a height of 5 cm. What is its area, in square cm?"
    correct: "40"
    unit: "cm^2"
    wrong: []
    explanation: "The area of a parallelogram is base times height, which is 8 times 5, giving 40 square cm."
    hints:
      - "The area of a parallelogram uses the base and the perpendicular height."
      - "Multiply the base by that height."
      - "Check that the unit of the answer is squared."
    diagram: null
    confidence: high
  - topic: parallelograms_same_base
    type: numeric
    difficulty: medium
    role: apply
    stem: "A parallelogram and a rectangle share a base of 10 cm and lie between the same pair of parallel lines. The rectangle's height is 6 cm. What is the area of the parallelogram, in square cm?"
    correct: "60"
    unit: "cm^2"
    wrong: []
    explanation: "Equal base and equal height give equal areas, so the parallelogram has the same area as the rectangle, which is 10 times 6, or 60 square cm."
    hints:
      - "Both shapes have the same base and the same height between the parallels."
      - "Compute the area of the rectangle first."
      - "Compare the two areas."
    diagram: "Parallelogram and rectangle on the same base between two parallel lines, with the perpendicular height marked."
    confidence: high
  - topic: parallelograms_same_base
    type: mcq
    difficulty: medium
    role: apply
    stem: "A parallelogram has a base of 12 cm and an area of 84 square cm. What is its height?"
    correct: "7 cm"
    unit: ""
    wrong:
      - {text: "12 cm", mistake: "reads the base as the height"}
      - {text: "6 cm", mistake: "halves the area before dividing"}
      - {text: "72 cm", mistake: "subtracts the base from the area"}
    explanation: "Area equals base times height, so the height is 84 divided by 12, which is 7 cm."
    hints:
      - "Write the area formula for a parallelogram."
      - "Isolate the height by dividing."
      - "Divide the area by the base."
    diagram: "Parallelogram with its base marked and the perpendicular height drawn as a dashed line."
    confidence: high
  - topic: parallelograms_same_base
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A triangle and a parallelogram lie on the same base between the same parallel lines. The parallelogram has an area of 48 square cm. What is the area of the triangle?"
    correct: "24 square cm"
    unit: ""
    wrong:
      - {text: "48 square cm", mistake: "gives the triangle the parallelogram's area"}
      - {text: "12 square cm", mistake: "divides by four instead of two"}
      - {text: "96 square cm", mistake: "doubles the area instead of halving it"}
    explanation: "A triangle on the same base between the same parallels has half the parallelogram's area, so it is 24 square cm."
    hints:
      - "Compare the triangle's base and height with those of the parallelogram."
      - "A triangle on the same base and height is half of the parallelogram."
      - "Halve the given area of the parallelogram."
    diagram: "Parallelogram with a triangle drawn on the same base, its apex on the opposite parallel line, and the heights marked."
    confidence: high
  - topic: parallelograms_same_base
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A triangle has an area of 63 square cm on a base of 14 cm. A parallelogram on the same base lies between the same parallel lines. What is the area of the parallelogram, in square cm?"
    correct: "126"
    unit: "cm^2"
    wrong: []
    explanation: "The triangle's height is 9 cm, since 63 is half of 14 times 9, and the parallelogram shares that height, so its area is 14 times 9, which is 126 square cm."
    hints:
      - "Use the triangle's area and base to find the common height."
      - "The parallelogram shares that height with the triangle."
      - "Multiply the common base by the common height."
    diagram: "Parallelogram and triangle sharing a base, with the common height marked between the two parallel lines."
    confidence: high
  - topic: triangles_same_base
    type: mcq
    difficulty: easy
    role: recall
    stem: "Two triangles have the same base and lie between the same two parallel lines. Which statement is correct?"
    correct: "Their areas are equal."
    unit: ""
    wrong:
      - {text: "Their areas are always different.", mistake: "assumes different apex positions give different areas"}
      - {text: "Their perimeters must be equal.", mistake: "links area results to perimeters"}
      - {text: "One is always twice the other.", mistake: "assumes a factor of two for any pair of triangles"}
    explanation: "Triangles on a common base between parallel lines share the same height, so their areas are equal."
    hints:
      - "Ask what the two triangles have in common."
      - "Consider the perpendicular distance between the parallel lines."
      - "Area depends only on the base and the height."
    diagram: "Two triangles on a common horizontal base, with their apexes on a parallel line above it."
    confidence: high
  - topic: triangles_same_base
    type: numeric
