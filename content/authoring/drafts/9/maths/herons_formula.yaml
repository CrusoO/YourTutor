      - {text: "8 cm", mistake: "takes the average side length as the semi-perimeter"}
      - {text: "16 cm", mistake: "doubles the semi-perimeter"}
    explanation: "The semi-perimeter is half the sum of the sides, which is (7 + 8 + 9) divided by 2, giving 12 cm."
    hints:
      - "Add all three sides first."
      - "The semi-perimeter is half of that sum."
      - "Check your addition before halving."
