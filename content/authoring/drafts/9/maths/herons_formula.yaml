  - topic: heron_area_of_triangle
    type: numeric
    difficulty: easy
    role: procedure
    stem: "A triangle has sides 5 cm, 5 cm and 6 cm. Using Heron's formula, what is its area, in square cm?"
    correct: "12"
    unit: "cm^2"
    wrong: []
    explanation: "The semi-perimeter is 8, and the product 8 times 3 times 3 times 2 is 144, whose square root is 12 square cm."
    hints:
      - "Find the semi-perimeter first, which is half the sum of the three sides."
      - "Subtract each side from the semi-perimeter to get three differences."
      - "Multiply the semi-perimeter by those three differences and take the square root."
    diagram: null
    confidence: high
