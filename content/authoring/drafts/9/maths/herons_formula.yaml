  - topic: area_of_quadrilateral
    type: mcq
    difficulty: medium
    role: explain
    stem: "A convex quadrilateral can be split by either of its two diagonals. What is true about the total area found each way?"
    correct: "Both diagonals give the same total area."
    unit: ""
    wrong:
      - {text: "The diagonal that is longer gives a larger total area.", mistake: "believes the choice of diagonal changes the area"}
      - {text: "Only the shorter diagonal gives a valid split.", mistake: "assumes one diagonal must be shorter to split the shape"}
      - {text: "Splitting by either diagonal gives an area twice as large.", mistake: "believes the total doubles when split"}
    explanation: "Either diagonal divides the same region into two pieces whose areas add to the total, so the area does not depend on which diagonal is used."
    hints:
      - "Think about whether the region itself changes when a different diagonal is drawn."
      - "Both diagonals lie inside the same boundary."
      - "Check whether the total covers the same region in both cases."
    diagram: "Convex quadrilateral with both of its diagonals drawn, meeting inside the shape."
    confidence: high
