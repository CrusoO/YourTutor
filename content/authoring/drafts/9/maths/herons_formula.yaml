  - topic: area_of_quadrilateral
    type: numeric
    difficulty: easy
    role: recall
    stem: "Quadrilateral ABCD has diagonal AC of 5 cm. Triangle ABC has sides 3 cm, 4 cm and 5 cm, and triangle ACD has sides 3 cm, 4 cm and 5 cm. What is the area of ABCD, in square cm?"
    correct: "12"
    unit: "cm^2"
    wrong: []
    explanation: "Each triangle has area 6 square cm, so the quadrilateral's area is 12 square cm."
    hints:
      - "Split the quadrilateral along the diagonal into two triangles."
      - "Find each triangle's area from its three sides."
      - "Add the two areas together."
    diagram: "Quadrilateral ABCD with the diagonal AC drawn, splitting it into triangles ABC and ACD."
    confidence: high
  - topic: area_of_quadrilateral
    type: mcq
    difficulty: easy
    role: explain
    stem: "Why is a quadrilateral split along a diagonal when its area is found by Heron's formula?"
    correct: "It turns the area into the sum of two triangle areas, each of which Heron's formula can handle."
    unit: ""
    wrong:
      - {text: "It turns the quadrilateral into a square.", mistake: "assumes splitting changes the shape"}
      - {text: "It doubles the area automatically.", mistake: "believes splitting multiplies the area"}
      - {text: "It removes the need for any side lengths.", mistake: "thinks the method needs no measurements"}
    explanation: "Splitting along a diagonal gives two triangles whose areas add to the area of the quadrilateral, and each triangle can use Heron's formula."
    hints:
      - "Ask what the diagonal does to the shape."
      - "Think about how the areas of the parts relate to the whole."
      - "Each piece is a triangle whose three sides are known."
    diagram: "Quadrilateral split by one diagonal into two triangles, with the diagonal labelled."
    confidence: high
