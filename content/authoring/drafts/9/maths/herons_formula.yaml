  - topic: area_of_quadrilateral
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A convex quadrilateral has a diagonal d, and the other two vertices lie at perpendicular distances h1 and h2 from that diagonal. Which expression gives its area?"
    correct: "d times (h1 + h2) divided by 2"
    unit: ""
    wrong:
      - {text: "d times h1 times h2", mistake: "multiplies the distances instead of adding them"}
      - {text: "d plus h1 plus h2", mistake: "adds lengths instead of combining areas"}
      - {text: "(h1 + h2) divided by 2", mistake: "omits the diagonal from the formula"}
    explanation: "Each triangle on one side of the diagonal has that diagonal as its base, so their areas add to half of d times the sum of the heights."
    hints:
      - "Write each triangle's area with the diagonal as its base."
      - "Add the two areas together."
      - "Factor the common base and the one half out of the sum."
    diagram: "Convex quadrilateral with a diagonal drawn as a horizontal line, and the perpendicular distances from the other two vertices marked."
    confidence: high
