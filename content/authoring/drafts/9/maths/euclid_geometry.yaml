items:
  - topic: euclid_axioms
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which statement is a definition in Euclid's geometry rather than an axiom?"
    correct: "A point is that which has no part."
    unit: ""
    wrong:
      - {text: "Things equal to the same thing are equal to one another.", mistake: "mistakes a common notion for a definition"}
      - {text: "A straight line can be drawn between any two points.", mistake: "classifies a postulate as a definition"}
      - {text: "A circle can be drawn with any centre and radius.", mistake: "treats a construction claim as a definition"}
    explanation: "A definition says what a term means, so 'a point is that which has no part' defines the point. The other statements are a common notion or postulates."
    hints:
      - "Ask whether the sentence explains what a word means."
      - "Common notions are general truths about equal quantities."
      - "Postulates ask you to accept a construction or a property."
    diagram: null
    confidence: medium
  - topic: euclid_axioms
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which of these is a common notion rather than a postulate?"
    correct: "The whole is greater than the part."
    unit: ""
    wrong:
      - {text: "A terminated line can be produced indefinitely.", mistake: "takes a postulate about lines as a common notion"}
      - {text: "All right angles are equal to one another.", mistake: "takes a postulate about figures as a common notion"}
      - {text: "A line has breadth but no length.", mistake: "confuses a definition with an axiom"}
    explanation: "The whole is greater than the part is a general common notion that applies to any quantities, not only to geometric figures."
    hints:
      - "Check whether the statement is about figures or about quantities in general."
      - "Postulates are specific to figures and constructions."
      - "Common notions apply to all magnitudes."
    diagram: null
    confidence: low
  - topic: euclid_axioms
    type: mcq
    difficulty: medium
    role: explain
    stem: "In Euclid's text, which statement is listed as a postulate rather than a common notion?"
    correct: "A straight line can be drawn joining any two points."
    unit: ""
    wrong:
      - {text: "Things which coincide with one another are equal.", mistake: "mistakes a common notion for a postulate"}
      - {text: "The whole is greater than the part.", mistake: "thinks every statement about size is a postulate"}
      - {text: "A line has length without breadth.", mistake: "treats a definition as a postulate"}
    explanation: "The first postulate asks that a straight line can be drawn between any two points, a demand about construction that is specific to geometry. The other statements are common notions or definitions."
    hints:
      - "Look for a statement that asks you to construct something."
      - "Common notions apply to quantities in general, not only to figures."
      - "Definitions explain the meaning of a term."
    diagram: null
    confidence: low
  - topic: euclid_axioms
    type: numeric
    difficulty: medium
    role: apply
    stem: "Euclid's first postulate allows a straight line to be drawn between two distinct points. How many distinct straight lines does this guarantee through any two given distinct points?"
    correct: "1"
    unit: ""
    wrong: []
    explanation: "The first postulate gives exactly one straight line through two distinct points, so the count is 1."
    hints:
      - "Think about how many lines a single pair of points determines."
      - "Consider whether the postulate allows more than one such line."
      - "Count only the lines the postulate guarantees."
    diagram: null
    confidence: high
  - topic: euclid_axioms
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A proof uses the rule that if equals are added to equals, the wholes are equal, to conclude that two lengths are equal. Which category does this rule belong to?"
    correct: "a common notion"
    unit: ""
    wrong:
      - {text: "a definition", mistake: "treats a rule about quantities as a description of a term"}
      - {text: "a postulate", mistake: "confuses any rule used in a proof with a construction assumption"}
      - {text: "a theorem proved from the definitions", mistake: "thinks every rule must be proved before it is used"}
    explanation: "Adding equal quantities to equal quantities gives equal wholes is a general common notion about magnitudes, accepted without proof."
    hints:
      - "Ask whether the rule is specific to figures or applies to any quantity."
      - "Consider whether the rule describes the meaning of a word."
      - "Think about whether the rule needed a proof within the system."
    diagram: null
    confidence: medium
  - topic: euclid_axioms
    type: numeric
    difficulty: hard
    role: transfer
    stem: "Euclid's common notion says that things equal to the same thing are equal to one another. A length A equals a length C, and a length B also equals C. If A is 9 units, what is B, in units?"
    correct: "9"
    unit: "units"
    wrong: []
    explanation: "A and B are both equal to C, so they are equal to one another, and since A is 9 units, B is also 9 units."
    hints:
      - "Identify the common thing that both lengths are equal to."
      - "Apply the common notion to link the two lengths directly."
      - "Carry the known value across to the other length."
    diagram: null
    confidence: high
  - topic: fifth_postulate
    type: mcq
    difficulty: easy
    role: recall
    stem: "In Euclid's list, the fifth postulate is stated in terms of what?"
    correct: "the angles on one side of a transversal"
    unit: ""
    wrong:
      - {text: "the lengths of the sides of a triangle", mistake: "confuses it with the triangle inequality"}
      - {text: "the area of a parallelogram", mistake: "links it with area results"}
      - {text: "the circumference of a circle", mistake: "attaches it to circles"}
    explanation: "The fifth postulate compares the interior angles on one side of a transversal with two right angles, which is why it is longer and less self-evident than the others."
    hints:
      - "Think about what the postulate says about lines that meet."
      - "It involves a single transversal cutting two lines."
      - "The relation is between angles, not between lengths."
    diagram: null
    confidence: high
  - topic: fifth_postulate
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which statement is an equivalent form of the fifth postulate, as it is commonly taught?"
    correct: "Through a point not on a line, exactly one parallel line can be drawn."
    unit: ""
    wrong:
      - {text: "Through a point not on a line, no parallel line can be drawn.", mistake: "reverses the existence claim"}
      - {text: "Through a point on a line, a parallel line always exists.", mistake: "moves the outside point onto the given line"}
      - {text: "Two parallel lines always meet at infinity.", mistake: "confuses parallel lines with intersecting ones"}
    explanation: "The parallel line statement is logically equivalent to the fifth postulate, and it asserts that exactly one parallel line passes through an outside point."
    hints:
      - "Focus on how many parallel lines pass through the outside point."
      - "A parallel line never touches the given line."
      - "Think about uniqueness as well as existence."
    diagram: null
    confidence: medium
  - topic: fifth_postulate
    type: numeric
    difficulty: medium
    role: apply
    stem: "Two straight lines are cut by a transversal. The two interior angles on one side measure 80 degrees and 95 degrees. What is their sum, in degrees, which is compared with two right angles?"
    correct: "175"
    unit: "degrees"
    wrong: []
    explanation: "Adding 80 and 95 gives 175 degrees, which is less than 180 degrees, so the lines meet on that side."
    hints:
      - "Add the two angles on the same side."
      - "Compare the sum with the total of two right angles."
      - "Two right angles measure a known number of degrees."
    diagram: null
    confidence: high
  - topic: fifth_postulate
    type: mcq
    difficulty: medium
    role: explain
    stem: "Two straight lines are cut by a transversal, and the interior angles on one side sum to exactly 180 degrees. What does the fifth postulate suggest about the lines on that side?"
    correct: "They do not meet on that side."
    unit: ""
    wrong:
      - {text: "They meet on that side.", mistake: "reads an equal sum as if it were a smaller sum"}
      - {text: "They are perpendicular to each other.", mistake: "assumes a sum of 180 degrees forces right angles"}
      - {text: "They meet on the opposite side only.", mistake: "swaps the two sides of the transversal"}
    explanation: "The postulate says the lines meet on a side where the interior angles sum to less than 180 degrees, so a sum of exactly 180 degrees means they do not meet there."
    hints:
      - "Recall the condition on the angle sum that makes the lines meet."
      - "Compare the given sum with that condition."
      - "Decide whether the given sum satisfies the meeting condition."
    diagram: null
    confidence: medium
  - topic: fifth_postulate
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why did mathematicians for centuries treat the fifth postulate with suspicion compared with the first four?"
    correct: "Its statement is far less self-evident than the others, so attempts were made to prove it from them."
    unit: ""
    wrong:
      - {text: "It is the only postulate that mentions a circle.", mistake: "treats circle constructions as the sole reason for suspicion"}
      - {text: "It was rejected entirely because it contradicts the first four.", mistake: "thinks a postulate must be disproved before it can be dropped"}
      - {text: "It concerns only areas and is therefore not geometric.", mistake: "classes measurement as non-geometric"}
    explanation: "The fifth postulate looks more complicated than the others, so many tried to derive it as a theorem, and that effort later led to non-Euclidean geometries."
    hints:
      - "Ask which statement needed a long argument before it seemed obvious."
      - "Think about attempts to prove a postulate from the others."
      - "Consider whether a postulate could be removed without changing the rest."
    diagram: null
    confidence: high
