items:
  - topic: solutions_of_linear_equations
    type: mcq
    difficulty: easy
    role: recall
    stem: "Is the ordered pair (2, 3) a solution of the equation x + 2y = 8?"
    correct: "Yes, because 2 plus 2 times 3 equals 8."
    unit: ""
    wrong:
      - {text: "No, because the values are too small.", mistake: "judges the size of the values instead of substituting them"}
      - {text: "No, because y should be negative.", mistake: "assumes solutions must have a negative coordinate"}
      - {text: "Yes, because the coordinates add up to 5.", mistake: "adds the coordinates instead of substituting"}
    explanation: "Substituting x equal to 2 and y equal to 3 gives 2 plus 6, which equals 8, so the pair satisfies the equation."
    hints:
      - "Substitute the first value for x and the second value for y."
      - "Multiply the coefficient of y by the given value of y."
      - "Compare the left-hand side with the constant on the right."
    diagram: null
    confidence: high
  - topic: solutions_of_linear_equations
    type: numeric
    difficulty: easy
    role: procedure
    stem: "For the equation 3x - y = 5, the value x = 4 is chosen. What is the corresponding value of y?"
    correct: "7"
    unit: ""
    wrong: []
    explanation: "Substituting x equal to 4 gives 12 minus y equals 5, so y equals 7."
    hints:
      - "Substitute the chosen value for x into the equation."
      - "Move the constant terms to one side."
      - "Solve the resulting simple equation for y."
    diagram: null
    confidence: high
  - topic: solutions_of_linear_equations
    type: mcq
    difficulty: medium
    role: apply
    stem: "Which equation has the pair (1, -2) as a solution?"
    correct: "4x + y = 2"
    unit: ""
    wrong:
      - {text: "x - y = 2", mistake: "drops the sign of the negative y-value"}
      - {text: "2x + y = 4", mistake: "doubles the x-value without substituting correctly"}
      - {text: "x + y = 0", mistake: "treats the negative value as positive"}
    explanation: "Substituting x equal to 1 and y equal to minus 2 into 4x + y gives 4 minus 2, which is 2, so the equation holds."
    hints:
      - "Substitute the given x and y into each equation in turn."
      - "Be careful when a negative value is multiplied or subtracted."
      - "Only the equation that balances after substitution is correct."
    diagram: null
    confidence: high
  - topic: solutions_of_linear_equations
    type: numeric
    difficulty: medium
    role: procedure
    stem: "The equation 2x + 5y = 20 is considered for whole-number values. If y = 2, what is x?"
    correct: "5"
    unit: ""
    wrong: []
    explanation: "Putting y equal to 2 gives 2x plus 10 equals 20, so 2x equals 10 and x equals 5."
    hints:
      - "Substitute the given value of y into the equation."
      - "Simplify the multiplied term first."
      - "Divide both sides by the coefficient of x."
    diagram: null
    confidence: high
  - topic: solutions_of_linear_equations
    type: numeric
    difficulty: hard
    role: transfer
    stem: "Find the value of k so that the point (k, 2) satisfies the equation 3x - 2y = 5."
    correct: "3"
    unit: ""
    wrong: []
    explanation: "Putting y equal to 2 gives 3k minus 4 equals 5, so 3k equals 9 and k equals 3."
    hints:
      - "Substitute the unknown for x and the given value for y."
      - "Collect the terms without the unknown on one side."
      - "Divide the coefficient of the unknown at the end."
    diagram: null
    confidence: high
  - topic: solutions_of_linear_equations
    type: mcq
    difficulty: hard
    role: transfer
    stem: "The equation ax + by = c has the solutions (1, 4) and (3, 0). Which set of values for a, b and c fits?"
    correct: "a = 2, b = 1, c = 6"
    unit: ""
    wrong:
      - {text: "a = 1, b = 1, c = 5", mistake: "uses only one solution and ignores the other"}
      - {text: "a = 2, b = 2, c = 6", mistake: "takes b equal to a without checking"}
      - {text: "a = 3, b = 1, c = 9", mistake: "scales the coefficients without keeping the ratio"}
    explanation: "Substituting both pairs gives two equations, and the values 2, 1 and 6 satisfy both, since 2 plus 4 equals 6 and 2 times 3 equals 6."
    hints:
      - "Substitute each given pair to form two equations."
      - "Compare the two equations to find a relationship between a and b."
      - "Test the candidate that satisfies both pairs."
    diagram: null
    confidence: high
  - topic: graph_of_linear_equation
    type: numeric
    difficulty: easy
    role: recall
    stem: "What is the y-coordinate of the point where the line y = 2x + 1 meets the vertical axis?"
    correct: "1"
    unit: ""
    wrong: []
    explanation: "On the vertical axis x is zero, so y equals 1, which is where the line crosses that axis."
    hints:
      - "Substitute zero for the horizontal variable."
      - "Multiply first, then add the constant."
      - "Read the value of y from the result."
    diagram: "Line graph with the vertical axis marked and the crossing point labelled."
    confidence: high
  - topic: graph_of_linear_equation
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which table of points lies on the line y = x - 2?"
    correct: "(0, -2), (1, -1), (2, 0)"
    unit: ""
    wrong:
      - {text: "(0, 2), (1, 3), (2, 4)", mistake: "adds the constant instead of subtracting it"}
      - {text: "(0, -2), (1, 1), (2, 0)", mistake: "miscalculates one point, treating one minus two as one"}
      - {text: "(2, 0), (3, 2), (4, 4)", mistake: "uses the slope of two instead of one"}
    explanation: "Each point satisfies y equal to x minus 2: zero gives minus 2, one gives minus 1, and two gives 0."
    hints:
      - "Substitute each x-value into the equation."
      - "Check the sign of the constant term carefully."
      - "A point lies on the line only if every substitution is correct."
    diagram: null
    confidence: high
  - topic: graph_of_linear_equation
    type: numeric
    difficulty: medium
    role: apply
    stem: "A line passes through the points (0, 3) and (2, 7). What is its slope?"
    correct: "2"
    unit: ""
    wrong: []
    explanation: "Slope is rise over run: (7 minus 3) over (2 minus 0) gives 4 over 2, which is 2."
    hints:
      - "Compute the change in y between the two points."
      - "Compute the change in x between the same two points."
      - "Divide the change in y by the change in x."
    diagram: "Straight line on a grid joining the marked points, with a rise and run triangle drawn beneath it."
    confidence: high
  - topic: graph_of_linear_equation
    type: mcq
    difficulty: medium
    role: apply
    stem: "Where does the line 2x + y = 6 cross the x-axis?"
    correct: "(3, 0)"
    unit: ""
    wrong:
      - {text: "(0, 6)", mistake: "reads the y-intercept as the x-intercept"}
      - {text: "(6, 0)", mistake: "forgets to divide by the coefficient of x"}
      - {text: "(0, 3)", mistake: "reads the crossing on the wrong axis"}
    explanation: "On the x-axis y equals zero, so 2x equals 6 and x equals 3."
    hints:
      - "The x-axis is where the vertical coordinate is zero."
      - "Set the y term to zero in the equation."
      - "Solve the simple equation that remains for x."
    diagram: "Line sloping downwards on a coordinate grid with both intercepts marked."
    confidence: high
  - topic: graph_of_linear_equation
    type: numeric
    difficulty: hard
    role: transfer
    stem: "A straight line passes through (1, 5) and (4, 11) and is written as y = mx + c. What is c?"
    correct: "3"
    unit: ""
    wrong: []
    explanation: "The slope is 6 over 3, which is 2, and substituting the point (1, 5) gives 5 equal to 2 plus c, so c is 3."
    hints:
      - "Find the slope first from the change in y over the change in x."
      - "Substitute one of the points and the slope into the form y = mx + c."
      - "Solve for the remaining constant."
    diagram: "Coordinate grid with the line through the two given points, extended to meet the vertical axis, and the intercept marked."
    confidence: high
  - topic: graph_of_linear_equation
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Two lines y = 2x + 1 and y = 2x - 3 are drawn on the same grid. Which statement is correct?"
    correct: "They are parallel and never meet."
    unit: ""
    wrong:
      - {text: "They meet at the origin.", mistake: "assumes every line passes through the origin"}
      - {text: "They meet at the point (1, 3).", mistake: "solves the equations incorrectly by adding them"}
      - {text: "They are perpendicular.", mistake: "confuses equal slopes with negative reciprocal slopes"}
    explanation: "Both lines have slope 2 but different intercepts, so they are parallel and never intersect."
    hints:
      - "Compare the coefficients of x in both equations."
      - "Lines with equal slopes behave in a specific way."
      - "Check whether the constant terms differ."
    diagram: "Two straight lines drawn on the same grid with the same steepness and different heights."
    confidence: high
