    stem: "A cylinder has a radius of 7 cm and a height of 10 cm. Using pi equal to 22 over 7, what is its curved surface area, in square cm?"
    correct: "440"
    unit: "cm^2"
    wrong: []
    explanation: "The curved surface area is 2 times 22/7 times 7 times 10, which equals 440 square cm."
    hints:
      - "The curved surface area of a cylinder is 2 pi r h."
      - "Substitute the radius and the height."
      - "Cancel the common factor of 7 between the radius and the fraction."
    diagram: "Cylinder with its radius and height marked."
    confidence: high
