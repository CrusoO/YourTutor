    stem: "In parallelogram ABCD, the diagonals AC and BD intersect at O. Which pair of triangles is congruent?"
    correct: "triangle AOB and triangle COD"
    unit: ""
    wrong:
      - {text: "triangle AOB and triangle BOC", mistake: "pairs triangles that share a side without checking the other parts"}
      - {text: "triangle AOB and triangle AOD", mistake: "shares a side and assumes the remaining parts match"}
      - {text: "triangle AOB and triangle BCD", mistake: "compares triangles without matching their vertices"}
    explanation: "The diagonals bisect each other, so AO equals OC and BO equals OD, and the vertically opposite angles at O are equal, giving congruence by SAS."
    hints:
      - "List the equal segments created where the diagonals cross."
      - "Look for a pair of angles that are opposite at the crossing point."
      - "Match the corresponding parts of the two triangles before choosing a criterion."
