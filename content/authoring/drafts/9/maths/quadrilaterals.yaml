  - topic: midpoint_theorem
    type: mcq
    difficulty: easy
    role: recall
    stem: "In triangle ABC, D and E are the midpoints of AB and AC. What does the mid-point theorem say about the segment DE?"
    correct: "DE is parallel to BC and half its length."
    unit: ""
    wrong:
      - {text: "DE is equal in length to BC.", mistake: "forgets the factor of one half"}
      - {text: "DE is perpendicular to BC.", mistake: "assumes midpoints create right angles"}
      - {text: "DE is twice the length of BC.", mistake: "reverses the ratio of the two lengths"}
    explanation: "The segment joining the midpoints of two sides is parallel to the third side and equal to half of it."
    hints:
      - "Think about what a segment joining two midpoints does to the third side."
      - "Consider how its length compares with the third side."
      - "Only one of the statements about length is correct."
    diagram: "Triangle ABC with midpoints D on AB and E on AC joined by segment DE, which is parallel to BC."
    confidence: high
