      - {text: "all angles are right angles", mistake: "confuses parallelograms with rectangles"}
    explanation: "A parallelogram has opposite sides parallel and equal, and opposite angles equal, while the other features need extra conditions."
    hints:
      - "Consider what the pairs of parallel sides guarantee."
      - "Think about a general parallelogram before any special type."
      - "Some properties belong only to special parallelograms."
