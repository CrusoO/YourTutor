items:
  - topic: mixtures_and_solutions
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which type of mixture has particles so small that they do not scatter a light beam and do not settle out on standing?"
    correct: "a solution"
    unit: ""
    wrong:
      - {text: "a suspension", mistake: "thinks large particles can be too small to settle"}
      - {text: "a colloid", mistake: "believes colloid particles always settle quickly"}
      - {text: "a compound", mistake: "confuses a mixture with a substance of fixed composition"}
    explanation: "In a solution the dissolved particles are individual molecules or ions, far too small to scatter light or settle out. Suspensions have large particles that settle, and colloids have intermediate particles that scatter light."
    hints:
      - "Think of a mixture in which one substance fully dissolves into another and looks clear."
      - "Ask which type of mixture has the smallest particles of the three."
      - "Consider whether the particles eventually fall to the bottom of the container."
    diagram: null
    confidence: high
  - topic: mixtures_and_solutions
    type: mcq
    difficulty: easy
    role: recall
    stem: "Chalk powder is stirred into water and settles to the bottom when the mixture is left still. What is this mixture called?"
    correct: "a suspension"
    unit: ""
    wrong:
      - {text: "a solution", mistake: "assumes every mixture is clear and uniform"}
      - {text: "a colloid", mistake: "treats any cloudy liquid as a colloid"}
      - {text: "an element", mistake: "confuses mixtures with pure substances"}
    explanation: "The chalk particles are large enough to be seen and they settle when the mixture is left alone, which is the defining behaviour of a suspension."
    hints:
      - "Notice that the particles are large enough to be seen and that they settle."
      - "Consider whether the particles spread evenly through the liquid over time."
      - "Pick the mixture type whose particles are the largest of the three."
    diagram: null
    confidence: high
  - topic: mixtures_and_solutions
    type: mcq
    difficulty: medium
    role: explain
    stem: "Milk looks white and does not clear up on standing, yet a beam of light passing through it can be seen. What type of mixture is milk?"
    correct: "a colloid"
    unit: ""
    wrong:
      - {text: "a solution", mistake: "assumes a visible light beam means a solution"}
      - {text: "a suspension", mistake: "thinks the particles in milk settle quickly like sand"}
      - {text: "a pure compound", mistake: "treats milk as a single substance"}
    explanation: "Milk contains fat and protein particles that are too large to dissolve but too small to settle, so they scatter light and the mixture does not separate on standing. That combination marks a colloid."
    hints:
      - "Think about whether the particles are between solution size and suspension size."
      - "Ask what happens to a beam of light when it passes through the mixture."
      - "Consider whether the particles in milk settle over a short time."
    diagram: null
    confidence: high
  - topic: mixtures_and_solutions
    type: numeric
    difficulty: medium
    role: apply
    stem: "A solution is made by dissolving 5 g of salt in 100 g of water. What is the total mass of the solution in grams?"
    correct: "105"
    unit: "g"
    wrong: []
    explanation: "The mass of a solution is the mass of the solute plus the mass of the solvent, so 5 g plus 100 g gives 105 g."
    hints:
      - "Add the masses of the dissolved substance and the liquid it dissolves in."
      - "Mass is conserved when a solid dissolves in a liquid."
      - "Do not leave out either of the two parts when finding the total."
    diagram: null
    confidence: high
  - topic: mixtures_and_solutions
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A mixture of sand, salt and water is filtered through a fine cloth. The filtrate is clear and does not scatter a light beam. What is the filtrate?"
    correct: "a solution"
    unit: ""
    wrong:
      - {text: "a colloid", mistake: "assumes every filtrate contains colloidal particles"}
      - {text: "a suspension", mistake: "thinks filtering leaves only suspended particles behind"}
      - {text: "a pure substance", mistake: "treats dissolved salt as a compound"}
    explanation: "A clear filtrate that does not scatter light has particles too small to be seen or scattered, so it is a solution of the dissolved salt in water. The sand has already been removed by the cloth."
    hints:
      - "Compare the size of the particles in the filtrate with the sizes found in the other kinds of liquid mixture."
      - "Ask what the lack of scattering in the light beam tells you about the particles."
      - "Consider whether a clear liquid could still contain particles large enough to scatter light."
    diagram: null
    confidence: high
  - topic: mixtures_and_solutions
    type: mcq
    difficulty: hard
    role: explain
    stem: "Oil and water left in a container form two separate layers. Which property allows a separating funnel to split them apart?"
    correct: "they are immiscible liquids with different densities"
    unit: ""
    wrong:
      - {text: "they have different colours", mistake: "uses appearance instead of a physical property that decides layering"}
      - {text: "oil dissolves in water completely", mistake: "confuses solubility with layering"}
      - {text: "both liquids have the same boiling point", mistake: "assumes the boiling point decides whether liquids form layers"}
    explanation: "Oil and water do not mix, and the lighter oil floats above the water, so the layers can be separated by running off the lower liquid through the tap of a separating funnel."
    hints:
      - "Think about which property decides which liquid sits on top."
      - "Ask whether the two liquids mix fully or stay separate."
      - "Consider what happens to the two liquids once they are left still for a while."
    diagram: null
    confidence: high
  - topic: separation_methods
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which method separates an insoluble solid such as sand from a liquid?"
    correct: "filtration"
    unit: ""
    wrong:
      - {text: "evaporation", mistake: "uses evaporation, which leaves dissolved solids behind rather than insoluble ones"}
      - {text: "sublimation", mistake: "confuses a solid turning into gas with separating a solid from a liquid"}
      - {text: "magnetic separation", mistake: "assumes magnetism applies to all solids"}
    explanation: "In filtration the liquid passes through a porous material while the insoluble solid is caught on top of it."
    hints:
      - "Think of pouring the mixture through a porous material that lets only the liquid through."
      - "The leftover solid stays on top of the porous material."
      - "Name the method that uses a porous material to catch the solid."
    diagram: "A funnel fitted with a porous material, set over a flask, with a mixture of sand and water poured into the funnel."
    confidence: high
  - topic: separation_methods
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which property is used to separate iron filings from a mixture of iron filings and sulphur powder?"
    correct: "magnetic attraction"
    unit: ""
    wrong:
      - {text: "difference in boiling points", mistake: "ties the separation to heating rather than to a magnetic property"}
      - {text: "difference in solubility in water", mistake: "assumes both substances dissolve in water"}
      - {text: "difference in particle size only", mistake: "treats size as the only useful property for separation"}
    explanation: "Iron is attracted by a magnet while sulphur is not, so a magnet can lift out the iron filings and leave the sulphur behind."
    hints:
      - "Think about which property of iron makes it move toward a bar."
      - "Consider whether sulphur responds to the same property."
      - "Name the force that a bar magnet exerts on pieces of iron."
    diagram: null
    confidence: high
  - topic: separation_methods
    type: mcq
    difficulty: medium
    role: explain
    stem: "A mixture of common salt and water is heated in a flask connected to a bent tube that leads to a cooled receiver. Which method is being used and why?"
    correct: "distillation, because the water boils off, condenses in the tube and is collected"
    unit: ""
    wrong:
      - {text: "filtration, because salt particles are trapped by the tube", mistake: "confuses trapping solids with boiling off a liquid"}
      - {text: "chromatography, because salt moves faster than water", mistake: "mixes up movement with the spreading of colours"}
      - {text: "sublimation, because the salt turns into a gas", mistake: "assumes salt turns into vapour when heated"}
    explanation: "Water boils, its vapour travels down the tube, condenses on the cool walls and is collected, while the salt stays behind in the flask. This is distillation."
    hints:
      - "Think about which component of the mixture leaves the flask as a vapour."
      - "Consider what the cooled receiver is designed to do with the vapour."
      - "Ask which substance remains in the flask after heating."
    diagram: "A round flask on a heater with a bent glass tube leading from its neck to a second flask that is cooled in water and collects liquid."
    confidence: high
  - topic: separation_methods
    type: mcq
    difficulty: medium
    role: apply
    stem: "A mixture of two dyes is spotted near the base of an absorbent strip, and the bottom edge is dipped in a solvent. The dyes separate into coloured bands as the solvent climbs. Which method is this?"
    correct: "chromatography"
    unit: ""
    wrong:
      - {text: "decantation", mistake: "assumes separation by pouring off the liquid above a settled solid"}
      - {text: "fractional distillation", mistake: "treats dye mixtures as if they separated by boiling points"}
      - {text: "sieving", mistake: "uses particle size to separate dissolved dyes"}
    explanation: "Each dye is carried up the strip by the solvent at a different rate, depending on how strongly it sticks to the absorbent material, so the dyes end up in separate bands."
    hints:
      - "Think about how the solvent carries each colour up the strip at a different rate."
      - "Consider whether the dyes boil or travel along with the solvent."
      - "Name the method based on how substances move through an absorbent material."
    diagram: "A narrow strip of absorbent material with a pencil-marked spot near its base, standing in a shallow pool of solvent, with the solvent front visible higher up the strip."
    confidence: high
  - topic: separation_methods
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A mixture contains common salt, sand and iron filings. Which sequence of steps separates all three components most efficiently?"
    correct: "remove the iron with a magnet, add water and filter off the sand, then evaporate the filtrate to recover the salt"
    unit: ""
    wrong:
      - {text: "evaporate the whole mixture, filter the residue, then use a magnet", mistake: "evaporates before separating the sand from the salt"}
      - {text: "use a magnet, then distil the mixture to remove the sand", mistake: "uses distillation to remove a solid"}
      - {text: "run the dry mixture through chromatography, then sieve it", mistake: "assumes chromatography works on dry solids"}
    explanation: "The magnet removes the iron first because it is the only magnetic component. Water dissolves the salt, filtration removes the sand, and evaporating the filtrate recovers the salt. The order matters because each step leaves the next component easier to separate."
    hints:
      - "Start with the component that has the most unusual physical property."
      - "Consider which component dissolves and which stays behind once water is added."
      - "Think about whether the liquid left after filtering can be recovered by heating."
    diagram: null
    confidence: low
  - topic: separation_methods
    type: mcq
    difficulty: hard
    role: explain
    stem: "A sample of ethanol and water is heated in a distillation setup. Ethanol turns into vapour first. Which property of ethanol causes this?"
    correct: "its lower boiling point"
    unit: ""
    wrong:
      - {text: "its higher density", mistake: "links density to how easily a liquid forms vapour"}
      - {text: "its greater solubility in glass", mistake: "assumes the glass of the apparatus changes boiling"}
      - {text: "its smaller molecules pass through the condenser faster", mistake: "confuses speed in the condenser with the start of boiling"}
    explanation: "Ethanol boils at a lower temperature than water, so it reaches its boiling point first and its vapour leaves the flask before the water's does. This difference in boiling points is what makes the separation possible."
    hints:
      - "Think about which liquid reaches its boiling temperature sooner when heated."
      - "Consider how the boiling temperature of each liquid compares with the other."
      - "Ask which property of a liquid decides when it turns into vapour."
    diagram: "A round flask of liquid heated on a stand, with a bent tube leading to a condenser that cools the vapour into a receiving flask."
    confidence: medium
  - topic: elements_and_compounds
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which of these substances is an element?"
    correct: "oxygen"
    unit: ""
    wrong:
      - {text: "water", mistake: "treats a compound as if it were an element"}
      - {text: "air", mistake: "treats a mixture as a pure substance"}
      - {text: "carbon dioxide", mistake: "assumes any gas containing carbon is an element"}
    explanation: "An element is a pure substance made of only one kind of atom. Oxygen fits this description, while water and carbon dioxide are compounds and air is a mixture."
    hints:
      - "An element contains only one kind of atom."
      - "Think about which option is a single substance made of one type of atom."
      - "A compound is made of two or more elements chemically combined, so rule out those options first."
    diagram: null
    confidence: high
  - topic: elements_and_compounds
    type: mcq
    difficulty: easy
    role: recall
    stem: "A substance is formed when two or more elements are chemically combined in a fixed ratio. What is such a substance called?"
    correct: "a compound"
    unit: ""
    wrong:
      - {text: "a mixture", mistake: "assumes elements combined in any ratio form a mixture"}
      - {text: "an element", mistake: "confuses chemical combination with purity"}
      - {text: "a solution", mistake: "treats a chemically combined substance as a dissolved one"}
    explanation: "A compound is a pure substance formed by chemically joining two or more elements in a fixed ratio. Its properties differ from those of the elements that form it."
    hints:
      - "Think about whether the parts are bonded chemically or only mixed together."
      - "The ratio of the parts is fixed in this type of substance."
      - "Name the type of pure substance that contains more than one element."
    diagram: null
    confidence: high
  - topic: elements_and_compounds
    type: mcq
    difficulty: medium
    role: explain
    stem: "Iron filings and sulphur powder can be mixed in any ratio and each keeps its own properties. When the two are heated together they form a new substance with fixed proportions and new properties. What does this change show?"
    correct: "the iron and sulphur have combined chemically into a compound"
    unit: ""
    wrong:
      - {text: "the iron and sulphur have simply dissolved into each other", mistake: "treats heating as a form of dissolving"}
      - {text: "the iron has been separated from the sulphur", mistake: "reverses the direction of the change"}
      - {text: "the mixture has become an element", mistake: "confuses a compound with an element"}
    explanation: "The mixture kept each component's properties, but after heating the new substance has fixed proportions and new properties, which is the mark of a chemical combination into a compound."
    hints:
      - "Compare whether the parts keep their own properties in the new substance."
      - "Ask whether the ratio of the parts is fixed or variable in the new substance."
      - "Consider what the heating did to the particles of each element."
    diagram: null
    confidence: high
  - topic: elements_and_compounds
    type: numeric
    difficulty: medium
    role: apply
    stem: "Water is formed when hydrogen and oxygen combine chemically. How many different elements are chemically combined in one substance of water?"
    correct: "2"
    unit: ""
    wrong: []
    explanation: "Water is a compound of hydrogen and oxygen, so two different elements are chemically combined in it. Water is not an element itself."
    hints:
      - "Think about the number of different kinds of atom that water is built from."
      - "Recall which elements are joined to make the substance."
      - "Count the different element symbols that appear in the formula of water."
    diagram: null
    confidence: medium
  - topic: elements_and_compounds
    type: mcq
    difficulty: hard
    role: explain
    stem: "Which property best distinguishes air from carbon dioxide in terms of composition?"
    correct: "air has variable proportions of its components, while carbon dioxide has a fixed ratio of carbon to oxygen"
    unit: ""
    wrong:
      - {text: "carbon dioxide can be separated by simple filtration", mistake: "assumes compounds can be separated by physical methods"}
      - {text: "air contains only one element", mistake: "treats air as a single element"}
      - {text: "both have identical boiling points", mistake: "uses boiling points alone to decide what a mixture is"}
    explanation: "Air is a mixture whose gases can be present in varying amounts, while carbon dioxide is a compound with a fixed carbon to oxygen ratio of one carbon to two oxygen atoms."
    hints:
      - "Think about whether the proportions of the parts can change from sample to sample."
      - "Ask whether the parts can be separated by simple physical methods."
      - "Consider how many elements each substance contains."
    diagram: null
    confidence: medium
  - topic: elements_and_compounds
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A grey solid that is magnetic is mixed with a yellow powder. When the mixture is heated, a new black solid forms that is not magnetic. Which description best fits the new black solid?"
    correct: "a compound formed by chemical combination of the two starting substances"
    unit: ""
    wrong:
      - {text: "a mixture with a higher density than iron", mistake: "thinks density alone decides whether a substance is a mixture"}
      - {text: "a new element formed by heating", mistake: "assumes heating can create a new element"}
      - {text: "a physical blend of the original two substances", mistake: "confuses a physical blend with a chemical change"}
    explanation: "The new black solid has properties that neither starting substance had, such as losing magnetism, and it forms in a fixed ratio. Those features point to a chemical combination, so the product is a compound."
    hints:
      - "Think about whether the loss of magnetism means the original parts still exist separately."
      - "Ask whether the new substance has properties that neither starting material had."
      - "Consider whether heating two substances can ever produce a new element."
    diagram: null
    confidence: medium
