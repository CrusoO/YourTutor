items:
  - topic: states_of_matter
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which state of matter keeps a definite shape and a definite volume because its particles are held in fixed positions?"
    correct: "solid"
    unit: ""
    wrong:
      - {text: "liquid", mistake: "thinks a definite volume alone means the particles are fixed"}
      - {text: "gas", mistake: "assumes gas particles are held tightly by strong forces"}
      - {text: "suspension", mistake: "treats a mixture as if it were a separate state of matter"}
    explanation: "Particles of a solid are packed closely and held in fixed positions, so a solid keeps both its shape and its volume. A liquid keeps only its volume, and a gas keeps neither."
    hints:
      - "Think about which state keeps its own shape without any container."
      - "Consider how closely the particles are packed and whether they can slide over each other."
      - "Pick the state where particles only vibrate about fixed places."
    diagram: null
    confidence: high
  - topic: states_of_matter
    type: mcq
    difficulty: easy
    role: explain
    stem: "Why can a gas be squeezed into a much smaller volume than a solid of the same mass can?"
    correct: "its particles are separated by large spaces"
    unit: ""
    wrong:
      - {text: "its particles are bonded into long chains", mistake: "imagines gas particles are linked like the units of a polymer"}
      - {text: "its particles are heavier than those of a solid", mistake: "links compressibility to mass rather than to spacing"}
      - {text: "its particles are arranged in fixed layers", mistake: "applies the layered picture of solids to gases"}
    explanation: "A gas has much more empty room between its particles than a solid does, so pressing on it reduces that empty room. The particles of a solid are already packed too tightly to be pushed closer."
    hints:
      - "Compare how much empty room lies between particles in the two states."
      - "Ask whether the particles of a gas are free to move or fixed in place."
      - "Think about what gets reduced when a plunger pushes a gas into a smaller space."
    diagram: null
    confidence: high
  - topic: states_of_matter
    type: mcq
    difficulty: medium
    role: explain
    stem: "A block of ice left on a table slowly becomes water. Which change at the particle level explains this?"
    correct: "particles gain energy and slide past one another more freely"
    unit: ""
    wrong:
      - {text: "particles shrink in size as they warm", mistake: "assumes heating reduces the size of particles"}
      - {text: "particles lose their mass as they melt", mistake: "thinks matter disappears during a change of state"}
      - {text: "particles begin to attract each other more strongly", mistake: "reverses the direction of the change in forces"}
    explanation: "Heat makes the particles move harder until they can break out of their fixed places and slide past one another. The particles keep their size and mass, and the total amount of matter stays the same."
    hints:
      - "Ask what the particles need in order to stop sitting in fixed places."
      - "Consider whether the total amount of matter changes when ice melts."
      - "Consider how a warm object differs from a cold one in terms of particle motion."
    diagram: null
    confidence: high
  - topic: states_of_matter
    type: mcq
    difficulty: medium
    role: apply
    stem: "A gas is trapped in a sealed syringe and the plunger is pushed in, reducing the volume. What does this show about the particles?"
    correct: "they are far apart and the spaces between them can be reduced"
    unit: ""
    wrong:
      - {text: "they expand when they are compressed", mistake: "reverses the effect of pressure on a gas"}
      - {text: "they are fixed in position so they cannot move closer", mistake: "applies solid behaviour to a gas"}
      - {text: "the gas turns into a liquid as soon as the plunger moves", mistake: "assumes compression always causes condensation"}
    explanation: "Gas particles are widely separated, so the plunger pushes them closer together until the space is smaller. The particles do not turn into a liquid, and they are not fixed in place."
    hints:
      - "Think about how much room exists between particles in a gas compared with a solid."
      - "Ask what happens to the free space when the plunger pushes inward."
      - "Consider whether the particles keep their positions or can be pushed closer together."
    diagram: "A gas-filled syringe with its plunger partly pushed in, drawn with dots that stand for gas particles spread through the barrel."
    confidence: high
  - topic: states_of_matter
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A balloon filled with gas is put in a freezer and shrinks. Which particle-level explanation is most accurate?"
    correct: "the particles move more slowly and hit the walls less often and less forcefully"
    unit: ""
    wrong:
      - {text: "the particles themselves become smaller in size", mistake: "confuses the shrinking of the balloon with a shrinking of particles"}
      - {text: "the particles stop moving completely at low temperature", mistake: "thinks cold means zero motion at any temperature"}
      - {text: "the particles change into a liquid inside the balloon", mistake: "assumes cooling always liquefies a gas"}
    explanation: "Cooling slows the gas particles, so they strike the balloon wall less often and with less force, and the pressure drops until the balloon shrinks. The particles keep their size and do not stop moving."
    hints:
      - "Think about how the speed of particles changes when a sample cools."
      - "Consider what causes the gas to push on the inside of a balloon."
      - "Ask whether the size of the particles changes or only their motion."
    diagram: null
    confidence: medium
  - topic: states_of_matter
    type: mcq
    difficulty: hard
    role: explain
    stem: "A figure shows the same substance in three states, with dots for particles drawn at equal scale. Which state shows the widest average spacing between its particles?"
    correct: "gas"
    unit: ""
    wrong:
      - {text: "solid", mistake: "assumes tight packing means the widest spacing"}
      - {text: "liquid", mistake: "picks the middle state without comparing the spacing"}
      - {text: "all three states show equal spacing", mistake: "treats particle spacing as the same in every state"}
    explanation: "In a gas the particles are far apart and move freely, so the dots in the gas box have the most empty room between them. The solid dots are the closest together."
    hints:
      - "Compare how crowded the dots look in each state."
      - "Think about which state lets its particles spread out to fill a container."
      - "Ask which state has the most empty room between its dots."
    diagram: "Three square boxes side by side labelled solid, liquid and gas, each holding dots that stand for particles, drawn at the same scale."
    confidence: high
  - topic: particle_nature
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the name of the random mixing of particles of one substance with particles of another substance?"
    correct: "diffusion"
    unit: ""
    wrong:
      - {text: "evaporation", mistake: "confuses mixing with a liquid turning into vapour"}
      - {text: "condensation", mistake: "reverses the direction of the process"}
      - {text: "sublimation", mistake: "mixes up diffusion with a solid turning directly into a gas"}
    explanation: "Diffusion is the spreading of particles from a region where they are crowded to a region where they are fewer, caused by their constant random motion. Evaporation and condensation are changes between liquid and vapour."
    hints:
      - "Think about how a smell spreads across a room without any stirring."
      - "The process happens because particles are always moving."
      - "Name the process that makes particles spread out from a crowded region."
    diagram: null
    confidence: high
  - topic: particle_nature
    type: mcq
    difficulty: easy
    role: recall
    stem: "According to the kinetic model, what is true about the particles of every kind of matter?"
    correct: "they are in constant random motion"
    unit: ""
    wrong:
      - {text: "they are at rest at room temperature", mistake: "assumes particles stop when they are not visibly moving"}
      - {text: "they are all the same size and mass", mistake: "assumes particles are identical across different substances"}
      - {text: "they are held in fixed lattice points", mistake: "applies the solid picture to all states of matter"}
    explanation: "The kinetic model says that all matter is made of particles that keep moving at random, and that they move faster when the temperature rises. Particles are not at rest even when a sample looks still."
    hints:
      - "Think about what the kinetic model says about particle motion rather than particle size."
      - "Consider whether particles in a gas are moving even when the gas looks still."
      - "Pick the option that describes a motion that never switches off."
    diagram: null
    confidence: high
  - topic: particle_nature
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does the smell from an open bottle of perfume reach the far corners of a room faster when the room is warm?"
    correct: "warmer particles move faster and spread out more quickly"
    unit: ""
    wrong:
      - {text: "warm air pushes the smell particles in one direction only", mistake: "treats spreading as a single push"}
      - {text: "the perfume particles grow larger when they are heated", mistake: "thinks heating makes particles bigger"}
      - {text: "heat removes the spaces between the air particles", mistake: "confuses the spacing between particles with their speed"}
    explanation: "Higher temperature increases the speed of particles, so the perfume particles mix into the air faster and reach distant corners sooner. Their size does not change."
    hints:
      - "Think about how temperature relates to the speed of the particles."
      - "Ask whether the smell particles are being pushed or moving by themselves."
      - "Consider whether the size of the particles changes when they are warmed."
    diagram: null
    confidence: high
  - topic: particle_nature
    type: mcq
    difficulty: medium
    role: apply
    stem: "Water and ethanol are mixed in a closed flask and left for several days. Ethanol particles are found throughout the water. Which property of particles explains this?"
    correct: "particles keep moving and fill the gaps between other particles"
    unit: ""
    wrong:
      - {text: "particles stop moving once they mix", mistake: "assumes mixing needs no motion"}
      - {text: "ethanol particles are too large to pass through water", mistake: "assumes large particles cannot spread through a liquid"}
      - {text: "water particles are fixed and ethanol particles are pushed through them", mistake: "treats the water as a fixed structure"}
    explanation: "Particles in liquids are always moving, so ethanol particles gradually spread into the gaps between water particles until the mixture is even throughout."
    hints:
      - "Think about whether particles in a liquid are still or moving."
      - "Ask what would make ethanol particles reach the bottom of the flask."
      - "Consider whether the size of a particle decides if it can spread."
    diagram: null
    confidence: high
  - topic: particle_nature
    type: mcq
    difficulty: hard
    role: transfer
    stem: "Two gases at the same temperature are released in one corner of a closed room. Gas A has lighter particles than gas B. Which statement is best supported by the kinetic model?"
    correct: "gas A spreads faster because its lighter particles move at higher average speeds"
    unit: ""
    wrong:
      - {text: "gas B spreads faster because its heavier particles push harder", mistake: "equates heavier particles with a stronger pushing force"}
      - {text: "both gases spread at the same rate because the temperature is equal", mistake: "ignores the mass of the particles when judging the rate of spreading"}
      - {text: "gas B spreads faster because its particles are packed more closely", mistake: "confuses the spacing between particles with their speed"}
    explanation: "At the same temperature the average kinetic energy of the particles is the same, so the lighter particles must move faster on average and spread more quickly."
    hints:
      - "Think about the kinetic energy the particles share at the same temperature."
      - "Ask which of the two particles must be moving faster to carry the same energy."
      - "Consider how mass and speed are linked when the energy is fixed."
    diagram: null
    confidence: high
  - topic: particle_nature
    type: mcq
    difficulty: hard
    role: explain
    stem: "Why does diffusion take much longer in a liquid than in a gas at the same temperature?"
    correct: "particles in a liquid collide with neighbours far more often, so their paths are short and zigzag"
    unit: ""
    wrong:
      - {text: "particles in liquids are heavier than gas particles", mistake: "assumes mass alone sets the rate of diffusion in every state"}
      - {text: "liquids have no spaces between their particles at all", mistake: "treats liquids as completely full"}
      - {text: "liquid particles move in one fixed direction only", mistake: "thinks motion in liquids is directional"}
    explanation: "Liquid particles are packed close together, so each one is knocked about constantly and makes little net progress. Gas particles travel much farther between collisions, so the spreading is faster."
    hints:
      - "Compare how far a particle can travel before it bumps into another one in each state."
      - "Ask how crowded the particles of a liquid are compared with a gas."
      - "Consider whether particles in a liquid move in long straight lines."
    diagram: null
    confidence: high
  - topic: change_of_state
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the name of the change when a solid turns directly into a gas without first becoming a liquid?"
    correct: "sublimation"
    unit: ""
    wrong:
      - {text: "evaporation", mistake: "assumes all gas formation starts from a liquid"}
      - {text: "condensation", mistake: "reverses the direction of the change"}
      - {text: "fusion", mistake: "uses the word for melting"}
    explanation: "Sublimation is the direct change from solid to gas, as seen with dry ice and camphor. Evaporation needs a liquid first, and condensation is the reverse of gas becoming liquid."
    hints:
      - "Think of a substance such as dry ice that disappears without leaving a puddle."
      - "The change skips the liquid stage entirely."
      - "Name the change that takes a solid directly to vapour."
    diagram: null
    confidence: high
  - topic: change_of_state
    type: mcq
    difficulty: easy
    role: recall
    stem: "At normal atmospheric pressure, at what temperature does pure ice begin to melt?"
    correct: "0 degrees Celsius"
    unit: ""
    wrong:
      - {text: "100 degrees Celsius", mistake: "confuses the melting of ice with the boiling of water"}
      - {text: "4 degrees Celsius", mistake: "uses the temperature of maximum density of water"}
      - {text: "-10 degrees Celsius", mistake: "assumes melting happens well below the freezing point"}
    explanation: "Pure ice melts at 0 degrees Celsius under normal atmospheric pressure, and water freezes at the same temperature."
    hints:
      - "Think about the temperature at which water freezes into a solid."
      - "Consider the boiling point of water as a reference for a different change."
      - "The melting point of ice is a familiar fixed point on the temperature scale."
    diagram: null
    confidence: high
  - topic: change_of_state
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why does steam at 100 degrees Celsius usually cause a more severe burn than boiling water at the same temperature?"
    correct: "steam releases latent heat as it condenses on the skin"
    unit: ""
    wrong:
      - {text: "steam has a higher temperature than boiling water", mistake: "assumes steam is hotter than the liquid it comes from"}
      - {text: "steam particles are heavier and fall onto the skin", mistake: "treats condensation as an effect of mass"}
      - {text: "boiling water absorbs heat from the skin as it evaporates", mistake: "reverses the direction of heat flow in evaporation"}
    explanation: "Steam and boiling water are at the same temperature, but steam gives up a large amount of latent heat when it condenses on the skin, on top of the heat it already carries."
    hints:
      - "Think about what happens to the energy of steam when it changes back into a liquid."
      - "Consider whether a thermometer would read a different value for steam and for boiling water at the same pressure."
      - "Compare the energy released when a gas becomes a liquid with the energy a liquid can absorb."
    diagram: null
    confidence: high
  - topic: change_of_state
    type: mcq
    difficulty: medium
    role: apply
    stem: "A mixture of melting ice and water at 0 degrees Celsius is heated steadily. What happens to the temperature while some ice is still present?"
    correct: "it stays constant"
    unit: ""
    wrong:
      - {text: "it rises steadily", mistake: "assumes all supplied heat raises the temperature"}
      - {text: "it falls because the water cools", mistake: "thinks melting absorbs heat so the temperature drops"}
      - {text: "it rises only after all the ice has melted", mistake: "confuses the point at which melting ends with the point at which the temperature changes"}
    explanation: "The heat supplied during melting breaks the forces holding the particles in place (latent heat), so the temperature stays steady until all the ice has melted."
    hints:
      - "Think about where the supplied heat goes during melting."
      - "Consider whether the particles are gaining energy to break free or to move faster."
      - "Ask whether the temperature could change while two states are both present."
    diagram: "A beaker holding ice and water together with a thermometer standing in the mixture, placed over a gentle flame."
    confidence: high
  - topic: change_of_state
    type: mcq
    difficulty: hard
    role: transfer
    stem: "A solid placed in an open tray slowly shrinks and disappears without any liquid forming. Which best describes what happens to its particles?"
    correct: "particles at the surface gain enough energy to escape as vapour directly"
    unit: ""
    wrong:
      - {text: "particles melt first and then evaporate from a puddle", mistake: "assumes every solid passes through the liquid state"}
      - {text: "particles lose energy and condense back into the tray", mistake: "reverses the direction of the change"}
      - {text: "particles become heavier and sink into the tray", mistake: "links the disappearance of the solid to a change in mass"}
    explanation: "Some solids change straight into vapour at the surface, a change called sublimation. The particles leave without passing through a liquid, so no puddle forms."
    hints:
      - "Think about whether a liquid stage must appear for the solid to disappear."
      - "Think about how the particles at the top surface can break away from the rest."
      - "Ask whether the loss of matter means particles were lost or changed state."
    diagram: null
    confidence: high
  - topic: change_of_state
    type: mcq
    difficulty: hard
    role: explain
    stem: "On a heating graph of a pure substance, the temperature stays flat while the substance boils. What is the heat supplied during this flat part used for?"
    correct: "breaking the forces between particles so they become a gas, with no rise in temperature"
    unit: ""
    wrong:
      - {text: "heating has stopped because the substance has no more energy", mistake: "thinks a flat line means no heat is being supplied"}
      - {text: "the substance is changing into a solid", mistake: "confuses boiling with freezing"}
      - {text: "the temperature is falling so heat is being lost", mistake: "reads a flat line as cooling"}
    explanation: "During boiling the supplied heat is used to separate the particles from the liquid, so the temperature remains constant until the whole liquid has become vapour."
    hints:
      - "Compare what the supplied energy is used for during a change of state with what it does while the temperature is rising."
      - "Ask whether the temperature needs to rise for the particles to become a gas."
      - "Consider whether the heat supply is still switched on during the flat section."
    diagram: "A line graph with temperature on the vertical axis and time on the horizontal axis; the line rises, runs level for a stretch while the substance boils, and then rises again."
    confidence: medium
