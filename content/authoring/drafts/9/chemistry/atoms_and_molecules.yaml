  - topic: atomic_mass
    type: numeric
    difficulty: medium
    role: apply
    stem: "How many moles are in 46 grams of sodium atoms, given a molar mass of 23 grams per mole?"
    correct: "2"
    unit: "mol"
    wrong: []
    explanation: "The number of moles equals the mass divided by the molar mass, so 46 g divided by 23 g per mole gives 2 moles."
    hints:
      - "Divide the given mass by the molar mass."
      - "Mass divided by molar mass gives the number of moles."
      - "Check the result by multiplying it back by the molar mass to recover the mass."
