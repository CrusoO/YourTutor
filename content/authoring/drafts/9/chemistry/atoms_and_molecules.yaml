  - topic: chemical_formulae
    type: mcq
    difficulty: hard
    role: explain
    stem: "Magnesium forms a 2+ ion in both magnesium oxide and magnesium chloride. Which statement explains why the two formulas differ?"
    correct: "oxide carries a 2- charge but chloride carries a 1- charge, so different numbers of each ion are needed"
    unit: ""
    wrong:
      - {text: "oxide and chloride carry the same charge, so the formulas should be identical", mistake: "assumes the negative ions of both compounds have the same charge"}
      - {text: "magnesium changes its charge in each compound", mistake: "thinks the charge of the metal changes with the partner ion"}
      - {text: "the formulas differ only because of the order of the symbols", mistake: "treats formula writing as a matter of symbol order"}
    explanation: "Magnesium oxide has one Mg2+ and one O2- ion, giving MgO. Magnesium chloride needs two Cl- ions for each Mg2+ ion, giving MgCl2."
    hints:
      - "Compare the charge on each negative ion with the charge on the magnesium ion."
      - "Ask how many chloride ions are needed to cancel the charge of one magnesium ion."
      - "Consider whether the charge on the magnesium ion changes between the two compounds."
