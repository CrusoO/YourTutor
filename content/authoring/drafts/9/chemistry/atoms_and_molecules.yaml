      - {text: "the valency of each element in the formula", mistake: "uses valency as if it were a mass"}
    explanation: "Molecular mass is the sum of the atomic masses of every atom in the formula, counting repeated atoms each time they appear."
    hints:
      - "Think about what each atom in the formula contributes to the total."
      - "Consider whether every atom shown in the formula is counted."
      - "Pick the option that adds quantities measured in atomic mass units."
