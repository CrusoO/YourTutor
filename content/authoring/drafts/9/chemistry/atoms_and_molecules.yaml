  - topic: laws_of_chemical_combination
    type: mcq
    difficulty: easy
    role: recall
    stem: "Which law states that the total mass of the substances does not change in a chemical reaction?"
    correct: "law of conservation of mass"
    unit: ""
    wrong:
      - {text: "law of constant proportions", mistake: "confuses the law about mass with the law about the makeup of a compound"}
      - {text: "law of multiple proportions", mistake: "picks the law about different compounds of the same elements"}
      - {text: "law of definite volumes", mistake: "applies a gas volume law to the mass of a reaction"}
    explanation: "Atoms are rearranged in a chemical reaction but neither created nor destroyed, so the total mass of the products equals the total mass of the reactants."
    hints:
      - "Think about the total mass of the reactants compared with the total mass of the products."
      - "Consider the principle that the amount of matter is retained in every reaction."
      - "The name of the law says what stays unchanged in a reaction, which is a quantity of matter."
    diagram: null
    confidence: high
  - topic: laws_of_chemical_combination
    type: mcq
    difficulty: easy
    role: recall
    stem: "A compound always contains the same elements in the same mass ratio, whatever its source. Which law describes this?"
    correct: "law of constant proportions"
    unit: ""
    wrong:
      - {text: "law of conservation of mass", mistake: "assumes every mass law describes the makeup of a compound"}
      - {text: "law of multiple proportions", mistake: "confuses one compound with several compounds of the same elements"}
      - {text: "Avogadro's law", mistake: "uses a gas volume law for a mass ratio"}
    explanation: "The law of constant proportions says that a given compound always has the same mass ratio of its elements, regardless of where the sample came from."
    hints:
      - "The law is about the makeup of a single compound, not about a reaction."
      - "Think about whether the proportion of the parts changes from sample to sample."
      - "Consider whether this law concerns the total mass in a reaction or the makeup of one compound."
