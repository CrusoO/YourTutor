    stem: "Ammonium has a valency of one and sulphate has a valency of two. Which formula correctly represents ammonium sulphate?"
    correct: "(NH4)2SO4"
    unit: ""
    wrong:
      - {text: "NH4SO4", mistake: "ignores the need to balance the two charges"}
      - {text: "NH4(SO4)2", mistake: "places the bracket around the wrong group"}
      - {text: "(NH4)SO4", mistake: "keeps one ammonium group even though the sulphate needs two"}
    explanation: "The sulphate group needs two ammonium groups to balance its charge, so the formula is (NH4)2SO4, with brackets around the ammonium group."
    hints:
      - "Balance the charge of the sulphate group with the charge of the ammonium groups."
      - "Compare the valencies of the two groups to see how many of each are needed."
      - "Use brackets around a polyatomic group when more than one of that group appears."
