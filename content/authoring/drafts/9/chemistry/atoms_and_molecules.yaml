  - topic: chemical_formulae
    type: mcq
    difficulty: medium
    role: explain
    stem: "Why is the formula of calcium chloride written as CaCl2 rather than CaCl?"
    correct: "calcium has a valency of two, so two chloride ions are needed to balance it"
    unit: ""
    wrong:
      - {text: "chlorine must always appear twice in any formula", mistake: "assumes a fixed count for each non-metal"}
      - {text: "calcium has a valency of one, so one chloride is enough", mistake: "uses the wrong valency for calcium"}
      - {text: "CaCl is wrong because it is a molecule with unequal charges", mistake: "misreads an ionic formula as a molecular one"}
    explanation: "Calcium forms Ca2+ and chloride forms Cl-, so two chloride ions are needed to cancel the charge of one calcium ion, giving CaCl2."
    hints:
      - "Look up the valency of the metal from its group in the periodic table."
      - "Check whether the total positive charge equals the total negative charge."
      - "Consider what the metal's valency tells you about the number of chloride ions required."
    diagram: null
    confidence: high
