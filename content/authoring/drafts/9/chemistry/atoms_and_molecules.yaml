  - topic: atomic_mass
    type: mcq
    difficulty: easy
    role: recall
    stem: "What is the SI unit of the amount of substance?"
    correct: "mole"
    unit: ""
    wrong:
      - {text: "gram", mistake: "confuses the amount of substance with its mass"}
      - {text: "litre", mistake: "uses a volume unit for the amount of substance"}
      - {text: "atomic mass unit", mistake: "treats the unit of a single atom's mass as the unit of amount"}
    explanation: "The mole is the SI unit of amount of substance and counts a fixed large number of particles, about 6.022e23 of them."
    hints:
      - "Think about the unit that counts a very large number of particles at once."
      - "The value of this unit is linked to the number of atoms in twelve grams of carbon-12."
      - "Name the unit that Avogadro's number is written per."
