  - topic: atomic_mass
    type: mcq
    difficulty: medium
    role: explain
    stem: "Two samples each contain exactly one mole of particles, one of carbon atoms and one of iron atoms. Which statement about their masses is correct?"
    correct: "the iron sample has the greater mass because iron atoms are heavier"
    unit: ""
    wrong:
      - {text: "the carbon sample is heavier because carbon has more electrons", mistake: "counts electrons rather than atomic mass"}
      - {text: "both samples have equal mass because they contain the same number of particles", mistake: "equates the number of particles with the mass"}
      - {text: "the carbon sample is heavier because carbon atoms are smaller in volume", mistake: "confuses volume with mass"}
    explanation: "Equal numbers of particles do not have equal mass when the particles differ. Iron atoms have a much larger atomic mass than carbon atoms, so one mole of iron has a larger mass."
    hints:
      - "Compare the masses of single atoms of the two elements."
      - "Ask whether equal numbers of particles always have equal mass."
      - "Consider what the atomic mass of each element tells you about its atoms."
