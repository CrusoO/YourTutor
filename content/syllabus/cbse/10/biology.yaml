class: 10
subject: biology
syllabus_basis: "latest national school syllabus as known to the drafter; to be verified against the textbooks"
chapters:
  - key: life_processes
    title: "Life processes"
    confidence: high
    topics:
      - key: nutrition_modes
        title: "Autotrophic and heterotrophic nutrition"
        outcomes:
          - "Compare autotrophic and heterotrophic modes of nutrition."
        kind: fact
        diagram: false
      - key: photosynthesis_and_respiration
        title: "Photosynthesis and respiration"
        outcomes:
          - "Write the word and chemical equations for photosynthesis and aerobic respiration."
        kind: fact
        diagram: false
      - key: transport_in_plants
        title: "Transport of water and food in plants"
        outcomes:
          - "Describe how xylem and phloem move water and food."
        kind: concept
        diagram: true
      - key: blood_and_circulation
        title: "Transport of substances in humans"
        outcomes:
          - "Describe the role of blood, the heart and blood vessels in transport."
        kind: concept
        diagram: true
      - key: excretion
        title: "Excretion in humans and plants"
        outcomes:
          - "Describe the structure and function of the nephron."
        kind: diagram
        diagram: true
  - key: control_and_coordination
    title: "Control and coordination"
    confidence: high
    topics:
      - key: nervous_system
        title: "Nervous system and nerve impulse"
        outcomes:
          - "Describe the structure of a neuron and how an impulse travels along it."
        kind: diagram
        diagram: true
      - key: reflex_action
        title: "Reflex action and reflex arc"
        outcomes:
          - "Trace the path of a reflex action through the reflex arc."
        kind: concept
        diagram: true
      - key: plant_hormones
        title: "Hormones in plants"
        outcomes:
          - "Describe the roles of auxins, gibberellins and cytokinins in plants."
        kind: fact
        diagram: false
      - key: human_endocrine_system
        title: "Hormones in humans"
        outcomes:
          - "Match human hormones with the glands that produce them and their functions."
        kind: fact
        diagram: true
  - key: how_do_organisms_reproduce
    title: "How do organisms reproduce"
    confidence: high
    topics:
      - key: asexual_reproduction
        title: "Asexual reproduction"
        outcomes:
          - "Name the types of asexual reproduction and give an example of each."
        kind: fact
        diagram: false
      - key: sexual_reproduction_plants
        title: "Sexual reproduction in flowering plants"
        outcomes:
          - "Label the parts of a flower and describe pollination and fertilisation."
        kind: fact
        diagram: true
      - key: human_reproductive_system
        title: "Reproduction in humans"
        outcomes:
          - "Describe the male and female reproductive systems and fertilisation in humans."
        kind: fact
        diagram: true
      - key: reproductive_health
        title: "Reproductive health and contraception"
        outcomes:
          - "Compare methods of contraception and their role in family planning."
        kind: concept
        diagram: false
  - key: heredity_and_evolution
    title: "Heredity and evolution"
    confidence: high
    topics:
      - key: mendels_experiments
        title: "Mendel's experiments and monohybrid crosses"
        outcomes:
          - "Work out the genotype and phenotype ratios of a monohybrid cross."
        kind: computed
        diagram: true
      - key: sex_determination
        title: "Sex determination in humans"
        outcomes:
          - "Explain how the sex of a child is determined from the parental chromosomes."
        kind: computed
        diagram: true
      - key: variation_and_inheritance
        title: "Variation and its inheritance"
        outcomes:
          - "Explain how variation arises and how traits are passed on."
        kind: concept
        diagram: false
      - key: evolution_and_speciation
        title: "Evolution and speciation"
        outcomes:
          - "Explain how natural selection and isolation can lead to new species."
        kind: concept
        diagram: false
      - key: fossils_and_evidence
        title: "Evidence for evolution"
        outcomes:
          - "Use fossils and homologous structures as evidence for evolution."
        kind: fact
        diagram: false
  - key: our_environment
    title: "Our environment"
    confidence: high
    topics:
      - key: ecosystem_components
