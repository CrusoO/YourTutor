        diagram: true
      - key: energy_flow_and_biomagnification
        title: "Energy flow and biomagnification"
        outcomes:
          - "Explain why energy decreases and toxic substances increase along a food chain."
        kind: concept
        diagram: true
      - key: ozone_layer
        title: "Ozone layer depletion"
        outcomes:
          - "Explain the causes and effects of ozone layer depletion."
        kind: fact
        diagram: false
      - key: waste_management
        title: "Waste management"
        outcomes:
          - "Suggest ways to reduce, reuse and recycle waste."
        kind: concept
        diagram: false
