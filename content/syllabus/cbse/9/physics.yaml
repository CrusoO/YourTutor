class: 9
subject: physics
syllabus_basis: "latest national school syllabus as known to the drafter; to be verified against the textbooks"
chapters:
  - key: motion
    title: "Motion"
    confidence: high
    topics:
      - key: describing_motion
        title: "Describing motion and reference points"
        outcomes:
          - "Explain when an object is at rest or in motion relative to a reference point."
        kind: fact
        diagram: false
      - key: distance_and_displacement
        title: "Distance and displacement"
        outcomes:
          - "Find the displacement of an object from its initial and final positions."
        kind: computed
        diagram: true
      - key: speed_and_velocity
        title: "Speed and velocity"
        outcomes:
          - "Calculate average speed and average velocity for a journey."
        kind: computed
        diagram: false
      - key: acceleration
        title: "Acceleration"
        outcomes:
          - "Calculate acceleration and decide whether an object is speeding up or slowing down."
        kind: computed
        diagram: false
      - key: motion_graphs
        title: "Distance-time and velocity-time graphs"
        outcomes:
          - "Read a velocity-time graph to find acceleration and distance travelled."
        kind: computed
        diagram: true
      - key: equations_of_motion
        title: "Equations of uniformly accelerated motion"
        outcomes:
          - "Use the three equations of motion to solve problems with constant acceleration."
        kind: computed
        diagram: false
      - key: uniform_circular_motion
        title: "Uniform circular motion"
        outcomes:
          - "Explain why an object moving in a circle at constant speed is accelerating."
        kind: concept
        diagram: false
  - key: force_and_laws_of_motion
    title: "Force and laws of motion"
    confidence: high
    topics:
      - key: force_concept
        title: "Force and its effects"
        outcomes:
          - "Describe how a force can change the shape or motion of an object."
        kind: fact
        diagram: false
      - key: balanced_and_unbalanced_forces
        title: "Balanced and unbalanced forces"
        outcomes:
          - "Find the net force on an object from the forces acting on it."
        kind: concept
        diagram: true
      - key: first_law
        title: "Newton's first law and inertia"
        outcomes:
          - "Explain inertia using examples from everyday situations."
        kind: concept
        diagram: false
      - key: second_law
        title: "Newton's second law"
        outcomes:
          - "Calculate force from mass and acceleration."
        kind: computed
        diagram: false
      - key: third_law
        title: "Newton's third law"
        outcomes:
          - "Identify action and reaction pairs in a given situation."
        kind: concept
        diagram: false
      - key: momentum
        title: "Momentum"
        outcomes:
          - "Calculate the momentum of a moving object."
        kind: computed
        diagram: false
      - key: conservation_of_momentum
        title: "Conservation of momentum"
        outcomes:
          - "Predict the velocities after a collision using conservation of momentum."
        kind: computed
        diagram: false
  - key: gravitation
    title: "Gravitation"
    confidence: high
    topics:
      - key: universal_gravitation
        title: "Universal law of gravitation"
        outcomes:
          - "Explain why objects attract each other and how the force depends on distance."
        kind: concept
        diagram: false
      - key: free_fall
        title: "Free fall and acceleration due to gravity"
        outcomes:
          - "Calculate the velocity and distance of a freely falling object."
        kind: computed
        diagram: false
      - key: mass_and_weight
        title: "Mass and weight"
        outcomes:
          - "Calculate weight from mass using the local value of gravity."
        kind: computed
        diagram: false
      - key: thrust_and_pressure
        title: "Thrust and pressure"
        outcomes:
          - "Calculate pressure from force and area and compare pressures in different situations."
        kind: computed
        diagram: false
      - key: buoyancy_and_archimedes
        title: "Buoyancy and Archimedes' principle"
        outcomes:
          - "Decide whether an object floats or sinks using the upthrust it experiences."
        kind: computed
        diagram: true
  - key: work_and_energy
    title: "Work and energy"
    confidence: high
    topics:
      - key: work_done
        title: "Work done by a force"
        outcomes:
          - "Calculate work done when a force moves an object through a distance."
        kind: computed
        diagram: false
      - key: forms_of_energy
        title: "Forms of energy"
        outcomes:
          - "Name the forms of energy and how energy changes from one form to another."
        kind: fact
        diagram: false
      - key: kinetic_energy
        title: "Kinetic energy"
        outcomes:
          - "Calculate the kinetic energy of a moving object."
        kind: computed
        diagram: false
      - key: potential_energy
        title: "Potential energy"
        outcomes:
          - "Calculate the gravitational potential energy of an object raised to a height."
        kind: computed
        diagram: false
      - key: conservation_of_energy
        title: "Law of conservation of energy"
        outcomes:
          - "Explain energy changes in a falling or swinging object."
        kind: concept
        diagram: true
      - key: power
        title: "Power"
        outcomes:
          - "Calculate power as the rate of doing work."
        kind: computed
        diagram: false
  - key: sound
    title: "Sound"
    confidence: high
    topics:
      - key: sound_production
        title: "Production and propagation of sound"
        outcomes:
          - "Explain that sound is produced by vibrations and needs a medium to travel."
        kind: concept
        diagram: true
      - key: sound_waves_characteristics
        title: "Characteristics of a sound wave"
        outcomes:
          - "Relate frequency, amplitude and wavelength to the pitch and loudness of a sound."
        kind: computed
        diagram: true
      - key: audible_range
        title: "Audible range and ultrasound"
        outcomes:
          - "State the range of frequencies humans can hear and what lies outside it."
        kind: fact
        diagram: false
      - key: reflection_of_sound
        title: "Reflection of sound and echoes"
        outcomes:
          - "Calculate the distance to a reflecting surface from the time of an echo."
        kind: computed
        diagram: false
