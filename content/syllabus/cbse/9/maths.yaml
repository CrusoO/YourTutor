class: 9
subject: maths
syllabus_basis: "latest national school syllabus as known to the drafter; to be verified against the textbooks"
chapters:
  - key: number_systems
    title: "Number systems"
    confidence: high
    topics:
      - key: rational_irrational
        title: "Rational and irrational numbers"
        outcomes:
          - "Tell rational numbers from irrational ones by their decimal expansions."
          - "Show that a given decimal number is rational or irrational."
        kind: concept
        diagram: false
      - key: irrationals_number_line
        title: "Locating irrational numbers on the number line"
        outcomes:
          - "Mark square-root values on the number line using a right triangle construction."
        kind: concept
        diagram: true
      - key: laws_of_exponents
        title: "Laws of exponents for real numbers"
        outcomes:
          - "Simplify expressions with rational powers using the laws of exponents."
        kind: computed
        diagram: false
      - key: rationalising_denominators
        title: "Rationalising the denominator"
        outcomes:
          - "Rationalise a denominator that contains a square root or a sum of roots."
        kind: computed
        diagram: false
  - key: polynomials
    title: "Polynomials"
    confidence: high
    topics:
      - key: polynomial_basics
        title: "Polynomials, degree and types"
        outcomes:
          - "Identify the degree and type of a polynomial in one variable."
        kind: fact
        diagram: false
      - key: zeros_and_remainder
        title: "Zeros of a polynomial and the remainder theorem"
        outcomes:
          - "Find the remainder on division by a linear polynomial without long division."
        kind: computed
        diagram: false
      - key: factor_theorem
        title: "Factor theorem"
        outcomes:
          - "Decide whether a linear factor divides a polynomial and factorise it."
        kind: computed
        diagram: false
      - key: algebraic_identities
        title: "Standard algebraic identities"
        outcomes:
          - "Expand and simplify expressions using the standard identities."
        kind: computed
        diagram: false
  - key: coordinate_geometry
    title: "Coordinate geometry"
    confidence: high
    topics:
      - key: cartesian_plane
        title: "The Cartesian plane and its quadrants"
        outcomes:
          - "Name the axes, origin and quadrants of the coordinate plane."
        kind: fact
        diagram: true
      - key: plotting_points
        title: "Plotting points and reading coordinates"
        outcomes:
          - "Plot an ordered pair and read the coordinates of a marked point."
        kind: computed
        diagram: true
  - key: linear_equations_two_variables
    title: "Linear equations in two variables"
    confidence: high
    topics:
      - key: solutions_of_linear_equations
        title: "Solutions of a linear equation in two variables"
        outcomes:
          - "Check whether an ordered pair is a solution of a linear equation."
          - "Find further solutions by choosing one value and solving for the other."
        kind: computed
        diagram: false
      - key: graph_of_linear_equation
        title: "Graph of a linear equation"
        outcomes:
          - "Draw the graph of a linear equation by plotting solutions."
        kind: computed
        diagram: true
  - key: euclid_geometry
    title: "Introduction to Euclid's geometry"
    confidence: low
    topics:
      - key: euclid_axioms
        title: "Euclid's definitions, axioms and postulates"
        outcomes:
          - "Distinguish a definition, an axiom and a postulate."
        kind: fact
        diagram: false
      - key: fifth_postulate
        title: "The fifth postulate and its equivalents"
        outcomes:
          - "Explain why the fifth postulate is treated differently from the other axioms."
        kind: concept
        diagram: false
  - key: lines_and_angles
    title: "Lines and angles"
    confidence: high
    topics:
      - key: basic_angle_terms
        title: "Lines, rays and types of angles"
        outcomes:
          - "Classify angles as acute, right, obtuse, straight or reflex."
        kind: fact
        diagram: true
      - key: transversal_parallel_lines
        title: "Angles formed by a transversal with parallel lines"
        outcomes:
          - "Find unknown angles using corresponding, alternate and co-interior angle pairs."
        kind: concept
        diagram: true
      - key: linear_pair_vertical_angles
        title: "Linear pair and vertically opposite angles"
        outcomes:
          - "Use the linear pair and vertical angle results to find missing angles."
        kind: computed
        diagram: true
  - key: triangles
    title: "Triangles"
    confidence: high
    topics:
      - key: congruence_criteria
        title: "Congruence of triangles and the congruence criteria"
        outcomes:
          - "Decide whether two triangles are congruent from the given sides and angles."
        kind: concept
        diagram: true
      - key: isosceles_triangle_properties
        title: "Properties of isosceles triangles"
        outcomes:
          - "Use the equal sides and equal angles of an isosceles triangle to prove results."
        kind: concept
        diagram: true
      - key: inequalities_in_triangles
        title: "Inequalities in a triangle"
        outcomes:
          - "Compare sides and angles of a triangle using the inequality results."
        kind: concept
        diagram: true
  - key: quadrilaterals
    title: "Quadrilaterals"
    confidence: high
    topics:
      - key: angle_sum_quadrilateral
        title: "Angle sum property of a quadrilateral"
        outcomes:
          - "Find an unknown angle of a quadrilateral using the angle sum."
        kind: computed
        diagram: true
      - key: parallelogram_properties
        title: "Properties of parallelograms"
        outcomes:
          - "Use the opposite sides, angles and diagonals of a parallelogram in proofs."
        kind: concept
        diagram: true
      - key: midpoint_theorem
        title: "Mid-point theorem"
        outcomes:
          - "Apply the mid-point theorem to find lengths in a triangle."
        kind: concept
        diagram: true
  - key: areas_of_parallelograms_and_triangles
    title: "Areas of parallelograms and triangles"
    confidence: high
    topics:
      - key: parallelograms_same_base
        title: "Parallelograms on the same base and between the same parallels"
        outcomes:
          - "Compare the areas of parallelograms that share a base and lie between parallels."
        kind: concept
        diagram: true
      - key: triangles_same_base
        title: "Triangles on the same base and between the same parallels"
        outcomes:
          - "Show that triangles on a common base between parallels have equal area."
        kind: concept
        diagram: true
  - key: circles
    title: "Circles"
    confidence: high
    topics:
      - key: circle_terms
        title: "Parts of a circle"
        outcomes:
          - "Name the chord, arc, segment, sector and radius of a circle."
        kind: fact
        diagram: true
      - key: angles_subtended_by_chords
        title: "Angles subtended by chords"
        outcomes:
          - "Relate the angle at the centre to the angle at the circumference."
        kind: concept
        diagram: true
      - key: cyclic_quadrilaterals
        title: "Cyclic quadrilaterals"
        outcomes:
          - "Use the opposite-angle property of a cyclic quadrilateral to find angles."
        kind: computed
        diagram: true
  - key: constructions
    title: "Constructions"
    confidence: high
    topics:
      - key: basic_constructions
        title: "Bisectors and perpendiculars with ruler and compasses"
        outcomes:
          - "Construct the bisector of an angle and the perpendicular bisector of a segment."
        kind: concept
        diagram: true
      - key: triangle_constructions
        title: "Constructing triangles from given measures"
        outcomes:
          - "Construct a triangle when its sides or angles are given."
        kind: concept
        diagram: true
  - key: herons_formula
    title: "Heron's formula"
    confidence: high
    topics:
      - key: heron_area_of_triangle
        title: "Area of a triangle by Heron's formula"
        outcomes:
          - "Find the area of a triangle when all three sides are known."
        kind: computed
        diagram: false
      - key: area_of_quadrilateral
        title: "Area of a quadrilateral by splitting it into triangles"
        outcomes:
          - "Split a quadrilateral along a diagonal and apply Heron's formula twice."
        kind: computed
        diagram: true
  - key: surface_areas_and_volumes
    title: "Surface areas and volumes"
    confidence: high
    topics:
      - key: cuboid_and_cube
        title: "Surface area and volume of cuboid and cube"
        outcomes:
          - "Find the total surface area and volume of a cuboid or cube."
        kind: computed
        diagram: false
      - key: cylinder_cone_sphere
        title: "Cylinder, cone and sphere"
        outcomes:
          - "Calculate curved surface area, total surface area and volume of these solids."
        kind: computed
        diagram: true
      - key: combined_solids
        title: "Combined solids"
        outcomes:
          - "Find the surface area and volume of a solid made of two joined shapes."
        kind: computed
        diagram: true
  - key: statistics
    title: "Statistics"
    confidence: high
    topics:
      - key: collecting_organising_data
        title: "Collecting and organising data"
        outcomes:
          - "Organise raw data into a frequency table."
        kind: fact
        diagram: false
      - key: graphical_representation
        title: "Bar graphs, histograms and frequency polygons"
        outcomes:
          - "Draw and read a histogram and a frequency polygon."
        kind: computed
        diagram: true
      - key: mean_median_mode
        title: "Mean, median and mode"
        outcomes:
          - "Compute the mean, median and mode of ungrouped and grouped data."
        kind: computed
        diagram: false
  - key: probability
    title: "Probability"
    confidence: high
    topics:
      - key: experimental_probability
        title: "Experimental probability"
        outcomes:
          - "Estimate a probability from the results of repeated trials."
        kind: computed
        diagram: false
      - key: theoretical_probability
        title: "Theoretical probability with equally likely outcomes"
        outcomes:
          - "Find the probability of an event from a list of equally likely outcomes."
        kind: computed
        diagram: false
