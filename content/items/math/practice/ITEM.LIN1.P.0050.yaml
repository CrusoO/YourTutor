stem:
  en: A pen costs 15 rupees more than a book. Together they cost 47 rupees. How many
    rupees is the book?
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
answer:
  sympy: '16'
  accept:
  - '16'
  - x=16
solution_steps:
- en: Let the book cost x rupees. Then the pen costs x + 15.
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
- en: x + (x + 15) = 47.
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
- en: x = 16
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
