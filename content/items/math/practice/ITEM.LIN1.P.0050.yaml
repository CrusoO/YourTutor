- level: 2
  en: The two prices add to 47. Write the pen as x plus 15, then add the two prices
    — stop before you solve.
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
- level: 3
  en: Let x be the book. Then x + (x + 15) = 47. Combine to 2x + 15 = 47, subtract
    15, and divide by 2.
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
