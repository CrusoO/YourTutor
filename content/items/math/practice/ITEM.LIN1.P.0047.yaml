    x?
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
- level: 2
  en: The two prices add to 70. Write the notebook as x plus 20, then add the two
    prices — stop before you solve.
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
- level: 3
  en: Let x be the pen. Then x + (x + 20) = 70. Combine to 2x + 20 = 70, subtract
    20, and divide by 2.
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
