stem:
  en: A notebook costs 20 rupees more than a pen. Together they cost 70 rupees. How
    many rupees is the pen?
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
answer:
  sympy: '25'
  accept:
  - '25'
  - x=25
solution_steps:
- en: Let the pen cost x rupees. Then the notebook costs x + 20.
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
- en: x + (x + 20) = 70.
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
- en: x = 25
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
hints:
- level: 1
  en: Let x be the cost of the pen in rupees. How much is the notebook, in terms of
    x?
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
- level: 2
  en: The two prices add to 70. Write the notebook as x plus 20, then add the two
    prices — stop before you solve.
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
- level: 3
  en: Let x be the pen. Then x + (x + 20) = 70. Combine to 2x + 20 = 70, subtract
    20, and divide by 2.
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
