stem:
  en: A notebook costs 20 rupees more than a pen. Together they cost 70 rupees. How
    many rupees is the pen?
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
answer:
  sympy: '25'
  accept:
  - '25'
  - x=25
solution_steps:
- en: Let the pen cost x rupees. Then the notebook costs x + 20.
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
- en: x + (x + 20) = 70.
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
- en: x = 25
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
hints:
