id: TPL.BR.MINUS
skill_id: MATH.ALG.LIN1.BRACKETS
structure: 'Solve for x: N(x - N) = N'
parameters:
  a:
    min: 2
    max: 5
  n:
    min: 1
    max: 6
  x:
    min: 5
    max: 16
derived:
  inner: x - n
  rhs: a * (x - n)
constraints:
  nonzero:
  - a
  - n
  answer_min: 5
  answer_max: 16
  no_one_x: true
  no_trivial: true
  distinct:
  - a
  - n
answer_expr: x
stem: 'Solve for x: {a}(x - {n}) = {rhs}'
verify: '{a}(x - {n}) = {rhs}'
type: expression
options: []
prediction: Will x be greater than the number inside the brackets?
steps:
- 'Divide both sides by {a}: x - {n} = {inner}.'
- Add {n}.
- x = {x}
hints:
  '1': The {a} sits outside (x - {n}). Divide first to unwrap the bracket.
  '2': Divide both sides by {a} first. You get x - {n} = {inner}.
  '3': Then add {n} to isolate x.
misconceptions:
- id: MC.ALG.DISTRIBUTE_WRONG
  formula: rhs + a
tier_rules:
- tier: easy
  difficulty: 0.25
  max_abs_answer: 6
  max_abs_coeff: 3
- tier: medium
  difficulty: 0.55
  max_abs_answer: 10
- tier: hard
  difficulty: 0.86
status: draft
