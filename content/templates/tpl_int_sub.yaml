id: TPL.INT.SUB
skill_id: MATH.ARITH.INTEGERS.OPERATIONS
structure: Compute N - N.
parameters:
  a:
    min: 8
    max: 40
  b:
    min: 2
    max: 12
derived: {}
constraints:
  nonzero:
  - b
  answer_min: 1
  answer_max: 40
  no_one_x: true
  no_trivial: true
  distinct:
  - a
  - b
answer_expr: a - b
stem: Compute {a} - {b}.
verify: '{a} - {b}'
type: expression
options: []
prediction: Will the result be smaller than {a}?
steps:
- '{a} minus {b} is {answer}.'
- x = {answer}
hints:
  '1': Is {a} larger than {b}? Are we taking away or adding?
  '2': Start at {a} and move {b} steps left on the number line.
  '3': Take {b} away from {a}.
misconceptions:
- id: MC.ALG.ADD_INSTEAD_SUBTRACT
  formula: a + b
tier_rules:
- tier: easy
  difficulty: 0.25
  max_abs_answer: 6
  max_abs_coeff: 3
- tier: medium
  difficulty: 0.55
  max_abs_answer: 10
- tier: hard
  difficulty: 0.86
status: draft
