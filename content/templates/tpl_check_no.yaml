id: TPL.CHECK.NO
skill_id: MATH.ALG.LIN1.CHECK_SOLUTION
structure: Is N a solution of Nx + N = N?
parameters:
  a:
    min: 2
    max: 5
  b:
    min: 1
    max: 5
  x:
    min: 2
    max: 8
derived:
  rhs: a * x + b
  probe: x + 1
constraints:
  nonzero:
  - a
  no_one_x: true
  distinct:
  - a
  - b
answer_expr: 'no'
stem: Is {probe} a solution of {a}x + {b} = {rhs}?
verify:
  kind: substitution
  equation: '{a}x + {b} = {rhs}'
  value: '{probe}'
type: mcq
options:
- id: 'yes'
  en: 'Yes'
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
- id: 'no'
  en: 'No'
  ne: <Nepali — to be filled by reviewer>
  as: <Assamese — to be filled by reviewer>
prediction: Do you expect the two sides to match?
steps:
- Substitute x = {probe} into {a}x + {b} = {rhs}.
- The correct option is no.
hints:
  '1': Replace x with {probe} on the left of {a}x + {b} = {rhs}.
  '2': After substituting {probe}, compare the two sides of {a}x + {b} = {rhs}.
  '3': Plug in {probe} and see whether the two sides match.
misconceptions: []
tier_rules:
- tier: easy
  difficulty: 0.25
  max_abs_coeff: 3
- tier: medium
  difficulty: 0.55
  max_abs_coeff: 4
- tier: hard
  difficulty: 0.86
status: draft
