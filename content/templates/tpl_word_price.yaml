id: TPL.WORD.PRICE
skill_id: MATH.ALG.LIN1.WORD_PROBLEMS
role: apply
structure: A notebook costs N rupees more than a pen. Together they cost N rupees.
parameters:
  extra:
    min: 8
    max: 24
  x:
    min: 6
    max: 30
derived:
  total: 2 * x + extra
constraints:
  nonzero:
  - extra
  answer_min: 6
  answer_max: 30
  no_one_x: true
  no_trivial: true
  distinct:
  - extra
  - x
answer_expr: x
stem: A notebook costs {extra} rupees more than a pen. Together they cost {total}
  rupees. How many rupees is the pen?
verify: x + (x + {extra}) = {total}
type: expression
options: []
prediction: Is the pen cheaper than the notebook?
steps:
- Let the pen cost x rupees. Then the notebook costs x + {extra}.
- x + (x + {extra}) = {total}.
- x = {x}
hints:
  '1': Let x be the cost of the pen in rupees. How much is the notebook, in terms
    of x?
  '2': The two prices add to {total} rupees. Write the notebook as x plus {extra},
    then add the two prices — stop before you solve.
  '3': Let x be the pen. Then x + (x + {extra}) = {total}. Combine, subtract {extra},
    and divide by 2.
misconceptions:
- id: MC.ALG.INVERSE_OP_WRONG_SIDE
  formula: total + extra
tier_rules:
- tier: easy
  difficulty: 0.25
  max_abs_answer: 6
  max_abs_coeff: 3
- tier: medium
  difficulty: 0.55
  max_abs_answer: 10
- tier: hard
  difficulty: 0.86
status: draft
