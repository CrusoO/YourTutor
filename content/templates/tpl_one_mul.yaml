id: TPL.ONE.MUL
skill_id: MATH.ALG.LIN1.SOLVE_ONE_STEP
structure: 'Solve for x: Nx = N'
parameters:
  a:
    min: 2
    max: 8
  x:
    min: 2
    max: 12
derived:
  c: a * x
constraints:
  nonzero:
  - a
  answer_min: 2
  answer_max: 12
  no_one_x: true
  no_trivial: true
answer_expr: x
stem: 'Solve for x: {a}x = {c}'
verify: '{a}x = {c}'
type: expression
options: []
prediction: Will x be smaller than {c}?
steps:
- Divide both sides by {a}.
- x = {c}/{a}
- x = {x}
hints:
  '1': x is multiplied by {a}. What single step isolates x?
  '2': Divide both sides of {c} by {a}.
  '3': '{c} divided by {a} is the value of x.'
misconceptions:
- id: MC.ALG.INVERSE_OP_WRONG_SIDE
  formula: c + a
tier_rules:
- tier: easy
  difficulty: 0.25
  max_abs_answer: 6
  max_abs_coeff: 3
- tier: medium
  difficulty: 0.55
  max_abs_answer: 10
- tier: hard
  difficulty: 0.86
status: draft
