id: TPL.BOTH.B_AX
skill_id: MATH.ALG.LIN1.VARIABLES_BOTH_SIDES
structure: 'Solve for x: N + Nx = N + Nx'
parameters:
  a:
    min: 4
    max: 7
  c:
    min: 1
    max: 3
  b:
    min: 2
    max: 7
  x:
    min: 2
    max: 14
derived:
  d: (a - c) * x + b
constraints:
  nonzero:
  - a
  - c
  - b
  answer_min: 2
  answer_max: 14
  no_one_x: true
  no_trivial: true
  distinct:
  - a
  - b
answer_expr: x
stem: 'Solve for x: {b} + {a}x = {d} + {c}x'
verify: '{b} + {a}x = {d} + {c}x'
type: expression
options: []
prediction: Is x larger than 1?
steps:
- Subtract {c}x from both sides.
- Collect x, then undo {b}.
- x = {x}
hints:
  '1': 'x appears on both sides: {a}x and {c}x.'
  '2': Collect the x terms before you touch the + {b}.
  '3': After the x terms sit on one side, subtract {b} and divide.
misconceptions:
- id: MC.ALG.MOVE_TERM_WITHOUT_SIGN
  formula: d + b
tier_rules:
- tier: easy
  difficulty: 0.25
  max_abs_answer: 6
  max_abs_coeff: 3
- tier: medium
  difficulty: 0.55
  max_abs_answer: 10
- tier: hard
  difficulty: 0.86
status: draft
