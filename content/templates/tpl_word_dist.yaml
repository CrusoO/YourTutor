id: TPL.WORD.DIST
skill_id: MATH.ALG.LIN1.WORD_PROBLEMS
structure: A traveller walks some distance and then cycles N km. The whole trip is
  N km.
parameters:
  extra:
    min: 3
    max: 12
  x:
    min: 5
    max: 20
derived:
  total: x + extra
constraints:
  nonzero:
  - extra
  answer_min: 5
  answer_max: 20
  no_one_x: true
  no_trivial: true
  distinct:
  - extra
  - x
answer_expr: x
stem: A traveller walks some distance and then cycles {extra} km. The whole trip is
  {total} km. How many kilometres did they walk?
verify: x + {extra} = {total}
type: expression
options: []
prediction: Is the walking part shorter than the whole trip?
steps:
- The two parts add to {total} km.
- x + {extra} = {total}.
- x = {x}
hints:
  '1': Let x be the kilometres walked.
  '2': The whole trip is {total} km and the cycling stretch is {extra} km. Write how
    x and {extra} make {total} — do not evaluate yet.
  '3': Let x be the kilometres walked. Then x + {extra} = {total}. Subtract {extra}
    to isolate x.
misconceptions:
- id: MC.ALG.INVERSE_OP_WRONG_SIDE
  formula: total + extra
tier_rules:
- tier: easy
  difficulty: 0.25
  max_abs_answer: 6
  max_abs_coeff: 3
- tier: medium
  difficulty: 0.55
  max_abs_answer: 10
- tier: hard
  difficulty: 0.86
status: draft
