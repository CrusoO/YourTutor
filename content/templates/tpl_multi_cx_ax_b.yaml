id: TPL.MULTI.CX_AX_B
skill_id: MATH.ALG.LIN1.SOLVE_MULTI
role: procedure
structure: 'Solve for x: Nx + Nx + N = N'
parameters:
  a:
    min: 1
    max: 4
  c:
    min: 2
    max: 5
  b:
    min: 2
    max: 7
  x:
    min: 2
    max: 14
derived:
  s: a + c
  rhs: (a + c) * x + b
constraints:
  nonzero:
  - a
  - c
  - b
  answer_min: 2
  answer_max: 14
  no_one_x: true
  no_trivial: true
  distinct:
  - b
  - s
answer_expr: x
stem: 'Solve for x: {c}x + {a}x + {b} = {rhs}'
verify: '{c}x + {a}x + {b} = {rhs}'
type: expression
options: []
prediction: Are there like terms you can gather first?
steps:
- 'Combine like terms: {s}x + {b} = {rhs}.'
- Move the constant, then divide by {s}.
- x = {x}
hints:
  '1': The left side has {c}x and {a}x. Gather those first.
  '2': After combining, undo the + {b} then divide by the new coefficient.
  '3': Rewrite as {s}x + {b} = {rhs}. Move {b}, then divide by {s}.
misconceptions:
- id: MC.ALG.SIGN_ERROR
  formula: rhs + b
tier_rules:
- tier: easy
  difficulty: 0.25
  max_abs_answer: 6
  max_abs_coeff: 3
- tier: medium
  difficulty: 0.55
  max_abs_answer: 10
- tier: hard
  difficulty: 0.86
status: draft
