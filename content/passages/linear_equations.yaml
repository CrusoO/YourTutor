# Authored notes for the Ask feature, mapped to the sections of the linear equations chapter.
# Every passage is draft until a reviewer approves it. Text is written for this product (licence
# "owned"); textbook text may be added only with written permission on file.
passages:
  - id: PSG.LIN1.INVERSE.1
    chapter_id: bhutan_class9
    section_key: s1
    skill_ids: [MATH.ALG.INVERSE_OPERATIONS]
    source_type: authored_notes
    licence_status: owned
    source_ref: NOTE.ALG.INVERSE
    text: >-
      An inverse operation undoes another operation. Addition and subtraction undo each other,
      and multiplication and division undo each other. To undo adding 5, subtract 5.
  - id: PSG.LIN1.INTEGERS.1
    chapter_id: bhutan_class9
    section_key: s1
    skill_ids: [MATH.ARITH.INTEGERS.OPERATIONS]
    source_type: authored_notes
    licence_status: owned
    source_ref: NOTE.ARITH.INTEGERS
    text: >-
      Subtracting a number is the same as adding its opposite. So 3 - 5 equals 3 + (-5), which is
      -2. Adding two negative numbers gives a negative number.
  - id: PSG.LIN1.ONE_STEP.1
    chapter_id: bhutan_class9
    section_key: s1
    skill_ids: [MATH.ALG.LIN1.SOLVE_ONE_STEP]
    source_type: authored_notes
    licence_status: owned
    source_ref: NOTE.LIN1.ONE_STEP
    text: >-
      An equation says that two sides are equal. To solve a one-step equation, do the inverse
      operation to both sides so the equation stays balanced. For x + 4 = 9, subtract 4 from both
      sides to get x = 5.
  - id: PSG.LIN1.ONE_STEP.2
    chapter_id: bhutan_class9
    section_key: s1
    skill_ids: [MATH.ALG.LIN1.SOLVE_ONE_STEP]
    source_type: authored_notes
    licence_status: owned
    source_ref: NOTE.LIN1.ONE_STEP
    text: >-
      When a variable is multiplied by a number, divide both sides by that number. For 3x = 12,
      divide both sides by 3 to get x = 4.
  - id: PSG.LIN1.TWO_STEP.1
    chapter_id: bhutan_class9
    section_key: s2
    skill_ids: [MATH.ALG.LIN1.SOLVE_TWO_STEP]
    source_type: authored_notes
    licence_status: owned
    source_ref: NOTE.LIN1.TWO_STEP
    text: >-
      A two-step equation needs two steps. It uses two inverse operations: first undo the adding or subtracting, then
      undo the multiplying or dividing. For 2x + 3 = 11, subtract 3 to get 2x = 8, then divide by
      2 to get x = 4.
  - id: PSG.LIN1.FRACTION.1
    chapter_id: bhutan_class9
    section_key: s2
    skill_ids: [MATH.ALG.LIN1.FRACTION_COEFF]
    source_type: authored_notes
    licence_status: owned
    source_ref: NOTE.LIN1.FRACTION
    text: >-
      When x is divided by a number, multiply both sides by that number. For x/3 = 5, multiply
      both sides by 3 to get x = 15.
  - id: PSG.LIN1.BRACKETS.1
    chapter_id: bhutan_class9
    section_key: s2
    skill_ids: [MATH.ALG.LIN1.BRACKETS]
    source_type: authored_notes
    licence_status: owned
    source_ref: NOTE.LIN1.BRACKETS
    text: >-
      To open a bracket, multiply every term inside by the number outside. So 3(x + 4) becomes
      3x + 12. Then solve the equation as usual.
  - id: PSG.LIN1.MULTI.1
    chapter_id: bhutan_class9
    section_key: s2
    skill_ids: [MATH.ALG.LIN1.SOLVE_MULTI]
    source_type: authored_notes
    licence_status: owned
    source_ref: NOTE.LIN1.MULTI
    text: >-
      A multi-step equation is solved one step at a time. Open any brackets first, then collect
      like terms, then undo adding or subtracting, and last undo multiplying or dividing.
  - id: PSG.LIN1.BOTH_SIDES.1
    chapter_id: bhutan_class9
    section_key: s3
    skill_ids: [MATH.ALG.LIN1.VARIABLES_BOTH_SIDES]
    source_type: authored_notes
    licence_status: owned
    source_ref: NOTE.LIN1.BOTH_SIDES
    text: >-
      When the variable is on both sides, move the variable terms to one side by adding or
      subtracting the same term on both sides. For 5x = 2x + 9, subtract 2x from both sides to get
      3x = 9, so x = 3.
  - id: PSG.LIN1.IDENTITIES.1
    chapter_id: bhutan_class9
    section_key: s3
    skill_ids: [MATH.ALG.LIN1.IDENTITIES]
    source_type: authored_notes
    licence_status: owned
    source_ref: NOTE.LIN1.IDENTITIES
    text: >-
      Some equations are true for every value of the variable and some are true for none. If both
      sides become the same expression, such as 2x + 2 = 2x + 2, every value works. If you reach a
      false statement such as 3 = 5, there is no solution.
  - id: PSG.LIN1.CHECK.1
    chapter_id: bhutan_class9
    section_key: s3
    skill_ids: [MATH.ALG.LIN1.CHECK_SOLUTION]
    source_type: authored_notes
    licence_status: owned
    source_ref: NOTE.LIN1.CHECK
    text: >-
      To check a solution, put the value back into the original equation. If both sides give the
      same number, the solution is right. For x = 4 in 2x + 3 = 11, the left side is 2(4) + 3,
      which is 11.
  - id: PSG.LIN1.TRANSLATE.1
    chapter_id: bhutan_class9
    section_key: s3
    skill_ids: [MATH.ALG.LIN1.TRANSLATE]
    source_type: authored_notes
    licence_status: owned
    source_ref: NOTE.LIN1.TRANSLATE
    text: >-
      To turn words into an equation, choose a letter for the unknown number, then write each
      phrase as maths. "A number plus 7" is x + 7, and "is" means equals.
  - id: PSG.LIN1.WORDS.1
    chapter_id: bhutan_class9
    section_key: s3
    skill_ids: [MATH.ALG.LIN1.WORD_PROBLEMS]
    source_type: authored_notes
    licence_status: owned
    source_ref: NOTE.LIN1.WORD_PROBLEMS
    text: >-
      To solve a word problem, define the unknown, write an equation from the story, solve it, and
      check the answer against the story. The answer must make sense in the situation.
