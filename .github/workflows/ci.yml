name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: .  # scripts/ run as files, so the app package must be importable from apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Region literal guard
        run: python scripts/check_region_literals.py
      - name: Generate web locale registry
        run: python scripts/generate_web_locales.py
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
      - name: Pytest
        run: pytest
      - name: Validate seed content
        run: python -m app.content.validate ../../content

  api-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
          POSTGRES_DB: yourtutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutor -d yourtutor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tutor:tutor@localhost:5432/yourtutor
      POSTGRES_HOST: localhost
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: yourtutor
      TOKEN_PEPPER: ci-test-pepper
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Alembic migrate
        run: alembic upgrade head
      - name: Pytest against Postgres
        run: pytest
      - name: Load seed into Postgres
        run: python -m app.content.load ../../content --database-url "$TEST_DATABASE_URL"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Typecheck (tsc)
        run: npx tsc --noEmit
      - name: Vitest
        run: npx vitest run

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Content tree exists
        run: test -d content
