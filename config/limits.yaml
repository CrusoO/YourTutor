# API rate limits per client address (requests per window). The first matching prefix wins.
window_seconds: 60
default: 300
groups:
  - {prefix: /auth/, limit: 30}
  - {prefix: /guest/, limit: 20}
  - {prefix: /students/me/ask, limit: 20}
  - {prefix: /sync/, limit: 60}
  - {prefix: /video-jobs, limit: 10}
  - {prefix: /explain, limit: 10}
  - {prefix: /actions, limit: 60}
  - {prefix: /classes/join, limit: 10}
  - {prefix: /children/, limit: 20}
  - {prefix: /approvals/, limit: 20}
exempt: [/health, /ready]
