default: en
# status: active = reviewed UI/content; draft = placeholder strings, falls back to English.
locales:
  - code: en
    name: English
    script: Latn
    status: active
    fallback_chain: []
  - code: ne
    name: Nepali
    script: Deva
    status: draft
    fallback_chain: [en]
  - code: as
    name: Assamese
    script: Beng
    status: draft
    fallback_chain: [en]
