# Weekly guardian report text. A language without an entry uses the default language; nothing is
# machine-translated, so a language appears here only once a reviewer has written it.
default_language: en
messages:
  en:
    subject: "{name}'s week on YourTutor"
    greeting: "Hello,"
    activity: "{name} practised on {days} day(s) this week, about {minutes} minutes in all."
    learned_none: "Nothing new was learned this week, and that is fine."
    learned: "New this week: {skills}."
    practised: "Practised: {skills}."
    open: "You can see where {name} is in each chapter here: {url}"
    footer: "This message comes from what {name} did on YourTutor. It never compares {name} with anyone else."
