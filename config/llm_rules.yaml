# Words and phrases the LLM post-checks refuse (ARCHITECTURE section 14, TUTOR_CONSTITUTION 16, 22).
# Person-praise words live with the encouragement copy checks (app/content/copy.py).
shaming_phrases:
  - you should know
  - too easy for you
  - even a child
  - you are lazy
  - you are weak
  - weak student
  - not trying
  - failed again
  - everyone else
  - your classmates
  - you will fail
  - stupid
  - dumb
# Moderation: the reply is refused if it contains any of these as a whole word.
blocked_terms:
  - damn
  - hell
  - idiot
  - kill
  - die
  - sex
