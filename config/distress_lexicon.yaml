# Layer 1 distress lexicon (deterministic). Read by app/safety_lexicon.py.
#
# Every phrase is run through the same normaliser as the student's text (lowercase, zero-width
# characters removed, digits and symbols used as letters mapped, repeated letters collapsed,
# punctuation dropped, Devanagari nukta and chandrabindu folded), so write phrases naturally.
# A phrase matches on whole-word boundaries. A trailing * lets the last word run on
# (suicid* matches suicide and suicidal).
# {a|b|c} expands to each alternative; an empty alternative is allowed: "i {want|need} {|really }to die".
#
# STATUS: the Hindi (hi) and Hinglish phrase lists are DRAFT. They were written without a native
# reviewer and must be reviewed by a native Hindi speaker (ideally a counsellor) before launch.
# risk: urgent -> the full distress flow; concern -> the gentler support message (exam stress).
