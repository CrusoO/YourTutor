# Extra instruction per item role for draft_content. The role label on a drafted item is set by the
# tool from the request, never taken from the model's reply.
procedure: "Write routine items that practise the method directly."
recall: "Write short items that recall a fact or rule from the passages."
explain: "Write items that show a worked attempt with one error and ask for the correct value of the unknown, so the student must find the error to answer."
apply: "Write items set in a short everyday situation; the student must write and solve an equation from the story."
transfer: "Write items in an unfamiliar form (for example the unknown on the right, or the terms in a different order) that still use the same method."
