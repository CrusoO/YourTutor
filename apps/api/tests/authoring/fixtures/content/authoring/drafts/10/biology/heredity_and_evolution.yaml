items:
- topic: variation_and_inheritance
  type: mcq
  difficulty: easy
  role: recall
  stem: Which of these is a trait that offspring receive from their parents through genes?
  correct: Eye colour
  unit: ''
  wrong:
  - text: A scar from an accident
    mistake: thinks any body change can be inherited
  - text: A language learnt at school
    mistake: thinks learnt skills pass through genes
  - text: A haircut
    mistake: confuses a chosen look with a gene-based trait
  explanation: Eye colour is controlled by genes and is passed on from parents. Scars, learnt languages and haircuts are not carried in the genes.
  hints:
  - Ask whether the feature is carried in the sex cells.
  - Features gained during life are not written into the genes.
  - Choose the feature that is present from birth.
  diagram: null
  confidence: high
- topic: variation_and_inheritance
  type: mcq
  difficulty: easy
  role: recall
  stem: What is the name for the differences seen among individuals of the same species?
  correct: Variation
  unit: ''
  wrong:
  - text: Adaptation
    mistake: mixes up differences with fitting a habitat
  - text: Extinction
    mistake: thinks differences mean a species has vanished
  - text: Pollination
    mistake: confuses a plant process with a genetics idea
  explanation: Differences among individuals of one species are called variation. It arises mainly from the mixing of genes and from small changes in the genes.
  hints:
  - Think about why no two pea plants look exactly alike.
  - The word describes differences, not survival.
  - It starts with the letter v.
  diagram: null
  confidence: high
- topic: variation_and_inheritance
  type: mcq
  difficulty: medium
  role: explain
  stem: A farmer notices one plant in a field of identical crops resists a pest. Why might this plant be useful for breeding?
  correct: Its resistance may be inherited and pass to the seeds.
  unit: ''
  wrong:
  - text: Its resistance will pass on only if the farmer sprays it.
    mistake: thinks a trait needs outside help to be inherited
  - text: Resistance can never pass on because it appeared suddenly.
    mistake: thinks new traits cannot be inherited
  - text: All the other plants will gain it by standing nearby.
    mistake: thinks traits spread by contact
  explanation: A new trait caused by a change in the genes can be passed to the seeds. Breeders pick such plants to grow the next crop.
  hints:
  - Decide whether the resistance is carried by the genes.
  - Think about what a seed receives from its parent plant.
  - A trait in the genes can reach the next crop.
  diagram: A field of plants in rows with one plant coloured differently and an arrow from it to a packet of seeds.
  confidence: high
- topic: variation_and_inheritance
  type: mcq
  difficulty: medium
  role: explain
  stem: Why do identical twins usually differ less in looks than two unrelated people?
  correct: They start with almost the same set of genes.
  unit: ''
  wrong:
  - text: They always eat the same food.
    mistake: credits food instead of genes
  - text: They have different genes but share a home.
    mistake: thinks a shared home changes the genes
  - text: Twins have no genes of their own.
    mistake: believes twins share one body of genes in a wrong way
  explanation: Identical twins come from one fertilised egg that splits, so their genes are nearly the same. Unrelated people receive different gene combinations.
  hints:
  - Think about how many eggs and sperm are needed to start identical twins.
  - Ask what is shared at the very start of life.
  - The cause is inside the cell, not outside the body.
  diagram: null
  confidence: high
- topic: variation_and_inheritance
  type: mcq
  difficulty: hard
  role: transfer
  stem: In a population every plant is a clone of one parent. A disease arrives that harms this parent type. What does this suggest about the population?
  correct: Little variation may leave all plants equally at risk.
  unit: ''
  wrong:
  - text: Variation is high so a few plants will always survive.
    mistake: reads clones as varied plants
  - text: The disease cannot spread among clones.
    mistake: thinks sameness protects from disease
  - text: The plants will change their genes to resist it.
    mistake: thinks organisms change genes on demand
  explanation: Clones carry the same genes, so a disease that harms one can harm all. Variation gives some individuals a chance to survive.
  hints:
  - Compare the genes of one clone with another.
  - Ask who could survive if every plant is harmed the same way.
  - Sameness removes the chance that some survive.
  diagram: 'Two rows of plants: one row all drawn identical and wilting, the other row with different shapes and some healthy.'
  confidence: medium
- topic: variation_and_inheritance
  type: mcq
  difficulty: hard
  role: apply
  stem: A pea plant with a rare flower colour is crossed with a common type, and many offspring show the common colour. Which idea best fits this result?
  correct: The common colour may be dominant over the rare colour.
  unit: ''
  wrong:
  - text: The rare colour was lost from the plant.
    mistake: thinks a hidden trait is destroyed
  - text: Offspring always copy the parent with more flowers.
    mistake: invents a rule about number of flowers
  - text: Colour is not inherited in peas.
    mistake: thinks colour has no genetic basis
  explanation: A dominant trait can hide a recessive trait in the offspring. The rare colour can reappear in later generations.
  hints:
  - Think about what happens to a trait that does not show in the offspring.
  - Recall that some versions of a gene are dominant.
  - A hidden trait is still carried.
  diagram: null
  confidence: low
