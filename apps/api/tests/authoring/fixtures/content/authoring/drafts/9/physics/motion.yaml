- topic: describing_motion
  type: mcq
  difficulty: medium
  role: explain
  stem: A passenger sits still in a moving train. Compared with the platform, the passenger is in which state?
  correct: In motion
  unit: ''
  wrong:
  - text: At rest
    mistake: uses the train seat as the only reference point
  - text: Accelerating always
    mistake: mixes up moving with speeding up
  - text: Without any position
    mistake: thinks position needs a reference that moves with it
  explanation: Motion is judged against a reference point. Relative to the platform the passenger's position changes, so the passenger is in motion.
  hints:
  - Decide which object you are using as the reference.
  - Check whether the position changes with respect to that object.
  - A changing position means the state is the same as the train's.
  diagram: null
  confidence: high
