- topic: speed_and_velocity
  type: numeric
  difficulty: easy
  role: procedure
  stem: A cyclist rides 30 km in 2 hours at a steady pace. What is the average speed in km/h?
  correct: '15'
  unit: km/h
  wrong: []
  explanation: Average speed is total distance divided by total time. Dividing 30 km by 2 h gives the speed.
  hints:
  - Name the two quantities the question gives you.
  - Speed compares how far with how long.
  - Divide the distance by the time.
  diagram: null
  confidence: high
- topic: speed_and_velocity
  type: numeric
  difficulty: easy
  role: procedure
  stem: A train covers 180 km in 3 hours. Find its average speed in km/h.
  correct: '60'
  unit: km/h
  wrong: []
  explanation: Average speed equals distance divided by time. Dividing 180 km by 3 h gives the speed.
  hints:
  - Write down the distance and the time.
  - Use the rule for average speed.
  - Share the distance equally over the hours.
