- topic: speed_and_velocity
  type: numeric
  difficulty: hard
  role: transfer
  stem: A car travels 60 km in the first hour and 90 km in the next 2 hours. What is its average speed in km/h for the whole journey?
  correct: '50'
  unit: km/h
  wrong: []
  explanation: Average speed uses the total distance and the total time. The total distance is 150 km and the total time is 3 h, so the speed follows.
  hints:
  - Do not average the two speeds directly.
  - Add up the distances and add up the times.
  - Divide the total distance by the total time.
  diagram: null
