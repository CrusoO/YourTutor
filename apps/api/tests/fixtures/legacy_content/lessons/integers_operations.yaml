id: LESSON.INTEGERS.OPERATIONS
skill_id: MATH.ARITH.INTEGERS.OPERATIONS
title:
  en: Adding integers on a number line
source_ref: NOTE.ARITH.INTEGERS
status: draft
beats:
- kind: predict
  prompt:
    en: You are on floor 3 of a lift. It goes up 4 floors. Which floor do you reach?
  number_line:
    kind: number_line
    start: 3
    delta: 4
    answer: 7
  choices:
  - value: '7'
    text:
      en: '7'
  - value: '6'
    text:
      en: '6'
  - value: '12'
    text:
      en: '12'
  reveal:
    en: Keep your count in mind. We will watch the lift next.
- kind: explain_scene
  title:
    en: Watch the lift
  scene:
    id: SCENE.INTEGERS.OPERATIONS.EXPLAIN
    skill_id: MATH.ARITH.INTEGERS.OPERATIONS
    source_ref: NOTE.ARITH.INTEGERS
    alt:
      en: A number line with a lift hopping up from 3
    steps:
    - caption:
        en: Start on floor 3. Do not count floor 3 itself.
      actions:
      - kind: write_text
        x: 170
        y: 70
        size: 28
        text: 3 + 4
    - caption:
        en: Adding 4 means 4 hops up.
      actions:
      - kind: pause_and_ask
        question:
          en: 'The lift goes up 4 floors. Which way do you hop?'
        options:
        - text:
            en: Up, 4 hops
          correct: true
        - text:
            en: Down, 4 hops
          correct: false
          feedback:
            en: Adding goes up. Subtracting goes down.
      - kind: write_text
        x: 170
        y: 170
        size: 30
        text: 3 → 7
        color: red
    - caption:
        en: Up one, up one, up one, up one. You reach floor 7, so 3 + 4 = 7.
      actions:
      - kind: write_text
        x: 170
        y: 220
        size: 30
        text: = 7
        color: green
  final_caption:
    en: 'Count the hops, not the dots. Now try one that goes below zero.'
- kind: worked_example
  title:
    en: Worked example
  problem:
    en: A lift is in the basement on floor -4. It goes up 3 floors. Which floor is it on now? We write -4 + 3.
  steps:
  - en: Start at -4. Adding means go up, so make 3 hops up.
  - en: Up one, up one, up one. You stop at -1, so -4 + 3 = -1.
  number_line:
    kind: number_line
    start: -4
    delta: 3
    answer: -1
  more_number_lines:
  - kind: number_line
    start: -3
    delta: 5
    answer: 2
    problem: At night in Shimla it is -3 degrees. By noon it is 5 degrees warmer. Work out -3 + 5.
    note: Warmer means go up. Hop right on the line.
  - kind: number_line
    start: 6
    delta: 5
    answer: 11
    problem: A metro is at stop 6. It goes 5 stops further on. Work out 6 + 5.
  - kind: number_line
    start: -2
    delta: -4
    answer: -6
    problem: Work out -2 + (-4).
    note: Adding a negative number moves you left, like taking away.
  - kind: number_line
    start: 4
    delta: -6
    answer: -2
    problem: Work out 4 + (-6).
    note: Adding a negative number moves you left. Go past 0 if you need to.
  - kind: number_line
    start: 2
    delta: -5
    answer: -3
    problem: At night in Shimla it is 2 degrees. It gets 5 degrees colder. Work out 2 - 5.
    note: Subtracting moves you left, just like colder.
  - kind: number_line
    start: -3
    delta: -2
    answer: -5
    problem: A lift is in the basement on floor -3. It goes down 2 floors. Work out -3 - 2.
- kind: faded_example
  title:
    en: Now you finish one
  problem:
    en: At dawn in Leh it is −6 degrees. By afternoon it is 15 degrees warmer. We write −6 + 15.
  steps:
  - en: Plan first. How many hops up reach 0? Then how many hops are left?
  number_line:
    kind: number_line
    start: -6
    delta: 15
    answer: 9
  blank_prompt:
    en: What is the afternoon temperature?
  answer: '9'
  accept:
  - '9'
  hint:
    en: Go up 6 to reach 0. Then keep going with the hops that are left.
  success:
    en: 'Yes: −6 + 15 = 9.'
- kind: check
  prompt:
    en: In Leh it is −7 degrees. It gets 10 degrees warmer. Work out −7 + 10 yourself.
