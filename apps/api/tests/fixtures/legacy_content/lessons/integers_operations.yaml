id: LESSON.INTEGERS.OPERATIONS
skill_id: MATH.ARITH.INTEGERS.OPERATIONS
title:
  en: Adding integers on a number line
source_ref: NOTE.ARITH.INTEGERS
status: draft
beats:
- kind: predict
  prompt:
    en: You are on floor 3 of a lift. It goes up 4 floors. Which floor do you reach?
  number_line:
    kind: number_line
    start: 3
    delta: 4
    answer: 7
  choices:
  - value: '7'
    text:
      en: '7'
  - value: '6'
    text:
      en: '6'
  - value: '12'
    text:
      en: '12'
  reveal:
    en: Keep your count in mind. We will watch the lift next.
- kind: explain_scene
  title:
    en: Watch the lift
  scene:
    id: SCENE.INTEGERS.OPERATIONS.EXPLAIN
    skill_id: MATH.ARITH.INTEGERS.OPERATIONS
    source_ref: NOTE.ARITH.INTEGERS
    alt:
      en: A number line with a lift hopping up from 3
    steps:
    - caption:
        en: Start on floor 3. Do not count floor 3 itself.
      actions:
      - kind: write_text
        x: 170
        y: 70
        size: 28
        text: 3 + 4
    - caption:
        en: Adding 4 means 4 hops up.
      actions:
      - kind: pause_and_ask
        question:
          en: 'The lift goes up 4 floors. Which way do you hop?'
        options:
        - text:
            en: Up, 4 hops
          correct: true
        - text:
            en: Down, 4 hops
          correct: false
          feedback:
            en: Adding goes up. Subtracting goes down.
      - kind: write_text
        x: 170
        y: 170
        size: 30
        text: 3 → 7
        color: red
    - caption:
        en: Up one, up one, up one, up one. You reach floor 7, so 3 + 4 = 7.
      actions:
      - kind: write_text
        x: 170
        y: 220
        size: 30
        text: = 7
        color: green
  final_caption:
    en: 'Count the hops, not the dots. Now try one that goes below zero.'
- kind: worked_example
  title:
    en: Another one
  problem:
    en: At night in Shimla it is 2 degrees. It gets 5 degrees colder. What is the new temperature? We write 2 − 5.
  steps:
  - en: Start at 2. Colder means go down, so make 5 hops down.
  - en: Two hops reach 0. Three more go below 0, so 2 − 5 = −3.
  number_line:
    kind: number_line
    start: 2
    delta: -5
    answer: -3
  more_number_lines:
  - kind: number_line
    start: -3
    delta: 5
    answer: 2
  - kind: number_line
    start: -2
    delta: -4
    answer: -6
  - kind: number_line
    start: 4
    delta: -6
    answer: -2
- kind: faded_example
  title:
    en: Now you finish one
  problem:
    en: At dawn in Leh it is −6 degrees. By afternoon it is 15 degrees warmer. We write −6 + 15.
  steps:
  - en: Plan first. How many hops up reach 0? Then how many hops are left?
  number_line:
    kind: number_line
    start: -6
    delta: 15
    answer: 9
  blank_prompt:
    en: What is the afternoon temperature?
  answer: '9'
  accept:
  - '9'
  hint:
    en: Go up 6 to reach 0. Then keep going with the hops that are left.
  success:
    en: 'Yes: −6 + 15 = 9.'
- kind: check
  prompt:
    en: In Leh it is −7 degrees. It gets 10 degrees warmer. Work out −7 + 10 yourself.
