[project]
name = "yourtutor-api"
version = "0.1.0"
description = "YourTutor FastAPI service"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Content authoring data: long stem/hint strings are the point of the file.
"scripts/write_g1_role_items.py" = ["E501"]
"scripts/write_s1a_lessons.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: needs a running Postgres instance"]
