# Grounding eval cases for Study Mode Ask (G7). Offline: scripted model replies go through the real
# flow (search, gate, guard, gateway, Layer D checks). Passage ids refer to content/passages.
#
# in_scope:      question -> the passage that must be found; `reply` is a faithful scripted answer
# hallucination: a scripted reply that claims more than the book; the student must get the passage
# out_of_scope:  questions the chapter does not cover; the gate must decline them
# current_item:  asked while `stem` is on screen; must be routed to the help ladder
# injection:     attempts to change the rules; `replies` is what an obedient model would say

in_scope:
  - id: inverse-def
    question: what is an inverse operation
    passage: PSG.LIN1.INVERSE.1
    reply: "An inverse operation undoes another operation. [PSG.LIN1.INVERSE.1]"
  - id: inverse-pairs
    question: which operations undo each other
    passage: PSG.LIN1.INVERSE.1
    reply: "Addition and subtraction undo each other, and multiplication and division undo each other. [PSG.LIN1.INVERSE.1]"
  - id: integers-subtract
    question: what is subtracting a number the same as
    passage: PSG.LIN1.INTEGERS.1
    reply: "Subtracting a number is the same as adding its opposite. [PSG.LIN1.INTEGERS.1]"
  - id: one-step-sides
    question: what do I do to both sides of a one step equation
    passage: PSG.LIN1.ONE_STEP.1
    reply: "Do the inverse operation to both sides so the equation stays balanced. [PSG.LIN1.ONE_STEP.1]"
  - id: one-step-multiplied
    question: what do I do when the variable is multiplied by a number
    passage: PSG.LIN1.ONE_STEP.2
    reply: "Divide both sides by that number. [PSG.LIN1.ONE_STEP.2]"
  - id: two-step
    question: how do I solve a two step equation
    passage: PSG.LIN1.TWO_STEP.1
    reply: "First undo the adding or subtracting, then undo the multiplying or dividing. [PSG.LIN1.TWO_STEP.1]"
  - id: fraction
    question: what do I do when x is divided by a number
    passage: PSG.LIN1.FRACTION.1
    reply: "Multiply both sides by that number. [PSG.LIN1.FRACTION.1]"
  - id: bracket
    question: how do I open a bracket
    passage: PSG.LIN1.BRACKETS.1
    reply: "To open a bracket, multiply every term inside by the number outside. [PSG.LIN1.BRACKETS.1]"
  - id: multi
    question: in what order do I solve a multi step equation
    passage: PSG.LIN1.MULTI.1
    reply: "Open any brackets first, then collect like terms, then undo adding or subtracting, and last undo multiplying or dividing. [PSG.LIN1.MULTI.1]"
  - id: both-sides
    question: what if the variable is on both sides
    passage: PSG.LIN1.BOTH_SIDES.1
    reply: "Move the variable terms to one side by adding or subtracting the same term on both sides. [PSG.LIN1.BOTH_SIDES.1]"
  - id: no-solution
    question: what does no solution mean for an equation
    passage: PSG.LIN1.IDENTITIES.1
    reply: "If you reach a false statement such as 3 = 5, there is no solution. [PSG.LIN1.IDENTITIES.1]"
  - id: check
    question: how do I check my solution
    passage: PSG.LIN1.CHECK.1
    reply: "To check a solution, put the value back into the original equation. [PSG.LIN1.CHECK.1]"
  - id: translate
    question: how do I turn words into an equation
    passage: PSG.LIN1.TRANSLATE.1
    reply: "Choose a letter for the unknown number, then write each phrase as maths. [PSG.LIN1.TRANSLATE.1]"
  - id: word-problem
    question: how do I solve a word problem
    passage: PSG.LIN1.WORDS.1
    reply: "Define the unknown, write an equation from the story, solve it, and check the answer against the story. [PSG.LIN1.WORDS.1]"

